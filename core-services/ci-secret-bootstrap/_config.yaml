vault_dptp_prefix: dptp
user_secrets_target_clusters:
- app.ci
- build01
- build02
- build03
- build04
- build05
- build06
- build07
- build08
- build09
- build10
- build11
- build12
- build13
- core-ci
- hosted-mgmt
- hosted-mgmt2
- vsphere02
cluster_groups: {}
secret_configs:
- from:
    openshift-ci.gpg:
      base64_decode: true
      field: openshift-ci.gpg
      item: openshift-ci-release-signature-signer
  to:
  - cluster: app.ci
    name: release-controller-signature-signer
    namespace: ci
  - cluster: core-ci
    name: release-controller-signature-signer
    namespace: ci
