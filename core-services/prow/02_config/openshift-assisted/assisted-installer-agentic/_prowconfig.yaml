branch-protection:
  orgs:
    openshift-assisted:
      repos:
        assisted-installer-agentic:
          branches:
            main:
              protect: true
tide:
  merge_method:
    openshift-assisted/assisted-installer-agentic: squash
  queries:
  - includedBranches:
    - main
    labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift-assisted/assisted-installer-agentic
