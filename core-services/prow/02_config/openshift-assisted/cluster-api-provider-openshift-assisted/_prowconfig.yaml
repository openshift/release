tide:
  queries:
  - author: red-hat-konflux[bot]
    labels:
    - allow-automatic-merge
    missingLabels:
    - do-not-merge
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift-assisted/cluster-api-provider-openshift-assisted
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift-assisted/cluster-api-provider-openshift-assisted
