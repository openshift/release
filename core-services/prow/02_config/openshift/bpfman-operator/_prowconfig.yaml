branch-protection:
  orgs:
    openshift:
      repos:
        bpfman-operator:
          exclude:
          - ^konflux-
          - ^konflux/
          protect: true
          required_status_checks: {}
tide:
  queries:
  - includedBranches:
    - openshift-4.22
    - release-4.22
    labels:
    - approved
    - backport-risk-assessed
    - jira/valid-bug
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/bpfman-operator
  - includedBranches:
    - openshift-5.0
    - release-5.0
    labels:
    - approved
    - backport-risk-assessed
    - jira/valid-bug
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/bpfman-operator
  - includedBranches:
    - openshift-5.0
    - release-5.0
    labels:
    - approved
    - backport-risk-assessed
    - jira/valid-bug
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/bpfman-operator
  - includedBranches:
    - main
    labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    - keep-main-query-separate
    repos:
    - openshift/bpfman-operator
  - excludedBranches:
    - main
    - openshift-4.18
    - openshift-4.19
    - openshift-4.20
    - openshift-4.21
    - openshift-4.22
    - openshift-4.23
    - openshift-5.0
    - openshift-5.1
    labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/bpfman-operator
