branch-protection:
  orgs:
    openshift:
      repos:
        hypershift-oadp-plugin:
          enforce_admins: true
          exclude:
          - ^revert-
          - ^dependabot/
          - ^konflux-
          - ^konflux/
          protect: true
          required_pull_request_reviews:
            bypass_pull_request_allowances:
              users:
              - openshift-merge-robot
            dismiss_stale_reviews: true
            required_approving_review_count: 0
tide:
  queries:
  - author: oadp-rebasebot-app[bot]
    includedBranches:
    - main
    - oadp-1.3
    - oadp-1.4
    - oadp-1.5
    - oadp-1.6
    - oadp-dev
    labels:
    - oadp-bot
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/hypershift-oadp-plugin
  - includedBranches:
    - main
    - oadp-1.5
    - oadp-1.6
    - oadp-dev
    - release-4.21
    labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/hypershift-oadp-plugin
