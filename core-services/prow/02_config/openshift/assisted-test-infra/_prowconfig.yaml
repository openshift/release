branch-protection:
  orgs:
    openshift:
      repos:
        assisted-test-infra:
          include:
          - ^backplane-[0-9.]+$
          - ^master$
          - ^release-ocm-[0-9.]+$
tide:
  merge_method:
    openshift/assisted-test-infra: squash
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    - needs-rebase
    repos:
    - openshift/assisted-test-infra
