approve:
- repos:
  - openshift/oadp-must-gather
  require_self_approval: false
lgtm:
- repos:
  - openshift/oadp-must-gather
  review_acts_as_lgtm: true
plugins:
  openshift/oadp-must-gather:
    plugins:
    - approve
triggers:
- repos:
  - openshift/oadp-must-gather
  trusted_apps:
  - openshift-merge-bot
  - oadp-rebasebot-app
  - dependabot
  - red-hat-konflux
  - copilot-swe-agent
