branch-protection:
  orgs:
    openshift:
      repos:
        zero-trust-workload-identity-manager:
          require_signed_commits: true
          branches:
            main:
              protect: true
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    - needs-rebase
    repos:
    - openshift/zero-trust-workload-identity-manager
