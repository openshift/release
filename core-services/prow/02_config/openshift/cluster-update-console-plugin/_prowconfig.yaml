tide:
  queries:
  - includedBranches:
    - release-4.23
    - release-5.0
    labels:
    - approved
    - jira/valid-bug
    - jira/valid-reference
    - lgtm
    - verified
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
