tide:
  queries:
  - author: red-hat-konflux-kflux-prd-rh02[bot]
    includedBranches:
    - main
    labels:
    - allow-automatic-merge
    missingLabels:
    - do-not-merge
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/bgp-cloud-connector
  - includedBranches:
    - main
    labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/bgp-cloud-connector
