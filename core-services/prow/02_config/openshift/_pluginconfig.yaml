approve:
- commandHelpLink: https://go.k8s.io/bot-commands
  lgtm_acts_as_approve: true
  repos:
  - openshift
  require_self_approval: false
external_plugins:
  openshift:
  - endpoint: http://refresh
    events:
    - issue_comment
    name: refresh
  - endpoint: http://cherrypick
    events:
    - issue_comment
    - pull_request
    name: cherrypick
  - endpoint: http://needs-rebase
    events:
    - issue_comment
    - pull_request
    name: needs-rebase
  - endpoint: http://backport-verifier
    events:
    - issue_comment
    - pull_request
    name: backport-verifier
  - endpoint: http://payload-testing-prow-plugin
    events:
    - issue_comment
    name: payload-testing-prow-plugin
  - endpoint: http://jira-lifecycle-plugin
    events:
    - issue_comment
    - pull_request
    - pull_request_review
    name: jira-lifecycle-plugin
  - endpoint: http://pipeline-controller
    events:
    - pull_request
    - issue_comment
    name: pipeline-controller
  - endpoint: http://multi-pr-prow-plugin
    events:
    - issue_comment
    name: multi-pr-prow-plugin
  - endpoint: http://ship-hook
    events:
    - pull_request
    - issue_comment
    - pull_request_review
    name: ship-hook
  - endpoint: http://repo-brancher-controller
    events:
    - push
    name: repo-brancher-controller
plugins:
  openshift:
    excluded_repos:
    - osd-example-operator
    - cluster-version-operator
    - cincinnati
    - cincinnati-operator
    - kueue-operator
    - sippy
    plugins:
    - assign
    - blunderbuss
    - cat
    - dog
    - heart
    - golint
    - goose
    - help
    - hold
    - jira
    - label
    - lgtm
    - lifecycle
    - override
    - pony
    - retitle
    - shrug
    - sigmention
    - skip
    - trigger
    - verify-owners
    - owners-label
    - wip
    - yuks
triggers:
- repos:
  - openshift/restic
  - openshift/velero
  - openshift/hypershift-oadp-plugin
  - openshift/velero-plugin-for-csi
  - openshift/oadp-operator
  - openshift/velero-plugin-for-aws
  - openshift/velero-plugin-for-legacy-aws
  - openshift/velero-plugin-for-microsoft-azure
  - openshift/velero-plugin-for-gcp
  - openshift/openshift-velero-plugin
  - openshift/oadp-must-gather
  trusted_apps:
  - openshift-merge-bot
  - oadp-rebasebot-app
  - dependabot
  - red-hat-konflux
  - copilot-swe-agent
- repos:
  - openshift
  trusted_apps:
  - openshift-merge-bot
