approve:
- commandHelpLink: https://go.k8s.io/bot-commands
  lgtm_acts_as_approve: true
  repos:
  - openshift
  require_self_approval: false
external_plugins:
  openshift:
  - endpoint: http://refresh
    events:
    - issue_comment
    name: refresh
  - endpoint: http://cherrypick
    events:
    - issue_comment
    - pull_request
    name: cherrypick
  - endpoint: http://needs-rebase
    events:
    - issue_comment
    - pull_request
    name: needs-rebase
  - endpoint: http://backport-verifier
    events:
    - issue_comment
    - pull_request
    name: backport-verifier
  - endpoint: http://payload-testing-prow-plugin
    events:
    - issue_comment
    name: payload-testing-prow-plugin
  - endpoint: http://jira-lifecycle-plugin
    events:
    - issue_comment
    - pull_request
    - pull_request_review
    name: jira-lifecycle-plugin
  - endpoint: http://pipeline-controller
    events:
    - pull_request
    - issue_comment
    name: pipeline-controller
  - endpoint: http://multi-pr-prow-plugin
    events:
    - issue_comment
    name: multi-pr-prow-plugin
  - endpoint: http://ship-hook
    events:
    - pull_request
    - issue_comment
    - pull_request_review
    name: ship-hook
  - endpoint: http://repo-brancher-controller
    events:
    - push
    name: repo-brancher-controller
plugins:
  openshift:
    excluded_repos:
    - cincinnati
    - cincinnati-operator
    - cloud-api-adaptor
    - cluster-version-operator
    - confidential-compute-artifacts
    - confidential-containers-guest-components
    - crio-credential-provider
    - kata-containers
    - kueue-operator
    - openshift-docs
    - osd-example-operator
    - sandboxed-containers-operator
    - trustee
    - trustee-fbc
    - trustee-operator
    plugins:
    - approve
    - assign
    - blunderbuss
    - cat
    - dog
    - heart
    - golint
    - goose
    - help
    - hold
    - jira
    - label
    - lgtm
    - lifecycle
    - override
    - pony
    - retitle
    - shrug
    - sigmention
    - skip
    - trigger
    - verify-owners
    - owners-label
    - wip
    - yuks
triggers:
- repos:
  - openshift
  trusted_apps:
  - openshift-merge-bot
