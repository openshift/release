branch-protection:
  orgs:
    openshift:
      repos:
        velero-plugin-for-aws:
          allow_force_pushes: true
          include:
          - oadp-dev
          - ^oadp-
          protect: true
          required_status_checks:
            contexts:
            - Run CI
tide:
  queries:
  - author: oadp-rebasebot-app[bot]
    includedBranches:
    - oadp-1.0
    - oadp-1.1
    - oadp-1.2
    - oadp-1.3
    - oadp-1.4
    - oadp-1.5
    - oadp-1.6
    - oadp-dev
    labels:
    - cve-bot
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/velero-plugin-for-aws
  - includedBranches:
    - oadp-1.0
    - oadp-1.1
    - oadp-1.2
    - oadp-1.3
    - oadp-1.4
    - oadp-1.5
    - oadp-1.6
    - oadp-dev
    labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/velero-plugin-for-aws
