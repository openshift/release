approve:
- commandHelpLink: https://go.k8s.io/bot-commands
  ignore_review_state: false
  lgtm_acts_as_approve: true
  repos:
  - openshift/sippy
lgtm:
- repos:
  - openshift/sippy
  review_acts_as_lgtm: true
plugins:
  openshift/sippy:
    plugins:
    - approve
    - assign
    - rifle
    - cat
    - dog
    - heart
    - golint
    - goose
    - help
    - hold
    - jira
    - label
    - lgtm
    - lifecycle
    - override
    - pony
    - retitle
    - shrug
    - sigmention
    - skip
    - trigger
    - verify-owners
    - owners-label
    - wip
    - yuks
triggers:
- repos:
  - openshift/sippy
  trusted_apps:
  - openshift-trt
  - openshift-merge-bot
