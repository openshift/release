branch-protection:
  orgs:
    openshift:
      repos:
        rosa:
          branches:
            master:
              protect: true
              required_status_checks:
                contexts:
                - ci/prow/e2e-presubmits-images
                - ci/prow/images-images
                - ci/prow/images-release-images
tide:
  merge_method:
    openshift/rosa: squash
  queries:
  - author: red-hat-konflux-kflux-prd-rh02[bot]
    includedBranches:
    - master
    labels:
    - allow-automatic-merge
    missingLabels:
    - backports/unvalidated-commits
    - dependencies/manual-review
    - do-not-merge
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/rosa
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/rosa
