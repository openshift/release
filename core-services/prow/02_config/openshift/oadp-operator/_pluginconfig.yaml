approve:
- repos:
  - openshift/oadp-operator
  require_self_approval: false
lgtm:
- repos:
  - openshift/oadp-operator
plugins:
  openshift/oadp-operator:
    plugins:
    - approve
triggers:
- repos:
  - openshift/oadp-operator
  trusted_apps:
  - openshift-merge-bot
  - oadp-rebasebot-app
  - dependabot
  - red-hat-konflux
  - copilot-swe-agent
