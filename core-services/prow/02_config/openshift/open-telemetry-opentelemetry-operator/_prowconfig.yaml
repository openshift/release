branch-protection:
  orgs:
    openshift:
      repos:
        open-telemetry-opentelemetry-operator:
          branches:
            main:
              unmanaged: true
tide:
  queries:
  - author: konflux-kflux-ocp-p01
    labels:
    - dependencies
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift/open-telemetry-opentelemetry-operator
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/open-telemetry-opentelemetry-operator
