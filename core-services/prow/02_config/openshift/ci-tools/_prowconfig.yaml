branch-protection:
  orgs:
    openshift:
      repos:
        ci-tools:
          protect: true
          required_status_checks:
            contexts:
            - ci/tests-dispatched
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/ci-tools
