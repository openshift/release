approve:
- repos:
  - openshift/restic
  require_self_approval: false
lgtm:
- repos:
  - openshift/restic
  review_acts_as_lgtm: true
plugins:
  openshift/restic:
    plugins:
    - approve
triggers:
- repos:
  - openshift/restic
  trusted_apps:
  - openshift-merge-bot
  - oadp-rebasebot-app
  - dependabot
  - red-hat-konflux
  - copilot-swe-agent
