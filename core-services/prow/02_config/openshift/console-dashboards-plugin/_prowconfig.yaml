branch-protection:
  orgs:
    openshift:
      repos:
        console-dashboards-plugin:
          branches:
            release-coo-1.5-ocp-4.12:
              protect: true
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/console-dashboards-plugin
