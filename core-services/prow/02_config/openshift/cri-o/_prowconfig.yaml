branch-protection:
  orgs:
    openshift:
      repos:
        cri-o:
          protect: true
          required_pull_request_reviews:
            required_approving_review_count: 0
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift/cri-o
