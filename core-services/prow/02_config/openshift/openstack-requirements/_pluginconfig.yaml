approve:
- repos:
  - openshift/openstack-requirements
  require_self_approval: false
lgtm:
- repos:
  - openshift/openstack-requirements
  review_acts_as_lgtm: true
plugins:
  openshift/openstack-requirements:
    plugins:
    - approve
triggers:
- repos:
  - openshift/openstack-requirements
  trusted_apps:
  - ironic-merge-bot
  - openshift-merge-bot
