tide:
  queries:
  - author: red-hat-konflux
    labels:
    - konflux-nudge
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift/lvm-operator
  - includedBranches:
    - release-management
    labels:
    - approved
    - docs-approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
