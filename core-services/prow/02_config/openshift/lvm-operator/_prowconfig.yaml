    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift/lvm-operator
  - excludedBranches:
    - release-management
    labels:
    - approved
    - jira/valid-reference
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/lvm-operator
