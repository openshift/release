branch-protection:
  orgs:
    openshift:
      repos:
        assisted-service:
          include:
          - ^backplane-[0-9.]+$
          - ^master$
          - ^release-[0-9.]+$
          - ^release-ocm-[0-9.]+$
          - ^v[0-9.]+$
tide:
  queries:
  - includedBranches:
    - release-4.12
    - release-4.13
    - release-4.14
    - release-4.15
    - release-4.16
    - release-4.17
    - release-4.18
    - release-4.19
    - release-4.20
    - release-4.21
    - release-4.22
    - release-4.23
    - release-5.0
    labels:
    - approved
    - backport-risk-assessed
    - jira/valid-bug
    - lgtm
    - verified
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/assisted-service
  - includedBranches:
    - main
    - master
    labels:
    - approved
    - jira/valid-reference
    - lgtm
    - verified
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/assisted-service
  - excludedBranches:
    - main
    - master
    - release-4.11
    - release-4.12
    - release-4.13
    - release-4.14
    - release-4.15
    - release-4.16
    - release-4.17
    - release-4.18
    - release-4.19
    - release-4.20
    - release-4.21
    - release-4.22
    - release-4.23
    - release-4.6
    - release-4.7
    - release-4.8
    - release-5.0
    - release-5.1
    - release-5.2
    labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift/assisted-service
