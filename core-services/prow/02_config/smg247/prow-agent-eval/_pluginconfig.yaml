approve:
- repos:
  - smg247/prow-agent-eval
  require_self_approval: false
external_plugins:
  smg247/prow-agent-eval:
  - endpoint: http://needs-rebase
    events:
    - issue_comment
    - pull_request
    name: needs-rebase
lgtm:
- repos:
  - smg247/prow-agent-eval
  review_acts_as_lgtm: true
plugins:
  smg247/prow-agent-eval:
    plugins:
    - approve
    - assign
    - blunderbuss
    - help
    - hold
    - label
    - lgtm
    - lifecycle
    - override
    - retitle
    - shrug
    - skip
    - trigger
    - verify-owners
    - owners-label
    - wip
triggers:
- repos:
  - smg247/prow-agent-eval
  trusted_apps:
  - openshift-merge-bot
