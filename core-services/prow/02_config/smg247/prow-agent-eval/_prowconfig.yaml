branch-protection:
  orgs:
    smg247:
      repos:
        prow-agent-eval:
          unmanaged: true
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - needs-rebase
    repos:
    - smg247/prow-agent-eval
