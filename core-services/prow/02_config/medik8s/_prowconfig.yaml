branch-protection:
  orgs:
    medik8s:
      enforce_admins: true
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        required_approving_review_count: 2
      repos:
        fence-agents-remediation:
          required_status_checks:
            contexts:
            - Kind E2E
            - Test and build PRs
            - tide
        machine-deletion-remediation:
          required_status_checks:
            contexts:
            - Kind E2E
            - Test and build PRs
            - tide
        node-healthcheck-operator:
          required_status_checks:
            contexts:
            - Kind E2E
            - Test and build PRs
            - tide
        node-maintenance-operator:
          required_status_checks:
            contexts:
            - Kind E2E
            - Test and build PRs
            - tide
        node-remediation-console:
          required_status_checks:
            contexts:
            - Kind E2E
            - Test and build PRs
            - tide
        self-node-remediation:
          required_status_checks:
            contexts:
            - Kind E2E
            - Test and build PRs
            - tide
        storage-based-remediation:
          required_status_checks:
            contexts:
            - Kind E2E
            - Test and build PRs
            - tide
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    orgs:
    - medik8s
