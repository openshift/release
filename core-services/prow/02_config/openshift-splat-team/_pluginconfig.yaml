approve:
- commandHelpLink: https://go.k8s.io/bot-commands
  lgtm_acts_as_approve: true
  repos:
  - openshift-splat-team
  require_self_approval: false
external_plugins:
  openshift-splat-team:
  - endpoint: http://refresh
    events:
    - issue_comment
    name: refresh
  - endpoint: http://cherrypick
    events:
    - issue_comment
    - pull_request
    name: cherrypick
  - endpoint: http://needs-rebase
    events:
    - issue_comment
    - pull_request
    name: needs-rebase
  - endpoint: http://jira-lifecycle-plugin
    events:
    - issue_comment
    - pull_request
    - pull_request_review
    name: jira-lifecycle-plugin
  - endpoint: http://repo-brancher-controller
    events:
    - push
    name: repo-brancher-controller
plugins:
  openshift-splat-team:
    plugins:
    - assign
    - blunderbuss
    - cat
    - dog
    - heart
    - goose
    - help
    - hold
    - jira
    - label
    - lgtm
    - lifecycle
    - override
    - retitle
    - shrug
    - skip
    - trigger
    - verify-owners
    - owners-label
    - wip
    - yuks
triggers:
- repos:
  - openshift-splat-team
  trusted_apps:
  - openshift-merge-bot
