    lenses:
    - lens:
        name: metadata
      optional_files:
      - podinfo.json|prowjob.json
      required_files:
      - started.json|finished.json
    - lens:
        config:
          highlight_regexes:
          - Failed to acquire resource
          - Using namespace
          - resources not found
          - timed out
          - 'ERROR:'
          - ERRO\[
          - '^error:'
          - '(^FAIL|FAIL: |Failure \[)\b'
          - 'panic(\.go)?:'
          - ^E\d{4} \d\d:\d\d:\d\d\.\d\d\d]
          - Resolved release
          - '"level":"error"'
          - level=error
          - '"level":"fatal"'
          - level=fatal
          - The namespace in which this test is executing has been deleted, cancelling
            the test
          - pod didn't start running within
          - 'failed to update leases: exceeded number of retries for lease'
          - '[Ss]tep .* failed'
          - ^make.*:.*\*\*\*
          - '[Ee]xit.*\s(code|status)\b.*\s[1-9][0-9]*\b'
          - '│ Error:'
          - Object got updated more than one time without a no-op update
          - ^not ok [1-9]
        name: buildlog
      required_files:
      - ^build-log.txt
    - lens:
        config:
          groups:
          - collapsed: true
            name: Informing tests
            selector: properties/property[@name='lifecycle' and @value='informing']
        name: junit
      optional_files:
      - .*/monitor.*\.xml
      required_files:
      - .*junit.*\.xml
    - lens:
        name: podinfo
      required_files:
      - podinfo.json
    - lens:
        name: coverage
      required_files:
      - .*/.*coverage.*\.(html|xml|out)
    - lens:
        name: html
      optional_files:
      - .*/opct-report\.html|.*/diag-results\.html
      required_files:
      - .*/custom-link-.*\.html|.*/test-risk-analysis.*\.html|.*/e2e-intervals_spyglass.*\.html|.*-summary.*\.html|.*/e2e-timelines_spyglass_.*\.html|.*/camgi\.html
    size_limit: 500000000
