pod_namespace: ci
presets:
- env: null
  labels:
    presets.ci.openshift.io/registry-pull: "true"
  volumeMounts:
  - mountPath: /etc/pull-secret
    name: pull-secret
    readOnly: true
  volumes:
  - name: pull-secret
    secret:
      secretName: registry-pull-credentials
prowjob_default_entries:
- cluster: '*'
  config:
    tenant_id: qe-private
  repo: openshift/openshift-tests-private
