push_gateway:
  interval: 1m0s
  serve_metrics: false
scheduler:
  enabled: true
  external:
    cache:
      cleanup_interval: 1h0m0s
      entry_timeout_interval: 3m0s
    url: http://prowjob-dispatcher.ci.svc.cluster.local:8080
sinker:
  max_pod_age: 6h0m0s
  max_prowjob_age: 24h0m0s
  resync_period: 5m0s
  terminated_pod_ttl: 6h0m0s
slack_reporter_configs:
  '*':
    channel: '#ops-testplatform'
    report_template: Job {{.Spec.Job}} of type {{.Spec.Type}} ended with state {{.Status.State}}.
      <{{.Status.URL}}|View logs>
status_error_link: https://github.com/kubernetes/test-infra/issues
tide:
  batch_size_limit:
    Azure/ARO-HCP: 5
    cri-o/cri-o: -1
    openshift-online/rosa-clusters-service: 5
  blocker_label: tide/merge-blocker
  context_options:
    from-branch-protection: true
    optional-regex-contexts:
    - multi-pr-.*
    orgs:
      Azure:
        repos:
          ARO-HCP:
            branches:
              main:
                from-branch-protection: true
                required-contexts:
                - ci/pipeline-gate
                required-if-present-contexts:
                - change-detection
                - lint
                - mega-linter
                - test
                - validate_bicep
                - test-grafana-script
