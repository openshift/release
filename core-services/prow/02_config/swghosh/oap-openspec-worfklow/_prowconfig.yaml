branch-protection:
  orgs:
    swghosh:
      repos:
        oap-openspec-worfklow:
          branches:
            onboard-ci:
              unmanaged: true
          protect: true
tide:
  merge_method:
    swghosh/oap-openspec-worfklow: squash
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - swghosh/oap-openspec-worfklow
