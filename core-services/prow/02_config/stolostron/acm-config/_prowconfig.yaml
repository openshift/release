slack_reporter_configs:
  stolostron/acm-config:
    channel: '#team-acm-fastforward-alerts'
    job_states_to_report:
    - failure
    - error
    job_types_to_report:
    - periodic
    report_template: ':red_jenkins_circle: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>'
