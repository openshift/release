tide:
  queries:
  - author: konflux-internal-p02[bot]
    labels:
    - allow-automatic-merge
    missingLabels:
    - 'dco-signoff: no'
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - needs-rebase
    repos:
    - stolostron/source-code-intelligence-collector-gitlab
