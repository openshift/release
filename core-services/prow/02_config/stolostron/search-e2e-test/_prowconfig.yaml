branch-protection:
  orgs:
    stolostron:
      repos:
        search-e2e-test:
          branches:
            main:
              protect: true
            release-2.5:
              protect: true
            release-2.6:
              protect: true
            release-2.7:
              protect: true
            release-2.8:
              protect: true
            release-2.9:
              protect: false
          required_pull_request_reviews:
            dismiss_stale_reviews: false
            required_approving_review_count: 1
tide:
  merge_method:
    stolostron/search-e2e-test: squash
  queries:
  - includedBranches:
    - backplane-2.10
    - backplane-2.11
    - backplane-2.6
    - backplane-2.8
    - backplane-2.9
    - release-2.11
    - release-2.13
    - release-2.14
    - release-2.15
    - release-2.16
    labels:
    - approved
    - lgtm
    missingLabels:
    - 'dco-signoff: no'
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - needs-rebase
    repos:
    - stolostron/search-e2e-test
