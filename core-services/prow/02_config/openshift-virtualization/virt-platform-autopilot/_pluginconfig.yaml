approve:
- commandHelpLink: https://go.k8s.io/bot-commands
  ignore_review_state: true
  repos:
  - openshift-virtualization/virt-platform-autopilot
  require_self_approval: true
external_plugins:
  openshift-virtualization/virt-platform-autopilot:
  - endpoint: http://cherrypick
    events:
    - issue_comment
    - pull_request
    name: cherrypick
  - endpoint: http://needs-rebase
    events:
    - issue_comment
    - pull_request
    name: needs-rebase
label:
  restricted_labels:
    openshift-virtualization/virt-platform-autopilot:
    - allowed_users:
      - albarker-rh
      - hmeir
      - OhadRevah
      - rlobillo
      label: iuo-qe-approved
lgtm:
- repos:
  - openshift-virtualization/virt-platform-autopilot
  review_acts_as_lgtm: true
plugins:
  openshift-virtualization/virt-platform-autopilot:
    plugins:
    - approve
    - assign
    - golint
    - help
    - hold
    - label
    - lgtm
    - lifecycle
    - override
    - owners-label
    - retitle
    - trigger
    - verify-owners
    - wip
triggers:
- repos:
  - openshift-virtualization/virt-platform-autopilot
  trusted_apps:
  - openshift-merge-bot
  - github-actions
  - autopilot-auto-updater
