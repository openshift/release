branch-protection:
  orgs:
    Azure:
      repos:
        ARO-Tools:
          unmanaged: true
tide:
  queries:
  - author: aro-hcp-robot[bot]
    includedBranches:
    - main
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - Azure/ARO-Tools
  - includedBranches:
    - main
    labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - Azure/ARO-Tools
