external_plugins:
  openstack-k8s-operators/osp-director-operator:
  - endpoint: http://refresh
    events:
    - issue_comment
    name: refresh
  - endpoint: http://cherrypick
    events:
    - issue_comment
    - pull_request
    name: cherrypick
  - endpoint: http://jira-lifecycle-plugin
    events:
    - issue_comment
    - pull_request
    - pull_request_review
    name: jira-lifecycle-plugin
plugins:
  openstack-k8s-operators/osp-director-operator:
    plugins:
    - blunderbuss
    - cat
    - dog
    - heart
    - golint
    - goose
    - help
    - jira
    - label
    - override
    - pony
    - retitle
    - shrug
    - sigmention
    - skip
    - trigger
    - owners-label
    - yuks
triggers:
- repos:
  - openstack-k8s-operators/osp-director-operator
  trusted_apps:
  - openshift-merge-bot
