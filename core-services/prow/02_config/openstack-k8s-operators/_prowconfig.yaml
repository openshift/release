tide:
  merge_method:
    openstack-k8s-operators/ci-framework: rebase
    openstack-k8s-operators/edpm-ansible: squash
    openstack-k8s-operators/nova-operator: rebase
    openstack-k8s-operators/watcher-operator: rebase
  queries:
  # Query 1/3: repos barbican through keystone (alphabetical)
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    - needs-rebase
    repos:
    - openstack-k8s-operators/barbican-operator
    - openstack-k8s-operators/ci-framework
    - openstack-k8s-operators/cinder-operator
    - openstack-k8s-operators/data-plane-adoption
    - openstack-k8s-operators/designate-operator
    - openstack-k8s-operators/edpm-ansible
    - openstack-k8s-operators/edpm-image-builder
    - openstack-k8s-operators/glance-operator
    - openstack-k8s-operators/heat-operator
    - openstack-k8s-operators/horizon-operator
    - openstack-k8s-operators/infra-operator
    - openstack-k8s-operators/install_yamls
    - openstack-k8s-operators/ironic-operator
    - openstack-k8s-operators/keystone-operator
  # Query 2/3: repos lightspeed through openstack-operator
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    - needs-rebase
    repos:
    - openstack-k8s-operators/lightspeed-mcps
    - openstack-k8s-operators/lightspeed-operator
    - openstack-k8s-operators/lightspeed-rag-content
    - openstack-k8s-operators/manila-operator
    - openstack-k8s-operators/mariadb-operator
    - openstack-k8s-operators/neutron-operator
    - openstack-k8s-operators/nova-operator
    - openstack-k8s-operators/octavia-operator
    - openstack-k8s-operators/openstack-baremetal-operator
    - openstack-k8s-operators/openstack-k8s-operators-ci
    - openstack-k8s-operators/openstack-must-gather
    - openstack-k8s-operators/openstack-operator
  # Query 3/3: repos osp-director through watcher
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    - needs-rebase
    repos:
    - openstack-k8s-operators/osp-director-operator
    - openstack-k8s-operators/ovn-operator
    - openstack-k8s-operators/repo-setup
    - openstack-k8s-operators/s2i-openstack-containers
    - openstack-k8s-operators/sg-core
    - openstack-k8s-operators/swift-operator
    - openstack-k8s-operators/tcib
    - openstack-k8s-operators/telemetry-operator
    - openstack-k8s-operators/test-operator
    - openstack-k8s-operators/watcher-operator
