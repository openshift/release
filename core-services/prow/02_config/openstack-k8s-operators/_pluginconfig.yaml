approve:
- repos:
  - openstack-k8s-operators
  require_self_approval: false
external_plugins:
  openstack-k8s-operators:
  - endpoint: http://repo-brancher-controller
    events:
    - push
    name: repo-brancher-controller
  - endpoint: http://needs-rebase
    events:
    - issue_comment
    - pull_request
    name: needs-rebase
lgtm:
- repos:
  - openstack-k8s-operators
  review_acts_as_lgtm: true
plugins:
  openstack-k8s-operators:
    plugins:
    - approve
    - assign
    - hold
    - lgtm
    - lifecycle
    - verify-owners
    - wip
