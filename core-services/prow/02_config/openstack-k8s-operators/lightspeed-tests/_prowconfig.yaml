branch-protection:
  orgs:
    openstack-k8s-operators:
      repos:
        lightspeed-tests:
          branches:
            main:
              protect: true
              required_status_checks:
                contexts:
                - pre-commit
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openstack-k8s-operators/lightspeed-tests
