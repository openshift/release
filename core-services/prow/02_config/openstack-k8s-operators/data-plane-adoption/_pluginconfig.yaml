approve:
- ignore_review_state: true
  pr_process_link: ' '
  repos:
  - openstack-k8s-operators/data-plane-adoption
  require_self_approval: true
external_plugins:
  openstack-k8s-operators/data-plane-adoption:
  - endpoint: http://refresh
    events:
    - issue_comment
    name: refresh
  - endpoint: http://cherrypick
    events:
    - issue_comment
    - pull_request
    name: cherrypick
  - endpoint: http://needs-rebase
    events:
    - issue_comment
    - pull_request
    name: needs-rebase
  - endpoint: http://backport-verifier
    events:
    - issue_comment
    - pull_request
    name: backport-verifier
  - endpoint: http://payload-testing-prow-plugin
    events:
    - issue_comment
    name: payload-testing-prow-plugin
  - endpoint: http://jira-lifecycle-plugin
    events:
    - issue_comment
    - pull_request
    - pull_request_review
    name: jira-lifecycle-plugin
plugins:
  openstack-k8s-operators/data-plane-adoption:
    plugins:
    - golint
    - help
    - jira
    - label
    - override
    - retitle
    - sigmention
    - skip
    - trigger
    - owners-label
    - yuks
triggers:
- repos:
  - openstack-k8s-operators/data-plane-adoption
  trusted_apps:
  - openshift-merge-bot
