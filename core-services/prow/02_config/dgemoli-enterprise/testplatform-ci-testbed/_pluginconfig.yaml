approve:
- repos:
  - dgemoli-enterprise/testplatform-ci-testbed
  require_self_approval: false
lgtm:
- repos:
  - dgemoli-enterprise/testplatform-ci-testbed
  review_acts_as_lgtm: true
plugins:
  dgemoli-enterprise/testplatform-ci-testbed:
    plugins:
    - approve
    - assign
    - blunderbuss
    - help
    - hold
    - label
    - lgtm
    - override
    - retitle
    - skip
    - trigger
    - verify-owners
    - wip
triggers:
- repos:
  - dgemoli-enterprise/testplatform-ci-testbed
  trusted_apps:
  - openshift-merge-bot
