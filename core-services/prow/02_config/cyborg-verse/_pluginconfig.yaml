approve:
- commandHelpLink: https://go.k8s.io/bot-commands
  lgtm_acts_as_approve: true
  repos:
  - cyborg-verse
  require_self_approval: false
plugins:
  cyborg-verse:
    plugins:
    - approve
    - assign
    - hold
    - lgtm
    - override
    - skip
    - trigger
    - verify-owners
    - wip
