approve:
- commandHelpLink: https://go.k8s.io/bot-commands
  lgtm_acts_as_approve: true
  repos:
  - cyborg-verse
  require_self_approval: false
external_plugins:
  cyborg-verse:
  - endpoint: http://refresh
    events:
    - issue_comment
    name: refresh
  - endpoint: http://cherrypick
    events:
    - issue_comment
    - pull_request
    name: cherrypick
  - endpoint: http://needs-rebase
    events:
    - pull_request
    name: needs-rebase
plugins:
  cyborg-verse:
    plugins:
    - approve
    - assign
    - hold
    - lgtm
    - override
    - skip
    - trigger
    - verify-owners
    - wip
triggers:
- repos:
  - cyborg-verse
  trusted_apps:
  - openshift-merge-bot
