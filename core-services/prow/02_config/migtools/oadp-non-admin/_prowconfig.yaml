branch-protection:
  orgs:
    migtools:
      repos:
        oadp-non-admin:
          enforce_admins: true
          exclude:
          - ^revert-
          - ^dependabot/
          - ^konflux-
          - ^konflux/
          - ^copilot/
          protect: true
          required_pull_request_reviews:
            dismiss_stale_reviews: true
            required_approving_review_count: 2
tide:
  queries:
  - author: oadp-rebasebot-app[bot]
    includedBranches:
    - oadp-1.3
    - oadp-1.4
    - oadp-1.5
    - oadp-1.6
    - oadp-dev
    labels:
    - cve-bot
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - migtools/oadp-non-admin
  - includedBranches:
    - master
    - oadp-1.4
    - oadp-1.5
    - oadp-1.6
    - oadp-dev
    labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - migtools/oadp-non-admin
