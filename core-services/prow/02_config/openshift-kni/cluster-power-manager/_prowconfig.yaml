branch-protection:
  orgs:
    openshift-kni:
      repos:
        cluster-power-manager:
          branches:
            main:
              enforce_admins: true
              protect: true
              required_pull_request_reviews:
                required_approving_review_count: 1
tide:
  queries:
  - author: red-hat-konflux[bot]
    labels:
    - allow-automatic-merge
    missingLabels:
    - do-not-merge
    - do-not-merge/hold
    - do-not-merge/work-in-progress
    repos:
    - openshift-kni/cluster-power-manager
