branch-protection:
  orgs:
    terraform-redhat:
      repos:
        terraform-provider-rhcs:
          branches:
            main:
              protect: true
          protect: false
tide:
  merge_method:
    terraform-redhat/terraform-provider-rhcs: rebase
  queries:
  - author: red-hat-konflux[bot]
    includedBranches:
    - main
    labels:
    - allow-automatic-merge
    missingLabels:
    - backports/unvalidated-commits
    - dependencies/manual-review
    - do-not-merge
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - terraform-redhat/terraform-provider-rhcs
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - terraform-redhat/terraform-provider-rhcs
