approve:
- repos:
  - openshift-priv/image-customization-controller
  require_self_approval: false
external_plugins:
  openshift-priv/image-customization-controller:
  - endpoint: http://pipeline-controller
    events:
    - pull_request
    - issue_comment
    name: pipeline-controller
lgtm:
- repos:
  - openshift-priv/image-customization-controller
  review_acts_as_lgtm: true
plugins:
  openshift-priv/image-customization-controller:
    plugins:
    - approve
    - assign
    - blunderbuss
    - cat
    - dog
    - golint
    - goose
    - heart
    - help
    - hold
    - jira
    - label
    - lgtm
    - lifecycle
    - override
    - owners-label
    - pony
    - retitle
    - shrug
    - sigmention
    - skip
    - trigger
    - verify-owners
    - wip
    - yuks
triggers:
- repos:
  - openshift-priv/image-customization-controller
  trusted_apps:
  - openshift-merge-bot
