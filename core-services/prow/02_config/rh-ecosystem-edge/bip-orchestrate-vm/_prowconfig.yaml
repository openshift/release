branch-protection:
  orgs:
    rh-ecosystem-edge:
      repos:
        bip-orchestrate-vm:
          unmanaged: true
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - rh-ecosystem-edge/bip-orchestrate-vm
