slack_reporter_configs:
  rh-ecosystem-edge/nvidia-ci:
    channel: '#wg-nvidia-gpu-nno-operator-ci'
    job_states_to_report:
    - failure
    - error
    - aborted
    job_types_to_report:
    - periodic
    - presubmit
    report_template: |-
      {{- $emoji := ":warning:" }}{{- if eq .Status.State "success" }}{{- $emoji = ":white_check_mark:" }}{{- end }}
      {{- $prInfo := "" }}{{- with .Spec.Refs }}{{- if .Pulls }}{{- $pull := index .Pulls 0 }}{{- $prInfo = printf " (<%s|PR #%d> by %s)" $pull.Link $pull.Number $pull.Author }}{{- end }}{{- end -}}
      {{$emoji}} Job *{{.Spec.Job}}*{{$prInfo}} ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{$emoji}}
      {{- if eq .Status.State "aborted" }}
        The job was aborted, check for orphaned cloud resources.
      {{- end }}
tide:
  merge_method:
    rh-ecosystem-edge/nvidia-ci: rebase
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - rh-ecosystem-edge/nvidia-ci
