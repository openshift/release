branch-protection:
  orgs:
    osac-project:
      repos:
        osac-ai-skills:
          branches:
            main:
              protect: true
              required_status_checks:
                contexts:
                - check-mandatory-reviewers
                - skillsaw
tide:
  queries:
  - includedBranches:
    - main
    labels:
    - approved
    - jira/valid-reference
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - osac-project/osac-ai-skills
