external_plugins:
  osac-project/osac-ai-skills:
  - endpoint: http://jira-lifecycle-plugin
    events:
    - issue_comment
    - pull_request
    - pull_request_review
    name: jira-lifecycle-plugin
lgtm:
- repos:
  - osac-project/osac-ai-skills
  review_acts_as_lgtm: true
plugins:
  osac-project/osac-ai-skills:
    plugins:
    - help
    - hold
    - lgtm
    - verify-owners
    - wip
    - approve
