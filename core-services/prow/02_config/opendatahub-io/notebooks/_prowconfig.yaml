branch-protection:
  orgs:
    opendatahub-io:
      repos:
        notebooks:
          branches:
            main:
              protect: false
tide:
  merge_method:
    opendatahub-io/notebooks: merge
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - opendatahub-io/notebooks
