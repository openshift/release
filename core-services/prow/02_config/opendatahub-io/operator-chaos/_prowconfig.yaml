branch-protection:
  orgs:
    opendatahub-io:
      repos:
        operator-chaos:
          unmanaged: true
tide:
  merge_method:
    opendatahub-io/operator-chaos: squash
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - opendatahub-io/operator-chaos
