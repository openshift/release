approve:
- repos:
  - opendatahub-io/trainer
  require_self_approval: false
external_plugins:
  opendatahub-io/trainer:
  - endpoint: http://refresh
    events:
    - issue_comment
    name: refresh
  - endpoint: http://cherrypick
    events:
    - issue_comment
    - pull_request
    name: cherrypick
  - endpoint: http://needs-rebase
    events:
    - issue_comment
    - pull_request
    name: needs-rebase
lgtm:
- repos:
  - opendatahub-io/trainer
  review_acts_as_lgtm: true
plugins:
  opendatahub-io/trainer:
    plugins:
    - approve
    - assign
    - blunderbuss
    - help
    - hold
    - jira
    - label
    - lgtm
    - lifecycle
    - override
    - owners-label
    - retitle
    - skip
    - trigger
    - issue-management
    - verify-owners
    - wip
triggers:
- repos:
  - opendatahub-io/trainer
  trusted_apps:
  - openshift-merge-bot
  - dependabot
  - red-hat-konflux
  - red-hat-konflux-kflux-prd-rh02
