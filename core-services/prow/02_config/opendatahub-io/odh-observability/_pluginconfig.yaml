approve:
- repos:
  - opendatahub-io/odh-observability
  require_self_approval: false
external_plugins:
  opendatahub-io/odh-observability:
  - endpoint: http://needs-rebase
    events:
    - issue_comment
    - pull_request
    name: needs-rebase
lgtm:
- repos:
  - opendatahub-io/odh-observability
  review_acts_as_lgtm: true
plugins:
  opendatahub-io/odh-observability:
    plugins:
    - approve
    - blunderbuss
    - hold
    - lgtm
    - verify-owners
    - wip
