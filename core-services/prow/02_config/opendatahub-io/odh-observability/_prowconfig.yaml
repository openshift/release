branch-protection:
  orgs:
    opendatahub-io:
      repos:
        odh-observability:
          branches:
            main:
              protect: true
              required_status_checks:
                contexts:
                - Red Hat Konflux / odh-observability-monitoring-e2e-ocp-4-22 / odh-observability-ci
tide:
  merge_method:
    opendatahub-io/odh-observability: squash
  queries:
  - includedBranches:
    - main
    labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - needs-rebase
    repos:
    - opendatahub-io/odh-observability
