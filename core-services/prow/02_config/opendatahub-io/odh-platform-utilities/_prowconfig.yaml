tide:
  merge_method:
    opendatahub-io/odh-platform-utilities: squash
  queries:
  - includedBranches:
    - main
    labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - opendatahub-io/odh-platform-utilities
