branch-protection:
  orgs:
    opendatahub-io:
      repos:
        trainer-operator:
          unmanaged: true
tide:
  merge_method:
    opendatahub-io/trainer-operator: squash
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - opendatahub-io/trainer-operator
