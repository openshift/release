approve:
- repos:
  - openshift-eng/openshift-logging-e2e-tests
  require_self_approval: true
external_plugins:
  openshift-eng/openshift-logging-e2e-tests:
  - endpoint: http://refresh
    events:
    - issue_comment
    name: refresh
  - endpoint: http://cherrypick
    events:
    - issue_comment
    - pull_request
    name: cherrypick
  - endpoint: http://needs-rebase
    events:
    - issue_comment
    - pull_request
    name: needs-rebase
  - endpoint: http://jira-lifecycle-plugin
    events:
    - issue_comment
    - pull_request
    - pull_request_review
    name: jira-lifecycle-plugin
lgtm:
- repos:
  - openshift-eng/openshift-logging-e2e-tests
  review_acts_as_lgtm: true
plugins:
  openshift-eng/openshift-logging-e2e-tests:
    plugins:
    - assign
    - hold
    - jira
    - label
    - lgtm
    - lifecycle
    - override
    - retitle
    - wip
    - approve
    - trigger
    - verify-owners
triggers:
- repos:
  - openshift-eng/openshift-logging-e2e-tests
  trusted_apps:
  - openshift-merge-bot
