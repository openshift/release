approve:
- repos:
  - openshift-eng/initiative-engine-core
  require_self_approval: false
external_plugins:
  openshift-eng/initiative-engine-core:
  - endpoint: http://jira-lifecycle-plugin
    events:
    - issue_comment
    - pull_request
    - pull_request_review
    name: jira-lifecycle-plugin
lgtm:
- repos:
  - openshift-eng/initiative-engine-core
  review_acts_as_lgtm: true
plugins:
  openshift-eng/initiative-engine-core:
    plugins:
    - approve
    - hold
    - jira
    - lgtm
    - trigger
    - verify-owners
    - wip
triggers:
- repos:
  - openshift-eng/initiative-engine-core
  trusted_apps:
  - dependabot
  - openshift-merge-bot
