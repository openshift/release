approve:
- repos:
  - openshift-eng/initiative-engine-core
  require_self_approval: false
lgtm:
- repos:
  - openshift-eng/initiative-engine-core
  review_acts_as_lgtm: true
plugins:
  openshift-eng/initiative-engine-core:
    plugins:
    - approve
    - hold
    - lgtm
    - trigger
    - verify-owners
    - wip
triggers:
- repos:
  - openshift-eng/initiative-engine-core
  trusted_apps:
  - dependabot
  - openshift-merge-bot
