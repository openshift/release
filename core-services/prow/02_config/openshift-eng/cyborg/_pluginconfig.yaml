approve:
- commandHelpLink: https://go.k8s.io/bot-commands
  ignore_review_state: false
  lgtm_acts_as_approve: true
  repos:
  - openshift-eng/cyborg
external_plugins:
  openshift-eng/cyborg:
  - endpoint: http://refresh
    events:
    - issue_comment
    name: refresh
  - endpoint: http://cherrypick
    events:
    - issue_comment
    - pull_request
    name: cherrypick
  - endpoint: http://needs-rebase
    events:
    - issue_comment
    - pull_request
    name: needs-rebase
  - endpoint: http://backport-verifier
    events:
    - issue_comment
    - pull_request
    name: backport-verifier
  - endpoint: http://payload-testing-prow-plugin
    events:
    - issue_comment
    name: payload-testing-prow-plugin
  - endpoint: http://jira-lifecycle-plugin
    events:
    - issue_comment
    - pull_request
    - pull_request_review
    name: jira-lifecycle-plugin
lgtm:
- repos:
  - openshift-eng/cyborg
  review_acts_as_lgtm: true
plugins:
  openshift-eng/cyborg:
    plugins:
    - approve
    - assign
    - blunderbuss
    - hold
    - jira
    - label
    - lgtm
    - override
    - retitle
    - shrug
    - trigger
    - verify-owners
    - wip
triggers:
- repos:
  - openshift-eng/cyborg
  trusted_apps:
  - openshift-merge-bot
