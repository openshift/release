branch-protection:
  orgs:
    openshift-eng:
      repos:
        kubernetes-integration-testing:
          unmanaged: true
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift-eng/kubernetes-integration-testing
