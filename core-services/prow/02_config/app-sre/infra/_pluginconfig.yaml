external_plugins:
  app-sre/infra:
  - endpoint: http://jira-lifecycle-plugin
    events:
    - issue_comment
    - pull_request
    - pull_request_review
    name: jira-lifecycle-plugin
plugins:
  app-sre/infra:
    plugins:
    - jira
    - trigger
triggers:
- repos:
  - app-sre/infra
  trusted_apps:
  - openshift-merge-bot
