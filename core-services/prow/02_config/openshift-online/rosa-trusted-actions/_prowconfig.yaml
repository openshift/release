tide:
  merge_method:
    openshift-online/rosa-trusted-actions: squash
  queries:
  - author: rosa-boundary-ci-cd[bot]
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift-online/rosa-trusted-actions
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift-online/rosa-trusted-actions
