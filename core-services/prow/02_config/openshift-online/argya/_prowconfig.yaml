branch-protection:
  orgs:
    openshift-online:
      repos:
        argya:
          branches:
            main:
              enforce_admins: true
              protect: true
              required_pull_request_reviews:
                dismiss_stale_reviews: true
                required_approving_review_count: 1
              restrictions:
                apps:
                - openshift-merge-bot
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - human-review-needed
    - jira/invalid-bug
    - must-fix
    repos:
    - openshift-online/argya
