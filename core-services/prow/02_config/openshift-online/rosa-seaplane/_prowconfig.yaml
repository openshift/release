slack_reporter_configs:
  openshift-online/rosa-seaplane:
    channel: '#rosa-seaplane-nightly'
    job_states_to_report:
    - success
    - failure
    - error
    job_types_to_report:
    - periodic
    report_template: '{{- if eq .Status.State "success"}} :green_jenkins_circle: Job
      *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{- else}} :red_jenkins_circle: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs> <!subteam^S0C5R9CRK8R> {{- end}}'
tide:
  queries:
  - author: dependabot[bot]
    labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift-online/rosa-seaplane
  - author: red-hat-konflux-kflux-prd-rh02[bot]
    labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift-online/rosa-seaplane
  - author: redhat-chai-bot
    labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift-online/rosa-seaplane
  - labels:
    - approved
    - jira/valid-reference
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift-online/rosa-seaplane
