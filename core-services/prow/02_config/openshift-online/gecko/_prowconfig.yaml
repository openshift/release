branch-protection:
  orgs:
    openshift-online:
      repos:
        gecko:
          branches:
            main:
              protect: true
          restrictions:
            teams:
            - openshift-bots
tide:
  queries:
  - author: red-hat-konflux-kflux-prd-rh02[bot]
    labels:
    - mintmaker/safe-to-merge
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    - mintmaker/needs-code-change
    - mintmaker/needs-human-review
    repos:
    - openshift-online/gecko
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift-online/gecko
