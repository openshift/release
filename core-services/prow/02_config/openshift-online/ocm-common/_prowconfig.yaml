branch-protection:
  orgs:
    openshift-online:
      repos:
        ocm-common:
          branches:
            main:
              protect: true
              required_status_checks:
                contexts:
                - ci/prow/commit-validation
                - ci/prow/build
                - ci/prow/unit
                - ci/prow/lint
                - ci/prow/verify
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift-online/ocm-common
