approve:
- commandHelpLink: https://go.k8s.io/bot-commands
  repos:
  - openshift-online/rosa-agent
  require_self_approval: true
external_plugins:
  openshift-online/rosa-agent:
  - endpoint: http://needs-rebase
    events:
    - issue_comment
    - pull_request
    name: needs-rebase
plugins:
  openshift-online/rosa-agent:
    plugins:
    - assign
    - golint
    - help
    - hold
    - label
    - lgtm
    - lifecycle
    - override
    - retitle
    - sigmention
    - skip
    - trigger
    - verify-owners
    - owners-label
    - wip
    - approve
triggers:
- repos:
  - openshift-online/rosa-agent
  trusted_apps:
  - openshift-merge-bot
  - red-hat-konflux
  - red-hat-konflux-kflux-prd-rh02
  - dependabot
