branch-protection:
  orgs:
    openshift-online:
      repos:
        rosa-seaplane-api:
          branches:
            main:
              protect: true
              required_status_checks:
                contexts:
                - Konflux kflux-prd-rh02 / rosa-seaplane-api-on-pull-request
                - ci/prow/images
                - ci/prow/lint
                - ci/prow/unit
                - ci/prow/verify
tide:
  queries:
  - author: dependabot[bot]
    labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift-online/rosa-seaplane-api
  - author: red-hat-konflux-kflux-prd-rh02[bot]
    labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift-online/rosa-seaplane-api
  - author: redhat-chai-bot
    labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift-online/rosa-seaplane-api
  - labels:
    - approved
    - jira/valid-reference
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift-online/rosa-seaplane-api
