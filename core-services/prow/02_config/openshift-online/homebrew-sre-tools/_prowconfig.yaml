branch-protection:
  orgs:
    openshift-online:
      repos:
        homebrew-sre-tools:
          branches:
            main:
              protect: true
              required_status_checks:
                contexts:
                - test-bot (macos)
                - test-bot (linux)
tide:
  merge_method:
    openshift-online/homebrew-sre-tools: squash
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    - needs-rebase
    repos:
    - openshift-online/homebrew-sre-tools
