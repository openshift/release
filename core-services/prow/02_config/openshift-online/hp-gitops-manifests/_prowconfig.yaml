branch-protection:
  orgs:
    openshift-online:
      repos:
        hp-gitops-manifests:
          allow_force_pushes: true
          include:
          - overlays/[^/]+-next$
          - overlays/(int|prod|stage)$
          protect: true
          required_pull_request_reviews:
            required_approving_review_count: 0
          restrictions:
            apps:
            - gitops-automator
tide:
  queries:
  - includedBranches:
    - main
    - overlays/prod
    labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift-online/hp-gitops-manifests
  - includedBranches:
    - overlays/int
    - overlays/int-next
    - overlays/prod-next
    - overlays/stage
    - overlays/stage-next
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift-online/hp-gitops-manifests
