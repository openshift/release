branch-protection:
  orgs:
    openshift-online:
      repos:
        hp-gitops-manifests:
          allow_force_pushes: true
          include:
          - ^hydrated/[^/]+/[^/]+/(int|stage)(-next)?$
          protect: true
          restrictions:
            apps:
            - gitops-automator
            - openshift-merge-bot
tide:
  queries:
  - labels:
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/needs-hotfix-approval
    - do-not-merge/version-blocked
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift-online/hp-gitops-manifests
