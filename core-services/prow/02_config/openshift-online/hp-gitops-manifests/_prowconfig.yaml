branch-protection:
  orgs:
    openshift-online:
      repos:
        hp-gitops-manifests:
          allow_force_pushes: true
          include:
          - (^|/)overlays/(int|stage|prod)(-next)?$
          protect: true
          restrictions:
            apps:
            - gitops-automator
tide:
  queries:
  # Branches are app-scoped paths (e.g. hp-delivery/delivery-dashboard/overlays/prod),
  # so match the overlays/<env> suffix on any prefix rather than exact names, mirroring
  # the branch-protection regex above. Exact includedBranches never matched the full
  # branch names, leaving promotion PRs stuck ("No Tide query for branch ... found").
  - includedBranchesRe:
    - ^main$
    - (^|/)overlays/prod$
    labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift-online/hp-gitops-manifests
  - includedBranchesRe:
    - (^|/)overlays/(int|stage)$
    - (^|/)overlays/(int|stage|prod)-next$
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift-online/hp-gitops-manifests
