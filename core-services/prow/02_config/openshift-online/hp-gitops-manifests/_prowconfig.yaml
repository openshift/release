branch-protection:
  orgs:
    openshift-online:
      repos:
        hp-gitops-manifests:
          allow_force_pushes: true
          include:
          - (^|/)overlays/(int|stage|prod)(-next)?$
          protect: true
          restrictions:
            apps:
            - gitops-automator
            - openshift-merge-bot
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    repos:
    - openshift-online/hp-gitops-manifests
