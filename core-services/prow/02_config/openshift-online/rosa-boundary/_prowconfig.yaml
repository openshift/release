slack_reporter_configs:
  openshift-online/rosa-boundary:
    channel: '#wg-rosa-zero-operator-access'
    job_states_to_report:
    - failure
    - error
    job_types_to_report:
    - periodic
    report_template: ':red_jenkins_circle: Nightly job *{{.Spec.Job}}* ended with
      *{{.Status.State}}*. <{{.Status.URL}}|View logs>'
tide:
  merge_method:
    openshift-online/rosa-boundary: squash
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    - needs-rebase
    repos:
    - openshift-online/rosa-boundary
