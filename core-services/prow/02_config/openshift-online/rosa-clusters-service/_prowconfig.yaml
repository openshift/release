branch-protection:
  orgs:
    openshift-online:
      repos:
        rosa-clusters-service:
          branches:
            master:
              enforce_admins: true
              protect: true
              required_status_checks:
                contexts:
                - ci/prow/images
                - ci/prow/pr-check-unit
                - ci/prow/pr-check-check-migrations
                - ci/prow/pr-check-commit-validation
                - ci/prow/pr-check-common-tests
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift-online/rosa-clusters-service
