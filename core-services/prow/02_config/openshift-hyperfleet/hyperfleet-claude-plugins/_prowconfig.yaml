branch-protection:
  orgs:
    openshift-hyperfleet:
      repos:
        hyperfleet-claude-plugins:
          branches:
            main:
              protect: true
              required_status_checks:
                contexts:
                - tide
tide:
  queries:
  - labels:
    - approved
    - lgtm
    missingLabels:
    - backports/unvalidated-commits
    - do-not-merge/hold
    - do-not-merge/invalid-owners-file
    - do-not-merge/work-in-progress
    - jira/invalid-bug
    repos:
    - openshift-hyperfleet/hyperfleet-claude-plugins
