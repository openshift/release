approve:
- repos:
  - project-koku/koku-service-operator
  require_self_approval: true
external_plugins:
  project-koku/koku-service-operator:
  - endpoint: http://refresh
    events:
    - issue_comment
    name: refresh
  - endpoint: http://cherrypick
    events:
    - issue_comment
    - pull_request
    name: cherrypick
  - endpoint: http://needs-rebase
    events:
    - pull_request
    name: needs-rebase
  - endpoint: http://jira-lifecycle-plugin
    events:
    - issue_comment
    - pull_request
    - pull_request_review
    name: jira-lifecycle-plugin
lgtm:
- repos:
  - project-koku/koku-service-operator
  review_acts_as_lgtm: true
plugins:
  project-koku/koku-service-operator:
    plugins:
    - approve
    - assign
    - blunderbuss
    - help
    - hold
    - label
    - lgtm
    - lifecycle
    - override
    - retitle
    - trigger
    - verify-owners
    - wip
triggers:
- repos:
  - project-koku/koku-service-operator
  trusted_apps:
  - openshift-merge-bot
