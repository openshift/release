approve:
- commandHelpLink: https://go.k8s.io/bot-commands
  lgtm_acts_as_approve: true
  repos:
  - traust-security/traust-ledger
  require_self_approval: false
lgtm:
- repos:
  - traust-security/traust-ledger
  review_acts_as_lgtm: true
plugins:
  traust-security/traust-ledger:
    plugins:
    - approve
    - assign
    - golint
    - help
    - hold
    - label
    - lgtm
    - lifecycle
    - override
    - owners-label
    - retitle
    - shrug
    - trigger
    - verify-owners
    - wip
triggers:
- repos:
  - traust-security/traust-ledger
  trusted_apps:
  - openshift-merge-bot
