approve:
- commandHelpLink: https://go.k8s.io/bot-commands
  lgtm_acts_as_approve: true
  repos:
  - traust-security/source-code-intelligence-collector-github
  require_self_approval: false
external_plugins:
  traust-security/source-code-intelligence-collector-github:
  - endpoint: http://refresh
    events:
    - issue_comment
    name: refresh
  - endpoint: http://cherrypick
    events:
    - issue_comment
    - pull_request
    name: cherrypick
  - endpoint: http://needs-rebase
    events:
    - pull_request
    name: needs-rebase
  - endpoint: http://repo-brancher-controller
    events:
    - push
    name: repo-brancher-controller
lgtm:
- repos:
  - traust-security/source-code-intelligence-collector-github
  review_acts_as_lgtm: true
plugins:
  traust-security/source-code-intelligence-collector-github:
    plugins:
    - approve
    - assign
    - golint
    - help
    - hold
    - label
    - lgtm
    - lifecycle
    - override
    - owners-label
    - retitle
    - shrug
    - trigger
    - verify-owners
    - wip
triggers:
- repos:
  - traust-security/source-code-intelligence-collector-github
  trusted_apps:
  - openshift-merge-bot
