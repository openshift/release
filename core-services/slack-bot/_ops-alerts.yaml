# Classification fallbacks and fixed policies for the Slack-fed ops dashboard.
# The underscore prevents applyconfig from treating this as a Kubernetes manifest.
# Source-owned Prometheus and Prow classifications live beside their definitions.
version: 1
defaults:
  color: orange
  category: other
source_policies:
  chai_reports:
    kind: report
    color: green
    category: chai_reports
    view: chai_reports
  ship_outages:
    kind: alert
    color: yellow
    category: other
    component_categories:
    - component: Build Farm
      category: cluster_fleet
    - component: Downstream CI
      subcomponent: CI-Config
      category: repo_automation
platform_alerts:
- alertname_glob: '*etcd*'
  color: red
  category: cluster_fleet
- alertname_glob: '*ETCD*'
  color: red
  category: cluster_fleet
- alertname: MachineWithNoRunningPhase
  color: red
  category: cluster_fleet
- alertname: KubeSchedulerDown
  color: orange
  category: cluster_fleet
# The Hive rule's owning definition has not been located. The hosted-mgmt
# root manifest is outside every Argo CD Application source path. Keep these
# classifications here until the producers have managed source definitions.
legacy_alerts:
- alertname: hive-blocked-deprovision
  color: orange
  category: cloud_cleanup
- alertname: hosted-controllers-down
  color: orange
  category: cloud_cleanup
- alertname: hive-clustersync-down
  color: orange
  category: cloud_cleanup
- alertname: hosted-mgmt-blocked-deprovision
  color: orange
  category: cloud_cleanup
# Compatibility for retained notifications published without source markers.
# Source-supplied classifications take precedence over these narrow fallbacks.
# Infrastructure groups without job labels use the generic CI platform category.
- alertname: infrastructure-job-failures
  color: orange
  category: ci_platform
- alertname: plank-job-with-infra-internal-role-failures
  color: orange
  category: ci_platform
- alertname: high-ci-operator-infra-error-rate
  color: orange
  category: ci_platform
- alertname: high-ci-operator-error-rate
  color: yellow
  category: ci_platform
- alertname: ghproxy-too-many-pending-alerts
  color: yellow
  category: ci_platform
- alertname: TriggeredProwJobsPileup
  color: orange
  category: ci_platform
- alertname: ProbeFailing
  color: orange
  category: ci_platform
- alertname: openshift-priv-image-building-jobs-failing
  color: orange
  category: repo_automation
- alertname: repo-brancher-fast-forward-failures
  color: orange
  category: repo_automation
# These legacy Prow reports predate the matching source-owned reporter markers.
- alertname_glob: periodic-hypershift-deprovision-aws-konflux-prod-hosted-mgmt*
  color: orange
  category: cloud_cleanup
- alertname_glob: periodic-hypershift-deprovision-aws-konflux-stg-hosted-mgmt*
  color: orange
  category: cloud_cleanup
