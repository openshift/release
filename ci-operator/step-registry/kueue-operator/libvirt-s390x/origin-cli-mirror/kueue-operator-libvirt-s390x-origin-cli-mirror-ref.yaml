ref:
  as: kueue-operator-libvirt-s390x-origin-cli-mirror
  from: src-with-oc-and-kubectl
  commands: kueue-operator-libvirt-s390x-origin-cli-mirror-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: ORIGIN_CLI_SOURCE
      default: quay.io/openshift/origin-cli
      documentation: Source image repository for openshift origin-cli used in e2e tests.
    - name: ORIGIN_CLI_MIRROR
      default: quay.io/meghagaur/origin-cli
      documentation: Mirror repository that provides origin-cli for architectures where the upstream image is unavailable.
  documentation: |-
    Apply an ImageTagMirrorSet redirecting openshift origin-cli to a mirror registry and
    wait for MachineConfigPool rollout before running Kueue e2e tests that depend on that image.
