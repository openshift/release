chain:
  as: kueue-operator-libvirt-s390x-test-e2e-upstream
  steps:
  - ref: kueue-operator-image-env-setup
  - ref: cert-manager-install-operator
  - as: run-sdk
    commands: |
      source "${SHARED_DIR}/env"
      echo "Using Bundle Image: ${BUNDLE_IMAGE}"
      operator-sdk run bundle --timeout=10m -n openshift-kueue-operator "$BUNDLE_IMAGE" --security-context-config=restricted
    from: operator-sdk
    resources:
      requests:
        cpu: 200m
        memory: 300Mi
  - ref: kueue-operator-image-patch
  - chain: jobset-install
  - chain: leader-worker-set-install
  - as: e2e-kueue-upstream
    cli: latest
    env:
    - name: E2E_TARGET_FOLDERS
      default: "singlecluster certmanager"
      documentation: |-
        Space-separated list of upstream e2e test folders to run.
        Available folders: singlecluster, certmanager, dra.
    commands: |
      source "${SHARED_DIR}/env"

      # TEMPORARY: libvirt-s390x only. Fix highWlLookupKey copy-paste (lowJob ->
      # highJob) and give on-demand preemption waits 90s instead of 10s.
      JOB_TEST="upstream/kueue/src/test/e2e/singlecluster/baseline/job_test.go"
      if [[ -f "${JOB_TEST}" ]]; then
        sed -i \
          's/highWlLookupKey := types.NamespacedName{Name: workloadjob.GetWorkloadNameForJob(lowJob.Name, lowJob.UID)/highWlLookupKey := types.NamespacedName{Name: workloadjob.GetWorkloadNameForJob(highJob.Name, highJob.UID)/' \
          "${JOB_TEST}"
        sed -i \
          '/Checking that the high-priority workload is created and admitted/,/Should(gomega.Succeed())/ s/util\.Timeout,/util.LongTimeout,/' \
          "${JOB_TEST}"
        sed -i \
          '/Checking that the low-priority workload is successfully preempted/,/Should(gomega.Succeed())/ s/util\.Timeout,/util.LongTimeout,/' \
          "${JOB_TEST}"
        echo "=== Patched ${JOB_TEST} ==="
        grep -n "highWlLookupKey\|high-priority workload is created\|successfully preempted\|LongTimeout" "${JOB_TEST}" || true
      else
        echo "WARNING: ${JOB_TEST} not found; skipping patch"
      fi

      # TEMPORARY debug: stop at first failure so controller logs still cover
      # the failed spec, then dump logs (e2e namespaces are already deleted).
      export GINKGO_ARGS="${GINKGO_ARGS:-} --fail-fast"
      if ! make e2e-upstream-test; then
        echo "=== TEMPORARY debug dump after upstream failure ==="
        mkdir -p "${ARTIFACT_DIR}/kueue-debug-dump"
        oc get pods -n openshift-kueue-operator -o wide || true
        oc logs -n openshift-kueue-operator --all-containers --prefix=true --tail=5000 --since=20m \
          -l control-plane=controller-manager 2>&1 | tee "${ARTIFACT_DIR}/kueue-debug-dump/controller.log" || true
        oc logs -n openshift-kueue-operator deployment/openshift-kueue-operator --all-containers --prefix=true --tail=500 --since=20m 2>&1 | tee "${ARTIFACT_DIR}/kueue-debug-dump/operator.log" || true
        oc get clusterqueue -o yaml 2>&1 | tee "${ARTIFACT_DIR}/kueue-debug-dump/clusterqueue.yaml" || true
        oc get workloads.kueue.x-k8s.io -A -o yaml 2>&1 | tee "${ARTIFACT_DIR}/kueue-debug-dump/workloads.yaml" || true
        exit 1
      fi
    from: kueue-operator-src
    resources:
      requests:
        cpu: "4"
        memory: "4Gi"
  documentation: |-
    Libvirt s390x variant of kueue-operator-test-e2e-upstream. Applies a
    temporary checkout patch for the env-dedup preemption spec (wrong
    workload key + 10s timeout) before running make e2e-upstream-test.
