chain:
  as: kueue-operator-libvirt-s390x-test-e2e
  steps:
  - ref: kueue-operator-image-env-setup
  - ref: cert-manager-install-operator
  - as: run-sdk
    commands: |
      source "${SHARED_DIR}/env"
      echo "Using Bundle Image: ${BUNDLE_IMAGE}"
      operator-sdk run bundle --timeout=10m -n openshift-kueue-operator "$BUNDLE_IMAGE" --security-context-config=restricted
    from: operator-sdk
    resources:
      requests:
        cpu: 200m
        memory: 300Mi
  - ref: kueue-operator-image-patch
  - ref: jobset-install-operator
  - ref: leader-worker-set-install-operator
  - as: e2e-kueue
    cli: latest
    env:
    - name: CONTAINER_IMAGE
      default: ""
    commands: |
      source "${SHARED_DIR}/env"
      echo "Running tests with CONTAINER_IMAGE=${CONTAINER_IMAGE}"
      make e2e-ci-test
    from: kueue-operator-src
    resources:
      requests:
        cpu: "4"
        memory: "4Gi"
  - as: e2e-kueue-upstream
    cli: latest
    env:
    - name: OPERATOR_COMPONENT
      default: kueue-operator-main
      documentation: |-
        Operator component name from the job env. The highWlLookupKey
        checkout patch is applied only for kueue-operator-1-3.
    commands: |
      source "${SHARED_DIR}/env"

      # TEMPORARY: libvirt-s390x / release-1.3 only. Fix highWlLookupKey
      if [[ "${OPERATOR_COMPONENT}" == *-1-3 ]]; then
        JOB_TEST="upstream/kueue/src/test/e2e/singlecluster/job_test.go"
        if [[ -f "${JOB_TEST}" ]]; then
          sed -i \
            's/highWlLookupKey := types.NamespacedName{Name: workloadjob.GetWorkloadNameForJob(lowJob.Name, lowJob.UID)/highWlLookupKey := types.NamespacedName{Name: workloadjob.GetWorkloadNameForJob(highJob.Name, highJob.UID)/' \
            "${JOB_TEST}"
          echo "=== Patched ${JOB_TEST} (OPERATOR_COMPONENT=${OPERATOR_COMPONENT}) ==="
        else
          echo "WARNING: ${JOB_TEST} not found for OPERATOR_COMPONENT=${OPERATOR_COMPONENT}; skipping patch"
        fi
      else
        echo "Skipping highWlLookupKey patch for OPERATOR_COMPONENT=${OPERATOR_COMPONENT}"
      fi

      make e2e-upstream-test
    from: kueue-operator-src
    resources:
      requests:
        cpu: "4"
        memory: "4Gi"
  documentation: |-
    Libvirt s390x variant of kueue-operator-test-e2e (downstream + upstream).
    Applies a temporary checkout patch for the highWlLookupKey copy-paste on
    release-1.3 only before make e2e-upstream-test.
