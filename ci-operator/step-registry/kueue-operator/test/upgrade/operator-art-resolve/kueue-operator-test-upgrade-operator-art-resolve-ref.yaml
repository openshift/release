ref:
  as: kueue-operator-test-upgrade-operator-art-resolve
  from: kueue-operator-src
  commands: kueue-operator-test-upgrade-operator-art-resolve-commands.sh
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: KUEUE_OPERATOR_CHANNEL
    default: "stable-v1.5"
    documentation: |-
      FBC channel whose head bundle is the upgrade target. The entry the head
      replaces is the upgrade source.
  documentation: |-
    Resolves the in-channel z-stream operator upgrade pair from the ART FBC
    pinned by kueue-operator-enable-catalogsource-art in
    ${SHARED_DIR}/kueue_index_image: the channel head is the upgrade target
    (KUEUE_UPGRADE_TO_CSV) and the CSV it replaces is the upgrade source
    (KUEUE_UPGRADE_FROM_CSV). Both are written to ${SHARED_DIR}/env. Fails if the
    head declares no replaces (single-version channel, nothing to upgrade from).
