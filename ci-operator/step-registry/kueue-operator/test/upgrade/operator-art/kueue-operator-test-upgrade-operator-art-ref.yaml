ref:
  as: kueue-operator-test-upgrade-operator-art
  from_image:
    name: cli-jq
    namespace: ocp
    tag: latest
  commands: kueue-operator-test-upgrade-operator-art-commands.sh
  timeout: 900s
  resources:
    requests:
      cpu: 200m
      memory: 300Mi
  documentation: |-
    Performs the in-channel (z-stream) Kueue operator upgrade on the ART build by
    approving the OLM InstallPlan that moves the Subscription from
    KUEUE_UPGRADE_FROM_CSV to the channel head KUEUE_UPGRADE_TO_CSV (a real OLM
    upgrade, no operator-sdk). Verifies the installed CSV advanced, re-applies the
    Kueue CR the e2e suite expects, and waits for the controller. Requires the
    resolve and install-previous steps to have run.
