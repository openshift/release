ref:
  as: kueue-operator-disconnected-endpoint
  from: cli
  cli: latest
  commands: kueue-operator-disconnected-endpoint-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Captures the cluster API endpoint (hostname and IP) into SHARED_DIR for
    DNS-fallback use by later steps, as build-farm DNS intermittently fails
    to resolve live clusters' API names. Must run early, right after cluster
    installation, while name resolution is still reliable.
