ref:
  as: kueue-operator-disconnected-run-sdk
  from: upi-installer
  cli: latest
  commands: kueue-operator-disconnected-run-sdk-commands.sh
  grace_period: 10s
  timeout: 5h0m0s
  resources:
    requests:
      cpu: 200m
      memory: 300Mi
  documentation: |-
    Install the kueue operator from the mirrored registry with operator-sdk,
    which serves the bundle as a catalog (a plain bundle image cannot be used
    directly as a CatalogSource). Runs in the step pod through the bastion proxy.
