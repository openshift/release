chain:
  as: kueue-operator-disconnected-art
  steps:
  - ref: kueue-operator-disconnected-compute-art
  - ref: kueue-operator-disconnected-install-art
  - ref: kueue-operator-disconnected-run-sdk
  documentation: |-
    Install the Kueue operator from the ART build on a disconnected cluster.
    The compute step resolves the ART FBC to the channel head bundle, the mirror
    step copies that bundle and its relatedImages from registry.stage.redhat.io
    into the CI mirror registry, and run-sdk (shared with the Konflux variant)
    installs the mirrored bundle on the bastion.
