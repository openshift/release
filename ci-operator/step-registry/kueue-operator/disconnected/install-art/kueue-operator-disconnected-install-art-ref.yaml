ref:
  as: kueue-operator-disconnected-install-art
  from: upi-installer
  cli: latest
  commands: kueue-operator-disconnected-install-art-commands.sh
  credentials:
    - collection: openshift-qe
      group: mirror-registry
      mount_path: /var/run/vault/mirror-registry
  resources:
    requests:
      memory: 2Gi
      cpu: 100m
    limits:
      memory: 4Gi
      cpu: 500m
  documentation: |-
    Mirrors the ART bundle and the images its FBC declares from
    registry.stage.redhat.io into the CI mirror registry, and writes the
    ImageDigestMirrorSet/ImageTagMirrorSet that redirect registry.redhat.io/kueue
    pulls onto the mirror. No cluster API contact: the policies are applied by
    kueue-operator-disconnected-run-sdk.
