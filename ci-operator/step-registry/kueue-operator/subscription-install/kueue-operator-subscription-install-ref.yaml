ref:
  as: kueue-operator-subscription-install
  cli: latest
  from_image:
    name: cli-jq
    namespace: ocp
    tag: latest
  commands: kueue-operator-subscription-install-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: KUEUE_OPERATOR_SOURCE
    documentation: |-
      CatalogSource the Subscription installs from, e.g. fbc-operator-catalog as
      created by kueue-operator-enable-catalogsource-art, or redhat-operators for
      released builds.
    default: "fbc-operator-catalog"
  - name: KUEUE_OPERATOR_SOURCE_NAMESPACE
    documentation: Namespace of the KUEUE_OPERATOR_SOURCE CatalogSource.
    default: openshift-marketplace
  - name: KUEUE_OPERATOR_CHANNEL
    documentation: |-
      Subscription channel, e.g. stable-v1.5. Empty leaves spec.channel unset,
      so OLM uses the package's default channel.
    default: ""
  documentation: |-
    Install the Kueue operator into openshift-kueue-operator via an OperatorGroup
    and Subscription, and wait for the CSV to reach Succeeded.
