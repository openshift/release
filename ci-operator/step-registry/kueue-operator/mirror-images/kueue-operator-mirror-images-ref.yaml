ref:
  as: kueue-operator-mirror-images
  from_image:
    namespace: ocp
    name: cli
    tag: latest
  commands: kueue-operator-mirror-images-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  documentation: |-
    Mirrors Kueue operator and operand images to the cluster's internal registry
    for disconnected testing. Creates ImageContentSourcePolicy to redirect pulls.
