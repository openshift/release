ref:
  as: quay-operator-provisioning-tls
  cli: latest
  from_image:
    name: quay-test-omr
    namespace: ci
    tag: latest
  commands: quay-operator-provisioning-tls-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  grace_period: 15m0s
  documentation: |-
    Create a self-signed TLS cert/key pair for an unmanaged-TLS Quay deployment.
    The certificate SANs cover both the Quay route and the Quay builder route, and
    the cluster CA is captured too. Writes ssl.cert, ssl.key and build_cluster.crt
    to ${SHARED_DIR} for the deploy step (required for build support / unmanaged TLS).
  env:
  - name: QUAYREGISTRY
    documentation: The quay registry name
    default: "quay"
  - name: QUAYNAMESPACE
    documentation: The Quay installed namespace
    default: "quay-enterprise"
