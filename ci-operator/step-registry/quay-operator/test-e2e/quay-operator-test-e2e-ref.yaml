ref:
  as: quay-operator-test-e2e
  cli: latest
  from: quay-playwright-runner
  commands: quay-operator-test-e2e-commands.sh
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
  timeout: 2h0m0s
  grace_period: 15m0s
  credentials:
  - namespace: test-credentials
    name: quay-qe-quay-secret
    mount_path: /var/run/quay-qe-quay-secret
  env:
  - name: PLAYWRIGHT_GIT_REPO
    documentation: |-
      Git repository the Playwright suite is cloned from. Required (no default):
      the tests must be deliberately version-matched to the deployed Quay image,
      so the caller must set this explicitly in the ci-operator config.
  - name: PLAYWRIGHT_GIT_BRANCH
    documentation: |-
      Git ref (branch, tag, or commit SHA) checked out for the Playwright tests.
      Required (no default): pin it to the deployed Quay image's build commit so
      the suite and the product come from the same point in history.
  - name: QUAY_OPERATOR_CHANNEL
    default: "stable-3.16"
    documentation: Installed Quay operator channel (informational in this step).
  - name: PLAYWRIGHT_GREP_INVERT
    default: "@auth:OIDC|@auth:LDAP|@feature:QUOTA_NOTIFICATIONS|@webhook"
    documentation: |-
      Regex passed to `playwright test --grep-invert` to skip tests. Defaults
      exclude unsupported auth backends (OIDC/LDAP), all webhook tests (out of
      scope), and tests tracking known product bugs / UI-version gaps. See
      E2E_FAILURE_REPORT.md for the rationale behind each quarantined entry.
  documentation: |-
    Execute Quay Playwright e2e smoke tests against a deployed Quay instance.
    By default tests and browsers come from the quay-playwright-runner image.
    Set PLAYWRIGHT_GIT_BRANCH to clone a different quay.git ref at runtime.
