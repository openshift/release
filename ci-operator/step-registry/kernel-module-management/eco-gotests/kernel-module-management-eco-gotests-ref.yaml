ref:
  as: kernel-module-management-eco-gotests
  from: eco-gotests
  grace_period: 10m
  commands: kernel-module-management-eco-gotests-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  timeout: 2h
  env:
  - name: ECO_TEST_FEATURES
    default: modules
    documentation: Eco-gotests feature directories to run.
  - name: ECO_TEST_LABELS
    default: kmm-sanity && !bmc && !simple-kmod
    documentation: Ginkgo label filter for the regular KMM sanity suite.
  - name: ECO_HWACCEL_KMM_REGISTRY
    default: quay.io/ocp-edge-qe
    documentation: External registry used by KMM module tests.
  - name: ECO_HWACCEL_KMM_DEVICE_PLUGIN_IMAGE
    default: quay.io/cvultur/device-plugin:latest-%s
    documentation: Device plugin image template for KMM tests.
  - name: ECO_TEST_TIMEOUT
    default: 80m
    documentation: Maximum duration for the KMM modules test suite.
  documentation: |-
    Runs the regular KMM modules sanity suite from eco-gotests on a claimed
    OpenShift cluster after the KMM operator bundle has been installed.
