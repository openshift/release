workflow:
  as: rosa-hive-e2e
  steps:
    env:
      OCM_LOGIN_ENV: production
    pre:
    - ref: rosa-hive-backplane-login
    test:
    - ref: rosa-hive-operator-e2e
  documentation: |-
    Runs operator e2e tests directly against a hive cluster via backplane.
    For hive-resident operators (certman-operator) deployed via PKO onto
    hive clusters rather than spoke ROSA/OSD clusters.

    The pre step authenticates via backplane and saves the kubeconfig.
    The test step runs the operator e2e binary against the cluster.

    Requires capabilities: [intranet] and restrict_network_access: false
    in the ci-operator config for backplane proxy access.
