workflow:
  as: rosa-hive-e2e
  steps:
    env:
      OCM_LOGIN_ENV: production
    pre:
    - ref: rosa-hive-backplane-login
    - ref: rosa-hive-operator-install
    test:
    - ref: rosa-hive-operator-e2e
  documentation: |-
    Runs operator e2e tests directly against a hive cluster via backplane.
    For hive-resident operators (certman-operator) deployed via PKO onto
    hive clusters rather than spoke ROSA/OSD clusters.

    The pre steps authenticate via backplane, inject CI registry pull
    secrets so the hive cluster can pull CI-built images, and save an
    elevated kubeconfig for the test step.

    The test step runs the operator e2e binary with backplane-cluster-admin
    access. When OPERATOR_IMAGE is set (presubmit), the e2e binary deploys
    the candidate. When unset (promotion gate), it tests the production operator.

    Requires capabilities: [intranet] and restrict_network_access: false
    in the ci-operator config for backplane proxy access.
