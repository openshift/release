ref:
  as: rosa-hive-sync-health
  from_image:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
  grace_period: 10s
  commands: rosa-hive-sync-health-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  env:
  - name: BACKPLANE_CLI_VERSION
    default: "0.11.0"
    documentation: Version of the ocm-backplane CLI to install.
  - name: BACKPLANE_PROXY_URL
    default: "http://squid.corp.redhat.com:3128"
    documentation: HTTP proxy for backplane API access from build clusters.
  - name: OCM_LOGIN_ENV
    default: "production"
    documentation: OCM environment to login to.
  - name: BACKPLANE_CLUSTER_IDS
    documentation: |-
      Comma-separated list of Hive shard cluster IDs to check.
      Each shard is logged into via backplane and its ClusterSync
      resources are queried for failures.
  documentation: |-
    Health check for deployed SelectorSyncSets, SyncSets, and ClusterSyncs
    across multiple Hive shards via backplane.

    Loops over BACKPLANE_CLUSTER_IDS (comma-separated), logs into each
    shard via backplane with elevated access, and queries ClusterSync
    resources for any failure conditions or failed sync results.

    Reports per-shard pass/fail with details of any failing syncs.
    Exits non-zero if any failures are detected on any shard.

    Requires the rosa-hive-backplane-login pre step for initial
    connectivity validation. BACKPLANE_CLUSTER_ID (singular, for the
    pre step), BACKPLANE_CLUSTER_IDS (plural, comma-separated, for this
    step), and BACKPLANE_ELEVATE_REASON must be set in the ci-operator
    config.
