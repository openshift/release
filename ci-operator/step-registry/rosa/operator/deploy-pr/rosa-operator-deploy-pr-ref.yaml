ref:
  as: rosa-operator-deploy-pr
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-operator-deploy-pr-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  dependencies:
  - name: hypershift-operator
    env: OPERATOR_IMAGE
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: The OCM environment to log into. Supported values are [production, staging, integration].
  - name: CLUSTER_SECTOR
    default: ""
    documentation: The OSDFM sector to look up the management cluster from.
  - name: REGION
    default: "us-west-2"
    documentation: The AWS region to filter service clusters by.
  documentation: |-
    Deploys the PR-built HyperShift operator image to the management cluster in the specified
    OSDFM sector. It patches the operator Deployment image with OPERATOR_IMAGE, creates a
    temporary CI registry pull secret, saves the original image for restoration, and acquires
    an operator-deploy-lock ConfigMap on the MC (stale-lock eviction >4h; lock released on
    TERM/INT). Pair with rosa-operator-restore as a post step.

    The control-plane-operator is handled separately by rosa-operator-push-cpo-image and
    rosa-operator-override-cpo-image. The operator's --control-plane-operator-image flag is only a
    fallback behind the CPO in the OCP release payload and therefore cannot enforce a PR-built
    CPO for normal releases.
