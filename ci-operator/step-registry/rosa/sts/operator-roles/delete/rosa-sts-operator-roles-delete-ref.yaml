ref:
  as: rosa-sts-operator-roles-delete
  from: rosa-aws-cli
  best_effort: true
  timeout: 10m0s
  grace_period: 10m
  commands: rosa-sts-operator-roles-delete-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: The environment for rosa login. The supported values are [production, staging, integration].

  documentation: |-
    The step uses rosa cli to delete the created operator roles. This step is marked best_effort so transient failures do not fail the overall job. Consuming workflows must set allow_best_effort_post_steps: true for the best_effort flag to take effect.
