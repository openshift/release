ref:
  as: rosa-gap-analysis-test
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-gap-analysis-test-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: The environment for OCM login.
  - name: REGION
    default: ""
    documentation: Cloud region for the cluster. Falls back to LEASED_RESOURCE if empty.
  - name: VALIDATION_TIMEOUT
    default: "30m"
    documentation: Maximum time to wait for cluster ready state validation.
  documentation: |-
    Runs gap-analysis validation tests against a ROSA cluster (Classic or HCP).
    Validates cluster ready state, ClusterOperators, and nodes.
    Collects installation logs on failures and generates validation report.
    Expects CLUSTER_ID in SHARED_DIR/cluster-id and AWS credentials in the cluster profile.
