workflow:
  as: rosa-gap-analysis-hcp
  steps:
    env:
      CHANNEL_GROUP: nightly
      HOSTED_CP: "true"
      REPLICAS: "2"
    pre:
      - chain: rosa-aws-sts-hcp-provision
      - ref: rosa-cluster-wait-ready-hosted-cp
      - ref: rosa-cluster-wait-ready-nodes
    test:
      - ref: rosa-gap-analysis-test
    post:
      - chain: rosa-cluster-deprovision
        best_effort: true
      - chain: rosa-sts-oidc-config-delete
        best_effort: true
      - ref: rosa-e2e-cleanup-vpc
        best_effort: true
      - ref: aws-deprovision-stacks
        best_effort: true
  documentation: |-
    This workflow provisions a ROSA HCP cluster and runs gap-analysis
    validation tests (cluster ready state, ClusterOperators, nodes), then tears
    down the cluster.
