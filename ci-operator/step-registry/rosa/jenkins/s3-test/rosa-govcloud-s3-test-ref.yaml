ref:
  as: rosa-govcloud-s3-test
  from: cli
  grace_period: 5m
  commands: rosa-govcloud-s3-test-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m
  credentials:
  - mount_path: /tmp/s3-creds
    name: rosa-govcloud-s3-creds
    namespace: test-credentials
  env:
  - name: S3_BUCKET
    default: "prow-testing-bucket"
    documentation: The S3 bucket name for storing test artifacts
  - name: S3_REGION
    default: "us-gov-west-1"
    documentation: AWS GovCloud region for S3 bucket
  documentation: |-
    Test S3 bucket access for ROSA GovCloud CI integration.
    Writes a test trigger file to the S3 bucket and verifies upload success.
