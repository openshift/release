ref:
  as: rosa-cluster-lease-controller
  from: rosa-aws-cli
  grace_period: 5m
  commands: rosa-cluster-lease-controller-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  timeout: 2h0m0s
  credentials:
  - namespace: test-credentials
    bundle: rosa-cluster-lease-manager
    mount_path: /etc/rosa-cluster-lease-manager
  - namespace: ci
    bundle: cluster-secrets-rosa-e2e-gcp
    mount_path: /etc/rosa-e2e-gcp
  - collection: rosa-e2e
    group: rosa-e2e-osd-aws-ccs
    mount_path: /etc/rosa-e2e-osd-aws
  env:
  - name: LEASE_NAMESPACE
    default: "rosa-cluster-lease"
    documentation: Namespace on the lease host cluster where lease ConfigMaps live.
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: OCM environment for cluster operations.
  - name: STALE_LEASE_HOURS
    default: "4"
    documentation: Hours after which an in-use lease is considered stale and force-released.
  - name: ERROR_REPLACE_HOURS
    default: "1"
    documentation: Hours a cluster stays in error status before being replaced.
  - name: MAX_CLUSTER_AGE_HOURS
    default: "0"
    documentation: Max cluster age in hours before refresh (0 disables age-based refresh).
  - name: REFRESH_DAY
    default: "6"
    documentation: Day of the week to run cluster refresh (1=Mon, 7=Sun).
  - name: MAX_REFRESH_PER_RUN
    default: "2"
    documentation: Max clusters to refresh per controller run (stagger safeguard).
  - name: DRY_RUN
    default: "false"
    documentation: When true, log what would be done without making changes.
  documentation: |-
    Reconciles the ROSA cluster lease inventory. Reads desired state
    from a rosa-cluster-lease-config ConfigMap, compares with actual
    per-cluster ConfigMaps, and takes action:

    - Provisions missing clusters via rosa CLI
    - Health checks existing clusters (OCM status, node health)
    - Recovers stale leases (in-use beyond STALE_LEASE_HOURS)
    - Refreshes aged clusters on a configured day (MAX_CLUSTER_AGE_HOURS)
    - Replaces unhealthy clusters (error beyond ERROR_REPLACE_HOURS)
    - Upgrades available clusters when desired version is newer
    - Decommissions clusters no longer in desired state

    Startup phases are reported before and after the first OCM login: the
    phase, its outcome, the credential kind, the login attempt count and the
    exit status always reach the build log, and reach controller-report.txt
    whenever the artifact directory can be written, so a run that ends before
    reconciling still leaves evidence behind. Those startup lines hold fixed
    words and integers only, never credentials, command arguments or OCM
    output, and failing to write them does not by itself change the status
    the step exits with. Reconciliation reports on every cluster it acts on,
    so it requires a writable artifact directory and stops before acting when
    there is none.

    Run as a periodic Prow job (e.g. every 15 minutes).
