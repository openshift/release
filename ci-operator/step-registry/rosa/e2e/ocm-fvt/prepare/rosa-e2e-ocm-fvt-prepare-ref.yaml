ref:
  as: rosa-e2e-ocm-fvt-prepare
  from: nested-podman
  commands: rosa-e2e-ocm-fvt-prepare-commands.py
  run_as_script: true
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Install the delivered artifact helper source in SHARED_DIR before rosa-e2e-ocm-fvt.
    This step handles public code only and does not access cluster credentials.

    The helper's publish phase also writes the ocm-fvt-artifact-audit.json
    disposition manifest described on rosa-e2e-ocm-fvt, so that what
    publication copied, skipped or could not read stays recoverable after the
    post-upload artifact scanner replaces an object.

    Its summary phase writes ocm-fvt-failure-summary.json, the bounded
    allowlisted projection of the per-phase Ginkgo reports also described on
    rosa-e2e-ocm-fvt, so that which cases failed survives the same scanner
    replacing the reports themselves.
