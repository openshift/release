ref:
  as: rosa-e2e-ocm-fvt-clean
  from: nested-podman
  commands: rosa-e2e-ocm-fvt-clean-commands.sh
  nested_podman: true
  timeout: 2h0m0s
  grace_period: 30s
  best_effort: true
  credentials:
  - collection: ocm-fvt-credentials
    group: cs-qe-credentials
    mount_path: /usr/local/cs-qe-credentials
  - collection: ocm-fvt-credentials
    group: osdfm-qe-credentials
    mount_path: /usr/local/osdfm-qe-credentials
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: OCM_FVT_JOB_NAME
    default: ""
    documentation: |-
      ocmtest --job name. Optional if SHARED_DIR/ocm-fvt-job-name was written by the test step.
  - name: OCM_FVT_SERVICE
    default: "cms"
    documentation: |-
      ocmtest --service: cms (default) or osdfm. Must match the test step.
  - name: OCM_FVT_OCM_ENV
    default: ""
    documentation: |-
      OCM env override (e.g. integration). Empty uses ocmtest default (staging).
  - name: OCM_FVT_EXTRA_ENVS
    default: ""
    documentation: |-
      Newline-separated KEY=VALUE pairs injected into the podman container
      (same as the test step, e.g. ocp5 AWS creds for shared-vpc cleanup).
  - name: MULTISTAGE_PARAM_OVERRIDE_OCM_FVT_EXTRA_ENVS
    default: ""
    documentation: |-
      Gangway API override for OCM_FVT_EXTRA_ENVS. When set via
      pod_spec_options.envs, replaces the job config value (same as test step).
  - name: OCM_FVT_GCP_CREDS
    default: "false"
    documentation: |-
      Mount osd-ccs-admin.json for OSD GCP cleanup.
  documentation: |-
    Run ocmtest --justClean after rosa-gather-hcp-guest-artifacts so guest
    must-gather/extra can run against a live API (ROSAENG-67965). Requires
    OCM_FVT_DEFER_CLEAN=true on the test step so in-workflow destroy is skipped
    and SHARED_DIR/ocm-fvt-clean-state.tgz is populated.
