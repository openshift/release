ref:
  as: rosa-e2e-ocm-fvt-osdfm-int-to-stage-release
  from: osdfm-release-tools
  commands: rosa-e2e-ocm-fvt-osdfm-int-to-stage-release-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 30m0s
  grace_period: 30s
  credentials:
  - namespace: ci
    name: osdfm-qe-credentials
    mount_path: /usr/local/osdfm-qe-credentials
  # rosa-e2e is public; ci-operator will not auto-inject this. Required so
  # commands.sh can clone private openshift-online/rosa-backend-tests and so
  # osdfm_release.sh can clone private openshift-online/osd-fleet-manager.
  - namespace: ci
    name: github-credentials-openshift-ci-robot-private-git-cloner
    mount_path: /usr/local/github-credentials
  env:
  - name: ROSA_BACKEND_TESTS_REF
    default: master
    documentation: |-
      Git branch or tag of openshift-online/rosa-backend-tests to clone
      for osdfm_release.sh. Default branch of that repo is master.
  - name: COMMIT_SHA
    default: ""
    documentation: |-
      Optional osd-fleet-manager commit SHA to promote. When empty,
      osdfm_release.sh clones the repo and promotes whatever HEAD is
      (the default branch is main).
  documentation: |-
    Runs osdfm_release.sh after a successful OSDFM integration basic
    periodic test to open an app-interface MR promoting osd-fleet-manager
    from integration to stage.

    Requires osdfm-qe-credentials (osdfm_gitlab_token, osdfm_webhook_url)
    and github-credentials-openshift-ci-robot-private-git-cloner to clone
    private rosa-backend-tests and osd-fleet-manager over HTTPS
    (credential.helper with username x-access-token).

    This is a post step, so ci-operator runs it even if the preceding test
    step failed. Before doing anything, it checks the exit code recorded by
    the test step (via rosa-e2e-ocm-fvt-commands.sh) at
    ${SHARED_DIR}/ocm-fvt-exit-code and skips the promotion unless that
    test explicitly succeeded.
