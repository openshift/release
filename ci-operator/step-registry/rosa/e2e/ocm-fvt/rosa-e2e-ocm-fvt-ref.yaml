ref:
  as: rosa-e2e-ocm-fvt
  from: nested-podman
  commands: rosa-e2e-ocm-fvt-commands.sh
  nested_podman: true
  timeout: 5h0m0s
  grace_period: 30s
  credentials:
  - collection: ocm-fvt-credentials
    group: cs-qe-credentials
    mount_path: /usr/local/cs-qe-credentials
  - collection: rosa-e2e
    group: rhobs-oidc-staging
    mount_path: /usr/local/rhobs-oidc-staging
  - collection: rosa-e2e
    group: rhobs-oidc-production
    mount_path: /usr/local/rhobs-oidc-production
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: OCM_FVT_JOB_NAME
    documentation: |-
      Required ocmtest --job name (e.g. cs-rosa-hcp-ad-staging-main).
  - name: OCM_FVT_ARTIFACT_STEP_NAME
    default: "rosa-e2e-ocm-fvt"
    documentation: |-
      Internal Prow artifact path component used to link to this run's test
      result directory from the matrix report.
  - name: OCM_FVT_SERVICE
    default: "cms"
    documentation: |-
      ocmtest --service: cms (default) or osdfm.
  - name: OCM_FVT_OCM_ENV
    default: ""
    documentation: |-
      OCM env override (e.g. integration). Empty uses ocmtest default (staging).
  - name: OCM_FVT_EXTRA_ENVS
    default: ""
    documentation: |-
      Newline-separated KEY=VALUE pairs injected into the podman container.
  - name: MULTISTAGE_PARAM_OVERRIDE_OCM_FVT_EXTRA_ENVS
    default: ""
    documentation: |-
      Gangway API override for OCM_FVT_EXTRA_ENVS. When set via
      pod_spec_options.envs (e.g. run-prow-job.sh --fvt-env), replaces
      the job config value. Example:
        "MULTISTAGE_PARAM_OVERRIDE_OCM_FVT_EXTRA_ENVS": "KEY=val\\nKEY2=val2"
  - name: OCM_FVT_GCP_CREDS
    default: "false"
    documentation: |-
      Mount osd-ccs-admin.json for OSD GCP tests.
  - name: OCM_FVT_DEFER_CLEAN
    default: "false"
    documentation: |-
      When "true", skip in-workflow CleanClusterByProfile (GINKGO_SKIP + env)
      and persist .datainfo/cluster.ini to SHARED_DIR for rosa-e2e-ocm-fvt-clean.
      Required for jobs that post rosa-gather-hcp-guest-artifacts (ROSAENG-67965).
      Also writes SHARED_DIR/ocm-fvt-gather-eligible (true only when cluster.ini
      State=ready and guest API is reachable when oc is available) so guest
      gather skips cleanly when the cluster never became ready.
  - name: OCM_FVT_USE_BACKPLANE
    default: "false"
    documentation: |-
      Prow-only: backplane login to Hive for osdfm AAO kubeconfig.
      False when Tekton/Jenkins supply vault or a mounted kubeconfig.
  - name: OCM_FVT_BACKPLANE_CLUSTER_ID
    default: "1g268u7pp694gj152nj16me4sv615lpv"
    documentation: |-
      Hive cluster id (default hivei01ue1). Override per env for stage/prod gating.
  - name: OCM_FVT_APPSRE_BACKPLANE_CLUSTER_ID
    default: "19mjrthsfn66bm22m574v2v1gt9a8r4q"
    documentation: |-
      Deprecated (ROSAENG-67791). Previously used for AppSRE Prom port-forward;
      osdfm metrics now query RHOBS. Kept for backward compatibility.
  - name: OCM_FVT_PROMETHEUS_URL
    default: ""
    documentation: |-
      Optional override for osdfm metrics PromQL base URL (no /api/v1/query).
      Empty selects RHOBS stage or prod hcp endpoint from OCM_FVT_OCM_ENV.
  - name: OCM_FVT_RHOBS_OIDC_DIR
    default: ""
    documentation: |-
      Optional override for RHOBS OIDC credential mount dir.
      Empty selects /usr/local/rhobs-oidc-staging or -production from OCM_FVT_OCM_ENV.
  - name: OCM_FVT_BACKPLANE_CREDENTIALS_DIR
    default: "/usr/local/rosa-clusters-service-sandbox"
    documentation: |-
      Dir with backplane_client_id/secret. Mount ci/rosa-clusters-service-sandbox
      when OCM_FVT_USE_BACKPLANE=true (see longrunning ref).
  - name: OCM_FVT_BACKPLANE_OCM_URL
    default: "https://api.openshift.com"
    documentation: |-
      OCM API for ocm login before backplane (Hive clusters use production API).
  - name: OCM_FVT_BACKPLANE_PROXY_URL
    default: "http://squid.corp.redhat.com:3128"
    documentation: |-
      Corp proxy for backplane from the build farm.
  - name: OCM_FVT_BACKPLANE_ELEVATE_REASON
    default: "https://issues.redhat.com/browse/ROSAENG-62717"
    documentation: |-
      Audit reason passed to ocm-backplane elevate.
  - name: OCM_FVT_OCM_CLI_VERSION
    default: "1.0.15"
    documentation: |-
      ocm CLI version (no v prefix). Keep in sync with rosa-clusters-service build/backplane.py.
  - name: OCM_FVT_BACKPLANE_CLI_VERSION
    default: "0.11.0"
    documentation: |-
      ocm-backplane CLI version (no v prefix).
  - name: OCM_FVT_OC_VERSION
    default: "stable"
    documentation: |-
      oc client version (stable or e.g. 4.19.0).
  - name: OCM_FVT_BACKPLANE_CREDS
    default: "false"
    documentation: |-
      Set to "true" to export BACKPLANE_CLIENT_ID and BACKPLANE_CLIENT_SECRET
      from /usr/local/cs-qe-credentials into the podman container. Simpler
      alternative to OCM_FVT_USE_BACKPLANE when only credentials are needed.
  documentation: |-
    Run ocmtest in nested podman using the rosa-backend-tests image.

    Publication writes ocm-fvt-artifact-audit.json next to ocm-fvt-results.
    It records only what this step did with each artifact before handing it
    over: published, with the byte count copied; excluded, with a reason;
    directory; whether the merged junit-ocm-fvt-report.xml reached
    ARTIFACT_DIR and how many report.xml copies were published; and an
    inventory of ARTIFACT_DIR as the step hands it to the Prow sidecar, with a
    byte count per file. Both lists are sorted and then capped, and the cap
    and the number of records dropped by it are reported alongside them.

    Exclusion reasons are a fixed set. unreadable and irregular name the entry
    concerned, because the name is the diagnostic. private-state does not:
    .datainfo, cluster.ini, kubeconfig and *.kubeconfig are held back exactly
    because they are named after cluster state, and they are the one group
    that never becomes a published object, so they are recorded as a count per
    directory, carrying the rule that matched - datainfo, cluster-ini,
    kubeconfig or kubeconfig-named - in its own rule field, and never their
    own names.

    When publication refuses an entry it records that entry with disposition
    failed and the same fixed reason the run reports, so the manifest names
    which artifact stopped it rather than only that something did. Those
    records are kept outside the entry cap, since they are the ones a reader
    needs most when publication did not finish. A refused entry that is itself
    private-state carries its directory and the matching rule instead of its
    name, so refusing one never discloses what excluding it withholds.

    Before publication the step also writes ocm-fvt-failure-summary.json from
    the per-phase Ginkgo JSON reports in the private output tree. The verbose
    reports and the merged junit are the only record of which cases failed,
    and a whole one of them can be replaced after upload, so the summary keeps
    that one question answerable. It is a projection, not a copy: for each
    known phase it reports a fixed state - parsed, partial,
    unavailable, unreadable, oversized, malformed or ambiguous - how many
    reports were seen, read and dropped by a cap, a spec count per Ginkgo
    state, and one record per failed, aborted, panicked, interrupted or timed
    out spec carrying the phase, that state, and the numeric case id when the
    spec names exactly one case - identified as tag, none, conflicting or
    truncated. The case tag is the @id_<number> convention these suites use;
    public artifacts put it in the spec's own name rather than in a Ginkgo
    label, so both are read, the tag has to stand alone as a whole token, and
    only the number is kept. Two different tags are reported as conflicting
    and a scan that hit its budget as truncated, because in neither case can
    the summary say which case failed. Phases are read in run order and every limit is
    applied per phase, so a teardown that fails every spec cannot push the
    test phases out of the summary; what a limit did drop is counted on the
    phase that lost it, and a phase that lost a report to a cap is reported
    as partial rather than parsed.

    A report is named <phase>_<HHMMSS>.<xml|json> inside
    test-result-<job>-<timestamp>/, and the phase part is chosen by the run:
    some jobs put their own job name there. The helper matches that name by
    shape and maps it onto a list of phase names fixed in its source -
    pre-env-validation, pre-vpc-cleaner, pre-cluster-creation, Day1Post,
    Day1PostE2E, CPUpgrade, Day2Pre, Day2CH, Day2E2E, Destructive,
    post-alerts and post-clean, in the order the public artifacts show them
    running. Anything else with the shape of a report, including a job-named
    one, is counted under the fixed phase "other" and its own name is never
    emitted, so a job added later is still summarised and still cannot put
    text of its own into the artifact. The list comes from public Prow
    artifacts alone: a sample of 988 per-phase reports across six
    openshift-online/rosa-e2e ocm-fvt job families in
    test-platform-results-public. The artifact metadata collector classifies
    report names the same way, so its labels cover the same phases.

    Every field is a member of a vocabulary fixed in the helper or a bounded
    integer. No spec text, label, author tag, failure message, stack trace,
    resource identifier, file name, timestamp or URL is emitted, and no source
    location: a report's file name comes from the private test repository and
    no public vocabulary says which basenames are legitimate, so the summary
    omits the location rather than copying arbitrary text out of an object
    that censoring may have removed. Reading is bounded and fails closed -
    symlinks are not followed, only the per-phase JSON names are opened, and
    an oversized, malformed - including a report the run never finished
    writing - or unexpectedly shaped report is reported as that state rather
    than parsed. Summarising is best effort and
    runs after the test container has exited, so it cannot change the suite's
    exit status, its teardown or its reports.

    The summary is an uploaded artifact like the others and is scanned like
    the others. Holding no content from the reports is what makes it unlikely
    to match, and this step claims no more than that: what the scanner does
    with any object is decided after upload, outside this repository.

    Uploaded artifacts are pattern-scanned after upload as well, and a whole
    matching object is then replaced with a short notice, which makes a report
    that was never produced indistinguishable from one that was published and
    replaced. Comparing a byte count in the manifest with the object actually
    served tells those two apart. It does not explain a removal: why an object
    was replaced is decided after upload, outside this repository, and the
    manifest claims nothing about it.

    The manifest holds names, byte counts, errno integers and fixed reason
    categories only. No file is read for it, no artifact content, secret
    value, fragment or hash is emitted, and no exception text is copied, so it
    cannot reproduce anything either censoring layer removed. The names it
    does carry are rendered over a restricted character set with token-shaped
    runs reduced to their length, so that the manifest does not become the
    artifact the scanner replaces.
