chain:
  as: rosa-e2e-ocm-fvt-validate-customer-idp
  env:
  - name: FVT_CASE_LABEL_FILTER
    default: "config-idp"
    documentation: |-
      Ginkgo label filter selecting the FVT IDP variant cases: both
      cases/cms/cluster_idp_test.go (classic) and
      cases/cms/hcp_identity_providers_test.go (HCP) in rosa-backend-tests
      carry the config-idp label (pkg/label/config_labels.go), so this
      selects exactly those specs. Composed with the profile's own label
      filters via && by ocmtest (cmd/ocmtest/test/exec.go). Override at the
      workflow or job level to widen or narrow the selection.
  steps:
  - ref: rosa-e2e-ocm-fvt-validate-customer
  documentation: |-
    IDP-variant selection of the customer-facing FVT (ocm-backend-tests) cases
    (ROSAENG-67780, spun out of the gap analysis in ROSAENG-67586): the FVT
    suite covers multiple identity provider types (LDAP, GitHub, Google, OIDC,
    htpasswd variants) that had no corresponding ROSAENG-308 story.

    Pure composition over rosa-e2e-ocm-fvt-validate-customer (ROSAENG-67586):
    the same SHARED_DIR contract (cluster-id + customer-plane kubeconfig), the
    same ocmtest test-phase-only invocation with deferred clean, and the same
    cs-qe-credentials handling. This chain only pins the case-selection label
    filter to config-idp; everything else is inherited from the wrapped ref.
    The FVT suite and its harness stay owned by CS/OCM QE.

    The consuming workflow or job must still provide OCM_FVT_JOB_NAME
    selecting an FVT profile whose case set includes the IDP variants
    (DRAFT: profile name to be confirmed with CS/OCM QE). The IDP cases
    self-configure their identity providers against the composed cluster via
    the OCM API (CreateClusterIDP et al. in cluster_idp_test.go /
    hcp_identity_providers_test.go), so no pre-configuration steps are
    needed; the remaining open question for CS/OCM QE is whether any variant
    (e.g. the Google/GitHub action cases) needs credentials beyond the
    existing cs-qe-credentials collection or a GINKGO_SKIP for now.
