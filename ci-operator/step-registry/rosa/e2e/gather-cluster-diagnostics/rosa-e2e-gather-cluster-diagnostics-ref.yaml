ref:
  as: rosa-e2e-gather-cluster-diagnostics
  from_image:
    namespace: ocp
    name: "4.18"
    tag: cli
  commands: rosa-e2e-gather-cluster-diagnostics-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
  grace_period: 30s
  credentials:
  - collection: ocm-fvt-credentials
    group: cs-qe-credentials
    mount_path: /usr/local/cs-qe-credentials
  env:
  - name: GATHER_OCM_ENV
    default: "staging"
    documentation: |-
      OCM environment for login. Determines the OCM API URL.
      Valid values: staging, production, integration.
  - name: GATHER_BACKPLANE_PROXY_URL
    default: "http://squid.corp.redhat.com:3128"
    documentation: |-
      Corp proxy URL for ocm-backplane from the build farm.
  - name: GATHER_OCM_CLI_VERSION
    default: "1.0.15"
    documentation: |-
      ocm CLI version to install (no v prefix).
  - name: GATHER_BACKPLANE_CLI_VERSION
    default: "0.11.0"
    documentation: |-
      ocm-backplane CLI version to install (no v prefix).
  documentation: |-
    Collects allowlisted CMS cluster, status and live-resource observations before
    attempting guest access. Uses existing OCM authentication and API permissions;
    no cloud queries, management-cluster login, elevation or new credentials.
    Rejects malformed or ambiguous shared IDs. If IDs are absent, requires the
    FVT run-bound recording handoff. A name lookup must match its immutable ID,
    exactly one exact-name API result, and creation within the run window.
    Name-only identity without immutable proof is explicitly unsupported.
    Writes collection-outcome.json even when identity, access, APIs or tools are
    unavailable. Operator logs are unsupported without a predefined authorized
    access path. Does not infer a root cause from missing observations.
    Guest oauth-apiserver/etcd logs are summarized as fixed signal counts;
    only allowlisted status/condition values are published, never raw responses,
    messages, specs, credentials, event text or resource identifiers.
    Each command has a deadline and output cap, with a 450-second total budget.
    Exits 0 on all failures and does not change test status or cluster cleanup.
