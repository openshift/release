workflow:
  as: rosa-e2e-classic-privatelink
  steps:
    env:
      CHANNEL_GROUP: stable
      HOSTED_CP: "false"
      STS: "true"
      MULTI_AZ: "false"
      REPLICAS: "2"
      ZONES_COUNT: "1"
      CLUSTER_TOPOLOGY: classic
      LABEL_FILTER: "Platform:Classic && !Access:MC && !Access:PublicAPI"
      # PrivateLink cluster specifics: private API, private default ingress, BYO VPC.
      ENABLE_BYOVPC: "true"
      PRIVATE: "true"
      PRIVATE_LINK: "true"
    pre:
      - ref: aws-provision-vpc-shared
      - ref: aws-provision-tags-for-byo-vpc-ocm-pre
      - ref: rosa-cluster-prefix
      - ref: rosa-sts-account-roles-create
      - ref: rosa-cluster-provision
      - ref: rosa-cluster-wait-ready-cluster
      - ref: rosa-cluster-notify-error
      # The cluster API is only reachable via backplane from here on. This step
      # writes ${SHARED_DIR}/kubeconfig and ${SHARED_DIR}/proxy-conf.sh, which the
      # subsequent oc-based steps consume.
      - ref: rosa-cluster-credentials-backplane
      - ref: rosa-cluster-wait-ready-operators
      - ref: aws-provision-tags-for-byo-vpc
      - ref: rosa-cluster-wait-ready-nodes
    test:
      - ref: rosa-e2e-test
    post:
      - ref: rosa-gap-analysis-api-resources-and-crd
        best_effort: true
      - ref: rosa-gap-analysis-critical-alerts
        best_effort: true
      - ref: rosa-gap-analysis-cluster-install-delete-metrics
        best_effort: true
      - chain: rosa-cluster-deprovision
        best_effort: true
      - ref: rosa-sts-account-roles-delete
        best_effort: true
      - ref: rosa-e2e-cleanup-vpc
        best_effort: true
      - ref: aws-deprovision-stacks
        best_effort: true
  documentation: |-
    This workflow provisions a ROSA Classic STS PrivateLink cluster (private API,
    private default ingress, BYO VPC) whose API server is not reachable directly
    from the build farm. It obtains a backplane (backplane-cluster-admin)
    kubeconfig after the cluster is ready in OCM and before any step talks to the
    cluster API. It then runs the rosa-e2e managed service validation suite
    filtered to Classic-compatible tests, writes rosa-gap-analysis snapshots, and
    tears everything down.
