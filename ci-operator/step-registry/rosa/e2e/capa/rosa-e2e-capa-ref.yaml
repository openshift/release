ref:
  as: rosa-e2e-capa
  from: ansible
  grace_period: 10m
  timeout: 4h0m0s
  cli: latest
  commands: rosa-e2e-capa-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  credentials:
  - collection: rosa-capa
    group: rosa-hcp-e2e-secrets
    mount_path: /var/run/rosa-hcp-e2e-secrets
  - collection: rosa-capa
    group: rosa-e2e-aws-creds
    mount_path: /var/run/rosa-e2e-aws-creds
  env:
  - name: ROSA_HCP_E2E_REPO
    default: "https://github.com/stolostron/rosa-hcp-e2e-test"
    documentation: Repository URL for the stolostron rosa-hcp-e2e-test project.
  - name: ROSA_HCP_E2E_BRANCH
    default: "main"
    documentation: Branch of the rosa-hcp-e2e-test repository to use.
  - name: REGION
    default: "us-east-1"
    documentation: The AWS region for the ROSA HCP cluster.
  - name: DEPLOYMENT_MODE
    default: "standalone"
    documentation: Deployment mode for CAPI installation (standalone or mce).
  - name: TEST_SUITE
    default: "--list"
    documentation: Test suite argument passed to run-test-suite.py (e.g. 10-install-capi-standalone, --tag standalone, --all).
  - name: OPENSHIFT_VERSION
    default: ""
    documentation: OpenShift version to provision (e.g. 4.22). If empty, uses the default from the test repo.
  - name: CHANNEL_GROUP
    default: ""
    documentation: OCM version channel group (stable, nightly, candidate). If empty, uses the default from the test repo.
  - name: RESERVE_UPGRADE_PATH
    default: ""
    documentation: When set to "true", provisions a version that has available upgrades instead of the latest.
  - name: CLUSTER_API_INSTALLER_REF
    default: "main"
    documentation: Branch/ref of stolostron/cluster-api-installer to install CAPA from (e.g. backplane-2.17). Selects the CAPA version under test.
  documentation: |-
    Clones the stolostron/rosa-hcp-e2e-test repository and runs the
    ROSA HCP e2e test suite against the management cluster with
    CAPI/CAPA controllers already installed.

    Besides rosa-hcp-e2e-test.log, the step makes a best-effort attempt to
    write rosa-hcp-e2e-test-summary.json: a bounded summary of the runner's
    own JUnit report, holding how many testcases passed, failed, errored or
    were skipped, plus a record per testcase giving its outcome. Records stop
    at a fixed cap; past it the totals stay complete and the surplus is
    counted in cases_dropped. A report holding more testcases than a second,
    much larger cap is refused outright instead. A failed run therefore keeps
    structured evidence of how much of the suite ran and how it ended, which
    the log alone does not make machine readable.

    A record identifies its testcase by a generated ordinal - its position in
    the report, not a key into the log - and never by name. The runner's
    reports embed free-form ansible output - captured playbook stdout, failure
    messages, feature detail, local paths - and this artifact is published
    publicly, so no text from the report reaches it. The log remains the place
    to read what actually happened.

    Writing the summary never changes the step's outcome. When the report
    cannot be summarised - none found, more than one, malformed, oversized or
    not plainly UTF-8 - the file records a fixed reason token and no results,
    rather than results that could not be established. Publication is not
    unconditional and there is no placeholder: the step creates the artifact
    with O_CREAT|O_EXCL|O_NOFOLLOW and so refuses an existing destination of
    any kind, and it removes a partially written one. A run can therefore end
    with no summary file at all, which is distinct from one recording a
    reason.
