workflow:
  as: rosa-e2e-hcp-shared-vpc
  steps:
    env:
      CHANNEL_GROUP: stable
      HOSTED_CP: "true"
      REPLICAS: "3"
      # Shared VPC row (ROSAENG-63353): the PHZ and the shared VPC role are
      # created in a second AWS account (${CLUSTER_PROFILE_DIR}/.awscred_shared_account,
      # ENABLE_SHARED_PHZ), and rosa-cluster-provision adds
      # --base-domain/--private-hosted-zone-id/--shared-vpc-role-arn
      # (ENABLE_SHARED_VPC).
      ENABLE_SHARED_VPC: "yes"
      ENABLE_SHARED_PHZ: "yes"
      # OCM validates the ingress PHZ name against
      # 'cluster_domain_prefix.base_domain': HCP records live under
      # rosa.<cluster>.<base-domain>, so the zone carries the 'rosa.' prefix.
      PHZ_NAME_PREFIX: "rosa."
      # Scoped to the rosa-e2e Feature:SharedVPC specs. Env on the workflow
      # step list is silently dropped by the registry resolver for ref steps;
      # only this map overrides the validate-customer ref's default filter.
      LABEL_FILTER: "Feature:SharedVPC"
      # The workflow env map applies to every step declaring the parameter, so
      # LABEL_FILTER would leak into the platform step (whose filter falls
      # back to LABEL_FILTER). Pin the platform plane to its area selection.
      PLATFORM_LABEL_FILTER: "Area:ManagementPlane"
    pre:
    - ref: rosa-cluster-dnsdomain-create
    - ref: aws-provision-vpc-shared
    - ref: aws-provision-tags-for-byo-vpc-ocm-pre
    # Creates the private hosted zone and the shared install role/policy in
    # the shared account, associated with the CI-account VPC, and publishes
    # hosted_zone_id / hosted_zone_role_arn / shared_install_policy_arn /
    # cluster-name to ${SHARED_DIR}.
    - ref: aws-provision-route53-private-hosted-zone
    - chain: rosa-sts-oidc-config-create
    # Adds the cluster installer role (and the ingress-operator role, BYO_OIDC
    # is auto-enabled for HCP) to the shared role's trust principals.
    - ref: rosa-conf-shared-vpc-update-trust-policy
    # HCP shared VPC requires two more shared-account resources rosa create
    # cluster validates: the VPC endpoint role and the internal communication
    # hosted zone (plus the control-plane-operator trust principal and the
    # assume-role permission policies). Runs after the oidc-config chain so
    # the operator role ARNs exist.
    - ref: rosa-e2e-hcp-shared-vpc-prepare
    - chain: rosa-cluster-provision
    # Publish the SHARED_DIR provisioner-to-validator contract (cluster-id,
    # kubeconfig, cluster-metadata.json, ROSAENG-67580) after the rosa-CLI head
    # has provisioned the cluster.
    - ref: rosa-e2e-rosa-cli-publish-contract
    - ref: aws-provision-tags-for-byo-vpc
    - ref: rosa-cluster-wait-ready-hosted-cp
    - ref: rosa-cluster-wait-ready-nodes
    # Platform-plane access: bp-kubeconfig / mc-kubeconfig via backplane
    # (ROSAENG-67580).
    - ref: rosa-backplane-login
    test:
    # Scoped to the rosa-e2e Feature:SharedVPC specs: the customer step
    # validates that the cluster's API and ingress DNS records are served
    # from the cross-account private hosted zone. The spec carries no Area or
    # Platform labels beyond the shared VPC feature, so this LABEL_FILTER is
    # its sole selector; it skips on clusters not provisioned with a shared
    # VPC, keeping the general matrix rows unaffected.
    - ref: rosa-e2e-validate-customer
    # Platform plane with its default Area:ManagementPlane filter: the
    # shared VPC role trust spec (Feature:SharedVPC + Area:ManagementPlane)
    # validates that the installer role is a trusted principal of the shared
    # account role, alongside the general management-plane tail.
    - ref: rosa-e2e-validate-platform
    post:
    # Not best-effort: the PHZ and shared-account resources below must not be
    # deleted while the cluster still references them.
    - chain: rosa-cluster-deprovision
    - chain: rosa-sts-oidc-config-delete
      best_effort: true
    # Deletes the PHZ, shared role and shared policy in the shared account.
    - ref: aws-deprovision-route53-private-hosted-zone
      best_effort: true
    # Deletes the HCP-only shared VPC resources (internal communication hosted
    # zone, VPC endpoint role and policy, assume-role permission policies).
    - ref: rosa-e2e-hcp-shared-vpc-cleanup
      best_effort: true
    - ref: rosa-e2e-cleanup-vpc
      best_effort: true
    - ref: aws-deprovision-stacks
      best_effort: true
    - ref: rosa-cluster-dnsdomain-delete
      best_effort: true
    # Not best-effort orphan gate (ROSAENG-61409): fails the job if the
    # hosted zone, shared role, shared policy, VPC endpoint role/policy or
    # internal communication hosted zone survived the teardown.
    - ref: rosa-e2e-validate-shared-vpc-teardown
  documentation: |-
    The shared VPC row of the ROSAENG-308 provision x validate matrix
    (ROSAENG-63353): the rosa-CLI head provisions an HCP cluster in a shared
    VPC - rosa-cluster-dnsdomain-create claims a customer-managed base domain,
    aws-provision-route53-private-hosted-zone creates the private hosted zone
    and the shared install role/policy in a second AWS account
    (ENABLE_SHARED_PHZ, ${CLUSTER_PROFILE_DIR}/.awscred_shared_account),
    rosa-conf-shared-vpc-update-trust-policy grants the cluster installer role
    access to it, and rosa-e2e-hcp-shared-vpc-prepare creates the two
    shared-account resources rosa create cluster additionally requires for
    HCP shared VPC clusters (the VPC endpoint role and the internal
    communication hosted zone) plus the control-plane-operator trust principal
    and the assume-role permission policies. The validation tail is
    provisioner-agnostic: the customer step runs the rosa-e2e
    Feature:SharedVPC specs (cross-account DNS records in the shared private
    hosted zone), while the platform step runs its Area:ManagementPlane
    selection, which includes the shared VPC role trust spec. The post phase
    ends with rosa-e2e-validate-shared-vpc-teardown, a non-best-effort orphan
    gate that fails the job if shared-account resources survive the teardown
    (ROSAENG-61409).

    The cluster profile must carry .awscred_shared_account: the rosa-e2e-01
    profile's GSM group (rosa-e2e/rosa-e2e-prow-ci-01) needs the second AWS
    account credentials added before this workflow can run against it. The
    platform plane requires corp-network reachability: run this workflow only
    where backplane is reachable (capabilities: [intranet],
    restrict_network_access: false, network-access-rehearsals-ok label for
    rehearsals).
