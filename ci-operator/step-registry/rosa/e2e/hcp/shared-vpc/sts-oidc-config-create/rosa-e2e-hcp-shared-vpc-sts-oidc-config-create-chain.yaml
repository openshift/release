chain:
  as: rosa-e2e-hcp-shared-vpc-sts-oidc-config-create
  steps:
  - ref: rosa-cluster-prefix
  - ref: rosa-sts-account-roles-create
  - ref: rosa-sts-oidc-config-create
  - ref: rosa-e2e-hcp-shared-vpc-operator-roles-create
  documentation: >-
    rosa/e2e scoped variant of rosa-sts-oidc-config-create for the HCP shared
    VPC workflow (ROSAENG-63353): identical except the operator roles step is
