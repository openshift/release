ref:
  as: rosa-e2e-hcp-shared-vpc-dnsdomain-create
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-e2e-hcp-shared-vpc-dnsdomain-create-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: The environment for rosa login. The supported values are [production, staging, integration].
  documentation: |-
    The step uses rosa cli to create a Hosted Control Plane architecture DNS
    domain (--hosted-cp): rosa-cluster-dnsdomain-create claims a
    classic-architecture domain, which rosa create cluster rejects for HCP
    clusters (HCP requires the hcp-architecture parent domain, s3.devshift.org
    in staging).
