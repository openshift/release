ref:
  as: rosa-e2e-hcp-shared-vpc-prepare
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-e2e-hcp-shared-vpc-prepare-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: REGION
    default: ""
    documentation: Cloud region for the shared-account resources. Falls back to LEASED_RESOURCE if empty.
  documentation: |-
    Prepares the additional shared-account resources an HCP shared VPC cluster
    needs (ROSAENG-63353): rosa create cluster requires
    --vpc-endpoint-role-arn and --hcp-internal-communication-hosted-zone-id for
    Hosted Control Plane shared VPC clusters. Using
    ${CLUSTER_PROFILE_DIR}/.awscred_shared_account, creates the internal
    communication hosted zone (<cluster>.hypershift.local) associated with the
    shared VPC, the VPC endpoint policy and role (trusting the cluster account's
    installer and control-plane-operator roles), and adds the
    control-plane-operator role to the shared route53 role's trust principals.
    Then, with the cluster account credentials, attaches the
    <shared-role>-assume-role permission policies to the installer,
    ingress-operator and control-plane-operator roles (what rosa create
    account-roles/operator-roles attach when run with the shared VPC flags).
    Publishes vpc_endpoint_role_arn, vpc_endpoint_policy_arn and
    hcp_internal_communication_hosted_zone_id to ${SHARED_DIR} for
    rosa-cluster-provision and the post-phase cleanup and orphan gate.
