ref:
  as: rosa-e2e-hcp-zero-egress-vpc-cleanup
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-e2e-hcp-zero-egress-vpc-cleanup-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Delete the VPC endpoints and endpoint security group created by
    rosa-e2e-hcp-zero-egress-vpc-prepare. VPC endpoints block VPC deletion, so
    this step must run (best-effort) before rosa-e2e-cleanup-vpc and
    aws-deprovision-stacks.
