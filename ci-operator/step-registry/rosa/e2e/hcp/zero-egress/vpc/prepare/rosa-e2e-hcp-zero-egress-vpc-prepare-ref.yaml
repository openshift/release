ref:
  as: rosa-e2e-hcp-zero-egress-vpc-prepare
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-e2e-hcp-zero-egress-vpc-prepare-commands.sh
  env:
  - name: REGION
    default: ""
    documentation: Use a specific AWS region, overriding the LEASED_RESOURCE environment variable in the cluster_profile. Must match the region used by aws-provision-vpc-shared.
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Prepare the BYO VPC for a zero-egress ROSA HCP cluster (ROSAENG-66391):
    create the ecr.api and ecr.dkr interface endpoints and the s3 gateway
    endpoint required to reach the provision shard's ECR mirror, and remove
    the NAT routes from the VPC's route tables so the cluster has no outbound
    internet path. Public subnets keep their internet-gateway routes so the
    API and ingress load balancers stay reachable. Endpoint and security
    group IDs are recorded in SHARED_DIR for
    rosa-e2e-hcp-zero-egress-vpc-cleanup. Must run after
    aws-provision-vpc-shared and before rosa-cluster-provision.
