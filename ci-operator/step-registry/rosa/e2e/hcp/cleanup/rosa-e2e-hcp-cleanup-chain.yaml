chain:
  as: rosa-e2e-hcp-cleanup
  steps:
  - chain: rosa-cluster-deprovision
  - chain: rosa-sts-oidc-config-delete
  - ref: rosa-e2e-cleanup-vpc
  - ref: aws-deprovision-stacks
  - chain: rosa-gather-hcp-diagnostics
  documentation: |-
    Cleans up a ROSA HCP test cluster without running gap-analysis collection.
    Leftover VPC resources are removed before deleting the CloudFormation stacks,
    and HCP diagnostics are collected after the infrastructure cleanup attempts.
