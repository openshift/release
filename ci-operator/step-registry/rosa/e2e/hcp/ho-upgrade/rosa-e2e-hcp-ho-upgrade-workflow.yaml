workflow:
  as: rosa-e2e-hcp-ho-upgrade
  steps:
    env:
      CHANNEL_GROUP: stable
      HOSTED_CP: "true"
      REPLICAS: "2"
    pre:
      - ref: rosa-hypershift-operator-deploy-previous
      - chain: rosa-aws-sts-hcp-provision
      - ref: rosa-cluster-wait-ready-hosted-cp
      - ref: rosa-cluster-wait-ready-nodes
      - ref: rosa-cluster-credentials-hypershift-mgmt
    test:
      - ref: rosa-e2e-test
      - ref: rosa-hypershift-operator-deploy
      - ref: rosa-hypershift-operator-verify-hcp-health
    post:
      - ref: rosa-gap-analysis-api-resources-and-crd
        best_effort: true
      - ref: rosa-gap-analysis-critical-alerts
        best_effort: true
      - ref: rosa-gap-analysis-cluster-install-delete-metrics
        best_effort: true
      - chain: rosa-cluster-deprovision
        best_effort: true
      - chain: rosa-sts-oidc-config-delete
        best_effort: true
      - ref: rosa-e2e-cleanup-vpc
        best_effort: true
      - ref: aws-deprovision-stacks
        best_effort: true
      - chain: rosa-gather-hcp-diagnostics
        best_effort: true
      - ref: rosa-hypershift-operator-restore
        best_effort: true
  documentation: |-
    This workflow tests a HyperShift Operator upgrade. It deploys the previous
    (latest-1) HO build, provisions a ROSA HCP cluster, runs the rosa-e2e test
    suite, upgrades HO to the latest build, verifies that HostedClusters remain
    healthy, and then cleans up. The HO is restored to its original image in the
    post phase.
