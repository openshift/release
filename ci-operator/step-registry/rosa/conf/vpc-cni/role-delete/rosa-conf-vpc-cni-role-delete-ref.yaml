ref:
  as: rosa-conf-vpc-cni-role-delete
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-conf-vpc-cni-role-delete-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Deletes the IRSA role created by rosa-conf-vpc-cni
    (${SHARED_DIR}/aws-vpc-cni-role-name). The standard
    rosa-aws-sts-hcp-deprovision chain does not know about this extra role and
    would leak it. A no-op when the marker file is absent, so it is safe as a
    best-effort post step on any job.
