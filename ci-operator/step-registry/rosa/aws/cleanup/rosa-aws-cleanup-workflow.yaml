workflow:
  as: rosa-aws-cleanup
  steps:
    env:
      RESOURCE_AGE_HOURS: "24"
      CLEAN_IAM: "true"
      DRY_RUN: "false"
    test:
    - ref: rosa-aws-cleanup-resources
  documentation: |-
    Cleans ROSA CI-owned AWS resources older than 24 hours from the account
    supplied by the cluster profile. Stack deletion requests are asynchronous
    and non-blocking; failures are logged and retried by a future run. The
    workflow also cleans global IAM roles, policies, and ROSA-managed OIDC
    providers that use the ROSA CI ownership conventions.
