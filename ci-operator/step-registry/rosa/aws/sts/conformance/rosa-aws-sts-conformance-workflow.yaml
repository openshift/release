workflow:
  as: rosa-aws-sts-conformance
  steps:
    env:
      CHANNEL_GROUP: nightly
      CLEAR_CLUSTERVERSION_CHANNEL: "true"
      OPENSHIFT_VERSION: "release:latest"
      SKIP_MONITOR_TEST: "true"
    pre:
      - chain: rosa-aws-sts-provision
      - ref: osd-ccs-conf-idp-htpasswd-multi-users
      - ref: rosa-cluster-wait-ready-nodes
    test:
      - ref: rosa-aws-sts-conformance-test
    post:
      - ref: rosa-gather-rhobs-logs
        best_effort: true
      - ref: osd-gather-extra
        best_effort: true
      - chain: rosa-aws-sts-deprovision
        best_effort: true
      - ref: rosa-cluster-cleanup-vpc
        best_effort: true
      - ref: send-results-to-reportportal
  documentation: |-
    This workflow installs a rosa sts cluster and performs openshift-tests conformance testing.
