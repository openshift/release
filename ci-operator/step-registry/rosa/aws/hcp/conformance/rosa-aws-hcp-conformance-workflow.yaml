workflow:
  as: rosa-aws-hcp-conformance
  steps:
    env:
      CHANNEL_GROUP: nightly
      CLEAR_CLUSTERVERSION_CHANNEL: "true"
      HOSTED_CP: "true"
      OCM_LOGIN_ENV: staging
      OPENSHIFT_VERSION: "release:latest"
      REPLICAS: "3"
      SKIP_MONITOR_TEST: "true"
      TEST_SKIPS: >-
        Services should be able to change the type from ExternalName to ClusterIP\|
        Services should be able to change the type from ExternalName to NodePort\|
        Services should be able to change the type from NodePort to ExternalName\|
        Services should be able to create a functioning NodePort service\|
        CSI Volume expansion should expand volume without restarting pod\|
        CSI Volumes CSI Topology test using GCE PD driver.*should provision zonal PD\|
        In-tree Volumes.*\[Driver: nfs\].*volumes should store data\|
        PersistentVolumes CSI Default StorageClass should be created\|
        PersistentVolumes CSI Default StorageClass should create and delete\|
        CSI Volumes.*csi-hostpath.*ephemeral should create read.write inline ephemeral volume\|
        In-tree Volumes.*local.*LocalVolumeType: dir.*subPath should be able to unmount\|
        In-tree Volumes.*local.*LocalVolumeType: tmpfs.*volumes should store data\|
        In-tree Volumes.*local.*LocalVolumeType: tmpfs.*volumeMode should not mount
    pre:
      - chain: rosa-aws-sts-hcp-provision-nightly
      - ref: rosa-cluster-credentials-hypershift-mgmt
      - ref: osd-ccs-conf-idp-htpasswd-multi-users
      - ref: rosa-cluster-wait-ready-nodes
    test:
      - chain: hypershift-conformance
    post:
      - chain: rosa-gather-hcp-diagnostics
        best_effort: true
      - ref: osd-gather-extra
      - ref: rosa-cluster-mc-restore-image-policy
      - chain: rosa-cluster-deprovision
        best_effort: true
      - chain: rosa-sts-oidc-config-delete
        best_effort: true
      - ref: rosa-e2e-cleanup-vpc
        best_effort: true
      - ref: aws-deprovision-stacks
        best_effort: true
      - ref: send-results-to-reportportal
  documentation: |-
    This workflow installs a rosa hcp cluster and performs openshift-tests conformance testing.
