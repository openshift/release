ref:
  as: rosa-trusted-actions-openwiki-publish
  from: claude-ai-helpers
  commands: rosa-trusted-actions-openwiki-publish-commands.sh
  grace_period: 5m
  env:
  - name: TARGET_REPO
    default: openshift-online/rosa-trusted-actions
    documentation: Repository in owner/repo form.
  - name: TARGET_BASE_BRANCH
    default: main
    documentation: Base branch for documentation PRs.
  - name: TARGET_UPDATE_BRANCH
    default: openwiki/update
    documentation: Branch holding generated wiki updates.
  - name: TARGET_PERIODIC_JOB
    default: periodic-ci-openshift-online-rosa-trusted-actions-main-openwiki-openwiki-update
    documentation: Exact scheduled job authorized to publish. Rehearsals validate without writes.
  credentials:
  - collection: rosa-boundary
    group: ci
    field: github-app-app-id
    mount_path: /var/run/rosa-boundary-github-app-id
  - collection: rosa-boundary
    group: ci
    field: github-app-installation-id
    mount_path: /var/run/rosa-boundary-github-app-installation
  - collection: rosa-boundary
    group: ci
    field: github-app-pem
    mount_path: /var/run/rosa-boundary-github-app-key
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  documentation: |-
    Authenticate with the GitHub App independently of the model step, apply
    only the generated openwiki/ patch to a fresh clone, and open or update the PR.
    Rehearsals validate the patch without committing, pushing, or opening a PR.
    Report OpenWiki failures after publishing completed pages.
