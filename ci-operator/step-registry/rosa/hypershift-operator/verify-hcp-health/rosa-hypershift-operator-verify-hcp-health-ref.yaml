ref:
  as: rosa-hypershift-operator-verify-hcp-health
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-hypershift-operator-verify-hcp-health-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OCM_LOGIN_ENV
    default: "integration"
    documentation: The OCM environment to log into. Supported values are [production, staging, integration].
  - name: CLUSTER_SECTOR
    default: ""
    documentation: The OSDFM sector to look up the management cluster from.
  - name: REGION
    default: "us-west-2"
    documentation: The AWS region to filter service clusters by.
  documentation: |-
    Verifies that HostedClusters and NodePools remain healthy after a HyperShift
    operator upgrade on the management cluster. Waits for HO rollout to stabilize,
    then checks HostedCluster conditions, NodePool readiness, and pod restart counts
    in the hypershift namespace.
