ref:
  as: rosa-hypershift-operator-deploy
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-hypershift-operator-deploy-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OCM_LOGIN_ENV
    default: "integration"
    documentation: The OCM environment to log into. Supported values are [production, staging, integration].
  - name: CLUSTER_SECTOR
    default: ""
    documentation: The OSDFM sector to look up the management cluster from.
  - name: REGION
    default: "us-west-2"
    documentation: The AWS region to filter service clusters by.
  documentation: |-
    Deploys the latest HyperShift operator image from the RHTAP build pipeline
    (quay.io/acm-d/rhtap-hypershift-operator) to the management cluster in the
    specified OSDFM sector. Resolves the latest image via the Quay API.
