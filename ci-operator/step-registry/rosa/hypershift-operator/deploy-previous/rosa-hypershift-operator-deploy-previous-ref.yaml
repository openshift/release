ref:
  as: rosa-hypershift-operator-deploy-previous
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-hypershift-operator-deploy-previous-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OCM_LOGIN_ENV
    default: "integration"
    documentation: The OCM environment to log into. Supported values are [production, staging, integration].
  - name: CLUSTER_SECTOR
    default: ""
    documentation: The OSDFM sector to look up the management cluster from.
  - name: REGION
    default: "us-west-2"
    documentation: The AWS region to filter service clusters by.
  - name: HO_VERSION_OFFSET
    default: "1"
    documentation: Offset from the latest RHTAP build tag. Defaults to 1 (second-latest) for upgrade pre-deploy.
  documentation: |-
    Deploys the second-latest (latest-1) HyperShift operator image from the
    RHTAP build pipeline (quay.io/acm-d/rhtap-hypershift-operator) to the
    management cluster. Used in HO upgrade tests to install the previous version
    before upgrading to the latest.
