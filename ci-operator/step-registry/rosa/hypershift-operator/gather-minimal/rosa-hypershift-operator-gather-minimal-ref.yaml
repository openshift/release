ref:
  as: rosa-hypershift-operator-gather-minimal
  from: rosa-aws-cli
  run_as_script: true
  commands: rosa-hypershift-operator-gather-minimal-commands.sh
  timeout: 2m
  grace_period: 10s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: HO_MINIMAL_DIAGNOSTICS
    default: "false"
    documentation: Collect a bounded allowlisted bundle in the HO upgrade workflow only.
  - name: OCM_LOGIN_ENV
    default: "integration"
    documentation: OCM environment used to validate the CI target namespace.
  documentation: |-
    Best-effort bounded structured diagnostics, also called by already-running
    HO test steps through their mounted command ConfigMap. This does not retry
    pod startup or replace full gather. See hack/rosa-ho-health-diagnostics.md.
