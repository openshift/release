ref:
  as: rosa-hypershift-operator-restore
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-hypershift-operator-restore-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: The OCM environment to log into. Supported values are [production, staging, integration].
  documentation: |-
    Restores the HyperShift operator deployment on the MC to its original image
    after a PR test run. Reads the original image from SHARED_DIR and removes
    the temporary CI registry pull secret. Must run as a best_effort post step.
