ref:
  as: rosa-cluster-allow-unsigned
  from: cli
  commands: rosa-cluster-allow-unsigned-commands.sh
  grace_period: 30s
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  documentation: |-
    Patch the cluster's ClusterImagePolicy to allow unsigned nightly images.
    Required because 4.22+ clusters enforce signature verification which
    rejects unsigned nightly OCP images.
    Must run after cluster provision and IDP setup.
    Paired with rosa-cluster-restore-image-policy post step.
