chain:
  as: rosa-cluster-deprovision-no-index
  steps:
  - chain: gather
  - ref: rosa-cluster-deprovision
  documentation: |-
    Gather diagnostics and deprovision a ROSA cluster without indexing metadata.
    Use this chain when indexing is disabled so the resolved job does not require
    the rosa-cluster-index step or its Elasticsearch credentials. To index metadata,
    use rosa-cluster-deprovision instead and set INDEX_ENABLED to "true".
