ref:
  as: rosa-cluster-deprovision
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-cluster-deprovision-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  timeout: 70m
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: The environment for rosa login. The supported values are [production, staging, integration].
  - name: STS
    default: "true"
    documentation: If the cluster is deployed with AWS Security Token Service (STS) instead of IAM credentials, it is a STS cluster.
  - name: DESTROY_TIMEOUT
    default: "3600"
    documentation: Set to number of seconds for the cluster to timeout if it's not destroyed.

  documentation: |-
    Deletes a rosa cluster using rosa cli.
    On failure, attempts to save uninstall-log-summary.txt with allowlisted log
    signature counts and collection status, without retaining raw log content.
    Collection is limited to 60 seconds plus a 5-second forced-kill grace period.
    This summary contains partial diagnostic hints, not complete root-cause
    information; zero counts do not establish the absence of deletion blockers.
    Diagnostic collection does not change the original teardown failure status.
