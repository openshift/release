ref:
  as: rosa-cluster-deprovision
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-cluster-deprovision-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  timeout: 70m
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: The environment for rosa login. The supported values are [production, staging, integration].
  - name: STS
    default: "true"
    documentation: If the cluster is deployed with AWS Security Token Service (STS) instead of IAM credentials, it is a STS cluster.
  - name: DESTROY_TIMEOUT
    default: "3600"
    documentation: Set to number of seconds for the cluster to timeout if it's not destroyed.
  - name: STS_PROPAGATION_DELAY
    default: "120"
    documentation: Seconds to wait after cluster destruction before attempting STS resource deletion, allowing OCM backend state to propagate.
  - name: STS_DELETE_RETRIES
    default: "5"
    documentation: Number of retry attempts for STS resource deletion (operator roles, OIDC provider).
  - name: STS_RETRY_INTERVAL
    default: "30"
    documentation: Seconds to wait between STS resource deletion retry attempts.

  documentation: |-
    Deletes a rosa cluster using rosa cli.
