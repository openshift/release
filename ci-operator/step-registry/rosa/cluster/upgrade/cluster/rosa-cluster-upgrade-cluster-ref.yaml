ref:
  as: rosa-cluster-upgrade-cluster
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-cluster-upgrade-cluster-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  timeout: 15h0m0s
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: The environment for rosa login. The supported values are [production, staging, integration].
  - name: HOSTED_CP
    default: "false"
    documentation: Enable the use of hosted control planes (HyperShift).
  - name: UPGRADED_TO_VERSION
    default: ""
    documentation: The openshift version that the cluster will be upgraded to. If empty, it is auto-derived as the next Y-stream newer than the cluster's current version among those offered by the discovery channel group (the group of UPGRADE_CHANNEL when that is set, otherwise UPGRADE_CHANNEL_PREFIX). The step fails rather than guessing when the version query fails or no newer Y-stream is available.
  - name: CLUTER_UPGRADE_TIMEOUT
    default: "14400"
    documentation: Set to number of seconds for the cluster to timeout if it's not ready.
  - name: NODE_UPGRADE_TIMEOUT
    default: "7200"
    documentation: Set to number of seconds for the cluster to timeout if it's not ready.
  - name: NP_MAX_UNAVAILABLE
    default: ""
    documentation: The maximum number of nodes in the machinepool that can be unavailable during the upgrade. It can be an absolute number i.e. 1, or a percentage i.e. '20%'.
  - name: NP_MAX_SURGE
    default: ""
    documentation:  The maximum number of nodes that can be provisioned above the desired number of nodes in the machinepool during the upgrade. It can be an absolute number i.e. 1, or a percentage i.e. '20%'.        
  - name: UPGRADE_CHANNEL
    default: ""
    documentation: The target upgrade channel (e.g., candidate-4.22, stable-4.22). When set, the cluster channel is changed to this value before performing the upgrade; when UPGRADED_TO_VERSION is also empty, this channel's group (everything before the last hyphen) is the group queried to discover the target Y-stream, so the target comes from the same group the cluster is moved to, and that group must itself be one of [stable, candidate, nightly] or the query fails and the step stops. If empty, auto-derived as UPGRADE_CHANNEL_PREFIX-UPGRADED_TO_VERSION.
  - name: UPGRADE_CHANNEL_PREFIX
    default: "candidate"
    documentation: Prefix used to build UPGRADE_CHANNEL when that is empty (e.g., 'candidate' produces 'candidate-4.19'). Target discovery runs only when UPGRADED_TO_VERSION is empty; it queries the group of UPGRADE_CHANNEL if that is set, otherwise this prefix, which must then name one of the supported channel groups [stable, candidate, nightly]. When UPGRADED_TO_VERSION is set, no discovery query runs, and this prefix is used only to build UPGRADE_CHANNEL, or not at all when UPGRADE_CHANNEL is set as well.
  - name: HCP_NODE_UPGRADE_ENABLED
    default: "true"
    documentation: upgrade ROSA HCP worker nodes after control plane upgrade, default is to enable worker nodes upgrade
  documentation: |-
    Using rosa cli to upgrade the rosa classic/HCP cluster to the specified openshift version.
