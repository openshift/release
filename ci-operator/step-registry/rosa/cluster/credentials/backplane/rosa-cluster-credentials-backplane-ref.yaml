ref:
  as: rosa-cluster-credentials-backplane
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-cluster-credentials-backplane-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: |-
      OCM environment the cluster lives in. Backplane logs into this environment.
      Supported values are [production, staging, integration].
  - name: BACKPLANE_PROXY_URL
    default: "http://squid.corp.redhat.com:3128"
    documentation: |-
      Corp proxy used to reach the backplane API from the build farm. Written into
      ${SHARED_DIR}/proxy-conf.sh so downstream oc-based steps route through it.
  - name: BACKPLANE_ELEVATE_REASON
    default: "https://issues.redhat.com/browse/ROSAENG-62717"
    documentation: Audit reason passed to ocm-backplane elevate.
  - name: BACKPLANE_CLI_VERSION
    default: "0.12.0"
    documentation: ocm-backplane CLI version to install.
  documentation: |-
    Obtains a kubeconfig for a private ROSA cluster whose API server is not
    directly reachable from the build farm. It logs into OCM with the cluster
    profile credentials, runs ocm-backplane login for the cluster id in
    ${SHARED_DIR}/cluster-id, and writes an elevated (backplane-cluster-admin)
    kubeconfig to ${SHARED_DIR}/kubeconfig plus ${SHARED_DIR}/proxy-conf.sh so all
    subsequent oc-based steps reach the private API through the corp proxy.
    Run this after the cluster is ready in OCM (rosa-cluster-wait-ready-cluster)
    and before any step that talks to the cluster API (e.g. wait-ready-operators).
