ref:
  as: rosa-cluster-mc-allow-unsigned
  from: rosa-aws-cli
  commands: rosa-cluster-mc-allow-unsigned-commands.sh
  env:
  - name: OCM_LOGIN_ENV
    default: staging
    documentation: OCM environment to login to
  grace_period: 30s
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  documentation: |-
    Patch the management cluster's ClusterImagePolicy to allow unsigned nightly
    images for HCP control plane pods. Required because 4.22+ MCs enforce signature
    verification which rejects unsigned nightly OCP images.
    Must run after cluster provision and before wait-ready-cluster.
    Paired with rosa-cluster-mc-restore-image-policy post step.
