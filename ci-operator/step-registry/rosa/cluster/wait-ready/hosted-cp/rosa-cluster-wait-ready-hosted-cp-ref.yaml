ref:
  as: rosa-cluster-wait-ready-hosted-cp
  from: rosa-aws-cli
  grace_period: 10m
  timeout: 60m
  commands: rosa-cluster-wait-ready-hosted-cp-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: The environment for ocm login. The supported values are [production, staging, integration].
  - name: HCP_READY_TIMEOUT
    default: "1800"
    documentation: Global timeout in seconds for all readiness checks. Default is 1800 (30 minutes).

  documentation: |-
    This step logs into the management cluster via OCM API and performs
    readiness checks for a ROSA HCP cluster:
    1. HostedCluster CR status in the HC namespace (ocm-<env>-<cluster_id>)
    2. HostedControlPlane CR status in the HCP namespace (ocm-<env>-<cluster_id>-<cluster_name>)
    3. All pods in the HCP namespace are running and ready
    4. VpcEndpoint 'private-hcp' is healthy in the HCP namespace

    When check 3 does not succeed the step makes one bounded, best-effort
    collection pass over the same HCP namespace and writes
    ${ARTIFACT_DIR}/rosa-hcp-pod-diagnostics-<timestamp>.json before failing.
    At most 60 pods are reported, not-ready ones first, so the bound drops
    healthy pods rather than the ones the wait failed on; the artifact records
    how many pods were observed and whether the list was truncated. Collection
    is skipped with a log line, and no artifact is written, when ARTIFACT_DIR
    is unset or not writable. The step outcome is unchanged either way.
    Because ARTIFACT_DIR is published publicly, the artifact is restricted to
    run-local pod aliases, allowlisted condition, phase, reason and event enum
    values, timestamps and counters; names, labels, messages and command
    output are never written.
