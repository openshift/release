ref:
  as: rosa-cluster-wait-ready-cluster
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-cluster-wait-ready-cluster-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  timeout: 2h30m0s
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: The environment for rosa login. The supported values are [production, staging, integration].
  - name: HOSTED_CP
    default: "false"
    documentation: Enable the use of hosted control planes (HyperShift).
  - name: REGION
    default: ""
    documentation: Use a specific AWS region, overriding the LEASED_RESOURCE environment variable in the cluster_profile.
  - name: BYO_OIDC
    default: "false"
    documentation: Use the customized OIDC Config and operator-roles to install the cluster.
  - name: ENABLE_BYOVPC
    default: "false"
    documentation: Use the customized VPC to install the cluster.
  - name: ENABLE_SHARED_VPC
    default: "no"
    documentation: Create a Shared VPC cluster.
  - name: CLUSTER_TIMEOUT
    default: "9000"
    documentation: Set to number of seconds for the cluster to timeout if it's not ready.
  - name: STALL_TIMEOUT
    default: "3600"
    documentation: Maximum seconds a cluster can remain in the same state (installing/pending) before being considered stalled and failing early. Default is 3600 (60 minutes).
  - name: PROVISIONER_LAUNCH_TIMEOUT
    default: "900"
    documentation: Maximum seconds to wait for the Hive provisioner to launch (infra_id to become non-null) after entering the 'installing' state. Only applies to Classic (non-HCP) clusters. Default is 900 (15 minutes).

  documentation: |-
    Wait the rosa cluster to be ready.
