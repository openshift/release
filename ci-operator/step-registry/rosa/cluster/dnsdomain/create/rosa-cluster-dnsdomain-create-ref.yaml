ref:
  as: rosa-cluster-dnsdomain-create
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-cluster-dnsdomain-create-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: The environment for rosa login. The supported values are [production, staging, integration].
  - name: HOSTED_CP
    default: "false"
    documentation: |-
      Create a Hosted Control Plane architecture DNS domain (--hosted-cp):
      HCP clusters can only use base domains under the hcp parent domain
      (s3.devshift.org in staging); without the flag OCM returns a classic
      architecture domain (s1.devshift.org) that rosa create cluster rejects
      for HCP clusters.
  documentation: |-
    The step uses rosa cli to create DNS domain.
