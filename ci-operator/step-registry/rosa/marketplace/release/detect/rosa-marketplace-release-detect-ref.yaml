ref:
  as: rosa-marketplace-release-detect
  from: cli
  grace_period: 1m
  commands: rosa-marketplace-release-detect-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: RELEASE_PAYLOAD_AUTH_FILE
    default: /etc/pull-secret/.dockerconfigjson
    documentation: Registry auth file used to inspect the release-controller payload and extract openshift-install.
  - name: RHCOS_AWS_REGION
    default: us-east-1
    documentation: AWS region whose installer-provided RHCOS AMI must be present.
  credentials:
  - namespace: test-credentials
    name: ci-pull-credentials
    mount_path: /etc/pull-secret
  documentation: |-
    Consumes the exact RELEASE_IMAGE_LATEST payload supplied by ci-operator and
    release-controller. It derives the OCP y-stream from payload metadata,
    extracts openshift-install, records the x86_64 RHCOS version and regional
    AWS AMI, and writes validated values to SHARED_DIR for the Marketplace
    release step.
