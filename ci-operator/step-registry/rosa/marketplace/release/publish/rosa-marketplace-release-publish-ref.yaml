ref:
  as: rosa-marketplace-release-publish
  from: rosa-aws-cli
  grace_period: 1m
  commands: rosa-marketplace-release-publish-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: MARKETPLACE_ENVIRONMENT
    default: staging
    documentation: Marketplace environment. This step intentionally permits staging only.
  - name: MARKETPLACE_DRY_RUN
    default: "true"
    documentation: Must be true. This step only logs a preview and never invokes the generator.
  credentials:
  - collection: rosa-marketplace-release-generator
    group: rosa-marketplace-stage
    mount_path: /etc/rosa-marketplace-stage
  documentation: |-
    Reads the missing ROSA y-stream produced by rosa-marketplace-release-detect
    and verifies the mounted staging IAM identity and read access before logging
    a staging-only preview. Missing credentials warn in dry-run mode. It never
    invokes the generator or publishes, refuses production and live publication,
    and treats detector wait states as successful no-ops after the read checks.
