ref:
  as: rosa-marketplace-release-publish
  from: rosa-aws-cli
  grace_period: 1m
  commands: rosa-marketplace-release-publish-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: MARKETPLACE_ENVIRONMENT
    default: staging
    documentation: Marketplace environment. This step intentionally permits staging only.
  - name: MARKETPLACE_DRY_RUN
    default: "true"
    documentation: Must be true. This step only logs a preview and never invokes the generator.
  documentation: |-
    Reads the missing ROSA y-stream produced by rosa-marketplace-release-detect
    and logs a staging-only preview. It never invokes the generator or accesses
    AWS, refuses production and live publication, and treats detector wait
    states as successful no-ops.
