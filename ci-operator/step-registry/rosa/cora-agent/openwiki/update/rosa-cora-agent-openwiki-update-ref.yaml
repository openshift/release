ref:
  as: rosa-cora-agent-openwiki-update
  from: claude-ai-helpers
  commands: rosa-cora-agent-openwiki-update-commands.sh
  timeout: 4h
  grace_period: 5m
  env:
  - name: TARGET_REPO
    default: openshift-online/rosa-cora-agent
    documentation: Repository in owner/repo form.
  - name: TARGET_BASE_BRANCH
    default: main
    documentation: Base branch for documentation PRs.
  - name: TARGET_UPDATE_BRANCH
    default: openwiki/update
    documentation: Branch holding generated wiki updates.
  - name: TARGET_PROVIDER
    default: gemini-enterprise
    documentation: Use Google ADC/Vertex AI instead of an OpenAI API key.
  - name: TARGET_VERTEX_PROJECT_ID
    default: rosa-general
    documentation: ROSA-owned Vertex inference project; keys for other GCP projects are rejected.
  - name: TARGET_VERTEX_SERVICE_ACCOUNT_EMAIL
    default: rosa-cora-agent@rosa-general.iam.gserviceaccount.com
    documentation: OpenWiki service account in rosa-general; keys for other accounts are rejected.
  - name: GOOGLE_CLOUD_LOCATION
    default: global
    documentation: Vertex AI endpoint location.
  - name: TARGET_MODEL_ID
    default: claude-sonnet-5
    documentation: Claude model enabled in the Vertex Model Garden for the ROSA project.
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: /var/run/rosa-cora-agent-vertex/gcp-vertex-sa-key
    documentation: rosa-cora-agent/ci/gcp-vertex-sa-key JSON key for the configured OpenWiki service account in rosa-general.
  credentials:
  # No GitHub App credentials in the agent container. Only the Vertex key is
  # mounted for generating documentation; publishing happens in another step.
  - collection: rosa-cora-agent
    group: ci
    field: gcp-vertex-sa-key
    mount_path: /var/run/rosa-cora-agent-vertex
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
  documentation: |-
    Install pinned Node/OpenWiki into a temporary directory and run OpenWiki
    on a full-history clone of the public repository. Mounts only the Vertex
    key from rosa-cora-agent/ci. Passes only openwiki/ changes and the update
    exit code to the publish step, even if OpenWiki only completes some pages.
