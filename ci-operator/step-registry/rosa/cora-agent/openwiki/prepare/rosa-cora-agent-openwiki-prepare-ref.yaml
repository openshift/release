ref:
  as: rosa-cora-agent-openwiki-prepare
  from: claude-ai-helpers
  commands: rosa-cora-agent-openwiki-prepare-commands.sh
  grace_period: 5m
  env:
  - name: TARGET_REPO
    default: openshift-online/rosa-cora-agent
    documentation: Repository in owner/repo form.
  - name: TARGET_BASE_BRANCH
    default: main
    documentation: Base branch for documentation PRs.
  - name: TARGET_UPDATE_BRANCH
    default: openwiki/update
    documentation: Branch holding generated wiki updates.
  credentials:
  - collection: rosa-cora-agent
    group: ci
    field: github-app-app-id
    mount_path: /var/run/rosa-cora-agent-github-app-id
  - collection: rosa-cora-agent
    group: ci
    field: github-app-installation-id
    mount_path: /var/run/rosa-cora-agent-github-app-installation
  - collection: rosa-cora-agent
    group: ci
    field: github-app-pem
    mount_path: /var/run/rosa-cora-agent-github-app-key
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  documentation: |-
    Authenticate with the ROSA Cora Agent GitHub App and select the base branch
    for the OpenWiki update. Pass only the branch name to SHARED_DIR; no GitHub
    App credentials are passed to the OpenWiki model step.
