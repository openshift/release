chain:
  as: rosa-gather-hcp-diagnostics
  steps:
  - ref: rosa-gather-rhobs-logs
  - ref: rosa-gather-hcp-cr-status
  documentation: |-
    Collects diagnostics for ROSA HCP clusters after FVT/e2e runs.
    - rosa-gather-rhobs-logs: RHOBS/Loki log slices (MC + guest control plane).
    - rosa-gather-hcp-cr-status: HyperShift/CAPI CR dumps via backplane.
    Guest kubeconfig + OCP gather-extra/must-gather live in
    rosa-gather-hcp-guest-artifacts (OCM FVT posts) to avoid duplicating
    the gather chain already pulled in by rosa-cluster-deprovision.
    All steps are best-effort.
