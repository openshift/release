chain:
  as: rosa-gather-hcp-diagnostics
  steps:
  - ref: rosa-gather-rhobs-logs
  - ref: rosa-gather-hcp-cr-status
  documentation: |-
    Collects RHOBS diagnostic logs and HyperShift CR statuses for HCP clusters.
    Wraps rosa-gather-rhobs-logs (Loki log collection) and rosa-gather-hcp-cr-status
    (management cluster CR status dumps via backplane) as a single entry point
    for workflows and inline FVT job post steps.
