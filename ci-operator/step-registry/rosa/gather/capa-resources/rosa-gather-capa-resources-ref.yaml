ref:
  as: rosa-gather-capa-resources
  from: cli
  best_effort: true
  timeout: 600s
  grace_period: 60s
  commands: rosa-gather-capa-resources-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Collects ROSA-specific custom resources and events from the management cluster
    for post-failure debugging. Captures ROSARoleConfig, ROSAControlPlane,
    ROSAMachinePool, and ROSANetwork instances with their full status and
    conditions, plus events from ROSA and CAPI namespaces.
