ref:
  as: rosa-gather-guest-kubeconfig
  best_effort: true
  from_image:
    namespace: ci
    name: rosa-aws-cli
    tag: latest
  commands: rosa-gather-guest-kubeconfig-commands.sh
  grace_period: 30s
  timeout: 10m0s
  credentials:
  - collection: ocm-fvt-credentials
    group: cs-qe-credentials
    mount_path: /usr/local/cs-qe-credentials
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: |-
      OCM environment the cluster lives in.
      Supported values are [production, staging, integration].
  - name: BACKPLANE_PROXY_URL
    default: "http://squid.corp.redhat.com:3128"
    documentation: |-
      Corp proxy used to reach the backplane API from the build farm.
  - name: BACKPLANE_CLI_VERSION
    default: "0.12.0"
    documentation: ocm-backplane CLI version to install.
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  documentation: |-
    Exports the ROSA/HCP guest cluster kubeconfig to ${SHARED_DIR}/kubeconfig
    so downstream OCP gather steps (gather-must-gather, gather-extra) can run
    against the guest. Tries OCM credentials API first, then ocm-backplane login.
    Best-effort: skips cleanly when cluster-id or credentials are unavailable.
    See ROSAENG-67965.
