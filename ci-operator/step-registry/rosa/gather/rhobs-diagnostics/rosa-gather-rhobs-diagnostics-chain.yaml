chain:
  as: rosa-gather-rhobs-diagnostics
  steps:
  - ref: rosa-gather-rhobs-logs
  documentation: |-
    Collects RHOBS diagnostic logs for ROSA clusters. Wraps rosa-gather-rhobs-logs
    as a single entry point for workflows and inline FVT job post steps.
    Works for both HCP (MC-side + CS logs) and Classic STS (CS logs only).
