ref:
  as: rosa-tests-runtime-check-failures
  from: rosa-aws-cli
  grace_period: 10m
  commands: rosa-tests-runtime-check-failures-commands.sh
  resources:
    requests:
      cpu: 40m
      memory: 128Mi
  documentation: |-
    Check for any failures from other ROSA CLI e2e runtime jobs
  no_kubeconfig: true
