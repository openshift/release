ref:
  as: rosa-mcvw-cleanup
  from: rosa-aws-cli
  grace_period: 5m
  commands: rosa-mcvw-cleanup-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 10m0s
  env:
  - name: OPERATOR_NAMESPACE
    default: openshift-validation-webhook
    documentation: Namespace where MCVW is deployed.
  documentation: |-
    Removes the namespaced PKO Package created by rosa-mcvw-install and collects
    operator logs as artifacts. MCVW uses a namespaced Package (not ClusterPackage)
    because its manifest.yaml declares scopes: [Namespaced].
