ref:
  as: rosa-boundary-openwiki-update
  from: claude-ai-helpers
  commands: rosa-boundary-openwiki-update-commands.sh
  timeout: 4h
  grace_period: 5m
  env:
  - name: TARGET_REPO
    default: openshift-online/rosa-boundary
    documentation: Repository in owner/repo form.
  - name: TARGET_BASE_BRANCH
    default: main
    documentation: Base branch for documentation PRs.
  - name: TARGET_UPDATE_BRANCH
    default: openwiki/update
    documentation: Branch holding generated wiki updates.
  - name: TARGET_PROVIDER
    default: gemini-enterprise
    documentation: Use Google ADC/Vertex AI instead of an OpenAI API key.
  - name: TARGET_VERTEX_PROJECT_ID
    default: rosa-general
    documentation: ROSA-owned Vertex inference project; keys for other GCP projects are rejected.
  - name: TARGET_VERTEX_SERVICE_ACCOUNT_EMAIL
    default: rosa-boundary@rosa-general.iam.gserviceaccount.com
    documentation: Existing rosa-boundary service account; keys for other ROSA initiatives are rejected.
  - name: GOOGLE_CLOUD_LOCATION
    default: global
    documentation: Vertex AI endpoint location.
  - name: TARGET_MODEL_ID
    default: claude-sonnet-5
    documentation: Claude model enabled in the Vertex Model Garden for the ROSA project.
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: /var/run/rosa-boundary-vertex/gcp-vertex-sa-key
    documentation: Existing rosa-boundary/ci/gcp-vertex-sa-key JSON key for the rosa-boundary service account in rosa-general.
  credentials:
  # No GitHub App private key in the agent container. The short-lived scoped
  # read token arrives via SHARED_DIR, is revoked before OpenWiki runs, and
  # publishing uses a separate token in another step.
  - collection: rosa-boundary
    group: ci
    field: gcp-vertex-sa-key
    mount_path: /var/run/rosa-boundary-vertex
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
  documentation: |-
    Clone the private repository with a temporary askpass helper, revoke the
    read token and remove its SHARED_DIR file, then install pinned Node/OpenWiki
    and run the model. Pass only openwiki/ changes and the update exit code to
    publish, including partial updates. Mounts only the Vertex key directly.
