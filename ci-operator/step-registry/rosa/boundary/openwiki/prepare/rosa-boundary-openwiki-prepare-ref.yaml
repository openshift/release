ref:
  as: rosa-boundary-openwiki-prepare
  from: claude-ai-helpers
  commands: rosa-boundary-openwiki-prepare-commands.sh
  grace_period: 5m
  credentials:
  - collection: rosa-boundary
    group: ci
    field: github-app-app-id
    mount_path: /var/run/rosa-boundary-github-app-id
  - collection: rosa-boundary
    group: ci
    field: github-app-installation-id
    mount_path: /var/run/rosa-boundary-github-app-installation
  - collection: rosa-boundary
    group: ci
    field: github-app-pem
    mount_path: /var/run/rosa-boundary-github-app-key
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  documentation: |-
    Authenticate with the ROSA Boundary GitHub App and clone full history of
    openshift-online/rosa-boundary into SHARED_DIR. No GitHub App credentials
    are passed to the OpenWiki model step.
