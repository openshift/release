ref:
  as: rosa-boundary-openwiki-publish
  from: claude-ai-helpers
  commands: rosa-boundary-openwiki-publish-commands.sh
  grace_period: 5m
  credentials:
  - collection: rosa-boundary
    group: ci
    field: github-app-app-id
    mount_path: /var/run/rosa-boundary-github-app-id
  - collection: rosa-boundary
    group: ci
    field: github-app-installation-id
    mount_path: /var/run/rosa-boundary-github-app-installation
  - collection: rosa-boundary
    group: ci
    field: github-app-pem
    mount_path: /var/run/rosa-boundary-github-app-key
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  documentation: |-
    Authenticate with the GitHub App independently of the model step, apply
    only the generated docs patch to a fresh clone, and open or update the PR.
    Report OpenWiki failures after publishing completed pages.
