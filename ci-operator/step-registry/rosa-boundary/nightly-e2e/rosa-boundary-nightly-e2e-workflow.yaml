workflow:
  as: rosa-boundary-nightly-e2e
  steps:
    cluster_profile: rosa-boundary-ci
    allow_best_effort_post_steps: true
    pre:
    - ref: rosa-boundary-nightly-provision
    test:
    - ref: rosa-boundary-nightly-e2e
    post:
    - ref: rosa-boundary-nightly-teardown
  documentation: |-
    Nightly e2e test workflow for rosa-boundary. Provisions AWS infrastructure
    via terraform (network + regional modules), runs e2e tests, then tears down
    all resources. Uses cluster_profile: rosa-boundary-ci for credentials.
