ref:
  as: rosa-boundary-nightly-e2e
  from: src
  commands: rosa-boundary-nightly-e2e-commands.sh
  timeout: 1800s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Runs e2e tests for rosa-boundary against provisioned infrastructure.
    Infrastructure outputs are available in SHARED_DIR from the provision step.
