ref:
  as: rosa-boundary-nightly-provision
  from: src
  commands: rosa-boundary-nightly-provision-commands.sh
  timeout: 3600s
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  documentation: |-
    Provisions rosa-boundary AWS infrastructure using terraform.
    Deploys both network (deploy/network/) and regional (deploy/regional/)
    terraform modules. Uses cluster_profile: openshift-org-aws for credentials.
    Saves terraform outputs to SHARED_DIR for use by test steps.
