ref:
  as: rosa-boundary-nightly-teardown
  from: src
  commands: rosa-boundary-nightly-teardown-commands.sh
  timeout: 1800s
  best_effort: true
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  documentation: |-
    Tears down rosa-boundary AWS infrastructure provisioned by the provision step.
    Destroys both regional and network terraform modules in reverse order.
    Uses cluster_profile: aws for credentials.
    Marked as best_effort so it does not block other post steps if it fails.
