workflow:
  as: rhwa-system-tests-s390x-fbc-upgrade
  steps:
    allow_best_effort_post_steps: true
    pre:
    - ref: upi-libvirt-cleanup-pre
    - chain: upi-conf-libvirt
    - ref: ipi-debug-missing-static-pod-controller-degraded
    - ref: ipi-conf-etcd-on-ramfs
    - chain: upi-install-libvirt
    test:
    - chain: rhwa-system-tests-s390x-fbc-upgrade-test
    post:
    - ref: medik8s-analyze-e2e-failure
    - ref: ipi-conf-debug-kdump-gather-logs
    - chain: gather
    - ref: rhwa-system-tests-s390x-cleanup
    - ref: upi-libvirt-cleanup-post
  documentation: |-
    s390x Orange Zone libvirt lifecycle for RHWA FBC upgrade-operator jobs.

    Same UPI/libvirt pre/post as rhwa-system-tests-s390x, but the test phase runs
    medik8s-fbc-upgrade (no SSH bastion) instead of medik8s-setup + make run-tests.
    Kubelet-stop uses MEDIK8S_KUBELET_STOP_OCDEBUG from the FBC step. Use for
    openshift/rhwa-system-tests variant 5.0-s390x-upgrade (NHC/NMO/SNR). Set
    FBC_OPERATOR and TEST_NAME / TEST_STEPS (Claude analysis) per job.
