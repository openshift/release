chain:
  as: rhwa-system-tests-s390x-fbc-upgrade-test
  steps:
  - ref: medik8s-fbc-upgrade
  documentation: |-
    Runs RHWA tier:upgrade-operator FBC coverage on a provisioned s390x OZ cluster.
    Does not run medik8s-setup / OLM subscribe — medik8s-fbc-upgrade owns GA install,
    IDMS, Subscription upgrade, and Ginkgo.

    No SSH bastion: ProxyCommand wrapping lives only in
    rhwa-system-tests-s390x-run-tests. FBC paths rely on
    MEDIK8S_KUBELET_STOP_OCDEBUG (set by medik8s-fbc-upgrade for NHC/SNR) for
    kubelet-stop instead of node SSH.
