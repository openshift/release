chain:
  as: rhwa-system-tests-s390x-fbc-fresh-install-test
  steps:
  - ref: medik8s-fbc-fresh-install
  documentation: |-
    Runs RHWA tier:fresh-install on a provisioned s390x OZ cluster.
    Does not run medik8s-setup / OLM subscribe — medik8s-fbc-fresh-install owns
    candidate discovery, IDMS, operator-sdk install via the Ginkgo suite, and
    cleanup.

    No SSH bastion: FBC fresh-install relies on MEDIK8S_KUBELET_STOP_OCDEBUG
    (set by medik8s-fbc-fresh-install for NHC) instead of the GA run-tests
    ProxyCommand jump.
