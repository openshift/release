ref:
  as: openshift-pipelines-catalog-source
  from: openshift-pipelines-runner
  commands: openshift-pipelines-catalog-source-commands.sh
  grace_period: 5m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: CATALOG_SOURCE_NAME
      default: custom-operators
      documentation: |-
        Name of the CatalogSource CR to create in openshift-marketplace.
    - name: CATALOG_INDEX_IMAGE
      documentation: |-
        Index image reference for the custom CatalogSource (e.g.
        quay.io/openshift-pipeline/pipelines-index-4.21:v1.23.0).
  documentation: |-
    Creates a custom CatalogSource CR in openshift-marketplace namespace
    for testing unreleased operator versions from a custom index image.
