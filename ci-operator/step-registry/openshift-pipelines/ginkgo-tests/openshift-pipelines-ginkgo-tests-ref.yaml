ref:
  as: openshift-pipelines-ginkgo-tests
  from: openshift-pipelines-runner
  commands: openshift-pipelines-ginkgo-tests-commands.sh
  grace_period: 10m
  resources:
    requests:
      cpu: '1'
      memory: 500Mi
  credentials:
    - mount_path: /usr/local/ci-secrets/osp-ci-secrets
      collection: openshift-pipelines
      group: osp-ci-secrets
  env:
    - name: GINKGO_LABEL_FILTER
      default: "e2e && !disconnected"
    - name: GINKGO_SUITES
      default: |-
        tests/operator/rbac_test.go
        tests/operator/roles_test.go
        tests/operator/addon_test.go
        tests/operator/networkpolicy_test.go
        tests/triggers/triggerbinding_test.go
        tests/triggers/eventlistener_test.go
        tests/triggers/cron_test.go
        tests/mag/mag_test.go
        tests/pipelines/
        tests/metrics/
        tests/pac/
        tests/chains/
      documentation: |-
        Newline-separated list of ginkgo suite package dirs to run, one per line
        (e.g. tests/operator/, tests/pipelines/). Each suite is run with the
        shared GINKGO_LABEL_FILTER. Narrow which individual specs run within a
        suite with GINKGO_FOCUS_FILES.
    - name: GINKGO_TIMEOUT
      default: "120m"
      documentation: |-
        Timeout applied to each ginkgo suite run.
  documentation: |-
    Runs OpenShift Pipelines Ginkgo v2 e2e tests from the release-tests-ginkgo repo.
    Expects the operator to already be installed on the cluster.
    Vault secrets from kv/selfservice/openshift-pipelines/osp-ci-secrets are
    mounted at /usr/local/ci-secrets/osp-ci-secrets and exported as env vars.
