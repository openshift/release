ref:
  as: enable-ga-catalogsource
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  grace_period: 10m
  commands: enable-ga-catalogsource-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: GA_INDEX_OCP_VERSION
    default: ""
    documentation: |-
      OCP version of the released (GA) redhat-operators index to expose, e.g. "4.22". The
      step creates a CatalogSource named redhat-operators-v<version> (dots stripped, e.g.
      redhat-operators-v422) serving registry.redhat.io/redhat/redhat-operator-index:v<version>.
  - name: CATALOGSOURCE_NAME
    default: ""
    documentation: |-
      Optional override of the CatalogSource name. Defaults to
      redhat-operators-v<GA_INDEX_OCP_VERSION> with dots stripped, e.g. redhat-operators-v422.
  documentation: |-
    Creates a CatalogSource in openshift-marketplace that serves the GA (released)
    redhat-operator-index of a given OCP version. Useful on nightly or pre-GA clusters whose
    current official redhat-operators catalog does not contain every operator yet: operators
    missing from the dev index can be installed by referencing the created CatalogSource as
    "source" (with an explicit channel) in the install-operators OPERATORS list.
