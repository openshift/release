ref:
  as: image-based-install-operator-post-gather
  from: src
  commands: image-based-install-operator-post-gather-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  documentation: |-
    Gather info and logs after deleting an ImageClusterInstall.
    Also gathers the journal and basic network and container state from the IBI host,
    best effort, so that a host that failed to come up can be debugged from the artifacts.
