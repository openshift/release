chain:
  as: external-secrets-operator-upgrade
  steps:
  - ref: merge-stage-registry-credentials
  - ref: optional-operators-subscribe
  - as: preupgrade-e2e
    cli: latest
    commands: |
      make test-e2e-preupgrade
    from: src
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
  - ref: optional-operators-upgrade-stage-index
  - as: postupgrade-e2e
    cli: latest
    commands: |
      make test-e2e-postupgrade
    from: src
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
  - as: full-e2e
    cli: latest
    commands: |
      make test-e2e
    from: src
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
  documentation: |-
    Operator-upgrade test for the External Secrets Operator.

    1. merge-stage-registry-credentials: merge registry.stage.redhat.io pull
       credentials into the cluster global pull-secret so the stage CatalogSource
       pod can pull the stage index later.
    2. optional-operators-subscribe: install the baseline operator version from the
       production OLM index (OO_INDEX), pinned via INITIAL_CSV.
    3. preupgrade-e2e: run the Feature:PreUpgrade e2e specs, which create the
       ExternalSecretsConfig and 4 AWS SecretStores and leave them in place
       (the make target sets E2E_SKIP_CLEANUP=true).
    4. optional-operators-upgrade-stage-index: create a stage CatalogSource
       from STAGE_OO_INDEX, repoint the Subscription at it, and upgrade to
       OO_LATEST_CSV.
    5. postupgrade-e2e: run the Feature:PostUpgrade e2e specs, which verify the
       pre-existing ExternalSecretsConfig, operand pods, and the same 4
       SecretStores are still healthy after the upgrade.
    6. full-e2e: run the full e2e suite against the upgraded version (the default
       label filter excludes the Pre/PostUpgrade specs).
