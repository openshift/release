workflow:
  as: external-secrets-operator-upgrade
  steps:
    pre:
    - chain: ipi-aws-pre
    test:
    - chain: external-secrets-operator-upgrade
    post:
    - chain: ipi-aws-post
  documentation: |-
    Self-contained operator-upgrade workflow for the External Secrets Operator on
    an IPI AWS cluster.

    Provisions an IPI AWS cluster (ipi-aws-pre), then runs the
    external-secrets-operator-upgrade chain: install the baseline version from the
    production OLM index, create and preserve operands (PreUpgrade e2e), upgrade to
    the stage index version, verify the preserved operands (PostUpgrade e2e), and
    run the full e2e suite against the upgraded version. Finally deprovisions the
    cluster (ipi-aws-post).

    The AWS SecretStore specs consume the mint-mode kube-system/aws-creds secret
    left in place by ipi-aws-pre, so this workflow must not remove the root
    credentials (do not add cco-remove-root-secret).
