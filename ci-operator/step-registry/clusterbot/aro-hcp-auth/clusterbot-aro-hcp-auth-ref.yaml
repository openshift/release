ref:
  as: clusterbot-aro-hcp-auth
  from: aro-hcp-e2e-tests
  commands: clusterbot-aro-hcp-auth-commands.sh
  credentials:
  - collection: hcm-aro
    group: aro-hcp-dev
    mount_path: /var/run/aro-hcp-dev
  - collection: hcm-aro
    group: aro-hcp-prod
    mount_path: /var/run/aro-hcp-prod
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: ARO_HCP_DEPLOY_ENV
    default: ci01
    documentation: ARO HCP deployment environment used to select the infrastructure subscription.
  - name: VAULT_SECRET_PROFILE
    default: dev
    documentation: Vault profile used to select the mounted ARO HCP Azure credentials.
  - name: REQUESTER_EMAIL
    default: ""
    documentation: Email address of the cluster-bot requester who receives Azure access.
  documentation: |-
    Grant the cluster-bot requester access to the ARO HCP regional resource group
    and service and management AKS clusters, then publish their kubeconfigs.
