ref:
  as: merge-stage-registry-credentials-for-hypershift
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  commands: merge-stage-registry-credentials-for-hypershift-commands.sh
  timeout: 5m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  credentials:
  - namespace: test-credentials
    name: openshift-custom-mirror-registry
    mount_path: /var/run/vault/mirror-registry
  documentation: |-
    Merges registry.stage.redhat.io pull credentials from the OpenShift CI
    openshift-custom-mirror-registry secret into ${SHARED_DIR}/pull-secret-build-farm.json
    before HyperShift cluster creation. hypershift-hostedcluster-create merges that
    file with CI pull credentials and supplies it to the HostedCluster pull secret.
