workflow:
  as: qe-rhel-jetson-bootc-e2e
  steps:
    pre:
    - ref: qe-rhel-jetson-bootc-install
    test:
    - ref: qe-rhel-jetson-pytest
  documentation: |-
    Install a bootc image on the Jetson device via Ansible, then run the
    bootc pytest suite to validate the switch lifecycle.
    Requires BOOTC_IMAGE_BASE and BOOTC_IMAGE_TAG env vars to be set.
