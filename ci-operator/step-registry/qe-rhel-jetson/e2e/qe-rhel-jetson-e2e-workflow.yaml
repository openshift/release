workflow:
  as: qe-rhel-jetson-e2e
  steps:
    test:
    - ref: qe-rhel-jetson-pytest
  documentation: |-
    Run qe-rhel-jetson pytest suite against a Jetson device over SSH.
    Assumes the device already has RHEL + JetPack RPMs installed.
    Use TEST_SUITE env to select which tests_suites/ subdirectory to run.
