workflow:
  as: agent-sandbox-e2e-azure
  steps:
    env:
      AGENT_SANDBOX_INSTALL: "true"
      SANDBOX_RUNTIME_CLASS: "default"
      COMPUTE_NODE_REPLICAS: "2"
    pre:
    - chain: ipi-azure-pre
    - ref: agent-sandbox-install-operator
    test:
    - ref: agent-sandbox-e2e-test
    post:
    - chain: ipi-azure-post
  documentation: |-
    Provisions an Azure OCP cluster, installs the agent-sandbox operator
    (without OSC), then runs runtime-class e2e tests using the cluster's
    default runtime to validate SandboxTemplate, WarmPool, and SandboxClaim
    lifecycle.
