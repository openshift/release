chain:
  as: baremetalds-ofcir-no-overlay-pre
  steps:
  - ref: ofcir-acquire
  - ref: baremetalds-e2e-ovn-bgp-no-overlay
  - ref: baremetalds-e2e-ovn-bgp-nftables-pre
  - ref: ipi-install-rbac
  - ref: baremetalds-devscripts-ibm
  - ref: baremetalds-devscripts-proxy
  - ref: ipi-install-hosted-loki
  - ref: rhcos-conf-osstream
  - ref: baremetalds-devscripts-setup
  documentation: |-
    The Baremetald IPI setup chain for clusters installed with the NoOverlay transport. It is
    baremetalds-ofcir-pre with baremetalds-e2e-ovn-bgp-no-overlay and
    baremetalds-e2e-ovn-bgp-nftables-pre inserted after the packet server is acquired and before
    the cluster is installed, which is the only point at which the transport can be chosen.

    The nftables step is a no-op unless the cluster is installed with outboundSNAT=Disabled, so
    it is in the chain for every no-overlay job rather than only the ones that need it.
