ref:
  as: baremetalds-openperouter-e2e-test
  from: dev-scripts
  commands: baremetalds-openperouter-e2e-test-commands.sh
  timeout: 10800s
  dependencies:
  - env: OO_BUNDLE
    name: operator-bundle
  env:
  - name: OPENPEROUTER_REPO
    default: "https://github.com/oribon/openperouter.git"
    documentation: Repo containing E2E scripts and OCP test workarounds
  - name: OPENPEROUTER_BRANCH
    default: "ocp_ci_poc"
    documentation: Branch with setup-clab.sh and OCP E2E changes
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Deploy OpenPerOuter via OLM bundle, set up containerlab fabric, run E2E tests.
