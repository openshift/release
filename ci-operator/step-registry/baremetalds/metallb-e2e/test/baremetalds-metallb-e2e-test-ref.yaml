ref:
  as: baremetalds-metallb-e2e-test
  from: src
  grace_period: 10m
  commands: baremetalds-metallb-e2e-test-commands.sh
  timeout: 10800s
  resources:
    requests:
      cpu: "3"
      memory: 600Mi
    limits:
      memory: 2Gi
  env:
  - name: E2E_TESTS_CONFIG
    default: ""
    documentation: Additional configuration. See https://github.com/openshift-metal3/dev-scripts/blob/918da5cba37ec38b47e67dbe08d53297e8dcb7ea/metallb/README.md for more details about supported values.
  - name: METALLB_REPO
    default: ""
    documentation: Override the MetalLB git repository URL to clone for e2e tests. Defaults to https://github.com/openshift/metallb.git if empty.
  - name: METALLB_BRANCH
    default: ""
    documentation: Override the MetalLB branch to check out. Defaults to the branch matching the cluster OCP version if empty.
  documentation: |-
    The Baremtal DS E2E step executes the metallb end-to-end test suite.
