workflow:
  as: baremetalds-e2e-etcd-recovery
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: baremetalds-ofcir-pre
    test:
    - chain: baremetalds-ipi-test
    post:
    - chain: baremetalds-ofcir-post
    env:
      DEVSCRIPTS_CONFIG: |
        IP_STACK=v4
      TEST_ARGS: --disable-monitor=legacy-etcd-invariants
      TEST_SUITE: openshift/etcd/recovery
  documentation: |-
    This workflow executes the `openshift/etcd/recovery` end-to-end test suite on a cluster provisioned by running
    dev-scripts on a packet server with an IPv4 cluster network. The legacy-etcd-invariants monitor is disabled
    because this suite disrupts the etcd quorum on purpose, which trips its pathological event checks
    (e.g. RequiredInstallerResourcesMissing for the localhost-recovery secrets).
