workflow:
  as: baremetalds-e2e-core-networking-dualstack-ote
  steps:
    env:
      DEVSCRIPTS_CONFIG: |
        IP_STACK=v4v6
        # 3 workers instead of the dev-scripts default of 2, so the cluster has
        # 3 schedulable nodes.
        NUM_WORKERS=3
      EXTRA_NETWORK_CONFIG: |
        EXTRA_NETWORK_NAMES="extranet"
        EXTRANET_NETWORK_SUBNET_V4='10.10.10.0/24'
        EXTRANET_NETWORK_SUBNET_V6='2001:db8:abcd:1234::/64'
    pre:
      - ref: baremetalds-devscripts-conf-extranetwork
      - chain: baremetalds-ofcir-pre
    test:
      - chain: baremetalds-ipi-test
    post:
      - chain: baremetalds-ofcir-post
  documentation: |-
    Like baremetalds-e2e-ovn-dualstack, but also provisions a secondary network so every cluster
    node gets an additional host interface, and raises NUM_WORKERS to 3.
