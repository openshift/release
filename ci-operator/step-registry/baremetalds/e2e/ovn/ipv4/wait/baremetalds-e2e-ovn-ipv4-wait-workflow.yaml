workflow:
  as: baremetalds-e2e-ovn-ipv4-wait
  steps:
    env:
      DEVSCRIPTS_CONFIG: |
        IP_STACK=v4
        NETWORK_TYPE=OVNKubernetes
      TIMEOUT: "+12 hours"
    pre:
      - chain: baremetalds-ofcir-pre
    test:
      - ref: wait
    post:
      - chain: baremetalds-ofcir-post
  documentation: |-
    This workflow provisions a bare metal cluster using dev-scripts with OVNKubernetes IPv4,
    then waits for 12 hours to allow manual cluster access before cleanup.
    Used for RHCOS 10 cluster bring-up and manual testing.
