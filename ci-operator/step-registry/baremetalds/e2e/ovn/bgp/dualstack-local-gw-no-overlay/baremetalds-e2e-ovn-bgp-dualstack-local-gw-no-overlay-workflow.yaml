workflow:
  as: baremetalds-e2e-ovn-bgp-dualstack-local-gw-no-overlay
  steps:
    cluster_profile: equinix-ocp-metal
    env:
      DEVSCRIPTS_CONFIG: |
        IP_STACK=v4v6
        # https://issues.redhat.com/browse/OCPBUGS-52194
        DHCP_LEASE_EXPIRY=0
      EXTRA_MG_ARGS: --host-network
      TEST_SKIPS: Services should fallback to local terminating endpoints when there
        are no ready endpoints with externalTrafficPolicy=Local\|CPU Partitioning
        cluster platform workloads should be annotated correctly for Deployments\|egressip\|EgressIP\|EgressService\|blocking
        ICMP needs frag\|Multicast
    pre:
      - ref: baremetalds-devscripts-conf-featureset
      - chain: baremetalds-ofcir-no-overlay-pre
      - ref: ovn-shared-to-local-gateway-mode-migration
      - ref: baremetalds-e2e-ovn-bgp-pre
      - ref: baremetalds-e2e-ovn-debug-enable-console
    test:
      - chain: baremetalds-ipi-test
    post:
      - ref: baremetalds-e2e-ovn-debug-console-gather
      - chain: baremetalds-ofcir-post
  documentation: |-
    This workflow executes the common end-to-end test suite on a cluster provisioned by running
    dev-scripts on a packet server with both IPv4 and IPv6 enabled, installed with the NoOverlay
    network transport and route advertisements enabled, and migrated to local gateway mode.

    It differs from baremetalds-e2e-ovn-bgp-dualstack-local-gw in that the cluster is installed
    with the NoOverlay transport, which is immutable and therefore cannot be patched in after the
    install the way the rest of the BGP configuration is. The transport requires the NoOverlayMode
    feature gate, so the job has to ask for a preview feature set.

    It does not configure the extra machine network or install kubernetes-nmstate, since the
    VRF-Lite scenarios that need them are not part of what this workflow is meant to cover.
