ref:
  as: baremetalds-e2e-bgp-vip-verify
  from: dev-scripts
  commands: baremetalds-e2e-bgp-vip-verify-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  grace_period: 10m
  documentation: |-
    Verifies BGP-based VIP management (enhancement 1982) on a dev-scripts
    cluster deployed with BGP_VIP_MANAGEMENT=true and ENABLE_BGP_TOR=true:
    Infrastructure.status vipManagement is BGP, control plane nodes run the
    frr-k8s static pods and no keepalived pods, the top-of-rack FRR speaker
    on the hypervisor has BGP paths for the API VIP from every master and
    for the ingress VIP from the workers, and the console route answers
    over the BGP-routed VIP.
