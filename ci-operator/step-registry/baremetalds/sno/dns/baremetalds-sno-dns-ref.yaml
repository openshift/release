ref:
  as: baremetalds-sno-dns
  from_image:
    namespace: ocp
    name: "5.1"
    tag: tools
  grace_period: 10m
  timeout: 30m
  commands: baremetalds-sno-dns-commands.sh
  env:
  - name: DNS_FORWARD_TEST_NAME
    default: example.com
    documentation: A stable public DNS name used to verify forwarding through the node-local CoreDNS.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Verifies the install-time UnifiedClusterManagedDNSAndLB behavior on a
    bootstrap-in-place, platform None, IPv4 single-node cluster. The step
    checks the MCO-managed static CoreDNS pod, direct API and ingress records,
    upstream forwarding, and the host resolver without changing resolver state.
    Missing DNS behavior is an intentional test failure until the component
    implementation lands; installation and feature-gate setup failures are
    reported separately and are not expected baseline failures.
