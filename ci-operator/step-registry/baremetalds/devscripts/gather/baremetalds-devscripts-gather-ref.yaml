ref:
  as: baremetalds-devscripts-gather
  best_effort: true
  from: dev-scripts
  grace_period: 10m
  timeout: 15m
  commands: baremetalds-devscripts-gather-commands.sh
  env:
  - name: DEVSCRIPTS_GATHER_AGENT
    default: "false"
    documentation: Use retained agent hosts and rendezvous discovery for additional SSH diagnostics instead of IPI DHCP/bootstrap addresses.
  resources:
    requests:
      cpu: 1000m
      memory: 1000Mi
  documentation: |-
    Gather additional logs specific to baremetal IPI deployments.
