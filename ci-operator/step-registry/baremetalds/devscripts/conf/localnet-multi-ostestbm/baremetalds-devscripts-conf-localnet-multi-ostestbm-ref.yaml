ref:
  as: baremetalds-devscripts-conf-localnet-multi-ostestbm
  from: dev-scripts
  commands: baremetalds-devscripts-conf-localnet-multi-ostestbm-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  env:
    - name: ATTACH_DEFAULT_NETWORK
      default: ""
      documentation: |-
        When set to localnet-multi, widens ostestbm dnsmasq DHCP pool and configures DNS
        for HCP endpoints before HyperShift guest cluster creation.
    - name: IP_STACK
      default: v4
      documentation: |-
        IP stack for the dev-scripts management cluster (v4, v6, v4v6, v6v4).
  timeout: 10m0s
  grace_period: 5m0s
  documentation: |-
    Prepare ostestbm libvirt network for localnet-multi HyperShift KubeVirt workers:
    widen the DHCP lease pool (avoiding node, VIP, and MetalLB addresses), point HCP
    API/ignition/konnectivity and *.apps DNS at the ingress VIP, and verify NAT forwarding.
