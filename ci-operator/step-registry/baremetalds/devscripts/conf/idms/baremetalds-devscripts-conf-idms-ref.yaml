ref:
  as: baremetalds-devscripts-conf-idms
  from: cli
  commands: baremetalds-devscripts-conf-idms-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: IDMS_MIRROR
    default: virthost.ostest.test.metalkube.org:5000/localimages/local-release-image
    documentation: |-
      Local registry repository used as the IDMS mirror. Must match the
      repository populated by dev-scripts when MIRROR_IMAGES=true.
  documentation: |-
    Write an ImageDigestMirrorSet extra manifest so a disconnected
    dev-scripts cluster has IDMS (not only ICSP) before CBO starts
    metal3-image-customization. copy-metal uses oc image extract
    --idms-file and ignores ImageContentSourcePolicy.
