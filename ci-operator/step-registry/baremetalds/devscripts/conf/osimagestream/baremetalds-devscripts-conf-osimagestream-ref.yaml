ref:
  as: baremetalds-devscripts-conf-osimagestream
  from: baremetal-installer
  commands: baremetalds-devscripts-conf-osimagestream-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  env:
    - name: OS_IMAGE_STREAM
      default: ""
      documentation: |-
        RHCOS OS image stream written by dev-scripts to install-config.yaml as
        `osImageStream`. Valid values: "rhel-9", "rhel-10". Empty (the default) leaves the
        field unset so the installer picks its own default for the release under test
        (rhel-9 on 4.22-4.24, rhel-10 from 5.0). Keep it empty for 4.22 and older: on 4.22
        the field is protected by the OSStreams feature gate, and on 4.21 and older the
        field does not exist.
  documentation: |-
    Configure dev-scripts OS_IMAGE_STREAM outside of DEVSCRIPTS_CONFIG, so that a job can
    set it without replacing the whole DEVSCRIPTS_CONFIG block.
