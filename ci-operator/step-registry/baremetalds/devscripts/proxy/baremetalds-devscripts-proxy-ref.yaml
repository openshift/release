ref:
  as: baremetalds-devscripts-proxy
  from: dev-scripts
  grace_period: 10m
  commands: baremetalds-devscripts-proxy-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  env:
  - name: CLUSTERTYPE
    default: virt
    documentation: Type of environment to run CI test on "virt" or "baremetal"
  - name: PROXY_ALLOW_STAGE_REGISTRY
    default: "false"
    documentation: Allow Squid access to registry.stage.redhat.io for jobs that need it.
  documentation: |-
    Installs and configures a squid proxy server for use with dev-scripts.
