ref:
  as: kubevirt-ssp-e2e
  from: src
  commands: kubevirt-ssp-e2e-commands.sh
  timeout: 3h
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: Install KubeVirt/CDI using SSP automation, deploy current-revision
    SSP images and run functional tests on a freshly provisioned s390x cluster.
