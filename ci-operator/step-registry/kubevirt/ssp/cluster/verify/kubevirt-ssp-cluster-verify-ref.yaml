ref:
  as: kubevirt-ssp-cluster-verify
  from: tools
  commands: kubevirt-ssp-cluster-verify-commands.sh
  timeout: 20m
  grace_period: 1m
  env:
  - name: CLUSTER_API_VERIFY_SECONDS
    default: "900"
    documentation: Maximum wait for the new HA s390x cluster to become healthy.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Verify the API-provisioned cluster identity and release, three control-plane
    and two worker s390x nodes, and cluster operator health. Does not run SSP tests
    or claim PVC, registry-route, KubeVirt/CDI or VM readiness.
