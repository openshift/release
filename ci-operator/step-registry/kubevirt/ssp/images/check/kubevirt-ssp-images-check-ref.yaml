ref:
  as: kubevirt-ssp-images-check
  from: src
  commands: kubevirt-ssp-images-check-commands.sh
  timeout: 15m
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: Check the current-revision SSP and validator image architecture and
    pin digests before provisioning a fresh s390x cluster.
  dependencies:
  - env: CI_OPERATOR_IMG
    name: ssp-operator-s390x
  - env: CI_VALIDATOR_IMG
    name: template-validator-s390x
