ref:
  as: kubevirt-libvirt-vpn
  from: libvirt-installer
  grace_period: 30m
  commands: kubevirt-libvirt-vpn-commands.sh
  env:
  # #NEED? ARCH/BRANCH required by #72780 but unused here
  - name: ARCH
  - name: BRANCH
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  dependencies:
  # #NEED? Copied from #72780
  - name: "release:latest"
    env: OPENSHIFT_INSTALL_TARGET
  documentation: >-
    Connectivity test into the SSP s390x orange-zone VPN / libvirt environment
    (cluster profile libvirt-s390x-vpn-virt). Validates external_ip, hostname
    from the leases file, HTTP reachability, and virsh access over the VPN.
