ref:
  as: kubevirt-libvirt-vpn
  # cli is enough for curl + sleep
  from: cli
  grace_period: 30m
  commands: kubevirt-libvirt-vpn-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: >-
    Connectivity smoke into the SSP s390x orange-zone VPN
    (cluster profile libvirt-s390x-vpn-virt). Curls :7001 on external_ip and
    internal_ip and checks for the configured hello body. No leases/hostname/virsh.
