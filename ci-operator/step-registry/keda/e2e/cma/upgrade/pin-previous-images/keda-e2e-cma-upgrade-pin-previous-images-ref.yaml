ref:
  as: keda-e2e-cma-upgrade-pin-previous-images
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  cli: latest
  commands: keda-e2e-cma-upgrade-pin-previous-images-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Rewrites the installed previous Custom Metrics Autoscaler CSV so its
    operator and operand images are the released ones on registry.redhat.io
    instead of the images built in this CI run, then waits for OLM to roll the
    operator deployment over to them. Without this the upgrade would start from
    the previous release's manifests running the operator built from the code
    under test, which upgrades only the manifests and can pair that operator
    with RBAC its own release never granted. The released build is derived from
    the CSV version, with an exception list for versions that were generated in
    the operator repository but never shipped as images. Requires
    keda-e2e-cma-upgrade-redhat-auth to have added registry.redhat.io
    credentials to the cluster's global pull secret.
