ref:
  as: security-adversary-scan
  from: claude-ai-helpers
  commands: security-adversary-scan-commands.sh
  credentials:
  - namespace: test-credentials
    name: sa-claude-openshift-ci
    mount_path: /var/run/claude-code-service-account
  - namespace: test-credentials
    name: claude-payload-agent-github-token
    mount_path: /var/run/github-token
  env:
  - name: CLAUDE_MODEL
    default: "claude-sonnet-4-6"
    documentation: |-
      Model to use for security scanning. Sonnet provides excellent quality
      at reasonable cost. Override with claude-opus-4-6 for maximum thoroughness.
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
  - name: CLOUD_ML_REGION
    default: "global"
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "openshift-ci-prow-agents"
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/google-token"
  - name: GITHUB_TOKEN_PATH
    default: "/var/run/github-token/token"
  - name: SCAN_MODE
    default: "changed-files"
    documentation: |-
      Scan scope: 'changed-files' (PR changes only), 'full-repo' (entire repo),
      or 'critical' (high-risk files only).
  - name: MAX_TURNS
    default: "50"
    documentation: |-
      Maximum conversation turns for Claude. Increase for complex repositories
      or groundwork mode.
  - name: ENABLE_GROUNDWORK
    default: "false"
    documentation: |-
      Enable groundwork mode for deep codebase analysis (architecture mapping,
      code pattern cataloging, API surface enumeration). Significantly increases
      cost and duration. Set to 'true' for major refactors or initial audits.
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  timeout: 2h0m0s
  grace_period: 1m0s
  documentation: |-
    Runs adversarial security scanning using the adversary skill from the
    security plugin. Scans across 17 security domains: SAST, IaC, containers,
    K8s, CI/CD, secrets, supply chain, web, API, auth, database, mobile, cloud,
    performance, git, agent/skill definitions, and critical workflows.

    Produces:
    - HTML security report with findings and remediation steps
    - JUnit XML for Prow integration
    - Structured JSON for archival and analytics

    Cost scales with scan scope: changed-files (~$0.50-2), full-repo (~$5-20),
    groundwork mode (~$50-200) depending on repository size and complexity.
