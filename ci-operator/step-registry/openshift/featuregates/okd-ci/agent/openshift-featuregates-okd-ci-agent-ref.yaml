ref:
  as: openshift-featuregates-okd-ci-agent
  from_image:
    namespace: ci
    name: python-validation
    tag: latest
  cli: latest
  grace_period: 1m
  commands: openshift-featuregates-okd-ci-agent-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: OKD_CI_FEATURE_GATES_INSTALLER
    default: agent
    documentation: Stage the early dev-scripts agent configuration hook.
  - name: ARCHITECTURE
    default: ""
    documentation: Match the effective dev-scripts initial payload selection.
  dependencies:
  - name: release:latest
    env: RELEASE_IMAGE_LATEST
  - name: release:latest
    env: OPENSHIFT_INSTALL_RELEASE_IMAGE
  - name: release:latest
    env: OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE
  documentation: |-
    Prepare payload-specific CustomNoUpgrade settings for OKD CI agent installs,
    to be consumed after agent configuration and before agent image creation.
