ref:
  as: openshift-kubernetes-e2e-node-test
  from: src
  commands: openshift-kubernetes-e2e-node-test-commands.sh
  timeout: 4h0m0s
  grace_period: 15m
  env:
  - name: NODE_E2E_FOCUS
    default: '\[NodeConformance\]'
    documentation: |-
      Ginkgo focus regexp selecting the test/e2e_node tests to run (FOCUS for `make test-e2e-node`).
  - name: NODE_E2E_SKIP
    default: '\[Flaky\]|\[Slow\]|\[Serial\]'
    documentation: |-
      Ginkgo skip regexp (SKIP for `make test-e2e-node`). Defaults to the upstream skip list.
  - name: NODE_E2E_PARALLELISM
    default: "8"
    documentation: |-
      Number of ginkgo processes. Use 1 when focusing on [Serial] tests.
  - name: NODE_E2E_TIMEOUT
    default: "3h"
    documentation: |-
      Overall test timeout on the remote host, as a Go duration.
  - name: NODE_E2E_TEST_ARGS
    default: >-
      --container-runtime-process-name=/usr/local/bin/crio --container-runtime-pid-file=
      --kubelet-flags="--cgroup-driver=systemd --cgroups-per-qos=true --cgroup-root=/ --runtime-cgroups=/system.slice/crio.service --kubelet-cgroups=/system.slice/kubelet.service"
      --extra-log="{\"name\": \"crio.log\", \"journalctl\": [\"-u\", \"crio\"]}"
    documentation: |-
      Extra arguments passed to e2e_node.test (TEST_ARGS for `make test-e2e-node`). Defaults to the
      arguments of the upstream CRI-O node e2e jobs.
  - name: CRIO_VERSION
    default: release-1.37
    documentation: |-
      CRI-O static bundle installed on the test host (github.com/cri-o/packaging): a version tag, a full
      commit SHA, or `main` / `release-X.Y` for the latest bundle built from that branch. Keep the default
      on the release branch matching the fork's Kubernetes minor.
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
    limits:
      memory: 12Gi
  documentation: |-
    Installs the CRI-O static bundle on the RHCOS VM created by gcp-crio-provision-buildhost, with the same
    configuration as the upstream FCOS CRI-O node e2e jobs (kubernetes/test-infra jobs/e2e_node/crio), then runs
    `make test-e2e-node REMOTE=true REMOTE_MODE=ssh` from the openshift/kubernetes source under test.
    The upstream remote runner builds kubelet and e2e_node.test locally, copies them to the VM, runs the
    suite there and copies JUnit results and logs back into the step artifacts.
