workflow:
  as: openshift-kubernetes-e2e-node-gcp
  steps:
    pre:
      - ref: gcp-crio-provision-vpc
      - ref: gcp-crio-provision-buildhost
    test:
      - ref: openshift-kubernetes-e2e-node-test
    post:
      - ref: gcp-crio-deprovision-buildhost
      - ref: gcp-crio-deprovision-vpc
    env:
      # Public RHEL 10 image rather than the prebuilt RHEL 9 crio-setup images, which are
      # also snapshots of 200GB disks whose >1e8 inodes break the Summary API
      # NodeConformance test. The test step installs CRI-O's build dependencies.
      IMAGE_FAMILY: "rhel-10"
      IMAGE_PROJECT: "rhel-cloud"
      BOOT_DISK_SIZE: "50GB"
  documentation: |-
    The Kubernetes node E2E workflow provisions a single RHEL 10 GCP VM (no OpenShift cluster), installs CRI-O on
    it, and runs test/e2e_node built from the openshift/kubernetes fork against it over SSH.
