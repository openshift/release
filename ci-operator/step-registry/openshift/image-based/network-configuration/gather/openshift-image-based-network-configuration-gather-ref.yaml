ref:
  as: openshift-image-based-network-configuration-gather
  from_image:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.21-openshift-4.16
  grace_period: 10m
  commands: openshift-image-based-network-configuration-gather-commands.sh
  env:
  - name: IPC_CLUSTER_NAME
    default: target
  - name: IBI_VM_NAME
    default: target
  - name: IPC_ORIGINAL_IPV4_GATEWAY_CIDR
    default: 192.168.127.1/24
    documentation: |-
      Host-side address of the IBI cluster's original IPv4 network. IPC
      recreates the libvirt network on the new subnet, so this address is
      re-added to the VM's bridge during gather to reach a node that never
      moved off (or rolled back to) its original IP. Empty disables it.
  documentation: |-
    Gather the network configuration artifacts for the IBI installed cluster.
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
