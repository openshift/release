ref:
  as: openshift-topology-transition-sno-install-sno
  from: upi-installer
  commands: openshift-topology-transition-sno-install-sno-commands.sh
  timeout: 2h
  grace_period: 5m
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
  documentation: Install a healthy platform None SNO on the EC2 libvirt host with
    MutableTopology explicitly enabled.
  credentials:
  - collection: ibu
    group: rhsm
    mount_path: /var/run/rhsm/
  - bundle: registry-pull-credentials
    mount_path: /var/run/pull-secret
    namespace: test-credentials
  dependencies:
  - name: release:latest
    env: RELEASE_IMAGE_LATEST
