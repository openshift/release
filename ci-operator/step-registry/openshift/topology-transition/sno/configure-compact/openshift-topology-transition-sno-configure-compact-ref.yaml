ref:
  as: openshift-topology-transition-sno-configure-compact
  from: upi-installer
  commands: openshift-topology-transition-sno-configure-compact-commands.sh
  timeout: 75m
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
  documentation: Wait for ready control-plane nodes and healthy etcd voters, move
    host and node DNS to the load balancer before removing the SNO DNS MachineConfig,
    and set compact HA scheduling policy after the rollout. Does not submit a topology
    request.
  grace_period: 5m
