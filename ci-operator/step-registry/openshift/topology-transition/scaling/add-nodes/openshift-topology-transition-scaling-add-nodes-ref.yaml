ref:
  as: openshift-topology-transition-scaling-add-nodes
  from: upi-installer
  commands: openshift-topology-transition-scaling-add-nodes-commands.sh
  timeout: 80m
  grace_period: 5m
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
  documentation: Add control-plane, worker, or infra VMs to the running cluster. Approve only
    expected node CSRs. Do not request a topology change or set scheduling policy.
  env:
  - name: NODE_ROLE
    documentation: Required. control-plane, worker, or infra. Infra uses worker Ignition
      and receives the infra label; callers set placement and taint policy.
  - name: ADDITIONAL_NODES
    documentation: Required. Positive count of new VMs; must fit the IPv4 subnet.
