ref:
  as: openshift-topology-transition-gather
  from: upi-installer
  commands: openshift-topology-transition-gather-commands.sh
  timeout: 30m
  grace_period: 5m
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
  documentation: Gather suite results, host logs and cluster diagnostics before EC2
    cleanup, including after a failed step.
