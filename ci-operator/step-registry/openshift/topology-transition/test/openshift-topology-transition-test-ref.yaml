ref:
  as: openshift-topology-transition-test
  from: upi-installer
  commands: openshift-topology-transition-test-commands.sh
  timeout: 220m
  grace_period: 5m
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
  dependencies:
  - name: tests
    env: TESTS_PULL_REF
  env:
  - name: TEST_SUITE
    default: openshift/topology-transitions
    documentation: Origin suite to run on the EC2 host.
  - name: TEST_SUITE_TIMEOUT
    default: 205m
    documentation: Outer process limit; origin still enforces its suite and CLI limits.
  - name: TARGET_CONTROL_PLANE_TOPOLOGY
    default: ''
    documentation: Required by topology transition suites; passed through to origin.
  - name: TARGET_INFRASTRUCTURE_TOPOLOGY
    default: ''
    documentation: Required by topology transition suites; passed through to origin.
  - name: TARGET_CONTROL_PLANE_NODES
    default: ''
    documentation: Required by topology transition suites; passed through to origin.
  - name: TARGET_COMPUTE_NODES
    default: ''
    documentation: Required by topology transition suites; passed through to origin.
  - name: TARGET_ARBITER_NODES
    default: ''
    documentation: Required by topology transition suites; passed through to origin.
  - name: TARGET_CONTROL_PLANE_NODES_SCHEDULABLE
    default: ''
    documentation: Required by topology transition suites; passed through to origin.
  documentation: Run an origin suite on the EC2 host using the job test image. Uses
    the image-based lanes SSH pattern and TEST_SUITE selection.
