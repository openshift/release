ref:
  as: openshift-topology-transition-test-preflight
  from: upi-installer
  commands: openshift-topology-transition-test-preflight-commands.sh
  timeout: 70m
  grace_period: 5m
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
  dependencies:
  - name: tests
    env: TESTS_PULL_REF
  env:
  - name: TEST_SUITE
    default: openshift/topology-transitions/preflight
    documentation: Origin suite to run on the EC2 host.
  - name: TEST_SUITE_TIMEOUT
    default: 55m
    documentation: Outer process limit; origin still enforces its suite and CLI limits.
  - name: TARGET_CONTROL_PLANE_TOPOLOGY
    default: ''
    documentation: Required by topology transition suites; passed through to origin.
  - name: TARGET_INFRASTRUCTURE_TOPOLOGY
    default: ''
    documentation: Required by topology transition suites; passed through to origin.
  - name: TARGET_CONTROL_PLANE_NODES
    default: ''
    documentation: Required by topology transition suites; passed through to origin.
  - name: TARGET_COMPUTE_NODES
    default: ''
    documentation: Required by topology transition suites; passed through to origin.
  - name: TARGET_ARBITER_NODES
    default: ''
    documentation: Required by topology transition suites; passed through to origin.
  - name: TARGET_CONTROL_PLANE_NODES_SCHEDULABLE
    default: ''
    documentation: Required by topology transition suites; passed through to origin.
  documentation: Preflight alias of the shared TEST_SUITE-driven EC2 runner. A unique
    name is required because CI rejects repeated step names in one workflow.
