chain:
  as: openshift-mcp-server-mcpchecker-eval-vertex-kubevirt
  steps:
  - ref: cnv-enable-nested-virtualization-aws
  - ref: cnv-deploy-cnv
  - ref: openshift-mcp-server-mcpchecker-eval-vertex-setup
  - ref: openshift-mcp-server-mcpchecker-eval
  documentation: |-
    Deploys OpenShift Virtualization (CNV) with nested virtualization on AWS,
    then runs mcpchecker evaluations against the kubevirt toolset using
    Vertex AI credentials.
    Set EVAL_CONFIG, EVAL_LABEL_SELECTOR, TOOLSETS, CNV_VERSION,
    GOOGLE_CLOUD_LOCATION, GOOGLE_CLOUD_PROJECT, and either
    GEMINI_USE_VERTEX or ANTHROPIC_USE_VERTEX via steps.env.
