ref:
  as: openshift-claude-agent-eval
  from: claude-ai-helpers
  commands: openshift-claude-agent-eval-commands.sh
  credentials:
  - namespace: test-credentials
    name: sa-claude-openshift-ci
    mount_path: /var/run/claude-code-service-account
  - namespace: test-credentials
    name: claude-payload-agent-github-token
    mount_path: /var/run/github-token
  env:
  - name: EVAL_HARNESS_REPO
    default: "https://github.com/opendatahub-io/agent-eval-harness.git"
  - name: EVAL_HARNESS_REF
    default: ""
  - name: EVAL_CONFIG
    default: "eval.yaml"
  - name: EVAL_MODEL
    default: "claude-opus-4-6"
  - name: MULTISTAGE_PARAM_OVERRIDE_EVAL_MODEL
    default: ""
    documentation: |-
      Gangway API override for EVAL_MODEL. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: EVAL_EFFORT
    default: ""
    documentation: |-
      Agent reasoning effort passed to /eval-run as --effort (e.g.
      low, medium, high, xhigh for the codex runner; the claude-code
      runner accepts its own levels). Empty means use the runner.effort
      default from the eval config.
  - name: MULTISTAGE_PARAM_OVERRIDE_EVAL_EFFORT
    default: ""
    documentation: |-
      Gangway API override for EVAL_EFFORT. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: EVAL_BASELINE
    default: ""
  - name: EVAL_PARALLELISM
    default: "1"
  - name: EVAL_CASES
    default: ""
  - name: EVAL_EXTRA_ARGS
    default: ""
  - name: EVAL_SETUP_SCRIPT
    default: ""
  - name: EVAL_CASES_DIR
    default: ""
  - name: EVAL_CHANGED_ONLY
    default: ""
  - name: EVAL_DISCOVER
    default: ""
  - name: EVAL_WORKDIR
    default: ""
    documentation: |-
      Working directory for eval discovery and execution. Defaults to
      /opt/ai-helpers when unset. Override for repos that layer content
      onto the claude-ai-helpers image at a different path.
  - name: EVAL_MAX_TURNS
    default: "100"
  - name: CLAUDE_MODEL
    default: "claude-opus-4-6"
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
  - name: CLOUD_ML_REGION
    default: "global"
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "openshift-ci-prow-agents"
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/google-token"
  - name: GITHUB_TOKEN_PATH
    default: "/var/run/github-token/token"
  resources:
    requests:
      cpu: 1000m
      memory: 4Gi
  timeout: 4h0m0s
  grace_period: 1m0s
  documentation: |-
    Runs skill evaluations using the agent-eval-harness. Installs the
    eval harness plugin, runs /eval-run with the specified config and
    model, and produces JUnit XML, AutoDL session metrics, and artifacts.
    Eval traces and reports are archived for download.
