ref:
  as: openshift-claude-bulk-triage
  from: claude-ai-helpers
  commands: openshift-claude-bulk-triage-commands.sh
  credentials:
  - collection: ci-claude-code
    group: claude-openshift-ci
    mount_path: /var/run/claude-code-service-account
  - collection: openshift-qse
    group: openshift-qse-jira-sa
    mount_path: /var/run/qse-jira-sa
  - collection: openshift-qse
    group: claude-bulk-triage-dpcr-token
    mount_path: /var/run/dpcr-token
  env:
  - name: TRIAGE_VIEW
    default: ""
    documentation: |-
      Component Readiness view to triage (e.g. "5.0-main"). When empty,
      the latest OCP version is auto-detected from Sippy and "<version>-main"
      is used.
  - name: MULTISTAGE_PARAM_OVERRIDE_TRIAGE_VIEW
    default: ""
    documentation: |-
      Gangway API override for TRIAGE_VIEW. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: TRIAGE_COMPONENTS
    default: "Installer Unknown"
    documentation: |-
      Space-separated component filters passed to the
      bulk-triage-regressions skill.
  - name: TRIAGE_VIEWS
    default: ""
    documentation: |-
      Space-separated list of Component Readiness views to triage in one
      run (e.g. "4.20-main 4.21-main 4.22-main"). When set, it takes
      precedence over TRIAGE_VIEW; the pre-pass groups regressions across
      all listed views. Used by the GA policy.
      "auto" resolves the list from Sippy at run time: every OCP release
      in /api/releases with Component Readiness and a GA date on or before
      today whose <version>-main view has regression tracking enabled.
      The resolved list, and the views added or removed since the previous
      run, are written to views.json; a failed lookup fails the run.
  - name: MULTISTAGE_PARAM_OVERRIDE_TRIAGE_VIEWS
    default: ""
    documentation: |-
      Gangway API override for TRIAGE_VIEWS. When triggering via Gangway,
      pass as pod_spec_options.envs.
  - name: TRIAGE_POLICY
    default: "devel"
    documentation: |-
      Which rulebook the run follows.
      "devel" (default): the daily triage of the release in development,
      exactly as before.
      "ga": released versions. The run starts with a script that lists and
      groups the regressions (no AI involved), follows the skill's GA
      rulebook, publishes triage-manifest.json, and checks its own writes
      afterwards (runner-receipt.json). It never files new JIRA issues.
      The older names "pre-ga" and "post-ga" are still accepted.
  - name: TRIAGE_WRITES
    default: ""
    documentation: |-
      What the run may change in Sippy and JIRA.
      "none": change nothing; only report what it would have done.
      "existing": link regressions to bugs that already exist (Sippy triage
      records, triage links, comments); never file new bugs.
      "all": may also file new bugs. Only allowed with TRIAGE_POLICY=devel.
      Empty means "all" for devel and "none" for ga. With the GA policy, a
      failed self-check in an earlier run makes later runs behave as
      "none" until it is acknowledged (see TRIAGE_ACK_RECEIPT).
  - name: MULTISTAGE_PARAM_OVERRIDE_TRIAGE_WRITES
    default: ""
    documentation: |-
      Gangway API override for TRIAGE_WRITES. When triggering via Gangway,
      pass as pod_spec_options.envs.
  - name: TRIAGE_ANALYSIS
    default: "full"
    documentation: |-
      "full" runs the complete AI analysis. "quick" only checks the last
      24 hours for a sudden spike of new regressions: no AI, no writes; it
      publishes burst-status.json and a short HTML summary.
  - name: TRIAGE_BASELINE
    default: "auto"
    documentation: |-
      "auto" compares with this job's previous run (and, for a quick run,
      with the latest full GA run) to see what is new or growing. "none"
      starts from scratch.
  - name: TRIAGE_BASELINE_JOB
    default: ""
    documentation: |-
      TRIAGE_ANALYSIS=quick only: the full-analysis job whose latest
      triage-manifest.json is the comparison point. Empty derives it from
      this job's name (cr-burst-tripwire -> bulk-triage-ga).
  - name: TRIAGE_ACK_RECEIPT
    default: ""
    documentation: |-
      If a run's self-check finds something it shouldn't have done (a new
      Jira issue, or a Sippy change it didn't announce), later runs stop
      writing and only report. To allow writes again, a manager reviews
      that run and starts the job once with this set to the run's ID.
      Leave empty normally.
  - name: MULTISTAGE_PARAM_OVERRIDE_TRIAGE_ACK_RECEIPT
    default: ""
    documentation: |-
      Gangway API override for TRIAGE_ACK_RECEIPT. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: AI_HELPERS_REPO
    default: ""
    documentation: |-
      Optional GitHub repository (org/repo, e.g. "myfork/ai-helpers") to
      use instead of the ai-helpers copy baked into the image. When set,
      it is cloned and replaces /opt/ai-helpers before the skill runs.
      Useful for rehearsing skill changes from a fork.
  - name: AI_HELPERS_REF
    default: "main"
    documentation: |-
      Git branch, tag, or commit to check out from AI_HELPERS_REPO.
      Ignored when AI_HELPERS_REPO is empty.
  - name: MULTISTAGE_PARAM_OVERRIDE_AI_HELPERS_REPO
    default: ""
    documentation: |-
      Gangway API override for AI_HELPERS_REPO. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: MULTISTAGE_PARAM_OVERRIDE_AI_HELPERS_REF
    default: ""
    documentation: |-
      Gangway API override for AI_HELPERS_REF. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
  - name: CLOUD_ML_REGION
    default: "global"
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "openshift-ci-prow-agents"
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/google-token"
  - name: JIRA_CLIENT_ID_PATH
    default: "/var/run/qse-jira-sa/jira-client-id"
    documentation: |-
      Path to the OAuth client ID of the service-account credential in the
      openshift-qse-jira-sa secret. The commands script reads it and
      exports JIRA_CLIENT_ID for the skill's JIRA reads and writes (triage
      links, comments, new bugs).
  - name: JIRA_CLIENT_SECRET_PATH
    default: "/var/run/qse-jira-sa/jira-client-secret"
    documentation: |-
      Path to the OAuth client secret of the service-account credential in
      the openshift-qse-jira-sa secret. The commands script reads it and
      exports JIRA_CLIENT_SECRET for the skill's JIRA reads and writes.
  - name: JIRA_CLOUD_ID
    default: "2b9e35e3-6bd3-4cec-b838-f4249ee02432"
    documentation: |-
      Atlassian cloud ID of the JIRA site (redhat.atlassian.net, as published
      at https://redhat.atlassian.net/_edge/tenant_info). Service-account
      requests go to https://api.atlassian.com/ex/jira/<cloud ID>.
  - name: DPCR_TOKEN_PATH
    default: "/var/run/dpcr-token/token"
    documentation: |-
      Path to the DPCR (Sippy) service-account bearer token from the
      claude-bulk-triage-dpcr-token credential. The commands script reads it
      and exports DPCR_TOKEN, used to authenticate to
      sippy-auth.dptools.openshift.org for creating/updating Component
      Readiness triage records.
  - name: CLAUDE_MODEL
    default: "claude-opus-4-8"
    documentation: |-
      Claude model used for the triage analysis.
  - name: MULTISTAGE_PARAM_OVERRIDE_CLAUDE_MODEL
    default: ""
    documentation: |-
      Gangway API override for CLAUDE_MODEL. When triggering via
      Gangway, pass as pod_spec_options.envs.
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  timeout: 4h0m0s
  grace_period: 1m0s
  documentation: |-
    Runs the ai-helpers bulk-triage-regressions skill for a Component
    Readiness view: lists untriaged regressions, clusters them into
    root-cause buckets, deep-dives artifacts, creates/updates Sippy triage
    records (linking regressions to existing JIRA bugs) using the DPCR
    service-account token, and writes a markdown duty report to the
    artifacts directory. JIRA access (openshift-qse-jira-sa) is
    read-write: the skill files new JIRA bugs, comments on bugs, and
    appends Component Readiness triage links as the service account.
    TRIAGE_WRITES=existing files no new JIRA bugs; those become report
    proposals. With TRIAGE_POLICY=ga (released versions), the run never
    files bugs, starts with a scripted pre-pass over TRIAGE_VIEWS, writes
    triage-manifest.json next to the report and checks its own writes
    afterwards; see TRIAGE_ACK_RECEIPT. TRIAGE_ANALYSIS=quick only checks
    for a spike of new regressions, without AI. The report is also
    rendered as an HTML summary shown on the Prow job page.
    Release blockers and new Sippy labels/symptoms remain report
    recommendations rather than being created.
