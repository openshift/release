ref:
  as: openshift-claude-bulk-triage
  from: claude-ai-helpers
  commands: openshift-claude-bulk-triage-commands.sh
  credentials:
  - collection: ci-claude-code
    group: claude-openshift-ci
    mount_path: /var/run/claude-code-service-account
  - collection: openshift-qse
    group: openshift-qse-managers-bot
    mount_path: /var/run/qse-bot-managers
  - collection: openshift-qse
    group: claude-bulk-triage-dpcr-token
    mount_path: /var/run/dpcr-token
  env:
  - name: TRIAGE_VIEW
    default: ""
    documentation: |-
      Component Readiness view to triage (e.g. "5.0-main"). When empty,
      the latest OCP version is auto-detected from Sippy and "<version>-main"
      is used.
  - name: MULTISTAGE_PARAM_OVERRIDE_TRIAGE_VIEW
    default: ""
    documentation: |-
      Gangway API override for TRIAGE_VIEW. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: TRIAGE_COMPONENTS
    default: "Installer Unknown"
    documentation: |-
      Space-separated component filters passed to the
      bulk-triage-regressions skill.
  - name: TRIAGE_EXISTING_ONLY
    default: "false"
    documentation: |-
      When "true", run the bulk-triage-regressions skill with
      --existing-only: triage records, triage links, and comments are
      written only for verified matches to existing JIRA issues, and no new
      JIRA issues are filed. Buckets needing a new bug are reported under
      "Proposed new bugs (not filed)".
  - name: MULTISTAGE_PARAM_OVERRIDE_TRIAGE_EXISTING_ONLY
    default: ""
    documentation: |-
      Gangway API override for TRIAGE_EXISTING_ONLY. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: TRIAGE_VIEWS
    default: ""
    documentation: |-
      Space-separated list of Component Readiness views to triage in one
      run (e.g. "4.20-main 4.21-main 4.22-main"). When set, it takes
      precedence over TRIAGE_VIEW; the pre-pass clusters regressions
      across all listed views. Used by the post-GA policy.
  - name: MULTISTAGE_PARAM_OVERRIDE_TRIAGE_VIEWS
    default: ""
    documentation: |-
      Gangway API override for TRIAGE_VIEWS. When triggering via Gangway,
      pass as pod_spec_options.envs.
  - name: TRIAGE_POLICY
    default: "duty"
    documentation: |-
      "duty" (default) runs the skill exactly as before. "post-ga" runs
      the post-GA policy for released versions: implies
      TRIAGE_EXISTING_ONLY=true, runs the deterministic pre-pass
      (scripts/prepass.py) before the agent, follows
      references/post-ga-policy.md, limits JIRA writes to triage links and
      the backport-candidate comment, publishes triage-manifest.json, and
      runs the post-run audit (Sippy triage-catalogue diff, account-wide
      JIRA creations) plus runner-receipt.json.
  - name: MULTISTAGE_PARAM_OVERRIDE_TRIAGE_POLICY
    default: ""
    documentation: |-
      Gangway API override for TRIAGE_POLICY. When triggering via Gangway,
      pass as pod_spec_options.envs.
  - name: TRIAGE_WRITE_MODE
    default: "auto"
    documentation: |-
      "auto" lets the skill write triage records (and, under post-ga, the
      allowed JIRA writes) when the policy's evidence bar is met. "report"
      performs no Sippy or JIRA write at all and records every intended
      action with status skipped-report-mode (shadow mode). Only honoured
      by TRIAGE_POLICY=post-ga; the previous run's receipt can force
      "report" regardless of this setting.
  - name: MULTISTAGE_PARAM_OVERRIDE_TRIAGE_WRITE_MODE
    default: ""
    documentation: |-
      Gangway API override for TRIAGE_WRITE_MODE. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: TRIAGE_MODE
    default: "weekly"
    documentation: |-
      "weekly" runs the full analysis. "tripwire" runs only the
      deterministic pre-pass over the last 24 hours of newly opened
      regressions, writes burst-status.json to the artifacts directory and
      exits without any LLM call or write.
  - name: MULTISTAGE_PARAM_OVERRIDE_TRIAGE_MODE
    default: ""
    documentation: |-
      Gangway API override for TRIAGE_MODE. When triggering via Gangway,
      pass as pod_spec_options.envs.
  - name: TRIAGE_BASELINE
    default: "auto"
    documentation: |-
      "auto" fetches triage-manifest.json (weekly) or burst-status.json
      (tripwire) from the latest preceding attempt of the same job in
      GCS and uses it as the baseline for growth/lineage/dedup. "none"
      runs without a baseline (first run, or when job history is not
      readable).
  - name: MULTISTAGE_PARAM_OVERRIDE_TRIAGE_BASELINE
    default: ""
    documentation: |-
      Gangway API override for TRIAGE_BASELINE. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: POSTGA_ACK_RECEIPT
    default: ""
    documentation: |-
      Run id whose runner-receipt.json a bulk_triage_managers member
      acknowledges. When it names the latest preceding attempt, a receipt
      that would otherwise force TRIAGE_WRITE_MODE=report (a JIRA creation
      or an undeclared Sippy write recorded by the audit) is accepted and
      the configured write mode applies again. Normally passed once via
      Gangway after review.
  - name: MULTISTAGE_PARAM_OVERRIDE_POSTGA_ACK_RECEIPT
    default: ""
    documentation: |-
      Gangway API override for POSTGA_ACK_RECEIPT. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: AI_HELPERS_REPO
    default: ""
    documentation: |-
      Optional GitHub repository (org/repo, e.g. "myfork/ai-helpers") to
      use instead of the ai-helpers copy baked into the image. When set,
      it is cloned and replaces /opt/ai-helpers before the skill runs.
      Useful for rehearsing skill changes from a fork.
  - name: AI_HELPERS_REF
    default: "main"
    documentation: |-
      Git branch, tag, or commit to check out from AI_HELPERS_REPO.
      Ignored when AI_HELPERS_REPO is empty.
  - name: MULTISTAGE_PARAM_OVERRIDE_AI_HELPERS_REPO
    default: ""
    documentation: |-
      Gangway API override for AI_HELPERS_REPO. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: MULTISTAGE_PARAM_OVERRIDE_AI_HELPERS_REF
    default: ""
    documentation: |-
      Gangway API override for AI_HELPERS_REF. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
  - name: CLOUD_ML_REGION
    default: "global"
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "openshift-ci-prow-agents"
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/google-token"
  - name: JIRA_EMAIL_PATH
    default: "/var/run/qse-bot-managers/jira-email"
    documentation: |-
      Path to the Atlassian account email from the openshift-qse-bot-managers
      credential. The commands script reads it and exports JIRA_USERNAME for
      the skill's JIRA reads and writes (triage links, comments, new bugs).
  - name: JIRA_PAT_PATH
    default: "/var/run/qse-bot-managers/jira-pat"
    documentation: |-
      Path to the JIRA API token (PAT) from the openshift-qse-bot-managers
      credential. The commands script reads it and exports JIRA_API_TOKEN for
      the skill's JIRA reads and writes (triage links, comments, new bugs).
  - name: DPCR_TOKEN_PATH
    default: "/var/run/dpcr-token/token"
    documentation: |-
      Path to the DPCR (Sippy) service-account bearer token from the
      claude-bulk-triage-dpcr-token credential. The commands script reads it
      and exports DPCR_TOKEN, used to authenticate to
      sippy-auth.dptools.openshift.org for creating/updating Component
      Readiness triage records.
  - name: CLAUDE_MODEL
    default: "claude-opus-4-8"
    documentation: |-
      Claude model used for the triage analysis.
  - name: MULTISTAGE_PARAM_OVERRIDE_CLAUDE_MODEL
    default: ""
    documentation: |-
      Gangway API override for CLAUDE_MODEL. When triggering via
      Gangway, pass as pod_spec_options.envs.
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  timeout: 4h0m0s
  grace_period: 1m0s
  documentation: |-
    Runs the ai-helpers bulk-triage-regressions skill for a Component
    Readiness view: lists untriaged regressions, clusters them into
    root-cause buckets, deep-dives artifacts, creates/updates Sippy triage
    records (linking regressions to existing JIRA bugs) using the DPCR
    service-account token, and writes a markdown duty report to the
    artifacts directory. JIRA access (openshift-qse-bot-managers) is
    read-write: the skill files new JIRA bugs, comments on bugs, and
    appends Component Readiness triage links as the service account.
    With TRIAGE_EXISTING_ONLY=true, no new JIRA bugs are filed; those
    become report proposals.
    With TRIAGE_POLICY=post-ga (released versions), the run is
    existing-only, starts with the deterministic pre-pass over
    TRIAGE_VIEWS, follows references/post-ga-policy.md, writes
    triage-manifest.json next to the report, audits itself afterwards
    (Sippy triage-catalogue diff against the declared actions, account-wide
    JIRA creations in the run window) and writes runner-receipt.json; a
    receipt recording a creation or an undeclared write forces the next
    run into TRIAGE_WRITE_MODE=report until a manager acknowledges it via
    POSTGA_ACK_RECEIPT. TRIAGE_MODE=tripwire runs only the pre-pass over
    the last 24 hours and publishes burst-status.json without any LLM call.
    Release blockers and new Sippy labels/symptoms remain report
    recommendations rather than being created.
