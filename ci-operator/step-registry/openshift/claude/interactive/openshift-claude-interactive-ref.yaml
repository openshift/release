ref:
  as: openshift-claude-interactive
  from: claude-ai-helpers
  commands: openshift-claude-interactive-commands.sh
  credentials:
  - namespace: test-credentials
    name: sa-claude-openshift-ci
    mount_path: /var/run/claude-code-service-account
  env:
  - name: INTERACTIVE_DURATION
    default: "14400"
    documentation: |-
      How long (in seconds) the step keeps the pod alive for interactive
      use. Defaults to 4 hours. The step exits earlier if
      /tmp/finish is created inside the container.
  - name: MULTISTAGE_PARAM_OVERRIDE_INTERACTIVE_DURATION
    default: ""
    documentation: |-
      Gangway API override for INTERACTIVE_DURATION. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
  - name: CLOUD_ML_REGION
    default: "global"
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "openshift-ci-prow-agents"
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/google-token"
  - name: CLAUDE_MODEL
    default: "claude-opus-4-8"
    documentation: |-
      Suggested Claude model for interactive sessions; exported to the
      container environment so `claude --model "${CLAUDE_MODEL}"` works
      out of the box.
  - name: MULTISTAGE_PARAM_OVERRIDE_CLAUDE_MODEL
    default: ""
    documentation: |-
      Gangway API override for CLAUDE_MODEL. When triggering via
      Gangway, pass as pod_spec_options.envs.
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  timeout: 4h30m0s
  grace_period: 1m0s
  documentation: |-
    Keeps a pod with the Claude CLI (wired to Vertex via the
    sa-claude-openshift-ci credential) alive for interactive use. Users
    with access to the build cluster can `oc exec` into the test
    container and run `claude` directly; all required Vertex environment
    variables are part of the container environment and therefore
    inherited by exec'd shells. The step sleeps for INTERACTIVE_DURATION
    seconds (default 4h) or until /tmp/finish is created.
