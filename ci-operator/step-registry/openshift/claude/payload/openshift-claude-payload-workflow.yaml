workflow:
  as: openshift-claude-payload
  steps:
    test:
    - ref: openshift-claude-payload-agent
    post:
    - ref: openshift-claude-post
  documentation: |-
    Analyzes rejected release payloads using the configured agentic-ci
    harness. Runs the payload agent to identify root causes and
    optionally stage reverts, then generates a continue-session HTML
    page in artifacts when a Claude session archive is available.
