ref:
  as: openshift-claude-payload-agent
  from: claude-ai-helpers
  nested_podman: true
  commands: openshift-claude-payload-agent-commands.sh
  credentials:
  - namespace: test-credentials
    name: sa-claude-openshift-ci
    mount_path: /var/run/claude-code-service-account
  - namespace: test-credentials
    name: sa-codex-openshift-ci
    mount_path: /var/run/codex-openai-api-key
  - namespace: test-credentials
    name: trt-alert-slack-webhook-url
    mount_path: /var/run/slack-webhook
  - namespace: test-credentials
    name: claude-payload-agent-github-token
    mount_path: /var/run/github-token
  - namespace: test-credentials
    name: ci-pull-credentials
    mount_path: /var/run/ci-pull-credentials
  env:
  - name: PAYLOAD_TAG
  - name: MULTISTAGE_PARAM_OVERRIDE_PAYLOAD_TAG
    default: ""
    documentation: |-
      Gangway API override for PAYLOAD_TAG. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
  - name: CLOUD_ML_REGION
    default: "global"
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "openshift-ci-prow-agents"
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/google-token"
  - name: CLAUDE_MODEL
    default: "claude-opus-5"
  - name: CODEX_MODEL
    default: "gpt-5.6-sol"
  - name: OPENAI_API_KEY_PATH
    default: "/var/run/codex-openai-api-key/token"
    documentation: |-
      Path to the OpenAI API key mounted from the
      sa-codex-openshift-ci secret. The key is exported as
      OPENAI_API_KEY only when the Codex harness is selected.
  - name: AGENT_HARNESS
    default: "claude-code"
    documentation: |-
      Agentic CI harness used for payload analysis. Supported values are
      claude-code and codex.
  - name: AGENT_EFFORT
    default: "low"
    documentation: |-
      Default effort used by the selected agent harness. Supported Claude
      values are low, medium, high, xhigh, and max. Supported Codex values
      are minimal, low, medium, high, xhigh, and max.
  - name: MULTISTAGE_PARAM_OVERRIDE_AGENT_HARNESS
    default: ""
    documentation: |-
      Gangway API override for AGENT_HARNESS. Supported values are
      claude-code and codex. Codex uses the API key mounted from the
      sa-codex-openshift-ci secret. When triggering via Gangway, this can
      be combined with model and effort overrides:
      "pod_spec_options": {
        "envs": {
          "MULTISTAGE_PARAM_OVERRIDE_AGENT_HARNESS": "codex",
          "MULTISTAGE_PARAM_OVERRIDE_AGENT_MODEL": "gpt-5.6-sol",
          "MULTISTAGE_PARAM_OVERRIDE_AGENT_EFFORT": "high"
        }
      }
  - name: MULTISTAGE_PARAM_OVERRIDE_AGENT_MODEL
    default: ""
    documentation: |-
      Gangway API override for the model used by the selected agent
      harness. When unset, CLAUDE_MODEL or CODEX_MODEL supplies the
      harness-specific default.
  - name: MULTISTAGE_PARAM_OVERRIDE_AGENT_EFFORT
    default: ""
    documentation: |-
      Gangway API override for the effort used by the selected agent
      harness. Supported Claude values are low, medium, high, xhigh, and
      max. Supported Codex values are minimal, low, medium, high, xhigh,
      and max, subject to model support. When unset, AGENT_EFFORT supplies
      the configured default.
  - name: SLACK_WEBHOOK_URL
    default: "/var/run/slack-webhook/url"
  - name: GITHUB_TOKEN_PATH
    default: "/var/run/github-token/token"
  - name: RELEASE_CONTROLLER_URL
    default: "https://amd64.ocp.releases.ci.openshift.org"
    documentation: |-
      Base URL of the release controller. Override for OKD with
      https://amd64.origin.releases.ci.openshift.org.
  - name: ENABLE_SLACK_NOTIFICATIONS
    default: "true"
  - name: REGISTRY_AUTH_FILE
    default: "/var/run/ci-pull-credentials/.dockerconfigjson"
    documentation: |-
      Credentials for podman to pull release images from
      registry.ci.openshift.org when extracting the RHCOS rpmdb.
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  timeout: 12h0m0s
  grace_period: 1m0s
  documentation: |-
    Analyzes rejected release payloads using a configurable AI coding
    agent harness. Creates a deterministic snapshot of payload data,
    then runs the payload-analysis skill to identify root causes and
    generate an HTML report with revert recommendations.
