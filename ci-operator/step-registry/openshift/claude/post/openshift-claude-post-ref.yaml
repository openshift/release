ref:
  as: openshift-claude-post
  from: claude-ai-helpers
  best_effort: true
  commands: openshift-claude-post-commands.sh
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  timeout: 10m0s
  documentation: |-
    Post step that extracts shared Claude OTEL telemetry and agent-eval-harness
    cost totals into an autodl artifact, then generates a continue-session HTML
    page when a session archive is present. The page provides a one-click copy
    command for resuming the CI session locally using the ai-helpers marketplace.
