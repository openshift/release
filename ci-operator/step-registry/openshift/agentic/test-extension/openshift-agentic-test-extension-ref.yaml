ref:
  as: openshift-agentic-test-extension
  from: agentic-validation
  cli: latest
  commands: openshift-agentic-test-extension-commands.sh
  credentials:
  - namespace: test-credentials
    bundle: registry-pull-credentials
    mount_path: /var/run/registry-pull-credentials
  dependencies:
  - name: release:latest
    env: RELEASE_IMAGE_LATEST
  env:
  - name: VALIDATION_COMPONENT
    documentation: Payload component whose running container supplies the test extension.
  - name: EXTENSION_BINARY_PATH
    documentation: Absolute path to the raw gzip-compressed extension executable inside the component container.
  - name: EXTENSION_SOURCE
    documentation: Expected source identifier in the extension's list tests JSON, for example openshift:payload:router.
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
  timeout: 10m0s
  grace_period: 1m0s
  documentation: |-
    Checks test-extension packaging and discovery against the installed payload.
    Verifies a ready container runs the selected component digest, reads the gzip
    artifact through the target API, checks its CRC, raw ELF format and host
    architecture, then executes list tests and requires nonempty metadata with
    the expected extension source. Publishes deployment evidence, test metadata
    and JUnit. This deterministic product regression precedes agentic validation.
