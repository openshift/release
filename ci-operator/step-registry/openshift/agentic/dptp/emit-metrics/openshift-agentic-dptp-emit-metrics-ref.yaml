ref:
  as: openshift-agentic-dptp-emit-metrics
  from: agentic-dev
  commands: openshift-agentic-dptp-emit-metrics-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Emits telemetry for DPTP agentic workflows. Reads phase metadata from
    SHARED_DIR (written by jira-solver or review-responder), copies
    pre-computed session metrics autodl, and generates autodl JSON for
    BigQuery jira_agent table and JUnit XML for Prow/Sippy.
