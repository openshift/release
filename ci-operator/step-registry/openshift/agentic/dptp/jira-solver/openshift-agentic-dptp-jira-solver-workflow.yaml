workflow:
  as: openshift-agentic-dptp-jira-solver
  steps:
    pre:
    - ref: openshift-agentic-dptp-github-app-auth
    - ref: openshift-agentic-dptp-init
    test:
    - ref: openshift-agentic-dptp-jira-solver
    - ref: openshift-agentic-dptp-review-responder
    post:
    - ref: openshift-agentic-dptp-emit-metrics
  documentation: |-
    Solves a Jira issue using Claude or headless Codex (AGENT_HARNESS), creates a PR, then polls for
    review comments and addresses them.
