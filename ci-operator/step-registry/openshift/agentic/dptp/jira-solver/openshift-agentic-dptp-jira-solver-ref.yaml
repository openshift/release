ref:
  as: openshift-agentic-dptp-jira-solver
  from: agentic-dev
  commands: openshift-agentic-dptp-jira-solver-commands.sh
  credentials:
  - collection: ci-claude-code
    group: claude-openshift-ci
    mount_path: /var/run/claude-code-service-account
  - collection: ci-claude-code
    group: codex-openshift-ci
    mount_path: /var/run/codex-openai-api-key
  - collection: test-platform-infra
    group: dptp-agent-gh-app
    mount_path: /var/run/github-token
  - namespace: test-credentials
    bundle: registry-pull-credentials
    mount_path: /var/run/registry-pull-credentials
  env:
  - name: UPSTREAM_REPO
  - name: FORK_REPO
  - name: SETUP_SCRIPT
    default: "hack/agentic_setup.sh"
  - name: ALLOWED_TOOLS
    default: "Bash Read Write Edit Grep Glob WebFetch WebSearch Agent LSP Skill TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite ToolSearch"
    documentation: Claude tool allow-list; Codex uses native command rules instead.
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
  - name: CLOUD_ML_REGION
    default: "global"
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "openshift-ci-prow-agents"
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/google-token"
  - name: AGENT_HARNESS
    default: "claude-code"
    documentation: Select claude-code or codex for the whole workflow.
  - name: CODEX_MODEL
    default: "gpt-6-sol"
    documentation: Worker model when AGENT_HARNESS is codex.
  - name: CODEX_GATE_MODEL
    default: "gpt-5.6-sol"
    documentation: Review gate model when AGENT_HARNESS is codex.
  - name: AGENT_EFFORT
    default: "high"
    documentation: Reasoning effort supported by the selected harness and model.
  - name: OPENAI_API_KEY_PATH
    default: "/var/run/codex-openai-api-key/token"
    documentation: OpenAI API key file, read only when Codex is selected.
  - name: MULTISTAGE_PARAM_OVERRIDE_AGENT_HARNESS
    default: ""
    documentation: Gangway per-run override for AGENT_HARNESS (claude-code or codex).
  - name: MULTISTAGE_PARAM_OVERRIDE_AGENT_MODEL
    default: ""
    documentation: Gangway per-run override for the worker model of the selected harness.
  - name: MULTISTAGE_PARAM_OVERRIDE_AGENT_GATE_MODEL
    default: ""
    documentation: Gangway per-run override for the review gate model of the selected harness.
  - name: MULTISTAGE_PARAM_OVERRIDE_AGENT_EFFORT
    default: ""
    documentation: Gangway per-run override for AGENT_EFFORT.
  - name: CLAUDE_MODEL
    default: "claude-opus-4-6"
  - name: REGISTRY_AUTH_FILE
    default: /var/run/registry-pull-credentials/.dockerconfigjson
    documentation: Pull secret for nested-podman QCI/registry.ci image pulls.
  nested_podman: true
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  timeout: 2h0m0s
  grace_period: 1m0s
  documentation: |-
    Solves a Jira issue using the selected Claude or headless Codex harness. Reads issue data and common
    functions from SHARED_DIR (written by openshift-agentic-dptp-init).
    Runs repo-specific setup, invokes the selected harness, and creates a PR.
