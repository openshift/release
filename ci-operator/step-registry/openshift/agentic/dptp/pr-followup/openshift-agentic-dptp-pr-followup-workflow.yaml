workflow:
  as: openshift-agentic-dptp-pr-followup
  steps:
    pre:
    - ref: openshift-agentic-dptp-github-app-auth
    - ref: openshift-agentic-dptp-init
    test:
    - ref: openshift-agentic-dptp-pr-followup
    - ref: openshift-agentic-dptp-review-responder
    post:
    - ref: openshift-agentic-dptp-emit-metrics
  documentation: |-
    Finds the PR for a Jira issue, checks out the branch, then polls
    for review comments and addresses them using Claude.
