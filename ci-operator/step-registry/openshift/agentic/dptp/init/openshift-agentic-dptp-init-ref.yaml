ref:
  as: openshift-agentic-dptp-init
  from: agentic-dev
  commands: openshift-agentic-dptp-init-commands.sh
  credentials:
  - collection: ci-claude-code
    group: claude-openshift-ci
    mount_path: /var/run/claude-code-service-account
  - collection: test-platform-infra
    group: jira-token-dptp-bot
    mount_path: /var/run/jira-token
  env:
  - name: JIRA_ISSUE_KEY
    default: ""
    documentation: |-
      Jira issue key to process. Required.
      Set via Gangway: MULTISTAGE_PARAM_OVERRIDE_JIRA_ISSUE_KEY.
  - name: MULTISTAGE_PARAM_OVERRIDE_JIRA_ISSUE_KEY
    default: ""
    documentation: |-
      Gangway API override for JIRA_ISSUE_KEY. When triggering via
      Gangway, pass as pod_spec_options.envs.
  - name: UPSTREAM_REPO
    documentation: |-
      Upstream GitHub repo (e.g., "openshift/ci-tools").
  - name: FORK_REPO
    documentation: |-
      Fork repo to push branches to (e.g., "openshift-dptp/ci-tools").
  - name: JIRA_USERNAME
    default: "aos-team-dp-testplatform@redhat.com"
    documentation: Jira account used for basic auth together with the API token.
  - name: JIRA_BASE_URL
    default: "https://redhat.atlassian.net"
    documentation: Base URL of the Jira instance.
  - name: JIRA_TOKEN_FIELD
    default: "password"
    documentation: |-
      File name in the jira-token-dptp-bot credential mount that holds the
      Jira API token (the group has both "password" and "token" fields).
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  timeout: 5m0s
  grace_period: 1m0s
  documentation: |-
    Pre-step for DPTP agentic workflows. Validates that GitHub App
    tokens exist in SHARED_DIR (from github-app-auth step), fetches
    the Jira issue using the DPTP bot credentials, and writes results to SHARED_DIR for subsequent
    steps.
