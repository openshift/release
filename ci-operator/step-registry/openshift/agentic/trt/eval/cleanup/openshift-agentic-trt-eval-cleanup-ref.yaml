ref:
  as: openshift-agentic-trt-eval-cleanup
  from: agentic-dev
  commands: openshift-agentic-trt-eval-cleanup-commands.sh
  env:
  - name: UPSTREAM_REPO
    documentation: |-
      Eval repo to clean up PRs and branches from.
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Cleans up eval artifacts: closes the eval PR and deletes the
    timestamped branch from the eval repo. Runs as a post-step so
    cleanup happens even if the test phase fails.
