ref:
  as: openshift-agentic-trt-eval-cleanup
  from: agentic-dev
  commands: openshift-agentic-trt-eval-cleanup-commands.sh
  env:
  - name: UPSTREAM_REPO
    documentation: |-
      Eval repo to clean up PRs and branches from.
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Uses prow-agent-eval-python CLI to close PRs and delete branches.
    Runs as a post-step so cleanup happens even if the test phase fails.
