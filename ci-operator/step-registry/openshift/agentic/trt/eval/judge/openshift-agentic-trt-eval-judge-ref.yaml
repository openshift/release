ref:
  as: openshift-agentic-trt-eval-judge
  from: agentic-dev
  commands: openshift-agentic-trt-eval-judge-commands.sh
  env:
  - name: EVAL_CONFIG
    default: "/opt/ai-helpers/evals/trt-agentic-solve/solve-eval.yaml"
    documentation: |-
      Path to the eval config YAML inside the image.
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  timeout: 1h0m0s
  grace_period: 1m0s
  documentation: |-
    Eval judge step. Uses prow-agent-eval CLI to collect post-agent
    state, run judges, and emit JUnit XML, YAML, and HTML reports.
