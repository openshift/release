ref:
  as: openshift-agentic-trt-eval-judge
  from: agentic-dev
  commands: openshift-agentic-trt-eval-judge-commands.sh
  env:
  - name: UPSTREAM_REPO
    documentation: |-
      Target repo for PR lookup (eval repo).
  - name: FORK_REPO
    documentation: |-
      Fork repo (eval repo, same as UPSTREAM_REPO for eval).
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  timeout: 1h0m0s
  grace_period: 1m0s
  documentation: |-
    Eval judge step. Compares Claude's solution against the known-good
    expected branch. Runs hardcoded checks (compiles, tests pass, PR
    created) and diff-based scoring (file overlap, diff size ratio,
    function overlap). Outputs JUnit XML and summary YAML.
