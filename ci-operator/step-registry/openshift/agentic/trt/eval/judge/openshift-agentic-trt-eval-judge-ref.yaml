ref:
  as: openshift-agentic-trt-eval-judge
  from: agentic-dev
  commands: openshift-agentic-trt-eval-judge-commands.sh
  env:
  - name: EVAL_CONFIG
    default: "/opt/ai-helpers/evals/trt-agentic-solve/solve-eval.yaml"
    documentation: |-
      Path to the eval config YAML inside the image.
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  timeout: 1h0m0s
  grace_period: 1m0s
  documentation: |-
    Reports failed solves explicitly and judges the remaining cases independently
    using prow-agent-eval. Retains per-case JUnit/YAML/HTML reports and emits a
    combined outcome index and JUnit report without aborting at the first error.
