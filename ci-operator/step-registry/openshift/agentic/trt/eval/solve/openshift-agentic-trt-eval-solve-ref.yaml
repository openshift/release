ref:
  as: openshift-agentic-trt-eval-solve
  from: agentic-dev
  commands: openshift-agentic-trt-eval-solve-commands.sh
  credentials:
  - namespace: test-credentials
    name: hypershift-team-claude-prow
    mount_path: /var/run/claude-code-service-account
  - namespace: test-credentials
    name: trt-agent-gh-app
    mount_path: /var/run/github-token
  env:
  - name: UPSTREAM_REPO
  - name: FORK_REPO
  - name: SETUP_SCRIPT
    default: "hack/agentic_setup.sh"
  - name: ALLOWED_TOOLS
    default: "Bash Read Write Edit Grep Glob WebFetch WebSearch Agent LSP Skill TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite ToolSearch"
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
  - name: CLOUD_ML_REGION
    default: "global"
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "itpc-gcp-hybrid-pe-eng-claude"
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/claude-prow"
  - name: CLAUDE_MODEL
    default: "claude-opus-4-6"
  - name: EVAL_PARALLELISM
    default: "5"
    documentation: |-
      Maximum number of eval cases to solve concurrently.
  nested_podman: true
  resources:
    requests:
      cpu: 4000m
      memory: 8Gi
  timeout: 6h0m0s
  grace_period: 2m0s
  documentation: |-
    Parallel eval dispatcher. Reads the case list from eval-init,
    runs the repo setup script once, then solves each case in parallel
    (up to EVAL_PARALLELISM concurrently). Each case gets its own
    working directory and Claude session. Creates a PR per case.
