workflow:
  as: openshift-agentic-trt-eval
  steps:
    pre:
    - ref: openshift-agentic-trt-github-app-auth
    - ref: openshift-agentic-trt-eval-init
    test:
    - ref: openshift-agentic-trt-eval-solve
    - ref: openshift-agentic-trt-eval-judge
    post:
    - ref: openshift-agentic-trt-eval-cleanup
  documentation: |-
    Evaluates the jira-solver against known-good historical cases.
    eval-init discovers cases and writes per-case metadata,
    eval-solve runs the solver in parallel across all cases,
    eval-judge compares results against expected solutions.
    Cleanup closes all eval PRs and deletes branches.
