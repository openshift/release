workflow:
  as: openshift-agentic-trt-eval
  steps:
    pre:
    - ref: openshift-agentic-trt-github-app-auth
    - ref: openshift-agentic-trt-eval-init
    test:
    - ref: openshift-agentic-trt-jira-solver
    - ref: openshift-agentic-trt-eval-judge
    post:
    - ref: openshift-agentic-trt-eval-cleanup
  documentation: |-
    Evaluates the jira-solver step against a known-good historical case.
    Uses eval-init to set up the workspace at a historical commit, runs
    the actual jira-solver step, then judges the result against the
    expected solution branch. Cleanup closes the eval PR and deletes
    the branch.
