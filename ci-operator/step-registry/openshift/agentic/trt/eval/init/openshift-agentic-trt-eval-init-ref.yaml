ref:
  as: openshift-agentic-trt-eval-init
  from: agentic-dev
  commands: openshift-agentic-trt-eval-init-commands.sh
  env:
  - name: UPSTREAM_REPO
    documentation: |-
      Target repo for the eval (org/repo format).
  - name: EVAL_CASE
    default: ""
    documentation: |-
      Eval case directory name (e.g., case-001-trt-2698-mcp-tests).
      If empty, discovers and runs all cases.
      Override via Gangway: MULTISTAGE_PARAM_OVERRIDE_EVAL_CASE.
  - name: MULTISTAGE_PARAM_OVERRIDE_EVAL_CASE
    default: ""
    documentation: |-
      Gangway API override for EVAL_CASE.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  timeout: 10m0s
  documentation: |-
    Eval init step. Uses prow-agent-eval CLI to discover cases,
    validate inputs, and write per-case metadata to SHARED_DIR.
