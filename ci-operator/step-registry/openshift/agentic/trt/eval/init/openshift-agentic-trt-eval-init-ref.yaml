ref:
  as: openshift-agentic-trt-eval-init
  from: agentic-dev
  commands: openshift-agentic-trt-eval-init-commands.sh
  env:
  - name: EVAL_CASE
    default: ""
    documentation: |-
      Eval case directory name (e.g., case-001-trt-2698-mcp-tests).
      If empty, discovers and runs all cases.
      Override via Gangway: MULTISTAGE_PARAM_OVERRIDE_EVAL_CASE.
  - name: MULTISTAGE_PARAM_OVERRIDE_EVAL_CASE
    default: ""
    documentation: |-
      Gangway API override for EVAL_CASE.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  timeout: 10m0s
  documentation: |-
    Eval init step. Reads case configuration from the ai-helpers image,
    copies JIRA JSON snapshots to SHARED_DIR, and writes per-case
    metadata (jira key, base/expected branches) for downstream steps.
