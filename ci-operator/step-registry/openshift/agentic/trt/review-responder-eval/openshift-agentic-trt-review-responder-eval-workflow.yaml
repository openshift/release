workflow:
  as: openshift-agentic-trt-review-responder-eval
  steps:
    pre:
    - ref: openshift-agentic-trt-github-app-auth
    - ref: openshift-agentic-trt-review-responder-eval-init
    - ref: openshift-agentic-trt-runtime-policy
    test:
    - ref: openshift-agentic-trt-review-responder-eval-respond
    - ref: openshift-agentic-trt-review-responder-eval-judge
    post:
    - ref: openshift-agentic-trt-review-responder-eval-cleanup
  documentation: |-
    Evaluates the review-responder against seeded review comments on a
    deliberately flawed PR. Init creates the PR and posts comments,
    respond runs the responder in single-pass mode, judge evaluates
    whether the responder made correct code changes, declined scope
    creep, refused security probes, and ignored unactionable comments.
    Cleanup closes the eval PR and deletes the branch.
    Rehearse alongside solver changes to check the shared agentic-dev image.
