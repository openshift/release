ref:
  as: openshift-agentic-trt-review-responder-eval-judge
  from: agentic-dev
  commands: openshift-agentic-trt-review-responder-eval-judge-commands.sh
  env:
  - name: UPSTREAM_REPO
    documentation: |-
      Target repo for PR lookup (eval repo).
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  timeout: 1h0m0s
  grace_period: 1m0s
  documentation: |-
    Review-responder eval judge step. Evaluates how well the responder
    handled seeded review comments: did it make the right code changes,
    decline scope creep, refuse security probes, and ignore unactionable
    comments. Outputs JUnit XML and summary HTML.
