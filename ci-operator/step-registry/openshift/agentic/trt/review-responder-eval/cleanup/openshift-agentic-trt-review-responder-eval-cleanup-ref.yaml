ref:
  as: openshift-agentic-trt-review-responder-eval-cleanup
  from: agentic-dev
  commands: openshift-agentic-trt-review-responder-eval-cleanup-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Cleans up review-responder eval artifacts: closes the eval PR and
    deletes the timestamped branch. Runs as a post-step so cleanup
    happens even if the test phase fails.
