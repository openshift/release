ref:
  as: openshift-agentic-trt-review-responder
  from: agentic-dev
  commands: openshift-agentic-trt-review-responder-commands.sh
  credentials:
  - collection: ci-claude-code
    group: claude-openshift-ci
    mount_path: /var/run/claude-code-service-account
  - collection: ci-claude-code
    group: codex-openshift-ci
    mount_path: /var/run/codex-openai-api-key
  - collection: ci-claude-code
    group: zai-openshift-ci
    mount_path: /var/run/zai-api-key
  - collection: technical-release-team
    group: openshift-trt-agent-gh-app
    mount_path: /var/run/github-token
  - namespace: test-credentials
    bundle: registry-pull-credentials
    mount_path: /var/run/registry-pull-credentials
  env:
  - name: UPSTREAM_REPO
  - name: FORK_REPO
  - name: SETUP_SCRIPT
    default: "hack/agentic_setup.sh"
  - name: ALLOWED_TOOLS
    default: "Bash Read Write Edit Grep Glob WebFetch WebSearch Agent LSP Skill TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite ToolSearch"
    documentation: Claude Code tool list; used by the gate only.
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
  - name: CLOUD_ML_REGION
    default: "global"
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "openshift-ci-prow-agents"
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/google-token"
  - name: CLAUDE_MODEL
    default: "claude-opus-4-6"
    documentation: |-
      Legacy model input; used only when AGENT_MODEL and its override are unset.
  - name: AGENT_MODEL
    default: ""
    documentation: |-
      Worker agent model for the OpenCode harness: alias (glm, sol, luna,
      claude-*) or provider/model ID (google-vertex*, openai/*, zai/*).
      Empty or unresolvable falls back to google-vertex-anthropic/claude-opus-4-6@default.
      Does not affect the gate (always GATE_MODEL via the claude CLI).
  - name: MULTISTAGE_PARAM_OVERRIDE_AGENT_MODEL
    default: ""
    documentation: Gangway API override for AGENT_MODEL.
  - name: OPENAI_API_KEY_PATH
    default: "/var/run/codex-openai-api-key/token"
    documentation: OpenAI API key file for openai/* models (luna, sol).
  - name: ZAI_API_KEY_PATH
    default: "/var/run/zai-api-key/token"
    documentation: Z.ai API key file for glm; falls back until provisioned.
  - name: GATE_MODEL
    default: "claude-haiku-4-5"
  - name: REGISTRY_AUTH_FILE
    default: /var/run/registry-pull-credentials/.dockerconfigjson
    documentation: Pull secret for nested-podman QCI/registry.ci image pulls.
  nested_podman: true
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  timeout: 3h0m0s
  grace_period: 1m0s
  documentation: |-
    Polls every 5 minutes until at least 6 iterations have passed AND
    3 consecutive idle iterations occur. A small-model gate runs the
    has-review-work skill. COMMENT_WORK=yes invokes address-review-pr;
    failing required CI invokes address-ci-failures once per PR HEAD. Review
    comments are evaluated independently.
    A short CI/security block matching jira-solver is prepended;
    repo-specific REVIEW.md is appended last on the
    review worker. Credential-dumping shell tools are disallowed. Bash
    verifies the PR head repository, branch, SHA, and effective fork URLs,
    then fetches and checks out the exact commit before workers run; pushes
    remain limited to that fork ref.
    Rewritten history uses a force-with-lease pinned to the captured SHA after
    the PR head is revalidated; upstream and unrestricted force pushes are
    never used. Mints a fresh GitHub App token (1h TTL) immediately before
    comment workers and git push.
    Reads PR number from SHARED_DIR (written by jira-solver or pr-followup).
