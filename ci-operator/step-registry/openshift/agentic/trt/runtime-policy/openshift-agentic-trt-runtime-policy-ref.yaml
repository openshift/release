ref:
  as: openshift-agentic-trt-runtime-policy
  from: agentic-dev
  commands: openshift-agentic-trt-runtime-policy-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Writes the shared serial-agent runtime policy helper to SHARED_DIR for the
    Jira solver, review responder, and their evaluation workflows. Consumers
    generate per-session hooks and settings that deny delegation and agent
    pushes, while allowing the review responder to use gh for review operations.
