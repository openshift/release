workflow:
  as: openshift-agentic-trt-jira-planner
  steps:
    pre:
    - ref: openshift-agentic-trt-github-app-auth
    - ref: openshift-agentic-trt-init-model
    - ref: openshift-agentic-trt-init
    test:
    - ref: openshift-agentic-trt-jira-planner
    - ref: openshift-agentic-trt-review-responder
    post:
    - ref: openshift-agentic-trt-emit-metrics
  documentation: |-
    Creates an implementation plan for a Jira issue using Claude,
    creates a PR with the plan document, then polls for review
    comments and addresses them.
