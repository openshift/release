workflow:
  as: openshift-agentic-trt-pr-followup
  steps:
    pre:
    - ref: openshift-agentic-trt-github-app-auth
    - ref: openshift-agentic-trt-init-model
    - ref: openshift-agentic-trt-init
    test:
    - ref: openshift-agentic-trt-pr-followup
    - ref: openshift-agentic-trt-review-responder
    post:
    - ref: openshift-agentic-trt-emit-metrics
  documentation: |-
    Selects an explicit PR number when supplied, otherwise finds the PR for a
    Jira issue, checks out its validated fork head, then polls for review
    comments and addresses them using the configured agent.
