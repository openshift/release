ref:
  as: openshift-agentic-trt-init-model
  from: agentic-dev
  commands: openshift-agentic-trt-init-model-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  timeout: 5m0s
  grace_period: 1m0s
  documentation: |-
    Writes SHARED_DIR/trt-init-model.sh and SHARED_DIR/trt-telemetry.sh.
    Solve and review steps source the telemetry helper. It resolves
    AGENT_MODEL, honors MULTISTAGE_PARAM_OVERRIDE_AGENT_MODEL, and
    prepares the Codex harness when the model name starts with gpt-.
    Codex runs retain image-provisioned workflow skills, register only
    project MCP servers allowed by ALLOWED_TOOLS, and install a repository's
    enabled public ai-helpers GitHub skills through agentic-ci. The telemetry
    helper also provides pipeline-owned Prow screenshot artifact handoff.
    When EVAL_MODE=true, OTEL stays in SHARED_DIR and session metrics
    are skipped. Included by the jira-solver, pr-followup, eval, and
    review-responder-eval workflows.
