ref:
  as: openshift-agentic-trt-emit-metrics
  from: agentic-dev
  commands: openshift-agentic-trt-emit-metrics-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Emits telemetry for TRT agentic workflows. Reads phase metadata from
    SHARED_DIR (written by jira-solver or review-responder) and generates
    autodl JSON for the BigQuery jira_agent table and JUnit XML for
    Prow/Sippy. Per-phase Claude session cost is written by each step
    into its own ARTIFACT_DIR.
