ref:
  as: openshift-agentic-trt-emit-metrics
  from: agentic-dev
  commands: openshift-agentic-trt-emit-metrics-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Emits telemetry for TRT agentic workflows. Reads phase metadata from
    SHARED_DIR (written by jira-solver or review-responder), extracts
    session metrics from OTEL log, and generates autodl JSON for BigQuery
    jira_agent table and JUnit XML for Prow/Sippy. Skips autodl emission
    when EVAL_MODE=true to keep test data out of BigQuery.
