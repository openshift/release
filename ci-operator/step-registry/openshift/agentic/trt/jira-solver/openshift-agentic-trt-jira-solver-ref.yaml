ref:
  as: openshift-agentic-trt-jira-solver
  from: agentic-dev
  commands: openshift-agentic-trt-jira-solver-commands.sh
  credentials:
  - collection: ci-claude-code
    group: claude-openshift-ci
    mount_path: /var/run/claude-code-service-account
  - collection: ci-claude-code
    group: codex-openshift-ci
    mount_path: /var/run/codex-openai-api-key
  - collection: technical-release-team
    group: openshift-trt-agent-gh-app
    mount_path: /var/run/github-token
  - namespace: test-credentials
    bundle: registry-pull-credentials
    mount_path: /var/run/registry-pull-credentials
  env:
  - name: UPSTREAM_REPO
  - name: FORK_REPO
  - name: SETUP_SCRIPT
    default: "hack/agentic_setup.sh"
  - name: ALLOWED_TOOLS
    default: "Bash Read Write Edit Grep Glob WebFetch WebSearch Agent LSP Skill TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite ToolSearch"
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
  - name: CLOUD_ML_REGION
    default: "global"
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "openshift-ci-prow-agents"
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/google-token"
  - name: AGENT_MODEL
    default: "claude-opus-4-6"
    documentation: |-
      Model used for the solve. Change this default to change the model
      for jobs that do not supply an override. gpt-* models use Codex;
      other models use Claude Code.
  - name: MULTISTAGE_PARAM_OVERRIDE_AGENT_MODEL
    default: ""
    documentation: |-
      Gangway override for the solve model. When unset, AGENT_MODEL is
      used. Pass it via pod_spec_options.envs:
      "pod_spec_options": { "envs": { "MULTISTAGE_PARAM_OVERRIDE_AGENT_MODEL": "gpt-6.1-sol" } }
  - name: OPENAI_API_KEY_PATH
    default: "/var/run/codex-openai-api-key/token"
    documentation: |-
      Path to the OpenAI API key mounted from the codex-openshift-ci
      secret. Exported as OPENAI_API_KEY only when the Codex harness
      is selected.
  - name: REGISTRY_AUTH_FILE
    default: /var/run/registry-pull-credentials/.dockerconfigjson
    documentation: Pull secret for nested-podman QCI/registry.ci image pulls.
  nested_podman: true
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  timeout: 2h0m0s
  grace_period: 1m0s
  documentation: |-
    Solves a Jira issue with the configured agent model. Reads issue
    data and common functions from SHARED_DIR (written by
    openshift-agentic-trt-init). Runs repo-specific setup, invokes the
    agent, and creates a PR.
    The default model is AGENT_MODEL (claude-opus-4-6). Change that default
    on this ref to change the model for jobs that do not supply an
    override. Supply a per-job override through Gangway as
    pod_spec_options.envs.MULTISTAGE_PARAM_OVERRIDE_AGENT_MODEL. When
    that variable is unset, AGENT_MODEL is used. A gpt-* model uses
    the Codex harness; any other model uses Claude Code.
