workflow:
  as: openshift-agentic-agentic-docs-doc-creator
  steps:
    pre:
      - ref: openshift-agentic-agentic-docs-github-app-auth
    test:
      - ref: openshift-agentic-agentic-docs-doc-creator
      - ref: openshift-agentic-agentic-docs-review-responder
  documentation: |-
    Creates lean component documentation using Claude's iterative
    generate-docs loop (generate, then review and fix until clean),
    creates a PR, then polls for review comments and addresses them.
    Requires ai-docs/ to NOT already exist in the target repository.
