ref:
  as: openshift-agentic-prepare-validation
  from: agentic-validation
  commands: openshift-agentic-prepare-validation-commands.sh
  credentials:
  - collection: test-platform-infra
    group: jira-token-dptp-bot
    mount_path: /var/run/jira-token
  - collection: test-platform-infra
    group: agent-validation-model
    mount_path: /var/run/validation-model
  env:
  - name: VALIDATION_MODEL_URL
    default: https://models.corp.redhat.com/oai/v1/chat/completions
    documentation: HTTPS Chat Completions endpoint. Redirects are rejected.
  - name: VALIDATION_PREPARE_MODEL
    default: granite-3.3-8b-instruct
    documentation: Planning model; validate compatibility and plan quality before enabling a job.
  - name: VALIDATION_MODEL_TOKEN_FILE
    default: /var/run/validation-model/token
    documentation: Bearer token file; never shared with generated commands.
  - name: VALIDATION_MODEL_CA_FILE
    default: /var/run/validation-model/ca-bundle
    documentation: Additional trusted CA bundle for the model endpoint. Extends system trust; set empty for system trust alone. Never shared with generated commands.
  - name: JIRA_USERNAME
    default: aos-team-dp-testplatform@redhat.com
    documentation: Jira account for basic authentication.
  - name: JIRA_TOKEN_FILE
    default: /var/run/jira-token/password
    documentation: Jira API token file. Retrieval failure is recorded and PR fallback is attempted.
  - name: VALIDATION_TIMEOUT_SECONDS
    default: "600"
    documentation: Overall preparation deadline in seconds, including source retrieval (600 seconds = 10 minutes).
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  timeout: 12m0s
  grace_period: 1m0s
  documentation: |-
    Generates a Jira-first, revision-bound validation plan using the PR description
    and tested diff as fallback. Publishes validation.md, validation.json and source
    references; passes the checked plan through SHARED_DIR. Requires a single PR,
    the agentic-validation image alias and model credentials. Reuses a source
    checkout when available; otherwise fetches the exact tested Git trees.
    Empty, ambiguous, contradictory and incomplete plans fail preparation.
