workflow:
  as: openshift-azurestack-upi-csi
  steps:
    pre:
    - chain: upi-azurestack-pre
    post:
    - chain: gather-core-dump
    - chain: upi-azurestack-post
  documentation: |-
    This workflow validates an OpenShift UPI installation on Azure Stack Hub,
    then gathers artifacts and deprovisions the cluster. CSI end-to-end tests
    and their setup/checks are disabled because they have not provided a reliable
    signal (OCPBUGS-86825).
