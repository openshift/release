workflow:
  as: openshift-azurestack
  steps:
    pre:
    - chain: ipi-azurestack-pre
    post:
    - chain: gather-core-dump
    - chain: ipi-azurestack-post
  documentation: |-
    This workflow validates an OpenShift IPI installation on Azure Stack Hub,
    then gathers artifacts and deprovisions the cluster. End-to-end tests are
    disabled because they have not provided a reliable signal (OCPBUGS-86825).
