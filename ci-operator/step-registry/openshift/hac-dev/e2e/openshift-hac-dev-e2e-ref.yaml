ref:
  as: openshift-hac-dev-e2e
  cli: latest
  commands: "openshift-hac-dev-e2e-commands.sh"
  credentials:
  - mount_path: /usr/local/ci-secrets/github
    group: periodic-tests
    collection: hac-dev
  - mount_path: /usr/local/ci-secrets/devsandbox
    group: hac-devsandbox-keycloak
    collection: hac-dev
  - mount_path: /usr/local/ci-secrets/ephemeralbot
    group: ephemeral-bot-svc-account
    collection: hac-dev
  from: e2e-runner
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
