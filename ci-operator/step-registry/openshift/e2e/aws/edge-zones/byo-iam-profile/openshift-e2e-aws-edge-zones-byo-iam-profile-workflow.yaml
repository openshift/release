workflow:
  as: openshift-e2e-aws-edge-zones-byo-iam-profile
  steps:
    leases:
    - resource_type: aws-edge-zones-quota-slice
      env: LEASED_RESOURCE
    pre:
    - ref: ipi-aws-pre-edge-zones-opt-in
    - ref: aws-provision-iam-profile
    - chain: ipi-conf-aws
    - ref: ipi-conf-aws-byo-iam-profile
    - chain: aws-provision-iam-user-minimal-permission
    - ref: rhcos-conf-osstream
    - chain: ipi-install
    - ref: ipi-aws-pre-edge-zones-csi-default
    test:
    - ref: aws-verify-iam-profile
    - ref: openshift-e2e-test
    - ref: edge-nodes-deploy-app
    post:
    - chain: ipi-aws-post
    - ref: aws-deprovision-iam-profile
    env:
      AWS_EDGE_POOL_ENABLED: "yes"
      EDGE_ZONE_TYPES: "local-zone"
      PROVISION_EDGE_IAM_PROFILE: "yes"
      ENABLE_BYO_IAM_PROFILE_EDGE: "true"
  documentation: |-
    The E2E AWS edge zones BYO IAM profile workflow executes the common end-to-end
    test suite with OVNKubernetes network plugin on an AWS cluster whose compute
    nodes extend to AWS edge zones, using bring-your-own (BYO) IAM instance profiles
    for the control plane, compute, and edge compute pools. By default only AWS Local
    Zones are used; set EDGE_ZONE_TYPES (e.g. "local-zone,wavelength-zone") at the job
    level to also include AWS Wavelength Zones.
