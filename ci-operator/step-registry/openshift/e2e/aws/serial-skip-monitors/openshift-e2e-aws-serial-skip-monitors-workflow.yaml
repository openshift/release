workflow:
  as: openshift-e2e-aws-serial-skip-monitors
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: ipi-aws-pre
    test:
    - ref: openshift-e2e-test-serial-skip-monitors
    post:
    - chain: ipi-aws-post
    env:
      TEST_SUITE: openshift/multus-cni/serial
  documentation: |-
    The Openshift E2E AWS `serial` workflow executes the `openshift/multus-cni/serial` end-to-end test suite on AWS with a default cluster configuration. Monitor tests are skipped.
