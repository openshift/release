ref:
  as: openshift-e2e-aws-hostport-firewall
  from_image:
    namespace: ocp
    name: "4.12"
    tag: upi-installer
  grace_period: 10m
  commands: openshift-e2e-aws-hostport-firewall-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Open the OTE host-port range (30000-32767, TCP/UDP) on the cluster security
    groups so OTE E2E tests can reach host-networked pods from the bastion host.
