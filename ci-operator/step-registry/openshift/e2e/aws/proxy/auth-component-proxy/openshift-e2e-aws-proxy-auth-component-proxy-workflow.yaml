workflow:
  as: openshift-e2e-aws-proxy-auth-component-proxy
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: ipi-aws-pre-proxy
    test:
    - ref: openshift-e2e-test
    post:
    - ref: gather-aws-console
    - chain: gather
    - ref: gather-proxy
    - ref: ipi-deprovision-deprovision
    - ref: ipi-deprovision-proxy
    - ref: ipi-deprovision-aws-blackholenetwork
  documentation: |-
    The OpenShift E2E AWS workflow runs the AuthenticationComponentProxy
    conformance tests (all cases in test/extended/authentication/component_proxy.go,
    selected via the [OCPFeatureGate:AuthenticationComponentProxy] annotation) on a
    cluster installed with the standard CI cluster-wide proxy. The tests configure
    only authentication/cluster.spec.proxy and must not modify proxy/cluster.
