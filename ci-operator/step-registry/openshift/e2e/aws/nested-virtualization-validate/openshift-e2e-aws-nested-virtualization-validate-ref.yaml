ref:
  as: openshift-e2e-aws-nested-virtualization-validate
  from: cli
  commands: openshift-e2e-aws-nested-virtualization-validate-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Validates that AWS compute nodes have nested virtualization enabled.

    This step reads the EC2 instance information from the artifact directory
    (created by ipi-install-aws-verify-resources) and verifies that all compute
    nodes have CpuOptions.NestedVirtualization set to "Enabled".

    Fails the test if:
    - The EC2 instances artifact is not found
    - Any compute node does not have nested virtualization enabled
    - No compute nodes are found
