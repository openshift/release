ref:
  as: openshift-e2e-aws-nested-virtualization-validate
#  from_image:
#    namespace: ocp
#    name: cli-jq
#    tag: latest
  from: upi-installer
  commands: openshift-e2e-aws-nested-virtualization-validate-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Validates that AWS compute nodes have nested virtualization enabled.

    This step queries EC2 directly using the AWS CLI to retrieve instance information
    for the cluster and verifies that all compute nodes have CpuOptions.NestedVirtualization
    set to "Enabled".

    Fails the test if:
    - Cannot determine the cluster infrastructure ID
    - AWS API calls fail
    - Any compute node does not have nested virtualization enabled
    - No compute nodes are found
