workflow:
  as: openshift-e2e-aws-windows-node-tls-adherence
  steps:
    env:
      SUB_CHANNEL: stable
      SUB_INSTALL_NAMESPACE: openshift-windows-machine-config-operator
      SUB_PACKAGE: windows-machine-config-operator
      SUB_TARGET_NAMESPACES: '!install'
    pre:
      - chain: ipi-conf-aws
      - ref: ovn-conf
      - ref: ovn-conf-hybrid-manifest
      - chain: ipi-install
      - ref: tls-adherence
      - ref: operatorhub-subscribe
      - ref: windows-conf-operator
      - ref: ipi-conf-aws-windows-machineset
    test:
      - ref: clusterbot-wait
    post:
      - chain: ipi-aws-post
  documentation: |-
    The OpenShift E2E AWS Windows Node TLS Adherence workflow provisions a normal AWS IPI
    OVNKubernetes hybrid cluster, enables TLSAdherence with the Intermediate TLS profile,
    installs WMCO through OperatorHub, creates Windows Machine API workers, and keeps the
    cluster available for manual WMCO TLS adherence testing.
