workflow:
  as: openshift-e2e-aws-csi-fsx-ontap-alerts
  steps:
    pre:
    - chain: ipi-aws-pre
    - ref: openshift-tests-extension-setup-out-of-payload
    - chain: storage-conf-csi-aws-fsx-ontap
    test:
    - ref: openshift-e2e-test
    post:
    - ref: storage-destroy-csi-aws-fsx-ontap
    - chain: ipi-aws-post
  documentation: |-
    Provisions FSx for NetApp ONTAP and Trident, installs the CSO out-of-payload
    test extension, and runs the disruptive CSO storage-path alert suite. The
    existing FSxN/Trident destroy step runs before AWS cluster teardown.
