workflow:
  as: openshift-e2e-aws-csi-efs-s3files
  steps:
    pre:
    - chain: ipi-aws-pre
    - chain: storage-conf-csi-optional-aws-efs-s3files
    - ref: storage-obj-save
    test:
    - ref: openshift-e2e-test
    post:
    - ref: storage-obj-check
    - ref: storage-destroy-csi-aws-efs-s3files
    - chain: ipi-aws-post
    env:
     TEST_SUITE: openshift/csi
     TEST_CSI_DRIVER_MANIFEST: manifest-aws-efs-s3files.yaml
     TEST_OCP_CSI_DRIVER_MANIFEST: ocp-manifest-aws-efs-s3files.yaml
  documentation: |-
    The Openshift E2E AWS `csi` workflow executes the `openshift/csi` end-to-end test suite on AWS EFS CSI driver / S3 files that was installed during cluster setup.
