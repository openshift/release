workflow:
  as: openshift-e2e-libvirt-vpn-ipi-fips
  steps:
    env:
      # Same hybrid VPN IPI contract as openshift-e2e-libvirt-vpn-ipi (see that workflow).
      USE_EXTERNAL_DNS: "true"
      IPI_LIBVIRT_S390X_ACPI_XSLT_PATCH: "true"
      LIBVIRT_POOL_NAME: multiarch-ci-pool
      LIBVIRT_IMAGE_PATH: "/home/libvirt/openshift-images"
      WORKER_REPLICAS: "0"
      COMPUTE_COUNT: "2"
    allow_best_effort_post_steps: true
    pre:
    - ref: upi-libvirt-cleanup-pre
    - chain: ipi-libvirt-pre
    # fips-check needs a live API; run after install, before day-2 virsh workers.
    - ref: fips-check
    - ref: ipi-install-libvirt-virsh-workers
    test:
    - chain: openshift-e2e-libvirt-test
    post:
    - chain: ipi-libvirt-post
  documentation: |-
    FIPS variant of openshift-e2e-libvirt-vpn-ipi (terraform masters + virsh workers on
    libvirt-s390x-vpn-oz). See openshift-e2e-libvirt-vpn-ipi for why WORKER_REPLICAS=0,
    ACPI XSLT, and multiarch-ci-pool are required on s390x RHEL 9 QEMU.
