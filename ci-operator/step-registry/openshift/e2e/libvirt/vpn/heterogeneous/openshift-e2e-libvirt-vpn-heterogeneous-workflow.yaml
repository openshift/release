workflow:
  as: openshift-e2e-libvirt-vpn-heterogeneous
  steps:
    allow_best_effort_post_steps: true
    pre:
    - ref: upi-libvirt-cleanup-pre
    - ref: upi-libvirt-cleanup-heterogeneous
    - chain: upi-conf-libvirt
    - ref: ipi-debug-missing-static-pod-controller-degraded
    - ref: ipi-conf-etcd-on-ramfs
    - chain: upi-install-libvirt
    - ref: upi-install-libvirt-heterogeneous
    test:
    - chain: openshift-e2e-libvirt-test
    post:
    - ref: ipi-conf-debug-kdump-gather-logs
    - chain: gather
    - ref: upi-libvirt-cleanup-post
    - ref: upi-libvirt-cleanup-heterogeneous
  documentation: |-
    VPN-based heterogeneous libvirt e2e for IBM Z (intranet / Orange Zone).

    Reuses the homogeneous openshift-e2e-libvirt-vpn path unchanged
    (upi-libvirt-cleanup-*, upi-conf-libvirt, upi-install-libvirt), then adds
    day-2 opposite-architecture workers via upi-install-libvirt-heterogeneous.

    Jobs must set:
      ZX (multi-z-xz): ARCH=s390x, ADDITIONAL_WORKER_ARCHITECTURE=x86_64
      XZ (multi-x-xz): ARCH=amd64, ADDITIONAL_WORKER_ARCHITECTURE=s390x

    Optional: COMPUTE_COUNT=0 to skip same-arch workers at install time
    (leases must still provide compute[0] and compute[1] for the shared network.xml step).

    Intended cluster_profile: libvirt-s390x-amd64-vpn.
    Does not modify shared homogeneous VPN steps.
