workflow:
  as: openshift-e2e-gcp-etcd-recovery
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: ipi-gcp-pre
    test:
    - ref: openshift-e2e-test
    post:
    - chain: ipi-gcp-post
    env:
      TEST_SUITE: openshift/etcd/recovery
  documentation: |-
    The Openshift E2E GCP `etcd-recovery` workflow executes the `openshift/etcd/recovery` end-to-end test suite on GCP with a default cluster configuration.
