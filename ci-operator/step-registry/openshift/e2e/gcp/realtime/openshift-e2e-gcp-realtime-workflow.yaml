workflow:
  as: openshift-e2e-gcp-realtime
  steps:
    pre:
      - chain: ipi-conf-gcp
      - ref: rhcos-conf-osstream
      - ref: ipi-conf-gcp-osdisk-disktype
      - ref: storage-conf-storageclass-pre-set-default-gcp-hyperdisk
      - chain: ipi-install
      - ref: optional-operators-configure-realtime-tuned-profile
    test:
      - ref: openshift-e2e-test
    post:
      - chain: gather-core-dump
      - chain: ipi-gcp-post
    env:
      RT_ENABLED: "true"
      COMPUTE_NODE_TYPE: n4-standard-8
      COMPUTE_DISK_TYPE: hyperdisk-balanced
  documentation: |-
    The Openshift E2E GCP realtime workflow executes the common end-to-end test suite on GCP with realtime kernel workers.
