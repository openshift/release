workflow:
  as: openshift-e2e-azurestack-upi-csi
  steps:
    pre:
    - chain: upi-azurestack-pre
    - ref: storage-conf-csi-azure-disk
    - ref: storage-obj-save
    post:
    - ref: storage-obj-check
    - chain: gather-core-dump
    - chain: upi-azurestack-post
    env:
      TEST_CSI_DRIVER_MANIFEST: manifest-azure-disk.yaml
  documentation: |-
    This workflow validates an OpenShift UPI installation on Azure Stack Hub,
    configures the Azure Disk CSI driver test manifest, and checks storage objects,
    then gathers artifacts and deprovisions the cluster. Azure Stack end-to-end
    tests have never passed, so they are disabled; a successful installation is
    sufficient for CI validation for now (OCPBUGS-86825).
    The existing workflow name is retained for compatibility with job configurations.
