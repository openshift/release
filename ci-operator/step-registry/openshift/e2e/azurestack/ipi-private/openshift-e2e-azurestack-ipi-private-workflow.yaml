workflow:
  as: openshift-e2e-azurestack-ipi-private
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: ipi-conf-azurestack
    - ref: azure-provision-resourcegroup
    - ref: azure-provision-vnet
    - chain: azure-provision-bastionhost
    - ref: proxy-config-generate
    - ref: ipi-conf-azurestack-creds
    - ref: ipi-conf-azurestack-rhcos
    - ref: ipi-conf-additional-ca-azurestack
    - ref: ipi-conf-azure-provisionednetwork
    - chain: ipi-install
    - ref: cucushift-installer-check-azure-private
    test:
    - ref: openshift-e2e-test
    post:
    - chain: cucushift-installer-rehearse-azure-ipi-private-deprovision
    env:
      BASTION_VHD_URI: https://vhdsa.blob.mtcazs.wwtatc.com/vhd/rhcos-410.84.202112040202-0-azurestack.x86_64.vhd
      PUBLISH: Internal
  documentation: |-
    Installs a private (publish: Internal) OpenShift cluster on Azure Stack Hub
    using IPI into a pre-created resource group and vnet, reached through a
    bastion host and proxy.

    Because the cluster has no public API or ingress endpoints, every step after
    installation reaches it through the proxy generated by proxy-config-generate.
    The pre phase ends with cucushift-installer-check-azure-private, which asserts
    the resulting topology is genuinely private: an internal load balancer exists,
    and the public load balancer carries outbound rules and a public IP for egress
    only. That step also handles the Azure Stack Hub 2019-03-01-hybrid API profile,
    which does not expose outboundRules through the standard az network commands.

    BASTION_VHD_URI is overridden because the azure-provision-bastionhost default
    points at public Azure blob storage, which is unreachable from Azure Stack Hub.
