ref:
  as: openshift-e2e-test-serial-skip-monitors
  from: tests
  grace_period: 10m
  commands: openshift-e2e-test-serial-skip-monitors-commands.sh
  timeout: 14400s
  env:
  - name: TEST_ARGS
    default: ""
    documentation: |-
      Additional arguments to be passed to 'openshift-test'
  - name: TEST_SUITE
    default: openshift/multus-cni/serial
    documentation: The test suite to run.  Use 'openshift-test run --help' to list available suites.
  - name: SKIP_MONITOR_TEST
    default: "true"
    documentation: |-
      When set to any non-empty value, openshift-tests will skip monitor-only test failures.
      Default is true for serial tests to avoid flaky monitor assertions.
  resources:
    requests:
      cpu: "3"
      memory: 600Mi
    limits:
      memory: 10Gi
  documentation: |-
    The Openshift E2E serial test step executes serial test suites with monitor-only failures skipped.
