ref:
  as: openshift-e2e-test-psa-check
  from: psa-e2e-runner
  commands: openshift-e2e-test-psa-check-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m
  documentation: |-
    Verifies the pinned PSA e2e runner kubectl-dev_tool is present in the
    e2e test image and publishes its path and required PSA-check setting through
    SHARED_DIR for the following test step.
