ref:
  as: openshift-e2e-test-psa-check
  from: src
  commands: openshift-e2e-test-psa-check-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: CLUSTER_DEBUG_TOOLS_VERSION
    default: b81366aabacc7f76624e53c438dcb1ede70c5324
    documentation: |-
      Pinned cluster-debug-tools revision used to build kubectl-dev_tool.
  timeout: 10m
  documentation: |-
    Builds the pinned cluster-debug-tools kubectl-dev_tool plugin and publishes
    its path and required PSA-check setting through SHARED_DIR for later test
    steps.
