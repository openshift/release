workflow:
  as: openshift-e2e-azure-etcd-recovery
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: ipi-azure-pre
    test:
    - ref: openshift-e2e-test
    post:
    - chain: ipi-azure-post
    env:
      TEST_SUITE: openshift/etcd/recovery
  documentation: |-
    The Openshift E2E Azure `etcd-recovery` workflow executes the `openshift/etcd/recovery` end-to-end test suite on Azure with a default cluster configuration.
