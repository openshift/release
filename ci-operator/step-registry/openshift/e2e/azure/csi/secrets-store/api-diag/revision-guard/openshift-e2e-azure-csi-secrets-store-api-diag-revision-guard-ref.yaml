ref:
  as: openshift-e2e-azure-csi-secrets-store-api-diag-revision-guard
  from: src
  commands: openshift-e2e-azure-csi-secrets-store-api-diag-revision-guard-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
  timeout: 5m0s
  env:
  - name: EXPECTED_OPERATOR_REVISION
    documentation: |-
      Full 40-character commit SHA that the operator source under test must be
      checked out at. A rehearsal checks out the branch head at clone time, so
      this guard fails the job before any cloud resources are provisioned
      when the branch has moved or pull request commits were merged.
  - name: EXPECTED_OPERATOR_REPO
    default: "openshift/secrets-store-csi-driver-operator"
    documentation: |-
      org/repo of the operator under test, used to look up its refs in JOB_SPEC.
  documentation: |-
    Fails fast unless the operator source in the src image is exactly
    EXPECTED_OPERATOR_REVISION with no pull request merged on top. Writes the
    expected and observed commit SHAs and the result to
    ARTIFACT_DIR/revision-guard.json.
