ref:
  as: openshift-e2e-azure-csi-secrets-store-api-diag-pre-rollout
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  commands: openshift-e2e-azure-csi-secrets-store-api-diag-pre-rollout-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  timeout: 45m0s
  grace_period: 1m0s
  env:
  - name: AZURE_API_DIAG_PRE_ROLLOUT_SETTLE
    default: "300"
    documentation: |-
      Seconds to wait after the baseline, before the TLS rollout starts, so
      that the diagnostic observer collects pre-rollout samples (bounded to
      0-1800).
  documentation: |-
    Runs immediately before tls-groups-configure in the Azure API diagnostic
    rehearsal. It records an allowlisted pre-rollout baseline (kube-apiserver
    operator conditions and revision convergence, feature set, APIServer TLS
    profile type and adherence, node readiness counts), waits a bounded settle
    period, and then marks the rollout boundary (T0) in
    SHARED_DIR/azure-api-diag-t0 and ARTIFACT_DIR/azure-api-diag/pre-rollout.json.
    It changes nothing on the cluster and never fails the job, so the TLS
    rollout always runs; API errors are recorded as categories.
