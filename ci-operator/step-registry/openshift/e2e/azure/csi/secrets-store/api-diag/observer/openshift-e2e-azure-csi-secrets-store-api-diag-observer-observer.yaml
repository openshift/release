observer:
  name: openshift-e2e-azure-csi-secrets-store-api-diag-observer
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  commands: openshift-e2e-azure-csi-secrets-store-api-diag-observer-commands.sh
  resources:
    requests:
      cpu: 50m
      memory: 200Mi
  timeout: 7h0m0s
  grace_period: 20m0s
  env:
  - name: TLS_GROUPS
    default: "SecP384r1MLKEM1024"
    documentation: |-
      TLS named group (first entry of the comma-separated list) offered by the
      anonymous post-quantum TLS 1.3 handshake probe. Follows the test's
      TLS_GROUPS so that it matches what tls-groups-configure sets.
  - name: AZURE_API_DIAG_SAMPLE_INTERVAL
    default: "60"
    documentation: |-
      Seconds between samples (bounded to 1-600).
  - name: AZURE_API_DIAG_MAX_SAMPLES
    default: "420"
    documentation: |-
      Maximum number of samples before the observer stops sampling and runs
      its final collection (bounded to 1-2000).
  - name: AZURE_API_DIAG_TARGET_WAIT
    default: "10800"
    documentation: |-
      Seconds to wait for the installer metadata of the job's own cluster
      before giving up (bounded to 0-86400).
  - name: AZURE_API_DIAG_BOOTLOG_EVERY
    default: "10"
    documentation: |-
      Count serial console categories every N samples, and once more during
      final collection (bounded to 1-1000).
  documentation: |-
    One-off diagnostic observer for the Secrets Store CSI Driver Operator
    Azure TLS groups rehearsal. It runs alongside the pre and test phases and
    reads Azure data for the job's own resource group only, using the cluster
    profile identity and the same operations that gather-azure-cli already
    uses: API load balancer health-probe and data-path metrics per
    control-plane backend, VM power and provisioning state, and serial console
    line categories. Serial console reads use az vm boot-diagnostics
    get-boot-log, whose retrieveBootDiagnosticsData action returns a
    short-lived read URL for the VM's own log; they are limited to VMs with
    managed boot diagnostics, so no storage accounts are listed. It also probes
    API endpoint reachability anonymously. None of this needs the cluster's
    Kubernetes API, so collection continues while the API is unreachable.
    When terminated, it backfills load balancer and VM CPU metrics for the
    whole observation window. It publishes only allowlisted
    categories, counts, ports, ordinal labels and timestamps to
    ARTIFACT_DIR/azure-api-diag/. Raw responses and serial console text are
    never written to artifacts. It creates and changes no cloud or cluster
    resources.
