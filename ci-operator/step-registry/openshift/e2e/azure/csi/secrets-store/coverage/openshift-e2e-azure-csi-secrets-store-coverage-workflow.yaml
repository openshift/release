workflow:
  as: openshift-e2e-azure-csi-secrets-store-coverage
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: ipi-azure-pre
    - ref: optional-operators-subscribe
    - ref: storage-create-csi-secrets-store
    - ref: storage-conf-wait-for-csi-driver
    - ref: storage-obj-save
    test:
    - as: setup-coverage
      cli: latest
      commands: hack/e2e-coverage.sh setup
      dependencies:
      - env: COVERAGE_IMAGE
        name: secrets-store-csi-driver-operator-coverage
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test-e2e
      cli: latest
      commands: make test-e2e
      from: src
      resources:
        requests:
          cpu: 50m
          memory: 100Mi
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: hack/e2e-coverage.sh collect
      credentials:
      - mount_path: /var/run/secrets/codecov
        name: sscsi-driver-operator-codecov-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    - ref: storage-obj-check
    - ref: storage-destroy-must-gather-before-destroy
    - ref: storage-destroy-csi-secrets-store
    - chain: ipi-azure-post
    env:
      CLUSTERCSIDRIVER: secrets-store.csi.k8s.io
      TRUECONDITIONS: SecretsStoreDriverNodeServiceControllerAvailable
  documentation: |-
    Azure Secrets Store CSI e2e with coverage collection and Codecov upload.
