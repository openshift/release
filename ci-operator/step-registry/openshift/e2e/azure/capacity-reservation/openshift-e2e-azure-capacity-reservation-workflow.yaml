workflow:
  as: openshift-e2e-azure-capacity-reservation
  steps:
    allow_best_effort_post_steps: true
    pre:
    - ref: azure-provision-capacity-reservation
    - chain: ipi-conf-azure
    - ref: ipi-conf-azure-capacity-reservation
    - chain: azure-provision-service-principal-minimal-permission
    - ref: rhcos-conf-osstream
    - chain: ipi-install
    - ref: ipi-azure-rbac
    - ref: ipi-azure-describe
    - ref: azure-validate-capacity-reservation
    test:
    - ref: openshift-e2e-test
    post:
    - chain: gather-core-dump
    - chain: ipi-azure-post
    - ref: azure-deprovision-capacity-reservation
  documentation: |-
    The OpenShift E2E Azure Capacity Reservation workflow provisions an Azure
    Capacity Reservation Group with separate control-plane and compute
    reservations, installs an OpenShift cluster with all nodes pinned to the
    reserved capacity, validates the VM associations, runs the standard e2e
    test suite, and then cleans up the cluster and reservation resources.
