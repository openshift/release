ref:
  as: openshift-e2e-azure-manual-oidc-workload-identity-upgrade-credentials
  from: cloud-credential-operator
  cli: latest
  commands: openshift-e2e-azure-manual-oidc-workload-identity-upgrade-credentials-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  grace_period: 30s
  dependencies:
  - name: "release:latest"
    env: OPENSHIFT_UPGRADE_RELEASE_IMAGE_OVERRIDE
  documentation: |-
    Updates Azure workload identity resources and cluster credential Secrets for the target release, then marks the cluster ready to upgrade.
