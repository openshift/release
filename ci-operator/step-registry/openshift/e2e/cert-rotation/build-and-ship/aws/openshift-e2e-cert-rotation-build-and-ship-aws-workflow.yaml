workflow:
  as: openshift-e2e-cert-rotation-build-and-ship-aws
  steps:
    allow_best_effort_post_steps: true
    env:
      NODE_CLIENT_CERT_RECOVERY_TOGGLE: "on"
    pre:
    - chain: ipi-aws-pre
    test:
    - ref: openshift-e2e-cert-rotation-build-and-ship-prep
    - ref: openshift-e2e-cert-rotation-build-and-ship-power-cycle-aws
    - ref: openshift-e2e-cert-rotation-build-and-ship-assert
    post:
    - chain: ipi-aws-post
  documentation: |-
    Build-and-ship test on AWS IPI (OCPSTRAT-1346): install, power every instance off while the cluster
    is still on its 24h install-time kubelet signer, power it back on with node clocks past that
    expiry (SKEW, default 2d), and require every node to recover with no manual CSR approval.
    Set NODE_CLIENT_CERT_RECOVERY_TOGGLE=off in the job's env to leave the approver disabled and require
    the unfixed behavior instead (client CSRs stay pending).
