ref:
  as: openshift-e2e-cert-rotation-build-and-ship-power-cycle-metal
  from: dev-scripts
  grace_period: 10m
  timeout: 45m0s
  commands: openshift-e2e-cert-rotation-build-and-ship-power-cycle-metal-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: STOP_TIMEOUT
    default: "900"
    documentation: Seconds to wait for a graceful (ACPI) shutdown before destroying the VMs.
  documentation: |-
    Powers every libvirt VM of a dev-scripts cluster off and on again (virsh shutdown, wait until shut
    off, virsh start), so each node boots with the clock jump armed by
    openshift-e2e-cert-rotation-build-and-ship-prep.
