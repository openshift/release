ref:
  as: openshift-e2e-cert-rotation-build-and-ship-power-cycle-aws
  from: upi-installer
  cli: latest
  grace_period: 10m
  timeout: 45m0s
  commands: openshift-e2e-cert-rotation-build-and-ship-power-cycle-aws-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: STOP_TIMEOUT
    default: "15m"
    documentation: How long to wait for a graceful stop before forcing it.
  - name: START_TIMEOUT
    default: "10m"
    documentation: How long to wait for every instance to be running again.
  documentation: |-
    Powers every EC2 instance of the cluster off and on again (stop, wait until stopped, start), so each
    node boots with the clock jump armed by openshift-e2e-cert-rotation-build-and-ship-prep.
