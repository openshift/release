workflow:
  as: openshift-e2e-openstack-external-lb
  steps:
    allow_best_effort_post_steps: true
    pre:
      - chain: ipi-openstack-pre
    test:
      - chain: openstack-test-e2e
    post:
      - chain: ipi-openstack-post
    env:
      CONFIG_TYPE: "proxy-externallb"
      BASE_DOMAIN: shiftstack.devcluster.openshift.com
      # https://issues.redhat.com/browse/OCPBUGS-33424
      OPENSTACK_TEST_SKIPS: should create a manila share
  documentation: |-
    The openshift-e2e-openstack-external-lb workflow executes an installation of
    OpenShift with Proxy using a restricted BYON installation on OpenStack
    and an external load-balancer for the control-plane VIPs.
    Set EXTERNAL_LB_COUNT=2 (job env, not here) to provision a second
    UserManaged LB endpoint (LB_HOSTS) and publish multi-value api DNS;
    see OSASINFRA-4543. Left at the single-LB default for all other
    consumers of this workflow.
    With multi-LB, api resolves to UserManaged FIPs; in-cluster clients cannot
    hairpin to those FIPs on some clouds, so jobs may skip lb-ext/api-ext/OIDC
    and rely on openstack-conf-externallb-verify for outside :6443 checks.
