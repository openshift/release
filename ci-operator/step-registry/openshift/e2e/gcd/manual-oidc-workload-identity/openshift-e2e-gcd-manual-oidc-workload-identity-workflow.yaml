workflow:
  as: openshift-e2e-gcd-manual-oidc-workload-identity
  steps:
    allow_best_effort_post_steps: true
    env:
      TEST_SKIPS: Ensure HTTPRoute object is created\|The HAProxy router should pass the http2 tests\|The HAProxy router should pass the h2spec conformance tests\|should serve a basic image on each replica with a private image\|Validate user is able to extract rhel8 and rhel9 oc from the ocp payload\|regional PD should store data and sync across zones\|L2 primary UDN with custom network, cluster-networked pods, NodePort service\|cluster-config-operator should report complete ClusterOperator status\|CSRs from machines that are not recognized by the cloud provider are not approved
    pre:
    - chain: ipi-gcd-pre-manual-oidc-workload-identity
    test:
    - ref: openshift-e2e-test
    post:
    - chain: gather-core-dump
    - chain: ipi-gcp-post
    - ref: ipi-conf-gcp-oidc-creds-deprovision
    - ref: gcp-deprovision-bastionhost
    - ref: gcp-deprovision-vpc
  documentation: |-
    The OpenShift E2E GCD manual OIDC workflow executes the common
    end-to-end test suite on a private cluster on Google Cloud Dedicated
    with manual OIDC workload identity credentials provisioned by ccoctl.
