ref:
  as: openshift-e2e-libvirt-s390x-csi-secrets-store-setup-fbc
  from: cli
  cli: latest
  commands: openshift-e2e-libvirt-s390x-csi-secrets-store-setup-fbc-commands.sh
  credentials:
  - mount_path: /var/run/secrets/pull-secret
    name: deploy-konflux-operator-art-image-share
    namespace: test-credentials
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 30m
  grace_period: 5m
  documentation: |-
    This step sets up the FileBasedCatalog (FBC) operator for the Secrets Store CSI Driver
    on an s390x cluster. It performs the following:
    - Validates s390x architecture
    - Installs required dependencies (jq, podman, curl, tar, oras, kubectl)
    - Extracts cluster version and builds FBC image tag
    - Disables default CatalogSources (unless TEST_GA_BUILD=true)
    - Merges pull secret from deploy-konflux-operator-art-image-share credential
    - Creates custom CatalogSource for the operator
    - Generates and applies ImageDigestMirrorSet (IDMS)
    - Waits for MachineConfigPool rollout
    - Installs the operator via Subscription
    - Creates ClusterCSIDriver resource
    - Verifies operator and operand pods are running
    
    Credentials used:
    - deploy-konflux-operator-art-image-share: FBC and operator image registry access
