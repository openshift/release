ref:
  as: openshift-e2e-libvirt-s390x-csi-secrets-store-setup-fbc
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  commands: openshift-e2e-libvirt-s390x-csi-secrets-store-setup-fbc-commands.sh
  credentials:
  - mount_path: /var/run/secrets/pull-secret
    name: deploy-konflux-operator-art-image-share
    namespace: test-credentials
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 90m
  grace_period: 5m
  env:
  - name: FBC_IMAGE
    default: ""
    documentation: |-
      Optional override for the ART FBC CatalogSource image. When empty, the
      step builds quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc:ocp__<major.minor>__ose-secrets-store-csi-driver-rhel9-operator
      from the cluster version. Set this if that tag does not exist yet
      (example: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc:ocp__4.23__ose-secrets-store-csi-driver-rhel9-operator).
  - name: TEST_GA_BUILD
    default: "false"
    documentation: |-
      When "true", skip custom FBC/IDMS and subscribe from redhat-operators.
  documentation: |-
    This step sets up the FileBasedCatalog (FBC) operator for the Secrets Store CSI Driver
    on an s390x cluster. It performs the following:
    - Validates s390x architecture
    - Extracts cluster version and builds FBC image tag (or uses FBC_IMAGE)
    - Disables default CatalogSources (unless TEST_GA_BUILD=true)
    - Merges pull secret from deploy-konflux-operator-art-image-share credential
    - Creates custom CatalogSource for the operator
    - Applies a hardcoded ImageDigestMirrorSet for registry.redhat.io openshift4/5 images
    - Waits for MachineConfigPool rollout
    - Installs the operator via Subscription (reuses the existing OperatorGroup)
    - Creates ClusterCSIDriver resource
    - Verifies operator and operand pods are running

    Credentials used:
    - deploy-konflux-operator-art-image-share: FBC and operator image registry access
