ref:
  as: openshift-e2e-libvirt-s390x-csi-secrets-store-test-vault
  from: secrets-store-csi-driver-test
  cli: latest
  commands: openshift-e2e-libvirt-s390x-csi-secrets-store-test-vault-commands.sh
  credentials:
  - mount_path: /etc/hypershift-agent-ibmz-credentials
    name: hypershift-agent-ibmz-credentials
    namespace: test-credentials
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 2h
  grace_period: 10m
  documentation: |-
    This step runs the Vault end-to-end tests for the Secrets Store CSI Driver
    on an s390x cluster. It performs the following:
    - Validates s390x architecture
    - Installs required dependencies (git, curl, jq, tar, helm, bats)
    - Clones the secrets-store-csi-driver repository
    - Replaces busybox images with s390x-compatible versions (uses docker.io/s390x/busybox)
    - Patches vault.bats to use Vault Enterprise with proper configuration
    - Applies vault license from vault credentials
    - Runs the vault.bats test suite
    - Collects logs and diagnostics on failure
    - Cleans up test resources on success
    
    Note: Docker Hub images are accessible via the cluster's pre-configured pull secret.
    No additional docker-secret.json is required.
