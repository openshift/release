workflow:
  as: openshift-e2e-node-cert-recovery-normal-ops-aws
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: ipi-aws-pre
    test:
    - ref: openshift-e2e-node-cert-recovery-normal-ops-lifecycle-aws
    post:
    - chain: ipi-aws-post
  documentation: |-
    Node cert recovery with the toggle on during normal operation (OCPSTRAT-1346), on AWS IPI: no power
    cycle and no clock skew. Checks that routine node lifecycle events (a client cert renewal, a
    scale-up, a serving cert rotation, a worker stopped past the heartbeat staleness, a Machine
    replacement) are left to the routine approvers while the recovery approver is enabled, and that a
    worker that lost its client cert is re-admitted only after 5 minutes without a heartbeat. See
    openshift-e2e-node-cert-recovery-normal-ops-lifecycle-aws.
