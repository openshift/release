workflow:
  as: openshift-e2e-vsphere-etcd-recovery
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: ipi-vsphere-pre
    test:
    - ref: openshift-e2e-test
    post:
    - chain: ipi-vsphere-post
    env:
      TEST_SUITE: openshift/etcd/recovery
  documentation: |-
    The Openshift E2E Vsphere `etcd-recovery` workflow executes the `openshift/etcd/recovery` end-to-end test suite on Vsphere with a default cluster configuration.
