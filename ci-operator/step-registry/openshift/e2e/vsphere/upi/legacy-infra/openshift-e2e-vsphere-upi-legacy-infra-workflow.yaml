workflow:
  as: openshift-e2e-vsphere-upi-legacy-infra
  steps:
    pre:
    - chain: upi-vsphere-pre
    test:
    - ref: vsphere-legacy-infra-check
    post:
    - chain: upi-vsphere-post
    env:
      STRIP_VSPHERE_FAILURE_DOMAINS: "true"
  documentation: |-
    Installs a single-vCenter vSphere UPI cluster whose Infrastructure CR is missing
    vcenters/failureDomains and whose openshift-config/cloud-provider-config is the
    legacy INI format rather than the YAML format a fresh install would otherwise
    produce, simulating clusters installed via UPI or before OpenShift 4.13 that never
    had Infrastructure populated with this data -- a state the installer never
    backfills on upgrade (SPLAT-3028). Runs vsphere-legacy-infra-check instead of full
    conformance to catch regressions in components that assume this data is always
    present.
