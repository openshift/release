workflow:
  as: openshift-e2e-vsphere-upi-multi-vcenter
  steps:
    pre:
    - chain: upi-vsphere-pre-multi-vcenter
    test:
    - ref: openshift-e2e-test
    post:
    - chain: upi-vsphere-post
  documentation: |-
    VSphere E2E wraps the Openshift E2E workflow and executes the common end-to-end test suite.
    The cluster's failure domains span multiple vCenters, obtained through a single VCM lease.
