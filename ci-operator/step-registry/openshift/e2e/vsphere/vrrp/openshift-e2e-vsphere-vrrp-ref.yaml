ref:
  as: openshift-e2e-vsphere-vrrp
  from: upi-installer
  commands: openshift-e2e-vsphere-vrrp-commands.sh
  timeout: 3h
  grace_period: 2m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: VRRP_ARM
    default: stock
    documentation: Stock configuration, Ben's 30s/15s, or workload-sized long critical grace.
  documentation: |-
    Reboot the confirmed IPv4 API VIP holder three times on a disposable vSphere
    HA cluster. Preserve observations across reboot; a completed trial is not
    evidence of a clean handoff without peer, old-owner and API termination data.
