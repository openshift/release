workflow:
  as: openshift-e2e-vsphere-manual-credentials-mode
  steps:
    pre:
    - chain: ipi-vsphere-pre-manual-credentials-mode
    test:
    - ref: openshift-e2e-test
    post:
    - chain: gather-core-dump
    - chain: ipi-vsphere-post
  documentation: |-
    The OpenShift E2E vSphere workflow provisions a cluster with
    credentialsMode set to Manual in install-config.yaml and executes the
    common end-to-end test suite.
