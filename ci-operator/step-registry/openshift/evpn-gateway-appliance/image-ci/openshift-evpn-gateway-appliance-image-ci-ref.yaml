ref:
  as: openshift-evpn-gateway-appliance-image-ci
  from: nested-podman
  commands: openshift-evpn-gateway-appliance-image-ci-commands.sh
  credentials:
  - namespace: test-credentials
    bundle: ci-pull-credentials
    mount_path: /var/run/ci-pull-credentials
  nested_podman: true
  grace_period: 2h
  resources:
    limits:
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 4Gi
  env:
  - name: EVPN_APPLIANCE_PR
    default: ""
    documentation: |-
      GitHub pull request number to fetch from openshift/evpn-gateway-appliance.
      Empty uses PULL_NUMBER from the job. Remove the fetch when presubmits clone the PR head.
  documentation: >-
    Fetches the triggering openshift/evpn-gateway-appliance pull request and
    runs two podman builds with context image/. The product image is
    image/rhel10/Containerfile with BOOTC_BASE on the public bootc image.
    image/Containerfile.nested-ci then caches the payload-images.yaml pins with
    python3, using the mounted ci-pull-credentials file as registry-auth.
    bootc-image-builder then writes qcow2 and raw disks from the product image.
    Those two disks are gzip --best compressed into the job artifacts. Nothing
    is pushed to a registry.
