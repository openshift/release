ref:
  as: openshift-evpn-gateway-appliance-image-ci
  from: nested-podman
  commands: openshift-evpn-gateway-appliance-image-ci-commands.sh
  credentials:
  - namespace: test-credentials
    bundle: registry-pull-credentials
    mount_path: /var/run/registry-pull-credentials
  nested_podman: true
  grace_period: 2h
  resources:
    limits:
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 4Gi
  env:
  - name: EVPN_APPLIANCE_PR
    default: "6"
    documentation: |-
      GitHub pull request number to fetch from openshift/evpn-gateway-appliance.
      Temporary until the Containerfile is on main; remove the fetch when presubmits clone the PR head.
  documentation: >-
    Fetches openshift/evpn-gateway-appliance pull request head and runs podman
    build on image/rhel10/Containerfile. BOOTC_BASE stays on the public bootc
    image. FRR and node-exporter come from the 4.22 CI imagestream, using the
    mounted registry-pull-credentials file.
