ref:
  as: openshift-evpn-gateway-appliance-image-ci
  from: nested-podman
  commands: openshift-evpn-gateway-appliance-image-ci-commands.sh
  credentials:
  - namespace: test-credentials
    bundle: registry-pull-credentials
    mount_path: /var/run/registry-pull-credentials
  nested_podman: true
  grace_period: 2h
  resources:
    limits:
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 4Gi
  env:
  - name: EVPN_APPLIANCE_PR
    default: "6"
    documentation: |-
      GitHub pull request number to fetch from openshift/evpn-gateway-appliance.
      Defaults to PR 6 for the temporary appliance rehearsal source.
  documentation: >-
    Temporarily fetches the appliance PR 6 rehearsal source by resolving its
    pull request head to a commit SHA before downloading the archive. Builds
    one image from image/rhel10/Containerfile with the public CentOS bootc base
    and full FRR and node-exporter payload images from the 4.22 CI imagestream,
    using the mounted registry-pull-credentials file. Runs
    image/tools/smoke-nested.sh against that same image, then uses the public
    CentOS bootc-image-builder to create qcow2 and raw disks. The compressed
    disk.qcow2.gz and disk.raw.gz files are written to ARTIFACT_DIR. Nothing is
    pushed to a registry.
