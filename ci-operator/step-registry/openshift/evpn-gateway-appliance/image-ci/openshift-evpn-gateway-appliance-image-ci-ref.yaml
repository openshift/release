ref:
  as: openshift-evpn-gateway-appliance-image-ci
  from: nested-podman
  commands: openshift-evpn-gateway-appliance-image-ci-commands.py
  run_as_script: true
  credentials:
  - namespace: test-credentials
    bundle: registry-pull-credentials
    mount_path: /var/run/registry-pull-credentials
  nested_podman: true
  grace_period: 2h
  resources:
    limits:
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 4Gi
  env:
  - name: EVPN_APPLIANCE_PR
    default: "6"
    documentation: |-
      GitHub pull request number to fetch from openshift/evpn-gateway-appliance.
      Defaults to PR 6 for the temporary appliance rehearsal source.
  documentation: >-
    Runs this Python script directly in the nested-podman image.
    Fetches the appliance pull request named by EVPN_APPLIANCE_PR, resolves
    its head commit, and downloads that archive. Builds one image from
    image/rhel10/Containerfile with the public CentOS bootc base and the FRR
    and node-exporter images from the 4.22 CI imagestream. Saves that image
    as an OCI archive. bootc-image-builder reads the archive and writes a
    qcow2 disk and a local AMI disk. The AMI is not uploaded to AWS. The step
    writes appliance-image.tar.gz, disk.qcow2.gz, and disk.ami.raw.gz to
    ARTIFACT_DIR. Nothing is pushed to a registry. After those files are
    saved, the step runs python3 image/tools/smoke-payloads.py when that file
    is in the fetched archive. A missing script or a smoke failure does not
    fail the step. The step does not run image/tools/smoke-nested.py. That
    smoke starts systemd in a container, and this job already runs in a
    container.
