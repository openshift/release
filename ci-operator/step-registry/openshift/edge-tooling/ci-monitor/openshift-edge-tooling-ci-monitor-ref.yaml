ref:
  as: openshift-edge-tooling-ci-monitor
  from: edge-tooling-ai-helpers
  commands: openshift-edge-tooling-ci-monitor-commands.sh
  credentials:
  - collection: ocp-edge
    group: chai-bot
    mount_path: /var/run/chai-bot
  env:
  - name: MONITOR_VERSIONS
    default: ""
    documentation: |-
      Comma-separated OCP versions to monitor (e.g., '4.18,4.19').
      Empty string monitors all configured versions.
  - name: SKIP_PROW
    default: "false"
    documentation: Skip Prow artifact enrichment for faster runs.
  - name: WITH_TIMING
    default: "true"
    documentation: Include install/upgrade timing insights.
  - name: PAYLOAD_COUNT
    default: "3"
    documentation: Number of recent payloads to analyze per version/topology.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  timeout: 4h0m0s
  grace_period: 1m0s
  documentation: |-
    Runs the Edge OCP CI Monitor to report on nightly payloads across
    SNO, TNA, and TNF. The dashboard includes Sippy job health, Component
    Readiness, and Chai Bot investigations of blocking failures and
    selected Sippy findings. Shares job counts and Chai analysis status
    with the Slack post step.
