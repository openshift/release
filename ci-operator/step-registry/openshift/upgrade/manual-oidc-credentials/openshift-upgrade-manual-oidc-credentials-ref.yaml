ref:
  as: openshift-upgrade-manual-oidc-credentials
  from: cloud-credential-operator
  cli: latest
  commands: openshift-upgrade-manual-oidc-credentials-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  grace_period: 30s
  dependencies:
  - name: "release:latest"
    env: OPENSHIFT_UPGRADE_RELEASE_IMAGE_OVERRIDE
  documentation: |-
    Updates AWS, Azure, or GCP OIDC provider resources and cluster credential Secrets for the target release, then marks the cluster ready to upgrade.
