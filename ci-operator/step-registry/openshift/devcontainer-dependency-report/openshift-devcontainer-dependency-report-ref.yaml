ref:
  as: openshift-devcontainer-dependency-report
  from: agentic-dev
  commands: openshift-devcontainer-dependency-report-commands.py
  run_as_script: true
  no_kubeconfig: true
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 15m0s
  grace_period: 1m0s
  env:
  - name: DEVCONTAINER_DEPENDENCY_REPOSITORY
    documentation: One public repository named in the shared inventory policy.
  documentation: |-
    Inventory public devcontainer dependency declarations for the selected
    repository already present at /workspace in that repository's agentic-dev
    image. The report records the actual checkout HEAD, and policy data is
    embedded in the co-versioned checker script. The step performs read-only
    public version lookups and writes JSON and Markdown reports to ARTIFACT_DIR.
    It also writes agentic-ci-advisory.json as a separate advisory. Expected
    advisory metadata, lookup, and write failures leave the core inventory,
    counts, and step exit status unchanged.
    It does not build target images, change dependencies, open pull requests,
    use credentials, or claim that a newer version is compatible.
