ref:
  as: openshift-devcontainer-dependency-report
  from: agentic-dev
  commands: openshift-devcontainer-dependency-report-commands.py
  run_as_script: true
  no_kubeconfig: true
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 15m0s
  grace_period: 1m0s
  env:
  - name: DEVCONTAINER_DEPENDENCY_REPOSITORY
    documentation: One public repository named in the shared inventory policy.
  documentation: |-
    Inventory public devcontainer dependency declarations for the selected
    repository already present at /workspace in that repository's agentic-dev
    image. The target revision comes from JOB_SPEC, and the shared public policy
    is resolved at an exact openshift/release revision. The step performs
    read-only public version lookups and writes JSON and Markdown reports to
    ARTIFACT_DIR. It does not build target images, change dependencies, open pull
    requests, use credentials, or claim that a newer release is compatible.
