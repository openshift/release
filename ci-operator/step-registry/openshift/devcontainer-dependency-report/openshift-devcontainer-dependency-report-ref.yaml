ref:
  as: openshift-devcontainer-dependency-report
  from: src
  commands: openshift-devcontainer-dependency-report-commands.py
  run_as_script: true
  no_kubeconfig: true
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 15m0s
  grace_period: 1m0s
  env:
  - name: DEVCONTAINER_DEPENDENCY_CONFIG
    default: ci-operator/step-registry/openshift/devcontainer-dependency-report/openshift-devcontainer-dependency-report-config.md
    documentation: Path in the openshift/release source checkout to the public inventory policy.
  documentation: |-
    Inventory public devcontainer dependency declarations in Sippy, Origin, and
    SHIP Status Dashboard. The step performs read-only public lookups and writes
    JSON and Markdown reports to ARTIFACT_DIR. It does not build target images,
    change dependencies, open pull requests, use credentials, or claim that a
    newer release is compatible.
