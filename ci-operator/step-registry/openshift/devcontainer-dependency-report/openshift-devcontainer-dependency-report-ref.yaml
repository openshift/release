ref:
  as: openshift-devcontainer-dependency-report
  from: agentic-dev
  commands: openshift-devcontainer-dependency-report-commands.py
  run_as_script: true
  no_kubeconfig: true
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 15m0s
  grace_period: 1m0s
  env:
  - name: DEVCONTAINER_DEPENDENCY_REPOSITORY
    documentation: One public repository named in the shared inventory policy.
  - name: DEVCONTAINER_DEPENDENCY_RELEASE_SOURCE_ROOT
    default: /release-source
    documentation: |-
      Exact-revision openshift/release source snapshot staged by the agentic-dev
      image build. For local use, this may be an openshift/release checkout.
  documentation: |-
    Inventory public devcontainer dependency declarations in the selected
    repository at /workspace and agentic CI declarations in the staged
    openshift/release source snapshot. The report records both actual checkout
    revisions, and policy data is embedded in the co-versioned checker script.
    The step performs read-only public version lookups and writes JSON and
    Markdown reports to ARTIFACT_DIR. It does not change dependencies, open pull
    requests, use credentials, or claim that a newer version is compatible.
