workflow:
  as: openshift-devcontainer-dependency-report
  steps:
    pre:
    - ref: openshift-devcontainer-dependency-report-stage-release-source
    test:
    - ref: openshift-devcontainer-dependency-report
  documentation: |-
    Runs the shared read-only devcontainer and agentic CI dependency inventory
    against the selected repository and the exact openshift/release source
    snapshot staged by its report-only pre-step. The report is written to the
    Prow artifact directory without changing either repository.
