workflow:
  as: openshift-devcontainer-dependency-report
  steps:
    test:
    - ref: openshift-devcontainer-dependency-report
  documentation: |-
    Runs the shared read-only devcontainer dependency inventory against the
    selected repository already present in its agentic-dev image. The report is
    written to the Prow artifact directory without changing the repository.
    The agentic-ci-advisory.json artifact is separate from the core inventory.
    Expected advisory metadata, lookup, and write failures leave the inventory
    and step exit status unchanged.
