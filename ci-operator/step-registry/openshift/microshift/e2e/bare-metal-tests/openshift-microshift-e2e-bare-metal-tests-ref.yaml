ref:
  as: openshift-microshift-e2e-bare-metal-tests
  from: root
  commands: openshift-microshift-e2e-bare-metal-tests-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 90Mi
  grace_period: 10m
  env:
  - name: HOME
    default: /tmp/secret
  - name: RESTRICTED
    default: "true"
  - name: SUITE
    default: footprint-and-performance
  credentials:
  - collection: redhat-et
    group: microshift-rhsm-creds
    mount_path: /var/run/rhsm/
  - collection: redhat-et
    group: microshift-dev-access-keys
    mount_path: /var/run/microshift-dev-access-keys/
