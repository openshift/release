ref:
  as: openshift-microshift-rebase-cryptoscan
  from: rebase-cryptoscan-src
  cli: latest
  grace_period: 30m
  commands: openshift-microshift-rebase-cryptoscan-commands.sh
  env:
  - name: DRY_RUN
    default: ""
  dependencies:
  - name: "release:nightly-amd64"
    env: "OPENSHIFT_RELEASE_IMAGE"
  - name: "release:nightly-arm64"
    env: "OPENSHIFT_RELEASE_IMAGE_ARM"
  resources:
    requests:
      cpu: 800m
      memory: 1800Mi
  credentials:
    - name: ci-pull-credentials
      namespace: test-credentials
      mount_path: /secrets/import-secret
    - name: pr-creds
      namespace: test-credentials
      mount_path: /secrets/pr-creds
  documentation: |-
    This step rebases MicroShift and runs the Red Hat crypto scanner.
    Uses a custom image with podman and jq to support crypto scanning.
