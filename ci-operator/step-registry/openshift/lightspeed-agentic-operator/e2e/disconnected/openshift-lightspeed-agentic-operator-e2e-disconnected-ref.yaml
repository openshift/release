ref:
  as: openshift-lightspeed-agentic-operator-e2e-disconnected
  from: src
  cli: latest
  commands: openshift-lightspeed-agentic-operator-e2e-disconnected-commands.sh
  timeout: 16h0m0s
  grace_period: 10m
  resources:
    requests:
      cpu: "2"
      memory: 8Gi
    limits:
      memory: 8Gi
  dependencies:
  - env: IMG
    name: agentic-operator
  credentials:
  - collection: openshift-lightspeed-service-creds
    group: huggingface
    mount_path: /var/run/huggingface
  - collection: openshift-lightspeed-service-creds
    group: vllm-apikey
    mount_path: /var/run/vllm
  env:
  - name: LIGHTSPEED_SERVICE_REF
    documentation: Full commit SHA of lightspeed-service providing the RHOAI assets for the selected model profile.
  - name: VLLM_MODEL_PROFILE
    default: gemma-4-31b
    documentation: vLLM model profile served by the pinned service assets; the Qwen periodic sets qwen-3.8-27b.
  - name: E2E_SCENARIO_TAGS
    default: core
    documentation: Disconnected product E2E must run core scenarios without exclusions.
  - name: SANDBOX_SOURCE_IMAGE
    default: quay.io/openshift-lightspeed/lightspeed-agentic-sandbox:latest
    documentation: Real sandbox image to mirror into the claimed cluster before runtime restriction.
  - name: SKILL_SOURCE_IMAGE
    default: quay.io/openshiftanalytics/agentic-skills:latest
    documentation: Skill image referenced by the core troubleshooting scenarios; unknown images fail closed.
  documentation: |-
    Run Agentic OLS core product E2E on a claimed GPU cluster. Mirror operator,
    sandbox and skill images to the cluster-local registry, provision the
    selected vLLM model profile (VLLM_MODEL_PROFILE) using the pinned service
    assets, then invoke product-e2e-disconnected once.
    The operator harness owns runtime NetworkPolicies, preflight and cleanup.
    No LSEval, external-provider fallback, or retry after restoring egress.
