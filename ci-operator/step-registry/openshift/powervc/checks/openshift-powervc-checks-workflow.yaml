workflow:
  as: openshift-powervc-checks
  steps:
    test:
    - ref: openshift-powervc-checks
    - ref: openshift-powervc-cleanup-vm-error
    - ref: openshift-powervc-podman
  documentation: |-
    The openshift-powervc-checks workflow performs pre-flight verification,
    maintenance, and image synchronization on the target PowerVC cloud.

    It executes three steps in sequence:
    1. `openshift-powervc-checks`: Inspects and reports the current server inventory and cloud state.
    2. `openshift-powervc-cleanup-vm-error`: Identifies and deletes any virtual machines in ERROR status to clean up stale resources (best-effort).
    3. `openshift-powervc-podman`: Uploads and synchronizes missing RHCOS images for supported OpenShift versions using nested podman.
