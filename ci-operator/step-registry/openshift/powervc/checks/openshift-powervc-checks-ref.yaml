ref:
  as: openshift-powervc-checks
  from: openstack-installer
  commands: openshift-powervc-checks-commands.sh
  grace_period: 60m
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: powervc-ipi-cicd-secrets
    group: powervs-creds
    mount_path: /var/run/powervc-ipi-cicd-secrets/powervc-creds
  env:
  - name: CLOUD
    default: "ocp-ci"
    documentation: |-
      The name of the cloud in the clouds.yaml file.
  documentation: >-
    Reports the current state of the PowerVC cloud. The step downloads the IBM
    PowerVC helper binaries (PowerVC-Tool and current-servers.sh) from their
    GitHub release, installs the OpenStack credentials (clouds.yaml and
    ocp-ci-ca.pem) from the mounted powervc-creds secret, patches the CA path
    in clouds.yaml to match the runtime HOME directory, queries the OpenShift
    CI release-stream API to discover supported major.minor versions (non-fatal
    if the API is unavailable), and runs current-servers.sh -s against CLOUD to
    list all servers (including standalone and bastion VMs) currently running on
    the cloud so the CI logs capture the environment's full state.
