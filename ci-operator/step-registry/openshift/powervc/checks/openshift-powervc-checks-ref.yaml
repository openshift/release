ref:
  as: openshift-powervc-checks
  from: openstack-installer
  commands: openshift-powervc-checks-commands.sh
  grace_period: 60m
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - namespace: test-credentials
    name: powervc-creds
    mount_path: /var/run/powervc-ipi-cicd-secrets/powervc-creds
  env:
  - name: CLOUD
    default: "ocp-ci"
    documentation: |-
      The name of the cloud in the clouds.yaml file.
  documentation: >-
    Reports the current state of the PowerVC cloud. The step downloads the IBM
    PowerVC helper binaries (ocp-ipi-powervc and current-servers.sh), installs
    the OpenStack credentials from the mounted powervc-creds secret, and runs
    current-servers.sh against CLOUD to list the servers currently running on
    the cloud so the CI logs capture the environment's state.
