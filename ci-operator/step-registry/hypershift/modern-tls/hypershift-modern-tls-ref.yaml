ref:
  as: hypershift-modern-tls
  from_image:
    namespace: ocp
    name: "5.0"
    tag: cli
  commands: hypershift-modern-tls-commands.sh
  env:
  - name: TLS_13_ENABLE_TLS_ADHERENCE
    default: "false"
    documentation: |-
      When true, patch the HostedCluster to set spec.configuration.apiServer.tlsAdherence
      using TLS_13_TLS_ADHERENCE_POLICY. Requires TechPreviewNoUpgrade on the guest cluster.
  - name: TLS_13_TLS_ADHERENCE_POLICY
    default: StrictAllComponents
    documentation: |-
      Value for HostedCluster spec.configuration.apiServer.tlsAdherence when
      TLS_13_ENABLE_TLS_ADHERENCE is true.
  - name: NODEPOOL_ROLLOUT_TIMEOUT
    default: 60m
    documentation: |-
      Timeout passed to oc wait while waiting for NodePool AllNodesHealthy after the
      config version annotation changes.
  - name: NODEPOOL_ROLLOUT_TIMEOUT_SECONDS
    default: "3600"
    documentation: |-
      Maximum time in seconds to wait for NodePool
      hypershift.openshift.io/nodePoolCurrentConfigVersion to change after the
      HostedCluster TLS configuration is updated.
  - name: GUEST_STABLE_CLUSTER_TIMEOUT
    default: 3h
    documentation: |-
      Timeout for oc adm wait-for-stable-cluster on the guest cluster after TLS changes.
  - name: MCP_ROLLOUT_TIMEOUT_SECONDS
    default: "3600"
    documentation: |-
      Maximum time in seconds to wait for guest MachineConfigPools to reach UPDATED=True.
  - name: TUNED_ROLLOUT_TIMEOUT
    default: 30m
    documentation: |-
      Timeout for the guest tuned DaemonSet to become Available on all nodes.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Configures Modern TLS Security Profile on a HyperShift hosted cluster.

    This step patches the HostedCluster CR to enable Modern TLS profile, which
    enforces TLS 1.3 for all API server connections. When TLS_13_ENABLE_TLS_ADHERENCE
    is true, it also sets spec.configuration.apiServer.tlsAdherence (for example
    StrictAllComponents). It waits for the hosted control plane kube-apiserver to
    roll out on the management cluster, records each NodePool's
    hypershift.openshift.io/nodePoolCurrentConfigVersion annotation before the TLS
    change, then waits for that annotation to change (HyperShift only updates it after
    the config has rolled out to the NodePool) and for AllNodesHealthy=True before
    verifying guest cluster TLS settings and node-level rollout.

    Note: Due to current HyperShift limitations, the Modern TLS profile may not
    propagate to etcd and some other control plane components. This is a known
    issue being tracked upstream.
