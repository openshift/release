ref:
  as: hypershift-agent-ovn-ipecho-provision
  from: dev-scripts
  commands: hypershift-agent-ovn-ipecho-provision-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: IPECHO_PORT
    default: "9095"
    documentation: "TCP port on which the ipecho HTTP server listens."
  - name: IPECHO_HOST_IP
    default: "192.168.111.1"
    documentation: |-
      Address the guest cluster should use to reach the echo server. Defaults to the
      baremetal bridge. Set it to an extra network's gateway (e.g. 192.168.221.1, the
      .1 of the subnet in EXTRA_NETWORK_CONFIG) when testing EgressIP on a secondary
      host interface, so the target is reached over that NIC rather than over br-ex.
      The address must already exist on the dev-scripts host; the step fails if not.
  - name: IPECHO_VLAN_ID
    default: ""
    documentation: |-
      802.1Q tag. When set, the step creates <bridge>.<tag> on the bridge holding
      IPECHO_HOST_IP and moves the advertised echo address onto it. Required when the
      guest nodes egress over a VLAN, because a tagged frame is only delivered to a host
      netdev carrying the same tag. Must be set together with IPECHO_VLAN_CIDR.
  - name: IPECHO_VLAN_CIDR
    default: ""
    documentation: |-
      Address and prefix for the VLAN subinterface, e.g. 192.168.222.1/27. This becomes
      the echo address written to ipecho_url, so it has to be inside the subnet the
      guest nodes are given on the same VLAN.
  timeout: 10m0s
  grace_period: 5m0s
  documentation: |-
    Provisions a Python3 ipecho HTTP server on the Equinix/dev-scripts provisioning
    host as a systemd service. The server returns the caller's source IP, used as an
    off-cluster destination for OVN-Kubernetes EgressIP tests.

    It binds 0.0.0.0, so it answers on every libvirt bridge; IPECHO_HOST_IP only
    selects which address downstream steps target. By default that is the ostestbm
    bridge (192.168.111.0/24), on the same L2 segment as the assisted HyperShift agent
    worker VMs, so EgressIP SNAT traffic reaches it without extra routing. For
    secondary-NIC EgressIP, point it at the extra network's gateway so the traffic is
    forced out of that interface.

    The step opens IPECHO_PORT in the firewalld zone owning the bridge that holds
    IPECHO_HOST_IP. libvirt places NAT network bridges in the "libvirt" zone, which
    otherwise permits only DHCP/DNS/SSH/TFTP.

    Setting IPECHO_VLAN_ID and IPECHO_VLAN_CIDR additionally builds an 802.1Q
    subinterface on that bridge and advertises its address instead. This is needed when
    the guest nodes reach the outside world over a VLAN on a secondary NIC: the untagged
    bridge address is unreachable from a tagged egress path. It relies on the bridge
    having vlan_filtering=0, which is how libvirt creates NAT network bridges, and the
    step fails loudly rather than silently blackholing if that is not the case. The
    subinterface is created outside NetworkManager, so it lands in the default firewalld
    zone and the port is opened there as well as on the bridge.

    Outputs saved to ${SHARED_DIR}:
    - ipecho_host_ip: Address of the echo server, the VLAN address when tagged
    - ipecho_url: Full URL (http://<address>:<port>)
    - ipecho_vlan_id: Written only when tagged, so deprovision can remove the link
