ref:
  as: hypershift-agent-create-proxy
  from: dev-scripts
  cli: latest
  grace_period: 10m
  commands: hypershift-agent-create-proxy-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  timeout: 10m0s
  documentation: |-
    Configures and restarts the Squid proxy for the HostedCluster API server. For Nutanix Agent
    workers, also allows the discovered Assisted Service routes.
