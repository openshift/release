workflow:
  as: hypershift-kubevirt-e2e-aws-nested-virt
  documentation: |-
    Sets up nested AWS hosted cluster as management infrastructure for KubeVirt guest clusters.

    Architecture: Root AWS cluster → Nested AWS Hosted Cluster (management) → KubeVirt VMs (guest)

    Uses M8i instances with AWS nested virtualization API (nestedVirtualizationPolicy). This is
    the AWS equivalent of hypershift-kubevirt-e2e-azure-nested-virt.

    Learn more about HyperShift here: https://github.com/openshift/hypershift
    Track HyperShift's development here: https://issues.redhat.com/projects/HOSTEDCP
  steps:
    env:
      CLOUD_PROVIDER: AWS
      HYPERSHIFT_INSTANCE_TYPE: m8i.4xlarge
      HYPERSHIFT_NODE_COUNT: "3"
      HYPERSHIFT_ZONES: "us-east-1a"
      HYPERSHIFT_HC_RELEASE_IMAGE: "quay.io/openshift-release-dev/ocp-release:5.0.0-rc.2-multi"
      CNV_SUBSCRIPTION_SOURCE: redhat-operators
      ETCD_STORAGE_CLASS: gp3-csi
      KUBEVIRT_CSI_INFRA: gp3-csi
      ENABLE_HYPERSHIFT_OPERATOR_VALIDATING_WEBHOOK: "true"
      ENABLE_AWS_NESTED_VIRT: "true"
      RUN_EXTERNAL_INFRA_TEST: "true"
      RUN_HOSTEDCLUSTER_CREATION: "true"
    pre:
    - ref: ipi-install-rbac
    - chain: hypershift-setup-nested-management-cluster
    - ref: hypershift-kubevirt-install
    - ref: hypershift-install
    test:
    - chain: hypershift-kubevirt-run-e2e-local
    - chain: hypershift-kubevirt-run-e2e-external
    post:
    - chain: hypershift-destroy-nested-management-cluster
