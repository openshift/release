chain:
  as: hypershift-kubevirt-destroy
  steps:
  - as: destroy
    cli: latest
    commands: |-
      set -exuo pipefail

      DEBUG_WAIT_TIMEOUT="${DEBUG_WAIT_TIMEOUT:-0}"
      if [[ -n "${DEBUG_WAIT_TIMEOUT}" && "${DEBUG_WAIT_TIMEOUT}" != "0" ]]; then
        echo "Debug wait: sleeping for ${DEBUG_WAIT_TIMEOUT} seconds before cluster destroy..."
        sleep "${DEBUG_WAIT_TIMEOUT}"
        echo "Debug wait complete."
      fi

      HCP_CLI="/usr/bin/hcp"
      if [[ ! -f $HCP_CLI ]]; then
          # we have to fall back to hypershift in cases where the new hcp cli isn't available yet
          HCP_CLI="/usr/bin/hypershift"
      fi
      echo "Using $HCP_CLI for cli"

      CLUSTER_NAME="$(echo -n $PROW_JOB_ID|sha256sum|cut -c-20)"
      echo "$(date) Deleting HyperShift cluster ${CLUSTER_NAME}"
      $HCP_CLI destroy cluster kubevirt \
        --name ${CLUSTER_NAME} \
        --cluster-grace-period 15m

      # Clean up NNCP and VLAN sub-interface dnsmasq from localnet-vlan path
      if [[ "${ATTACH_DEFAULT_NETWORK:-}" == "localnet-vlan" ]]; then
        LOCALNET_VLAN_ID="${LOCALNET_VLAN_ID:-100}"
        LOCALNET_VLAN_BOND="${LOCALNET_VLAN_BOND:-br-ex}"
        LOCALNET_VLAN_GATEWAY="${LOCALNET_VLAN_GATEWAY:-192.168.112.1}"
        LOCALNET_VLAN_SUBNET="${LOCALNET_VLAN_GATEWAY%.*}.0/24"
        LOCALNET_VLAN_DHCP_INTERFACE="${LOCALNET_VLAN_DHCP_INTERFACE:-${LOCALNET_VLAN_BOND}.${LOCALNET_VLAN_ID}}"
        NNCP_NAME="localnet-vlan-${LOCALNET_VLAN_ID}"
        # Clean up dnsmasq on the single DHCP node (recorded during creation)
        DHCP_NODE=""
        if [[ -f "${SHARED_DIR}/localnet-vlan-dhcp-node" ]]; then
          DHCP_NODE=$(cat "${SHARED_DIR}/localnet-vlan-dhcp-node")
        else
          DHCP_NODE=$(oc get nodes -l node-role.kubernetes.io/worker -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
        fi
        if [[ -n "${DHCP_NODE}" ]]; then
          echo "Cleaning up ${LOCALNET_VLAN_DHCP_INTERFACE} dnsmasq on node ${DHCP_NODE}..."
          oc debug "node/${DHCP_NODE}" -n default --quiet=true -- chroot /host bash -c \
            'set -euo pipefail; dhcp_iface="$1"; vlan_id="$2"; uplink_bond="$3"; gateway="$4"; vlan_subnet="$5"; \
            pidfile="/run/localnet-vlan-${vlan_id}.pid"; conf="/etc/dnsmasq.d/localnet-vlan-${vlan_id}.conf"; \
            unit="/etc/systemd/system/localnet-vlan-${vlan_id}.service"; \
            systemctl disable --now "localnet-vlan-${vlan_id}.service" 2>/dev/null || true; \
            rm -f "${unit}"; systemctl daemon-reload 2>/dev/null || true; \
            if [[ -f "${pidfile}" ]]; then kill "$(cat "${pidfile}")" 2>/dev/null || true; rm -f "${pidfile}"; fi; \
            rm -f "${conf}" "/etc/NetworkManager/dnsmasq.d/localnet-vlan-${vlan_id}.conf"; \
            for proto in udp tcp; do \
              iptables -t nat -D PREROUTING -d "${gateway}" -p "${proto}" --dport 53 -j REDIRECT --to-ports 5353 2>/dev/null || true; \
              iptables -t nat -D PREROUTING -i "${dhcp_iface}" -p "${proto}" --dport 53 -j REDIRECT --to-ports 5353 2>/dev/null || true; \
            done; \
            iptables -D FORWARD -i "${dhcp_iface}" -o "${uplink_bond}" -j ACCEPT 2>/dev/null || true; \
            iptables -D FORWARD -i "${uplink_bond}" -o "${dhcp_iface}" -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || true; \
            iptables -t nat -D POSTROUTING -s "${vlan_subnet}" -o "${uplink_bond}" -j MASQUERADE 2>/dev/null || true; \
            ip addr flush dev "${dhcp_iface}" 2>/dev/null || true' \
            _ "${LOCALNET_VLAN_DHCP_INTERFACE}" "${LOCALNET_VLAN_ID}" "${LOCALNET_VLAN_BOND}" \
            "${LOCALNET_VLAN_GATEWAY}" "${LOCALNET_VLAN_SUBNET}" || true
          for NODE in $(oc get nodes -o jsonpath='{.items[*].metadata.name}' 2>/dev/null); do
            [[ "${NODE}" == "${DHCP_NODE}" ]] && continue
            oc debug "node/${NODE}" -n default --quiet=true -- chroot /host bash -c \
              'set -euo pipefail; dhcp_iface="$1"; uplink_bond="$2"; vlan_subnet="$3"; \
              iptables -D FORWARD -i "${dhcp_iface}" -o "${uplink_bond}" -j ACCEPT 2>/dev/null || true; \
              iptables -D FORWARD -i "${uplink_bond}" -o "${dhcp_iface}" -m state --state RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || true; \
              iptables -t nat -D POSTROUTING -s "${vlan_subnet}" -o "${uplink_bond}" -j MASQUERADE 2>/dev/null || true' \
              _ "${LOCALNET_VLAN_DHCP_INTERFACE}" "${LOCALNET_VLAN_BOND}" "${LOCALNET_VLAN_SUBNET}" 2>/dev/null || true
          done
        fi
        echo "Cleaning up NNCP ${NNCP_NAME}..."
        oc delete nncp "${NNCP_NAME}" --ignore-not-found --timeout=120s 2>/dev/null || true
      fi

      echo "$(date) Finished deleting cluster"
    from: hypershift-operator
    grace_period: 10m0s
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
    timeout: 26h0m0s
    env:
    - name: ATTACH_DEFAULT_NETWORK
      default: ""
      documentation: |-
        Passed through from hypershift-kubevirt-create. When localnet-vlan, destroy also
        cleans up NNCP and dnsmasq resources after cluster deletion.
    - name: LOCALNET_VLAN_ID
      default: "100"
      documentation: VLAN ID for localnet-vlan cleanup during destroy.
    - name: LOCALNET_VLAN_BOND
      default: br-ex
      documentation: Uplink bond for localnet-vlan cleanup during destroy.
    - name: LOCALNET_VLAN_GATEWAY
      default: "192.168.112.1"
      documentation: Gateway on the VLAN segment; used to derive subnet for routing cleanup.
    - name: LOCALNET_VLAN_DHCP_INTERFACE
      default: ""
      documentation: |-
        VLAN sub-interface used for dnsmasq during localnet-vlan. Defaults to
        ${LOCALNET_VLAN_BOND}.${LOCALNET_VLAN_ID}.
    - name: DEBUG_WAIT_TIMEOUT
      default: "0"
      documentation: |-
        Seconds to sleep before starting cluster destroy. Runs in the post phase so the
        cluster remains available for debugging after pre or test step failures. Set to 0 to skip.
