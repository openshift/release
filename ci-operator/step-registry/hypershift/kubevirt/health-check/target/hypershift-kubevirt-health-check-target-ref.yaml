ref:
  as: hypershift-kubevirt-health-check-target
  from: cli
  commands: hypershift-kubevirt-health-check-target-commands.sh
  timeout: 45m0s
  grace_period: 10m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: MCE_VERSION
    default: ""
    documentation: Version of MCE installed on the management cluster, if any.
  - name: E2E_HOSTED_CLUSTER_NAMESPACE
    default: local-cluster
    documentation: Namespace containing the restored HostedCluster.
  - name: HYPERSHIFT_WAIT_FOR_READY_NODES
    default: "true"
    documentation: Require the expected guest nodes to report the Ready condition.
  documentation: |-
    Checks guest node readiness and cluster health on the target after the
    restored guest's DNS and kubeconfig proxy are configured.
