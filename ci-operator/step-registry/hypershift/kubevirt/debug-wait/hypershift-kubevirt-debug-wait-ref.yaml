ref:
  as: hypershift-kubevirt-debug-wait
  from_image:
    namespace: openshift
    name: cli
    tag: latest
  timeout: 19h0m0s
  commands: hypershift-kubevirt-debug-wait-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: DEBUG_WAIT_TIMEOUT
    default: "0"
    documentation: "Seconds to sleep for debugging before teardown. 0 disables the wait."
  documentation: |-
    Sleeps for DEBUG_WAIT_TIMEOUT seconds to allow real-time cluster debugging
    before teardown. Designed for use as a post step with optional_on_success
    and best_effort so it only runs on failure and does not block cleanup if
    the sleep itself is interrupted.
