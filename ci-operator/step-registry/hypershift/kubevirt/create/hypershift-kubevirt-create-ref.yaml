ref:
  as: hypershift-kubevirt-create
  from: hypershift-operator
  grace_period: 5m0s
  timeout: 1h30m
  cli: latest
  env:
    - name: HYPERSHIFT_NODE_COUNT
      default: "3"
      documentation: "The number nodes to automatically create and join to the cluster."
    - name: HYPERSHIFT_NODE_MEMORY
      default: "16"
      documentation: "The amount of RAM that will be allocated for the kubevirt hosted cluster's nodes in Gi"
    - name: HYPERSHIFT_NODE_CPU_CORES
      default: "4"
      documentation: "The number of CPU cores that will be assigned for the kubevirt hosted cluster's nodes."
    - name: HYPERSHIFT_NETWORK_TYPE
      default: "OVNKubernetes"
      documentation: "Specifies the cluster SDN provider."
    - name: RUN_HOSTEDCLUSTER_CREATION
      default: "true"
      documentation: |-
        Indicates whether this step should be skipped. Useful when it is a part of a workflow used in various
        branches, and some branches don't need to execute that step.
    - name: KUBEVIRT_CSI_INFRA
      default: ""
      documentation: |-
        The default storage class on the infra cluster to be used by the guest cluster with the
        kubevirt csi-driver.
    - name: HYPERSHIFT_HC_RELEASE_IMAGE
      default: ""
      documentation: "Release image used for the HostedCluster. Empty by default it will use release:latest"
    - name: ENABLE_ICSP
      default: "false"
      documentation: "if true, add image content sources config(path=${SHARED_DIR}/mgmt_iscp.yaml)"
    - name: ATTACH_DEFAULT_NETWORK
      default: ""
      documentation: |-
        Controls network attachment for KubeVirt hosted cluster VMs:
        - "true": create macvlan additional network, attach-default-network=true (dual network)
        - "false": create macvlan additional network, attach-default-network=false (macvlan only)
        - "localnet": create OVN localnet additional network, attach-default-network=true (Model 3)
        - "localnet-multi": N localnet networks (OVN CUDN-style NADs), attach-default-network=false
        - "": skip all additional network config (default, uses pod network - Model 1)
    - name: ETCD_STORAGE_CLASS
      default: ""
      documentation: |-
        The storage class that will be used for etcd on the hosted control plane.
    - name: MCE_VERSION
      default: ""
      documentation: "version of the mce, if installed; if not the default empty string will skip all the MCE specific commands. (\"\", 2.4, 2.5, 2.6, 2.7, 2.8, 2.9, 2.10)"
    - name: DISCONNECTED
      default: "false"
      documentation: Should we work on top of a disconnected environment
    - name: CONTROL_PLANE_AVAILABILITY
      default: "SingleReplica"
      documentation: "Availability policy for hosted cluster components"
    - name: INFRA_AVAILABILITY
      default: "SingleReplica"
      documentation: "Availability policy for infrastructure services in guest cluster"
    - name: HYPERSHIFT_CREATE_CLUSTER_RENDER
      default: "false"
      documentation: "If true, render artifacts to ${SHARED_DIR}/hypershift_create_cluster_render.yaml"
    - name: EXTRA_ARGS
      default: ""
      documentation: "Extra args to pass to the create cluster kubevirt command"
    - name: IP_STACK
      default: v4
      documentation: |-
        Configures the IP_STACK for the devscripts cluster. The possible values are v4, v6 or
        v4v6 for dual stack. The default is v4.
    - name: HYPERSHIFT_NP_AUTOREPAIR
      default: "false"
      documentation: "Enables machine autorepair with machine health checks."
    - name: LOCALNET_MULTI_NETWORK_COUNT
      default: "2"
      documentation: "Number of localnet networks for the multi-localnet architecture. Primary (localnet-1) uses libvirt DHCP passthrough."
    - name: LOCALNET_MULTI_SUBNETS
      default: ""
      documentation: |-
        Deprecated; ignored when all localnet NADs use subnets-less passthrough to ostestbm.
        Secondary virtio NICs (enp2s0..) receive DHCP from libvirt dnsmasq on 192.168.111.0/24.
    - name: LOCALNET_MULTI_IPECHO_LOCALNET_INDEX
      default: "2"
      documentation: |-
        Localnet index (1..N) for the ip-echo EgressIP probe pod. Defaults to localnet-2 so the
        probe uses a secondary virtio segment on the ostestbm L2 (192.168.111.0/24).
    - name: LOCALNET_MULTI_IPECHO_STATIC_IP
      default: "192.168.111.250/24"
      documentation: |-
        Static IPv4 for the ip-echo pod on its localnet NAD (Multus network selection element).
        Must be on 192.168.111.0/24 and outside the ostestbm DHCP pool (.100-.240).
    - name: LOCALNET_MULTI_ENABLE_KUBELET_BOOTSTRAP_ASSIST
      default: "true"
      documentation: |-
        When true and ATTACH_DEFAULT_NETWORK=localnet-multi, SSH to worker VMIs on
        localnet-1 and start crio/kubelet if inactive until the NodePool is Ready.
    - name: LOCALNET_MULTI_KUBELET_BOOTSTRAP_TIMEOUT
      default: "2700"
      documentation: |-
        Seconds to poll worker VMIs and start crio/kubelet before failing the create step.
    - name: LOCALNET_MULTI_NODEPOOL_READY_TIMEOUT
      default: "45m"
      documentation: |-
        Maximum time to wait for the NodePool Ready condition after HostedCluster Available.
    - name: LOCALNET_MULTI_SSH_POD_IMAGE
      default: "registry.redhat.io/rhel9/support-tools:latest"
      documentation: |-
        Image for localnet-multi kubelet bootstrap SSH pods. Must include an ssh client.
  commands: hypershift-kubevirt-create-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  credentials:
    - mount_path: /etc/ci-pull-credentials
      bundle: ci-pull-credentials
      namespace: test-credentials
  dependencies:
    - name: "release:latest"
      env: HOSTEDCLUSTER_RELEASE_IMAGE_LATEST
    - name: "release:latest"
      env: NODEPOOL_RELEASE_IMAGE_LATEST
    - name: "release:latest"
      env: RELEASE_IMAGE_LATEST
