ref:
  as: hypershift-kubevirt-create
  from: hypershift-operator
  grace_period: 5m0s
  timeout: 90m0s
  cli: latest
  env:
    - name: HYPERSHIFT_NODE_COUNT
      default: "3"
      documentation: "The number nodes to automatically create and join to the cluster."
    - name: HYPERSHIFT_NODE_MEMORY
      default: "16"
      documentation: "The amount of RAM that will be allocated for the kubevirt hosted cluster's nodes in Gi"
    - name: HYPERSHIFT_NODE_CPU_CORES
      default: "4"
      documentation: "The number of CPU cores that will be assigned for the kubevirt hosted cluster's nodes."
    - name: HYPERSHIFT_NETWORK_TYPE
      default: "OVNKubernetes"
      documentation: "Specifies the cluster SDN provider."
    - name: CNI_PROVIDER
      default: ""
      documentation: "The CNI provider to use for the cluster. Supported values: cilium"
    - name: RUN_HOSTEDCLUSTER_CREATION
      default: "true"
      documentation: |-
        Indicates whether this step should be skipped. Useful when it is a part of a workflow used in various
        branches, and some branches don't need to execute that step.
    - name: KUBEVIRT_CSI_INFRA
      default: ""
      documentation: |-
        The default storage class on the infra cluster to be used by the guest cluster with the
        kubevirt csi-driver.
    - name: HYPERSHIFT_HC_RELEASE_IMAGE
      default: ""
      documentation: "Release image used for the HostedCluster. Empty by default it will use release:latest"
    - name: ENABLE_ICSP
      default: "false"
      documentation: "if true, add image content sources config(path=${SHARED_DIR}/mgmt_iscp.yaml)"
    - name: ATTACH_DEFAULT_NETWORK
      default: ""
      documentation: |-
        Controls network attachment for KubeVirt hosted cluster VMs:
        - "true": create macvlan additional network, attach-default-network=true (dual network)
        - "false": create macvlan additional network, attach-default-network=false (macvlan only)
        - "localnet": create OVN localnet additional network, attach-default-network=true (Model 3)
        - "localnet-multi": 2-network localnet, attach-default-network=false (multi-localnet architecture)
        - "": skip all additional network config (default, uses pod network - Model 1)
    - name: ETCD_STORAGE_CLASS
      default: ""
      documentation: |-
        The storage class that will be used for etcd on the hosted control plane.
    - name: MCE_VERSION
      default: ""
      documentation: "version of the mce, if installed; if not the default empty string will skip all the MCE specific commands. (\"\", 2.4, 2.5, 2.6, 2.7, 2.8, 2.9, 2.10)"
    - name: DISCONNECTED
      default: "false"
      documentation: Should we work on top of a disconnected environment
    - name: CONTROL_PLANE_AVAILABILITY
      default: "SingleReplica"
      documentation: "Availability policy for hosted cluster components"
    - name: INFRA_AVAILABILITY
      default: "SingleReplica"
      documentation: "Availability policy for infrastructure services in guest cluster"
    - name: HYPERSHIFT_CREATE_CLUSTER_RENDER
      default: "false"
      documentation: "If true, render artifacts to ${SHARED_DIR}/hypershift_create_cluster_render.yaml"
    - name: EXTRA_ARGS
      default: ""
      documentation: "Extra args to pass to the create cluster kubevirt command"
    - name: IP_STACK
      default: v4
      documentation: |-
        Configures the IP_STACK for the devscripts cluster. The possible values are v4, v6 or
        v4v6 for dual stack. The default is v4.
    - name: HYPERSHIFT_NP_AUTOREPAIR
      default: "false"
      documentation: "Enables machine autorepair with machine health checks."
    - name: LOCALNET_MULTI_NETWORK_COUNT
      default: "1"
      documentation: "Number of localnet networks for the multi-localnet architecture. First network gets the default gateway."
    - name: LOCALNET_MULTI_BRIDGE
      default: "br-ex"
      documentation: |-
        OVS bridge mapped to localnet physnets. Defaults to br-ex (the primary bridge).
        Set to a custom bridge name (e.g. br-localnet) when VM traffic should exit via a
        secondary interface instead of the management network's br-ex.
    - name: LOCALNET_MULTI_PHYSNET
      default: "physnet"
      documentation: |-
        OVN physnet name for the primary localnet NAD. Defaults to physnet (the default
        OVN-K bridge-mapping). Set to a custom name (e.g. physnet-localnet) when using a
        secondary OVS bridge so the mapping does not conflict with the default physnet:br-ex.
    - name: LOCALNET_MULTI_SUBNETS
      default: "192.168.111.128/25,192.168.224.0/24"
      documentation: |-
        Comma-separated list of subnets for multi-localnet networks. Must have at least
        LOCALNET_MULTI_NETWORK_COUNT entries. First subnet gets default gateway and DNS.
        On baremetal dev-scripts clusters the primary subnet must avoid 192.168.111.4
        (ingress VIP), .5 (api VIP), node br-ex (.20-.25), and MetalLB/HC API (.30-.32).
        Default 192.168.111.128/25 keeps worker IPAM in the upper half of the /24 on br-ex.
    - name: LOCALNET_MULTI_PRIMARY_GATEWAY
      default: "192.168.111.1"
      documentation: "Gateway IP for the primary localnet in the multi-localnet architecture (also used as DNS server)."
    - name: LOCALNET_MULTI_PRIMARY_DNS
      default: "192.168.111.1"
      documentation: "DNS server IP for the primary localnet in the multi-localnet architecture."
    - name: LOCALNET_MULTI_EXCLUDE_SUBNETS
      default: ""
      documentation: |-
        Optional comma-separated CIDRs excluded from OVN IPAM on the primary localnet NAD
        (in addition to choosing a non-overlapping primary subnet). Use when the primary
        subnet must be a full /24 but must not assign dev-scripts VIP addresses.
    - name: LOCALNET_MULTI_IPV6_SUBNET
      default: ""
      documentation: |-
        IPv6 CIDR for the primary localnet NAD, enabling dual-stack on the guest cluster's
        external network. When set, OVN natively manages IPv6 on the localnet and a br-ex
        flow fix is applied so management kernel responses (e.g. Ingress VIP SYN-ACKs) reach
        VMs via the localnet bridge instead of being sent only to the physical NIC.
        - "auto": auto-discover from the management cluster's IPv6 machineNetwork (upper /121
          of the node /120, e.g. fd2e:6f44:5dd8:c956::80/121). Falls back to no IPv6 if the
          management cluster is IPv4-only.
        - "": no IPv6 on localnet (IPv4-only, uses LOCALNET_MULTI_DISABLE_IPV6_BOOT for
          IPv6 blocking during bootstrap).
        - explicit CIDR: use this IPv6 subnet for the primary localnet NAD.
    - name: LOCALNET_MULTI_DISABLE_IPV6_BOOT
      default: "true"
      documentation: |-
        When true and IP_STACK is dual-stack (v4v6/v6v4), strip IPv6 from localnet LSPs and
        disable IPv6 on worker enp*s0 during bootstrap so initrd Ignition reaches the IPv4
        ingress VIP instead of timing out on IPv6.
        Ignored when LOCALNET_MULTI_IPV6_SUBNET resolves to a valid IPv6 CIDR, because OVN
        then manages IPv6 natively on the localnet.
    - name: LOCALNET_MULTI_VERIFY_DEFAULT_ROUTE
      default: "true"
      documentation: |-
        When true, verify each worker VMI has an IPv4 default route via LOCALNET_MULTI_PRIMARY_GATEWAY
        after guest-exec/SSH renewal. Fail the create step if verification fails post-Available.
    - name: LOCALNET_MULTI_DHCP_MODE
      default: "ovn"
      documentation: |-
        Controls how DHCP is provided to localnet-multi VMs.
        "ovn": NAD includes subnets for OVN IPAM. OVN DHCP options are configured on each
          LSP to provide gateway and DNS. KubeVirt also creates an internal DHCP server;
          the renewal code fixes any incorrect settings from the KubeVirt/OVN race.
        "external": NAD omits subnets (L2 passthrough). KubeVirt sees no IP on the pod
          interface and does not create a DHCP server, eliminating the DHCP race entirely.
          An external DHCP server (e.g. dnsmasq on the bridge, configured by the
          localnet-secondary-bridge step) must provide DHCP with correct gateway and DNS.
  commands: hypershift-kubevirt-create-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  credentials:
    - mount_path: /etc/ci-pull-credentials
      bundle: ci-pull-credentials
      namespace: test-credentials
  dependencies:
    - name: "release:latest"
      env: HOSTEDCLUSTER_RELEASE_IMAGE_LATEST
    - name: "release:latest"
      env: NODEPOOL_RELEASE_IMAGE_LATEST
    - name: "release:latest"
      env: RELEASE_IMAGE_LATEST
