ref:
  as: hypershift-kubevirt-create
  from: hypershift-operator
  grace_period: 5m0s
  timeout: 2h30m
  cli: latest
  env:
    - name: HYPERSHIFT_NODE_COUNT
      default: "3"
      documentation: "The number nodes to automatically create and join to the cluster."
    - name: HYPERSHIFT_NODE_MEMORY
      default: "16"
      documentation: "The amount of RAM that will be allocated for the kubevirt hosted cluster's nodes in Gi"
    - name: HYPERSHIFT_NODE_CPU_CORES
      default: "4"
      documentation: "The number of CPU cores that will be assigned for the kubevirt hosted cluster's nodes."
    - name: HYPERSHIFT_NETWORK_TYPE
      default: "OVNKubernetes"
      documentation: "Specifies the cluster SDN provider."
    - name: RUN_HOSTEDCLUSTER_CREATION
      default: "true"
      documentation: |-
        Indicates whether this step should be skipped. Useful when it is a part of a workflow used in various
        branches, and some branches don't need to execute that step.
    - name: KUBEVIRT_CSI_INFRA
      default: ""
      documentation: |-
        The default storage class on the infra cluster to be used by the guest cluster with the
        kubevirt csi-driver.
    - name: HYPERSHIFT_HC_RELEASE_IMAGE
      default: ""
      documentation: "Release image used for the HostedCluster. Empty by default it will use release:latest"
    - name: ENABLE_ICSP
      default: "false"
      documentation: "if true, add image content sources config(path=${SHARED_DIR}/mgmt_iscp.yaml)"
    - name: ATTACH_DEFAULT_NETWORK
      default: ""
      documentation: |-
        Controls network attachment for KubeVirt hosted cluster VMs:
        - "true": create macvlan additional network, attach-default-network=true (dual network)
        - "false": create macvlan additional network, attach-default-network=false (macvlan only)
        - "localnet": create OVN localnet additional network, attach-default-network=true (Model 3)
        - "localnet-multi": N localnet networks (OVN CUDN-style NADs), attach-default-network=false
        - "localnet-vlan": localnet with dedicated secondary VLAN via NNCP (L2 passthrough, per-node dnsmasq on <LOCALNET_VLAN_BOND>.<LOCALNET_VLAN_ID>, e.g. br-ex.100)
        - "": skip all additional network config (default, uses pod network - Model 1)
    - name: ETCD_STORAGE_CLASS
      default: ""
      documentation: |-
        The storage class that will be used for etcd on the hosted control plane.
    - name: MCE_VERSION
      default: ""
      documentation: "version of the mce, if installed; if not the default empty string will skip all the MCE specific commands. (\"\", 2.4, 2.5, 2.6, 2.7, 2.8, 2.9, 2.10)"
    - name: DISCONNECTED
      default: "false"
      documentation: Should we work on top of a disconnected environment
    - name: CONTROL_PLANE_AVAILABILITY
      default: "SingleReplica"
      documentation: "Availability policy for hosted cluster components"
    - name: INFRA_AVAILABILITY
      default: "SingleReplica"
      documentation: "Availability policy for infrastructure services in guest cluster"
    - name: HYPERSHIFT_CREATE_CLUSTER_RENDER
      default: "false"
      documentation: "If true, render artifacts to ${SHARED_DIR}/hypershift_create_cluster_render.yaml"
    - name: EXTRA_ARGS
      default: ""
      documentation: "Extra args to pass to the create cluster kubevirt command"
    - name: IP_STACK
      default: v4
      documentation: |-
        Configures the IP_STACK for the devscripts cluster. The possible values are v4, v6 or
        v4v6 for dual stack. The default is v4.
    - name: HYPERSHIFT_NP_AUTOREPAIR
      default: "false"
      documentation: "Enables machine autorepair with machine health checks."
    - name: LOCALNET_VLAN_ID
      default: "100"
      documentation: |-
        VLAN ID for the localnet-vlan path (MAPFRE NAD 1 / primary guest VLAN). NNCP creates
        br-localnet with untagged port to <bond>.<vlan-id> (e.g. br-ex.100) — the secondary
        VLAN segment on each mgmt node, separate from primary ostestbm br-ex (111.x). Per-node
        host dnsmasq and MASQUERADE serve ostestbm per-node L2 islands. NAD is subnets-less
        untagged L2 passthrough.
    - name: LOCALNET_VLAN_GATEWAY
      default: "192.168.112.1"
      documentation: |-
        Gateway/DNS address on the VLAN sub-interface and default route handed to worker
        VMIs via dnsmasq. Must be on the VLAN segment (not 192.168.111.x br-ex).
    - name: LOCALNET_VLAN_DHCP_RANGE_START
      default: "192.168.112.100"
      documentation: |-
        Start of the dnsmasq DHCP pool on the VLAN sub-interface for localnet-vlan worker VMIs.
    - name: LOCALNET_VLAN_DHCP_RANGE_END
      default: "192.168.112.240"
      documentation: |-
        End of the dnsmasq DHCP pool on the VLAN sub-interface for localnet-vlan worker VMIs.
    - name: LOCALNET_VLAN_API_VIP
      default: "192.168.111.32"
      documentation: |-
        API VIP for static api/api-int DNS records in VLAN dnsmasq before the hosted cluster
        exists. Refreshed from HostedCluster status.controlPlaneEndpoint.host after create.
        Must be reachable from the VLAN worker subnet (routing/SNAT is configured on mgmt nodes).
    - name: LOCALNET_VLAN_INGRESS_VIP
      default: "192.168.111.4"
      documentation: |-
        Ingress VIP for static *.apps DNS records in VLAN dnsmasq (same role as ostestbm
        on baremetal dev-scripts for localnet-multi). Distinct from LOCALNET_VLAN_API_VIP.
        After NodePool Ready the create step patches the guest ingress controller to HostNetwork
        and installs per-mgmt-node iptables DNAT from this VIP:80/443 to the router worker's
        VLAN IP so canary/console route checks reach the hosted cluster router (not mgmt ingress).
    - name: LOCALNET_VLAN_INGRESS_HOSTNETWORK
      default: "true"
      documentation: |-
        When true and ATTACH_DEFAULT_NETWORK=localnet-vlan, patch the guest default IngressController
        to HostNetwork so the router listens on the worker VLAN NIC (192.168.112.x).
    - name: LOCALNET_VLAN_INGRESS_VIP_DNAT
      default: "true"
      documentation: |-
        When true, DNAT LOCALNET_VLAN_INGRESS_VIP:80/443 on every mgmt node to the guest router
        worker VLAN IP (NodePort or :443/:80 with HostNetwork; required for *.apps DNS).
    - name: LOCALNET_VLAN_WORKER_HOST_ROUTES_STRICT
      default: "true"
      documentation: |-
        When true, fail create if worker VLAN IPs cannot be discovered for /32 host routes
        (retries LOCALNET_VLAN_WORKER_ROUTE_DISCOVERY_ATTEMPTS before failing).
    - name: LOCALNET_VLAN_WORKER_ROUTE_DISCOVERY_ATTEMPTS
      default: "12"
      documentation: |-
        Retry count (30s apart) when discovering worker 192.168.112.x addresses from VMIs before
        installing /32 host routes or ingress DNAT target selection.
    - name: LOCALNET_VLAN_DHCP_INTERFACE
      default: ""
      documentation: |-
        Kernel netdev for dnsmasq DHCP/DNS (defaults to <LOCALNET_VLAN_BOND>.<LOCALNET_VLAN_ID>,
        e.g. br-ex.100). br-localnet is an OVS bridge without a kernel interface.
    - name: LOCALNET_VLAN_NODEPOOL_READY_TIMEOUT
      default: "45m"
      documentation: |-
        Maximum time to wait for the NodePool Ready condition after localnet-vlan setup.
    - name: LOCALNET_VLAN_BRIDGE
      default: "br-localnet"
      documentation: |-
        OVS bridge name created by the NNCP for localnet-vlan. Must not conflict with
        existing bridges (e.g., br-ex, br-int).
    - name: LOCALNET_VLAN_PHYSNET
      default: "localnet-physnet"
      documentation: |-
        OVN physnet name for the bridge-mapping. The NAD references this as the "name"
        field. Must not conflict with existing physnet names (e.g., physnet).
    - name: LOCALNET_VLAN_BOND
      default: "br-ex"
      documentation: |-
        Primary OVN external bridge on the mgmt node (ostestbm: enp2s0 -> br-ex, 192.168.111.x).
        The NNCP attaches br-localnet to <bond>.<vlan-id> (secondary guest segment, e.g.
        br-ex.100 / 192.168.112.x). MASQUERADE routes worker traffic from the VLAN subnet
        through this bridge to reach the API VIP.
    - name: LOCALNET_VLAN_WORKER_HOST_ROUTES
      default: "true"
      documentation: |-
        When true and ATTACH_DEFAULT_NETWORK=localnet-vlan, after NodePool Ready install per-worker
        /32 routes on every mgmt node (remote hypervisors only; never via own br-ex on the VMI
        host) and refresh east-west FORWARD/NAT so guest OVN overlay works across per-node
        localnet VLAN segments.
    - name: LOCALNET_VLAN_MGMT_POD_CIDR
      default: ""
      documentation: |-
        Mgmt cluster pod network CIDR for iptables FORWARD to the guest VLAN subnet (default:
        auto-detect from cluster network.config.openshift.io). Required so hosted kube-apiserver
        pods can reach guest kubelets on 192.168.112.x (oc exec, e2e oc rsh).
    - name: LOCALNET_VLAN_MGMT_SERVICE_CIDR
      default: ""
      documentation: |-
        Mgmt cluster service CIDR to forward to the guest VLAN subnet (default: auto-detect from
        network.config.openshift.io, else 172.30.0.0/16).
    - name: LOCALNET_VLAN_MGMT_ROUTING_VIA_HOST
      default: "true"
      documentation: |-
        When true, set routingViaHost on the mgmt cluster OVNKubernetes gateway so hosted control
        plane pods use hypervisor routes (with LOCALNET_VLAN host FORWARD/NAT) to reach guest
        worker kubelets on the VLAN subnet (oc exec, e2e oc rsh).
    - name: LOCALNET_VLAN_DEPLOY_IPECHO
      default: "true"
      documentation: |-
        When true and ATTACH_DEFAULT_NETWORK=localnet-vlan, deploy egressip-ipecho on the mgmt
        cluster after guest ingress datapath setup (secondary VLAN localnet NAD, static IP).
        The step waits for namespace SCC uid-range, prepares OVN localnet LSPs in the ip-echo
        namespace, and prefers nodes listed in ${SHARED_DIR}/localnet-vlan-dhcp-nodes. URL written
        to ${SHARED_DIR}/kubevirt_ipecho_url for downstream EgressIP or probe tests.
    - name: LOCALNET_VLAN_IPECHO_STATIC_IP
      default: "192.168.112.250/24"
      documentation: |-
        Static IPv4 for the ip-echo pod on the primary localnet-vlan NAD (Multus). Used only
        when LOCALNET_VLAN_EGRESS_ENABLE is false. Must be on the VLAN worker subnet
        (default 192.168.112.0/24) and outside the dnsmasq DHCP pool (.100-.240).
    - name: LOCALNET_VLAN_EGRESS_IPECHO_STATIC_IP
      default: "192.168.200.250/24"
      documentation: |-
        Static IPv4 for the ip-echo pod on the egress localnet NAD (Multus). Used when
        LOCALNET_VLAN_EGRESS_ENABLE is true. Must be on the egress VLAN subnet
        (default 192.168.200.0/24) and outside the egress dnsmasq DHCP pool (.100-.240).
        EgressIP nftables SNAT matches oifname on the egress interface, so ip-echo must be
        reachable via that interface for source-IP verification to work.
    - name: LOCALNET_VLAN_IPECHO_POD_READY_TIMEOUT
      default: "300"
      documentation: |-
        Seconds to wait for the egressip-ipecho pod Ready condition on localnet-vlan (mgmt cluster).
    - name: LOCALNET_VLAN_IPECHO_LSP_PREP_ATTEMPTS
      default: "24"
      documentation: |-
        Retries (10s apart) to prepare OVN localnet LSPs in the ip-echo namespace after the pod is
        created (clear OVN DHCP/port_security for static Multus IP on br-ex.<vlan-id>).
    - name: LOCALNET_VLAN_IPECHO_SCHEDULE_ATTEMPTS
      default: "5"
      documentation: |-
        Node scheduling retries for ip-echo (evictions, SCC uid-range flakes, alternate dhcp nodes).
    - name: LOCALNET_VLAN_EGRESS_ENABLE
      default: "true"
      documentation: |-
        When true, set up egress VLAN (NAD 2) for EgressIP: NNCP, OVS bridge, DHCP-only dnsmasq,
        and localnet NAD on the mgmt cluster. Guest nodes get egress NIC IPs via DHCP.
    - name: LOCALNET_VLAN_EGRESS_VLAN_ID
      default: "200"
      documentation: |-
        VLAN ID for the egress localnet segment. NNCP creates br-egress OVS bridge with
        untagged port to <bond>.<egress-vlan-id> (e.g. br-ex.200).
    - name: LOCALNET_VLAN_EGRESS_BRIDGE
      default: "br-egress"
      documentation: |-
        OVS bridge name for the egress localnet segment.
    - name: LOCALNET_VLAN_EGRESS_PHYSNET
      default: "egress-physnet"
      documentation: |-
        OVN physnet name for the egress bridge-mapping.
    - name: LOCALNET_VLAN_EGRESS_SUBNET
      default: "192.168.200.0/24"
      documentation: |-
        L3 subnet on the egress VLAN segment.
    - name: LOCALNET_VLAN_EGRESS_GATEWAY
      default: "192.168.200.1"
      documentation: |-
        Gateway IP on br-ex.<egress-vlan-id> for the DHCP-only dnsmasq server. Not advertised
        as a default route to guests (egress NIC is L2-only).
    - name: LOCALNET_VLAN_EGRESS_DHCP_RANGE_START
      default: "192.168.200.100"
      documentation: |-
        Start of the DHCP pool for guest egress NICs on the egress VLAN segment.
    - name: LOCALNET_VLAN_EGRESS_DHCP_RANGE_END
      default: "192.168.200.240"
      documentation: |-
        End of the DHCP pool for guest egress NICs on the egress VLAN segment.
    - name: LOCALNET_VLAN_EGRESS_DHCP_INTERFACE
      default: ""
      documentation: |-
        Kernel netdev for egress DHCP (defaults to <LOCALNET_VLAN_BOND>.<LOCALNET_VLAN_EGRESS_VLAN_ID>,
        e.g. br-ex.200).
    - name: LOCALNET_MULTI_NETWORK_COUNT
      default: "2"
      documentation: "Number of localnet networks for the multi-localnet architecture. Primary (localnet-1) uses libvirt DHCP passthrough."
    - name: LOCALNET_MULTI_SUBNETS
      default: ""
      documentation: |-
        Deprecated; ignored when all localnet NADs use subnets-less passthrough to ostestbm.
        Secondary virtio NICs (enp2s0..) receive DHCP from libvirt dnsmasq on 192.168.111.0/24.
    - name: LOCALNET_MULTI_IPECHO_LOCALNET_INDEX
      default: "2"
      documentation: |-
        Localnet index (1..N) for the ip-echo EgressIP probe pod. Defaults to localnet-2 so the
        probe uses a secondary virtio segment on the ostestbm L2 (192.168.111.0/24).
    - name: LOCALNET_MULTI_IPECHO_STATIC_IP
      default: "192.168.111.250/24"
      documentation: |-
        Static IPv4 for the ip-echo pod on its localnet NAD (Multus network selection element).
        Must be on 192.168.111.0/24 and outside the ostestbm DHCP pool (.100-.240).
    - name: LOCALNET_MULTI_ENABLE_KUBELET_BOOTSTRAP_ASSIST
      default: "true"
      documentation: |-
        When true and ATTACH_DEFAULT_NETWORK=localnet-multi, SSH to worker VMIs on
        localnet-1 and start crio/kubelet if inactive until the NodePool is Ready.
    - name: LOCALNET_MULTI_KUBELET_BOOTSTRAP_TIMEOUT
      default: "2700"
      documentation: |-
        Seconds to poll worker VMIs and start crio/kubelet before failing the create step.
    - name: LOCALNET_MULTI_NODEPOOL_READY_TIMEOUT
      default: "45m"
      documentation: |-
        Maximum time to wait for the NodePool Ready condition after HostedCluster Available.
        The create step timeout (2h30m) budgets cluster provisioning, the 30-minute
        HostedCluster Available wait, and this value; kubelet bootstrap assist runs
        within this window and does not add a separate guaranteed 45-minute allowance.
    - name: LOCALNET_MULTI_SSH_POD_IMAGE
      default: "registry.redhat.io/rhel9/support-tools:latest"
      documentation: |-
        Image for localnet-multi kubelet bootstrap SSH pods. Must include an ssh client.
  commands: hypershift-kubevirt-create-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  credentials:
    - mount_path: /etc/ci-pull-credentials
      bundle: ci-pull-credentials
      namespace: test-credentials
  dependencies:
    - name: "release:latest"
      env: HOSTEDCLUSTER_RELEASE_IMAGE_LATEST
    - name: "release:latest"
      env: NODEPOOL_RELEASE_IMAGE_LATEST
    - name: "release:latest"
      env: RELEASE_IMAGE_LATEST
