ref:
  as: hypershift-kubevirt-install-odf
  from: cli
  commands: hypershift-kubevirt-install-odf-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Deploy ODF
  env:
  - name: ODF_OPERATOR_CHANNEL
    documentation: Deprecated compatibility parameter; the channel is selected from the package manifest
    default: "stable-4.18"
  - name: ODF_USE_PRERELEASE
    documentation: Use a custom ODF catalog matching the OpenShift cluster version
    default: "false"
  - name: ODF_CATALOG_VERSION
    documentation: Override the version used for the custom ODF catalog
    default: ""
  - name: ODF_SUBSCRIPTION_NAME
    documentation: The ODF/OCS subscription name
    default: "odf-operator"
  - name: ODF_VOLUME_SIZE
    documentation: Size of the odf storage cluster in Gi
    default: "100"
  - name: ODF_BACKEND_STORAGE_CLASS
    documentation: The Storage Class used for the ODF backend
    default: "gp3-csi"
