ref:
  as: hypershift-kubevirt-baremetalds-proxy
  from: dev-scripts
  grace_period: 10m
  commands: hypershift-kubevirt-baremetalds-proxy-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  documentation: |-
    Configures and restarts the OFCIR bastion Squid proxy (external-squid) for hosted-cluster
    API and ingress VIP CONNECT tunnels, and sets clusters[0].cluster.proxy-url on nested_kubeconfig.
  env:
    - name: LOCALNET_VLAN_INGRESS_VIP
      default: "192.168.111.4"
      documentation: |-
        Guest ingress VIP allowed in Squid CONNECT ACLs (console/apps via HTTPS_PROXY). API VIP is
        read from nested_kubeconfig clusters[0].cluster.server.