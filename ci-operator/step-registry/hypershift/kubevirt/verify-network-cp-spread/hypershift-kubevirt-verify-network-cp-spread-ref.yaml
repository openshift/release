ref:
  as: hypershift-kubevirt-verify-network-cp-spread
  from: cli
  grace_period: 1m0s
  timeout: 20m0s
  env:
    - name: MCE_VERSION
      default: ""
      documentation: |-
        Version of MCE, if installed. Selects the hosted control plane namespace
        prefix: local-cluster when set, clusters otherwise.
    - name: NETWORK_CP_ROLLOUT_TIMEOUT
      default: "10m"
      documentation: |-
        How long to wait for each network control-plane Deployment to roll out
        before declaring the placement unsatisfiable.
  commands: hypershift-kubevirt-verify-network-cp-spread-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Verifies that the CNO network control-plane workloads can schedule on the
    management cluster and that their replicas are spread across nodes.

    This exists to make a single-zone management cluster a real test of
    OCPBUGS-76964 and OCPBUGS-140721. CNO renders pod anti-affinity for these
    workloads only when the hosted control plane has more than one replica, so
    the check is a no-op unless CONTROL_PLANE_AVAILABILITY=HighlyAvailable.
    With a required zone anti-affinity, a cluster whose nodes all share one
    topology.kubernetes.io/zone value cannot place the second replica and it
    stays Pending; the rollout wait is what turns that into a job failure
    rather than something only visible later as a degraded network
    ClusterOperator.

    The step checks ovnkube-control-plane, network-node-identity-v2, and
    multus-admission-controller. On CNO branches that do not yet carry
    OCPBUGS-140721, network-node-identity-v2 is absent and this step fails
    until the CNO change is backported.

    It also asserts the replicas occupy distinct nodes, so that relaxing the
    zone rule cannot silently drop node-level spreading. Zones are logged but
    not asserted: sharing a zone is the expected outcome on a single-zone
    cluster.

    Runs against the management cluster, so it must be placed where KUBECONFIG
    still points at ${SHARED_DIR}/kubeconfig.
