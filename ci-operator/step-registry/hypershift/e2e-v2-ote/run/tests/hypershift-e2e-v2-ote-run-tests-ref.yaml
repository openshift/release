ref:
  as: hypershift-e2e-v2-ote-run-tests
  cli: latest
  commands: hypershift-e2e-v2-ote-run-tests-commands.sh
  credentials:
  - mount_path: /etc/hypershift-ci-jobs-awscreds
    name: hypershift-ci-jobs-awscreds
    namespace: test-credentials
  dependencies:
  - name: "release:latest"
    env: RELEASE_IMAGE_LATEST
  env:
  - name: HYPERSHIFT_PLATFORM
    default: ""
    documentation: "The cloud platform for the clusters (e.g. azure, aws). Set in the workflow env block."
  - name: AWS_GUEST_INFRA_CREDENTIALS_FILE
    default: /etc/hypershift-ci-jobs-awscreds/credentials
    documentation: "Path to the AWS guest infrastructure credentials file. Mounted from the hypershift-ci-jobs-awscreds secret."
  from: hypershift-tests-ote
  grace_period: 5m0s
  resources:
    requests:
      cpu: "1"
      memory: 200Mi
  timeout: 150m0s
