ref:
  as: hypershift-mirror-registry-ca-trust-mgmt
  from: cli
  commands: hypershift-mirror-registry-ca-trust-mgmt-commands.sh
  env:
  - name: MIRROR_REGISTRY_CA_FILE_PREFIX
    default: "mirror-registry-ho-ca"
    documentation: File name prefix of the CA certificate in SHARED_DIR (<prefix>.crt), written by hypershift-mirror-registry-ca-generate.
  - name: MIRROR_REGISTRY_CA_CONFIGMAP
    default: "mirror-registry-ho-ca"
    documentation: Name of the ConfigMap created in openshift-config and referenced by image.config.openshift.io/cluster spec.additionalTrustedCA.
  - name: MIRROR_REGISTRY_ROUTE_HOST_PREFIX
    default: "mirror-registry-test-mirror-registry-ho"
    documentation: |-
      First DNS label of the mirror registry Route host ("<name>-<namespace>" of the e2e v2 fixture). The ConfigMap key
      is "<prefix>.<ingress domain>", the registry hostname, as image.config additionalTrustedCA expects.
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
  documentation: |-
    Makes the HyperShift operator, and through it the control plane operator, HCCO and ignition-server of every
    hosted cluster, trust the e2e v2 mirror registry CA. It adds the CA to image.config.openshift.io/cluster
    spec.additionalTrustedCA on the management cluster, the documented disconnected setup
    (docs/content/how-to/disconnected/tls-certificates.md in openshift/hypershift). The HyperShift operator init
    container reads that CA at pod start, so this step must run before hypershift-install.
