ref:
  as: hypershift-mirror-registry-ca-generate
  from: hypershift-tests
  commands: hypershift-mirror-registry-ca-generate-commands.sh
  env:
  - name: MIRROR_REGISTRY_CA_FILE_PREFIX
    default: "mirror-registry-ho-ca"
    documentation: |-
      File name prefix of the CA written to SHARED_DIR (<prefix>.crt and <prefix>.key). The e2e v2 tests pass this
      CA to the mirror registry fixture (test/e2e/v2/util/mirrorregistry, Options.CA), and later steps distribute
      its certificate to the management cluster before the fixture exists.
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
  documentation: |-
    Generates a short-lived CA for the HyperShift e2e v2 mirror registry fixture and writes it to SHARED_DIR. The CA
    must exist before the management cluster and the HyperShift operator, because they have to trust a registry that
    the tests deploy later.
