ref:
  as: hypershift-aws-create-guests
  cli: latest
  commands: hypershift-aws-create-guests-commands.sh
  credentials:
  - mount_path: /etc/ci-pull-credentials
    bundle: ci-pull-credentials
    namespace: test-credentials
  - mount_path: /etc/hypershift-ci-jobs-awscreds
    group: ops/hypershift-ci-jobs-awscreds
    collection: hypershift-team
  dependencies:
  - name: "release:latest"
    env: RELEASE_IMAGE_LATEST
  - name: "release:latest"
    env: OCP_IMAGE_N1
  env:
  - name: HYPERSHIFT_NODE_COUNT
    default: "2"
    documentation: "The number of nodes per guest cluster."
  - name: HYPERSHIFT_BASE_DOMAIN
    default: "ci.hypershift.devcluster.openshift.com"
    documentation: "The cluster's FQDN will be a subdomain of the base domain."
  - name: HYPERSHIFT_AWS_REGION
    default: "us-east-1"
    documentation: "AWS region for the hosted clusters."
  - name: HYPERSHIFT_AWS_ZONES
    default: "us-east-1a"
    documentation: "Comma-separated availability zones for the hosted clusters."
  - name: HYPERSHIFT_EXTERNAL_DNS_DOMAIN
    default: ""
    documentation: "The external DNS domain for service publishing strategy hostnames."
  - name: HYPERSHIFT_ETCD_STORAGE_CLASS
    default: ""
    documentation: "The persistent volume storage class for etcd data volumes."
  - name: HYPERSHIFT_PLATFORM
    default: ""
    documentation: "The cloud platform for the clusters (e.g. aws). Set in the workflow env block."
  - name: HYPERSHIFT_STORAGE_KMS_KEY_ALIAS
    default: ""
    documentation: "AWS KMS key alias (e.g. alias/hypershift-ci) used to encrypt the default StorageClass volumes on the public cluster. When set and supported by the hypershift binary, the alias is resolved to an ARN and passed as --initial-storage-volumes-kms-key at cluster creation. Leave empty to skip."
  - name: TEST_PLAN_FILE
    default: ""
    documentation: "Path to a test plan that ships in the hypershift-tests image, e.g. /hypershift/testplans/aws-etcd-sharding.yaml. Ignored when hypershift-write-test-plan has written an inline plan to SHARED_DIR. If both are empty, the platform's default test plan is used."
  from: hypershift-tests
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 120m0s
