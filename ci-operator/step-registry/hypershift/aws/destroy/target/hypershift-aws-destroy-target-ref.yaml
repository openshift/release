ref:
  as: hypershift-aws-destroy-target
  best_effort: true
  cli: latest
  env:
  - name: HYPERSHIFT_CLUSTER_ROLE
    default: target
    documentation: Management cluster role used to select the target kubeconfig.
  - name: HYPERSHIFT_BASE_DOMAIN
    default: ''
    documentation: The cluster's FQDN will be a subdomain of the base domain.
  - name: HYPERSHIFT_AWS_REGION
    default: us-east-1
    documentation: "Specifies the AWS region for the cluster. If intentionally left as an empty string, \nthe region defaults\
      \ to that of the management cluster.\n"
  - name: HYPERSHIFT_GUEST_INFRA_OCP_ACCOUNT
    default: 'false'
    documentation: Whether to use the generic CI account or the HyperShift OSD account for the guest clusters infra. For the
      infra created for the clusters. E.g. For cluster-bot we use the generic CI account
  commands: hypershift-aws-destroy-target-commands.sh
  from: hypershift-operator
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 45m0s
  credentials:
  - mount_path: /etc/hypershift-ci-jobs-awscreds
    group: ops/hypershift-ci-jobs-awscreds
    collection: hypershift-team
