workflow:
  as: hypershift-aws-conformance-ipsec
  documentation: |-
    The HyperShift AWS conformance IPsec workflow executes upstream conformance
    tests against an ephemeral public HyperShift cluster whose east-west traffic
    is encrypted with IPsec.

    IPsec is enabled on both tiers. The management cluster is installed from a
    rendered OVNKubernetes manifest that sets ipsecConfig at install time, and the
    hosted cluster's network operator is patched to ipsecConfig.mode=Full once the
    HostedCluster is available, after which the ovn-ipsec pods are waited on
    before any test runs.
  steps:
    env:
      HYPERSHIFT_AWS_REGION: us-east-1
      HYPERSHIFT_HC_ZONES: us-east-1a,us-east-1b,us-east-1c
      HYPERSHIFT_GUEST_INFRA_OCP_ACCOUNT: "true"
      BASE_DOMAIN: qe.devcluster.openshift.com
      PUBLIC_ONLY: "true"
      HYPERSHIFT_NODE_COUNT: "1"
      # FIXME: Remove test skips when those are fixed. Each test skip must be anchored to a issue:
      # CCM-AWS (upstream): https://issues.redhat.com/browse/OCPBUGS-74537 for upstream CCM tests not supported by Hypershift
      # FIPS: Remove when https://github.com/openshift/origin/pull/31288 is merged and propagated to older branches.
      # readyz test lists KAS pods across all namespaces: https://redhat.atlassian.net/browse/OCPBUGS-91633
      IGNORE_EMPTY_TEST_SKIPS: "true"
      TEST_SKIPS: loadbalancer NLB should be reachable with target-node-labels\|
        loadbalancer NLB internal should be reachable with hairpinning traffic\|
        FIPS TestFIPS\|
        API LBs follow /readyz of kube-apiserver and stop sending requests before server shutdowns for external clients
    pre:
    - chain: cucushift-installer-rehearse-aws-ipi-ovn-hypershift-ipsec-provision
    - ref: cucushift-hypershift-extended-enable-guest
    - ref: cucushift-hypershift-extended-enable-ipsec
    test:
    - chain: hypershift-conformance
    post:
    - ref: cucushift-hypershift-extended-disable-guest
    - chain: cucushift-installer-rehearse-aws-ipi-ovn-hypershift-deprovision
