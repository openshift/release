chain:
  as: hypershift-aws-run-e2e-v2
  steps:
  - as: tests
    cli: latest
    env:
    - name: HYPERSHIFT_PLATFORM
      default: ""
      documentation: "The cloud platform for the clusters (e.g. aws). Set in the workflow env block."
    - name: E2E_AWS_KMS_KEY_ARN_ALTERNATE
      default: ""
      documentation: "Alternate AWS KMS key alias or ARN for etcd key-rotation re-encryption tests (AWSKMSKeyRotationTest, AzureKMSConsecutiveKeyRotationTest). Must be a different key than the one used at cluster creation. Leave empty to skip AWS KMS re-encryption tests."
    commands: |-
      set -xuo pipefail
      export KUBECONFIG="${SHARED_DIR}/management_cluster_kubeconfig"
      export AWS_SHARED_CREDENTIALS_FILE="/etc/hypershift-ci-jobs-awscreds/credentials"
      export AWS_GUEST_INFRA_CREDENTIALS_FILE="/etc/hypershift-ci-jobs-awscreds/credentials"
      export PULL_SECRET_FILE="/etc/ci-pull-credentials/.dockerconfigjson"
      if [[ -f "${SHARED_DIR}/test-plan.yaml" ]]; then
          export TEST_PLAN="${SHARED_DIR}/test-plan.yaml"
      fi
      /hypershift/bin/run-tests
    timeout: 150m
    grace_period: 5m
    from: hypershift-tests
    dependencies:
    - name: "release:latest"
      env: RELEASE_IMAGE_LATEST
    resources:
      requests:
        cpu: "1"
        memory: 200Mi
    credentials:
    - mount_path: /etc/hypershift-ci-jobs-awscreds
      group: ops/hypershift-ci-jobs-awscreds
      collection: hypershift-team
    - mount_path: /etc/ci-pull-credentials
      bundle: ci-pull-credentials
      namespace: test-credentials
