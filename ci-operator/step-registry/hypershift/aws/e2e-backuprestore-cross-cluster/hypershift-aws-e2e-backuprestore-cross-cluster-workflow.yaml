workflow:
  as: hypershift-aws-e2e-backuprestore-cross-cluster
  documentation: |-
    The cross-cluster AWS backup and restore workflow creates two separate
    HyperShift management clusters. It creates a HostedCluster on the source
    manager, configures OADP on both managers to use the same S3 bucket and
    prefix, then restores the backup onto the target manager.

    ExternalDNS is enabled on both management clusters with the same
    job-specific TXT owner ID. During the source-to-target handoff,
    test-backuprestore scales the source ExternalDNS Deployment to zero and
    waits for its Pods to stop before breaking the source HostedCluster. The
    Deployment remains in place at zero replicas while ExternalDNS on the
    target takes over Route 53 reconciliation and updates the public service
    records to the target Routes. The test verifies those DNS targets and does
    not create or delete DNS records.

    The post phase destroys the restored HostedCluster through the target
    manager, then always attempts a best-effort destroy through the source
    manager. The DNS and TXT records remain in Route 53 after HostedCluster
    teardown. It deletes the shared S3 bucket once. Destroying both nested
    management clusters then removes their manager-local OADP resources.
  steps:
    allow_best_effort_post_steps: true
    leases:
    - env: HYPERSHIFT_TARGET_QUOTA_SLICE
      resource_type: hypershift-aws-quota-slice
    pre:
    - ref: ipi-install-rbac
    - chain: hypershift-setup-nested-management-cluster-source
    - chain: hypershift-setup-nested-management-cluster-target
    - ref: hypershift-install-source
    - ref: hypershift-install-target
    - chain: hypershift-aws-create-source
    - ref: operatorhub-subscribe-oadp-operator-source
    - ref: operatorhub-subscribe-oadp-operator-target
    - ref: hypershift-aws-oadp-setup-source
    - ref: hypershift-aws-oadp-setup-target
    test:
    - chain: hypershift-e2e-backuprestore-cross-cluster
    post:
    - chain: hypershift-dump-source
    - chain: hypershift-dump-target
    - chain: hypershift-aws-destroy-target
    - chain: hypershift-aws-destroy-source
    - ref: hypershift-aws-oadp-destroy
    - chain: hypershift-destroy-nested-management-cluster-target
    - chain: hypershift-destroy-nested-management-cluster-source
    env:
      HYPERSHIFT_EXTERNAL_DNS_DOMAIN: "service.ci.hypershift.devcluster.openshift.com"
