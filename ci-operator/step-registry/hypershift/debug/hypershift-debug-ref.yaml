ref:
  as: hypershift-debug
  best_effort: true
  optional_on_success: true
  from: cli
  commands: hypershift-debug-commands.sh
  env:
  - name: KUBECONFIG
    default: ${SHARED_DIR}/kubeconfig
  - name: HYPERSHIFT_DEBUG_LINKS_ONLY
    default: "false"
    documentation: Collect debug links without writing a report when a later step will write one, e.g. hypershift-dump-extra.
  timeout: 15m0s
  grace_period: 60s
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  documentation: |-
    Writes out debug tool links for hypershift jobs.
