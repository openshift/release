ref:
  as: hypershift-hostedcluster-htpasswd
  cli: latest
  env:
  - name: HOSTED_MANAGEMENT_CLUSTER
    default: "hosted-mgmt"
    documentation: "The cluster used to execute hypershift and host control plane components"
  commands: hypershift-hostedcluster-htpasswd-commands.sh
  from_image:
    namespace: ci
    name: "hypershift-cli"
    tag: "latest"
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 60m0s
  credentials:
  - mount_path: /var/run/hypershift-workload-credentials
    bundle: hypershift-workload-credentials
    namespace: test-credentials
  - mount_path: /var/run/hypershift-workload-credentials-hosted-mgmt2
    bundle: hypershift-workload-credentials-hosted-mgmt2
    namespace: test-credentials
  dependencies:
  - name: "release:latest"
    env: RELEASE_IMAGE_LATEST
  - name: "stable:hypershift"
    env: HYPERSHIFT_RELEASE_LATEST
