ref:
  as: hypershift-hostedcluster-create-wait-for-olm
  cli: latest
  commands: hypershift-hostedcluster-create-wait-for-olm-commands.sh
  env:
  - name: WAIT_FOR_OLM
    default: "false"
    documentation: "Wait for OLM to be ready before proceeding with the test"
  - name: HOSTED_MANAGEMENT_CLUSTER
    default: "hosted-mgmt"
    documentation: "The cluster used to execute hypershift and host control plane components"
  from_image:
    namespace: ci
    name: "hypershift-cli"
    tag: "latest"
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 20m0s
  credentials:
    - mount_path: /var/run/hypershift-workload-credentials
      name: hypershift-workload-credentials
      namespace: test-credentials
    - mount_path: /var/run/hypershift-workload-credentials-hosted-mgmt2
      name: hypershift-workload-credentials-hosted-mgmt2
      namespace: test-credentials
