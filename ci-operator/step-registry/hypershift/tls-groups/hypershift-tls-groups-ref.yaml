ref:
  as: hypershift-tls-groups
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  commands: hypershift-tls-groups-commands.sh
  env:
  - name: TLS_GROUPS
    default: "SecP384r1MLKEM1024"
    documentation: |-
      Comma-separated TLS named groups to set on HostedCluster
      spec.configuration.apiServer.tlsSecurityProfile.custom.groups
      (e.g. SecP384r1MLKEM1024).
  - name: TLS_GROUPS_MIN_VERSION
    default: "VersionTLS13"
    documentation: |-
      Min TLS version for the Custom profile. Must be VersionTLS13. TLS 1.3
      cipher suites are not configurable, so custom.ciphers is omitted.
  - name: NODEPOOL_ROLLOUT_TIMEOUT
    default: 60m
    documentation: |-
      Timeout passed to oc wait while waiting for NodePool AllNodesHealthy after the
      config version annotation changes.
  - name: NODEPOOL_ROLLOUT_TIMEOUT_SECONDS
    default: "3600"
    documentation: |-
      Maximum time in seconds to wait for NodePool
      hypershift.openshift.io/nodePoolCurrentConfigVersion to change after the
      HostedCluster TLS configuration is updated.
  - name: GUEST_STABLE_CLUSTER_TIMEOUT
    default: 3h
    documentation: |-
      Timeout for oc adm wait-for-stable-cluster on the guest cluster after TLS changes.
  - name: MCP_ROLLOUT_TIMEOUT_SECONDS
    default: "3600"
    documentation: |-
      Maximum time in seconds to wait for guest MachineConfigPools to reach UPDATED=True.
  - name: TUNED_ROLLOUT_TIMEOUT
    default: 30m
    documentation: |-
      Timeout for the guest tuned DaemonSet to become Available on all nodes.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 4h0m0s
  documentation: |-
    Configures a Custom TLS Security Profile with named groups on a HyperShift
    hosted cluster (HostedCluster.spec.configuration.apiServer.tlsSecurityProfile).

    Mirrors standalone tls-groups-configure for HyperShift: patches the HostedCluster
    CR (source of truth), waits for hosted control plane and NodePool rollouts, then
    verifies the guest APIServer when HyperShift mirrors the profile.

    Requires TechPreviewNoUpgrade on the HyperShift operator
    (TECH_PREVIEW_NO_UPGRADE=true) and guest cluster (GUEST_FEATURE_SET) so
    TLSGroupPreferences / custom.groups is accepted. Intended for jobs that then
    run tls-scanner-hypershift-run with EXPECTED_GROUPS / EXPECTED_GROUPS_MODE=exact.
