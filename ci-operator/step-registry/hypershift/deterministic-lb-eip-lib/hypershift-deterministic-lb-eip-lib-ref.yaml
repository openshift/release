ref:
  as: hypershift-deterministic-lb-eip-lib
  from: cli
  commands: hypershift-deterministic-lb-eip-lib-commands.sh
  documentation: |-
    Writes the shared deterministic LB EIP ownership helpers to
    SHARED_DIR/deterministic-lb-eip-lib.sh. The reserve and release steps
    source that file so the ownership checks cannot drift apart.
  resources:
    requests:
      cpu: 10m
      memory: 20Mi
  timeout: 5m0s
  grace_period: 1m0s
