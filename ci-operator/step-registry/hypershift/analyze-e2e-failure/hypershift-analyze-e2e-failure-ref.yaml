ref:
  as: hypershift-analyze-e2e-failure
  from: claude-ai-helpers
  best_effort: true
  commands: hypershift-analyze-e2e-failure-commands.sh
  # The job's cluster-profile lease is held until the last post step finishes,
  # so this step's ceiling is lease time taken from the pool. The budget is
  # 2m of waiting for artifacts plus CLAUDE_TIMEOUT for the analysis itself,
  # which fits inside 20m with room for image pull and the git clone.
  timeout: 20m0s
  grace_period: 30s
  env:
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
    documentation: |-
      Enable Vertex AI for Claude Code.
  - name: CLOUD_ML_REGION
    default: "global"
    documentation: |-
      Google Cloud region for Vertex AI.
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "openshift-ci-prow-agents"
    documentation: |-
      Google Cloud project ID for Vertex AI authentication.
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/google-token"
    documentation: |-
      Path to the Google Cloud service account JSON key file for Vertex AI authentication.
  - name: CLAUDE_MODEL
    default: "claude-opus-4-6"
    documentation: |-
      Claude model to use for test failure analysis.
  - name: CLAUDE_TIMEOUT
    default: "15m"
    documentation: |-
      Wall-clock ceiling for the analysis run, as a `timeout` duration.
      Bounded because the job's cluster-profile lease is held until this
      post step finishes. A run cut off here still exits 0: the step is
      best_effort and only the analysis report is lost.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  credentials:
  - collection: hypershift-team
    group: claude-prow
    mount_path: /var/run/claude-code-service-account
  documentation: |-
    Post-step that uses Claude to analyze e2e test failures.
    Only runs when test failures are detected (checks for JUnit XML failures
    or build-log error patterns). On success (no test failures), exits early
    with no cost. Produces an HTML analysis report in ARTIFACT_DIR.
