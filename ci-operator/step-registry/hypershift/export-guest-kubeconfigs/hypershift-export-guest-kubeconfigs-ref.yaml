ref:
  as: hypershift-export-guest-kubeconfigs
  cli: latest
  commands: hypershift-export-guest-kubeconfigs-commands.sh
  from: hypershift-tests
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 10m0s
  documentation: |-
    Export one kubeconfig per HostedCluster created by the HyperShift v2
    create-guests step into ${SHARED_DIR}/<cluster-name>_kubeconfig.
