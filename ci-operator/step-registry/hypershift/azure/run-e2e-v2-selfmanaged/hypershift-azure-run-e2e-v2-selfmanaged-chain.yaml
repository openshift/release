chain:
  as: hypershift-azure-run-e2e-v2-selfmanaged
  steps:
  - as: tests
    cli: latest
    credentials:
    - mount_path: /etc/hypershift-ci-jobs-self-managed-azure
      group: ops/hypershift-ci-jobs-self-managed-azure
      collection: hypershift-team
    env:
    - name: AZURE_CREDS
      default: /etc/hypershift-ci-jobs-self-managed-azure/credentials.json
      documentation: "Azure identity used to collect worker boot diagnostics. Requires VM read and retrieveBootDiagnosticsData/action on worker resource groups."
    - name: HYPERSHIFT_PLATFORM
      default: ""
      documentation: "The cloud platform for the self-managed clusters (e.g. azure). Set in the workflow env block."
    commands: |-
      set -xuo pipefail
      export KUBECONFIG="${SHARED_DIR}/management_cluster_kubeconfig"
      /hypershift/bin/run-tests
    timeout: 150m
    grace_period: 5m
    from: hypershift-tests
    dependencies:
    - name: "release:latest"
      env: RELEASE_IMAGE_LATEST
    resources:
      requests:
        cpu: "1"
        memory: 200Mi
