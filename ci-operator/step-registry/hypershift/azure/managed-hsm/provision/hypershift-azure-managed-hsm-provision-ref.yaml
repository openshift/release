ref:
  as: hypershift-azure-managed-hsm-provision
  cli: latest
  commands: hypershift-azure-managed-hsm-provision-commands.sh
  credentials:
  - mount_path: /etc/hypershift-ci-jobs-self-managed-azure-e2e
    name: hypershift-ci-jobs-self-managed-azure-e2e
    namespace: test-credentials
  env:
  - default: "false"
    documentation: Whether to provision an ephemeral Managed HSM for Azure KMS testing.
    name: HYPERSHIFT_AZURE_MANAGED_HSM
  - default: eastus
    documentation: Azure location in which to provision the Managed HSM.
    name: HYPERSHIFT_AZURE_MANAGED_HSM_LOCATION
  from: hypershift-tests
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 45m0s
  documentation: |-
    Provisions and activates an ephemeral Azure Managed HSM, creates an RSA-HSM
    key using the cluster profile credentials, grants the self-managed HyperShift
    KMS workload identity access to it, and writes the key ID to SHARED_DIR.
