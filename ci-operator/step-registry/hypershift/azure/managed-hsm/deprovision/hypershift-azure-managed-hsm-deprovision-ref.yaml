ref:
  as: hypershift-azure-managed-hsm-deprovision
  best_effort: true
  cli: latest
  commands: hypershift-azure-managed-hsm-deprovision-commands.sh
  env:
  - default: "false"
    documentation: Whether an ephemeral Managed HSM was provisioned for the test.
    name: HYPERSHIFT_AZURE_MANAGED_HSM
  - default: eastus
    documentation: Azure location containing the Managed HSM to purge.
    name: HYPERSHIFT_AZURE_MANAGED_HSM_LOCATION
  from: hypershift-tests
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 15m0s
  documentation: |-
    Deletes and purges the ephemeral Managed HSM created for the HyperShift Azure
    KMS test using the cluster profile credentials, then removes its resource group.
