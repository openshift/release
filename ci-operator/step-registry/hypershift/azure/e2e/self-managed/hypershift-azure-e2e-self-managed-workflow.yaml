workflow:
  as: hypershift-azure-e2e-self-managed
  documentation: |-
    The HyperShift Azure e2e self-managed workflow executes tests against a new ephemeral
    HyperShift cluster running on self-managed Azure infrastructure. This workflow provisions
    an Azure management cluster using HyperShift on a shared management plane, installs the
    HyperShift operator, and runs e2e tests.

    Administrative access to the control plane is provided via the `KUBECONFIG` environment variable.

    The HyperShift launch capability is currently supported by the HyperShift
    team. For now, please direct all questions and comments to:

    - Alberto Lamela (agarcial@redhat.com)
    - Seth Jennings (sjenning@redhat.com)
    - Cesar Wong (cewong@redhat.com)
    - Bryan Cox (brcox@redhat.com)

    Learn more about HyperShift here: https://github.com/openshift/hypershift

    Track HyperShift's development here: https://issues.redhat.com/projects/CNTRLPLANE/summary
  steps:
    post:
    - ref: hypershift-dump-management-cluster-azure-v2
    - ref: hypershift-dump-extra
    - ref: hypershift-destroy-nested-management-cluster-azure-v2
    test:
    - ref: hypershift-azure-run-e2e-self-managed
    pre:
    - ref: ipi-install-rbac
    - ref: hypershift-setup-nested-management-cluster-azure-v2
    - ref: hypershift-azure-setup-private-link-v2
    - ref: hypershift-install-azure-v2-aks-dns
    - ref: hypershift-resolve-nodepool-releases
    env:
      CLOUD_PROVIDER: "Azure"
      HYPERSHIFT_NODE_COUNT: "2"
      HYPERSHIFT_AZURE_LOCATION: "uksouth"
      AZURE_SELF_MANAGED: "true"
      HYPERSHIFT_BASE_DOMAIN: "hcp-sm-azure.azure.devcluster.openshift.com"
      # release-4.22 e2e hardcodes this zone for the Azure custom KAS certificate test,
      # so the install step uses the AKS e2e zone's DNS credentials.
      HYPERSHIFT_EXTERNAL_DNS_DOMAIN: "aks-e2e.hypershift.azure.devcluster.openshift.com"
      HYPERSHIFT_ETCD_STORAGE_CLASS: "managed-csi-premium-v2"