workflow:
  as: hypershift-azure-aks-conformance-etcd-disk-encryption
  documentation: |-
    The HyperShift Azure AKS ETCD/disk encryption conformance workflow creates an
    ephemeral AKS management cluster and a public HostedCluster that uses ETCD
    encryption backed by an Azure Key Vault key, OS disk encryption with a
    customer-managed key (Disk Encryption Set) and encryption at host.

    azure-provision-vault-key creates the Key Vault key used as the KMS provider
    for ETCD, and azure-provision-disk-encryption-set creates the Disk Encryption
    Set used for the NodePool OS disks. Both are created in the resource group
    provisioned for the run and are torn down with it.

    The encryption itself is verified by the health check steps, which assert the
    KMS configuration on the HostedCluster, that secrets round-trip through the
    KMS provider, that they are stored encrypted in ETCD, and that the NodePool
    VMs use the expected DES and host encryption settings. Conformance then runs
    the upstream openshift/origin suite against the guest cluster to confirm the
    encrypted cluster is fully functional.

    Learn more about HyperShift here: https://github.com/openshift/hypershift

    Track HyperShift's development here: https://issues.redhat.com/projects/CNTRLPLANE/summary
  steps:
    pre:
    - chain: cucushift-installer-rehearse-azure-aks-provision
    - ref: hypershift-azure-aks-attach-kv
    - ref: azure-provision-vnet-hypershift
    - ref: azure-provision-resourcegroup
    - ref: azure-provision-role-assignment-hypershift
    - ref: azure-provision-vault-key
    - ref: azure-provision-disk-encryption-set
    - ref: hypershift-install
    - ref: cucushift-hypershift-extended-k8s-mgmt-get-guest-annotations
    - chain: hypershift-azure-create
    - ref: cucushift-hypershift-extended-etcd-encryption-health-check-azure
    - ref: cucushift-hypershift-extended-vm-encryption-azure-server-side-encryption-customer-managed-keys-health-check
    - ref: cucushift-hypershift-extended-vm-encryption-azure-encryption-at-host-health-check
    test:
    - chain: hypershift-conformance
    post:
    - chain: hypershift-dump
    - chain: hypershift-azure-destroy
    - chain: cucushift-installer-rehearse-azure-aks-deprovision
    env:
      USE_HYPERSHIFT_AZURE_CREDS: "true"
      HYPERSHIFT_AZURE_LOCATION: "centralus"
      CLOUD_PROVIDER: "Azure"
      AKS: "true"
      HYPERSHIFT_NODE_COUNT: "3"
      AKS_NODE_COUNT: "9"
      HYPERSHIFT_BASE_DOMAIN: "hypershift.azure.devcluster.openshift.com"
      HYPERSHIFT_EXTERNAL_DNS_DOMAIN: "service.hypershift.azure.devcluster.openshift.com"
      HYPERSHIFT_MANAGED_SERVICE: "ARO-HCP"
      AKS_CLUSTER_AUTOSCALER_MIN_NODES: "3"
      AKS_CLUSTER_AUTOSCALER_MAX_NODES: "6"
      AKS_NODE_VM_SIZE: "Standard_D16_v5"
      AKS_ZONES: "1 2 3"
      ENABLE_CLUSTER_AUTOSCALER: "true"
      AUTH_THROUGH_CERTS: "true"
      AKS_USE_HYPERSHIFT_MI: "true"
      HYPERSHIFT_CUSTOM_NSG: "true"
      HYPERSHIFT_CUSTOM_RESOURCE_GROUP: "true"
      HYPERSHIFT_CUSTOM_SUBNET: "true"
      HYPERSHIFT_CUSTOM_VNET: "true"
      AKS_ADDONS: "azure-keyvault-secrets-provider"
      HYPERSHIFT_AZURE_CP_MI: "true"
      # Encryption under test: KMS-backed ETCD, customer-managed key OS disk
      # encryption via the Disk Encryption Set, and encryption at host.
      HYPERSHIFT_ETCD_ENCRYPTION: "true"
      HYPERSHIFT_DISK_ENCRYPTION: "true"
      HYPERSHIFT_ENCRYPTION_AT_HOST: "true"
      ENABLE_DES_DEFAULT_MACHINE: "true"
      TEST_SUITE: openshift/conformance/parallel/minimal
      # etcd leader changes: expected on the ephemeral AKS-hosted control plane.
      # azure-disk: the in-tree driver is not usable on the hosted cluster.
      TEST_SKIPS: >-
        etcd leader changes are not excessive\|
        In-tree Volumes \[Driver: azure-disk\]
