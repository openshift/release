workflow:
  as: hypershift-azure-aks-conformance-fips-encryption
  documentation: |-
    The HyperShift Azure AKS FIPS/encryption conformance workflow creates an ephemeral
    AKS management cluster and a FIPS-enabled HostedCluster that uses ETCD encryption
    backed by an Azure Key Vault key, OS disk encryption with a customer-managed key
    (Disk Encryption Set) and encryption at host.

    This is the FIPS variant of hypershift-azure-aks-conformance. It differs from that
    workflow in the encryption/FIPS configuration, the boot image and the test skips:

    - Encryption provisioning: azure-provision-vault-key creates the Key Vault key used
      as the KMS provider for ETCD, and azure-provision-disk-encryption-set creates the
      Disk Encryption Set used for the NodePool OS disks. Both are created in the
      resource group provisioned for the run and are torn down with it.
    - FIPS/encryption env: HYPERSHIFT_AZURE_FIPS, HYPERSHIFT_ETCD_ENCRYPTION,
      HYPERSHIFT_DISK_ENCRYPTION, HYPERSHIFT_ENCRYPTION_AT_HOST and
      ENABLE_DES_DEFAULT_MACHINE are all enabled here and unset in the base workflow.
    - Boot image: the base workflow pins the aro4 Azure Marketplace image
      (sku aro_419, version 419.6.20250523). This workflow deliberately does not carry
      that pin, so HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_* fall back to the empty defaults
      in hypershift-azure-create and the payload's own boot image is used. The 4.19 pin
      causes OSProvisioningTimedOut against a 5.x payload.
    - Test skips: TEST_SKIPS additionally skips the azure-file in-tree driver and
      FIPS TestFIPS, and TEST_SUITE is narrowed to the minimal parallel suite.

    The FIPS and encryption configuration is verified before conformance runs:
    hypershift-hostedcluster-fips-check asserts the HostedCluster is in FIPS mode, and
    the encryption health checks assert the KMS configuration on the HostedCluster, that
    secrets round-trip through the KMS provider, that they are stored encrypted in ETCD,
    and that the NodePool VMs use the expected DES and host encryption settings.
    Conformance then runs the upstream openshift/origin suite against the guest cluster
    to confirm the encrypted cluster is fully functional.

    Learn more about HyperShift here: https://github.com/openshift/hypershift

    Track HyperShift's development here: https://issues.redhat.com/projects/CNTRLPLANE/summary
  steps:
    pre:
    - chain: cucushift-installer-rehearse-azure-aks-provision
    - ref: hypershift-azure-aks-attach-kv
    - ref: azure-provision-vnet-hypershift
    - ref: azure-provision-resourcegroup
    - ref: azure-provision-role-assignment-hypershift
    - ref: azure-provision-vault-key
    - ref: azure-provision-disk-encryption-set
    - ref: hypershift-install
    - ref: cucushift-hypershift-extended-k8s-mgmt-get-guest-annotations
    - chain: hypershift-azure-create
    test:
    - ref: hypershift-hostedcluster-fips-check
    - ref: cucushift-hypershift-extended-etcd-encryption-health-check-azure
    - ref: cucushift-hypershift-extended-vm-encryption-azure-server-side-encryption-customer-managed-keys-health-check
    - ref: cucushift-hypershift-extended-vm-encryption-azure-encryption-at-host-health-check
    - chain: hypershift-conformance
    post:
    - chain: hypershift-dump
    - chain: hypershift-azure-destroy
    - chain: cucushift-installer-rehearse-azure-aks-deprovision
    env:
      # Keep in sync with hypershift-azure-aks-conformance, except for the
      # encryption/FIPS, boot image and TEST_SKIPS/TEST_SUITE differences listed in
      # the documentation above. Workflows cannot inherit, so the shared values below
      # are duplicated from that workflow and must be updated in both places.
      USE_HYPERSHIFT_AZURE_CREDS: "true"
      HYPERSHIFT_AZURE_LOCATION: "centralus"
      CLOUD_PROVIDER: "Azure"
      AKS: "true"
      HYPERSHIFT_NODE_COUNT: "3"
      AKS_NODE_COUNT: "9"
      HYPERSHIFT_BASE_DOMAIN: "hypershift.azure.devcluster.openshift.com"
      HYPERSHIFT_EXTERNAL_DNS_DOMAIN: "service.hypershift.azure.devcluster.openshift.com"
      HYPERSHIFT_MANAGED_SERVICE: "ARO-HCP"
      AKS_CLUSTER_AUTOSCALER_MIN_NODES: "3"
      AKS_CLUSTER_AUTOSCALER_MAX_NODES: "6"
      AKS_NODE_VM_SIZE: "Standard_D16_v5"
      AKS_ZONES: "1 2 3"
      ENABLE_CLUSTER_AUTOSCALER: "true"
      AUTH_THROUGH_CERTS: "true"
      AKS_USE_HYPERSHIFT_MI: "true"
      HYPERSHIFT_CUSTOM_NSG: "true"
      HYPERSHIFT_CUSTOM_RESOURCE_GROUP: "true"
      HYPERSHIFT_CUSTOM_SUBNET: "true"
      HYPERSHIFT_CUSTOM_VNET: "true"
      AKS_ADDONS: "azure-keyvault-secrets-provider"
      HYPERSHIFT_AZURE_CP_MI: "true"
      HYPERSHIFT_AZURE_FIPS: "true"
      # Encryption under test: KMS-backed ETCD, customer-managed key OS disk
      # encryption via the Disk Encryption Set, and encryption at host.
      HYPERSHIFT_ETCD_ENCRYPTION: "true"
      HYPERSHIFT_DISK_ENCRYPTION: "true"
      HYPERSHIFT_ENCRYPTION_AT_HOST: "true"
      ENABLE_DES_DEFAULT_MACHINE: "true"
      TEST_SUITE: openshift/conformance/parallel/minimal
      # etcd leader changes: expected on the ephemeral AKS-hosted control plane.
      # azure-disk/azure-file: the in-tree drivers are not usable on the hosted cluster.
      # FIPS TestFIPS: remove when https://github.com/openshift/origin/pull/31288 is
      # merged and propagated to older branches.
      TEST_SKIPS: >-
        etcd leader changes are not excessive\|
        In-tree Volumes \[Driver: azure-disk\]\|
        In-tree Volumes \[Driver: azure-file\]\|
        FIPS TestFIPS
