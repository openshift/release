workflow:
  as: hypershift-azure-aks-e2e-capi-migration
  documentation: |-
    Tests CAPI storage version migration from v1beta1 to v1beta2 on an
    AKS-based HyperShift management cluster, then runs the full HyperShift
    e2e suite to verify everything works post-migration.

    The workflow installs HyperShift from an older release (via
    INSTALL_FROM_LATEST), runs the migration e2e test which upgrades the
    operator and triggers automatic storage migration, then runs the full
    e2e suite against the migrated cluster.
  steps:
    pre:
    - chain: cucushift-installer-rehearse-azure-aks-provision
    - ref: hypershift-azure-aks-attach-kv
    - ref: hypershift-install
    - ref: cucushift-hypershift-extended-k8s-mgmt-get-guest-annotations
    - ref: hypershift-resolve-nodepool-releases
    test:
    - ref: hypershift-azure-run-e2e-capi-migration
    - ref: hypershift-azure-run-e2e
    post:
    - chain: cucushift-installer-rehearse-azure-aks-deprovision
    env:
      AKS_NODE_COUNT: "6"
      CLOUD_PROVIDER: "Azure"
      AKS: "true"
      USE_HYPERSHIFT_AZURE_CREDS: "true"
      HYPERSHIFT_EXTERNAL_DNS_DOMAIN: "aks-e2e.hypershift.azure.devcluster.openshift.com"
      AKS_CLUSTER_AUTOSCALER_MIN_NODES: "1"
      AKS_CLUSTER_AUTOSCALER_MAX_NODES: "2"
      AKS_ZONES: "1 2 3"
      ENABLE_CLUSTER_AUTOSCALER: "true"
      ENABLE_NAP: "true"
      NAP_SKU_FAMILY: "D"
      NAP_SKU_CPU: "16"
      AKS_ADDONS: "azure-keyvault-secrets-provider"
      ENABLE_AKS_CERT_ROTATION: "true"
      AKS_CERT_ROTATION_POLL_INTERVAL: "1m"
      AKS_USE_HYPERSHIFT_MI: "true"
      ENABLE_SIZE_TAGGING: "true"
      HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_OFFER: "aro4"
      HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_PUBLISHER: "azureopenshift"
      HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_VERSION: "419.6.20250523"
      HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_SKU: "aro_419"
