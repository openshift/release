ref:
  as: hypershift-setup-nested-management-cluster-target
  cli: latest
  env:
  - name: HYPERSHIFT_NODE_COUNT
    default: '1'
    documentation: The number nodes for the cluster. This number will get mulitplied by three, as there are three AZs
  - name: HYPERSHIFT_INSTANCE_TYPE
    default: m6i.4xlarge
    documentation: Instance type for the cluster nodes
  - name: HYPERSHIFT_NAMESPACE
    default: clusters
    documentation: The Namespace where to create the HostedCluster and NodePools
  - name: HYPERSHIFT_CLUSTER_ROLE
    default: target
    documentation: Optional role suffix used to create distinct management clusters and save role-specific kubeconfigs.
  - name: HYPERSHIFT_ZONES
    default: us-east-1a,us-east-1b,us-east-1c
    documentation: The zones where to create NodePools
  - name: HYPERSHIFT_GUEST_INFRA_OCP_ACCOUNT
    default: 'false'
    documentation: Whether to use the generic CI account or the HyperShift OSD account for the guest clusters infra. For the
      infra created for the clusters. E.g. For cluster-bot we use the generic CI account
  - name: HYPERSHIFT_BASE_DOMAIN
    default: ''
    documentation: The cluster's FQDN will be a subdomain of the base domain.
  - name: HYPERSHIFT_HC_RELEASE_IMAGE
    default: ''
    documentation: Release image used for the HostedCluster. Latest stable release image is used by default
  - name: CLOUD_PROVIDER
    default: AWS
    documentation: The cloud provider to use for the management cluster
  - name: HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_PUBLISHER
    default: azureopenshift
    documentation: The Azure Marketplace image publisher for Azure management clusters
  - name: HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_OFFER
    default: aro4
    documentation: The Azure Marketplace image offer for Azure management clusters
  - name: HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_SKU
    default: aro_419
    documentation: The Azure Marketplace image SKU for Azure management clusters
  - name: HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_VERSION
    default: 419.6.20250523
    documentation: The Azure Marketplace image version for Azure management clusters
  credentials:
  - mount_path: /etc/hypershift-ci-jobs-awscreds
    group: ops/hypershift-ci-jobs-awscreds
    collection: hypershift-team
  - mount_path: /etc/ci-pull-credentials
    bundle: ci-pull-credentials
    namespace: test-credentials
  - mount_path: /etc/hypershift-kubeconfig
    group: ops/clusters/hypershift-ci-2
    collection: hypershift-team
  - mount_path: /etc/hypershift-kubeconfig-azure
    group: ops/clusters/azure-hypershift-ci
    collection: hypershift-team
  - mount_path: /etc/hypershift-ci-jobs-self-managed-azure
    group: ops/hypershift-ci-jobs-self-managed-azure
    collection: hypershift-team
  - mount_path: /etc/hypershift-ci-jobs-self-managed-azure-e2e
    group: ops/hypershift-ci-jobs-self-managed-azure-e2e
    collection: hypershift-team
  - mount_path: /etc/hypershift-ci-jobs-self-managed-azure-e2e-mc
    group: ops/hypershift-ci-jobs-self-managed-azure-e2e-mc
    collection: hypershift-team
  - mount_path: /etc/hypershift-ci-jobs-azurecreds
    group: ops/hypershift-ci-jobs-azurecreds
    collection: hypershift-team
  from_image:
    namespace: hypershift
    name: hypershift-operator
    tag: latest
  grace_period: 1m0s
  resources:
    requests:
      cpu: 100m
  timeout: 45m0s
  commands: hypershift-setup-nested-management-cluster-target-commands.sh
