ref:
  as: hypershift-dump
  cli: latest
  from: hypershift-operator
  resources:
    requests:
      cpu: 100m
  env:
  - name: HYPERSHIFT_CLUSTER_ROLE
    default: ''
    documentation: Optional management cluster role used to select a role-specific kubeconfig.
  - name: KUBECONFIG
    default: ${SHARED_DIR}/kubeconfig
  - name: HYPERSHIFT_MANAGED_SERVICE
    default: ''
    documentation: The type of managed service the HyperShift Operator is installed on.
  timeout: 15m0s
  commands: hypershift-dump-commands.sh
