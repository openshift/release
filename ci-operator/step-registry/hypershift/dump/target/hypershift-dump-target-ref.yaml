ref:
  as: hypershift-dump-target
  cli: latest
  from: hypershift-operator
  resources:
    requests:
      cpu: 100m
  env:
  - name: HYPERSHIFT_CLUSTER_ROLE
    default: target
    documentation: Management cluster role used to select the target kubeconfig.
  - name: HYPERSHIFT_MANAGED_SERVICE
    default: ''
    documentation: The type of managed service the HyperShift Operator is installed on.
  timeout: 15m0s
  commands: hypershift-dump-target-commands.sh
