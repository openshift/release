ref:
  as: hypershift-agentic-qe-verify-features
  from: cli
  commands: hypershift-agentic-qe-verify-features-commands.sh
  timeout: 10m0s
  env:
  - name: GUEST_FEATURE_SET
    default: ""
    documentation: Expected guest feature set; empty uses CI defaults and skips this check.
  - name: GUEST_FEATURE_GATES
    default: ""
    documentation: Expected comma-separated Name=true,Other=false custom guest overrides.
  - name: MULTISTAGE_PARAM_OVERRIDE_GUEST_FEATURE_SET
    default: ""
    documentation: Gangway transport override for GUEST_FEATURE_SET.
  - name: MULTISTAGE_PARAM_OVERRIDE_GUEST_FEATURE_GATES
    default: ""
    documentation: Gangway transport override for GUEST_FEATURE_GATES.
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Verify requested guest feature configuration before holding the environment.
    Check the guest FeatureGate spec and enabled/disabled status for its completed
    ClusterVersion, retaining evidence in artifacts. This is read-only; a mismatch
    fails provisioning instead of changing a running cluster's feature settings.
