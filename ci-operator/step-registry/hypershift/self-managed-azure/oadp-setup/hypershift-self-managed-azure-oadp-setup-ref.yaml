ref:
  as: hypershift-self-managed-azure-oadp-setup
  from: upi-installer
  cli: latest
  commands: hypershift-self-managed-azure-oadp-setup-commands.sh
  resources:
    requests:
      cpu: 300m
      memory: 300Mi
  credentials:
  - mount_path: /etc/hypershift-ci-jobs-self-managed-azure
    name: hypershift-ci-jobs-self-managed-azure
    namespace: test-credentials
  env:
  - name: OADP_HYPERSHIFT_PLUGIN_IMAGE
    documentation: |-
      The image to use for the hypershift OADP plugin in the DataProtectionApplication.
    default: quay.io/konveyor/hypershift-oadp-plugin:latest
  documentation: |-
    Sets up self-managed-Azure-specific OADP prerequisites for HyperShift backup/restore
    tests: discovers the public self-managed-Azure guest cluster, creates an Azure Storage
    Account and Blob container in the management cluster's resource group, a
    DataProtectionApplication, BackupStorageLocation, and VolumeSnapshotLocation.

    Also provisions a single dedicated Azure User-Assigned Managed Identity used for all
    runtime Azure Blob access, federated to both ServiceAccounts that need it:
    system:serviceaccount:openshift-adp:velero (used by Velero's Deployment and its
    NodeAgent DaemonSet) and system:serviceaccount:hypershift:etcd-backup-job (used by the
    HyperShift Operator's HCPEtcdBackup controller, which derives its own credential by
    copying the BackupStorageLocation's credential Secret). The identity is granted
    Storage Blob Data Contributor on the backup storage account, and the
    cloud-credentials Secret referenced by the BackupStorageLocation/VolumeSnapshotLocation
    contains only its client ID (no client secret), so both Velero and etcd-backup
    authenticate via Azure Workload Identity instead of the shared root Service Principal.
    The root Service Principal is still used, unchanged, purely for this step's own `az`
    CLI calls to provision these Azure resources.
