chain:
  as: hypershift-e2e-backuprestore
  steps:
  - as: tests
    cli: latest
    commands: |-
      export PATH="/hypershift/bin:${PATH}"
      export E2E_HOSTED_CLUSTER_NAME=$(cat ${SHARED_DIR}/cluster-name)
      export E2E_HOSTED_CLUSTER_NAMESPACE=${E2E_HOSTED_CLUSTER_NAMESPACE:-clusters}
      export AWS_GUEST_INFRA_CREDENTIALS_FILE=/etc/hypershift-ci-jobs-awscreds/credentials
      export E2E_HYPERSHIFT_OADP_PLUGIN_IMAGE=${OADP_HYPERSHIFT_PLUGIN_IMAGE}
      test-backuprestore --ginkgo.v --e2e.junit-report=${ARTIFACT_DIR}/junit_backuprestore_report.xml --ginkgo.label-filter="${BACKUP_RESTORE_LABEL_FILTER}" --ginkgo.fail-on-empty=true --ginkgo.fail-fast=true --ginkgo.timeout=2h --ginkgo.no-color=true
    timeout: 2h30m
    grace_period: 5m
    from: hypershift-tests
    env:
    - name: E2E_HOSTED_CLUSTER_NAMESPACE
      default: clusters
      documentation: "The namespace where the hosted cluster is created."
    - name: OADP_HYPERSHIFT_PLUGIN_IMAGE
      default: ""
      documentation: "Expected plugin image; populated by plugin pipeline dependency overrides."
    - name: BACKUP_RESTORE_LABEL_FILTER
      default: backup-restore
      documentation: "Ginkgo label filter for backup/restore suites."
    resources:
      requests:
        cpu: "1"
        memory: 200Mi
    credentials:
    - mount_path: /etc/hypershift-ci-jobs-awscreds
      group: ops/hypershift-ci-jobs-awscreds
      collection: hypershift-team
  - chain: hypershift-conformance
