ref:
  as: hypershift-resolve-pr-releases
  from: hypershift-tests
  cli: latest
  commands: hypershift-resolve-pr-releases-commands.sh
  credentials:
  - mount_path: /etc/ci-pull-credentials
    bundle: ci-pull-credentials
    namespace: test-credentials
  env:
  - name: HYPERSHIFT_PLATFORM
    default: aws
    documentation: Platform whose PR release matrix is selected; currently only aws.
  - name: AWS_MULTI_ARCH
    default: "false"
    documentation: Must remain false; PR matrix payloads are linux/amd64 only.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 15m
  grace_period: 1m
  documentation: |-
    Fetches the public PR body at execution time and selects the first checked
    release-X.Y in its Release Test Matrix / AWS subsection. Resolves Accepted
    CI and same-minor GA stable amd64 payloads, pins their digests and atomically
    writes nodepool_release_images for guest creation and tests. No fallback.
