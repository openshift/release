ref:
  as: hypershift-reserve-deterministic-lb-eip
  from: cli
  commands: hypershift-reserve-deterministic-lb-eip-commands.sh
  credentials:
  - mount_path: /etc/hypershift-ci-jobs-awscreds
    group: ops/hypershift-ci-jobs-awscreds
    collection: hypershift-team
  env:
  - name: EIP_TAG_NAME
    default: "CNTRLPLANE-4579-e2e"
    documentation: "Name tag identifying the EIP reserved for the deterministic LB E2E."
  - name: MGMT_REGION
    default: ""
    documentation: "Management cluster AWS region. Discovered from the management cluster when empty."
  - name: MGMT_PUBLIC_SUBNET
    default: ""
    documentation: "Management cluster public subnet used by the KAS NLB. Discovered from the management VPC when empty."
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 20m0s
  grace_period: 5m0s
