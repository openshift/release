ref:
  as: hypershift-oadp-rustfs-destroy
  from: dev-scripts
  commands: hypershift-oadp-rustfs-destroy-commands.sh
  best_effort: true
  timeout: 10m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
