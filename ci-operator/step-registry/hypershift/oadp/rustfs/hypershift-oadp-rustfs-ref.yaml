ref:
  as: hypershift-oadp-rustfs
  from: dev-scripts
  commands: hypershift-oadp-rustfs-commands.sh
  timeout: 10m
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Starts RustFS with TLS on the active bare metal host and creates the
    oadp-backup S3 bucket. Shares the endpoint and job-scoped credentials with
    the OADP setup steps.
