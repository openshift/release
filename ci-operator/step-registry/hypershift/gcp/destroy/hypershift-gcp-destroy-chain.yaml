chain:
  as: hypershift-gcp-destroy
  steps:
  - as: destroy
    cli: latest
    commands: |-
      set -exuo pipefail

      DESTROY_RESULT="${SHARED_DIR}/hypershift-gcp-destroy-result"
      if [[ ! -f "${SHARED_DIR}/cluster-name" ]]; then
          echo "WARNING: cluster-name not found — create step may not have completed. Skipping destroy."
          echo skipped > "${DESTROY_RESULT}"
          exit 0
      fi

      CLUSTER_NAME="$(<"${SHARED_DIR}/cluster-name")"

      # Fail fast if the management cluster API is not reachable (e.g. token
      # expired, network issue). Without this check, `hypershift destroy`
      # would spin for the entire --cluster-grace-period (40m) retrying errors.
      # Use --request-timeout to avoid hanging indefinitely on an unreachable server.
      if ! oc get hostedcluster "${CLUSTER_NAME}" -n clusters --request-timeout=10s &>/dev/null; then
          echo "WARNING: Cannot access API server (HostedCluster/${CLUSTER_NAME} in clusters). Skipping destroy."
          echo "The deprovision step will clean up via GCP project deletion."
          echo unavailable > "${DESTROY_RESULT}"
          exit 0
      fi

      # Reuse the existing WIF configuration for the CLI's GCP API calls.
      export GOOGLE_APPLICATION_CREDENTIALS="${SHARED_DIR}/wif-cred.json"

      echo "$(date) Deleting GCP HyperShift cluster ${CLUSTER_NAME}"
      if bin/hypershift destroy cluster gcp \
        --name "${CLUSTER_NAME}" \
        --namespace clusters \
        --cluster-grace-period 40m; then
          echo 0 > "${DESTROY_RESULT}"
      else
          DESTROY_EXIT_CODE=$?
          echo "${DESTROY_EXIT_CODE}" > "${DESTROY_RESULT}"
          exit "${DESTROY_EXIT_CODE}"
      fi
      echo "$(date) Finished deleting cluster"
    from: hypershift-operator
    grace_period: 5m0s
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
    timeout: 45m0s
    best_effort: true
  documentation: |-
    Destroys a GCP HostedCluster by deleting the HostedCluster CR and
    waiting for finalizers to complete.

    When the installed HyperShift CLI supports GCP network resource references,
    cluster creation records router, NAT, and firewall-rule names in the
    HostedCluster's gcp-infra-resources annotation; other references stay in the
    spec. After finalizers complete, the CLI deletes referenced IAM and network
    resources using the existing WIF credential configuration. The later
    hypershift-gcp-gke-deprovision step still deletes the temporary GKE cluster
    and GCP projects.

    Reads cluster-name from SHARED_DIR (saved by hypershift-gcp-create).
    Writes hypershift-gcp-destroy-result so the verification step can detect
    destroy failures hidden by this best-effort cleanup step.
