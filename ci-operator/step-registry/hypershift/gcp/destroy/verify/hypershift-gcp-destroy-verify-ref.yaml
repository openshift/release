ref:
  as: hypershift-gcp-destroy-verify
  from_image:
    namespace: ocp
    name: "4.22"
    tag: upi-installer
  commands: hypershift-gcp-destroy-verify-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 5m0s
  documentation: |-
    Verifies that the GCP HostedCluster destroy command removed the HostedCluster,
    network resources, WIF pool, and service accounts when the installed
    HyperShift CLI exercised the GCP network resource-reference flow.

    Runs before project deprovisioning so project deletion cannot hide resources
    left behind by the CLI's IAM and networking cleanup.
