chain:
  as: hypershift-gcp-run-e2e-v2
  steps:
  - as: tests
    cli: latest
    env:
    - name: HYPERSHIFT_PLATFORM
      default: ""
      documentation: "The cloud platform for the clusters (e.g. gcp). Set in the workflow env block."
    commands: |-
      set -xuo pipefail
      export KUBECONFIG="${SHARED_DIR}/kubeconfig"
      export PULL_SECRET_FILE="/etc/ci-pull-credentials/.dockerconfigjson"
      if [[ -f "${SHARED_DIR}/test-plan.yaml" ]]; then
          export TEST_PLAN="${SHARED_DIR}/test-plan.yaml"
      fi
      /hypershift/bin/run-tests
    timeout: 150m
    grace_period: 5m
    from: hypershift-tests
    dependencies:
    - name: "release:latest"
      env: RELEASE_IMAGE_LATEST
    resources:
      requests:
        cpu: "1"
        memory: 200Mi
    credentials:
    - mount_path: /etc/ci-pull-credentials
      bundle: ci-pull-credentials
      namespace: test-credentials
