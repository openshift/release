chain:
  as: hypershift-gcp-destroy-guests
  steps:
  - as: destroy-guests
    best_effort: true
    cli: latest
    env:
    - name: HYPERSHIFT_PLATFORM
      default: ""
      documentation: "The cloud platform for the clusters (e.g. gcp). Set in the workflow env block."
    commands: |-
      set -xuo pipefail
      export KUBECONFIG="${SHARED_DIR}/kubeconfig"
      export HYPERSHIFT_BINARY="${HYPERSHIFT_BINARY:-/hypershift/bin/hypershift}"
      /hypershift/bin/destroy-guests
    from: hypershift-tests
    grace_period: 5m0s
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
    timeout: 2h0m0s
