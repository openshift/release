ref:
  as: hypershift-gcp-gke-provision
  from_image:
    namespace: ocp
    name: "4.22"
    tag: upi-installer
  commands: hypershift-gcp-gke-provision-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 45m0s
  grace_period: 10m0s
  env:
  - name: GKE_REGION
    default: "northamerica-northeast2"
    documentation: GCP region for the GKE cluster.
  - name: GKE_RELEASE_CHANNEL
    default: "stable"
    documentation: |-
      GKE release channel. Allowed values: rapid, regular, stable.
  - name: PSC_SUBNET_COUNT
    default: "10"
    documentation: |-
      Number of PRIVATE_SERVICE_CONNECT subnets to create in the management VPC.
      Must be at least the number of hosted clusters the job creates, because each
      ServiceAttachment requires a dedicated PRIVATE_SERVICE_CONNECT subnet.
  - name: HYPERSHIFT_GCP_CI_PROJECT
    default: ""
    documentation: "GCP project ID for persistent HyperShift CI resources (passed to hypershift-install via SHARED_DIR)"
  - name: HYPERSHIFT_GCP_CI_DNS_DOMAIN
    default: ""
    documentation: "DNS domain for HyperShift CI hosted clusters (passed to hypershift-install via SHARED_DIR)"
  documentation: |-
    This step provisions a GKE Autopilot cluster for use as a HyperShift Control Plane cluster.
    It creates dynamic GCP projects under the CI folder, sets up networking with VPC,
    Cloud Router, NAT, and PSC subnets (one per hosted cluster, controlled by
    PSC_SUBNET_COUNT), then creates the GKE cluster.

    The cluster profile must contain:
    - ci-folder-id: GCP folder ID where dynamic projects are created
    - billing-account-id: GCP billing account ID to link projects

    Requires ${SHARED_DIR}/wif-cred.json written by the hypershift-gcp-wif-auth step.

    Outputs saved to ${SHARED_DIR}:
    - control-plane-project-id: Control Plane project ID
    - hosted-cluster-project-id: Hosted Cluster project ID
    - cluster-name: GKE cluster name
    - gcp-region: GCP region
    - infra-id: Infrastructure identifier
    - kubeconfig: GKE management kubeconfig using the cluster-local ci-admin credential
