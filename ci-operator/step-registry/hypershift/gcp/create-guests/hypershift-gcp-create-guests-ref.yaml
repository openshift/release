ref:
  as: hypershift-gcp-create-guests
  cli: latest
  commands: hypershift-gcp-create-guests-commands.sh
  credentials:
  - mount_path: /etc/ci-pull-credentials
    bundle: ci-pull-credentials
    namespace: test-credentials
  dependencies:
  - name: "release:latest"
    env: RELEASE_IMAGE_LATEST
  - name: "release:latest"
    env: OCP_IMAGE_N1
  env:
  - name: HYPERSHIFT_NODE_COUNT
    default: "2"
    documentation: "The number of nodes per guest cluster."
  - name: HYPERSHIFT_GCP_ZONE
    default: ""
    documentation: "GCP zone for hosted cluster nodes."
  - name: HYPERSHIFT_GCP_CI_DNS_DOMAIN
    default: ""
    documentation: "DNS domain for HyperShift CI hosted clusters."
  - name: HYPERSHIFT_GCP_BOOT_IMAGE
    default: ""
    documentation: "GCP boot image for hosted cluster nodes (RHCOS image path). If empty, falls back to a pinned default (see TODO GCP-440)."
  - name: HYPERSHIFT_PLATFORM
    default: ""
    documentation: "The cloud platform for the clusters (e.g. gcp). Set in the workflow env block."
  from: hypershift-tests
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 120m0s
  documentation: |-
    Creates GCP guest clusters via the create-guests binary and waits for them
    to become available and complete their version rollout. The number and
    configuration of clusters is determined by the hypershift repo's GCP
    platform config (HYPERSHIFT_PLATFORM=gcp); each cluster produces a separate
    JUnit XML entry for Sippy.

    Reads infrastructure configuration from SHARED_DIR files created by
    hypershift-gcp-gke-provision (gcp-region, hosted-cluster-project-id,
    kubeconfig) and hypershift-gcp-hosted-cluster-setup (WIF and network
    configuration, sa-signing-key-path, hosted-cluster-name).
