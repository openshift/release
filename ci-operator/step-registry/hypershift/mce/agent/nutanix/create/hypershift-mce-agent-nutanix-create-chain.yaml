chain:
  as: hypershift-mce-agent-nutanix-create
  steps:
  - ref: hypershift-mce-agent-nutanix-lease-acquire
  - ref: hypershift-mce-agent-create-agentserviceconfig
  - ref: hypershift-agent-create-config-dns
  - ref: hypershift-mce-agent-create-hostedcluster
  - ref: hypershift-agent-create-proxy
  - ref: hypershift-mce-agent-nutanix-infraenv
  - ref: hypershift-mce-agent-nutanix-workers
  - ref: cucushift-hypershift-extended-enable-qe-catalogsource
  - ref: hypershift-agent-create-metallb-catalogsource
  - ref: hypershift-agent-create-metallb
  - ref: hypershift-agent-check-conditions
  documentation: >-
    Creates an Agent HostedCluster with an initially empty NodePool, boots Nutanix worker VMs
    from the MCE InfraEnv discovery ISO, approves only run-associated Agents, and waits for
    Ready guest Nodes. Nutanix workers do not host the HostedCluster control plane.
