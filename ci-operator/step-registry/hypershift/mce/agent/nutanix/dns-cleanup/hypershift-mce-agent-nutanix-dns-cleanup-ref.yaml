ref:
  as: hypershift-mce-agent-nutanix-dns-cleanup
  from: upi-installer
  commands: hypershift-mce-agent-nutanix-dns-cleanup-commands.sh
  credentials:
  - mount_path: /etc/hypershift-pool-aws-credentials
    group: ops/hypershift-pool-aws-credentials
    collection: hypershift-team
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 15m0s
  grace_period: 5m0s
  documentation: >-
    Deletes only the run-owned Route53 records recorded by hypershift-mce-agent-nutanix-dns.
    Fails and retains the state file if the ownership marker or any record has changed,
    or if Route53 cannot verify deletion.
