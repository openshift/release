ref:
  as: hypershift-mce-agent-nutanix-proxy-cleanup
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-agent-nutanix-proxy-cleanup-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 20m0s
  grace_period: 5m0s
  documentation: >-
    Removes this run's marked Nutanix destinations, service ports, and S3 access rule
    from the baremetal Squid config, then restarts the proxy. Refuses to edit malformed
    or foreign marked blocks and preserves unrelated Squid rules.
