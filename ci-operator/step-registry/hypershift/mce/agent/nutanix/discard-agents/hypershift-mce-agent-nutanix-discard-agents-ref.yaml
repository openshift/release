ref:
  as: hypershift-mce-agent-nutanix-discard-agents
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-agent-nutanix-discard-agents-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 20m0s
  grace_period: 5m0s
  documentation: |-
    Deletes only this run's disposable Nutanix InfraEnv and Agents before HostedCluster
    destruction can start Assisted Service reclaim. The later Nutanix destroy step
    verifies management cleanup and deletes the recorded worker VMs and image.
