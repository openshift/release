ref:
  as: hypershift-mce-agent-nutanix-info
  from_image:
    namespace: ci
    name: agent-qe-base
    tag: latest
  commands: hypershift-mce-agent-nutanix-info-commands.sh
  credentials:
  - collection: cluster-secrets-nutanix
    group: nutanix-pc
    mount_path: /var/run/vault/nutanix
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
  documentation: Collects HostedCluster Agent, InfraEnv, NodePool, Nutanix VM, and Squid diagnostics without archiving credentials.
