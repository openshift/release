ref:
  as: hypershift-mce-agent-nutanix-proxy-allow-endpoints
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-agent-nutanix-proxy-allow-endpoints-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
