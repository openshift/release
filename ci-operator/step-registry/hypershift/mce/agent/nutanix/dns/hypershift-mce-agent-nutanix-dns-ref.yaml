ref:
  as: hypershift-mce-agent-nutanix-dns
  from: upi-installer
  cli: latest
  commands: hypershift-mce-agent-nutanix-dns-commands.sh
  credentials:
  - mount_path: /etc/hypershift-pool-aws-credentials
    group: ops/hypershift-pool-aws-credentials
    collection: hypershift-team
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 15m0s
  grace_period: 5m0s
  env:
  - name: HYPERSHIFT_BASE_DOMAIN
    default: ci.hypershift.devcluster.openshift.com
    documentation: Public Route53 base domain used by the Nutanix HostedCluster.
  documentation: >-
    Creates run-owned Route53 A records for api, api-int, and *.apps using the management
    worker IP and Nutanix ingress VIP. Refuses existing records and writes the exact record
    sets plus an ownership TXT marker to SHARED_DIR for guarded cleanup.
