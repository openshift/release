ref:
  as: hypershift-mce-agent-nutanix-lease-acquire
  from: tools
  commands: hypershift-mce-agent-nutanix-lease-acquire-commands.sh
  credentials:
  - collection: cluster-secrets-nutanix
    group: nutanix-pc
    mount_path: /var/run/vault/nutanix
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
  grace_period: 1m0s
  documentation: >-
    Rejects non-IPv4 configurations before acquiring a dedicated nutanix-quota-slice lease, then
    maps its segment name to the Nutanix credentials, Prism Central endpoint, Prism Element cluster,
    storage container, subnet UUID, and ingress VIP derived from the subnet using the Nutanix
    profile's allocation rule.
    It does not read or modify the management cluster profile or its secrets.
