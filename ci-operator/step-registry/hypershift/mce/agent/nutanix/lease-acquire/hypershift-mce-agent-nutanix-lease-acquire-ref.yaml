ref:
  as: hypershift-mce-agent-nutanix-lease-acquire
  from: tools
  commands: hypershift-mce-agent-nutanix-lease-acquire-commands.sh
  credentials:
  - collection: cluster-secrets-nutanix
    group: nutanix-pc
    mount_path: /var/run/vault/nutanix
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
  grace_period: 1m0s
  documentation: >-
    Acquires a dedicated nutanix-quota-slice lease, then maps its segment name to the Nutanix
    credentials, Prism Central endpoint, Prism Element cluster, storage container, and subnet UUID.
    It does not read or modify the management cluster profile or its secrets.
