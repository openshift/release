ref:
  as: hypershift-mce-agent-nutanix-ingress-tunnel-verify
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-agent-nutanix-ingress-tunnel-verify-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 45m0s
  grace_period: 5m0s
  documentation: >-
    Verifies the MetalLB ingress VIP, router backends, gateway forwarding, the baremetal
    WireGuard /32 route, direct and Squid canary requests, canary TLS trust using
    the guest ingress CA through the client-facing proxy, the ingress canary condition,
    the guest ClusterVersion Available condition, and the hosted ManagedCluster
    readiness conditions.
