ref:
  as: hypershift-mce-agent-nutanix-ingress-tunnel-cleanup
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-agent-nutanix-ingress-tunnel-cleanup-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 45m0s
  grace_period: 10m0s
  documentation: >-
    Removes this lease's WireGuard route, service, UDP firewall rule and keys from the
    baremetal proxy host, then deletes and verifies the recorded Nutanix gateway VM and image.
    Requires the recorded state to match the context step's run identity before removing resources.
    Removes the private Nutanix context and run identity after worker, DNS, and Squid cleanup succeed.
