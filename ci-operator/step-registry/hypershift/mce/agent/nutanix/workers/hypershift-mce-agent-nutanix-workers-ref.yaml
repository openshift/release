ref:
  as: hypershift-mce-agent-nutanix-workers
  from_image:
    namespace: ci
    name: agent-qe-base
    tag: latest
  commands: hypershift-mce-agent-nutanix-workers-commands.sh
  credentials:
  - collection: cluster-secrets-nutanix
    group: nutanix-pc
    mount_path: /var/run/vault/nutanix
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  timeout: 240m0s
  grace_period: 10m0s
  env:
  - name: NUTANIX_WORKERS
    default: "3"
    documentation: Number of Nutanix worker VMs and Agents to create and wait for.
  - name: AGENT_QE_INFRA_ANSIBLE_DIR
    default: "/ansible-files"
    documentation: >-
      Optional path to agent-qe-infra/ansible-files. By default the extra ref is expected at
      $GOPATH/src/github.com/openshift-eng/agent-qe-infra/ansible-files.
  - name: AGENT_NAMESPACE
    default: hypershift-agents
    documentation: Agent namespace used by the HostedCluster.
  documentation: >-
    Downloads and uploads the InfraEnv discovery ISO, then creates NUTANIX_WORKERS fixed-size Nutanix worker VMs
    on the Nutanix worker subnet. Before booting workers, it verifies that the ingress tunnel is ready;
    after provisioning, it checks each VM's name, subnet, CPU, memory, and disk shape. It selects
    the exact expected number of Agents associated with this run's InfraEnv, applies the NodePool's
    run label, and gives them an Ignition proxy override without noProxy so the management-only
    ignition endpoint is not excluded from Squid. It approves the Agents before scaling the NodePool,
    requires successful Agent DNS and ignition-downloadable validations, then waits for Ready guest
    Nodes and worker-to-proxy TCP.
