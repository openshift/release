ref:
  as: hypershift-mce-agent-nutanix-context
  from: tools
  commands: hypershift-mce-agent-nutanix-context-commands.sh
  credentials:
  - collection: cluster-secrets-nutanix
    group: nutanix-pc
    mount_path: /var/run/vault/nutanix
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
  grace_period: 1m0s
  documentation: >-
    Rejects non-IPv4 configurations, then maps the workflow's Nutanix quota-slice lease to
    the Nutanix credentials, Prism Central endpoint, Prism Element cluster,
    storage container, selected (possibly shared) subnet UUID, and ingress VIP derived from
    the subnet using the Nutanix profile's allocation rule.
    It does not read or modify the management cluster profile or its secrets.
