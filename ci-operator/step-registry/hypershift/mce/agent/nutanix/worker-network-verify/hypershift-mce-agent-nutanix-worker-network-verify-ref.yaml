ref:
  as: hypershift-mce-agent-nutanix-worker-network-verify
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-agent-nutanix-worker-network-verify-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
  grace_period: 2m0s
  documentation: >-
    Before conformance, checks every Ready Nutanix guest worker from its RHCOS
    host network. It verifies the installed proxy policy, DNS and direct access
    to the ingress VIP, and trusted HTTPS through Squid to the ingress canary,
    Assisted Service readiness endpoint, and hosted API NodePort. Retries for
    five minutes and fails with a per-worker summary. This fixed smoke set does
    not replace the full endpoint inventory in TC-009.
