ref:
  as: hypershift-mce-agent-nutanix-worker-dns-cleanup
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-agent-nutanix-worker-dns-cleanup-commands.sh
  credentials:
  - collection: cluster-secrets-nutanix
    group: nutanix-pc
    mount_path: /var/run/vault/nutanix
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 20m0s
  grace_period: 5m0s
  documentation: >-
    Restores the leased Nutanix subnet's previous DHCP DNS options, then stops and removes only this run's baremetal dnsmasq service and UDP/TCP 53 firewall rules.
