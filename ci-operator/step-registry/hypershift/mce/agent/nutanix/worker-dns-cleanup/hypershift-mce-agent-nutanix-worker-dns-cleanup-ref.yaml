ref:
  as: hypershift-mce-agent-nutanix-worker-dns-cleanup
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-agent-nutanix-worker-dns-cleanup-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 20m0s
  grace_period: 5m0s
  documentation: >-
    Stops and removes only this run's WireGuard-bound baremetal dnsmasq service and UDP/TCP 53 firewall rules
    before the ingress tunnel is torn down. Shared Nutanix subnet DHCP options are left untouched.
