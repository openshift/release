ref:
  as: hypershift-mce-agent-nutanix-preflight
  from: tools
  commands: hypershift-mce-agent-nutanix-preflight-commands.sh
  env:
  - name: NUTANIX_INGRESS_VIP
    default: ""
    documentation: IPv4 address reserved for the HostedCluster ingress and reachable from Nutanix workers.
  - name: NUTANIX_DHCP_CONFIRMED
    default: "false"
    documentation: Set to true only after confirming DHCP is enabled on the leased Nutanix subnet.
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: >-
    Fails closed until the job supplies a verified ingress VIP and confirms DHCP on the leased
    Nutanix subnet. This initial flow has no static NMStateConfig fallback; that requires subnet-
    specific reserved addresses and VM MACs before the InfraEnv ISO is finalized.
