ref:
  as: hypershift-mce-agent-nutanix-infraenv
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-agent-nutanix-infraenv-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 35m0s
  grace_period: 5m0s
  env:
  - name: AGENT_NAMESPACE
    default: hypershift-agents
    documentation: Agent namespace used by the HostedCluster and its run-scoped InfraEnv.
  documentation: >-
    Configures the HostedCluster and discovery ISO to use the management cluster's Squid proxy,
    creates a unique MCE InfraEnv, and downloads its discovery ISO. It does not create a standalone
    agent installer ISO or set a rendezvous IP.
