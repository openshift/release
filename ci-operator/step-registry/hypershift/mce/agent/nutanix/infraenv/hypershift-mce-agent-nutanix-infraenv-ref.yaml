ref:
  as: hypershift-mce-agent-nutanix-infraenv
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-agent-nutanix-infraenv-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 35m0s
  grace_period: 5m0s
  env:
  - name: AGENT_NAMESPACE
    default: hypershift-agents
    documentation: Agent namespace used by the HostedCluster and its run-scoped InfraEnv.
  - name: NUTANIX_WORKERS
    default: "3"
    documentation: Number of worker MACs and matching NMStateConfigs to create before the InfraEnv ISO.
  documentation: >-
    Configures the HostedCluster and discovery ISO to use the management cluster's Squid proxy,
    reserves worker NIC MACs, creates run-scoped NMStateConfigs that retain DHCP addresses but
    use the worker-facing resolver, creates a unique MCE InfraEnv, and waits for its discovery ISO URL.
