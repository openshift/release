chain:
  as: hypershift-mce-agent-destroy
  steps:
    - as: destroy
      cli: latest
      env:
      - name: HYPERSHIFT_DESTROY_STRICT_WAIT
        default: "false"
        documentation: Wait for HostedCluster and NodePool removal before completing teardown.
      commands: |-
        set -exuo pipefail
        
        if [ -f "${SHARED_DIR}/proxy-conf.sh" ] ; then
          source "${SHARED_DIR}/proxy-conf.sh"
        fi

        HYPERSHIFT_NAME=hcp
        arch=$(arch)
        if [ "$arch" == "x86_64" ]; then
          downURL=$(oc get ConsoleCLIDownload ${HYPERSHIFT_NAME}-cli-download -o json | jq -r '.spec.links[] | select(.text | test("Linux for x86_64")).href') && curl -k --output /tmp/${HYPERSHIFT_NAME}.tar.gz ${downURL}
          cd /tmp && tar -xvf /tmp/${HYPERSHIFT_NAME}.tar.gz
          chmod +x /tmp/${HYPERSHIFT_NAME}
          cd -
        fi

        CLUSTER_NAME="$(echo -n $PROW_JOB_ID|sha256sum|cut -c-20)"
        
        echo "$(date) Deleting HyperShift cluster ${CLUSTER_NAME}"
        /tmp/${HYPERSHIFT_NAME} destroy cluster agent \
          --name ${CLUSTER_NAME} \
          --namespace local-cluster \
          --cluster-grace-period 60m || true

        wait_for_removal() {
          local resource=$1 display_name=$2 current
          echo "$(date) Waiting for ${display_name} ${CLUSTER_NAME} to be removed"
          while :; do
            if current=$(oc get "${resource}" "${CLUSTER_NAME}" -n local-cluster \
              --ignore-not-found -o name --request-timeout=20s); then
              if [[ -z "${current}" ]]; then
                return 0
              fi
            else
              echo "Could not check ${display_name} ${CLUSTER_NAME}; retrying"
            fi
            if (( SECONDS >= deletion_deadline )); then
              echo "Timed out verifying removal of ${display_name} ${CLUSTER_NAME}"
              return 1
            fi
            sleep 15
          done
        }

        wait_failed=false
        if [[ "${HYPERSHIFT_DESTROY_STRICT_WAIT:-false}" == "true" ]]; then
          deletion_deadline=$((SECONDS + 1200))
          wait_for_removal hostedcluster HostedCluster || wait_failed=true
          wait_for_removal nodepool NodePool || wait_failed=true
        fi

        echo "$(date) Finished deleting cluster"
        
        oc delete managedcluster ${CLUSTER_NAME} --ignore-not-found
        echo "$(date) Finished destroying hypershift managed cluster"
        if [[ "$wait_failed" == "true" ]]; then
          exit 1
        fi
      from_image:
        namespace: ocp
        name: "4.16"
        tag: upi-installer
      grace_period: 5m0s
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
      timeout: 90m0s
