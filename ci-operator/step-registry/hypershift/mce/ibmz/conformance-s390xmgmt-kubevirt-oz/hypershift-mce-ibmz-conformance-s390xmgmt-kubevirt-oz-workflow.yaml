workflow:
  as: hypershift-mce-ibmz-conformance-s390xmgmt-kubevirt-oz
  documentation: |-
    Workflow that provisions a single ephemeral OpenShift management cluster (3 control, 2 compute nodes) on
    libvirt and deploys a HyperShift KubeVirt hosted cluster on top of it. Both the
    HCP control plane pods and the KubeVirt worker VMs run on the same management
    cluster — there is no separate external infrastructure cluster.
    MCE, the virt operator, HPP, and MetalLB are installed on the management cluster
    before the hosted cluster is created.
  steps:
    allow_best_effort_post_steps: true
    pre:
    # ── Management cluster (3 control, 2 computes) ───────────────────
    - chain: hypershift-mce-ibmz-create-s390xmgmt-oz

    # ── Operator installs ─────────────────────────────────────────────────
    # MCE, virt, HPP, MetalLB on mgmt cluster (default $KUBECONFIG → mgmt)
    - chain: hypershift-mce-ibmz-install-operators-mgmt

    # ── HCP virt cluster creation ─────────────────────────────────────────────────
    - ref: hypershift-mce-ibmz-create-hcpvirt-oz

    test:
    - chain: hypershift-mce-ibmz-test
    - chain: hypershift-conformance

    post:
    - ref: ipi-conf-debug-kdump-gather-logs
    - chain: gather
    - ref: upi-libvirt-cleanup-post

    env:
      CONTROL_COUNT: "3"
      COMPUTE_COUNT: "2"
      CNV_SUBSCRIPTION_SOURCE: 'redhat-operators'
      DOMAIN_MEMORY: "63356"   # 64 GiB
      DOMAIN_VCPUS: "16"       # 16 vCPUs
      VOLUME_CAPACITY: "200G"  # 200 GB root disk 
      SKIP_MONITOR_TEST: "true"
      # Tests skipped due to known limitations in nested-virtualization on IBM Z libvirt CI environment or non-applicable standalone OCP features (e.g. NFS recycling, DeploymentConfigs, sample API aggregators)
      # Document - why these tests are skipped: https://docs.google.com/document/d/121wGXd4ZWzgrpTr9ssVjPjJ0vBcM2UcnIr9ugPsERzk/edit?usp=sharing
      TEST_SKIPS: >-
        etcd leader changes are not excessive\|
        Kubectl client Simple pod should support exec through an HTTP proxy\|
        Managed cluster should have no crashlooping recycler pods over four minutes\|
        PersistentVolumes NFS when invoking the Recycle reclaim policy should test that a PV becomes Available and is clean after the PVC is deleted\|
        CSI Mock volume expansion CSI Volume expansion\|
        Services should have session affinity timeout work for NodePort service\|
        deploymentconfigs with multiple image change triggers should run a successful deployment with a trigger used by different containers\|
        deploymentconfigs with multiple image change triggers should run a successful deployment with multiple triggers\|
        deploymentconfigs when changing image change trigger should successfully trigger from an updated image\|
        oc new-app should succeed with a --name of 58 characters\|
        Image layer subresource should return layers from tagged images\|
        deploymentconfigs won't deploy RC with unresolved images when patched with empty image\|
        s2i build with a root user image should create a root build and pass with a privileged SCC\|
        The HAProxy router should be able to connect to a service that is idled because a GET on the route will unidle it\|
        build can reference a cluster service with a build being created from new-build should be able to run a build that references a cluster service\|
        oc tag should change image reference for internal images\|
        Services should be able to switch session affinity for NodePort service\|
        Services should have session affinity work for NodePort service\|
        Aggregator Should be able to support the 1.17 Sample API Server using the current Aggregator\|
        builds installing subscription content \[apigroup:build.openshift.io\] should succeed for RHEL\|
        HTPasswd IDP should successfully configure htpasswd and be responsive\|
        anonymous browsers should get a 403 from\|
        StatefulSet Basic StatefulSet functionality \[StatefulSetBasic\]\|
        StatefulSet Non-retain StatefulSetPersistentVolumeClaimPolicy\|
        LDAP IDP should authenticate against an ldap server \[apigroup:user.openshift.io\]\[apigroup:route.openshift.io\]\|
        expected headers returned from the\|
        Using a OAuth client with a non-default token max age \[apigroup:oauth.openshift.io\] to generate tokens\|
        oc basics can get version information from API\|
        Prometheus \[apigroup:image.openshift.io\]\|
        Alerts shouldn't exceed the series limit of total series sent via telemetry from each cluster\|
        OpenShift alerting rules \[apigroup:image.openshift.io\]\|
        services when running openshift cluster on KubeVirt virtual machines should allow connections to pods from infra cluster pod via LoadBalancer service across different guest nodes\|
        services when running openshift cluster on KubeVirt virtual machines should allow connections to pods from infra cluster pod via NodePort across different infra nodes\|
        Managed cluster should report ready nodes the entire duration of the test run \[Late\]\[apigroup:monitoring.coreos.com\]\|
        Metrics should report short attach times\|
        Metrics should report short mount times\|
        \[sig-api-machinery\] OpenAPIV3 should round trip OpenAPI V3 for all built-in group versions\|
        \[sig-kubevirt\] migration when running openshift cluster on KubeVirt virtual machines and live migrate hosted control plane workers \[Early\] should maintain node readiness \[Suite:openshift/conformance/parallel\]\|
        \[sig-network\] Services should be rejected for evicted pods\|
        \[sig-network\]\[Feature:Router\]\|
        The HAProxy router should\|
        \[sig-network\]\[OCPFeatureGate:RouteExternalCertificate\]\[Feature:Router\]\[apigroup:route.openshift.io\] with valid setup the router should support external certificate and the route is updated to remove the external certificate then also the route is reachable and serves the default certificate \[Suite:openshift/conformance/parallel\]\|
        \[sig-node\] Pods Extended Pod Container lifecycle evicted pods should be terminal\|
        imagechangetriggers should trigger builds of all types\|
        Platform Prometheus targets should not skip TLS CA verification\|
        should allow connections to pods from guest cluster PodNetwork pod via LoadBalancer service across different guest nodes\|
        Networking should provide Internet connection for containers\|
        the router should support external certificate\|
        \[sig-builds\]\|
        \[sig-imageregistry\]\[Feature:ImageLookup\]\|
        oc builds complex build\|
        oc set image can set images for pods and deployments \[apigroup:image.openshift.io\]\[Skipped:Disconnected\]\|
        oc set image can set images for pods and deployments \[apigroup:image.openshift.io\]\[apigroup:apps.openshift.io\]\[Skipped:Disconnected\]\|
        Object count check the quota after import-image
