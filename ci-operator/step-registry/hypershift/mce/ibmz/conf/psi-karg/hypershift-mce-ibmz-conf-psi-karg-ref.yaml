ref:
  as: hypershift-mce-ibmz-conf-psi-karg
  from_image:
    namespace: origin
    name: centos
    tag: '8'
  commands: hypershift-mce-ibmz-conf-psi-karg-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 10Mi
    limits:
      memory: 200Mi
  documentation: >-
    Creates MachineConfig install manifests that enable PSI (Pressure Stall
    Information) kernel argument on master and worker nodes. By baking these
    into the install manifests, the Kube Descheduler Operator's post-install
    MachineConfig becomes a no-op, preventing an MCO rolling update that can
    degrade the management cluster during conformance tests.
