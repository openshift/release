ref:
  as: hypershift-mce-ibmz-install-increase-mtu
  from: upi-installer
  cli: latest
  grace_period: 10m
  timeout: 7200s
  env:
  - name: INSTALL_KUBECONFIG
    default: ""
    documentation: |
      Optional path to a kubeconfig to use for this step. When set, KUBECONFIG is
      overridden to this value at the start of the script. Leave empty (default) to
      use the ci-operator-injected KUBECONFIG (management cluster).
  - name: MTU_OVERLAY_TO
    default: "9000"
    documentation: |
      Target MTU for the cluster overlay network (OVN-Kubernetes tunnel MTU).
      For OVN-Kubernetes this must be exactly 100 less than MTU_MACHINE_TO.
      Defaults to 9000 (jumbo frames on the OZ libvirt LPAR network).
  - name: MTU_MACHINE_TO
    default: "9100"
    documentation: |
      Target MTU for the primary network interface on the underlying host.
      For OVN-Kubernetes the overlay MTU (MTU_OVERLAY_TO) must be exactly
      100 less than this value. Defaults to 9100.
  - name: MCP_WORKER_WAIT_TIMEOUT
    default: "2700"
    documentation: |
      Maximum time in seconds to wait for the worker MachineConfigPool to finish
      the rolling node reboot triggered by the MTU change. Defaults to 2700s (45m).
  - name: MCP_MASTER_WAIT_TIMEOUT
    default: "5400"
    documentation: |
      Maximum time in seconds to wait for the master MachineConfigPool to finish
      the rolling node reboot triggered by the MTU change. Defaults to 5400s (1.5h).
      Master nodes take longer because etcd must drain/recover on each reboot.
  commands: hypershift-mce-ibmz-install-increase-mtu-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Increases the cluster network MTU to jumbo-frame size (9000/9100 by default)
    on the management cluster before operator installation.
    Patches Network.operator.openshift.io/cluster to trigger the MCO rolling
    reboot, then waits for both the worker MCP (45m timeout) and master MCP
    (1.5h timeout) to finish before returning. The step itself has a 2h hard
    timeout. Must run after the management cluster is up and before any operators
    (MCE, KubeVirt, MetalLB) are installed so that operator pods start with the
    correct MTU already in effect.
