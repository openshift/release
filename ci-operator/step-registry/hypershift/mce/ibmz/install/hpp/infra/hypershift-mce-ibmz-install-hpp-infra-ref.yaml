ref:
  as: hypershift-mce-ibmz-install-hpp-infra
  from: upi-installer
  cli: latest
  grace_period: 10m
  env:
  - name: INSTALL_KUBECONFIG
    default: ""
    documentation: |
      Optional override for the kubeconfig path. When empty (default), the script
      uses $SHARED_DIR/infra-kubeconfig. Env var defaults in ref YAMLs are not
      shell-expanded, so the path is resolved at runtime in the script instead.
  - name: STORAGE_CLASS_NAME
    default: "hostpath-csi"
    documentation: |
      Name of the storage class to create. Should match the storage pool name
      configured in the HostPathProvisioner CR.
  - name: STORAGE_POOL_NAME
    default: "local"
    documentation: |
      Storage pool name in the HostPathProvisioner. Used as the storagePool
      parameter in the StorageClass.
  commands: hypershift-mce-ibmz-install-hpp-infra-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Installs and configures HostPathProvisioner (HPP) for OpenShift Virtualization on the infra cluster.
    Creates a HostPathProvisioner CR, defines a StorageClass with the HPP provisioner,
    and marks it as the default storage class for the cluster.
