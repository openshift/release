ref:
  as: hypershift-mce-ibmz-install-metallb-oz
  from: upi-installer
  cli: latest
  grace_period: 10m
  env:
  - name: INSTALL_KUBECONFIG
    default: ""
    documentation: |
      Optional path to a kubeconfig to use for this step. When set, KUBECONFIG is
      overridden to this value at the start of the script. Leave empty (default) to
      use the ci-operator-injected KUBECONFIG (management cluster).
  - name: METALLB_OPERATOR_SUB_SOURCE
    default: "redhat-operators"
    documentation: |
      CatalogSource preference for the metallb-operator subscription.
      - redhat-operators or redhat-operators-stage: the step creates (if needed)
        the OZ redhat-operators-stage IIB CatalogSource and subscribes from it
        (same fallback pattern as hypershift-mce-ibmz-install-metallb).
      - any other value: use that CatalogSource name as-is (must already exist).
  - name: METALLB_MGMT_IPS
    default: ""
    documentation: |
      IP address range to assign to the MetalLB IPAddressPool CR, in the form
      <start>-<end> (e.g. 192.168.2.53-192.168.2.53 for a single IP).
      Leave empty (default) to use the built-in default for the OZ environment
      (192.168.2.53-192.168.2.53). Set this when deploying to a different
      environment that requires a different IP range.
  commands: hypershift-mce-ibmz-install-metallb-oz-commands.sh
  credentials:
    - mount_path: /etc/hypershift-agent-ibmz-credentials
      bundle: hypershift-agent-ibmz-credentials
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Creates a MetalLB CR, IPAddressPool, and L2Advertisement on the management
    cluster for the OZ libvirt environment. Targets the management cluster by
    default; set INSTALL_KUBECONFIG to override.
