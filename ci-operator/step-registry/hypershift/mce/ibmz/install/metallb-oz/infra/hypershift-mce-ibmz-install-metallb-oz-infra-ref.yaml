ref:
  as: hypershift-mce-ibmz-install-metallb-oz-infra
  from: upi-installer
  cli: latest
  grace_period: 10m
  env:
  - name: INSTALL_KUBECONFIG
    default: ""
    documentation: |
      Optional override for the kubeconfig path. When empty (default), the script
      uses $SHARED_DIR/infra-kubeconfig. Env var defaults in ref YAMLs are not
      shell-expanded, so the path is resolved at runtime in the script instead.
  - name: METALLB_OPERATOR_SUB_SOURCE
    default: "redhat-operators"
    documentation: |
      CatalogSource to check first for the metallb-operator subscription.
      Defaults to redhat-operators (the standard built-in catalog). If
      metallb-operator is not found there, the script automatically creates a
      fallback CatalogSource backed by
      registry.redhat.io/redhat/redhat-operator-index:v4.22 (accessible via
      the brew-registry ImageContentSourcePolicy) and uses that instead.
  - name: METALLB_MGMT_IPS_INFRA
    default: ""
    documentation: |
      IP address range to assign to the MetalLB IPAddressPool CR, in the form
      <start>-<end> (e.g. 192.168.2.53-192.168.2.53 for a single IP).
      Leave empty (default) to use the built-in default for the OZ environment
      (192.168.2.53-192.168.2.53). Set this when deploying to a different
      environment that requires a different IP range.
  commands: hypershift-mce-ibmz-install-metallb-oz-infra-commands.sh
  credentials:
    - mount_path: /etc/hypershift-agent-ibmz-credentials
      bundle: hypershift-agent-ibmz-credentials
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Creates a MetalLB CR, IPAddressPool, and L2Advertisement on the infra cluster
    for the OZ libvirt environment. Always targets the infra cluster by resolving
    the kubeconfig at runtime as $SHARED_DIR/infra-kubeconfig.
