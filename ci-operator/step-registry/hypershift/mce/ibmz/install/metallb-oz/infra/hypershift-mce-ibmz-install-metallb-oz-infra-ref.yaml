ref:
  as: hypershift-mce-ibmz-install-metallb-oz-infra
  from: upi-installer
  cli: latest
  grace_period: 10m
  env:
  - name: INSTALL_KUBECONFIG
    default: ""
    documentation: |
      Optional override for the kubeconfig path. When empty (default), the script
      uses $SHARED_DIR/infra-kubeconfig. Env var defaults in ref YAMLs are not
      shell-expanded, so the path is resolved at runtime in the script instead.
  commands: hypershift-mce-ibmz-install-metallb-oz-infra-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Creates a MetalLB CR, IPAddressPool, and L2Advertisement on the infra cluster
    for the OZ libvirt environment. Always targets the infra cluster by resolving
    the kubeconfig at runtime as $SHARED_DIR/infra-kubeconfig.
