ref:
  as: hypershift-mce-ibmz-install-metallb-oz-resolve-ips
  from: upi-installer
  cli: latest
  grace_period: 5m
  commands: hypershift-mce-ibmz-install-metallb-oz-resolve-ips-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Reads the first node IP from $SHARED_DIR/infra-kubeconfig and resolves the
    correct MetalLB IP ranges for the OZ libvirt environment:
      192.168.2.x  →  METALLB_MGMT_IPS=192.168.2.53-192.168.2.53
                      METALLB_MGMT_IPS_INFRA=192.168.2.54-192.168.2.54
      192.168.3.x  →  METALLB_MGMT_IPS=192.168.3.53-192.168.3.53
                      METALLB_MGMT_IPS_INFRA=192.168.3.54-192.168.3.54
    Writes both values to $SHARED_DIR so the metallb-oz and metallb-oz-infra
    steps can consume them.
