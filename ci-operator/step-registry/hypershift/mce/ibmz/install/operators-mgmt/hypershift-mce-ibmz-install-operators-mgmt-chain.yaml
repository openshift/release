chain:
  as: hypershift-mce-ibmz-install-operators-mgmt
  steps:
  - ref: hypershift-mce-ibmz-install-increase-mtu
  - ref: hypershift-mce-ibmz-install-metallb-oz
  - ref: hypershift-mce-install
  - ref: hypershift-kubevirt-install
  - ref: hypershift-mce-ibmz-install-hpp
  documentation: |-
    Increases the management cluster network MTU to jumbo-frame size, then
    installs MCE and the KubeVirt / OpenShift Virtualization operator on the
    management cluster. The MTU step runs first so all operator pods start
    with the correct MTU already in effect. Targets the default $KUBECONFIG
    (mgmt kubeconfig written by upi-install-libvirt).
