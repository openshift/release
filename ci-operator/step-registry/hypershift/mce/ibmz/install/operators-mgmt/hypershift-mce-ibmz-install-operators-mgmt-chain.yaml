chain:
  as: hypershift-mce-ibmz-install-operators-mgmt
  steps:
  - ref: hypershift-mce-ibmz-install-metallb-oz-resolve-ips
  - ref: hypershift-mce-ibmz-install-metallb-oz
  - ref: hypershift-mce-install
  - ref: hypershift-kubevirt-install
  - ref: hypershift-mce-ibmz-install-hpp
  documentation: |-
    Installs MCE and the KubeVirt / OpenShift Virtualization operator on the
    management cluster. Targets the default $KUBECONFIG (mgmt kubeconfig written
    by upi-install-libvirt). Used in the extinfra workflow after both the mgmt
    and infra clusters are up. The resolve-ips step detects the node subnet from
    $SHARED_DIR/infra-kubeconfig and writes METALLB_MGMT_IPS / METALLB_MGMT_IPS_INFRA
    to $SHARED_DIR before the metallb-oz steps run.
