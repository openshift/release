chain:
  as: hypershift-mce-ibmz-install-operators-infra
  steps:
  - ref: hypershift-mce-ibmz-install-metallb-oz-infra
  - ref: hypershift-kubevirt-install-infra
  - ref: hypershift-mce-ibmz-install-hpp-infra
  documentation: |-
    Installs the KubeVirt / OpenShift Virtualization operator and HostPathProvisioner (HPP) on the infra cluster.
    Both steps target the infra cluster using the infra-kubeconfig by default, leaving the management cluster
    untouched. METALLB_MGMT_IPS_INFRA is resolved by the resolve-ips-extinfra step in the operators-mgmt chain (which
    runs first) and written to $SHARED_DIR for this chain to consume.
