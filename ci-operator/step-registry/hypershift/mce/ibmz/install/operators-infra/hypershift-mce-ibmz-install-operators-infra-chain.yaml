chain:
  as: hypershift-mce-ibmz-install-operators-infra
  steps:
  - as: hypershift-kubevirt-install-infra
    ref: hypershift-kubevirt-install
    env:
    - name: INSTALL_KUBECONFIG
      default: "${SHARED_DIR}/infra-kubeconfig"
  - as: hypershift-mce-ibmz-install-hpp-infra
    ref: hypershift-mce-ibmz-install-hpp
    env:
    - name: INSTALL_KUBECONFIG
      default: "${SHARED_DIR}/infra-kubeconfig"
  documentation: |-
    Installs the KubeVirt / OpenShift Virtualization operator on the infra cluster.
    Renames the hypershift-kubevirt-install ref to hypershift-kubevirt-install-infra
    and overrides INSTALL_KUBECONFIG to target the infra cluster, leaving
    the management cluster kubeconfig untouched.
