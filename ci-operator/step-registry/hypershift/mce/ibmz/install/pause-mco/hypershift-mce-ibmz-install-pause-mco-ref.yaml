ref:
  as: hypershift-mce-ibmz-install-pause-mco
  from: upi-installer
  cli: latest
  grace_period: 10m
  commands: hypershift-mce-ibmz-install-pause-mco-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Pauses the master and worker MachineConfigPools on the management cluster
    (spec.paused=true) so the Machine Config Operator does not roll or reboot
    nodes for MachineConfigs created later (for example PSI kernel args or swap).
    This avoids management cluster disruption during the operator installs and
    tests that follow. The pools are not unpaused by this step, so nothing that
    depends on a MachineConfig rollout works after it runs. Targets the default
    $KUBECONFIG (the management cluster).
