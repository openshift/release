ref:
  as: hypershift-mce-ibmz-destroy-hcpvirt-oz
  cli: latest
  commands: hypershift-mce-ibmz-destroy-hcpvirt-oz-commands.sh
  from: dev-scripts
  grace_period: 15m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 1h
  credentials:
    - mount_path: /etc/hypershift-agent-ibmz-credentials
      bundle: hypershift-agent-ibmz-credentials
  documentation: |-
    Destroys the HCP KubeVirt hosted cluster created by hypershift-mce-ibmz-create-hcpvirt-oz
    and removes the corresponding haproxy frontend/backend entry from the LPAR so the
    config is clean for future rehearsals.
