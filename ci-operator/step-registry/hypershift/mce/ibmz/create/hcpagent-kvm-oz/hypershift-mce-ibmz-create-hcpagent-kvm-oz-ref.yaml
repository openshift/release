ref:
  as: hypershift-mce-ibmz-create-hcpagent-kvm-oz
  from: libvirt-installer
  cli: latest
  grace_period: 15m0s
  commands: hypershift-mce-ibmz-create-hcpagent-kvm-oz-commands.sh
  timeout: 2h0m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: AGENT_NODE_COUNT
    default: "2"
    documentation: |-
      Number of KVM guests to create and attach to the hosted cluster as agents. Each guest uses
      the MAC address reserved for compute[i] in the lease config, so it gets that fixed IP from
      the libvirt network DHCP. The count cannot exceed the number of compute entries in the lease.
  - name: AGENT_GUEST_MEMORY
    default: "16384"
    documentation: Memory of each KVM guest, in MiB.
  - name: AGENT_GUEST_VCPUS
    default: "4"
    documentation: Number of vCPUs of each KVM guest.
  - name: AGENT_GUEST_DISK_CAPACITY
    default: "120G"
    documentation: Size of the root disk of each KVM guest.
  - name: POOL_NAME
    default: "multiarch-ci-pool"
    documentation: Libvirt storage pool where the kernel, initrd and guest disks are created.
  - name: LIBVIRT_IMAGE_PATH
    default: "/var/lib/libvirt/openshift-images"
    documentation: Directory on the libvirt host used as the target for newly created storage pools.
  - name: HTTPD_POOL_NAME
    default: "httpd"
    documentation: Libvirt storage pool served over HTTP by the libvirt host. The rootfs is staged here. Created under LIBVIRT_IMAGE_PATH if it does not exist.
  - name: HTTPD_PORT
    default: ""
    documentation: HTTP port serving HTTPD_POOL_NAME on the libvirt host. If empty, the httpd-port of the lease config is used.
  - name: GUEST_NETWORK
    default: ""
    documentation: |-
      Libvirt network the guests are attached to. If empty, the management cluster
      network is used (the leased resource name, followed by the unique hash when
      USE_EXTERNAL_DNS is not "true").
  - name: USE_EXTERNAL_DNS
    default: "false"
    documentation: Must match the value used when the management cluster was created.
  documentation: |-
    Creates KVM guests on the libvirt host of the leased resource, PXE boots them (direct
    kernel and initrd boot) from the boot artifacts of the InfraEnv created by
    hypershift-mce-ibmz-create-hcpagent-oz, and attaches them to the hosted cluster as agents.
    The kernel and initrd are uploaded to the libvirt pool and the rootfs is staged in the
    httpd pool, from where the guests fetch it over plain HTTP. The guests register as Agents,
    are approved and the nodepool is scaled. After the installation the guests power off on
    reboot and are started again from disk. The guests and volumes contain the leased
    resource name in their names, so upi-libvirt-cleanup-post removes them.
    Runs after hypershift-mce-ibmz-create-hcpagent-oz.
