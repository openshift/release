chain:
  as: hypershift-mce-ibmz-create-s390xinfra-oz
  steps:
  - ref: hypershift-mce-ibmz-create-s390xinfra-oz-cleanup-pre
  - chain: hypershift-mce-ibmz-create-s390xinfra-oz-conf
  - ref: hypershift-mce-ibmz-create-s390xinfra-oz-debug-static-pod
  - ref: hypershift-mce-ibmz-create-s390xinfra-oz-conf-etcd-ramfs
  - chain: hypershift-mce-ibmz-create-s390xinfra-oz-install
  documentation: |-
    Provisions the external infrastructure (compact) OpenShift cluster on a
    second libvirt OZ host identified by $LEASED_RESOURCE_INFRA. Cleans up
    stale libvirt resources, writes all infra-prefixed config/install files,
    and runs the agent-based UPI installation. Kubeconfig is written to
    $SHARED_DIR/infra/kubeconfig on success.
