chain:
  as: hypershift-mce-ibmz-create-s390xinfra-oz-install
  steps:
  - ref: hypershift-mce-ibmz-create-s390xinfra-oz-install-network
  - ref: hypershift-mce-ibmz-create-s390xinfra-oz-install-osstream
  - ref: hypershift-mce-ibmz-create-s390xinfra-oz-install-install
  env:
  - name: ARCH
  - name: BRANCH
  documentation: |-
    Infra-cluster install chain. All steps use uniquely-named infra refs (hypershift-mce-ibmz-create-s390xinfra-oz-*)
    so they coexist with mgmt steps in one workflow. Every ref has CLUSTER_ROLE=infra so
    scripts use $LEASED_RESOURCE_INFRA and write to $SHARED_DIR (with infra- file prefix).
