chain:
  as: hypershift-mce-ibmz-create-s390xmgmt-oz
  steps:
  - ref: upi-libvirt-cleanup-pre
  - chain: upi-conf-libvirt
  - ref: ipi-debug-missing-static-pod-controller-degraded
  - ref: ipi-conf-etcd-on-ramfs
  - chain: upi-install-libvirt
  documentation: |-
    Provisions the management (SNO) OpenShift cluster on a libvirt OZ host.
    Cleans up stale libvirt resources, writes all config/install files, and
    runs the agent-based UPI installation. Kubeconfig is written to
    $SHARED_DIR/kubeconfig on success.
