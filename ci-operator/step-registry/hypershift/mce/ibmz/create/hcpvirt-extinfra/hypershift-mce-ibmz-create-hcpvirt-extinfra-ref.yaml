ref:
  as: hypershift-mce-ibmz-create-hcpvirt-extinfra
  cli: latest
  commands: hypershift-mce-ibmz-create-hcpvirt-extinfra-commands.sh
  from: dev-scripts
  grace_period: 15m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 1h
  credentials:
    - mount_path: /etc/hypershift-agent-ibmz-credentials
      name: hypershift-agent-ibmz-credentials
      namespace: test-credentials
  dependencies:
    - env: OCP_IMAGE_MULTI
      name: release:multi-latest
