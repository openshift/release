workflow:
  as: hypershift-mce-ibmz-conformance-s390xmgmt-kubevirt-extinfra
  documentation: |-
    Phase 1 workflow that provisions two ephemeral OpenShift clusters on libvirt:
    a management cluster and an external infrastructure (infra) cluster. This is the
    foundation for HyperShift KubeVirt on external infrastructure testing.
    MCE + virt operator are installed on the mgmt cluster; virt operator alone on infra.
  steps:
    allow_best_effort_post_steps: true
    leases:
    - resource_type: libvirt-s390x-vpn-oz-quota-slice
      env: LEASED_RESOURCE_INFRA    # second OZ host for infra cluster
    env:
      CONTROL_COUNT: "1"
      COMPUTE_COUNT: "0"
    pre:
    # ── Management cluster (SNO: 1 control, 0 compute) ───────────────────
    - ref: upi-libvirt-cleanup-pre
    - chain: upi-conf-libvirt
    - ref: ipi-debug-missing-static-pod-controller-degraded
    - ref: ipi-conf-etcd-on-ramfs
    - chain: upi-install-libvirt

    # ── Infra cluster (compact: 3 control, 0 compute) ────────────────────
    - ref: upi-libvirt-infra-cleanup-pre
    - chain: upi-libvirt-infra-conf
    - ref: upi-libvirt-infra-debug-static-pod
    - ref: upi-libvirt-infra-conf-etcd-ramfs
    - chain: upi-libvirt-infra-install

    # ── Operator installs ─────────────────────────────────────────────────
    # MCE on mgmt cluster (uses default $KUBECONFIG → mgmt kubeconfig)
    - ref: hypershift-mce-install
    # KubeVirt / virt operator on mgmt cluster
    - ref: hypershift-kubevirt-install
    # KubeVirt / virt operator on infra cluster (override KUBECONFIG to infra)
    - ref: hypershift-kubevirt-install
      env:
        KUBECONFIG: /tmp/shared/infra-kubeconfig
    test:
    - ref: hypershift-mce-ibmz-conformance-s390xmgmt-kubevirt-extinfra-test-print
    post:
    - ref: ipi-conf-debug-kdump-gather-logs
    - chain: gather
    - ref: upi-libvirt-cleanup-post
    - ref: upi-libvirt-infra-cleanup-post
