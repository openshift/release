ref:
  as: hypershift-mce-operator-install
  from: upi-installer
  grace_period: 5m0s
  timeout: 60m0s
  cli: latest
  env:
  - name: MCE_VERSION
    default: "2.4"
    documentation: Version of MCE to install from the custom catalog.
  - name: DISCONNECTED
    default: "false"
    documentation: Use the mirrored custom catalog in a disconnected environment.
  - name: MULTISTAGE_PARAM_OVERRIDE_MCE_VERSION
    default: ""
    documentation: Overrides MCE_VERSION when triggering the job through Gangway.
  commands: hypershift-mce-operator-install-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  credentials:
  - mount_path: /etc/acm-d-mce-quay-pull-credentials
    group: acm-d-mce
    collection: acm-mce
  documentation: |-
    Installs the MCE operator from the ACM development catalog and waits for its CSV.
    Run this before hypershift-mce-install when the custom catalog is required.
