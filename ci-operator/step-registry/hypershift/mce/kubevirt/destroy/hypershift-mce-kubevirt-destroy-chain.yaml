chain:
  as: hypershift-mce-kubevirt-destroy
  steps:
    - as: destroy
      cli: latest
      commands: |-
        set -exuo pipefail
        
        if [ -f "${SHARED_DIR}/proxy-conf.sh" ] ; then
          source "${SHARED_DIR}/proxy-conf.sh"
        fi

        DEBUG_WAIT_TIMEOUT="${DEBUG_WAIT_TIMEOUT:-0}"
        if [[ -n "${DEBUG_WAIT_TIMEOUT}" && "${DEBUG_WAIT_TIMEOUT}" != "0" ]]; then
          echo "Debug wait: sleeping for ${DEBUG_WAIT_TIMEOUT} seconds before cluster destroy..."
          sleep "${DEBUG_WAIT_TIMEOUT}"
          echo "Debug wait complete."
        fi

        HYPERSHIFT_NAME=hcp
        arch=$(arch)
        if [ "$arch" == "x86_64" ]; then
          downURL=$(oc get ConsoleCLIDownload ${HYPERSHIFT_NAME}-cli-download -o json | jq -r '.spec.links[] | select(.text | test("Linux for x86_64")).href') && curl -k --output /tmp/${HYPERSHIFT_NAME}.tar.gz ${downURL}
          cd /tmp && tar -xvf /tmp/${HYPERSHIFT_NAME}.tar.gz
          chmod +x /tmp/${HYPERSHIFT_NAME}
          cd -
        fi

        CLUSTER_NAME="$(echo -n $PROW_JOB_ID|sha256sum|cut -c-20)"

        echo "$(date) Deleting HyperShift cluster ${CLUSTER_NAME}"
        /tmp/${HYPERSHIFT_NAME} destroy cluster kubevirt \
          --name ${CLUSTER_NAME} \
          --namespace ${HC_NS} \
          --cluster-grace-period 30m

        echo "$(date) Finished deleting cluster"
        
        oc delete managedcluster ${CLUSTER_NAME} --ignore-not-found
        echo "$(date) Finished destroying hypershift managed cluster"
      from_image:
        namespace: ocp
        name: "4.13"
        tag: upi-installer
      grace_period: 5m0s
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
      timeout: 30m0s
      env:
      - name: HC_NS
        default: "local-cluster"
        documentation: |-
          Namespace of hosted control plane cluster
      - name: DEBUG_WAIT_TIMEOUT
        default: "0"
        documentation: |-
          Seconds to sleep before starting cluster destroy. Runs in the post phase so the
          cluster remains available for debugging after pre or test step failures. Set to 0 to skip.
