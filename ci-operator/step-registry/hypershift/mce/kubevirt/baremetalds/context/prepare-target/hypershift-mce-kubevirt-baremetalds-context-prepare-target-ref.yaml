ref:
  as: hypershift-mce-kubevirt-baremetalds-context-prepare-target
  from: cli
  commands: hypershift-mce-kubevirt-baremetalds-context-prepare-target-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OFCIR_CONTEXT_ROLE
    default: target
    documentation: OFCIR context role.
  - name: OFCIR_CONTEXT_ACTION
    default: activate
    documentation: OFCIR context action.
  documentation: |-
    Save the source OFCIR context and activate the target context before preparing its host.
