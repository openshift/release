ref:
  as: hypershift-mce-kubevirt-baremetalds-context-post-source
  from: cli
  commands: hypershift-mce-kubevirt-baremetalds-context-post-source-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OFCIR_CONTEXT_ROLE
    default: source
    documentation: OFCIR context role.
  - name: OFCIR_CONTEXT_ACTION
    default: activate
    documentation: OFCIR context action.
  documentation: |-
    Activates the source OFCIR context for post-step cleanup.
