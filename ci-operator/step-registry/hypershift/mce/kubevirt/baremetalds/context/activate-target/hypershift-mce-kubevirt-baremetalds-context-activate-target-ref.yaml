ref:
  as: hypershift-mce-kubevirt-baremetalds-context-activate-target
  from: cli
  commands: hypershift-mce-kubevirt-baremetalds-context-activate-target-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OFCIR_CONTEXT_ROLE
    default: target
    documentation: OFCIR context role.
  - name: OFCIR_CONTEXT_ACTION
    default: activate
    documentation: OFCIR context action.
  documentation: |-
    Activate the target OFCIR management cluster context.
