ref:
  as: hypershift-mce-kubevirt-baremetalds-context-select-source
  from: cli
  commands: hypershift-mce-kubevirt-baremetalds-context-select-source-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OFCIR_CONTEXT_ROLE
    default: source
    documentation: OFCIR context role.
  - name: OFCIR_CONTEXT_ACTION
    default: select
    documentation: OFCIR context action.
  documentation: |-
    Select the source OFCIR management cluster context.
