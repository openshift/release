ref:
  as: hypershift-mce-kubevirt-baremetalds-context
  from: cli
  commands: hypershift-mce-kubevirt-baremetalds-context-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OFCIR_CONTEXT_ROLE
    default: ""
    documentation: Source or target OFCIR management cluster context.
  - name: OFCIR_CONTEXT_ACTION
    default: ""
    documentation: Save or activate a role's SHARED_DIR state.
  documentation: |-
    Saves and activates role-specific OFCIR state for two management clusters in
    one CI job, while preserving the legacy SHARED_DIR paths used by steps.
