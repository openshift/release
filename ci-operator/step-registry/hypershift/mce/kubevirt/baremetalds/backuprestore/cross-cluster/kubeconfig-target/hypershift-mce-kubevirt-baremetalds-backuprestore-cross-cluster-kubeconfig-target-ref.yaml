ref:
  as: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-kubeconfig-target
  from: upi-installer
  cli: latest
  commands: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-kubeconfig-target-commands.sh
  timeout: 40m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: E2E_HOSTED_CLUSTER_NAMESPACE
    default: local-cluster
    documentation: Namespace containing the MCE HostedCluster.
  - name: MCE_VERSION
    default: ""
    documentation: MCE version on the management cluster. Set to download the MCE-provided hcp CLI on x86_64.
  documentation: |-
    Waits for the restored guest and generates its kubeconfig from the target
    MCE manager before the target host's proxy is added.
