ref:
  as: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-dns-source
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-dns-source-commands.sh
  timeout: 25m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: E2E_HOSTED_CLUSTER_NAMESPACE
    default: local-cluster
    documentation: Namespace containing the MCE HostedCluster.
  documentation: |-
    Installs DNS records for the KubeVirt guest on the source OFCIR virthost:
    the guest API (a MetalLB LoadBalancer IP) and the guest apps (served by the
    management router via baseDomainPassthrough). Each virthost resolves guest
    names locally, so these records cannot be reused after the restore and are
    reinstalled by the dns-target step. Saves the management and guest base
    domains so the target step can verify the restore kept them stable.
