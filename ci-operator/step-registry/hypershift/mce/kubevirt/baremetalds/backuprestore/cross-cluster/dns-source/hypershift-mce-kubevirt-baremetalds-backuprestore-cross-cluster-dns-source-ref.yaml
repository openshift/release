ref:
  as: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-dns-source
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-dns-source-commands.sh
  run_as_script: true
  timeout: 25m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: E2E_HOSTED_CLUSTER_NAMESPACE
    default: local-cluster
    documentation: Namespace containing the MCE HostedCluster.
  documentation: |-
    Resolves the KubeVirt guest's actual API and management ingress addresses
    and installs guest DNS records on the active OFCIR host. The target invokes
    the same script after its restored services have acquired addresses.
