workflow:
  as: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster
  documentation: |-
    Backs up a KubeVirt HostedCluster on a source MCE management cluster and
    restores it on a target MCE management cluster. Each management cluster is
    provisioned on a separate OFCIR bare metal host. Both OADP installations
    use MinIO on the source host; each virthost resolves guest names locally.
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: baremetalds-ofcir-pre-source
    - ref: hypershift-mce-kubevirt-baremetalds-context-prepare-target
    - chain: baremetalds-ofcir-pre-target
    - ref: baremetalds-devscripts-setup-parallel
    - ref: hypershift-mce-kubevirt-baremetalds-context-activate-source
    - ref: enable-qe-catalogsource-source
    - ref: deploy-konflux-operator-source
    - chain: hypershift-kubevirt-baremetalds-lvm-source
    - chain: hypershift-kubevirt-baremetalds-metallb-source
    - chain: hypershift-kubevirt-baremetalds-odf-source
    - ref: hypershift-kubevirt-install-source
    - ref: hypershift-mce-install-source
    - ref: hypershift-kubevirt-create-source
    - ref: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-dns-source
    - ref: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-kubeconfig-source
    - ref: hypershift-kubevirt-baremetalds-proxy-source
    - ref: hypershift-kubevirt-health-check-source
    - ref: hypershift-mce-kubevirt-baremetalds-minio-shared
    - ref: operatorhub-subscribe-oadp-operator-source
    - ref: hypershift-mce-agent-oadp-v2-setup-source
    - ref: hypershift-mce-kubevirt-baremetalds-context-activate-target
    - ref: enable-qe-catalogsource-target
    - ref: deploy-konflux-operator-target
    - chain: hypershift-kubevirt-baremetalds-lvm-target
    - chain: hypershift-kubevirt-baremetalds-metallb-target
    - chain: hypershift-kubevirt-baremetalds-odf-target
    - ref: hypershift-kubevirt-install-target
    - ref: hypershift-mce-install-target
    - ref: operatorhub-subscribe-oadp-operator-target
    - ref: hypershift-mce-agent-oadp-v2-setup-target
    test:
    - ref: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-test
    - ref: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-kubeconfig-target
    - ref: hypershift-kubevirt-baremetalds-proxy-target
    # Conformance runs against the restored guest on the target cluster.
    - chain: hypershift-conformance
    post:
    - ref: hypershift-mce-kubevirt-baremetalds-context-post-target
    # Gather diagnostics and destroy the restored guest on the target cluster.
    - ref: hypershift-mce-dump
    - chain: gather-core-dump
    - chain: hypershift-mce-kubevirt-destroy
    - chain: baremetalds-ofcir-post-target
    - ref: hypershift-mce-kubevirt-baremetalds-context-post-source
    - ref: hypershift-mce-kubevirt-baremetalds-minio-destroy-source
    - chain: baremetalds-ofcir-post-source
    env:
      HYPERSHIFT_NODE_COUNT: "2"
      KUBEVIRT_CROSS_CLUSTER_STABLE_DNS: "true"
      CLUSTERTYPE: host_384gb_el9
      E2E_HOSTED_CLUSTER_NAMESPACE: local-cluster
      TEST_SKIPS: etcd leader changes are not excessive \| StatefulSet Basic \| StatefulSet Non-retain
      KONFLUX_DEPLOY_OPERATORS: "false"
      KONFLUX_TARGET_OPERATORS: metallb,local-storage
      METALLB_OPERATOR_SUB_SOURCE: qe-app-registry
      LVM_OPERATOR_SUB_SOURCE: lvm-catalogsource
      LVM_SUB_TARGET_NAMESPACES: openshift-lvm-storage
      LVM_OPERATOR_SUB_INSTALL_NAMESPACE: openshift-lvm-storage
      ETCD_STORAGE_CLASS: lvms-vg1
      HYPERSHIFT_NP_AUTOREPAIR: "true"
      LOCAL_STORAGE_OPERATOR_SUB_SOURCE: qe-app-registry
      DEVSCRIPTS_CONFIG: |
        EXTRA_NETWORK_NAMES="nmstate1 nmstate2"
        NMSTATE1_NETWORK_SUBNET_V4="192.168.221.0/24"
        NMSTATE1_NETWORK_SUBNET_V6="fd2e:6f44:5dd8:ca56::/120"
        NMSTATE2_NETWORK_SUBNET_V4="192.168.222.0/24"
        NMSTATE2_NETWORK_SUBNET_V6="fd2e:6f44:5dd8:cc56::/120"
        IP_STACK=v4
        NETWORK_TYPE=OVNKubernetes
        NUM_WORKERS=0
        NUM_MASTERS=3
        MASTER_VCPU=16
        MASTER_MEMORY=81920
        VM_EXTRADISKS=true
        VM_EXTRADISKS_LIST="vda vdb"
        VM_EXTRADISKS_SIZE=250G
