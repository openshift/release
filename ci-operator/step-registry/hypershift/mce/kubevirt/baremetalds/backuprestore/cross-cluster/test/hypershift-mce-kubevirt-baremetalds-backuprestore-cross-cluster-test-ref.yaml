ref:
  as: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-test
  from: hypershift-tests
  cli: latest
  commands: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-test-commands.sh
  timeout: 5h30m
  grace_period: 5m
  resources:
    requests:
      cpu: "1"
      memory: 200Mi
  env:
  - name: E2E_HOSTED_CLUSTER_NAMESPACE
    default: local-cluster
    documentation: Namespace containing the MCE HostedCluster.
  documentation: |-
    Runs the KubeVirt cross-management-cluster backup and restore test with
    distinct source and target kubeconfigs and no AWS guest credentials.
