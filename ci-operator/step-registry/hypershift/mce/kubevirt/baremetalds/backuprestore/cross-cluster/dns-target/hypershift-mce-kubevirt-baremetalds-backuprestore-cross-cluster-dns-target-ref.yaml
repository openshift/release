ref:
  as: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-dns-target
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-dns-target-commands.sh
  timeout: 25m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: E2E_HOSTED_CLUSTER_NAMESPACE
    default: local-cluster
    documentation: Namespace containing the MCE HostedCluster.
  documentation: |-
    Verifies that the restored KubeVirt guest retains its source management and
    guest base domains, then reinstalls the guest DNS records on the target OFCIR
    virthost. Needed because each virthost resolves guest names locally and the
    restored guest's API is served by a new MetalLB LoadBalancer IP on the target
    management cluster, while the API name stays stable via
    KUBEVIRT_CROSS_CLUSTER_STABLE_DNS.
