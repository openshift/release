ref:
  as: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-dns-target
  from: dev-scripts
  cli: latest
  commands: hypershift-mce-kubevirt-baremetalds-backuprestore-cross-cluster-dns-target-commands.sh
  timeout: 25m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: E2E_HOSTED_CLUSTER_NAMESPACE
    default: local-cluster
    documentation: Namespace containing the MCE HostedCluster.
  documentation: |-
    Verifies that the restored KubeVirt guest retains its source base domain
    and installs guest DNS records for the restored services on the target OFCIR host.
