chain:
  as: hypershift-destroy-nested-management-cluster
  steps:
  - ref: hypershift-dump-management-cluster
  - ref: hypershift-dump-extra
  - ref: hypershift-destroy-nested-management-cluster
  env:
  - name: HYPERSHIFT_CLUSTER_ROLE
    default: ''
  - name: KUBECONFIG
    default: ${SHARED_DIR}/management_cluster_kubeconfig
