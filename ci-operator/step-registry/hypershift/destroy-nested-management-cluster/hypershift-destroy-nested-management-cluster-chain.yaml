chain:
  as: hypershift-destroy-nested-management-cluster
  steps:
  - as: dump-management-cluster
    optional_on_success: true
    cli: latest
    env:
    - name: HYPERSHIFT_NAMESPACE
      default: "clusters"
      documentation: "The Namespace where to create the HostedCluster and NodePools"
    - name: CLOUD_PROVIDER
      default: "AWS"
      documentation: "The cloud provider of the cluster."
    commands: |-
      # Set cloud-specific kubeconfig
      if [[ "${CLOUD_PROVIDER}" == "Azure" ]]; then
        export KUBECONFIG=/etc/hypershift-kubeconfig-azure/hypershift-ops-admin.kubeconfig
      else
        export KUBECONFIG=/etc/hypershift-kubeconfig/hypershift-ops-admin.kubeconfig
      fi

      # Fail fast so only a fully sanitized and verified archive is published.
      set -e

      CLUSTER_NAME="$(echo -n $PROW_JOB_ID|sha256sum|cut -c-10)-mgmt"
      # Keep raw dump files outside ARTIFACT_DIR until sanitization and archive
      # verification succeed.
      DUMP_WORK_DIR="$(mktemp -d /tmp/hypershift-dump.XXXXXX)"
      trap 'rm -rf -- "${DUMP_WORK_DIR}"' EXIT
      mkdir -p "${DUMP_WORK_DIR}/output"
      # --archive-dump=false: skip creating hypershift-dump.tar.gz inside the output
      # dir; sed cannot redact inside a compressed archive and leaktk/gcs-filter
      # would match secrets embedded in it. The shell tar below archives instead.
      bin/hypershift dump cluster --dump-guest-cluster=true --archive-dump=false --artifact-dir="${DUMP_WORK_DIR}/output" --name="${CLUSTER_NAME}" --namespace="${HYPERSHIFT_NAMESPACE}"

      # Redact sensitive data before archiving and upload (OCPBUGS-84684, OCPBUGS-109626).
      #
      # 1. Delete Secret resource YAMLs — their base64-encoded .data fields trigger
      #    gitleaks generic-api-key / private-key rules. oc adm inspect writes them
      #    under <namespace>/core/secrets/.
      find "${DUMP_WORK_DIR}/output" -type f \( -path '*/secrets/*' -o -name 'secrets.yaml' -path '*/core/*' \) -delete
      # 2. Remove resource classes that can contain arbitrary credentials or
      #    free-form diagnostics. Keep the structured cluster status snapshot.
      find "${DUMP_WORK_DIR}/output" -type f \( \
        -path '*/configmaps/*' \
        -o -path '*/pods/*' \
        -o -path '*/core/configmaps.yaml' \
        -o -path '*/core/pods.yaml' \
        -o -path '*/core/events/*' \
        -o -path '*/core/events.yaml' \
        -o -path '*/apps/daemonsets/*' \
        -o -path '*/apps/daemonsets.yaml' \
        -o -path '*/apps/deployments/*' \
        -o -path '*/apps/deployments.yaml' \
        -o -path '*/apps/replicasets/*' \
        -o -path '*/apps/replicasets.yaml' \
        -o -path '*/apps/statefulsets/*' \
        -o -path '*/apps/statefulsets.yaml' \
        -o -path '*/batch/jobs/*' \
        -o -path '*/batch/jobs.yaml' \
        -o -path '*/batch/cronjobs/*' \
        -o -path '*/batch/cronjobs.yaml' \
        -o -path '*/core/replicationcontrollers/*' \
        -o -path '*/core/replicationcontrollers.yaml' \
        -o -path '*/serviceaccounts/*' \
        -o -name 'serviceaccounts.yaml' -path '*/core/*' \
        -o -path '*/secretproviderclasses/*' \
        -o -name 'secretproviderclasses.yaml' \
        -o -path '*/namespaces/openshift-ingress/core/services.yaml' \
        -o -path '*/network_logs/*' \
        -o -name '*.log' \
        -o -name 'event-filter.html' \
        -o -name '*.kubeconfig' \
        -o -name '*.tar' \
        -o -name '*.tar.gz' \
      \) -delete
      # 3. Strip PEM certificate/key blocks, authorization headers, bearer tokens,
      #    JWTs, cloud access keys, and long encoded/token-like values from the
      #    remaining text files.
      find "${DUMP_WORK_DIR}/output" -type f -exec sed -i.bak -E \
        -e '/-----BEGIN [A-Z0-9 ]+-----/,/-----END [A-Z0-9 ]+-----/d' \
        -e 's/^([[:space:]]*(-[[:space:]]+)?"?authorization"?[[:space:]]*:[[:space:]]*)[^[:space:]#|>].*/\1"REDACTED"/I' \
        -e 's|[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+[A-Za-z0-9._~+/=-]+|Bearer REDACTED|g' \
        -e 's|eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_.-]*|REDACTED_JWT|g' \
        -e 's#(AKIA|ASIA)[0-9A-Z]{16}#REDACTED_AWS_ACCESS_KEY#g' \
        -e 's|[A-Za-z0-9+/]{32,}={0,2}|REDACTED_BASE64|g' \
        -e 's|[A-Za-z0-9._-]{32,}|REDACTED_TOKEN|g' \
        {} +
      # Also redact short scalar credentials in the remaining resource YAML,
      # including mapping entries inside lists; entropy-based matching alone can
      # miss short client secrets and passwords.
      find "${DUMP_WORK_DIR}/output" -type f \( -name '*.yaml' -o -name '*.yml' \) -exec sed -i.bak -E \
        -e 's/^([[:space:]]*(-[[:space:]]+)?"?[[:alnum:]_.-]*(password|passwd|passphrase|token|secret|credential|private[_-]?key|api[_-]?key|access[_-]?key|shared[_-]?key|authorization|bearertoken)[[:alnum:]_.-]*"?[[:space:]]*:[[:space:]]*)[^[:space:]#|>].*/\1"REDACTED"/I' \
        {} +
      find "${DUMP_WORK_DIR}/output" -type f -name '*.bak' -delete
      # Redact the contents of block-style credential values without leaving
      # orphaned YAML indentation or changing the surrounding resource shape.
      while IFS= read -r -d '' file; do
        awk '
          BEGIN { block_indent = -1 }
          function indentation(line, position) {
            position = match(line, /[^[:space:]]/)
            return position == 0 ? 0 : position - 1
          }
          function key_indentation(line, position, remainder, key_position) {
            position = match(line, /[^[:space:]]/)
            if (position == 0) return 0
            if (substr(line, position, 1) == "-") {
              remainder = substr(line, position + 1)
              key_position = match(remainder, /[^[:space:]]/)
              if (key_position > 0) return position + key_position - 1
            }
            return position - 1
          }
          function is_credential_key(line, colon, key) {
            colon = index(line, ":")
            if (colon == 0) return 0
            key = substr(line, 1, colon - 1)
            sub(/^[[:space:]]*(-[[:space:]]+)?/, "", key)
            key = tolower(key)
            return key ~ /(password|passwd|passphrase|token|secret|credential|private[_-]?key|api[_-]?key|access[_-]?key|shared[_-]?key|authorization|bearertoken)/
          }
          function is_block_scalar(line, colon, value) {
            colon = index(line, ":")
            if (colon == 0) return 0
            value = substr(line, colon + 1)
            sub(/^[[:space:]]*/, "", value)
            return value ~ /^[|>][+-]?[0-9]?[+-]?[[:space:]]*(#.*)?$/
          }
          {
            if (block_indent >= 0) {
              if ($0 ~ /^[[:space:]]*$/) next
              if (indentation($0) > block_indent) next
              block_indent = -1
            }
            if (is_credential_key($0) && is_block_scalar($0)) {
              block_indent = key_indentation($0)
              sub(/:[[:space:]]*[|>].*$/, ": \"REDACTED\"")
              print
              next
            }
            print
          }
        ' "$file" > "${file}.redacted"
        mv "${file}.redacted" "$file"
      done < <(find "${DUMP_WORK_DIR}/output" -type f \( -name '*.yaml' -o -name '*.yml' \) -print0)
      find "${DUMP_WORK_DIR}/output" -mindepth 1 -type d -empty -delete

      # oc adm inspect failures are logged but may not fail the dump command.
      # Require at least one collected resource before publishing an archive.
      DIAGNOSTIC_RESOURCE_FILE="$(find "${DUMP_WORK_DIR}/output" -type f \
        \( -path '*/cluster-scoped-resources/*' -o -path '*/namespaced-resources/*' \) \
        -name '*.yaml' -size +0c -print -quit)"
      if [[ -z "${DIAGNOSTIC_RESOURCE_FILE}" ]]; then
        echo "No non-empty diagnostic resource YAML was collected; refusing to publish dump archive" >&2
        exit 1
      fi

      tar -cvzf "${DUMP_WORK_DIR}/artifacts.tar.gz" -C "${DUMP_WORK_DIR}" output
      tar -tzf "${DUMP_WORK_DIR}/artifacts.tar.gz" >/dev/null
      # Publish only the sanitized, verified archive.
      mkdir -p "${ARTIFACT_DIR}"
      mv "${DUMP_WORK_DIR}/artifacts.tar.gz" "${ARTIFACT_DIR}/artifacts.tar.gz"
    credentials:
    - mount_path: /etc/hypershift-kubeconfig
      group: ops/clusters/hypershift-ci-2
      collection: hypershift-team
    - mount_path: /etc/hypershift-kubeconfig-azure
      group: ops/clusters/azure-hypershift-ci
      collection: hypershift-team
    from_image:
      namespace: hypershift
      name: hypershift-operator
      tag: latest
    grace_period: 15m0s
    resources:
      requests:
        cpu: 100m
  - ref: hypershift-dump-extra
  - as: destroy-management-cluster
    cli: latest
    env:
      - name: HYPERSHIFT_NAMESPACE
        default: "clusters"
        documentation: "The Namespace where to create the HostedCluster and NodePools"
      - name: HYPERSHIFT_GUEST_INFRA_OCP_ACCOUNT
        default: "false"
        documentation: "Whether to use the generic CI account or the HyperShift OSD account for the guest clusters infra. For the infra created for the clusters. E.g. For cluster-bot we use the generic CI account"
      - name: HYPERSHIFT_BASE_DOMAIN
        default: ""
        documentation: "The cluster's FQDN will be a subdomain of the base domain."
      - name: HYPERSHIFT_AZURE_LOCATION
        default: "centralus"
        documentation: "The Azure location for the cluster (only used when CLOUD_PROVIDER=Azure)"
      - name: CLOUD_PROVIDER
        default: "AWS"
        documentation: "The cloud provider to use for the management cluster"
    commands: |-
      # Set cloud-specific defaults
      if [[ "${CLOUD_PROVIDER}" == "Azure" ]]; then
        export KUBECONFIG=/etc/hypershift-kubeconfig-azure/hypershift-ops-admin.kubeconfig
        AZURE_GUEST_INFRA_CREDENTIALS_FILE="/etc/hypershift-ci-jobs-self-managed-azure/credentials.json"
        DEFAULT_BASE_DOMAIN=hypershift.azure.devcluster.openshift.com
      else
        AWS_GUEST_INFRA_CREDENTIALS_FILE="/etc/hypershift-ci-jobs-awscreds/credentials"
        DEFAULT_BASE_DOMAIN=ci.hypershift.devcluster.openshift.com
        export KUBECONFIG=/etc/hypershift-kubeconfig/hypershift-ops-admin.kubeconfig

        if [[ $HYPERSHIFT_GUEST_INFRA_OCP_ACCOUNT == "true" ]]; then
          AWS_GUEST_INFRA_CREDENTIALS_FILE="${CLUSTER_PROFILE_DIR}/.awscred"
          DEFAULT_BASE_DOMAIN=origin-ci-int-aws.dev.rhcloud.com
        fi
      fi

      DOMAIN=${HYPERSHIFT_BASE_DOMAIN:-$DEFAULT_BASE_DOMAIN}
      CLUSTER_NAME="$(echo -n $PROW_JOB_ID|sha256sum|cut -c-10)-mgmt"

      # Destroy the management cluster based on cloud provider
      if [[ "${CLOUD_PROVIDER}" == "Azure" ]]; then
        echo "Destroying Azure management cluster ${CLUSTER_NAME}"
        bin/hypershift destroy cluster azure \
          --azure-creds=${AZURE_GUEST_INFRA_CREDENTIALS_FILE} \
          --name="${CLUSTER_NAME}" \
          --namespace="${HYPERSHIFT_NAMESPACE}" \
          --location=${HYPERSHIFT_AZURE_LOCATION} \
          --dns-zone-rg-name=os4-common \
          --cluster-grace-period 40m
      else
        echo "Destroying AWS management cluster ${CLUSTER_NAME}"
        bin/hypershift destroy cluster aws \
          --aws-creds=${AWS_GUEST_INFRA_CREDENTIALS_FILE} \
          --name="${CLUSTER_NAME}" \
          --namespace="${HYPERSHIFT_NAMESPACE}" \
          --infra-id=${CLUSTER_NAME} \
          --base-domain=${DOMAIN} \
          --cluster-grace-period 40m
      fi
    credentials:
    - mount_path: /etc/hypershift-ci-jobs-awscreds
      group: ops/hypershift-ci-jobs-awscreds
      collection: hypershift-team
    - mount_path: /etc/hypershift-kubeconfig
      group: ops/clusters/hypershift-ci-2
      collection: hypershift-team
    - mount_path: /etc/hypershift-kubeconfig-azure
      group: ops/clusters/azure-hypershift-ci
      collection: hypershift-team
    - mount_path: /etc/hypershift-ci-jobs-self-managed-azure
      group: ops/hypershift-ci-jobs-self-managed-azure
      collection: hypershift-team
    from_image:
      namespace: hypershift
      name: hypershift-operator
      tag: latest
    grace_period: 15m0s
    resources:
      requests:
        cpu: 100m
