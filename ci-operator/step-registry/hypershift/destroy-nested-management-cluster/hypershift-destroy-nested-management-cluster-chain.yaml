chain:
  as: hypershift-destroy-nested-management-cluster
  steps:
  - as: dump-management-cluster
    optional_on_success: true
    cli: latest
    env:
    - name: HYPERSHIFT_NAMESPACE
      default: "clusters"
      documentation: "The Namespace where to create the HostedCluster and NodePools"
    - name: CLOUD_PROVIDER
      default: "AWS"
      documentation: "The cloud provider of the cluster."
    commands: |-
      # Set cloud-specific kubeconfig
      if [[ "${CLOUD_PROVIDER}" == "Azure" ]]; then
        export KUBECONFIG=/etc/hypershift-kubeconfig-azure/hypershift-ops-admin.kubeconfig
      else
        export KUBECONFIG=/etc/hypershift-kubeconfig/hypershift-ops-admin.kubeconfig
      fi

      # Fail fast so only a fully sanitized and verified archive is published.
      set -e

      CLUSTER_NAME="$(echo -n $PROW_JOB_ID|sha256sum|cut -c-10)-mgmt"
      # Keep raw dump files outside ARTIFACT_DIR until sanitization and archive
      # verification succeed.
      DUMP_WORK_DIR="$(mktemp -d /tmp/hypershift-dump.XXXXXX)"
      trap 'rm -rf -- "${DUMP_WORK_DIR}"' EXIT
      mkdir -p "${DUMP_WORK_DIR}/output"
      # --archive-dump=false: skip creating hypershift-dump.tar.gz inside the output
      # dir; sed cannot redact inside a compressed archive and leaktk/gcs-filter
      # would match secrets embedded in it. The shell tar below archives instead.
      bin/hypershift dump cluster --dump-guest-cluster=true --archive-dump=false --artifact-dir="${DUMP_WORK_DIR}/output" --name="${CLUSTER_NAME}" --namespace="${HYPERSHIFT_NAMESPACE}"

      # Redact sensitive data before archiving and upload (OCPBUGS-84684, OCPBUGS-109626).
      #
      # 1. Delete Secret resource YAMLs — their base64-encoded .data fields trigger
      #    gitleaks generic-api-key / private-key rules. oc adm inspect writes them
      #    under <namespace>/core/secrets/.
      find "${DUMP_WORK_DIR}/output" -type f \( -path '*/secrets/*' -o -name 'secrets.yaml' -path '*/core/*' \) -delete
      # 2. Remove resource classes with opaque data that may contain credentials.
      # Keep pod/workload/event YAML and logs for debugging; credential-bearing
      # values in those diagnostics are redacted below.
      find "${DUMP_WORK_DIR}/output" -type f \( \
        -path '*/configmaps/*' \
        -o -path '*/core/configmaps.yaml' \
        -o -path '*/serviceaccounts/*' \
        -o -name 'serviceaccounts.yaml' -path '*/core/*' \
        -o -path '*/secretproviderclasses/*' \
        -o -name 'secretproviderclasses.yaml' \
        -o -path '*/network_logs/*' \
        -o -name '*.kubeconfig' \
        -o -name '*.tar' \
        -o -name '*.tar.gz' \
        -o -name '*.tgz' \
        -o -name '*.zip' \
        -o -name '*.gz' \
        -o -name '*.bz2' \
        -o -name '*.xz' \
        -o -name '*.zst' \
        -o -name '*.7z' \
        -o -name '*.rar' \
      \) -delete
      # 3. Replace PEM blocks without changing the quoting or markup around them.
      # Keep working on the private dump directory; nothing is published if a
      # sanitizer command or file discovery fails.
      find "${DUMP_WORK_DIR}/output" -type f -exec sed -i.bak -E \
        -e 's/-----BEGIN [A-Z0-9 ]+-----.*-----END [A-Z0-9 ]+-----/REDACTED_PEM/g' \
        -e '/-----BEGIN [A-Z0-9 ]+-----/,/-----END [A-Z0-9 ]+-----/d' \
        {} +
      find "${DUMP_WORK_DIR}/output" -type f -name '*.bak' -delete

      # Discover the complete text-file set synchronously. Process substitution
      # hides find's exit status and could otherwise publish unsanitized files.
      TEXT_FILE_LIST="${DUMP_WORK_DIR}/text-files.list"
      if ! find "${DUMP_WORK_DIR}/output" -type f \( \
        -name '*.yaml' -o -name '*.yml' -o -name '*.json' -o -name '*.jsonl' \
        -o -name '*.log' -o -name '*.txt' -o -name '*.xml' -o -name '*.csv' \
        -o -name '*.out' -o -name '*.conf' -o -name '*.ini' -o -name '*.properties' \
        -o -name '*.html' -o -name '*.htm' \
      \) -print0 > "${TEXT_FILE_LIST}"; then
        echo "Failed to enumerate diagnostic files for sanitization; refusing to publish dump archive" >&2
        exit 1
      fi

      while IFS= read -r -d '' file; do
        [[ -f "${file}" ]] || { echo "Diagnostic file disappeared during sanitization: ${file}" >&2; exit 1; }
        case "${file##*.}" in
          yaml|yml) FORMAT=yaml ;;
          json|jsonl) FORMAT=json ;;
          html|htm) FORMAT=html ;;
          *) FORMAT=text ;;
        esac
        awk -v format="${FORMAT}" -f - "${file}" > "${file}.redacted" <<'AWK'
        BEGIN {
          single_quote = sprintf("%c", 39)
          credential_stems = "password|passwd|passphrase|token|credential|credentials|client[_-]?secret|secret[_-]?key|secret|private[_-]?key|client[_-]?key|api[_-]?key|access[_-]?key|shared[_-]?key|authorization|bearer[_-]?token|kubeconfig"
          field_pattern = "(^|[^[:alnum:]_.-])([\"|" single_quote "])?[[:alnum:]_.-]*(" credential_stems ")([\"|" single_quote "])?[[:space:]]*[:=][[:space:]]*"
          flag_pattern = "(^|[[:space:]])--?[[:alnum:]_-]*(" credential_stems ")[[:alnum:]_-]*[[:space:]]+"
          block_indent = -1
          quoted_indent = -1
          env_indent = -1
          env_list_indent = -1
          env_item_key_indent = -1
          env_item_count = 0
        }
        function trim(value) {
          sub(/^[[:space:]]+/, "", value)
          sub(/[[:space:]]+$/, "", value)
          return value
        }
        function indentation(line, position) {
          position = match(line, /[^[:space:]]/)
          return position == 0 ? length(line) : position - 1
        }
        function find_quote_end(value, start, quote, i, character) {
          for (i = start + 1; i <= length(value); i++) {
            character = substr(value, i, 1)
            if (quote == "\"" && character == "\\") {
              i++
              continue
            }
            if (character == quote) {
              if (quote == single_quote && substr(value, i + 1, 1) == single_quote) {
                i++
                continue
              }
              return i
            }
          }
          return 0
        }
        function quote_context(line, position, format, quote, i, character) {
          if (format != "yaml" && format != "json") return ""
          quote = ""
          for (i = 1; i < position; i++) {
            character = substr(line, i, 1)
            if (quote == "\"" && character == "\\") {
              i++
              continue
            }
            if (quote == single_quote && character == single_quote && substr(line, i + 1, 1) == single_quote) {
              i++
              continue
            }
            if (character == "\"" || character == single_quote) {
              if (quote == "") quote = character
              else if (quote == character) quote = ""
            }
          }
          return quote
        }
        function parse_mapping(line, text, position, quote, end, colon, next_character, key) {
          mapping_key = ""
          mapping_key_indent = -1
          mapping_value_start = 0
          position = 1
          while (substr(line, position, 1) ~ /[[:space:]]/ && position <= length(line)) position++
          if (substr(line, position, 1) == "-" && substr(line, position + 1, 1) ~ /[[:space:]]/) {
            position++
            while (substr(line, position, 1) ~ /[[:space:]]/ && position <= length(line)) position++
          }
          mapping_key_indent = position - 1
          quote = substr(line, position, 1)
          if (quote == "\"" || quote == single_quote) {
            end = find_quote_end(line, position, quote)
            if (end == 0) return 0
            key = substr(line, position + 1, end - position - 1)
            colon = end + 1
            while (substr(line, colon, 1) ~ /[[:space:]]/ && colon <= length(line)) colon++
            if (substr(line, colon, 1) != ":") return 0
          } else {
            colon = index(substr(line, position), ":")
            if (colon == 0) return 0
            colon += position - 1
            key = trim(substr(line, position, colon - position))
            if (key == "") return 0
          }
          mapping_key = tolower(trim(key))
          mapping_value_start = colon + 1
          while (substr(line, mapping_value_start, 1) ~ /[[:space:]]/ && mapping_value_start <= length(line)) mapping_value_start++
          return 1
        }
        function unquote(value, quote, end) {
          value = trim(value)
          quote = substr(value, 1, 1)
          if (quote == "\"" || quote == single_quote) {
            end = find_quote_end(value, 1, quote)
            if (end > 0) return substr(value, 2, end - 2)
          }
          sub(/[[:space:]]+#.*$/, "", value)
          return trim(value)
        }
        function is_credential_name(value) {
          return tolower(value) ~ ("(" credential_stems ")$")
        }
        function is_uuid(value) {
          return length(value) == 36 && \
            substr(value, 9, 1) == "-" && substr(value, 14, 1) == "-" && \
            substr(value, 19, 1) == "-" && substr(value, 24, 1) == "-" && \
            substr(value, 1, 8) ~ /^[[:xdigit:]]+$/ && \
            substr(value, 10, 4) ~ /^[[:xdigit:]]+$/ && \
            substr(value, 15, 4) ~ /^[[:xdigit:]]+$/ && \
            substr(value, 20, 4) ~ /^[[:xdigit:]]+$/ && \
            substr(value, 25, 12) ~ /^[[:xdigit:]]+$/
        }
        function is_resource_identifier(value, line, start, prefix) {
          if (value !~ /^[a-z0-9]+(-[a-z0-9]+)+$/) return 0
          prefix = tolower(substr(line, 1, start - 1))
          gsub(/[\"']/, "", prefix)
          if (prefix ~ /(^|[^[:alnum:]_])(name|namespace|kind|resource|api[-_]?version|group|uid)[[:space:]]*:[[:space:]]*$/) return 1
          return prefix ~ /\/(namespaces|pods|nodes|services|endpoints|deployments|statefulsets|daemonsets|hostedclusters|nodepools|machines|machinepools|projects|routes|ingresses)\/$/
        }
        function entropy(value, counts, i, character, probability, total, result) {
          for (character in counts) delete counts[character]
          total = length(value)
          for (i = 1; i <= total; i++) counts[substr(value, i, 1)]++
          result = 0
          for (character in counts) {
            probability = counts[character] / total
            result -= probability * log(probability) / log(2)
          }
          return result
        }
        function is_hash_value(token, prefix) {
          if ((length(token) != 40 && length(token) != 64) || token !~ /^[[:xdigit:]]+$/) return 0
          prefix = tolower(substr(current_line, 1, current_token_start - 1))
          if (prefix ~ /(sha1|sha256|digest)[[:space:]]*[:=][[:space:]]*[\"' ]*$/) return 1
          return prefix ~ /(git[-_]?commit|commit|revision|rev|commit[-_]?sha)[\"' ]*[[:space:]]*:[[:space:]]*[\"' ]*$/
        }
        function is_mapping_key_token(line, start, token, suffix) {
          suffix = substr(line, start + length(token))
          return suffix ~ /^[\"'[:space:]]*:/
        }
        function is_base64_boundary(character) {
          return character == "" || character ~ /[[:space:]\"'=:,;(){}\[\]]/
        }
        # Handle base64-specific characters inside the token redactor rather
        # than applying a broad replacement before commit/digest recognition.
        function redact_opaque_tokens(line, lower, output, i, start, token, character, before, padding, base64_shaped, scan) {
          current_line = line
          lower = tolower(line)
          output = ""
          i = 1
          while (i <= length(line)) {
            character = substr(line, i, 1)
            before = i == 1 ? "" : substr(line, i - 1, 1)
            if (character ~ /[A-Za-z0-9+]/ && is_base64_boundary(before)) {
              start = i
              while (i <= length(line) && substr(line, i, 1) ~ /[A-Za-z0-9+\/]/) i++
              padding = 0
              while (padding < 2 && substr(line, i, 1) == "=") { i++; padding++ }
              token = substr(line, start, i - start)
              base64_shaped = index(token, "/") > 0 || index(token, "+") > 0 || padding > 0
              if (base64_shaped) {
                current_token_start = start
                if (length(token) >= 32 && entropy(token) >= 3.5 && \
                    !is_uuid(token) && !is_resource_identifier(token, line, start) && !is_hash_value(token)) {
                  output = output "REDACTED_BASE64"
                } else {
                  output = output token
                }
              } else {
                i = start
                while (i <= length(line) && substr(line, i, 1) ~ /[[:alnum:]_~+-]/) i++
                token = substr(line, start, i - start)
                current_token_start = start
                output = output (length(token) >= 24 && !is_uuid(token) && !is_resource_identifier(token, line, start) && \
                  !is_mapping_key_token(line, start, token) && !is_hash_value(token) && entropy(token) >= 3.5 ? "REDACTED_HIGH_ENTROPY" : token)
              }
            } else if (character ~ /[[:alnum:]_~+-]/) {
              start = i
              while (i <= length(line) && substr(line, i, 1) ~ /[[:alnum:]_~+-]/) i++
              token = substr(line, start, i - start)
              current_token_start = start
              output = output (length(token) >= 24 && !is_uuid(token) && !is_resource_identifier(token, line, start) && !is_mapping_key_token(line, start, token) && \
                !is_hash_value(token) && entropy(token) >= 3.5 ? "REDACTED_HIGH_ENTROPY" : token)
            } else {
              output = output character
              i++
            }
          }
          return output
        }
        function redact_url_userinfo(line, lower, output, offset, start, authority, end, at, i, character) {
          lower = tolower(line)
          output = ""
          offset = 1
          while (offset <= length(line) && match(substr(lower, offset), /[a-z][a-z0-9+.-]*:\/\//)) {
            start = offset + RSTART - 1
            authority = start + RLENGTH
            end = authority
            while (end <= length(line)) {
              character = substr(line, end, 1)
              if (character ~ /[[:space:]\/?#\"<>]/ || character == single_quote) break
              end++
            }
            at = 0
            for (i = authority; i < end; i++) if (substr(line, i, 1) == "@") at = i
            if (at > authority) {
              output = output substr(line, offset, authority - offset) "REDACTED@"
              offset = at + 1
            } else {
              output = output substr(line, offset, end - offset)
              offset = end
            }
          }
          return output substr(line, offset)
        }
        function redact_bearer(line, lower, output, offset, start, size) {
          lower = tolower(line)
          output = ""
          offset = 1
          while (offset <= length(line) && match(substr(lower, offset), /bearer[[:space:]]+[a-z0-9._~+\/=\-]+/)) {
            start = offset + RSTART - 1
            size = RLENGTH
            output = output substr(line, offset, start - offset) "Bearer REDACTED"
            offset = start + size
          }
          return output substr(line, offset)
        }
        function redact_aws_keys(line, upper, output, i, token, before, after) {
          upper = toupper(line)
          output = ""
          i = 1
          while (i <= length(line)) {
            token = substr(upper, i, 4)
            before = i == 1 ? "" : substr(upper, i - 1, 1)
            after = substr(upper, i + 20, 1)
            if ((token == "AKIA" || token == "ASIA") && before !~ /[[:alnum:]]/ && \
                substr(upper, i + 4, 16) ~ /^[A-Z0-9]+$/ && length(substr(upper, i + 4, 16)) == 16 && after !~ /[[:alnum:]]/) {
              output = output substr(line, 1, 0) "REDACTED_AWS_ACCESS_KEY"
              i += 20
            } else {
              output = output substr(line, i, 1)
              i++
            }
          }
          return output
        }
        function redact_scalar(line, value_start, format, direct, key_indent, output, value, quote, end, context, i, comment) {
          scalar_end = value_start - 1
          if (value_start > length(line)) {
            if (direct && format == "yaml") block_indent = key_indent
            scalar_end = length(line)
            return "\"REDACTED\""
          }
          value = substr(line, value_start)
          quote = substr(line, value_start, 1)
          if (format == "yaml" && direct && value ~ /^[|>][+-]?[0-9]?[+-]?[[:space:]]*(#.*)?$/) {
            block_indent = key_indent
            comment = index(value, "#")
            scalar_end = length(line)
            return "\"REDACTED\"" (comment > 0 ? " " substr(value, comment) : "")
          }
          if (quote == "\"" || quote == single_quote) {
            end = find_quote_end(line, value_start, quote)
            if (end > 0) {
              scalar_end = end
              return quote "REDACTED" quote
            }
            if (direct && format == "yaml") {
              quoted_indent = key_indent
              quoted_character = quote
              scalar_end = length(line)
              return quote "REDACTED" quote
            }
            scalar_end = length(line)
            return quote "REDACTED" quote
          }
          context = quote_context(line, value_start - 1, format)
          if (context != "") {
            end = 0
            if (substr(line, value_start, 1) == "\\" && substr(line, value_start + 1, 1) == context) {
              for (i = value_start + 2; i < length(line); i++) {
                if (substr(line, i, 1) == "\\" && substr(line, i + 1, 1) == context) { end = i + 1; break }
              }
              if (end > 0) {
                scalar_end = end
                return "\\" context "REDACTED\\" context
              }
            }
            for (i = value_start; i <= length(line); i++) {
              if (substr(line, i, 1) == "\\" && context == "\"") { i++; continue }
              if (substr(line, i, 1) == context || substr(line, i, 1) ~ /[[:space:],;&|>]/) { end = i; break }
            }
            if (end > 0) {
              scalar_end = end - 1
              return "REDACTED"
            }
          }
          if (format == "yaml" && direct) {
            block_indent = key_indent
            comment = 0
            for (i = value_start; i <= length(line); i++) {
              if (substr(line, i, 1) == "#" && (i == value_start || substr(line, i - 1, 1) ~ /[[:space:]]/)) { comment = i; break }
            }
            scalar_end = length(line)
            if (comment > 0) return "\"REDACTED\" " substr(line, comment)
            return "\"REDACTED\""
          }
          if (format == "json") {
            for (i = value_start; i <= length(line); i++) if (substr(line, i, 1) == "," || substr(line, i, 1) == "}" || substr(line, i, 1) == "]") break
          } else if (format == "text" && tolower(substr(line, 1, value_start - 1)) ~ /^[[:space:]]*authorization[[:space:]]*[:=][[:space:]]*$/) {
            i = length(line) + 1
          } else if (format == "html" && tolower(substr(line, 1, value_start - 1)) ~ /(^|[>[:space:]])authorization[[:space:]]*[:=][[:space:]]*$/) {
            for (i = value_start; i <= length(line); i++) if (substr(line, i, 1) == "<") break
          } else {
            for (i = value_start; i <= length(line); i++) if (substr(line, i, 1) ~ /[[:space:],;&|>]/) break
          }
          if (i <= value_start) i = value_start + 1
          scalar_end = i - 1
          return "REDACTED"
        }
        function redact_fields(line, format, force, output, lower, offset, start, size, value_start, context, quote, end, direct, key_indent, local_key, local_value_start, value, position, value_prefix, relative, field_start, field_size, flag_start, flag_size, delimiter, character) {
          if (force && format == "yaml" && parse_mapping(line)) {
            value_prefix = substr(line, 1, mapping_value_start - 1)
            if (substr(line, mapping_value_start - 1, 1) == ":") value_prefix = value_prefix " "
            output = value_prefix redact_scalar(line, mapping_value_start, format, 1, mapping_key_indent)
            return output substr(line, scalar_end + 1)
          }
          output = ""
          lower = tolower(line)
          offset = 1
          direct = 0
          key_indent = -1
          if (format == "yaml" && parse_mapping(line) && is_credential_name(mapping_key)) {
            local_key = mapping_key
            local_value_start = mapping_value_start
            key_indent = mapping_key_indent
          }
          while (offset <= length(line)) {
            relative = substr(lower, offset)
            field_start = 0
            field_size = 0
            flag_start = 0
            flag_size = 0
            if (match(relative, field_pattern)) {
              field_start = offset + RSTART - 1
              field_size = RLENGTH
            }
            if (match(relative, flag_pattern)) {
              flag_start = offset + RSTART - 1
              flag_size = RLENGTH
            }
            if (field_start == 0 && flag_start == 0) break
            if (field_start > 0 && (flag_start == 0 || field_start <= flag_start)) {
              start = field_start
              size = field_size
            } else {
              start = flag_start
              size = flag_size
            }
            value_start = start + size
            direct = format == "yaml" && key_indent >= 0 && start <= local_value_start
            context = quote_context(line, start + ((substr(line, start, 1) == "\"" || substr(line, start, 1) == single_quote) ? 1 : 0), format)
            quote = substr(line, value_start, 1)
            value_prefix = substr(line, offset, value_start - offset)
            if (direct && substr(line, value_start - 1, 1) == ":") value_prefix = value_prefix " "
            if (quote == "\"" || quote == single_quote) {
              end = find_quote_end(line, value_start, quote)
              if (end == 0 && direct) {
                output = output value_prefix quote "REDACTED" quote
                quoted_indent = key_indent
                quoted_character = quote
                return output
              }
              if (end > 0) {
                output = output value_prefix quote "REDACTED" quote
                if (direct) block_indent = key_indent
                offset = end + 1
                continue
              }
            }
            if (context != "") {
              end = 0
              if (substr(line, value_start, 1) == "\\" && substr(line, value_start + 1, 1) == context) {
                for (position = value_start + 2; position < length(line); position++) {
                  if (substr(line, position, 1) == "\\" && substr(line, position + 1, 1) == context) { end = position + 1; break }
                }
                if (end > 0) {
                  output = output value_prefix "\\" context "REDACTED\\" context
                  offset = end + 1
                  continue
                }
              }
              for (position = value_start; position <= length(line); position++) {
                character = substr(line, position, 1)
                if (character == "\\" && context == "\"") { position++; continue }
                if (character == context || character ~ /[[:space:],;&|>]/) { end = position; break }
              }
              if (end > 0) {
                output = output value_prefix "REDACTED"
                offset = end
                continue
              }
            }
            value = substr(line, value_start)
            output = output value_prefix redact_scalar(line, value_start, format, direct, key_indent)
            offset = scalar_end + 1
            if (offset > length(line)) return output
          }
          return output substr(line, offset)
        }
        function redact_flow_object(object, lower, start, pair_start, i, character, quote, depth, colon, key, value, name, value_start, value_end, end, output) {
          lower = tolower(object)
          name = ""
          value_start = 0
          value_end = 0
          quote = ""
          depth = 0
          pair_start = 2
          for (i = 2; i <= length(object); i++) {
            character = substr(object, i, 1)
            if (quote == "\"" && character == "\\") { i++; continue }
            if (character == "\"" || character == single_quote) {
              if (quote == "") quote = character
              else if (quote == character) quote = ""
              continue
            }
            if (quote != "") continue
            if (character == "{" || character == "[") depth++
            else if (character == "}" || character == "]") depth--
            if ((character == "," && depth == 0) || i == length(object)) {
              end = character == "," ? i - 1 : i - (character == "}" ? 1 : 0)
              colon = index(substr(object, pair_start, end - pair_start + 1), ":")
              if (colon > 0) {
                colon += pair_start - 1
                key = trim(substr(object, pair_start, colon - pair_start))
                gsub(/^[\"'[:space:]]+|[\"'[:space:]]+$/, "", key)
                value = substr(object, colon + 1, end - colon)
                if (tolower(key) == "name") name = unquote(value)
                if (tolower(key) == "value") {
                  value_start = colon + 1
                  while (substr(object, value_start, 1) ~ /[[:space:]]/ && value_start <= end) value_start++
                  value_end = end
                  while (value_end >= value_start && substr(object, value_end, 1) ~ /[[:space:]]/) value_end--
                }
              }
              pair_start = i + 1
            }
          }
          if (!is_credential_name(name) || value_start == 0) return object
          value = substr(object, value_start, value_end - value_start + 1)
          quote = substr(value, 1, 1)
          if (quote == "\"" || quote == single_quote) value = quote "REDACTED" quote
          else value = "REDACTED"
          return substr(object, 1, value_start - 1) value substr(object, value_end + 1)
        }
        function redact_env_objects(line, lower, output, offset, env_position, colon, start, end, i, quote, character, depth, object, replacement) {
          lower = tolower(line)
          env_position = index(lower, "env:")
          if (env_position == 0) {
            env_position = index(lower, "\"env\"")
            if (env_position == 0) env_position = index(lower, "'env'")
          }
          if (env_position == 0 && env_indent < 0) return line
          output = env_position > 0 ? substr(line, 1, env_position - 1) : ""
          offset = env_position > 0 ? env_position : 1
          while (offset <= length(line)) {
            start = index(substr(line, offset), "{")
            if (start == 0) break
            start += offset - 1
            quote = ""
            depth = 0
            end = 0
            for (i = start; i <= length(line); i++) {
              character = substr(line, i, 1)
              if (quote == "\"" && character == "\\") { i++; continue }
              if (character == "\"" || character == single_quote) {
                if (quote == "") quote = character
                else if (quote == character) quote = ""
                continue
              }
              if (quote != "") continue
              if (character == "{") depth++
              else if (character == "}") {
                depth--
                if (depth == 0) { end = i; break }
              }
            }
            if (end == 0) break
            object = substr(line, start, end - start + 1)
            replacement = redact_flow_object(object)
            output = output substr(line, offset, start - offset) replacement
            offset = end + 1
          }
          return output substr(line, offset)
        }
        function flow_list_item(line, indent) {
          indent = indentation(line)
          return substr(line, indent + 1, 1) == "-" && substr(line, indent + 2, 1) ~ /[[:space:]\{]/
        }
        function process_line(line, force, output) {
          output = redact_url_userinfo(line)
          output = redact_bearer(output)
          output = redact_aws_keys(output)
          if (force) output = redact_fields(output, format, 1)
          else output = redact_fields(output, format, 0)
          output = redact_env_objects(output)
          print redact_opaque_tokens(output)
        }
        function flush_env_item(i, name, value_line, key, value, value_indent) {
          name = ""
          value_line = 0
          for (i = 1; i <= env_item_count; i++) {
            if (parse_mapping(env_item[i]) && mapping_key_indent == env_item_key_indent) {
              if (mapping_key == "name") name = unquote(substr(env_item[i], mapping_value_start))
              else if (mapping_key == "value") value_line = i
            }
          }
          i = 1
          while (i <= env_item_count) {
            if (is_credential_name(name) && i == value_line) {
              value_indent = mapping_key_indent
              process_line(env_item[i], 1)
              i++
              while (i <= env_item_count && \
                  (env_item[i] ~ /^[[:space:]]*$/ || indentation(env_item[i]) > value_indent)) i++
              continue
            }
            process_line(env_item[i], 0)
            i++
          }
          for (i = 1; i <= env_item_count; i++) delete env_item[i]
          env_item_count = 0
          env_item_key_indent = -1
        }
        {
          current_indent = indentation($0)
          if (block_indent >= 0) {
            if ($0 ~ /^[[:space:]]*$/ || current_indent > block_indent) next
            block_indent = -1
          }
          if (quoted_indent >= 0) {
            if ($0 ~ /^[[:space:]]*$/ || current_indent > quoted_indent) {
              if (find_quote_end($0, 1, quoted_character) > 0) {
                quoted_indent = -1
                quoted_character = ""
              }
              next
            }
            quoted_indent = -1
            quoted_character = ""
          }
          if (format == "yaml" && env_indent >= 0) {
            if ($0 !~ /^[[:space:]]*$/ && $0 !~ /^[[:space:]]*#/ && \
                (current_indent < env_indent || (current_indent == env_indent && !flow_list_item($0)))) {
              flush_env_item()
              env_indent = -1
              env_list_indent = -1
            } else if (flow_list_item($0) && current_indent >= env_indent) {
              if (env_item_count > 0 && current_indent == env_list_indent) flush_env_item()
              if (env_item_count == 0) {
                env_list_indent = current_indent
                if (parse_mapping($0)) env_item_key_indent = mapping_key_indent
              }
              if (substr($0, current_indent + 2, 1) == "{") {
                process_line($0, 0)
                next
              }
              env_item[++env_item_count] = $0
              next
            } else if (env_item_count > 0) {
              env_item[++env_item_count] = $0
              next
            }
          }
          if (format == "yaml" && env_indent < 0 && parse_mapping($0) && mapping_key == "env" && \
              (mapping_value_start > length($0) || substr($0, mapping_value_start, 1) == "#")) {
            process_line($0, 0)
            env_indent = mapping_key_indent
            env_list_indent = -1
            next
          }
          process_line($0, 0)
        }
        END {
          if (env_item_count > 0) flush_env_item()
        }
      AWK
        mv "${file}.redacted" "${file}"
      done < "${TEXT_FILE_LIST}"
      find "${DUMP_WORK_DIR}/output" -mindepth 1 -type d -empty -delete

      # oc adm inspect failures are logged but may not fail the dump command.
      # Require at least one collected resource before publishing an archive.
      DIAGNOSTIC_RESOURCE_FILE="$(find "${DUMP_WORK_DIR}/output" -type f \
        \( -path '*/cluster-scoped-resources/*' -o -path '*/namespaces/*' \) \
        -name '*.yaml' -size +0c -print -quit)"
      if [[ -z "${DIAGNOSTIC_RESOURCE_FILE}" ]]; then
        echo "No non-empty diagnostic resource YAML was collected; refusing to publish dump archive" >&2
        exit 1
      fi

      tar -cvzf "${DUMP_WORK_DIR}/artifacts.tar.gz" -C "${DUMP_WORK_DIR}" output
      tar -tzf "${DUMP_WORK_DIR}/artifacts.tar.gz" >/dev/null
      # Publish only the sanitized, verified archive.
      mkdir -p "${ARTIFACT_DIR}"
      mv "${DUMP_WORK_DIR}/artifacts.tar.gz" "${ARTIFACT_DIR}/artifacts.tar.gz"
    credentials:
    - mount_path: /etc/hypershift-kubeconfig
      group: ops/clusters/hypershift-ci-2
      collection: hypershift-team
    - mount_path: /etc/hypershift-kubeconfig-azure
      group: ops/clusters/azure-hypershift-ci
      collection: hypershift-team
    from_image:
      namespace: hypershift
      name: hypershift-operator
      tag: latest
    grace_period: 15m0s
    resources:
      requests:
        cpu: 100m
  - ref: hypershift-dump-extra
  - as: destroy-management-cluster
    cli: latest
    env:
      - name: HYPERSHIFT_NAMESPACE
        default: "clusters"
        documentation: "The Namespace where to create the HostedCluster and NodePools"
      - name: HYPERSHIFT_GUEST_INFRA_OCP_ACCOUNT
        default: "false"
        documentation: "Whether to use the generic CI account or the HyperShift OSD account for the guest clusters infra. For the infra created for the clusters. E.g. For cluster-bot we use the generic CI account"
      - name: HYPERSHIFT_BASE_DOMAIN
        default: ""
        documentation: "The cluster's FQDN will be a subdomain of the base domain."
      - name: HYPERSHIFT_AZURE_LOCATION
        default: "centralus"
        documentation: "The Azure location for the cluster (only used when CLOUD_PROVIDER=Azure)"
      - name: CLOUD_PROVIDER
        default: "AWS"
        documentation: "The cloud provider to use for the management cluster"
    commands: |-
      # Set cloud-specific defaults
      if [[ "${CLOUD_PROVIDER}" == "Azure" ]]; then
        export KUBECONFIG=/etc/hypershift-kubeconfig-azure/hypershift-ops-admin.kubeconfig
        AZURE_GUEST_INFRA_CREDENTIALS_FILE="/etc/hypershift-ci-jobs-self-managed-azure/credentials.json"
        DEFAULT_BASE_DOMAIN=hypershift.azure.devcluster.openshift.com
      else
        AWS_GUEST_INFRA_CREDENTIALS_FILE="/etc/hypershift-ci-jobs-awscreds/credentials"
        DEFAULT_BASE_DOMAIN=ci.hypershift.devcluster.openshift.com
        export KUBECONFIG=/etc/hypershift-kubeconfig/hypershift-ops-admin.kubeconfig

        if [[ $HYPERSHIFT_GUEST_INFRA_OCP_ACCOUNT == "true" ]]; then
          AWS_GUEST_INFRA_CREDENTIALS_FILE="${CLUSTER_PROFILE_DIR}/.awscred"
          DEFAULT_BASE_DOMAIN=origin-ci-int-aws.dev.rhcloud.com
        fi
      fi

      DOMAIN=${HYPERSHIFT_BASE_DOMAIN:-$DEFAULT_BASE_DOMAIN}
      CLUSTER_NAME="$(echo -n $PROW_JOB_ID|sha256sum|cut -c-10)-mgmt"

      # Destroy the management cluster based on cloud provider
      if [[ "${CLOUD_PROVIDER}" == "Azure" ]]; then
        echo "Destroying Azure management cluster ${CLUSTER_NAME}"
        bin/hypershift destroy cluster azure \
          --azure-creds=${AZURE_GUEST_INFRA_CREDENTIALS_FILE} \
          --name="${CLUSTER_NAME}" \
          --namespace="${HYPERSHIFT_NAMESPACE}" \
          --location=${HYPERSHIFT_AZURE_LOCATION} \
          --dns-zone-rg-name=os4-common \
          --cluster-grace-period 40m
      else
        echo "Destroying AWS management cluster ${CLUSTER_NAME}"
        bin/hypershift destroy cluster aws \
          --aws-creds=${AWS_GUEST_INFRA_CREDENTIALS_FILE} \
          --name="${CLUSTER_NAME}" \
          --namespace="${HYPERSHIFT_NAMESPACE}" \
          --infra-id=${CLUSTER_NAME} \
          --base-domain=${DOMAIN} \
          --cluster-grace-period 40m
      fi
    credentials:
    - mount_path: /etc/hypershift-ci-jobs-awscreds
      group: ops/hypershift-ci-jobs-awscreds
      collection: hypershift-team
    - mount_path: /etc/hypershift-kubeconfig
      group: ops/clusters/hypershift-ci-2
      collection: hypershift-team
    - mount_path: /etc/hypershift-kubeconfig-azure
      group: ops/clusters/azure-hypershift-ci
      collection: hypershift-team
    - mount_path: /etc/hypershift-ci-jobs-self-managed-azure
      group: ops/hypershift-ci-jobs-self-managed-azure
      collection: hypershift-team
    from_image:
      namespace: hypershift
      name: hypershift-operator
      tag: latest
    grace_period: 15m0s
    resources:
      requests:
        cpu: 100m
