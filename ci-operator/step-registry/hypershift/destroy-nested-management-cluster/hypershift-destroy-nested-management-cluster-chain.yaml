chain:
  as: hypershift-destroy-nested-management-cluster
  steps:
  - as: dump-management-cluster
    optional_on_success: true
    cli: latest
    env:
    - name: HYPERSHIFT_NAMESPACE
      default: "clusters"
      documentation: "The Namespace where to create the HostedCluster and NodePools"
    - name: CLOUD_PROVIDER
      default: "AWS"
      documentation: "The cloud provider of the cluster."
    commands: |-
      # Set cloud-specific kubeconfig
      if [[ "${CLOUD_PROVIDER}" == "Azure" ]]; then
        export KUBECONFIG=/etc/hypershift-kubeconfig-azure/hypershift-ops-admin.kubeconfig
      else
        export KUBECONFIG=/etc/hypershift-kubeconfig/hypershift-ops-admin.kubeconfig
      fi

      # Fail fast so only a fully sanitized and verified archive is published.
      set -e

      CLUSTER_NAME="$(echo -n $PROW_JOB_ID|sha256sum|cut -c-10)-mgmt"
      # Keep raw dump files outside ARTIFACT_DIR until sanitization and archive
      # verification succeed.
      DUMP_WORK_DIR="$(mktemp -d /tmp/hypershift-dump.XXXXXX)"
      trap 'rm -rf -- "${DUMP_WORK_DIR}"' EXIT
      mkdir -p "${DUMP_WORK_DIR}/output"
      # --archive-dump=false: skip creating hypershift-dump.tar.gz inside the output
      # dir; sed cannot redact inside a compressed archive and leaktk/gcs-filter
      # would match secrets embedded in it. The shell tar below archives instead.
      bin/hypershift dump cluster --dump-guest-cluster=true --archive-dump=false --artifact-dir="${DUMP_WORK_DIR}/output" --name="${CLUSTER_NAME}" --namespace="${HYPERSHIFT_NAMESPACE}"

      # Redact sensitive data before archiving and upload (OCPBUGS-84684, OCPBUGS-109626).
      #
      # 1. Delete Secret resource YAMLs — their base64-encoded .data fields trigger
      #    gitleaks generic-api-key / private-key rules. oc adm inspect writes them
      #    under <namespace>/core/secrets/.
      find "${DUMP_WORK_DIR}/output" -type f \( -path '*/secrets/*' -o -name 'secrets.yaml' -path '*/core/*' \) -delete
      # 2. Remove resource classes with opaque data that may contain credentials.
      # Keep pod/workload/event YAML and logs for debugging; credential-bearing
      # values in those diagnostics are redacted below.
      find "${DUMP_WORK_DIR}/output" -type f \( \
        -path '*/configmaps/*' \
        -o -path '*/core/configmaps.yaml' \
        -o -path '*/serviceaccounts/*' \
        -o -name 'serviceaccounts.yaml' -path '*/core/*' \
        -o -path '*/secretproviderclasses/*' \
        -o -name 'secretproviderclasses.yaml' \
        -o -path '*/network_logs/*' \
        -o -name '*.kubeconfig' \
        -o -name '*.tar' \
        -o -name '*.tar.gz' \
        -o -name '*.tgz' \
        -o -name '*.zip' \
        -o -name '*.gz' \
        -o -name '*.bz2' \
        -o -name '*.xz' \
        -o -name '*.zst' \
        -o -name '*.7z' \
        -o -name '*.rar' \
      \) -delete
      # Discover every regular file synchronously. Process substitution hides
      # find's exit status and could otherwise publish unsanitized files.
      ALL_FILE_LIST="${DUMP_WORK_DIR}/all-files.list"
      TEXT_FILE_LIST="${DUMP_WORK_DIR}/text-files.list"
      if ! find "${DUMP_WORK_DIR}/output" -type f -print0 > "${ALL_FILE_LIST}"; then
        echo "Failed to enumerate dump files; refusing to publish dump archive" >&2
        exit 1
      fi
      : > "${TEXT_FILE_LIST}"
      while IFS= read -r -d '' file; do
        if [[ ! -s "${file}" ]] || LC_ALL=C grep -Iq . "${file}"; then
          printf '%s\0' "${file}" >> "${TEXT_FILE_LIST}"
        else
          grep_status=$?
          if [[ "${grep_status}" -ne 1 ]]; then
            echo "Failed to classify dump file: ${file}; refusing to publish dump archive" >&2
            exit 1
          fi
          # Binary files are not useful sanitized diagnostics and may contain
          # embedded credentials that text redaction cannot safely inspect.
          rm -f -- "${file}"
        fi
      done < "${ALL_FILE_LIST}"

      while IFS= read -r -d '' file; do
        [[ -f "${file}" ]] || { echo "Diagnostic file disappeared during sanitization: ${file}" >&2; exit 1; }
        case "${file##*.}" in
          yaml|yml) FORMAT=yaml ;;
          json|jsonl) FORMAT=json ;;
          html|htm) FORMAT=html ;;
          *) FORMAT=text ;;
        esac
        awk -v format="${FORMAT}" -f - "${file}" > "${file}.redacted" <<'AWK'
        BEGIN {
          single_quote = sprintf("%c", 39)
          credential_stems = "password|passwd|passphrase|token|credential|credentials|client[_-]?secret|secret[_-]?key|secret|private[_-]?key|client[_-]?key|api[_-]?key|access[_-]?key|shared[_-]?key|authorization|bearer[_-]?token|kubeconfig"
          field_pattern = "(^|[^[:alnum:]_.-])([\"|" single_quote "])?[[:alnum:]_.-]*(" credential_stems ")([\"|" single_quote "])?[[:space:]]*[:=][[:space:]]*"
          flag_pattern = "(^|[[:space:]])--?[[:alnum:]_-]*(" credential_stems ")[[:alnum:]_-]*[[:space:]]+"
          block_indent = -1
          quoted_indent = -1
          env_indent = -1
          env_list_indent = -1
          env_item_key_indent = -1
          env_item_count = 0
          args_indent = -1
          args_pending_secret = 0
          flow_capture = 0
          flow_depth = 0
          flow_quote = ""
          pem_active = 0
          pem_end_marker = ""
        }
        function trim(value) {
          sub(/^[[:space:]]+/, "", value)
          sub(/[[:space:]]+$/, "", value)
          return value
        }
        function single_quote_starts(text, position, previous) {
          if (substr(text, position, 1) != single_quote) return 0
          previous = position <= 1 ? "" : substr(text, position - 1, 1)
          return previous == "" || previous ~ /[[:space:]]/ || previous == "," || \
            previous == ":" || previous == "[" || previous == "{" || previous == "-"
        }
        function indentation(line, position) {
          position = match(line, /[^[:space:]]/)
          return position == 0 ? length(line) : position - 1
        }
        function find_quote_end(value, start, quote, i, character) {
          for (i = start + 1; i <= length(value); i++) {
            character = substr(value, i, 1)
            if (quote == "\"" && character == "\\") {
              i++
              continue
            }
            if (character == quote) {
              if (quote == single_quote && substr(value, i + 1, 1) == single_quote) {
                i++
                continue
              }
              return i
            }
          }
          return 0
        }
        function quote_context(line, position, format, quote, i, character) {
          if (format != "yaml" && format != "json") return ""
          quote = ""
          for (i = 1; i < position; i++) {
            character = substr(line, i, 1)
            if (quote == "\"" && character == "\\") {
              i++
              continue
            }
            if (quote == single_quote && character == single_quote && substr(line, i + 1, 1) == single_quote) {
              i++
              continue
            }
            if ((character == "\"" && (quote == "" || quote == "\"")) || \
                (character == single_quote && (quote == single_quote || (quote == "" && single_quote_starts(line, i))))) {
              if (quote == "") quote = character
              else quote = ""
            }
          }
          return quote
        }
        function parse_mapping(line, text, position, quote, end, colon, next_character, key) {
          mapping_key = ""
          mapping_key_indent = -1
          mapping_value_start = 0
          position = 1
          while (substr(line, position, 1) ~ /[[:space:]]/ && position <= length(line)) position++
          if (substr(line, position, 1) == "-" && substr(line, position + 1, 1) ~ /[[:space:]]/) {
            position++
            while (substr(line, position, 1) ~ /[[:space:]]/ && position <= length(line)) position++
          }
          # A flow collection at the beginning of a line is not a block
          # mapping. Treating its first member as a block key causes the
          # scalar redactor to consume the rest of the collection.
          if (substr(line, position, 1) == "{" || substr(line, position, 1) == "[") return 0
          mapping_key_indent = position - 1
          quote = substr(line, position, 1)
          if (quote == "\"" || quote == single_quote) {
            end = find_quote_end(line, position, quote)
            if (end == 0) return 0
            key = substr(line, position + 1, end - position - 1)
            colon = end + 1
            while (substr(line, colon, 1) ~ /[[:space:]]/ && colon <= length(line)) colon++
            if (substr(line, colon, 1) != ":") return 0
          } else {
            colon = index(substr(line, position), ":")
            if (colon == 0) return 0
            colon += position - 1
            key = trim(substr(line, position, colon - position))
            if (key == "") return 0
          }
          mapping_key = tolower(trim(key))
          mapping_value_start = colon + 1
          while (substr(line, mapping_value_start, 1) ~ /[[:space:]]/ && mapping_value_start <= length(line)) mapping_value_start++
          return 1
        }
        function unquote(value, quote, end) {
          value = trim(value)
          quote = substr(value, 1, 1)
          if (quote == "\"" || quote == single_quote) {
            end = find_quote_end(value, 1, quote)
            if (end > 0) return substr(value, 2, end - 2)
          }
          sub(/[[:space:]]+#.*$/, "", value)
          return trim(value)
        }
        function hex_digit_value(character, position) {
          position = index("0123456789abcdef", tolower(character))
          return position == 0 ? -1 : position - 1
        }
        function normalize_json_key(value, output, i, j, code, digit, valid, escaped) {
          output = ""
          for (i = 1; i <= length(value); i++) {
            if (substr(value, i, 1) == "\\" && substr(value, i + 1, 1) == "u") {
              code = 0
              valid = 1
              for (j = i + 2; j <= i + 5; j++) {
                digit = hex_digit_value(substr(value, j, 1))
                if (digit < 0) { valid = 0; break }
                code = code * 16 + digit
              }
              if (valid && code < 128) {
                output = output sprintf("%c", code)
                i += 5
                continue
              }
            }
            escaped = substr(value, i + 1, 1)
            if (substr(value, i, 1) == "\\" && index("\"\\/", escaped) > 0) {
              output = output escaped
              i++
              continue
            }
            output = output substr(value, i, 1)
          }
          return output
        }
        function is_credential_name(value) {
          return tolower(value) ~ ("(" credential_stems ")$")
        }
        function credential_field_name(line, start, value_start, raw) {
          raw = substr(line, start, value_start - start)
          sub(/[[:space:]:=]+$/, "", raw)
          gsub(/[\"']/, "", raw)
          if (match(raw, /[[:alnum:]_.-]+$/)) return tolower(substr(raw, RSTART, RLENGTH))
          return ""
        }
        function preserve_diagnostic_field(name, value_character) {
          name = tolower(name)
          if (name == "automountserviceaccounttoken" || name == "secretname") return 1
          if (name == "serviceaccounttoken" || name == "secret") {
            return value_character == "" || value_character == "{" || value_character == "["
          }
          return 0
        }
        function is_sensitive_flag(value, normalized) {
          normalized = tolower(value)
          if (normalized !~ /^--?[[:alnum:]_-]+$/) return 0
          sub(/^-+/, "", normalized)
          return normalized ~ ("(^|[-_])(" credential_stems ")$")
        }
        function is_uuid(value) {
          return length(value) == 36 && \
            substr(value, 9, 1) == "-" && substr(value, 14, 1) == "-" && \
            substr(value, 19, 1) == "-" && substr(value, 24, 1) == "-" && \
            substr(value, 1, 8) ~ /^[[:xdigit:]]+$/ && \
            substr(value, 10, 4) ~ /^[[:xdigit:]]+$/ && \
            substr(value, 15, 4) ~ /^[[:xdigit:]]+$/ && \
            substr(value, 20, 4) ~ /^[[:xdigit:]]+$/ && \
            substr(value, 25, 12) ~ /^[[:xdigit:]]+$/
        }
        function is_resource_identifier(value, line, start, prefix) {
          if (value !~ /^[a-z0-9]+(-[a-z0-9]+)+$/) return 0
          prefix = tolower(substr(line, 1, start - 1))
          gsub(/[\"']/, "", prefix)
          if (prefix ~ /(^|[^[:alnum:]_])(name|namespace|kind|resource|api[-_]?version|group|uid)[[:space:]]*:[[:space:]]*$/) return 1
          return prefix ~ /\/(namespaces|pods|nodes|services|endpoints|deployments|statefulsets|daemonsets|hostedclusters|nodepools|machines|machinepools|projects|routes|ingresses)\/$/
        }
        function entropy(value, counts, i, character, probability, total, result) {
          for (character in counts) delete counts[character]
          total = length(value)
          for (i = 1; i <= total; i++) counts[substr(value, i, 1)]++
          result = 0
          for (character in counts) {
            probability = counts[character] / total
            result -= probability * log(probability) / log(2)
          }
          return result
        }
        function is_hash_value(token, prefix, match_start, context) {
          if ((length(token) != 40 && length(token) != 64) || token !~ /^[[:xdigit:]]+$/) return 0
          prefix = tolower(substr(current_line, 1, current_token_start - 1))
          if (!match(prefix, /(^|[{,[:space:]])[\"']?(git[-_]?commit|commit|revision|rev|commit[-_]?sha|sha1|sha256|digest)[\"']?[[:space:]]*:[[:space:]]*[\"' ]*((sha1|sha256):)?$/)) return 0
          match_start = RSTART + 1
          if (format == "yaml" || format == "json") {
            context = quote_context(current_line, match_start, format)
            if (context != "") return 0
          }
          return 1
        }
        function is_image_value(line, start, prefix, value_start, candidate, context) {
          prefix = tolower(substr(line, 1, start - 1))
          if (match(prefix, /(^|[^[:alnum:]_])image[\"' ]*[[:space:]]*:[[:space:]]*[\"' ]*/)) value_start = RSTART + RLENGTH
          else if (match(prefix, /(^|[^[:alnum:]_])image[\"' ]*[[:space:]]*=[[:space:]]*[\"' ]*/)) value_start = RSTART + RLENGTH
          else return 0
          context = quote_context(line, RSTART + 1, format)
          if ((format == "yaml" || format == "json") && context != "") return 0
          candidate = tolower(substr(line, value_start))
          sub(/[\"'[:space:],;}].*$/, "", candidate)
          return index(candidate, "/") > 0 && candidate ~ /^[a-z0-9][a-z0-9.-]*(\/[a-z0-9._-]+)*(:[a-z0-9._-]+)?(@sha256:[[:xdigit:]]+)?$/
        }
        function is_source_path(line, start, token, suffix) {
          suffix = substr(line, start + length(token))
          return index(token, "/") > 0 && token ~ /^[[:alnum:]_.+-]+(\/[[:alnum:]_.+-]+)+$/ && \
            suffix ~ /^\.[[:alpha:]][[:alnum:]]*([:[:space:],;}\"']|$)/
        }
        function is_mapping_key_token(line, start, token, suffix) {
          suffix = substr(line, start + length(token))
          return suffix ~ /^[\"'[:space:]]*:/
        }
        function is_base64_boundary(character) {
          return character == "" || character ~ /[[:space:]\"'=:,;(){}\[\]]/
        }
        # Handle base64-specific characters inside the token redactor rather
        # than applying a broad replacement before commit/digest recognition.
        function redact_opaque_tokens(line, lower, output, i, start, token, character, before, padding, base64_shaped, scan) {
          current_line = line
          lower = tolower(line)
          output = ""
          i = 1
          while (i <= length(line)) {
            character = substr(line, i, 1)
            before = i == 1 ? "" : substr(line, i - 1, 1)
            if (character ~ /[A-Za-z0-9+]/ && is_base64_boundary(before)) {
              start = i
              while (i <= length(line) && substr(line, i, 1) ~ /[A-Za-z0-9+\/]/) i++
              padding = 0
              while (padding < 2 && substr(line, i, 1) == "=") { i++; padding++ }
              token = substr(line, start, i - start)
              base64_shaped = index(token, "/") > 0 || index(token, "+") > 0 || padding > 0
              if (base64_shaped) {
                current_token_start = start
                if (length(token) >= 32 && entropy(token) >= 3.5 && \
                    !is_uuid(token) && !is_resource_identifier(token, line, start) && !is_hash_value(token) && \
                    !is_image_value(line, start) && !is_source_path(line, start, token)) {
                  output = output "REDACTED_BASE64"
                } else {
                  output = output token
                }
              } else {
                i = start
                while (i <= length(line) && substr(line, i, 1) ~ /[[:alnum:]_~+-]/) i++
                token = substr(line, start, i - start)
                current_token_start = start
                output = output (length(token) >= 24 && !is_uuid(token) && !is_resource_identifier(token, line, start) && \
                  !is_mapping_key_token(line, start, token) && !is_hash_value(token) && !is_image_value(line, start) && \
                  !is_source_path(line, start, token) && entropy(token) >= 3.5 ? "REDACTED_HIGH_ENTROPY" : token)
              }
            } else if (character ~ /[[:alnum:]_~+-]/) {
              start = i
              while (i <= length(line) && substr(line, i, 1) ~ /[[:alnum:]_~+-]/) i++
              token = substr(line, start, i - start)
              current_token_start = start
              output = output (length(token) >= 24 && !is_uuid(token) && !is_resource_identifier(token, line, start) && !is_mapping_key_token(line, start, token) && \
                !is_hash_value(token) && !is_image_value(line, start) && !is_source_path(line, start, token) && \
                entropy(token) >= 3.5 ? "REDACTED_HIGH_ENTROPY" : token)
            } else {
              output = output character
              i++
            }
          }
          return output
        }
        function redact_url_userinfo(line, lower, output, offset, start, authority, end, at, i, character) {
          lower = tolower(line)
          output = ""
          offset = 1
          while (offset <= length(line) && match(substr(lower, offset), /[a-z][a-z0-9+.-]*:\/\//)) {
            start = offset + RSTART - 1
            authority = start + RLENGTH
            end = authority
            while (end <= length(line)) {
              character = substr(line, end, 1)
              if (character ~ /[[:space:]\/?#\"<>]/ || character == single_quote) break
              end++
            }
            at = 0
            for (i = authority; i < end; i++) if (substr(line, i, 1) == "@") at = i
            if (at > authority) {
              output = output substr(line, offset, authority - offset) "REDACTED@"
              offset = at + 1
            } else {
              output = output substr(line, offset, end - offset)
              offset = end
            }
          }
          return output substr(line, offset)
        }
        function redact_bearer(line, lower, output, offset, start, size) {
          lower = tolower(line)
          output = ""
          offset = 1
          while (offset <= length(line) && match(substr(lower, offset), /bearer[[:space:]]+[a-z0-9._~+\/=\-]+/)) {
            start = offset + RSTART - 1
            size = RLENGTH
            output = output substr(line, offset, start - offset) "Bearer REDACTED"
            offset = start + size
          }
          return output substr(line, offset)
        }
        function redact_aws_keys(line, upper, output, i, token, before, after) {
          upper = toupper(line)
          output = ""
          i = 1
          while (i <= length(line)) {
            token = substr(upper, i, 4)
            before = i == 1 ? "" : substr(upper, i - 1, 1)
            after = substr(upper, i + 20, 1)
            if ((token == "AKIA" || token == "ASIA") && before !~ /[[:alnum:]]/ && \
                substr(upper, i + 4, 16) ~ /^[A-Z0-9]+$/ && length(substr(upper, i + 4, 16)) == 16 && after !~ /[[:alnum:]]/) {
              output = output substr(line, 1, 0) "REDACTED_AWS_ACCESS_KEY"
              i += 20
            } else {
              output = output substr(line, i, 1)
              i++
            }
          }
          return output
        }
        function redact_scalar(line, value_start, format, direct, key_indent, output, value, quote, end, context, i, comment, anchor_prefix, anchor_length, depth, character, in_quote) {
          scalar_end = value_start - 1
          if (value_start > length(line)) {
            if (direct && format == "yaml") block_indent = key_indent
            scalar_end = length(line)
            return "\"REDACTED\""
          }
          value = substr(line, value_start)
          anchor_prefix = ""
          if (format == "yaml" && direct && match(value, /^&[[:alnum:]_-]+[[:space:]]+/)) {
            anchor_length = RLENGTH
            anchor_prefix = substr(value, 1, anchor_length)
            value_start += anchor_length
            value = substr(line, value_start)
          }
          quote = substr(line, value_start, 1)
          if (format == "yaml" && direct && value ~ /^[|>][+-]?[0-9]?[+-]?[[:space:]]*(#.*)?$/) {
            block_indent = key_indent
            comment = index(value, "#")
            scalar_end = length(line)
            return anchor_prefix "\"REDACTED\"" (comment > 0 ? " " substr(value, comment) : "")
          }
          if (quote == "\"" || quote == single_quote) {
            end = find_quote_end(line, value_start, quote)
            if (end > 0) {
              scalar_end = end
              return anchor_prefix quote "REDACTED" quote
            }
            if (direct && format == "yaml") {
              quoted_indent = key_indent
              quoted_character = quote
              scalar_end = length(line)
              return anchor_prefix quote "REDACTED" quote
            }
            scalar_end = length(line)
            return anchor_prefix quote "REDACTED" quote
          }
          context = quote_context(line, value_start - 1, format)
          if (context != "") {
            end = 0
            if (substr(line, value_start, 1) == "\\" && substr(line, value_start + 1, 1) == context) {
              for (i = value_start + 2; i < length(line); i++) {
                if (substr(line, i, 1) == "\\" && substr(line, i + 1, 1) == context) { end = i + 1; break }
              }
              if (end > 0) {
                scalar_end = end
                return anchor_prefix "\\" context "REDACTED\\" context
              }
            }
            for (i = value_start; i <= length(line); i++) {
              if (substr(line, i, 1) == "\\" && context == "\"") { i++; continue }
              if (substr(line, i, 1) == context || substr(line, i, 1) ~ /[[:space:],;&|>]/) { end = i; break }
            }
            if (end > 0) {
              scalar_end = end - 1
              return anchor_prefix "REDACTED"
            }
          }
          if (format == "yaml" && direct) {
            block_indent = key_indent
            comment = 0
            for (i = value_start; i <= length(line); i++) {
              if (substr(line, i, 1) == "#" && (i == value_start || substr(line, i - 1, 1) ~ /[[:space:]]/)) { comment = i; break }
            }
            scalar_end = length(line)
            if (comment > 0) return anchor_prefix "\"REDACTED\" " substr(line, comment)
            return anchor_prefix "\"REDACTED\""
          }
          if (format == "json") {
            if (quote == "{" || quote == "[") {
              depth = 0
              in_quote = ""
              for (i = value_start; i <= length(line); i++) {
                character = substr(line, i, 1)
                if (in_quote == "\"" && character == "\\") { i++; continue }
                if (character == "\"") { in_quote = in_quote == "" ? "\"" : ""; continue }
                if (in_quote != "") continue
                if (character == "{" || character == "[") depth++
                else if (character == "}" || character == "]") {
                  depth--
                  if (depth == 0) break
                }
              }
              scalar_end = i
              return "\"REDACTED\""
            }
            for (i = value_start; i <= length(line); i++) if (substr(line, i, 1) == "," || substr(line, i, 1) == "}" || substr(line, i, 1) == "]") break
            scalar_end = i - 1
            return "\"REDACTED\""
          } else if (format == "text" && tolower(substr(line, 1, value_start - 1)) ~ /(^|[^[:alnum:]_])authorization[[:space:]]*[:=][[:space:]]*$/) {
            i = length(line) + 1
          } else if (format == "html" && tolower(substr(line, 1, value_start - 1)) ~ /(^|[^[:alnum:]_])authorization[[:space:]]*[:=][[:space:]]*$/) {
            for (i = value_start; i <= length(line); i++) if (substr(line, i, 1) == "<") break
          } else {
            for (i = value_start; i <= length(line); i++) if (substr(line, i, 1) ~ /[[:space:],;&|>]/) break
          }
          if (i <= value_start) i = value_start + 1
          scalar_end = i - 1
          return anchor_prefix "REDACTED"
        }
