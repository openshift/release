                flow_depth = 0
                flow_quote = ""
                update_flow_state(flow_buffer)
                if (flow_depth > 0) {
                  flow_capture = 1
                  next
                }
                process_line($0, 0)
                next
              }
              env_item[++env_item_count] = $0
              next
            } else if (env_item_count > 0) {
              env_item[++env_item_count] = $0
              next
            }
          }
          if (format == "yaml" && env_indent < 0 && parse_mapping($0) && mapping_key == "env" && \
              (mapping_value_start > length($0) || substr($0, mapping_value_start, 1) == "#")) {
            process_line($0, 0)
            env_indent = mapping_key_indent
            env_list_indent = -1
            next
          }
          if (format == "yaml" && args_indent >= 0) {
            if ($0 ~ /^[[:space:]]*$/ || $0 ~ /^[[:space:]]*#/) {
              process_line($0, 0)
              next
            }
            if (current_indent < args_indent || (current_indent == args_indent && !flow_list_item($0))) {
              args_indent = -1
              args_pending_secret = 0
            } else if (flow_list_item($0) && current_indent >= args_indent) {
              argument_start = current_indent + 2
              while (substr($0, argument_start, 1) ~ /[[:space:]]/ && argument_start <= length($0)) argument_start++
              argument = unquote(substr($0, argument_start))
              if (args_pending_secret) {
                if (is_sensitive_flag(argument)) {
                  process_line($0, 0)
                } else {
                  process_line(redact_yaml_arg($0, current_indent), 0)
                  args_pending_secret = 0
                }
              } else {
                process_line($0, 0)
                if (is_sensitive_flag(argument)) args_pending_secret = 1
              }
              next
            }
          }
          if (format == "yaml" && parse_mapping($0) && mapping_key == "args" && \
              (mapping_value_start > length($0) || substr($0, mapping_value_start, 1) == "#")) {
            process_line($0, 0)
            args_indent = mapping_key_indent
            args_pending_secret = 0
            next
          }
          if (format == "yaml" && parse_mapping($0) && (mapping_key == "env" || mapping_key == "args")) {
            flow_opening = substr($0, mapping_value_start, 1)
            if ((mapping_key == "env" && (flow_opening == "[" || flow_opening == "{")) || \
                (mapping_key == "args" && flow_opening == "[")) {
              flow_buffer = $0
              flow_depth = 0
              flow_quote = ""
              update_flow_state(flow_buffer)
              if (flow_depth > 0) {
                flow_capture = 1
                next
              }
            }
          }
          process_line($0, 0)
        }
        END {
          if (format == "json") {
            json_content = redact_json_fields(json_content)
            json_content = redact_json_env_arrays(json_content)
            json_content = redact_json_args_arrays(json_content)
            json_line_count = split(json_content, json_lines, "\n")
            for (json_line_index = 1; json_line_index <= json_line_count; json_line_index++) process_line(json_lines[json_line_index], 0)
          } else if (env_item_count > 0) flush_env_item()
          if (flow_capture) {
            print "Unterminated YAML flow collection; refusing to publish sanitized dump" > "/dev/stderr"
            exit 1
          }
          if (pem_active) {
            print "Unterminated PEM block; refusing to publish sanitized dump" > "/dev/stderr"
            exit 1
          }
        }
      AWK
        mv "${file}.redacted" "${file}"
      done < "${TEXT_FILE_LIST}"
      find "${DUMP_WORK_DIR}/output" -mindepth 1 -type d -empty -delete

      # oc adm inspect failures are logged but may not fail the dump command.
      # Require at least one collected resource before publishing an archive.
      DIAGNOSTIC_RESOURCE_FILE="$(find "${DUMP_WORK_DIR}/output" -type f \
        \( -path '*/cluster-scoped-resources/*' -o -path '*/namespaces/*' \) \
        -name '*.yaml' -size +0c -print -quit)"
      if [[ -z "${DIAGNOSTIC_RESOURCE_FILE}" ]]; then
        echo "No non-empty diagnostic resource YAML was collected; refusing to publish dump archive" >&2
        exit 1
      fi

      tar -cvzf "${DUMP_WORK_DIR}/artifacts.tar.gz" -C "${DUMP_WORK_DIR}" output
      tar -tzf "${DUMP_WORK_DIR}/artifacts.tar.gz" >/dev/null
      # Publish only the sanitized, verified archive.
      mkdir -p "${ARTIFACT_DIR}"
      mv "${DUMP_WORK_DIR}/artifacts.tar.gz" "${ARTIFACT_DIR}/artifacts.tar.gz"
    credentials:
    - mount_path: /etc/hypershift-kubeconfig
      group: ops/clusters/hypershift-ci-2
      collection: hypershift-team
    - mount_path: /etc/hypershift-kubeconfig-azure
      group: ops/clusters/azure-hypershift-ci
      collection: hypershift-team
    from_image:
      namespace: hypershift
      name: hypershift-operator
      tag: latest
    grace_period: 15m0s
    resources:
      requests:
        cpu: 100m
  - ref: hypershift-dump-extra
  - as: destroy-management-cluster
    cli: latest
    env:
      - name: HYPERSHIFT_NAMESPACE
        default: "clusters"
        documentation: "The Namespace where to create the HostedCluster and NodePools"
      - name: HYPERSHIFT_GUEST_INFRA_OCP_ACCOUNT
        default: "false"
        documentation: "Whether to use the generic CI account or the HyperShift OSD account for the guest clusters infra. For the infra created for the clusters. E.g. For cluster-bot we use the generic CI account"
      - name: HYPERSHIFT_BASE_DOMAIN
        default: ""
        documentation: "The cluster's FQDN will be a subdomain of the base domain."
      - name: HYPERSHIFT_AZURE_LOCATION
        default: "centralus"
        documentation: "The Azure location for the cluster (only used when CLOUD_PROVIDER=Azure)"
      - name: CLOUD_PROVIDER
        default: "AWS"
        documentation: "The cloud provider to use for the management cluster"
    commands: |-
      # Set cloud-specific defaults
      if [[ "${CLOUD_PROVIDER}" == "Azure" ]]; then
        export KUBECONFIG=/etc/hypershift-kubeconfig-azure/hypershift-ops-admin.kubeconfig
        AZURE_GUEST_INFRA_CREDENTIALS_FILE="/etc/hypershift-ci-jobs-self-managed-azure/credentials.json"
        DEFAULT_BASE_DOMAIN=hypershift.azure.devcluster.openshift.com
      else
        AWS_GUEST_INFRA_CREDENTIALS_FILE="/etc/hypershift-ci-jobs-awscreds/credentials"
        DEFAULT_BASE_DOMAIN=ci.hypershift.devcluster.openshift.com
        export KUBECONFIG=/etc/hypershift-kubeconfig/hypershift-ops-admin.kubeconfig

        if [[ $HYPERSHIFT_GUEST_INFRA_OCP_ACCOUNT == "true" ]]; then
          AWS_GUEST_INFRA_CREDENTIALS_FILE="${CLUSTER_PROFILE_DIR}/.awscred"
          DEFAULT_BASE_DOMAIN=origin-ci-int-aws.dev.rhcloud.com
        fi
      fi

      DOMAIN=${HYPERSHIFT_BASE_DOMAIN:-$DEFAULT_BASE_DOMAIN}
      CLUSTER_NAME="$(echo -n $PROW_JOB_ID|sha256sum|cut -c-10)-mgmt"

      # Destroy the management cluster based on cloud provider
      if [[ "${CLOUD_PROVIDER}" == "Azure" ]]; then
        echo "Destroying Azure management cluster ${CLUSTER_NAME}"
        bin/hypershift destroy cluster azure \
          --azure-creds=${AZURE_GUEST_INFRA_CREDENTIALS_FILE} \
          --name="${CLUSTER_NAME}" \
          --namespace="${HYPERSHIFT_NAMESPACE}" \
          --location=${HYPERSHIFT_AZURE_LOCATION} \
          --dns-zone-rg-name=os4-common \
          --cluster-grace-period 40m
      else
        echo "Destroying AWS management cluster ${CLUSTER_NAME}"
        bin/hypershift destroy cluster aws \
          --aws-creds=${AWS_GUEST_INFRA_CREDENTIALS_FILE} \
          --name="${CLUSTER_NAME}" \
          --namespace="${HYPERSHIFT_NAMESPACE}" \
          --infra-id=${CLUSTER_NAME} \
          --base-domain=${DOMAIN} \
          --cluster-grace-period 40m
      fi
    credentials:
    - mount_path: /etc/hypershift-ci-jobs-awscreds
      group: ops/hypershift-ci-jobs-awscreds
      collection: hypershift-team
    - mount_path: /etc/hypershift-kubeconfig
      group: ops/clusters/hypershift-ci-2
      collection: hypershift-team
    - mount_path: /etc/hypershift-kubeconfig-azure
      group: ops/clusters/azure-hypershift-ci
      collection: hypershift-team
    - mount_path: /etc/hypershift-ci-jobs-self-managed-azure
      group: ops/hypershift-ci-jobs-self-managed-azure
      collection: hypershift-team
    from_image:
      namespace: hypershift
      name: hypershift-operator
      tag: latest
    grace_period: 15m0s
    resources:
      requests:
        cpu: 100m
