ref:
  as: hypershift-destroy-nested-management-cluster-dump-management-cluster
  cli: latest
  optional_on_success: true
  from_image:
    namespace: hypershift
    name: hypershift-operator
    tag: latest
  commands: hypershift-destroy-nested-management-cluster-dump-management-cluster-commands.sh
  credentials:
  - mount_path: /etc/hypershift-kubeconfig
    group: ops/clusters/hypershift-ci-2
    collection: hypershift-team
  - mount_path: /etc/hypershift-kubeconfig-azure
    group: ops/clusters/azure-hypershift-ci
    collection: hypershift-team
  grace_period: 15m0s
  resources:
    requests:
      cpu: 100m
  env:
  - name: HYPERSHIFT_NAMESPACE
    default: "clusters"
    documentation: "The Namespace where to create the HostedCluster and NodePools"
  - name: CLOUD_PROVIDER
    default: "AWS"
    documentation: "The cloud provider of the cluster."
  documentation: |-
    Collects management-cluster diagnostics, sanitizes them, and publishes one
    `artifacts.tar.gz` containing the `output/` directory for AWS and Azure.
