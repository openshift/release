ref:
  as: hypershift-k8sgpt-target
  best_effort: true
  cli: latest
  env:
  - name: HYPERSHIFT_CLUSTER_ROLE
    default: target
    documentation: Management cluster role used to select the target kubeconfig.
  - name: EXPLAIN
    default: "false"
    documentation: "Whether to explain the results by AI."
  - name: JUNIT_REPORT
    default: "false"
    documentation: "Whether to generate a JUnit report."
  timeout: 15m0s
  grace_period: 10m
  commands: hypershift-k8sgpt-target-commands.sh
  from: hypershift-operator
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  credentials:
  - collection: openshift-tests-private
    group: tests-private-account
    mount_path: /var/run/vault/tests-private-account
  documentation: |-
    Scanning clusters, diagnosing, and triaging issues by calling AI.
