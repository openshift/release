ref:
  as: enmaas-deprovision-rds
  from: cli
  best_effort: true
  commands: enmaas-deprovision-rds-commands.sh
  timeout: 15m
  grace_period: 15m
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  documentation: |-
    Deprovisions the Amazon RDS PostgreSQL instance created by the
    enmaas-provision-rds step. Deletes the RDS instance (skipping final
    snapshot), the DB subnet group, and the security group. Marked as
    best_effort so cleanup failures do not block other post steps.
