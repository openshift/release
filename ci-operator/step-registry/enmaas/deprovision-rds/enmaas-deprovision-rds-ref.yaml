ref:
  as: enmaas-deprovision-rds
  from: rosa-aws-cli
  best_effort: true
  commands: enmaas-deprovision-rds-commands.sh
  timeout: 45m
  grace_period: 15m
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  env:
  - name: REGION
    default: "us-east-2"
    documentation: |-
      AWS region for the RDS instance.
  documentation: |-
    Deprovisions the Amazon RDS PostgreSQL instance created by the
    enmaas-provision-rds step. Deletes the RDS instance (skipping final
    snapshot), the DB subnet group, and the security group. Cleanup failures
    remain job failures unless the caller enables allow_best_effort_post_steps.
    Remaining post steps are attempted regardless. This job does not enable
    best-effort failure suppression.
