ref:
  as: enmaas-install-operators
  from: cli
  commands: enmaas-install-operators-commands.sh
  grace_period: 10m
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  documentation: |-
    Installs the CloudNativePG and cert-manager operators required by EnMaaS.
    Waits for both operator CSVs to reach Succeeded phase before proceeding.
