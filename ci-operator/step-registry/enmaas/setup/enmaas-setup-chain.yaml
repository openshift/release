chain:
  as: enmaas-setup
  steps:
  - ref: enmaas-install-operators
  - ref: enmaas-deploy
  - ref: enmaas-verify
  documentation: |-
    Sets up the full EnMaaS stack on a cluster. Installs required operators
    (CloudNativePG, cert-manager), deploys the EnMaaS application and monitoring
    stack, and verifies the deployment is healthy.
