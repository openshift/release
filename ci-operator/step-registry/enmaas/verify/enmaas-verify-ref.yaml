ref:
  as: enmaas-verify
  from: cli
  commands: enmaas-verify-commands.sh
  grace_period: 10m
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  env:
  - name: VERIFY_TIMEOUT
    default: "10m"
    documentation: |-
      Maximum time to wait for EnMaaS deployments to become ready.
  documentation: |-
    Verifies that the EnMaaS deployment is healthy. Checks that all deployments
    in the enmaas and enmaas-monitoring namespaces are available, the CloudNativePG
    cluster is healthy, PVCs are bound, and routes are resolvable.
