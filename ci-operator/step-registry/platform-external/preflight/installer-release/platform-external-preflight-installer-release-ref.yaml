ref:
  as: platform-external-preflight-installer-release
  from: cli
  commands: platform-external-preflight-installer-release-commands.sh
  grace_period: 10m
  timeout: 15m
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Preflight guard after ignition generation and before AWS provisioning.
    Fails fast when bootstrap embeds cvo-render flags (e.g. --cluster-version-manifest-path)
    that the install release CVO rejects — the mismatch that hangs wait-for-api-bootstrap.
  dependencies:
    - name: "release:latest"
      env: OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE
    - name: "release:latest"
      env: OPENSHIFT_UPGRADE_RELEASE_IMAGE_OVERRIDE
  env:
  - name: PLATFORM_EXTERNAL_OVERRIDE_RELEASE
    default: ""
    documentation: |-
      Override release image used for install (same semantics as manifests step).
