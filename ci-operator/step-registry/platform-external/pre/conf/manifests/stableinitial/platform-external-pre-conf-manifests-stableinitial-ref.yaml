ref:
  as: platform-external-pre-conf-manifests-stableinitial
  from: stable-initial:installer
  commands: platform-external-pre-conf-manifests-stableinitial-commands.sh
  grace_period: 30m
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Upgrade variant of platform-external-pre-conf-manifests. Uses the installer from the
    stable-initial imagestream so bootstrap assets (bootkube/cvo-render flags) match the
    initial release payload. Mirrors ipi-install-install-stableinitial pairing.
    Creates manifests and ignition configs into SHARED_DIR.
  dependencies:
    - name: "release:initial"
      env: OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE
    - name: "release:latest"
      env: OPENSHIFT_UPGRADE_RELEASE_IMAGE_OVERRIDE
  env:
  - name: PROVIDER_NAME
    default: ""
    documentation: |-
      The Provider Name the cluster will be provisioned.
  - name: PLATFORM_EXTERNAL_CCM_ENABLED
    default: ""
    documentation: |-
      When set to "yes" the CCM parameters will be set in the install-config.yaml.
  - name: PLATFORM_EXTERNAL_OVERRIDE_RELEASE
    default: ""
    documentation: |-
      Override release image.
  - name: OPENSHIFT_INSTALL_EXPERIMENTAL_DISABLE_IMAGE_POLICY
    default: "true"
    documentation: |-
      Set to true to disable the Sigstore image signature policy to allow the installation of
      an unsigned release image. This is for internal CI testing only"
