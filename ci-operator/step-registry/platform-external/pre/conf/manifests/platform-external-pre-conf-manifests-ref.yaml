ref:
  as: platform-external-pre-conf-manifests
  from: installer
  cli: latest
  commands: platform-external-pre-conf-manifests-commands.sh
  grace_period: 30m
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Step to customize installer manifests required by Platform External for each platform.
    Extracts openshift-install from OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE (so bootstrap
    matches the install payload), creates manifests, and writes ignition configs to SHARED_DIR.
    Upgrade jobs should override INSTALL to release:initial (same as openshift-e2e-external-aws).
  dependencies:
    - name: "release:latest"
      env: OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE
    - name: "release:latest"
      env: OPENSHIFT_UPGRADE_RELEASE_IMAGE_OVERRIDE
  env:
  - name: PROVIDER_NAME
    default: ""
    documentation: |-
      The Provider Name the cluster will be provisioned.
  - name: PLATFORM_EXTERNAL_CCM_ENABLED
    default: ""
    documentation: |-
      When set to "yes" the CCM parameters will be set in the install-config.yaml.
  - name: PLATFORM_EXTERNAL_OVERRIDE_RELEASE
    default: ""
    documentation: |-
      Override release image.
  - name: OPENSHIFT_INSTALL_EXPERIMENTAL_DISABLE_IMAGE_POLICY
    default: "true"
    documentation: |-
      Set to true to disable the Sigstore image signature policy to allow the installation of
      an unsigned release image. This is for internal CI testing only"
  - name: REGISTRY_AUTH_FILE
    default: "/tmp/secret/pull-secret-with-ci"
    documentation: |-
      Writable pull-secret path. When the install release is not on quay.io, the step runs
      `oc registry login` to append build-cluster credentials before extracting openshift-install.
