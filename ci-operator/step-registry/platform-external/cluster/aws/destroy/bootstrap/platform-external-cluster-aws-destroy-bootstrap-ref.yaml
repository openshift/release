ref:
  as: platform-external-cluster-aws-destroy-bootstrap
  from: upi-installer
  grace_period: 10m
  commands: platform-external-cluster-aws-destroy-bootstrap-commands.sh
  resources:
    requests:
      cpu: 300m
      memory: 300Mi
  env:
  - name: PLATFORM_EXTERNAL_DISCONNECTED
    default: "no"
    documentation: |-
      When "yes", route bootstrap gather through the bastion host
      (bootstrap is on a private subnet in disconnected mode).
  documentation: |-
    The deprovision to destroy the bootstrap stack.
