chain:
  as: platform-external-cluster-aws-pre-stableinitial
  steps:
  - chain: platform-external-cluster-pre-stableinitial
  - ref: platform-external-preflight-installer-release
  - chain: platform-external-cluster-aws-install
  - chain: platform-external-ccm-deploy-aws
  - chain: platform-external-cluster-wait-for-install-complete
  - ref: platform-external-cluster-task-image-registry-emptydir
  - ref: platform-external-cluster-aws-destroy-bootstrap
  documentation: >-
    Provision an OpenShift cluster on AWS with platform type external for upgrade jobs.
    Uses the stable-initial installer for ignition generation (matching the initial
    release payload) and runs installer/release preflight before CloudFormation so
    incompatible cvo-render flags fail before AWS resources are created.
