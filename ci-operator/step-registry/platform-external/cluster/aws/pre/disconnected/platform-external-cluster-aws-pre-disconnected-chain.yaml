chain:
  as: platform-external-cluster-aws-pre-disconnected
  steps:
  - ref: aws-provision-vpc-disconnected
  - chain: aws-provision-bastionhost
  - chain: mirror-images-payload
  - ref: platform-external-pre-init
  - ref: ipi-conf
  - ref: ipi-conf-telemetry
  - ref: ipi-install-monitoringpvc
  - ref: platform-external-pre-conf
  - ref: ipi-conf-mirror
  - ref: platform-external-pre-conf-manifests
  - chain: platform-external-cluster-aws-install
  - chain: platform-external-ccm-deploy-aws
  - chain: platform-external-cluster-wait-for-install-complete
  - ref: mirror-images-trust-registry-ca
  - as: disable-default-sources
    from: cli
    commands: |-
      set -euo pipefail
      if test -f "${SHARED_DIR}/proxy-conf.sh"; then
        source "${SHARED_DIR}/proxy-conf.sh"
      fi
      oc patch OperatorHub cluster --type json \
        -p '[{"op": "add", "path": "/spec/disableAllDefaultSources", "value": true}]'
    resources:
      requests:
        cpu: 100m
        memory: 100Mi
    timeout: 5m0s
    grace_period: 5m0s
  - ref: mirror-images-community-e2e-images
  - ref: mirror-images-qe-test-images
  - ref: platform-external-cluster-task-image-registry-emptydir
  - ref: platform-external-cluster-aws-destroy-bootstrap
  env:
  - name: DISCONNECTED_INSTALL
    default: "yes"
    documentation: "Signal the install step to consume a precreated disconnected VPC."
  - name: ZONES_COUNT
    default: "2"
    documentation: "Number of availability zones. Default 2 to avoid regions with fewer than 3 AZs."
  - name: MIRROR_IN_BASTION
    default: "yes"
    documentation: "Mirror images from the bastion host rather than the build farm."
  - name: QE_IMAGES
    default: "false"
    documentation: "Only mirror community e2e test images (from mirror-images-list.yaml), not QE-specific images."
  documentation: |-
    Provisions a disconnected OpenShift cluster on AWS with platform type
    external for e2e conformance testing. Creates an isolated VPC
    (private subnets without NAT, VPC endpoints for AWS services) with
    a bastion host that provides a mirror registry and egress proxy.
    Mirrors the release payload and community e2e test images to the
    bastion registry, configures the installer with mirror and trust
    settings, and deploys cluster infrastructure via CloudFormation
    UPI templates. After install completion, disables default
    OperatorHub catalog sources and applies IDMS/ITMS so the cluster
    pulls all images from the bastion mirror. Destroys the bootstrap
    resources once the control plane is self-hosting.
