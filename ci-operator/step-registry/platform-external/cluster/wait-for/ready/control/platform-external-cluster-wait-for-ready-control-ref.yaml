ref:
  as: platform-external-cluster-wait-for-ready-control
  from: installer
  grace_period: 25m
  commands: platform-external-cluster-wait-for-ready-control-commands.sh
  resources:
    requests:
      cpu: 300m
      memory: 300Mi
  env:
  - name: PLATFORM_EXTERNAL_DISCONNECTED
    default: "no"
    documentation: |-
      Propagated to the bootstrap error handler for bastion-routed gather.
  documentation: |-
    Platform agnostic check waiting for control plane nodes stayed in Ready phase.
