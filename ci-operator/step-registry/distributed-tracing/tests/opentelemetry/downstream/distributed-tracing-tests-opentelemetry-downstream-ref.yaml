ref:
  as: distributed-tracing-tests-opentelemetry-downstream
  from: obs-tests-runner
  timeout: 3h30m0s
  commands: distributed-tracing-tests-opentelemetry-downstream-commands.sh
  grace_period: 2m0s
  resources:
    requests:
      cpu: "1"
      memory: 3Gi
  env:
  - name: RUN_TESTS
    default: ""
    documentation: |-
      Space separated chainsaw test directories of the operator repository to run, relative to the repository root,
      for example "tests/e2e/smoke-deletion tests/e2e-crd-validations tests/e2e-sidecar". Exactly these directories
      run; a directory that does not exist fails the job. Empty (the default) runs the full suite, minus SKIP_TESTS.
      Exactly one of RUN_TESTS and SKIP_TESTS must be set: both, or neither, fail the job.
  - name: SKIP_TESTS
    default: ""
    documentation: |-
      Space separated test directories, relative to the repository and under tests/, that are removed from the full
      suite before it runs, for example "tests/e2e/smoke-ip-families tests/e2e-otel/*aws*". Globs are allowed. An entry
      that does not start with tests/, or contains "..", is reported and ignored. The full-suite jobs set it to the tests
      that cannot run on their OpenShift version, platform or architecture. Not used with RUN_TESTS.
  - name: MULTISTAGE_PARAM_OVERRIDE_OTEL_TESTS_BRANCH
    default: "rhosdt-0.158"
    documentation: |-
      The branch to checkout from openshift/open-telemetry-opentelemetry-operator for running downstream tests.
      This parameter must be set either in the job config steps.env or via Gangway API pod_spec_options.
      The job will fail if left empty.
  documentation: |-
    The distributed-tracing-tests-opentelemetry-downstream step runs the OpenTelemetry Operator e2e tests of a product
    branch against the Red Hat build of OpenTelemetry Operator that is installed on the cluster, for example from the
    redhat-operators catalog. The tests are cloned from the MULTISTAGE_PARAM_OVERRIDE_OTEL_TESTS_BRANCH branch of
    openshift/open-telemetry-opentelemetry-operator.

    It runs the same way as the distributed-tracing-tests-opentelemetry-premerge step, without the images built from a
    pull request: one chainsaw run with the sidecar selector of the OpenShift version, then e2e-metadata-filters
    (the filter variables are set on the operator first), then e2e-openshift-tls-profile last because it triggers a
    MachineConfig rollout. JUnit files are written to the artifacts directory and copied to SHARED_DIR for the
    openshift-observability-qe-agent post step.
