ref:
  as: distributed-tracing-tests-opentelemetry-ui-premerge
  from: obs-ui-tests-runner
  commands: distributed-tracing-tests-opentelemetry-ui-premerge-commands.sh
  timeout: 1h0m0s
  grace_period: 2m0s
  resources:
    requests:
      cpu: "1"
      memory: 3Gi
      # Shared memory for Chromium (the default 64Mi /dev/shm is too small for it).
      ci-operator.openshift.io/shm: 2G
    limits:
      memory: 8Gi
      ci-operator.openshift.io/shm: 2G
  documentation: |-
    The distributed-tracing-tests-opentelemetry-ui-premerge step runs the OpenShift web console UI tests of the
    OpenTelemetry operator (tests/e2e-otel-ui) from the pull request source against an operator that was installed
    from a bundle built in the same CI run: a Chainsaw test enables user workload monitoring, deploys OpenTelemetry
    collectors with telemetry generators and waits for the metrics, then Playwright verifies the
    "OpenTelemetry Collector" dashboard under Observe > Dashboards.

    The step requires the OpenTelemetry operator to be installed already and logs in to the console as
    kubeadmin. It runs in the obs-ui-tests-runner pipeline image, which the ci-operator config builds from the
    playwright-base image (Node.js, Chromium, chainsaw, oc; built from tests/e2e-otel-ui/Dockerfile.playwright
    in openshift/distributed-tracing-qe and mirrored into the CI registry, see
    core-services/image-mirroring/_config.yaml) with the operator repository copied to /tmp/opentelemetry-operator.

    The step fails when a test fails. JUnit files (junit_console_ui_otel_chainsaw.xml from Chainsaw,
    junit_console_ui_otel_dashboard.xml from Playwright), the console output of Chainsaw
    (chainsaw-output.log), the Playwright HTML report, traces and screenshots are written to the artifacts
    directory of the step. On exit the JUnit files, the tail of the Chainsaw output and a context file are
    copied to SHARED_DIR for the openshift-observability-qe-agent post step (AGENT_SKILL: otel-ui).
