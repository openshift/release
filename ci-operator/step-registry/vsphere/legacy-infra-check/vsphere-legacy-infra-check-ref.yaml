ref:
  as: vsphere-legacy-infra-check
  from: cli
  commands: vsphere-legacy-infra-check-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: >-
    Validates a vSphere cluster that was installed with its Infrastructure CR
    missing vcenters/failureDomains (see the STRIP_VSPHERE_FAILURE_DOMAINS flag
    on the upi-conf-vsphere ref), simulating clusters installed via UPI or
    before OpenShift 4.13 that never had this data populated, and which the
    installer never backfills on upgrade (SPLAT-3028). Confirms the
    Infrastructure CR is actually in this state, then checks ClusterOperator
    health, vSphere cloud-controller-manager and CSI driver pod health, and
    scans cloud-controller-manager logs for the OCPBUGS-136178 regression
    signature ("No Virtual Center hosts defined").
