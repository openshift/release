ref:
  as: telco5g-ptp-tests
  from_image:
    namespace: ci
    name: telco-runner
    tag: latest
  commands: telco5g-ptp-tests-commands.sh
  timeout: 3h45m
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
  env:
  - name: E2E_TESTS_CONFIG
    default: ""
    documentation: Additional configuration.
  - name: T5CI_VERSION
    default: ""
    documentation: Version of OCP cluster to install.
  - name: T5CI_JOB_TYPE
    default: ""
    documentation: Job type of Telco5G CI jobs
  - name: T5CI_DEPLOY_UPSTREAM
    default: ""
    documentation: If job should deploy upstream or downstream operator
  - name: T5CI_PTP_SKIP_DEPLOY
    default: "false"
    documentation: |-
      When true, skip in-cluster image build and make deploy. Used by Path A jobs
      (optional-operators-subscribe from an in-job ci-index) such as
      openshift/ptp-operator e2e-telco5g-ptp.
  documentation: |-
    Deploy PTP operator (unless T5CI_PTP_SKIP_DEPLOY) and run conformance tests.
