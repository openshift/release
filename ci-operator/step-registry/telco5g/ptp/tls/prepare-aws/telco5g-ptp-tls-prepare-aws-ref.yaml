ref:
  as: telco5g-ptp-tls-prepare-aws
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  commands: telco5g-ptp-tls-prepare-aws-commands.sh
  timeout: 5m0s
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Allow TCP 8443 between the test cluster's AWS node and control-plane security
    groups so the TLS scanner can reach every host-networked PTP proxy. Rules are
    restricted to the cluster's own security groups and removed with the cluster.
    Existing rules are preserved and the resulting ingress permissions are verified.
