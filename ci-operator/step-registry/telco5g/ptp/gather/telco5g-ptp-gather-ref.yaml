ref:
  as: telco5g-ptp-gather
  from_image:
    namespace: ci
    name: telco-runner
    tag: latest
  commands: telco5g-ptp-gather-commands.sh
  credentials:
  - collection: telco5g
    group: cikey
    mount_path: /var/run/ci-key
  - collection: telco5g
    group: bastionip
    mount_path: /var/run/bastion-ip
  - collection: telco5g
    group: bastionuser
    mount_path: /var/run/bastion-user
  timeout: 2h30m
  best_effort: true
  optional_on_success: true
  resources:
    requests:
      cpu: 300m
      memory: 500Mi
  documentation: |-
    Run the standard OCP gather steps on the hypervisor with the local kubeconfig.
