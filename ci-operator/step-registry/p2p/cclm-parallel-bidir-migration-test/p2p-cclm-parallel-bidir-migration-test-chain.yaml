chain:
  as: p2p-cclm-parallel-bidir-migration-test
  steps:
    - ref: p2p-create-migration-test-vm
    - ref: p2p-mtv-execute-parallel-bidir-migration
  documentation: |-
    End-to-end parallel bi-directional CCLM migration test across two spoke clusters.
    All VMs are created on spoke-1; two MTV Plans per leg migrate them in parallel.

    Requires p2p-mtv-bidir-mig-config (ForkliftController, providers, forward + return
    network/storage maps), p2p-install-odf-spokes, p2p-acm-cnv-install-policy, and
    acm-interop-p2p-submariner-install (pod-to-pod connectivity without Globalnet).

    Step 1 (p2p-create-migration-test-vm):
      Creates 2×MTV_VMS_PER_PLAN VMs (test-vm-1 … test-vm-2N) on spoke-1.
      Use CNV_TEST_VM_COUNT = 2 * MTV_VMS_PER_PLAN (default 10) in the job env.

    Step 2 (p2p-mtv-execute-parallel-bidir-migration):
      Leg 1 — parallel forward migration (spoke-1 → spoke-2):
        Plan A migrates test-vm-1 … test-vm-N simultaneously with
        Plan B migrating test-vm-(N+1) … test-vm-2N.
        Both Migration CRs are active at the same time.

      Leg 2 — parallel return migration (spoke-2 → spoke-1):
        Plan A-return and Plan B-return submitted simultaneously,
        migrating their respective VMs back to spoke-1.

    Debug mode: set P2P_CCLM_DEBUG_MODE=true so failures exit 0,
    allowing downstream investigation steps to run.
