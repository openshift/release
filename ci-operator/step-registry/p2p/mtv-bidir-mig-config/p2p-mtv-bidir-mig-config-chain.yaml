chain:
  as: p2p-mtv-bidir-mig-config
  steps:
    - ref: p2p-mtv-additional-config
    - ref: p2p-mtv-register-providers
    - ref: p2p-mtv-create-migration-maps
    - ref: p2p-mtv-create-return-migration-maps
  documentation: |-
    Configure MTV for bi-directional cross-cluster live migration (CCLM) on the ACM hub.

    Extends p2p-mtv-mig-config with a fourth step that creates the return-leg maps:

      1. p2p-mtv-additional-config
         Applies ForkliftController with feature_ocp_live_migration=true (CCLM) on the hub.

      2. p2p-mtv-register-providers
         Registers each ACM spoke as an MTV OpenShift Provider on the hub.

      3. p2p-mtv-create-migration-maps
         Creates pod-to-pod NetworkMap and ODF StorageMap for the forward leg (spoke-1 → spoke-2).

      4. p2p-mtv-create-return-migration-maps
         Creates pod-to-pod NetworkMap and ODF StorageMap for the return leg (spoke-2 → spoke-1).
         Map names carry a "-return" suffix: spoke-network-map-return / spoke-storage-map-return.

    Requires install-operators (mtv-operator on hub), acm-fetch-managed-clusters, and
    p2p-install-odf-spokes before this chain.
