ref:
  as: p2p-mtv-execute-parallel-bidir-migration
  from: cli
  commands: p2p-mtv-execute-parallel-bidir-migration-commands.sh
  timeout: 10h0m0s
  grace_period: 15m0s
  resources:
    requests:
      cpu: 200m
      memory: 400Mi
  documentation: |-
    Execute two MTV cross-cluster live migrations (CCLM) per leg, in parallel.

    All VMs are created on spoke-1 by the preceding p2p-create-migration-test-vm step.
    Set CNV_TEST_VM_COUNT = 2 × MTV_VMS_PER_PLAN (default: 10 VMs total).

    Leg 1 — parallel forward migration (spoke-1 → spoke-2):
      Plan A migrates test-vm-1 … test-vm-N simultaneously with
      Plan B migrating test-vm-(N+1) … test-vm-2N.
      Both MTV Plan and Migration CRs are submitted to the hub back-to-back;
      the MTV operator executes them concurrently on the cluster.
      Script polls both Migration CRs in a single loop until both Succeeded.

    Leg 2 — parallel return migration (spoke-2 → spoke-1):
      After Leg 1 completes, stale VMs on spoke-1 (stopped by MTV) are cleaned up,
      then Plan A-return and Plan B-return are submitted simultaneously.
      Same parallel polling loop until both Succeeded.

    Prerequisites:
      - p2p-create-migration-test-vm  : test-vm-1..2N Running on spoke-1
      - p2p-mtv-bidir-mig-config      : forward + return NetworkMaps/StorageMaps Ready
      - p2p-acm-cnv-install-policy    : DecentralizedLiveMigration + sync controller on both spokes
      - acm-interop-p2p-submariner-install : pod-to-pod connectivity without Globalnet

    Writes ${ARTIFACT_DIR}/mtv-parallel-bidir-status.txt; diagnostics on failure under
    ${ARTIFACT_DIR}/mtv-parallel-bidir-diagnostics/; JUnit at
    ${ARTIFACT_DIR}/junit_cclm_parallel_bidir_migration.xml.

  env:
  # ---- Plan sizing ----
  - name: MTV_VMS_PER_PLAN
    default: "5"
    documentation: |-
      Number of VMs per migration plan. Plan A migrates test-vm-1..N; Plan B migrates
      test-vm-(N+1)..2N. CNV_TEST_VM_COUNT in the job env must equal 2 × MTV_VMS_PER_PLAN.

  # ---- Leg 1: forward plans (both spoke-1 → spoke-2) ----
  - name: MTV_PLAN_A_NAME
    default: "cclm-parallel-plan-a"
    documentation: MTV Plan CR name for the first forward plan.
  - name: MTV_PLAN_B_NAME
    default: "cclm-parallel-plan-b"
    documentation: MTV Plan CR name for the second forward plan.
  - name: MTV_MIGRATION_A_NAME
    default: "cclm-parallel-run-a"
    documentation: MTV Migration CR name for the first forward plan.
  - name: MTV_MIGRATION_B_NAME
    default: "cclm-parallel-run-b"
    documentation: MTV Migration CR name for the second forward plan.

  # ---- Leg 2: return plans (both spoke-2 → spoke-1) ----
  - name: MTV_PLAN_A_RETURN_NAME
    default: "cclm-parallel-plan-a-return"
    documentation: MTV Plan CR name for the first return plan.
  - name: MTV_PLAN_B_RETURN_NAME
    default: "cclm-parallel-plan-b-return"
    documentation: MTV Plan CR name for the second return plan.
  - name: MTV_MIGRATION_A_RETURN_NAME
    default: "cclm-parallel-run-a-return"
    documentation: MTV Migration CR name for the first return plan.
  - name: MTV_MIGRATION_B_RETURN_NAME
    default: "cclm-parallel-run-b-return"
    documentation: MTV Migration CR name for the second return plan.

  # ---- Provider / map names ----
  - name: MTV_SOURCE_PROVIDER
    default: "spoke-1"
    documentation: MTV source Provider CR name (forward leg source).
  - name: MTV_DEST_PROVIDER
    default: "spoke-2"
    documentation: MTV destination Provider CR name (forward leg destination).
  - name: MTV_NETWORK_MAP_NAME
    default: "spoke-network-map"
    documentation: NetworkMap for the forward leg (created by p2p-mtv-create-migration-maps).
  - name: MTV_STORAGE_MAP_NAME
    default: "spoke-storage-map"
    documentation: StorageMap for the forward leg (created by p2p-mtv-create-migration-maps).
  - name: MTV_RETURN_NETWORK_MAP_NAME
    default: "spoke-network-map-return"
    documentation: NetworkMap for the return leg (created by p2p-mtv-create-return-migration-maps).
  - name: MTV_RETURN_STORAGE_MAP_NAME
    default: "spoke-storage-map-return"
    documentation: StorageMap for the return leg (created by p2p-mtv-create-return-migration-maps).

  # ---- Spoke kubeconfig indices ----
  - name: MTV_SOURCE_SPOKE_INDEX
    default: "1"
    documentation: 1-based SHARED_DIR kubeconfig index for spoke-1 (forward source / return destination).
  - name: MTV_DEST_SPOKE_INDEX
    default: "2"
    documentation: 1-based SHARED_DIR kubeconfig index for spoke-2 (forward destination / return source).

  # ---- Common parameters ----
  - name: MTV_TEST_VM_NAMESPACE
    default: "vm-migration-test"
    documentation: Namespace holding source VMs on spoke-1 and receiving migrated VMs.
  - name: MTV_NAMESPACE
    default: "openshift-mtv"
    documentation: Namespace where MTV Plan, Migration, Provider, and Map CRs live.
  - name: MTV_PLAN_TYPE
    default: "live"
    documentation: Plan spec.type — live for CCLM, cold for powered-off migration.
  - name: MTV_PLAN_READY_TIMEOUT
    default: "15m"
    documentation: Timeout for Provider/Map/Plan Ready waits.
  - name: MTV_MIGRATION_TIMEOUT
    default: "6h"
    documentation: Max duration to wait for both Migration CRs per leg to reach Succeeded.
  - name: MTV_MIGRATION_POLL_INTERVAL_SECONDS
    default: "30"
    documentation: Sleep between parallel migration status polls.
  - name: MTV_CNV_NAMESPACE
    default: "openshift-cnv"
    documentation: OpenShift Virtualization namespace on spokes (KubeVirt/HCO).
  - name: MTV_KUBEVIRT_NAME
    default: "kubevirt-kubevirt-hyperconverged"
    documentation: KubeVirt CR name on spokes (HCO-managed).
  - name: MTV_HCO_NAME
    default: "kubevirt-hyperconverged"
    documentation: HyperConverged CR name patched when ensuring DecentralizedLiveMigration.
  - name: MTV_ENSURE_DECENTRALIZED_LIVE_MIGRATION
    default: "true"
    documentation: Patch HCO featureGates on both spokes when gate is missing (live plans only).
  - name: MTV_FORKLIFT_CONTROLLER_NAME
    default: "forklift-controller"
    documentation: ForkliftController / deployment name on the hub (CCLM preflight).
  - name: MTV_PROVIDER_INVENTORY_REFRESH_WAIT
    default: "5m"
    documentation: Wait for providers Ready after inventory refresh before Plan creation.
  - name: MTV_SYNC_CONTROLLER_WAIT
    default: "10m"
    documentation: Wait for virt-synchronization-controller Available on each spoke.
  - name: P2P_CCLM_DEBUG_MODE
    default: "false"
    documentation: |-
      When true, log failures and exit 0 so downstream debug steps can run.
      Set P2P_CCLM_DEBUG_MODE=true in the job env during CCLM investigation.
