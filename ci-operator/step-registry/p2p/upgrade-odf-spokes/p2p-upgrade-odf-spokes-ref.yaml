ref:
  as: p2p-upgrade-odf-spokes
  from: cli
  commands: p2p-upgrade-odf-spokes-commands.sh
  timeout: 8h0m0s
  grace_period: 30m0s
  resources:
    requests:
      cpu: 200m
      memory: 400Mi
  documentation: |-
    Upgrade ODF on one or more ACM spoke clusters through one or more channels after an EUS
    OCP upgrade.

    Reads spoke cluster names and kubeconfigs from ${SHARED_DIR} (same files written by
    acm-interop-p2p-cluster-install). For each spoke, iterates ODF_UPGRADE_CHANNEL_HOPS
    (comma-separated, e.g. "stable-4.21,stable-4.22"), patching the odf-operator Subscription
    channel at each hop, waiting for OLM to install the new CSV (Succeeded), then waiting
    for StorageCluster and NooBaa to return to Ready before moving to the next hop.

    ODF's OLM upgrade graph requires sequential hops. Jumping directly from stable-4.20 to
    stable-4.22 leaves OLM without an install-plan edge and the installedCSV never changes.
    For a 4.20→4.22 EUS upgrade set ODF_UPGRADE_CHANNEL_HOPS=stable-4.21,stable-4.22.

    Multiple spokes are upgraded in parallel; hops within each spoke are sequential.
    Intended for EUS scenarios. Run after all OCP upgrade steps (hub + spoke) have completed.
    Does not re-label nodes or re-create the StorageCluster.

    Writes per-spoke diagnostics and ocs-must-gather to
    ${ARTIFACT_DIR}/odf-spoke-upgrade-<name>/ on failure.
  env:
  - name: ODF_UPGRADE_CHANNEL_HOPS
    default: ""
    documentation: |-
      Comma-separated ordered list of ODF Subscription channels to upgrade through on each
      spoke (e.g. "stable-4.21,stable-4.22"). Each hop patches the Subscription, waits for
      the new CSV to reach Succeeded, and waits for StorageCluster + NooBaa to return to
      Ready before proceeding to the next hop. Required — step fails if empty.
  - name: ODF_INSTALL_NAMESPACE
    default: "openshift-storage"
    documentation: Namespace of the ODF operator and StorageCluster on the spokes.
  - name: ODF_STORAGE_CLUSTER_NAME
    default: "ocs-storagecluster"
    documentation: StorageCluster metadata.name on each spoke.
  - name: ODF_SUBSCRIPTION_NAME
    default: "odf-operator"
    documentation: ODF Subscription metadata.name.
  - name: ODF_CSV_POLL_INTERVAL_SECONDS
    default: "10"
    documentation: Sleep between installedCSV change polls per spoke (seconds).
  - name: ODF_CSV_POLL_TIMEOUT_SECONDS
    default: "900"
    documentation: Max seconds to wait for the new CSV to appear and reach Succeeded per hop per spoke (15 min).
  - name: ODF_STORAGECLUSTER_POLL_TIMEOUT_SECONDS
    default: "5400"
    documentation: Max seconds to wait for StorageCluster and NooBaa Ready per hop per spoke (90 min).
