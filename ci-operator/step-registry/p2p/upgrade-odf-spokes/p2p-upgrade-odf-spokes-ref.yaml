ref:
  as: p2p-upgrade-odf-spokes
  from: cli
  commands: p2p-upgrade-odf-spokes-commands.sh
  timeout: 2h0m0s
  grace_period: 30m0s
  resources:
    requests:
      cpu: 200m
      memory: 400Mi
  documentation: |-
    Upgrade ODF on one or more ACM spoke clusters to a new channel after an EUS OCP upgrade.

    Reads spoke cluster names and kubeconfigs from ${SHARED_DIR} (same files written by
    acm-interop-p2p-cluster-install). For each spoke, patches the existing odf-operator
    Subscription channel to ODF_UPGRADE_TARGET_CHANNEL, waits for OLM to install the new
    CSV (Succeeded), then waits for StorageCluster and NooBaa to return to Ready phase.

    Multiple spokes are upgraded in parallel. Single spoke runs directly (no subprocess).

    Intended for EUS scenarios (e.g. stable-4.20 → stable-4.22 after OCP 4.20→4.22 upgrade).
    Run after all OCP upgrade steps (hub + spoke) have completed. Does not re-label nodes or
    re-create the StorageCluster — those are preserved from the p2p-install-odf-spokes step.

    Writes per-spoke diagnostics and ocs-must-gather to ${ARTIFACT_DIR}/odf-spoke-upgrade-<name>/
    on failure.
  env:
  - name: ODF_UPGRADE_TARGET_CHANNEL
    default: ""
    documentation: |-
      Target ODF operator Subscription channel on each spoke (e.g. stable-4.22). Separate
      from ODF_OPERATOR_CHANNEL / ODF_SPOKE_OPERATOR_CHANNEL (used by p2p-install-odf-spokes)
      so install and upgrade channels can differ in the same CI config.
  - name: ODF_INSTALL_NAMESPACE
    default: "openshift-storage"
    documentation: Namespace of the ODF operator and StorageCluster on the spokes.
  - name: ODF_STORAGE_CLUSTER_NAME
    default: "ocs-storagecluster"
    documentation: StorageCluster metadata.name on each spoke.
  - name: ODF_SUBSCRIPTION_NAME
    default: "odf-operator"
    documentation: ODF Subscription metadata.name.
  - name: ODF_CSV_POLL_INTERVAL_SECONDS
    default: "10"
    documentation: Sleep between installedCSV change polls per spoke.
  - name: ODF_CSV_POLL_TIMEOUT_SECONDS
    default: "900"
    documentation: Max seconds to wait for the new CSV to appear and reach Succeeded (15 min).
  - name: ODF_STORAGECLUSTER_POLL_TIMEOUT_SECONDS
    default: "5400"
    documentation: Max seconds to wait for StorageCluster and NooBaa Ready post-upgrade (90 min).
