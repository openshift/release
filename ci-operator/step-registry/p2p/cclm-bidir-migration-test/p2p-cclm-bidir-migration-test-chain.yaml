chain:
  as: p2p-cclm-bidir-migration-test
  steps:
    - ref: p2p-create-cclm-test-vms
    - ref: interop-acm-acm-virt-bundle-mtv-cclm-execute
    - ref: interop-acm-acm-virt-bundle-mtv-cclm-verify
    - ref: interop-acm-acm-virt-bundle-mtv-cclm-execute-return
    - ref: interop-acm-acm-virt-bundle-mtv-cclm-verify-return
  documentation: |-
    End-to-end bi-directional CCLM migration test for the same VMs across two spoke clusters.

    Requires p2p-mtv-wait-acm-providers, p2p-mtv-create-migration-maps,
    p2p-mtv-create-return-migration-maps, p2p-install-odf-spokes, p2p-acm-cnv-addon-install, and
    acm-interop-p2p-submariner-install (pod-to-pod connectivity without Globalnet).

    Step 1 (p2p-create-cclm-test-vms):
      Creates ODF-backed RWX VMs on the source spoke (spoke-1, index 1).

    Step 2 (interop-acm-acm-virt-bundle-mtv-cclm-execute):
      Forward leg — live-migrates the happy-path VMs from spoke-1 to spoke-2.
      Uses forward Plan/Migration CRs (cclm-plan / cclm-run-1) and forward maps
      (spoke-network-map / spoke-storage-map).

    Step 3 (interop-acm-acm-virt-bundle-mtv-cclm-verify):
      Post-forward checks — destination VMIs Running, runStrategy==Always
      (OCPBUGS-101771), source VMIM not Failed (OCPBUGS-99403), SSH probe,
      data integrity, guest disk I/O, and guest network (all hard-fail).

    Step 4 (interop-acm-acm-virt-bundle-mtv-cclm-execute-return):
      Return leg — live-migrates the same VMs from spoke-2 back to spoke-1.
      Uses return Plan/Migration CRs (cclm-plan-return / cclm-run-return) and return
      maps (spoke-network-map-return / spoke-storage-map-return).

    Step 5 (interop-acm-acm-virt-bundle-mtv-cclm-verify-return):
      Post-return checks — same assertions as step 3 on the reversed spokes.

    Debug mode: set P2P_CCLM_DEBUG_MODE=true so create/execute steps log failures
    but exit 0, allowing downstream investigation steps to run.
