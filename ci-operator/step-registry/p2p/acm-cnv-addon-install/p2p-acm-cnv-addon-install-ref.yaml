ref:
  as: p2p-acm-cnv-addon-install
  from: cli
  commands: p2p-acm-cnv-addon-install-commands.sh
  timeout: 2h0m0s
  grace_period: 10m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Install OpenShift Virtualization on the ACM spokes through the ACM kubevirt-hyperconverged
    add-on (MCH component cnv-mtv-integrations, enabled by p2p-acm-mtv-integration).

    Each spoke ManagedCluster is labeled acm/cnv-operator-install=true, which makes ACM:
      - deploy CNV via OperatorPolicy and a HyperConverged with decentralizedLiveMigration
        enabled (the CCLM prerequisite),
      - register the cluster as MTV Provider <cluster>-mtv in the mtv-integrations namespace.

    The step then waits, reading spoke state only through ManagedClusterView, for:
      - ManagedClusterAddOn kubevirt-hyperconverged Available,
      - HyperConverged Available,
      - DecentralizedLiveMigration in the KubeVirt feature gates,
      - virt-synchronization-controller Available.

    The installed CNV CSV per spoke is written to acm-cnv-addon-versions.tsv; set
    CNV_EXPECTED_MAJOR_MINOR to fail when the ACM-selected channel resolves to another release.

    Note: the add-on placement also selects local-cluster, so ACM installs CNV on the hub too.

    Requires p2p-acm-mtv-integration and SHARED_DIR/managed-cluster-name-<N> from
    acm-interop-p2p-cluster-install.
  env:
  - name: ACM_SPOKE_CLUSTER_COUNT
    default: "2"
    documentation: Number of spokes (reads SHARED_DIR/managed-cluster-name-1..N).
  - name: CNV_ADDON_NAME
    default: "kubevirt-hyperconverged"
    documentation: ACM add-on (ClusterManagementAddOn / ManagedClusterAddOn) name for CNV.
  - name: CNV_ADDON_CLUSTER_LABEL
    default: "acm/cnv-operator-install"
    documentation: ManagedCluster label that opts a cluster in to the CNV add-on and MTV provider registration.
  - name: CNV_NAMESPACE
    default: "openshift-cnv"
    documentation: CNV namespace on the spokes.
  - name: CNV_HCO_NAME
    default: "kubevirt-hyperconverged"
    documentation: HyperConverged CR name applied by the add-on.
  - name: CNV_KUBEVIRT_NAME
    default: "kubevirt-kubevirt-hyperconverged"
    documentation: KubeVirt CR name managed by HCO.
  - name: CNV_SUBSCRIPTION_NAME
    default: "kubevirt-hyperconverged"
    documentation: Subscription name created by the add-on OperatorPolicy.
  - name: CNV_EXPECTED_MAJOR_MINOR
    default: ""
    documentation: Optional CNV major.minor (e.g. 4.22) the spokes must run; empty disables the check.
  - name: CNV_WAIT_TIMEOUT_MINUTES
    default: "45"
    documentation: Per-spoke timeout for each add-on / HCO / CCLM readiness wait.
  - name: P2P_ACM_VIEW_INTERVAL_SECONDS
    default: "15"
    documentation: ManagedClusterView refresh interval and poll period.
  - name: P2P_ACM_VIEW_WAIT_SECONDS
    default: "180"
    documentation: Time allowed for a ManagedClusterView to be processed by the spoke agent.
