ref:
  as: p2p-mtv-execute-n-parallel-migration
  from: cli
  commands: p2p-mtv-execute-n-parallel-migration-commands.sh
  timeout: 14h0m0s
  grace_period: 15m0s
  resources:
    requests:
      cpu: 200m
      memory: 400Mi
  documentation: |-
    Execute MTV_PLAN_COUNT MTV cross-cluster live migrations (CCLM) in parallel per leg.

    All VMs are created on spoke-1 by the preceding p2p-create-migration-test-vm step.
    Set CNV_TEST_VM_COUNT = MTV_PLAN_COUNT × MTV_VMS_PER_PLAN in the job env.
    Default: 5 plans × 1 VM each = 5 VMs total.

    Plans are named <MTV_PLAN_NAME_PREFIX>-1 … -K; migrations are named
    <MTV_MIGRATION_NAME_PREFIX>-1 … -K (forward) and -1-return … -K-return (return).

    Leg 1 — parallel forward migration (spoke-1 → spoke-2):
      All K Plans and Migrations are submitted back-to-back.  A single polling loop
      waits until every Migration CR reaches Succeeded.

    Leg 2 — parallel return migration (spoke-2 → spoke-1):
      Stale stopped VMs are removed from spoke-1 first, then all K return Plans and
      Migrations are submitted simultaneously.

    Prerequisites:
      - p2p-create-migration-test-vm  : test-vm-1..K×N Running on spoke-1
      - p2p-mtv-bidir-mig-config      : forward + return NetworkMaps/StorageMaps Ready
      - p2p-acm-cnv-install-policy    : DecentralizedLiveMigration + sync controller on both spokes
      - acm-interop-p2p-submariner-install : pod-to-pod connectivity without Globalnet

    Writes ${ARTIFACT_DIR}/mtv-n-parallel-status.txt on success; diagnostics on failure
    under ${ARTIFACT_DIR}/mtv-n-parallel-diagnostics/; JUnit at
    ${ARTIFACT_DIR}/junit_cclm_n_parallel_migration.xml.

  env:
  # ---- Plan count and sizing ----
  - name: MTV_PLAN_COUNT
    default: "5"
    documentation: |-
      Number of parallel migration plans per leg.  Each plan migrates MTV_VMS_PER_PLAN VMs.
      Total VMs = MTV_PLAN_COUNT × MTV_VMS_PER_PLAN.
      CNV_TEST_VM_COUNT in the job env must equal MTV_PLAN_COUNT × MTV_VMS_PER_PLAN.
  - name: MTV_VMS_PER_PLAN
    default: "1"
    documentation: |-
      Number of VMs per migration plan.
      Plan p migrates test-vm-((p-1)*N+1)..test-vm-(p*N) where N=MTV_VMS_PER_PLAN.
      CNV_TEST_VM_COUNT in the job env must equal MTV_PLAN_COUNT × MTV_VMS_PER_PLAN.

  # ---- Plan and migration naming ----
  - name: MTV_PLAN_NAME_PREFIX
    default: "cclm-n-parallel-plan"
    documentation: |-
      Prefix for generated Plan CR names.  Forward plan p is <prefix>-p;
      return plan p is <prefix>-p-return.
  - name: MTV_MIGRATION_NAME_PREFIX
    default: "cclm-n-parallel-run"
    documentation: |-
      Prefix for generated Migration CR names.  Forward migration p is <prefix>-p;
      return migration p is <prefix>-p-return.

  # ---- Provider / map names ----
  - name: MTV_SOURCE_PROVIDER
    default: "spoke-1"
    documentation: MTV source Provider CR name (forward leg source).
  - name: MTV_DEST_PROVIDER
    default: "spoke-2"
    documentation: MTV destination Provider CR name (forward leg destination).

  # ---- Per-plan StorageMap storage class settings ----
  # This step creates one dedicated NetworkMap + StorageMap per plan (and per return plan)
  # rather than sharing a single map across all plans.  Map names are derived automatically
  # from MTV_PLAN_NAME_PREFIX: <prefix>-<n>-netmap / <prefix>-<n>-stormap (forward) and
  # <prefix>-<n>-return-netmap / <prefix>-<n>-return-stormap (return).
  - name: MTV_SOURCE_STORAGE_NAME
    default: "ocs-storagecluster-ceph-rbd-virtualization"
    documentation: StorageClass name on the source spoke (spec.map[].source.name in StorageMap).
  - name: MTV_DESTINATION_STORAGE_CLASS
    default: "ocs-storagecluster-ceph-rbd-virtualization"
    documentation: Destination StorageClass name (spec.map[].destination.storageClass in StorageMap).
  - name: MTV_ADDITIONAL_SOURCE_STORAGE_NAME
    default: ""
    documentation: |
      Optional second source StorageClass for VMs with a secondary data disk on a different
      storage class (e.g. ocs-storagecluster-cephfs).  When non-empty, a second map entry is
      appended to every StorageMap so MTV can map both disk types.  Leave empty (default) for
      the standard single-entry StorageMap.

  # ---- Spoke kubeconfig indices ----
  - name: MTV_SOURCE_SPOKE_INDEX
    default: "1"
    documentation: 1-based SHARED_DIR kubeconfig index for spoke-1 (forward source / return destination).
  - name: MTV_DEST_SPOKE_INDEX
    default: "2"
    documentation: 1-based SHARED_DIR kubeconfig index for spoke-2 (forward destination / return source).

  # ---- Common parameters ----
  - name: MTV_TEST_VM_NAMESPACE
    default: "vm-migration-test"
    documentation: Namespace holding source VMs on spoke-1 and receiving migrated VMs.
  - name: MTV_NAMESPACE
    default: "openshift-mtv"
    documentation: Namespace where MTV Plan, Migration, Provider, and Map CRs live.
  - name: MTV_PLAN_TYPE
    default: "live"
    documentation: Plan spec.type — live for CCLM, cold for powered-off migration.
  - name: MTV_PLAN_READY_TIMEOUT
    default: "15m"
    documentation: Timeout for Provider/Map/Plan Ready waits.
  - name: MTV_MIGRATION_TIMEOUT
    default: "6h"
    documentation: Max duration to wait for all Migration CRs per leg to reach Succeeded.
  - name: MTV_MIGRATION_POLL_INTERVAL_SECONDS
    default: "30"
    documentation: Sleep between parallel migration status polls.
  - name: MTV_CNV_NAMESPACE
    default: "openshift-cnv"
    documentation: OpenShift Virtualization namespace on spokes (KubeVirt/HCO).
  - name: MTV_KUBEVIRT_NAME
    default: "kubevirt-kubevirt-hyperconverged"
    documentation: KubeVirt CR name on spokes (HCO-managed).
  - name: MTV_HCO_NAME
    default: "kubevirt-hyperconverged"
    documentation: HyperConverged CR name patched when ensuring DecentralizedLiveMigration.
  - name: MTV_ENSURE_DECENTRALIZED_LIVE_MIGRATION
    default: "true"
    documentation: Patch HCO featureGates on both spokes when gate is missing (live plans only).
  - name: MTV_FORKLIFT_CONTROLLER_NAME
    default: "forklift-controller"
    documentation: ForkliftController / deployment name on the hub (CCLM preflight).
  - name: MTV_PROVIDER_INVENTORY_REFRESH_WAIT
    default: "5m"
    documentation: Wait for providers Ready after inventory refresh before Plan creation.
  - name: MTV_SYNC_CONTROLLER_WAIT
    default: "10m"
    documentation: Wait for virt-synchronization-controller Available on each spoke.
  - name: P2P_CCLM_DEBUG_MODE
    default: "false"
    documentation: |-
      When true, log failures and exit 0 so downstream debug steps can run.
      Set P2P_CCLM_DEBUG_MODE=true in the job env during CCLM investigation.
