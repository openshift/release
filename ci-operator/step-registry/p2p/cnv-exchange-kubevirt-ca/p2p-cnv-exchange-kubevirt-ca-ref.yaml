ref:
  as: p2p-cnv-exchange-kubevirt-ca
  from: cli
  commands: p2p-cnv-exchange-kubevirt-ca-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
  grace_period: 5m0s
  env:
    - name: CNV_EXCHANGE_KUBEVIRT_CA__SPOKE_COUNT
      default: "2"
      documentation: |-
        Number of ACM spoke clusters to exchange KubeVirt CA bundles between.
        Must match ACM_SPOKE_CLUSTER_COUNT in the enclosing job.
    - name: ACM_SPOKE_CLUSTER_COUNT
      default: ""
      documentation: |-
        Total number of ACM spoke clusters in the job. Must equal
        CNV_EXCHANGE_KUBEVIRT_CA__SPOKE_COUNT. Consumed here only for cross-validation;
        set by the enclosing job (e.g. ACM_SPOKE_CLUSTER_COUNT: "2" for p2p).
    - name: CNV_EXCHANGE_KUBEVIRT_CA__CNV_NS
      default: "openshift-cnv"
      documentation: |-
        Namespace where the kubevirt-ca ConfigMap and CNV components reside.
  documentation: |-
    Exchange KubeVirt CA bundles between all spoke clusters to enable cross-cluster
    live migration (CCLM) mTLS trust.

    KubeVirt's virt-handler watches the kubevirt-ca ConfigMap (key: ca-bundle) in
    the CNV namespace via extensionsKubeVirtCAConfigMapInformer for its TLS client
    and server trust pool.  CCLM uses mTLS over spec.sendTo (port 9185), so each
    spoke's virt-handler must trust the peer spoke's KubeVirt CA.

    MTV (release-v2.11 and later) does not inject the destination CA into the
    VirtualMachineInstance Migration object (spec.sendTo.caCert is absent from the
    CRD schema), making this manual exchange necessary.

    This step:
      1. Reads the kubevirt-ca ConfigMap from each spoke.
      2. Deduplicates the collected PEM certificates by SHA-256 fingerprint.
      3. Patches each spoke's kubevirt-ca ConfigMap with the combined bundle.
      4. Verifies the updated ConfigMap contains at least one cert per spoke.
      5. Writes certificate subject summaries to ARTIFACT_DIR (no PEM content).

    Sensitive data: PEM certificate data is never written to xtrace output or
    ARTIFACT_DIR.  set +x guards protect all variable assignments and function
    calls that expand certificate content.

    Env vars consumed:
      CNV_EXCHANGE_KUBEVIRT_CA__SPOKE_COUNT - number of spokes (default: 2)
      ACM_SPOKE_CLUSTER_COUNT               - must equal SPOKE_COUNT (cross-validation)
      CNV_EXCHANGE_KUBEVIRT_CA__CNV_NS      - CNV namespace (default: openshift-cnv)
      SHARED_DIR                            - kubeconfig files for each spoke
