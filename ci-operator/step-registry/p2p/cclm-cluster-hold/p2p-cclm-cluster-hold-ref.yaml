ref:
  as: p2p-cclm-cluster-hold
  from: cli
  commands: p2p-cclm-cluster-hold-commands.sh
  documentation: |-
    Sleep so the hub and spoke clusters stay installed. Spoke kubeconfigs are
    already in the shared directory from acm-interop-p2p-cluster-install.
    Post steps, including deprovision, run after this step finishes.
  timeout: 2h30m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: HOLD_DURATION
    default: "2h"
    documentation: |-
      How long to keep the clusters. Must be shorter than this step's timeout
      (2h30m). Default is 2 hours.
