ref:
  as: p2p-mtv-create-migration-maps
  from: cli
  commands: p2p-mtv-create-migration-maps-commands.sh
  timeout: 30m0s
  grace_period: 10m0s
  resources:
    requests:
      cpu: 200m
      memory: 400Mi
  documentation: |-
    Create MTV NetworkMap (pod→pod) and StorageMap between two OpenShift providers on the hub.
    Run after p2p-mtv-wait-acm-providers (ACM-created "<cluster>-mtv" providers Ready) and after
    ODF is Available on both spokes; creating StorageMap too early causes StorageRefNotValid.

    MTV_SOURCE_PROVIDER/MTV_DESTINATION_PROVIDER default to empty, in which case the provider
    names are resolved from ${SHARED_DIR}/mtv-acm-provider-name-<MTV_SOURCE_SPOKE_INDEX|
    MTV_DEST_SPOKE_INDEX> written by p2p-mtv-wait-acm-providers. Set either var explicitly to
    pin a provider name instead (e.g. for manually registered providers).

    Forklift StorageMap source uses spec.map[].source.name (StorageClass name on source provider
    inventory). Destination uses storageClass only.

    Annotates both providers for inventory refresh (unless MTV_SKIP_INVENTORY_REFRESH=true),
    applies maps, waits for Ready, and writes ${ARTIFACT_DIR}/mtv-migration-maps-status.txt.

    Hub kubeconfig is KUBECONFIG from ci-operator.
  env:
  - name: MTV_PROVIDER_NAMESPACE
    default: "mtv-integrations"
    documentation: |-
      Namespace where the Provider/NetworkMap/StorageMap CRs live. This is ACM's
      mtv-integrations namespace (where ACM creates "<cluster>-mtv" Provider objects), not the
      MTV operator install namespace (openshift-mtv) — keep the two separate.
  - name: MTV_SOURCE_PROVIDER
    default: ""
    documentation: |-
      Source MTV Provider CR name (migration origin). Empty resolves to
      ${SHARED_DIR}/mtv-acm-provider-name-<MTV_SOURCE_SPOKE_INDEX> (written by
      p2p-mtv-wait-acm-providers). Set explicitly to override.
  - name: MTV_DESTINATION_PROVIDER
    default: ""
    documentation: |-
      Destination MTV Provider CR name (migration target). Empty resolves to
      ${SHARED_DIR}/mtv-acm-provider-name-<MTV_DEST_SPOKE_INDEX> (written by
      p2p-mtv-wait-acm-providers). Set explicitly to override.
  - name: MTV_SOURCE_SPOKE_INDEX
    default: "1"
    documentation: |-
      1-based spoke index used to resolve MTV_SOURCE_PROVIDER from SHARED_DIR when it is
      empty. Same index space as managed-cluster-name-<N> / mtv-acm-provider-name-<N>.
  - name: MTV_DEST_SPOKE_INDEX
    default: "2"
    documentation: |-
      1-based spoke index used to resolve MTV_DESTINATION_PROVIDER from SHARED_DIR when it is
      empty. Same index space as managed-cluster-name-<N> / mtv-acm-provider-name-<N>.
  - name: MTV_NETWORK_MAP_NAME
    default: "spoke-network-map"
    documentation: NetworkMap metadata.name.
  - name: MTV_STORAGE_MAP_NAME
    default: "spoke-storage-map"
    documentation: StorageMap metadata.name.
  - name: MTV_SOURCE_STORAGE_NAME
    default: "ocs-storagecluster-ceph-rbd-virtualization"
    documentation: StorageClass name on the source spoke (spec.map[].source.name).
  - name: MTV_DESTINATION_STORAGE_CLASS
    default: "ocs-storagecluster-ceph-rbd-virtualization"
    documentation: Destination StorageClass name (spec.map[].destination.storageClass).
  - name: MTV_PROVIDER_READY_TIMEOUT
    default: "15m"
    documentation: Timeout for oc wait provider/<name> --for=condition=Ready.
  - name: MTV_MAP_READY_TIMEOUT
    default: "15m"
    documentation: Timeout for NetworkMap/StorageMap Ready waits.
  - name: MTV_SKIP_INVENTORY_REFRESH
    default: "false"
    documentation: Set to "true" to skip forklift.konveyor.io/inventory-refresh annotation.
