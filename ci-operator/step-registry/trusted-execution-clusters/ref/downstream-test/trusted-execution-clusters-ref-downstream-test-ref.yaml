ref:
  as: trusted-execution-clusters-ref-downstream-test
  from: upi-installer
  grace_period: 2m
  commands: trusted-execution-clusters-ref-downstream-test-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: AZURE_REGION
    default: "eastus"
    documentation: |-
      The Azure region to create the short-lived test resource group and storage
      account in.
  documentation: |-
    Rehearsal check for whether the Azure subscription leased via cluster_profile
    can be accessed and used by the (not yet CI-onboarded) downstream
    confidential-clusters/operator repo. Checks whether the az CLI is already
    logged in; if not, looks for service principal credentials in the
    cluster_profile and other probable locations and logs in with them. Once
    logged in, lists existing storage accounts and Shared Image Gallery image
    definitions, then creates a short-lived storage account and uploads a small
    test blob to confirm write access. The resource group it creates is deleted
    at the end of the step regardless of outcome.
