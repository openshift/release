ref:
  as: merge-stage-registry-credentials
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  cli: latest
  grace_period: 10m
  commands: merge-stage-registry-credentials-commands.sh
  timeout: 10m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  credentials:
  - namespace: test-credentials
    name: openshift-custom-mirror-registry
    mount_path: /var/run/vault/mirror-registry
  documentation: |-
    Merges registry.stage.redhat.io pull credentials from the OpenShift CI
    provided openshift-custom-mirror-registry secret into the cluster global
    pull-secret and waits for MachineConfigPool rollout to complete.
