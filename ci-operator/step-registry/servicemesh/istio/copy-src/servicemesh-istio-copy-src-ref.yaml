ref:
  as: servicemesh-istio-copy-src
  from: src
  resources:
    requests:
      cpu: 200m
      memory: 200Mi
  timeout: 10m0s
  commands: servicemesh-istio-copy-src-commands.sh
  env:
  - name: MAISTRA_NAMESPACE
    default: "maistra-e2e-test"
    documentation: |-
      The namespace where the test pod is running.
  - name: MAISTRA_SC_POD
    default: "maistra-e2e-test-sc-pod"
    documentation: |-
      The name of the test pod where source code will be copied.
  documentation: |-
    Copies the Istio source code and kubeconfig to the privileged builder pod
    for image building. Requires MAISTRA_NAMESPACE and MAISTRA_SC_POD environment
    variables to be set. This step must run before servicemesh-istio-images-build.
