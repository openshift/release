ref:
  as: servicemesh-istio-e2e-libvirt-s390x-write-console-url
  cli: latest
  from: cli
  commands: servicemesh-istio-e2e-libvirt-s390x-write-console-url-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  timeout: 5m0s
  documentation: |-
    After libvirt UPI cluster install, reads the OpenShift console Route and
    writes its URL to $SHARED_DIR/console.url so that subsequent ServiceMesh
    test steps (servicemesh-istio-install, servicemesh-kiali-int-tests-execute,
    etc.) can derive OCP_API_URL and CONSOLE_URL without each needing their
    own fallback. The libvirt UPI installer does not write console.url itself.
