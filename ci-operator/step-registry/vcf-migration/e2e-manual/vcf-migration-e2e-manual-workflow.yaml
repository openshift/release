workflow:
  as: vcf-migration-e2e-manual
  steps:
    pre:
    - chain: vcf-migration-pre
    test:
    - ref: vcf-migration-manual-execute
    - ref: vcf-migration-verify
    post:
    - chain: gather-network
    - chain: gather-core-dump
    - chain: ipi-vsphere-post
    env:
      MIN_VCENTERS: "2"
      POOL_COUNT: "2"
  documentation: |-
    Provisions a source vSphere cluster, performs the full migration to a
    second vCenter chosen from a separate VCM pool manually per the runbook
    in openshift/vcf-migration-operator (no vcf-migration-operator is
    deployed), and verifies the cluster is healthy afterwards.
