workflow:
  as: vcf-migration-e2e
  steps:
    pre:
    - chain: vcf-migration-pre
    test:
    - ref: vcf-migration-deploy
    - ref: vcf-migration-execute
    - ref: vcf-migration-verify
    post:
    - chain: gather-network
    - chain: gather-core-dump
    - chain: ipi-vsphere-post
    env:
      MIN_VCENTERS: "2"
      POOL_COUNT: "2"
  documentation: |-
    Provisions a source vSphere cluster, deploys the vcf-migration-operator,
    executes a full migration to a second vCenter chosen from a separate VCM
    pool, and verifies the cluster is healthy afterwards.
