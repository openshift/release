chain:
  as: vcf-migration-pre-compact
  steps:
  - chain: vcf-migration-conf
  - ref: rhcos-conf-osstream
  - chain: ipi-install-vsphere
  - ref: vcf-migration-csi-remove
  documentation: |-
    Provisions a compact (three-node) vSphere cluster used for VCF migration testing.
    Creates 3 schedulable control-plane nodes (8 CPUs, 32 GiB each) with 0 workers.
    Uses SIZE_VARIANT=compact which is handled by ipi-conf-vsphere-vcm.
