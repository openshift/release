workflow:
  as: cert-manager-review-agent-trigger
  steps:
    test:
      - ref: review-agent-trigger
    env:
      PERIODIC_JOB_NAME: "periodic-ci-openshift-cert-manager-operator-master-periodic-review-agent"
      REVIEW_AGENT_UPSTREAM_REPO: "openshift/cert-manager-operator"
  documentation: |-
    Trigger a periodic review-agent run via Gangway API.
    Used by the address-review-comments presubmit job to re-run review-agent
    on demand when a pull request receives review comments that should be addressed.
