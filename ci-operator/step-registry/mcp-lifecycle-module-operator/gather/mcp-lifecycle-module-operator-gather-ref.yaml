ref:
  as: mcp-lifecycle-module-operator-gather
  from: cli
  cli: latest
  commands: mcp-lifecycle-module-operator-gather-commands.sh
  best_effort: true
  env:
  - name: OPERATOR_NAMESPACE
    documentation: |-
      Required. Namespace where the operator is deployed; its resources, events,
      and controller-manager logs are collected.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 5m0s
  documentation: |-
    Best-effort debug collection: dumps all MCPLifecycleOperator custom resources
    (cluster-scoped) and the operator namespace's resources, events, and
    controller-manager logs into ${ARTIFACT_DIR}. Intended as a post step so it
    runs regardless of test outcome.
