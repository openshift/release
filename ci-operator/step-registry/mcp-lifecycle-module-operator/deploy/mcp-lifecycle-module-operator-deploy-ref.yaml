ref:
  as: mcp-lifecycle-module-operator-deploy
  from: src
  cli: latest
  commands: mcp-lifecycle-module-operator-deploy-commands.sh
  dependencies:
  - env: OPERATOR_IMAGE
    name: mcp-lifecycle-module-operator
  - env: MCPLO_OPERAND_IMAGE
    name: mcp-lifecycle-operator
  env:
  - name: OPERATOR_NAMESPACE
    default: mcp-lifecycle-module-operator-system
    documentation: |-
      Namespace where the operator is deployed and whose controller-manager
      rollout is awaited.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 20m0s
  documentation: |-
    Builds and deploys the mcp-lifecycle-module-operator from source via
    `make deploy` and waits for the controller-manager rollout. Applying the
    MCPLifecycleOperator custom resource is a separate concern handled by the
    mcp-lifecycle-module-operator-operand ref.
