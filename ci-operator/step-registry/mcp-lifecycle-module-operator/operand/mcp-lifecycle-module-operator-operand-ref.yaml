ref:
  as: mcp-lifecycle-module-operator-operand
  from: cli
  cli: latest
  commands: mcp-lifecycle-module-operator-operand-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 15m0s
  documentation: |-
    Brings up the mcp-lifecycle operand by applying a Managed
    MCPLifecycleOperator/default custom resource and waiting for it to become
    Ready.

    Assumes the operator and its CRDs are already deployed on the cluster (see
    the mcp-lifecycle-module-operator-deploy ref).
