ref:
  as: mcp-lifecycle-module-operator-tls-scanner-network-policy
  from: cli
  cli: latest
  commands: mcp-lifecycle-module-operator-tls-scanner-network-policy-commands.sh
  env:
  - name: OPERATOR_NAMESPACE
    default: mcp-lifecycle-module-operator-system
    documentation: |-
      Namespace holding the component that the TLS scanner must reach.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 5m0s
  documentation: |-
    Applies a test-scoped, additive NetworkPolicy that lets the host-network
    TLS scanner reach the component.

    It is scoped to the component namespace and cleaned up with it at teardown,
    and is deliberately NOT part of the product manifests.
