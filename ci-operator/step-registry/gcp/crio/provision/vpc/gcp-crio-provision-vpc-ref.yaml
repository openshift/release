ref:
  as: gcp-crio-provision-vpc
  from_image:
    namespace: cri-o
    name: gcloud-base
    tag: latest
  commands: gcp-crio-provision-vpc-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: CRIO_JOBS2_WIF
    default: "false"
    documentation: Use the Jobs 2 rehearsal authentication prepared by gcp-crio-wif-prepare.
  documentation: |-
    The GCP step creates VPC network/subnets/etc. resources, and write the info in "${SHARED_DIR}/customer_vpc_subnets.yaml" for subsequent consumers. 
