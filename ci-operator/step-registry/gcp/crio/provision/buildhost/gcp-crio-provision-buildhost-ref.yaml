ref:
  as: gcp-crio-provision-buildhost
  from_image:
    namespace: cri-o
    name: gcloud-base
    tag: latest
  grace_period: 10m
  commands: gcp-crio-provision-buildhost-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: IMAGE_NAME
    default: ""
  - name: IMAGE_FAMILY
    default: ""
  - name: IMAGE_PROJECT
    default: ""
  - name: BOOT_DISK_SIZE
    default: "200GB"
    documentation: |-
      Boot disk size passed to `gcloud compute instances create --boot-disk-size`. Must be at least the size of the source image.
  documentation: |-
    The step launches Linux build host.
