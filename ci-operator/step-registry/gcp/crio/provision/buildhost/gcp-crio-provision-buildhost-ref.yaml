ref:
  as: gcp-crio-provision-buildhost
  from_image:
    namespace: cri-o
    name: gcloud-base
    tag: latest
  grace_period: 10m
  commands: gcp-crio-provision-buildhost-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: IMAGE_NAME
    default: ""
  - name: IMAGE_FAMILY
    default: ""
  - name: IMAGE_PROJECT
    default: ""
  - name: BOOT_DISK_SIZE
    default: "200GB"
    documentation: |-
      Size of the build host boot disk.
  - name: USE_IGNITION
    default: "false"
    documentation: |-
      Set to "true" for CoreOS images (FCOS/RHCOS): the SSH user and its key are provisioned through an
      Ignition config passed as user-data instead of the ssh-keys metadata.
  documentation: |-
    The step launches Linux build host.
