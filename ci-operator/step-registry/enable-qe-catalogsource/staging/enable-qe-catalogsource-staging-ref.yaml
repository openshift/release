ref:
  as: enable-qe-catalogsource-staging
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  cli: latest
  grace_period: 10m
  commands: enable-qe-catalogsource-staging-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: ENABLE_LEARN_CATALOG
    default: "false"
    documentation: |-
      Serve the public learn test operator alongside stage FBC content in a
      job-local registry pod. The shared stage image is not rebuilt or modified.
  credentials:
  - collection: deploy-konflux-operator
    group: art-image-share
    mount_path: /var/run/vault/deploy-konflux-operator-art-image-share
  - collection: openshift-qe
    group: mirror-registry
    mount_path: /var/run/vault/mirror-registry
  documentation: |-
    Enable the stage FBC CatalogSource in a connected environment.
    Merges quay.io/openshift-art and registry.stage.redhat.io pull
    credentials into the cluster global pull-secret, creates a
    version-gated mirror policy (ICSP for OCP 4.12, IDMS for 4.13+),
    and creates a CatalogSource using
    quay.io/openshift-art/stage-fbc-fragments:ocp-<X.Y>.
    When ENABLE_LEARN_CATALOG is true, the CatalogSource uses a job-local
    registry serving the same stage image with a mounted learn FBC fragment.
    The alpha/beta channels and versions 0.0.1 through 0.0.3 are pinned to public
    quay.io/olmqe bundle and operator images; no private QE index is required.
