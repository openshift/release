ref:
  as: enable-qe-catalogsource-disconnected
  from_image:
    namespace: ci
    name: tests-private-base
    tag: latest
  cli: latest
  grace_period: 10m
  commands: enable-qe-catalogsource-disconnected-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: OO_INDEX
    default: ""
    documentation: |-
      The index image URL. For example: quay.io/openshift-qe-optional-operators/ocp4-index:v4.17
      When unset, the index defaults to
      quay.io/openshift-qe-optional-operators/aosqe-index:v<kube_major>.<kube_minor>,
      derived from the cluster's Kubernetes version. Set this to pin a specific index,
      for example when the version-derived tag is unavailable upstream. The catalogsource
      pulls the override through the pull-through proxy that fronts its registry
      (MIRROR_PROXY_REGISTRY_QUAY for quay.io images, MIRROR_PROXY_REGISTRY otherwise).
  - name: CATALOGSOURCE_NAME
    default: qe-app-registry
    documentation: |-
      System environment variable used to create catalogsource with customized name
  - name: OPERTORS_TO_MIRROR
    default: ""
    documentation: |-
      The optional operators managed by OLM will be mirrored, comma-separated values. for example: elasticsearch-operator,cincinnati-operator,file-integrity-operator
  - name: SELF_MANAGED_ADDITIONAL_CA
    default: ""
    documentation: Use the CA of regsitry server cert from cluster profile, set to `true` to enable
  - name: SKIP_QE_APP_REGISTRY
    default: "false"
    documentation: |-
      Set to true to skip QE catalogsource installation
  credentials:
  - namespace: test-credentials
    name: openshift-custom-mirror-registry
    mount_path: /var/run/vault/mirror-registry
  documentation: |-
    Install QE catalog source for OLM operators in disconnected env.
