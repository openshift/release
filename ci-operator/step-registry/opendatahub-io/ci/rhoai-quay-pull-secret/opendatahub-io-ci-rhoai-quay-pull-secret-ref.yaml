ref:
  as: opendatahub-io-ci-rhoai-quay-pull-secret
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  cli: latest
  commands: opendatahub-io-ci-rhoai-quay-pull-secret-commands.sh
  grace_period: 30s
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - namespace: test-credentials
    name: opendatahub-rhoai-quay-pull
    mount_path: /var/run/secrets/rhoai-quay-pull
  documentation: |-
    Merges quay.io/rhoai robot pull credentials into the cluster global
    pull-secret (openshift-config/pull-secret) so e2e workloads can pull
    private RHOAI component images by digest.

    Expects Vault secret synced to test-credentials/opendatahub-rhoai-quay-pull
    with key pull-secret containing base64(user:token) for the Quay robot.
