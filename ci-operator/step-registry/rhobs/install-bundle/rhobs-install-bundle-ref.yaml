ref:
  as: rhobs-install-bundle
  from: operator-sdk
  cli: latest
  commands: rhobs-install-bundle-commands.sh
  dependencies:
  - env: OO_BUNDLE
    name: observability-bundle
  resources:
    requests:
      cpu: 100m
      memory: 400Mi
  documentation: |-
    Installs the CI-built Cluster Observability Operator bundle in the coo namespace,
    waits for its deployments, and saves the CSV for rhobs-enable-ocp.
