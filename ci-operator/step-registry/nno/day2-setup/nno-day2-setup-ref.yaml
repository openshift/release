ref:
  as: nno-day2-setup
  from: nvidia-ci
  cli: latest
  commands: nno-day2-setup-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 2h0m0s
  documentation: |-
    Apply NVIDIA Network Operator day-2 manifests, including the lab's DOCA 1
    udev rules, and wait for the worker MachineConfigPool rollout.
