ref:
  as: nno-capture-workers
  from: cli
  cli: latest
  commands: nno-capture-workers-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 2m0s
  documentation: |-
    Record the installed worker names in SHARED_DIR/nno-expected-workers before
    changing firmware. Fail before the transition if the inventory cannot be
    read or is empty. The nno-wait-for-workers step uses this saved inventory
    after the transition, including workers whose Node objects are then absent.
    Honor skip-work-steps and skip-nno-precompiled before accessing the cluster.
