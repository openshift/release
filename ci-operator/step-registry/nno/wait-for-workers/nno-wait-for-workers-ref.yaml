ref:
  as: nno-wait-for-workers
  from: cli
  cli: latest
  commands: nno-wait-for-workers-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 25m0s
  documentation: |-
    After firmware validation, wait for every worker to renew its kubelet Lease
    and report Ready. Use the worker names saved by nno-capture-workers before
    the transition and snapshot Lease renewals at wait start, so missing Node
    objects cannot shrink the expected inventory and stale Ready conditions
    alone cannot pass the check. Poll every 10 seconds
    with one 20-minute deadline, including API requests. Workers that did not
    need a reboot also pass after their next heartbeat. Honor skip-work-steps
    and skip-nno-precompiled before accessing the cluster.
