chain:
  as: nno-cluster-setup
  steps:
  - ref: dpf-hypervisor-deploy-cluster
  - ref: dpf-hypervisor-load-kubeconfig
  - ref: nno-day2-setup
  - ref: openshift-qe-cluster-health
  documentation: |-
    Provision the selected lab profile with the configured or explicitly requested OCP
    version, load its kubeconfig, apply the NNO day-2 setup, and check cluster
    health for the signed NNO workflow. The regular workflow keeps its
    existing setup.
