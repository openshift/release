ref:
  as: nno-install-signed-driver
  from: nvidia-ci
  commands: nno-install-signed-driver-commands.sh
  env:
  - name: DUMP_FAILED_TESTS
  - name: TEST_TRACE
  - name: VERBOSE_LEVEL
  resources:
    requests:
      cpu: 2000m
      memory: 2Gi
  timeout: 2h0m0s
  documentation: |-
    Install NNO and create its NicClusterPolicy with the explicitly requested
    staging precompiled driver image. The runner verifies the policy-rendered
    image on both configured RDMA workers before this step succeeds.
