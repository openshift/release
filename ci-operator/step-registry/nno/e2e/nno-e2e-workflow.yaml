workflow:
  as: nno-e2e
  steps:
    test:
      - ref: dpf-hypervisor-secure-boot-disable
      - ref: dpf-hypervisor-deploy-cluster
      - ref: dpf-hypervisor-load-kubeconfig
      - as: apply-nno-day2
        cli: latest
        commands: |
          set -euo pipefail
          udev_file="${CLUSTER_PROFILE_DIR}/doca1-udev-network-rules-base64"
          e2e_env="${CLUSTER_PROFILE_DIR}/nno-e2e-env"
          if [[ -f "${udev_file}" ]]; then
            DOCA1_UDEV_NETWORK_RULES_BASE64="$(tr -d '\n' < "${udev_file}")"
            export DOCA1_UDEV_NETWORK_RULES_BASE64
          elif [[ -f "${e2e_env}" ]]; then
            udev_line="$(grep -E '^DOCA1_UDEV_NETWORK_RULES_BASE64=' "${e2e_env}" || true)"
            if [[ -n "${udev_line}" ]]; then
              export "${udev_line}"
            fi
          fi
          if [[ -z "${DOCA1_UDEV_NETWORK_RULES_BASE64:-}" ]]; then
            echo "DOCA1_UDEV_NETWORK_RULES_BASE64 is not set (need ${udev_file} or that key in nno-e2e-env)"
            exit 1
          fi
          export WAIT_FOR_WORKER_MCP=true
          export WORKER_MCP_ROLLOUT_START_TIMEOUT=4m
          export WORKER_MCP_ROLLOUT_TIMEOUT=40m
          export WORKER_MCP_NAME=worker
          make apply-manifests
        from: nvidia-ci
        resources:
          requests:
            cpu: 100m
            memory: 200Mi
        timeout: 2h0m0s
      - ref: openshift-qe-cluster-health
      - as: network-operator-e2e-shared-device
        commands: |
          set -euo pipefail
          e2e_env="${CLUSTER_PROFILE_DIR}/nno-e2e-env"
          if [[ ! -f "${e2e_env}" ]]; then
            echo "Missing cluster-profile file nno-e2e-env"
            exit 1
          fi
          set -o allexport
          source "${e2e_env}"
          set +o allexport
          if [[ -n "${NNO_SUBSCRIPTION_CHANNEL:-}" ]]; then
            export NVIDIANETWORK_SUBSCRIPTION_CHANNEL="${NNO_SUBSCRIPTION_CHANNEL}"
            export NVIDIANETWORK_DEPLOY_FROM_BUNDLE=false
            unset NVIDIANETWORK_OFED_DRIVER_VERSION NVIDIANETWORK_OFED_REPOSITORY \
              NVIDIANETWORK_OFED_DRIVER_PULLSPEC
          fi
          export TEST_FEATURES=nvidianetwork
          export TEST_LABELS='deploy'
          export NVIDIANETWORK_CLEANUP=false
          export NVIDIANETWORK_RDMA_LINK_TYPE=ethernet
          export NVIDIANETWORK_RDMA_NETWORK_TYPE=shared-device
          export NVIDIANETWORK_RDMA_WORKLOAD_NAMESPACE=default
          export NVIDIANETWORK_RDMA_GPUDIRECT=false
          make run-tests
        env:
          - name: DUMP_FAILED_TESTS
          - name: NNO_SUBSCRIPTION_CHANNEL
          - name: TEST_TRACE
          - name: VERBOSE_LEVEL
        from: nvidia-ci
        resources:
          requests:
            cpu: 2000m
            memory: 2Gi
      - as: gpu-operator-e2e
        commands: |
          set -euo pipefail
          export TEST_FEATURES=nvidiagpu
          export TEST_LABELS=nvidia-ci,gpu
          export TEST_VERBOSE=true
          export NVIDIAGPU_CLEANUP=false
          export NVIDIAGPU_DEPLOY_FROM_BUNDLE=false
          export NVIDIAGPU_GPU_CLUSTER_POLICY_PATCH='[{"op": "add", "path": "/spec/driver/rdma", "value": {"enabled": true} }]'
          make run-tests
        env:
          - name: DUMP_FAILED_TESTS
          - name: TEST_TRACE
          - name: VERBOSE_LEVEL
        from: nvidia-ci
        resources:
          requests:
            cpu: 2000m
            memory: 2Gi
        timeout: 2h0m0s
      - as: network-operator-e2e-gpudirect
        commands: |
          set -euo pipefail
          e2e_env="${CLUSTER_PROFILE_DIR}/nno-e2e-env"
          if [[ ! -f "${e2e_env}" ]]; then
            echo "Missing cluster-profile file nno-e2e-env"
            exit 1
          fi
          set -o allexport
          source "${e2e_env}"
          set +o allexport
          if [[ -n "${NNO_SUBSCRIPTION_CHANNEL:-}" ]]; then
            export NVIDIANETWORK_SUBSCRIPTION_CHANNEL="${NNO_SUBSCRIPTION_CHANNEL}"
            export NVIDIANETWORK_DEPLOY_FROM_BUNDLE=false
            unset NVIDIANETWORK_OFED_DRIVER_VERSION NVIDIANETWORK_OFED_REPOSITORY \
              NVIDIANETWORK_OFED_DRIVER_PULLSPEC
          fi
          export TEST_FEATURES=nvidianetwork
          export TEST_LABELS=rdma-shared-dev
          export NVIDIANETWORK_CLEANUP=false
          export NVIDIANETWORK_RDMA_LINK_TYPE=ethernet
          export NVIDIANETWORK_RDMA_NETWORK_TYPE=shared-device
          export NVIDIANETWORK_RDMA_WORKLOAD_NAMESPACE=default
          export NVIDIANETWORK_RDMA_GPUDIRECT=true
          make run-tests
        env:
          - name: DUMP_FAILED_TESTS
          - name: NNO_SUBSCRIPTION_CHANNEL
          - name: TEST_TRACE
          - name: VERBOSE_LEVEL
        from: nvidia-ci
        resources:
          requests:
            cpu: 2000m
            memory: 2Gi
      - as: nno-prepare-precompiled
        from: nvidia-ci
        cli: latest
        commands: |-
          set -euo pipefail
          if [[ -f "${SHARED_DIR}/skip-work-steps" ]]; then
            echo "Skipping precompiled preparation: skip-work-steps is present."
            exit 0
          fi
          profile="${CLUSTER_PROFILE_DIR}/nno-e2e-env"
          [[ -f "${profile}" ]] || { echo "Missing nno-e2e-env" >&2; exit 1; }
          requested_channel="${NNO_SUBSCRIPTION_CHANNEL:-}"
          set -a
          # shellcheck disable=SC1090
          source "${profile}"
          set +a
          if [[ -n "${requested_channel}" ]]; then
            export NVIDIANETWORK_SUBSCRIPTION_CHANNEL="${requested_channel}"
            export NVIDIANETWORK_DEPLOY_FROM_BUNDLE=false
          fi
          # The mixed lane discovers against the same installed NNO release as before.
          # Profile image pins must not override the selected lane or the phase handoff.
          unset NVIDIANETWORK_OFED_DRIVER_VERSION NVIDIANETWORK_OFED_REPOSITORY NVIDIANETWORK_OFED_DRIVER_PULLSPEC
          export TEST_FEATURES=nvidianetwork
          export NVIDIANETWORK_CLEANUP=false
          export NVIDIANETWORK_USE_PRECOMPILED_OFED=true
          export NVIDIANETWORK_REUSE_NNO=true
          export NVIDIANETWORK_RDMA_LINK_TYPE=ethernet
          export NVIDIANETWORK_RDMA_NETWORK_TYPE=shared-device
          export NVIDIANETWORK_RDMA_WORKLOAD_NAMESPACE=default
          export NVIDIANETWORK_RDMA_GPUDIRECT=false
          handoff="${SHARED_DIR}/nno-precompiled-pullspec"
          export KUBECONFIG="${SHARED_DIR}/kubeconfig"
          NNO_STEP_ATTEMPT="${BUILD_ID:-local}-$(date +%s)-$$"
          export NNO_STEP_ATTEMPT
          rm -f "${handoff}" "${SHARED_DIR}/skip-nno-precompiled"
          export TEST_LABELS=deploy
          export NVIDIANETWORK_PREPARE_PRECOMPILED_ONLY=true
          export NNO_STEP_NAME=network-operator-e2e-precompiled-prepare
          make run-tests
          if [[ -f "${SHARED_DIR}/skip-nno-precompiled" ]]; then
            echo "No compatible image; leaving driver configuration and Secure Boot unchanged."
            exit 0
          fi
          [[ -s "${handoff}" ]] || { echo "Preparation did not publish a selected image" >&2; exit 1; }
          NVIDIANETWORK_PREPARE_PRECOMPILED_ONLY=false \
            ARTIFACT_DIR="${ARTIFACT_DIR}/driver-cleanup" \
            make cleanup-nno-drivers
        env:
        - name: DUMP_FAILED_TESTS
        - name: NNO_SUBSCRIPTION_CHANNEL
        - name: TEST_TRACE
        - name: VERBOSE_LEVEL
        resources:
          requests:
            cpu: 2000m
            memory: 2Gi
        timeout: 45m0s
        grace_period: 2m0s
      - ref: nno-capture-workers
      - ref: dpf-hypervisor-secure-boot-enable
      - ref: nno-wait-for-workers
      - as: network-operator-e2e-precompiled
        commands: |-
          set -euo pipefail
          if [[ -f "${SHARED_DIR}/skip-work-steps" || -f "${SHARED_DIR}/skip-nno-precompiled" ]]; then
            echo "Skipping precompiled tests."
            exit 0
          fi
          profile="${CLUSTER_PROFILE_DIR}/nno-e2e-env"
          [[ -f "${profile}" ]] || { echo "Missing nno-e2e-env" >&2; exit 1; }
          requested_channel="${NNO_SUBSCRIPTION_CHANNEL:-}"
          set -a
          # shellcheck disable=SC1090
          source "${profile}"
          set +a
          if [[ -n "${requested_channel}" ]]; then
            export NVIDIANETWORK_SUBSCRIPTION_CHANNEL="${requested_channel}"
            export NVIDIANETWORK_DEPLOY_FROM_BUNDLE=false
          fi
          # The mixed lane discovers against the same installed NNO release as before.
          # Profile image pins must not override the selected lane or the phase handoff.
          unset NVIDIANETWORK_OFED_DRIVER_VERSION NVIDIANETWORK_OFED_REPOSITORY NVIDIANETWORK_OFED_DRIVER_PULLSPEC
          export TEST_FEATURES=nvidianetwork
          export NVIDIANETWORK_CLEANUP=false
          export NVIDIANETWORK_USE_PRECOMPILED_OFED=true
          export NVIDIANETWORK_REUSE_NNO=true
          export NVIDIANETWORK_RDMA_LINK_TYPE=ethernet
          export NVIDIANETWORK_RDMA_NETWORK_TYPE=shared-device
          export NVIDIANETWORK_RDMA_WORKLOAD_NAMESPACE=default
          export NVIDIANETWORK_RDMA_GPUDIRECT=false
          handoff="${SHARED_DIR}/nno-precompiled-pullspec"
          export KUBECONFIG="${SHARED_DIR}/kubeconfig"
          NNO_STEP_ATTEMPT="${BUILD_ID:-local}-$(date +%s)-$$"
          export NNO_STEP_ATTEMPT
          export NVIDIANETWORK_PREPARE_PRECOMPILED_ONLY=false
          [[ -s "${handoff}" ]] || { echo "Missing selected precompiled image handoff" >&2; exit 1; }
          NVIDIANETWORK_OFED_DRIVER_PULLSPEC="$(tr -d '\n' < "${handoff}")"
          [[ -n "${NVIDIANETWORK_OFED_DRIVER_PULLSPEC}" ]] || { echo "Empty precompiled image handoff" >&2; exit 1; }
          export NVIDIANETWORK_OFED_DRIVER_PULLSPEC
          export TEST_LABELS='deploy || rdma-shared-dev'
          export NNO_STEP_NAME=network-operator-e2e-precompiled
          make run-tests
          python3 scripts/nno/verify-precompiled-step-result.py
        env:
          - name: DUMP_FAILED_TESTS
          - name: NNO_SUBSCRIPTION_CHANNEL
          - name: TEST_TRACE
          - name: VERBOSE_LEVEL
        from: nvidia-ci
        resources:
          requests:
            cpu: 2000m
            memory: 2Gi
    post:
      - ref: gather-extra
      - ref: gather-must-gather
    allow_skip_on_success: true
    env:
      DPF_DEPLOY_MAKE_TARGET: create-base-cluster
      DPF_SKIP_CI_PAYLOAD: "true"
      REDFISH_INSECURE: "true"
      DPF_OPENSHIFT_VERSION: "4.22"
      NNO_SUBSCRIPTION_CHANNEL: ""
      DUMP_FAILED_TESTS: "true"
      TEST_TRACE: "true"
      TIMEOUT: 120m
      VERBOSE_LEVEL: "100"
  documentation: |-
    Deploy a base OpenShift cluster on the selected lab profile with DPF, apply
    NVIDIA Network Operator day-2 manifests from the nvidia-ci image, then run
    the shared-device, GPU operator, GPUDirect, and precompiled OFED e2e suites.
    Skip CI payload injection so installation keeps the lane's selected
    DPF_OPENSHIFT_VERSION and Assisted Installer path when openshift-dpf consumes
    PAYLOAD_URL, rather than adopting the payload's version and on-prem installer.
    Installation establishes Secure Boot disabled before OCP installation. The
    existing cluster health check runs after day-2 setup. After
    standard tests, preparation selects
    a compatible signed image, then calls nvidia-ci's cleanup-nno-drivers target
    to stop the earlier driver workloads. The workflow
    enables Secure Boot and waits for workers to be Ready before signed
    deployment and shared-device RDMA tests.
    GPUDirect is disabled for the signed phase. No matching image skips the
    entire transition and signed phase before hardware changes.
    The cluster profile stays on the consuming test so the nightly and the
    manual presubmit share this workflow. A consuming test can set
    NNO_SUBSCRIPTION_CHANNEL (for example v26.7) to pin the NVIDIA Network
    Operator release family; the value is applied after the cluster-profile
    environment is sourced so profile defaults cannot silently override the
    lane. A lane also clears profile driver version, repository and pull-spec
    pins so precompiled selection can discover a compatible pair.
    Set latest-ga to discover the newest quarterly GA channel available
    in the cluster catalog; the job saves that channel for later stages.
    The precompiled stage sets NVIDIANETWORK_REUSE_NNO=true so it never
    reinstalls or changes the operator. Driver selection uses the requested
    catalog channel's CSV version, then verifies the installed NNO release family
    before changing the driver. Matching images must exist for both RDMA workers.
    No compatible pair skips that stage before changing the driver. When a pair
    is available, missing NNO fails the reuse stage. These modes
    require the companion nvidia-ci channel and pairing implementation. Leave
    the parameter unset to preserve cluster-profile channel defaults.
