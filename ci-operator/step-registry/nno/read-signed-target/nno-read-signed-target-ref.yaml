ref:
  as: nno-read-signed-target
  commands: nno-read-signed-target-commands.sh
  documentation: |-
    Call scripts/nno/validate-signed-request.py from the PR source to validate
    schema version 1 and exactly one planned pair from
    nno_doca2_signed_matrix.json in the nvidia-ci checkout before any lab
    deployment. Require an exact OCP z-stream and complete staging DOCA image
    pull specification. Write dpf-openshift-version and ofed-pullspec to
    SHARED_DIR. Preserve optional kernel, architecture, and digest assertions
    in the normalized request published to the step artifacts and SHARED_DIR. Missing
    or invalid requests fail without using a default or discovery fallback.
  from: src
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
