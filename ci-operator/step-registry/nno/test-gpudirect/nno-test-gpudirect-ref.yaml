ref:
  as: nno-test-gpudirect
  from: nvidia-ci
  commands: nno-test-gpudirect-commands.sh
  env:
  - name: DUMP_FAILED_TESTS
  - name: TEST_TRACE
  - name: VERBOSE_LEVEL
  resources:
    requests:
      cpu: 2000m
      memory: 2Gi
  documentation: |-
    Run signed-flow shared-device GPUDirect RDMA through the nvidia-ci helper.
    Require the explicit driver request and assert that driver remains active
    on both configured RDMA workers before exercising GPUDirect. Missing or skipped results fail the step.
