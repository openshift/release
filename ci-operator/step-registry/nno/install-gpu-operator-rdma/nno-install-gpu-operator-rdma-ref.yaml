ref:
  as: nno-install-gpu-operator-rdma
  from: nvidia-ci
  commands: nno-install-gpu-operator-rdma-commands.sh
  env:
  - name: DUMP_FAILED_TESTS
  - name: NVIDIAGPU_PRECOMPILED_DRIVER_BRANCH
    default: ""
    documentation: |-
      Precompiled GPU driver selection. Dedicated signed NNO workflows use
      kernel-based production discovery when empty, or one full release override.
  - name: NVIDIAGPU_SUBSCRIPTION_CHANNEL
    default: ""
    documentation: |-
      GPU Operator subscription channel override. When empty, use the default
      channel from the running cluster's selected GPU Operator catalog.
  - name: TEST_TRACE
  - name: VERBOSE_LEVEL
  resources:
    requests:
      cpu: 2000m
      memory: 2Gi
  timeout: 2h0m0s
  documentation: |-
    Install the NVIDIA GPU Operator and enable RDMA in its ClusterPolicy.
    When a signed NNO handoff is present, nvidia-ci instead uses production
    precompiled open GPU modules with GPUDirect through DMA-BUF.
