chain:
  as: medik8s-system-tests-s390x-install-operators
  steps:
  - chain: medik8s-setup
  documentation: |-
    Explicit RHWA (medik8s) operator deploy step on the s390x Orange Zone cluster.
    Wraps the shared medik8s-setup chain so job configs only need to set OPERATORS,
    OO_CHANNEL, and OCP_VERSION:
      1. medik8s-lib — shared helpers to SHARED_DIR
      2. medik8s-catalogsource — Konflux rhwa-fbc CatalogSource + IDMS
      3. medik8s-operator-subscribe — namespace, OperatorGroup, Subscriptions;
         waits for each CSV to reach Succeeded
    Enable operators per job via OPERATORS, e.g.
    node-healthcheck-operator,self-node-remediation or node-maintenance-operator.
