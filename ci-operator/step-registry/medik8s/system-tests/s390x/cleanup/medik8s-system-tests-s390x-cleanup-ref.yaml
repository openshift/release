ref:
  as: medik8s-system-tests-s390x-cleanup
  from: cli
  commands: medik8s-system-tests-s390x-cleanup-commands.sh
  best_effort: true
  timeout: 15m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: INSTALL_NAMESPACE
    default: openshift-workload-availability
  - name: CATALOG_SOURCE_NAME
    default: medik8s-catalog
  - name: IDMS_NAME
    default: medik8s-konflux
  documentation: |-
    Best-effort removal of medik8s operator subscriptions, namespace, Konflux catalog,
    and IDMS after system-tests on s390x OZ libvirt clusters.
