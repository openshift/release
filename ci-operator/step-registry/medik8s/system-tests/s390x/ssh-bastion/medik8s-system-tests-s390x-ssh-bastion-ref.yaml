ref:
  as: medik8s-system-tests-s390x-ssh-bastion
  from: upi-installer
  commands: medik8s-system-tests-s390x-ssh-bastion-commands.sh
  grace_period: 30s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: MEDIK8S_S390X_SSH_BASTION
    default: "false"
    documentation: |-
      When "true", deploy an s390x-capable sshd (centos stream9 + openssh-server)
      in test-ssh-bastion so system-tests can SSH to worker nodes for kubelet
      stop/start. Does not use quay.io/eparis/ssh (amd64-only). Libvirt OZ has no
      cloud LoadBalancer; records port-forward mode in SHARED_DIR for run-tests.
      Set to "false" for smoke / NMO jobs that do not need node SSH.
  documentation: |-
    Conditionally installs an s390x-capable hostNetwork ssh-bastion (sshd :2222)
    for medik8s system-tests on libvirt OZ. No-op when MEDIK8S_S390X_SSH_BASTION
    is not true. Pairs with run-tests port-forward + ssh PATH wrapper so
    kubelet-stop can reach node InternalIPs on the machine network.
