ref:
  as: medik8s-system-tests-s390x-ssh-bastion
  from: upi-installer
  commands: medik8s-system-tests-s390x-ssh-bastion-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: MEDIK8S_S390X_SSH_BASTION
    default: "false"
    documentation: |-
      When "true", deploy the eparis/ssh-bastion host in the test-ssh-bastion namespace
      so system-tests can SSH to worker nodes (kubelet stop/start for NHC/SNR destructive
      and NHC acceptance). Set to "false" for smoke-only jobs.
  documentation: |-
    Conditionally installs the CI ssh-bastion used by medik8s system-tests on libvirt
    clusters. No-op when MEDIK8S_S390X_SSH_BASTION is not true.
