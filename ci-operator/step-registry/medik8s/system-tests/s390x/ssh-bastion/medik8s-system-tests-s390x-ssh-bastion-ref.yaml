ref:
  as: medik8s-system-tests-s390x-ssh-bastion
  from: upi-installer
  commands: medik8s-system-tests-s390x-ssh-bastion-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: MEDIK8S_S390X_SSH_BASTION
    default: "false"
    documentation: |-
      When "true", deploy the eparis/ssh-bastion host in the test-ssh-bastion namespace
      so system-tests can SSH to worker nodes (kubelet stop/start for NHC destructive
      tests). Libvirt OZ has no cloud LoadBalancer, so this step records
      port-forward mode in SHARED_DIR for medik8s-system-tests-s390x-run-tests.
      Set to "false" for smoke / NMO jobs that do not need node SSH.
  documentation: |-
    Conditionally installs the CI ssh-bastion used by medik8s system-tests on libvirt
    OZ clusters. No-op when MEDIK8S_S390X_SSH_BASTION is not true. On libvirt (no LB
    ingress) pairs with run-tests port-forward + SSH ProxyCommand so kubelet-stop
    can reach node InternalIPs.
