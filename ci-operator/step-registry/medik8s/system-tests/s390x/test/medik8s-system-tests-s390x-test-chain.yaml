chain:
  as: medik8s-system-tests-s390x-test
  steps:
  - chain: medik8s-system-tests-s390x-install-operators
  - ref: medik8s-system-tests-s390x-ssh-bastion
  - ref: medik8s-system-tests-s390x-run-tests
  documentation: |-
    Deploys RHWA operators on a provisioned s390x OCP cluster and runs the
    system-tests Ginkgo suite. Order:
      1. medik8s-system-tests-s390x-install-operators — rhwa-fbc catalog +
         OLM subscribe from OPERATORS (via medik8s-setup)
      2. medik8s-system-tests-s390x-ssh-bastion — no-op unless
         MEDIK8S_S390X_SSH_BASTION=true (destructive / NHC acceptance)
      3. medik8s-system-tests-s390x-run-tests — make run-tests with ECO_TEST_*
    Component cleanup and cluster teardown are handled by the workflow post phase.
