ref:
  as: medik8s-fbc-upgrade
  from: fbc-upgrade-test-runner
  cli: latest
  commands: medik8s-fbc-upgrade-commands.sh
  env:
  - name: FBC_OPERATOR
    default: ""
    documentation: Operator suite to run (nhc, sbr, snr, far, mdr, or nmo).
  - name: FBC_CATALOG_IMAGE
    default: quay.io/redhat-user-workloads/rhwa-tenant/rhwa-fbc/rhwa-fbc-500@sha256:e999cbe4fb3604d66ee71c9927827c2a88852b1456cb274ff1d673f1db9ce8fd
    documentation: |-
      Public Konflux FBC from source commit 8c9972727d69b2abf9312ddc9e9b270aaf67597c.
      Update the embedded IDMS and per-job controller digests together with this image.
  - name: FBC_CANDIDATE_VERSION
    default: "5.8.0"
    documentation: Exact candidate CSV version expected after upgrading from GA.
  - name: FBC_CANDIDATE_IMAGE
    default: ""
    documentation: Digest-pinned controller pullspec from the selected operator's bundle.
  - name: FBC_CANDIDATE_MIRROR
    default: ""
    documentation: Public Quay mirror repository for that controller, without a tag or digest.
  - name: FBC_CHANNEL
    default: stable
    documentation: Catalog channel used for the GA baseline and candidate upgrade.
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
  documentation: |-
    Runs one operator's merged tier:upgrade-operator test against a supplied RHWA FBC.
    Applies release mirrors through the Go test, installs GA from redhat-operators,
    upgrades the Subscription, and verifies version, image, persistent configuration,
    and the operator-specific lifecycle. No source images are built. SBR needs no ODF;
    FAR does not fence machines. NHC and SNR remediate workers; NMO drains a worker.
