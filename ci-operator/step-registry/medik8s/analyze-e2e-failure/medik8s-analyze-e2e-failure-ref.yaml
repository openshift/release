ref:
  as: medik8s-analyze-e2e-failure
  from: claude-ai-helpers
  best_effort: true
  commands: medik8s-analyze-e2e-failure-commands.sh
  timeout: 30m0s
  grace_period: 30s
  env:
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
    documentation: |-
      Enable Vertex AI for Claude Code.
  - name: CLOUD_ML_REGION
    default: "global"
    documentation: |-
      Google Cloud region for Vertex AI.
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "itpc-gcp-hybrid-pe-eng-claude"
    documentation: |-
      Google Cloud project ID for Vertex AI authentication.
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/token"
    documentation: |-
      Path to the Google Cloud service account JSON key file for Vertex AI authentication.
  - name: CLAUDE_MODEL
    default: "claude-opus-4-6"
    documentation: |-
      Claude model to use for test failure analysis.
  - name: TEST_NAME
    default: "openshift-e2e"
    documentation: |-
      The test name (as: field) in the ci-operator config. Used to construct
      the GCS artifact path. Override if your test uses a different name.
  - name: TEST_STEPS
    default: "test-command"
    documentation: |-
      Space-separated list of test step names to check for finished.json.
      These are the inner step names (as: fields) within the test definition.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  credentials:
  - namespace: test-credentials
    name: sa-claude-openshift-ci
    mount_path: /var/run/claude-code-service-account
  documentation: |-
    Post-step that uses Claude to analyze e2e test failures for medik8s operators.
    Only runs when test failures are detected (polls GCS for finished.json).
    On success (no test failures), exits early with no cost.
    Produces a markdown analysis report in ARTIFACT_DIR.
