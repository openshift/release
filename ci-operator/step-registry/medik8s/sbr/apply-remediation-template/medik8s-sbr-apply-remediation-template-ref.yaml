ref:
  as: medik8s-sbr-apply-remediation-template
  from: cli
  grace_period: 1m
  commands: medik8s-sbr-apply-remediation-template-commands.sh
  env:
  - name: INSTALL_NAMESPACE
    default: openshift-workload-availability
    documentation: |-
      Namespace where the SBR and NHC operators are installed and where the
      StorageBasedRemediationTemplate is created.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Creates the StorageBasedRemediationTemplate "storagebasedremediationtemplate-sample"
    that NodeHealthCheck references as its remediationTemplate. The SBR bundle ships
    this only as an alm-examples sample (not auto-created on install), so NHC-driven
    SBR remediation specs need this step to run after the operators are subscribed.
    Run after the medik8s-setup chain (SBR CRD must already be installed).
