ref:
  as: medik8s-sbr-nfs-dynamic-provisioner
  from: cli
  grace_period: 10m
  commands: medik8s-sbr-nfs-dynamic-provisioner-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Deploys an in-cluster NFS dynamic provisioner for SBR unknown-provisioner
    tests. Creates a StorageClass "nfs-sbr-dynamic" with provisioner
    "sbr.io/nfs-provisioner" and reclaimPolicy Retain, which SBR treats as
    an unknown provisioner and triggers testRWXSupport validation.
