ref:
  as: etcd-encryption-vault-install
  from: tests
  commands: etcd-encryption-vault-install-commands.sh
  credentials:
  - namespace: test-credentials
    name: tests-private-account
    mount_path: /var/run/vault/tests-private-account
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: VAULT_ENTERPRISE_IMAGE
    default: "quay.io/openshifttest/vault-enterprise:2.0.0-ent"
    documentation: |-
      Full reference for the Vault Enterprise image installed via Helm in encryption-kms jobs.
      Override at job level to trial a new Vault Enterprise image. On baremetalds jobs the
      repository, mirror source, Helm repository/tag, and local mirror tag are derived from
      this value.
  - name: VAULT_CHART_VERSION
    default: "0.28.1"
    documentation: |-
      Version of the Vault Helm chart to use.
      Check https://github.com/hashicorp/vault-helm/releases for available versions.
  - name: VAULT_NAMESPACE
    default: "vault-kms"
    documentation: |-
      Namespace where Vault Enterprise will be installed.
  - name: VAULT_SECONDARY_NAMESPACE
    default: "vault-kms-secondary"
    documentation: |-
      Namespace where the second Vault Enterprise instance will be installed.
  - name: VAULT_KMS_PLUGIN_IMAGE
    default: "quay.io/openshifttest/vault-kube-kms@sha256:222bba6cc71fb7527bac262b67f614152491105c25f3f0a7a19385a5d878123a"
    documentation: |-
      Full reference for the vault-kube-kms plugin image used by encryption-kms tests.
      Source: quay.io/openshifttest/vault-kube-kms:0.1.0-beta-ubi (manifest list, pinned by digest).
      Override at job level to trial a new plugin image.
      On baremetalds jobs the repository, mirror source, and local mirror tag are all
      derived from this value.
  - name: VAULT_HA_REPLICAS
    default: "3"
    documentation: |-
      Number of Vault server replicas for HA Raft mode. Each replica gets a persistent
      volume for integrated storage. Ignored in dev mode. Capped automatically to the
      number of cluster nodes when lower (e.g. single-node OpenShift uses 1 replica).
  - name: VAULT_DEV_MODE
    default: ""
    documentation: |-
      When true, installs Vault in single-replica dev mode (pre-initialized, root token
      "root"). When false, installs HA Raft mode. When unset, dev mode is enabled
      automatically on equinix-ocp-metal (bare metal) jobs and HA Raft is used elsewhere.
  documentation: |-
    Installs HashiCorp Vault Enterprise via Helm.

    On bare metal (equinix-ocp-metal), installs a single dev-mode instance with
    auto-generated TLS. On cloud platforms, installs HA Raft with persistent storage,
    TLS, and an unsealer sidecar.

    This step:
    - Installs Helm if not present
    - Adds HashiCorp Helm repository
    - Creates vault namespace with appropriate SCC (restricted)
    - Creates vault-license secret from mounted credential (if available)
    - Mirrors Vault Enterprise and vault-kube-kms plugin images to the dev-scripts local registry on baremetalds jobs (SSH oc image mirror with retry)
    - Applies ImageContentSourcePolicy/vault-mirror so cluster nodes pull both images from the local mirror
    - Cloud: generates self-signed TLS and installs HA Raft with persistent storage,
      control-plane tolerations, and a vault-unsealer sidecar
    - Bare metal: installs dev mode with auto-generated TLS (no init/unseal)
    - Waits for Vault pod(s) to be ready
    - Installs a second instance in VAULT_SECONDARY_NAMESPACE

    Prerequisites:
    - OpenShift cluster with adequate resources
    - Vault Enterprise license secret named 'tests-private-account' in test-credentials namespace
      (automatically mounted at /var/run/vault/tests-private-account/)

    Outputs:
    - Vault service available at: https://vault.${VAULT_NAMESPACE}.svc:8200
    - Vault pods: vault-0..vault-$(VAULT_HA_REPLICAS-1) (Ready state)
    - CA ConfigMap: vault-ca-bundle (openshift-config namespace)
    - Second Vault service at: https://vault-secondary.${VAULT_SECONDARY_NAMESPACE}.svc:8200
    - Second Vault pods: vault-secondary-0..vault-secondary-$(VAULT_HA_REPLICAS-1) (Ready state)
    - CA ConfigMap: vault-ca-bundle-secondary (openshift-config namespace)

    Next step:
    - Run etcd-encryption-vault-configure to initialize and configure Vault for KMS
