ref:
  as: openperouter-caas-setup
  from: dev-scripts
  grace_period: 10m
  commands: openperouter-caas-setup-commands.sh
  timeout: 7200s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: OPENPEROUTER_DAY0_REPO
    default: "https://github.com/andreaskaris/openperouterday0openshift.git"
    documentation: Git repository URL for the OpenPERouter day0 OpenShift deployment.
  - name: OPENPEROUTER_DAY0_BRANCH
    default: "ci"
    documentation: Git branch or tag of the day0 repository to check out.
  - name: DEPLOYMENT_MODE
    default: "standard"
    documentation: |-
      Deployment mode for the OpenPERouter CaaS workflow. Can be "day0" or "standard".
  - name: DATAPLANE
    default: "kernel"
    documentation: |-
      The dataplane to use. Can be "kernel" or "grout".
  - name: VERIFY_INTERVAL_SEC
    default: "60"
    documentation: Interval in seconds between OpenShift cluster status checks while waiting for the cluster to become ready.
  - name: VERIFY_TIMEOUT_MIN
    default: "60"
    documentation: Maximum time in minutes to wait for the OpenShift cluster to report clusterversion Available=True and Progressing=False.
  documentation: |-
    Checks out the OpenPERouter day0 OpenShift repository and the CI pull
    secret under /opt on the OFCIR bare-metal host, installs required
    packages, builds the appliance and config image, brings up the virtual
    lab, and waits until the deployed OpenShift cluster reports
    clusterversion Available=True and Progressing=False.
