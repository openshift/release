ref:
  as: openperouter-e2e
  from: src
  grace_period: 10m
  commands: openperouter-e2e-commands.sh
  timeout: 7200s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Create OpenPERouter CR and verify that operator, controller, and router
    daemonsets come up healthy. OLM bundle deploy is handled by the
    optional-operators-operator-sdk step.
  env:
    - name: OPENPEROUTER_DATAPATH
      default: "kernel"
      documentation: |-
        The datapath to use for the openperouter. Can be "kernel" or "grout". Default is "kernel".
