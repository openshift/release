ref:
  as: openperouter-e2e
  from: src
  grace_period: 10m
  commands: openperouter-e2e-commands.sh
  timeout: 3600s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: OPENPEROUTER_REPO
    default: https://github.com/openshift-kni/openperouter.git
    documentation: Repository containing OpenPERouter E2E scripts.
  - name: OPENPEROUTER_BRANCH
    default: main
    documentation: Branch containing OpenPERouter E2E scripts.
  documentation: |-
    Create OpenPERouter CR and verify that operator, controller, and router
    daemonsets come up healthy. OLM bundle deploy is handled by the
    optional-operators-operator-sdk step.
