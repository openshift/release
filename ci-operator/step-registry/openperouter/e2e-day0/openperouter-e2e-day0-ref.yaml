ref:
  as: openperouter-e2e-day0
  from: src
  grace_period: 10m
  commands: openperouter-e2e-day0-commands.sh
  timeout: 7200s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: DEPLOYMENT_MODE
    default: "standard"
    documentation: |-
      Deployment mode for the OpenPERouter CaaS workflow. Can be "day0" or "standard".
  - name: DATAPLANE
    default: "kernel"
    documentation: |-
      The dataplane to use. Can be "kernel" or "grout".
  documentation: |-
    Runs the OpenPERouter day0 e2e verification on the OFCIR bare-metal host
    leased and set up by the openperouter-caas workflow. DEPLOYMENT_MODE
    (day0|standard) and DATAPLANE (kernel|grout) are provided by the workflow
    and can be overridden in the ci-operator config.
