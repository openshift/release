ref:
  as: openperouter-backport-release
  from: cli
  commands: openperouter-backport-release-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 30m
  grace_period: 1m
  documentation: |-
    Performs a read-only dry run of aggregate first-parent PR merge backports
    from OpenPERouter release-5.1 to release-5.0. The step reports commits
    that apply, are protected-only, or conflict; it never pushes or creates a
    pull request.
