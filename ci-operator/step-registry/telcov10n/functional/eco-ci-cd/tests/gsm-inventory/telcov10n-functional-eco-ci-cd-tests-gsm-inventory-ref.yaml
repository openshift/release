ref:
  as: telcov10n-functional-eco-ci-cd-tests-gsm-inventory
  from: src
  commands: telcov10n-functional-eco-ci-cd-tests-gsm-inventory-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: telcov10n-ci
    group: gsm-test/ansible/ansible_group_all
    mount_path: /var/group_variables/all
  - collection: telcov10n-ci
    group: gsm-test/ansible/ansible_group_bastions
    mount_path: /var/group_variables/bastions
  - collection: telcov10n-ci
    group: gsm-test/ansible/ansible_group_hypervisors
    mount_path: /var/group_variables/hypervisors
  - collection: telcov10n-ci
    group: ansible/ansible_group_all/ssh_public_key
    mount_path: /var/group_variables/ssh_public_key
  documentation: |-
    Verifies that GSM secrets from the telcov10n-ci collection are correctly
    mounted inside the CI pod. Uses gsm-test prefixed secrets to avoid
    touching production credentials.
