ref:
  as: telcov10n-functional-report
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd  
  commands: telcov10n-functional-report-commands.sh
  documentation: |-
    Upload reports to Report Portal.

    Polarion reporting is retired: junit_report_dir is no longer passed and
    processed_report_dir is the single report set uploaded to Report Portal.

    Lanes whose plays stage reports on the bastion upload the suite JUnit set
    from JUNIT_REPORT_DIR (default /tmp/test_reports/junit). Lanes whose test
    steps stage reports in SHARED_DIR keep uploading their existing report set.
  grace_period: 10s
  timeout: 4h0m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: JUNIT_REPORT_DIR
    documentation: |-
      Optional bastion directory containing the suite JUnit XMLs to upload.
      Defaults to /tmp/test_reports/junit in the step script; lanes whose reports
      live elsewhere set it in the job config (the O-RAN lane uses
      /tmp/eco_gotests_oran_junit). Ignored when reports are staged in SHARED_DIR.
  - name: REPORTER_TEMPLATE_NAME
    default: "Telco 5G RAN Regression build - 4.19 - automated"
    documentation: Template name for Report Portal
  - name: REPORTPORTAL_FILES
    default: ".reportportal_url_3node"
    documentation: Report Portal file to upload
  - name: UPLOAD_TO_REPORT_PORTAL
    default: "true"
    documentation: Whether to upload reports to Report Portal
  - name: REPORTER_LAUNCH_NAME
    default: "telco-ft-ran-standard"
    documentation: Report Portal launch name
  - name: CLUSTER_NAME
    default: "kni-qe-99"
    documentation: Hub cluster name
  - name: METRICS_LIST
    default: ""
    documentation: Comma-separated list of metrics to collect (e.g. spoke_general_ocp,acm,gitops)
