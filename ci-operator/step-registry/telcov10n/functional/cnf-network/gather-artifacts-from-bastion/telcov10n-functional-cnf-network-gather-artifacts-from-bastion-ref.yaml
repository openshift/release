
ref:
  as: telcov10n-functional-cnf-network-gather-artifacts-from-bastion
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-network-gather-artifacts-from-bastion-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Gather artifacts on bastion
  env:
  - name: VERSION 
    default: "4.17"
    documentation: OCP version to deploy
  - name: CLUSTER_NAME 
    default: ""
    documentation: BM Cluster name
  credentials:
  - collection: telcov10n-ci
    group: ansible
    field: ansible_group_all
    as: all
    mount_path: /var/common_variables
  - collection: telcov10n-ci
    group: teams/network/clusters/kni-qe-92
    field: bastion-kni-qe-92-telcoqe-eng-rdu2-dc-redhat-com
    as: bastion
    mount_path: /var/clusters/kni-qe-92
  - collection: telcov10n-ci
    group: teams/network/clusters/hlxcl2
    field: bastion-hlxcl2-lab-eng-tlv2-redhat-com
    as: bastion
    mount_path: /var/clusters/hlxcl2
  - collection: telcov10n-ci
    group: teams/network/clusters/hlxcl3
    field: bastion-hlxcl3-lab-eng-tlv2-redhat-com
    as: bastion
    mount_path: /var/clusters/hlxcl3
  - collection: telcov10n-ci
    group: teams/network/clusters/hlxcl7
    field: bastion-hlxcl7-lab-eng-tlv2-redhat-com
    as: bastion
    mount_path: /var/clusters/hlxcl7
