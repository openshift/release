ref:
  as: telcov10n-functional-cnf-network-ocp-deploy
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-network-ocp-deploy-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
  env:
  - name: VERSION 
    default: "4.17"
    documentation: OCP version to deploy
  - name: CLUSTER_NAME 
    default: ""
    documentation: BM Cluster name
  - name: ENABLE_INTERNAL_REGISTRY 
    default: "false"
    documentation: Enable internal repository
  - name: RELEASE_AGE_MAX_DAYS 
    default: "10000"
    documentation: Max release age
  credentials:
  - collection: telcov10n-ci
    group: ansible
    mount_path: /var/common_variables
  - collection: telcov10n-ci
    group: teams/network/clusters/kni-qe-92
    mount_path: /var/clusters/kni-qe-92
  - collection: telcov10n-ci
    group: teams/network/clusters/hlxcl2
    mount_path: /var/clusters/hlxcl2
  - collection: telcov10n-ci
    group: teams/network/clusters/hlxcl3
    mount_path: /var/clusters/hlxcl3
  - collection: telcov10n-ci
    group: teams/network/clusters/hlxcl7
    mount_path: /var/clusters/hlxcl7
  - collection: telcov10n-ci
    group: teams/network/hypervisors
    mount_path: /var/hypervisors
