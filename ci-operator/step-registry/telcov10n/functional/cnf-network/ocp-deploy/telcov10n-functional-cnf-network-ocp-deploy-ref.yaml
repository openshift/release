ref:
  as: telcov10n-functional-cnf-network-ocp-deploy
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-network-ocp-deploy-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
  env:
  - name: VERSION 
    default: "4.17"
    documentation: OCP version to deploy
  - name: CLUSTER_NAME 
    default: ""
    documentation: BM Cluster name
  - name: ENABLE_INTERNAL_REGISTRY 
    default: "false"
    documentation: Enable internal repository
  - name: RELEASE_AGE_MAX_DAYS 
    default: "10000"
    documentation: Max release age
  credentials:
  - collection: telcov10n-ci
    group: ansible/ansible_group_all
    mount_path: /var/group_variables/common/all
  - collection: telcov10n-ci
    group: ansible/ansible_group_bastions
    mount_path: /var/group_variables/common/bastions
  - collection: telcov10n-ci
    group: ansible/ansible_group_hypervisors
    mount_path: /var/group_variables/common/hypervisors
  - collection: telcov10n-ci
    group: teams/network/clusters/kni-qe-92/ansible_group_masters
    mount_path: /var/group_variables/kni-qe-92/masters
  - collection: telcov10n-ci
    group: teams/network/clusters/kni-qe-92/ansible_group_workers
    mount_path: /var/group_variables/kni-qe-92/workers
  - collection: telcov10n-ci
    group: teams/network/clusters/kni-qe-92/ansible_group_nodes
    mount_path: /var/group_variables/kni-qe-92/nodes
  - collection: telcov10n
    group: kni-qe-92/bastion--dot--kni-qe-92--dot--telcoqe--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
    mount_path: /var/host_variables/kni-qe-92/bastion
  - collection: telcov10n-ci
    group: teams/network/clusters/kni-qe-92/master0
    mount_path: /var/host_variables/kni-qe-92/master0
  - collection: telcov10n-ci
    group: teams/network/clusters/kni-qe-92/master1
    mount_path: /var/host_variables/kni-qe-92/master1
  - collection: telcov10n-ci
    group: teams/network/clusters/kni-qe-92/master2
    mount_path: /var/host_variables/kni-qe-92/master2
  - collection: telcov10n-ci
    group: teams/network/clusters/kni-qe-92/worker0
    mount_path: /var/host_variables/kni-qe-92/worker0
  - collection: telcov10n-ci
    group: teams/network/clusters/kni-qe-92/worker1
    mount_path: /var/host_variables/kni-qe-92/worker1
  - collection: telcov10n-ci
    group: teams/network/clusters/kni-qe-92/worker2
    mount_path: /var/host_variables/kni-qe-92/worker2
  - collection: telcov10n-ci
    group: teams/network/hypervisors/helix88--dot--telcoqe--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
    mount_path: /var/host_variables/kni-qe-92/hypervisor
  - collection: telcov10n-ci
