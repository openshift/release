ref:
  as: telcov10n-functional-cnf-network-switch-config
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-network-switch-config-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
  env:
  - name: CLUSTER_NAME
    default: ""
    documentation: BM Cluster name
  - name: OCP_NIC
    default: ""
    documentation: Network Interface Card for OCP external link 
  - name: SECONDARY_NIC
    default: ""
    documentation: Secondary network interface card for tests
  - name: VERSION
    default: "4.22"
    documentation: OCP version to deploy
  credentials:
  - collection: telcov10n-ci
    group: ansible/ansible_group_all
    mount_path: /var/group_variables/common/all
  - collection: telcov10n-ci
    group: ansible/ansible_group_bastions
    mount_path: /var/group_variables/common/bastions
  - collection: telcov10n
    group: kni-qe-92/bastion--dot--kni-qe-92--dot--telcoqe--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
    mount_path: /var/host_variables/kni-qe-92/bastion
  - collection: telcov10n-ci
    group: teams/network/switches/rdu3_switch
    mount_path: /var/host_variables/kni-qe-92/switch
  - collection: telcov10n-ci
    group: teams/network/clusters/hlxcl2/bastion--dot--hlxcl2--dot--lab--dot--eng--dot--tlv2--dot--redhat--dot--com
    mount_path: /var/host_variables/hlxcl2/bastion
  - collection: telcov10n-ci
    group: teams/network/switches/tlv2_switch
    mount_path: /var/host_variables/hlxcl2/switch
  - collection: telcov10n-ci
    group: teams/network/clusters/hlxcl3/bastion--dot--hlxcl3--dot--lab--dot--eng--dot--tlv2--dot--redhat--dot--com
    mount_path: /var/host_variables/hlxcl3/bastion
  - collection: telcov10n-ci
    group: teams/network/clusters/hlxcl7/bastion--dot--hlxcl7--dot--lab--dot--eng--dot--tlv2--dot--redhat--dot--com
    mount_path: /var/host_variables/hlxcl7/bastion
