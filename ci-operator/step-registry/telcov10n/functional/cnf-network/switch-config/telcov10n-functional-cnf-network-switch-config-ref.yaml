ref:
  as: telcov10n-functional-cnf-network-switch-config
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-network-switch-config-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
  env:
  - name: CLUSTER_NAME
    default: ""
    documentation: BM Cluster name
  - name: OCP_NIC
    default: ""
    documentation: Network Interface Card for OCP external link 
  - name: SECONDARY_NIC
    default: ""
    documentation: Secondary network interface card for tests
  - name: VERSION
    default: "4.22"
    documentation: OCP version to deploy
  credentials:
  - collection: telcov10n-ci
    group: ansible
    mount_path: /var/common_variables
  - collection: telcov10n-ci
    group: teams/network/clusters/kni-qe-92
    mount_path: /var/clusters/kni-qe-92
  - collection: telcov10n-ci
    group: teams/network/clusters/hlxcl2
    mount_path: /var/clusters/hlxcl2
  - collection: telcov10n-ci
    group: teams/network/clusters/hlxcl3
    mount_path: /var/clusters/hlxcl3
  - collection: telcov10n-ci
    group: teams/network/clusters/hlxcl7
    mount_path: /var/clusters/hlxcl7
  - collection: telcov10n-ci
    group: teams/network/switches
    mount_path: /var/switches
