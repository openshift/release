ref:
  as: telcov10n-functional-system-hub-deploy
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-system-hub-deploy-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: VERSION 
      default: "4.19"
      documentation: OCP version to deploy
    - name: CLUSTER_NAME
      default: "kni-qe-99"
      documentation: BM Cluster name
    - name: DISABLE_INSIGHTS
      default: "false"
      documentation: Set to "true" to remove cloud.openshift.com from pull secret, disabling Insights and Telemetry
    - name: MULTISTAGE_PARAM_OVERRIDE_RELEASE_AGE_MAX_DAYS
      default: "7"
      documentation: Maximum age of the release to deploy
  credentials:
      # kni-qe-69
    - namespace: test-credentials
      name: telcov10n-ansible-group-all
      mount_path: /var/group_variables/common/all
    - namespace: test-credentials
      name: telcov10n-ansible-group-bastions
      mount_path: /var/group_variables/common/bastions
    - namespace: test-credentials
      name: telcov10n-ansible-sno-hub-kni-qe-69
      mount_path: /var/host_variables/kni-qe-69/master0
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-69-bastion
      mount_path: /var/host_variables/kni-qe-69/bastion
    - namespace: test-credentials
      name: telcov10n-ansible-group-kni-qe-69-nodes
      mount_path: /var/group_variables/kni-qe-69/nodes
    - namespace: test-credentials
      name: telcov10n-ansible-group-kni-qe-69-masters
      mount_path: /var/group_variables/kni-qe-69/masters

  documentation: |-
      Deploy OCP SNO on the Hub cluster for system    
