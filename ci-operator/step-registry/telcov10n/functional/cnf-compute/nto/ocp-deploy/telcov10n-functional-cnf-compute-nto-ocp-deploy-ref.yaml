ref:
  as: telcov10n-functional-cnf-compute-nto-ocp-deploy
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-compute-nto-ocp-deploy-commands.sh
  timeout: 6h
  resources:
    requests:
      cpu: 500m
  env:
  - name: VERSION 
    default: "4.18"
    documentation: OCP version to deploy
  - name: CLUSTER_NAME 
    default: ""
    documentation: BM Cluster name
  - name: OCP_VERSION_RELEASE_TYPE
    default: "stable"
    documentation: OCP release type (nightly, engineering-candidate, release-candidate, stable)
  - name: OCP_VERSION_RELEASE_AGE_MAX_DAYS
    default: "365"
    documentation: |-
      Maximum age in days for OCP release (default: 365 days)
  - name: WORKLOAD_PARTITIONING
    default: "false"
    documentation: Enable workload partitioning (boolean)
  credentials:
  - collection: telcov10n-ci
    group: ansible/ansible_group_all
    mount_path: /var/group_variables/common/all
  - collection: telcov10n-ci
    group: ansible/ansible_group_bastions
    mount_path: /var/group_variables/common/bastions
  - collection: telcov10n-ci
    group: ansible/ansible_group_hypervisors
    mount_path: /var/group_variables/common/hypervisors
# cluster hlxcl15
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl15/ansible_group_masters
    mount_path: /var/group_variables/hlxcl15/masters
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl15/ansible_group_workers
    mount_path: /var/group_variables/hlxcl15/workers
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl15/ansible_group_nodes
    mount_path: /var/group_variables/hlxcl15/nodes
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl15/bastion--dot--hlxcl15--dot--lab--dot--eng--dot--tlv2--dot--redhat--dot--com
    mount_path: /var/host_variables/hlxcl15/bastion
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl15/master0
    mount_path: /var/host_variables/hlxcl15/master0
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl15/master1
    mount_path: /var/host_variables/hlxcl15/master1
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl15/master2
    mount_path: /var/host_variables/hlxcl15/master2
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl15/worker0
    mount_path: /var/host_variables/hlxcl15/worker0
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl15/worker1
    mount_path: /var/host_variables/hlxcl15/worker1
  - collection: telcov10n-ci
    group: teams/compute/hypervisors/ocp-edge91--dot--lab--dot--eng--dot--tlv2--dot--redhat--dot--com
    mount_path: /var/host_variables/hlxcl15/hypervisor
# cluster helix17
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix17/ansible_group_masters
    mount_path: /var/group_variables/helix17/masters
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix17/ansible_group_workers
    mount_path: /var/group_variables/helix17/workers
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix17/ansible_group_nodes
    mount_path: /var/group_variables/helix17/nodes
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix17/bastion--dot--helix17--dot--lab--dot--eng--dot--tlv2--dot--redhat--dot--com
    mount_path: /var/host_variables/helix17/bastion
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix17/master0
    mount_path: /var/host_variables/helix17/master0
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix17/master1
    mount_path: /var/host_variables/helix17/master1
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix17/master2
    mount_path: /var/host_variables/helix17/master2
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix17/worker0
    mount_path: /var/host_variables/helix17/worker0
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix17/worker1
    mount_path: /var/host_variables/helix17/worker1
  - collection: telcov10n-ci
    group: teams/compute/hypervisors/ocp-edge92--dot--lab--dot--eng--dot--tlv2--dot--redhat--dot--com
    mount_path: /var/host_variables/helix17/hypervisor