ref:
  as: telcov10n-functional-cnf-compute-nto-ocp-deploy-sno
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-compute-nto-ocp-deploy-sno-commands.sh
  timeout: 5h0m0s
  resources:
    requests:
      cpu: 100m
  env:
  - name: VERSION 
    default: "4.18"
    documentation: OCP version to deploy
  - name: CLUSTER_NAME 
    default: ""
    documentation: BM Cluster name for SNO deployment
  - name: OCP_VERSION_RELEASE_TYPE
    default: "stable"
    documentation: OCP release type (nightly, engineering-candidate, release-candidate, stable)
  - name: OCP_VERSION_RELEASE_AGE_MAX_DAYS
    default: "365"
    documentation: |-
      Maximum age in days for OCP release (default: 365 days)
  - name: DISCONNECTED
    default: "false"
    documentation: Enable disconnected installation mode (boolean)
  - name: IPV4_ONLY
    default: "false"
    documentation: Enable IPv4-only cluster configuration (boolean)
  - name: IPV6_ONLY
    default: "false"
    documentation: Enable IPv6-only cluster configuration (boolean)
  - name: EXTRA_MANIFEST_FOLDER
    default: ""
    documentation: Extra manifest directory to be included in the cluster deployment
  credentials:
  - collection: telcov10n-ci
    group: ansible/ansible_group_all
    mount_path: /var/group_variables/common/all
  - collection: telcov10n-ci
    group: ansible/ansible_group_bastions
    mount_path: /var/group_variables/common/bastions
  - collection: telcov10n-ci
    group: ansible/ansible_group_hypervisors
    mount_path: /var/group_variables/common/hypervisors
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl51-sno/ansible_group_masters
    mount_path: /var/group_variables/hlxcl51-sno/masters
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl51-sno/ansible_group_nodes
    mount_path: /var/group_variables/hlxcl51-sno/nodes
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl51-sno/bastion--dot--hlxcl51--dot--lab--dot--eng--dot--tlv2--dot--redhat--dot--com
    mount_path: /var/host_variables/hlxcl51-sno/bastion
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl51-sno/master0
    mount_path: /var/host_variables/hlxcl51-sno/master0
  - collection: telcov10n-ci
    group: teams/compute/hypervisors/ocp-edge91--dot--lab--dot--eng--dot--tlv2--dot--redhat--dot--com
    mount_path: /var/host_variables/hlxcl51-sno/hypervisor
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl52-sno/ansible_group_masters
    mount_path: /var/group_variables/hlxcl52-sno/masters
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl52-sno/ansible_group_nodes
    mount_path: /var/group_variables/hlxcl52-sno/nodes
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl52-sno/bastion--dot--hlxcl52--dot--lab--dot--eng--dot--tlv2--dot--redhat--dot--com
    mount_path: /var/host_variables/hlxcl52-sno/bastion
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl52-sno/master0
    mount_path: /var/host_variables/hlxcl52-sno/master0
  - namespace: test-credentials
    name: telcov10n-ansible-hypervisors-ocp-hlxcl52
    mount_path: /var/host_variables/hlxcl52-sno/hypervisor
