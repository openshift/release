ref:
  as: telcov10n-functional-cnf-compute-nto-cleanup-old-clusters-sno
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-compute-nto-cleanup-old-clusters-sno-commands.sh
  timeout: 1h0m0s
  resources:
    requests:
      cpu: 200m
  env:
  - name: CLUSTER_NAME
    default: ""
    documentation: BM Cluster name
  credentials:
  - collection: telcov10n-ci
    group: ansible
    mount_path: /var/common_variables
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl51-sno
    mount_path: /var/clusters/hlxcl51-sno
  - collection: telcov10n-ci
    group: teams/compute/hypervisors
    mount_path: /var/hypervisors
