ref:
  as: telcov10n-functional-cnf-compute-nto-process-inventory
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-compute-nto-process-inventory-commands.sh
  resources:
    requests:
      cpu: 100m
  env:
  - name: VERSION 
    default: "4.18"
    documentation: OCP version to deploy
  - name: CLUSTER_NAME 
    default: ""
    documentation: BM Cluster name for SNO deployment
  - name: OCP_VERSION_RELEASE_TYPE
    default: "stable"
    documentation: OCP release type (nightly, engineering-candidate, release-candidate, stable)
  - name: OCP_VERSION_RELEASE_AGE_MAX_DAYS
    default: "365"
    documentation: |-
      Maximum age in days for OCP release (default: 365 days)
  - name: DISCONNECTED
    default: "false"
    documentation: Enable disconnected installation mode (boolean)
  - name: IPV4_ONLY
    default: "false"
    documentation: Enable IPv4-only cluster configuration (boolean)
  - name: IPV6_ONLY
    default: "false"
    documentation: Enable IPv6-only cluster configuration (boolean)
  credentials:
  - collection: telcov10n-ci
    group: ansible
    mount_path: /var/common_variables
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl15
    mount_path: /var/clusters/hlxcl15
  - collection: telcov10n-ci
    group: teams/compute/hypervisors
    mount_path: /var/hypervisors
