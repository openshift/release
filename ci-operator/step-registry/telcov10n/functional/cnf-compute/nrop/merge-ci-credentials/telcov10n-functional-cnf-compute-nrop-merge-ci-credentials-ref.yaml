ref:
  as: telcov10n-functional-cnf-compute-nrop-merge-ci-credentials
  from: cli
  cli: latest
  commands: telcov10n-functional-cnf-compute-nrop-merge-ci-credentials-commands.sh
  env:
  - name: KUBECONFIG
    default: ""
    documentation: "Path to kubeconfig for the target cluster."
  credentials:
  - namespace: test-credentials
    name: registry-pull-credentials
    mount_path: /var/run/ci-registry
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
  documentation: |-
    Merges CI build registry credentials into the target cluster's global
    pull-secret so that pods can pull images from the CI pipeline registry.
