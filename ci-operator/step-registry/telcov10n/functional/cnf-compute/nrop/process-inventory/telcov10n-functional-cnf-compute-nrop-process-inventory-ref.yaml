ref:
  as: telcov10n-functional-cnf-compute-nrop-process-inventory
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-compute-nrop-process-inventory-commands.sh
  resources:
    requests:
      cpu: 100m
  env:
  - name: CLUSTER_NAME 
    default: ""
    documentation: BM Cluster name for OCP deployment
  credentials:
  - collection: telcov10n-ci
    group: ansible/ansible_group_all
    mount_path: /var/group_variables/common/all
  - collection: telcov10n-ci
    group: ansible/ansible_group_bastions
    mount_path: /var/group_variables/common/bastions
  - collection: telcov10n-ci
    group: ansible/ansible_group_hypervisors
    mount_path: /var/group_variables/common/hypervisors

# HELIX47
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix47/ansible_group_masters
    mount_path: /var/group_variables/helix47/masters
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix47/ansible_group_workers
    mount_path: /var/group_variables/helix47/workers
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix47/ansible_group_nodes
    mount_path: /var/group_variables/helix47/nodes
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix47/bastion--dot--helix47--dot--lab--dot--eng--dot--tlv2--dot--redhat--dot--com
    mount_path: /var/host_variables/helix47/bastion
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix47/master0
    mount_path: /var/host_variables/helix47/master0
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix47/master1
    mount_path: /var/host_variables/helix47/master1
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix47/master2
    mount_path: /var/host_variables/helix47/master2
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix47/worker0
    mount_path: /var/host_variables/helix47/worker0
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix47/worker1
    mount_path: /var/host_variables/helix47/worker1
  - collection: telcov10n-ci
    group: teams/compute/hypervisors/helix47--dot--lab--dot--eng--dot--tlv2--dot--redhat--dot--com
    mount_path: /var/host_variables/helix47/hypervisor

