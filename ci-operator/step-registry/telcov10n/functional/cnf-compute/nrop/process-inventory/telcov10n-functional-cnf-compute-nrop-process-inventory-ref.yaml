ref:
  as: telcov10n-functional-cnf-compute-nrop-process-inventory
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-compute-nrop-process-inventory-commands.sh
  resources:
    requests:
      cpu: 100m
  env:
  - name: CLUSTER_NAME 
    default: ""
    documentation: BM Cluster name for OCP deployment
  credentials:
  - collection: telcov10n-ci
    group: ansible
    mount_path: /var/common_variables
  - collection: telcov10n-ci
    group: teams/compute/clusters/helix47
    mount_path: /var/clusters/helix47
  - collection: telcov10n-ci
    group: teams/compute/clusters/kni-qe-52
    mount_path: /var/clusters/kni-qe-52
  - collection: telcov10n-ci
    group: teams/compute/clusters/hlxcl9
    mount_path: /var/clusters/hlxcl9
  - collection: telcov10n-ci
    group: teams/compute/hypervisors
    mount_path: /var/hypervisors
