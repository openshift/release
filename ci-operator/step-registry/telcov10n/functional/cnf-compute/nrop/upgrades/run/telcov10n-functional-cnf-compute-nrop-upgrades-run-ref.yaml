ref:
  as: telcov10n-functional-cnf-compute-nrop-upgrades-run
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-compute-nrop-upgrades-run-commands.sh
  timeout: 24h
  resources:
    requests:
      cpu: 500m
  env:
  - name: CLUSTER_NAME
    documentation: Target cluster name.
  - name: UPGRADE_TYPE
    documentation: NROP upgrade lane (zstream, minor-long, range, or canary).
  - name: VERSION
    documentation: Starting OCP minor version or release image; canary requires major.minor.
  - name: TO_OCP_VERSION
    default: ""
    documentation: Target OCP minor version or release image; canary requires major.minor.
  - name: UPGRADE_ENV
    documentation: NROP source and target catalogs.
  - name: NROP_CHANNEL
    default: "versioned"
    documentation: NROP subscription channel.
  - name: CUSTOM_OCP_IMAGES
    default: ""
    documentation: Optional per-hop OCP images in minor=image format.
  - name: APPLY_PERF_PROFILE
    default: "true"
    documentation: Apply a PerformanceProfile when needed.
  - name: VERIFY_DEPLOYMENT
    default: "false"
    documentation: Run minor-long workload checks.
  - name: VERIFY_PERSISTENT_WORKLOAD
    default: "true"
    documentation: Verify a persistent Guaranteed workload across canary upgrades.
  - name: CANARY_NODE_COUNT
    default: "1"
    documentation: Number of canary workers; zero selects all.
  - name: CANARY_CLEANUP
    default: "true"
    documentation: Complete all workers after canary testing.
  documentation: |-
    Run the eco-ci-cd NROP upgrade playbook and collect its result files.
