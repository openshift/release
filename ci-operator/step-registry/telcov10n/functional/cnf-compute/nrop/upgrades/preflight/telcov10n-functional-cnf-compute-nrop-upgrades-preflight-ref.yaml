ref:
  as: telcov10n-functional-cnf-compute-nrop-upgrades-preflight
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-compute-nrop-upgrades-preflight-commands.sh
  resources:
    requests:
      cpu: 100m
  env:
  - name: UPGRADE_TYPE
    default: "zstream"
    documentation: NROP upgrade lane (zstream, minor-long, range, or canary).
  - name: FROM_OCP_VERSION
    default: ""
    documentation: Starting OCP minor version.
  - name: TO_OCP_VERSION
    default: ""
    documentation: Target OCP minor version.
  documentation: |-
    Select the starting OCP release for the upgrade lane.
