ref:
  as: telcov10n-functional-cnf-compute-nrop-upgrades-preflight
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-compute-nrop-upgrades-preflight-commands.sh
  resources:
    requests:
      cpu: 100m
  env:
  - name: UPGRADE_TYPE
    documentation: NROP upgrade lane (zstream, minor-long, range, or canary).
  - name: VERSION
    documentation: Starting OCP major.minor version for canary.
  - name: TO_OCP_VERSION
    default: ""
    documentation: Target OCP major.minor version for canary.
  documentation: |-
    Select a graph-compatible starting OCP release for the canary lane.
