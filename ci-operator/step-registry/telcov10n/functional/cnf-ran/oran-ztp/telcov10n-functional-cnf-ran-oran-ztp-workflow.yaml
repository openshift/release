workflow:
  as: telcov10n-functional-cnf-ran-oran-ztp
  documentation: |-
    Deploy and configure the hub, prepare O-RAN services, then run O-RAN
    suites against the hub and report their results.
  steps:
    pre:
    # Hub cluster setup
    - ref: telcov10n-functional-cnf-ran-hub-deploy
    - ref: telcov10n-functional-cnf-ran-hub-config
    # Special O-RAN setup: repoint ZTP ArgoCD apps at O-RAN templates and
    # bootstrap PKI/Keycloak/mock-smo/o2ims inventory (depends on hub-config
    # having extracted the ArgoCD artifacts and installed cert-manager, rhbk
    # and o-cloud-manager operators).
    - ref: telcov10n-functional-cnf-ran-oran-setup
    - ref: telcov10n-functional-cnf-ran-mirror-spoke-operators
    test:
    # Run eco-gotests O-RAN suites against the hub (features set via
    # ECO_GOTESTS_FEATURES)
    - ref: telcov10n-functional-cnf-ran-eco-gotests-oran
    - ref: telcov10n-functional-report
    - ref: telcov10n-functional-cnf-ran-send-slack-notification
    # Reports are verified on the bastion (not copied to the CI pod SHARED_DIR)
    # to avoid the 1 MB Kubernetes secret size limit.
    - ref: telcov10n-verify-junit-reports-bastion
