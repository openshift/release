ref:
  as: telcov10n-functional-cnf-ran-oran-skip-setup
  from: cli
  grace_period: 10s
  commands: telcov10n-functional-cnf-ran-oran-skip-setup-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: RUN_ECO_GOTESTS_ONLY
    default: "false"
    documentation: |-
      When set to "true", writes skip.txt to SHARED_DIR so all subsequent
      setup steps (hub-deploy, hub-config, oran-setup, mirror-spoke-operators)
      are bypassed. Use this to re-run only the eco-gotests step against a
      cluster that is already fully configured.
  documentation: |-
    Writes skip.txt to SHARED_DIR when RUN_ECO_GOTESTS_ONLY=true, causing
    all setup pre-steps to exit early. Allows re-running eco-gotests only
    against an already-configured O-RAN hub cluster.
