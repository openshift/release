ref:
  as: telcov10n-functional-cnf-ran-ibi-target-preinstall
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-ibi-target-preinstall-commands.sh
  timeout: 4h
  grace_period: 5m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: TARGET_CLUSTER_NAME
    default: ""
    documentation: Target hub name used to locate its kubeconfig on the target bastion.
  - name: VERSION
    default: "4.20"
    documentation: Release family used for Git paths and the seed image tag.
  - name: MIRROR_REGISTRY
    default: "disconnected.registry.local:5000"
    documentation: Target registry containing the mirrored seed image.
  - name: TARGET_SPOKE_CLUSTER
    default: "['ibi-target']"
    documentation: Single target spoke name in the existing list format.
  - name: ZTP_GIT_REPO
    default: "https://gitlab.cee.redhat.com/telcov10n/ztp-site-configs-ci.git"
    documentation: GitLab repository containing the target ClusterInstance and preinstall template.
  - name: ZTP_GIT_BRANCH
    default: "main"
    documentation: Git branch containing the target manifests.
  credentials:
  - namespace: test-credentials
    name: telcov10n-ansible-group-all
    mount_path: /var/group_variables/common/all
  documentation: |-
    Restore target inventory, prepare the IBI preinstall launcher with
    ibi-preinstall.yml, and execute it over SSH on the target bastion.
    Collect console output and test reports and preserve execution failures.
    Requires a mirrored seed image, installer, HTTP service, matching SSH key,
    target-* inventory files from target hub preparation, and ibi-seed-version
    recorded by seed preparation. Pass playbook settings inline and use the
    installer extracted for that exact seed version by target release mirroring.
