ref:
  as: telcov10n-functional-cnf-ran-ibi-seed-dns-workaround
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-ibi-seed-dns-workaround-commands.sh
  timeout: 10m
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: IBI_DNS_WORKAROUND_ENABLED
    default: "false"
    documentation: Enable temporary DNS records for the TLV IBI lab.
  - name: CLUSTER_NAME
    default: "kni-qe-127"
    documentation: Hub cluster name; this workaround is restricted to kni-qe-127.
  credentials:
  - namespace: test-credentials
    name: telcov10n-ansible-group-all
    mount_path: /var/group_variables/common/all
  documentation: |-
    Temporary DNS workaround on the kni-qe-127 bastion after hub deployment.
    Replace custom-records.conf with the TLV lab records, test dnsmasq configuration,
    and restart dnsmasq. Disabled by default. Remove this step when the final lab
    hosts replace the temporary environment.
