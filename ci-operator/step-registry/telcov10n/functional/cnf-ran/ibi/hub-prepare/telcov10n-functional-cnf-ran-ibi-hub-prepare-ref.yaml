ref:
  as: telcov10n-functional-cnf-ran-ibi-hub-prepare
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-ibi-hub-prepare-commands.sh
  timeout: 2h
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: CLUSTER_NAME
    default: kni-qe-127
    documentation: Seed hub name used to locate its bastion kubeconfig.
  - name: TARGET_CLUSTER_NAME
    default: kni-qe-128
    documentation: Target hub name used to locate its bastion kubeconfig.
  documentation: |-
    Enable SiteConfig and verify SiteConfig and TALM readiness on both IBI hubs.
    Requires seed- and target-prefixed bastion, bastions and all inventories in
    SHARED_DIR from hub deployment. Does not modify operator RBAC.
