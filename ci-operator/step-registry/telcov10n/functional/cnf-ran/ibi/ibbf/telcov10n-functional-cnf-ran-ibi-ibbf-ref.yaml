ref:
  as: telcov10n-functional-cnf-ran-ibi-ibbf
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-ibi-ibbf-commands.sh
  timeout: 4h
  grace_period: 5m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: IBI_IBBF_ENABLED
    default: "false"
    documentation: Enable blocking hardware replacement tests after replacement preinstall.
  - name: IBI_REPLACEMENT_PREINSTALL_ENABLED
    default: "false"
    documentation: Must be enabled so replacement hardware is preinstalled before IBBF.
  - name: IBI_IBBF_ORIGINAL_BMC_HOST
    default: ""
    documentation: Expected original target BMC IPv4 address. The test powers this server off.
  - name: IBI_IBBF_REPLACEMENT_BMC_HOST
    default: ""
    documentation: Replacement BMC IPv4 address, authenticated with the retained target BMC secret.
  - name: IBI_IBBF_TARGET_IP
    default: ""
    documentation: Reserved static target IPv4 address retained by the replacement hardware.
  - name: TARGET_CLUSTER_NAME
    default: ""
    documentation: Target hub name used to locate its kubeconfig on the target bastion.
  - name: TARGET_SPOKE_CLUSTER
    default: "['ibi-target']"
    documentation: Single target spoke name in the existing list format.
  - name: VERSION
    default: "4.20"
    documentation: Release family used for the original target Argo application paths.
  credentials:
  - namespace: test-credentials
    name: telcov10n-ansible-group-all
    mount_path: /var/group_variables/common/all
  documentation: |-
    Restore target inventory and run the original eco-gotests image with the
    gitopsztp feature and ibbf-end-to-end label using deploy-run-eco-gotests.yaml.
    Read original BMC credentials privately from the target hub and verify they
    also authenticate the replacement BMC before allowing original-node power-off.
    Require the hardware replacement spec to execute and pass, then independently
    wait up to 30 minutes for nonempty target policies to become Compliant.
    This policy gate covers images whose second IBBF spec skips after the Argo
    path changes; keep the original Ginkgo results without rewriting skipped tests.
    Stream launcher output, collect reports even on failure, and return failure
    immediately. The test leaves the original hardware off and Argo on the
    replacement fixture. Deployment Types final-result handling is unchanged.
