workflow:
  as: telcov10n-functional-cnf-ran-ibi
  documentation: |-
    Prepare the CNF RAN IBI environment for manual target preinstall.
    Pre: deploy seed hub (kni-qe-127) and target hub (kni-qe-128) at VERSION,
         install operators on both, mirror operators and OCP images,
         deploy and prepare the seed SNO via ZTP on the seed hub,
         generate seed image, mirror to target registry.
    Stops after mirroring the generated seed image. Target preinstall is run
    manually; target deployment and subsequent tests are not enabled.
  steps:
    pre:
    # Seed hub setup — kni-qe-127 deployed at VERSION
    - ref: telcov10n-functional-cnf-ran-hub-deploy
    - ref: telcov10n-functional-cnf-ran-hub-config
    - ref: telcov10n-functional-cnf-ran-mirror-spoke-operators
    # Target hub setup — kni-qe-128 deployed at VERSION
    # Note: ibi-target-hub-deploy saves target-* prefixed inventory files in SHARED_DIR
    #       alongside the flat copies so they survive ibu-restore-seed-inventory below.
    - ref: telcov10n-functional-cnf-ran-ibi-target-hub-deploy
    - ref: telcov10n-functional-cnf-ran-ibi-target-hub-config
    - ref: telcov10n-functional-cnf-ran-ibi-target-mirror-spoke-operators
    # Preserve ACM/MCE mirror mappings on both hubs after operator mirroring.
    - ref: telcov10n-functional-cnf-ran-ibi-hub-prepare
    # Mirror OCP release images to target bastion registry (while on target inventory)
    - ref: telcov10n-functional-cnf-ran-ibu-target-mirror-ocp
    # Restore seed hub (kni-qe-127) flat inventory overwritten by ibi-target-hub-deploy
    # Note: no ibu-target-deploy-minio — IBI stores seed image in container registry, not MinIO
    - ref: telcov10n-functional-cnf-ran-ibu-restore-seed-inventory
    # Deploy the bare-metal seed SNO via ZTP on the seed hub (kni-qe-127)
    - ref: telcov10n-functional-cnf-ran-ibu-deploy-spoke-sno-seed
    # Save seed kubeconfig and prepare CoreOS extensions while ACM still manages the seed
    - ref: telcov10n-functional-cnf-ran-ibi-seed-prepare
    # Prune ArgoCD apps and remove seed spoke from ACM before seed image generation
    - ref: telcov10n-functional-cnf-ran-ibu-prune-argocd-apps
    # Run seedgeneration tests without a post-generation power-off
    - ref: telcov10n-functional-cnf-ran-ibi-eco-gotests-seed
    # Mirror generated seed image from seed bastion registry to target bastion registry
    - ref: telcov10n-functional-cnf-ran-ibu-mirror-seed-image
    # Stop here for manual target preinstall. These later stages remain disabled.
    # - ref: telcov10n-functional-cnf-ran-ibi-target-preinstall
    - ref: telcov10n-functional-cnf-ran-ibu-target-deploy-spoke-sno
