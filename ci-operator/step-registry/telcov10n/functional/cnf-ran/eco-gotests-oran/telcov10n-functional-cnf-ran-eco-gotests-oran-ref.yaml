ref:
  as: telcov10n-functional-cnf-ran-eco-gotests-oran
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-eco-gotests-oran-commands.sh
  documentation: |-
    Run eco-gotests O-RAN suites against the hub cluster (kni-qe-129).

    Iterates over the space-separated features in ECO_GOTESTS_FEATURES in the
    given order (e.g. oran-pre-provision oran-provision oran-post-provision
    oran-metal3-day2). Each feature is a separate eco-gotests invocation run on
    the hub bastion via the generic deploy-run-eco-gotests.yaml playbook. The
    hub kubeconfig generated by hub-deploy is reused from the bastion.
  grace_period: 10s
  timeout: 24h0m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: CLUSTER_NAME
    default: ""
    documentation: Hub cluster name (e.g. kni-qe-129). Tests run against its kubeconfig.
  - name: ECO_GOTESTS_FEATURES
    default: "oran-pre-provision oran-provision oran-post-provision oran-metal3-day2"
    documentation: Space-separated, ordered list of eco-gotests O-RAN features to run.
  - name: ECO_GOTESTS_LABELS
    default: "!no-container"
    documentation: Ginkgo label filter passed to eco-gotests (e.g. '!no-container').
  - name: MIRROR_REGISTRY
    default: "disconnected.registry.local:5000"
    documentation: Disconnected mirror registry address for eco-gotests images.
  credentials:
  - namespace: test-credentials
    name: telcov10n-ansible-group-all
    mount_path: /var/group_variables/common/all
  - namespace: test-credentials
    name: telcov10n-ansible-group-bastions
    mount_path: /var/group_variables/common/bastions
  - namespace: test-credentials
    name: telcov10n-ansible-kni-qe-129-bastion
    mount_path: /var/host_variables/kni-qe-129/bastion
