ref:
  as: telcov10n-functional-cnf-ran-eco-gotests-oran
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-eco-gotests-oran-commands.sh
  documentation: |-
    Run eco-gotests O-RAN suites against the hub cluster (kni-qe-129).

    Iterates over the space-separated features in ECO_GOTESTS_FEATURES in the
    given order (e.g. oran-pre-provision oran-provision oran-post-provision
    oran-metal3-day2). Each feature is a separate eco-gotests invocation run on
    the hub bastion via the generic deploy-run-eco-gotests.yaml playbook. The
    hub kubeconfig generated by hub-deploy is reused from the bastion.
  grace_period: 10s
  timeout: 24h0m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: CLUSTER_NAME
    default: ""
    documentation: Hub cluster name (e.g. kni-qe-129). Tests run against its kubeconfig.
  - name: ECO_GOTESTS_FEATURES
    default: "oran-pre-provision oran-provision oran-post-provision oran-metal3-day2"
    documentation: Space-separated, ordered list of eco-gotests O-RAN features to run.
  - name: ECO_GOTESTS_LABELS
    default: "!no-container"
    documentation: Ginkgo label filter passed to eco-gotests (e.g. '!no-container').
  - name: MIRROR_REGISTRY
    default: "disconnected.registry.local:5000"
    documentation: Disconnected mirror registry address for eco-gotests images.
  - name: ORAN_PROVISIONING_REQUEST_URL
    default: ""
    documentation: |-
      Raw HTTPS URL to the ProvisioningRequest YAML used by the O-RAN provision
      suite (ECO_CNF_RAN_PROVISIONING_REQUEST_URL). Required for provision tests.
  - name: ORAN_CLUSTER_TEMPLATE_AFFIX
    default: ""
    documentation: |-
      Version-dependent affix for ClusterTemplate names (ECO_CNF_RAN_CLUSTER_TEMPLATE_AFFIX),
      e.g. "v5-0". Must match the templateVersion suffix used in the ZTP site-configs repo.
  - name: ORAN_SPOKE1_NAME
    default: ""
    documentation: |-
      ACM ManagedCluster name of the O-RAN spoke cluster (ECO_CNF_RAN_SPOKE1_NAME),
      e.g. "helix125". Must match clusterName in the ProvisioningRequest. Required
      for post-provision and alarms tests that look up the spoke in ACM.
  - name: ORAN_O2IMS_OAUTH_CLIENT_ID
    default: "o2ims-client"
    documentation: |-
      Keycloak client ID used by o2ims for OAuth (ECO_CNF_RAN_O2IMS_OAUTH_CLIENT_ID).
      Must match the clientId defined in the oran-realm.json.
  - name: ORAN_O2IMS_CLIENT_CERT_SECRET
    default: "o2ims-client-tls-certificate"
    documentation: |-
      Name of the Secret holding the o2ims mTLS client certificate
      (ECO_CNF_RAN_O2IMS_CLIENT_CERT_SECRET). Created by the oran_setup_mtls_oauth role.
  - name: ORAN_O2IMS_CLIENT_CERT_SECRET_NAMESPACE
    default: "oran-o2ims"
    documentation: |-
      Namespace of the o2ims mTLS client certificate Secret
      (ECO_CNF_RAN_O2IMS_CLIENT_CERT_SECRET_NAMESPACE).
  credentials:
  - namespace: test-credentials
    name: telcov10n-ansible-group-all
    mount_path: /var/group_variables/common/all
  - namespace: test-credentials
    name: telcov10n-ansible-group-bastions
    mount_path: /var/group_variables/common/bastions
  - namespace: test-credentials
    name: telcov10n-ansible-kni-qe-129-bastion
    mount_path: /var/host_variables/kni-qe-129/bastion
