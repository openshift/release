ref:
  as: telcov10n-functional-cnf-ran-report
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd  
  commands: telcov10n-functional-cnf-ran-report-commands.sh
  documentation: |-
    Upload reports for spoke cluster (kni-qe-51)
  grace_period: 10s
  timeout: 4h0m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi

  env:
  - name: REPORTER_TEMPLATE_NAME
    default: "Telco 5G RAN Regression build - 4.19 - automated"
    documentation: Template name for Report Portal
  - name: REPORTPORTAL_FILES
    default: ".reportportal_url_3node"
    documentation: Report Portal file to upload
  - name: UPLOAD_TO_REPORT_PORTAL
    default: "true"
    documentation: Whether to upload reports to Report Portal
  - name: REPORTS_PORTAL_ATTRIBUTES_ENV
    default: ""
    documentation: Additional Report Portal attributes in key:value;key:value format, appended to metrics-based attributes
  - name: REPORTER_LAUNCH_NAME
    default: "telco-ft-ran-standard"
    documentation: Report Portal launch name
  - name: CLUSTER_NAME
    default: "kni-qe-99"
    documentation: Hub cluster name
  - name: SPOKE_CLUSTER
    default: "kni-qe-51"
    documentation: Spoke compact cluster name
  - name: RAN_METRICS_LIST
    default: ""
    documentation: Comma-separated list of metrics to collect (e.g. spoke_general_ocp,acm,gitops)
  credentials:
  - collection: telcov10n-ci
    group: ansible
    mount_path: /var/common_variables
  - collection: telcov10n-ci
    group: teams/ran/clusters/kni-qe-99
    field: bastion-kni-qe-99-lab-eng-tlv2-redhat-com
    as: bastion
    mount_path: /var/clusters/kni-qe-99
  - collection: telcov10n-ci
    group: teams/ran/clusters/fthub-01
    field: bastion-01-telco5gran-eng-rdu2-redhat-com
    as: bastion
    mount_path: /var/clusters/fthub-01
  - collection: telcov10n-ci
    group: teams/ran/clusters/kni-qe-106
    field: bastion-kni-qe-106-telcov10n-eng-rdu2-dc-redhat-com
    as: bastion
    mount_path: /var/clusters/kni-qe-106
  - collection: telcov10n-ci
    group: teams/ran/clusters/kni-qe-110
    field: bastion-kni-qe-110-telcov10n-eng-rdu2-dc-redhat-com
    as: bastion
    mount_path: /var/clusters/kni-qe-110
