ref:
  as: telcov10n-functional-cnf-ran-ibu-deploy-spoke-sno-seed
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-ibu-deploy-spoke-sno-seed-commands.sh
  timeout: 5h
  resources:
    requests:
      cpu: 100m
  env:
    - name: VERSION
      default: "4.20"
      documentation: >-
        IBU seed/hub OCP version; ZTP configs live under <VERSION>/ibu-seed/ in
        ztp-site-configs-ci.
    - name: CLUSTER_NAME
      default: ""
      documentation: Seed hub cluster name
    - name: SPOKE_CLUSTER
      default: "['ibu-seed']"
      documentation: >-
        Seed spoke cluster name in JSON array format, e.g. "['ibu-seed']".
    - name: ZTP_GIT_REPO
      default: "https://gitlab.cee.redhat.com/telcov10n/ztp-site-configs-ci.git"
      documentation: ZTP site configs repo
    - name: ZTP_GIT_BRANCH
      default: "ibu"
      documentation: Branch to use in ztp-site-configs-ci repo
  documentation: |-
    Deploy IBU seed SNO spoke via ZTP on the seed hub (kni-qe-108).
    Uses the IBU layout in ztp-site-configs-ci: <VERSION>/ibu-seed/clusterinstance
    and <VERSION>/ibu-seed/policygentemplate.
