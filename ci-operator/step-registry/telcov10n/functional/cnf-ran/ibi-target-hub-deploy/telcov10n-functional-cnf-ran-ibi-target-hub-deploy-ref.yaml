ref:
  as: telcov10n-functional-cnf-ran-ibi-target-hub-deploy
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-ibi-target-hub-deploy-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: VERSION
      default: "4.20"
      documentation: OCP version to deploy on the IBI target hub
    - name: TARGET_CLUSTER_NAME
      default: "kni-qe-128"
      documentation: BM cluster name for the IBI target hub
    - name: DISABLE_INSIGHTS
      default: "false"
      documentation: Set to "true" to remove cloud.openshift.com from pull secret, disabling Insights and Telemetry
  credentials:
    - namespace: test-credentials
      name: telcov10n-ansible-group-all
      mount_path: /var/group_variables/common/all
    - namespace: test-credentials
      name: telcov10n-ansible-group-bastions
      mount_path: /var/group_variables/common/bastions
    - namespace: test-credentials
      name: telcov10n-ansible-group-hypervisors
      mount_path: /var/group_variables/common/hypervisors
    # kni-qe-128 (IBI target hub)
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-128-master0
      mount_path: /var/host_variables/kni-qe-128/master0
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-128-bastion
      mount_path: /var/host_variables/kni-qe-128/bastion
    - namespace: test-credentials
      name: telcov10n-ansible-group-kni-qe-128-nodes
      mount_path: /var/group_variables/kni-qe-128/nodes
    - namespace: test-credentials
      name: telcov10n-ansible-group-kni-qe-128-masters
      mount_path: /var/group_variables/kni-qe-128/masters
    - namespace: test-credentials
      name: telcov10n-ansible-hypervisors-helix107
      mount_path: /var/host_variables/kni-qe-128/hypervisor
  documentation: |-
    Deploy IBI target hub (kni-qe-128).
    The target hub manages the IBI target spoke cluster (helix82) that will be
    installed fresh via the Image-Based Installation ISO generated from the seed spoke.
