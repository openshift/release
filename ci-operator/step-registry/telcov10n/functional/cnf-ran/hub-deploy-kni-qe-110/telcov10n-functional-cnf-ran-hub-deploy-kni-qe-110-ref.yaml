ref:
  as: telcov10n-functional-cnf-ran-hub-deploy-kni-qe-110
  from: eco-ci-cd-fix-install-wait
  commands: telcov10n-functional-cnf-ran-hub-deploy-kni-qe-110-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: VERSION
      default: "4.19"
      documentation: OCP version to deploy
    - name: CLUSTER_NAME
      default: "kni-qe-110"
      documentation: BM cluster name
    - name: DISABLE_INSIGHTS
      default: "true"
      documentation: Set to "true" to remove cloud.openshift.com from pull secret, disabling Insights and Telemetry
    - name: MULTISTAGE_PARAM_OVERRIDE_RELEASE_AGE_MAX_DAYS
      default: "7"
      documentation: Maximum age of the release to deploy
    - name: ARCH
      default: "x86_64"
      documentation: Architecture to deploy on the hub
    - name: COPY_ECO_CI_CD_TO_TEMP
      default: "true"
      documentation: Copy eco-ci-cd to a writable temporary directory before deployment
  credentials:
    - namespace: test-credentials
      name: telcov10n-ansible-group-all
      mount_path: /var/group_variables/common/all
    - namespace: test-credentials
      name: telcov10n-ansible-group-bastions
      mount_path: /var/group_variables/common/bastions
    - namespace: test-credentials
      name: telcov10n-ansible-group-hypervisors
      mount_path: /var/group_variables/common/hypervisors
    - namespace: test-credentials
      name: telcov10n-ansible-hub-kni-qe-110
      mount_path: /var/host_variables/kni-qe-110/master0
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-110-bastion
      mount_path: /var/host_variables/kni-qe-110/bastion
    - namespace: test-credentials
      name: telcov10n-ansible-hypervisors-helix107
      mount_path: /var/host_variables/fthub-01/hypervisor
    - namespace: test-credentials
      name: telcov10n-ansible-group-hub-kni-qe-110-masters
      mount_path: /var/group_variables/kni-qe-110/masters
    - namespace: test-credentials
      name: telcov10n-ansible-group-hub-kni-qe-110-nodes
      mount_path: /var/group_variables/kni-qe-110/nodes
  documentation: |-
    Deploy OCP SNO on hub kni-qe-110.
