ref:
  as: telcov10n-functional-cnf-ran-hub-deploy-kni-qe-134
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-hub-deploy-kni-qe-134-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: VERSION
      default: "4.18"
      documentation: OCP version to deploy
    - name: CLUSTER_NAME
      default: "kni-qe-134"
      documentation: BM cluster name
    - name: DISABLE_INSIGHTS
      default: "true"
      documentation: Set to "true" to remove cloud.openshift.com from pull secret, disabling Insights and Telemetry
    - name: MULTISTAGE_PARAM_OVERRIDE_RELEASE_AGE_MAX_DAYS
      default: "7"
      documentation: Maximum age of the release to deploy
    - name: ARCH
      default: "x86_64"
      documentation: Architecture to deploy on the hub
  credentials:
    - namespace: test-credentials
      name: telcov10n-ansible-group-all
      mount_path: /var/group_variables/common/all
    - namespace: test-credentials
      name: telcov10n-ansible-group-bastions
      mount_path: /var/group_variables/common/bastions
    - namespace: test-credentials
      name: telcov10n-ansible-group-hypervisors
      mount_path: /var/group_variables/common/hypervisors
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-134-master0
      mount_path: /var/host_variables/kni-qe-134/master0
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-134-bastion
      mount_path: /var/host_variables/kni-qe-134/bastion
    - namespace: test-credentials
      name: telcov10n-ansible-hypervisors-helix126
      mount_path: /var/host_variables/kni-qe-134/hypervisor
    - namespace: test-credentials
      name: telcov10n-ansible-group-hub-kni-qe-134-masters
      mount_path: /var/group_variables/kni-qe-134/masters
    - namespace: test-credentials
      name: telcov10n-ansible-group-hub-kni-qe-134-nodes
      mount_path: /var/group_variables/kni-qe-134/nodes
  documentation: |-
    Deploy OCP SNO on hub kni-qe-134.
