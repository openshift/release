ref:
  as: telcov10n-functional-cnf-ran-ibi-report
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-ibi-report-commands.sh
  timeout: 30m
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  env:
  - name: TARGET_CLUSTER_NAME
    default: ""
    documentation: Target hub whose kubeconfig provides metadata to the shared uploader.
  - name: VERSION
    default: "4.20"
    documentation: OpenShift release family used in the ReportPortal launch name.
  - name: IBI_REPORTPORTAL_LAUNCH_NAME
    default: telco-ft-ran-ibi
    documentation: Launch prefix; the reporter appends the OpenShift release family.
  credentials:
  - namespace: test-credentials
    name: telcov10n-ansible-group-all
    mount_path: /var/group_variables/common/all
  documentation: |-
    Collect current-run raw JUnit reports from the seed and target bastions.
    Prefix suites by IBI stage and upload them together to ReportPortal using
    the existing upload-report.yaml, with the same two XML input sets as PTP.
    Include the independent IBBF policy gate. Raw copies have distinct filenames
    and are supplied separately from the labelled Report Portal suites.
    Preserve the shared uploader's Polarion-first behavior and enable Report Portal.
    Collection or upload errors fail the step; incomplete bundles are not uploaded.
    Completed test failures remain reportable. Keep the shared final verifier
    responsible for deferred Deployment Types and IBBF test failures.
