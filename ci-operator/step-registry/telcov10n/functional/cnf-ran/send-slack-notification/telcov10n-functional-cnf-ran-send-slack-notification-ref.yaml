ref:
  as: telcov10n-functional-cnf-ran-send-slack-notification
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-send-slack-notification-commands.sh
  timeout: 30m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: CLUSTER_NAME
      default: "kni-qe-99"
      documentation: Cluster name
    - name: REPORTPORTAL_FILES
      default: ".reportportal_url_3node;.reportportal_url_standard"
      documentation: Report Portal files to upload
  credentials:
    - collection: telcov10n-ci
      group: ansible/ansible_group_all
      mount_path: /var/group_variables/common/all
    - collection: telcov10n-ci
      group: ansible/ansible_group_bastions
      mount_path: /var/group_variables/common/bastions
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-99/bastion--dot--kni-qe-99--dot--lab--dot--eng--dot--tlv2--dot--redhat--dot--com
      mount_path: /var/host_variables/kni-qe-99/bastion
    - collection: telcov10n-ci
      group: teams/ran/clusters/fthub-01/bastion-01--dot--telco5gran--dot--eng--dot--rdu2--dot--redhat--dot--com
      mount_path: /var/host_variables/fthub-01/bastion
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-106/bastion--dot--kni-qe-106--dot--telcov10n--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
      mount_path: /var/host_variables/kni-qe-106/bastion
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-111/bastion--dot--kni-qe-111--dot--telcov10n--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
      mount_path: /var/host_variables/kni-qe-111/bastion
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-110/bastion--dot--kni-qe-110--dot--telcov10n--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
      mount_path: /var/host_variables/kni-qe-110/bastion
    - collection: telcov10n-ci
      group: teams/ran/slack-webhook-url
      mount_path: /var/run/slack-webhook-url
  documentation: |-
    Send Slack notification to CNF RAN channel after workflow completion
