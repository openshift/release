ref:
  as: telcov10n-functional-cnf-ran-send-slack-notification
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-send-slack-notification-commands.sh
  timeout: 30m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: CLUSTER_NAME
      default: "kni-qe-99"
      documentation: Cluster name
    - name: REPORTPORTAL_FILES
      default: ".reportportal_url_3node;.reportportal_url_standard"
      documentation: Report Portal files to upload
    - name: ECO_CI_CD_FORK_REPO
      default: ""
      documentation: |-
        Rehearsal-only override: HTTPS clone URL of a public eco-ci-cd fork
        (e.g. https://github.com/user/eco-ci-cd). When set, this step
        shallow-clones that fork (at ECO_CI_CD_FORK_BRANCH) and runs its
        playbooks/scripts from the clone instead of from the /eco-ci-cd
        content baked into the step image. Empty keeps the promoted image content.
    - name: ECO_CI_CD_FORK_BRANCH
      default: "main"
      documentation: Branch of the ECO_CI_CD_FORK_REPO fork (rehearsal-only override).
  credentials:
    - namespace: test-credentials
      name: telcov10n-ansible-group-all
      mount_path: /var/group_variables/common/all
    - namespace: test-credentials
      name: telcov10n-ansible-group-bastions
      mount_path: /var/group_variables/common/bastions
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-99-bastion
      mount_path: /var/host_variables/kni-qe-99/bastion
    - namespace: test-credentials
      name: telcov10n-ansible-fthub-01-bastion
      mount_path: /var/host_variables/fthub-01/bastion
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-106-bastion
      mount_path: /var/host_variables/kni-qe-106/bastion
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-111-bastion
      mount_path: /var/host_variables/kni-qe-111/bastion
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-110-bastion
      mount_path: /var/host_variables/kni-qe-110/bastion
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-129-bastion
      mount_path: /var/host_variables/kni-qe-129/bastion
    - namespace: test-credentials
      name: vran-qe-ci-webhook
      mount_path: /var/run/slack-webhook-url
  documentation: |-
    Send Slack notification to CNF RAN channel after workflow completion
