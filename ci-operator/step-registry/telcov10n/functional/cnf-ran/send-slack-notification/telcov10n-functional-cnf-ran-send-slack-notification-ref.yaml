ref:
  as: telcov10n-functional-cnf-ran-send-slack-notification
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-send-slack-notification-commands.sh
  timeout: 30m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: CLUSTER_NAME
      default: "kni-qe-99"
      documentation: Cluster name
    - name: REPORTPORTAL_FILES
      default: ".reportportal_url_3node;.reportportal_url_standard"
      documentation: Report Portal files to upload
  credentials:
    - collection: telcov10n-ci
      group: ansible
      field: ansible_group_all
      as: all
      mount_path: /var/common_variables
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-99
      field: bastion-kni-qe-99-lab-eng-tlv2-redhat-com
      as: bastion
      mount_path: /var/clusters/kni-qe-99
    - collection: telcov10n-ci
      group: teams/ran/clusters/fthub-01
      field: bastion-01-telco5gran-eng-rdu2-redhat-com
      as: bastion
      mount_path: /var/clusters/fthub-01
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-106
      field: bastion-kni-qe-106-telcov10n-eng-rdu2-dc-redhat-com
      as: bastion
      mount_path: /var/clusters/kni-qe-106
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-111
      field: bastion-kni-qe-111-telcov10n-eng-rdu2-dc-redhat-com
      as: bastion
      mount_path: /var/clusters/kni-qe-111
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-110
      field: bastion-kni-qe-110-telcov10n-eng-rdu2-dc-redhat-com
      as: bastion
      mount_path: /var/clusters/kni-qe-110
    - collection: telcov10n-ci
      group: teams/ran/slack-webhook-url
      mount_path: /var/run/slack-webhook-url
  documentation: |-
    Send Slack notification to CNF RAN channel after workflow completion
