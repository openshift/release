ref:
  as: telcov10n-functional-cnf-ran-ibu-prune-argocd-apps
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-ibu-prune-argocd-apps-commands.sh
  timeout: 30m
  resources:
    requests:
      cpu: 100m
  env:
    - name: CLUSTER_NAME
      default: "kni-qe-108"
      documentation: Seed hub cluster name (used to resolve kubeconfig path on the bastion)
    - name: SEED_SPOKE_CLUSTER
      default: "ibu-seed"
      documentation: Seed spoke cluster (managed cluster) name to remove
  credentials:
    - collection: telcov10n-ci
      group: ansible/ansible_group_all
      mount_path: /var/group_variables/common/all
    - collection: telcov10n-ci
      group: ansible/ansible_group_bastions
      mount_path: /var/group_variables/common/bastions
    # kni-qe-108 (seed hub)
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-108/bastion--dot--kni-qe-108--dot--telco5gran--dot--eng--dot--rdu2--dot--redhat--dot--com
      mount_path: /var/host_variables/kni-qe-108/bastion
    # kni-qe-127 (IBI seed hub)
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-127-bastion
      mount_path: /var/host_variables/kni-qe-127/bastion
  documentation: |-
    Patch ArgoCD apps (clusters, policies) to remove finalizers, delete them,
    and remove the seed ManagedCluster from the seed hub.
    Runs against the seed hub bastion using directly mounted credentials.
    Supports kni-qe-108 (IBU) and kni-qe-127 (IBI) via CLUSTER_NAME env var.
