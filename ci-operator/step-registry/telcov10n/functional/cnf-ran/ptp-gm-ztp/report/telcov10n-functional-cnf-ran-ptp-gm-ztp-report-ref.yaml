ref:
  as: telcov10n-functional-cnf-ran-ptp-gm-ztp-report
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-ptp-gm-ztp-report-commands.sh
  documentation: |-
    Upload reports for PTP Grand Master spoke cluster (helix48)
  grace_period: 10s
  timeout: 4h0m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi

  env:
  - name: CLUSTER_NAME
    default: ""
    documentation: Hub cluster name
  - name: SPOKE_CLUSTER
    default: ""
    documentation: Spoke PTP Grand Master cluster name
  - name: REPORTER_TEMPLATE_NAME
    default: ""
    documentation: Template name for Report Portal
  - name: REPORTPORTAL_FILES
    default: ""
    documentation: Report Portal output file name
  - name: UPLOAD_TO_REPORT_PORTAL
    default: "true"
    documentation: Whether to upload reports to Report Portal
  - name: REPORTS_PORTAL_ATTRIBUTES_ENV
    default: ""
    documentation: Semicolon-separated ReportPortal attributes appended to metrics-based attributes
  - name: REPORTER_LAUNCH_NAME
    default: ""
    documentation: Report Portal launch name
  - name: RAN_METRICS_LIST
    default: ""
    documentation: Comma-separated list of metrics to collect (e.g. spoke_general_ocp,ptp,acm)

  credentials:
  - namespace: test-credentials
    name: telcov10n-ansible-group-all
    mount_path: /var/group_variables/common/all
  - namespace: test-credentials
    name: telcov10n-ansible-group-bastions
    mount_path: /var/group_variables/common/bastions
  - namespace: test-credentials
    name: telcov10n-ansible-group-kni-qe-111-nodes
    mount_path: /var/group_variables/kni-qe-111/nodes
  - namespace: test-credentials
    name: telcov10n-ansible-group-kni-qe-111-masters
    mount_path: /var/group_variables/kni-qe-111/masters
  - namespace: test-credentials
    name: telcov10n-ansible-kni-qe-111-bastion
    mount_path: /var/host_variables/kni-qe-111/bastion
  - namespace: test-credentials
    name: telcov10n-ansible-kni-qe-111-master0
    mount_path: /var/host_variables/kni-qe-111/master0
  - namespace: test-credentials
    name: telcov10n-ansible-hypervisors-hv16
    mount_path: /var/host_variables/kni-qe-111/hypervisor
