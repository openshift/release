ref:
  as: telcov10n-functional-cnf-ran-mirror-ocp-arch
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-mirror-ocp-arch-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: VERSION
      default: "4.20"
      documentation: OpenShift release version to mirror
    - name: SPOKE_ARCH
      default: "amd64"
      documentation: Architecture to mirror
    - name: MULTISTAGE_PARAM_OVERRIDE_RELEASE_AGE_MAX_DAYS
      default: "7"
      documentation: >-
        Maximum age of the release to mirror. Keep in sync with the same
        parameter on telcov10n-functional-cnf-ran-hub-deploy so this step
        resolves the same "latest" release the hub was installed with.
  documentation: |-
    Mirror the OpenShift release for the specified architecture to the disconnected registry.
