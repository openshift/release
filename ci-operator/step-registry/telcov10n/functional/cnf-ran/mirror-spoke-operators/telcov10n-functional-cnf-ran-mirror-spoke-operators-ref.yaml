ref:
  as: telcov10n-functional-cnf-ran-mirror-spoke-operators
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-mirror-spoke-operators-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: VERSION
      default: "4.19"
      documentation: OCP version to deploy
    - name: SPOKE_ARCH
      default: "x86_64"
      documentation: Architecture of the spoke clusters managed by the target hub x86_64, multi
    - name: SPOKE_OPERATORS
      default: |
        [
         {"name":"sriov-fec","catalog":"certified-operators","nsname":"vran-acceleration-operators","channel":"stable"},
         {"name":"ptp-operator","catalog":"redhat-operators-ptp-art","fbc_iib_repo":"ose-ptp-rhel9-operator","nsname":"openshift-ptp","channel":"stable","ns_labels":{"workload.openshift.io/allowed":"management","name":"openshift-ptp"}},
         {"name":"sriov-network-operator","catalog":"redhat-operators-sriov-art","fbc_iib_repo":"ose-sriov-network-rhel9-operator","nsname":"openshift-sriov-network-operator","channel":"stable","og_name":"sriov-network-operators","subscription_name":"sriov-network-operator-subscription"},
        ]
    - name: CLUSTER_NAME
      default: "kni-qe-99"
      documentation: Hub cluster name
    - name: ECO_CI_CD_FORK_REPO
      default: ""
      documentation: |-
        Rehearsal-only override: HTTPS clone URL of a public eco-ci-cd fork
        (e.g. https://github.com/user/eco-ci-cd). When set, this step
        shallow-clones that fork (at ECO_CI_CD_FORK_BRANCH) and runs its
        playbooks/scripts from the clone instead of from the /eco-ci-cd
        content baked into the step image. Empty keeps the promoted image content.
    - name: ECO_CI_CD_FORK_BRANCH
      default: "main"
      documentation: Branch of the ECO_CI_CD_FORK_REPO fork (rehearsal-only override).
  documentation: |-
      Mirror spoke operators to the disconnected registry for CNF RAN

