ref:
  as: telcov10n-functional-cnf-ran-ibi-eco-gotests-seed
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-ibi-eco-gotests-seed-commands.sh
  documentation: |-
    Run the eco-gotests seedgeneration suite on the prepared IBI seed SNO
    and collect its reports. No post-generation seed power-off is performed.

    Requires ibi-seed-prepare before ibu-prune-argocd-apps. Reuse the saved
    /tmp/${SEED_SPOKE_CLUSTER}-kubeconfig on the seed bastion after detachment;
    this step does not retrieve credentials from the hub.

    Flow:
    1. Check the saved seed kubeconfig on the seed bastion
    2. Generate eco-gotests run script (deploy-run-eco-gotests.yaml)
    3. Run seedgeneration via ibu-run-seedgeneration.yml
    4. Collect junit artifacts

    The bare-metal seed storage is configured through ZTP policies.
  timeout: 150m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi

  env:
  - name: CLUSTER_NAME
    default: "kni-qe-127"
    documentation: Seed hub cluster name (manages the seed spoke via ACM)
  - name: SEED_SPOKE_CLUSTER
    default: "helix81"
    documentation: Seed spoke SNO cluster name (where seed image is generated)
  - name: ECO_GOTESTS_FEATURES
    default: "seedgeneration"
    documentation: Space-separated list of eco-gotests features
  - name: MIRROR_REGISTRY
    default: "disconnected.registry.local:5000"
    documentation: Disconnected mirror registry address for seed image
  - name: VERSION
    default: "4.20"
    documentation: OCP version used to tag the seed image

  credentials:
  - namespace: test-credentials
    name: telcov10n-ansible-group-all
    mount_path: /var/group_variables/common/all
  - namespace: test-credentials
    name: telcov10n-ansible-group-bastions
    mount_path: /var/group_variables/common/bastions
  - namespace: test-credentials
    name: telcov10n-ansible-kni-qe-127-bastion
    mount_path: /var/host_variables/kni-qe-127/bastion
