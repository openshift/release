ref:
  as: telcov10n-functional-cnf-ran-hub-deploy
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-hub-deploy-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: VERSION 
      default: "4.19"
      documentation: OCP version to deploy
    - name: CLUSTER_NAME
      default: "kni-qe-99"
      documentation: BM Cluster name
    - name: DISABLE_INSIGHTS
      default: "false"
      documentation: Set to "true" to remove cloud.openshift.com from pull secret, disabling Insights and Telemetry
    - name: MULTISTAGE_PARAM_OVERRIDE_RELEASE_AGE_MAX_DAYS
      default: "7"
      documentation: Maximum age of the release to deploy
    - name: ARCH
      default: "x86_64"
      documentation: Architecture to deploy on the hub

  credentials:
    - collection: telcov10n-ci
      group: ansible
      mount_path: /var/common_variables
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-99
      mount_path: /var/clusters/kni-qe-99
    - collection: telcov10n-ci
      group: teams/ran/clusters/fthub-01
      mount_path: /var/clusters/fthub-01
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-106
      mount_path: /var/clusters/kni-qe-106
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-110
      mount_path: /var/clusters/kni-qe-110
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-111
      mount_path: /var/clusters/kni-qe-111
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-108
      mount_path: /var/clusters/kni-qe-108
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-127
      mount_path: /var/clusters/kni-qe-127
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-128
      mount_path: /var/clusters/kni-qe-128
    - collection: telcov10n-ci
      group: teams/ran/clusters/kni-qe-130
      mount_path: /var/clusters/kni-qe-130
    - collection: telcov10n-ci
      group: teams/ran/hypervisors
      mount_path: /var/hypervisors
  documentation: |-
      Deploy OCP SNO on the Hub cluster for CNF RAN    

