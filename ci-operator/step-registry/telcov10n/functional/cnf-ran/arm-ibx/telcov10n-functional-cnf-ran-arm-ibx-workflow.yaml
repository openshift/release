workflow:
  as: telcov10n-functional-cnf-ran-arm-ibx
  documentation: |-
    ARM IBX seed deployment and image generation for CNF RAN testing.
    Deploy the seed SNO with the existing MNO ARM playbook and the ZTP paths
    in job config, then prepare and detach the seed spoke, generate its seed
    image in the disconnected registry, and collect test artifacts. Then resolve
    and mirror the target release without deploying it.
  steps:
    pre:
    # Hub setup — kni-qe-133 deployed at VERSION.
    - ref: telcov10n-functional-cnf-ran-hub-deploy
    - ref: telcov10n-functional-cnf-ran-hub-config
    - ref: telcov10n-functional-cnf-ran-mirror-ocp-arch
    - ref: telcov10n-functional-cnf-ran-mirror-spoke-operators

    - ref: telcov10n-functional-cnf-ran-ibu-target-deploy-minio
    - ref: telcov10n-functional-cnf-ran-arm-ibx-deploy-spoke-sno-seed
    # Prepare and detach the spoke, generate the seed image, and collect artifacts.
    - ref: telcov10n-functional-cnf-ran-arm-ibx-seedgeneration
    # Resolve and mirror the target using the seed's installed version.
    - ref: telcov10n-functional-cnf-ran-arm-ibx-prepare-releases
