ref:
  as: telcov10n-functional-cnf-ran-arm-ibx-prepare-releases
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-arm-ibx-prepare-releases-commands.sh
  timeout: 5h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: CLUSTER_NAME
    default: ""
    documentation: Existing hub whose bastion hosts the disconnected registry.
  - name: SEED_SPOKE_CLUSTER
    default: ""
    documentation: Existing seed whose saved kubeconfig is read after seed generation.
  - name: VERSION
    default: "4.20"
    documentation: "Upgrade destination lane: 4.20, 4.22, or 5.0."
  - name: SPOKE_ARCH
    default: multi
    documentation: Required multi-architecture payloads for ARM spokes.
  documentation: |-
    After seed generation, read the installed seed version from its saved
    kubeconfig. Resolve the exact preceding GA patch and mirror its container to the disconnected registry.
