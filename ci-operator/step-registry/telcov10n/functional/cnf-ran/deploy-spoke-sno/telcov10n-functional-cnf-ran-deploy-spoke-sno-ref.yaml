ref:
  as: telcov10n-functional-cnf-ran-deploy-spoke-sno
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-functional-cnf-ran-deploy-spoke-sno-commands.sh
  documentation: |-
    Deploy sno spoke cluster via ZTP for CNF RAN
  timeout: 5h
  resources:
    requests:
      cpu: 100m
  env:
    - name: VERSION
      default: "4.19"
      documentation: OCP version; must match ztp-site-configs-ci path siteconfigs/<VERSION>/<SPOKE_CLUSTER>/
    - name: CLUSTER_NAME
      default: ""
      documentation: Hub cluster name
    - name: SPOKE_CLUSTER
      default: ""
      documentation: Spoke compact cluster name
    - name: ZTP_GIT_REPO
      default: "https://gitlab.cee.redhat.com/telcov10n/ztp-site-configs-ci.git"
      documentation: ZTP site configs repo
    - name: ZTP_GIT_BRANCH
      default: "main"
      documentation: Branch to use
    - name: BMC_BOOT_ORDER_CLEANUP
      default: ""
      documentation: >-
        When 'true', reorders UEFI boot entries on spoke BMCs so virtual
        media boots first. Requires bmc_user and bmc_password in inventory.
    - name: DISABLE_VIRTUAL_MEDIA_TLS
      default: ""
      documentation: >-
        When 'true', patches the Provisioning CR to serve virtual media
        over plain HTTP (workaround for slow iLO5 HTTPS transfer).
    - name: OS_DISK_WIPE
      default: ""
      documentation: >-
        When 'true', wipes NVMe partition tables on spoke hosts via SSH
        before ZTP deployment. Unreachable hosts are silently skipped.
