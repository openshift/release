ref:
  as: telcov10n-system-telco-kpis-deploy-vm-bastion
  from: root
  commands: telcov10n-system-telco-kpis-deploy-vm-bastion-commands.sh
  timeout: 2h
  grace_period: 10m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: HUB_CLUSTER
      default: "kni-qe-70"
      documentation: Hub cluster name - derives bastion MACHINE as bastion.<HUB_CLUSTER>.telco-kpis.rdu3.redhat.com
    - name: INFRA_SETTINGS
      default: '{}'
      documentation: >-
        JSON object for per-step infrastructure configuration overrides from CI config.
        Values here take precedence over INFRA_SETTINGS_DEFAULTS.
    - name: INFRA_SETTINGS_DEFAULTS
      default: |-
        {
          "deploy_vm_bastion": {
            "skip": false,
            "debug_on_fail": false,
            "debug_timeout": "+10 min",
            "location": "rdu",
            "debug": false
          }
        }
      documentation: >-
        JSON object for per-step infrastructure configuration. The "deploy_vm_bastion" key supports:
        skip (bool) - when true, skip this step entirely and exit 0;
        location (str) - datacenter location for qcow2 image URL selection (rdu or tlv);
        debug (bool) - when true, enables Ansible -vvv verbose output.
        Values are exported as uppercase env vars.
  credentials:
    # Common hypervisor (shared across all spokes)
    - collection: telcov10n-ci
      group: teams/telco-kpis/hypervisors/helix117-hv--dot--telcoqe--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
      mount_path: /var/host_variables/common/hypervisor

    # Common group variables
    - collection: telcov10n-ci
      group: ansible/ansible_group_all
      mount_path: /var/group_variables/common/all
    - collection: telcov10n-ci
      group: ansible/ansible_group_bastions
      mount_path: /var/group_variables/common/bastions
    - collection: telcov10n-ci
      group: ansible/ansible_group_hypervisors
      mount_path: /var/group_variables/common/hypervisors

    # Spoke spree-01 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01/master0
      mount_path: /var/host_variables/spree-01/master0
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01/ansible_group_masters
      mount_path: /var/group_variables/spree-01/masters
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01/ansible_group_nodes
      mount_path: /var/group_variables/spree-01/nodes

    # Spoke spree-02 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-02/master0
      mount_path: /var/host_variables/spree-02/master0
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-02/ansible_group_masters
      mount_path: /var/group_variables/spree-02/masters
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-02/ansible_group_nodes
      mount_path: /var/group_variables/spree-02/nodes

    # Spoke spree-03 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-03/master0
      mount_path: /var/host_variables/spree-03/master0
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-03/ansible_group_masters
      mount_path: /var/group_variables/spree-03/masters
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-03/ansible_group_nodes
      mount_path: /var/group_variables/spree-03/nodes

    # Spoke spree-04 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-04/master0
      mount_path: /var/host_variables/spree-04/master0
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-04/ansible_group_masters
      mount_path: /var/group_variables/spree-04/masters
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-04/ansible_group_nodes
      mount_path: /var/group_variables/spree-04/nodes

    # Spoke cnfdg46 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/cnfdg46/master0
      mount_path: /var/host_variables/cnfdg46/master0
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/cnfdg46/ansible_group_masters
      mount_path: /var/group_variables/cnfdg46/masters
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/cnfdg46/ansible_group_nodes
      mount_path: /var/group_variables/cnfdg46/nodes

    # Spoke kni-qe-100 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-100/master0
      mount_path: /var/host_variables/kni-qe-100/master0
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-100/ansible_group_masters
      mount_path: /var/group_variables/kni-qe-100/masters
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-100/ansible_group_nodes
      mount_path: /var/group_variables/kni-qe-100/nodes

    # Hub kni-qe-70 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-70/bastion--dot--kni-qe-70--dot--telcov10n--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
      mount_path: /var/host_variables/kni-qe-70/bastion

    # Hub kni-qe-71 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-71/bastion--dot--kni-qe-71--dot--telcov10n--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
      mount_path: /var/host_variables/kni-qe-71/bastion

    # Hub dev-kpi-01 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-01/bastion--dot--dev-kpi-01--dot--telcov10n--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
      mount_path: /var/host_variables/dev-kpi-01/bastion

    # Hub dev-kpi-02 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-02/bastion--dot--dev-kpi-02--dot--telcov10n--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
      mount_path: /var/host_variables/dev-kpi-02/bastion

    # Hub dev-kpi-03 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-03/bastion--dot--dev-kpi-03--dot--telcov10n--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
      mount_path: /var/host_variables/dev-kpi-03/bastion

    # Hub dev-kpi-04 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-04/bastion--dot--dev-kpi-04--dot--telcov10n--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
      mount_path: /var/host_variables/dev-kpi-04/bastion
  documentation: |-
    Deploy bastion VM on hypervisor using libvirt for a given hub cluster.
    The MACHINE name is derived from HUB_CLUSTER as bastion.<HUB_CLUSTER>.telco-kpis.rdu3.redhat.com.
    Runs the deploy-vm-bastion-libvirt.yml Ansible playbook which:
    - Downloads and resizes RHEL qcow2 image on the hypervisor
    - Configures network via cloud-init
    - Creates and starts the VM via libvirt
    - Performs initial system setup (SSH, packages, OS activation)
    - Sets up bastion host (registry, oc-mirror, Go, certificates)

    Jenkins equivalent: telco-kpis-deploy-vm-libvirt job

    CREDENTIAL DESIGN: All hub/spoke credentials are mounted in every step to enable
    runtime cluster selection via HUB_CLUSTER environment variable
    without modifying step definitions.
