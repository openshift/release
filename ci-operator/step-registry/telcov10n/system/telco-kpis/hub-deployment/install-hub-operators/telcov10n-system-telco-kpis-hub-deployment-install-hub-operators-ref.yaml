ref:
  as: telcov10n-system-telco-kpis-hub-deployment-install-hub-operators
  from: root
  commands: telcov10n-system-telco-kpis-hub-deployment-install-hub-operators-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: HUB_CLUSTER
      default: "kni-qe-70"
      documentation: Hub cluster name where operators will be installed
    - name: INFRA_SETTINGS
      default: '{}'
      documentation: >-
        JSON object for per-step infrastructure configuration overrides from CI config.
        Values here take precedence over INFRA_SETTINGS_DEFAULTS.
    - name: INFRA_SETTINGS_DEFAULTS
      default: |-
        {
          "install_hub_operators": {
            "skip": false,
            "debug_on_fail": false,
            "debug_timeout": "+10 min",
            "version": "",
            "hub_lockdown_uri": "",
            "generate_hub_lockdown": false,
            "architecture": "x86_64",
            "debug": false
          }
        }
      documentation: >-
        JSON object for per-step infrastructure configuration. The "install_hub_operators" key supports:
        skip (bool) - when true, skip this step entirely and exit 0;
        version (str) - OpenShift version for operator catalog resolution (e.g., "4.22").
        Used as fallback when no lockdown URI is provided. When lockdown is provided,
        the playbook extracts version from the lockdown JSON automatically;
        hub_lockdown_uri (str) - optional URL to hub lockdown JSON. When provided, the wrapper
        playbook downloads and parses the lockdown on bastion, extracting both operators list
        and OCP version. Operators are installed using exact CSVs from the lockdown.
        Recommended defaults (symlinks to latest verified lockdowns):
        x86_64: https://gitlab.cee.redhat.com/ran/dev-kpi-pipeline/-/raw/prow-lockdowns/hub/defaults/lockdown-hub-x86_64.json
        arm64: https://gitlab.cee.redhat.com/ran/dev-kpi-pipeline/-/raw/prow-lockdowns/hub/defaults/lockdown-hub-arm64.json
        Version-specific URLs are also available (e.g. lockdown-hub-4.22-x86_64.json).
        Empty string skips lockdown;
        generate_hub_lockdown (bool) - generate hub lockdown JSON after operator installation;
        architecture (str) - target architecture (x86_64 or arm64);
        debug (bool) - when true, enables Ansible -vvv verbose output.
        Values are exported as uppercase env vars.
  credentials:
    # Common group variables
    - collection: telcov10n-ci
      group: ansible
      mount_path: /var/common_variables

    # Spoke cluster credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01
      mount_path: /var/clusters/spree-01
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-02
      mount_path: /var/clusters/spree-02
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-03
      mount_path: /var/clusters/spree-03
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-04
      mount_path: /var/clusters/spree-04
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/cnfdg46
      mount_path: /var/clusters/cnfdg46
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-100
      mount_path: /var/clusters/kni-qe-100

    # Hub cluster credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-70
      mount_path: /var/clusters/kni-qe-70
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-71
      mount_path: /var/clusters/kni-qe-71
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-01
      mount_path: /var/clusters/dev-kpi-01
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-02
      mount_path: /var/clusters/dev-kpi-02
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-03
      mount_path: /var/clusters/dev-kpi-03
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-04
      mount_path: /var/clusters/dev-kpi-04
  documentation: |-
    Mirror and install hub operators (ACM, MCE, GitOps, TALM, local-storage,
    cluster-logging) for ZTP and spoke management.

    Uses the wrapper playbook telco-kpis/deploy-ocp-operators.yml which:
    1. Parses hub lockdown on bastion if hub_lockdown_uri provided (extracts
       operators list and OCP version via the lockdowns Ansible role)
    2. Calls upstream deploy-ocp-operators.yml for operator mirroring and install
    3. Captures hub lockdown if generate_hub_lockdown requested

    When no lockdown URI, operators are built from defaults in the playbook
    and version is used for catalog resolution.

    Jenkins equivalent: telco-kpis-install-hub-operators job
