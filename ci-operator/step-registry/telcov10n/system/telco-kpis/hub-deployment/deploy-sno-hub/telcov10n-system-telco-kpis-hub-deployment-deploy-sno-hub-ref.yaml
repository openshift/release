ref:
  as: telcov10n-system-telco-kpis-hub-deployment-deploy-sno-hub
  from: root
  commands: telcov10n-system-telco-kpis-hub-deployment-deploy-sno-hub-commands.sh
  timeout: 3h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: HUB_CLUSTER
      default: "kni-qe-70"
      documentation: Hub cluster name to deploy (dev-kpi-01, dev-kpi-02, dev-kpi-03, dev-kpi-04, kni-qe-70, kni-qe-71)
    - name: INFRA_SETTINGS
      default: '{}'
      documentation: >-
        JSON object for per-step infrastructure configuration overrides from CI config.
        Values here take precedence over INFRA_SETTINGS_DEFAULTS.
    - name: INFRA_SETTINGS_DEFAULTS
      default: |-
        {
          "deploy_sno_hub": {
            "skip": false,
            "debug_on_fail": false,
            "debug_timeout": "+10 min",
            "version": "",
            "ocp_release_image": "",
            "hub_lockdown_uri": "",
            "architecture": "x86_64",
            "disable_insights": true,
            "debug": false
          }
        }
      documentation: >-
        JSON object for per-step infrastructure configuration. The "deploy_sno_hub" key supports:
        skip (bool) - when true, skip this step entirely and exit 0;
        version (str) - OpenShift version to deploy (e.g. "4.22"). Used only when neither
        hub_lockdown_uri nor ocp_release_image are provided;
        ocp_release_image (str) - explicit OCP release image (tag or digest format). Overrides
        version but is overridden by hub_lockdown_uri. Examples:
        tag: quay.io/openshift-release-dev/ocp-release:4.22.0-x86_64,
        digest: quay.io/openshift-release-dev/ocp-release@sha256:abc123...;
        hub_lockdown_uri (str) - URL to hub lockdown JSON. The OCP release image tag is extracted
        from .hub.ocp.pull_spec.tag and used as the release. Takes highest priority.
        Supports GitLab symlinks (follows raw file redirects). Examples:
        latest verified: https://gitlab.cee.redhat.com/ran/dev-kpi-pipeline/-/raw/prow-lockdowns/hub/defaults/lockdown-hub-x86_64.json,
        version-pinned: https://gitlab.cee.redhat.com/ran/dev-kpi-pipeline/-/raw/prow-lockdowns/hub/defaults/lockdown-hub-4.22-x86_64.json,
        arm64: https://gitlab.cee.redhat.com/ran/dev-kpi-pipeline/-/raw/prow-lockdowns/hub/defaults/lockdown-hub-arm64.json.
        Empty string disables lockdown;
        architecture (str) - target architecture (x86_64 or arm64);
        disable_insights (bool) - disable Red Hat Insights operator;
        debug (bool) - when true, enables Ansible -vvv verbose output.
        Release resolution precedence: hub_lockdown_uri > ocp_release_image > version.
        Values are exported as uppercase env vars.
  credentials:
    # Common hypervisor host variables (needed for Virtual Control Plane play in deploy-ocp-sno.yml)
    - collection: telcov10n-ci
      group: teams/telco-kpis/hypervisors
      field: helix117-hv-telcoqe-eng-rdu2-dc-redhat-com
      as: hypervisor
      mount_path: /var/hypervisors

    # Common group variables
    - collection: telcov10n-ci
      group: ansible
      mount_path: /var/common_variables

    # Spoke cluster credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01
      mount_path: /var/clusters/spree-01
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-02
      mount_path: /var/clusters/spree-02
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-03
      mount_path: /var/clusters/spree-03
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-04
      mount_path: /var/clusters/spree-04
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/cnfdg46
      mount_path: /var/clusters/cnfdg46
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-100
      mount_path: /var/clusters/kni-qe-100

    # Hub cluster credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-70
      mount_path: /var/clusters/kni-qe-70
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-71
      mount_path: /var/clusters/kni-qe-71
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-01
      mount_path: /var/clusters/dev-kpi-01
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-02
      mount_path: /var/clusters/dev-kpi-02
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-03
      mount_path: /var/clusters/dev-kpi-03
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-04
      mount_path: /var/clusters/dev-kpi-04
  documentation: |-
    Deploy Single Node OpenShift (SNO) hub cluster using assisted installer.
    Creates hub cluster that will manage spoke deployments via ZTP.

    Uses setup_ansible_inventory(HUB_CLUSTER, HUB_CLUSTER) to populate
    inventories/ocp-deployment/ with the hub's own master0, bastion, and
    hypervisor host_vars plus common/hub-specific group_vars.

    OCP release resolution priority:
    1. hub_lockdown_uri — download lockdown JSON, extract .hub.ocp.pull_spec.tag
    2. ocp_release_image — explicit pull spec
    3. version — OCP minor version (e.g., "4.22")

    Jenkins equivalent: telco-kpis-deploy-sno-hub job

    CREDENTIAL DESIGN: Hub clusters mount bastion, master0, and masters/nodes
    group credentials (needed for OCP deployment). Other infra steps that only
    need SSH access to the bastion mount bastion credentials only.
