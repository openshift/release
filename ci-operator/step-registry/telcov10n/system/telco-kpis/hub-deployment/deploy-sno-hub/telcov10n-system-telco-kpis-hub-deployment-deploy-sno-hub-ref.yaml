    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-71/ansible_group_nodes
      mount_path: /var/group_variables/kni-qe-71/nodes

    # Hub dev-kpi-01 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-01/bastion--dot--dev-kpi-01--dot--telcov10n--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
      mount_path: /var/host_variables/dev-kpi-01/bastion
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-01/master0
      mount_path: /var/host_variables/dev-kpi-01/master0
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-01/ansible_group_masters
      mount_path: /var/group_variables/dev-kpi-01/masters
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-01/ansible_group_nodes
      mount_path: /var/group_variables/dev-kpi-01/nodes

    # Hub dev-kpi-02 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-02/bastion--dot--dev-kpi-02--dot--telcov10n--dot--eng--dot--rdu2--dot--dc--dot--redhat--dot--com
