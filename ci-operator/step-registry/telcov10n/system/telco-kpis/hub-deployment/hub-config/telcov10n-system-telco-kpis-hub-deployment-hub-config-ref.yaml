    - collection: telcov10n-ci
      group: ansible/ansible_group_all
      mount_path: /var/group_variables/common/all
    - collection: telcov10n-ci
      group: ansible/ansible_group_bastions
      mount_path: /var/group_variables/common/bastions
    - collection: telcov10n-ci
      group: ansible/ansible_group_hypervisors
      mount_path: /var/group_variables/common/hypervisors

    # Spoke spree-01 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01/master0
      mount_path: /var/host_variables/spree-01/master0
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01/ansible_group_masters
      mount_path: /var/group_variables/spree-01/masters
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01/ansible_group_nodes
