ref:
  as: telcov10n-system-telco-kpis-hub-deployment-hub-config
  from: root
  commands: telcov10n-system-telco-kpis-hub-deployment-hub-config-commands.sh
  timeout: 1h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: HUB_CLUSTER
      default: "kni-qe-70"
      documentation: Hub cluster to configure
    - name: INFRA_SETTINGS
      default: '{}'
      documentation: >-
        JSON object for per-step infrastructure configuration overrides from CI config.
        Values here take precedence over INFRA_SETTINGS_DEFAULTS.
    - name: INFRA_SETTINGS_DEFAULTS
      default: |-
        {
          "hub_config": {
            "skip": false,
            "debug_on_fail": false,
            "debug_timeout": "+10 min",
            "version": "",
            "disable_image_policy": "false",
            "hub_lockdown_uri": "",
            "gitlab_repo_url": "https://gitlab.cee.redhat.com/ccardeno/ztp-site-configs-ci.git",
            "gitlab_repo_branch": "telco-kpis",
            "debug": false
          }
        }
      documentation: >-
        JSON object for per-step infrastructure configuration. The "hub_config" key supports:
        skip (bool) - when true, skip this step entirely and exit 0;
        version (str) - OpenShift version passed as ocp_version to ACM and kustomize playbooks
        for version-specific configuration (e.g., siteconfig enablement on >= 4.22,
        rhel8 vs rhel9 kustomize plugin paths);
        disable_image_policy (bool) - when true, passes disable_image_policy=true to
        hub-sno-configure-acm.yml so it disables the hub ClusterImagePolicy for spoke
        deployments (required for multi-arch/arm64 hubs on OCP 4.21+);
        gitlab_repo_url (str) - GitLab repository URL for ZTP site configurations;
        gitlab_repo_branch (str) - GitLab repository branch for ZTP site configurations;
        debug (bool) - when true, enables Ansible -vvv verbose output.
        Values are exported as uppercase env vars.
  credentials:
