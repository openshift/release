ref:
  as: telcov10n-system-telco-kpis-hub-deployment-hub-config
  from: root
  commands: telcov10n-system-telco-kpis-hub-deployment-hub-config-commands.sh
  timeout: 1h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: HUB_CLUSTER
      default: "kni-qe-70"
      documentation: Hub cluster to configure
    - name: INFRA_SETTINGS
      default: '{}'
      documentation: >-
        JSON object for per-step infrastructure configuration overrides from CI config.
        Values here take precedence over INFRA_SETTINGS_DEFAULTS.
    - name: INFRA_SETTINGS_DEFAULTS
      default: |-
        {
          "hub_config": {
            "skip": false,
            "debug_on_fail": false,
            "debug_timeout": "+10 min",
            "version": "",
            "disable_image_policy": "false",
            "hub_lockdown_uri": "",
            "gitlab_repo_url": "https://gitlab.cee.redhat.com/ccardeno/ztp-site-configs-ci.git",
            "gitlab_repo_branch": "telco-kpis",
            "debug": false
          }
        }
      documentation: >-
        JSON object for per-step infrastructure configuration. The "hub_config" key supports:
        skip (bool) - when true, skip this step entirely and exit 0;
        version (str) - OpenShift version passed as ocp_version to ACM and kustomize playbooks
        for version-specific configuration (e.g., siteconfig enablement on >= 4.22,
        rhel8 vs rhel9 kustomize plugin paths);
        disable_image_policy (bool) - when true, passes disable_image_policy=true to
        hub-sno-configure-acm.yml so it disables the hub ClusterImagePolicy for spoke
        deployments (required for multi-arch/arm64 hubs on OCP 4.21+);
        gitlab_repo_url (str) - GitLab repository URL for ZTP site configurations;
        gitlab_repo_branch (str) - GitLab repository branch for ZTP site configurations;
        debug (bool) - when true, enables Ansible -vvv verbose output.
        Values are exported as uppercase env vars.
  credentials:
    # Common group variables
    - collection: telcov10n-ci
      group: ansible
      mount_path: /var/common_variables

    # Spoke cluster credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01
      mount_path: /var/clusters/spree-01
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-02
      mount_path: /var/clusters/spree-02
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-03
      mount_path: /var/clusters/spree-03
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-04
      mount_path: /var/clusters/spree-04
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/cnfdg46
      mount_path: /var/clusters/cnfdg46
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-100
      mount_path: /var/clusters/kni-qe-100

    # Hub cluster credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-70
      mount_path: /var/clusters/kni-qe-70
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-71
      mount_path: /var/clusters/kni-qe-71
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-01
      mount_path: /var/clusters/dev-kpi-01
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-02
      mount_path: /var/clusters/dev-kpi-02
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-03
      mount_path: /var/clusters/dev-kpi-03
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-04
      mount_path: /var/clusters/dev-kpi-04
  documentation: |-
    Configure hub cluster for ZTP spoke deployments. Runs 4 sequential
    playbooks from playbooks/ran/:

    1. hub-sno-configure-lvm-storage.yml — LVM volume group + LocalVolume CRs
       on master0 (runs on hosts: masters, needs master0 credentials)
    2. hub-sno-configure-acm.yml — MultiClusterHub, AgentServiceConfig,
       metal3, siteconfig enablement (runs on hosts: bastion)
    3. hub-sno-configure-kustomize-plugin.yml — ZTP kustomize plugin for
       ArgoCD with ztp-site-generator image mirroring (runs on hosts: bastion)
    4. hub-sno-configure-gitops.yml — ArgoCD GitLab CA trust, connectivity
       verification, ClusterInstance whitelist (runs on hosts: bastion)

    CREDENTIAL DESIGN: Hub clusters mount bastion, master0, and masters/nodes
    group credentials. master0 is required by the LVM storage playbook which
    creates logical volumes directly on the master node.

    Jenkins equivalent: telco-kpis-hub-config job
