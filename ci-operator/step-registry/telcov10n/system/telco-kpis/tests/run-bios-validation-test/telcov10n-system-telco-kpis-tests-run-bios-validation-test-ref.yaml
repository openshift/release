ref:
  as: telcov10n-system-telco-kpis-tests-run-bios-validation-test
  from: root
  commands: telcov10n-system-telco-kpis-tests-run-bios-validation-test-commands.sh
  timeout: 2h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: SPOKE_CLUSTER
      default: "spree-02"
      documentation: Spoke cluster to run test on
    - name: HUB_CLUSTER
      default: "kni-qe-71"
      documentation: Hub cluster managing the spoke
    - name: TEST_SETTINGS
      default: '{}'
      documentation: >-
        JSON object for per-test configuration overrides from CI config.
        Values here take precedence over TEST_SETTINGS_DEFAULTS.
    - name: TEST_SETTINGS_DEFAULTS
      default: |-
        {
          "bios_validation": {
            "skip": false,
            "continue_on_fail": false,
            "debug_on_fail": false,
            "debug_timeout": "+10 min",
            "version": "",
            "lockdown_uri": "",
            "bios_profile_url": "",
            "bios_profile_branch": "main",
            "bios_profile_path": "dell/bios-profile.yaml",
            "apply_fixes": false,
            "reboot_after_apply": false,
            "debug": false
          }
        }
      documentation: >-
        JSON object for per-test configuration. The "bios_validation" key supports:
        skip (bool) - when true, skip this test entirely and exit 0;
        continue_on_fail (bool) - when true, failures exit 0 so the pipeline continues;
        version (string) - OCP version (used only for display; not needed for profile fetch);
        lockdown_uri (string) - lockdown JSON URL for resolving OCP version; takes precedence
        over version (uses resolve_ocp_version_from_lockdown with built-in caching);
        bios_profile_url (string) - optional public URL (no auth); when set overrides branch/path;
        bios_profile_branch (string) - branch in telcov10n/kpi repo (default: main);
        bios_profile_path (string) - path under systems-pre-conditions/ (default: dell/bios-profile.yaml,
        use supermicro-arm64/bios-profile.yaml for ARM64);
        apply_fixes (bool) - when true, applies BIOS setting fixes automatically;
        reboot_after_apply (bool) - when true, reboots nodes after applying BIOS fixes;
        debug (bool) - when true, enables Ansible -vvv verbose output.
        Values are exported as uppercase env vars, overriding ref.yaml defaults.

  credentials:
    # GitLab token for telcov10n/kpi private repo (BIOS profiles, KPI targets)
    - collection: telcov10n-ci
      group: teams/telco-kpis/reports-repo
      mount_path: /var/reports-repo

    # Common group variables
    - collection: telcov10n-ci
      group: ansible
      mount_path: /var/common_variables

    # Spoke cluster credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01
      mount_path: /var/clusters/spree-01
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-02
      mount_path: /var/clusters/spree-02
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-03
      mount_path: /var/clusters/spree-03
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-04
      mount_path: /var/clusters/spree-04
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/cnfdg46
      mount_path: /var/clusters/cnfdg46
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-100
      mount_path: /var/clusters/kni-qe-100

    # Hub cluster credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-70
      mount_path: /var/clusters/kni-qe-70
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-71
      mount_path: /var/clusters/kni-qe-71
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-01
      mount_path: /var/clusters/dev-kpi-01
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-02
      mount_path: /var/clusters/dev-kpi-02
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-03
      mount_path: /var/clusters/dev-kpi-03
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-04
      mount_path: /var/clusters/dev-kpi-04
  documentation: |-
    BIOS validation test for telco-kpis validation.
