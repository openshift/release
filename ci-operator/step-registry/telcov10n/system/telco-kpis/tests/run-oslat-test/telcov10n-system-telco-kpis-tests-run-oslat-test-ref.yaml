ref:
  as: telcov10n-system-telco-kpis-tests-run-oslat-test
  from: root
  commands: telcov10n-system-telco-kpis-tests-run-oslat-test-commands.sh
  timeout: 16h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: SPOKE_CLUSTER
      default: "spree-02"
      documentation: Spoke cluster to run test on
    - name: HUB_CLUSTER
      default: "kni-qe-71"
      documentation: Hub cluster managing the spoke
    - name: TEST_SETTINGS
      default: '{}'
      documentation: >-
        JSON object for per-test configuration overrides from CI config.
        Values here take precedence over TEST_SETTINGS_DEFAULTS.
    - name: TEST_SETTINGS_DEFAULTS
      default: |-
        {
          "oslat": {
            "skip": false,
            "continue_on_fail": false,
            "debug_on_fail": false,
            "debug_timeout": "+10 min",
            "duration": "12h",
            "debug": false,
            "force_pull_test_runner_image": false
          }
        }
      documentation: >-
        JSON object for per-test configuration. The "oslat" key supports:
        skip (bool) - when true, skip this test entirely and exit 0;
        continue_on_fail (bool) - when true, test failures exit 0 so the pipeline continues;
        duration (string) - oslat test duration (e.g. "12h", "1h", "30m");
        debug (string) - "true" enables Ansible -vvv verbose output;
        force_pull_test_runner_image (bool) - when true, forces re-pull of the test-runner image from Quay.io even if already cached on the bastion.
        Values are exported as uppercase env vars, overriding ref.yaml defaults.

  credentials:
    # Common group variables
    - collection: telcov10n-ci
      group: ansible
      mount_path: /var/common_variables

    # Spoke cluster credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01
      mount_path: /var/clusters/spree-01
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-02
      mount_path: /var/clusters/spree-02
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-03
      mount_path: /var/clusters/spree-03
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-04
      mount_path: /var/clusters/spree-04
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/cnfdg46
      mount_path: /var/clusters/cnfdg46
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-100
      mount_path: /var/clusters/kni-qe-100

    # Hub cluster credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-70
      mount_path: /var/clusters/kni-qe-70
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-71
      mount_path: /var/clusters/kni-qe-71
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-01
      mount_path: /var/clusters/dev-kpi-01
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-02
      mount_path: /var/clusters/dev-kpi-02
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-03
      mount_path: /var/clusters/dev-kpi-03
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-04
      mount_path: /var/clusters/dev-kpi-04
  documentation: |-
    OSLat latency test for telco-kpis validation.
