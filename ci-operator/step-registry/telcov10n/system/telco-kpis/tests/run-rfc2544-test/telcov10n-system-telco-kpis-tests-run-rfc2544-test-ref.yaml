ref:
  as: telcov10n-system-telco-kpis-tests-run-rfc2544-test
  from: root
  commands: telcov10n-system-telco-kpis-tests-run-rfc2544-test-commands.sh
  timeout: 16h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: SPOKE_CLUSTER
      default: "spree-02"
      documentation: Spoke cluster to run test on
    - name: HUB_CLUSTER
      default: "kni-qe-71"
      documentation: Hub cluster managing the spoke
    - name: TEST_SETTINGS
      default: '{}'
      documentation: >-
        JSON object for per-test configuration overrides from CI config.
        Values here take precedence over TEST_SETTINGS_DEFAULTS.
    - name: TEST_SETTINGS_DEFAULTS
      default: |-
        {
          "rfc2544": {
            "skip": false,
            "continue_on_fail": false,
            "debug_on_fail": false,
            "debug_timeout": "+10 min",
            "duration": "12h",
            "frame_size": "512",
            "lat_rate": "0.8",
            "ran_integration_repo": "https://gitlab.cee.redhat.com/ran/ran-integration.git",
            "ran_integration_branch": "master",
            "spirent_config_file": "spirent_testcfg.xml",
            "throughput_threshold": "99.9",
            "max_latency_threshold": "30",
            "tolerance_nines": "6",
            "absolute_max_latency": "50",
            "debug": false,
            "force_pull_test_runner_image": false
          }
        }
      documentation: >-
        JSON object for per-test configuration. The "rfc2544" key supports:
        skip (bool) - when true, skip this test entirely and exit 0;
        continue_on_fail (bool) - when true, failures exit 0 so the pipeline continues;
        duration (string) - test duration (e.g. "12h", "1h");
        frame_size (string) - Ethernet frame size in bytes;
        lat_rate (string) - latency test rate 0-1;
        ran_integration_repo (string) - RAN integration repository URL;
        ran_integration_branch (string) - RAN integration repository branch;
        spirent_config_file (string) - Spirent configuration file name;
        throughput_threshold (string) - minimum throughput percentage;
        max_latency_threshold (string) - maximum latency threshold in microseconds;
        tolerance_nines (string) - number of nines for latency tolerance;
        absolute_max_latency (string) - absolute maximum latency in microseconds;
        debug (bool) - when true, enables Ansible -vvv verbose output;
        force_pull_test_runner_image (bool) - when true, forces re-pull of the test-runner image from Quay.io even if already cached on the bastion.
        Values are exported as uppercase env vars, overriding ref.yaml defaults.

  credentials:
    # Common group variables
    - collection: telcov10n-ci
      group: ansible/ansible_group_all
      mount_path: /var/group_variables/common/all
    - collection: telcov10n-ci
      group: ansible/ansible_group_bastions
      mount_path: /var/group_variables/common/bastions
    - collection: telcov10n-ci
      group: ansible/ansible_group_hypervisors
      mount_path: /var/group_variables/common/hypervisors

    # Spoke spree-01 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01/master0
      mount_path: /var/host_variables/spree-01/master0
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01/ansible_group_masters
      mount_path: /var/group_variables/spree-01/masters
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01/ansible_group_nodes
      mount_path: /var/group_variables/spree-01/nodes

    # Spoke spree-02 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-02/master0
      mount_path: /var/host_variables/spree-02/master0
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-02/ansible_group_masters
      mount_path: /var/group_variables/spree-02/masters
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-02/ansible_group_nodes
      mount_path: /var/group_variables/spree-02/nodes

    # Spoke spree-03 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-03/master0
      mount_path: /var/host_variables/spree-03/master0
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-03/ansible_group_masters
      mount_path: /var/group_variables/spree-03/masters
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-03/ansible_group_nodes
      mount_path: /var/group_variables/spree-03/nodes

    # Spoke spree-04 credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-04/master0
      mount_path: /var/host_variables/spree-04/master0
    - collection: telcov10n-ci
