ref:
  as: telcov10n-system-telco-kpis-spoke-deployment-deploy-spoke-ztp
  from: root
  commands: telcov10n-system-telco-kpis-spoke-deployment-deploy-spoke-ztp-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: SPOKE_CLUSTER
      default: "spree-02"
      documentation: Spoke cluster to deploy via ZTP
    - name: HUB_CLUSTER
      default: "kni-qe-71"
      documentation: Hub cluster managing ZTP deployment
    - name: INFRA_SETTINGS
      default: '{}'
      documentation: >-
        JSON object for per-step infrastructure configuration overrides from CI config.
        Values here take precedence over INFRA_SETTINGS_DEFAULTS.
    - name: INFRA_SETTINGS_DEFAULTS
      default: |-
        {
          "deploy_spoke_ztp": {
            "skip": false,
            "debug_on_fail": false,
            "debug_timeout": "+10 min",
            "version": "",
            "ocp_release_image": "",
            "lockdown_uri": "",
            "ztp_git_repo": "https://gitlab.cee.redhat.com/ocp-edge-qe/ztp-site-configs.git",
            "ztp_git_branch": "",
            "ztp_clusters_path": "siteconfig",
            "ztp_policies_path": "policygentemplates",
            "force_cleanup": true,
            "debug": false
          }
        }
      documentation: >-
        JSON object for per-step infrastructure configuration. The "deploy_spoke_ztp" key supports:
        skip (bool) - when true, skip this step entirely and exit 0;
        version (str) - OpenShift version to deploy on spoke (e.g. "4.22"). Used only when
        neither ocp_release_image nor lockdown_uri are provided;
        ocp_release_image (str) - explicit OCP release image for ClusterImageSet. Accepts tag
        or digest format; tags are resolved to digest via skopeo. Takes precedence over
        lockdown_uri. Examples:
        tag: quay.io/openshift-release-dev/ocp-release:4.22.0-x86_64,
        digest: quay.io/openshift-release-dev/ocp-release@sha256:abc123...;
        lockdown_uri (str) - URL to a hub or spoke lockdown JSON file. The OCP release image
        is extracted automatically (hub format: hub.ocp.pull_spec.digest, spoke format:
        deployment.ocp_pull_spec). Supports GitLab symlinks. Only used when ocp_release_image
        is empty. Examples:
        version-pinned: https://gitlab.cee.redhat.com/ran/dev-kpi-pipeline/-/raw/prow-lockdowns/spoke/defaults/lockdown-spoke-4.22-x86_64.json,
        baseline: https://gitlab.cee.redhat.com/ran/dev-kpi-pipeline/-/raw/prow-lockdowns/spoke/defaults/lockdown-spoke-4.22-x86_64-baseline.json;
        ztp_git_repo (str) - ZTP site configurations repository URL;
        ztp_git_branch (str) - ZTP branch (empty to auto-generate as ${SPOKE_CLUSTER}-kpi-${VERSION});
        ztp_clusters_path (str) - path to cluster configurations in ZTP repository;
        ztp_policies_path (str) - path to policy templates in ZTP repository;
        force_cleanup (bool) - force cleanup of spoke resources on hub before deployment;
        debug (bool) - when true, enables Ansible -vvv verbose output.
        Release image resolution precedence: ocp_release_image > lockdown_uri > hub clusterversion.
        Values are exported as uppercase env vars.
  credentials:
    # Common group variables
    - collection: telcov10n-ci
      group: ansible
      mount_path: /var/common_variables

    # Spoke cluster credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-01
      mount_path: /var/clusters/spree-01
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-02
      mount_path: /var/clusters/spree-02
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-03
      mount_path: /var/clusters/spree-03
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/spree-04
      mount_path: /var/clusters/spree-04
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/cnfdg46
      mount_path: /var/clusters/cnfdg46
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-100
      mount_path: /var/clusters/kni-qe-100

    # Hub cluster credentials
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-70
      mount_path: /var/clusters/kni-qe-70
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/kni-qe-71
      mount_path: /var/clusters/kni-qe-71
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-01
      mount_path: /var/clusters/dev-kpi-01
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-02
      mount_path: /var/clusters/dev-kpi-02
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-03
      mount_path: /var/clusters/dev-kpi-03
    - collection: telcov10n-ci
      group: teams/telco-kpis/clusters/dev-kpi-04
      mount_path: /var/clusters/dev-kpi-04
  documentation: |-
    Deploy spoke cluster using Zero Touch Provisioning (ZTP) via hub cluster.
    Creates SiteConfig, applies policies, and waits for cluster to be ready.
