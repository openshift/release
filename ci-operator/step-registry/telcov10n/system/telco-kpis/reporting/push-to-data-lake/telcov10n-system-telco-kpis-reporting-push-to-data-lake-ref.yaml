ref:
  as: telcov10n-system-telco-kpis-reporting-push-to-data-lake
  from: root
  commands: telcov10n-system-telco-kpis-reporting-push-to-data-lake-commands.sh
  grace_period: 10s
  timeout: 2h
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
  env:
    - name: SPOKE_CLUSTER
      default: ""
      documentation: |-
        Spoke cluster name (e.g., spree-01). Required.
    - name: HUB_CLUSTER
      default: ""
      documentation: |-
        Hub cluster managing the spoke (e.g., dev-kpi-01). Required.
    - name: MULTISTAGE_PARAM_OVERRIDE_HUB_CLUSTER
      default: ""
      documentation: |-
        Gangway API override for HUB_CLUSTER. When set via Gangway API,
        this value takes precedence over the default HUB_CLUSTER.
    - name: MULTISTAGE_PARAM_OVERRIDE_SPOKE_CLUSTER
      default: ""
      documentation: |-
        Gangway API override for SPOKE_CLUSTER. When set via Gangway API,
        this value takes precedence over the default SPOKE_CLUSTER.
    - name: MULTISTAGE_PARAM_OVERRIDE_FORMAL_TEST
      default: ""
      documentation: |-
        Gangway API override for FORMAL_TEST. When set via Gangway API,
        this value takes precedence over the formal_test in REPORTING_SETTINGS.
        Format: "true" or "false".
    - name: MULTISTAGE_PARAM_OVERRIDE_SPOKE_SKIP_PUSH_TO_DATA_LAKE
      default: ""
      documentation: |-
        Gangway API override to control push-to-data-lake step execution. When set via Gangway API,
        this value takes precedence over the skip in REPORTING_SETTINGS.
        Format: "true" to skip the step, "false" to force-enable even if skip=true in JSON.
    - name: REPORTING_SETTINGS
      default: '{}'
      documentation: >-
        JSON object for reporting configuration overrides from CI config.
        Values here take precedence over REPORTING_SETTINGS_DEFAULTS.
    - name: REPORTING_SETTINGS_DEFAULTS
      default: |-
        {
          "push_to_data_lake": {
            "skip": false,
            "continue_on_fail": false,
            "debug_on_fail": false,
            "debug_timeout": "+10 min",
            "data_lake_destination": "splunk",
            "formal_test": true,
            "debug": false
          },
          "splunk": {
            "splunk_hec_url": "https://splunk-hec.corp.redhat.com:8088/services/collector"
          },
          "sumologic": {
            "sumologic_hec_url": ""
          }
        }
      documentation: >-
        JSON object for push-to-data-lake configuration. The "push_to_data_lake" key supports:
        skip (bool) - when true, skip this step entirely and exit 0;
        continue_on_fail (bool) - when true, failures exit 0 so the pipeline continues;
        data_lake_destination (string) - backend selection: splunk | sumologic (default: splunk);
        formal_test (bool) - when true, marks events as formal test results (default: true);
        test_names (string) - single test name or comma-separated list (e.g., "oslat" or "oslat,cyclictest"); defaults to "all";
        debug (bool) - when true, enables Ansible -vvv verbose output.
        The "splunk" key supports:
        splunk_hec_url (string) - Splunk HEC endpoint URL.
        The "sumologic" key supports:
        sumologic_hec_url (string) - SumoLogic endpoint URL (when infrastructure is ready).
        Values are exported as uppercase env vars, overriding ref.yaml defaults.

  credentials:
    # Splunk HEC credentials
    - namespace: test-credentials
      name: telcov10n-splunk-hec
      mount_path: /var/splunk

    # SumoLogic credentials (TO BE ENABLED: Waiting for vault secret creation)
    # The step code is ready to handle SumoLogic destination, but the credentials
    # don't exist in test-credentials namespace yet. When the telcov10n-sumologic-hec
    # secret is created, uncomment the lines below to enable SumoLogic support.
    # - namespace: test-credentials
    #   name: telcov10n-sumologic-hec
    #   mount_path: /var/sumologic

    # Common group variables
    - namespace: test-credentials
      name: telcov10n-ansible-group-all
      mount_path: /var/group_variables/common/all
    - namespace: test-credentials
      name: telcov10n-ansible-group-bastions
      mount_path: /var/group_variables/common/bastions

    # Spoke spree-01 credentials
    - namespace: test-credentials
      name: telcov10n-ansible-spree-01-master0
      mount_path: /var/host_variables/spree-01/master0
    - namespace: test-credentials
      name: telcov10n-ansible-group-spree-01-masters
      mount_path: /var/group_variables/spree-01/masters
    - namespace: test-credentials
      name: telcov10n-ansible-group-spree-01-nodes
      mount_path: /var/group_variables/spree-01/nodes

    # Spoke spree-02 credentials
    - namespace: test-credentials
      name: telcov10n-ansible-spree-02-master0
      mount_path: /var/host_variables/spree-02/master0
    - namespace: test-credentials
      name: telcov10n-ansible-group-spree-02-masters
      mount_path: /var/group_variables/spree-02/masters
    - namespace: test-credentials
      name: telcov10n-ansible-group-spree-02-nodes
      mount_path: /var/group_variables/spree-02/nodes

    # Spoke spree-03 credentials
    - namespace: test-credentials
      name: telcov10n-ansible-spree-03-master0
      mount_path: /var/host_variables/spree-03/master0
    - namespace: test-credentials
      name: telcov10n-ansible-group-spree-03-masters
      mount_path: /var/group_variables/spree-03/masters
    - namespace: test-credentials
      name: telcov10n-ansible-group-spree-03-nodes
      mount_path: /var/group_variables/spree-03/nodes

    # Spoke spree-04 credentials
    - namespace: test-credentials
      name: telcov10n-ansible-spree-04-master0
      mount_path: /var/host_variables/spree-04/master0
    - namespace: test-credentials
      name: telcov10n-ansible-group-spree-04-masters
      mount_path: /var/group_variables/spree-04/masters
    - namespace: test-credentials
      name: telcov10n-ansible-group-spree-04-nodes
      mount_path: /var/group_variables/spree-04/nodes

    # Spoke cnfdg46 credentials
    - namespace: test-credentials
      name: telcov10n-ansible-cnfdg46-master0
      mount_path: /var/host_variables/cnfdg46/master0
    - namespace: test-credentials
      name: telcov10n-ansible-group-cnfdg46-masters
      mount_path: /var/group_variables/cnfdg46/masters
    - namespace: test-credentials
      name: telcov10n-ansible-group-cnfdg46-nodes
      mount_path: /var/group_variables/cnfdg46/nodes

    # Spoke cnfdg58 credentials
    - namespace: test-credentials
      name: telcov10n-ansible-cnfdg58-master0
      mount_path: /var/host_variables/cnfdg58/master0
    - namespace: test-credentials
      name: telcov10n-ansible-group-cnfdg58-masters
      mount_path: /var/group_variables/cnfdg58/masters
    - namespace: test-credentials
      name: telcov10n-ansible-group-cnfdg58-nodes
      mount_path: /var/group_variables/cnfdg58/nodes

    # Spoke kni-qe-100 credentials
    - namespace: test-credentials
      name: telcov10n-ansible-kpi-kni-qe-100-master0
      mount_path: /var/host_variables/kni-qe-100/master0
    - namespace: test-credentials
      name: telcov10n-ansible-group-kpi-kni-qe-100-masters
      mount_path: /var/group_variables/kni-qe-100/masters
    - namespace: test-credentials
      name: telcov10n-ansible-group-kpi-kni-qe-100-nodes
      mount_path: /var/group_variables/kni-qe-100/nodes

    # Hub kni-qe-70 credentials
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-70-bastion
      mount_path: /var/host_variables/kni-qe-70/bastion

    # Hub kni-qe-71 credentials
    - namespace: test-credentials
      name: telcov10n-ansible-kni-qe-71-bastion
      mount_path: /var/host_variables/kni-qe-71/bastion

    # Hub dev-kpi-01 credentials
    - namespace: test-credentials
      name: telcov10n-ansible-dev-kpi-01-bastion
      mount_path: /var/host_variables/dev-kpi-01/bastion

    # Hub dev-kpi-02 credentials
    - namespace: test-credentials
      name: telcov10n-ansible-dev-kpi-02-bastion
      mount_path: /var/host_variables/dev-kpi-02/bastion

    # Hub dev-kpi-03 credentials
    - namespace: test-credentials
      name: telcov10n-ansible-dev-kpi-03-bastion
      mount_path: /var/host_variables/dev-kpi-03/bastion

    # Hub dev-kpi-04 credentials
    - namespace: test-credentials
      name: telcov10n-ansible-dev-kpi-04-bastion
      mount_path: /var/host_variables/dev-kpi-04/bastion

  documentation: |-
    Push telco-kpis test results to data lake (Splunk or SumoLogic).

    This step reads test results from the shared artifact directory on the bastion
    and pushes them to the configured observability backend. It generates a JSON
    artifact with the push status and a search URL for viewing the data.

    The step can be integrated into Prow test workflows to automatically push
    results after test execution, or run standalone to retry failed pushes.

    Requirements:
    - HUB_CLUSTER and SPOKE_CLUSTER must be specified
    - REPORTING_SETTINGS.push_to_data_lake.test_names for selecting specific tests
      (single test name or comma-separated list, e.g., "oslat" or "oslat,cyclictest")
      Defaults to "all" to push all available tests
    - Appropriate credentials for the selected destination (Splunk/SumoLogic)
    - Bastion SSH access configured via SHARED_DIR

    Outputs:
    - ARTIFACT_DIR/push-to-data-lake-result.json: Push status and search URL
    - SHARED_DIR/push-to-data-lake-result.json: Copy for downstream steps
