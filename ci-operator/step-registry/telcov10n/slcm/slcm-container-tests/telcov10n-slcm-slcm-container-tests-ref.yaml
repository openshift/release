ref:
  as: telcov10n-slcm-slcm-container-tests
  from: src
  commands: telcov10n-slcm-slcm-container-tests-commands.sh
  grace_period: 4h
  timeout: 24h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
    - collection: telco-verification-slcm
      group: project-02/slcm-container
      mount_path: /var/run/project-02/slcm-container
    - collection: telco-verification-slcm
      group: project-02/vault-data
      mount_path: /var/run/project-02/vault-data
    - collection: telcov10n-ci
      group: teams/slcm/bos2-stamp-608-609-credentials
      mount_path: /var/run/bastion1
    - collection: telcov10n-ci
      group: ansible/ansible_group_all
      mount_path: /var/run/telcov10n
  documentation: |-
    Run Telco QE-SLCM tests.