ref:
  as: telcov10n-slcm-lab-ping
  from: src
  commands: telcov10n-slcm-lab-ping-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: telcov10n-ci
    group: teams/slcm/BOS2-Nokia-bastion
    mount_path: /var/run/bastion1
  - collection: telcov10n
    group: vaults-backup/kni-qe-41-ssh-key
    mount_path: /var/run/ssh-key
