ref:
  as: telcov10n-slcm-slcm-project-01-container-tests
  from: src
  commands: telcov10n-slcm-slcm-project-01-container-tests-commands.sh
  grace_period: 4h
  timeout: 24h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
    - collection: telco-verification-slcm
      group: project-01/slcm-container
      mount_path: /var/run/project-01/slcm-container
    - collection: telco-verification-slcm
      group: project-01/vault-data
      mount_path: /var/run/project-01/vault-data
    - collection: telco-verification-slcm
      group: project-01/bastion-data
      mount_path: /var/run/bastion1
    - collection: telcov10n-ci
      group: ansible
      mount_path: /var/common_variables
  documentation: |-
    Run Telco QE-SLCM tests.
