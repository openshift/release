ref:
  as: telcov10n-slcm-gitlab-project2-tests
  from_image:
    namespace: ci
    name: telco-bastion
    tag: latest
  commands: telcov10n-slcm-gitlab-project2-tests-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: ZTP_SITES_LIST
  - name: DCI_PIPELINE_FILES
  - name: DEBUG_MODE
  - name: DU_PROFILE
  - name: ECO_GOTESTS_CONTAINER
  - name: EDU_CLUSTER
  - name: EDU_PTP
  - name: GITLAB_BRANCH
  - name: OCP_VERSION
  - name: RUN_EDU_TESTS
  - name: SITE_NAME
  - name: SPIRENT_PORT
  - name: STAMP
  - name: CREDENTIALS_PATH
    default: /var/run/project-02  
  credentials:
  - collection: telco-verification-slcm
    group: project-02/ci-project-id
    mount_path: /var/run/project-02/ci-project-id
  - collection: telco-verification-slcm
    group: project-02/dci-remote-ci
    mount_path: /var/run/project-02/dci-remote-ci
  - collection: telco-verification-slcm
    group: project-02/eco-validation-container
    mount_path: /var/run/project-02/eco-validation-container
  - collection: telco-verification-slcm
    group: project-02/eco-gotests-container
    mount_path: /var/run/project-02/eco-gotests-container
  - collection: telco-verification-slcm
    group: project-02/gitlab-token
    mount_path: /var/run/project-02/gitlab-token
  - collection: telco-verification-slcm
    group: project-02/gitlab-url
    mount_path: /var/run/project-02/gitlab-url
  - collection: telco-verification-slcm
    group: project-02/gitlab-api-token
    mount_path: /var/run/project-02/gitlab-api-token
  documentation: |-
    Run telco QE-SLCM eDU tests.
