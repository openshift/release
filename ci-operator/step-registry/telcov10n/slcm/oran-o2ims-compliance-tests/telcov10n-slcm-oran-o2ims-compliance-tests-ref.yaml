ref:
  as: telcov10n-slcm-oran-o2ims-compliance-tests
  from: src
  commands: telcov10n-slcm-oran-o2ims-compliance-tests-commands.sh
  grace_period: 4h
  timeout: 4h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
    - collection: telcov10n-ci
      group: teams/slcm
      field: bos2-stamp-608-609-credentials
      as: secret
      mount_path: /var/run/bastion1
    - collection: telcov10n-ci
      group: ansible
      mount_path: /var/common_variables
