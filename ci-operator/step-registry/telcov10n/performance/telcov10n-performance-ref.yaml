ref:
  as: telcov10n-performance
  from: src
  commands: telcov10n-performance-commands.sh
  grace_period: 4h
  timeout: 24h0m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
    - collection: telcov10n
      group: bos2-stamp-307
      mount_path: /var/run/bastion1
    - collection: telcov10n-ci
      group: ansible/ansible_group_all
      mount_path: /var/run/telcov10n
