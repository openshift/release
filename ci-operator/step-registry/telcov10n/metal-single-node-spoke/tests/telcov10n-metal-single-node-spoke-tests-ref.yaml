ref:
  as: telcov10n-metal-single-node-spoke-tests
  commands: telcov10n-metal-single-node-spoke-tests-commands.sh
  from: src
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  env:
  - name: SPOKE_HELPER_IMG
    default: "quay.io/ccardenosa/sno-spoke-helper"
    documentation: |-
      Gitea helper image to connect to the Git repo via SSH
  - name: PYTEST_VERBOSITY
    default: "-vv -s"
    documentation: |-
      pytest trace level
  - name: AUX_HOST
    default: ""
    documentation: |
      The Bastion host where jobs can share synchronised data and run remote aux scripts and playbooks
  - name: SOCKS5_PROXY
    default: ""
    documentation: |-
      If cluster endpoints are reachables through a socks5 proxy. When left empty, the step opens its own
      SOCKS5 tunnel through AUX_HOST, which is needed whenever the lab publishes the '*.apps' wildcard at an
      address that is only routable from inside the lab network.
  - name: SOCKS5_LOCAL_PORT
    default: "1080"
    documentation: |-
      Local port the SOCKS5 tunnel through AUX_HOST listens on. Only used when SOCKS5_PROXY is empty.
  documentation: |-
    This step allows to verify the SNO Spoke cluster deployed through its kubeconfig.
