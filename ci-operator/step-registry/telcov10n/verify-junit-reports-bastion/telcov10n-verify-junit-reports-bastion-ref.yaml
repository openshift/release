ref:
  as: telcov10n-verify-junit-reports-bastion
  from_image:
    namespace: telcov10n-ci
    name: eco-ci-cd
    tag: eco-ci-cd
  commands: telcov10n-verify-junit-reports-bastion-commands.sh
  documentation: |-
    Verify JUnit reports on the bastion host instead of the CI pod to avoid the
    1 MB Kubernetes secret size limit of SHARED_DIR.
    Runs fail_if_any_test_failed.py on the bastion against JUNIT_REPORT_DIR.
    Optionally use shared inventory and a current-run report-directory file.
    Required execution results also fail the job, even when XML reports pass.
  grace_period: 10s
  timeout: 30m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: CLUSTER_NAME
    default: ""
    documentation: Hub cluster name (used to locate bastion host variables)
  - name: JUNIT_REPORT_DIR
    default: "/tmp/test_reports/junit"
    documentation: Directory on the bastion containing JUnit XML reports to verify
  - name: JUNIT_INVENTORY_PREFIX
    default: ""
    documentation: |-
      Optional shared inventory prefix, for example target-. Reads <prefix>bastion
      and <prefix>all from SHARED_DIR. Empty keeps the mounted CLUSTER_NAME inventory.
  - name: JUNIT_REPORT_DIR_FILE
    default: ""
    documentation: |-
      Optional filename under SHARED_DIR containing the current run's absolute
      report directory on the bastion. Overrides JUNIT_REPORT_DIR; missing or
      invalid files fail verification instead of falling back to another run.
  - name: JUNIT_REQUIRED_RESULT_FILES
    default: ""
    documentation: |-
      Optional space-separated filenames under SHARED_DIR containing step exit
      codes. Missing, invalid, or nonzero results fail the final job. XML reports
      are still verified when the bastion and report directory are available.
  - name: KNOWN_FAILURES
    default: "[]"
    documentation: |-
      Test cases that are known to fail. JSON array of test identifiers to skip.
      Examples:
      - Simple array: ["TestCaseA", "TestCaseB"]
      - With URLs: [{"test_id": "TestCaseA", "url": "https://issues.example.com/123"}]
  credentials:
  - namespace: test-credentials
    name: telcov10n-ansible-group-all
    mount_path: /var/group_variables/common/all
  - namespace: test-credentials
    name: telcov10n-ansible-kni-qe-110-bastion
    mount_path: /var/host_variables/kni-qe-110/bastion
  - namespace: test-credentials
    name: telcov10n-ansible-kni-qe-111-bastion
    mount_path: /var/host_variables/kni-qe-111/bastion
