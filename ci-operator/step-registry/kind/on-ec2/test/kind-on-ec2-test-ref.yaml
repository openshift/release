ref:
  as: kind-on-ec2-test
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  grace_period: 10m
  commands: kind-on-ec2-test-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    SSH into the EC2 instance provisioned by kind-on-ec2-provision,
    create a kind cluster, deploy a hello-world workload, and verify
    it works. Runs a second create/destroy cycle to measure cached
    image performance.

    Expects in SHARED_DIR:
      ${SHARED_DIR}/public_address
      ${SHARED_DIR}/ssh_user
    Expects in cluster_profile:
      ${CLUSTER_PROFILE_DIR}/ssh-privatekey
