ref:
  as: operator-pipelines-preflight-prod-stable-cluster
  from: tools
  commands: operator-pipelines-preflight-prod-stable-cluster-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 400Mi
  documentation: |-
    This step waits for all cluster operators to remain stable for at least 2 minutes
    using `oc adm wait-for-stable-cluster`, with a 10-minute timeout. The step fails
    if the stability check returns a non-zero exit code before the preflight check runs.
