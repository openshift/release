workflow:
  as: must-gather-review-agent
  steps:
    pre:
      - ref: review-agent-setup
    test:
      - ref: review-agent-process
    post:
      - ref: review-agent-report
    env:
      REVIEW_AGENT_AUTH_MODE: "pat"
      REVIEW_AGENT_FORK_ORG: "jira-solve-bot"
      REVIEW_AGENT_UPSTREAM_REPO: "openshift/must-gather-operator"
  documentation: |-
    Must-gather operator-specific wrapper for the generic review-agent workflow.
    Uses PAT auth mode — auto-forks openshift/must-gather-operator
    into jira-solve-bot for push operations.

    Credentials: Uses hypershift-team-claude-prow (shared secret with gh-pat).
