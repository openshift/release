ref:
  as: nutanix-validate-credential-rotation
  from: cloud-credential-operator
  cli: latest
  commands: nutanix-validate-credential-rotation-commands.sh
  grace_period: 30s
  credentials:
    - namespace: test-credentials
      name: nutanix-pc
      mount_path: /tmp/nutanix-creds
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: NEW_NUTANIX_USERNAME
    default: ""
    documentation: |-
      Username for the new Nutanix Prism Central service account. If empty, will use
      existing credentials with a suffix to simulate rotation.
  - name: NEW_NUTANIX_PASSWORD
    default: ""
    documentation: |-
      Password for the new Nutanix Prism Central service account. If empty, will use
      existing credentials to simulate rotation.
  - name: FEATURE_SET
    default: ""
    documentation: |-
      Add --enable-tech-preview option to ccoctl, allow ccoctl process tech-preview CRs
  - name: VALIDATE_OLD_CREDS_REMOVAL
    default: "true"
    documentation: |-
      If true, validates that old credentials can be safely removed after rotation.
  - name: VERIFY_CONTROLLER_RESTART
    default: "true"
    documentation: |-
      If true, checks whether controller restarts are required or if credentials are
      picked up automatically.
  documentation: |-
    Validates the procedure for replacing Nutanix Prism Central service account
    credentials on a post-installation OpenShift cluster. This step:

    1. Uses ccoctl nutanix create-shared-secrets to regenerate credential secrets
       with a new service account
    2. Applies the regenerated secrets to all three namespaces:
       - openshift-machine-api
       - openshift-cloud-controller-manager
       - openshift-cluster-csi-drivers
    3. Confirms that Machine API, Cloud Controller Manager, and CSI driver all
       function correctly after the credential swap
    4. Verifies that the old service account can be safely removed after the new
       one is in place
    5. Confirms whether controller restarts are required or if credentials are
       picked up automatically

    This validates the procedure documented in:
    - OSDOCS-20794: Post-installation Nutanix credential replacement
    - Related documentation: openshift/openshift-docs#116665
