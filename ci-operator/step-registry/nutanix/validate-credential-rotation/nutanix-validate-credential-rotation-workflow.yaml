workflow:
  as: nutanix-validate-credential-rotation
  documentation: |-
    Complete workflow to validate Nutanix credential rotation on a live cluster.
    This workflow provisions a Nutanix cluster, then validates the credential
    rotation procedure by rotating service account credentials and verifying
    all components continue to function correctly.

    Use this workflow to validate the procedure documented in OSDOCS-20794 and
    openshift/openshift-docs#116665 for post-installation Nutanix Prism Central
    service account credential replacement.
  steps:
    pre:
    - chain: ipi-nutanix-pre
    test:
    - ref: nutanix-validate-credential-rotation
    post:
    - chain: ipi-nutanix-post
