ref:
  as: nutanix-deprovision-bastionhost
  from: upi-installer
  grace_period: 10m
  commands: nutanix-deprovision-bastionhost-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: cluster-secrets-nutanix
    group: ci-route-53
    mount_path: /var/run/vault/nutanix
  documentation: |-
    Delete a bastion host on nutanix.
