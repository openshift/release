ref:
  as: sandboxed-containers-operator-post-wait
  from: cli
  grace_period: 10m
  timeout: 24h0m0s
  env:
  - name: SLEEP_DURATION
    default: "0h"
    documentation: |-
      How long to wait before continuing with post steps. The effective maximum
      is limited by the step timeout, which may be overridden by the workflow.
  commands: sandboxed-containers-operator-post-wait-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Wait before deprovisioning so the cluster remains available for manual
    testing and debugging.
