chain:
  as: sandboxed-containers-operator-test
  steps:
    - ref: sandboxed-containers-operator-testsuites-gate
  documentation: |-
    Shared `test`-phase chain for the sandboxed-containers-operator e2e
    workflows.

    All e2e workflows reference this chain in their `test` phase so that
    changes to the test-phase steps apply to every workflow at once.

    `openshift-extended-test` (OTP) is intentionally not run here; the gate
    step still runs so the POST-phase testsuites chain is unblocked.
