chain:
  as: sandboxed-containers-operator-test
  steps:
    - ref: sandboxed-containers-operator-test-sanity
    - ref: sandboxed-containers-operator-testsuites-gate
  documentation: |-
    Shared `test`-phase chain for the sandboxed-containers-operator e2e
    workflows.

    All e2e workflows reference this chain in their `test` phase so that
    changes to the test-phase steps apply to every workflow at once.

    The `sandboxed-containers-operator-test-sanity` step runs first and checks
    that a single workload runs on the cluster. It is enabled by default; a
    job whose registry does not carry the workload image turns it off with
    TESTS_SANITY_ENABLE: "false".  It runs before the
    `sandboxed-containers-operator-testsuites-gate` step so that a failure
    there leaves the gate file uncreated, which skips the post testsuite
    steps.
