ref:
  as: sandboxed-containers-operator-env-cm
  # Provides az cli
  from: upi-installer
  commands: sandboxed-containers-operator-env-cm-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: CATALOG_SOURCE_NAME
    default: "redhat-operators"
    documentation: |-
      Stored in osc-config ConfigMap for openshift-tests-private.
      CatalogSource creation is handled by the install-osc-operator step.
  - name: ENABLEGPU
    default: "false"
    documentation: |-
      Configures a special openshift-tests-private configmap to include
      Nvidia GPU drivers in podvm image
  - name: ENABLEPEERPODS
    default: "false"
    documentation: |-
      Configures a special openshift-tests-private configmap to enablePeerPods
  - name: INITDATA
    default: ""
    documentation: |-
      Configures a special openshift-tests-private configmap to set
      the initdata for the osc operator
  - name: INSTALL_KATA_RPM
    default: "false"
    documentation: |-
      Configures a special openshift-tests-private configmap to enable
      installation of "/var/local/kata-containers.rpm" on each worker
      node
  - name: MUST_GATHER_IMAGE
    default: "registry.redhat.io/openshift-sandboxed-containers/osc-must-gather-rhel9:latest"
    documentation: |-
      Configures a special openshift-tests-private configmap to use
      test this must-gather image
  - name: OPERATOR_UPDATE_CHANNEL
    default: "stable"
    documentation: |-
      Configures a special openshift-tests-private configmap to use
      this osc operator subscription update channel
  - name: PODVM_IMAGE_URL
    default: ""
    documentation: |
      Configures a special openshift-tests-private configmap to import
      podvm image from URL instead of building it from scratch
  - name: RUNTIMECLASS
    default: "kata"
    documentation: |-
      Configures a special openshift-tests-private configmap to use
      this runtime class for testing; set either "kata" or "kata-remote"
      (for peer pods or CoCo)
  - name: TEST_RELEASE_TYPE
    default: "GA"
    documentation: |-
      Stored in osc-config ConfigMap for use by test steps. Does not control
      CatalogSource creation; set CATALOG_SOURCE_IMAGE on install-osc-operator
      for pre-release testing.
  - name: TRUSTEE_URL
    default: ""
    documentation: |-
      Configures a special openshift-tests-private configmap to point
      the osc operator to an existing external Trustee instance
  - name: WORKLOAD_IMAGE
    default: "ghcr.io/nginxinc/nginx-unprivileged:alpine@sha256:e234d4f7e346c098f7b22245690372382aded5be988611eb2c53ae62231eece7"
    documentation: |-
      Configures a special openshift-tests-private configmap to use this image
      for test workloads. The image must serve HTTP on port 8080 and run as a
      non-root user.

      quay.io/openshift/origin-hello-openshift cannot be used at the moment:
      two of its layers carry empty SCHILY.xattr.user.overlay.origin PAX
      records, which astral-tokio-tar >= 0.6.3 rejects, so image-rs fails the
      pull with "Failed to read entries from the tar". Restore it, together
      with WORKLOAD_MESSAGE, once image-rs picks up a tar reader that accepts
      empty PAX values.
  - name: WORKLOAD_MESSAGE
    default: "Welcome to nginx!"
    documentation: |-
      Text WORKLOAD_IMAGE is expected to serve over HTTP; the expose-service
      test asserts the response body contains it. Always set it together with
      WORKLOAD_IMAGE ("Hello OpenShift!" for origin-hello-openshift).
  - name: WORKLOAD_TO_TEST
    default: "kata"
    documentation: |-
      Configures a special openshift-tests-private configmap to select
      a workload to test; you also need to specify RUNTIMECLASS
      and ENABLEPEERPODS accordingly; supported values: "kata",
      "peer-pods" or "coco"
  - name: CREDENTIALS_MODE
    default: "cco"
    documentation: |-
      Configures a special openshift-tests-private configmap to specify
      the cloud identity mode. Options: "cco" (Cloud Credential Operator -
      default), "manual" (manual secret creation), "sts" (workload identity/
      federated credentials). Tests read this to understand how credentials
      are managed.
  documentation: |-
    Creates the env-cm configmap used by openshift-tests-private when executing
    "[sig-kata]" group of tests; mainly used to tweak Openshift Sandboxed
    Containers Operator deployment/configuration or to tweak it's testing
