ref:
  as: sandboxed-containers-operator-testsuites-skeleton
  from: cli
  commands: sandboxed-containers-operator-testsuites-skeleton-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
  grace_period: 1m0s
  env:
  - name: TEST_SKELETON_ENABLE
    default: "false"
    documentation: |-
      Enable-gate for the skeleton test suite (skip-by-default).
      "true"  -> the step runs, logs the value, and DELIBERATELY exits 1 to
                 demonstrate that a failing suite still produces a JUnit artifact
                 and does not block other suites or post steps.
      "false"/unset -> the step logs the value and exits 0 (skipped).
  documentation: |-
    Skeleton demonstration suite for the OSC testsuites chain. Echoes
    TEST_SKELETON_ENABLE and, when enabled, fails on purpose to prove best_effort
    non-blocking behaviour. Always writes $ARTIFACT_DIR/junit_skeleton.xml.
