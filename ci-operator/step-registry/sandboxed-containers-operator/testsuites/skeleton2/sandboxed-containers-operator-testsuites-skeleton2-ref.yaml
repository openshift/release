ref:
  as: sandboxed-containers-operator-testsuites-skeleton2
  from: cli
  commands: sandboxed-containers-operator-testsuites-skeleton2-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
  grace_period: 1m0s
  env:
  - name: TEST_SKELETON2_ENABLE
    default: "false"
    documentation: |-
      Enable-gate for the skeleton2 test suite (skip-by-default).
      "true"  -> the step runs, logs the value, and exits 0 (always succeeds).
      "false"/unset -> the step logs the value and exits 0 (skipped).
  documentation: |-
    Second skeleton demonstration suite for the OSC testsuites chain. Runs after
    the skeleton step and, when enabled, always succeeds -- proving that a later
    suite still runs and passes even when an earlier suite (skeleton) failed.
    Always writes $ARTIFACT_DIR/junit_skeleton2.xml.
