ref:
  as: sandboxed-containers-operator-testsuites-skeleton2
  from: cli
  commands: sandboxed-containers-operator-testsuites-skeleton2-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
  grace_period: 1m0s
  # Environment variables follow the TESTS_<SUITE_NAME>_<PARAMETER> convention
  # shared by all OSC test suites (see the testsuites AGENTS.md).
  env:
  - name: TESTS_SKELETON2_ENABLE
    default: "false"
    documentation: |-
      Enable-gate for the skeleton2 test suite (skip-by-default).
      "true"  -> the step runs, logs the value, and exits 0 (always succeeds).
      "false"/unset -> the step logs the value and exits 0 (skipped).
  documentation: |-
    Demonstration/template suite for the OSC testsuites chain. Runs after the
    other suites in the chain and, when enabled, always succeeds -- proving that
    a later suite still runs and passes even when an earlier suite failed.
    Always writes $ARTIFACT_DIR/junit_skeleton2.xml.
