ref:
  as: sandboxed-containers-operator-testsuites-kata-upstream
  from: cli
  commands: sandboxed-containers-operator-testsuites-kata-upstream-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
  grace_period: 1m0s
  env:
  - name: TEST_KATA_UPSTREAM_ENABLE
    default: "false"
    documentation: |-
      Enable-gate for the Kata Containers upstream test suite (skip-by-default).
      "true"  -> the step runs
      "false"/unset -> the step logs the value and exits 0 (skipped).
  documentation: |-
    Run upstream Kata Containers e2e tests.
