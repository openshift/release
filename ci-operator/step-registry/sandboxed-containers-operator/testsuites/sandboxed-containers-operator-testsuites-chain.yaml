chain:
  as: sandboxed-containers-operator-testsuites
  steps:
    - ref: sandboxed-containers-operator-testsuites-kata-upstream
      best_effort: true
    - ref: sandboxed-containers-operator-testsuites-skeleton2
      best_effort: true
  documentation: |-
    Sandboxed Containers Operator (OSC) POST-phase test-suite chain.

    Runs as the FIRST operation of the `post` phase in the OSC e2e workflow.
    Each step is an independent test suite gated by TEST_<STEP_NAME>_ENABLE and
    marked best_effort: true, so a failing/skipped/erroring suite never blocks
    the other suites or the remaining post steps (must-gather, deprovision).

    Non-blocking behaviour REQUIRES the referencing workflow to set
    `steps.allow_best_effort_post_steps: true`.

    Add a new suite: create a step dir under testsuites/, then append its ref
    here with `best_effort: true`.
