ref:
  as: sandboxed-containers-operator-debug-network
  from: cli
  commands: sandboxed-containers-operator-debug-network-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 10m0s
  documentation: |-
    TEMPORARY debug step for investigating the C00316 "context deadline
    exceeded" timeout on azure-ipi-coco-disconnected. Read-only diagnostics
    only (DNS resolution + curl timing to the Trustee/KBS route from a
    worker node, plus best-effort cloud-api-adaptor pod logs), written to
    $ARTIFACT_DIR. Never affects job pass/fail. Safe to remove once the
    investigation concludes.
