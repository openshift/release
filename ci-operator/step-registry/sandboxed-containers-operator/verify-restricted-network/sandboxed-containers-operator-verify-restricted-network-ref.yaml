ref:
  as: sandboxed-containers-operator-verify-restricted-network
  from: cli
  commands: sandboxed-containers-operator-verify-restricted-network-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Fails the job if a cluster node can still reach the public internet
    directly (bypassing the proxy). Confirms the RESTRICTED_NETWORK egress
    firewall configured by azure-provision-vnet is actually enforced,
    instead of assuming it from configuration alone.
