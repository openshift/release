ref:
  as: sandboxed-containers-operator-deprovision-isolation-common-acr-endpoint
  from: upi-installer
  timeout: 10m0s
  grace_period: 2m
  commands: sandboxed-containers-operator-deprovision-isolation-common-acr-endpoint-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: ACR_RESOURCE_GROUP
    default: ""
    documentation: Resource group of the reused ACR. Required when ACR_NAME is set.
  - name: ACR_NAME
    default: ""
    documentation: |-
      Name of an ACR to reuse across runs. Empty (default) means a per-run
      ACR in the cluster resource group, and this step does nothing.
  documentation: |-
    Deletes, from a reused ACR, the private endpoint connection created for
    this run's cluster by the
    sandboxed-containers-operator-provision-isolation-common-acr-endpoint
    step. Must run before the cluster resource group is deleted. A per-run
    ACR is deleted together with the cluster resource group instead.
