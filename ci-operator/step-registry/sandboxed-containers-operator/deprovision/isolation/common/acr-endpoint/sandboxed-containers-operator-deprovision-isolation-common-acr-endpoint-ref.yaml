ref:
  as: sandboxed-containers-operator-deprovision-isolation-common-acr-endpoint
  from: upi-installer
  timeout: 10m0s
  grace_period: 2m
  commands: sandboxed-containers-operator-deprovision-isolation-common-acr-endpoint-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: ACR_RESOURCE_GROUP
    default: "osc-ci-mirror-rg"
    documentation: Resource group for the persistent ACR.
  - name: ACR_NAME
    default: "osccimirror"
    documentation: Name of the persistent ACR.
  documentation: |-
    Deletes, from the persistent ACR, the private endpoint connection
    created for this run's cluster by the
    sandboxed-containers-operator-provision-isolation-common-acr-endpoint
    step. Must run before the cluster resource group is deleted.
