chain:
  as: sandboxed-containers-operator-proxy-setup
  steps:
  - ref: proxy-config-generate
  - ref: ipi-conf-proxy
  documentation: |-
    Generate the bastion proxy config and wire it into install-config.yaml.
    Groups the two OCP QE refs used for Restricted Network proxy setup so
    other OSC workflows (e.g. proxy-only, or a future bare-metal pipeline)
    can reuse this exact configuration.
