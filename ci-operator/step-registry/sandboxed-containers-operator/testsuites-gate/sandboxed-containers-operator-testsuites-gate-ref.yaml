ref:
  as: sandboxed-containers-operator-testsuites-gate
  from: src
  commands: sandboxed-containers-operator-testsuites-gate-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  timeout: 5m0s
  grace_period: 1m0s
  documentation: |-
    Gate for the OSC POST-phase test-suite chain.

    Runs in the `test` phase. Its only job is to create the gate file
    ${SHARED_DIR}/testsuites_gate. The post-phase testsuites
    read that file and skip themselves when it is absent, so they never run
    against an environment whose setup did not complete or basic sanity checks
    did not pass.
