workflow:
  as: sandboxed-containers-operator-e2e-azure
  steps:
    allow_best_effort_post_steps: true
    env:
      SLEEP_DURATION: 3h
      TEST_PARALLEL: 1
      MUST_GATHER_IMAGE: "registry.redhat.io/openshift-sandboxed-containers/osc-must-gather-rhel9:latest"
      MUST_GATHER_TIMEOUT: "35m"
      ENABLE_MUST_GATHER: "true"
      MUST_GATHER_ON_FAILURE_ONLY: "true"
      TEST_FILTERS: ~DisconnectedOnly&;~Disruptive&
    pre:
    - chain: sandboxed-containers-operator-ipi-azure-pre
    - chain: sandboxed-containers-operator-pre
    post:
    - ref: cucushift-installer-wait
      timeout: 12h10m0s
      best_effort: true
      optional_on_success: true
    - ref: sandboxed-containers-operator-gather-must-gather
    - chain: ipi-azure-post
    test:
    - chain: sandboxed-containers-operator-tests
  documentation: |-
    This workflow runs sandboxed-containers-operator e2e tests on an
    Azure cluster. allow_best_effort_post_steps enables best_effort
    in the test phase so all test steps run regardless of failures.
    The sandboxed-containers-operator-tests chain groups all test
    steps; individual steps are skipped when TEST_<step>_ENABLE
    is "false".
