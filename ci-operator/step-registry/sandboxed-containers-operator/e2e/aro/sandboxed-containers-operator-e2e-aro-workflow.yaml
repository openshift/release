workflow:
  as: sandboxed-containers-operator-e2e-aro
  steps:
    allow_best_effort_post_steps: true
    env:
      TEST_PARALLEL: 1
      # The full openshift-extended-test run lives in the post phase and must
      # exit non-zero on real test failure so it fails the job (RED). It
      # self-skips when the test-phase smoke gate did not write the
      # ${SHARED_DIR}/osc-post-smoke-ok marker: the post chain's enable-full step
      # blanks TEST_SCENARIOS in that case, so a failed install/pre or smoke
      # gate does not produce a spurious failure here.
      FORCE_SUCCESS_EXIT: "no"
      MUST_GATHER_IMAGE: "registry.redhat.io/openshift-sandboxed-containers/osc-must-gather-rhel9:latest"
      MUST_GATHER_TIMEOUT: "35m"
      ENABLE_MUST_GATHER: "true"
      MUST_GATHER_ON_FAILURE_ONLY: "false"
      ARO_BYO_NSG: "true"
      ARO_WORKER_COUNT: "3"
      ARO_WORKER_VM_SIZE: Standard_D8s_v3
      TEST_FILTERS: ~DisconnectedOnly&;~Disruptive&
    pre:
    - ref: azure-provision-resourcegroup
    - ref: aro-provision-vnet
    - ref: aro-provision-nsg
    - ref: aro-provision-cluster
    - ref: ipi-install-rbac
    - ref: openshift-cluster-bot-rbac
    - chain: sandboxed-containers-operator-pre
    test:
    - ref: sandboxed-containers-operator-test
    post:
    - chain: sandboxed-containers-operator-post
    - ref: cucushift-installer-wait
      timeout: 12h10m0s
      best_effort: true
      optional_on_success: true
    - ref: sandboxed-containers-operator-gather-must-gather
    - ref: sandboxed-containers-operator-post
    - ref: aro-deprovision
  documentation: |-
    This workflow runs sandboxed-containers-operator e2e tests on an
    ARO cluster. The test phase runs a minimal smoke gate
    (sandboxed-containers-operator-test); on success it
    writes ${SHARED_DIR}/osc-post-smoke-ok. The full suites run in the post phase
    (sandboxed-containers-operator-post chain), where every suite runs
    regardless of the others and each fails the job on its own real failure.
    Suites self-skip when the smoke gate did not pass, and individual suites are
    skipped when TEST_<step>_ENABLE is "false".
