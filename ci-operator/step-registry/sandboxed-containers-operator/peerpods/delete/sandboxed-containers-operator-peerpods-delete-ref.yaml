ref:
  as: sandboxed-containers-operator-peerpods-delete
  from: cli
  cli: latest
  commands: sandboxed-containers-operator-peerpods-delete-commands.sh
  env:
    - name: PEERPOD_NAMESPACE
      default: openshift-sandboxed-containers-operator
      documentation: Namespace where the peer pod was created.
    - name: PEERPOD_NAME
      default: tls-scan-peerpod
      documentation: Name of the peer pod to delete.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Deletes the peer pod created by sandboxed-containers-operator-peerpods-create.
    Uses --ignore-not-found so it is safe to run even if the pod was already
    cleaned up.
