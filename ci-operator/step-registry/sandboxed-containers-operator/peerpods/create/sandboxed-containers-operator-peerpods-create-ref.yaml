ref:
  as: sandboxed-containers-operator-peerpods-create
  from: cli
  cli: latest
  commands: sandboxed-containers-operator-peerpods-create-commands.sh
  env:
    - name: PEERPOD_NAMESPACE
      default: openshift-sandboxed-containers-operator
      documentation: Namespace where the peer pod is created.
    - name: PEERPOD_NAME
      default: tls-scan-peerpod
      documentation: Name of the peer pod to create.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Creates a minimal peer pod with kata-remote runtimeClass in the target
    namespace. The pod runs sleep infinity and is intended as a scan target
    for TLS compliance testing.
