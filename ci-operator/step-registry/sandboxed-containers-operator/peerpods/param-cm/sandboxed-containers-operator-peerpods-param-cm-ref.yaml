ref:
  as: sandboxed-containers-operator-peerpods-param-cm
  # Provides az cli
  from: upi-installer
  commands: sandboxed-containers-operator-peerpods-param-cm-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: ENABLEPEERPODS
    default: "false"
    documentation: |-
      When "true" it does the preparation steps to allow installing OSC
      operator with peer-pods enabled (networking setup, firewall rules,
      secrets, ...) and generates "peerpods-param-cm.yaml" to be
      consumed by openshift-tests-private [sig-kata] tests.
  - name: WORKLOAD_TO_TEST
    default: "peer-pods"
    documentation: |-
      Workload type being tested: "peer-pods" or "coco". When "coco",
      selects confidential VM instance types (DCas_v5 family on Azure)
      and validates their availability in the target region. Peer-pods
      workloads use standard VM types.
  - name: PODVM_INSTANCE_TYPES
    default: "t3.small,t3.medium,t3.large,t3.xlarge,g4dn.2xlarge,g5.2xlarge"
    documentation: |-
      Comma-separated list of AWS instance types to populate
      PODVM_INSTANCE_TYPES in peerpods-param-cm. CAA validates all
      entries at startup so only include types available in the target
      region.
  - name: AZURE_CVM_INSTANCE_SIZE
    default: "Standard_DC2as_v5"
    documentation: |-
      Azure confidential VM size for CoCo workloads. Used as the default
      AZURE_INSTANCE_SIZE in peerpods-param-cm when WORKLOAD_TO_TEST is
      "coco". Must be a CVM-capable type (DCas_v5, DCads_v5, or ECas_v5
      family). The step validates that this size is available in the
      cluster's Azure region and fails early if not.
  - name: AZURE_CVM_INSTANCE_SIZES
    default: "Standard_DC2as_v5,Standard_DC4as_v5,Standard_DC8as_v5,Standard_DC16as_v5"
    documentation: |-
      Comma-separated list of Azure confidential VM sizes for CoCo
      workloads. Populates AZURE_INSTANCE_SIZES in peerpods-param-cm
      when WORKLOAD_TO_TEST is "coco". All entries must be CVM-capable.
  - name: AZURE_PEERPODS_INSTANCE_SIZE
    default: "Standard_B2als_v2"
    documentation: |-
      Azure VM size for non-CoCo peer-pods workloads. Used as the default
      AZURE_INSTANCE_SIZE in peerpods-param-cm when WORKLOAD_TO_TEST is
      not "coco".
  - name: AZURE_PEERPODS_INSTANCE_SIZES
    default: "Standard_B2als_v2,Standard_B2as_v2,Standard_D2as_v5,Standard_B4als_v2,Standard_D4as_v5,Standard_D8as_v5,Standard_NC64as_T4_v3,Standard_NC8as_T4_v3"
    documentation: |-
      Comma-separated list of Azure VM sizes for non-CoCo peer-pods
      workloads. Populates AZURE_INSTANCE_SIZES in peerpods-param-cm
      when WORKLOAD_TO_TEST is not "coco".
