ref:
  as: sandboxed-containers-operator-post-install-isolation-common-mirror-operator
  from_image:
    namespace: ci
    name: tests-private-base
    tag: latest
  cli: latest
  grace_period: 10m
  commands: sandboxed-containers-operator-post-install-isolation-common-mirror-operator-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: OPERATORS_TO_MIRROR
    default: "sandboxed-containers-operator"
    documentation: |-
      Comma-separated list of operators to mirror from the official
      Red Hat operator index to the local mirror registry.
  - name: CATALOG_SOURCE_IMAGE
    default: ""
    documentation: |-
      When set, use this image as operator catalog instead of the
      official redhat-operator-index. Also mirrors it to the local
      registry for disconnected access.
  - name: OPERATOR_UPDATE_CHANNEL
    default: "stable"
    documentation: |-
      Operator channel to mirror. Must match the channel used to
      subscribe to the operator.
  - name: EXTRA_IMAGES_TO_MIRROR
    default: "ghcr.io/nginxinc/nginx-unprivileged:alpine"
    documentation: |-
      Comma-separated list of extra container images to mirror
      to the local registry for use in disconnected tests.
  - name: ENABLE_MUST_GATHER
    default: "false"
    documentation: Whether to mirror the OSC must-gather image for collection.
  - name: MUST_GATHER_IMAGE
    default: "quay.io/redhat-user-workloads/ose-osc-tenant/osc-must-gather:latest"
    documentation: OSC must-gather image to mirror. The default latest is resolved to a version-epoch tag.
  credentials:
  - collection: openshift-qe
    group: mirror-registry
    mount_path: /var/run/vault/mirror-registry
  documentation: |-
    Mirror operator images from the official Red Hat operator catalog
    to the local mirror registry and configure IDMS for transparent
    redirect. This allows the default redhat-operators CatalogSource
    to work in disconnected clusters.
