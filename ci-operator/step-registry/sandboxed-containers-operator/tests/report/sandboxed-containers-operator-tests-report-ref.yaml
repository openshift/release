ref:
  as: sandboxed-containers-operator-tests-report
  from: cli
  cli: latest
  commands: sandboxed-containers-operator-tests-report-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Terminal gate for the sandboxed-containers-operator test chain.
    Reads per-step PASS/FAIL/SKIP markers from ${SHARED_DIR}/osc-test-status/
    and exits non-zero if any test step recorded FAIL. This is the only
    non-best_effort step in the chain, so the overall job reports failure when
    any test step fails, without preventing earlier best_effort steps from
    running.
