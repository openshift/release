chain:
  as: sandboxed-containers-operator-tests
  steps:
  - chain: sandboxed-containers-operator-tests-openshift-extended
    best_effort: true
  - ref: sandboxed-containers-operator-tests-e2e-poc
    best_effort: true
  - ref: sandboxed-containers-operator-tests-upstream-kata-bats
    best_effort: true
  documentation: |-
    Test chain for sandboxed-containers-operator e2e.
    All three steps always attempt regardless of earlier failures.
    Individual steps are skipped when their enable var is "false":
    TEST_OPENSHIFT_EXTENDED_ENABLE, TEST_E2E_POC_ENABLE,
    TEST_UPSTREAM_KATA_BATS_ENABLE.
