chain:
  as: sandboxed-containers-operator-tests-openshift-extended
  steps:
  - ref: sandboxed-containers-operator-tests-openshift-extended-gate
  - ref: openshift-extended-test
  documentation: |-
    Conditionally runs openshift-extended-test for sandboxed-containers-operator.
    The gate step checks TEST_OPENSHIFT_EXTENDED_ENABLE; if "false", it exits
    non-zero to skip the test. The parent chain must use best_effort: true so
    that skipping this chain does not prevent other test chains from running.
