ref:
  as: sandboxed-containers-operator-tests-openshift-extended-gate
  from: cli
  cli: latest
  commands: sandboxed-containers-operator-tests-openshift-extended-gate-commands.sh
  env:
  - name: TEST_OPENSHIFT_EXTENDED_ENABLE
    default: ""
    documentation: |-
      Set to "false" to skip the openshift-extended-test step.
      Any other value or unset means the step runs.
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Gate check for openshift-extended-test. Exits non-zero when
    TEST_OPENSHIFT_EXTENDED_ENABLE is "false" to prevent the chain
    from proceeding to the actual test step.
