ref:
  as: sandboxed-containers-operator-update-kata-rpm
  from: upi-installer
  commands: sandboxed-containers-operator-update-kata-rpm-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: INSTALL_KATA_RPM
    default: 'false'
  - name: KATA_RPM_BUILD_TASK
    default: ''
  - name: KATA_RPM_VERSION
    default: '3.13.0-3.rhaos4.18.el9'
    documentation: |-
      kata-containers version to be downloaded from brew/koji
      and pushed to all worker nodes; eg: 3.13.0-1.rhaos4.18.el9
  documentation: |-
    When INSTALL_KATA_RPM is true it downloads kata-containers.rpm
    specified by KATA_RPM_BUILD_TASK or KATA_RPM_VERSION from Brew,
    copies it to each worker node and installs it. If the target
    version is already installed on a node it is skipped. After
    installation CRI-O is restarted on the updated nodes.
