ref:
  as: sandboxed-containers-operator-install-osc-operator
  from_image:
    name: rhdh-e2e-runner
    namespace: ci
    tag: main
  timeout: 2h0m0s
  grace_period: 10m
  commands: sandboxed-containers-operator-install-osc-operator-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 2000Mi
  env:
  - name: OSC_INSTALL
    default: "false"
    documentation: |-
      Whether to install the OSC operator. Set to "true" to enable installation.
      If not true, the step is skipped and no further actions are taken.
  - name: OSC_CHARTS_REPO
    default: "https://github.com/confidential-devhub/charts.git"
    documentation: |-
      The git repository URL for OSC Helm charts.
  - name: OSC_CHARTS_REF
    default: "main"
    documentation: |-
      The git ref (branch/tag/commit) to use from the charts repository.
  - name: CATALOG_SOURCE_NAME
    default: "redhat-operators"
    documentation: |-
      The catalog source to use for OSC operator installation.
      When set to "redhat-operators" (default), the GA catalog is used and the helm
      chart dev catalog (osc-operator-dev-catalog) is suppressed and deleted if created.
      Set to "brew-catalog" (with CATALOG_SOURCE_IMAGE) for Pre-GA dev builds.
  - name: CATALOG_SOURCE_IMAGE
    default: ""
    documentation: |-
      The container image for a custom OSC operator CatalogSource.
      Only used when CATALOG_SOURCE_NAME is not "redhat-operators".
      If set, the helm chart creates "osc-operator-dev-catalog" with this image.
      If empty and CATALOG_SOURCE_NAME is "redhat-operators", no dev catalog is created.
  - name: ENABLEPEERPODS
    default: "false"
    documentation: |-
      When "true", enables peer-pods in KataConfig and creates peer-pods-cm
      ConfigMap with cloud provider configuration. Reads cloud parameters from
      peerpods-param-cm in the default namespace (created by the peerpods-param-cm step).
  - name: WORKLOAD_TO_TEST
    default: "kata"
    documentation: |-
      Selects the workload type to configure. Supported values: "kata", "peer-pods", "coco".
      When "coco", sets confidential mode in feature gates.
  - name: OSC_NAMESPACE
    default: "openshift-sandboxed-containers-operator"
    documentation: |-
      The namespace where the OSC operator will be installed.
  - name: RUST_RUNTIME
    default: "false"
    documentation: |-
      "true" to use the Rust runtime, "false" to use the Go runtime
  documentation: |-
    If OSC_INSTALL=true, installs the OSC operator and configures the cluster for
    the target workload (kata, peer-pods, or coco) using Helm charts from OSC_CHARTS_REPO.
    If OSC_INSTALL=false, the step is skipped and no further actions are taken.

    Charts are cloned from OSC_CHARTS_REPO. Phase 1 installs the operator (namespace,
    operatorgroup, subscription, optional dev catalog). Phase 2 installs operands
    (KataConfig, feature gates, peer-pods-cm) and waits for KataConfig readiness.

    For peer-pods and coco workloads, reads cloud config from peerpods-param-cm and
    creates peer-pods-secret in the operator namespace. For coco, enables confidential
    mode in osc-feature-gates.

    When complete, patches osc-config ConfigMap so tests can detect the pre-installed operator.

    The 2h timeout covers KataConfig readiness (typically ~1h for node reboots)
    plus operator install waits. Observed test phase times: kata ~34min avg,
    peerpods ~97min avg (includes podvm image creation), coco ~44min avg.
    Worst-case peerpods runs reach ~2h.
