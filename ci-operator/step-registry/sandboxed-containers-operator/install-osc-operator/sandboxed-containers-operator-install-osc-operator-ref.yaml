ref:
  as: sandboxed-containers-operator-install-osc-operator
  from_image:
    name: rhdh-e2e-runner
    namespace: ci
    tag: main
  timeout: 2h0m0s
  grace_period: 10m
  commands: sandboxed-containers-operator-install-osc-operator-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 2000Mi
  env:
  - name: OSC_INSTALL
    default: "false"
    documentation: |-
      Whether to install the OSC operator. Set to "true" to enable installation.
      If not true, the step is skipped and no further actions are taken.
  - name: OSC_CHARTS_REPO
    default: "https://github.com/confidential-devhub/charts.git"
    documentation: |-
      The git repository URL for OSC Helm charts.
  - name: OSC_CHARTS_REF
    default: "main"
    documentation: |-
      The git ref (branch/tag/commit) to use from the charts repository.
  - name: CATALOG_SOURCE_IMAGE
    default: ""
    documentation: |-
      The container image for a custom OSC operator CatalogSource.
      This is the sole trigger for dev catalog creation.
      If empty (default), uses existing "redhat-operators" catalog.
      If set, the helm chart creates "osc-operator-dev-catalog" with this image.
  - name: AZURE_IMAGE_ID
    default: ""
    documentation: |-
      Azure resource ID of the podvm image for peer-pods. Required for Azure
      peer-pods workloads. Example:
      /subscriptions/<sub>/resourceGroups/<rg>/providers/Microsoft.Compute/galleries/<gallery>/images/<image>/versions/<version>
  - name: PODVM_AMI_ID
    default: ""
    documentation: |-
      AWS AMI ID of the podvm image for peer-pods. Required for AWS peer-pods
      workloads once an image has been built. Leave empty before image creation.
  - name: AZURE_INSTANCE_SIZES
    default: "Standard_B2als_v2,Standard_B2as_v2,Standard_D2as_v5,Standard_B4als_v2,Standard_D4as_v5,Standard_D8as_v5"
    documentation: |-
      Comma-separated list of Azure VM sizes allowed for podvm instances.
  - name: PODVM_INSTANCE_TYPES
    default: "t3.small,t3.medium,t3.large,t3.xlarge,t3.2xlarge,g4dn.2xlarge,g5.2xlarge,p3.2xlarge"
    documentation: |-
      Comma-separated list of AWS EC2 instance types allowed for podvm instances.
  - name: PEERPODS_LIMIT_PER_NODE
    default: "10"
    documentation: |-
      Maximum number of peer-pods VMs per worker node.
  - name: TAGS
    default: ""
    documentation: |-
      Comma-separated key=value tags to apply to cloud resources created for peer-pods.
      Example: "env=ci,team=osc"
  - name: PODVM_IMAGE_URI
    default: ""
    documentation: |-
      OCI image URI for the podvm image. Used for image-building workflows.
      Overrides the helm chart default (which is GCP-specific) to empty for
      Azure and AWS.
  - name: ENABLEPEERPODS
    default: "false"
    documentation: |-
      When "true", enables peer-pods in KataConfig and creates peer-pods-cm
      ConfigMap with cloud provider configuration. Cloud parameters (region,
      subnet, NSG) are auto-detected from cluster infrastructure via az CLI.
      AZURE_IMAGE_ID / PODVM_AMI_ID must be set explicitly in the job config.
  - name: WORKLOAD_TO_TEST
    default: "kata"
    documentation: |-
      Selects the workload type to configure. Supported values: "kata", "peer-pods", "coco".
      When "coco", sets confidential mode in feature gates.
  - name: OSC_NAMESPACE
    default: "openshift-sandboxed-containers-operator"
    documentation: |-
      The namespace where the OSC operator will be installed.
  documentation: |-
    If OSC_INSTALL=true, installs the OSC operator and configures the cluster for
    the target workload (kata, peer-pods, or coco) using Helm charts from OSC_CHARTS_REPO.
    If OSC_INSTALL=false, the step is skipped and no further actions are taken.

    Charts are cloned from OSC_CHARTS_REPO. Phase 1 installs the operator (namespace,
    operatorgroup, subscription, optional dev catalog). Phase 2 installs operands
    (KataConfig, feature gates, peer-pods-cm) and waits for KataConfig readiness.

    For peer-pods and coco workloads, cloud parameters are auto-detected from cluster
     infrastructure and passed to helm, which creates peer-pods-cm ConfigMap in the
     OSC namespace. For coco, enables confidential mode in osc-feature-gates.

    When complete, patches osc-config ConfigMap so tests can detect the pre-installed operator.

    The 2h timeout covers KataConfig readiness (typically ~1h for node reboots)
    plus operator install waits. Observed test phase times: kata ~34min avg,
    peerpods ~97min avg (includes podvm image creation), coco ~44min avg.
    Worst-case peerpods runs reach ~2h.
