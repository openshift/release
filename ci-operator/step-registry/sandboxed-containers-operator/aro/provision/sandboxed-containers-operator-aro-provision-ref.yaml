ref:
  as: sandboxed-containers-operator-aro-provision
  from_image:
    namespace: ocp
    name: "4.17"
    tag: upi-installer
  commands: sandboxed-containers-operator-aro-provision-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: ARO_WORKER_COUNT
    default: ""
    documentation: Number of workers to create when installing cluster
  - name: ARO_WORKER_VM_SIZE
    default: ""
    documentation: VM size to use for worker node e.g. Standard_D8s_v3
  - name: ARO_CLUSTER_VERSION
    default: ""
    documentation: |-
      Select the version of OpenShift to use for the ARO cluster.
      Use base version (e.g. "4.21") to automatically select latest patch version, or full version (e.g. "4.21.22") for exact version.
      Version must be available in the target region. See: az aro get-versions -l $REGION
  - name: ARO_BYO_NSG
    default: "false"
    documentation: "ARO cluster will use an existing network security group. The NSG must exist and be attached to the subnets before creating cluster. Allowed values: false, true."
  grace_period: 10m0s
  timeout: 2h0m0s
  documentation: |-
    Provision an ARO cluster with a dedicated Azure AD application.

    This step creates a new Azure AD application and service principal specifically
    for the ARO cluster to avoid the InvalidServicePrincipalCredentials error that
    occurs when reusing a service principal with Application.ReadWrite.OwnedBy permission.

    The application ID is recorded in ${SHARED_DIR}/aro-cluster-app-id for cleanup.
