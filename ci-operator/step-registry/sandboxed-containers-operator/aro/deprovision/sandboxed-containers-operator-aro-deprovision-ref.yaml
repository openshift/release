ref:
  as: sandboxed-containers-operator-aro-deprovision
  from_image:
    namespace: ocp
    name: "4.17"
    tag: upi-installer
  commands: sandboxed-containers-operator-aro-deprovision-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  best_effort: true
  grace_period: 10m0s
  timeout: 10m0s
  documentation: |-
    Delete the Azure AD application created for the ARO cluster.

    az aro delete does not delete the application that was created for the cluster,
    so this step cleans it up to avoid leaving orphaned applications in the tenant.
