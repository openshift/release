ref:
  as: acm-disconnected-dns-diag
  from: cli
  commands: acm-disconnected-dns-diag-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Captures CoreDNS state and tests API server DNS resolution.
    Use before steps that fail with DNS errors to diagnose
    whether CoreDNS pods are restarting or degraded after
    MCP rollout in disconnected environments.
