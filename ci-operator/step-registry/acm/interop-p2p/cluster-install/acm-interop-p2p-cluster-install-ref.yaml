ref:
  as: acm-interop-p2p-cluster-install
  from: cli
  commands: acm-interop-p2p-cluster-install-commands.sh
  timeout: 11h0m0s
  grace_period: 30m0s
  resources:
    requests:
      cpu: '1'
      memory: 500Mi
  env:
  - name: ACM_SPOKE_ARCH_TYPE
    default: "amd64"
    documentation: |-
      CPU architecture for control plane and worker nodes (amd64, arm64).
  - name: BASE_DOMAIN
    default: "cspilp.interop.ccitredhat.com"
    documentation: |-
      Base DNS domain for the spoke cluster (e.g. example.com).
  - name: ACM_SPOKE_WORKER_REPLICAS
    default: "3"
    documentation: |-
      Number of worker nodes per spoke cluster.
  - name: ACM_SPOKE_CP_REPLICAS
    default: "3"
    documentation: |-
      Number of control plane nodes per spoke cluster.
  - name: ACM_SPOKE_CLUSTER_NAME_PREFIX
    default: "acm-spoke"
    documentation: |-
      Prefix for generated spoke cluster names.
      Final name format: {prefix}-{hash}-{index} (e.g. acm-spoke-a1b2c-1).
  - name: ACM_SPOKE_WORKER_TYPE
    default: "c5n.metal"
    documentation: |-
      AWS EC2 instance type for worker nodes.
  - name: ACM_SPOKE_CP_TYPE
    default: "m6a.2xlarge"
    documentation: |-
      AWS EC2 instance type for control plane nodes.
  - name: ACM_SPOKE_NETWORK_TYPE
    default: "OVNKubernetes"
    documentation: |-
      OCP network plugin: OVNKubernetes or OpenShiftSDN.
  - name: ACM_SPOKE_INSTALL_TIMEOUT_MINUTES
    default: "450"
    documentation: |-
      Minutes to wait per cluster for ClusterDeployment.Provisioned=True.
      Hive runs every install attempt inside this one wait. The previous
      single-attempt ceiling was 150 minutes; the default is 3 × 150 so three
      attempts can each use that ceiling. All ClusterDeployments are submitted
      before waiting begins, so clusters provision in parallel. The effective
      wall-clock wait is approximately max(cluster_install_times) rather than
      their sum.
  - name: ACM_SPOKE_INSTALL_ATTEMPTS_LIMIT
    default: "3"
    documentation: |-
      Hive ClusterDeployment.spec.installAttemptsLimit: the maximum number of
      install attempts. A limit of 3 permits three total attempts (one initial
      attempt and two retries). Hive sets ProvisionStopped=True
      (InstallAttemptsLimitReached) once the limit is reached. Default 3 matches
      Hive's default and allows transient AWS failures (e.g. LoadBalancerLimitExceeded)
      to self-heal. Set to 1 only when fail-fast after a single attempt is desired.
  - name: ACM_SPOKE_CLUSTER_INITIAL_VERSION
    default: ""
    documentation: |-
      Target OCP minor version for the spoke ClusterImageSet (e.g. "4.21").
      The step selects the latest available ClusterImageSet whose name starts
      with "img{version}." — must be non-empty.
  - name: ACM_SPOKE_CLUSTER_COUNT
    default: "1"
    documentation: |-
      Number of spoke clusters to provision (1–3; values greater than 3 are
      rejected). Each cluster receives a unique name, namespace, and set of
      non-overlapping CIDRs.
      Output files per cluster (N is 1-based index):
        SHARED_DIR/managed-cluster-name-{N}          - cluster name
        SHARED_DIR/managed-cluster-kubeconfig-{N}    - admin kubeconfig
        SHARED_DIR/managed-cluster-metadata-{N}.json - Hive metadata
      Batch files:
        SHARED_DIR/managed-cluster-names   - one name per line
        SHARED_DIR/managed-cluster-regions - one region per line
  - name: OPENSHIFT_INSTALL_EXPERIMENTAL_DISABLE_IMAGE_POLICY
    default: ""
    documentation: |-
      When set to "true", patches each spoke's ClusterVersion to mark the
      'openshift' ClusterImagePolicy as unmanaged after provisioning.
      Required for nightly builds which are not Sigstore-signed. Set at
      the job level for jobs that upgrade spokes to nightly images.
      See OCPBUGS-114622.
  - name: ACM_SPOKE_PULL_SECRET_FILE
    default: "config.json"
    documentation: |-
      Filename (relative to CLUSTER_PROFILE_DIR) to use as the Hive pull secret for
      spoke cluster bootstrap machines. Defaults to "config.json" (base OpenShift
      pull secret). Set to "pull-secret" when the spoke ClusterImageSet points to an
      image in the CI build namespace registry (registry.build*.ci.openshift.org),
      because the "pull-secret" file includes CI-augmented credentials that allow the
      spoke bootstrap EC2 machines to pull images from that registry over the internet.
      Using "config.json" for a CI build-namespace image results in auth failures on
      bootstrap EC2 machines (the image is publicly reachable but requires CI credentials)
      causing bootkube to time out.
  - name: ACM_MANAGED_CLUSTER_AVAILABLE_TIMEOUT_MINUTES
    default: "30"
    documentation: |-
      Max minutes to wait for each ManagedCluster to reach Available=True
      after Hive provisioning completes. Typically 1-5 minutes on AWS.
  documentation: |-
    Provisions one or more ACM spoke clusters using Hive ClusterDeployment.

    Execution phases:
      1. Create resources  — namespace, secrets, ClusterDeployment, ManagedCluster,
                             KlusterletAddonConfig for every spoke cluster.
      2. Wait for Hive     — polls ClusterDeployment.status.conditions for
                             Provisioned=True; fast-fails on ProvisionStopped=True.
      3. Extract creds     — decodes admin kubeconfig and metadata from Hive secrets
                             and writes them to SHARED_DIR.

    Networking: each spoke is assigned non-overlapping pod/VPC/service CIDRs
    derived from its 1-based index so multi-spoke Submariner setups do not conflict
    with the hub or with each other.

    Spokes install in parallel. The step timeout (11h) covers one 450m
    provisioning budget for the slowest spoke, and every install attempt for
    that spoke shares it. It also covers credential extraction, up to 30m per
    spoke for ManagedCluster Available, and, when image-policy cleanup runs,
    up to 25m per spoke for MachineConfigPool rollout. Phase 2 waits run at
    the same time, so provisioning time is the slowest spoke, not the sum.
    The extra time lets the script hit its own timeout and write diagnostics
    before CI kills the step.

    Env vars consumed:
      ACM_SPOKE_ARCH_TYPE               - node architecture (default: amd64)
      BASE_DOMAIN                       - cluster base domain
      ACM_SPOKE_WORKER_TYPE             - worker EC2 instance type
      ACM_SPOKE_CP_TYPE                 - control-plane EC2 instance type
      ACM_SPOKE_WORKER_REPLICAS         - worker node count (default: 3)
      ACM_SPOKE_CP_REPLICAS             - control-plane node count (default: 3)
      ACM_SPOKE_CLUSTER_NAME_PREFIX     - spoke name prefix (default: acm-spoke)
      ACM_SPOKE_NETWORK_TYPE            - OCP network plugin (default: OVNKubernetes)
      ACM_SPOKE_INSTALL_TIMEOUT_MINUTES - per-cluster provisioning timeout for all install attempts (default: 450)
      ACM_SPOKE_INSTALL_ATTEMPTS_LIMIT  - maximum Hive install attempts (default: 3; one initial attempt and two retries)
      ACM_SPOKE_CLUSTER_INITIAL_VERSION - OCP minor version for ClusterImageSet
      ACM_SPOKE_CLUSTER_COUNT           - number of spoke clusters (default: 1, max: 3)
      OPENSHIFT_INSTALL_EXPERIMENTAL_DISABLE_IMAGE_POLICY - when true, spoke uses hub
                                    payload ClusterImageSet and ClusterImagePolicy unmanaged
      MANAGED_CLUSTER_LEASED_RESOURCE   - space-separated AWS regions (one per cluster)
      SHARED_DIR                        - cross-step shared directory
      CLUSTER_PROFILE_DIR               - cluster profile with AWS creds and SSH keys
