ref:
  as: acm-interop-p2p-submariner-snat-fix
  from: cli
  commands: acm-interop-p2p-submariner-snat-fix-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 250Mi
  timeout: 40m0s
  grace_period: 5m0s
  env:
    - name: ACM_SPOKE_CLUSTER_COUNT
      default: "2"
      documentation: |-
        Number of ACM spoke clusters to apply the SNAT workaround to.
    - name: SUBMARINER_SNAT_FIX_SETTLE_SECS
      default: "60"
      documentation: |-
        Seconds to wait after routeagent rollout completes for its nftables
        exemption rules to propagate across all nodes. 30s was insufficient on
        OCP 4.22 nightly; raised to 60s as baseline.
  documentation: |-
    Applies the official Submariner SNAT workaround for OVN-Kubernetes IC mode
    to every spoke cluster (ACM-22805, ACM-24786, ACM-36927).

    Ref: https://docs.redhat.com/en/documentation/red_hat_advanced_cluster_management_for_kubernetes/2.13/html/release_notes/acm-release-notes#source-ip-ocp-ovnk

    Root cause: OVN-K's nftables mgmtport-snat chain rewrites the source IP of
    cross-cluster traffic, breaking return routing. Submariner's route agent is
    not managing SNAT by default, so OVN-K's rules corrupt the return path.

    What this step does (idempotent, safe to re-run):
      1. Creates submariner-global ConfigMap (enable-snat-handler=true) in
         submariner-operator namespace on each spoke. This tells Submariner's
         route agent to install nftables rules that exempt cross-cluster traffic
         from OVN-K SNAT.
      2. Deletes all submariner-routeagent pods (--wait=false). Route-agent only
         reads the ConfigMap at startup; the rolling restart picks it up.
      3. Waits up to 5m for routeagent rollout (non-fatal timeout; job continues).
      4. Sleeps SUBMARINER_SNAT_FIX_SETTLE_SECS (default 60) for nftables rules
         to propagate across all nodes.

    NOTE: ovnkube-node is intentionally NOT restarted. The official ACM docs
    only require route-agent restart. Restarting ovnkube-node re-programs all
    OVN flows after routeagent and can overwrite the nftables exemption on
    OCP 4.22+, negating the fix.

    Must run after acm-interop-p2p-submariner-broker-join and before
    acm-interop-p2p-submariner-verify.

    Applies to: ACM 2.13+ with OVN-Kubernetes network plugin.

    Env vars consumed:
      ACM_SPOKE_CLUSTER_COUNT          - number of spoke clusters (default: 2)
      SUBMARINER_SNAT_FIX_SETTLE_SECS  - nftables propagation settle time (default: 60)
      SHARED_DIR                       - shared artifact directory
