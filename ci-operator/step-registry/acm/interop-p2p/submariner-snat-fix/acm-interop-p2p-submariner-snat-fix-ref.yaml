ref:
  as: acm-interop-p2p-submariner-snat-fix
  from: cli
  commands: acm-interop-p2p-submariner-snat-fix-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 250Mi
  timeout: 45m0s
  grace_period: 5m0s
  env:
    - name: ACM_SPOKE_CLUSTER_COUNT
      default: "2"
      documentation: |-
        Number of ACM spoke clusters to apply fixes to.
    - name: SUBMARINER_SNAT_FIX_SETTLE_SECS
      default: "10"
      documentation: |-
        Seconds to wait after fixes are applied before the next step runs subctl verify
        or starts migration. nftables and OVN LRP changes take effect immediately;
        this pause exists to let OVN southbound DB propagate LRP flows to all chassis.
  documentation: |-
    Applies four workarounds for Submariner v0.24 compatibility gaps with OVN-K
    IC per-node-zone mode on OCP 4.22+ (ACM-22805, CORENET-7418, OCPSTRAT-940).

    Background: OCP 4.22 OVN-K IC mode assigns each node its own OVN zone with a
    dedicated ovn_cluster_router. Submariner routeagent (v0.24) was written against
    older OVN APIs and an older OVN-K network model, leaving four gaps:

    Fix 1 — LRP nexthop schema mismatch (root cause for broken routing):
      routeagent v0.24 creates OVN Logical Router Policies using the singular field
      name "nexthop"; OVN 6.x (OCP 4.22) only recognises the plural "nexthops".
      LRPs exist in the northbound DB but have empty nexthops; OVN generates no
      southbound flows. Cross-cluster pod traffic falls through to the Gateway Router,
      is SNAT'd by OVN's own masquerade, and dropped.
      Fix: for every ovnkube-node pod (one per zone), delete each Submariner LRP and
      re-add it with ovn-nbctl lr-policy-add (which uses the correct "nexthops" schema).
      Nexthop is determined at runtime: gateway zones use the node's ovn-k8s-mp0 IP;
      worker zones use the transit switch IP from "ip route show table 150" (installed
      by routeagent via kernel routes, independently of the OVN LRP schema).
      Caveat: routeagent reconciliation on Endpoint CR change will re-create broken LRPs.
      In CI clusters with no endpoint churn this fix persists through the test window.

    Fix 2 — Table 149 hairpin on gateway nodes:
      routeagent installs "default via <nexthop> dev ovn-k8s-mp0" in routing table 149.
      ip rule 149 fires before rule 150 (Submariner's xfrm/IPsec rule), routing all
      outbound cross-cluster traffic back into OVN via ovn-k8s-mp0 in a loop.
      xfrm never sees the packet; the IPsec SA outbound counter stays flat.
      Fix: ip route del default table 149 dev ovn-k8s-mp0 on each gateway node.

    Fix 3 — Two independent nftables SNAT chains (CORENET-7418, OCPSTRAT-940):
      The OCP 4.22 iptables→nftables migration (June-July 2026) introduced two
      independent POSTROUTING basechains in the "inet ovn-kubernetes" table:
        mgmtport-snat (priority 100): masquerades all ovn-k8s-mp0 egress.
        ovn-kube-local-gw-masq (priority 101): masquerades all pod-subnet egress.
      A "return" in chain 1 does NOT stop chain 2 — they are separate netfilter hooks.
      This breaks TCP on two paths: outbound (src IP rewritten before xfrm) and inbound
      (decrypted SYN from remote re-SNAT'd when injected into OVN via ovn-k8s-mp0 on
      the receiving gateway, causing the reply to never be encrypted back).
      Fix: prepend "ip daddr <remote-cidr> return" in both chains on every node.
      Submariner's enable-snat-handler only cleans up legacy iptables chains and has
      no awareness of these nftables chains; upstream fix: ovn-kubernetes PR #6030.

    Fix 4 — mgmtport-no-snat-subnets-v4 set empty (belt-and-suspenders for Fix 3):
      OVN-K provides "ip saddr @mgmtport-no-snat-subnets-v4 return" in mgmtport-snat
      as an exemption hook, but never populates the set from the Submariner node
      annotation. Fix: add remote CIDRs to the set on gateway nodes.

    CRITICAL implementation note:
      All nftables/ovn-nbctl/ip commands run via "oc exec -c ovnkube-controller".
      This container has CAP_NET_ADMIN and runs in the host network namespace.
      "oc debug node -- chroot /host nft" silently returns exit 0 while failing with
      "Operation not permitted" internally — every prior CI run applied zero rules.

    routeagent is NOT restarted: restarting re-publishes Endpoint CRs, which triggers
    NAT discovery re-initiation (UDP/4800) on remote gateways. In multi-VPC AWS
    environments this can break the IPsec tunnel for an extended period.

    Must run after acm-interop-p2p-submariner-broker-join and before
    acm-interop-p2p-submariner-verify.

    Timing: ~2-3 seconds per node × ~9 nodes × 2 spokes ≈ 3-5 minutes total.
    Using oc exec (vs former oc debug) eliminates ~45s pod-creation overhead per node.
    Timeout set to 45 minutes.

    Applies to: ACM 2.13+ with OVN-K IC per-node-zone on OCP 4.21+.

    Env vars consumed:
      ACM_SPOKE_CLUSTER_COUNT          - number of spoke clusters (default: 2)
      SUBMARINER_SNAT_FIX_SETTLE_SECS  - post-fix settle time in seconds (default: 10)
      SHARED_DIR                       - shared artifact directory
