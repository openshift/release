ref:
  as: acm-interop-p2p-submariner-snat-fix
  from: cli
  commands: acm-interop-p2p-submariner-snat-fix-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 250Mi
  timeout: 40m0s
  grace_period: 5m0s
  env:
    - name: ACM_SPOKE_CLUSTER_COUNT
      default: "2"
      documentation: |-
        Number of ACM spoke clusters to apply the SNAT workaround to.
    - name: SUBMARINER_SNAT_FIX_SETTLE_SECS
      default: "10"
      documentation: |-
        Seconds to wait after nftables injection for rules to take effect before
        the next step runs subctl verify or starts migration. Kept short because
        no pod restarts are involved; nft changes take effect immediately.
  documentation: |-
    Fixes the OVN-Kubernetes mgmtport-snat SNAT issue that breaks Submariner
    cross-cluster connectivity on OCP 4.22 nightly (ACM-22805, ACM-24786,
    ACM-36927).

    Root cause: OVN-K's nftables mgmtport-snat chain rewrites the source IP of
    cross-cluster traffic arriving at a spoke's gateway node.  The routeagent
    sets k8s.ovn.org/node-ingress-snat-exclude-subnets on the gateway Node but
    OVN-K on OCP 4.22 nightly does NOT reconcile that annotation into the
    mgmtport-no-snat-subnets-v4 nftables set, leaving it empty.

    What this step does (idempotent, safe to re-run):
      1. For each spoke, discovers the OTHER spokes' pod+service CIDRs by
         reading Submariner Endpoint CRs from the local submariner-operator
         namespace.
      2. Uses "oc debug node" to directly inject those CIDRs into the
         mgmtport-no-snat-subnets-v4 nftables set (family: inet, table:
         ovn-kubernetes) on every gateway node of that spoke.
      3. Sleeps SUBMARINER_SNAT_FIX_SETTLE_SECS (default 10) for the rules
         to take effect.

    NOTE: The ConfigMap (enable-snat-handler) + routeagent-restart approach
    is intentionally NOT used. Restarting submariner-routeagent re-publishes
    Endpoint CRs on the broker; remote gateways detect the change and restart
    NAT discovery (UDP/4800), which can break the IPsec tunnel for an extended
    period in multi-VPC AWS environments. Direct nftables injection avoids
    touching the Submariner control plane entirely.

    Must run after acm-interop-p2p-submariner-broker-join and before
    acm-interop-p2p-submariner-verify.

    Applies to: ACM 2.13+ with OVN-Kubernetes network plugin on OCP 4.18+.

    Env vars consumed:
      ACM_SPOKE_CLUSTER_COUNT          - number of spoke clusters (default: 2)
      SUBMARINER_SNAT_FIX_SETTLE_SECS  - post-injection settle time (default: 10)
      SHARED_DIR                       - shared artifact directory
