chain:
  as: acm-interop-p2p-submariner-install
  steps:
    - ref: acm-interop-p2p-submariner-cloud-prepare
    - ref: acm-interop-p2p-submariner-broker-join
    - ref: acm-interop-p2p-submariner-verify
  documentation: |-
    Installs and verifies Submariner for a 1-hub + N-spoke cluster topology
    without Globalnet (non-overlapping pod CIDRs per spoke) using subctl.
    The ACM hub is enrolled as a full Submariner participant alongside spokes,
    enabling hub↔spoke pod-IP routing required for KubeVirt CCLM sync.

    This chain sequences three steps:

      1. acm-interop-p2p-submariner-cloud-prepare
         Installs subctl locally, prepares AWS security groups on the HUB AND
         each spoke using 'subctl cloud prepare aws' with dedicated gateway nodes
         (--gateways 1) and opens required IPsec/NAT-T firewall ports.
         Hub metadata is read from ${SHARED_DIR}/metadata.json (IPI artifact).
         Waits for hub and spoke gateway-labeled nodes before proceeding.

      2. acm-interop-p2p-submariner-broker-join
         Deploys the Submariner broker on the hub cluster (no --globalnet),
         joins the HUB itself with 'subctl join --globalnet=false', then joins
         each spoke. If a previous Globalnet deployment is detected, uninstalls
         and redeploys. After all joins, waits on HUB + each spoke for:
           - submariner-operator Deployment Available
           - submariner-gateway DaemonSet rollout
           - submariner-routeagent DaemonSet rollout (all-nodes routing)
           - submariner-lighthouse-agent Deployment rollout
           - submariner-lighthouse-coredns Deployment rollout
         Hub CoreDNS Lighthouse stub zone is also waited and verified.

      3. acm-interop-p2p-submariner-verify
         Waits for IPsec tunnels to reach connected state on hub AND spokes,
         asserts no Globalnet subnets (242.x) on all clusters including hub,
         pre-warms Lighthouse service discovery between spoke pairs,
         optionally runs subctl verify (SUBMARINER_RUN_SUBCTL_VERIFY=true), and
         probes bidirectional CCLM sync TCP paths when
         SUBMARINER_VERIFY_HUB_SPOKE=true (hub↔spoke pairs).

    Requires acm-interop-p2p-cluster-install ResolveSpokeCidrs so each spoke
    has unique pod/machine/service CIDRs — required for KubeVirt CCLM sync on
    raw pod IPs (port 8443).

    broker-info.subm is written to /tmp (never to SHARED_DIR) and removed
    via a trap on EXIT after all 'subctl join' calls complete.
