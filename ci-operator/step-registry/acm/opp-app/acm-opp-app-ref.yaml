ref:
  as: acm-opp-app
  from: cli-with-git
  commands: acm-opp-app-commands.sh
  timeout: 1h0m0s
  grace_period: 5m0s
  best_effort: true
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: LP_QE__CR__TS_NAME__PFX__ACM
    default: ""
    documentation: |-
      Component Readiness test-suite name prefix for junit
      remapping. Set by the job config to match ci-test-mapping.
  - name: MAP_TESTS
    default: "false"
    documentation: When true, remap junit test suite names for Component Readiness routing
  - name: QUAY_EXPECTATION
    default: ""
    documentation: |-
      When set to "required", an all-skipped test report (Quay not
      available) fails the step instead of exiting green.
      Independently of this setting, a preflight that marks test cases
      failed (QuayIntegration query error, or the CRD present with the
      CR missing) fails the step on every lane.
  documentation: |-
    Deploys an application that influences and/or uses all components of the OPP bundle.
