ref:
  as: acm-tests-clc-smoke
  from: clc-ui-e2e
  commands: acm-tests-clc-smoke-commands.sh
  timeout: 7200s
  resources:
    requests:
      cpu: '2'
      memory: 6Gi
  credentials:
    - namespace: test-credentials
      name: opp-acm-clc-credentials
      mount_path: /tmp/secrets/clc-interop
    - namespace: test-credentials
      name: acm-clc-credentials
      mount_path: /tmp/secrets/clc
    - namespace: test-credentials
      name: acm-ci-credentials
      mount_path: /tmp/secrets/ci
  env:
  - name: CYPRESS_OC_IDP
    default: "kube:admin"
    documentation: |-
      Identity
  - name: CYPRESS_OPTIONS_HUB_USER
    default: "kubeadmin"
    documentation: |-
      Hub cluster username
  - name: CYPRESS_SPOKE_CLUSTER
    default: ""
    documentation: |-
      Identify spoke clusters
  - name: BROWSER
    default: "chrome"
    documentation: |-
      Set browser for cypress
  - name: CUSTOMER_TAGS
    default: "@smoke"
    documentation: |-
      Freestyle tags for cypress (smoke scope for OPP interop)
  - name: CYPRESS_CLC_OC_IDP
    default: "clc-e2e-htpasswd"
    documentation: |-
      Serves tests RBAC settings
  - name: CYPRESS_CLC_RBAC_PASS
    default: "test-RBAC-4-e2e"
    documentation: |-
      Serves tests RBAC settings
  - name: CYPRESS_CLC_OCP_IMAGE_REGISTRY
    default: "quay.io/openshift-release-dev/ocp-release"
    documentation: |-
      Image registry
  - name: CYPRESS_ACM_NAMESPACE
    default: "ocm"
    documentation: |-
      Acm namespace
  - name: CYPRESS_MCE_NAMESPACE
    default: "multicluster-engine"
    documentation: |-
      Mce namespace
  - name: IMPORT_KUBERNETES_CLUSTERS
    default: ""
    documentation: |-
      Comma separated list of imports
  documentation: |-
    Executes ACM cluster lifecycle smoke tests (creates 1 managed cluster for OPP interop validation). Reduced scope version of acm-tests-clc-create with ~2h timeout vs ~8h. Uses CUSTOMER_TAGS="@smoke" to limit test execution. Please inform ACM CLC team (David Huynh, Almen Ng) prior to use.
