chain:
  as: acm-tests-alc-opp
  steps:
  - ref: acm-tests-alc
  env:
  - name: DR__RP__CR_COMP_NAME
    default: lp-interop--OPP--ACM
  - name: MAP_TESTS
    default: "true"
  documentation: |-
    Wrapper chain that sets DR__RP__CR_COMP_NAME=lp-interop--OPP--ACM for the OPP job family,
    routing ALC tests to the OPP > ACM capability on the Sippy CR dashboard.
