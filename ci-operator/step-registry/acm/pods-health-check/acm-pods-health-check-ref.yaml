ref:
  as: acm-pods-health-check
  from: cli
  commands: acm-pods-health-check-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: ACM_NAMESPACE
    default: "ocm"
    documentation: Namespace where ACM MultiClusterHub is installed.
  - name: MCE_NAMESPACE
    default: "multicluster-engine"
    documentation: Namespace where MCE components run.
  - name: HEALTH_CHECK_TIMEOUT
    default: "600"
    documentation: Maximum seconds to wait for all pods to be Running/Succeeded.
  documentation: |-
    Verifies all pods in the ACM and MCE namespaces are Running or
    Succeeded. Reports unhealthy pods and saves pod status to artifacts.
