ref:
  as: acm-debug-ssh-key
  from: upi-installer
  commands: acm-debug-ssh-key-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Diagnostic step that validates the SSH private key from the cluster
    profile before mirroring begins. Prints ssh/openssl versions, key
    checksum, verifies the key can derive a public key, and checks
    whether the file ends with a newline.
