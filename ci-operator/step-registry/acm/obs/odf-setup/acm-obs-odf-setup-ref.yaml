ref:
  as: acm-obs-odf-setup
  from: cli
  commands: acm-obs-odf-setup-commands.sh
  timeout: 40m0s
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: ACM_OBS__NAMESPACE
    default: "open-cluster-management-observability"
    documentation: Namespace where ACM Observability components run
  - name: ACM_OBS__ODF_NAMESPACE
    default: "openshift-storage"
    documentation: Namespace where ODF is installed
  - name: ACM_OBS__OBC_STORAGE_CLASS
    default: "openshift-storage.noobaa.io"
    documentation: StorageClass for the ObjectBucketClaim (NooBaa S3)
  documentation: |-
    Deploys ACM MultiClusterObservability backed by ODF NooBaa object storage.
    Requires ODF installed and NooBaa Ready on the hub (e.g. via p2p-install-odf-hub).

    Creates:
      1. Observability namespace + pull-secret
      2. ObjectBucketClaim for NooBaa S3 storage
      3. thanos-object-storage secret from OBC-generated ConfigMap/Secret
      4. MultiClusterObservability CR (lean profile)
      5. mco-e2e-testing-sa ServiceAccount + cluster-admin RBAC + token Secret

    Preflights verify that OBC CRD, MCO CRD, NooBaa, and the StorageClass
    exist before attempting resource creation.

    MCO readiness is the prerequisite for the acm-obs-e2e-run step that
    executes the maintained Ginkgo test suite.
