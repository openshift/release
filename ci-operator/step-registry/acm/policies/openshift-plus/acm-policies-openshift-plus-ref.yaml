ref:
  as: acm-policies-openshift-plus
  from: cli-with-git
  commands: acm-policies-openshift-plus-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: SKIP_POLICIES
    default: ""
    documentation: |-
      Comma-separated list of policy names to skip during enforcement.
      Non-existent policies produce a warning, not a failure.
  - name: QUAY_OPERATOR_CHANNEL
    default: ""
    documentation: |-
      When set, overrides the Quay operator subscription channel in the policy-collection
      policy template before deploying. Use to pin a specific channel (e.g. stable-3.17)
      when the catalog default channel is incorrect or outdated.
  - name: ODF_OPERATOR_CHANNEL
    default: ""
    documentation: |-
      When set, overrides the ODF operator subscription channel in the policy-collection
      policy template before deploying. Use to pin a specific channel (e.g. stable-4.22)
      when the catalog default channel is incorrect or outdated.
  - name: POLICY_COLLECTION_REF
    default: "6d80aff5dda558516fced50640d028bce8dd2341"
    documentation: |-
      Immutable SHA of the stolostron/policy-collection fork to deploy.
      Pinned to the confirmed 5.x image set (green rehearsals 2120618910393831424/2120619043974025216 at openshift/release#87873 head c3a81d86).
      Verified via git ls-remote HEAD and byte-check of policygenerator/policy-sets/stable/openshift-plus/ at this SHA.
  documentation: |-
    Setup and apply the openshift-plus policyset.
