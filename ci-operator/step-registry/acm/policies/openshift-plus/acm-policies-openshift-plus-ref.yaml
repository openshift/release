ref:
  as: acm-policies-openshift-plus
  from: cli-with-git
  commands: acm-policies-openshift-plus-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: SKIP_POLICIES
    default: ""
    documentation: |-
      Comma- or newline-separated list of policy names to skip during
      enforcement.
      Non-existent policies produce a warning, not a failure. Entries are
      normalized (whitespace trimmed, empty and duplicate entries dropped
      with a warning). While any entry remains, the step writes one failing
      JUnit result per configured entry to
      ${ARTIFACT_DIR}/junit_skip_policies.xml (suite and classname
      lp-interop--OPP--policies; presence in the cluster is recorded in
      each failure message) so the skip state is countable instead of
      invisible; the step still exits 0 on every path that exists today
      (exit 1 remains only for the pre-existing policy-list fetch and
      compliance-wait failure classes).
  - name: QUAY_OPERATOR_CHANNEL
    default: ""
    documentation: |-
      When set, overrides the Quay operator subscription channel in the policy-collection
      policy template before deploying. Use to pin a specific channel (e.g. stable-3.17)
      when the catalog default channel is incorrect or outdated.
  - name: ODF_OPERATOR_CHANNEL
    default: ""
    documentation: |-
      When set, overrides the ODF operator subscription channel in the policy-collection
      policy template before deploying. Use to pin a specific channel (e.g. stable-4.22)
      when the catalog default channel is incorrect or outdated.
  documentation: |-
    Setup and apply the openshift-plus policyset.
    While SKIP_POLICIES is non-empty, the step also emits
    ${ARTIFACT_DIR}/junit_skip_policies.xml with one failing JUnit result
    per configured skip entry (INTEROP-9677 interim visibility). The
    artifact is deliberately NOT propagated to ${SHARED_DIR}/junit:
    interop-opp-skip-ratio-gate counts <skipped> results, and propagating
    failure rows would inflate the gate denominator and mask real
    skip-ratio breaches. Policy skips are counted via this per-step
    artifact instead. Note: the gate is wired only into jobs that include
    the interop-opp-skip-ratio-gate step (the RedHatQE
    cr--full-stack--aws jobs and the stolostron policy-collection
    interop-opp-aws / interop-opp-upgrade-aws jobs); neither
    full-stack--fips--aws job includes it. Its scan root is JUNIT_DIR when
    set, else SHARED_DIR when that tree already holds JUnit XML, else its
    own ARTIFACT_DIR, where an empty tree makes the gate report
    EVIDENCE-INCOMPLETE and exit 0. MAP_TESTS/DR__RP__CR_COMP_NAME do not
    decide this: several steps (for example interop-opp-wait-mcp) write
    JUnit XML into SHARED_DIR without that machinery.
    FAIL_ON_BREACH=true is unsupported on any lane with a non-empty
    SKIP_POLICIES.
