ref:
  as: oran-o2ims-wait-for-tls-pods
  from: cli
  cli: latest
  commands: oran-o2ims-wait-for-tls-pods-commands.sh
  env:
  - name: WAIT_NAMESPACE
    default: oran-o2ims
    documentation: "Namespace where the oran-o2ims operator is deployed."
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Waits for the oran-o2ims Inventory CR to be auto-created, then
    discovers all services with TLS serving cert annotations, waits
    for their backing pods to be ready, and verifies that the
    service-ca TLS secrets exist. Fails the step if any check does
    not pass within the timeout.
