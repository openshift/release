ref:
  as: oran-o2ims-install-prereq-crds
  from: cli
  cli: latest
  commands: oran-o2ims-install-prereq-crds-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Applies stub CRDs for external API types that the oran-o2ims
    controller-manager watches but that are not provided by ACM or
    the operator bundle. Without these CRDs the controller's informer
    cache sync times out and crash-loops the manager, causing
    non-deterministic TLS scan failures on the metrics and webhook ports.
    Currently covers: ImageBasedGroupUpgrade (TALM).
