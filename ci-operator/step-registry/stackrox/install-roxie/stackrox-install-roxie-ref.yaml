ref:
  as: stackrox-install-roxie
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  grace_period: 20m
  commands: stackrox-install-roxie-commands.sh
  resources:
    requests:
      cpu: 2000m
      memory: 4000Mi
  env:
  - name: ROX_SCANNER_V4_ENABLED
    default: "true"
  - name: SCANNER_V4_MATCHER_READINESS
    default: "database"
  - name: CENTRAL_MAX_WAIT_SECONDS
    default: "7200"
  - name: SCANNER_V4_MATCHER_VULN_BUNDLE_ALLOWLIST
    default: ""
  - name: ROXIE_VERSION
    default: "latest"
  documentation: |-
    A step that installs RHACS(stackrox) via roxie
