ref:
  as: stackrox-install-roxie
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  grace_period: 20m
  commands: stackrox-install-roxie-commands.sh
  resources:
    requests:
      cpu: 2000m
      memory: 4000Mi
  env:
  - name: ROXIE_VERSION
    default: "latest"
  documentation: |-
    A step that installs RHACS(stackrox) via roxie
