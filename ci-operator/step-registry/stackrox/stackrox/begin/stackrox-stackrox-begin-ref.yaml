ref:
  as: stackrox-stackrox-begin
  commands: stackrox-stackrox-begin-commands.sh
  credentials:
  - mount_path: /tmp/vault/stackrox-stackrox-e2e-tests
    group: credentials
    collection: stackrox-stackrox-e2e-tests
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  from: bin
  dnsConfig:
    nameservers:
    - 8.8.8.8  # ROX-37043 - workaround for recurring cluster-DNS flakes (2026-09)
  timeout: 15m0s
  grace_period: 300s
  documentation: |-
    An initial step for stackrox/stackrox CI jobs.
