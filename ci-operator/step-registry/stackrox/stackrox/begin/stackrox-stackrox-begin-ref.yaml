ref:
  as: stackrox-stackrox-begin
  commands: stackrox-stackrox-begin-commands.sh
  credentials:
  - mount_path: /tmp/vault/stackrox-stackrox-e2e-tests
    group: credentials
    collection: stackrox-stackrox-e2e-tests
  - mount_path: /tmp/vault/stackrox-automation-flavors
    group: credentials
    collection: stackrox-automation-flavors
  resources:
    requests:
      cpu: 2000m
      memory: 4000Mi
  from: test-bin
  timeout: 5h0m0s
  grace_period: 300s
  documentation: |-
    An initial step for stackrox/stackrox CI jobs.
