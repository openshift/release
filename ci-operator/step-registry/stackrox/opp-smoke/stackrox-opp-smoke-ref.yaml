ref:
  as: stackrox-opp-smoke
  best_effort: true
  commands: stackrox-opp-smoke-commands.sh
  credentials:
  - mount_path: /tmp/vault/stackrox-stackrox-e2e-tests
    collection: stackrox-stackrox-e2e-tests
    group: credentials
  env:
  - name: ACS_EXPECTATION
    default: ""
    documentation: |-
      Whether this lane expects ACS Central to be deployed: "required" or
      "absent-by-design". Fail-closed: unset or any other value fails the
      step (exit 2). Declared per lane stanza in the ci-operator config
      (INTEROP-9647).
  - name: ACS_SELFTEST
    default: "true"
    documentation: |-
      Set to "false" to skip the acs-preflight-selftest carrier case.
  documentation: |-
    Run the ACS qa-tests-backend SMOKE suite against a live ACS instance.

    INTEROP-9647 contract: classifies the ACS state (present / absent /
    unknown) by its own query BEFORE reading connection details from
    SHARED_DIR, gated by the fail-closed ACS_EXPECTATION env (required |
    absent-by-design). Emits a JUnit carrier
    (lp-interop--OPP--acs-smoke) on every exit path with one
    self-describing classification case and an acs-preflight-selftest
    case. Exit codes: 0 pass or absent-by-design; 1
    acs-required-but-absent or test failure; 2 invalid input; 3
    acs-state-indeterminate.

    When Central is present, sparse-clones the stackrox/stackrox and
    stackrox/scanner repos, then executes ./gradlew testSMOKE.  JUnit XML
    results are copied to ARTIFACT_DIR for Prow / Sippy consumption.
  from: acs-smoke-runner
  grace_period: 1m0s
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
  timeout: 1h0m0s
