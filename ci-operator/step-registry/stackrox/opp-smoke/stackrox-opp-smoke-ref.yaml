ref:
  as: stackrox-opp-smoke
  best_effort: true
  commands: stackrox-opp-smoke-commands.sh
  credentials:
  - mount_path: /tmp/vault/stackrox-stackrox-e2e-tests
    name: stackrox-stackrox-e2e-tests
    namespace: test-credentials
  documentation: |-
    Run the ACS qa-tests-backend SMOKE suite against a live ACS
    instance.  Reads connection credentials from SHARED_DIR
    (written by stackrox-opp-readiness).  Sparse-clones the
    stackrox/stackrox and stackrox/scanner repos, then executes
    ./gradlew testSMOKE.  JUnit XML results are copied to
    ARTIFACT_DIR for Prow / Sippy consumption.
  from: acs-smoke-runner
  grace_period: 1m0s
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
  timeout: 1h0m0s
