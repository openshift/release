workflow:
  as: stackrox-automation-flavors-eks-e2e
  steps:
    pre:
    - ref: stackrox-stackrox-begin
    - as: eks-create
      commands: |
        # Pod DNS report (dnsConfig test: this step pod runs with nameservers [8.8.8.8],
        # dnsPolicy None - build01 CoreDNS flakiness 2026-09-11/12). /etc/resolv.conf
        # is a read-only bind mount in k8s pods, so the pod spec "dnsConfig" field is
        # the mechanism; log the effective config + a sanity probe.
        echo "=== pod-dns: effective /etc/resolv.conf ==="
        cat /etc/resolv.conf 2>/dev/null || true
        if getent hosts quay.io >/dev/null 2>&1; then
            echo "=== pod-dns: sanity OK (quay.io -> $(getent hosts quay.io | head -1 | awk '{print $1}')) ==="
        else
            echo "=== pod-dns: sanity WARN (quay.io not resolvable) ==="
        fi
        export NODE_COUNT=3
        /usr/bin/openshift-ci.sh create eks
      dnsConfig:
        nameservers:
        - 8.8.8.8
      credentials:
      - mount_path: /tmp/vault/stackrox-automation-flavors
        group: credentials
        collection: stackrox-automation-flavors
      env:
      - name: NETWORK_STACK
        default: ''
      from: eks
      resources:
        requests:
          cpu: 2000m
          memory: 4000Mi
    test:
    - ref: stackrox-stackrox-e2e-test
    post:
    - as: eks-destroy
      commands: |
        /usr/bin/openshift-ci.sh destroy eks
      credentials:
      - mount_path: /tmp/vault/stackrox-automation-flavors
        group: credentials
        collection: stackrox-automation-flavors
      from: eks
      resources:
        requests:
          cpu: 2000m
          memory: 4000Mi
    - ref: stackrox-stackrox-end
  documentation: |-
    A stackrox workflow to execute e2e QA tests in an EKS cluster.
