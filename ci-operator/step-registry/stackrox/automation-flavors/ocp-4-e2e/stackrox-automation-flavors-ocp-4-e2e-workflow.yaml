workflow:
  as: stackrox-automation-flavors-ocp-4-e2e
  steps:
    allow_best_effort_post_steps: true
    pre:
    - ref: stackrox-stackrox-begin
    - as: ocp-4-create
      commands: |
        # Fallback DNS workaround (build01 CoreDNS flakiness, 2026-09-11/12 batch).
        # Keep the primary nameserver (in-cluster names + search domains) and append
        # a public fallback last; glibc falls over on timeout/SERVFAIL only.
        setup_fallback_dns() {
            local target="8.8.8.8"
            echo "=== setup_fallback_dns: before ==="
            ls -la /etc/resolv.conf 2>&1 || true
            readlink -f /etc/resolv.conf 2>/dev/null || true
            cat /etc/resolv.conf 2>/dev/null || true
            if grep -q "nameserver ${target}" /etc/resolv.conf 2>/dev/null; then
                echo "=== setup_fallback_dns: ${target} already present, no change ==="
                return 0
            fi
            if echo "nameserver ${target}" >> /etc/resolv.conf 2>/dev/null; then
                echo "=== setup_fallback_dns: OK via in-place append ==="
            else
                echo "=== setup_fallback_dns: in-place append failed, trying rm+rewrite ==="
                local pristine=/tmp/resolv.conf.pristine
                cp /etc/resolv.conf "${pristine}" 2>/dev/null || true
                rm -f /etc/resolv.conf 2>/dev/null || true
                if { cat "${pristine}" 2>/dev/null; echo "nameserver ${target}"; } > /etc/resolv.conf 2>/dev/null; then
                    echo "=== setup_fallback_dns: OK via rm+rewrite ==="
                else
                    echo "=== setup_fallback_dns: FAILED, leaving /etc/resolv.conf as-is ==="
                    return 0
                fi
            fi
            echo "=== setup_fallback_dns: after ==="
            cat /etc/resolv.conf 2>/dev/null || true
            if getent hosts quay.io >/dev/null 2>&1; then
                echo "=== setup_fallback_dns: sanity OK (quay.io resolved) ==="
            else
                echo "=== setup_fallback_dns: sanity WARN (quay.io not resolvable right now) ==="
            fi
            return 0
        }
        setup_fallback_dns
        echo "Running openshift-4 ${OCP_VERSION} automation"
        /usr/bin/openshift-ci.sh create openshift-4 "${OCP_VERSION}"
      credentials:
      - mount_path: /tmp/vault/stackrox-automation-flavors
        group: credentials
        collection: stackrox-automation-flavors
      env:
      - name: OCP_VERSION
        default: 'ocp/stable-4.13'
      - name: FIPS_ENABLED
        default: 'false'
      - name: OPENSHIFT_INSTALL_SKIP_HOSTCRYPT_VALIDATION
        default: 'true'
      - name: CREDENTIALS_MODE
        default: 'Passthrough'
      - name: SSD_STORAGE_CLASS
        default: 'true'
      - name: MASTER_NODE_SERVICE_ACCOUNT
        default: 'openshift-master-node@acs-san-stackroxci.iam.gserviceaccount.com'
      - name: WORKER_NODE_SERVICE_ACCOUNT
        default: 'openshift-worker-node@acs-san-stackroxci.iam.gserviceaccount.com'
      - name: OS_IMAGE_STREAM
        default: ''
      - name: CLOUD_PROVIDER
        default: ''
      - name: NETWORK_STACK
        default: ''
      from: ocp-4
      resources:
        requests:
          cpu: 2000m
          memory: 4000Mi
    test:
    - ref: stackrox-stackrox-e2e-test
    post:
    - as: ocp-4-destroy
      best_effort: true
      commands: |
        echo "Running openshift-4 ${OCP_VERSION} automation"
        /usr/bin/openshift-ci.sh destroy openshift-4 "${OCP_VERSION}"
      env:
      - name: OCP_VERSION
        default: 'ocp/stable-4.13'
      credentials:
      - mount_path: /tmp/vault/stackrox-automation-flavors
        group: credentials
        collection: stackrox-automation-flavors
      from: ocp-4
      resources:
        requests:
          cpu: 2000m
          memory: 4000Mi
      timeout: 30m0s
    - ref: stackrox-stackrox-end
  documentation: |-
    A stackrox workflow to execute e2e QA tests in an OCP 4 cluster.
