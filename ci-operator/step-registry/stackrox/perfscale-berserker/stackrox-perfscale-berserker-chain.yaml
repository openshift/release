chain:
  as: stackrox-perfscale-berserker
  steps:
  - ref: openshift-qe-berserker-load
  - ref: openshift-qe-orion
  env:
  - name: ES_BENCHMARK_INDEX
    default: "ripsaw-kube-burner*"
  - name: ES_METADATA_INDEX
    default: "perf_scale_ci*"
  - name: ES_SECRETS_PATH
    default: /secret_stackrox
  - name: ES_TYPE
    default: "stackrox"
  - name: ORION_CONFIG
    default: https://raw.githubusercontent.com/stackrox/stackrox/refs/heads/master/tests/performance/scale/config/orion-acs-berserker.yml
  - name: OUTPUT_FORMAT
    default: "JUNIT"
    documentation: Output format for Orion (JUNIT, JSON, or TEXT). JUNIT format enables better error display in Prow.
  - name: RUN_ORION
    default: "true"
  - name: VERSION
    default: "4.20"
  documentation: |-
    Berserker-load perf&scale workload for stackrox on ocp
