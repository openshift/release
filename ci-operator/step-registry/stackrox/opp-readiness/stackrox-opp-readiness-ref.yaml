ref:
  as: stackrox-opp-readiness
  best_effort: true
  commands: stackrox-opp-readiness-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  from: cli
  timeout: 1h15m0s
  documentation: |-
    Verify ACS Central and SecuredCluster are operational before running
    SMOKE tests.  Discovers namespaces dynamically via Central and
    SecuredCluster CRs, then polls Central API health, secured-cluster
    connectivity, sensor pod status, and default policy count.  Writes
    ROX_ADMIN_PASSWORD, CENTRAL_URL, CENTRAL_NS, and SC_NS to SHARED_DIR
    for downstream steps.

    On startup, runs pre-flight diagnostics to check CRD registration,
    operator Subscription/CSV status, and RHACS operator pod health.
    During the Central CR discovery wait (up to 900s), periodic operator
    diagnostics are emitted every ~150s.  Diagnostic output contains only
    fixed labels and numeric counts grouped into fixed safe status categories.
    Namespace and resource identifiers, arbitrary status or condition text,
    operator logs, events, stderr, and raw resource output are not emitted.
