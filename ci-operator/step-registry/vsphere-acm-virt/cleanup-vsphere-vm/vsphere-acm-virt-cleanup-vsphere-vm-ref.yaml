ref:
  as: vsphere-acm-virt-cleanup-vsphere-vm
  from: upi-installer
  commands: vsphere-acm-virt-cleanup-vsphere-vm-commands.sh
  timeout: 15m0s
  grace_period: 5m0s
  best_effort: true
  credentials:
  - mount_path: /var/run/vsphere-credentials
    name: vsphere-elastic
    namespace: test-credentials
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Cleans up the source VM on vSphere that was created for migration testing.
    Powers off and destroys the VM using govc.

    Runs as best_effort so cleanup proceeds even if prior steps failed.
    Reads VM metadata from ${SHARED_DIR}/vsphere-source-vm.json and govc
    environment from ${SHARED_DIR}/govc-env.sh.
