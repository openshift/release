ref:
  as: openshift-hyperfleet-gcp-vm-destroy
  from: cli
  grace_period: 10m
  commands: openshift-hyperfleet-gcp-vm-destroy-commands.sh
  credentials:
  - collection: hyperfleet
    group: hyperfleet-e2e
    mount_path: /var/run/hyperfleet-e2e
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 20m0s
  documentation: |-
    This step deletes the GCP VM and the firewall rule created by the
    openshift-hyperfleet-gcp-vm-create step, using the instance name, zone,
    and firewall rule name stored in ${SHARED_DIR}. It is a no-op if the
    create step never wrote those files (e.g. it failed before provisioning).
