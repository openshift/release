ref:
  as: openshift-hyperfleet-operator-upgrade-test
  cli: latest
  from: src
  commands: openshift-hyperfleet-operator-upgrade-test-commands.sh
  timeout: 3h0m0s
  grace_period: 15m0s
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      memory: 8Gi
  env:
  - name: MULTISTAGE_PARAM_OVERRIDE_OPERATOR_COMMIT
    default: ""
    documentation: Full Git commit that produced the target RC bundle and whose upgrade suite is run.
  - name: MULTISTAGE_PARAM_OVERRIDE_QUALIFICATION_COMMIT
    default: ""
    documentation: Full hyperfleet-release Git commit containing the qualified scenario and fixture template.
  - name: MULTISTAGE_PARAM_OVERRIDE_QUALIFICATION_DIR
    default: ""
    documentation: Directory inside that hyperfleet-release commit containing scenario.yaml and fixtures.template.yaml.
  - name: MULTISTAGE_PARAM_OVERRIDE_FROM_BUNDLE
    default: ""
    documentation: Digest-pinned official previous-final operator bundle.
  - name: MULTISTAGE_PARAM_OVERRIDE_TO_BUNDLE
    default: ""
    documentation: Digest-pinned target RC operator bundle.
  - name: MULTISTAGE_PARAM_OVERRIDE_CATALOG_IMAGE
    default: ""
    documentation: Digest-pinned catalog containing both bundles and their direct replacement edge.
  - name: MULTISTAGE_PARAM_OVERRIDE_OLM_CHANNEL
    default: ""
    documentation: Channel containing the selected direct replacement edge.
  - name: MULTISTAGE_PARAM_OVERRIDE_POSTGRES_IMAGE
    default: ""
    documentation: Digest-pinned PostgreSQL fixture image qualified on the claimed OpenShift cluster.
  - name: MULTISTAGE_PARAM_OVERRIDE_RABBITMQ_IMAGE
    default: ""
    documentation: Digest-pinned RabbitMQ fixture image qualified on the claimed OpenShift cluster.
  documentation: |-
    Runs the target operator commit's OLM Classic upgrade suite against an
    exclusively claimed OpenShift cluster. Gangway must supply the immutable
    release pair, catalog, source commits, and release-qualified scenario.
    Fixture passwords are generated in the runner and are never exported as
    artifacts. The operator suite owns the install, checks, and normal cleanup.
