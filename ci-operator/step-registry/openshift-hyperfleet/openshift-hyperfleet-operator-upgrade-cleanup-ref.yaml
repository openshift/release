ref:
  as: openshift-hyperfleet-operator-upgrade-cleanup
  cli: latest
  from: src
  commands: openshift-hyperfleet-operator-upgrade-cleanup-commands.sh
  timeout: 55m0s
  grace_period: 5m0s
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
    limits:
      memory: 4Gi
  documentation: |-
    Always-run recovery step for the HyperFleet operator RC upgrade. It reads
    the suite's UID-bound cleanup receipt from SHARED_DIR, retries cleanup if
    needed, and archives the final sanitized evidence even after a test failure.
    The claimed cluster is released by the generic-claim workflow.
