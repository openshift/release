workflow:
  as: ovn-masquerade-subnet-day2
  steps:
    pre:
      - chain: ipi-conf-aws
      - chain: ipi-install
      - ref: ovn-utils
    test:
      - ref: ovn-defaultnetwork-internal-masquerade-subnet-day2
      - ref: openshift-e2e-test
    post:
      - chain: gather-core-dump
      - chain: ipi-aws-post
  documentation: |-
    Installs an OVN cluster with default internalMasqueradeSubnet, then applies a day-2
    patch to gatewayConfig.ipv4.internalMasqueradeSubnet and validates propagation before e2e.
