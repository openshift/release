ref:
  as: ovn-defaultnetwork-internal-masquerade-subnet-day2
  from_image:
    name: cli-yq
    namespace: ocp
    tag: latest
  commands: ovn-defaultnetwork-internal-masquerade-subnet-day2-commands.sh
  env:
  - name: OVN_INTERNAL_MASQUERADE_SUBNET_DAY2
    default: "100.254.170.0/24"
    documentation: The internalMasqueradeSubnet CIDR to apply as a day-2 config change.
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    This step makes a day 2 config change to defaultNetwork.ovnKubernetesConfig.gatewayConfig.ipv4.internalMasqueradeSubnet
    and validates that the change is reflected in the network operator and node routing tables.
