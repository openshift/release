ref:
  as: ovn-conf-multi-cidr
  from: cli
  commands: ovn-conf-multi-cidr-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Configures the install-config.yaml with three IPv4 clusterNetwork CIDRs
    (10.128.0.0/22, 10.128.4.0/22, 10.128.8.0/22) each with hostPrefix /23.
    Each CIDR holds 2 nodes, so a 6-node cluster (3 master + 3 worker) is
    guaranteed to have worker nodes in at least two different CIDRs. This
    exercises cross-CIDR pod-to-pod traffic paths including EgressIP
    no-reroute policies.
