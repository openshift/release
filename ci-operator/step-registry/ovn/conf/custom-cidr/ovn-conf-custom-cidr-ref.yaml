ref:
  as: ovn-conf-custom-cidr
  from: cli  
  commands: ovn-conf-custom-cidr-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: CLUSTER_NETWORK_CIDR
    default: ""
  - name: CLUSTER_NETWORK_HOST_PREFIX
    default: "23"
  - name: SERVICE_NETWORK_CIDR
    default: "172.30.0.0/16"
  documentation: |-
   Set CLUSTER_NETWORK_CIDR to deploy a cluster with a custom cluster-network CIDR.
   CLUSTER_NETWORK_HOST_PREFIX and SERVICE_NETWORK_CIDR may also be set; they
   default to /23 and 172.30.0.0/16 respectively. Without
   CLUSTER_NETWORK_CIDR, this step makes no changes.
