ref:
  as: monitoring-plugin-tests-management-api
  from: src
  commands: monitoring-plugin-tests-management-api-commands.sh
  timeout: 60m0s
  grace_period: 60s
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      memory: 8Gi
  documentation: |-
    The monitoring-plugin-tests-management-api step enables user workload
    monitoring, port-forwards the test cluster thanos-querier tenancy port,
    and trusts that cluster's service CA. It then starts the
    monitoring-plugin backend from source inside the step container and
    runs the Go e2e tests in test/e2e/ (make test-e2e). KUBECONFIG is
    injected by ci-operator from the provisioned cluster.
