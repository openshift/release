ref:
  as: monitoring-plugin-tests-logging-ui
  from: monitoring-ui-tests-runner
  commands: monitoring-plugin-tests-logging-ui-commands.sh
  timeout: 2h0m0s
  grace_period: 60s
  resources:
    requests:
      cpu: "1"
      memory: 3Gi
    limits:
      memory: 4Gi
  documentation: |-
    The monitoring-plugin-tests-logging-ui step executes the mocked Logging Console Plugin
    Cypress suites (cypress.logging.config.ts, specPattern cypress/logging/integration) against
    the local webpack test harness started by "npm run start:logging-tests" on localhost:9003.
    All API responses are served by Cypress fixtures, so no cluster is required.
    Revisions that do not contain the harness (web/cypress.logging.config.ts and the
    start:logging-tests script) are skipped with a success result.
    shortcut: no real-console logging e2e yet; add a cluster (workflow ipi-aws), a logging
    stack setup spec and the real-console suites when the logging e2e branch lands.
