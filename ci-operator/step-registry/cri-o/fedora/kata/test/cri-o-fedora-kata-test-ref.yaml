ref:
  as: cri-o-fedora-kata-test
  from: crio-crio-base-src
  grace_period: 10m
  commands: cri-o-fedora-kata-test-commands.sh
  env:
    - name: KATA_RUNTIME_VARIANT
      default: kata-static
      documentation: |-
        Kata archive variant to install. Use "kata-static" for the Rust-based
        runtime or "kata-go-static" for the Go-based runtime.
  resources:
    requests:
      cpu: "3"
      memory: 600Mi
    limits:
      memory: 2Gi
  documentation: |-
    The assisted agent test step executes the subsystem test suite.
