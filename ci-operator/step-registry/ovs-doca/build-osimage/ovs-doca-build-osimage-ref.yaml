ref:
  as: ovs-doca-build-osimage
  from: nested-podman
  cli: latest
  nested_podman: true
  grace_period: 10m
  timeout: 1h30m0s
  commands: ovs-doca-build-osimage-commands.sh
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
  credentials:
  - collection: ovs-doca
    group: rhsm-activation-key
    mount_path: /var/run/rhsm-creds
  - collection: ovs-doca
    group: quay-push
    mount_path: /var/run/quay-push
  dependencies:
  - name: "release:latest"
    env: RELEASE_IMAGE_LATEST
  env:
  - name: OVS_DOCA_BASE_IMAGE_TAGS
    default: "rhel-coreos-10 rhel-coreos"
    documentation: |-
      Space-separated, ordered list of release payload image tags to use as the layering base.
      The first tag that resolves in the payload wins. Defaults to preferring the RHEL 10
      CoreOS variant of the 4.22 dual stream, falling back to the default rhel-coreos tag.
  - name: OVS_DOCA_PACKAGES
    default: "doca-networking-runtime openvswitch-selinux-extra-policy mft"
    documentation: |-
      Space-separated list of packages to install into the layered CoreOS image.
      libunwind is deliberately absent: it does not exist as a package in RHEL 10 and
      nothing in the DOCA stack requires it.
  - name: OVS_DOCA_REMOVE_PACKAGES
    default: "openvswitch[0-9]*"
    documentation: |-
      Space-separated list of package globs to remove before installing OVS_DOCA_PACKAGES.
      The stock openvswitch packages conflict with the DOCA-provided ones and must go first.
      Set to an empty string to skip the removal.
  - name: OVS_DOCA_REPO_COMPONENTS
    default: "baseos appstream supplementary"
    documentation: |-
      Space-separated list of RHEL CDN components to enable inside the layering build. Each is
      expanded to
      https://${OVS_DOCA_CDN_HOST}/content/dist/rhel10/${OVS_DOCA_RELEASEVER}/aarch64/<component>/os
      and authenticated with the entitlement certificate.

      The DOCA packages (doca-networking-runtime, doca-openvswitch, mft, and the 1.0-41 build of
      openvswitch-selinux-extra-policy) ship in 'supplementary'. There is no DOCA-specific
      repository, and fast-datapath carries only older openvswitch-selinux-extra-policy builds.
  - name: OVS_DOCA_NVIDIA_BASEURL
    default: "https://linux.mellanox.com/public/repo/doca/3.5.0/rhel10/arm64-sbsa/"
    documentation: |-
      NVIDIA DOCA repository used only to fill the dependency gaps that Red Hat's Supplementary
      channel leaves open. It is given a worse dnf priority than the Red Hat repositories, so
      Red Hat content wins wherever it exists.

      Measured on DOCA 3.5.0 / aarch64 / el10: 135 of 142 packages resolve from Red Hat and 7
      from NVIDIA -- collectx-clxapi, libibverbs, libibumad, librdmacm, infiniband-diags,
      rdma-core-devel and openmpi. All four requested DOCA packages themselves
      (doca-networking-runtime, doca-openvswitch, mft, openvswitch-selinux-extra-policy) come
      from Red Hat.

      Set to an empty string to build from Red Hat content only. That does not currently
      resolve; it is useful for re-testing whether the Red Hat channel gaps have been closed.
      Note the aarch64 path component on this repository is 'arm64-sbsa', not 'aarch64'.
  - name: OVS_DOCA_RELEASEVER
    default: "10"
    documentation: |-
      The $releasever used to build the CDN paths. '10' tracks the latest RHEL 10 minor; pin to
      a specific minor such as '10.2' to match a fixed RHCOS base.
  - name: OVS_DOCA_CDN_HOST
    default: "cdn.redhat.com"
    documentation: The Red Hat CDN host serving entitled content.
  - name: OVS_DOCA_IMAGE_REPO
    default: "quay.io/rh-ecosystem-edge/ovs-doca-layering"
    documentation: |-
      Repository the layered CoreOS image is pushed to. Must be publicly readable, or the
      cluster pull secret must already carry credentials for it, otherwise nodes cannot pivot.
  - name: OVS_DOCA_IMAGE_EXPIRATION
    default: "24h"
    documentation: Value for the quay.expires-after label on the pushed layered image.
  - name: OVS_DOCA_MCP
    default: "worker"
    documentation: |-
      The MachineConfigPool whose nodes pivot to the layered image. The generated MachineConfig
      is written to SHARED_DIR so that ipi-install applies it as a day-0 install manifest,
      meaning nodes come up on the layered image rather than being reconfigured afterwards.
  documentation: |-
    Builds a DOCA-enabled layered RHCOS image and stages it for day-0 installation.

    This step runs before ipi-install. It resolves the RHEL 10 CoreOS image from the release
    payload, obtains a Red Hat entitlement, and runs a podman build that removes the stock
    openvswitch packages and installs the DOCA networking stack from entitled Red Hat content.
    The entitlement certificates are bind-mounted into the build and therefore never land in
    an image layer.

    The entitlement is obtained one of two ways, depending on what the ovs-doca/rhsm-activation-key
    secret contains:

      entitlement.pem + entitlement-key.pem (preferred)
        A pre-issued entitlement certificate pair, used directly. Needs no subscription-manager
        binary and no write access to /etc/pki/entitlement in the step pod, so it is the more
        reliable option in CI. Optionally include redhat-uep.pem; otherwise the one from the
        step image is used. These certificates expire and must be rotated in GSM.

      subscription-manager-org + subscription-manager-act-key (fallback)
        An activation key, redeemed by registering the step pod with RHSM and harvesting the
        certificate it issues. Self-maintaining, but it requires subscription-manager in the
        step image and the ability to write /etc/pki/entitlement, and a pod killed before the
        EXIT trap fires will leave a registered system behind. Registration is retried three
        times and its output is suppressed because the command line carries the key.

    The resulting image is pushed by digest, and a MachineConfig carrying spec.osImageURL is
    written to ${SHARED_DIR}/manifest_*.yaml so the installer applies it as part of the initial
    cluster manifests. The image reference is also written to
    ${SHARED_DIR}/ovs-doca-osimage-reference for downstream validation steps.

    Run this step pod on arm64 via node_architecture_overrides so the aarch64 RPM transaction
    executes natively instead of under emulation.
