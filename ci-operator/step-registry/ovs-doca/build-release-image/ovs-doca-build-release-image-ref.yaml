ref:
  as: ovs-doca-build-release-image
  from: cli
  commands: ovs-doca-build-release-image-commands.sh
  grace_period: 10m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: OVS_DOCA_LAYERED_IMAGE
    default: "doca-rhcos-10"
    documentation: |-
      The DOCA-layered RHCOS image, in one of two forms: a full pullspec
      (e.g. quay.io/.../ovs-doca-el10-rhcos:tag) of a pre-built image --
      required for arm64, since the x86_64 build farm cannot produce arm64
      images -- or the bare name of an image target (imagestream in the
      job namespace) built by this job's images phase.
  - name: OVS_DOCA_RELEASE_IS
    default: "ovs-doca-release"
    documentation: |-
      Name for the imagestream that will hold the rebuilt release payload.
  dependencies:
  - name: "release:latest"
    env: RELEASE_IMAGE_LATEST
  documentation: |-
    Rebuilds the release payload with the DOCA-layered RHCOS image as
    rhel-coreos, enabling day-0 installation of the DOCA layer on
    architectures where include_built_images is unavailable (arm64 candidate
    payloads have no integration stream).

    Resolves the layered image either from a full pullspec (OVS_DOCA_LAYERED_IMAGE
    containing '/', e.g. a quay-hosted pre-built image -- the required mode for
    arm64, since the x86_64 build farm cannot produce arm64 images) or from the
    job's imagestream (bare name, image built by this job's images phase).
    Assembles a new payload from the current release image with
    `oc adm release new ... rhel-coreos=<layered>`, and publishes it through a
    one-shot BuildConfig whose build pod runs as the namespace's builder
    service account -- the only identity permitted to write to the pipeline
    registry (step service accounts are denied pushes through both the
    external route and the in-cluster endpoint, and cannot mint builder
    tokens; see the script header for the rehearsal evidence). Writes the
    digest-pinned external pullspec to ${SHARED_DIR}/custom-release-image.

    The ipi-install step picks the file up and installs the cluster from the
    rebuilt payload, so nodes boot the DOCA layer from the first boot. Must
    run before ipi-install in the pre chain.
