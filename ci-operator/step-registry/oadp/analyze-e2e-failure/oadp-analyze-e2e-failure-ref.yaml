ref:
  as: oadp-analyze-e2e-failure
  from: claude-ai-helpers
  best_effort: true
  commands: oadp-analyze-e2e-failure-commands.sh
  timeout: 30m0s
  grace_period: 30s
  env:
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
    documentation: |-
      Enable Vertex AI for Claude Code.
  - name: CLOUD_ML_REGION
    default: "global"
    documentation: |-
      Google Cloud region for Vertex AI.
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "openshift-ci-prow-agents"
    documentation: |-
      Google Cloud project ID for Vertex AI authentication.
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/google-token"
    documentation: |-
      Path to the Google Cloud service account JSON key file for Vertex AI authentication.
  - name: CLAUDE_MODEL
    default: "claude-opus-4-6"
    documentation: |-
      Claude model to use for test failure analysis.
  - name: TEST_NAME
    default: "e2e-test-aws"
    documentation: |-
      The test name (as: field) in the ci-operator config for the outer test.
      Used to construct the GCS artifact path. Override per test via steps.env
      since every OADP e2e test entry has a different outer test name.
  - name: TEST_STEPS
    default: "e2e"
    documentation: |-
      Space-separated list of test step names to check for finished.json.
      These are the inner step names (as: fields) within the test definition.
      All OADP e2e test entries currently use the inner step name "e2e".
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  credentials:
  - namespace: test-credentials
    name: sa-claude-openshift-ci
    mount_path: /var/run/claude-code-service-account
  documentation: |-
    Post-step that uses Claude to analyze OADP operator e2e test failures.
    Only runs when test failures are detected (polls GCS for finished.json).
    On success (no test failures), exits early with no cost.
    Produces a markdown analysis report in ARTIFACT_DIR.

    Replaces the previous in-repo approach (Claude CLI installed in
    build/ci-Dockerfile, invoked from the Makefile's test-e2e target) with
    the shared claude-ai-helpers base image and sa-claude-openshift-ci
    credential used by other repos (e.g. medik8s, hypershift).
