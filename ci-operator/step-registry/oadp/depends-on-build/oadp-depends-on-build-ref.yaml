ref:
  as: oadp-depends-on-build
  from_image:
    name: "4.18"
    namespace: origin
    tag: operator-sdk
  commands: oadp-depends-on-build-commands.sh
  grace_period: 10m
  resources:
    requests:
      cpu: 300m
      memory: 300Mi
  env:
  - name: OO_INSTALL_NAMESPACE
    documentation: The namespace the depended-on image(s) will be built into (via an OpenShift BuildConfig/ImageStream). Should match the namespace the operator under test is installed into, so the resulting ImageStreamTag is reachable by that namespace's Subscription/Deployment.
  - name: DEPENDS_ON_CANDIDATES
    documentation: |-
      One line per (repo, image) pair this job is willing to resolve a
      cross-repo dependency for, in the form:
      `<org>/<name> <RELATED_IMAGE_ENV_VAR_NAME> [<dockerfile-path> [<context-dir>]]`
      (whitespace-separated fields; plain text, not JSON/YAML -- this image
      has no guaranteed `jq`, same reasoning as this repo's other oadp/
      steps). `<dockerfile-path>` is optional and defaults to `Dockerfile`
      at the repo root -- set it when a repo's own ci-operator config uses
      something else (e.g. `Dockerfile.ubi`, `Containerfile`), matching its
      `images.items[].dockerfile_path`. `<context-dir>` is optional (requires
      `<dockerfile-path>` to be given too) and defaults to the repo root; set
      it when the image builds from a subdirectory, matching
      `images.items[].context_dir`. `<dockerfile-path>` is then relative to
      `<context-dir>`, as in ci-operator.

      The SAME `<org>/<name>` may appear on more than one line: a repo that
      builds several images (e.g. one repo producing 3 separate
      RELATED_IMAGE_* targets from 3 different Dockerfiles) gets its source
      fetched once and built once per matching line.

      The triggering PR's own description is scanned for one or more
      `Depends-On: https://github.com/<org>/<name>/pull/<N>` lines
      (Gerrit/Zuul convention, one per line). Any line whose `<org>/<name>`
      matches a repo in this list is resolved: that PR's source is
      fetched, built as a container image inside the target test cluster,
      and one line is appended to `${SHARED_DIR}/depends-on-images.txt`
      (`<RELATED_IMAGE_ENV_VAR_NAME> <pullspec>`) per matching line, for a
      later step to apply.

      A PR with no matching Depends-On line is a total no-op: no file is
      written, nothing downstream changes. Add more lines to test more
      repos (or more images per repo) together in one job; this script
      does not change.

      The second field is normally a real `RELATED_IMAGE_*` env var name,
      but two sentinel values are special-cased:
      - `MANAGER_IMAGE` -- the candidate is oadp-operator's own manager
        image, applied by patching the manager Deployment's container
        image directly rather than a Subscription env var (consumed by
        the KDM configs' inline set-related-image steps).
      - `TESTS_SOURCE` -- the candidate's PR source is wanted as the e2e
        TEST CODE, not as a container image. A one-line pointer file
        (`${SHARED_DIR}/depends-on-tests-source-<org>-<name>.txt`,
        containing the PR's archive URL) is written for this job's own
        e2e test step, which fetches the tarball itself (SHARED_DIR is a
        ~1 MiB Kubernetes Secret, far too small for a source archive)
        and runs `make test-e2e` from it; nothing is appended to
        depends-on-images.txt. For jobs running oadp-operator's e2e
        suite from a pre-built image (the KDM and velero-family e2e
        configs), so an unmerged oadp-operator PR's test-code changes
        execute there.
        Requires the e2e test image to carry the Go toolchain and the
        repo's `make test-e2e` dependencies (konveyor/
        oadp-operator-e2e-tests does). Dockerfile/context fields are
        ignored for this sentinel.
  documentation: |-
    Generic N-candidate resolver for openshift/oadp-operator#2389 style
    cross-repo "test these unmerged PRs together" scenarios, following the
    Depends-On PR-description convention already used by
    openstack-k8s-operators-kuttl-commands.sh. Unlike that step (which only
    needs a source checkout), a resolved dependency here is built into a
    real container image via `oc new-build --strategy=docker --binary` +
    `oc start-build --from-dir=...` against the target test cluster, since
    downstream consumers (e.g. a Kubernetes Subscription's
    RELATED_IMAGE_* override) need an actual pullspec, not just source.

    Building runs entirely inside the target cluster as a normal
    OpenShift Build (buildah managed by OCP, nothing to install locally),
    with output landing in that cluster's own internal registry as an
    ImageStreamTag -- no external route, insecure-registry marking, or
    MachineConfigPool rollout is needed, because the only consumer of the
    resulting image is that same cluster's own kubelet.

    Consumed by the 8 kubevirt-datamover-controller/-plugin (KDM) e2e
    configs (migtools + openshift-priv mirror, oadp-dev/oadp-1.6), the
    32 velero/velero-plugin e2e configs (openshift/velero,
    velero-plugin-for-aws, velero-plugin-for-legacy-aws,
    openshift-velero-plugin; 4 branches each plus openshift-priv
    mirrors), and openshift-oadp-operator's own e2e-test-aws variants,
    which declare one candidate per RELATED_IMAGE_* it substitutes into
    its bundle (see that config's `operator.substitutions` and
    `config/manager/manager.yaml` in openshift/oadp-operator for the
    authoritative repo/env-var/dockerfile mapping). Every pre-built-image
    consumer also declares `openshift/oadp-operator TESTS_SOURCE` so an
    unmerged oadp-operator PR's e2e test code runs in its job. Named/
    structured generically so any future job can declare more candidates
    without any change here.
    A dep PR based on a different branch than the job's own branch
    (PULL_BASE_REF; the OADP repos share the oadp-dev + oadp-1.x scheme,
    so the names compare directly) is never built: it is skipped with a
    loud warning and a depends-on-branch-mismatch.txt artifact, and the
    job proceeds against the released, pre-built dependency -- the
    combination that actually ships. Best-effort (an inconclusive
    metadata fetch builds the dep as before), and not applied to
    pj-rehearse runs (whose PULL_BASE_REF names the release repo's own
    branch). When a triggering PR carries cherry-pick/backport wording
    but no Depends-On lines of its own, the original PR's declared
    Depends-On lines are surfaced in the log and a
    depends-on-cherrypick-original.txt artifact -- a pointer to re-add
    them to this PR's description, never resolved automatically.
