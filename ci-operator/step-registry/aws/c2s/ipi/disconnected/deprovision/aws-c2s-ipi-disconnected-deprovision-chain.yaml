chain:
  as: aws-c2s-ipi-disconnected-deprovision
  steps:
  - ref: ipi-deprovision-deprovision
  - ref: aws-deprovision-stacks
  - ref: aws-deprovision-s3buckets
  documentation: |-
    Tear down a disconnected IPI cluster on AWS C2S/SC2S: destroy the cluster and delete the
    bastion and S3 infrastructure stacks. Artifact gathering is expected to run earlier in the
    post phase (while the cluster still exists). Reused by both C2S and SC2S.
