ref:
  as: aws-c2s-mirror-images
  from: upi-installer
  grace_period: 10m
  commands: aws-c2s-mirror-images-commands.sh
  env:
  - name: OCP_ARCH
    default: "amd64"
    documentation: |-
      The architecture of the cluster (e.g., amd64, arm64). Selects which
      per-arch tag of the C2S helper images to mirror: amd64 uses the
      "latest" source tag, arm64 uses the multi-arch "multi-latest" tag.
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: openshift-qe
    group: mirror-registry
    mount_path: /var/run/vault/mirror-registry
  documentation: |-
    Mirror particular images for C2S and SC2S:
    * C2S apply metadata patch
      * https://github.com/yunjiang29/c2s-instance-metadata
      * https://bugzilla.redhat.com/show_bug.cgi?id=1923956#c3
    * CAP Token Refresh, https://github.com/yunjiang29/cap-token-refresh

