ref:
  as: aws-provision-route53-private-hosted-zone
  from_image:
    namespace: ocp
    name: "4.12"
    tag: upi-installer
  grace_period: 10m
  commands: aws-provision-route53-private-hosted-zone-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
    - name: BASE_DOMAIN
      default: ""
      documentation: |-
        The base domain is used to create private hostedzone on AWS.
        This is not applicable to ROSA Shared VPC cluster.
    - name: ENABLE_SHARED_PHZ
      default: "no"
      documentation: |-
        Create PHZ in a separate account. 
        https://github.com/openshift/enhancements/pull/1397
    - name: PHZ_NAME_PREFIX
      default: ""
      documentation: |-
        Optional prefix for the private hosted zone name. Hosted Control Plane
        shared VPC clusters require the zone to be named
        rosa.<cluster-name>.<base-domain> (OCM validates the name against
        'cluster_domain_prefix.base_domain'), so set this to 'rosa.' for HCP.
  documentation: |-
    Create a route53 private hosted zone.
