ref:
  as: aws-provision-iam-role
  from_image:
    namespace: ocp
    name: "4.12"
    tag: upi-installer
  grace_period: 10m
  commands: aws-provision-iam-role-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: PROVISION_EDGE_IAM_ROLE
    default: "no"
    documentation: |-
      When set to "yes", additionally create a dedicated BYO IAM role and policy
      for the AWS edge compute pool (Local/Wavelength zones). The role name is
      written to ${SHARED_DIR}/aws_byo_role_name_edge.
  documentation: |-
    Create AWS IAM role for BYO IAM role feature.
