ref:
  as: aws-provision-iam-profile
  from_image:
    namespace: ocp
    name: "4.12"
    tag: upi-installer
  grace_period: 10m
  commands: aws-provision-iam-profile-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: PROVISION_EDGE_IAM_PROFILE
    default: "no"
    documentation: |-
      When set to "yes", additionally create a dedicated BYO IAM role, policy and
      instance profile for the AWS edge compute pool (Local/Wavelength zones). The
      profile name is written to ${SHARED_DIR}/aws_byo_profile_name_edge.
  documentation: |-
    Create AWS IAM profile with an IAM role attached for BYO IAM profile feature.
