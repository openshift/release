ref:
  as: aws-deprovision-kms-key
  from_image:
    namespace: ocp
    name: "4.12"
    tag: upi-installer
  grace_period: 10m
  commands: aws-deprovision-kms-key-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: REGION
    default: ""
    documentation: Use a specific AWS region, overriding the LEASED_RESOURCE environment variable in the cluster_profile. Must match the REGION given to aws-provision-kms-key.
  documentation: |-
    Delete KMS key created by aws-provision-kms-key
    
