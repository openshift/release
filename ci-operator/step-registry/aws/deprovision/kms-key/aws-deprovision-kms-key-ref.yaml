ref:
  as: aws-deprovision-kms-key
  from_image:
    namespace: ocp
    name: "4.12"
    tag: upi-installer
  grace_period: 10m
  commands: aws-deprovision-kms-key-commands.sh
  env:
  - default: ""
    documentation: When set, overrides LEASED_RESOURCE as the AWS region. Used for
      region qualification rehearsals.
    name: AWS_REGION_OVERWRITE
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Delete KMS key created by aws-provision-kms-key
    
