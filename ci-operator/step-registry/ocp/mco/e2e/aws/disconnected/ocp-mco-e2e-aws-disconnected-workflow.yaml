workflow:
  as: ocp-mco-e2e-aws-disconnected
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: ipi-aws-pre-disconnected
    - ref: mirror-images-qe-test-images
    - ref: mco-conf-day2-disconnected-setup
    test:
    - ref: openshift-e2e-test
    post:
    - chain: gather-core-dump
    - chain: ipi-aws-post-disconnected
  documentation: |-
    MCO disconnected workflow that extends the standard AWS disconnected
    install with QE test image mirroring and ICSP/IDMS configuration.
    Mirrors quay.io/openshifttest/* images and creates the image mirror
    policy so MCO e2e tests can pull them in a disconnected cluster.
