workflow:
  as: splat-review-agent-opct-trigger
  steps:
    test:
      - ref: review-agent-trigger
    env:
      PERIODIC_JOB_NAME: "periodic-ci-redhat-openshift-ecosystem-opct-main-periodic-review-agent"
      REVIEW_AGENT_UPSTREAM_REPO: "redhat-openshift-ecosystem/opct"
  documentation: |-
    Lightweight workflow that triggers the OPCT review-agent periodic
    job via gangway instead of running the agent inline. This avoids the
    presubmit aborting when the agent pushes to the PR branch.
