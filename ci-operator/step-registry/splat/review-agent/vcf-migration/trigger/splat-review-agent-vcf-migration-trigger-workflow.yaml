workflow:
  as: splat-review-agent-vcf-migration-trigger
  steps:
    test:
      - ref: review-agent-trigger
    env:
      PERIODIC_JOB_NAME: "periodic-ci-openshift-vcf-migration-operator-main-periodic-review-agent"
      REVIEW_AGENT_UPSTREAM_REPO: "openshift/vcf-migration-operator"
  documentation: |-
    Lightweight workflow that triggers the VCF Migration Operator review-agent
    periodic job via gangway instead of running the agent inline. This avoids
    the presubmit aborting when the agent pushes to the PR branch.
