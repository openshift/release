workflow:
  as: splat-review-agent-multiarch-tuning-operator-trigger
  steps:
    test:
      - ref: review-agent-trigger
    env:
      PERIODIC_JOB_NAME: "periodic-ci-openshift-multiarch-tuning-operator-main-periodic-review-agent"
      REVIEW_AGENT_UPSTREAM_REPO: "openshift/multiarch-tuning-operator"
  documentation: |-
    Lightweight workflow that triggers the Multiarch Tuning Operator
    review-agent periodic job via gangway instead of running the agent
    inline. This avoids the presubmit aborting when the agent pushes to
    the PR branch.
