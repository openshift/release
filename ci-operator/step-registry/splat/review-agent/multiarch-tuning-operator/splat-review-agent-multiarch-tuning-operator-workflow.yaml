workflow:
  as: splat-review-agent-multiarch-tuning-operator
  steps:
    pre:
      - ref: review-agent-setup
    test:
      - ref: review-agent-process
    post:
      - ref: review-agent-report
    env:
      REVIEW_AGENT_AUTH_MODE: "pat"
      REVIEW_AGENT_FORK_ORG: "jira-solve-bot"
      REVIEW_AGENT_UPSTREAM_REPO: "openshift/multiarch-tuning-operator"
  documentation: |-
    SPLAT Multiarch Tuning Operator wrapper for the generic review-agent workflow.
    Uses PAT auth mode — auto-forks openshift/multiarch-tuning-operator
    into jira-solve-bot for push operations.

    Credentials: Uses hypershift-team-claude-prow (shared secret with gh-pat).
