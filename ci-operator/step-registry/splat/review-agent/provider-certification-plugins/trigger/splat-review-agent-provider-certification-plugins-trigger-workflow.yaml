workflow:
  as: splat-review-agent-provider-certification-plugins-trigger
  steps:
    test:
      - ref: review-agent-trigger
    env:
      PERIODIC_JOB_NAME: "periodic-ci-redhat-openshift-ecosystem-provider-certification-plugins-main-periodic-review-agent"
      REVIEW_AGENT_UPSTREAM_REPO: "redhat-openshift-ecosystem/provider-certification-plugins"
  documentation: |-
    Lightweight workflow that triggers the Provider Certification Plugins
    review-agent periodic job via gangway instead of running the agent inline.
    This avoids the presubmit aborting when the agent pushes to the PR branch.
