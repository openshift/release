workflow:
  as: splat-review-agent-provider-certification-plugins
  steps:
    pre:
      - ref: review-agent-setup
    test:
      - ref: review-agent-process
    post:
      - ref: review-agent-report
    env:
      REVIEW_AGENT_AUTH_MODE: "pat"
      REVIEW_AGENT_FORK_ORG: "jira-solve-bot"
      REVIEW_AGENT_UPSTREAM_REPO: "redhat-openshift-ecosystem/provider-certification-plugins"
  credentials:
    - namespace: test-credentials
      name: splat-jira-config
      mount_path: /var/run/claude-code-service-account
      keys:
        - jira-pat
        - jira-email
    - namespace: test-credentials
      name: splat-slack-config
      mount_path: /var/run/claude-code-service-account
      keys:
        - slack-webhook-url
  documentation: |-
    SPLAT Provider Certification Plugins wrapper for the generic review-agent workflow.
    Uses PAT auth mode — auto-forks redhat-openshift-ecosystem/provider-certification-plugins
    into jira-solve-bot for push operations.

    Credentials: Uses hypershift-team-claude-prow (shared secret with gh-pat).
