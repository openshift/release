ref:
  as: storage-conf-storageclass-pre-set-default-gcp-hyperdisk
  from: cli
  cli: latest
  commands: storage-conf-storageclass-pre-set-default-gcp-hyperdisk-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: SET_DEFAULT_HYPERDISK_STORAGECLASS
    default: "true"
    documentation: |-
      When "true" (default), create a cluster-default hyperdisk-balanced
      StorageClass and mark the GCP PD CSI driver storageClassState Unmanaged.
      Set to "false" to skip this, e.g. for N2 / Persistent Disk clusters or OCP
      releases older than 4.17 that predate GCP hyperdisk support.
  documentation: |-
    The `storage-conf-storageclass-pre-set-default-gcp-hyperdisk` step sets the cluster default storageclass to the hyperdisk one before ipi-install).
