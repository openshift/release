ref:
  as: storage-conf-storageclass-pre-set-default-gcp-hyperdisk
  from: cli
  cli: latest
  commands: storage-conf-storageclass-pre-set-default-gcp-hyperdisk-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: HYPERDISK_THROUGHPUT_STORAGECLASS
    default: "false"
    documentation: |-
      When true, also install a non-default hyperdisk-throughput StorageClass.
      The hyperdisk-balanced class remains the default.
  documentation: |-
    The `storage-conf-storageclass-pre-set-default-gcp-hyperdisk` step sets the cluster default storageclass to the hyperdisk one before ipi-install).
