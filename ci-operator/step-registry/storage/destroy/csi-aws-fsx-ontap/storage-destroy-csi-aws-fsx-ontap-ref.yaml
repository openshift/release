ref:
  as: storage-destroy-csi-aws-fsx-ontap
  from: cli
  cli: latest
  commands: storage-destroy-csi-aws-fsx-ontap-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 80m
  env:
  - name: HELM_VERSION
    default: 3.17.3
    documentation: |-
      Helm version downloaded with checksum verification when Helm is unavailable.
  documentation: |-
    Collects FSx for NetApp ONTAP and Trident diagnostics, then removes the
    Trident workloads, FSx SVM, filesystem, security group, and worker SAN
    MachineConfig created by storage-create-csi-aws-fsx-ontap. It consumes only
    non-secret resource IDs from ${SHARED_DIR} and attempts all cleanup phases
    before reporting a failure.
