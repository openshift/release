ref:
  as: storage-destroy-csi-aws-fsx-ontap
  from: upi-installer
  cli: latest
  commands: storage-destroy-csi-aws-fsx-ontap-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 4h
  documentation: |-
    Collects diagnostics and removes test PVCs, Trident, and its StorageClasses,
    then deletes the dedicated FSx data volumes without final backups, SVMs,
    filesystem, and security group. Resource IDs and the unique cluster tag
    from ${SHARED_DIR} scope AWS cleanup, including partially completed
    provisioning. FSx deletion uses stable idempotency tokens and polls until
    resources disappear. Finally removes the SAN MachineConfig and waits for
    worker rollout. The timeout allows for both OCP and AWS cleanup waits.
