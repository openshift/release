ref:
  as: storage-destroy-csi-aws-fsx-ontap
  from: upi-installer
  cli: latest
  commands: storage-destroy-csi-aws-fsx-ontap-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 80m
  documentation: |-
    Collects Trident logs and leftover OCP objects for diagnostics, then deletes
    the dedicated FSx data volumes without final backups, SVMs, filesystem, and
    security group. Resource IDs and the unique cluster tag from ${SHARED_DIR}
    scope AWS cleanup, including partially completed provisioning. OCP objects
    are left intact because the disposable cluster is destroyed next.
