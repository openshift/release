ref:
  as: storage-create-csi-aws-fsx-ontap
  from: cli
  cli: latest
  commands: storage-create-csi-aws-fsx-ontap-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 80m
  env:
  - name: FSXN_DEPLOYMENT_TYPE
    default: SINGLE_AZ_2
    documentation: |-
      FSx for NetApp ONTAP deployment type. Gen2 is required for NVMe/TCP.
  - name: FSXN_STORAGE_GIB
    default: "1024"
    documentation: |-
      FSx filesystem storage capacity in GiB.
  - name: FSXN_THROUGHPUT
    default: "384"
    documentation: |-
      Gen2 FSx throughput capacity per HA pair in MBps.
  - name: HELM_VERSION
    default: 3.17.3
    documentation: |-
      Helm version downloaded with checksum verification when Helm is unavailable.
  - name: TRIDENT_CHART_VERSION
    default: 100.2606.1
    documentation: |-
      Pinned NetApp Trident operator Helm chart version.
  documentation: |-
    Creates an FSx for NetApp ONTAP filesystem and SVM for SAN testing, prepares
    OpenShift workers for iSCSI, multipath, and NVMe/TCP, installs a pinned
    Trident operator chart, and configures unencrypted and LUKS-encrypted iSCSI
    and NVMe/TCP StorageClasses. Non-secret resource identifiers are written to
    ${SHARED_DIR} for a later cleanup step.
