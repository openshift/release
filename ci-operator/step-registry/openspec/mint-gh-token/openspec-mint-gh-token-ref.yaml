ref:
  as: openspec-mint-gh-token
  from_image:
    namespace: oape
    name: ai-e2e-agent
    tag: gh-token-minter
  commands: openspec-mint-gh-token-commands.sh
  credentials:
  - collection: oape-ai-e2e
    group: openshift-app-platform-shift-github-bot
    mount_path: /var/run/github-app
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  documentation: |-
    Mints a GitHub App installation token for openshift-app-platform-shift-github-bot
    into ${SHARED_DIR}/gh-token using the gh-token-minter image promoted from
    openshift-eng/oape-ai-e2e. Consumed by the openspec-agile-workflow and
    openspec-qe-workflow refs, which use the token (as GH_TOKEN) to fork target
    repositories and raise PRs via the gh CLI.

    The GitHub App must be installed with write access on every repository the
    workflows target.
