ref:
  as: openspec-qe-workflow
  from_image:
    namespace: oape
    name: openspec-agent
    tag: openspec-agent-worker
  commands: openspec-qe-workflow-commands.sh
  credentials:
  - collection: oape-ai-e2e
    group: oap-lts-codex-sa
    mount_path: /var/run/codex-openai-api-key
  env:
  - name: OPENAI_API_KEY_PATH
    default: /var/run/codex-openai-api-key/openai_api_key
    documentation: |-
      Path to the OpenAI API key mounted from the oap-lts-codex-sa secret.
      The runner exports it as OPENAI_API_KEY with tracing disabled.
  - name: CODEX_MODEL
    default: gpt-5.6-sol
    documentation: |-
      Codex model driving the openspec workflow.
  - name: AGENT_EFFORT
    default: ""
    documentation: |-
      Optional Codex reasoning effort (minimal, low, medium, high, xhigh, max).
  - name: CODEX_TIMEOUT_INITIAL
    default: "2700"
    documentation: |-
      Budget in seconds for the initial codex exec run.
  - name: CODEX_TIMEOUT_RESUME
    default: "1200"
    documentation: |-
      Budget in seconds for each codex exec resume round.
  - name: MAX_RESUME_ROUNDS
    default: "6"
    documentation: |-
      Maximum number of codex exec resume rounds used to push through the
      workflow approval gates before the step fails.
  timeout: 3h0m0s
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 8Gi
  documentation: |-
    Runs the openspec QE workflow (/opsx-e2e) end to end with the OpenAI
    Codex CLI: pre-analysis, test plan, consolidation, code generation, and
    execution of the generated tests against a cluster. When a cluster
    kubeconfig is present at ${SHARED_DIR}/kubeconfig (e.g. provisioned by
    the ipi-aws-pre chain), the runner exports KUBECONFIG and the workflow
    deploys the operator and runs the generated E2E tests on it. The
    generated tests are then pushed and a PR is raised from the
    openshift-app-platform-shift-github-bot fork against the target
    repository. Without a PR input (ADR/EP only, Design Mode) the workflow
    stops after code generation and raises no PR.

    Requires, in ${SHARED_DIR}:
    - params.env with PR_URL and/or ADR_URL/EP_URL, CHANGE_NAME, PHASE and
      optional MODEL/EFFORT (written by the qe-workflow-input image)
    - gh-token (minted by openspec-mint-gh-token)
    - kubeconfig (optional; from ipi-aws-pre when the job provisions a
      cluster)

    The target repository must be openspec-bootstrapped (agents.md and
    harness-evals/constitution.md at its root, ideally qe-e2e/
    qe-behaviour.md) and have the GitHub App installed; the run stops with
    a clear error otherwise.
