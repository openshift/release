workflow:
  as: rosa-seaplane-ephemeral-e2e-v2
  steps:
    allow_best_effort_post_steps: true
    pre:
    - ref: rosa-seaplane-resolve-ocp-image
    - ref: rosa-seaplane-image-push
    - ref: rosa-seaplane-provision
    test:
    - ref: rosa-seaplane-e2e-env
    - ref: rosa-seaplane-e2e-run
    post:
    - ref: rosa-seaplane-teardown
  documentation: |-
    Provisions an ephemeral rosa-seaplane environment and runs the new
    parallel e2e flow: rosa-seaplane-e2e-env resolves the environment and
    the pinned suite commits into e2e.env (readiness-gated), then
    rosa-seaplane-e2e-run checks out each suite repo at its pin — or the
    job's own source (PR merged into base) for the repo whose CI runs the
    job — and runs the selected suites in parallel via their
    ci/e2e/<suite>/run entry points, with per-suite artifacts, timeouts and
    the platform hooks (before-suites.sh / after-suites.sh).

    Component image overrides (ROSA_REGIONAL_COMPONENTS) work as in the
    v1 workflow: CI images are pushed and deep-merged into their target
    values files before provisioning.

    Usage from a CI config:
      tests:
      - as: on-demand-e2e-v2
        always_run: false
        steps:
          workflow: rosa-seaplane-ephemeral-e2e-v2
          dependencies:
            CI_IMAGE_1: <pipeline-image-name>
          env:
            ROSA_REGIONAL_COMPONENTS: |
              - image: CI_IMAGE_1
                repo: quay.io/rrp-dev-ci/<component>
                target: argocd/config/regional-cluster/<component>/values.yaml
                override:
                  <yaml-fragment-with-IMAGE_REPO-and-IMAGE_TAG-placeholders>

    E2E_SUITES selects suites (default: all registered); E2E_SUITE_ENV
    passes KEY=VALUE overrides through to the suites; E2E_SUITE_TIMEOUT
    bounds each suite. See the rosa-seaplane e2e documentation for the
    full contract.
