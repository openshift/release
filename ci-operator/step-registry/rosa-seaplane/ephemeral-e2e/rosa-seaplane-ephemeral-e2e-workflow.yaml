workflow:
  as: rosa-seaplane-ephemeral-e2e
  steps:
    allow_best_effort_post_steps: true
    pre:
    - ref: rosa-seaplane-resolve-ocp-image
    - ref: rosa-seaplane-image-push
    - ref: rosa-seaplane-provision
    test:
    - ref: rosa-seaplane-e2e
    post:
    - ref: rosa-seaplane-teardown
  documentation: |-
    Provisions an ephemeral rosa-seaplane environment with an optional
    component image override, runs e2e tests, and tears down the environment.

    When triggered from rosa-seaplane-api, the e2e step auto-detects
    the PR's fork repo and branch via the GitHub API, so test changes in the
    PR are picked up automatically (including from forks). A component can
    also set a child chart's source.targetRevision to PR_SOURCE_SHA in its
    override so Argo CD deploys the chart from the same rosa-seaplane-api
    commit as the job (the PR head, or that repo's extra_refs SHA when
    rehearsing this workflow from openshift/release). When triggered from
    rosa-seaplane itself, the environment is provisioned from the PR's
    head branch and every step runs the PR's code.

    Usage from a CI config:
      tests:
      - as: on-demand-e2e
        steps:
          workflow: rosa-seaplane-ephemeral-e2e
          dependencies:
            CI_IMAGE_1: <pipeline-image-name>
          env:
            ROSA_REGIONAL_COMPONENTS: |
              - image: CI_IMAGE_1
                repo: quay.io/rrp-dev-ci/<component>
                target: argocd/config/regional-cluster/<component>/values.yaml
                override:
                  <yaml-fragment-with-IMAGE_REPO-and-IMAGE_TAG-placeholders>

    For chart changes in the component PR, include
    `seaplane.source.targetRevision: PR_SOURCE_SHA` in the override.

    Set OCP_RELEASE_STREAM (e.g. "5.1.0-0.nightly-multi") to run against the
    latest accepted OCP payload of a release controller stream instead of the
    e2e default. See rosa-seaplane-resolve-ocp-image for the values,
    including "ocp-branch-nightly" and "ocp-branch-candidate" for repos whose
    branches track OCP versions.
