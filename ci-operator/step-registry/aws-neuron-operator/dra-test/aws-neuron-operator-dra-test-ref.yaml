ref:
  as: aws-neuron-operator-dra-test
  from: eco-gotests
  grace_period: 30m
  commands: aws-neuron-operator-dra-test-commands.sh
  timeout: 4h
  resources:
    requests:
      cpu: 2000m
      memory: 4Gi
  env:
  - name: ECO_TEST_FEATURES
    default: "neuron"
    documentation: Features to test
  - name: ECO_TEST_LABELS
    default: "neuron-dra"
    documentation: Ginkgo label query selecting the complete Neuron DRA suite
  - name: ECO_HWACCEL_NEURON_DRIVERS_IMAGE
    default: ""
    documentation: Neuron kernel module driver image
  - name: ECO_HWACCEL_NEURON_DRIVER_VERSION
    default: ""
    documentation: Neuron kernel driver version
  - name: ECO_HWACCEL_NEURON_NODE_METRICS_IMAGE
    default: ""
    documentation: Neuron node metrics exporter image
  - name: ECO_HWACCEL_NEURON_DRA_DRIVER_IMAGE
    default: ""
    documentation: Initial Neuron DRA driver image
  - name: ECO_HWACCEL_NEURON_DRA_UPGRADE_DRIVER_IMAGE
    default: ""
    documentation: Distinct target Neuron DRA driver image for ordered upgrade tests
  - name: ECO_HWACCEL_NEURON_VLLM_IMAGE
    default: ""
    documentation: Neuron-capable vLLM image used by the DRA inference scenario
  - name: ECO_HWACCEL_NEURON_MODEL_NAME
    default: "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
    documentation: HuggingFace model used by the DRA vLLM scenario
  documentation: |-
    Runs the complete AWS Neuron DRA eco-gotests suite, including allocation,
    ResourceSlice, upgrade, metrics, in-cluster build, and vLLM inference.
