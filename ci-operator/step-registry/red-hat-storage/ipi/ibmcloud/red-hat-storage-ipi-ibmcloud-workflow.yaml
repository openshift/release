workflow:
  as: red-hat-storage-ipi-ibmcloud
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: ipi-ibmcloud-pre
    post:
    - chain: red-hat-storage-ipi-ibmcloud-post
  documentation: |-
    Extension of ipi-ibmcloud for red-hat-storage IBM Cloud jobs. After gather,
    deletes InfraID-matching VPC load balancers before installer deprovision,
    as a workaround until the installer destroy pagination fix in OCPBUGS-136128
    is available in the target release.
