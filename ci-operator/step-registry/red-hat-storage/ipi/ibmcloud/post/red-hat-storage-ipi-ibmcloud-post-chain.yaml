chain:
  as: red-hat-storage-ipi-ibmcloud-post
  steps:
  - chain: gather
  - ref: red-hat-storage-cleanup-ibmcloud-load-balancers
  - ref: ipi-deprovision-deprovision
  documentation: |-
    Gather from the cluster, delete InfraID-matching IBM Cloud load balancers
    (OCPBUGS-136128 workaround), then run installer deprovision. Cleanup is
    after gather so must-gather can still reach the API.
