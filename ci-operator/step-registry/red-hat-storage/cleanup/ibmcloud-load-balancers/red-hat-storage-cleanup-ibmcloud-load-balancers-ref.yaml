ref:
  as: red-hat-storage-cleanup-ibmcloud-load-balancers
  best_effort: true
  from_image:
    namespace: ocp
    name: "4.20"
    tag: upi-installer
  grace_period: 5m
  commands: red-hat-storage-cleanup-ibmcloud-load-balancers-commands.sh
  timeout: 40m0s
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Deletes IBM Cloud VPC load balancers whose names contain the cluster infraID
    before installer deprovision. Workaround for incomplete LB discovery during
    destroy (OCPBUGS-136128) until the installer pagination fix is available in
    the target OpenShift release.
