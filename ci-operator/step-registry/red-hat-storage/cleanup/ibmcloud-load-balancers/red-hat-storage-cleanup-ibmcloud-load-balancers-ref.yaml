ref:
  as: red-hat-storage-cleanup-ibmcloud-load-balancers
  best_effort: true
  from_image:
    namespace: ocp
    name: "4.20"
    tag: upi-installer
  grace_period: 5m
  commands: red-hat-storage-cleanup-ibmcloud-load-balancers-commands.sh
  timeout: 40m0s
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Best-effort cleanup of IBM Cloud VPC load balancers whose names contain the
    cluster infraID, run after gather and before installer deprovision.
    Workaround for OCPBUGS-136128 (destroy does not paginate LB listing).
