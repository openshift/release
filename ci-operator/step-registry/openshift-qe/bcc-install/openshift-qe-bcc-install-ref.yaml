ref:
  as: openshift-qe-bcc-install
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: openshift-qe-bcc-install-commands.sh
  timeout: 30m
  grace_period: 10m
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  documentation: >-
    Installs the BGP Cloud Connector operator via an OLM Subscription
    from the redhat-operators CatalogSource. Creates the
    bgp-cloud-connector namespace, OperatorGroup, and Subscription,
    then waits for the ClusterServiceVersion to reach Succeeded and
    the controller-manager deployment to become Available.
