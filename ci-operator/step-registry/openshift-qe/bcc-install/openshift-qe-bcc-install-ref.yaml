ref:
  as: openshift-qe-bcc-install
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: BCC_BUNDLE_IMAGE
    default: "quay.io/redhat-user-workloads/bgp-cloud-connector-tenant/bgp-cloud-connector/openshift-bgp-cloud-connector-bundle:latest"
    documentation: |-
      OLM bundle image for the BGP Cloud Connector operator.
  commands: openshift-qe-bcc-install-commands.sh
  timeout: 30m
  grace_period: 10m
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  documentation: >-
    Installs the BGP Cloud Connector operator from an OLM bundle image.
    Uses oc image extract to pull bundle manifests, applies CRDs and
    ClusterServiceVersion, creates the operator namespace and OperatorGroup,
    and waits for the controller-manager deployment to become Available.
