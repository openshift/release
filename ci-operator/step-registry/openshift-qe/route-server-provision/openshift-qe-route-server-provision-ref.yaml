ref:
  as: openshift-qe-route-server-provision
  from: rosa-aws-cli
  commands: openshift-qe-route-server-provision-commands.sh
  timeout: 15m
  grace_period: 10m
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  documentation: >-
    Provisions an AWS VPC Route Server in the cluster's VPC for BGP Cloud
    Connector testing. The Route Server is created with ASN 65000, polled
    until it reaches the "available" state, and its ID is written to
    ${SHARED_DIR}/route-server-id for downstream steps. A cleanup trap
    deletes the Route Server on script exit or failure.
