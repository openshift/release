ref:
  as: openshift-qe-etcd-density-event-storm
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: E2E_VERSION
    default: "default"
    documentation: |-
      Override the e2e version
  - name: KUBE_BURNER_VERSION
    default: "default"
    documentation: |-
      Override the kube burner version
  - name: EVENT_STORM_ITERATIONS
    default: "100"
    documentation: |-
      Victim workload iterations. The victim workload is what measures the
      impact of the storm, so this sizes the measurement, not the storm.
      Prefixed so it only applies to this step and does not collide with the
      ITERATIONS consumed by other kube-burner workloads (e.g. crd-scale) that
      may be co-scheduled in the same job.
  - name: EVENT_STORM_POD_REPLICAS
    default: "3"
    documentation: |-
      Pod replicas per victim deployment. Prefixed for the same reason as
      EVENT_STORM_ITERATIONS.
  - name: EVENT_ITERATIONS
    default: "2000"
    documentation: |-
      Event creation iterations for the background storm. Total synthetic
      events is roughly EVENT_ITERATIONS * EVENT_REPLICAS.
  - name: EVENT_REPLICAS
    default: "100"
    documentation: |-
      Event replicas per iteration. Each synthetic Event is about 1 KiB.
  - name: STORM_WORKERS
    default: "20"
    documentation: |-
      Parallel workers creating the storm, via kube-burner's background hook.
  - name: STORM_DELAY
    default: "15"
    documentation: |-
      Seconds to let the storm build pressure before the victim workload
      starts, so the victim is created into an already flooded cluster rather
      than racing the flood.
  - name: KB_FLAGS
    default: ""
    documentation: |-
      Additional flags for the kube-burner command. Reused across other kube-burner based workloads
  - name: GC
    default: "true"
    documentation: |-
      Default is true, which means clean up the pod/resource that kube-burner ocp created, you can set it to false to keep the resource
  - name: GC_METRICS
    default: "false"
    documentation: |-
      Default is false, which means skip collecting metrics, you can set it to true to collect metrics.
  - name: PROFILE_TYPE
    default: "regular"
    documentation: |-
      Metrics profile type: regular, reporting, or both
  - name: METRICS_PROFILES
    default: "metrics.yml,etcd-density-metrics.yml"
    documentation: |-
      Comma separated list of metrics profiles to use
  - name: ENABLE_LOCAL_INDEX
    default: "false"
    documentation: |-
      Trigger to enable local indexing
  - name: ES_SECRETS_PATH
    default: ""
    documentation: |-
      Override elasticsearch secrets path.
  - name: USER_METADATA
    default: ""
    documentation: |-
      Arbitrary metadata provided to the kube-burner workload in YAML format
  - name: ADDITIONAL_PARAMS
    default: '{}'
    documentation: |-
      JSON value to upload additonal metadata to the fingerprint
  commands: openshift-qe-etcd-density-event-storm-commands.sh
  timeout: 13h
  credentials:
  - collection: ocp-perfscale-cpt
    group: ocp-qe-perfscale-es-creds
    mount_path: /secret
  - collection: stackrox-perfscale-elasticsearch
    group: credentials
    mount_path: /secret_stackrox
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: >-
    This step runs the etcd-density event-storm workload to stress etcd with a
    sustained flood of synthetic Event objects.


    A background job creates the storm while a concurrent victim workload runs
    against the same cluster, so what is measured is the impact of the flood on
    ordinary cluster operations rather than the flood itself. This is the
    create-heavy counterpart to crashloop-flood, which drives the same pressure
    through the PATCH path instead.


    Defaults are kube-burner-ocp's own. The OpenShift Performance and Scale
    team characterised standard against sharded etcd with
    EVENT_STORM_ITERATIONS=900 and EVENT_STORM_POD_REPLICAS=2, giving 200K
    synthetic events against a victim workload of 900 iterations, on a 24
    worker cluster.
