ref:
  as: openshift-qe-bgp-diagnostics
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: openshift-qe-bgp-diagnostics-commands.sh
  timeout: 30m
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  documentation: >-
    Captures AWS ingress load balancer public and private IPs and bastion routes.
    Saves a helper in SHARED_DIR to capture bastion routes and BGP advertisements
    after BGP setup.
