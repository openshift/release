ref:
  as: openshift-qe-set-etcd-quota
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: openshift-qe-set-etcd-quota-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: ETCD_QUOTA_BACKEND_GIB
    default: "8"
  documentation: |-
    Configure etcd storage backend quota in GiB. Accepts numeric value (e.g., 8, 16, 32).
    Default is 8 GiB (8589934592 bytes). Automatically calculates bytes and waits for
    etcd pods to rollout after applying the change.
