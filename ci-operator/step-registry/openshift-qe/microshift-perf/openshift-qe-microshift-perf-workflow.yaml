workflow:
  as: openshift-qe-microshift-perf
  steps:
    cluster_profile: metal-perfscale-selfsched
    env:
      MODEL: R640
      NUM_SERVERS: '1'
      NUM_NODES: '1'
      PROMETHEUS_LOGGING: 'true'
      PERF_CYCLE: 'true'
      NETPERF_STAGE_ONLY: 'true'
    pre:
    - ref: openshift-qe-microshift-perf-init
    - ref: openshift-qe-microshift-netperf
    - ref: openshift-qe-installer-bm-self-sched
    - ref: openshift-qe-installer-bm-ping
    test:
    - chain: openshift-qe-microshift-perf
    post:
    - ref: openshift-qe-microshift-perf-cleanup
    - ref: openshift-qe-installer-bm-self-sched-terminate
  documentation: 'Optional MicroShift Perf/Scale cycle: one Scale Lab R640, fresh installs, 5s Prometheus windows,
    two QPS sweeps and pod-network measurements. Always preserves local iteration bundles; ES is optional.'
