ref:
  as: openshift-qe-bgp-teardown
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  best_effort: true
  commands: openshift-qe-bgp-teardown-commands.sh
  timeout: 30m
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  documentation: >-
    Tears down BGP/FRR artifacts left on the bare-metal bastion after the
    network-workloads job. Stops the external FRR container, removes dummy
    interfaces, clears stale BGP routes, and runs the EVPN VRF cleanup script
    if present. Intended to run in the post phase so cleanup always executes.
    AWS bastions do not need this step because they are dismantled after the job.
