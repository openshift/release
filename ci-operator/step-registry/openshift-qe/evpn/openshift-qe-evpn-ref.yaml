ref:
  as: openshift-qe-evpn
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: E2E_VERSION
    default: "default"
    documentation: |-
      Override the e2e-benchmarking version. Use "default" for the latest tag.
  - name: SCENARIO
    default: "east-west"
    documentation: |-
      EVPN test scenario to run. Passed to the workload to select the test configuration.
  - name: ITERATIONS
    default: "72"
    documentation: |-
      Iteration/CUDN count for the EVPN kube-burner workload.
  - name: EXTERNAL_WEBSERVER_IP
    default: "172.27.187.82"
    documentation: |-
      External webserver anycast IP passed to the EVPN workload as --external-webserver-ip
  - name: EXTRA_FLAGS
    default: " --external-webserver-port=80 --alerting=false"
    documentation: |-
      Additional flags to pass to the workload run script
  - name: PROFILE_TYPE
    default: "both"
    documentation: |-
      Kube-burner indexing profile type
  - name: GC
    default: "true"
    documentation: |-
      Clean up the resources created by the workload after the run
  - name: ENABLE_LOCAL_INDEX
    default: "false"
    documentation: |-
      Trigger to enable local indexing
  - name: ES_SECRETS_PATH
    default: ""
    documentation: |-
      Override elasticsearch secrets path
  - name: ADDITIONAL_PARAMS
    default: '{}'
    documentation: |-
      JSON value to upload additional metadata to the fingerprint
  commands: openshift-qe-evpn-commands.sh
  timeout: 6h
  credentials:
  - collection: ocp-perfscale-cpt
    group: ocp-qe-perfscale-es-creds
    mount_path: /secret
  - collection: stackrox-perfscale-elasticsearch
    group: credentials
    mount_path: /secret_stackrox
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  documentation: >-
    This step runs the perfscale EVPN e2e test using e2e-benchmarking from the CI pod.
    Requires openshift-qe-bgp-setup-evpn to run first. Use the SCENARIO env var to
    select different EVPN test scenarios from the CI config.
