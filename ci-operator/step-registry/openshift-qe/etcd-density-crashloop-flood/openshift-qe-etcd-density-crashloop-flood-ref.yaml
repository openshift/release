ref:
  as: openshift-qe-etcd-density-crashloop-flood
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: E2E_VERSION
    default: "default"
    documentation: |-
      Override the e2e version
  - name: KUBE_BURNER_VERSION
    default: "default"
    documentation: |-
      Override the kube burner version
  - name: CRASHLOOP_FLOOD_ITERATIONS
    default: "20"
    documentation: |-
      Number of namespaces to create crashlooping pods in. Prefixed so it only
      applies to this step and does not collide with the ITERATIONS consumed by
      other kube-burner workloads (e.g. crd-scale) that may be co-scheduled in
      the same job.
  - name: CRASHLOOP_REPLICAS
    default: "100"
    documentation: |-
      Crashlooping pods per iteration. Each pod runs "exit 1" with
      restartPolicy: Always, so it emits roughly 6 events per crash cycle
      (Scheduled, Pulling, Pulled, Created, Started, BackOff) continuously.
  - name: SOAK_DURATION
    default: "30m"
    documentation: |-
      How long to let events accumulate after the pods are created. This is the
      measurement window: the pods are only there to keep producing events.
  - name: KB_FLAGS
    default: ""
    documentation: |-
      Additional flags for the kube-burner command. Reused across other kube-burner based workloads
  - name: GC
    default: "true"
    documentation: |-
      Default is true, which means clean up the pod/resource that kube-burner ocp created, you can set it to false to keep the resource
  - name: GC_METRICS
    default: "false"
    documentation: |-
      Default is false, which means skip collecting metrics, you can set it to true to collect metrics.
  - name: PROFILE_TYPE
    default: "regular"
    documentation: |-
      Metrics profile type: regular, reporting, or both
  - name: METRICS_PROFILES
    default: "metrics.yml,etcd-density-metrics.yml"
    documentation: |-
      Comma separated list of metrics profiles to use
  - name: ENABLE_LOCAL_INDEX
    default: "false"
    documentation: |-
      Trigger to enable local indexing
  - name: ES_SECRETS_PATH
    default: ""
    documentation: |-
      Override elasticsearch secrets path.
  - name: USER_METADATA
    default: ""
    documentation: |-
      Arbitrary metadata provided to the kube-burner workload in YAML format
  - name: ADDITIONAL_PARAMS
    default: '{}'
    documentation: |-
      JSON value to upload additonal metadata to the fingerprint
  commands: openshift-qe-etcd-density-crashloop-flood-commands.sh
  timeout: 13h
  credentials:
  - collection: ocp-perfscale-cpt
    group: ocp-qe-perfscale-es-creds
    mount_path: /secret
  - collection: stackrox-perfscale-elasticsearch
    group: credentials
    mount_path: /secret_stackrox
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: >-
    This step runs the etcd-density crashloop-flood workload to stress etcd with
    realistic event pressure from crashlooping pods.


    Unlike event-storm, which creates synthetic Event objects, this deploys pods
    that actually crash and so generates events from kubelet, scheduler and
    controller sources at once. That exercises the count-increment (PATCH) path
    for keys that already exist, a different etcd mvcc profile from creates, and
    the shape most real-world event storms take.


    Defaults are kube-burner-ocp's own. The OpenShift Performance and Scale team
    characterised standard against sharded etcd with
    CRASHLOOP_FLOOD_ITERATIONS=20 and SOAK_DURATION=10m on a 24 worker cluster.
