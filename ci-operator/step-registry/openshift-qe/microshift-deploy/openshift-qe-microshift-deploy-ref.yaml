ref:
  as: openshift-qe-microshift-deploy
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  commands: openshift-qe-microshift-deploy-commands.sh
  credentials:
  - collection: redhat-et
    group: microshift-rhsm-creds
    mount_path: /var/run/rhsm
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
    - name: MICROSHIFT_BRANCH
      default: "main"
      documentation: |-
        MicroShift git branch or tag whose ansible automation deploys the
        hosts. With BUILD_FROM_PR this selects only the automation; the
        MicroShift code under test comes from the pull request.
    - name: MICROSHIFT_PR
      default: ""
      documentation: |-
        If defined, use a specific MicroShift PR. When defined, MICROSHIFT_BRANCH gets ignored.
    - name: BUILD_FROM_PR
      default: "false"
      documentation: |-
        Build and install MicroShift from the raw head of the pull request
        under test (PULL_PULL_SHA, not the merge onto the target branch)
        instead of released packages. Requires a MicroShift presubmit
        context (REPO_NAME=microshift) with PULL_NUMBER and PULL_PULL_SHA
        set. The target product stream is derived from the pull request's
        Makefile.version file and the ansible manage-repos role selects
        matching dependency repositories.
    - name: ANSIBLE_PLAYBOOK
      default: "setup-node.yml"
      documentation: |-
        Name of the ansible playbook to run from the microshift/ansible directory
    - name: ANSIBLE_INVENTORY
      default: "inventory/inventory"
      documentation: |-
        Path to the ansible inventory file relative to microshift/ansible directory
    - name: NUM_NODES
      default: "1"
      documentation: |-
        Number of nodes to deploy MicroShift on
    - name: MICROSHIFT_VERSION
      default: ""
      documentation: |-
        MicroShift version to install
    - name: SETUP_MICROSHIFT_HOST
      default: "true"
      documentation: |-
        Prepare the host for MicroShift installation
    - name: INSTALL_MICROSHIFT
      default: "true"
      documentation: |-
        Install MicroShift packages
    - name: MANAGE_REPOS
      default: "true"
      documentation: |-
        Configure package repositories for MicroShift
    - name: PROMETHEUS_LOGGING
      default: "true"
      documentation: |-
        Enable Prometheus logging
    - name: VG_NAME
      default: "microshift"
      documentation: |-
        LVM volume group name for MicroShift storage
    - name: LVM_DISK
      default: "/dev/sdb"
      documentation: |-
        Disk to use for LVM volume group creation
