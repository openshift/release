ref:
  as: openshift-qe-cudn-density-midterm-collect-logs
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: CLIENT_APP_LABEL
    default: "app=client"
    documentation: Label selector for client pods
  commands: openshift-qe-cudn-density-midterm-collect-logs-commands.sh
  timeout: 60m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: >-
    Collects all metrics and logs after midterm cudn-density test:
    NBDB/SBDB files, OVS logs, nre poll intervals, macbindings,
    client pod logs, pod ready latency, must-gather network logs.
    All artifacts uploaded to Prow GCS artifacts directory.
