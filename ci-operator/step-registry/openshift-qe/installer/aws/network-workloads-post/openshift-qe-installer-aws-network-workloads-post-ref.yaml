ref:
  as: openshift-qe-installer-aws-network-workloads-post
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: openshift-qe-installer-aws-network-workloads-post-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  best_effort: true
  timeout: 30m
  documentation: >-
    Cleans up the AWS EC2 bastion instance and SSH key pair created by
    openshift-qe-installer-aws-network-workloads. Reads resource IDs
    from SHARED_DIR/evpn-bastion-resources.json.
