workflow:
  as: openshift-qe-installer-ibmcloud-ipi-private-ovn
  steps:
    pre:
    - ref: ibmcloud-provision-resourcegroup
    - ref: ibmcloud-provision-vpc
    - chain: ibmcloud-provision-bastionhost
    - ref: proxy-config-generate
    - chain: ipi-conf-ibmcloud
    - ref: ipi-conf-ibmcloud-provisionednetwork
    - ref: ovn-conf
    - chain: ipi-install
    - chain: create-infra-move-ingress-monitoring-registry
    post:
    - ref: ibmcloud-deprovision-bastionhost
    - chain: ipi-deprovision
    env:
      BASE_DOMAIN: "ibmcloud-perfscale-private.private-cloud.com"
      IBMCLOUD_DNS_INSTANCE_NAME: "ibmcloud-perfscale-private"
      PUBLISH: "Internal"
  documentation: |-
    IBMCloud IPI Private OVN provision and deprovision workflow with bastion host.
    Uses PUBLISH: Internal to create a private cluster with IBM Cloud DNS Services
    (no CIS required). A bastion host with Squid proxy provides external access
    to the private cluster API. Includes creating infra nodes and moving ingress,
    monitoring, and registry to infra nodes.
