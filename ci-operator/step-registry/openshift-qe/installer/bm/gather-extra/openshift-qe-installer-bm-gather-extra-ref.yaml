ref:
  as: openshift-qe-installer-bm-gather-extra
  best_effort: true
  optional_on_success: true
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: openshift-qe-installer-bm-gather-extra-commands.sh
  resources:
