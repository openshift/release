ref:
  as: openshift-qe-installer-bm-day2-nmstate
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: openshift-qe-installer-bm-day2-nmstate-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
    - name: OPERATOR_SOURCE_INDEX
      default: "redhat-operators"
      documentation: |-
        Operator source index will be "redhat-operators" for GA builds and "prega-operator-index" for Dev builds (nightly)
    - name: NMSTATE_CHANNEL
      default: "stable"
      documentation: |-
        Channel from which to install kubernetes-nmstate-operator
  documentation: |-
    Install kubernetes-nmstate-operator from OperatorHub (redhat-operators or
    prega-operator-index) and create the NMState instance required by
    NodeNetworkConfigurationPolicy. For nightly clusters, run
    openshift-qe-installer-bm-day2-prega-operators first and set
    OPERATOR_SOURCE_INDEX=prega-operator-index.
