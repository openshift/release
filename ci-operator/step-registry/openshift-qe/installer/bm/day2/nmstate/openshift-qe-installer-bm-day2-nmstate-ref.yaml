ref:
  as: openshift-qe-installer-bm-day2-nmstate
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: openshift-qe-installer-bm-day2-nmstate-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
    - name: NMSTATE_CHANNEL
      default: "stable"
      documentation: |-
        Channel from which to install kubernetes-nmstate-operator from the ART nightly index
    - name: NMSTATE_CATALOG_IMAGE
      default: ""
      documentation: |-
        CatalogSource image for ART operators. If empty, uses
        quay.io/openshift-release-dev/ocp-release-nightly:iib-int-index-art-operators-<cluster-version>
  documentation: |-
    Install kubernetes-nmstate-operator on a bare-metal nightly cluster from the
    public ART operators index (same catalog as kubernetes-nmstate's
    ocp-install-nightly-art-operators.sh, without Brew employee tokens), then
    create the NMState instance required by NodeNetworkConfigurationPolicy.
