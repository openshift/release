ref:
  as: openshift-qe-rhoso-nfv-e2e-lifecycle
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  commands: openshift-qe-rhoso-nfv-e2e-lifecycle-commands.sh
  grace_period: 15m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Generates the shared NFV E2E lifecycle helper in SHARED_DIR. The helper
    owns one deployment or Crucible run through a detached bastion supervisor,
    lease heartbeats, bounded cleanup, and sanitized recovery evidence.
