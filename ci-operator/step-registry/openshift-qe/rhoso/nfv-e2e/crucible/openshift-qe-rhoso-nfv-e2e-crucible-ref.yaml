ref:
  as: openshift-qe-rhoso-nfv-e2e-crucible
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  env:
  - name: SCENARIO
    default: "sriov"
    documentation: |-
      NFV scenario. The default is sriov.
  - name: EDPM_HOST
    default: "nfv-intel-11"
    documentation: |-
      EDPM compute node hostname passed to the Crucible workload.
  - name: TIMEOUT_CRUCIBLE
    default: "25200"
    documentation: |-
      Crucible workload timeout in seconds. The default is seven hours.
  - name: FRAME_SIZES
    default: "64,128,256,512"
    documentation: |-
      Comma-separated traffic frame sizes in bytes.
  commands: openshift-qe-rhoso-nfv-e2e-crucible-commands.sh
  timeout: 8h0m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Runs the Crucible trafficgen workload after NFV E2E deployment.
    Uses a two-hop SSH path and targets the configured EDPM host with
    the requested frame sizes.
