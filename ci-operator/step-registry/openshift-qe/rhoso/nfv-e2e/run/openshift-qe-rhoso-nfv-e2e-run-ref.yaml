ref:
  as: openshift-qe-rhoso-nfv-e2e-run
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  env:
  - name: SCENARIO
    default: "sriov"
    documentation: |-
      NFV scenario: sriov or ovs-dpdk.
  - name: EDPM_HOST
    default: "nfv-intel-11"
    documentation: |-
      EDPM compute node hostname passed via --edpm-host CLI flag.
  commands: openshift-qe-rhoso-nfv-e2e-run-commands.sh
  timeout: 12h0m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Runs the full NFV E2E pipeline (cleanup, deploy, tune, crucible)
    in a single invocation via make e2e with CLEAN_FIRST=1. Uses 2-hop
    SSH: Prow pod -> jumphost -> zuul@automation-host. The EDPM host
    is selected via --edpm-host CLI flag passed through E2E_EXTRA.
