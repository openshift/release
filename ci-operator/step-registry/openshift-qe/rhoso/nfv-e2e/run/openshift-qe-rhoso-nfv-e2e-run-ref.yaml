ref:
  as: openshift-qe-rhoso-nfv-e2e-run
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  env:
  - name: SCENARIO
    default: "sriov"
    documentation: |-
      NFV scenario: sriov or ovs-dpdk.
  - name: EDPM_HOST
    default: "nfv-intel-11"
    documentation: |-
      EDPM compute node hostname passed via --edpm-host CLI flag.
  commands: openshift-qe-rhoso-nfv-e2e-run-commands.sh
  timeout: 12h0m0s
  grace_period: 15m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Runs the NFV E2E cleanup, deployment, and tuning stages while
    skipping the Crucible workload. Uses make e2e with CLEAN_FIRST=1
    and a 2-hop SSH path: Prow pod -> jumphost -> zuul@automation-host.
    The workload workspace is /home/zuul/netperf-rhoso18-nfv-e2e-validation,
    LAB_ENV is /home/zuul/nfv-e2e/lab-init.env, and the lifecycle
    controller account is nfvcpt with state under /var/lib/nfv-e2e/lifecycle.
