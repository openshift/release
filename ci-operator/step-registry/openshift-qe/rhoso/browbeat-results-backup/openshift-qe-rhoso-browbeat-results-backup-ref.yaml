ref:
  as: openshift-qe-rhoso-browbeat-results-backup
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: RESULTS_DIR
    default: "browbeat/results"
    documentation: |-
      Path on the bastion to the results directory to back up to NFS.
      Default: browbeat/results. For dataplane automation use:
      rhoso-octavia-dataplane-performance/results
  commands: openshift-qe-rhoso-browbeat-results-backup-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
