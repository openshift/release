ref:
  as: openshift-qe-rhoso-octavia-dataplane-automation-cleanup
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: openshift-qe-rhoso-octavia-dataplane-automation-cleanup-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Tears down all OpenStack resources created by the install step
    (VMs, networks, load balancers, flavors, AZs, certs, etc.)
    by running cleanup-infrastructure.yaml from the
    rhoso-octavia-dataplane-performance repo.
