ref:
  as: openshift-qe-rhoso-octavia-dataplane-automation-run
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: DATAPLANE_TAGS
    default: "amphora-http"
    documentation: |-
      Comma-separated Ansible tags to select which workloads to run.
      Default: amphora-http. Add more as needed (e.g., amphora-http,amphora-tcp).
  - name: PAYLOAD_SIZES
    default: "0b-keepalive,0b-nokeepalive,1k"
    documentation: |-
      Comma-separated payload sizes to run for each workload.
      Full set: 0b-keepalive, 0b-nokeepalive, 128b, 1k, 10k, 128k, 512k, 1m.
  commands: openshift-qe-rhoso-octavia-dataplane-automation-run-commands.sh
  timeout: 4h0m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
