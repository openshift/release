ref:
  as: openshift-qe-rhoso-octavia-dataplane-automation-install
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: CLIENT_VM_VCPUS
    default: "4"
    documentation: |-
      vCPU count for the client VM.
  - name: MEMBER_VM_VCPUS
    default: "4"
    documentation: |-
      vCPU count for each member VM.
  commands: openshift-qe-rhoso-octavia-dataplane-automation-install-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
