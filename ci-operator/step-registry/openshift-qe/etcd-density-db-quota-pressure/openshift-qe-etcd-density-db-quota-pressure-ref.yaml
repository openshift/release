ref:
  as: openshift-qe-etcd-density-db-quota-pressure
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: E2E_VERSION
    default: "default"
    documentation: |-
      Override the e2e version
  - name: KUBE_BURNER_VERSION
    default: "default"
    documentation: |-
      Override the kube burner version
  - name: DB_QUOTA_ITERATIONS
    default: "100"
    documentation: |-
      Number of iterations. Prefixed so it only applies to this step and does not
      collide with the ITERATIONS consumed by other kube-burner workloads (e.g. crd-scale)
      that may be co-scheduled in the same job.
  - name: DB_QUOTA_ITERATIONS_PER_NAMESPACE
    default: "1"
    documentation: |-
      Number of iterations per namespace. Prefixed for the same reason as DB_QUOTA_ITERATIONS.
  - name: KB_CHUNKS
    default: "8"
    documentation: |-
      Number of chunks for kube-burner
  - name: KB_SIZE
    default: "10"
    documentation: |-
      Size of each chunk in KB (10 or 100)
  - name: KB_FLAGS
    default: ""
    documentation: |-
      Additional flags for the kube-burner command. Reused across other kube-burner based workloads
  - name: GC
    default: "false"
    documentation: |-
      Garbage collection of the resources kube-burner creates. Defaults to false
      for this workload only: db-quota-pressure must retain the objects it creates
      so etcd stays under storage pressure. This is scoped to this step, so
      co-scheduled workloads (e.g. cluster-density-v2) keep their own GC default.
  - name: GC_METRICS
    default: "false"
    documentation: |-
      Default is false, which means skip collecting metrics, you can set it to true to collect metrics.
  - name: PROFILE_TYPE
    default: "regular"
    documentation: |-
      Metrics profile type: regular, reporting, or both
  - name: METRICS_PROFILES
    default: "metrics.yml,etcd-density-metrics.yml"
    documentation: |-
      Comma separated list of metrics profiles to use
  - name: ENABLE_LOCAL_INDEX
    default: "false"
    documentation: |-
      Trigger to enable local indexing
  - name: ES_SECRETS_PATH
    default: ""
    documentation: |-
      Override elasticsearch secrets path.
  - name: USER_METADATA
    default: ""
    documentation: |-
      Arbitrary metadata provided to the kube-burner workload in YAML format
  - name: ADDITIONAL_PARAMS
    default: '{}'
    documentation: |-
      JSON value to upload additonal metadata to the fingerprint
  commands: openshift-qe-etcd-density-db-quota-pressure-commands.sh
  timeout: 13h
  credentials:
  - collection: ocp-perfscale-cpt
    group: ocp-qe-perfscale-es-creds
    mount_path: /secret
  - collection: stackrox-perfscale-elasticsearch
    group: credentials
    mount_path: /secret_stackrox
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: >-
    This step runs the etcd-density db-quota-pressure workload to stress etcd storage quota with large CRD fills
