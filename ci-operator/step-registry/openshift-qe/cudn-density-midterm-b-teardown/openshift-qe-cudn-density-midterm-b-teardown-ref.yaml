ref:
  as: openshift-qe-cudn-density-midterm-b-teardown
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: AWS_REGION
    default: "us-east-2"
    documentation: AWS region matching cluster deployment
  commands: openshift-qe-cudn-density-midterm-b-teardown-commands.sh
  timeout: 10m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: >-
    Post-step for Scenario B: terminates external EC2 instance and deletes key pair
    created by openshift-qe-cudn-density-midterm-b-setup.
