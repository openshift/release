ref:
  as: openshift-qe-perfscale-azu-data-path-nsg
  from_image:
    namespace: ocp
    name: "4.13"
    tag: upi-installer
  grace_period: 10m
  commands: openshift-qe-perfscale-azu-data-path-nsg-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  timeout: 2h0m0s
  documentation: |-
    Update Azure security groups to allow the port range used by data-path tests.
    Supports classic Azure clusters and ARO HCP clusters. For ARO HCP, the
    customer resource group and NSG are read from SHARED_DIR/aro-hcp.env.
