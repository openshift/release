ref:
  as: openshift-qe-cudn-density-midterm-b
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: ITERATIONS
    default: "200"
    documentation: Number of CUDNs to create
  - name: QPS
    default: "5"
    documentation: kube-burner QPS
  - name: BURST
    default: "5"
    documentation: kube-burner burst
  - name: TIMEOUT
    default: "1h"
    documentation: kube-burner timeout
  - name: ES_SECRETS_PATH
    default: "/secret"
    documentation: Path to elasticsearch credentials secret mount
  - name: ES_INDEX
    default: "ripsaw-kube-burner"
    documentation: Elasticsearch index name
  - name: GC
    default: "false"
    documentation: Enable garbage collection after run
  commands: openshift-qe-cudn-density-midterm-b-commands.sh
  timeout: 3h
  credentials:
  - collection: ocp-perfscale-cpt
    group: ocp-qe-perfscale-es-creds
    mount_path: /secret
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: >-
    Runs Scenario B (external IP + NodePort) of the UDN macbinding midterm test.
    Uses midterm_scenario_b branch of kube-burner-ocp. Requires
    openshift-qe-cudn-density-midterm-b-setup to run first (pre-step).
