ref:
  as: openshift-qe-cudn-density-midterm-b-aws-teardown
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: AWS_REGION
    default: "us-east-2"
    documentation: AWS region (overridden at runtime from cluster infra CR)
  commands: openshift-qe-cudn-density-midterm-b-aws-teardown-commands.sh
  timeout: 10m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: >-
    Terminates the external EC2 instance created by the midterm Scenario B test.
    Reads instance ID from SHARED_DIR and waits for full termination before
    cluster teardown removes VPC/subnet/security group resources.
