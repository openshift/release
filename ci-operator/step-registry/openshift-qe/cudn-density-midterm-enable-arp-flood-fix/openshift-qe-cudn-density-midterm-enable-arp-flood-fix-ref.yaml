ref:
  as: openshift-qe-cudn-density-midterm-enable-arp-flood-fix
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: openshift-qe-cudn-density-midterm-enable-arp-flood-fix-commands.sh
  timeout: 15m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: >-
    Enables disable-udn-arp-ndp-flood feature for UDN macbinding midterm testing.
    Applies the ovn-kubernetes-config-overrides ConfigMap to openshift-network-operator
    and waits for ovnkube-node rollout. Used for post-merge testing where the fix
    is already in the OVN-K binary — no custom image override needed.
