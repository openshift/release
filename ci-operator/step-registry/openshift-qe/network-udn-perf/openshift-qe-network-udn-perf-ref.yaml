ref:
  as: openshift-qe-network-udn-perf
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: E2E_VERSION
    default: "default"
    documentation: |-
      Override the e2e version
  - name: NETPERF_VERSION
    default: "default"
    documentation: |-
      Override the k8s netperf
  - name: VM
    default: "true"
    documentation:
      To run netperf on VMs
  - name: POD
    default: "true"
    documentation:
      To run netperf on pod
  - name: USE_VIRTCTL
    default: "true"
    documentation:
      To use virtctl to connect to the VM, instead of ssh
  - name: TOLERANCE
    default: "90"
    documentation: |-
      Tolerance of delta from hostNetwork to podNetwork - single stream
  - name: EXTERNAL_SERVER_ADDRESS
    default: ""
    documentation: |-
      External netserver address hosted on bastion node
  - name: ES_METADATA_INDEX
    default: "perf_scale_ci"
    documentation: |-
      Elasticsearch metadata index
  - name: LOCAL
    default: "false"
    documentation: |-
      Run network performance tests with Server-Pods/Client-Pods on the same Node
  - name: WORKLOAD
    default: "no-svc-run.yaml"
    documentation: |-
      The workload to run, defaults to no-svc-run.yaml
  - name: UDNL2
    default: "true"
    documentation:
      To run netperf on UDN L2 - with l2bridge 
  - name: UDNL3
    default: "false"
    documentation:
      To run netperf on UDN L3
  - name: ADDITIONAL_PARAMS
    default: '{}'
    documentation: |-
      JSON value to upload additonal metadata to the fingerprint
  - name: CLEAN_UP
    default: "true"
    documentation: |-
      Clean up the test namespace before and after the test. Defaults to true.
  commands: openshift-qe-network-udn-perf-commands.sh
  timeout: 4h
  credentials:
  - collection: ocp-perfscale-cpt
    group: ocp-qe-perfscale-es-creds
    mount_path: /secret
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: >-
    This step runs the perfscale network-perf workload in the deployed cluster
