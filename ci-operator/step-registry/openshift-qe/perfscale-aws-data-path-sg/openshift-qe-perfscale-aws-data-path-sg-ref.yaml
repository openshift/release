ref:
  as: openshift-qe-perfscale-aws-data-path-sg
  from_image:
    namespace: ci
    name: rosa-aws-cli
    tag: latest
  grace_period: 10m
  commands: openshift-qe-perfscale-aws-data-path-sg-commands.sh
  env:
  - name: REGION
    default: ""
    documentation: Use a specific AWS region, overriding the LEASED_RESOURCE environment variable in the cluster_profile.
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  timeout: 2h0m0s
  documentation: |-
    Update AWS security groups to allow set of port ranges for data-path tests.
