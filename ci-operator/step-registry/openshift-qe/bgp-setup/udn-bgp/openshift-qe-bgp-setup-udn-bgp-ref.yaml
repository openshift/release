ref:
  as: openshift-qe-bgp-setup-udn-bgp
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: NETWORK_WORKLOAD
    default: "udn-bgp"
    documentation: |-
      Workload selector for BGP setup branching.
  - name: UDN_BGP_IMPORT_CIDR
    # Default covers the workload's connected /24s generated at:
    # https://github.com/kube-burner/kube-burner-ocp/blob/bcabb38456b9c8819382f4a5d01e3faaa80d283c/pkg/measurements/routeadvertisement-latency_linux.go#L614-L620
    # The UDN-BGP profile sets 10 interfaces and 20 addresses each:
    # https://github.com/kube-burner/kube-burner-ocp/blob/bcabb38456b9c8819382f4a5d01e3faaa80d283c/cmd/config/udn-bgp/udn-bgp.yml#L118-L119
    default: "20.0.0.0/12"
    documentation: |-
      IPv4 range whose connected /24 routes the external FRR may advertise
      to the cluster for the UDN-BGP route import test.
  commands: openshift-qe-bgp-setup-udn-bgp-commands.sh
  timeout: 2h
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  documentation: >-
    BGP/FRR bastion setup for the UDN-BGP perfscale workload. Configures external
    FRR on the bastion and writes the peer address to SHARED_DIR for kube-burner.
