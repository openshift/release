ref:
  as: openshift-qe-bgp-setup-udn-bgp
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  env:
  - name: NETWORK_WORKLOAD
    default: "udn-bgp"
    documentation: |-
      Workload selector for BGP setup branching.
  commands: openshift-qe-bgp-setup-udn-bgp-commands.sh
  timeout: 2h
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  documentation: >-
    BGP/FRR bastion setup for the UDN-BGP perfscale workload. Configures external
    FRR on the bastion and writes the peer address to SHARED_DIR for kube-burner.
