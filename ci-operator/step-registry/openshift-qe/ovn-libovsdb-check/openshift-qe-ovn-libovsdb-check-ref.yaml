ref:
  as: openshift-qe-ovn-libovsdb-check
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: openshift-qe-ovn-libovsdb-check-commands.sh
  env:
  - name: MAX_PODS
    default: "500"
    documentation: |-
      Expected maxPods value on worker nodes. Used to verify MCP rollout
      completed before the workload runs.
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Pre-check for OCPBUGS-98252 verification. Captures OVN-K image version,
    checks for libovsdb migration presence, verifies maxPods capacity on
    workers, waits for MCP rollout if needed, and records baseline ovs-vsctl
    process count and ovnkube-controller CPU before the workload runs.
