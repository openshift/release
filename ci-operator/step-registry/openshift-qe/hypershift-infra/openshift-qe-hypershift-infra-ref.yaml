ref:
  as: openshift-qe-hypershift-infra
  from: rosa-aws-cli
  grace_period: 10m
  commands: openshift-qe-hypershift-infra-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  env:
  - name: OCM_LOGIN_ENV
    default: "staging"
    documentation: The environment for rosa login. The supported values are [production, staging, integration].
  - name: READY_WAIT_TIMEOUT
    default: "30m"
    documentation: Maximum time to wait for the requested infra nodes to become Ready.
  - name: MP_REPLICAS
    default: "0"
    documentation: Number of Infra nodes to provision.
  - name: OC_MAX_RETRIES
    default: "5"
    documentation: Maximum number of retries for transient OpenShift API failures.
  - name: OC_RETRY_WAIT
    default: "10"
    documentation: Seconds to wait between retries of OpenShift API calls.
  documentation: |-
    Add extra machinepool to ROSA Hypershift cluster for Infra nodes.
