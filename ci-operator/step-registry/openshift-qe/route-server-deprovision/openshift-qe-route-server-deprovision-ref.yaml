ref:
  as: openshift-qe-route-server-deprovision
  best_effort: true
  from: rosa-aws-cli
  commands: openshift-qe-route-server-deprovision-commands.sh
  timeout: 10m
  grace_period: 5m
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
  documentation: >-
    Deprovisions an AWS VPC Route Server that was previously created by the
    openshift-qe-route-server-provision step. Reads the Route Server ID from
    ${SHARED_DIR}/route-server-id, deletes it, and waits for the resource to
    be fully removed. Handles errors gracefully so the rest of the post chain
    can continue even if the Route Server was already deleted.
