ref:
  as: openshift-qe-ovs-veth-filter-deploy
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: openshift-qe-ovs-veth-filter-deploy-commands.sh
  timeout: 45m
  env:
  - name: OVS_VETH_FILTER_REPO
    default: https://github.com/kyrtapz/release.git
    documentation: Repository containing the experimental BPF assets.
  - name: OVS_VETH_FILTER_REF
    default: codex/ovs-veth-bpf-cudn-ci
    documentation: Branch or tag containing the experimental BPF assets.
  - name: OVS_VETH_FILTER_SETTLE_SECONDS
    default: "60"
    documentation: Seconds to wait before verifying that every filter targets OVS.
  - name: OVS_PERF_NODE_COUNT
    default: "4"
    documentation: Number of zone-spread workers on which to record ovs-vswitchd perf data.
  - name: OVS_PERF_DURATION_SECONDS
    default: "2700"
    documentation: Maximum duration of each ovs-vswitchd perf recording.
  - name: OVS_PERF_FREQUENCY
    default: "19"
    documentation: Software CPU-clock samples per second for each selected worker.
  - name: OVS_PERF_STACK_BYTES
    default: "2048"
    documentation: User stack bytes captured per sample for DWARF unwinding.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: >-
    Builds and deploys the experimental OVS veth netlink BPF filter on workers.
