ref:
  as: openshift-qe-ovs-veth-filter-gather
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: openshift-qe-ovs-veth-filter-gather-commands.sh
  timeout: 15m
  best_effort: true
  optional_on_success: false
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: >-
    Collects experimental BPF counters and OVS coverage, then removes the filter.
