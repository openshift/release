ref:
  as: openshift-qe-provision-etcd-on-new-disk
  from_image:
    namespace: ocp
    name: cli
    tag: latest
  commands: openshift-qe-provision-etcd-on-new-disk-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 2h0m0s
  documentation: |-
    This step configures etcd to run on a separate disk using MachineConfig.
    It assumes an extra blank disk has already been attached to the control
    plane nodes (e.g. via storage-create-aws-extra-disks). The step discovers
    the blank disk, formats it as XFS, mounts it at /var/lib/etcd, and migrates
    existing etcd data.
