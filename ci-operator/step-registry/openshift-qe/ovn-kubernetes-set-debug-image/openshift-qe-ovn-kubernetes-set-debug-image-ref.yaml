ref:
  as: openshift-qe-ovn-kubernetes-set-debug-image
  from: src
  cli: latest
  commands: openshift-qe-ovn-kubernetes-set-debug-image-commands.sh
  dependencies:
  - name: ovn-kubernetes-debug
    env: OVN_KUBERNETES_DEBUG_IMAGE
  timeout: 2h0m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    This step marks the Cluster Network Operator deployment unmanaged by the Cluster
    Version Operator, sets OVN-Kubernetes deployments to use the debug image built by
    this job, waits for that image to appear in the OVN-Kubernetes control plane and
    node pod templates, and waits for those components to roll out.
