ref:
  as: openshift-qe-deploy-autoscaler
  from: cli
  commands: openshift-qe-deploy-autoscaler-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  env:
  - name: AUTOSCALER_MIN_REPLICAS
    default: "2"
    documentation: Minimum replicas per MachineAutoscaler (per AZ)
  - name: AUTOSCALER_MAX_REPLICAS
    default: "38"
    documentation: Maximum replicas per MachineAutoscaler (per AZ, 38*3=114 total)
  documentation: >-
    Deploy ClusterAutoscaler and MachineAutoscalers for all worker MachineSets.
    Unlike the workers-scale step which tears down autoscaler resources after benchmarking,
    this step creates persistent autoscaler resources that remain active for subsequent
    workload steps. Designed to match ROSA Classic autoscaling behavior for self-managed IPI clusters.
