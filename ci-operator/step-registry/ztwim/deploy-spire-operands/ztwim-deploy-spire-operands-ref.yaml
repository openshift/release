ref:
  as: ztwim-deploy-spire-operands
  from: src
  cli: latest
  commands: ztwim-deploy-spire-operands-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 45m0s
  documentation: |-
    Deploys ZeroTrustWorkloadIdentityManager and SPIRE operand CRs
    (SpireServer, SpireAgent, SpiffeCSIDriver, SpireOIDCDiscoveryProvider),
    then waits until the operator Deployment, managed workloads, and CR Ready
    conditions are satisfied. Intended for TLS/PQC scanner jobs and e2e-operator-tls
    after operator install.
  env:
  - name: ZTWIM_CLUSTER_NAME
    default: "cluster1"
    documentation: |-
      clusterName value for the ZeroTrustWorkloadIdentityManager CR. Use test01 for
      e2e-operator-tls to match test/e2e Installation context.
  - name: ZTWIM_OIDC_MANAGED_ROUTE
    default: "true"
    documentation: |-
      When true, sets managedRoute on SpireOIDCDiscoveryProvider. Set false for
      e2e-operator-tls to match e2e Installation CR shape.
  - name: ZTWIM_WAIT_OPERANDS_AVAILABLE
    default: "false"
    documentation: |-
      When true, additionally waits for OperandsAvailable on the
      ZeroTrustWorkloadIdentityManager CR (required before make test-e2e-tls).
