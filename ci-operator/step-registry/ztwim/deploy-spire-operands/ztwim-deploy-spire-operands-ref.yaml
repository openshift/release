ref:
  as: ztwim-deploy-spire-operands
  from: src
  cli: latest
  commands: ztwim-deploy-spire-operands-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 45m0s
  documentation: |-
    Deploys ZeroTrustWorkloadIdentityManager and SPIRE operand CRs
    (SpireServer, SpireAgent, SpiffeCSIDriver, SpireOIDCDiscoveryProvider),
    then waits until the operator Deployment, managed workloads, and CR Ready
    conditions are satisfied. Intended for TLS/PQC scanner jobs after operator
    install.
