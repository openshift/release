ref:
  as: assisted-qe-provision
  from: dev-scripts
  commands: assisted-qe-provision-commands.sh
  timeout: 2h
  grace_period: 2m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: assisted-qe
    group: runner
    mount_path: /var/run/assisted-qe
  env:
  - name: QE_PROVISION_TIMEOUT
    default: 115m
    documentation: Host-side deadline. Keep below the step timeout and within the
      whole-job budget.
  documentation: Provision phase of the reusable Assisted Installer QE runner; scenario
    logic lives in the pinned ocp-edge-ci checkout.
