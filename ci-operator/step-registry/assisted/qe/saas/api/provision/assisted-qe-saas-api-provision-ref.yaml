ref:
  from: dev-scripts
  commands: assisted-qe-saas-api-provision-commands.sh
  timeout: 2h
  grace_period: 2m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: assisted-qe
    group: runner
    mount_path: /var/run/assisted-qe
  as: assisted-qe-saas-api-provision
  env:
  - name: QE_PROVISION_TIMEOUT
    default: 115m
    documentation: Host-side provisioning deadline.
  documentation: Provision KVM VMs and run the existing host/network preparation playbooks.
