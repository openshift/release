ref:
  from: dev-scripts
  commands: assisted-qe-saas-api-prepare-commands.sh
  timeout: 2h
  grace_period: 2m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: assisted-qe
    group: runner
    mount_path: /var/run/assisted-qe
  as: assisted-qe-saas-api-prepare
  env:
  - name: QE_PREPARE_TIMEOUT
    default: 95m
    documentation: Host-side preparation deadline.
  - name: OCP_EDGE_REPO
    default: https://gitlab.cee.redhat.com/ocp-edge-qe/ocp-edge.git
    documentation: Repository containing Ansible and Terraform automation.
  - name: OCP_EDGE_REF
    default: e02f91658e9e3afcc66f6e157b0cc7550a561483
    documentation: Reviewed full commit of the automation repository.
  - name: ASSISTED_API_ENDPOINT
    default: https://api.stage.openshift.com
    documentation: Assisted service endpoint.
  - name: ASSISTED_TEST_INFRA_MARKER
    default: ''
    documentation: Pytest marker selecting the API test group.
  - name: ASSISTED_TEST_INFRA_BRANCH
    default: master
    documentation: Branch of assisted-test-infra cloned by the Ansible automation.
  - name: KNI_ASSISTED_INSTALLER_AUTO_BRANCH
    default: master
    documentation: Branch of the companion test automation repository.
  - name: ASSISTED_FUNCTIONAL_API_TESTS_PARALLEL
    default: '3'
    documentation: Number of parallel API test workers.
  - name: OCM_USER
    default: assisted-installer-qe-ci2
    documentation: Primary test identity selected from the encrypted vault.
  - name: SECOND_OCM_USER_FOR_AUTH_TESTS
    default: talhil-aiqe1-u2
    documentation: Secondary test identity selected from the encrypted vault.
  - name: PROVISION_MASTER_COUNT
    default: '3'
    documentation: Number of master VMs.
  - name: PROVISION_WORKER_COUNT
    default: '2'
    documentation: Number of worker VMs.
  - name: DEPLOY_MASTER_COUNT
    default: '3'
    documentation: Number of masters used by the test deployment.
  - name: DEPLOY_WORKER_COUNT
    default: '2'
    documentation: Number of workers used by the test deployment.
  - name: MASTER_MEMORY
    default: '32768'
    documentation: Master memory in MiB.
  - name: WORKER_MEMORY
    default: '16384'
    documentation: Worker memory in MiB.
  - name: MASTER_VCPUS
    default: '16'
    documentation: Master vCPUs.
  - name: WORKER_VCPUS
    default: '8'
    documentation: Worker vCPUs.
  - name: MASTER_DISK_SIZE
    default: '120'
    documentation: Master disk size in GiB.
  - name: WORKER_DISK_SIZE
    default: '120'
    documentation: Worker disk size in GiB.
  - name: NETWORK_TYPE
    default: OVNKubernetes
    documentation: OpenShift network plugin.
  - name: BASE_DOMAIN
    default: qe.lab.redhat.com
    documentation: Lab DNS base domain.
  - name: PROFILE_NAME
    default: saas-api
    documentation: Scenario name used by the automation.
  documentation: Clone the automation repository and prepare the KVM API environment. All POC orchestration
    is in this step.
