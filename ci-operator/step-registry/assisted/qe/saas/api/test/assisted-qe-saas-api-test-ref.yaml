ref:
  from: dev-scripts
  commands: assisted-qe-saas-api-test-commands.sh
  timeout: 13h
  grace_period: 2m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: assisted-qe
    group: runner
    mount_path: /var/run/assisted-qe
  as: assisted-qe-saas-api-test
  env:
  - name: QE_TEST_TIMEOUT
    default: 11h50m
    documentation: Host-side API test deadline.
  documentation: Execute the API Ansible entry point, collect JUnit and fail on missing or failed tests.
