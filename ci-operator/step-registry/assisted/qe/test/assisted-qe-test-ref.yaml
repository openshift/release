ref:
  as: assisted-qe-test
  from: dev-scripts
  commands: assisted-qe-test-commands.sh
  timeout: 18h
  grace_period: 2m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: assisted-qe
    group: runner
    mount_path: /var/run/assisted-qe
  env:
  - name: QE_TEST_TIMEOUT
    default: 11h50m
    documentation: Host-side deadline. Keep below the step timeout and within the
      whole-job budget.
  documentation: Test phase of the reusable Assisted Installer QE runner; scenario
    logic lives in the pinned ocp-edge-ci checkout.
