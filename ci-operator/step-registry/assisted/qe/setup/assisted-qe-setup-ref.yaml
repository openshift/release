ref:
  from: dev-scripts
  commands: assisted-qe-setup-commands.sh
  timeout: 15m
  grace_period: 2m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: assisted-qe
    group: runner
    mount_path: /var/run/assisted-qe
  as: assisted-qe-setup
  env:
  - name: QE_OCP_VERSION
    default: '5.0'
    documentation: OpenShift major.minor matching releases.latest.
  - name: QE_SSH_USER
    default: kni
    documentation: SSH login with /home/<user>, noninteractive sudo and host prerequisites.
  documentation: Allocate a private workspace on the leased host and install the shared SSH and result
    helpers.
