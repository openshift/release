ref:
  from: dev-scripts
  commands: assisted-qe-gather-commands.sh
  timeout: 15m
  grace_period: 2m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: assisted-qe
    group: runner
    mount_path: /var/run/assisted-qe
  as: assisted-qe-gather
  env:
  - name: QE_GATHER_TIMEOUT
    default: 10m
    documentation: Host-side artifact processing deadline.
  documentation: Sanitize WORKSPACE/results/*.xml and collect public status-only artifacts.
