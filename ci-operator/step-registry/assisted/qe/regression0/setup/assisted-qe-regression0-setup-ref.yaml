ref:
  as: assisted-qe-regression0-setup
  from: dev-scripts
  commands: assisted-qe-regression0-setup-commands.sh
  timeout: 1h
  grace_period: 2m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: assisted-qe
    group: regression0
    mount_path: /var/run/assisted-qe
  documentation: Setup phase of the downstream Assisted SaaS regression0 migration.
  env:
  - name: QE_OCP_VERSION
    default: '5.0'
    documentation: OpenShift major.minor; must match releases.latest.
  - name: QE_CI_REF
    default: 5dbd6954b12832d886b31ab13d98820a1e5c118c
    documentation: Reviewed ocp-edge-ci revision (cleanup script and source profile).
  - name: QE_EDGE_REF
    default: e02f91658e9e3afcc66f6e157b0cc7550a561483
    documentation: Reviewed ocp-edge Ansible/Terraform revision.
  - name: QE_PUBLISH_RESULTS
    default: 'true'
    documentation: Publish to Polarion, Report Portal and Datahub. Set false for comparison
      runs.
