ref:
  from: dev-scripts
  commands: assisted-qe-release-commands.sh
  timeout: 30m
  grace_period: 2m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: assisted-qe
    group: runner
    mount_path: /var/run/assisted-qe
  as: assisted-qe-release
  documentation: Stop remaining remote commands, archive internal results and remove temporary checkouts
    and credentials. Workload teardown belongs in scenario-specific post steps.
