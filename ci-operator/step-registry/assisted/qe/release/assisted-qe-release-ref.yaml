ref:
  as: assisted-qe-release
  from: dev-scripts
  commands: assisted-qe-release-commands.sh
  timeout: 30m
  grace_period: 2m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: assisted-qe
    group: runner
    mount_path: /var/run/assisted-qe
  env:
  - name: QE_CLEANUP_TIMEOUT
    default: 20m
    documentation: Host-side deadline. Keep below the step timeout and within the
      whole-job budget.
  documentation: Release phase of the reusable Assisted Installer QE runner; scenario
    logic lives in the pinned ocp-edge-ci checkout.
