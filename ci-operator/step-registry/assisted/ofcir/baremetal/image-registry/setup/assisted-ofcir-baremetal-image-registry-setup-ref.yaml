ref:
  as: assisted-ofcir-baremetal-image-registry-setup
  from: dev-scripts
  commands: assisted-ofcir-baremetal-image-registry-setup-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  timeout: 45m0s
  env:
  - name: TEST_TYPE
    default: none
    documentation: |-
      When not 'none', enable the cluster image registry (Managed + emptyDir) for openshift-tests.
      When 'none', skip registry setup (install-only jobs).
  documentation: |-
    When TEST_TYPE is not none, patch the installed cluster image registry to Managed with emptyDir
    storage on ci_machine. Skips when TEST_TYPE is none (install-only jobs).
    Runs after assisted-common-pre; discovers kubeconfig files under /home/assisted/build/kubeconfig
    (a directory on bare-metal installs, not a single file).
