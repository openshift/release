ref:
  as: assisted-ssh-hostname
  from: dev-scripts
  commands: assisted-ssh-hostname-commands.sh
  grace_period: 30s
  credentials:
  - collection: edge-group
    group: assisted-qe-ssh-poc
    mount_path: /var/run/assisted-ssh-poc
  env:
  - name: SSH_USER
    default: kni
    documentation: SSH account on the QE machine.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 3m0s
  documentation: |-
    Connects to an existing QE machine over SSH and prints its hostname.
    The secret group must contain ssh-privatekey, ssh-hostname, and known-hosts fields.
