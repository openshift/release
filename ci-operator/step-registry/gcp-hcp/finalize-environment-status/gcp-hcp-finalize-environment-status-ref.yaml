ref:
  as: gcp-hcp-finalize-environment-status
  from: src
  commands: gcp-hcp-finalize-environment-status-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  timeout: 3m0s
  credentials:
  - namespace: ci
    bundle: github-credentials-openshift-ci-robot-private-git-cloner
    mount_path: /etc/github-private
  documentation: |-
    Completes the environment test status on the exact promotion commits
    captured before testing. Success requires the HC lifecycle and verified
    cleanup markers, unchanged branch SHAs, and healthy deployment checks;
    otherwise it reports failure. A missing cleanup marker also fails an
    ordinary presubmit, without changing its deployed-commit status.
