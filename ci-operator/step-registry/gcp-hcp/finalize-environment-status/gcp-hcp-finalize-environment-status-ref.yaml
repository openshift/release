ref:
  as: gcp-hcp-finalize-environment-status
  from: src
  commands: gcp-hcp-finalize-environment-status-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  timeout: 3m0s
  credentials:
  - namespace: ci
    bundle: github-credentials-openshift-ci-robot-private-git-cloner
    mount_path: /etc/github-private
  documentation: |-
    Completes the periodic environment test status on the exact active
    promotion commits captured before testing. Success requires the HC
    lifecycle marker, unchanged branch SHAs, and healthy deployment statuses;
    otherwise it reports failure. Presubmits do not alter deployed statuses.
