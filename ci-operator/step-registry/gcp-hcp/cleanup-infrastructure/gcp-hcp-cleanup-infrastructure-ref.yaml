ref:
  as: gcp-hcp-cleanup-infrastructure
  from: gcp-hcp-e2e-tests
  commands: gcp-hcp-cleanup-infrastructure-commands.sh
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
  credentials:
  - mount_path: /etc/terraform-cloud
    name: tfcloud-ci-secret
    namespace: ci
  env:
  - name: GCP_REGION
    default: us-central1
  timeout: 30m0s
  documentation: |-
    Performs comprehensive infrastructure cleanup for GCP HCP e2e environments.
    
    This step force-deletes GCP projects instead of relying on terraform destroy,
    which can fail due to orphaned NEGs or other resources. The cleanup process:
    
    1. Stops ArgoCD to prevent resource recreation
    2. Deletes Gateway API resources (triggers NEG cleanup)
    3. Force-deletes any remaining NEGs
    4. Deletes DNS records from regional zones
    5. Force-deletes GCP projects (cascades to all resources)
    6. Clears Terraform Cloud workspace state
    
    WIF credential is read from SHARED_DIR/wif-cred.json (written by hypershift-gcp-wif-auth).
    TFC token is mounted from the tfcloud-ci-secret credential.
    
    This approach is more reliable than terraform destroy for ephemeral e2e environments.
