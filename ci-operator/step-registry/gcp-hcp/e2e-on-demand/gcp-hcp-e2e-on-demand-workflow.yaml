workflow:
  as: gcp-hcp-e2e-on-demand
  steps:
    pre:
    - ref: hypershift-gcp-wif-auth
    - ref: gcp-hcp-on-demand-config
    test:
    - ref: gcp-hcp-verify-hc-lifecycle
    post: []
  documentation: |-
    Runs the HC lifecycle test against an existing long-running GCP HCP
    environment. WIF authenticates the job; the config step supplies the
    environment's API, OIDC, region, and customer project details. The CI
    identity must be authorized for the persistent customer project outside
    this workflow. The INT job disables regional project activation.
