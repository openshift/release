ref:
  as: gcp-hcp-gather
  from: gcp-hcp-e2e-tests
  commands: gcp-hcp-gather-commands.sh
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  timeout: 15m0s
  grace_period: 1m0s
  best_effort: true
  documentation: |-
    Collects bounded, sanitized diagnostics from the GCP HCP region,
    management, hosted-cluster, and customer-project scopes before teardown.
    Produces small JSON indexes and per-scope archives in ARTIFACT_DIR for Prow
    and Chai diagnosis. Missing or unreachable scopes do not block cleanup.
