ref:
  as: gcp-hcp-gather
  from: gcp-hcp-e2e-tests
  commands: gcp-hcp-gather-commands.sh
  env:
  - name: GCP_REGION
    default: ""
    documentation: |-
      GCP region override for Connect Gateway scopes. When empty, the region
      recorded by gcp-hcp-tf-provision in SHARED_DIR is used.
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  timeout: 15m0s
  grace_period: 1m0s
  best_effort: true
  documentation: |-
    Collects bounded, sanitized diagnostics from the GCP HCP region,
    management, hosted-cluster, and customer-project scopes before teardown.
    The region archive includes focused Argo Application state and live
    cluster-scoped Channel/API discovery data and bounded L7 load-balancer 5xx request logs. Produces JSON indexes and
    per-scope archives in ARTIFACT_DIR for Prow and Chai diagnosis. Missing or
    unreachable scopes do not block cleanup.
