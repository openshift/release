ref:
  as: gcp-hcp-generate-kubeconfigs
  from_image:
    namespace: ocp
    name: "4.22"
    tag: upi-installer
  commands: gcp-hcp-generate-kubeconfigs-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  timeout: 5m0s
  documentation: |-
    Generates kubeconfigs with embedded access tokens for region and management clusters.
    
    Uses gcloud to fetch cluster CA and endpoint, then creates static kubeconfigs
    with embedded tokens (valid for ~60 minutes, sufficient for CI jobs).
    
    Depends on:
    - hypershift-gcp-wif-auth (must run first)
    - gcp-hcp-tf-provision (must write cluster names to SHARED_DIR)
    
    Outputs:
    - ${SHARED_DIR}/region-kubeconfig: Region cluster kubeconfig
    - ${SHARED_DIR}/mc-kubeconfig: MC cluster kubeconfig (optional)
