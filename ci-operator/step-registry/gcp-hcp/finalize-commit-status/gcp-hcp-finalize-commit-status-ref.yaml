ref:
  as: gcp-hcp-finalize-commit-status
  from: gcp-hcp-infra-src
  commands: gcp-hcp-finalize-commit-status-commands.sh
  env:
  - name: E2E_STATUS_CONTEXT
    default: e2e/platform
    documentation: "GitHub commit status context used by the initial status step for this platform lifecycle leg"
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  timeout: 3m0s
  credentials:
  - namespace: ci
    bundle: github-credentials-openshift-ci-robot-private-git-cloner
    mount_path: /etc/github-private
  documentation: |-
    Finalizes the E2E_STATUS_CONTEXT status (default: e2e/platform) for the SHA
    recorded by the initial status step. Publishes success when the complete test
    phase reached its shared success marker, or failure otherwise. Skips when
    gcp-hcp-update-commit-status recorded that the run does not test a
    gcp-hcp-infra commit (gcp-hcp-skip-commit-status).
