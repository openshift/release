ref:
  as: gcp-hcp-finalize-commit-status
  from: src
  commands: gcp-hcp-finalize-commit-status-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  timeout: 3m0s
  credentials:
  - namespace: ci
    bundle: github-credentials-openshift-ci-robot-private-git-cloner
    mount_path: /etc/github-private
  documentation: |-
    Finalizes the e2e/platform status for the SHA recorded by the initial status
    step. Publishes success when the complete test phase reached its shared
    success marker, or failure otherwise.
