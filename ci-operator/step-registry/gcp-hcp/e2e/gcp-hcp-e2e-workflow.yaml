workflow:
  as: gcp-hcp-e2e
  steps:
    pre:
    - ref: gcp-hcp-update-commit-status
    - ref: hypershift-gcp-wif-auth
    - ref: gcp-hcp-tf-provision
    - ref: gcp-hcp-generate-kubeconfigs
    test:
    - ref: gcp-hcp-verify-argocd-sync
    - ref: gcp-hcp-verify-hc-lifecycle
    post:
    - ref: gcp-hcp-cleanup-infrastructure
    - ref: gcp-hcp-finalize-commit-status
  documentation: |-
    E2E workflow for gcp-hcp-infra. Provisions full platform infrastructure
    (region + management cluster + customer project) using Terraform Cloud
    ephemeral workspaces, runs validation tests, and normally cleans up resources.
    
    Phase breakdown:
    - Pre: Post a pending GitHub commit status, authenticate via WIF, provision
      infrastructure with terraform apply, generate kubeconfigs
    - Test: Validate ArgoCD application sync, then run HC lifecycle test
      (create cluster, verify, deploy workload, tear down)
    - Post: Force-delete GCP projects, clear TFC workspace state, and publish
      the final GitHub commit status
