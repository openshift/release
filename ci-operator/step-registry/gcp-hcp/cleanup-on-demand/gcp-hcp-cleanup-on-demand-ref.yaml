ref:
  as: gcp-hcp-cleanup-on-demand
  from: gcp-hcp-e2e-tests
  commands: gcp-hcp-cleanup-on-demand-commands.sh
  env:
  - name: E2E_TARGET_CUSTOMER_PROJECT_ID
    documentation: Customer project configured for this on-demand job
  - name: E2E_TARGET_REGION
    documentation: Region configured for this on-demand job
  - name: E2E_TARGET_API_ENDPOINT
    documentation: Platform API endpoint configured for this on-demand job
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  timeout: 35m0s
  grace_period: 5m0s
  best_effort: true
  documentation: |-
    Cleans up a failed or timed-out on-demand HostedCluster test in a persistent
    customer project. Uses only the exact per-run cluster, nodepool, and infra
    IDs written to SHARED_DIR by the Ginkgo test. Skips when the test passed or
    did not record a cluster name. Never targets regional or management
    projects. Runs before the environment commit status is finalized.
