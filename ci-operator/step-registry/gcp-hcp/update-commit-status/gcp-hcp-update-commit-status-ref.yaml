ref:
  as: gcp-hcp-update-commit-status
  from: src
  commands: gcp-hcp-update-commit-status-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  timeout: 2m0s
  credentials:
  - namespace: ci
    bundle: github-credentials-openshift-ci-robot-private-git-cloner
    mount_path: /etc/github-private
  documentation: |-
    Posts a pending e2e/platform commit status to the exact gcp-hcp-infra SHA
    selected by Prow or resolved from its verified active checkout, then records
    that SHA and the initial main HEAD in the shared directory for the
    post-phase finalizer.
