ref:
  as: gcp-hcp-tf-provision
  from: src
  commands: gcp-hcp-tf-provision-commands.sh
  credentials:
  - as: credentials.tfrc.json
    field: credentials
    mount_path: /etc/terraform-cloud
    group: tfcloud-token
    collection: gcp-hcp-infra-terraform-cloud
  env:
  - name: TF_CLI_CONFIG_FILE
    default: /etc/terraform-cloud/credentials.tfrc.json
    documentation: "Mounted HCP Terraform CLI credentials file"
  - name: GCP_REGION
    default: "us-central1"
    documentation: "GCP region for e2e infrastructure deployment"
  resources:
    requests:
      cpu: 1000m
      memory: 2Gi
  timeout: 90m0s
  grace_period: 10m0s
  documentation: |-
    Provisions full GCP HCP e2e infrastructure (region + management cluster)
    using Terraform Cloud ephemeral workspaces.
    
    Requires:
    - HCP Terraform credentials mounted at /etc/terraform-cloud/credentials.tfrc.json
    - ${SHARED_DIR}/wif-cred.json written by hypershift-gcp-wif-auth for local
      Terraform state recovery operations
    - gcp-hcp-tested-sha in SHARED_DIR (written by gcp-hcp-update-commit-status)
    
    Outputs to SHARED_DIR:
    - region-project-id
    - region-cluster-name
    - mc-project-id
    - mc-cluster-name
    - mc-cluster-endpoint
    - customer-project-id (for HC lifecycle test)
    - oidc-endpoint (OIDC CDN issuer URL, requires enable_oidc_cdn=true)
    - api-endpoint (Gecko Platform API URL, constructed from convention)
    - service-project-id (Cloud Endpoints service project for ESP)
    - workspace-name (for deprovision)
    - run-id (for tracking)
