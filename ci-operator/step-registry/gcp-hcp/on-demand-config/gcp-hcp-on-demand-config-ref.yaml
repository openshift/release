ref:
  as: gcp-hcp-on-demand-config
  from: src
  commands: gcp-hcp-on-demand-config-commands.sh
  env:
  - name: E2E_TARGET_ENV
    documentation: Long-running target environment name.
  - name: E2E_TARGET_REGION
    documentation: GCP region containing the target environment.
  - name: E2E_TARGET_REGION_PROJECT_ID
    documentation: Project ID of the target environment's region.
  - name: E2E_TARGET_API_ENDPOINT
    documentation: HTTPS URL of the target environment's Gecko Platform API.
  - name: E2E_TARGET_OIDC_ENDPOINT
    documentation: HTTPS URL of the target environment's OIDC issuer.
  - name: E2E_TARGET_CUSTOMER_PROJECT_ID
    documentation: Existing customer project used for the ephemeral HostedCluster.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  timeout: 2m0s
  documentation: |-
    Writes the existing long-running environment's connection details to
    SHARED_DIR for gcp-hcp-verify-hc-lifecycle. Does not provision or modify
    the platform environment. All inputs must be pinned by the CI test.
