ref:
  as: baremetal-lab-sno-bip-gather
  best_effort: true
  from_image:
    namespace: ci
    name: baremetal-qe-base
    tag: latest
  commands: baremetal-lab-sno-bip-gather-commands.sh
  timeout: 10m
  grace_period: 30s
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  env:
    - name: AUX_HOST
      default: ""
    - name: BOOTSTRAP_IN_PLACE
      default: "false"
    - name: ipv4_enabled
      default: "true"
  documentation: |-
    Collects bounded, read-only BIP node and lab load-balancer diagnostics before
    cleanup, including when the node has not registered with the API. Collects
    proxy exclusions without copying full ignition files, kubeconfigs or private
    keys. Collection failures must not prevent the lab cleanup steps.
