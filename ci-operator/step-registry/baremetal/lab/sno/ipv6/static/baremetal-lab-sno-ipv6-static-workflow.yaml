workflow:
  as: baremetal-lab-sno-ipv6-static
  steps:
    pre:
      - chain: baremetal-lab-sno-ipv6-static-conf
      - chain: baremetal-lab-upi-install
      - ref: upi-install-heterogeneous
      - ref: baremetal-lab-etcd-encryption
    post:
      - chain: baremetal-lab-post
      - ref: send-results-to-reportportal
    env:
      BOOTSTRAP_IN_PLACE: "true"
      ADDITIONAL_WORKERS: "0"
      ipv4_enabled: "false"
      ipv6_enabled: "true"
      CLUSTER_WIDE_PROXY: "true"
      DISCONNECTED: "false"
  documentation: |-
    The baremetal-lab-sno-ipv6-static workflow provides pre- and post- steps that provision and
    deprovision an SNO OpenShift cluster with IPv6 single-stack and cluster-wide HTTP proxy
    on a Baremetal lab, allowing job authors to inject their own end-to-end test logic.