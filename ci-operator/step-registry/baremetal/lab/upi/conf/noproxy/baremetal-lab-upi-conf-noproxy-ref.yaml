ref:
  as: baremetal-lab-upi-conf-noproxy
  from_image:
    namespace: ci
    name: baremetal-qe-base
    tag: latest
  commands: baremetal-lab-upi-conf-noproxy-commands.sh
  resources:
    requests:
      cpu: '1'
      memory: 128Mi
  env:
    - name: CLUSTER_WIDE_PROXY
      default: "false"
  documentation: |-
    Builds proxy.noProxy patch for baremetal lab UPI/IPI installs with cluster-wide proxy.
    Reads networking CIDRs from network_patch_install_config.yaml after baremetal-lab-upi-conf-network.
    Workaround until installer auto-populates noProxy (OCPBUGS-122041).