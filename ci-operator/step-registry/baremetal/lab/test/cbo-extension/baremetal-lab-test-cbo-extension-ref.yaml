ref:
  as: baremetal-lab-test-cbo-extension
  from_image:
    namespace: ci
    name: "baremetal-qe-base"
    tag: latest
  commands: baremetal-lab-test-cbo-extension-commands.sh
  timeout: 4h0m0s
  grace_period: 10m
  env:
  - name: TEST_SUITE
    default: ""
    documentation: The CBO test suite to run (e.g. cluster-baremetal-operator/disruptive, cluster-baremetal-operator/all).
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      memory: 4Gi
  documentation: |-
    Runs cluster-baremetal-operator test extension tests directly using the
    CBO test binary. The binary is decompressed from the CBO image and
    executed against the provisioned baremetal cluster.
