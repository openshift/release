workflow:
  as: baremetal-lab-ipi-virtual-media-disconnected
  steps:
    pre:
      - chain: baremetal-lab-ipi-conf-virtual-media-disconnected
      - chain: baremetal-lab-ipi-install-disconnected
    post:
      - ref: baremetal-lab-wait
      - ref: baremetal-lab-ipi-deprovision
      - chain: baremetal-lab-post
      - ref: send-results-to-reportportal
    env:
      DISCONNECTED: "true"
  documentation: |-
    Provision and deprovision a disconnected IPI cluster on the RH baremetal lab
    using Redfish virtual media. Mirrors the release payload and applies IDMS or
    ICSP from ENABLE_IDMS. Job authors can inject their own test steps.
