ref:
  as: mirror-images-by-oc-mirror-to-disk
  from: upi-installer
  cli: latest
  grace_period: 10m
  commands: mirror-images-by-oc-mirror-to-disk-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: CUSTOM_OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE
    default: ""
    documentation: "Used to overwrite OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE to a customized payload"
  - name: USE_ORIGINAL_OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE
    default: "false"
    documentation: "Use original payload image url from OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE instead of a build farm imagestream url"
  - name: MIRROR_BIN
    default: "oc-mirror"
    documentation: "Mirror binary to use. Set to a value other than 'oc-mirror' to skip this step."
  credentials:
  - collection: openshift-qe
    group: mirror-registry
    mount_path: /var/run/vault/mirror-registry
  dependencies:
  - name: "release:latest"
    env: OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE
  documentation: |-
    Phase 1 of the two-phase oc-mirror mirror-to-disk/disk-to-mirror (m2d2m)
    workflow. Mirrors the release payload from the source registry to a local
    disk archive using 'oc-mirror --v2' in mirror-to-disk mode, then transfers
    the archive and the oc-mirror binary to the bastion host via tar/scp over
    SSH so that the subsequent mirror-images-by-oc-mirror-from-disk step can
    push from disk to the bastion mirror registry without any public internet
    access.

    Note: IDMS/ITMS cluster-resources are NOT produced by this step. They are
    only written by oc-mirror during the disk-to-mirror phase (Phase 2) and
    are saved to SHARED_DIR by mirror-images-by-oc-mirror-from-disk.

    Writes SHARED_DIR/oc-mirror-workspace-path with the path on the bastion
    where the archive was staged (/tmp/oc-mirror-workspace).

    A no-op if MIRROR_BIN is not set to 'oc-mirror'.
