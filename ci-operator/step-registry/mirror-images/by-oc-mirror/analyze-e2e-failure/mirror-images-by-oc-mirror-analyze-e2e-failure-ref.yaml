ref:
  as: mirror-images-by-oc-mirror-analyze-e2e-failure
  from_image:
    namespace: ci
    name: claude-ai-helpers
    tag: latest
  best_effort: true
  commands: mirror-images-by-oc-mirror-analyze-e2e-failure-commands.sh
  timeout: 35m0s
  grace_period: 30s
  env:
  - name: CLAUDE_CODE_USE_VERTEX
    default: "1"
    documentation: |-
      Enable Vertex AI for Claude Code.
  - name: CLOUD_ML_REGION
    default: "global"
    documentation: |-
      Google Cloud region for Vertex AI.
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "openshift-ci-prow-agents"
    documentation: |-
      Google Cloud project ID for Vertex AI authentication.
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/claude-code-service-account/google-token"
    documentation: |-
      Path to the Google Cloud service account JSON key file for Vertex AI authentication.
  - name: CLAUDE_MODEL
    default: "claude-opus-4-6"
    documentation: |-
      Claude model to use for test failure analysis.
  - name: TEST_NAME
    default: ""
    documentation: |-
      ci-operator test name (as: field), used to build the GCS artifact path.
      When empty, derived from JOB_NAME (the ocp-* or e2e-* suffix).
  - name: TEST_STEPS
    default: "openshift-e2e-test"
    documentation: |-
      Space-separated inner step names to poll for finished.json. Callers
      should override this with the oc-mirror step(s) relevant to the
      workflow in use, e.g. "openshift-e2e-test mirror-images-by-oc-mirror"
      for a direct mirror-to-mirror run, or
      "openshift-e2e-test mirror-images-by-oc-mirror-to-disk mirror-images-by-oc-mirror-from-disk"
      for a two-phase disk-based (m2d2m) run.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  credentials:
  - namespace: test-credentials
    name: sa-claude-openshift-ci
    mount_path: /var/run/claude-code-service-account
  documentation: |-
    Post-step that uses Claude to analyze e2e failures for jobs that install a
    disconnected/mirrored OpenShift cluster using oc-mirror. Reusable across
    oc-mirror e2e flows: direct mirror-to-mirror (mirror-images-by-oc-mirror)
    and two-phase mirror-to-disk/disk-to-mirror (mirror-images-by-oc-mirror-to-disk
    / mirror-images-by-oc-mirror-from-disk). Uses the existing CI Vertex service
    account; no per-user API key is required. Only runs when a listed test/mirror
    step (see TEST_STEPS) failed. On success, exits early. Produces
    ARTIFACT_DIR/failure-analysis.md.
