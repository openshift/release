ref:
  as: mirror-images-trust-registry-ca
  from: upi-installer
  commands: mirror-images-trust-registry-ca-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Configures image.config.openshift.io/cluster's spec.additionalTrustedCA
    for the disconnected bastion mirror registry's self-signed CA, including
    image imports and builds. This registry-specific configuration is separate
    from the installer's additionalTrustBundle, which the installer and MCO
    use for node trust without requiring additionalTrustBundlePolicy: Always.
    That policy also makes proxy/cluster reference user-ca-bundle when no
    cluster-wide proxy is configured; it does not set image additionalTrustedCA.

    Creates a `registry-config` ConfigMap in the `openshift-config` namespace
    from SHARED_DIR/additional_trust_bundle (written by ipi-conf-mirror
    before installation), keyed by the mirror registry host
    with its port-separating colon replaced by two dots (host:port ->
    host..port, the documented OpenShift convention), then patches
    image.config.openshift.io/cluster to reference it. This is the same
    procedure documented for disconnected mirrors with self-signed certs:
    https://docs.openshift.com/container-platform/4.18/post_installation_configuration/post-install-image-config.html

    A no-op if SHARED_DIR/mirror_registry_url or
    SHARED_DIR/additional_trust_bundle is absent. Does not require
    ipi-conf-additional-ca-trust-policy.
