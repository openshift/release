ref:
  as: upi-libvirt-cleanup-heterogeneous
  from: libvirt-installer
  grace_period: 10m
  commands: upi-libvirt-cleanup-heterogeneous-commands.sh
  env:
  - name: POOL_NAME
    default: "multiarch-ci-pool"
  resources:
    requests:
      cpu: 1000m
      memory: 300Mi
  dnsConfig:
    nameservers:
    - 172.30.38.188
    searches:
    - "bastion-z.svc.cluster.local"
    - "bastion-ppc64le-libvirt.svc.cluster.local"
  documentation: |-
    Heterogeneous-only cleanup for the additional-architecture hypervisor
    (hostname-additional / hostname-amd64 / hostname-s390x). Used by
    openshift-e2e-libvirt-vpn-heterogeneous so shared upi-libvirt-cleanup-{pre,post}
    remain unchanged for homogeneous VPN jobs.
