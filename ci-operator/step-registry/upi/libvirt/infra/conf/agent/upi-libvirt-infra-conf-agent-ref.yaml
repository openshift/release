ref:
  as: upi-libvirt-infra-conf-agent
  from: libvirt-installer
  commands: upi-libvirt-infra-conf-agent-commands.sh
  env:
  - name: CLUSTER_ROLE
    default: "infra"
    documentation: Fixed to "infra". Uses $LEASED_RESOURCE_INFRA / $SHARED_DIR (with infra- file prefix).
  - name: USE_EXTERNAL_DNS
    default: "false"
  - name: MGMT_SUBNET_OVERRIDE
    default: ""
    documentation: When set, use this subnet number for rendezvousIP instead of the infra lease's own subnet.
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: Infra variant of upi-conf-libvirt-agent. Writes agent-config.yaml to $SHARED_DIR (with infra- file prefix).
