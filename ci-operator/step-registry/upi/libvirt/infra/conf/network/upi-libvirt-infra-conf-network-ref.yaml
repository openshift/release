ref:
  as: upi-libvirt-infra-conf-network
  from: libvirt-installer
  commands: upi-libvirt-infra-conf-network-commands.sh
  env:
  - name: CLUSTER_ROLE
    default: "infra"
    documentation: Fixed to "infra". Uses $LEASED_RESOURCE_INFRA / $SHARED_DIR (with infra- file prefix).
  - name: INSTALLER_TYPE
    default: 'default'
  - name: USE_EXTERNAL_DNS
    default: 'false'
  - name: MGMT_SUBNET_OVERRIDE
    default: ""
    documentation: |-
      When set, the infra cluster's libvirt network is created on this subnet number
      instead of the one derived from LEASED_RESOURCE_INFRA. Use this to place infra
      nodes on the same L2 bridge as the management cluster (e.g. "2" to force
      192.168.2.x). Node IPs 61-63 are reserved for the infra control-plane in that
      subnet range to avoid collisions with mgmt lease IPs.
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: Infra variant of upi-conf-libvirt-network. Writes network.xml to $SHARED_DIR (with infra- file prefix).
