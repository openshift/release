ref:
  as: upi-libvirt-conf
  from: libvirt-installer
  commands: upi-libvirt-conf-commands.sh
  env:
  - name: ARCH
  - name: BRANCH
  - name: MASTER_REPLICAS
    default: "3"
  - name: INSTALL_PLATFORM
    default: "none"
    documentation: |-
      Platform type written to install-config.yaml.
      * "none" (default) - platform.none
      * "external" - platform.external
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  dependencies:
    - name: "release:latest"
      env: OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE
    - name: "release:latest"
      env: RELEASE_IMAGE_LATEST
  dnsConfig:
    nameservers:
    - 172.30.38.188
    searches:
    - "bastion-z.svc.cluster.local"
    - "bastion-ppc64le-libvirt.svc.cluster.local"
  documentation: >-
    Generates the install-config.yaml file for a UPI installation with compute replicas: 0.
    The install-config platform type defaults to none and can be set to external via INSTALL_PLATFORM.
