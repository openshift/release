ref:
  as: upi-libvirt-install-heterogeneous
  from: libvirt-installer
  commands: upi-libvirt-install-heterogeneous-commands.sh
  env:
  - name: ARCH
  - name: BRANCH
  - name: ADDITIONAL_WORKER_ARCHITECTURE
    default: "amd64"
    documentation: "Heterogeneous additional worker architecture (e.g. amd64, arm64)"
  - name: CLUSTER_DOMAIN
    default: ""
    documentation: "Cluster domain used for node hostname assignment during PXE boot"
  - name: LIBVIRT_DOMAIN_NAME_SUFFIX
    default: ""
    documentation: "Suffix appended to libvirt domain names for this lease slot"
  - name: ADDITIONAL_LIBVIRT_HOST
    default: ""
    documentation: "Hostname of the additional (amd64/arm64) hypervisor"
  - name: ADDITIONAL_LIBVIRT_PORT
    default: "16510"
    documentation: "Libvirt TCP port on the additional hypervisor"
  - name: HTTPD_LIBVIRT_HOST
    default: ""
    documentation: "Hostname of the primary s390x hypervisor (also hosts httpd pool)"
  - name: HTTPD_LIBVIRT_PORT
    default: "16509"
    documentation: "Libvirt TCP port on the primary s390x hypervisor"
  - name: HTTPD_PORT
    default: "8080"
    documentation: "HTTP port for boot artifact server on the primary hypervisor"
  - name: DOMAIN_MEMORY
    documentation: The memory to allocate for each guest, in KiB
    default: '25156824'
  - name: DOMAIN_DISK_SIZE
    documentation: The disk size to allocate for each guest, in B
    default: '107374182400'
  - name: DOMAIN_VCPUS
    documentation: Number of VCPUs to allocate for each guest
    default: '6'
  - name: OPENSHIFT_CLIENT_VERSION_OVERRIDE
    default: ''
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  dependencies:
    - name: "release:latest"
      env: OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE
    - name: "release:latest"
      env: RELEASE_IMAGE_LATEST
  dnsConfig:
    nameservers:
    - 172.30.38.188
    searches:
    - "bastion-z.svc.cluster.local"
    - "bastion-ppc64le-libvirt.svc.cluster.local"
  documentation: >-
