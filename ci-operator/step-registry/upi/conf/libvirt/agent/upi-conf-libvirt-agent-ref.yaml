ref:
  as: upi-conf-libvirt-agent
  from: libvirt-installer
  commands: upi-conf-libvirt-agent-commands.sh
  env:
  - name: CONTROL_COUNT
    default: "3"
    documentation: Number of control-plane hosts to include in agent-config.yaml.
  - name: COMPUTE_COUNT
    default: "2"
    documentation: Number of compute hosts to include in agent-config.yaml. Set to 0 for SNO.
  - name: USE_EXTERNAL_DNS
    default: "false"
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    This step prepares an agent-config.yaml to be consumed in a later install step. This is passed
    along to future steps by storing it in the ${SHARED_DIRECTORY} for future consumption.
