ref:
  as: upi-conf-libvirt-agent-sno
  from: libvirt-installer
  commands: upi-conf-libvirt-agent-sno-commands.sh
  env:
  - name: USE_EXTERNAL_DNS
    default: "false"
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Writes an SNO agent-config.yaml (one master, no workers) for later install
    steps. Existing HA agent jobs keep using upi-conf-libvirt-agent.
