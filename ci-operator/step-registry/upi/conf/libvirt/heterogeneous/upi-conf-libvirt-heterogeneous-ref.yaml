ref:
  as: upi-conf-libvirt-heterogeneous
  from: libvirt-installer
  grace_period: 10m
  commands: upi-conf-libvirt-heterogeneous-commands.sh
  env:
  - name: ARCH
    default: "s390x"
    documentation: "Control plane and default compute architecture"
  - name: ADDITIONAL_WORKER_ARCHITECTURE
    default: "amd64"
    documentation: "Additional worker architecture (amd64 or arm64)"
  - name: CONTROL_COUNT
    default: "3"
    documentation: "Number of control plane nodes"
  - name: COMPUTE_COUNT
    default: "1"
    documentation: "Number of base architecture compute nodes"
  - name: ADDITIONAL_WORKER_COUNT
    default: "1"
    documentation: "Number of additional architecture compute nodes"
  - name: USE_EXTERNAL_DNS
    default: "false"
  - name: FIPS_ENABLED
    default: "false"
  - name: OS_IMAGE_STREAM
    default: ""
  - name: FEATURE_SET
    default: ""
  - name: NODE_TUNING
    default: "false"
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Generates install-config.yaml and network.xml for a heterogeneous libvirt cluster
    with static lease-based assignments, verifying lease integrity and node counts.
