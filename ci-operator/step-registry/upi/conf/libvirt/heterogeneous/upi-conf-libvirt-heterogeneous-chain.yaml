chain:
  as: upi-conf-libvirt-heterogeneous
  steps:
  - ref: ipi-install-rbac
  - ref: upi-conf-libvirt-heterogeneous
  - ref: ipi-conf-debug-kdump-configure-logs
  env:
  - name: ARCH
    default: "s390x"
  - name: ADDITIONAL_WORKER_ARCHITECTURE
    default: "arm64"
  documentation: |-
    This chain performs configuration and static network generation for heterogeneous libvirt clusters.
