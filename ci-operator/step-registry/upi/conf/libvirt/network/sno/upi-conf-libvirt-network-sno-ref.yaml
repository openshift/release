ref:
  as: upi-conf-libvirt-network-sno
  from: libvirt-installer
  commands: upi-conf-libvirt-network-sno-commands.sh
  env:
  - name: USE_EXTERNAL_DNS
    default: 'false'
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Writes a libvirt network.xml for agent SNO (one rendezvous host at the
    bootstrap IP). Existing HA jobs keep using upi-conf-libvirt-network.
