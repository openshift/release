ref:
  as: upi-conf-vsphere-platform-none
  from_image:
    namespace: origin
    name: centos
    tag: '8'
  commands: upi-conf-vsphere-platform-none-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
    - name: PLATFORM_NAME
      default: none
    - name: PLATFORM_EXTERNAL_CCM_ENABLED
      default: "yes"
      documentation: |-
        When PLATFORM_NAME is not "none" and this is set to "yes", the install-config's
        platform.external.cloudControllerManager is set to "External". Any other value
        leaves it empty, so the external platform is provisioned without an external CCM.
        Has no effect when PLATFORM_NAME is "none".
  documentation: |-
    The upi-conf-platform-none step modifies the platform type in the install-config for bringing up a platform none cluster.
