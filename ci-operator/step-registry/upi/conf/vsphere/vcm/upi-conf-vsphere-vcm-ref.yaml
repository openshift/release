ref:
  as: upi-conf-vsphere-vcm
  from: upi-installer
  grace_period: 10m
  commands: upi-conf-vsphere-vcm-commands.sh
  env:
  - name: CONTROL_PLANE_REPLICAS
    default: "3"
  - name: COMPUTE_NODE_REPLICAS
    default: "2"
  - name: PULL_THROUGH_CACHE
    default: "enabled"
    documentation: |-
      Cluster images are pulled through a cache located in the CI environment when enabled.
  - name: OPENSHIFT_INSTALL_EXPERIMENTAL_DISABLE_IMAGE_POLICY
    default: "true"
    documentation: "Set to true to disable the Sigstore image signature policy to allow the installation of an unsigned release image. This is for internal CI testing only"
  - name: CUSTOM_OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE
    default: ""
    documentation: "Used to overwrite the OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE to a customized payload"
  credentials:
  - collection: vsphere-vmc
    group: terraform
    mount_path: /var/run/vault/vsphere
  - collection: vsphere-vmc
    group: ibmcloud
    mount_path: /var/run/vault/ibmcloud
  - collection: vsphere
    group: ibmcloud/ci
    mount_path: /var/run/vault/vsphere-ibmcloud-ci
  - collection: vsphere
    group: ibmcloud/config
    field: journal-logging-enabled
    mount_path: /var/run/vault/vsphere-ibmcloud-config/journal-logging-enabled
  - collection: vsphere
    group: ibmcloud/config
    field: pull-through-cache-config
    mount_path: /var/run/vault/vsphere-ibmcloud-config/pull-through-cache-config
  - collection: vsphere
    group: ibmcloud/config
    field: pull-through-cache-disable
    mount_path: /var/run/vault/vsphere-ibmcloud-config/pull-through-cache-disable
  - collection: vsphere
    group: ibmcloud/config
    field: pull-through-cache-secret
    mount_path: /var/run/vault/vsphere-ibmcloud-config/pull-through-cache-secret
  - collection: vsphere
    group: ibmcloud/config
    field: vm-specs.json
    mount_path: /var/run/vault/vsphere-ibmcloud-config/vm-specs.json
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  dependencies:
  - name: "release:latest"
    env: RELEASE_IMAGE_LATEST_FROM_BUILD_FARM
  documentation: >-
    This step creates the files necessary to deploy a zonal vSphere UPI cluster.
    It requires an existing install-config.yaml to exist in the shared directory with the necessary configuration to deploy a cluster to the vSphere CI project.
    It uses this install-config.yaml to generate the govc.sh, Ignition, metadata.json, and kubeconfig files with the modifications required to support the vSphere UPI workflow.
    These files are copied to the shared directory for future consumption.
