chain:
  as: upi-aws-ovn-hybrid-post
  steps:
  - ref: aws-deprovision-stacks
  - ref: aws-deprovision-s3buckets
  - ref: upi-deprovision-aws
  - ref: ipi-deprovision-deprovision
  - ref: upi-deprovision-aws-check-destroy
  documentation: |-
    Deprovision the AWS UPI OVN hybrid cluster. Diagnostics are gathered by the
    workflow before this chain so callers can insert teardown steps, such as
    Windows BYOH host destruction, between gather and deprovision.
