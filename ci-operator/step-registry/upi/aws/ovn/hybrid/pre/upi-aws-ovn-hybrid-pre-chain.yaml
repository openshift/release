chain:
  as: upi-aws-ovn-hybrid-pre
  steps:
  - ref: ipi-install-rbac
  - chain: ipi-conf-aws
  - ref: ovn-conf
  - ref: ovn-conf-hybrid-manifest
  - chain: upi-install-aws
  documentation: |-
    Provision an AWS UPI cluster with OVN hybrid overlay. Hybrid networking is
    required for Windows BYOH nodes that run without MachineSets.
