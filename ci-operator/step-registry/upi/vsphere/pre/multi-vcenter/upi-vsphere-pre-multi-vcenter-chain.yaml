chain:
  as: upi-vsphere-pre-multi-vcenter
  steps:
  - ref: ipi-install-rbac
  - ref: openshift-cluster-bot-rbac
  - chain: upi-conf-vsphere-multi-vcenter
  - ref: upi-install-vsphere
