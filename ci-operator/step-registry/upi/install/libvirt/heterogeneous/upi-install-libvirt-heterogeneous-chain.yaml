chain:
  as: upi-install-libvirt-heterogeneous
  steps:
  - ref: upi-install-libvirt-heterogeneous-network
  - ref: rhcos-conf-osstream
  - ref: upi-install-libvirt
  - ref: upi-install-libvirt-heterogeneous
  env:
  - name: ARCH
    default: "s390x"
  - name: ADDITIONAL_WORKER_ARCHITECTURE
    default: "arm64"
  - name: ADDITIONAL_LIBVIRT_PORT
    default: "16511"
  - name: BRANCH
  documentation: |-
    Provisions a heterogeneous OpenShift cluster on libvirt: boots s390x control plane and compute
    nodes via upi-install-libvirt, then provisions arm64 additional compute nodes via
    upi-install-libvirt-heterogeneous.
