ref:
  as: upi-install-libvirt-heterogeneous-network
  from: libvirt-installer
  commands: upi-install-libvirt-heterogeneous-network-commands.sh
  env:
  - name: ARCH
    default: "s390x"
  - name: USE_EXTERNAL_DNS
    default: 'false'
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  dnsConfig:
    nameservers:
    - 172.30.38.188
    searches:
    - "bastion-z.svc.cluster.local"
    - "bastion-ppc64le-libvirt.svc.cluster.local"
  documentation: |-
    Defines and starts the primary libvirt NAT network and publishes the ARM bridge name.
    Reads vxlan.additional-bridge from the private lease record and writes it to SHARED_DIR/arm-bridge-name
    for use by the heterogeneous installer step.
    Infra owns both VXLAN endpoints and their attachment lifecycle; this step performs no hypervisor SSH operations.
