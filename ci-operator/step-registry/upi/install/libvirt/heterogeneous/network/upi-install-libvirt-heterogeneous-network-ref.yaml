ref:
  as: upi-install-libvirt-heterogeneous-network
  from: libvirt-installer
  commands: upi-install-libvirt-heterogeneous-network-commands.sh
  env:
  - name: ARCH
    default: "s390x"
  - name: USE_EXTERNAL_DNS
    default: 'false'
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  dnsConfig:
    nameservers:
    - 172.30.38.188
    searches:
    - "bastion-z.svc.cluster.local"
    - "bastion-ppc64le-libvirt.svc.cluster.local"
  documentation: |-
    Defines and starts the primary libvirt NAT network, then extends it over VXLAN to the ARM
    infrastructure bridge.  VXLAN topology (local-ip, remote-ip, VNI, dstport, interface,
    additional-bridge) is read from the lease's vxlan object in the private profile; host-specific
    addresses are never placed in public job YAML.  Requires ssh-hypervisor-key and
    ssh-hypervisor-known-hosts to be provisioned in the cluster profile by infra.
    Writes arm-bridge-name to SHARED_DIR for use by downstream steps.
