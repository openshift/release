ref:
  as: oape-ci-monitor
  from_image:
    namespace: oape
    name: ai-e2e-agent
    tag: ci-monitor-agent
  commands: oape-ci-monitor-commands.sh
  env:
  - name: DRY_RUN
    default: "true"
    documentation: |-
      If "true", monitor and dispatch run in report-only mode without posting fixes.
  - name: REVIEW_HANDLER_ENABLED
    default: "false"
    documentation: |-
      If "true", dispatch runs review-handler when CI is green.
  - name: OAPE_TARGET_REPO
    default: ""
    documentation: |-
      owner/repo for pj-rehearse redirect when the job runs in openshift/release context.
  - name: OAPE_TEST_PR_NUMBER
    default: ""
    documentation: |-
      Optional pinned PR number for staged testing and rehearsal.
  - name: SELF_JOB_NAME
    default: "oape-ci-monitor"
    documentation: |-
      This job's Prow context name; excluded from CI monitoring.
  - name: CLOUD_ML_REGION
    default: "global"
    documentation: |-
      Google Cloud region for Vertex AI.
  - name: ANTHROPIC_VERTEX_PROJECT_ID
    default: "itpc-gcp-hcm-pe-eng-claude"
    documentation: |-
      Google Cloud project ID for Vertex AI authentication.
  - name: GOOGLE_APPLICATION_CREDENTIALS
    default: "/var/run/gcloud-adc/application_default_credentials.json"
    documentation: |-
      Path to the Google Cloud service account JSON for Vertex AI authentication.
  - name: OAPE_ROOT
    default: "/app"
    documentation: |-
      Root directory containing scripts/ci-monitor and scripts/pr-agent in the image.
  credentials:
  - mount_path: /var/run/gcloud-adc
    name: oap-lts-claude-gcp-vertex-sa
    namespace: test-credentials
  - mount_path: /var/run/github-app
    name: openshift-app-platform-shift-github-bot
    namespace: test-credentials
  timeout: 3h0m0s
  resources:
    requests:
      cpu: "1"
      memory: 500Mi
    limits:
      cpu: "2"
      memory: 2Gi
  documentation: |-
    Monitor operator PR CI status, classify failures, and optionally dispatch
    auto-fix actions. Uses the ci-monitor-agent image built from oape-ai-e2e CI
    config. Teams onboard by adding an optional presubmit that references this
    ref and sets OAPE_TARGET_REPO for rehearsal when needed.
