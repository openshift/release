ref:
  as: ipi-aws-describe
  from: upi-installer
  commands: ipi-aws-describe-commands.sh
  best_effort: true
  timeout: 10m
  grace_period: 30s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Post-install best-effort step that discovers and inventories all AWS resources created by the cluster,
    using AWS Resource Groups Tagging API for regional resources and native IAM APIs for
    IAM roles. Writes a comprehensive inventory to artifacts for debugging.

    Discovery methodology:
    - Regional resources: Resource Groups Tagging API with kubernetes.io/cluster/${INFRA_ID}=owned filter
    - Global resources: Partition-aware query (us-east-1 for commercial, us-gov-west-1 for GovCloud,
      cn-north-1 for China) for IAM instance profiles and Route53 hosted zones
    - IAM roles: Enumeration via list-roles (pre-filtered by INFRA_ID pattern) + list-role-tags
      for each candidate (Tagging API doesn't return IAM roles)
    - Error handling: API failures are logged with redacted account IDs; failed queries result in
      empty collections but allow the step to continue

    Resource detail queries:
    Most detail queries rely solely on tag filters (not discovered IDs) to avoid issues with stale
    or deleted resources. EC2 instances use both instance IDs and tag filters for verification.
    All queries use the kubernetes.io/cluster/${INFRA_ID}=owned tag filter.

    This step automatically discovers and queries details for:
    - EC2 Instances, EBS Volumes, Network Interfaces
    - VPCs, Subnets, Security Groups, Route Tables
    - Internet Gateways, NAT Gateways, Elastic IPs
    - VPC Endpoints, Network ACLs, DHCP Option Sets, VPC Peering Connections
    - Load Balancers (Classic, Application, Network) and Target Groups
    - S3 Buckets (all AWS partitions), KMS Keys (including multi-region configuration)
    - IAM Roles and Instance Profiles (including permissions boundaries)
    - Route53 Hosted Zones

    Outputs:
    - ${ARTIFACT_DIR}/aws-cluster-describe.json - Full JSON inventory with sensitive data redacted
    - ${ARTIFACT_DIR}/aws-cluster-describe.log - Human-readable summary of all resources
    - ${SHARED_DIR}/aws-cluster-describe.json - Copy of JSON for use by subsequent steps

    Comprehensive redaction of sensitive data:
    - Public IPv4 and IPv6 addresses (instances, NAT gateways, Elastic IPs, ENIs, NLB static IPs)
    - Public DNS names containing IP addresses (instances, network interfaces including top-level
      PublicDnsName and PublicIpDnsNameOptions fields)
    - AWS account IDs in:
      - Resource ARNs (ELB, target groups, IAM roles, instance profiles, KMS keys)
      - EBS volume KmsKeyId encryption key ARNs
      - Ownership fields (VPC, subnet, security group, route table, peering connections)
      - Cross-account security group rule references (UserIdGroupPairs)
      - Network interface attachment and association owner IDs
      - Route table instance owner IDs
      - Elastic IP network interface owner IDs
      - KMS multi-region configuration (primary and replica key ARNs)
      - IAM permissions boundary ARNs
      - IAM instance profile ARNs
      - VPC endpoint DNS entries (hosted zone IDs)
      - AWS API error messages (using sed pattern: s/[0-9]{12}/REDACTED/g)
    - IAM trust policies (AssumeRolePolicyDocument redacted to "REDACTED")
    - VPC endpoint policy documents (redacted to prevent principal account ID exposure)
    - Network interface requester IDs (when containing 12-digit account IDs; service aliases preserved)

    Large inventory handling: Uses temporary files to avoid kernel argument size limits (128KB),
    supporting clusters with hundreds of resources and large JSON collections.

    This step is marked as best_effort and will not fail the test if AWS queries fail.
    It is primarily useful for debugging cluster configuration and verifying resource creation.
