ref:
  as: ipi-aws-describe
  from: upi-installer
  commands: ipi-aws-describe-commands.sh
  best_effort: true
  timeout: 10m
  grace_period: 30s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Post-install step that discovers and inventories all AWS resources created by the cluster,
    using AWS Resource Groups Tagging API for regional resources and native IAM APIs for
    IAM roles. Writes a comprehensive inventory to artifacts for debugging.

    Discovery methodology:
    - Regional resources: Resource Groups Tagging API with kubernetes.io/cluster/${INFRA_ID}=owned
    - Global resources: Separate us-east-1 query for IAM instance profiles and Route53 zones
    - IAM roles: Enumeration via list-roles + list-role-tags (Tagging API doesn't return roles)
    - Error handling: Distinguishes API failures from legitimately empty inventories

    This step automatically discovers and queries details for:
    - EC2 Instances (with ownership tag filter), EBS Volumes, Network Interfaces
    - VPCs, Subnets, Security Groups (with cross-account rule details), Route Tables
    - Internet Gateways, NAT Gateways, Elastic IPs
    - VPC Endpoints, Network ACLs, DHCP Option Sets, VPC Peering Connections
    - Load Balancers (Classic, Application, Network) and Target Groups
    - S3 Buckets (with GovCloud partition support), KMS Keys (including multi-region config)
    - IAM Roles and Instance Profiles (including permissions boundaries)
    - Route53 Hosted Zones

    Outputs:
    - ${ARTIFACT_DIR}/aws-cluster-describe.json - Full JSON inventory with sensitive data redacted
    - ${ARTIFACT_DIR}/aws-cluster-describe.log - Human-readable summary of all resources
    - ${SHARED_DIR}/aws-cluster-describe.json - Copy of JSON for use by subsequent steps

    Comprehensive redaction of sensitive data:
    - Public IPv4 and IPv6 addresses in instances, NAT gateways, Elastic IPs, and ENIs
    - Public DNS names containing IP addresses
    - AWS account IDs in resource ARNs, ownership fields, and cross-account security group rules
    - IAM trust policies (AssumeRolePolicyDocument)
    - Load balancer and target group account IDs in ARNs
    - Network interface attachment and association owner IDs
    - KMS multi-region key ARNs
    - IAM permissions boundary ARNs

    Large inventory handling: Uses temporary files to avoid kernel argument size limits,
    supporting clusters with hundreds of resources.

    This step is marked as best_effort and will not fail the test if AWS queries fail.
    It is primarily useful for debugging cluster configuration and verifying resource creation.
