ref:
  as: ipi-deprovision-aws-custom-security-groups
  from_image:
    namespace: ocp
    name: "4.14"
    tag: upi-installer
  grace_period: 10m
  commands: ipi-deprovision-aws-custom-security-groups-commands.sh
  resources:
    requests:
      cpu: 300m
      memory: 300Mi
  documentation: |-
    The deprovision step tears down the custom security groups if they exist.
  env:
  - default: ""
    documentation: When set, overrides LEASED_RESOURCE as the AWS region. Used for
      region qualification rehearsals.
    name: AWS_REGION_OVERWRITE
