ref:
  as: ipi-install-aws-verify-resources
  from: cli
  commands: ipi-install-aws-verify-resources-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Discovers and outputs all AWS resources for the installed cluster.

    This step queries AWS to list and describe cluster resources including:
    - EC2 instances (with instance type, CPU options, state)
    - EBS volumes
    - Security groups
    - Load balancers
    - VPC and subnets

    Output is written to ${ARTIFACT_DIR} for inspection and debugging.
    This is particularly useful for verifying cluster configuration and
    feature-specific settings (e.g., nested virtualization, dedicated hosts).
