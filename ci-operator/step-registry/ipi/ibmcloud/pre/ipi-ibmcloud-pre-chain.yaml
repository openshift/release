chain:
  as: ipi-ibmcloud-pre
  steps:
  - chain: ipi-conf-ibmcloud
  - chain: ipi-install
  - ref: ipi-ibmcloud-configure-ingress-timeout
  documentation: |-
    The IPI setup step contains all steps that provision an OpenShift cluster
    with a default configuration on IBM Cloud. Set IBMCLOUD_INGRESS_IDLE_TIMEOUT
    to optionally override the ingress HTTPS listener idle timeout in seconds.
