ref:
  as: ipi-ibmcloud-configure-ingress-timeout
  from_image:
    namespace: ocp
    name: "4.20"
    tag: upi-installer
  commands: ipi-ibmcloud-configure-ingress-timeout-commands.sh
  cli: latest
  timeout: 15m0s
  grace_period: 2m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: IBMCLOUD_INGRESS_IDLE_TIMEOUT
    default: ""
    documentation: |-
      Idle timeout in seconds for the IBM Cloud VPC ingress HTTPS listener on
      port 443. Must be an integer from 50 to 7200. Empty skips configuration.
  documentation: |-
    Optionally configure the ingress HTTPS listener idle timeout after cluster
    installation. Finds the load balancer by the router-default Service hostname,
    authenticates with the cluster profile's ibmcloud-api-key, and waits for the
    listener to become active with the requested timeout. Other listeners are
    left unchanged. No cloud or cluster requests are made when the parameter is empty.
