chain:
  as: ipi-conf-vsphere-multi-vcenter
  steps:
  - ref: ipi-conf-vsphere-check
  - ref: ipi-conf-vsphere-check-vcm
  - ref: ipi-conf-vsphere-vips
  - ref: ipi-conf-vsphere-vips-vcm
  - ref: ipi-conf-vsphere-dns
  - ref: ipi-conf
  - ref: ipi-conf-telemetry
  - ref: ipi-conf-vsphere-multi-vcenter
  - ref: ipi-conf-vsphere-vcm
  env:
  - name: POOL_COUNT
    default: "3"
    documentation: >-
      The number of pools (failure domains) to request in the single VCM lease covering
      all vCenters.
  - name: MIN_VCENTERS
    default: "2"
    documentation: >-
      The minimum number of distinct vCenters the lease's pools must span so the cluster
      genuinely exercises the multi-vCenter platform.  MAX_VCENTERS keeps its step default
      of 3, so the lease spans 2 or 3 vCenters depending on what VCM has available.
  - name: POOLS
    default: ""
    documentation: >-
      Must remain empty: this chain uses the single-lease POOL_COUNT path rather than
      requesting one lease per pool.
  documentation: >-
    The vSphere IPI configure step chain generates prerequisites for installing
    a cluster with multiple vcenters: IP addresses, DNS records, and the install-config.yaml.
    Resources are created based on the cluster profile and optional input files.
