ref:
  as: ipi-conf-vsphere-manual-credentials
  from: upi-installer
  commands: ipi-conf-vsphere-manual-credentials-commands.sh
  grace_period: 10m
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: vsphere
    group: ibmcloud/config
    mount_path: /var/run/vault/vsphere-ibmcloud-config
  documentation: >-
    Configure the standard single-vCenter install-config.yaml for Manual
    credentials mode with component-scoped credentials. The four accounts are
    assigned to machine management, storage, cloud controller manager, and
    vSphere problem detector respectively.
