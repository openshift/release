ref:
  as: ipi-conf-vsphere-proxy
  from: tools
  commands: ipi-conf-vsphere-proxy-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: openshift-qe
    group: qe-proxy
    mount_path: /var/run/vault/vsphere
  documentation: |-
    The proxy setting step adds proxy section in the install-config.yaml
