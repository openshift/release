ref:
  as: ipi-conf-vsphere-multi-nic-secondary-network
  from: cli
  commands: ipi-conf-vsphere-multi-nic-secondary-network-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: MULTI_NIC_IPI
    default: ""
    documentation: "When 'true', a MachineConfig is generated to keep the secondary NIC's DHCP lease from installing a competing default route or DNS servers on control-plane and worker nodes."
  documentation: |-
    When MULTI_NIC_IPI is set, drops a NetworkManager connection profile for the secondary NIC (ens224) into master/worker MachineConfigs so its DHCP lease cannot become a competing default route or DNS source. No-op otherwise.
