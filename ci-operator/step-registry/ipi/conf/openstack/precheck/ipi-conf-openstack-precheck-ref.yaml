ref:
  as: ipi-conf-openstack-precheck
  from: openstack-installer
  commands: ipi-conf-openstack-precheck-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
    - name: BASE_DOMAIN
    - name: CONFIG_TYPE
      default: ""
      documentation: |-
        Install topology variant. When the value contains externallb,
        api is checked against LB_HOSTS (UserManaged LB FIPs). api-int
        uses LB_PRIVATE_IPS when present, otherwise the API VIP.
    - name: WAIT_TIME
      default: "60"
      documentation: number of seconds to wait before trying.
    - name: TRY_COUNT
      default: "5"
      documentation: number of times to retry
  documentation: |-
    Verifies api/ingress (and api-int for externallb) DNS resolve to the
    expected addresses from SHARED_DIR before install. For multi-LB
    externallb, api-int is checked against LB_PRIVATE_IPS when present.
