ref:
  as: ipi-conf-openstack-precheck
  from: openstack-installer
  commands: ipi-conf-openstack-precheck-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
    - name: BASE_DOMAIN
    - name: CONFIG_TYPE
      default: ''
      documentation: |-
        Install topology variant. Required so this step can distinguish
        non-proxy externallb (api -> LB_HOST) from proxy-externallb
        (api -> API_IP). Without declaring CONFIG_TYPE here, ci-operator
        does not inject the job/workflow value into the step.
    - name: WAIT_TIME
      default: "60"
      documentation: number of seconds to wait before trying.
    - name: TRY_COUNT
      default: "5"
      documentation: number of times to retry
  documentation: |-
    The ipi-conf-openstack-precheck verifies the OpenStack
    infrastructure is ready for deploying an OpenShift cluster
    on to it. For non-proxy externallb (CONFIG_TYPE contains
    externallb but not proxy) with LB_HOST present, api must
    resolve to the LB floating IP; proxy-externallb and api-int
    still use the internal API VIP.
