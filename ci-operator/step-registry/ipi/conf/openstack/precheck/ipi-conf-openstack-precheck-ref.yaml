ref:
  as: ipi-conf-openstack-precheck
  from: openstack-installer
  commands: ipi-conf-openstack-precheck-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
    - name: BASE_DOMAIN
    - name: CONFIG_TYPE
      default: ""
      documentation: |-
        Install topology variant. Must be declared here so ci-operator
        injects the job/workflow value (otherwise it is unset in this step).
        When the value contains externallb:
        - LB_HOSTS present (multi-LB): api checked against those FIPs;
          api-int against the machines-net API VIP.
        - non-proxy with LB_HOST: api checked against that FIP;
          api-int against the machines-net API VIP.
        - proxy-externallb: api stays on the API VIP (LB_HOST is ignored).
    - name: WAIT_TIME
      default: "60"
      documentation: number of seconds to wait before trying.
    - name: TRY_COUNT
      default: "5"
      documentation: number of times to retry
  documentation: |-
    Verifies api/ingress (and api-int for externallb) DNS resolve to the
    expected addresses from SHARED_DIR before install. For non-proxy
    externallb, api is checked against LB_HOSTS or LB_HOST; proxy-externallb
    and api-int still use the internal API VIP.
