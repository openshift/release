ref:
  as: ipi-conf-openstack-precheck
  from: openstack-installer
  commands: ipi-conf-openstack-precheck-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
    - name: BASE_DOMAIN
    - name: CONFIG_TYPE
      default: ""
      documentation: |-
        Install topology variant. When the value contains externallb,
        api is checked against LB_HOSTS (UserManaged LB FIPs) and
        api-int against the machines-net API VIP.
    - name: WAIT_TIME
      default: "60"
      documentation: number of seconds to wait before trying.
    - name: TRY_COUNT
      default: "5"
      documentation: number of times to retry
  documentation: |-
    The ipi-conf-openstack-precheck verifies DNS for api/ingress
    (and api-int for externallb) resolves to the expected addresses
    before install. For externallb with LB_HOSTS, api must resolve to
    those FIPs; api-int must resolve to the API VIP.
