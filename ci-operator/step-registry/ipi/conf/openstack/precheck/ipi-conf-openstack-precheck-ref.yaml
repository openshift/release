ref:
  as: ipi-conf-openstack-precheck
  from: openstack-installer
  commands: ipi-conf-openstack-precheck-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
    - name: BASE_DOMAIN
    - name: CONFIG_TYPE
      default: ""
      documentation: |-
        Install topology variant. Must be declared so ci-operator injects
        the job/workflow value into this step.
        - LB_HOSTS present (multi-LB): api checked against those FIPs;
          api-int against the machines-net API VIP.
        - Non-proxy externallb (contains externallb, not proxy) with
          LB_HOST: api and ingress.apps checked against that FIP;
          api-int against the API VIP.
        - Otherwise api/ingress use API_IP/INGRESS_IP (VIPs).
    - name: WAIT_TIME
      default: "60"
      documentation: number of seconds to wait before trying.
    - name: TRY_COUNT
      default: "5"
      documentation: number of times to retry
  documentation: |-
    Verifies api/ingress (and api-int for externallb) DNS resolve to the
    expected addresses from SHARED_DIR before install. Multi-LB uses
    LB_HOSTS for api; non-proxy single-LB externallb uses LB_HOST for
    api and ingress.apps; api-int and proxy-externallb stay on VIPs.
