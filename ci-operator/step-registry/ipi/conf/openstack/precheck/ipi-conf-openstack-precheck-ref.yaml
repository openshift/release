ref:
  as: ipi-conf-openstack-precheck
  from: openstack-installer
  commands: ipi-conf-openstack-precheck-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
    - name: BASE_DOMAIN
    - name: WAIT_TIME
      default: "60"
      documentation: number of seconds to wait before trying.
    - name: TRY_COUNT
      default: "5"
      documentation: number of times to retry
  documentation: |-
    The ipi-conf-openstack-precheck verifies DNS for api/ingress
    (and api-int for externallb) resolves to the expected addresses
    before install. For externallb with LB_HOSTS, api/api-int must
    resolve to those UserManaged LB FIPs.
