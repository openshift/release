ref:
  as: ipi-conf-ibmcloud-worker-pod-disk
  from_image:
    namespace: origin
    name: centos
    tag: '8'
  commands: ipi-conf-ibmcloud-worker-pod-disk-commands.sh
  env:
    - name: WORKER_POD_DISK_NAME
      default: ""
      documentation: |-
        The name of the disk to partition and mount as /var/lib/containers storage. Default is empty, which will skip the MachineConfig creation.
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Writes a MachineConfig manifest to SHARED_DIR that partitions the local /dev/vdb disk and mounts it as /var/lib/etcd, for improved etcd performance on IBM Cloud master nodes.
