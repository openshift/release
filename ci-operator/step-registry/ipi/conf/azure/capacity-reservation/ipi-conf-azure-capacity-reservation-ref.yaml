ref:
  as: ipi-conf-azure-capacity-reservation
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  commands: ipi-conf-azure-capacity-reservation-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Patches install-config.yaml to add capacityReservationGroup references
    and zone pinning for both controlPlane and compute sections. Reads CRG
    metadata from SHARED_DIR written by azure-provision-capacity-reservation.
