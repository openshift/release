ref:
  as: ipi-conf-gcp-xpn
  grace_period: 10m
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  commands: ipi-conf-gcp-xpn-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: NETWORK_TAGS_FOR_COMPUTE_NODES
    default: "preserved-ipi-compute"
    documentation: Network tags applied to compute nodes, comma separated strings. Must match the value given to ipi-conf-gcp-firewall-rules-management, which pins them on the machine pools, so the firewall rules created here target the right instances.
  - name: NETWORK_TAGS_FOR_CONTROL_PLANE_NODES
    default: "preserved-ipi-control-plane"
    documentation: Network tags applied to control-plane nodes, comma separated strings. Must match the value given to ipi-conf-gcp-firewall-rules-management, which pins them on the machine pools, so the firewall rules created here target the right instances.
  documentation: >-
    This step configures an install-config.yaml file to depoloy to the GCP CI project.
    An existing install-config.yaml file should already exist in the shared directory.
    The file is modified to configure the cluster to run in the GCP CI project.
    The resulting file remains in the shared directory for future consumption.
