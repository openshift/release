chain:
  as: ipi-conf-gcp-xpn
  steps:
    - ref: ipi-conf
    - ref: ipi-conf-telemetry
    - ref: ipi-conf-gcp
    - ref: ipi-conf-gcp-zones
    - ref: ipi-conf-gcp-xpn
    - ref: ipi-conf-gcp-firewall-rules-management
    - ref: ipi-install-monitoringpvc
  env:
  - name: FILEWALL_RULES_MANAGEMENT
    default: "Unmanaged"
    documentation: >-
      CAPG skips all firewall reconciliation when a host project is set, so nothing creates the
      cluster firewall rules for a shared VPC install. ipi-conf-gcp-xpn pre-creates them in the
      host project instead, and this tells the installer and cloud-provider-gcp to leave firewall
      rules alone.
  - name: NETWORK_TAGS_FOR_COMPUTE_NODES
    default: "preserved-ipi-compute"
    documentation: Network tags applied to compute nodes, comma separated strings. Shared by ipi-conf-gcp-xpn, which targets its firewall rules at them, and ipi-conf-gcp-firewall-rules-management, which pins them on the machine pools.
  - name: NETWORK_TAGS_FOR_CONTROL_PLANE_NODES
    default: "preserved-ipi-control-plane"
    documentation: Network tags applied to control-plane nodes, comma separated strings. Shared by ipi-conf-gcp-xpn, which targets its firewall rules at them, and ipi-conf-gcp-firewall-rules-management, which pins them on the machine pools.
  documentation: >-
    This chain generates an install-config.yaml file configured to run clusters in the GCP CI project.
    The GCP specific configs are added to the file generated by the ipi-conf steps.
    This resulting file is stored in the shared directory for future consumption.
