ref:
  as: ipi-conf-nutanix-multi-nic
  from_image:
   namespace: ocp
   name: "4.18"
   tag: upi-installer
  commands: ipi-conf-nutanix-multi-nic-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: cluster-secrets-nutanix
    group: nutanix-pc
    mount_path: /var/run/vault/nutanix
  documentation: >-
    This step add multi-nic to the install-config.yaml
