ref:
  as: ipi-conf-aws-byo-iam-role
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  grace_period: 10m
  commands: ipi-conf-aws-byo-iam-role-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: ENABLE_BYO_IAM_ROLE_CUMPUTE
    default: "true"
  - name: ENABLE_BYO_IAM_ROLE_CONTROL_PLANE
    default: "true"
  - name: ENABLE_BYO_IAM_ROLE_DEFAULT_MACHINE
    default: "false"
  - name: ENABLE_BYO_IAM_ROLE_EDGE
    default: "false"
  documentation: |-
    Generate BYO IAM role configuration.
    - ENABLE_BYO_IAM_ROLE_CUMPUTE: compute.platform.aws.iamRole
    - ENABLE_BYO_IAM_ROLE_CONTROL_PLANE: controlPlane.platform.aws.iamRole
    - ENABLE_BYO_IAM_ROLE_DEFAULT_MACHINE: platform.aws.defaultMachinePlatform.iamRole
    - ENABLE_BYO_IAM_ROLE_EDGE: iamRole on the edge compute pool
      (compute[name=edge], AWS Local/Wavelength zones). Requires the edge role to
      have been provisioned (aws-provision-iam-role with PROVISION_EDGE_IAM_ROLE=yes)
      and the edge pool to exist (ipi-conf-aws with AWS_EDGE_POOL_ENABLED).
