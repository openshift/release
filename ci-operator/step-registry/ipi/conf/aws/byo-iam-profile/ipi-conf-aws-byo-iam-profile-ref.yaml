ref:
  as: ipi-conf-aws-byo-iam-profile
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  grace_period: 10m
  commands: ipi-conf-aws-byo-iam-profile-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: ENABLE_BYO_IAM_PROFILE_CUMPUTE
    default: "true"
  - name: ENABLE_BYO_IAM_PROFILE_CONTROL_PLANE
    default: "true"
  - name: ENABLE_BYO_IAM_PROFILE_DEFAULT_MACHINE
    default: "false"
  - name: ENABLE_BYO_IAM_PROFILE_EDGE
    default: "false"
  documentation: |-
    Generate BYO IAM profile configuration.
    - ENABLE_BYO_IAM_PROFILE_CUMPUTE: compute.platform.aws.iamProfile
    - ENABLE_BYO_IAM_PROFILE_CONTROL_PLANE: controlPlane.platform.aws.iamProfile
    - ENABLE_BYO_IAM_PROFILE_DEFAULT_MACHINE: platform.aws.defaultMachinePlatform.iamProfile
    - ENABLE_BYO_IAM_PROFILE_EDGE: iamProfile on the edge compute pool
      (compute[name=edge], AWS Local/Wavelength zones). Requires the edge profile to
      have been provisioned (aws-provision-iam-profile with PROVISION_EDGE_IAM_PROFILE=yes)
      and the edge pool to exist (ipi-conf-aws with AWS_EDGE_POOL_ENABLED).
