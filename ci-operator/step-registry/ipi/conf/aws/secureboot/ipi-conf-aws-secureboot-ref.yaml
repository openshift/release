ref:
  as: ipi-conf-aws-secureboot
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  commands: ipi-conf-aws-secureboot-commands.sh
  grace_period: 10m
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: AWS_SECUREBOOT_ENABLED
    default: ""
    documentation: |-
      Set to "true" to enable UEFI Secure Boot on worker nodes. When empty
      (the default), this step is a no-op.
  - name: AWS_SECUREBOOT_ENROLL_KMM_CERT
    default: "false"
    documentation: |-
      Set to "true" to enroll the public KMM QE module-signing CA into the
      Secure Boot worker firmware. This is required by KMM filestosign tests.
  - name: AWS_SECUREBOOT_KMM_CERT_GUID
    default: 77fa9abd-0359-4d32-bd60-28f4e78f784b
    documentation: |-
      UEFI GUID used when enrolling the KMM QE signing certificate.
  dependencies:
  - name: "release:latest"
    env: OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE
  - name: "release:latest"
    env: RELEASE_IMAGE_LATEST
  documentation: |-
    This step enables UEFI Secure Boot for AWS worker nodes. It creates a
    custom RHCOS AMI with Secure Boot keys enrolled (Red Hat PK, KEK, and
    Microsoft UEFI certificates) and patches install-config.yaml to use it
    on compute nodes. Only Nitro-based instance types are supported.
    The custom AMI and copied snapshot are cleaned up by the
    aws-deprovision-secureboot post step.
