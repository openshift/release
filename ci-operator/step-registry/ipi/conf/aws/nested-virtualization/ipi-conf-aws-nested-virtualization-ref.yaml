ref:
  as: ipi-conf-aws-nested-virtualization
  from_image:
    namespace: ocp
    name: "5.0"
    tag: upi-installer
  commands: ipi-conf-aws-nested-virtualization-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Configures AWS compute nodes to enable nested virtualization via install-config.yaml.

    This step modifies the install-config.yaml to add cpuOptions.nestedVirtualization=Enabled
    to the compute machine pool configuration. This enables nested virtualization at cluster
    provisioning time rather than requiring post-installation modification.

    The step expects install-config.yaml to already exist in ${SHARED_DIR}.
