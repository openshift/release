ref:
  as: ipi-conf-aws-nested-virtualization
  from_image:
    namespace: ocp
    name: "5.0"
    tag: upi-installer
  commands: ipi-conf-aws-nested-virtualization-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Configures AWS compute nodes to enable nested virtualization via install-config.yaml.

    This step modifies the existing worker compute pool in install-config.yaml to:
    - Set management: ClusterAPI
    - Set platform.aws.cpuOptions.nestedVirtualization: Enabled

    This enables nested virtualization at cluster provisioning time rather than requiring
    post-installation modification.

    The step must run after ipi-conf-aws (which creates install-config.yaml) and before
    ipi-install (which consumes it).
