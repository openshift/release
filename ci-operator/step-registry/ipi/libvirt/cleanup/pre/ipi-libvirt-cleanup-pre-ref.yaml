ref:
  as: ipi-libvirt-cleanup-pre
  from: libvirt-installer
  grace_period: 10m
  commands: ipi-libvirt-cleanup-pre-commands.sh
  env:
  - name: LIBVIRT_POOL_NAME
    default: ""
    documentation: |-
      When set (VPN hybrid IPI), also delete ${LEASED_RESOURCE}-* volumes from this shared pool.
  resources:
    requests:
      cpu: 1000m
      memory: 300Mi
  dnsConfig:
    nameservers:
    - 172.30.38.188
    searches:
    - "bastion-z.svc.cluster.local"
    - "bastion-ppc64le-libvirt.svc.cluster.local"
  documentation: |-
    A libvirt specific cleanup step that assumes the lease information will be sufficient to lookup the
    libvirt daemon connection string and that all associated resources will have the lease embedded in
    their name. When LIBVIRT_POOL_NAME is set, also removes lease-prefixed volumes from that shared pool.
