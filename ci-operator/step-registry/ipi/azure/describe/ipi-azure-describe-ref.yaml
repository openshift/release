ref:
  as: ipi-azure-describe
  from_image:
    namespace: ocp
    name: "4.16"
    tag: upi-installer
  commands: ipi-azure-describe-commands.sh
  best_effort: true
  timeout: 10m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Post-install step that queries Azure Resource Graph for all resources in the
    cluster resource group and writes the inventory to artifacts. Sensitive values
    (SSH keys, passwords, VM custom data and user data, extension protected settings,
    public IP addresses, public DNS A/AAAA record addresses, and public IP prefixes)
    are removed or redacted from the output.
