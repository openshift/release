chain:
  as: ipi-vsphere-pre-manual-credentials-mode
  steps:
  - chain: ipi-conf-vsphere
  - ref: ipi-conf-credentials-mode
  - ref: ipi-conf-vsphere-manual-credentials
  - chain: ipi-install-vsphere
  env:
  - name: CREDENTIALS_MODE
    default: Manual
    documentation: Set the vSphere install configuration to use manual cloud credentials.
  documentation: |-
    The IPI setup step provisions an OpenShift cluster on vSphere with
    credentialsMode set to Manual in install-config.yaml.
