ref:
  as: openshift-mcp-server-deploy
  cli: latest
  commands: openshift-mcp-server-deploy-commands.sh
  dependencies:
  - env: IMAGE_OPENSHIFT_MCP_SERVER
    name: openshift-mcp-server
  from: cli
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Enables the Open Data Hub MCP lifecycle component and deploys an OpenShift MCP server with TLS.
