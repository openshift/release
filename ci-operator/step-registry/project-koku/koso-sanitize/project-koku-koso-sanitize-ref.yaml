ref:
  as: project-koku-koso-sanitize
  from: koku-service-operator-e2e
  commands: project-koku-koso-sanitize-commands.py
  run_as_script: true
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
  documentation: |-
    Install a fail-closed redaction helper into SHARED_DIR and run its self-test.
    The helper redacts credentials, session IDs, PII, URLs, and internal hosts in
    JSON, YAML, XML, HTML, and Python repr, including quoted and unquoted keys.
    Later steps must source ${SHARED_DIR}/koso-sanitize.sh so every command stream
    and artifact path uses the tested sanitizer. Dynamic oc/kubectl/operator
    commands must use _run_sanitized (logs) so stdout and stderr are redacted, or
    _capture_sanitized (values) so stderr is redacted and the command status is
    preserved. _capture_sanitized assigns raw stdout to the caller variable;
    callers must not echo the captured value. The step fails if sanitization
    fails. Kubeconfigs, unknown binaries, and files that cannot be parsed or
    sanitized are withheld from publication.
