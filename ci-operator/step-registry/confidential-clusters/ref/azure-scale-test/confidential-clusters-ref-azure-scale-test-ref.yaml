ref:
  as: confidential-clusters-ref-azure-scale-test
  from: src
  cli: latest
  grace_period: 2m
  commands: confidential-clusters-ref-azure-scale-test-commands.sh
  credentials:
  - collection: confidential-qe
    group: azure-qe
    mount_path: /tmp/secrets/azure-qe
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Runs the operator repository's scale tests (tests/Makefile's scale-tests
    target) against the installed cluster, pointing them at the VM image
    created by confidential-clusters-ref-azure-provision.
