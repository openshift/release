ref:
  as: confidential-clusters-ref-azure-provision
  from: upi-installer
  grace_period: 2m
  commands: confidential-clusters-ref-azure-provision-commands.sh
  credentials:
  - collection: confidential-qe
    group: azure-qe
    mount_path: /tmp/secrets/azure-qe
  env:
  - name: AZURE_REGION
    default: eastus
    documentation: |-
      The Azure region to create the test resource group, storage account, and
      compute gallery in.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Logs in to the Azure subscription leased via cluster_profile and creates a
    resource group, storage account, and container in it. Separately logs in
    with the static azure-qe service principal to download a known-good
    confidential VM disk image (named by the cocl-test-image credential,
    formatted as "${storage_account}/${container}/${blob_name}"), re-uploads
    it into the newly created storage account/container under the same blob
    name, and creates a compute gallery, image definition, and image version
    0.0.1 from it for use as the VM image in the scale tests.
