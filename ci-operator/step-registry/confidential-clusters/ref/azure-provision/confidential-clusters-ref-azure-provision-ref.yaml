ref:
  as: confidential-clusters-ref-azure-provision
  from: upi-installer
  grace_period: 2m
  commands: confidential-clusters-ref-azure-provision-commands.sh
  credentials:
  - collection: confidential-qe
    group: azure-qe
    mount_path: /tmp/secrets/azure-qe
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Download a CVM disk image from the azure-qe service principal,
    upload it in the subscription leased via cluster_profile and
    create a VM image version based on it; in the appropriate
    `$SHARED_DIR/azure-region` if provided.
