ref:
  as: confidential-clusters-ref-azure-region-override
  from_image:
    namespace: ocp
    name: cli-yq
    tag: latest
  commands: confidential-clusters-ref-azure-region-override-commands.sh
  env:
  - name: AZURE_REGION_OVERRIDE
    default: ""
    documentation: |-
      When set, override the Azure region for cluster installation.
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
  documentation: |-
    Overrides platform.azure.region in "$SHARED_DIR/install-config.yaml"
    to AZURE_REGION_OVERRIDE. Writes region to "$SHARED_DIR/azure-region".
    Run after install-config.yaml is written, but before ipi-install.

    Used because at the time of writing, there is only a quota for DCa*_v5
    (but not v6) machines which are not available in all regions.
