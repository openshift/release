ref:
  as: confidential-clusters-ref-azure-cleanup
  from: upi-installer
  grace_period: 2m
  commands: confidential-clusters-ref-azure-cleanup-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Deletes the resource group created by confidential-clusters-ref-azure-provision,
    using the resource group name recorded in ${SHARED_DIR}.
