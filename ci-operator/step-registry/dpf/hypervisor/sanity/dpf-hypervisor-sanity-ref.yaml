ref:
  as: dpf-hypervisor-sanity
  commands: dpf-hypervisor-sanity-commands.sh
  documentation: |-
    Run DPF sanity tests on an existing cluster without provisioning.

    This step:
    1. Verifies cluster access via oc commands
    2. Runs make verify-workers, verify-dpu-nodes, verify-deployment,
       verify-dpudeployment
    3. Runs make run-dpf-sanity

    Prerequisites:
    - dpf-hypervisor-load-kubeconfig must run before this step
      (provides kubeconfig and .env in ${SHARED_DIR})

    Expected duration: 15-30 minutes
  from: dpf-ci
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  timeout: 1h0m0s
