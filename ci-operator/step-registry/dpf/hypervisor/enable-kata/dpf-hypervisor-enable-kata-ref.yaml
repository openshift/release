ref:
  as: dpf-hypervisor-enable-kata
  commands: dpf-hypervisor-enable-kata-commands.sh
  documentation: |-
    Enable Kata DPU cold-plug support on an existing DPF cluster.

    This step:
    1. Uses the kubeconfig and .env from dpf-hypervisor-load-kubeconfig
    2. Enables the Kata runtime-class mapping in the OVN resource injector
    3. Installs/configures Kata support and waits for the DPU worker MCP rollout

    Prerequisites:
    - A healthy DPF cluster with DPU workers and /dev/kvm available
    - dpf-hypervisor-load-kubeconfig and dpf-hypervisor-sanity run before this step

    This step can reboot DPU workers while MachineConfig changes are applied.
    Expected duration: 30-90 minutes
  from: dpf-ci
  grace_period: 1m0s
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  timeout: 3h0m0s
