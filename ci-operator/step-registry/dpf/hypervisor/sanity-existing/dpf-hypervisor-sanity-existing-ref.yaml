ref:
  as: dpf-hypervisor-sanity-existing
  commands: dpf-hypervisor-sanity-existing-commands.sh
  credentials:
  - mount_path: /var/run/dpf-ci
    name: cluster-secrets-metal-dpf-doca8
    namespace: ci
  documentation: |-
    Run DPF sanity tests on an EXISTING cluster without provisioning.

    This step:
    1. Sets up SSH access to hypervisor
    2. Runs make verify-workers, verify-dpu-nodes, verify-deployment,
       verify-dpudeployment via SSH on the bastion host
    3. Runs make run-dpf-sanity via SSH on the bastion host

    Prerequisites:
    - A working kubeconfig and .env in ${SHARED_DIR}

    Use this for quick validation on doca8 or other existing clusters.
    Does NOT create or destroy any cluster resources.

    Required Vault secrets:
    - private-key: SSH key for hypervisor
    - remote-host: IP address of the hypervisor bastion host

    Expected duration: 15-30 minutes
  from: dpf-ci
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  timeout: 1h0m0s
