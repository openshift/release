ref:
  as: dpf-hypervisor-doca5-aicli-token-stage
  commands: dpf-hypervisor-doca5-aicli-token-stage-commands.sh
  documentation: |-
    DOCA5-only trial helper. Stage the Vault-backed aicli offline token at
    root's aicli default path on the hypervisor before the shared deploy step.
    The matching post step restores any previous token or removes the staged
    token after the job.

    Required Vault secrets:
    - aicli-offlinetoken: Red Hat offline token consumed by aicli
    - private-key: SSH key for the hypervisor
    - remote-host: hypervisor hostname
  from: dpf-ci
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  grace_period: 30s
  timeout: 2m0s
