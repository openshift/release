ref:
  as: dpf-hypervisor-network-tests
  commands: dpf-hypervisor-network-tests-commands.sh
  documentation: |-
    Run Kubernetes Network Traffic Flow Tests on an EXISTING DPF cluster.

    This step:
    1. SSHs to the hypervisor bastion to start an iperf3 server container
    2. Uses the kubeconfig from the dpf-hypervisor-load-kubeconfig step
    3. Selects two worker-dpu nodes as TFT_SERVER_NODE and TFT_CLIENT_NODE
    4. Runs 'make run-traffic-flow-tests' with TFT_EXTERNAL_SERVER pointing
       to the bastion iperf3 server
    5. Cleans up the iperf3 container on exit

    Prerequisites:
    - A working kubeconfig and .env in ${SHARED_DIR}
    - dpf-hypervisor-sanity-existing is recommended to run before to verify cluster health

    Required Vault secrets:
    - private-key: SSH key for hypervisor
    - remote-host: IP address of the hypervisor bastion host

    Expected duration: 60-120 minutes
  from: dpf-ci
  grace_period: 1m0s
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  timeout: 2h0m0s
