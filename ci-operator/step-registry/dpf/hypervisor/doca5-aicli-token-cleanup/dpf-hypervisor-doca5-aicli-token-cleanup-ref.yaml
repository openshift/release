ref:
  as: dpf-hypervisor-doca5-aicli-token-cleanup
  commands: dpf-hypervisor-doca5-aicli-token-cleanup-commands.sh
  documentation: |-
    DOCA5-only trial cleanup. Restore the hypervisor's previous aicli offline
    token, or remove the Vault-backed token staged for this job if there was no
    previous token. This step is intended for the job's post phase.

    Required Vault secrets:
    - private-key: SSH key for the hypervisor
    - remote-host: hypervisor hostname
  from: dpf-ci
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  grace_period: 30s
  timeout: 2m0s
