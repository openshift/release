ref:
  as: dpf-hypervisor-deploy-cluster
  commands: dpf-hypervisor-deploy-cluster-commands.sh
  documentation: |-
    Deploy OpenShift cluster with DPF running directly in the Prow pod with
    nested podman. The Assisted Installer runs locally as a podman container
    while VMs are managed remotely on the hypervisor via LIBVIRT_HOST.

    This step:
    1. Generates .env configuration with LIBVIRT_HOST for remote VM management
    2. Runs 'make ${DPF_DEPLOY_MAKE_TARGET}' (default 'all') which deploys the
       Assisted Installer (podman) and orchestrates cluster creation on the
       remote hypervisor
    3. Copies deployment artifacts (.env, kubeconfig) back to the bastion

    The deployment includes:
    - Local Assisted Installer instance (podman container in Prow pod)
    - Remote VM provisioning on hypervisor via LIBVIRT_HOST
    - OpenShift cluster creation via Assisted Installer
    - DPF operator and prerequisites installation
    - HyperShift hosted cluster setup
    - Network configuration for DPUs

    Required Vault secrets:
    - private-key: SSH key for hypervisor
    - remote-host: IP address of the hypervisor bastion host
    - user-env: Environment variables for the cluster (env.user)
    - aicli-offlinetoken: Red Hat AI console offline token
    - dpf-pull-secret: DPF pull secret
    - openshift-pull-secret: OpenShift pull secret
    - cluster-name: Name of the cluster

    Expected duration: 4-6 hours depending on cluster size
  env:
  - default: "all"
    documentation: |-
      Make target to run on the hypervisor after 'make clean-all'. DPF jobs
      keep the default ('all'). Set to a thinner target (for example
      'create-base-cluster') when only cluster/VM bring-up is required.
    name: DPF_DEPLOY_MAKE_TARGET
  - default: "main"
    name: OPENSHIFT_DPF_BRANCH
  - default: "false"
    documentation: When set to "true", skip injecting the CI release payload into the deployment. The cluster will use whatever release the openshift-dpf Makefile defaults to.
    name: DPF_SKIP_CI_PAYLOAD
  - default: ""
    documentation: |-
      OpenShift version passed to openshift-dpf after sourcing the cluster profile.
      A full Assisted version such as 4.22.15-multi is accepted. When
      ${SHARED_DIR}/dpf-openshift-version exists, that file replaces this value
      and the CI release payload is not injected.
    name: DPF_OPENSHIFT_VERSION
  - default: "false"
    documentation: |-
      Require ${SHARED_DIR}/dpf-openshift-version and fail before contacting the
      hypervisor if the handoff is missing or invalid. Used by the signed DOCA2
      workflow to prevent falling back to the regular version.
    name: DPF_REQUIRE_SHARED_OPENSHIFT_VERSION
  cli: latest
  from: dpf-ci
  nested_podman: true
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  grace_period: 2m0s
  timeout: 5h0m0s
