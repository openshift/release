ref:
  as: dpf-hypervisor-e2e
  commands: dpf-hypervisor-e2e-commands.sh
  documentation: |-
    Run Kubernetes e2e tests on an EXISTING DPF cluster.

    Prerequisites:
    - A working kubeconfig and .env in ${SHARED_DIR}
    - dpf-hypervisor-sanity-existing is recommended to run before to verify cluster health

    Required Vault secrets:
    - remote-host: IP address of the hypervisor bastion host

    Expected duration: 60-120 minutes
  env:
  - default: ""
    name: E2E_GO_LABEL_FILTER
  from: dpf-ci
  grace_period: 1m0s
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  timeout: 2h0m0s
