ref:
  as: dpf-hypervisor-e2e
  commands: dpf-hypervisor-e2e-commands.sh
  documentation: |-
    Run Kubernetes e2e tests on an EXISTING DPF cluster.

    Prerequisites:
    - A working kubeconfig and .env in ${SHARED_DIR}
    - dpf-hypervisor-sanity-existing is recommended to run before to verify cluster health

    Required cluster profile secrets:
    - remote-host: IP address of the hypervisor bastion host
    - aicli-offlinetoken: Offline token for an account with access to the Assisted Installer cluster

    Timeout budget: 7 hours; complete full-suite runtime is not yet established.
  env:
  - default: 6h
    name: E2E_GINKGO_TIMEOUT
  - default: ""
    name: E2E_GO_LABEL_FILTER
  - default: 6h30m
    name: E2E_GO_TIMEOUT
  from: dpf-ci
  grace_period: 10m0s
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  timeout: 7h0m0s
