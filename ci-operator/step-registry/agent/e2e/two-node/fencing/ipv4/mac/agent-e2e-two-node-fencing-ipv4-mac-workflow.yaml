workflow:
  as: agent-e2e-two-node-fencing-ipv4-mac
  steps:
    allow_best_effort_post_steps: true
    allow_skip_on_success: true
    env:
      DEVSCRIPTS_CONFIG: |
        AGENT_E2E_TEST_SCENARIO=TNF_IPV4
        BMC_DRIVER=redfish
        NUM_WORKERS=0
        FENCING_CREDENTIAL_IDENTIFIER=macAddress
      DEVSCRIPTS_TARGET: agent
      FENCING_VALIDATION: "true"
    pre:
      - chain: agent-pre
    test:
      - ref: baremetalds-two-node-fencing-resource-agents-update-rhcos
      - ref: baremetalds-two-node-fencing-post-install-validation
      - chain: agent-test
    post:
      - chain: agent-post
  documentation: |-
    This workflow executes a Two Node OpenShift with Fencing (TNF) cluster installation with Agent Based Installer (ABI) with IPv4.
    In this workflow, the fencing credentials are keyed by MAC address rather than hostname (FENCING_CREDENTIAL_IDENTIFIER=macAddress).
