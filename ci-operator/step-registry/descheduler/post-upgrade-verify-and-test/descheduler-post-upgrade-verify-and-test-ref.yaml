ref:
  as: descheduler-post-upgrade-verify-and-test
  from: src
  cli: latest
  commands: descheduler-post-upgrade-verify-and-test-commands.sh
  resources:
    requests:
      cpu: 100m
  timeout: 3h30m0s
  documentation: |-
    Verifies the descheduler operator and operand survived an OCP cluster
    upgrade, then runs the descheduler e2e test suite. Checks that the CSV
    from the Subscription reached Succeeded, waits for both the operator and
    operand deployments to become available, and runs the e2e tests with
    SKIP_OPERATOR_INSTALL=true (since the operator was already installed via
    OLM by the descheduler-olm-install step).
