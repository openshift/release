ref:
  as: descheduler-olm-install
  from: src
  cli: latest
  commands: descheduler-olm-install-commands.sh
  resources:
    requests:
      cpu: 100m
  documentation: |-
    Installs the cluster-kube-descheduler-operator and operand via OLM on an
    OpenShift cluster. Discovers the default channel from the packagemanifest,
    creates the namespace, OperatorGroup, and Subscription, waits for the CSV
    to reach Succeeded, then creates a KubeDescheduler CR and waits for both
    the operator and operand deployments to become available. Saves the
    pre-upgrade CSV name to ${SHARED_DIR}/pre-upgrade-csv for use by
    post-upgrade verification steps.
