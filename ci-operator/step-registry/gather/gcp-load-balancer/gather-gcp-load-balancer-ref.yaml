ref:
  as: gather-gcp-load-balancer
  optional_on_success: false # gather succesful data as well so we have a basis for comparison
  best_effort: true
  timeout: 10m
  from_image:
    namespace: ocp
    name: "5.0"
    tag: upi-installer
  grace_period: 10m
  commands: gather-gcp-load-balancer-commands.sh
  resources:
    requests:
      cpu: 300m
      memory: 300Mi
  documentation: |-
    The gather-gcp-load-balancer step collects GCP load balancer and related networking
    resource data (forwarding rules, target pools, backend services, health checks, and
    firewall rules) for the cluster's infrastructure.  It filters resources by the
    cluster's infrastructure ID prefix and writes JSON output to ${ARTIFACT_DIR}/gcp-load-balancer/.
