ref:
  as: gather-must-gather
  best_effort: true
  optional_on_success: true
  from: cli
  commands: gather-must-gather-commands.sh
  env:
  - name: MUST_GATHER_TIMEOUT
    default: 35m
    documentation: A timeout for oc adm must-gather command.
  - name: EXTRA_MG_ARGS
    default: ""
    documentation: "Extra args to pass to the must-gather command"
  - name: MUST_GATHER_KEEP_UNPACKED
    default: "false"
    documentation: |-
      If "true", leave the must-gather tree in ARTIFACT_DIR and skip
      must-gather.tar.gz. Prow then censors matching files individually
      instead of replacing the whole archive. Default "false" preserves
      the packed tarball used by KaaS and most jobs.
  resources:
    requests:
      cpu: 300m
      memory: 300Mi
  timeout: 2h
  documentation: |-
    The must-gather step runs the must-gather tool to gather artifacts.
