ref:
  as: gather-extra
  best_effort: true
  optional_on_success: true
  from: tests
  commands: gather-extra-commands.sh
  timeout: 2h
  grace_period: 60s
  resources:
    requests:
      cpu: 300m
      memory: 300Mi
  env:
  - name: SKIP_READINESS_CHECKS
    default: "false"
    documentation: |-
      If set to "true", skips readiness checks in e2e-analysis for intentionally degraded CI lanes.
  documentation: |-
    The pre-deprovision artifacts step collects extra, CI-specific artifacts which are either not covered by must-gather or are required to debug clusters that are not healthy enough to complete a must-gather.
