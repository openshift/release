chain:
  as: cluster-resource-override-s390x-test
  steps:
  - ref: cluster-resource-override-s390x-install-operator
  - ref: cluster-resource-override-s390x-run-tests
  documentation: |-
    Installs the ClusterResourceOverride operator via OLM on a provisioned s390x
    OCP cluster (optional ImageDigestMirrorSet + Subscription), creates the
    ClusterResourceOverride CR, then runs the repository Go e2e suite
    (make e2e / ./test/e2e/...), skipping upgrade-only tests by default.
    Component and cluster cleanup are handled by the post phase of the
    cluster-resource-override-s390x workflow.
