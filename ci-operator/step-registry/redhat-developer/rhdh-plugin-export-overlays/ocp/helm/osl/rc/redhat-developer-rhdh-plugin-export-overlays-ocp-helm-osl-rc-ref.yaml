ref:
  as: redhat-developer-rhdh-plugin-export-overlays-ocp-helm-osl-rc
  cli: latest
  commands: redhat-developer-rhdh-plugin-export-overlays-ocp-helm-osl-rc-commands.sh
  credentials:
  - collection: openshift-qe
    group: mirror-registry
    mount_path: /var/run/vault/mirror-registry
  - collection: rhdh-plugin-export-overlays
    group: osl-rc
    field: release-json
    as: release.json
    mount_path: /var/run/vault/osl-rc
  from_image:
    name: rhdh-e2e-runner
    namespace: ci
    tag: main
  grace_period: 5m
  resources:
    limits:
      cpu: "10"
      memory: 5Gi
    requests:
      cpu: "1"
      memory: 1Gi
  timeout: 1h55m0s
  documentation: |-
    Runs the OSL RC smoke test on an OCP cluster.

    The release.json manifest, stored as field osl-rc/release-json in the
    rhdh-plugin-export-overlays Secret Manager collection, is mounted at
    /var/run/vault/osl-rc and must provide:
    - rhdhVersion and ocpVersion.
    - A digest-pinned Logic IIB image in logic.iib.
    - Exact Logic subscription and CSV expectations: logic.package,
      logic.channel, logic.startingCSV, and logic.expectedVersion.

    Serverless defaults to the latest serverless-operator in the stable channel
    of redhat-operators in openshift-marketplace, installed in openshift-operators
    as expected by the upstream Orchestrator test installer.
    Omit the serverless object to use these defaults. The installed CSV and version
    are logged once installation succeeds.

    To pin an available operator version, set serverless.expectedVersion, for
    example {"serverless": {"expectedVersion": "1.37.1"}}. An optional leading v
    is accepted. The starting CSV defaults to serverless-operator.v1.37.1;
    serverless.expectedCSV can override its name and requires expectedVersion.
    A pin uses Manual approval for both Serverless and Logic because OLM can
    combine their changes in one install plan. The job approves only initial
    plans containing the requested CSVs and leaves subsequent upgrades unapproved.
    The requested version must exist in the selected catalog and channel.
    Container image tags are not supported as operator version overrides.

    Optional serverless.package, serverless.channel, serverless.source, and
    serverless.sourceNamespace override the standard catalog settings.

    Candidate Logic images referenced from registry.redhat.io are mirrored to
    the matching Brew rh-osbs images named in the OSL release email.

    Always runs these three upstream Orchestrator tests with one worker:
    - Run Greeting workflow and verify Workflows tab
    - Run Failswitch workflow and verify statuses
    - Rerun Failswitch from failure point
    Requires all three to pass, with no failures, skips, or flakes.

    Credentials are mounted from openshift-qe/mirror-registry at
    /var/run/vault/mirror-registry and must provide registry_brew.json and
    registry_stage.json. The OSL-specific rhdh-plugin-export-overlays/osl-rc
    mount is at /var/run/vault/osl-rc and must provide release.json.
