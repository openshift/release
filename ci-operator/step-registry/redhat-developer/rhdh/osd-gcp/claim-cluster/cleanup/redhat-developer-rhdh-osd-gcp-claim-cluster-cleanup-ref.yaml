ref:
  as: redhat-developer-rhdh-osd-gcp-claim-cluster-cleanup
  cli: latest
  commands: "redhat-developer-rhdh-osd-gcp-claim-cluster-cleanup-commands.sh"
  credentials:
    - mount_path: /tmp/osdsecrets
      group: osd-gcp
      collection: rhdh-qe
  from_image:
    name: rhdh-e2e-runner
    namespace: ci
    tag: main
  resources:
    limits:
      memory: 6Gi
      cpu: "1"
    requests:
      cpu: "1"
      memory: 2Gi