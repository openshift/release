ref:
  as: redhat-developer-rhdh-ocp-helm-fips
  cli: latest
  commands: "redhat-developer-rhdh-ocp-helm-fips-commands.sh"
  credentials:
    - mount_path: /tmp/secrets
      bundle: rhdh
  env:
    - name: OC_CLIENT_VERSION
      default: stable-4.17
    - name: MULTISTAGE_PARAM_OVERRIDE_IMAGE_REPO
      default: ""
      documentation: Optional. Overrides IMAGE_REPO via Gangway API.
    - name: MULTISTAGE_PARAM_OVERRIDE_IMAGE_REGISTRY
      default: ""
      documentation: Optional. Overrides IMAGE_REGISTRY via Gangway API (default quay.io).
    - name: MULTISTAGE_PARAM_OVERRIDE_GITHUB_ORG_NAME
      default: "albarbaro"
      documentation: Optional. Overrides GITHUB_ORG_NAME via Gangway API.
    - name: MULTISTAGE_PARAM_OVERRIDE_GITHUB_REPOSITORY_NAME
      default: ""
      documentation: Optional. Overrides GITHUB_REPOSITORY_NAME via Gangway API.
    - name: MULTISTAGE_PARAM_OVERRIDE_RELEASE_BRANCH_NAME
      default: "enable-fips-job-next"
      documentation: Optional. Overrides RELEASE_BRANCH_NAME via Gangway API.
    - name: MULTISTAGE_PARAM_OVERRIDE_GIT_PR_NUMBER
      default: ""
      documentation: Optional. Overrides GIT_PR_NUMBER via Gangway API.
    - name: MULTISTAGE_PARAM_OVERRIDE_TAG_NAME
      default: "next"
      documentation: Optional. Overrides TAG_NAME via Gangway API.
    - name: MULTISTAGE_PARAM_OVERRIDE_CATALOG_INDEX_IMAGE
      default: "quay.io/rhdh/plugin-catalog-index:next"
      documentation: Optional. Overrides CATALOG_INDEX_IMAGE via Gangway API (e.g. quay.io/rhdh/plugin-catalog-index:1.5).
    - name: MULTISTAGE_PARAM_OVERRIDE_CHART_VERSION
      default: "2.0-84-CI"
      documentation: Optional. Overrides CHART_VERSION via Gangway API.
  from: rhdh-e2e-fips
  resources:
    limits:
      cpu: "10"
      memory: 5Gi
    requests:
      cpu: "1"
      memory: 1Gi
