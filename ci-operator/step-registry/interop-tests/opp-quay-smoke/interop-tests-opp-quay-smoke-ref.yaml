ref:
  as: interop-tests-opp-quay-smoke
  best_effort: true
  from: cli-with-skopeo
  cli: latest
  commands: interop-tests-opp-quay-smoke-commands.sh
  timeout: 30m0s
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  env:
  - name: LP_IO__ET_PPP__NEW_TS_NAME
    default: 'lp-interop--Quay--OPP--%s'
    documentation: |-
      New name for the test suite inside the JUnit XML so a proper prefix (for
      Component Readiness classification) can be set. See this
      [Shell Library](https://github.com/RedHatQE/OpenShift-LP-QE--Tools/blob/main/libs/bash/ci-operator/interop/common/ExitTrap--PostProcessPrep.sh)
      for details.
  documentation: |-
    Validates Quay as a cross-product registry within the OPP bundle.
    Tests image push/pull via the Quay route, verifies ODF object storage
    integration (OBCs and NooBaa health), and confirms ACS detects and scans
    the pushed image.
