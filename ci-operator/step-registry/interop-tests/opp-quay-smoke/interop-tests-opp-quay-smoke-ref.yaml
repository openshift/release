ref:
  as: interop-tests-opp-quay-smoke
  from: cli-with-skopeo
  cli: latest
  commands: interop-tests-opp-quay-smoke-commands.sh
  timeout: 30m0s
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  documentation: |-
    Validates Quay as a cross-product registry within the OPP bundle.
    Tests image push/pull via the Quay route, verifies ODF object storage
    integration (OBCs and NooBaa health), and confirms ACS detects and scans
    the pushed image.
  env:
    - name: DR__RP__CR_COMP_NAME
      default: "lp-interop--Quay"
      documentation: Component Readiness component name for junit remapping
    - name: MAP_TESTS
      default: "false"
      documentation: When true, remap junit test suite names for Component Readiness routing
