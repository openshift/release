chain:
  as: interop-tests-opp-quay-smoke-opp
  steps:
  - ref: interop-tests-opp-quay-smoke
  env:
  - name: DR__RP__CR_COMP_NAME
    default: lp-interop--OPP--Quay
  - name: MAP_TESTS
    default: "true"
  documentation: |-
    Wrapper chain that sets DR__RP__CR_COMP_NAME=lp-interop--OPP--Quay for the OPP job family,
    routing Quay smoke tests to the OPP > Quay capability on the Sippy CR dashboard.
