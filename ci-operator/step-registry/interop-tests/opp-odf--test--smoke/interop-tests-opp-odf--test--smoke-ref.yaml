ref:
  as: interop-tests-opp-odf--test--smoke
  from: opp-tests-composite
  commands: interop-tests-opp-odf--test--smoke-commands.sh
  timeout: 1h0m0s
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: LP_IO__ET_PPP__NEW_TS_NAME
    default: 'lp-interop--ODF--OPP--%s'
    documentation: |-
      New name for the test suite inside the JUnit XML so a proper prefix (for
      Component Readiness classification) can be set. See this
      [Shell Library](https://github.com/RedHatQE/OpenShift-LP-QE--Tools/blob/main/libs/bash/ci-operator/interop/common/ExitTrap--PostProcessPrep.sh)
      for details.
  documentation: |-
    Runs the odf/smoke suite from odf-tests-ext via openshift-tests with extension binary loading.
