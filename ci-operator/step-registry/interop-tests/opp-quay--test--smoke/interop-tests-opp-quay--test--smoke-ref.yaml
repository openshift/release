ref:
  as: interop-tests-opp-quay--test--smoke
  from: quay-tests-composite
  commands: interop-tests-opp-quay--test--smoke-commands.sh
  timeout: 1h0m0s
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: DR__RP__CR_COMP_NAME
    default: "lp-interop--Quay--OPP"
    documentation: Component Readiness component name for junit remapping
  - name: MAP_TESTS
    default: "true"
    documentation: When true, remap junit test suite names for Component Readiness routing
  documentation: |-
    Runs the quay/smoke suite from quay-tests via openshift-tests with extension binary loading.
