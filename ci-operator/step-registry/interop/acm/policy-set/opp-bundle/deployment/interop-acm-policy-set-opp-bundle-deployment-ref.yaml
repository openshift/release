ref:
  as: interop-acm-policy-set-opp-bundle-deployment
  from: cli-with-git
  commands: interop-acm-policy-set-opp-bundle-deployment-commands.sh
  best_effort: true
  timeout: 1h30m0s
  grace_period: 5m0s
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: LP_QE__CR__TS_NAME__PFX__ACM
    documentation: |-
      Component Readiness test-suite name prefix for this step, set by the job
      that runs it (for example lp-interop--ACM--OPP). The step composes the
      JUnit post-processing suite-name template from it; when unset the raw
      suite name is kept.
  - name: SKIP_POLICIES
    default: ""
    documentation: |-
      Comma-separated list of policy names to skip during compliance wait.
      Non-existent policies produce a warning, not a failure.
  - name: QUAY_OPERATOR_CHANNEL
    default: ""
    documentation: |-
      When set, pins the channel of the Quay operator OLM subscription deployed by
      the openshift-plus policy set (applied as an in-cluster patch after the
      policies deploy). Use to pin a specific channel (e.g. stable-3.17) when the
      catalog default channel is incorrect or outdated.
  - name: ODF_OPERATOR_CHANNEL
    default: ""
    documentation: |-
      When set, pins the channel of the ODF operator OLM subscription deployed by
      the openshift-plus policy set (applied as an in-cluster patch after the
      policies deploy). Use to pin a specific channel (e.g. stable-4.22) when the
      catalog default channel is incorrect or outdated.
  documentation: |-
    Setup and apply the openshift-plus policyset.
