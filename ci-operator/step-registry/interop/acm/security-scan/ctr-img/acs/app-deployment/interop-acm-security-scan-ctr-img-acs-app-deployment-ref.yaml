ref:
  as: interop-acm-security-scan-ctr-img-acs-app-deployment
  from: cli-with-git
  commands: interop-acm-security-scan-ctr-img-acs-app-deployment-commands.sh
  timeout: 1h0m0s
  grace_period: 5m0s
  best_effort: true
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: LP_QE__CR__TS_NAME__PFX__ACM
    documentation: |-
      Component Readiness test-suite name prefix for this step, set by the job
      that runs it (for example lp-interop--ACM--OPP). The step composes the
      JUnit post-processing suite-name template from it; when unset the raw
      suite name is kept.
  documentation: |-
    Deploys an application that influences and/or uses all components of the OPP bundle.
