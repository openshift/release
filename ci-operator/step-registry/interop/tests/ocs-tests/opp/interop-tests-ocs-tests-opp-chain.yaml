chain:
  as: interop-tests-ocs-tests-opp
  steps:
  - ref: interop-tests-ocs-tests
  env:
  - name: DR__RP__CR_COMP_NAME
    default: lp-interop--OPP--ODF
  - name: MAP_TESTS
    default: "true"
  documentation: |-
    Wrapper chain that sets DR__RP__CR_COMP_NAME=lp-interop--OPP--ODF for the OPP job family,
    overriding the step's default (lp-ocp-compat--ODF) and routing OCS tests to OPP > ODF
    on the Sippy CR dashboard.
