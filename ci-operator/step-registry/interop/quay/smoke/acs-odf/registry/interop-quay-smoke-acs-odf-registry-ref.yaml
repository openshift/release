ref:
  as: interop-quay-smoke-acs-odf-registry
  best_effort: true
  from: cli-with-skopeo
  cli: latest
  commands: interop-quay-smoke-acs-odf-registry-commands.sh
  timeout: 45m0s
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  env:
  - name: LP_QE__CR__TS_NAME__PFX__QUAY
    documentation: |-
      Component Readiness test-suite name prefix for this step, set by the job
      that runs it (for example lp-interop--Quay--OPP). The step composes the
      JUnit post-processing suite-name template from it; when unset the raw
      suite name is kept.
  documentation: |-
    Validates Quay as a cross-product registry within the OPP bundle.
    Tests image push/pull via the Quay route, verifies ODF object storage
    integration (OBCs and NooBaa health), and confirms ACS detects and scans
    the pushed image.
