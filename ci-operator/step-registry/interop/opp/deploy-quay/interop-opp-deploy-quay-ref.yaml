ref:
  as: interop-opp-deploy-quay
  commands: interop-opp-deploy-quay-commands.sh
  documentation: |-
    Deploys the Quay registry operator through OLM and provisions a working
    registry for the OPP interop lanes: namespace local-quay, OperatorGroup,
    Subscription on INTEROP__OPP__QUAY__OPERATOR_CHANNEL (default stable-3.17), the initial
    config bundle Secret, a QuayRegistry with managed objectstorage and tls,
    and the create-admin-user Job that initializes the Quay database and
    creates the quayadmin/quaydevel/quay-pull-secret secrets plus the devel
    organization and devel/example repository.

    The create-admin-user Job runs with errexit, so every required mutation
    (organization, application, repository, team membership, repository
    permission) is checked and stops the Job on failure: a Job that reports
    completion has created all of them. The Job traces its control flow but
    runs with tracing disabled across the whole credential window (admin
    password generation, database initialization, all four Secrets), so no
    credential value reaches the Job log; the step also redacts
    credential-shaped values from the pod log it copies into the artifacts.

    Every object is created only if absent (oc create, never apply): when the
    ACM policy set (policy-install-quay, policy-config-quay) already owns the
    install, the step adopts what it finds and never overwrites a live
    operator policy. An existing Subscription is adopted exactly as it stands,
    including one that runs a different channel than INTEROP__OPP__QUAY__OPERATOR_CHANNEL: it
    is not patched, channel_observed records the channel it runs and
    channel_mismatch records the difference. The step then reports the
    registry that Subscription produces as working (quay_deployed=true), not
    the requested channel as installed.

    When operatorpolicy-quay-operator is Compliant, the live quay-operator
    Subscription runs the requested channel, the CSV is Succeeded and the
    QuayRegistry is Available, the step records workaround_removal_ready=true
    and exits 0 without installing (workaround self-disable). A live
    Subscription channel that cannot be read is recorded as
    live_subscription_channel=unknown and does not withhold the self-disable:
    workaround_removal_ready then rests on the Policy being Compliant, the CSV
    Succeeded and the QuayRegistry Available, which shows the installed
    operator works whatever channel it runs.

    Emits one JUnit testcase, lp-interop--OPP--quay-deploy, and a properties
    file for the skip-ratio/evidence gates.
  env:
    - default: stable-3.17
      documentation: OLM channel for the quay-operator subscription
      name: INTEROP__OPP__QUAY__OPERATOR_CHANNEL
    - default: local-quay
      documentation: Namespace for the Quay operator and registry (must stay local-quay; the ported create-admin-user Job hardcodes it)
      name: INTEROP__OPP__QUAY__NAMESPACE
    - default: "300"
      documentation: Seconds to wait for the Subscription to report status.currentCSV
      name: INTEROP__OPP__QUAY__CSV_WAIT_TIMEOUT
    - default: "600"
      documentation: Seconds to wait for the quay-operator CSV to reach Succeeded
      name: INTEROP__OPP__QUAY__INSTALL_TIMEOUT
    - default: "600"
      documentation: Seconds to wait for the QuayRegistry registry to report Available=True
      name: INTEROP__OPP__QUAY__REGISTRY_TIMEOUT
    - default: "420"
      documentation: Seconds to wait for the create-admin-user Job to Complete
      name: INTEROP__OPP__QUAY__ADMIN_JOB_TIMEOUT
    - default: "0"
      documentation: When 1, report observed object states and exit 0 without installing (detection only)
      name: INTEROP__OPP__QUAY__REPORT_ONLY
  from: cli
  grace_period: 2m30s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 45m
