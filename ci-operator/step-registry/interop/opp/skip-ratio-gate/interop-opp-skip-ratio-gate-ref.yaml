ref:
  as: interop-opp-skip-ratio-gate
  commands: interop-opp-skip-ratio-gate-commands.sh
  documentation: |-
    Scans JUnit XML files in JUNIT_DIR (or ARTIFACT_DIR) and computes
    the overall skip ratio. Fails the step if the ratio exceeds
    SKIP_RATIO_THRESHOLD and FAIL_ON_BREACH is true. Produces a
    summary JUnit XML in ARTIFACT_DIR for Prow/Sippy consumption.
    Uses only Python stdlib (xml.etree).

    Robust parsing: cross-validates the ``tests`` attribute against
    actual <testcase> child counts, counts <failure> and <skipped>
    children directly, and rejects empty files. A suite that declares
    more tests than it provides <testcase> children is treated as
    incomplete evidence; its missing cases are not counted as passed.

    When evidence is incomplete or no valid test data is available
    (no XML files, parse errors, inconsistent suite counts, or zero-test
    suites), emits an EVIDENCE-INCOMPLETE JUnit result and exits 0 rather
    than making a skip-ratio judgement on bad data.
  env:
  - default: "false"
    documentation: |-
      Set to "false" for advisory-only mode (logs the ratio but does
      not fail the step).
    name: FAIL_ON_BREACH
  - default: ""
    documentation: |-
      Directory containing JUnit XML files to analyze. Falls back to
      ${ARTIFACT_DIR} if empty.
    name: JUNIT_DIR
  - default: "0.10"
    documentation: |-
      Maximum allowed skip ratio (skipped / total). If the overall skip
      ratio exceeds this threshold and FAIL_ON_BREACH is true, the step
      fails. Default 0.10 = 10%.
    name: SKIP_RATIO_THRESHOLD
  from: cli
  grace_period: 30s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 5m
