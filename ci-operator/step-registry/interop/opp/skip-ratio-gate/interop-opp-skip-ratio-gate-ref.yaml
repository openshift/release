ref:
  as: interop-opp-skip-ratio-gate
  commands: interop-opp-skip-ratio-gate-commands.sh
  documentation: |-
    Scans JUnit XML files in JUNIT_DIR (or ARTIFACT_DIR) and computes
    the overall skip ratio. Fails the step if the ratio exceeds
    SKIP_RATIO_THRESHOLD. Produces a summary JUnit XML in ARTIFACT_DIR
    for Prow/Sippy consumption. Uses only Python stdlib.
  env:
  - default: "false"
    documentation: |-
      Set to "false" for advisory-only mode (logs the ratio but does
      not fail the step).
    name: FAIL_ON_BREACH
  - default: ""
    documentation: |-
      Directory containing JUnit XML files to analyze. Falls back to
      ${ARTIFACT_DIR} if empty.
    name: JUNIT_DIR
  - default: ""
    documentation: |-
      Component Readiness test-suite name prefix. When set to a non-empty
      value while MAP_TESTS is true, the emitted JUnit suite name derives
      from it (lp-interop--OCP--OPP--skip-gate); otherwise the historical
      lp-interop--OPP-- name is kept.
    name: LP_QE__CR__TS_NAME__PFX__OCP
  - default: "false"
    documentation: When true, derive the canonical component-first JUnit suite name for Component Readiness routing
    name: MAP_TESTS
  - default: "0.10"
    documentation: |-
      Maximum allowed skip ratio (skipped / total). If the overall skip
      ratio exceeds this threshold and FAIL_ON_BREACH is true, the step
      fails. Default 0.10 = 10%.
    name: SKIP_RATIO_THRESHOLD
  from: cli
  grace_period: 30s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 5m
