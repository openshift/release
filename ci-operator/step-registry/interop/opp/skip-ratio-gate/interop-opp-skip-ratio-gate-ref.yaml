ref:
  as: interop-opp-skip-ratio-gate
  from: cli
  commands: interop-opp-skip-ratio-gate-commands.sh
  grace_period: 30s
  timeout: 5m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: MAX_SKIP_RATIO
      default: "0.50"
      documentation: >-
        Maximum allowed skip ratio (skipped / total tests). Job fails if
        the observed ratio exceeds this threshold. Range 0.0-1.0.
    - name: JUNIT_DIR
      default: ""
      documentation: >-
        Directory to scan for junit*.xml files. Defaults to ARTIFACT_DIR.
  documentation: >-
    Aggregates all junit*.xml files from preceding test steps, computes
    the overall skip ratio (total skipped / total tests), and fails the
    job if the ratio exceeds MAX_SKIP_RATIO.
