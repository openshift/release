ref:
  as: interop-opp-odf-health
  from: cli
  grace_period: 30s
  commands: interop-opp-odf-health-commands.sh
  timeout: 8m
  env:
  - name: ODF_NAMESPACE
    default: "openshift-storage"
    documentation: Namespace where ODF is installed
  - name: NOOBAA_S3_TIMEOUT
    default: "30"
    documentation: Timeout in seconds for the NooBaa S3 functional check pod
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Validates ODF health in the OPP interop cluster via a 7-point gate:
    ODF Operator CSV phase, StorageCluster readiness, CephCluster health,
    default StorageClass availability, PVC provisioning, NooBaa system
    readiness with S3 functional check, and Ceph overall health.
    Replaces the former interop-tests-ocs-tests step which ran 28
    single-product acceptance tests with a 3h timeout.
    Produces JUnit XML for Prow / Sippy / TestGrid consumption.
