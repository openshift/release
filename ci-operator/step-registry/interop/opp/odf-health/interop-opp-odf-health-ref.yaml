ref:
  as: interop-opp-odf-health
  from: cli
  grace_period: 30s
  commands: interop-opp-odf-health-commands.sh
  timeout: 30m
  env:
  - name: ODF_NAMESPACE
    default: "openshift-storage"
    documentation: Namespace where ODF is installed
  - name: NOOBAA_S3_TIMEOUT
    default: "30"
    documentation: Timeout in seconds for the NooBaa S3 functional check pod
  - name: RESOURCE_BIND_TIMEOUT
    default: "60"
    documentation: |-
      Seconds to wait for PVCs and ObjectBucketClaims to reach Bound phase.
      Budget: consumed 3x per run (2 PVC checks + 1 OBC check).
      Ensure 3 * RESOURCE_BIND_TIMEOUT + ODF_READY_TIMEOUT + 150 < step timeout.
      On AWS resources bind in seconds; on vSphere the NooBaa bucket
      provisioner may need additional time after ODF reports Ready.
      Override in ci-operator config for slower platforms. Max 300s (clamped).
  - name: ODF_READY_TIMEOUT
    default: "720"
    documentation: |-
      Seconds to wait for StorageCluster and NooBaa to reach Ready before
      running health checks. Accommodates platforms where ODF initialization
      is slower (e.g., vSphere). On AWS the wait exits immediately; on vSphere
      ODF typically needs 8-12 minutes. Must not exceed step timeout minus
      300s to preserve headroom for the health checks themselves.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Validates ODF health in the OPP interop cluster via a 7-point gate:
    ODF Operator CSV phase, StorageCluster readiness, CephCluster health,
    default StorageClass availability, PVC provisioning, NooBaa system
    readiness with S3 functional check, and Ceph overall health.
    Replaces the former interop-tests-ocs-tests step which ran 28
    single-product acceptance tests with a 3h timeout.
    Waits for ODF subsystems to converge before checking (configurable
    via ODF_READY_TIMEOUT), then produces JUnit XML for Prow / Sippy /
    TestGrid consumption.
