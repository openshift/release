ref:
  as: interop-opp-pre-upgrade-checks
  commands: interop-opp-pre-upgrade-checks-commands.sh
  documentation: |-
    Runs pre-upgrade validation checks before an OPP cluster upgrade. Verifies
    MachineConfigPool stability, operator health, and captures baseline cluster
    state to ARTIFACT_DIR for post-mortem comparison.
  env:
    - default: "advanced-cluster-management,rhacs-operator,odf-operator,quay-operator"
      documentation: Comma-separated CSV name prefixes for OPP operators to verify
      name: OPP_OPERATORS
  from: cli
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 15m
