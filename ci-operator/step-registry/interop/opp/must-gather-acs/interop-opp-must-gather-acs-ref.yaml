ref:
  as: interop-opp-must-gather-acs
  from: cli
  commands: interop-opp-must-gather-acs-commands.sh
  best_effort: true
  grace_period: 30s
  timeout: 1h
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: ACS_NAMESPACE
    default: "rhacs-operator"
    documentation: |-
      Namespace where the ACS operator is installed. Override this in your config env if you need to change it.
  documentation: |-
    Downloads ACS/StackRox diagnostic bundle via the Central API for additional debugging.
