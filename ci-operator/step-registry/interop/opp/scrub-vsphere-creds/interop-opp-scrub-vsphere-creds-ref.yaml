ref:
  as: interop-opp-scrub-vsphere-creds
  best_effort: true
  commands: interop-opp-scrub-vsphere-creds-commands.sh
  documentation: |-
    Scrubs vSphere credentials (GOVC_PASSWORD, GOVC_USERNAME) from all files
    in $SHARED_DIR before ci-operator uploads them as artifacts to GCS.
    This prevents plaintext credential leakage into publicly-accessible CI
    artifacts.  Must run as an early post step, before artifact collection.
  from: cli
  grace_period: 30s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 5m
