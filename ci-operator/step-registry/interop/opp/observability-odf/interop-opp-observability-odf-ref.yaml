ref:
  as: interop-opp-observability-odf
  from: cli
  grace_period: 30s
  commands: interop-opp-observability-odf-commands.sh
  timeout: 10m
  env:
  - name: ACM_NAMESPACE
    default: "open-cluster-management"
    documentation: Namespace where ACM is installed
  - name: OBS_NAMESPACE
    default: "open-cluster-management-observability"
    documentation: Namespace where ACM Observability components run
  - name: ODF_NAMESPACE
    default: "openshift-storage"
    documentation: Namespace where ODF is installed
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  best_effort: true
  documentation: |-
    Validates the cross-product integration surface between ACM Observability
    (Thanos) and ODF (Ceph RGW). This is a true interop test that exercises
    the boundary where ACM consumes ODF-provided object storage.

    Checks performed:
    1. ODF Ceph RGW infrastructure ready (CephObjectStore, RGW pods, StorageClass)
    2. MultiClusterObservability CR exists and is Ready
    3. Object storage secret references an ODF-backed endpoint (not MinIO)
    4. Thanos and observability components healthy (receive, compact, store,
       query, alertmanager, rbac-query-proxy)
    5. ObjectBucketClaim used by observability is Bound
    6. Thanos query endpoint functional (metrics data flow)

    Produces JUnit XML for Prow / Sippy / TestGrid consumption.
