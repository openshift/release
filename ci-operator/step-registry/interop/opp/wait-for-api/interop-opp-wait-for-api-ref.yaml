ref:
  as: interop-opp-wait-for-api
  commands: interop-opp-wait-for-api-commands.sh
  documentation: |-
    Waits for the cluster API server to become reachable via DNS
    and HTTPS. Retries with configurable count and delay to survive
    transient DNS resolution failures that can occur after
    MachineConfigPool rollouts or node reboots.

    Use this step immediately before install-operators or any other
    step that requires cluster API access after infrastructure
    changes.
  env:
  - default: "20"
    documentation: Number of retry attempts before giving up
    name: API_WAIT_RETRIES
  - default: "15"
    documentation: Seconds to wait between retry attempts
    name: API_WAIT_DELAY
  from: cli
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  timeout: 10m0s
