ref:
  as: interop-opp-unique-basenames
  commands: interop-opp-unique-basenames-commands.sh
  documentation: |-
    Verifies every *-commands.sh under ci-operator/step-registry/interop/opp
    has a unique basename. OPP steps write JUnit XML files flat into
    SHARED_DIR keyed on the script basename (minus .sh); a collision
    silently overwrites earlier test results.
  from: src
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 15m
