ref:
  as: interop-opp-post-upgrade-policy-check
  commands: interop-opp-post-upgrade-policy-check-commands.sh
  documentation: |-
    Validates post-upgrade policy compliance by checking ClusterVersion
    progression, CatalogSource health, OPP operator subscription status,
    and ClusterOperator degradation. Produces a policy-check report artifact.
  env:
    - default: "advanced-cluster-management,rhacs-operator,odf-operator,quay-operator"
      documentation: Comma-separated CSV name prefixes for OPP operators to verify
      name: OPP_OPERATORS
  from: cli
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 15m
