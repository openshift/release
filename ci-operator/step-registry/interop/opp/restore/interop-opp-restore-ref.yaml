ref:
  as: interop-opp-restore
  commands: interop-opp-restore-commands.sh
  documentation: |-
    Validates cluster health after an OPP upgrade by checking ClusterVersion
    availability, OPP operator CSV phases, and node readiness. Produces a
    restore-validation.json artifact summarizing the post-upgrade state.
  env:
    - default: "600"
      documentation: Maximum seconds to wait for restore validation
      name: RESTORE_TIMEOUT
    - default: "advanced-cluster-management,rhacs-operator,odf-operator,quay-operator"
      documentation: Comma-separated CSV name prefixes for OPP operators to verify
      name: OPP_OPERATORS
  from: cli
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 15m
