ref:
  as: interop-opp-deploy-acs
  commands: interop-opp-deploy-acs-commands.sh
  documentation: |-
    Deploys the Red Hat Advanced Cluster Security (ACS/RHACS) operator via OLM
    subscription. Creates the namespace, OperatorGroup, and Subscription, then
    waits for the CSV to reach Succeeded phase.
  env:
    - default: stable
      documentation: OLM channel for the ACS operator subscription
      name: ACS_CHANNEL
    - default: 15m
      documentation: Timeout for the ACS operator CSV to reach Succeeded
      name: ACS_INSTALL_TIMEOUT
    - default: rhacs-operator
      documentation: Namespace for the ACS operator
      name: ACS_NAMESPACE
    - default: stackrox
      documentation: Namespace for ACS Central
      name: ACS_CENTRAL_NAMESPACE
  from: cli
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 20m
