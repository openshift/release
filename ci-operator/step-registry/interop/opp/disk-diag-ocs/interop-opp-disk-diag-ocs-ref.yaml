ref:
  as: interop-opp-disk-diag-ocs
  best_effort: true
  commands: interop-opp-disk-diag-ocs-commands.sh
  documentation: |-
    Post-ODF-setup disk diagnostic for OCS worker nodes.  Runs after
    workerocs MachineSets are created and MCP has reconciled, so it
    can observe the OCS storage nodes where disk exhaustion actually
    occurs.  Uses oc debug to capture real disk utilization (df -h)
    in addition to the Kubernetes ephemeral-storage API data.
    Complements the early interop-opp-disk-diag step, which only
    captures the original IPI workers.
    Best-effort -- never fails the chain.
  from: cli
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 15m0s
