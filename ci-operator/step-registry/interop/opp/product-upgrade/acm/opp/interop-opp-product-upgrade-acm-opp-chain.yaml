chain:
  as: interop-opp-product-upgrade-acm-opp
  steps:
  - ref: interop-opp-product-upgrade-acm
  env:
  - name: DR__RP__CR_COMP_NAME
    default: lp-interop--OPP--acm-upgrade
  - name: MAP_TESTS
    default: "true"
  documentation: |-
    Wrapper chain that sets DR__RP__CR_COMP_NAME=lp-interop--OPP--acm-upgrade for the OPP
    job family, routing ACM product upgrade tests to the OPP > acm-upgrade capability
    on the Sippy CR dashboard.
