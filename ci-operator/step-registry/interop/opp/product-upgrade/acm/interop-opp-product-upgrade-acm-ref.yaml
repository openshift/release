ref:
  as: interop-opp-product-upgrade-acm
  commands: interop-opp-product-upgrade-acm-commands.sh
  documentation: |-
    Upgrades the ACM (Advanced Cluster Management) operator via OLM subscription
    channel change and validates the upgrade completes successfully.

    The step performs:
    1. Identifies the currently installed ACM version via CSV
    2. Patches the Subscription to the target channel (or next available)
    3. Waits for the new CSV to reach Succeeded phase
    4. Validates MCE (MultiCluster Engine) co-upgrade completion
    5. Confirms hub connectivity and policy engine health

    This step gates downstream product upgrades (ACS, ODF, Quay) in the
    OPP coordinated product upgrade workflow.

    Exit codes:
      0 - upgrade successful, all health checks passed
      1 - upgrade failed (CSV did not reach Succeeded)
      2 - timeout waiting for upgrade
      3 - precondition failure (no subscription found, no upgrade path)
  env:
    - default: "advanced-cluster-management"
      documentation: |-
        Name of the ACM Subscription resource in the target namespace.
      name: ACM_SUBSCRIPTION_NAME
    - default: "open-cluster-management"
      documentation: |-
        Namespace containing the ACM Subscription and CSV resources.
      name: ACM_SUBSCRIPTION_NAMESPACE
    - default: ""
      documentation: |-
        Target subscription channel for ACM operator upgrade (e.g. release-2.13).
        When empty, the step determines the next available channel automatically
        by querying the catalog for channels newer than the currently installed version.
      name: ACM_TARGET_CHANNEL
    - default: "30m"
      documentation: |-
        Maximum time to wait for the ACM operator upgrade to complete.
        Covers CSV transition from Replacing to Succeeded phase.
      name: ACM_UPGRADE_TIMEOUT
  from: cli
  grace_period: 5m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 45m
