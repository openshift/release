ref:
  as: interop-opp-disk-diag
  best_effort: true
  commands: interop-opp-disk-diag-commands.sh
  documentation: |-
    Captures disk layout diagnostics from cluster nodes to investigate
    RHCOS root filesystem expansion and ephemeral-storage eviction
    issues.  Uses only unprivileged oc commands (no oc debug).
    Collects node capacity/allocatable ephemeral-storage, resource
    usage (oc adm top nodes), pressure conditions, KubeletConfig CRs,
    MachineConfigPool status, and eviction events.
    Best-effort -- never fails the chain.
  from: cli
  grace_period: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 10m0s
