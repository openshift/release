ref:
  as: interop-opp-readiness
  commands: interop-opp-readiness-commands.sh
  documentation: |-
    Verifies cluster readiness for OPP operations by checking ClusterVersion
    availability, ClusterOperator health, node readiness, and OPP operator CSV
    phases. Fails if critical components are not ready.
  env:
    - default: "600"
      documentation: Maximum seconds to wait for readiness checks
      name: READINESS_TIMEOUT
    - default: "30"
      documentation: Seconds between readiness check retries
      name: READINESS_RETRY_INTERVAL
    - default: "advanced-cluster-management,rhacs-operator,odf-operator,quay-operator"
      documentation: Comma-separated CSV name prefixes for OPP operators to verify
      name: OPP_OPERATORS
  from: cli
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 15m
