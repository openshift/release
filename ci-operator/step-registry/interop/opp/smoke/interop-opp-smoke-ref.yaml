ref:
  as: interop-opp-smoke
  commands: interop-opp-smoke-commands.sh
  documentation: |-
    Runs post-upgrade smoke tests against OPP bundle components
    (ACM, ACS, ODF, Quay) to verify cluster health, operator CSV
    status, ACM managed-cluster connectivity, ACS sensor status,
    and Quay registry reachability.  Produces JUnit XML for
    Prow / Sippy / TestGrid consumption.
  env:
    - default: "advanced-cluster-management,rhacs-operator,odf-operator,quay-operator"
      documentation: Comma-separated CSV name prefixes for OPP bundle operators to validate in smoke
      name: INTEROP__OPP__SMOKE__OPERATORS
    - default: "120"
      documentation: Seconds to wait for operator pods to settle before pod readiness checks
      name: INTEROP__OPP__SMOKE__SETTLE_SECONDS
  from: cli
  grace_period: 30s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 30m
