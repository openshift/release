ref:
  as: interop-opp-deploy-odf
  commands: interop-opp-deploy-odf-commands.sh
  documentation: |-
    Deploys the OpenShift Data Foundation (ODF) operator via OLM subscription.
    Creates the namespace, OperatorGroup, and Subscription, then waits for the
    CSV to reach Succeeded phase.
  env:
    - default: stable-4.17
      documentation: OLM channel for the ODF operator subscription
      name: ODF_CHANNEL
    - default: 15m
      documentation: Timeout for the ODF operator CSV to reach Succeeded
      name: ODF_INSTALL_TIMEOUT
    - default: openshift-storage
      documentation: Namespace for the ODF operator
      name: ODF_NAMESPACE
  from: cli
  grace_period: 1m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 20m
