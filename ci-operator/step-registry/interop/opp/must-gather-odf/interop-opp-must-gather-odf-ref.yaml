ref:
  as: interop-opp-must-gather-odf
  from: cli
  commands: interop-opp-must-gather-odf-commands.sh
  best_effort: true
  timeout: 1h
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: ODF_NAMESPACE
    default: "openshift-storage"
    documentation: |-
      Namespace where the ODF operator is installed. Override this in your config env if you need to change it.
  documentation: |-
    Runs ODF must-gather command for additional debugging.
