ref:
  as: interop-ACM-securities-ACS-opp-app
  from: cli-with-git
  commands: interop-ACM-securities-ACS-opp-app-commands.sh
  timeout: 1h0m0s
  grace_period: 5m0s
  best_effort: true
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: LP_IO__ET_PPP__NEW_TS_NAME
    default: 'lp-interop--ACM--OPP--%s'
    documentation: |-
      New name for the test suite inside the JUnit XML so a proper prefix (for
      Component Readiness classification) can be set. See ExitTrap library
      documentation for details.
  documentation: |-
    Deploys an application that influences and/or uses all components of the OPP bundle.
