chain:
  as: openshift-observability-logging-e2e-suite
  env:
  - name: LOGGING_TEST_VERSION
    default: "6.6"
    documentation: |-
      The logging version under test. It drives the QE catalog sources created
      by the openshift-logging-catalogsources step and the test suites, and it
      matches the operator channels pinned in the OPERATORS default below.
      When testing a different version, override BOTH this variable and
      OPERATORS (whose channels must match) at the job level, or add a sibling
      chain for that version.
  - name: OPERATORS
    default: |
      [
          {"name": "cluster-logging", "source": "cluster-logging-operator-registry", "channel": "stable-6.6", "install_namespace": "openshift-logging","target_namespaces": "", "operator_group": "openshift-logging"},
          {"name": "loki-operator", "source": "loki-operator-registry", "channel": "stable-6.6", "install_namespace": "openshift-operators-redhat","target_namespaces": "", "operator_group": "openshift-operators-redhat"},
          {"name": "cluster-observability-operator", "source": "redhat-operators", "channel": "stable", "install_namespace": "openshift-cluster-observability-operator","target_namespaces": "", "operator_group": "openshift-cluster-observability-operator"},
          {"name": "amq-streams", "source": "redhat-operators", "channel": "amq-streams-2.x", "install_namespace": "openshift-operators","target_namespaces": "", "operator_group": ""}
      ]
    documentation: |-
      JSON list of operators to install before the suite runs, in the format
      expected by the install-operators step. The default is the logging 6.6
      stable operator set from the QE catalog sources created by the
      openshift-logging-catalogsources step, and its channels are pinned to
      match the LOGGING_TEST_VERSION default above: the two must be changed
      together. Override the whole list in the job when testing a different
      logging version.
  steps:
  - ref: openshift-logging-catalogsources
  - ref: install-operators
  - ref: openshift-observability-logging-e2e-tests
  documentation: |-
    Prepare the QE logging catalog sources, install the logging operator set
    and run the openshift-logging-e2e-tests suite selected with TEST_SUITE.
    The suite and its concurrency (TEST_MAX_CONCURRENCY) are set by the job;
    AGENT_SKILL and JIRA_PROJECT are consumed by the post steps. The logging
    version under test (LOGGING_TEST_VERSION, default 6.6) and the operator
    set (OPERATORS, default the 6.6 stable set) are pinned together in this
    chain: override both at the job level when testing another version.
