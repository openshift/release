ref:
  as: openshift-observability-logging-e2e-tests
  from: obs-tests-runner
  cli: latest
  commands: openshift-observability-logging-e2e-tests-commands.sh
  timeout: 6h0m0s
  grace_period: 10m0s
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
  env:
  - name: LOGGING_TEST_VERSION
    default: ""
    documentation: |-
      The version of logging which is being tested, for example "6.6". The test suites fail
      immediately if it is not set. It is a required value.
  - name: LOGGING_UPGRADE_FROM_VERSION
    default: ""
    documentation: |-
      The logging version (source channel) that the major-version upgrade tests upgrade from, for
      example "6.6". It is optional: when it is empty, those tests are skipped.
  - name: TEST_SUITE
    documentation: |-
      Name of the suite to run from the openshift-logging-e2e-tests extension binary, for example
      openshift-logging-e2e-tests/cluster-logging-operator or openshift-logging-e2e-tests/loki-operator.
      Run "openshift-logging-e2e-tests-tests-ext list suites" in the image for the full list.
  - name: TEST_MAX_CONCURRENCY
    default: "1"
    documentation: |-
      Maximum number of tests run in parallel (run-suite --max-concurrency). run-suite ignores the
      [Serial] tag and defaults to 10, and each spec deploys its own collector DaemonSet and often a
      LokiStack, which exhausts the CPU of the 3 worker nodes of a claimed cluster and makes the specs
      time out waiting for their pods. Tests run one at a time by default.
  documentation: |-
    The openshift-observability-logging-e2e-tests step runs one suite from the OpenShift Logging tests extension binary
    (https://github.com/openshift-eng/openshift-logging-e2e-tests) against the cluster in KUBECONFIG and
    writes a JUnit report to ARTIFACT_DIR.

    The step runs in the obs-tests-runner image, which the using configuration must provide: either
    build it from the test suite source with an images entry (so the suites exercise the pull request
    under test), or import the promoted logging/obs-tests-runner:main stream with a base_images entry
    (to run the merged suites). Configurations that provide neither fail when the step pod starts,
    after the cluster has been provisioned, because the image cannot be found.

    The suites expect cluster-logging-operator and loki-operator to be installed before the step runs,
    as subscriptions in the openshift-logging and openshift-operators-redhat namespaces. Tests that need
    additional operators (for example opentelemetry-product) subscribe them from the redhat-operators
    catalog unless they are pre-installed, for example with the install-operators step.
