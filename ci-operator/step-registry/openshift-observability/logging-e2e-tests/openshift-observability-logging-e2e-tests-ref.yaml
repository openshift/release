ref:
  as: openshift-observability-logging-e2e-tests
  from_image:
    namespace: logging
    name: obs-tests-runner
    tag: main
  cli: latest
  commands: openshift-observability-logging-e2e-tests-commands.sh
  timeout: 3h0m0s
  grace_period: 10m0s
  resources:
    requests:
      cpu: "1"
      memory: 2Gi
  env:
  - name: TEST_SUITE
    documentation: |-
      Name of the suite to run from the openshift-logging-e2e-tests extension binary, for example
      openshift-logging-e2e-tests/cluster-logging-operator or openshift-logging-e2e-tests/loki-operator.
      Run "openshift-logging-e2e-tests-tests-ext list suites" in the image for the full list.
  - name: TEST_MAX_CONCURRENCY
    default: "1"
    documentation: |-
      Maximum number of tests run in parallel (run-suite --max-concurrency). Defaults to 1 because
      each spec deploys its own collector DaemonSet and often a LokiStack, which can exhaust CPU on
      a 3-worker cluster and cause timeouts.
  - name: JIRA_PROJECT
    default: ""
    documentation: Jira project key used by the openshift-observability-qe-agent post step.
  - name: AGENT_SKILL
    default: ""
    documentation: Agent skill name used by the openshift-observability-qe-agent post step.
  documentation: |-
    The openshift-observability-logging-e2e-tests step runs one suite from the OpenShift Logging tests
    extension binary (https://github.com/openshift-eng/openshift-logging-e2e-tests) against the cluster
    in KUBECONFIG and writes a JUnit report to ARTIFACT_DIR.

    The suites expect cluster-logging-operator and loki-operator to be installed before the step runs,
    as subscriptions in the openshift-logging and openshift-operators-redhat namespaces. Tests that need
    additional operators subscribe them from the redhat-operators catalog unless they are pre-installed
    via the install-operators step.
