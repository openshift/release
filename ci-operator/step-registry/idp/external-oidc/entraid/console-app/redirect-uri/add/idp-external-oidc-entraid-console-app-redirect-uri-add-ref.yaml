ref:
  as: idp-external-oidc-entraid-console-app-redirect-uri-add
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  commands: idp-external-oidc-entraid-console-app-redirect-uri-add-commands.sh
  timeout: 10m0s
  grace_period: 2m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  credentials:
  - mount_path: /var/run/hypershift-ext-oidc-app-console
    group: hypershift-ext-oidc-app-console
    collection: fxie
  - mount_path: /var/run/hypershift-azure-lock-blob
    group: hypershift-azure-lock-blob
    collection: fxie
  - mount_path: /var/run/hypershift-ext-oidc-app-updater-v2
    group: hypershift-ext-oidc-app-updater-v2
    collection: hypershiftqe
  documentation: |-
    Add the console callback address to the list of redirect URIs of the console app to enable subsequent console logins. The associated redirect-uri-remove step MUST be referenced in the post phase.
