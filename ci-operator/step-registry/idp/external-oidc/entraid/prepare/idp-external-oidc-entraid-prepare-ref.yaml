ref:
  as: idp-external-oidc-entraid-prepare
  from_image:
    namespace: ocp
    name: "4.19"
    tag: upi-installer
  commands: idp-external-oidc-entraid-prepare-commands.sh
  grace_period: 3m0s
  resources:
    requests:
      cpu: 100m
  timeout: 3m0s
  credentials:
  - mount_path: /var/run/hypershift-ext-oidc-app-cli
    group: hypershift-ext-oidc-app-cli
    collection: fxie
  - mount_path: /var/run/hypershift-ext-oidc-app-console
    group: hypershift-ext-oidc-app-console
    collection: fxie
  documentation: |-
    Prepare Entra ID configure files
