ref:
  as: custom-metrics-autoscaler-operator-libvirt-s390x-e2e-image-tag-mirror
  cli: latest
  commands: custom-metrics-autoscaler-operator-libvirt-s390x-e2e-image-tag-mirror-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 60m0s
  env:
  - name: ITMS_NAME
    default: e2e-tag-images
    documentation: |-
      Name of the ImageTagMirrorSet resource applied before CMA/KEDA e2e tests on
      s390x libvirt clusters.
  documentation: |-
    Apply an ImageTagMirrorSet redirecting KEDA e2e test images to mirrors on
    quay.io and wait for MachineConfigPool rollout before running the CMA e2e
    suite on s390x libvirt clusters.
