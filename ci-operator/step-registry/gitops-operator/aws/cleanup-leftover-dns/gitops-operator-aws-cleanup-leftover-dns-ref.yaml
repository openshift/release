ref:
  as: gitops-operator-aws-cleanup-leftover-dns
  from_image:
    namespace: ocp
    name: "4.12"
    tag: upi-installer
  grace_period: 10m
  timeout: 10m
  commands: gitops-operator-aws-cleanup-leftover-dns-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: BASE_DOMAIN
    documentation: IPI public zone. gitops-aws uses ocp-gitops-qe.com.
  documentation: |-
    Wipe leftover Route53 for this ci-op name so install isn't blocked
    by DNS from a failed deprovision.
