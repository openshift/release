ref:
  as: gitops-operator-merge-quay-pull-secret
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  cli: latest
  commands: gitops-operator-merge-quay-pull-secret-commands.sh
  grace_period: 10m
  timeout: 10m
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: gitops-operator-secret
    group: quay-credentials
    mount_path: /var/run/secrets/gitops-quay-credentials
  env:
  - name: QUAY_REGISTRY
    default: "quay.io/redhat-user-workloads/rh-openshift-gitops-tenant"
    documentation: Quay registry key added to the cluster global pull secret
  documentation: |-
    Merges Quay robot credentials into the cluster global pull-secret
    (openshift-config/pull-secret) and waits for MCP rollout.

    Expects GSM secret gitops-operator-secret/quay-credentials/auth
    containing base64(user:token) for the Quay robot account.
