ref:
  as: osd-gather-extra
  from: upi-installer
  commands: osd-gather-extra-commands.sh
  credentials:
    - collection: hcm-ocp-ci
      group: s3-logs
      mount_path: /var/run/hcm-job-logs-s3-bucket-storage
  resources:
    requests:
      cpu: 100m
      memory: 500Mi
  documentation: |-
    Download additional logs and artifacts to ease debugging Managed OpenShift
