workflow:
  as: agent-qe-baremetal-install-ove-disconnected-konflux
  steps:
    allow_best_effort_post_steps: true
    pre:
      - chain: agent-qe-baremetal-install-ove-disconnected-konflux
    post:
      - ref: agent-qe-baremetal-install-ove-disconnected-collect-validation-results
        best_effort: true
      - ref: agent-qe-baremetal-install-ove-disconnected-konflux-delete-iso
      - chain: baremetal-lab-agent-post
    env:
      DISCONNECTED: "true"
      PATCH_STATIC_NETWORK: "true"
  documentation: |-
    The agent-qe-baremetal-install-ove-disconnected-konflux workflow provides pre- and post- steps that provision and
    deprovision an ABI OVE cluster with a default configuration on a Baremetal lab, installs LSO and ODF,
    and collects validation checkup results, allowing job authors to inject their own end-to-end test logic.
