ref:
  as: agent-qe-baremetal-install-ove-disconnected-konflux-boot-discovery-iso
  from_image:
    namespace: ci
    name: "baremetal-qe-base"
    tag: latest
  commands: agent-qe-baremetal-install-ove-disconnected-konflux-boot-discovery-iso-commands.sh
  resources:
    requests:
      cpu: "1"
      memory: 128Mi
  grace_period: 600
  timeout: 2h0m0s
  env:
    - name: AUX_HOST
      default: ""
    - name: DISCONNECTED
      default: "false"
  documentation: |-
    Boot the reserved bare-metal hosts from the discovery ISO URL written by the discovery-iso step.
    The Konflux snapshot ISO is not used.
