chain:
  as: agent-qe-baremetal-install-ove-disconnected-konflux-local
  steps:
    - ref: agent-qe-baremetal-install-ove-disconnected-konflux-check-snapshot-id
    - ref: baremetal-lab-pre-reserve-nodes
    - ref: baremetal-lab-pre-dhcp-conf
    - chain: baremetal-lab-pre-load-balancer
    - ref: baremetal-lab-pre-dns
    - ref: baremetal-lab-pre-firewall
    - ref: baremetal-lab-pre-serial-console
    - ref: ipi-conf
    - ref: baremetal-lab-upi-conf-network
    - ref: baremetal-lab-ipi-conf-network-vips
    - ref: baremetal-lab-agent-conf-static
    - ref: agent-qe-baremetal-install-ove-disconnected-konflux-extract-iso
    - ref: agent-qe-baremetal-install-ove-disconnected-konflux-deploy-assisted
    - ref: agent-qe-baremetal-install-ove-disconnected-konflux-discovery-iso
    - ref: agent-qe-baremetal-install-ove-disconnected-konflux-boot-discovery-iso
    - ref: agent-qe-baremetal-install-ove-disconnected-agent-tui
    - ref: agent-qe-baremetal-install-ove-disconnected-assisted-ui
  documentation: |-
    Provision an OVE bare-metal cluster from a Konflux snapshot. The snapshot ISO is registered with a
    local assisted-service as the only disconnected-iso OS image, and the nodes boot the discovery ISO
    that service generates. Agent TUI and Assisted UI then monitor the installation.
