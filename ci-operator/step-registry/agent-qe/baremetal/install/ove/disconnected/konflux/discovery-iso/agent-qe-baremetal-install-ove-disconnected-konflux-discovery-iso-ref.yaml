ref:
  as: agent-qe-baremetal-install-ove-disconnected-konflux-discovery-iso
  from_image:
    namespace: ci
    name: "baremetal-qe-base"
    tag: latest
  commands: agent-qe-baremetal-install-ove-disconnected-konflux-discovery-iso-commands.sh
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
  grace_period: 600
  timeout: 2h0m0s
  env:
    - name: AUX_HOST
      default: ""
    - name: DISCONNECTED
      default: "false"
    - name: PATCH_STATIC_NETWORK
      default: "false"
      documentation: |-
        When true, static network config from the lab agent-config is sent on the disconnected infra-env.
  documentation: |-
    Register an unmonitored disconnected cluster and a disconnected-iso infra-env with the local
    assisted-service, download the discovery ISO, and publish it on the lab ISO storage host.
