ref:
  as: agent-qe-baremetal-install-ove-disconnected-konflux-patch-iso
  from_image:
    namespace: ci
    name: "baremetal-qe-base"
    tag: latest
  commands: agent-qe-baremetal-install-ove-disconnected-konflux-patch-iso-commands.sh
  resources:
    requests:
      cpu: '1'
      memory: 256Mi
  grace_period: 600
  env:
    - name: AUX_HOST
      default: ""
    - name: architecture
      default: ""
    - name: masters
      default: "3"
    - name: workers
      default: "2"
    - name: PATCH_STATIC_NETWORK
      default: "false"
      documentation: |-
        Injects the static networking configuration into the Ignition file. This simulates the same network configuration behavior as configuring static networking through the SaaS UI.
  documentation: |-
    The agent-qe-baremetal-install-ove-disconnected-konflux-patch-iso patches the OVE ISO ignition