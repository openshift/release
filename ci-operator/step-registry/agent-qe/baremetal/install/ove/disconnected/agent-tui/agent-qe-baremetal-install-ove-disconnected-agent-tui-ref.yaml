ref:
  as: agent-qe-baremetal-install-ove-disconnected-agent-tui
  from_image:
    namespace: ci
    name: "agent-qe-base"
    tag: latest
  commands: agent-qe-baremetal-install-ove-disconnected-agent-tui-commands.sh
  resources:
    requests:
      cpu: '1'
      memory: 128Mi
  grace_period: 600
  env:
    - name: AUX_HOST
      default: ""
      documentation: ""
    - name: NETWORK_MODE
      default: "dhcp"
      documentation: |-
        Network assignment strategy used when the network is configured through the Agent TUI. Options are:
        - "dhcp"  : Automatically allocates dynamic IP addresses.
        - "static": Configures manual IPs, requires static network parameters:
           - IP_ADDRESS: Static IP address assigned to the host.
           - SERVER_ADDRESS: Server or gateway address.
           - INTERFACE: Network interface used for the connection.
           - HOSTNAME: Hostname assigned to the host.
  documentation: |-
    The agent-qe-baremetal-install-ove-disconnected-agent-tui executes the Agent TUI workflow, which requires setting up the machine as a Rendezvous node.