ref:
  as: agent-qe-baremetal-install-ove-disconnected-assisted-ui
  from_image:
    namespace: ci
    name: "agent-qe-base"
    tag: latest
  commands: agent-qe-baremetal-install-ove-disconnected-assisted-ui-commands.sh
  resources:
    requests:
      cpu: '1'
      memory: 128Mi
  grace_period: 600
  timeout: 4h45m0s
  env:
    - name: VENDOR
      default: "dell"
    - name: LOAD_BALANCER_TYPE
      default: "cluster-managed"
    - name: ADDITIONAL_OPERATORS
      default: ""
      documentation: |-
        Additional cluster operator add-ons to select from the Assisted UI. Options include:
          - "LVM"
          - "LSO"
          Note: Pass as a comma-separated list.
    - name: TOPOLOGY_TYPE
      default: "COMPACT"
      documentation: |-
        The cluster topology configuration can be set using one of the below options:
          - "SNO"    : Sets up a 1-master, 0-worker
          - "COMPACT": Sets up a 3-master, 0-worker
          - "HA"     : Sets up a 3-master, 2 or 3-worker
          - "4CP"    : Sets up a 4-master, 0-worker
          - "5CP"    : Sets up a 5-master, 0-worker
  documentation: |-
    The agent-qe-baremetal-install-ove-disconnected-assisted-ui executes the Assisted UI workflow, which requires starting the cluster installation.