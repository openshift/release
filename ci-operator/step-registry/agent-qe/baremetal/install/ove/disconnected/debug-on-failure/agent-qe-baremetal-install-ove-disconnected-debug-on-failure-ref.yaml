ref:
  as: agent-qe-baremetal-install-ove-disconnected-debug-on-failure
  from_image:
    namespace: ci
    name: tests-private-base
    tag: latest
  cli: latest
  grace_period: 5m
  timeout: 7h0m0s
  commands: agent-qe-baremetal-install-ove-disconnected-debug-on-failure-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: DEBUG_SLEEP_HOURS
    default: "6"
    documentation: |-
      Number of hours to sleep for live debugging when a failure occurs.
  documentation: |-
    Sleep for a configurable duration to allow live debugging of the
    cluster after a failure. Intended as a best_effort post step that
    runs only on failure (optional_on_success: true). Checks cluster
    reachability before sleeping.
