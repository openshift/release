ref:
  as: review-agent-trigger
  from: claude-ai-helpers
  commands: review-agent-trigger-commands.sh
  env:
  - name: GANGWAY_API
    default: "https://gangway-ci.apps.ci.l2s4.p1.openshiftapps.com"
    documentation: |-
      Gangway API endpoint for triggering periodic jobs.
  - name: PERIODIC_JOB_NAME
    documentation: |-
      Name of the periodic job to trigger via gangway. Required — set by
      the repo-specific trigger workflow (e.g.
      periodic-ci-openshift-hypershift-main-periodic-review-agent).
  - name: REVIEW_AGENT_UPSTREAM_REPO
    documentation: |-
      Upstream owner/repo for posting PR comments (e.g. openshift/hypershift).
      Required — set by the repo-specific trigger workflow.
  - name: REVIEW_AGENT_PAT_KEY
    default: "gh-pat"
    documentation: |-
      Key name in the credential secret for the GitHub PAT used to post
      PR comments.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  credentials:
  - namespace: test-credentials
    name: hypershift-team-claude-prow
    mount_path: /var/run/claude-code-service-account
  documentation: |-
    Shared trigger step for the Review Agent, used by both the Installer
    and HyperShift review-agent workflows. Instead of running the review
    agent inline (which aborts the presubmit when it pushes), this step
    triggers the periodic review-agent job via gangway and posts a comment
    on the PR with a link to the triggered job. Repo-specific settings
    (PERIODIC_JOB_NAME, REVIEW_AGENT_UPSTREAM_REPO) are provided by the
    calling workflow.
