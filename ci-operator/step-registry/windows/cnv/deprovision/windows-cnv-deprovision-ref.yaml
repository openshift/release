ref:
  as: windows-cnv-deprovision
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: windows-cnv-deprovision-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 15m0s
  documentation: |-
    Deprovisions Windows KubeVirt VMs created by windows-cnv-provision.
    Reads *_cnv_vm.txt marker files from SHARED_DIR and deletes the
    corresponding VirtualMachines, sysprep Secrets, headless Service,
    and imported golden image DataVolume. Best-effort cleanup that
    does not fail the job if resources are already gone.
