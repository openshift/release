ref:
  as: windows-node-readiness
  from_image:
    namespace: ci
    name: ci-secret-generator
    tag: latest
  cli: latest
  commands: windows-node-readiness-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  timeout: 1h0m0s
  env:
  - name: WINDOWS_NODE_REPLICAS
    default: "2"
    documentation: Number of Windows nodes expected to be Ready.
  documentation: |-
    Waits for all Windows MachineSets to reach their desired replica count and for the expected number of Windows nodes to become Ready within one bounded deadline.
    The UBI-based ci-secret-generator image supplies bash and jq without running its generator entrypoint; cli: latest supplies the release oc.
