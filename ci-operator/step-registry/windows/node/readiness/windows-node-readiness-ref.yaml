ref:
  as: windows-node-readiness
  from: cli
  commands: windows-node-readiness-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  timeout: 30m0s
  env:
  - name: WINDOWS_NODE_REPLICAS
    default: "2"
    documentation: Number of Windows nodes expected to be Ready.
  documentation: |-
    Waits for all Windows MachineSets to reach their desired replica count and for the expected number of Windows nodes to become Ready.
