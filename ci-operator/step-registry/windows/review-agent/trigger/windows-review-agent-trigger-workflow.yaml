workflow:
  as: windows-review-agent-trigger
  steps:
    test:
      - ref: review-agent-trigger
    env:
      PERIODIC_JOB_NAME: "periodic-ci-openshift-windows-machine-config-operator-master-periodic-review-agent"
      REVIEW_AGENT_UPSTREAM_REPO: "openshift/windows-machine-config-operator"
  documentation: |-
    Lightweight workflow that triggers the WMCO review-agent periodic
    job via gangway instead of running the agent inline. This avoids the
    presubmit aborting when the agent pushes to the PR branch.
