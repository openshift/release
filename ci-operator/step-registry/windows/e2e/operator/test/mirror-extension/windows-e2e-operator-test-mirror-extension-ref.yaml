ref:
  as: windows-e2e-operator-test-mirror-extension
  from: upi-installer
  cli: latest
  grace_period: 10m
  commands: windows-e2e-operator-test-mirror-extension-commands.sh
  dependencies:
  - name: EXTENSION_IMAGE
    env: EXTENSION_IMAGE
  credentials:
  - collection: openshift-qe
    group: mirror-registry
    mount_path: /var/run/vault/mirror-registry
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Mirror the resolved OTE image to the disconnected bastion registry and verify
    it before writing ${SHARED_DIR}/mirrored_extension_image for
    openshift-tests-extension-setup-out-of-payload. Combines the cluster profile
    pull secret with the mirror registry credentials in a private temporary auth
    file, cleaned on exit. Requires an EXTENSION_IMAGE dependency override.
    Legacy OTP jobs should use only windows-e2e-operator-test-mirror-images.
