ref:
  as: windows-e2e-operator-test-mirror-images
  from: upi-installer
  cli: latest
  grace_period: 10m
  commands: windows-e2e-operator-test-mirror-images-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: openshift-qe
    group: mirror-registry
    mount_path: /var/run/vault/mirror-registry
  documentation: |-
    Mirror images required to run the Windows e2e test suite to the internal cluster registry.

    Also writes the mirrored WMCO OTE test image pull specification to
    ${SHARED_DIR}/mirrored_extension_image for openshift-tests-extension-setup-out-of-payload.
  env:
    - name: PAUSE_IMAGE_ORG
      default: ""
