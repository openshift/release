chain:
  as: windows-e2e-ote-byoh-pool-aws-upi-pre
  steps:
  - ref: ipi-install-rbac
  - chain: ipi-conf-aws
  - ref: ovn-conf
  - ref: ovn-conf-hybrid-manifest
  - chain: upi-install-aws
  - ref: ssh-bastion
  - ref: openshift-windows-setup-wmco-konflux
  - ref: operatorhub-subscribe
  - ref: windows-conf-operator
  - ref: aws-windows-ami-discover
  - ref: windows-byoh-node-pool-provision
  - chain: cucushift-installer-check
  documentation: |-
    Provision an AWS UPI OVN hybrid cluster, install WMCO, and create unregistered
    BYOH hosts in pool mode for the dedicated WMCO OTE suite. Do not wait for Windows
    Nodes to become Ready here; the selected OTE cases register hosts and verify Node
    readiness as part of their own lifecycle.
