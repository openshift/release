chain:
  as: windows-e2e-ote-byoh-pool-aws-upi-pre
  steps:
  - ref: ipi-install-rbac
  - chain: ipi-conf-aws
  - ref: ovn-conf
  - ref: ovn-conf-hybrid-manifest
  - chain: upi-install-aws
  - ref: openshift-windows-setup-wmco-konflux
  - ref: operatorhub-subscribe
  - ref: windows-conf-operator
  - ref: aws-windows-ami-discover
  - ref: windows-byoh-node-pool-provision
  - chain: cucushift-installer-check
  documentation: |-
    AWS UPI OVN setup for the WMCO BYOH OTE suite: install WMCO, provision three
    Terraform-backed BYOH hosts, mark one host disposable, register the hosts, and
    wait for their Nodes to become Ready. The OTE fixture consumes this pre-registered
    pool inventory.
