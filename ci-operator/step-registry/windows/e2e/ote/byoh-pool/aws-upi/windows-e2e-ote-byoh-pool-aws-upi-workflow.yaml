workflow:
  as: windows-e2e-ote-byoh-pool-aws-upi
  steps:
    env:
      SUB_CHANNEL: stable
      SUB_INSTALL_NAMESPACE: openshift-windows-machine-config-operator
      SUB_PACKAGE: windows-machine-config-operator
      SUB_TARGET_NAMESPACES: '!install'
      SUB_SOURCE: wmco
      BYOH_NUM_WORKERS: "3"
      BYOH_WINDOWS_VERSION: "2025"
      BYOH_NODE_POOL_WAIT_FOR_READY: "true"
    pre:
    - chain: windows-e2e-ote-byoh-pool-aws-upi-pre
    post:
    - chain: windows-e2e-ote-byoh-pool-aws-upi-post
  documentation: |-
    WINC-2157 AWS UPI OVN BYOH OTE workflow. It installs WMCO, provisions the
    Terraform-backed BYOH node pool, runs the dedicated WMCO BYOH OTE suite, and
    destroys the BYOH hosts before deprovisioning the cluster.
