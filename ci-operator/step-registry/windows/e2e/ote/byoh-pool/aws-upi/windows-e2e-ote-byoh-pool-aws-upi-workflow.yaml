workflow:
  as: windows-e2e-ote-byoh-pool-aws-upi
  steps:
    env:
      SUB_CHANNEL: stable
      SUB_INSTALL_NAMESPACE: openshift-windows-machine-config-operator
      SUB_PACKAGE: windows-machine-config-operator
      SUB_TARGET_NAMESPACES: '!install'
      SUB_SOURCE: wmco
      BYOH_NUM_WORKERS: "3"
      BYOH_WINDOWS_VERSION: "2022"
    pre:
    - chain: windows-e2e-ote-byoh-pool-aws-upi-pre
    post:
    - chain: windows-e2e-ote-byoh-pool-aws-upi-post
  documentation: |-
    WINC-2157: Provision AWS UPI BYOH hosts into the Terraform-backed Windows node pool,
    run only the WMCO BYOH OTE suite, then destroy the Windows hosts and cluster.
    Hosts remain unregistered until the OTE tests claim them. This workflow is separate
    from the joined-node AWS UPI workflow and does not change its Ready-node gate.
