chain:
  as: windows-e2e-ote-byoh-pool-aws-upi-postsubmit-pre
  steps:
  - chain: upi-aws-ovn-hybrid-pre
  - ref: openshift-windows-setup-wmco-konflux
  - ref: operatorhub-subscribe
  - ref: windows-conf-operator
  - ref: aws-windows-ami-discover
  - ref: windows-byoh-node-pool-provision
  documentation: |-
    FBC variant of the AWS UPI OVN BYOH pre chain. Installs WMCO from the
    Konflux file-based catalog instead of the revision-built image, for
    postsubmit coverage of the released operator. Provisions three
    Terraform-backed BYOH hosts and waits for their Nodes to become Ready.
