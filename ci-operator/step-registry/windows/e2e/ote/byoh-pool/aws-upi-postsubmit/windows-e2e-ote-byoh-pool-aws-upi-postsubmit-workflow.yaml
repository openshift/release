workflow:
  as: windows-e2e-ote-byoh-pool-aws-upi-postsubmit
  steps:
    env:
      SUB_CHANNEL: stable
      SUB_INSTALL_NAMESPACE: openshift-windows-machine-config-operator
      SUB_PACKAGE: windows-machine-config-operator
      SUB_TARGET_NAMESPACES: '!install'
      SUB_SOURCE: wmco
      BYOH_NUM_WORKERS: "3"
      BYOH_WINDOWS_VERSION: "2025"
      BYOH_NODE_POOL_WAIT_FOR_READY: "true"
    pre:
    - chain: windows-e2e-ote-byoh-pool-aws-upi-postsubmit-pre
    post:
    - chain: windows-e2e-ote-byoh-pool-aws-upi-post
  documentation: |-
    FBC variant of the AWS UPI OVN BYOH node-pool workflow. Installs WMCO from
    the Konflux FBC catalog instead of the revision-built image, for postsubmit
    validation of the promoted operator image.
