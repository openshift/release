ref:
  as: windows-byoh-node-pool-provision
  from_image:
    namespace: ci
    name: terraform-windows-provisioner
    tag: latest
  commands: windows-byoh-node-pool-provision-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: BYOH_INSTANCE_NAME
    default: ""
    documentation: "Base name for Windows instances (generated if unset and shared with teardown)"
  - name: BYOH_NUM_WORKERS
    default: "3"
    documentation: "Number of Windows hosts to provision into the node pool"
  - name: BYOH_WINDOWS_VERSION
    default: "2025"
    documentation: "Windows Server version to provision"
  - name: WINC_ADMIN_PASSWORD
    default: ""
    documentation: "Windows administrator password (generated by the provisioner if unset)"
  - name: AWS_WINDOWS_AMI
    default: ""
    documentation: "Optional Windows AMI override"
  - name: BYOH_NODE_POOL_WAIT_FOR_READY
    default: "false"
    documentation: "Register provisioned hosts with WMCO and leave them joined after verifying Node readiness"
  - name: BYOH_READY_TIMEOUT
    default: "45m"
    documentation: "Timeout waiting for the provisioned Windows Nodes to become Ready"
  documentation: |-
    Provisions unregistered BYOH hosts into the WMCO node pool for the AWS UPI OTE workflow.
    Uses the same ci/terraform-windows-provisioner:latest image and its byoh.sh entry point
    as the existing BYOH steps, with USE_NODE_POOL=true. Saves Terraform state immediately
    after apply, including when apply fails after creating some resources, for teardown.
    With BYOH_NODE_POOL_WAIT_FOR_READY=true, reuses byoh.sh configmap to register hosts
    and waits for their named Nodes to become Ready. Pool entries remain available
    until the pre-registered OTE fixture claims them.
