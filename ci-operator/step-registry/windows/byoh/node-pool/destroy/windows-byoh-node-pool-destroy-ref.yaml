ref:
  as: windows-byoh-node-pool-destroy
  from_image:
    namespace: ci
    name: terraform-windows-provisioner
    tag: latest
  commands: windows-byoh-node-pool-destroy-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: BYOH_NUM_WORKERS
    default: "3"
    documentation: "Number of Windows hosts provisioned into the node pool"
  - name: BYOH_WINDOWS_VERSION
    default: "2022"
    documentation: "Windows Server version to destroy"
  documentation: |-
    Removes Terraform-backed BYOH node-pool entries and destroys the Windows hosts.
    Uses the same ci/terraform-windows-provisioner:latest image and byoh.sh entry point
    as the existing BYOH teardown step, with USE_NODE_POOL=true.
