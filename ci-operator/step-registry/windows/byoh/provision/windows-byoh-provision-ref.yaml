ref:
  as: windows-byoh-provision
  from_image:
    namespace: ci
    name: terraform-windows-provisioner
    tag: latest
  commands: windows-byoh-provision-commands.sh
  grace_period: 5m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
    - name: BYOH_INSTANCE_NAME
      default: ""
      documentation: "Base name for Windows instances (auto-generated with random suffix if not set)"
    - name: BYOH_NUM_WORKERS
      default: "2"
      documentation: "Number of Windows workers to provision"
    - name: BYOH_WINDOWS_VERSION
      default: "2022"
      documentation: "Windows Server version (2019 or 2022)"
    - name: WINC_ADMIN_PASSWORD
      default: ""
      documentation: "Windows administrator password (auto-generated if not provided)"
    - name: NUTANIX_WINDOWS_IMAGE
      default: "nutanix-windows-server"
      documentation: "Nutanix golden image name for Windows (Prow CI uses nutanix-windows-server)"
    - name: AWS_WINDOWS_AMI
      default: ""
      documentation: "Override AWS Windows AMI (useful for pinning specific version in upgrade tests)"
    - name: BYOH_READY_TIMEOUT
      default: "45m"
      documentation: "Timeout waiting for BYOH nodes to become Ready (use 45m-60m for vSphere, 30m for cloud platforms)"
    - name: BYOH_DEBUG_CONTINUE
      default: "false"
      documentation: |-
        Debug-only flag. When "true" and provisioning or readiness fails, the step
        records the original failure exit status in SHARED_DIR/byoh_debug_original_failure_status,
        logs a visible warning, and returns exit 0 so the workflow continues to the next step
        (typically a bounded ref:wait for cluster inspection). This is NOT a provisioning success.
        Must only be enabled by debug callers (debug-winc-aws-upi on main and release-5.0).
        Default: "false" (normal behaviour — failures return the original nonzero exit status).
  documentation: |-
    Provisions Windows BYOH (Bring Your Own Host) nodes using terraform-windows-provisioner container image.

    This step:
    1. Uses pre-built terraform-windows-provisioner image (ci/terraform-windows-provisioner:latest)
    2. Starts background watchers to capture Windows Node metadata and cloud-controller-manager
       (CCM) logs BEFORE BYOH registration triggers WMCO (captures fleeting node creates/deletes)
    3. Provisions Windows worker nodes on the detected cloud platform (AWS, Azure, GCP, vSphere, Nutanix, None)
    4. Saves Terraform cleanup state to protected SHARED_DIR before readiness polling
    5. Waits for nodes to become Ready
    6. Stops background watchers and exports instance information to SHARED_DIR for WMCO BYOH e2e tests

    Background watchers are read-only, bounded, and stopped/reaped on all exit paths
    (success, failure, signal). They never modify cluster resources or read Secrets.

    On failure, the step preserves the original nonzero exit status and collects bounded,
    best-effort WMCO diagnostics. Public artifacts contain only sanitized technical
    summaries (no raw IPs, hostnames, ARNs, or credentials). Raw operator logs are
    stored in protected SHARED_DIR only.

    Cloud credentials are automatically provided via the cluster profile (CLUSTER_PROFILE_DIR).

    Terraform state can contain sensitive values. It is kept only in protected SHARED_DIR,
    archived there immediately after the provisioner returns (including after partial failures
    when state exists), and is never copied to ARTIFACT_DIR.
