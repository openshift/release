ref:
  as: cnv-storage-checkup-configure-storage
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  cli: latest
  commands: cnv-storage-checkup-configure-storage-commands.sh
  timeout: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: CHECKUP_STORAGE_CLASS
    default: ""
    documentation: Name of the StorageClass to make the virtualization default.
  - name: CHECKUP_EXPECTED_PROVISIONER
    default: ""
    documentation: Required CSI provisioner for the selected StorageClass.
  - name: CHECKUP_STORAGE_CLASS_PARAMETERS
    default: ""
    documentation: |-
      Optional JSON object of string-valued CSI parameters. When set, create the
      named StorageClass with WaitForFirstConsumer binding and Delete reclaim policy.
      Leave unset to select an existing class.
  documentation: |-
    Select a provider CSI StorageClass and make it the sole virtualization
    default before installing CNV so CDI imports the golden images to that class.
