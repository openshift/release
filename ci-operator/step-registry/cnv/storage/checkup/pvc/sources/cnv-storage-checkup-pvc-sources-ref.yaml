ref:
  as: cnv-storage-checkup-pvc-sources
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  cli: latest
  commands: cnv-storage-checkup-pvc-sources-commands.sh
  timeout: 25m0s
  grace_period: 1m0s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  env:
  - name: CHECKUP_GOLDEN_IMAGES_NAMESPACE
    default: openshift-virtualization-os-images
    documentation: Namespace containing the CNV-managed golden-image sources.
  documentation: |-
    Configure PVC-backed golden-image sources and copy-based clones on the
    selected StorageProfile. Wait for each managed DataSource to reference a
    ready PVC before running the checkup.
