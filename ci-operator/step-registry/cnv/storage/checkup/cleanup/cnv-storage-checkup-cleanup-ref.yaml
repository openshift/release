ref:
  as: cnv-storage-checkup-cleanup
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  cli: latest
  commands: cnv-storage-checkup-cleanup-commands.sh
  timeout: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  documentation: |-
    Remove the checkup namespace and its cluster-reader binding after artifact
