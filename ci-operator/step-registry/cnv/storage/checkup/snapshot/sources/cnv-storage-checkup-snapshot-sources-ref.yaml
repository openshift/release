ref:
  as: cnv-storage-checkup-snapshot-sources
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  cli: latest
  commands: cnv-storage-checkup-snapshot-sources-commands.sh
  timeout: 25m0s
  grace_period: 1m0s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  env:
  - name: CHECKUP_GOLDEN_IMAGES_NAMESPACE
    default: openshift-virtualization-os-images
    documentation: Namespace containing the CNV-managed DataImportCrons, DataSources, and source snapshots.
  documentation: |-
    Set the selected StorageProfile to snapshot-backed DataImportCron boot sources
    and wait until each CNV-managed DataSource references a ready VolumeSnapshot.
    This runs after cnv-storage-checkup-prepare and before the checkup runner.
