workflow:
  as: cnv-storage-checkup-azure
  steps:
    allow_best_effort_post_steps: true
    pre:
    - ref: ipi-conf-cpu-manager
    - chain: ipi-azure-pre
    - ref: cnv-deploy-cnv
    - ref: cnv-storage-checkup-prepare
    test:
    - ref: cnv-storage-checkup-run
    post:
    - ref: cnv-storage-checkup-gather
    - chain: ipi-azure-post
  documentation: |-
    Provision OCP on Azure, install CNV, and run its shipped storage checkup
    through shared preparation, execution, and collection steps. The caller
    supplies an Azure cluster_profile, OCP release, CNV catalog/channel inputs,
    and VM-capable worker sizing. Preparation verifies schedulable KVM capacity.
    Select an Azure Disk CSI StorageClass and assert its provisioner in the
    calling job. Post steps collect diagnostics before deleting the checkup
    resources and OCP cluster.
