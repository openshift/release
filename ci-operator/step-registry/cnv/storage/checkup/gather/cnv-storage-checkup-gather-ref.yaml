ref:
  as: cnv-storage-checkup-gather
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  cli: latest
  commands: cnv-storage-checkup-gather-commands.sh
  timeout: 15m0s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  env:
  - name: CHECKUP_CNV_NAMESPACE
    default: openshift-cnv
    documentation: Namespace containing CNV resources to include in diagnostics.
  - name: CHECKUP_GOLDEN_IMAGES_NAMESPACE
    default: openshift-virtualization-os-images
    documentation: Namespace containing CNV-managed boot sources to include in diagnostics.
  documentation: |-
    Collect checkup results, workload state, pod logs, events, and cluster storage
    configuration without collecting secrets or kubeconfigs. Then remove the
    run namespace and its cluster-reader binding. Run before platform teardown,
    including when preparation or the checkup failed.
