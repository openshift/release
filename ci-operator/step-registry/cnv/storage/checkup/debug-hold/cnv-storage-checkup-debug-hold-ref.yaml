ref:
  as: cnv-storage-checkup-debug-hold
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  cli: latest
  commands: cnv-storage-checkup-debug-hold-commands.sh
  timeout: 2h5m0s
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  env:
  - name: CHECKUP_POST_GATHER_HOLD_SECONDS
    default: "0"
    documentation: Seconds to keep the cluster available for debugging after gathering checkup artifacts and before cleanup, from 0 to 7200.
  documentation: |-
    Keep the cluster and checkup Job available for interactive investigation
    after the runner and gather steps finish, including when the checkup fails.
    Skip the hold when the runner did not create the checkup Job.
