# Copy of the ipi-gcp workflow (ci-operator/step-registry/ipi/gcp), adapted for
# CNV/virtualization. Keep in sync with ipi-gcp; the only intended difference is
# the machine types pinned via the cnv-ipi-gcp-pre chain.
workflow:
  as: cnv-ipi-gcp
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: cnv-ipi-gcp-pre
    post:
    - chain: ipi-gcp-post
    - ref: send-results-to-reportportal
  documentation: |-
    ipi-gcp with CNV/virtualization machine types pinned (via the cnv-ipi-gcp-pre
    chain) for the gcp-virtualization cluster profile.
