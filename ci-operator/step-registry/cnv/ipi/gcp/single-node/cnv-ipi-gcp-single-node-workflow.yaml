# Copy of the former ipi-gcp-single-node workflow (previously at
# ci-operator/step-registry/ipi/gcp/single-node), moved here because SSP was its
# only user. Adapted for CNV/virtualization: machine type pinned via
# cnv-ipi-gcp-single-node-pre.
workflow:
  as: cnv-ipi-gcp-single-node
  steps:
    pre:
    - chain: cnv-ipi-gcp-single-node-pre
    post:
    - chain: ipi-gcp-post
  documentation: |-
    Provisions a Single Replica Topology (single-node) OpenShift cluster on GCP
    for CNV/virtualization lanes, pinning a policy-compliant predefined machine
    type via the cnv-ipi-gcp-single-node-pre chain.
