# Copy of the former ipi-gcp-single-node workflow's pre steps (previously inlined
# in ci-operator/step-registry/ipi/gcp/single-node), moved here with SSP as the
# only user.
chain:
  as: cnv-ipi-gcp-single-node-pre
  steps:
  - chain: ipi-conf-gcp
  - ref: single-node-conf-gcp
  - ref: single-node-conf-e2e
  - chain: ipi-install
  documentation: |-
    Provisions a single-node OpenShift cluster on GCP for CNV/virtualization.
    The control-plane machine type is set by single-node-conf-gcp
    (n2-standard-16).