ref:
  as: cnv-deploy-cnv
  from_image:
    namespace: ci
    name: ocp-qe-perfscale-ci
    tag: latest
  cli: latest
  commands: cnv-deploy-cnv-commands.sh
  grace_period: 2h
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: cnv-ci-secrets
    group: cnv-ci-brew-pull-secret
    mount_path: /var/run/cnv-ci-brew-pull-secret
  - collection: virtualization-secrets
    group: konflux-pull-secret
    mount_path: /var/run/cnv-ci-konflux-pull-secret
  documentation: |-
    Deploy CNV
  env:
  - name: MULTISTAGE_PARAM_OVERRIDE_CNV_CATALOG_IMAGE
    default: ""
    documentation: Gangway override for CNV_CATALOG_IMAGE
  - name: CNV_OPERATOR_CHANNEL
    documentation: The CNV Operator Channel
    default: "stable"
  - name: CNV_CATALOG_IMAGE
    documentation: The CNV Image Index Bundle (IIB)
    default: ""
  - name: CNV_VERSION
    documentation: The CNV X.Y.Z version to deploy
    default: ""
  - name: CNV_CATALOG_SOURCE
    documentation: The CNV Catalog Source
    default: "redhat-operators"
  - name: IS_MCP_SERVER_DEPLOY
    documentation: Add CNV registry pull credentials for MCP server evaluation jobs
    default: "false"
  - name: BREW_IMAGE_REGISTRY_USERNAME
    documentation: Username for pulling CNV IIB images from brew.registry.redhat.io
    default: '|7820aea2-0d75-11e7-9259-28d244ea5a6d.hhav.f63e13'
  - name: BREW_IMAGE_REGISTRY_TOKEN_PATH
    documentation: Path to the brew.registry.redhat.io pull token
    default: /var/run/cnv-ci-brew-pull-secret/token
  - name: KONFLUX_REGISTRY_USERNAME
    documentation: Username for pulling CNV bundles from Konflux on Quay
    default: openshift-virtualization+konflux_ro_bot
  - name: KONFLUX_REGISTRY_TOKEN_PATH
    documentation: Path to the Konflux Quay pull token
    default: /var/run/cnv-ci-konflux-pull-secret/token
