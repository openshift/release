ref:
  as: redhat-lp-chaos-lp-cnv-hyperconverged
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  commands: redhat-lp-chaos-lp-cnv-hyperconverged-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: LPC_LP_CNV__HCO__NS
    default: openshift-cnv
    documentation: Namespace where the HyperConverged operand is created.
  - name: LPC_LP_CNV__HCO__NAME
    default: kubevirt-hyperconverged
    documentation: Name of the HyperConverged resource.
  - name: LPC_LP_CNV__HCO__WAIT_TIMEOUT
    default: 15m
    documentation: How long to wait for the HyperConverged resource to become Available.
  documentation: >-
    Creates the HyperConverged operand after the kubevirt-hyperconverged operator
    is installed and waits until it is Available. This registers the KubeVirt
    APIs, including VirtualMachine, that later VM steps require.
