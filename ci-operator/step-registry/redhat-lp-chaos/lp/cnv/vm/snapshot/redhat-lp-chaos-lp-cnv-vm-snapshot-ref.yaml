ref:
  as: redhat-lp-chaos-lp-cnv-vm-snapshot
  from: lp-chaos--ocp-test
  grace_period: 60s
  commands: redhat-lp-chaos-lp-cnv-vm-snapshot-commands.sh
  env:
    - name: LPC_LP_CNV__VM__SNAPSHOT__OPERATION
      default: create
      documentation: "The snapshot operation to perform: create | restore | delete."
    - name: LPC_LP_CNV__SNAPSHOT_NAME
      default: chaos-snapshot
    - name: LPC_LP_CNV__VM__NS
      default: "lp-chaos--cnv--test"
    - name: LPC_LP_CNV__SNAPSHOT_TIMEOUT
      default: 10m
    - name: LPC_LP_CNV__RPT_NAME
      default: lp-chaos--cnv
      documentation: "Name of the report."
    - name: LPC_LP_CNV__TS_NAME
      default: lp-chaos--cnv--vm-snapshot
      documentation: "Name of the Test Suite."
    - name: LPC_LP_CNV__TC_NAME
      default: 'Snapshot create and verify.'
      documentation: "Name of the Test Case."
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Performs a VM snapshot operation (create, restore, or delete) controlled by LPC_LP_CNV__VM__SNAPSHOT__OPERATION.
    On create: writes the snapshot name to SHARED_DIR for use by subsequent restore/delete steps.
