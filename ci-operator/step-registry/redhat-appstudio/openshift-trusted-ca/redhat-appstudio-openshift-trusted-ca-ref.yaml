ref:
  as: redhat-appstudio-openshift-trusted-ca
  commands: redhat-appstudio-openshift-trusted-ca-commands.sh
  env:
  - name: RHTAP_ENABLE_TPA
    default: "false"
  credentials:
    - mount_path: /usr/local/rhtap-ci-secrets/rhtap
      bundle: rhtap-ci-secrets
  from: rhtap-cli
  resources:
    requests:
      cpu: 100m
