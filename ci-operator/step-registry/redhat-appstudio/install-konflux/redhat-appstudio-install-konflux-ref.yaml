ref:
  as: redhat-appstudio-install-konflux
  cli: latest
  commands: redhat-appstudio-install-konflux-commands.sh
  credentials:
  - mount_path: /usr/local/konflux-ci-secrets-new/redhat-appstudio-qe
    group: konflux-ci-secrets-new
    collection: redhat-appstudio-qe
  dependencies:
  - env: COMPONENT_IMAGE
    # A placeholder for a component image tag. It's about to be overriden
    # by an image built in application-service job, build-service job etc.
    # It's not used in infra-deployments and e2e-tests PR jobs
    name: "release:latest"
  documentation: |-
    DEPRECATED: This step uses magefiles from konflux-ci/e2e-tests.
    Prefer the operator-overlay path
    (redhat-appstudio-operator-overlay-install /
    redhat-appstudio-operator-overlay-e2e), used by
    konflux-ring-deployments-conformance-tests.
  from: e2e-test-runner
  resources:
    requests:
      cpu: 100m
    