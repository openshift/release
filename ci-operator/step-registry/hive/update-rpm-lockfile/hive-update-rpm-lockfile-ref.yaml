ref:
  as: hive-update-rpm-lockfile
  from: src
  commands: hive-update-rpm-lockfile-commands.sh
  grace_period: 5m0s
  timeout: 2h0m0s
  env:
  - name: GITHUB_REPO_ORG
    default: openshift
    documentation: |-
      Upstream GitHub org that owns the hive repository.
  - name: GITHUB_REPO_NAME
    default: hive
    documentation: |-
      Upstream GitHub repository name.
  - name: GITHUB_REPO_BRANCH
    default: master
    documentation: |-
      Branch to open the lockfile PR against.
  - name: GITHUB_TOKEN_PATH
    default: /etc/github/oauth
    documentation: |-
      Path to the GitHub token file used to push a branch and open the PR.
  - name: GITHUB_PR_USER
    default: openshift-ci-robot
    documentation: |-
      GitHub user whose fork receives the lockfile branch. Also used as the git committer name.
  - name: GITHUB_PR_EMAIL
    default: openshift-ci-robot@users.noreply.github.com
    documentation: |-
      Email used for git commits.
  - name: ACTIVATION_KEY_DIR
    default: /var/run/activation-key
    documentation: |-
      Directory containing Red Hat subscription-manager credentials. Expected files are
      `org` and either `activationkey` or `activation-key`.
  credentials:
  - collection: ""
    mount_path: /var/run/activation-key
    name: hive-subscription-manager-activation-key
    namespace: test-credentials
  - collection: ""
    mount_path: /etc/github
    name: github-credentials-openshift-ci-robot-private-git-cloner
    namespace: ci
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
  documentation: |-
    Registers with subscription-manager, regenerates hack/hermetic/rpms.lock.yaml
    with rpm-lockfile-prototype (bare mode), and opens or updates a PR against
    openshift/hive when the lockfile changes. Does not update redhat.repo or
    rpms.in.yaml.
