ref:
  # Use an external image via from_image rather than from: no per-config image is
  # common to all consumers. e2etests exists only in some repos (not web-console);
  # src exists only in configs with a build_root (the operator nightly periodics have
  # none, so from: src makes the graph unsatisfiable). This step only needs a shell to
  # read SHARED_DIR, so pull a stock tooling image that is always available.
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  as: netobserv-evaluate-failures
  commands: netobserv-evaluate-failures-commands.sh
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
  documentation: |-
    Evaluates aggregated step failures recorded in ${SHARED_DIR}/netobserv-step-failures.
    Exits non-zero if any preceding test steps recorded a failure, ensuring the overall
    job correctly reports failure status even when individual steps exited 0 to allow
    subsequent steps to run.
