ref:
  as: netobserv-day0-install-config
  from: netobserv-perfscale
  cli: latest
  commands: netobserv-day0-install-config-commands.sh
  env:
  - name: NETOBSERV_INSTALLATION_POLICY
    default: "NoAction"
    documentation: |-
      Sets networking.networkObservability.installationPolicy in install-config.yaml.
      Use "NoAction" to disable day-0 installation (default for day0 measurement jobs).
      Use "InstallAndEnable" to enable at install time.
      Note: FEATURE_SET and FEATURE_GATES are handled by the ipi-conf step automatically
      when set in the job env block.
  timeout: 5m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Patches install-config.yaml to set networking.networkObservability.installationPolicy.
    Must run after ipi-conf-aws writes the base install-config.yaml and before ipi-install.
    FEATURE_SET and FEATURE_GATES are handled upstream by the ipi-conf step.
