ref:
  as: netobserv-day0-create-workload
  from: netobserv-perfscale
  cli: latest
  commands: netobserv-day0-create-workload-commands.sh
  env:
  - name: PODS_PER_NODE
    default: "200"
    documentation: |-
      Number of pods per worker node created by the node-density-heavy workload.
  - name: TOTAL_ELAPSED_SECONDS
    default: "1800"
    documentation: |-
      Total time in seconds the step should take. If kube-burner-ocp finishes
      earlier, the step sleeps for the remainder so the workload sits in the
      cluster for the full duration.
  - name: KUBE_BURNER_OCP_VERSION
    default: "1.13.1"
    documentation: |-
      Version of kube-burner-ocp to download and run.
  timeout: 45m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Downloads kube-burner-ocp and runs the node-density-heavy workload with
    --pods-per-node=200 --local-indexing --gc=false so the created pods remain
    in the cluster (no garbage collection) for subsequent day0 measurements.
    The step ensures a total elapsed time of TOTAL_ELAPSED_SECONDS (default 30
    minutes) by sleeping for the remainder after kube-burner-ocp completes,
    letting the workload sit in the cluster before the step exits.
