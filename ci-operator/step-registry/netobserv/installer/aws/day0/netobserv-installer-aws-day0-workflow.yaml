workflow:
  as: netobserv-installer-aws-day0
  steps:
    pre:
    - chain: ipi-conf-aws
    - chain: aws-provision-iam-user-minimal-permission
    - ref: rhcos-conf-osstream
    - ref: netobserv-day0-install-config
    - chain: ipi-install
    post:
    - chain: ipi-aws-post
  documentation: |-
    AWS IPI workflow for NetObserv day0 resource measurement jobs. Identical to
    openshift-qe-installer-aws but inserts netobserv-day0-install-config between
    the conf and install phases to set networkObservability.installationPolicy
    (default: NoAction) and required featureSet/featureGates in install-config.yaml
    before cluster provisioning.
