ref:
  as: rosa-hyperfleet-resolve-ocp-image
  from_image:
    namespace: ci
    name: rosa-regional-platform-ci
    tag: latest
  commands: rosa-hyperfleet-resolve-ocp-image-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  env:
  - name: OCP_RELEASE_STREAM
    default: ""
    documentation: |-
      Release controller stream whose latest accepted payload is used as the
      OCP release image of the e2e HCP cluster. Empty (the default) skips
      this step and the e2e step uses its default image.

      - "latest": the newest multi-arch nightly stream (X.Y.0-0.nightly-multi)
        with at least one accepted payload. Moves to a new OCP version on its
        own once that version's first nightly is accepted.
      - "ocp-branch": X.Y.0-0.nightly-multi for a release-X.Y branch under
        test, "latest" for any other branch (e.g. main). Requires a repo
        whose release-X.Y branches track OCP X.Y, such as an OCP component
        like openshift/hypershift; do not use it in repos with their own
        versioning. Falls back to "latest" with a warning when the branch's
        stream has no accepted payload yet (e.g. right after a branch cut).
        Unlike a fixed stream name, the value stays correct when
        config-brancher copies the config to release branches.
      - Any other value is used as the stream name, e.g. 5.1.0-0.nightly-multi
        or 5-dev-preview-multi. Multi-arch streams (ending in -multi) resolve
        to quay.io/openshift-release-dev images. amd64 nightly and CI streams
        resolve to CI registry images that the ephemeral environment cannot
        pull, so use multi-arch streams.
  documentation: |-
    Resolves OCP_RELEASE_STREAM to the latest accepted payload from the OCP
    release controller, for rosa-hyperfleet-e2e to use as OCP_IMAGE. Does
    nothing when OCP_RELEASE_STREAM is empty.

    How it resolves:
    1. "latest" and "ocp-branch" are turned into a stream name using the
       accepted streams listed by the multi-arch release controller. The
       branch for "ocp-branch" comes from JOB_SPEC (refs.base_ref for
       presubmits, extra_refs[0].base_ref for periodics).
    2. The latest accepted payload of that stream is fetched from
       multi.ocp.releases.ci.openshift.org for -multi streams, or from
       amd64.ocp.releases.ci.openshift.org otherwise.
    3. Its pullspec is written to ${SHARED_DIR}/ocp-image, which
       rosa-hyperfleet-e2e uses unless OCP_IMAGE is set explicitly. The full
       release is saved as ocp-release.json in the step artifacts.

    Runs before provisioning, so an unknown stream or a stream without
    accepted payloads fails the job in seconds instead of after provisioning.
