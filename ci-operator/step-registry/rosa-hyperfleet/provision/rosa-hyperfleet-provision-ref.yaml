ref:
  as: rosa-hyperfleet-provision
  from_image:
    namespace: ci
    name: rosa-regional-platform-ci
    tag: latest
  commands: rosa-hyperfleet-provision-commands.sh
  timeout: 7200s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: cluster-secrets-rosa-regional-platform-int
    group: ephemeral-creds
    mount_path: /var/run/rosa-credentials
  env:
  - name: AWS_CONFIG_FILE
    default: "/var/run/rosa-credentials/aws_config"
    documentation: |-
      Path to the AWS CLI config file with named profiles from the mounted
      credential secret.
  - name: ROSA_REGIONAL_PLATFORM_REF
    default: "main"
    documentation: |-
      Git ref of openshift-online/rosa-hyperfleet to provision from. Ignored
      on rosa-hyperfleet PRs, which provision from the PR's head branch. The
      resolved repo, branch and commit SHA are written to SHARED_DIR for the
      e2e and teardown steps.
  - name: ROSA_REGIONAL_COMPONENTS
    default: ""
    documentation: |-
      YAML list of components to override in the ephemeral environment.
      Each entry has 'target' (helm values file path in the repo),
      'override' (YAML content to deep-merge), and 'repo' (quay.io
      repository). IMAGE_REPO is substituted from 'repo' and IMAGE_TAG
      from the per-image tag written by the image-push step to
      SHARED_DIR/component-images.
      Example:
        - image: CI_IMAGE_1
          repo: quay.io/rrp-dev-ci/platform-api
          target: argocd/config/regional-cluster/platform-api/values.yaml
          override:
            platformApi:
              app:
                image:
                  repository: IMAGE_REPO
                  tag: IMAGE_TAG
  documentation: |-
    Provisions an ephemeral rosa-hyperfleet environment. On a rosa-hyperfleet
    PR the environment, and the e2e and teardown steps after it, use the PR's
    own code; otherwise ROSA_REGIONAL_PLATFORM_REF is used. Components listed
    in ROSA_REGIONAL_COMPONENTS are deep-merged into their target files
    with IMAGE_REPO/IMAGE_TAG substitution.
