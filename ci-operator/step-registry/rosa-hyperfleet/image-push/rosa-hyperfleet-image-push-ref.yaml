ref:
  as: rosa-hyperfleet-image-push
  from_image:
    namespace: ocp
    name: "4.21"
    tag: cli
  commands: rosa-hyperfleet-image-push-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  credentials:
  - collection: cluster-secrets-rosa-regional-platform-int
    group: rrp-dev-ci-quay
    mount_path: /var/run/quay-push-credentials
  # Generic image slots. A consumer maps only the slots it needs in its test's
  # steps.dependencies (e.g. CI_IMAGE_1: hypershift-operator) and references
  # them from ROSA_REGIONAL_COMPONENTS. Unused slots default to the
  # job's `src` image and are ignored.
  dependencies:
  - name: src
    env: CI_IMAGE_1
  - name: src
    env: CI_IMAGE_2
  - name: src
    env: CI_IMAGE_3
  - name: src
    env: CI_IMAGE_4
  - name: src
    env: CI_IMAGE_5
  - name: src
    env: CI_IMAGE_6
  - name: src
    env: CI_IMAGE_7
  - name: src
    env: CI_IMAGE_8
  env:
  - name: ROSA_REGIONAL_COMPONENTS
    default: ""
    documentation: |-
      YAML list of component images to push. Each entry has 'image'
      (CI_IMAGE_1..CI_IMAGE_8, mapped to a pipeline image in the test's
      steps.dependencies) and 'repo' (quay.io destination). Entries may also
      have 'target' (values file path in rosa-hyperfleet) and 'override'
      (YAML with IMAGE_REPO/IMAGE_TAG placeholders), which the provision
      step deploys. Per-image tags are written to
      SHARED_DIR/component-images for the provision step.
      On postsubmits (no PULL_NUMBER) each image is also tagged :latest.
      Example:
        - image: CI_IMAGE_1
          repo: quay.io/rrp-dev-ci/platform-api
          target: argocd/config/regional-cluster/platform-api/values.yaml
          override:
            platformApi:
              app:
                image:
                  repository: IMAGE_REPO
                  tag: IMAGE_TAG
  documentation: |-
    Copies CI-built component images to public quay.io repositories so
    that ephemeral EKS clusters can pull them without CI registry
    credentials. Images listed in ROSA_REGIONAL_COMPONENTS are pushed
    with per-image tag tracking via SHARED_DIR/component-images.
