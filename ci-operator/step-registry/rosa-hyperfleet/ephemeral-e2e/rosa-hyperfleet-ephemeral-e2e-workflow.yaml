workflow:
  as: rosa-hyperfleet-ephemeral-e2e
  steps:
    allow_best_effort_post_steps: true
    pre:
    - ref: rosa-hyperfleet-resolve-ocp-image
    - ref: rosa-hyperfleet-image-push
    - ref: rosa-hyperfleet-provision
    test:
    - ref: rosa-hyperfleet-e2e
    post:
    - ref: rosa-hyperfleet-teardown
  documentation: |-
    Provisions an ephemeral rosa-hyperfleet environment with an optional
    component image override, runs e2e tests, and tears down the environment.

    When triggered from rosa-hyperfleet-api, the e2e step auto-detects
    the PR's fork repo and branch via the GitHub API, so test changes in the
    PR are picked up automatically (including from forks). When triggered
    from rosa-hyperfleet itself, the environment is provisioned from the PR's
    head branch and every step runs the PR's code.

    Usage from a CI config:
      tests:
      - as: on-demand-e2e
        steps:
          workflow: rosa-hyperfleet-ephemeral-e2e
          dependencies:
            CI_IMAGE_1: <pipeline-image-name>
          env:
            ROSA_REGIONAL_COMPONENTS: |
              - image: CI_IMAGE_1
                repo: quay.io/rrp-dev-ci/<component>
                target: argocd/config/regional-cluster/<component>/values.yaml
                override:
                  <yaml-fragment-with-IMAGE_REPO-and-IMAGE_TAG-placeholders>

    Set OCP_RELEASE_STREAM (e.g. "5.1.0-0.nightly-multi") to run against the
    latest accepted OCP payload of a release controller stream instead of the
    e2e default. See rosa-hyperfleet-resolve-ocp-image for the values,
    including "ocp-branch-nightly" and "ocp-branch-candidate" for repos whose
    branches track OCP versions.
