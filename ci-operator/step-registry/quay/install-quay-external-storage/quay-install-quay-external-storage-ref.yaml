ref:
  as: quay-install-quay-external-storage
  cli: latest
  from_image:
    name: quay-test-console
    namespace: ci
    tag: latest
  commands: quay-install-quay-external-storage-commands.sh
  timeout: 1h0m0s
  grace_period: 10m
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: QUAY_UPGRADE_QUAY_NAMESPACE
    default: "quay"
    documentation: Namespace the QuayRegistry is created in (matches the upgrade/prepare-e2e defaults).
  - name: QUAY_UPGRADE_QUAY_REGISTRY
    default: "quay"
    documentation: Name of the QuayRegistry created (matches the upgrade/prepare-e2e defaults).
  - name: QUAY_INSTALL_READINESS_TIMEOUT
    default: "15m"
    documentation: Deadline (Ns/Nm/Nh) for the QuayRegistry to report Available.
  documentation: |-
    Deploy a QuayRegistry named ${QUAY_UPGRADE_QUAY_REGISTRY} in namespace
    ${QUAY_UPGRADE_QUAY_NAMESPACE} backed by externally provisioned object storage
    with objectstorage unmanaged. The Quay operator must already be installed
    (e.g. by quay-operator-upgrade-install-source); this step does NOT create an
    OperatorGroup/Subscription. It reads the backend-agnostic storage contract
    ${SHARED_DIR}/quay-storage-config.yaml written by a provision-storage-<backend>
    step (S3/GCS/Azure) and folds it into the config bundle together with
    FEATURE_USER_INITIALIZE and SUPER_USERS: [admin] so quay-create-admin-user can
    initialize the deployment.
