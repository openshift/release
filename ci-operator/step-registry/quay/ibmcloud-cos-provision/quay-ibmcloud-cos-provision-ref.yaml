ref:
  as: quay-ibmcloud-cos-provision
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  commands: quay-ibmcloud-cos-provision-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Create a per-run IBM Cloud Object Storage instance, an HMAC service key and
    a regional bucket in ${LEASED_RESOURCE}, using the API key of the
    ibmcloud-quay cluster profile. Writes QUAY_IBMCLOUD_COS_INSTANCE_NAME,
    QUAY_IBMCLOUD_COS_INSTANCE_ID, QUAY_IBMCLOUD_COS_BUCKET,
    QUAY_IBMCLOUD_COS_ENDPOINT, quay-ibmcloud-cos-access-key and
    quay-ibmcloud-cos-secret-key to SHARED_DIR for quay-deploy-ibmcloud-cos.
    quay-ibmcloud-cos-deprovision removes them.
