ref:
  as: quay-test-chainsaw
  from: src-oc
  commands: quay-test-chainsaw-commands.sh
  env:
  - name: CHAINSAW_SUITE
    default: "all"
    documentation: |-
      Which Chainsaw suite(s) to run: "all" runs both the ordinary e2e suite
      and the destructive (ca-rotation, postgres-tls-lifecycle) suite, "e2e"
      runs only the ordinary suite, and "destructive" runs only the
      destructive suite.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 2h30m
  documentation: |-
    Runs Chainsaw e2e tests for the quay-operator from the source repo
    against an OpenShift cluster with ODF and the quay operator bundle
    installed. CHAINSAW_SUITE selects the ordinary e2e suite, the
    destructive suite, or both.
