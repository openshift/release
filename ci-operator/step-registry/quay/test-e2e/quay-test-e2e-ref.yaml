ref:
  as: quay-test-e2e
  cli: latest
  from: quay-playwright-runner
  commands: quay-test-e2e-commands.sh
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
  timeout: 2h0m0s
  grace_period: 15m0s
  credentials:
  - collection: quay-tests
    group: quay
    mount_path: /var/run/quay-qe-quay-secret
  env:
  - name: PLAYWRIGHT_USE_IMAGE_TESTS
    default: "false"
    documentation: |-
      When "true", skip cloning PLAYWRIGHT_GIT_REPO and run the Playwright
      suite baked into the quay-playwright-runner image at /app. When
      "false" (default) the suite is cloned at runtime as before.
  - name: PLAYWRIGHT_GIT_REPO
    default: ""
    documentation: |-
      Git repository the Playwright suite is cloned from. Empty by default;
      the caller must set this explicitly in the ci-operator config whenever
      PLAYWRIGHT_USE_IMAGE_TESTS is "false", since the tests must be
      deliberately version-matched to the deployed Quay image. Not needed
      when PLAYWRIGHT_USE_IMAGE_TESTS is "true".
  - name: PLAYWRIGHT_GIT_BRANCH
    default: ""
    documentation: |-
      Optional explicit git ref (branch, tag, or commit SHA) for the Playwright
      tests. When set it overrides everything else, and the step fails if it
      cannot be cloned. When empty (the default), the step clones the upstream
      commit recorded in the deployed quay-app image's labels
      (io.openshift.build.commit.id, then vcs-ref, then
      org.opencontainers.image.revision; the first fetchable from
      PLAYWRIGHT_GIT_REPO wins). When none is fetchable, PLAYWRIGHT_REF_MODE
      decides what happens.
  - name: PLAYWRIGHT_REF_MODE
    default: "derived"
    documentation: |-
      What to do when no image label commit is fetchable from
      PLAYWRIGHT_GIT_REPO. "strict" fails the step and never falls back to a
      branch; product nightlies set it so the suite always matches the image
      under test. "derived" (default) clones the upstream vX.Y.Z tag matching
      the image's version label, else branch redhat-X.Y, else
      PLAYWRIGHT_GIT_FALLBACK_BRANCH, with a warning.
  - name: PLAYWRIGHT_GIT_FALLBACK_BRANCH
    default: "redhat-3.18"
    documentation: |-
      Last-resort branch in PLAYWRIGHT_REF_MODE "derived", cloned when the
      image yields no usable version label or its derived ref cannot be
      fetched from PLAYWRIGHT_GIT_REPO. Unused in "strict".
  - name: QUAY_OPERATOR_CHANNEL
    default: "stable-3.16"
    documentation: Installed Quay operator channel (informational in this step).
  - name: PLAYWRIGHT_GREP_INVERT
    default: "@auth:OIDC|@auth:LDAP|@feature:QUOTA_NOTIFICATIONS|@webhook"
    documentation: |-
      Regex passed to `playwright test --grep-invert` to skip tests. Defaults
      exclude unsupported auth backends (OIDC/LDAP), all webhook tests (out of
      scope), and tests tracking known product bugs / UI-version gaps. See
      E2E_FAILURE_REPORT.md for the rationale behind each quarantined entry.
  documentation: |-
    Execute Quay Playwright e2e smoke tests against a deployed Quay instance.
    By default the suite is cloned at runtime from PLAYWRIGHT_GIT_REPO; set
    PLAYWRIGHT_USE_IMAGE_TESTS "true" to run the suite baked into the
    quay-playwright-runner image at /app instead.
    When quay-deploy-jaeger ran successfully (${SHARED_DIR}/jaeger_deployed
    exists), this step port-forwards the in-cluster Jaeger query API and exports
    JAEGER_QUERY_URL=http://127.0.0.1:16686 so the suite can attach the server
    spans for a failed test's own requests. The forward is supervised for the
    length of the run and torn down on exit. If Jaeger was not deployed or the
    query API never answers, JAEGER_QUERY_URL is left unset and the suite
    records the spans as not collected rather than failing.
