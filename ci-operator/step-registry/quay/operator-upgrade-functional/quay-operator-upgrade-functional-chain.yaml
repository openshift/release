chain:
  as: quay-operator-upgrade-functional
  steps:
  - ref: quay-operator-upgrade-functional-playwright
  env:
  - name: PLAYWRIGHT_GREP
    default: ""
    documentation: |-
      Positive Playwright selector for the post-upgrade functional regression phase.
      Empty by default so the complete n (3.18) suite runs against the upgraded
      Quay (subject only to the PLAYWRIGHT_GREP_INVERT quarantine), giving the
      broadest post-upgrade regression signal. Set a regex to narrow the scope.
  - name: PLAYWRIGHT_PHASE
    default: "n"
    documentation: Select the independently configured PLAYWRIGHT_N_* suite controls (the n / redhat-3.18 branch).
  - name: PLAYWRIGHT_REQUIRE_EXPLICIT_REF
    default: "true"
    documentation: Prevent derived or fallback Playwright refs in the target phase; the n suite ref must be set explicitly.
  - name: PLAYWRIGHT_ARTIFACT_SUBDIR
    default: n-functional
    documentation: Keep post-upgrade functional-regression reports separate from seed and verify artifacts.
  - name: PLAYWRIGHT_WRITE_SPYGLASS_CARD
    default: "false"
    documentation: |-
      Skip the per-phase custom-link-quay-results.html card. The upgrade job's
      single Spyglass row comes from quay-operator-upgrade-report instead.
  - name: PLAYWRIGHT_MERGE_BLOBS
    default: "true"
    documentation: |-
      This is the last Playwright phase of the upgrade job, so its runner merges
      every phase's blob report into the single combined Playwright HTML report
      inside this phase's own pod. The full-suite blob (traces for every test) is
      far larger than the 1MiB Kubernetes Secret backing SHARED_DIR, so it can
      never be copied there (ci-operator would fail the step with
      "Secret ... data: Too long"); instead the seed/verify blobs are read from
      SHARED_DIR and this phase's blob stays local. The merged report lands in
      this step's artifacts and a tiny pointer file with its public GCS URL is
      left in SHARED_DIR for the final quay-operator-upgrade-report step to link.
  - name: PLAYWRIGHT_REF_MODE
    default: "derived"
    documentation: |-
      What to do when no image label commit is fetchable from
      PLAYWRIGHT_GIT_REPO. "strict" fails the step and never falls back to a
      branch; product nightlies set it so the suite always matches the image
      under test. "derived" (default) clones the upstream vX.Y.Z tag matching
      the image's version label, else branch redhat-X.Y, else
      PLAYWRIGHT_GIT_FALLBACK_BRANCH, with a warning.
  documentation: |-
    Thin n functional-regression wrapper around quay-test-e2e. Runs the complete
    target (3.18) suite after the upgrade to prove core functionality on the
    upgraded server. Pins the target suite through PLAYWRIGHT_N_GIT_*. Its
    PLAYWRIGHT_GREP_INVERT comes from the job's steps.env (the generator's shared
    quarantine, which also excludes the @upgrade-seed and @upgrade-verify specs the
    earlier phases ran); only this phase's ref declares it, so the seed and verify
    --grep selections are unaffected.
