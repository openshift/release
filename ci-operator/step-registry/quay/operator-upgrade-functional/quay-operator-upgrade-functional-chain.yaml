chain:
  as: quay-operator-upgrade-functional
  steps:
  - ref: quay-operator-upgrade-functional-playwright
  env:
  - name: PLAYWRIGHT_GREP
    default: ""
    documentation: |-
      Positive Playwright selector for the post-upgrade functional regression phase.
      Empty by default so the complete n (3.18) suite runs against the upgraded
      Quay (subject only to the PLAYWRIGHT_GREP_INVERT quarantine), giving the
      broadest post-upgrade regression signal. Set a regex to narrow the scope.
  - name: PLAYWRIGHT_PHASE
    default: n
    documentation: Select the independently configured PLAYWRIGHT_N_* suite controls (the n / redhat-3.18 branch).
  - name: PLAYWRIGHT_REQUIRE_EXPLICIT_REF
    default: "true"
    documentation: Prevent derived or fallback Playwright refs in the target phase; the n suite ref must be set explicitly.
  - name: PLAYWRIGHT_CREDENTIALS_SOURCE
    default: mounted-secret
    documentation: |-
      Read the quay-tests credential mount. The Playwright global setup manages the
      admin user itself; the admin persists across the upgrade, so the suite signs
      in with the same mounted credentials.
  - name: PLAYWRIGHT_ARTIFACT_SUBDIR
    default: n-functional
    documentation: Keep post-upgrade functional-regression reports separate from seed and verify artifacts.
  - name: PLAYWRIGHT_GREP_INVERT
    default: '@auth:OIDC|@auth:LDAP|@feature:QUOTA_NOTIFICATIONS|@upgrade-seed|@upgrade-verify|@webhook|saves and loads architecture filter with mirror configuration|loads existing architecture filter from saved mirror configuration'
    documentation: |-
      Regex passed to `playwright test --grep-invert` for the post-upgrade full
      suite. Beyond the standard quarantine (unsupported auth backends, webhook,
      quota-notification, and the known arch-filter race specs), this MUST exclude
      the @upgrade-seed and @upgrade-verify specs: they ran as the dedicated seed
      and verify phases, and the verify phase already removed the seeded fixtures
      (UPGRADE_CLEAN), so re-running @upgrade-verify here would fail. The upgrade
      job therefore does not set PLAYWRIGHT_GREP_INVERT at the shared steps.env
      level (that would also zero out the seed/verify --grep selections); the
      exclusion lives here so it applies to the functional phase only.
  documentation: |-
    Thin n functional-regression wrapper around quay-test-e2e. Runs the complete
    target (3.18) suite after the upgrade to prove core functionality on the
    upgraded server. Pins the target suite through PLAYWRIGHT_N_GIT_* and retains
    PLAYWRIGHT_GREP_INVERT exclusions by default.
