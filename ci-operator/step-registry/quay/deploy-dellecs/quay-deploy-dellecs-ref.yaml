ref:
  as: quay-deploy-dellecs
  cli: latest
  from_image:
    name: quay-test-omr
    namespace: ci
    tag: latest
  commands: quay-deploy-dellecs-commands.sh
  timeout: 8h0m0s
  grace_period: 10m
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: quay-tests
    group: dellecs
    mount_path: /var/run/quay-qe-dellecs-secret
  documentation: |-
    Deploy Quay Operator and Quay with unmanaged Dell ECS S3-compatible object
    storage. The bucket is created with the AWS CLI (no Terraform) using the
    quay-tests/dellecs credentials, and its name is derived from the CI namespace
    assigned at runtime. The secret's ECS endpoint is normalized to HTTPS (port
    80 becomes 443) for both the AWS CLI and Quay's storage configuration.
    Writes the bucket, endpoint, and region to SHARED_DIR
    for quay-deprovision, which removes the bucket in the post phase when
    QUAY_STORAGE_PROVIDER=dellecs. Merges ${SHARED_DIR}/quay-mail-config.yaml and
    ${SHARED_DIR}/quay-otel-config.yaml into the config bundle when present
    (written by the mailpit and jaeger deploy steps); absent when those steps
    did not run or produced no fragment. Also merges
    quay-database-{aws-rds,azure-postgres}-config.yaml when present
    (from quay-database-intg-* steps) and leaves postgres unmanaged.
  env:
  - name: DR__RP__CR_COMP_NAME
    default: "lp-ocp-compat--Quay"
    documentation: ReportPortal Component Readiness component name for junit remapping
  - name: MAP_TESTS
    default: "false"
    documentation: Specify whether to update the test suite name for reporting tools
  - name: QUAY_OPERATOR_CHANNEL
    documentation: The quay operator channel
    default: "stable-3.18"
  - name: QUAY_OPERATOR_SOURCE
    documentation: The quay operator source
    default: "redhat-operators"
  - name: QUAY_EXTRA_CONFIG
    documentation: |-
      Additional Quay configuration YAML merged on top of the default config.
      Values provided here override defaults. Supports flat keys and nested
      structures. Example: "FEATURE_QUOTA_MANAGEMENT: false". Fields owned by
      components this step keeps managed are removed after the merge because the
      operator injects them, so they cannot be overridden here (for example
      FEATURE_REPO_MIRROR, FEATURE_SECURITY_SCANNER, SERVER_HOSTNAME, and the
      BUILDLOGS_REDIS/USER_EVENTS_REDIS entries). DB_URI and DB_CONNECTION_ARGS
      are also excluded when postgres is managed.
    default: ""
  - name: QUAY_DELLECS_REGION
    documentation: |-
      Region used for the Dell ECS bucket and Quay's S3 client. The ECS endpoint
      is normally us-east-1 regardless of the testdrive namespace.
    default: "us-east-1"
  - name: ENABLE_BUILD_SUPPORT
    documentation: |-
      When "true", deploy Quay with virtual-builder build support: switch the
      QuayRegistry tls component to unmanaged, fold ${SHARED_DIR}/config_builder.yaml
      (FEATURE_BUILD_SUPPORT + BUILDMAN) into the config bundle, and include the
      unmanaged TLS cert/key and build-cluster CA in config-bundle-secret. Requires
      the quay-provisioning-tls and -builder steps to have run first
      (they produce ssl.cert, ssl.key, build_cluster.crt, config_builder.yaml in
      SHARED_DIR). When "false", Quay is deployed with managed TLS and no builder.
      For the kubernetes (QEMU) executor it also fills the VM image from the
      CSV's RELATED_IMAGE_COMPONENT_BUILDER_QEMU and, once Quay is ready, creates
      the executor's worker user, copies the CSV's builder image to WORKER_IMAGE,
      and pre-pulls the VM image on every worker.
    default: "false"
