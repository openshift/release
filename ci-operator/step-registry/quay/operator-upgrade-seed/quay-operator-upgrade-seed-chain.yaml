chain:
  as: quay-operator-upgrade-seed
  steps:
  - ref: quay-operator-upgrade-seed-playwright
  env:
  - name: PLAYWRIGHT_GREP
    default: '@upgrade-seed'
    documentation: |-
      Positive Playwright selector for the pre-upgrade n-1 phase. Selects only the
      upgrade seed specs (deterministic, no-cleanup fixtures authored in quay/quay)
      that create the organization/repository/robot/team/user whose survival the
      post-upgrade verify phase asserts. This is NOT the functional suite: only the
      seed + minimal liveness run on the n-1 server, so n-1 functional version skew
      cannot affect the result.
  - name: PLAYWRIGHT_PHASE
    default: n-minus-one
    documentation: Select the independently configured PLAYWRIGHT_N_MINUS_ONE_* suite controls (the n-1 / redhat-3.17 branch).
  - name: PLAYWRIGHT_REQUIRE_EXPLICIT_REF
    default: "true"
    documentation: Prevent derived or fallback Playwright refs in the source phase; the n-1 suite ref must be set explicitly.
  - name: PLAYWRIGHT_ARTIFACT_SUBDIR
    default: n-minus-one-seed
    documentation: Keep seed reports separate from the post-upgrade verify and functional reports.
  - name: PLAYWRIGHT_WRITE_SPYGLASS_CARD
    default: "false"
    documentation: |-
      Skip the per-phase custom-link-quay-results.html card. The upgrade job's
      single Spyglass row comes from quay-operator-upgrade-report instead.
  - name: PLAYWRIGHT_REF_MODE
    default: "derived"
    documentation: |-
      What to do when no image label commit is fetchable from
      PLAYWRIGHT_GIT_REPO. "strict" fails the step and never falls back to a
      branch; product nightlies set it so the suite always matches the image
      under test. "derived" (default) clones the upstream vX.Y.Z tag matching
      the image's version label, else branch redhat-X.Y, else
      PLAYWRIGHT_GIT_FALLBACK_BRANCH, with a warning.
  documentation: |-
    Thin n-1 seed wrapper around quay-test-e2e. Runs the quay/quay @upgrade-seed
    specs against the freshly installed n-1 (3.17) Quay to create the fixtures whose
    survival is asserted after the upgrade. Pins the source suite through
    PLAYWRIGHT_N_MINUS_ONE_GIT_*.
    Its ref deliberately does not declare PLAYWRIGHT_GREP_INVERT: the steps.env
    quarantine excludes the @upgrade-seed/@upgrade-verify specs and would empty
    this phase's --grep selection.
