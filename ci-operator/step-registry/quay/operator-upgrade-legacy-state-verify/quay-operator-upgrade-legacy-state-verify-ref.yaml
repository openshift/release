ref:
  as: quay-operator-upgrade-legacy-state-verify
  cli: latest
  from_image:
    name: quay-test-console
    namespace: ci
    tag: latest
  commands: quay-operator-upgrade-legacy-state-verify-commands.sh
  timeout: 1h30m0s
  grace_period: 15m0s
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
  env:
  - name: QUAY_UPGRADE_LEGACY_CYPRESS_STRICT
    default: "false"
    documentation: When true, require Cypress success and nonzero JUnit tests.
  documentation: Verifies and cleans up the SHARED_DIR state contract created by quay-operator-upgrade-legacy-state.
