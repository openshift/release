ref:
  as: quay-operator-upgrade-install-source
  cli: latest
  from: cli
  commands: quay-operator-upgrade-install-source-commands.sh
  timeout: 30m
  grace_period: 5m
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: QUAY_UPGRADE_SOURCE_CATALOG_IMAGE
    default: ""
    documentation: |-
      Optional immutable n-1 Quay catalog pullspec (image@sha256:<64 hex>). When
      empty, the ART FBC digest in ${SHARED_DIR}/quay_index_image is used.
  - name: QUAY_UPGRADE_SOURCE_CHANNEL
    default: ""
    documentation: Required source (n-1) Quay operator subscription channel.
  - name: QUAY_UPGRADE_TARGET_CHANNEL
    default: ""
    documentation: |-
      Target (n) channel. Read only in released-catalog mode, where the catalog
      preflight also requires it when the target is that same released catalog
      (no QUAY_UPGRADE_TARGET_CATALOG_IMAGE and no ART FBC digest in SHARED_DIR).
  - name: QUAY_UPGRADE_TARGET_CATALOG_IMAGE
    default: ""
    documentation: |-
      Target (n) catalog image of the upgrade step. Read only to decide whether
      the released-catalog preflight checks the target channel.
  - name: QUAY_UPGRADE_CATALOG_SOURCE
    default: ""
    documentation: |-
      Released-catalog mode. Empty (default) creates the source CatalogSource from
      the immutable catalog image. Set to an existing CatalogSource in
      QUAY_UPGRADE_CATALOG_NAMESPACE (e.g. redhat-operators) to subscribe from it
      instead: no catalog image is required or created, and the step waits for it
      to be READY and fails unless its quay-operator package serves the source
      channel, and the target channel when the target is this same catalog
      (channels listed in ARTIFACT_DIR/catalog-channels.txt).
  - name: QUAY_UPGRADE_SOURCE_CATALOG_NAME
    default: quay-upgrade-source
    documentation: Name for the source CatalogSource created by this step.
  - name: QUAY_UPGRADE_CATALOG_NAMESPACE
    default: openshift-marketplace
    documentation: Namespace in which source and target CatalogSources are created.
  - name: QUAY_UPGRADE_OPERATOR_NAMESPACE
    default: openshift-operators
    documentation: Namespace containing the Quay Subscription and CSVs.
  - name: QUAY_UPGRADE_SUBSCRIPTION_NAME
    default: quay-operator
    documentation: Name for the Quay Subscription managed by this step.
  - name: QUAY_UPGRADE_CATALOG_TIMEOUT
    default: 10m
    documentation: Bounded wait for catalog readiness and source CSV success.
  documentation: |-
    Creates an explicitly parameterized, immutable n-1 CatalogSource and installs
    the Quay operator from its requested channel. Invalid or missing source
    identity fails before mutation; the installedCSV and exact source identity
    are written to SHARED_DIR for the upgrade step. With QUAY_UPGRADE_CATALOG_SOURCE
    set, it installs from that released CatalogSource instead.
