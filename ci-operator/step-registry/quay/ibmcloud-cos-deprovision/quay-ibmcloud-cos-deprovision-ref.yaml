ref:
  as: quay-ibmcloud-cos-deprovision
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  commands: quay-ibmcloud-cos-deprovision-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Remove the IBM Cloud Object Storage resources created by
    quay-ibmcloud-cos-provision: empty and delete the bucket, delete the COS
    instance with its service keys, then delete the instance's reclamation so
    nothing is kept for the 7-day reclamation period. Looks the instance up by
    name when provision failed before recording its GUID. Exits 0 without doing
    anything when SHARED_DIR has no QUAY_IBMCLOUD_COS_INSTANCE_NAME or no
    instance of that name exists, and fails only when the instance delete
    fails.
