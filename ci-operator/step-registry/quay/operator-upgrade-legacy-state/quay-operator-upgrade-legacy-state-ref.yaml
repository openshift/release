ref:
  as: quay-operator-upgrade-legacy-state
  cli: latest
  from_image:
    name: quay-test-console
    namespace: ci
    tag: latest
  commands: quay-operator-upgrade-legacy-state-commands.sh
  timeout: 1h30m0s
  grace_period: 15m0s
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
  env:
  - name: QUAY_UPGRADE_LEGACY_STATE_PHASE
    default: seed
    documentation: seed creates persisted state before the OLM move; verify asserts it after the move and then cleans it up.
  - name: QUAY_UPGRADE_LEGACY_CYPRESS_STRICT
    default: "false"
    documentation: When true, require Cypress success and nonzero JUnit tests. Legacy install lanes do not set this opt-in; upgrade-legacy does.
  - name: QUAY_UPGRADE_QUAY_NAMESPACE
    default: quay-enterprise
    documentation: Namespace that contains the QuayRegistry and its route.
  - name: QUAY_UPGRADE_QUAY_REGISTRY
    default: quay
    documentation: Name of the deployed QuayRegistry.
  documentation: |-
    Shared Cypress/API persistence adapter for legacy Quay operator upgrades. The
    seed phase registers isolated users and creates an organization, private
    repository, pushed image tag, robot, team, member, and team permission. The
    verify phase requires every recorded API/registry state after the OLM move,
    then deletes the organization only after all checks succeed. Credentials are
    stored only in a mode-0600 SHARED_DIR state file while the two phases run.
