ref:
  as: quay-standalone-aws-leak-check
  from: upi-installer
  cli: latest
  commands: quay-standalone-aws-leak-check-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  timeout: 10m0s
  grace_period: 1m0s
  documentation: |-
    Fail the job when Quay standalone HA AWS resources survive teardown. Run it
    last in post, after aws-deprovision-s3buckets and aws-deprovision-stacks.
    It deletes nothing.

    It exits 1 and prints the identifiers of anything left:
    - the CloudFormation stack, unless absent or DELETE_COMPLETE
    - EC2 instances tagged quay-standalone-job=<job tag> that are not terminated
    - the RDS DB instance
    - the S3 bucket, when head-bucket succeeds
    - the NLB and the internal Clair NLB, matched by DNS name, when the stack
      was created
    A lookup that fails for any reason other than "not found" also fails the step.

    Reads from SHARED_DIR: quay_standalone_job_tag, quay_standalone_region,
    quay_standalone_stack_name, quay_standalone_db_identifier,
    quay_standalone_s3_bucket and, when present, quay_standalone_hostname and
    quay_standalone_clair_hostname. With
    no quay_standalone_job_tag the infra step never ran and the check exits 0.
