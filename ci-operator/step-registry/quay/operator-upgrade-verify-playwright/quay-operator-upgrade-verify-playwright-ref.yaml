ref:
  as: quay-operator-upgrade-verify-playwright
  cli: latest
  from: quay-playwright-runner
  commands: quay-operator-upgrade-verify-playwright-commands.sh
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
  timeout: 2h0m0s
  grace_period: 15m0s
  credentials:
  - collection: quay-tests
    group: quay
    mount_path: /var/run/quay-qe-quay-secret
  env:
  - name: PLAYWRIGHT_USE_IMAGE_TESTS
    default: "false"
    documentation: |-
      When "true", skip cloning PLAYWRIGHT_GIT_REPO and run the Playwright
      suite baked into the quay-playwright-runner image at /app. When
      "false" (default) the suite is cloned at runtime as before.
  - name: PLAYWRIGHT_GIT_REPO
    default: ""
    documentation: |-
      Git repository the Playwright suite is cloned from. Empty by default;
      the caller must set this explicitly in the ci-operator config whenever
      PLAYWRIGHT_USE_IMAGE_TESTS is "false", since the tests must be
      deliberately version-matched to the deployed Quay image. Not needed
      when PLAYWRIGHT_USE_IMAGE_TESTS is "true".
  - name: PLAYWRIGHT_GIT_BRANCH
    default: ""
    documentation: |-
      Optional explicit git ref (branch, tag, or commit SHA) for the Playwright
      tests. When set it overrides everything else, and the step fails if it
      cannot be cloned. When empty (the default), the step clones the upstream
      commit recorded in the deployed quay-app image's labels
      (io.openshift.build.commit.id, then vcs-ref, then
      org.opencontainers.image.revision; the first fetchable from
      PLAYWRIGHT_GIT_REPO wins). When none is fetchable, PLAYWRIGHT_REF_MODE
      decides what happens.
  - name: PLAYWRIGHT_PHASE
    default: ""
    documentation: |-
      Optional version-control mode for a composed upgrade workflow. "n-minus-one"
      consumes PLAYWRIGHT_N_MINUS_ONE_* controls and "n" consumes PLAYWRIGHT_N_*
      controls. Empty retains the normal PLAYWRIGHT_GIT_* behavior.
  - name: PLAYWRIGHT_N_MINUS_ONE_GIT_REPO
    default: ""
    documentation: Repository for the n-1 Playwright suite when PLAYWRIGHT_PHASE=n-minus-one. Defaults to PLAYWRIGHT_GIT_REPO when unset.
  - name: PLAYWRIGHT_N_MINUS_ONE_GIT_BRANCH
    default: ""
    documentation: Explicit branch, tag, or commit SHA for the n-1 Playwright suite.
  - name: PLAYWRIGHT_N_MINUS_ONE_USE_IMAGE_TESTS
    default: "false"
    documentation: Use the runner-image suite for the n-1 phase instead of its explicit Git controls.
  - name: PLAYWRIGHT_N_GIT_REPO
    default: ""
    documentation: Repository for the target n Playwright suite when PLAYWRIGHT_PHASE=n. Defaults to PLAYWRIGHT_GIT_REPO when unset.
  - name: PLAYWRIGHT_N_GIT_BRANCH
    default: ""
    documentation: Explicit branch, tag, or commit SHA for the target n Playwright suite.
  - name: PLAYWRIGHT_N_USE_IMAGE_TESTS
    default: "false"
    documentation: Use the runner-image suite for the target n phase instead of its explicit Git controls.
  - name: PLAYWRIGHT_GIT_FALLBACK_BRANCH
    default: "redhat-3.18"
    documentation: |-
      Last-resort branch in PLAYWRIGHT_REF_MODE "derived", cloned when the
      image yields no usable version label or its derived ref cannot be
      fetched from PLAYWRIGHT_GIT_REPO. Unused in "strict".
  - name: PLAYWRIGHT_REQUIRE_EXPLICIT_REF
    default: "false"
    documentation: |-
      When "true", fail unless PLAYWRIGHT_GIT_REPO and PLAYWRIGHT_GIT_BRANCH
      are both explicitly set (unless PLAYWRIGHT_USE_IMAGE_TESTS is "true").
      This lets an upgrade job pin each phase to the intended product version
      rather than use a derived or fallback branch.
  - name: PLAYWRIGHT_ARTIFACT_SUBDIR
    default: ""
    documentation: |-
      Optional child directory under ARTIFACT_DIR for this invocation's
      Playwright artifacts. Use distinct values when this ref runs in multiple
      phases of one job.
  - name: PLAYWRIGHT_STEP_NAME
    default: quay-operator-upgrade-verify-playwright
    documentation: |-
      Name of this registry step, used only to compose the GCS URL in the
      custom-link-playwright-report.html surfaced by Prow's html lens. Must match
      this ref's `as:` so the "Playwright HTML report" link resolves to this
      phase's own report rather than a sibling phase's.
  - name: PLAYWRIGHT_GREP
    default: ""
    documentation: |-
      Optional positive regex passed to `playwright test --grep`. Unlike
      PLAYWRIGHT_GREP_INVERT, this selects tests for a tagged smoke phase.
  - name: PLAYWRIGHT_WORKERS
    default: "2"
    documentation: |-
      Playwright worker count passed to `playwright test --workers`. The suite's
      playwright.config.ts defaults to 4 in CI, but heavy @container pushes and
      @feature:BUILD_SUPPORT builds contend at that concurrency and time out
      flakily. Default is 2; raise via the job env (for example "4") when the
      cluster and Quay load can absorb more parallelism.
  - name: PLAYWRIGHT_SPYGLASS_TITLE
    default: "Quay e2e results"
    documentation: |-
      Title written into custom-link-quay-results.html when
      PLAYWRIGHT_WRITE_SPYGLASS_CARD is true. Unused when the upgrade-verify chain
      disables the per-phase Spyglass card.
  - name: PLAYWRIGHT_WRITE_SPYGLASS_CARD
    default: "true"
    documentation: |-
      When "true", write custom-link-quay-results.html for Prow's Spyglass html
      lens. The upgrade-verify chain sets this to "false" so only
      quay-operator-upgrade-report emits the single upgrade Spyglass card.
  - name: PLAYWRIGHT_MAX_FAILURES
    default: "0"
    documentation: |-
      Override Playwright's maxFailures for the verify phase. The quay/quay
      playwright.config.ts stops the run early after the first failure(s) in CI,
      which leaves the remaining @upgrade-verify assertions reported as "did not
      run" and hides which data did/did not survive the upgrade. "0" means no
      limit, so every verify assertion runs to completion and the full
      data-survival picture is reported in one run.
  - name: PLAYWRIGHT_BEST_EFFORT
    default: "true"
    documentation: |-
      Run this Playwright phase best-effort. The runner always publishes its JUnit
      and HTML report (via the EXIT trap), and a test failure does NOT fail the
      ci-operator step, so the sequential upgrade chain (seed -> upgrade -> verify
      -> functional) keeps running and every phase publishes its report. Per-test
      pass/fail lives in the aggregated JUnit, not the job status. This applies to
      the Playwright test phases only; non-test steps (operator install, storage
      install, the OLM upgrade, provisioning) still hard-fail and abort the job.
  - name: PLAYWRIGHT_EXPORT_BLOB
    default: "true"
    documentation: |-
      Emit a Playwright "blob" report and copy it to SHARED_DIR so the last
      Playwright phase (functional) can merge the seed, verify and functional
      blobs into a single combined Playwright HTML report inside its own pod
      (full-suite blobs are too large for SHARED_DIR's 1MiB Secret cap, so only
      these small subset-phase blobs travel through it).
  - name: UPGRADE_CLEAN
    default: "true"
    documentation: |-
      Gates the post-verify cleanup test authored in the quay/quay @upgrade-verify
      suite. After every verify assertion passes, that test deletes the organization
      and standalone DB user seeded on n-1 (via the superuser API) so the upgrade
      job leaves no residual state behind. Cleanup is opt-out: it runs for any value
      except "0", "false", or "no" (case-insensitive). Set one of those to keep the
      seeded fixtures for debugging; a failed verify assertion also skips cleanup.
  - name: PLAYWRIGHT_REF_MODE
    default: "derived"
    documentation: |-
      What to do when no image label commit is fetchable from
      PLAYWRIGHT_GIT_REPO. "strict" fails the step and never falls back to a
      branch; product nightlies set it so the suite always matches the image
      under test. "derived" (default) clones the upstream vX.Y.Z tag matching
      the image's version label, else branch redhat-X.Y, else
      PLAYWRIGHT_GIT_FALLBACK_BRANCH, with a warning.
  - name: QUAYNAMESPACE
    default: "quay"
    documentation: |-
      Namespace the QuayRegistry is deployed in. The runner uses it only to
      port-forward the in-cluster Jaeger query API and to gather virtual-builder
      diagnostics, so it must match the namespace used by the deploy step
      (quay-install-external-storage defaults to "quay").
  documentation: |-
    Execute the existing Quay Playwright e2e implementation as the uniquely named
    n verify invocation of an operator-upgrade workflow. The commands file is a
    symlink to quay-test-e2e-commands.sh, so behavior stays in one implementation.
    By default the suite is cloned at runtime from PLAYWRIGHT_GIT_REPO; set
    PLAYWRIGHT_USE_IMAGE_TESTS "true" to run the suite baked into the
    quay-playwright-runner image at /app instead.
    When quay-deploy-jaeger ran successfully (${SHARED_DIR}/jaeger_deployed
    exists), this step port-forwards the in-cluster Jaeger query API and exports
    JAEGER_QUERY_URL=http://127.0.0.1:16686 so the suite can attach the server
    spans for a failed test's own requests. The forward is supervised for the
    length of the run and torn down on exit. If Jaeger was not deployed or the
    query API never answers, JAEGER_QUERY_URL is left unset and the suite
    records the spans as not collected rather than failing.
