ref:
  as: quay-deploy-custom-image
  cli: latest
  from_image:
    name: quay-deploy-tools
    namespace: ci
    tag: latest
  commands: quay-deploy-custom-image-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  timeout: 30m0s
  dependencies:
  - name: "pipeline:quay-server"
    env: QUAY_CI_IMAGE
  documentation: |-
    Swap the deployed Quay image with a CI-built custom image.
    Scales down the operator to prevent reconciliation, patches the
    quay-app deployment, and waits for rollout.
  env:
  - name: QUAY_STARTUP_PROBE_FAILURE_THRESHOLD
    documentation: |-
      failureThreshold for the patched quay-app startupProbe. The operator
      default of 10 (with a 15s period) gives ~150s, which the CI-built image's
      app imports can exceed; 20 doubles the budget to ~300s.
    default: "20"
