ref:
  as: quay-disable-dcm
  commands: quay-disable-dcm-commands.sh
  from: cli
  documentation: |-
    Disables the IngressControllerDynamicConfigurationManager feature gate by
    injecting a FeatureGate manifest into $SHARED_DIR. Used to test whether
    DCM is the root cause of intermittent DNS resolution failures on OCP 5.0.
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
