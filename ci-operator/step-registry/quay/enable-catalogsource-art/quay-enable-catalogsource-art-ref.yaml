ref:
  as: quay-enable-catalogsource-art
  cli: latest
  from_image:
    name: quay-test-omr
    namespace: ci
    tag: latest
  commands: quay-enable-catalogsource-art-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Install the Quay operator CatalogSource from an ART-built FBC image
    (quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc). The art-fbc repo is
    public and all component images inside the FBC reference registry.redhat.io
    (production) with digest pullspecs, so no pull-secret merge, ICSP/IDMS mirrors,
    or MachineConfigPool rollout wait are needed.
  env:
  - name: MULTISTAGE_PARAM_OVERRIDE_QUAY_INDEX_IMAGE
    default: ""
    documentation: |-
      Optional explicit override for the ART FBC index image. When set
      (e.g. a specific "…@sha256:…" digest) it is used verbatim, letting a run be
      hard-pinned to a known ART build. ART FBCs are distinguished by digest, so
      prefer this for reproducible pins. When empty (the default), the step
      resolves QUAY_INDEX_IMAGE_REPO:QUAY_INDEX_IMAGE_TAG to an immutable digest.
  - name: QUAY_INDEX_IMAGE_REPO
    default: "quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc"
    documentation: |-
      ART FBC catalog index image repository (no tag). Combined with
      QUAY_INDEX_IMAGE_TAG and resolved to a pinned @sha256 digest at runtime
      unless MULTISTAGE_PARAM_OVERRIDE_QUAY_INDEX_IMAGE is set.
  - name: QUAY_INDEX_IMAGE_TAG
    default: "quay-3.18__v4.22__quay-rhel9-operator"
    documentation: |-
      Floating tag on QUAY_INDEX_IMAGE_REPO to resolve to a digest. ART FBC images
      use the tag naming convention <group>__v<ocp_version>__<component_name>
      (e.g. quay-3.18__v4.22__quay-rhel9-operator). The floating tag (i.e. without a
      trailing __g<sha> commit suffix) always points to the latest successful build,
      so each run picks up the newest FBC automatically. Note the shared art-fbc repo
      has NO ":latest" tag. Ignored when MULTISTAGE_PARAM_OVERRIDE_QUAY_INDEX_IMAGE
      is set.
  - name: QUAY_OPERATOR_SOURCE
    documentation: The Quay operator source, redhat-operators or fbc-operator-catalog
    default: "fbc-operator-catalog"
