ref:
  as: quay-test-e2e-legacy
  cli: latest
  from_image:
    name: quay-test-console
    namespace: ci
    tag: latest
  commands: quay-test-e2e-legacy-commands.sh
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
  timeout: 2h0m0s
  grace_period: 15m0s
  env:
  - name: QUAY_VERSION
    documentation: Quay X.Y under test, passed to the suite as CYPRESS_QUAY_VERSION.
  documentation: |-
    Run the quay-tests old-UI Cypress smoke spec
    (quay-frontend-tests/cypress/integration/smoke/SmokeTesting.js) against the
    Quay deployed by a quay-deploy-* step (${SHARED_DIR}/quayroute). JUnit,
    videos and screenshots go to ${ARTIFACT_DIR}. The step fails when Cypress
    fails or the JUnit output reports zero tests.
