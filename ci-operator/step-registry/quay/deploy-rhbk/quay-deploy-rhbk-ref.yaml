ref:
  as: quay-deploy-rhbk
  cli: latest
  from_image:
    name: quay-test-omr
    namespace: ci
    tag: latest
  commands: quay-deploy-rhbk-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  grace_period: 10m0s
  documentation: |-
    Deploy Red Hat build of Keycloak (RHBK) into the Quay namespace as Quay's OIDC
    provider. Installs the rhbk-operator from redhat-operators (reusing the
    namespace's OperatorGroup, else creating one named "quay" as deploy-aws-s3
    does), an ephemeral PostgreSQL 16 (emptyDir, random password kept in Secret
    rhbk-postgres and never printed), a Keycloak CR (k8s.keycloak.org/v2alpha1)
    behind an edge Route at rhbk-${QUAYNAMESPACE}.apps.<baseDomain>, and imports the
    "quay" realm vendored from quay/quay local-dev/keycloak/quay-realm-export.json
    (clients quay-ui, quay-obo, quay-unknown-aud; users admin_oidc, testuser_oidc,
    readonly_oidc) with quay-ui redirected to the Quay route.
    After the realm's discovery document answers with the expected issuer, writes
    ${SHARED_DIR}/quay-auth-config.yaml (AUTHENTICATION_TYPE OIDC and
    SOMEOIDC_LOGIN_CONFIG) for the deploy steps to merge into config.yaml,
    ${SHARED_DIR}/quay-auth-ca.crt (the router CA Quay must trust) and
    ${SHARED_DIR}/keycloak_host (https://<route host>). Stale copies are removed at
    start, so a failed run leaves none.
    FIPS: nothing here disables or works around FIPS; Keycloak runs with the
    operator's defaults on FIPS-enabled clusters.
  env:
  - name: QUAYNAMESPACE
    default: "quay-enterprise"
    documentation: Namespace where Quay (and RHBK) are deployed.
  - name: RHBK_OPERATOR_CHANNEL
    default: ""
    documentation: |-
      rhbk-operator subscription channel. Empty uses the packagemanifest's
      defaultChannel from redhat-operators.
  - name: RHBK_POSTGRES_IMAGE
    default: "registry.redhat.io/rhel9/postgresql-16:latest"
    documentation: PostgreSQL image backing Keycloak.
