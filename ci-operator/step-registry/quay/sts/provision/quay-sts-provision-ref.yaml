ref:
  as: quay-sts-provision
  from: quay-sts-tools
  cli: latest
  commands: quay-sts-provision-commands.sh
  timeout: 30m
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  env:
  - name: QUAY_STS_REGION
    default: ""
    documentation: Optional AWS region override; defaults to the ephemeral cluster's leased region.
  - name: QUAY_STS_PERMISSIONS_BOUNDARY
    default: ""
    documentation: Optional IAM policy ARN in the cluster account to use as the test role permissions boundary.
  documentation: Prepare isolated S3 and WebIdentity role resources for Quay STS on an ephemeral cluster.
