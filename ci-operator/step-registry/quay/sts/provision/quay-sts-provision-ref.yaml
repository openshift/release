ref:
  as: quay-sts-provision
  from: quay-sts-tools
  cli: latest
  commands: quay-sts-provision-commands.sh
  timeout: 30m
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  credentials:
  - collection: quay-qe
    group: cluster
    mount_path: /var/run/quay-qe-cluster
  - collection: quay-dev
    group: aws
    mount_path: /var/run/quay-dev-aws
  env:
  - name: QUAY_STS_REGION
    default: us-east-1
    documentation: AWS region for run-owned S3 resources; use the same value in setup and cleanup.
  - name: QUAY_STS_PERMISSIONS_BOUNDARY
    default: ""
    documentation: Optional DEV account IAM policy ARN required as the test role permissions boundary.
  documentation: Prepare isolated S3 and WebIdentity role resources for Quay STS on the shared QE cluster.
