ref:
  as: quay-sts-test
  from: src-oc
  cli: latest
  commands: quay-sts-test-commands.sh
  timeout: 2h
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  credentials:
  - collection: quay-qe
    group: cluster
    mount_path: /var/run/quay-qe-cluster
  env:
  - name: QUAY_STS_OPERATOR_DEPLOYMENT
    default: quay-operator-tng
    documentation: Namespace-scoped operator deployment installed by the calling QE job.
  documentation: Validate shared QE operator scope and run the operator source Chainsaw STS test.
