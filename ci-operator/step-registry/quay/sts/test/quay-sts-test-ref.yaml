ref:
  as: quay-sts-test
  from: src-oc
  cli: latest
  commands: quay-sts-test-commands.sh
  timeout: 2h
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
  env:
  - name: QUAY_STS_OPERATOR_NAMESPACE
    default: openshift-operators
    documentation: Namespace containing the PR-built Quay Operator deployment.
  - name: QUAY_STS_OPERATOR_DEPLOYMENT
    default: quay-operator-tng
    documentation: Operator deployment installed from the PR-built bundle.
  documentation: Validate the ephemeral-cluster operator and run the source Chainsaw STS test.
