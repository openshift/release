ref:
  as: quay-sts-install
  from: operator-sdk
  cli: latest
  commands: quay-sts-install-commands.sh
  timeout: 30m
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  dependencies:
  - name: quay
    env: OO_BUNDLE
  env:
  - name: QUAY_STS_OPERATOR_NAMESPACE
    default: openshift-operators
    documentation: Namespace where operator-sdk installs the PR-built Quay Operator bundle.
  - name: QUAY_STS_OPERATOR_DEPLOYMENT
    default: quay-operator-tng
    documentation: Deployment created by the Quay Operator bundle.
  documentation: Install the PR-built Quay Operator with the test role on an ephemeral STS cluster.
