ref:
  as: quay-sts-cleanup
  from: quay-sts-tools
  cli: latest
  commands: quay-sts-cleanup-commands.sh
  timeout: 30m
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  credentials:
  - collection: quay-qe
    group: cluster
    mount_path: /var/run/quay-qe-cluster
  - collection: quay-dev
    group: aws
    mount_path: /var/run/quay-dev-aws
  env:
  - name: QUAY_STS_REGION
    default: us-east-1
    documentation: AWS region for run-owned S3 resources; use the same value in setup and cleanup.
  documentation: Delete owned Quay STS resources after workload teardown; retain the shared cluster and OIDC provider.
