ref:
  as: quay-sts-install-art
  from_image:
    name: cli-jq
    namespace: ocp
    tag: latest
  cli: latest
  commands: quay-sts-install-art-commands.sh
  timeout: 45m
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  env:
  - name: QUAY_OPERATOR_CHANNEL
    default: stable-5.0
    documentation: Quay Operator channel in the ART FBC catalog.
  - name: QUAY_OPERATOR_SOURCE
    default: fbc-operator-catalog
    documentation: CatalogSource containing the ART-built Quay Operator.
  - name: QUAY_STS_OPERATOR_NAMESPACE
    default: openshift-operators
    documentation: Namespace where OLM installs the Quay Operator in AllNamespaces mode.
  - name: QUAY_STS_OPERATOR_DEPLOYMENT
    default: quay-operator-tng
    documentation: Deployment created by the Quay Operator CSV.
  documentation: Install the ART-built Quay Operator with the test role on an ephemeral STS cluster.
