ref:
  as: quay-pipeline-view
  from: cli
  commands: quay-pipeline-view-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 10Mi
  documentation: |-
    Writes custom-link-quay-pipeline.html, which Prow's html lens shows on the
    job page: a pipeline view of the run (setup, pre, test and post
    stages with timings), a failure summary, Quay health after the deploy step
    (START) and at quay-gather (FINAL), and links to the logs and artifacts.

    The step only writes a static page. The page renders in the browser at view
    time from this run's GCS artifacts (ci-operator-step-graph.json,
    ci-operator.log, junit_operator.xml, finished.json and the quay step
    artifacts), which do not exist yet while a post step runs. PatternFly is
    loaded from jsDelivr. Links are drawn only to artifacts present in the run.
