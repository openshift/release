ref:
  as: quay-operator-upgrade-verify-api
  from_image:
    name: quay-test-console
    namespace: ci
    tag: latest
  commands: quay-operator-upgrade-verify-api-commands.sh
  timeout: 30m
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Verifies after an operator upgrade that the data quay-operator-upgrade-seed-api
    created survived. Reads SHARED_DIR/quay-upgrade-seed and the robot token,
    signs in as the quay-create-admin-user admin, and requires the organization,
    repository and robot to exist and the robot to keep its write role. As the
    robot, skopeo inspect must return the seeded digest and a pull copy must
    succeed. Any missing object or mismatch fails the step.
