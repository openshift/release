ref:
  as: quay-deploy-gcp-gcs
  cli: latest
  from_image:
    name: quay-test-console
    namespace: ci
    tag: latest
  commands: quay-deploy-gcp-gcs-commands.sh
  timeout: 8h0m0s
  grace_period: 10m
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: quay-tests
    group: gcp
    mount_path: /var/run/quay-qe-gcp-secret
  - collection: quay-tests
    group: quay
    mount_path: /var/run/quay-qe-quay-secret
  documentation: |-
    Provision a Google Cloud Storage bucket and deploy Quay Operator and Quay
    configured to use it as GoogleCloudStorage distributed storage. The GCS bucket
    name is written to ${SHARED_DIR}/QUAY_GCP_STORAGE_ID and the terraform state to
    ${SHARED_DIR}/terraform.tgz so the quay-deprovision step (QUAY_STORAGE_PROVIDER=gcp)
    can tear the bucket down. Also merges ${SHARED_DIR}/quay-mail-config.yaml and
    ${SHARED_DIR}/quay-otel-config.yaml into the config bundle when present
    (written by the mailpit and jaeger deploy steps); absent when those steps
    did not run or produced no fragment.
  env:
  - name: DR__RP__CR_COMP_NAME
    default: "lp-ocp-compat--Quay"
    documentation: ReportPortal Component Readiness component name for junit remapping
  - name: MAP_TESTS
    default: "false"
    documentation: Specify whether to update the test suite name for reporting tools
  - name: PLAYWRIGHT_GIT_REPO
    default: "https://github.com/quay/quay.git"
    documentation: |-
      Upstream repository the Playwright suite is cloned from by the test-e2e
      step. Read here only to resolve the deployed image's version label to a
      vX.Y.Z tag when deriving ${SHARED_DIR}/playwright_git_ref; nothing is
      cloned in this step.
  - name: QUAY_OPERATOR_CHANNEL
    documentation: The quay operator channel
    default: "stable-3.16"
  - name: QUAY_OPERATOR_SOURCE
    documentation: The quay operator source
    default: "redhat-operators"
  - name: QUAY_EXTRA_CONFIG
    documentation: |-
      Additional Quay configuration YAML merged on top of the default config.
      Values provided here override defaults. Supports flat keys and nested
      structures. Example: "FEATURE_QUOTA_MANAGEMENT: false"
    default: ""
  - name: ENABLE_BUILD_SUPPORT
    documentation: |-
      When "true", deploy Quay with virtual-builder build support: switch the
      QuayRegistry tls component to unmanaged, fold ${SHARED_DIR}/config_builder.yaml
      (FEATURE_BUILD_SUPPORT + BUILDMAN) into the config bundle, and include the
      unmanaged TLS cert/key and build-cluster CA in config-bundle-secret. Requires
      the quay-provisioning-tls and -builder steps to have run first
      (they produce ssl.cert, ssl.key, build_cluster.crt, config_builder.yaml in
      SHARED_DIR). When "false", Quay is deployed with managed TLS and no builder.
    default: "false"
