ref:
  as: quay-deprovision
  cli: latest
  from_image:
    name: quay-test-omr
    namespace: ci
    tag: latest
  commands: quay-deprovision-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: quay-tests
    group: omr
    mount_path: /var/run/quay-qe-omr-secret
  - collection: quay-tests
    group: gcp
    mount_path: /var/run/quay-qe-gcp-secret
  - collection: quay-tests
    group: aws
    mount_path: /var/run/quay-qe-aws-secret
  timeout: 2h0m0s
  env:
  - name: QUAY_STORAGE_PROVIDER
    documentation: The Quay Storage Provider "aws, gcp, azure"
    default: "aws"
  documentation: |-
    Deprovisioning Quay AWS GCP AZURE STORAGE BUCKETS