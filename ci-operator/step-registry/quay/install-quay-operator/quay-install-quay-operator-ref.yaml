ref:
  as: quay-install-quay-operator
  from: tools
  commands: quay-install-quay-operator-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: QUAY_OPERATOR_INDEX_IMAGE
    documentation: |-
      The image index reference with the package quay-operator. When set, the
      step creates its own CatalogSource from it and ignores
      QUAY_OPERATOR_SOURCE and QUAY_OPERATOR_SOURCE_NAMESPACE.
    default: ""
  - name: QUAY_OPERATOR_SOURCE
    documentation: |-
      CatalogSource the Subscription installs from, e.g. fbc-operator-catalog as
      created by quay-enable-catalogsource-art. Empty means redhat-operators.
    default: ""
  - name: QUAY_OPERATOR_SOURCE_NAMESPACE
    documentation: Namespace of the QUAY_OPERATOR_SOURCE CatalogSource.
    default: openshift-marketplace
  - name: QUAY_OPERATOR_CHANNEL
    documentation: |-
      Subscription channel, e.g. stable-3.18. Empty leaves spec.channel unset,
      so OLM uses the package's default channel.
    default: ""
  documentation: |-
    Install Quay Operator into openshift-operators, whose global OperatorGroup
    makes it watch all namespaces.
