ref:
  as: quay-omr-v2-prepare-pipeline
  from_image:
    namespace: ci
    name: tests-private-base
    tag: "4.22"
  commands: quay-omr-v2-prepare-pipeline-commands.sh
  dependencies:
  - name: "pipeline:mirror-registry"
    env: OMR_V2_IMAGE
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  timeout: 5m0s
  grace_period: 5m0s
  documentation: |-
    Publish the PR-built OMR v2 pipeline image pullspec for the later install
    step. Only the small pullspec crosses the step boundary; the installer
    archive is extracted and consumed within the install step.
