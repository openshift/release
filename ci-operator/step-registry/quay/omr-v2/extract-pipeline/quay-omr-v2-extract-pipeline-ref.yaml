ref:
  as: quay-omr-v2-extract-pipeline
  from_image:
    namespace: ci
    name: tests-private-base
    tag: "4.22"
  cli: latest
  commands: quay-omr-v2-extract-pipeline-commands.sh
  dependencies:
  - name: "pipeline:mirror-registry"
    env: OMR_V2_IMAGE
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
  timeout: 60m0s
  grace_period: 5m0s
  documentation: |-
    Extract and verify the offline installer archive from the PR-built
    quay/mirror-registry pipeline image for installation on the dedicated OMR
    v2 host.
