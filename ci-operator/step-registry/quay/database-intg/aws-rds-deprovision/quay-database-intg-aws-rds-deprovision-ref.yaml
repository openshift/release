ref:
  as: quay-database-intg-aws-rds-deprovision
  cli: latest
  from_image:
    name: quay-test-console
    namespace: ci
    tag: latest
  commands: quay-database-intg-aws-rds-deprovision-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: quay-tests
    group: aws
    mount_path: /var/run/quay-qe-aws-secret
  documentation: |-
    Deprovision the AWS RDS PostgreSQL database for Quay, including its VPC,
    subnets, internet gateway, security group, subnet group, and per-job
    parameter group. Does not touch the S3 bucket owned by quay-deploy-aws-s3.
    Uses credentials from the quay-tests/aws secret, the same account the
    provisioning step creates resources in.
