ref:
  as: quay-database-intg-aws-rds-deprovision
  cli: latest
  from_image:
    name: quay-test-console
    namespace: ci
    tag: latest
  commands: quay-database-intg-aws-rds-deprovision-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: quay-tests
    group: aws
    mount_path: /var/run/quay-qe-aws-secret
  documentation: |-
    Deprovision AWS RDS PostgreSQL database and S3 bucket for Quay.
    Cleans up all AWS resources created by the provisioning step.
