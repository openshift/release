ref:
  as: quay-database-intg-azure-postgres-deprovision
  cli: latest
  from_image:
    name: quay-test-console
    namespace: ci
    tag: latest
  commands: quay-database-intg-azure-postgres-deprovision-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Deprovision Azure Database for PostgreSQL Flexible Server for Quay.
    Runs terraform destroy and falls back to az group delete if destroy fails.
    Uses credentials from cluster profile to access same Azure account as provisioning step.
