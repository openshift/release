ref:
  as: quay-database-intg-azure-postgres-deprovision
  cli: latest
  from_image:
    name: quay-test-console
    namespace: ci
    tag: latest
  commands: quay-database-intg-azure-postgres-deprovision-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Deprovision Azure Database for PostgreSQL Flexible Server for Quay.
    Runs terraform destroy from the archived DB Terraform state. If the archive
    is missing, it imports the server by its SHARED_DIR identifiers and destroys
    it. It never deletes the cluster resource group; the installer's resource
    group deletion is the cleanup backstop.
    Uses credentials from cluster profile to access same Azure account as provisioning step.
