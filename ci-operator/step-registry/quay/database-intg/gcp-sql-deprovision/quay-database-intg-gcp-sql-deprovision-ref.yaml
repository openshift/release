ref:
  as: quay-database-intg-gcp-sql-deprovision
  cli: latest
  from_image:
    name: quay-test-console
    namespace: ci
    tag: latest
  commands: quay-database-intg-gcp-sql-deprovision-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: quay-tests
    group: gcp
    mount_path: /var/run/quay-qe-gcp-secret
  documentation: |-
    Deprovision Google Cloud SQL PostgreSQL database for Quay.
    Cleans up all GCP resources created by the provisioning step.
