ref:
  as: redhat-performance-backstage-performance-scalability
  best_effort: true
  grace_period: 300s
  cli: latest
  timeout: 24h0m0s
  commands: redhat-performance-backstage-performance-scalability-commands.sh
  credentials:
    - mount_path: /usr/local/ci-secrets/backstage-performance
      group: backstage-performance
      collection: backstage-performance
  env:
    - name: SCENARIO
      default: "search-catalog"
      documentation: Load test scenario to execute
    - name: DURATION
      default: "5m"
      documentation: Stop each load test iteration after the specified amount of time, e.g. (300s, 20m, 3h, 1h30m, etc.)
    - name: USE_PR_BRANCH
      default: "false"
      documentation: Use PR branch instead of 'main'
    - name: PRE_LOAD_DB
      default: "true"
      documentation: Pre-load RHDH with users and data
    - name: RHDH_NODEJS_MAX_HEAP_SIZE
      default: ""
      documentation: Maximum heap size for RHDH's Node.js process
    - name: LDAP_SCHEDULE_TIMEOUT_MINUTES
      default: "50"
      documentation: LDAP schedule timeout in minutes
    - name: WAIT_FOR_SEARCH_INDEX
      default: "false"
      documentation: Wait for search indexing to finish after setup and each pre-load of DB
    - name: PERFORM_REGRESSION
      default: "false"
      documentation: If enabled, the latest RHDH opensearch run results will be compared against historical results to detect performance regressions.
    - name: ENABLE_ORCHESTRATOR
      default: "false"
      documentation: Enable Orchestrator plugin infra in RHDH
    - name: ENABLE_RBAC
      default: "true"
      documentation: Enable RBAC plugin in RHDH
    - name: RBAC_POLICY
      default: "all_groups_admin_inherited"
      documentation: Define the RBAC policy configuration in RHDH
    - name: RHDH_NODEJS_MAX_HEAP_SIZE
      default: ""
      documentation: Maximum heap size for RHDH's Node.js process
    - name: ENSURE_CATALOG_POPULATION_TIMEOUT
      default: "3600"
      documentation: Ensure catalog population timeout in seconds
    - name: RHDH_RESOURCES_EPHEMERAL_STORAGE_LIMITS
      default: "5Gi"
      documentation: Ephemeral storage limits set on RHDH pod(s) (default is 5Gi)
    - name: CATALOG_REFRESH_INTERVAL_MINUTES
      default: "50"
      documentation: Catalog refresh interval in minutes
    - name: RHDH_STARTUP_TIMEOUT_SECONDS
      default: ""
      documentation: RHDH startup timeout in seconds
    - name: UPLOAD_TO_OPENSEARCH
      default: "false"
      documentation: Upload results to OpenSearch
    - name: OPENSEARCH_INDEX
      default: "rhdh-performance.ci-default"
      documentation: OpenSearch index to upload results to (default is rhdh-performance.ci-default)
    - name: LOCUST_WORKER_MEMORY_LIMIT
      default: "2Gi"
      documentation: "Memory limit set on Locust worker Pods (default is 2Gi)"
    - name: SCALE_WORKERS
      default: "5"
      documentation: |-
        Scale values of number of Locust workers.
        (List of integers separated by space character)
        Example: '1 5 10 50 100'
    - name: SCALE_ACTIVE_USERS_SPAWN_RATES
      default: "1:1 200:40"
      documentation: |-
        Scale values of concurrent active users and their spawn rates.
        (List of integer tuples ('active_users:spawn_rate') separated by space character)
        Example: '100:5 500:10'
    - name: SCALE_BS_USERS_GROUPS
      default: "1:1 15000:5000"
      documentation: |-
        Scale values of pasive users and number of user groups.
        (List of integer tuples ('users:groups') separated by space character)
        Example: '1:1 500:250'
    - name: SCALE_CATALOG_SIZES
      default: "1 5000 25000"
      documentation: |-
        Scale values of catalog size (number of each component and api entities).
        (List of integers separated by space)
        NOTE: the given number of components and api entities is created os overall number of entities is double that number.
        Example: '1 5000 25000'
    - name: SCALE_REPLICAS
      default: "1:1"
      documentation: |-
        Scale values of RHDH and RHDH_DB replicas count.
        (List of integer tuples ('scale_replicas:db_replicas') separated by space character)
        Example: '1:1 3:1 1:3 3:3'
    - name: SCALE_DB_STORAGES
      default: "1Gi 2Gi"
      documentation: |-
        Scale values of the RHDH DB storage size.
        (List of values separated by space)
        Example: '1Gi 2Gi'
    - name: SCALE_CPU_REQUESTS_LIMITS
      default: ":" #unlimited
      documentation: |-
        Scale values of RHDH CPU requests and limits.
        (List of integer tuples ('requests:limits') separated by space character)
        Example: '256m:512m :'
    - name: SCALE_MEMORY_REQUESTS_LIMITS
      default: ":" #unlimited
      documentation: |-
        Scale values of RHDH memory requests and limits.
        (List of integer tuples ('requests:limits') separated by space character)
        Example: '128Mi:1Gi :'
    - name: SCALE_PAGE_N_CATALOG_TAB_N_COUNTS
      default: "0:0"
      documentation: |-
        Scale values of number of dynamic plugins to be installed to RHDH for UI.
        (List of integer tuples ('page_n:catalog_tab_n') separated by space character)
        Example: '1:1 100:100'
  from: backstage-performance-runner
  resources:
    requests:
      cpu: 3000m
      memory: 4Gi
