workflow:
  as: kubernetes-nmstate-e2e-handler-gcp-disconnected
  steps:
    env:
      SKIP_IMAGE_BUILD: "true"
      IMAGE_BUILDER: podman
      HANDLER_NAMESPACE: openshift-nmstate
      OPERATOR_NAMESPACE: openshift-nmstate
    pre:
    - chain: ipi-gcp-pre-disconnected
    test:
    - ref: kubernetes-nmstate-e2e-handler-cloud
    post:
    - ref: gather-mirror-registry
    - chain: gather-network
    - chain: ipi-deprovision
    - ref: gcp-deprovision-bastionhost
    - ref: gcp-deprovision-vpc
  documentation: |-
    Provision a disconnected OpenShift cluster on GCP (IPv4 only - GCP has no dual-stack
    support), mirror the kubernetes-nmstate handler and operator images into the bastion
    registry (via MIRROR_CUSTOM_IMAGES on mirror-images-custom, inside
    ipi-gcp-pre-disconnected), and run the handler e2e tests.
