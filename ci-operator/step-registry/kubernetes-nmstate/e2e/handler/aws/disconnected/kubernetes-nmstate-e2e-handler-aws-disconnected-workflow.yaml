workflow:
  as: kubernetes-nmstate-e2e-handler-aws-disconnected
  steps:
    env:
      SKIP_IMAGE_BUILD: "true"
      IMAGE_BUILDER: podman
      HANDLER_NAMESPACE: openshift-nmstate
      OPERATOR_NAMESPACE: openshift-nmstate
    pre:
    - chain: ipi-aws-pre-disconnected
    test:
    - ref: kubernetes-nmstate-e2e-handler
    post:
    - chain: ipi-aws-post-disconnected
  documentation: |-
    Provision a disconnected OpenShift cluster on AWS, mirror the kubernetes-nmstate
    handler and operator images into the bastion registry (via MIRROR_CUSTOM_IMAGES on
    mirror-images-custom, inside ipi-aws-pre-disconnected), and run the handler e2e tests.
    Set IP_FAMILY=DualStackIPv6Primary in the test to exercise the disconnected IPv6 path.
