ref:
  as: azure-validate-capacity-reservation
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  grace_period: 1m0s
  timeout: 10m0s
  commands: azure-validate-capacity-reservation-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: EXPECTED_CONTROL_PLANE_VM_COUNT
    default: "3"
    documentation: |-
      The number of installed control-plane VMs that must be associated with
      the control-plane capacity reservation.
  - name: EXPECTED_COMPUTE_VM_COUNT
    default: "3"
    documentation: |-
      The number of installed compute VMs that must be associated with the
      compute capacity reservation.
  documentation: |-
    Validates that installed control-plane and compute VM resource IDs exactly
    match the associations reported by their Azure capacity reservations.
