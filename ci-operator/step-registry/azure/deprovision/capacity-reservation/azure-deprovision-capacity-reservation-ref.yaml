ref:
  as: azure-deprovision-capacity-reservation
  from_image:
    namespace: ocp
    name: "4.18"
    tag: upi-installer
  best_effort: true
  timeout: 20m0s
  commands: azure-deprovision-capacity-reservation-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Deletes the resource group containing the Capacity Reservation Group
    and Capacity Reservation created by azure-provision-capacity-reservation.
    Must run after cluster teardown since VMs reference the CRG.
