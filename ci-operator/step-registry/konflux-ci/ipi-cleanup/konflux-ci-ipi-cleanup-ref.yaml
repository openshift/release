ref:
  best_effort: true
  as: konflux-ci-ipi-cleanup
  cli: latest
  commands: konflux-ci-ipi-cleanup-commands.sh
  timeout: 1h
  grace_period: 60s
  credentials:
  - mount_path: /usr/local/ci-secrets/konflux-devprod-rosa-credentials
    group: konflux-devprod-rosa-credentials
    collection: redhat-appstudio-qe
  from_image:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
  resources:
    requests:
      cpu: 100m 
