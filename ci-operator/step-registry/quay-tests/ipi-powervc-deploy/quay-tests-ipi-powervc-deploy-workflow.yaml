workflow:
  as: quay-tests-ipi-powervc-deploy
  steps:
    pre:
    - chain: ipi-powervc-pre
    post:
    - chain: ipi-powervc-post
  documentation: |-
    Provisions and deprovisions an OpenShift cluster on IBM Cloud in a PowerVC
    environment using IPI, without running any test steps.

    This workflow is intended for Quay job authors who inject their own test
    logic via the job's test: chain in the ci-operator config.

    All modifications to cluster lifecycle behaviour should be made in the
    `ipi-powervc-{pre,post}` chains so that other workflows can extend this
    base without backporting changes here.
