ref:
  as: quay-tests-quay-interop-test
  cli: latest
  from_image:
    name: quay-newui-test 
    namespace: ci
    tag: latest
  commands: quay-tests-quay-interop-test-commands.sh
  resources:
        requests:
          cpu: "2"
          memory: 4Gi
  timeout: 1h0m0s
  grace_period: 15m0s
  documentation: |-
    Execute QUAY Interop Testing
  env:
    - name: DR__RP__CR_COMP_NAME
      default: "lp-interop--Quay"
      documentation: Component Readiness component name for junit remapping
    - name: MAP_TESTS
      default: "false"
      documentation: When true, remap junit test suite names for Component Readiness routing
    - name: QUAY_VERSION
      documentation: Quay version
      default: "3.17"

