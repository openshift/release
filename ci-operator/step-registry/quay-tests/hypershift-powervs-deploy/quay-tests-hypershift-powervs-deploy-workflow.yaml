workflow:
  as: quay-tests-hypershift-powervs-deploy
  documentation: |-
    The quay-tests-hypershift-powervs-deploy workflow deploys a new ephemeral
    HyperShift Agent cluster on Power (ppc64le) nodes using the agent-based (MCE) method.
    Administrative access to the control plane is provided via the `KUBECONFIG` environment variable.

    The management cluster is provisioned on AWS via IPI, MCE is installed and configured,
    and a HyperShift hosted cluster is created on Power nodes. The cluster is destroyed after
    tests complete.

    Learn more about HyperShift here: https://github.com/openshift/hypershift

    Track HyperShift's development here: https://issues.redhat.com/projects/HOSTEDCP
  steps:
    pre:
      - ref: ingress-aws-nlb-manifest
      - chain: ipi-aws-pre
      - ref: hypershift-mce-install
      - ref: hypershift-mce-conf-os-images
      - chain: hypershift-mce-power-create
    post:
      - ref: hypershift-mce-dump
      - ref: hypershift-mce-power-destroy
      - chain: ipi-aws-post
    env:
      HYPERSHIFT_NODE_COUNT: 2
      CLUSTERS_NAMESPACE: "local-cluster"
      IS_HETEROGENEOUS: "no"
      ADDITIONAL_HYPERSHIFT_NODEPOOL_CONFIG: |
        NAME_SUFFIX=power, CPU_ARCH=ppc64le, NODE_ARCH=ppc64le
