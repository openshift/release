ref:
  as: quay-tests-stagequayio
  cli: latest
  from_image:
    name: quay-test-console
    namespace: ci
    tag: latest
  commands: quay-tests-stagequayio-commands.sh
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
  timeout: 8h0m0s
  grace_period: 4h0m0s
  credentials:
  - collection: quay-tests
    group: stagequayio
    mount_path: /var/run/quay-qe-stagequayio-secret
  - collection: quay-tests
    group: dockerio
    mount_path: /var/run/quay-qe-dockerio-secret
  documentation: |-
    Execute Stage.Quay.IO Validation testing
