ref:
  as: opct-pre-setup
  from: cli
  credentials:
  - namespace: test-credentials
    bundle: registry-pull-credentials
    mount_path: /var/run/ci-credentials/registry
  commands: opct-pre-setup-commands.sh
  timeout: 20m
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: OPCT_RUN_MODE
    default: ""
    documentation: OPCT workflow execution mode. Supported values [|upgrade].
  - name: UPGRADE_TO_CHANNEL_TYPE
    default: stable
    documentation: >-
      Target OCP channel when executing OPCT upgrade workflow.
      Supported values [stable,candidate,fast]
  - name: UPGRADE_TO_VERSION
    default: ""
    documentation: >-
      Explicit target OCP version (x.y) for the OPCT upgrade workflow.
      When set, overrides the default same-major next-minor calculation.
      Required when the upgrade target crosses a major version boundary
      (e.g. 4.22 to 5.0).
  - name: OPCT_CLI_IMAGE
    default: "quay-proxy.ci.openshift.org/openshift/ci:ci_opct_latest"
    documentation: Override the OPCT CLI image used in the validation environment.
  documentation: >-
    This step collect required dependencies to run OPCT on the target cluster.
