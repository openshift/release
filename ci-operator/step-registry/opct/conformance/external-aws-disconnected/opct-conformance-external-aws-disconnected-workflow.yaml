workflow:
  as: opct-conformance-external-aws-disconnected
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: opct-pre-init
    - chain: platform-external-cluster-aws-pre-disconnected
    - as: opct-mirror-images
      from: cli
      credentials:
      - collection: openshift-qe
        group: mirror-registry
        mount_path: /var/run/vault/mirror-registry
      commands: |-
        set -euo pipefail
        source "${SHARED_DIR}/env" || true

        if [[ ! -f "${SHARED_DIR}/mirror_registry_url" ]]; then
          echo "ERROR: mirror_registry_url not found, cannot mirror OPCT images"
          exit 1
        fi
        MIRROR_REGISTRY_HOST=$(head -n1 "${SHARED_DIR}/mirror_registry_url")

        # Build pull-secret with bastion mirror registry credentials merged in.
        # The mirror-images-payload step creates new_pull_secret but deletes it
        # after use, so we rebuild it from the vault credentials.
        # The cli image has no jq, so use sed to inject the auth entry.
        new_pull_secret=$(mktemp)
        cp "${CLUSTER_PROFILE_DIR}/pull-secret" "${new_pull_secret}"
        registry_cred=$(head -n 1 "/var/run/vault/mirror-registry/registry_creds" | base64 -w 0)
        sed -i "s|\"auths\":{|\"auths\":{\"${MIRROR_REGISTRY_HOST}\":{\"auth\":\"${registry_cred}\"},|" "${new_pull_secret}"

        # Mirror OPCT images to the bastion registry so pods inside the
        # disconnected cluster can pull them. The sonobuoy image is mirrored
        # with the versioned tag (v0.57.3, pinned by the OPCT build's
        # sonobuoy library): `opct run --image-repository` rewrites the
        # sonobuoy pod image to <repo>/sonobuoy:<version>, not :latest.
        # The :latest sonobuoy tag does not exist upstream and is skipped.
        OPCT_IMAGES=(
          "quay.io/opct/sonobuoy:v0.57.3"
          "quay.io/opct/plugin-artifacts-collector:latest"
          "quay.io/opct/must-gather-monitoring:latest"
        )
        for img in "${OPCT_IMAGES[@]}"; do
          target="${MIRROR_REGISTRY_HOST}/${img#*/}"
          echo "Mirroring ${img} -> ${target}"
          oc image mirror "${img}" "${target}" \
            --registry-config="${new_pull_secret}" \
            --insecure=true || echo "WARN: failed to mirror ${img}"
        done

        # Mirror custom plugin image (pr-102 build) to the opct/ path.
        # Also mirror the :latest tag: `opct run --image-repository`
        # rewrites the plugin image to <repo>/plugin-openshift-tests:latest
        # (the --plugins-image flag value is currently clobbered by the
        # rewrite), so both tags must exist in the mirror.
        PLUGIN_SRC="quay.io/rhn-support-bshaw/plugin-openshift-tests:v0.0.4-opct512"
        PLUGIN_DST="${MIRROR_REGISTRY_HOST}/opct/plugin-openshift-tests:v0.0.4-opct512"
        echo "Mirroring custom plugin ${PLUGIN_SRC} -> ${PLUGIN_DST}"
        oc image mirror "${PLUGIN_SRC}" "${PLUGIN_DST}" \
          --registry-config="${new_pull_secret}" \
          --insecure=true
        oc image mirror "${PLUGIN_SRC}" "${MIRROR_REGISTRY_HOST}/opct/plugin-openshift-tests:latest" \
          --registry-config="${new_pull_secret}" \
          --insecure=true

        # Mirror the custom OPCT build. The dedicated-e2e-controller
        # deployment pulls <image-repository>/opct:<cli-version> (not
        # quay.io) since the v0.0.2-opct512 controller-image fix, and
        # --image-repository is passed as <mirror>/opct, so the mirror
        # path is nested: <mirror>/opct/opct:<cli-version>.
        OPCT_SRC="quay.io/rhn-support-bshaw/opct:v0.0.2-opct512"
        OPCT_DST="${MIRROR_REGISTRY_HOST}/opct/opct:v0.0.2-opct512"
        echo "Mirroring custom OPCT ${OPCT_SRC} -> ${OPCT_DST}"
        oc image mirror "${OPCT_SRC}" "${OPCT_DST}" \
          --registry-config="${new_pull_secret}" \
          --insecure=true

        # Persist the merged pull secret (cluster pull-secret + mirror
        # registry credentials) so the opct-disconnected-run step can
        # authenticate against the mirror registry for its preflight
        # image accessibility checks. Removed by that step after use.
        cp "${new_pull_secret}" "${SHARED_DIR}/opct-pull-secret"

        # Inject proxy-conf and mirror registry into the OPCT env script
        cat >> "${SHARED_DIR}/env" <<'ENVEOF'

        # Proxy configuration for disconnected environment
        if [[ -f "${SHARED_DIR}/proxy-conf.sh" ]]; then
          source "${SHARED_DIR}/proxy-conf.sh"
        fi
        ENVEOF
        echo "export OPCT_MIRROR_REGISTRY=${MIRROR_REGISTRY_HOST}" >> "${SHARED_DIR}/env"
        cp "${SHARED_DIR}/env" "${ARTIFACT_DIR}/env-disconnected"
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 30m0s
    - chain: opct-pre
    test:
    - as: opct-disconnected-run
      from: cli
      credentials:
      - namespace: test-credentials
        bundle: registry-pull-credentials
        mount_path: /var/run/ci-credentials/registry
      commands: |-
        set -o nounset
        set -o errexit
        set -o pipefail

        # shellcheck source=/dev/null
        source "${SHARED_DIR}/env"
        extract_opct

        # Trust the bastion mirror registry's self-signed CA so preflight
        # image accessibility checks (oc image info) succeed. The step
        # container is unprivileged (non-root), so the CA cannot be
        # installed into /etc/pki; combine it with the system bundle and
        # point Go tools (oc, opct) at it via SSL_CERT_FILE instead.
        # In-cluster consumers are already covered by the
        # mirror-images-trust-registry-ca step (image.config
        # additionalTrustedCA + nodes' trust bundle).
        if [[ -f "${SHARED_DIR}/additional_trust_bundle" ]]; then
          mkdir -p /tmp/pki
          cat /etc/pki/tls/certs/ca-bundle.crt "${SHARED_DIR}/additional_trust_bundle" > /tmp/pki/ca-bundle.crt
          export SSL_CERT_FILE=/tmp/pki/ca-bundle.crt
        fi

        # Authenticate against the bastion mirror registry with the
        # merged pull secret persisted by the opct-mirror-images step.
        # Go registry clients (oc image, opct) honor DOCKER_CONFIG.
        if [[ -f "${SHARED_DIR}/opct-pull-secret" ]]; then
          export DOCKER_CONFIG=/tmp/opct-docker
          mkdir -p "${DOCKER_CONFIG}"
          cp "${SHARED_DIR}/opct-pull-secret" "${DOCKER_CONFIG}/config.json"
        else
          echo "WARN: ${SHARED_DIR}/opct-pull-secret not found, preflight may fail to authenticate to the mirror registry"
        fi

        # Shadow the shared dump_opct_namespace helper with a bounded
        # version: on a disconnected cluster the API is reachable only
        # through the bastion proxy, and an unbounded `oc adm inspect`
        # can hang for hours after an early failure.
        dump_opct_namespace() {
          rc=$?
          rm -f "${SHARED_DIR}/opct-pull-secret" || true
          if [[ $rc -ne 0 ]]; then
            show_msg "Dumping namespace (bounded to 5m)"
            timeout 300 oc adm inspect ns/opct --dest-dir=/tmp/opct-inspect || true
            tar cfz "${ARTIFACT_DIR}/oc-inspect-opct.tar.gz" /tmp/opct-inspect || true
          fi
          show_msg "Done with code=$rc"
          exit $rc
        }
        trap dump_opct_namespace EXIT TERM INT

        MIRROR_REPO="${OPCT_MIRROR_REGISTRY}/opct"
        echo "Running OPCT with disconnected workflow on External platform"
        echo "  image-repository: ${MIRROR_REPO}"
        ${OPCT_CLI} run \
            --watch \
            --workflow=disconnected \
            --image-repository="${MIRROR_REPO}" \
            --plugins-image="${MIRROR_REPO}/plugin-openshift-tests:v0.0.4-opct512" \
            --validation-timeout=900 \
            --validation-retry-interval=30
      timeout: 6h
      grace_period: 6h
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
    post:
    - chain: gather
    - chain: opct-post
    - chain: platform-external-cluster-aws-post-disconnected
    dependencies:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: "release:initial"
      OPENSHIFT_UPGRADE_RELEASE_IMAGE_OVERRIDE: "release:latest"
    env:
      PROVIDER_NAME: aws
      PLATFORM_EXTERNAL_CCM_ENABLED: "no"
      DISCONNECTED_INSTALL: "yes"
      MIRROR_IN_BASTION: "yes"
      QE_IMAGES: "false"
      ZONES_COUNT: "2"
      OPCT_CLI_IMAGE: "quay.io/rhn-support-bshaw/opct:v0.0.2-opct512"
  documentation: |-
    The OPCT Conformance External AWS Disconnected workflow provisions a
    disconnected AWS cluster with platform type External (using the
    platform-external disconnected CI steps), mirrors OPCT images to
    the bastion registry, then runs OPCT with --workflow=disconnected
    to validate that tests tagged [Skipped:Disconnected] are excluded
    and conformance passes on an offline cluster.
