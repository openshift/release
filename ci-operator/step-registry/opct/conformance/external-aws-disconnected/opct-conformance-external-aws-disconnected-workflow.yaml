workflow:
  as: opct-conformance-external-aws-disconnected
  steps:
    allow_best_effort_post_steps: true
    pre:
    - chain: opct-pre-init
    - chain: platform-external-cluster-aws-pre-disconnected
    - as: opct-mirror-images
      from: cli
      credentials:
      - namespace: test-credentials
        bundle: registry-pull-credentials
        mount_path: /var/run/ci-credentials/registry
      commands: |-
        set -euo pipefail
        source "${SHARED_DIR}/env" || true

        if [[ ! -f "${SHARED_DIR}/mirror_registry_url" ]]; then
          echo "ERROR: mirror_registry_url not found, cannot mirror OPCT images"
          exit 1
        fi
        MIRROR_REGISTRY_HOST=$(head -n1 "${SHARED_DIR}/mirror_registry_url")

        # Build the pull-secret with the mirror registry credentials
        new_pull_secret=$(mktemp)
        if [[ -f "${SHARED_DIR}/new_pull_secret" ]]; then
          cp "${SHARED_DIR}/new_pull_secret" "${new_pull_secret}"
        else
          cp "${CLUSTER_PROFILE_DIR}/pull-secret" "${new_pull_secret}"
        fi

        # Mirror OPCT images to the bastion registry so pods inside the
        # disconnected cluster can pull them.
        OPCT_IMAGES=(
          "quay.io/opct/sonobuoy:latest"
          "quay.io/opct/plugin-artifacts-collector:latest"
          "quay.io/opct/must-gather-monitoring:latest"
        )
        for img in "${OPCT_IMAGES[@]}"; do
          target="${MIRROR_REGISTRY_HOST}/${img#*/}"
          echo "Mirroring ${img} -> ${target}"
          oc image mirror "${img}" "${target}" \
            --registry-config="${new_pull_secret}" \
            --insecure=true || echo "WARN: failed to mirror ${img}"
        done

        # Mirror custom plugin image (pr-102 build) to the opct/ path
        # so --image-repository picks it up at the expected location.
        PLUGIN_SRC="quay.io/rhn-support-bshaw/plugin-openshift-tests:v0.0.4-opct512"
        PLUGIN_DST="${MIRROR_REGISTRY_HOST}/opct/plugin-openshift-tests:v0.0.4-opct512"
        echo "Mirroring custom plugin ${PLUGIN_SRC} -> ${PLUGIN_DST}"
        oc image mirror "${PLUGIN_SRC}" "${PLUGIN_DST}" \
          --registry-config="${new_pull_secret}" \
          --insecure=true

        # Inject proxy-conf and mirror registry into the OPCT env script
        cat >> "${SHARED_DIR}/env" <<'ENVEOF'

        # Proxy configuration for disconnected environment
        if [[ -f "${SHARED_DIR}/proxy-conf.sh" ]]; then
          source "${SHARED_DIR}/proxy-conf.sh"
        fi
        ENVEOF
        echo "export OPCT_MIRROR_REGISTRY=${MIRROR_REGISTRY_HOST}" >> "${SHARED_DIR}/env"
        cp "${SHARED_DIR}/env" "${ARTIFACT_DIR}/env-disconnected"
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 30m0s
    - chain: opct-pre
    test:
    - as: opct-disconnected-run
      from: cli
      credentials:
      - namespace: test-credentials
        bundle: registry-pull-credentials
        mount_path: /var/run/ci-credentials/registry
      commands: |-
        set -o nounset
        set -o errexit
        set -o pipefail

        # shellcheck source=/dev/null
        source "${SHARED_DIR}/env"
        extract_opct

        trap 'dump_opct_namespace' EXIT TERM INT

        MIRROR_REPO="${OPCT_MIRROR_REGISTRY}/opct"
        echo "Running OPCT with disconnected workflow on External platform"
        echo "  image-repository: ${MIRROR_REPO}"
        ${OPCT_CLI} run \
            --watch \
            --workflow=disconnected \
            --image-repository="${MIRROR_REPO}" \
            --plugins-image="${MIRROR_REPO}/plugin-openshift-tests:v0.0.4-opct512" \
            --validation-timeout=900 \
            --validation-retry-interval=30
      timeout: 6h
      grace_period: 6h
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
    post:
    - chain: gather
    - chain: opct-post
    - chain: platform-external-cluster-aws-post-disconnected
    dependencies:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: "release:initial"
      OPENSHIFT_UPGRADE_RELEASE_IMAGE_OVERRIDE: "release:latest"
    env:
      PROVIDER_NAME: aws
      PLATFORM_EXTERNAL_CCM_ENABLED: "no"
      DISCONNECTED_INSTALL: "yes"
      MIRROR_IN_BASTION: "yes"
      QE_IMAGES: "false"
      ZONES_COUNT: "2"
      OPCT_CLI_IMAGE: "quay.io/rhn-support-bshaw/opct:v0.0.1-opct512"
  documentation: |-
    The OPCT Conformance External AWS Disconnected workflow provisions a
    disconnected AWS cluster with platform type External (using the
    platform-external disconnected CI steps), mirrors OPCT images to
    the bastion registry, then runs OPCT with --workflow=disconnected
    to validate that tests tagged [Skipped:Disconnected] are excluded
    and conformance passes on an offline cluster.
