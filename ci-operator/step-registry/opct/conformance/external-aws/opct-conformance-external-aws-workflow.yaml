workflow:
  as: opct-conformance-external-aws
  steps:
    pre:
      - chain: opct-pre-init
      - chain: platform-external-cluster-aws-pre
      - chain: opct-pre
    test:
      - chain: opct-conformance-test
    post:
      - chain: gather
      - chain: opct-post
      - chain: platform-external-cluster-aws-post
    env:
      PROVIDER_NAME: aws
      PLATFORM_EXTERNAL_CCM_ENABLED: no
      OPCT_CLI_IMAGE: "quay.io/opct/opct:v0.6.7"
  documentation: |-
    The OPCT Conformance External E2E workflow executes the common end-to-end test suite using
    OPCT tool. For upgrades, override OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE to release:initial
    and OPENSHIFT_UPGRADE_RELEASE_IMAGE_OVERRIDE to release:latest (and set OPCT_RUN_MODE=upgrade);
    platform-external-pre-conf-manifests extracts openshift-install from the install payload so
    bootstrap/CVO flags stay paired.
