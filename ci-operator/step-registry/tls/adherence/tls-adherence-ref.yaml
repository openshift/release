ref:
  as: tls-adherence
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  commands: tls-adherence-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Enables only the TLSAdherence feature gate with CustomNoUpgrade and configures the
    API server for StrictAllComponents adherence without changing the default Intermediate
    TLS security profile. The step waits for reconciliation and fails if the desired state
    cannot be verified.
