ref:
  as: tls-groups-configure
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  commands: tls-groups-configure-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  timeout: 4h0m0s
  env:
  - name: TLS_GROUPS
    default: "SecP384r1MLKEM1024"
    documentation: |-
      Comma-separated TLS named groups to set on APIServer/cluster
      spec.tlsSecurityProfile.custom.groups (e.g. SecP384r1MLKEM1024).
  - name: TLS_GROUPS_MIN_VERSION
    default: "VersionTLS13"
    documentation: |-
      Min TLS version for the Custom profile. Must be VersionTLS13. TLS 1.3
      cipher suites are not configurable, so custom.ciphers is omitted.
  - name: TLS_GROUPS_FEATURE_GATE
    default: "TLSGroupPreferences"
    documentation: |-
      Feature gate that enables custom.groups on APIServer. Override only if
      the payload uses a different gate name.
  documentation: |-
    Ensures TLSGroupPreferences is enabled via TechPreviewNoUpgrade and
    configures APIServer/cluster with a Custom TLS security profile that sets
    custom.groups. Prefer FEATURE_SET: TechPreviewNoUpgrade on the job so the
    gate is active at install. Intended for jobs that then run tls-scanner-run
    with EXPECTED_GROUPS / EXPECTED_GROUPS_MODE=exact to assert endpoints honor
    the configured groups.
