ref:
  as: tls-scanner-run
  from: cli
  cli: latest
  commands: tls-scanner-run-commands.sh
  env:
  - name: SCAN_NAMESPACE
    default: ""
    documentation: "Comma-separated list of namespaces to scan. Empty means scan all namespaces."
  - name: SCANNER_NAMESPACE
    default: ""
    documentation: |-
      Namespace where the scanner pod is deployed. When set, the scanner runs
      in this existing namespace instead of creating a dedicated 'tls-scanner'
      namespace.
  - name: PQC_CHECK
    default: "false"
    documentation: "Set to 'true' to check post-quantum cryptography readiness (scanner will only check TLS 1.3 and mlkem/mlkem25519 support)."
  - name: SCAN_LIMIT_IPS
    default: ""
    documentation: "Max IPs to scan (empty/0 = no limit). Bounds actual TLS scans after full endpoint discovery."
  - name: SCANNER_CPU
    default: "4"
    documentation: "Deprecated: use SCANNER_CPU_REQUEST and SCANNER_CPU_LIMIT. Kept as fallback."
  - name: SCANNER_MEMORY
    default: "4Gi"
    documentation: "Deprecated: use SCANNER_MEM_REQUEST and SCANNER_MEM_LIMIT. Kept as fallback."
  - name: SCANNER_CPU_REQUEST
    default: ""
    documentation: "CPU request for the scanner pod."
  - name: SCANNER_CPU_LIMIT
    default: ""
    documentation: "CPU limit for the scanner pod."
  - name: SCANNER_MEM_REQUEST
    default: ""
    documentation: "Memory request for the scanner pod."
  - name: SCANNER_MEM_LIMIT
    default: ""
    documentation: "Memory limit for the scanner pod."
  - name: TLS_SCANNER_CLUSTER_LABEL
    default: ""
    documentation: |-
      HyperShift scan target label. Set to "management" to scan the shared
      management cluster hosted control plane namespace, or "guest" to scan the
      hosted cluster. Empty uses the step KUBECONFIG and scans all namespaces.
  - name: TLS_PROFILE_TYPE
    default: ""
    documentation: |-
      Expected cluster TLS profile type for compliance checks (Old, Intermediate,
      Modern). When set, passes --tls-profile-type to tls-scanner instead of
      reading APIServer/cluster from the API. Required for HyperShift hosted
      control planes where the guest APIServer CR may not mirror HostedCluster
      configuration.
  - name: TLS_SCANNER_PROFILE_SWEEP
    default: ""
    documentation: |-
      Ordered, comma-separated list of TLS profile types (Old, Intermediate,
      Modern) to sweep on one cluster. For each entry the step patches
      apiservers/cluster to that profile, waits for the cluster to stabilize,
      and runs a full scan, writing artifacts under tls-scanner/<profile> and
      junit_tls_scan_<profile>.xml so the passes do not overwrite each other.
      Each pass scans with --tls-profile-type set to the profile it just
      applied, so TLS_PROFILE_TYPE is ignored while sweeping. A pass that finds
      violations does not stop the sweep; the step exits non-zero at the end if
      any pass failed. Empty (the default) scans the cluster once, as
      configured, and changes nothing.
      Each profile may appear at most once, so a sweep is at most three passes,
      and each pass waits at most 45m for the cluster to stabilize before it
      scans - the sweep has to finish inside this step's 4h timeout.
  - name: TLS_SCANNER_TLS_ADHERENCE
    default: ""
    documentation: |-
      Value for apiservers/cluster spec.tlsAdherence
      (LegacyAdheringComponentsOnly or StrictAllComponents) applied with every
      TLS_SCANNER_PROFILE_SWEEP profile change, so an adherence policy set
      before the sweep is carried across each patch. Empty leaves the field
      alone. Only meaningful with TLS_SCANNER_PROFILE_SWEEP, and the
      TLSAdherence feature gate must already be enabled on the cluster (the
      tls-13 step does this).
  dependencies:
  - env: RELEASE_IMAGE_LATEST
    name: release:latest
  - env: OPENSHIFT_UPGRADE_RELEASE_IMAGE_OVERRIDE
    name: release:latest
  - env: OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE
    name: release:latest
  - env: PULL_SPEC_TLS_SCANNER_TOOL
    name: tls-scanner-tool
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 4h0m0s
  grace_period: 5m0s
  documentation: |-
    Runs the TLS scanner against all pods in the target cluster.
    Set TLS_SCANNER_PROFILE_SWEEP to scan the same cluster once per TLS profile
    (e.g. "Modern,Intermediate"), reconfiguring apiservers/cluster between passes.
    The scanner runs with cluster-admin privileges and full host access.
    Set PQC_CHECK=true to check post-quantum cryptography readiness (scanner will only check TLS 1.3 and mlkem/mlkem25519 support).
