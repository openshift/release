ref:
  as: tls-install-default-profile
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  commands: tls-install-default-profile-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Verifies that the installed APIServer uses the Modern TLS security profile from
    the installer default when tlsProfileType is not set in install-config.yaml.
