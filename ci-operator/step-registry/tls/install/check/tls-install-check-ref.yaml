ref:
  as: tls-install-check
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  commands: tls-install-check-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: TLS_PROFILE_TYPE
    default: Modern
    documentation: Expected APIServer TLS security profile type.
  - name: TLS_ADHERENCE
    default: StrictAllComponents
    documentation: Expected APIServer TLS adherence policy.
  documentation: |-
    Verifies that the installed APIServer resource reflects the TLS profile and adherence
    generated from install-config.yaml.
