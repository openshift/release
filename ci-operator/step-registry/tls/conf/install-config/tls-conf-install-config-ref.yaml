ref:
  as: tls-conf-install-config
  from: upi-installer
  commands: tls-conf-install-config-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: TLS_PROFILE_TYPE
    default: Modern
    documentation: >-
      TLS profile type to set explicitly in install-config.yaml. Supported values are
      Modern, Intermediate, and Old.
  documentation: |-
    Updates install-config.yaml to set tlsProfileType explicitly.
