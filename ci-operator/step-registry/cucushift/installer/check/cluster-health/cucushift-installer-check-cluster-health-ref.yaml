ref:
  as: cucushift-installer-check-cluster-health
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  grace_period: 30m0s
  commands: cucushift-installer-check-cluster-health-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - name: EXPECTED_VERSION
    default: ""
  - name: MAX_MCP_RETRIES
    default: "20"
    documentation: |-
      The maximum number of retries (1-minute intervals) to wait for MachineConfigPool
      health checks to pass. Increase for large clusters that need more time for MCPs to
      stabilize. Each retry waits 60 seconds, so the default of 20 gives a 20-minute window.
  documentation: >-
    The step validates the OCP cluster basic health
