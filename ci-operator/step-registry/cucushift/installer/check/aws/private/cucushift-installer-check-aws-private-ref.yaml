ref:
  as: cucushift-installer-check-aws-private
  from_image:
   namespace: ocp
   name: "4.16"
   tag: upi-installer
  grace_period: 10m
  commands: cucushift-installer-check-aws-private-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
  - default: ""
    documentation: When set, overrides LEASED_RESOURCE as the AWS region. Used for
      region qualification rehearsals.
    name: AWS_REGION_OVERWRITE
  - name: BASE_DOMAIN
    default: "origin-ci-int-aws.dev.rhcloud.com"
    documentation: |-
      The base domain is used to get the public hostedzone on AWS.
  documentation: >-
    Verify AWS private cluster
