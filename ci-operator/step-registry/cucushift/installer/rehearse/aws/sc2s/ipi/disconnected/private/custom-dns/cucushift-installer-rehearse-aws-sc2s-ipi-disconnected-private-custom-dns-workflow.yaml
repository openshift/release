workflow:
  as: cucushift-installer-rehearse-aws-sc2s-ipi-disconnected-private-custom-dns
  steps:
    pre:
      - chain: cucushift-installer-rehearse-aws-c2s-ipi-disconnected-private-custom-dns-provision
      - ref: cucushift-installer-reportportal-marker
    post:
      - chain: cucushift-installer-rehearse-aws-c2s-ipi-disconnected-private-deprovision
      - ref: send-results-to-reportportal
  documentation: |-
    This workflow provisions/deprovisions an AWS SC2S IPI cluster with user provisioned DNS.
    It reuses the C2S provision/deprovision chains; the secret region (SC2S) is selected via the
    aws-sc2s-qe cluster profile. Users who want to run e2e test against this cluster, can re-use the
    provision/deprovision chains in their own e2e test workflow.
