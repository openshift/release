workflow:
  as: cucushift-installer-rehearse-aws-upi-ovn-winc
  steps:
    env:
      SUB_CHANNEL: stable
      SUB_INSTALL_NAMESPACE: openshift-windows-machine-config-operator
      SUB_PACKAGE: windows-machine-config-operator
      SUB_TARGET_NAMESPACES: '!install'
      SUB_SOURCE: "wmco"
    pre:
      - chain: cucushift-installer-rehearse-aws-upi-ovn-winc-provision
      - ref: cucushift-installer-reportportal-marker
    test:
      - ref: clusterbot-wait
    post:
      - chain: cucushift-installer-rehearse-aws-upi-ovn-winc-deprovision
      - ref: send-results-to-reportportal
  documentation: |-
    This is the workflow to trigger Prow's rehearsal test when submitting installer steps/chain/workflow which require Windows workers as part of the cluster for AWS UPI (platform "none").

    To opt in to a post-phase debugging window, set
    WINDOWS_AWS_UPI_POST_DEBUG_WAIT: "true" in the caller's steps.env. This includes
    the windows-machine-config-operator-fbc AWS UPI caller. The setting holds the
    cluster for exactly one hour before the existing gather and deprovision steps.
    It defaults to "false". Provision and test failures remain failures, and cleanup
    continues after the optional wait.
