chain:
  as: cucushift-installer-rehearse-aws-upi-ovn-winc-deprovision
  steps:
  - chain: gather
  - ref: gather-aws-console
  - ref: windows-byoh-destroy
  - ref: aws-deprovision-stacks
  - ref: aws-deprovision-s3buckets
  - ref: upi-deprovision-aws
  - ref: ipi-deprovision-deprovision
  - ref: upi-deprovision-aws-check-destroy
  documentation: |-
    Deprovision the UPI cluster on AWS (platform "none"). Runs gather, Windows
    BYOH node destruction, and standard AWS deprovisioning. Callers that need a
    pre-deprovision debugging window (e.g. debug-winc-aws-upi) add the stock
    ref:wait step in their own post override; the chain itself does not include
    any wait. Provision and test failures remain failures; the gather and
    deprovision steps always run.
