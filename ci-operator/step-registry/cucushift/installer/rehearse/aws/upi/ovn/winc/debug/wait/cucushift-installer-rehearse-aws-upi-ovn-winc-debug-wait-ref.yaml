ref:
  as: cucushift-installer-rehearse-aws-upi-ovn-winc-debug-wait
  from: cli
  commands: cucushift-installer-rehearse-aws-upi-ovn-winc-debug-wait-commands.sh
  timeout: 70m
  resources:
    requests:
      cpu: 10m
      memory: 50Mi
  env:
  - name: WINDOWS_AWS_UPI_POST_DEBUG_WAIT
    default: "false"
    documentation: |-
      Set to "true" to hold the AWS UPI Windows cluster for exactly one hour at the
      start of the post phase before diagnostics gathering and deprovisioning. Any
      other value leaves the wait disabled.
  documentation: |-
    Provides an opt-in, one-hour debugging window before the AWS UPI Windows cleanup
    chain starts. The wait is disabled by default. Because this is a post-phase step,
    an earlier provision or test failure remains a failure; after the optional wait,
    the existing diagnostics and deprovisioning steps continue.
