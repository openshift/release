ref:
  as: cucushift-installer-rehearse-vsphere-ipi-disconnected-ovn-winc-debug-bastion
  from: upi-installer
  grace_period: 1m
  commands: cucushift-installer-rehearse-vsphere-ipi-disconnected-ovn-winc-debug-bastion-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  documentation: |-
    Collect bounded, read-only connectivity diagnostics from the vSphere
    disconnected Windows bastion. The step never prints proxy values or
    credentials and does not change the bastion state.
