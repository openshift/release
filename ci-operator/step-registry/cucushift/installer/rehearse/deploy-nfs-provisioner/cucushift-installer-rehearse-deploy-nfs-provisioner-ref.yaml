ref:
  as: cucushift-installer-rehearse-deploy-nfs-provisioner
  from: cli
  commands: cucushift-installer-rehearse-deploy-nfs-provisioner-commands.sh
  timeout: 30m0s
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  documentation: |-
    Deploy an in-cluster NFS provisioner and create a default StorageClass.
    This step creates the nfs-provisioner namespace, deploys an NFS server
    pod pinned to a worker node using hostPath storage, sets up RBAC and
    SecurityContextConstraints, creates an "nfs" StorageClass, and sets it
    as the default if no other default exists.
    Intended for PowerVC IPI clusters on ppc64le (e.g. Logging QE tests)
    that need this NFS storage backend.
  env:
    - name: NFS_PROVISIONER_IMAGE
      documentation: "NFS provisioner image. Must support the target cluster architecture, such as ppc64le."
      default: "registry.k8s.io/sig-storage/nfs-provisioner:v4.0.8"
