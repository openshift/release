workflow:
  as: kuadrant-ppc64le
  steps:
    allow_best_effort_post_steps: true
    pre:
    - ref: ipi-install-rbac
    - ref: upi-install-powervs-cluster
    test:
    - chain: kuadrant-ppc64le-test
    post:
    - chain: gather-powervs
    - ref: kuadrant-ppc64le-cleanup
    - ref: upi-deprovision-powervs-cluster
  documentation: |-
    End-to-end workflow for the kuadrant (RHCL) operator on the ppc64le (IBM Power)
    architecture. It provisions an OCP cluster on IBM Cloud PowerVS using the
    UPI PowerVS install/deprovision steps (upi-install-powervs-cluster /
    upi-deprovision-powervs-cluster), then installs OpenShift Service Mesh 3.x,
    the kuadrant operator (including the Authorino, Limitador and DNS operators)
    and the kuadrant testing tools, and finally runs the kuadrant end-to-end
    testsuite. Component cleanup runs first in the post phase, followed by log
    gathering and cluster deprovisioning.
