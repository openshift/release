ref:
  as: kuadrant-ppc64le-cleanup
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  commands: kuadrant-ppc64le-cleanup-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 15m0s
  env:
  - name: KUADRANT_NAMESPACE
    default: "kuadrant-system"
    documentation: |-
      Namespace where the Kuadrant operator is installed.
  - name: TOOLS_NAMESPACE
    default: "tools"
    documentation: |-
      Namespace where testing tools were deployed.
  - name: KUADRANT_SUBSCRIPTION_NAME
    default: "rhcl-operator"
    documentation: |-
      OLM subscription name for the Kuadrant operator (must match install-operator).
  - name: CERT_MANAGER_SUBSCRIPTION_NAME
    default: "openshift-cert-manager-operator"
    documentation: |-
      OLM subscription name for cert-manager (must match install-operator).
  - name: OSSM_SUBSCRIPTION_NAME
    default: "servicemeshoperator3"
    documentation: |-
      OLM subscription name for OpenShift Service Mesh (must match install-ossm).
  documentation: |-
    Best-effort cleanup of Kuadrant testing components (Kuadrant CR, test namespaces,
    testing tools and operator subscriptions) after the testsuite run. Cluster
    deprovisioning is handled separately by upi-deprovision-powervs-cluster in the
    workflow post phase.
