ref:
  as: kuadrant-s390x-install-operator
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  commands: kuadrant-s390x-install-operator-commands.sh
  grace_period: 1m0s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 40m0s
  env:
  - name: KUADRANT_NAMESPACE
    default: "kuadrant-system"
    documentation: |-
      Namespace where the Kuadrant operator and bootstrap Kuadrant CR are installed.
      The testsuite conftest requires this CR to already exist before smoke runs.
  - name: CERT_MANAGER_CATALOG_SOURCE
    default: "redhat-operators"
    documentation: |-
      Catalog source used to subscribe the cert-manager operator.
  - name: CERT_MANAGER_SUBSCRIPTION_NAME
    default: "openshift-cert-manager-operator"
    documentation: |-
      Package name of the cert-manager operator to subscribe to.
  - name: CERT_MANAGER_CHANNEL
    default: "stable-v1"
    documentation: |-
      Subscription channel for the cert-manager operator.
  - name: KUADRANT_CATALOG_SOURCE_IMAGE
    default: ""
    documentation: |-
      Optional grpc CatalogSource image for upstream Kuadrant (quay.io/kuadrant/…).
      When set, a CatalogSource named "kuadrant-operator-catalog" is created in
      KUADRANT_NAMESPACE. Leave empty for downstream RHCL from redhat-operators
      (recommended; matches rhcl-mc1 after migration).
  - name: KUADRANT_CATALOG_SOURCE
    default: "redhat-operators"
    documentation: |-
      Catalog source used to subscribe the operator when KUADRANT_CATALOG_SOURCE_IMAGE
      is empty. Use redhat-operators for downstream RHCL 1.4.x (rhcl-operator package).
  - name: OPERATOR_CATALOG_NAMESPACE
    default: "openshift-marketplace"
    documentation: |-
      Namespace of KUADRANT_CATALOG_SOURCE when not using a custom grpc catalog image.
  - name: KUADRANT_SUBSCRIPTION_NAME
    default: "rhcl-operator"
    documentation: |-
      OLM package name to subscribe. Use rhcl-operator for downstream RHCL; pulls in
      Authorino, Limitador and DNS operators as dependencies.
  - name: KUADRANT_CHANNEL
    default: "stable"
    documentation: |-
      Subscription channel for the operator. Set to "!default" to use the package default channel.
  - name: RHCL_STARTING_CSV
    default: "rhcl-operator.v1.4.2"
    documentation: |-
      Pin downstream RHCL to an exact CSV (e.g. rhcl-operator.v1.4.2). When set,
      the subscription uses Manual install-plan approval and only the install plan
      for this CSV is approved. Set empty to track the channel head with Automatic
      approval.
  - name: DNS_PROVIDER_SECRET_NAME
    default: "coredns-credentials"
    documentation: |-
      Name of the DNS provider Secret referenced by control_plane.provider_secret
      in the testsuite config. Created in the test namespaces from a mounted
      credentials directory when available, otherwise a placeholder is created.
  - name: DNS_CREDS_DIR
    default: "/var/run/secrets/kuadrant-dns"
    documentation: |-
      Optional directory containing a "secret.yaml" file with the full DNS provider
      Secret manifest (omitting metadata.namespace). When the file is present it is
      applied into the kuadrant and kuadrant2 namespaces; otherwise a CoreDNS
      provider Secret (type kuadrant.io/coredns, ZONES=COREDNS_ZONE) is created to
      match the ocpz-m42lp36 / rhcl-mc1 reference stacks.
  - name: COREDNS_ZONE
    default: "k.example.com"
    documentation: |-
      DNS zone for the default CoreDNS provider Secret (ZONES + base_domain
      annotation). Must match kuadrant-s390x-install-coredns COREDNS_ZONE.
  - name: CLUSTER_ISSUER_NAME
    default: "selfsigned-cluster-issuer"
    documentation: |-
      Name of the cert-manager self-signed ClusterIssuer created for TLSPolicy tests.
  - name: RELATED_IMAGE_WASMSHIM
    default: ""
    documentation: |-
      Optional override for RELATED_IMAGE_WASMSHIM via Subscription.spec.config.env.
      Leave empty to use the wasm image shipped in the catalog CSV (recommended for
      stable kuadrant releases, e.g. catalog v1.5.2). Set only when you need a
      custom/OCI wasm build.
  - name: KUADRANT_OPERATOR_IMAGE
    default: ""
    documentation: |-
      Optional override for the kuadrant-operator-controller-manager container image
      (CSV + Deployment patch). Leave empty to use the catalog CSV image (recommended
      for stable releases). Set only for experimental operator builds.
  documentation: |-
    Installs cert-manager and the RHCL operator (rhcl-operator from redhat-operators,
    or upstream Kuadrant via a custom grpc catalog image) on a provisioned s390x OCP
    cluster. By default pins RHCL 1.4.2 via RHCL_STARTING_CSV and uses downstream
    registry.redhat.io/rhcl-1/* operand images from the CSV. Optionally sets
    RELATED_IMAGE_WASMSHIM via Subscription config.env and/or overrides the manager
    image when those env vars are non-empty. Ensures DNS is Available before any
    image restart, creates the bootstrap Kuadrant CR (required by testsuite
    conftest), a self-signed ClusterIssuer, the test namespaces (kuadrant, kuadrant2,
    tools) and the DNS provider Secret. Writes operator/wasm diagnostics to ARTIFACT_DIR.
