workflow:
  as: aro-hcp-persistent-e2e
  steps:
    allow_best_effort_post_steps: true
    env:
      # int, stg and prod run few concurrent jobs per subscription, so two
      # admission workers stay well inside ARM's delete throttling budget.
      ARO_HCP_ASSET_ADMISSION_OPTIONS: e2e_identities.cleanup-workers=2
      CLEANUP_MODE: standard
    pre:
      - ref: aro-hcp-lease-acquire
      - ref: aro-hcp-write-config
    test:
      - ref: aro-hcp-test-persistent
    post:
      - ref: aro-hcp-deprovision-tracked-resource-groups
      - ref: aro-hcp-gather-test-visualization
      - ref: aro-hcp-gather-custom-link-tools
      - ref: aro-hcp-lease-release
  documentation: |-
    Runs the E2E suite against a persistent (pre-deployed) environment using slot-manager
    for subscription and identity-container selection. No provisioning or deprovisioning
    of the environment itself. Resource groups created by the test step are cleaned up
    through the RP (standard mode, never no-rp) before the slot lease is released.
    ARO-HCP project CI only: this workflow uses ARO-HCP-managed Azure credentials
    and E2E capacity. Do not copy it for another product's tests. Test through the
    customer-facing service with that project's own Azure resources and identity.
    Exceptions require explicit consent from the ARO-HCP Service Lifecycle team.
