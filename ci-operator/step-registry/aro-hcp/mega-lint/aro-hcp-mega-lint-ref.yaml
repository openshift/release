ref:
  as: aro-hcp-mega-lint
  from: src
  commands: aro-hcp-mega-lint-commands.sh
  nested_podman: true
  grace_period: 30s
  resources:
    requests:
      cpu: 4000m
      memory: 4Gi
  documentation: |-
    Run Mega-Linter.
    Requires the Podman configuration variant so src contains the checkout and Podman runtime without a copy build.