ref:
  as: aro-hcp-mega-benchmark
  from: src-benchmark
  commands: aro-hcp-mega-benchmark-commands.sh
  nested_podman: true
  grace_period: 30s
  resources:
    requests:
      cpu: '4'
      memory: 4Gi
  documentation: Runs the unchanged MegaLinter make target on a fixed source commit
    while recording timestamps, immutable image provenance, tracked content checks
    and actual linter process file inventories.
