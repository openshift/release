ref:
  as: aro-hcp-test-local
  from: aro-hcp-e2e-tests
  commands: aro-hcp-test-local-commands.sh
  credentials:
    - namespace: test-credentials
      name: aro-hcp-qe-pull-secret
      mount_path: /var/run/aro-hcp-qe-pull-secret
    - namespace: test-credentials
      name: cluster-secrets-aro-hcp-dev
      mount_path: /var/run/aro-hcp-dev
  grace_period: 30s
  timeout: 4h0m0s
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
  env:
    - name: VAULT_SECRET_PROFILE
      default: "dev"
      documentation: |-
        Selects which environment's cluster secrets to use (dev, int, stg, prod).
    - name: AROHCP_ENV
      default: "development"
    - name: LOCATION
      default: "westus3"
      documentation: Azure region to create resources in.  For example, "uksouth"
    - name: POOLED_IDENTITIES
      default: "true"
      documentation: Whether to use pooled identities for the test.
    - name: ARO_HCP_DEPLOY_ENV
      default: "ci00"
      documentation: |-
        Config environment name. Also used to select the infrastructure
        subscription from Vault (infra-{ARO_HCP_DEPLOY_ENV}-subscription-id).
    - name: COMPRESS_TIMING_METADATA
      default: "true"
      documentation: Whether to compress timing metadata files with gzip.
    - name: ARO_HCP_SUITE_PARALLELISM
      default: ""
      documentation: |-
        Optional override for suite parallelism. When unset, parallelism is
        set by the test binary.
    - name: ARO_HCP_E2E_SUITE
      default: ""
      documentation: |-
        Override the e2e test suite to run (e.g. "hypershift-presubmit/parallel").
        When unset, the Makefile defaults to "rp-api-compat-all/parallel".
    - name: ARO_HCP_OPENSHIFT_CHANNEL_GROUP
      default: ""
      documentation: |-
        OCP version channel group for cluster creation (e.g. "nightly").
        When unset, the test framework defaults to "candidate".
    - name: ARO_HCP_OPENSHIFT_VERSION_ID
      default: ""
      documentation: |-
        OCP minor version for nightly resolution (e.g. "5.0").
        When unset, the test framework defaults to its built-in version.
        Only meaningful when ARO_HCP_OPENSHIFT_CHANNEL_GROUP=nightly.
  documentation: |-
    Run the ARO HCP local e2e test suite. Fetches svc cluster kubeconfig, discovers
    service addresses, grants frontend ingress, registers subscription, then runs tests.
