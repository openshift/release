ref:
  as: aro-hcp-grafana-preview
  from: aro-hcp-e2e-tools
  commands: aro-hcp-grafana-preview-commands.sh
  best_effort: true
  timeout: 15m0s
  grace_period: 30s
  resources:
    requests:
      cpu: 2000m
      memory: 2Gi
  credentials:
    - namespace: test-credentials
      name: cluster-secrets-aro-hcp-dev
      mount_path: /var/run/aro-hcp-dev
  env:
  - name: VAULT_SECRET_PROFILE
    default: "dev"
    documentation: Selects which environment's cluster secrets to use.
  - name: DEPLOY_ENV
    default: "ci00"
    documentation: The ARO HCP deploy environment to resolve Grafana config from.
  - name: LOCATION
    default: "westus3"
    documentation: Azure region to use when resolving Grafana config.
  documentation: Deploy changed Grafana dashboards to a PR-specific preview folder in the dev Grafana instance.
