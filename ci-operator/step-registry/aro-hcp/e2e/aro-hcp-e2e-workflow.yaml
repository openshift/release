workflow:
  as: aro-hcp-e2e
  steps:
    allow_best_effort_post_steps: true
    pre:
      - ref: aro-hcp-lease-acquire
      - ref: aro-hcp-write-config
    test:
      - ref: aro-hcp-test-persistent
    post:
      - ref: aro-hcp-gather-test-visualization
      - ref: aro-hcp-gather-custom-link-tools
      - ref: aro-hcp-lease-release
  documentation: |-
    The ARO HCP e2e workflow runs the full end-to-end suite against an existing
    environment.

    Every step that reads `CUSTOMER_SUBSCRIPTION`, `CUSTOMER_SUBSCRIPTION_ID` or
    `SELECTED_CLUSTER_PROFILE_DIR` takes them from the runtime contract that
    `aro-hcp-lease-acquire` publishes, so the workflow leases a slot before the
    suite runs and returns it afterwards.
