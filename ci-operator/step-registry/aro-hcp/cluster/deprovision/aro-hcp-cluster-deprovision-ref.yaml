ref:
  as: aro-hcp-cluster-deprovision
  from: aro-hcp-e2e-tools
  commands: aro-hcp-cluster-deprovision-commands.sh
  grace_period: 15s
  timeout: 90m
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  env:
  - name: ARO_HCP_DELETE_TIMEOUT
    default: 60m
    documentation: Maximum time to wait for the RP-backed cluster deletion.
  documentation: |-
    Delete the ARO HCP cluster through the documented Azure CLI delete operation,
    wait until the RP reports the resource as not found, and then delete the
    customer resource group containing the network, identities, Key Vault, and
    other customer-owned resources.
