ref:
  as: aro-hcp-frontend-run-integration-tests
  from: src
  commands: aro-hcp-frontend-run-integration-tests-commands.sh
  grace_period: 30s
  nested_podman: true
  resources:
    requests:
      cpu: "6"
      memory: 4Gi
  documentation: |-
    Runs the integration tests for the frontend. These are tests that use the cosmos emulator and mocked cluster-service
    (for now), to check if basic frontend logic is working. Think things like serialization and validation.
    Requires src to be built from aro-hcp-nested-podman-ci so Podman and its runtime configuration are inherited directly.
    The podman configuration variant builds src directly on that root, avoiding a checkout-copy image build.
    The root must provide pinned gotestsum/setup-envtest binaries and an ENVTEST_PREBUILT_ASSETS cache.
    Phase timings for helpers, emulator startup/cleanup, envtest and Go execution are retained with the test artifacts.
