ref:
  as: aro-hcp-deprovision-cleanup-sweeper
  from: aro-hcp-e2e-tests
  commands: aro-hcp-deprovision-cleanup-sweeper-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  credentials:
    - namespace: test-credentials
      name: cluster-secrets-aro-hcp-dev
      mount_path: /var/run/aro-hcp-dev
    - namespace: test-credentials
      name: cluster-secrets-aro-hcp-int-rh
      mount_path: /var/run/aro-hcp-int-rh
    - namespace: test-credentials
      name: cluster-secrets-aro-hcp-stg-rh
      mount_path: /var/run/aro-hcp-stg-rh
    - namespace: test-credentials
      name: cluster-secrets-aro-hcp-prod-rh
      mount_path: /var/run/aro-hcp-prod-rh
  env:
  - name: VAULT_SECRET_PROFILE
    default: "dev"
    documentation: |-
      Selects which environment's cluster secrets to use (dev, int, stg, prod).
  - name: GRAPH_SECRET_PROFILE
    default: "dev"
    documentation: |-
      Selects which mounted profile provides the identity used for Microsoft Graph
      directory reads (resolving orphaned role-assignment principals). Defaults to
      "dev" because the dev bot holds Directory.Read.All; the per-environment ARM
      identity (VAULT_SECRET_PROFILE) typically lacks tenant-wide Graph permissions.
      When it resolves to the same profile as VAULT_SECRET_PROFILE, no separate Graph
      credential is exported and the ARM identity is used for both.
  - name: CLEANUP_SWEEPER_WORKFLOW
    default: "shared-leftovers"
    documentation: Cleanup workflow to execute (for example, "shared-leftovers" or "rg-ordered").
  - name: CLEANUP_SWEEPER_POLICY
    default: ""
    documentation: Optional policy file path for policy-driven workflows.
  - name: CLEANUP_SWEEPER_PARALLELISM
    default: "8"
    documentation: Optional cleanup-sweeper --parallelism value.
  - name: CLEANUP_SWEEPER_WAIT
    default: ""
    documentation: Optional wait flag value passed as --wait=<value>.
  - name: CLEANUP_SWEEPER_VERBOSITY
    default: ""
    documentation: Optional verbosity level passed as --verbosity=<value>.
  - name: CLEANUP_SWEEPER_EXTRA_ARGS
    default: ""
    documentation: Optional additional CLI arguments appended to cleanup-sweeper.
  documentation: |-
    Run cleanup-sweeper with configurable workflow settings. Subscription IDs are auto-discovered from the mounted secret directory.
