ref:
  as: aro-hcp-deprovision-expired-certificates
  from: aro-hcp-e2e-tools
  commands: aro-hcp-deprovision-expired-certificates-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 2Gi
  credentials:
  - collection: hcm-aro
    group: aro-hcp-dev
    mount_path: /var/run/aro-hcp-dev
  env:
  - name: CERTIFICATE_CLEANUP_DRY_RUN
    default: "true"
    documentation: Report eligible certificates without deleting them. Setting false permits deletion only when JOB_TYPE is periodic; all other invocations force dry-run.
  - name: CERTIFICATE_CLEANUP_POLICY
    default: tooling/cleanup-sweeper/certificates.policy.yaml
    documentation: Certificate cleanup policy file in the ARO-HCP checkout. It defines the vault, the owner inventory subscriptions, the protected tags and the per-rule retention.
  - name: CERTIFICATE_CLEANUP_MAX_DELETIONS
    default: "1000"
    documentation: Maximum number of active certificates selected for deletion per run; each deleted certificate is purged immediately.
  - name: CERTIFICATE_CLEANUP_MAX_PURGES
    default: "1000"
    documentation: Maximum number of previously deleted certificates (tombstones) purged per run. It is independent of the deletion limit, so a run can purge up to the sum of both.
  - name: CERTIFICATE_CLEANUP_PARALLELISM
    default: "2"
    documentation: Maximum concurrent certificate delete and purge chains.
  - name: CERTIFICATE_CLEANUP_TIMEOUT
    default: "60m"
    documentation: Overall timeout for inventory discovery and mutations.
  documentation: |-
    Clean up orphaned DEV CI certificates with cleanup-sweeper --workflow=certificates.
    The policy file fixes the scope: the vault it names is the only vault touched, and
    the owner inventory reads the resource groups of the subscriptions it lists; the
    workflow does not fan out across other subscriptions or use Microsoft Graph.
    Owner inventory must succeed in every listed subscription before any deletion; an
    inventory failure fails closed. Retention is per policy rule and is measured from
    the latest creation or update timestamp, not the earliest, so a recent renewal
    postpones cleanup. A certificate carrying one of the policy's protected tags is
    never selected. The deletion and purge limits are mutation budgets: ineligible
    metadata does not consume them, so discovery can inspect the complete inventory.
    Successful deletes are immediately purged, and pre-existing tombstones are purged
    afterwards within their own budget. Purging is irreversible.
    The step defaults to dry-run; the dedicated hourly
    delete-expired-dev-ci-certificates job explicitly sets dry-run to false.
    The script forces dry-run unless JOB_TYPE is exactly periodic, regardless of
    CERTIFICATE_CLEANUP_DRY_RUN. Prow rehearsals run as presubmits and cannot delete;
    unset, empty, and other non-periodic job types also force dry-run.
    Merging a periodic that sets dry-run to false enables real deletion immediately.
