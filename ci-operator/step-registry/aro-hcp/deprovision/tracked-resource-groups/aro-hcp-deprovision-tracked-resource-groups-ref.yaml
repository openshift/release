ref:
  as: aro-hcp-deprovision-tracked-resource-groups
  best_effort: true
  from: aro-hcp-e2e-tests
  commands: aro-hcp-deprovision-tracked-resource-groups-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  credentials:
    - collection: hcm-aro
      group: aro-hcp-dev
      mount_path: /var/run/aro-hcp-dev
    - collection: hcm-aro
      group: aro-hcp-int-rh
      mount_path: /var/run/aro-hcp-int-rh
    - collection: hcm-aro
      group: aro-hcp-stg-rh
      mount_path: /var/run/aro-hcp-stg-rh
    - collection: hcm-aro
      group: aro-hcp-prod
      mount_path: /var/run/aro-hcp-prod
    - collection: hcm-aro
      group: aro-hcp-prod-rh
      mount_path: /var/run/aro-hcp-prod-rh
  env:
    - name: VAULT_SECRET_PROFILE
      default: "dev"
      documentation: |-
        Selects which environment's cluster secrets to use (dev, int-rh, stg-rh, prod, prod-rh).
    - name: CLEANUP_MODE
      default: "no-rp"
      documentation: |-
        Cleanup mode passed to the CLI. Defaults to "no-rp" because clusters
        may be in broken states that the RP cannot cleanly handle. Workflows
        that target a real RP (int, stg, prod) MUST set "standard"; the step
        refuses "no-rp" for those profiles.
    - name: CLEANUP_TIMEOUT
      default: "15m"
      documentation: |-
        Timeout passed to the CLI as --timeout. It applies to HCP deletion in
        each resource group and again to deleting the group itself, so it must
        stay well below the step timeout. Most HCPs are already deleted, or
        being deleted, by the tests' own teardown, and HCP deletion continues
        in the background when this step times out. The goal of this step is
        that every deletion has been started before the job finishes, not that
        it has completed.
    - name: CLEANUP_CONCURRENCY
      default: "40"
      documentation: |-
        Maximum number of resource groups cleaned concurrently, passed to the
        CLI as --concurrency. Groups beyond this wait for a slot, so it bounds
        how soon every deletion has been started. 40 covers the leak from a
        failed full-suite run in two batches.
    - name: RESOURCE_MANAGER_ENDPOINT
      default: ""
      documentation: |-
        Override the Azure Resource Manager endpoint for HCP SDK clients, so
        cleanup uses the same ARM endpoint as the test step. Set by the canary
        ARM endpoint jobs (https://eastus2euap.management.azure.com), which
        exercise ARM APIs only deployed to the canary region.
  timeout: 45m
  documentation: |-
    Best-effort cleanup of resource groups created by the e2e test step.
    Deletes the resource groups listed in tracked-resource-group_* marker
    files in SHARED_DIR plus every resource group tagged with this run's
    BUILD_ID, so groups leaked by an aborted test step are still removed.
    This reduces role assignment pressure between job completion and the
    periodic expired-resource-group cleanup.
