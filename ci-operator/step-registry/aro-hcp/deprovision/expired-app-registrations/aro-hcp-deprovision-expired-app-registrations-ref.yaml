ref:
  as: aro-hcp-deprovision-expired-app-registrations
  from: aro-hcp-e2e-tests
  commands: aro-hcp-deprovision-expired-app-registrations-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 300Mi
  credentials:
    - collection: hcm-aro
      group: aro-hcp-red-hat-tenant
      mount_path: /var/run/aro-hcp-red-hat-tenant
    - collection: hcm-aro
      group: aro-hcp-prod
      mount_path: /var/run/aro-hcp-prod
  env:
    - name: VAULT_SECRET_PROFILE
      default: "red-hat-tenant"
      documentation: |-
        Selects which tenant's cluster profile to use (red-hat-tenant, prod).
  documentation: |-
    Clean up expired e2e app registrations that were left by test runs.
