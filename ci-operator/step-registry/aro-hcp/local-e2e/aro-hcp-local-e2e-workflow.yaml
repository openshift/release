workflow:
  as: aro-hcp-local-e2e
  steps:
    allow_best_effort_post_steps: true
    leases:
      - env: LEASED_MSI_MOCK_SP
        resource_type: aro-hcp-msi-mock-cs-sp-dev
      - count: 2
        env: LEASED_ARM_HELPER_SP
        resource_type: aro-hcp-arm-helper-sp-dev
    pre:
      - ref: aro-hcp-lease-acquire
      - ref: aro-hcp-write-config
      - ref: aro-hcp-provision-environment
    test:
      - ref: aro-hcp-test-local
    post:
      - ref: aro-hcp-deprovision-tracked-resource-groups
      - ref: aro-hcp-gather-provision-failure
      - ref: aro-hcp-gather-visualization
      - ref: aro-hcp-gather-test-visualization
      - ref: aro-hcp-gather-custom-link-tools
      - ref: aro-hcp-gather-observability
      - ref: aro-hcp-gather-snapshot
      - ref: aro-hcp-deprovision-environment
      - ref: aro-hcp-deprovision-cleanup-sweeper
      - ref: aro-hcp-lease-release
  documentation: |-
    The local ARO HCP e2e workflow starts an ARO HCP environment and runs the full end-to-end suite against it.

    Each provisioned environment creates a fresh AKS cluster whose kubelet/pull
    identity is granted AcrPull (and related Key Vault) role assignments on the
    shared dev ACR/Key Vault. aro-hcp-deprovision-environment deletes the
    environment's own resource group but cannot remove those role assignments,
    since they're scoped to the shared ACR/Key Vault, not the deleted resource
    group. aro-hcp-deprovision-cleanup-sweeper runs immediately after to purge
    the now-orphaned role assignments left behind by this run, rather than
    waiting on the hourly periodic sweep.
