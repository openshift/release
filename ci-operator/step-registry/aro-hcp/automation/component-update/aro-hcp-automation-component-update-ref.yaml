ref:
  as: aro-hcp-automation-component-update
  from: aro-hcp-automation-component-update
  commands: aro-hcp-automation-component-update-commands.sh
  grace_period: 5m0s
  timeout: 30m0s
  env:
  - name: MODE
    default: check
    documentation: |-
      The component-updater mode. "check" runs read-only discovery and never
      commits or opens a pull request; "update" applies version bumps and opens
      a pull request. Start with "check" when validating the job, then switch
      to "update".
  - name: AZURE_CREDENTIALS_DIR
    default: /var/run/aro-hcp-dev
    documentation: |-
      The directory containing Azure credentials (client-id, client-secret, tenant).
  - name: AZURE_SUBSCRIPTION_ID
    default: 1d3378d3-5a3f-4712-85a1-2485495dfc4b
    documentation: |-
      The subscription used to discover component versions across all regions.
  - name: COMPONENT
    default: istio-mesh-revision
    documentation: |-
      The component(s) to update. Comma-separated for multiple components, or all.
  - name: GITHUB_REPO_ORG
    default: Azure
    documentation: |-
      The organization of the GitHub repository.
  - name: GITHUB_REPO_NAME
    default: ARO-HCP
    documentation: |-
      The name of the GitHub repository.
  - name: GITHUB_REPO_BRANCH
    default: main
    documentation: |-
      The branch of the GitHub repository.
  - name: GITHUB_APP_ID_PATH
    default: /var/run/aro-hcp-robot/appid
    documentation: |-
      The path to the GitHub App ID file.
  - name: GITHUB_APP_KEY_PATH
    default: /var/run/aro-hcp-robot/cert
    documentation: |-
      The path to the GitHub App private key PEM file.
  - name: GITHUB_PR_TITLE
    default: Automated - Update component versions
    documentation: |-
      The title of the GitHub pull request.
  - name: GITHUB_PR_USER
    default: aro-hcp-robot[bot]
    documentation: |-
      The git user name for commits and pull requests.
  - name: GITHUB_PR_EMAIL
    default: aro-hcp-robot[bot]@users.noreply.github.com
    documentation: |-
      The git email for commits and pull requests.
  - name: SLACK_WEBHOOK_PATH
    default: /var/run/slack-webhook/webhook
    documentation: |-
      The path to the Slack webhook file.
  - name: PROW_JOB_URL
    default: https://prow.ci.openshift.org/?job=periodic-ci-Azure-ARO-HCP-main-component-updater-component-updater-tooling
    documentation: |-
      The URL of the Prow job.
  - name: VERBOSITY
    default: "0"
    documentation: |-
      The debug level. 0 for no debug, 1 for debug, 2 for debug with verbose output.
  credentials:
  - mount_path: /var/run/aro-hcp-robot
    group: aro-hcp-robot
    collection: hcm-aro
  - mount_path: /var/run/aro-hcp-dev
    group: aro-hcp-dev
    collection: hcm-aro
  - mount_path: /var/run/slack-webhook
    group: aro-hcp-image-bump-slack-webhook
    collection: hcm-aro
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  documentation: |-
    Discovers compatible component versions (e.g. Istio mesh revisions) across all
    regions and opens a PR with the source config, rendered configs, and Helm fixtures.
