ref:
  as: mco-automation-disconnected-setup
  from: upi-installer
  cli: latest
  commands: mco-automation-disconnected-setup-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - namespace: test-credentials
    name: openshift-custom-mirror-registry
    mount_path: /var/run/vault/mirror-registry
  documentation: |-
    Configures a disconnected cluster for MCO e2e tests by adding mirror
    registry credentials to the cluster pull-secret and creating ICSP or
    IDMS/ITMS resources to redirect quay.io/openshifttest image pulls to
    the bastion mirror registry. Must run after mirror-images-qe-test-images
    has mirrored the actual images.
