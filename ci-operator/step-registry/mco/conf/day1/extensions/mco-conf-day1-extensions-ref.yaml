ref:
  as: mco-conf-day1-extensions
  from_image:
    namespace: origin
    name: centos
    tag: '8'
  commands: mco-conf-day1-extensions-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
    - name: MCO_CONF_DAY1_EXTENSIONS_MCPS
      default: ""
      documentation: |
        Space-separated list containing the names of the MachineConfigPools
        where the extensions will be installed.
        If the value is empty, this step will be skipped.
    - name: MCO_CONF_DAY1_EXTENSIONS
      default: "usbguard kerberos sysstat"
      documentation: |
        Space-separated list of extensions to install.
        If the value is empty, no manifest will be created and this step will be skipped.
        The default extensions (usbguard, kerberos, sysstat) are compatible with all
        platforms, releases (RHEL 9 and RHEL 10), and kernel types.
        Note: kernel-devel is not compatible with the realtime kernel.
        Full list of available extensions: usbguard, kerberos, kernel-devel, sysstat,
        ipsec, sandboxed-containers.
  documentation: |-
    This step creates new MachineConfig files in the manifests directory in order to install
    day-1 extensions in the given MachineConfigPools
