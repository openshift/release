ref:
  as: mco-conf-day2-remove-kerneltype-extensions
  from: cli
  grace_period: 10m
  commands: mco-conf-day2-remove-kerneltype-extensions-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  env:
    - name: MCO_CONF_DAY2_REMOVE_MCPS
      default: ""
      documentation: |
        Space-separated list containing the names of the MachineConfigPools
        where the kerneltype and extensions MachineConfigs will be removed.
        If the value is empty, this step will be skipped.
    - name: MCO_CONF_DAY2_REMOVE_TIMEOUT
      default: "45m"
      documentation: |
        Maximum time to wait for a single pool to finish updating after removing
        the MachineConfigs. The default 45m value is valid for pools with 2 or 3 nodes.
        Increase this value for pools with more nodes.
  documentation: |-
    This step removes the kerneltype and extensions MachineConfigs created by
    the day-1 steps (mco-conf-day1-kerneltype and mco-conf-day1-extensions) from
    the given MachineConfigPools and waits for the configuration to be applied.
