workflow:
  as: mco-review-agent-trigger
  steps:
    test:
      - ref: review-agent-trigger
    env:
      PERIODIC_JOB_NAME: "periodic-ci-openshift-machine-config-operator-main-periodic-review-agent"
      REVIEW_AGENT_UPSTREAM_REPO: "openshift/machine-config-operator"
  documentation: |-
    Lightweight workflow that triggers the MCO review-agent periodic
    job via gangway instead of running the agent inline. This avoids the
    presubmit aborting when the agent pushes to the PR branch.
