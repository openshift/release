ref:
  as: ofcir-release-source
  from: dev-scripts
  commands: ofcir-release-source-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 600Mi
    limits:
      memory: 2Gi
  env:
  - name: OFCIR_ROLE
    default: source
    documentation: Optional role used when this job leased multiple OFCIR hosts.
  documentation: |-
    This step deprovisions the ofcir server
