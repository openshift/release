ref:
  as: ofcir-acquire
  from: dev-scripts
  grace_period: 1m0s
  commands: ofcir-acquire-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 600Mi
    limits:
      memory: 2Gi
  env:
  - name: CLUSTERTYPE
    default: virt
    documentation: Type of environment to run CI test on "virt", "virt-arm64" or "baremetal"
  - name: OFCIR_ROLE
    default: ""
    documentation: Optional role appended to the OFCIR requester name when a job leases multiple hosts.
  documentation: |-
    This step performs the acquire of the ofcir server
