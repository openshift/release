ref:
  as: rh-ecosystem-edge-assisted-chat-test
  from: src
  cli: latest
  timeout: 0h30m0s
  commands: rh-ecosystem-edge-assisted-chat-test-commands.sh
  credentials:
    - collection: assisted-chat-test-credentials
      group: vertex
      mount_path: /var/run/secrets/vertex
    - collection: assisted-chat-test-credentials
      group: assisted-chat-sso-ci
      mount_path: /var/run/secrets/sso-ci
  dependencies:
    - env: ASSISTED_CHAT_TEST
      name: rh-ecosystem-edge-assisted-chat-test
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  documentation: |-
    Run the evaluation tests
