ref:
  as: rh-ecosystem-edge-kmm-qe-install
  from: kmm-ci
  commands: rh-ecosystem-edge-kmm-qe-install-commands.sh
  env:
  - name: KMM_CHANNEL
    default: release-2.7
    documentation: KMM release channel to install.
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  documentation: |-
    Installs KMM using the channel supplied through KMM_CHANNEL.
    Defaults to the current supported KMM 2.7 channel.
