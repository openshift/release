ref:
  as: rh-ecosystem-edge-kmm-ci-qe-install
  cli: latest
  from: kmm-ci
  commands: rh-ecosystem-edge-kmm-ci-qe-install-commands.sh
  credentials:
  - mount_path: /var/run/secrets/ci-pull-credentials
    bundle: ci-pull-credentials
    namespace: ci
  env:
  - name: KMM_CHANNEL
    default: release-2.7
    documentation: KMM release channel to install.
  - name: KMM_CATALOG_PULL_SECRET_PATH
    default: /var/run/secrets/ci-pull-credentials/.dockerconfigjson
    documentation: Docker config used by OLM to pull KMM bundle images.
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  documentation: |-
    Installs KMM using the channel supplied through KMM_CHANNEL.
    Defaults to the current supported KMM 2.7 channel.
