workflow:
  as: rh-ecosystem-edge-kmm-ci-qe
  steps:
    test:
    - ref: rh-ecosystem-edge-kmm-ci-qe-install
    - ref: rh-ecosystem-edge-kmm-ci-qe-tests
  documentation: |-
    Runs the common KMM QE flow on a claimed OpenShift cluster.

    The calling test supplies KMM_CHANNEL through workflow environment variables.
    Architecture-specific, Secure Boot, and Hub/Spoke jobs should use dedicated
    workflow variants with their own cluster claims and setup steps.
