ref:
  as: rh-ecosystem-edge-kmm-ci-qe-preflight
  from_image:
    namespace: ocp
    name: cli-jq
    tag: latest
  cli: latest
  commands: rh-ecosystem-edge-kmm-ci-qe-preflight-commands.sh
  env:
  - name: KMM_QE_PREFLIGHT_TIMEOUT_SECONDS
    default: "900"
    documentation: Maximum time to wait for cluster health before failing.
  - name: KMM_QE_PREFLIGHT_STABLE_PERIOD_SECONDS
    default: "120"
    documentation: Time the cluster must remain healthy before tests start.
  - name: KMM_QE_PREFLIGHT_POLL_SECONDS
    default: "30"
    documentation: Interval between cluster health checks.
  - name: KMM_QE_PREFLIGHT_DIAGNOSTIC_BUDGET_SECONDS
    default: "120"
    documentation: Maximum total time allowed for failure diagnostics.
  - name: KMM_QE_PREFLIGHT_DIAGNOSTIC_COMMAND_TIMEOUT_SECONDS
    default: "30"
    documentation: Maximum time allowed for an individual diagnostic command.
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  documentation: |-
    Verifies that cluster operators, MachineConfigPools, and nodes are healthy
    for a bounded stability period before KMM tests run. Captures MCO and
    cluster diagnostics when the preflight deadline expires.
