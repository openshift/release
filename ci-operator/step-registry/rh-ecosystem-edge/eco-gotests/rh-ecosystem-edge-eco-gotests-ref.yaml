ref:
  as: rh-ecosystem-edge-eco-gotests
  from: eco-gotests
  cli: latest
  timeout: 3h0m0s
  commands: rh-ecosystem-edge-eco-gotests-commands.sh
  env:
    - name: ECO_GOTESTS_ENV_VARS
      default: ""
      documentation: Required env variables for eco-gotests container
  resources:
    requests:
      cpu: 1000m
      memory: 500Mi
  documentation: |-
    Run eco-gotests on the cluster
