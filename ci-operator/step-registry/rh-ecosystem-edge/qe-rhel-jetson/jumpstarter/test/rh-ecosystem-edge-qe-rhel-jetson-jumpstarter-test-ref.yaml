ref:
  as: rh-ecosystem-edge-qe-rhel-jetson-jumpstarter-test
  from: qe-rhel-jetson
  commands: rh-ecosystem-edge-qe-rhel-jetson-jumpstarter-test-commands.sh
  credentials:
    - namespace: test-credentials
      name: qe-rhel-jetson-jumpstarter
      mount_path: /var/run/secrets/jumpstarter
    - namespace: test-credentials
      name: qe-rhel-jetson-jetson-ssh
      mount_path: /var/run/secrets/jetson-ssh
  env:
    - name: JUMPSTARTER_DEVICE_NAME
      default: ""
      documentation: >-
        Name of the Jumpstarter exporter/device to lease (e.g.
        nvidia-jetson-nx-orin-01). Mutually exclusive with
        JUMPSTARTER_SELECTOR. If both are empty, JUMPSTARTER_LEASE_NAME
        must be set to a pre-reserved lease.
    - name: JUMPSTARTER_SELECTOR
      default: ""
      documentation: >-
        Label selector for Jumpstarter device acquisition
        (e.g. board-type=orin-nx). Used when JUMPSTARTER_DEVICE_NAME is
        not set. Mutually exclusive with JUMPSTARTER_DEVICE_NAME.
    - name: JUMPSTARTER_LEASE_NAME
      default: ""
      documentation: >-
        Name of a pre-reserved Jumpstarter lease. Used only when neither
        JUMPSTARTER_DEVICE_NAME nor JUMPSTARTER_SELECTOR is set
        (backward-compatible mode).
    - name: LEASE_DURATION
      default: "3h"
      documentation: How long to hold the Jumpstarter lease (e.g. 1h, 3h, 1d).
    - name: TEST_SUITE
      default: tests_suites/
      documentation: pytest test path or suite directory to run
    - name: SKIP_PREPULL
      default: "0"
      documentation: Set to 1 to skip NGC container image pre-pull on the device
    - name: EXPECTED_RHEL_MAJOR
      default: "9"
      documentation: Expected RHEL major version on the Jetson device
  grace_period: 60s
  resources:
    requests:
      cpu: 100m
      memory: 200Mi
  timeout: 3h0m0s
  documentation: |-
    Run the qe-rhel-jetson test suite on a physical NVIDIA Jetson device via Jumpstarter.

    The step creates a Jumpstarter lease automatically (and releases it on exit) when
    JUMPSTARTER_DEVICE_NAME or JUMPSTARTER_SELECTOR is set. For pre-reserved leases
    set JUMPSTARTER_LEASE_NAME instead (backward-compatible).

    Required secrets in test-credentials namespace:
      - qe-rhel-jetson-jumpstarter: Jumpstarter client config (key: config)
      - qe-rhel-jetson-jetson-ssh: Jetson SSH credentials (keys: username, password)
