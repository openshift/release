ref:
  as: deploy-konflux-operator
  from: tests
  cli: latest
  timeout: 30m
  grace_period: 1m
  commands: deploy-konflux-operator-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: KONFLUX_DEPLOY_OPERATORS
    documentation: |-
      If set to "false", the operators will not be deployed. Default is "true".
    default: "true"
  - name: KONFLUX_DEPLOY_CATALOG_SOURCE
    documentation: |-
      If set to "true", the CatalogSource will be deployed as part of operator installation process. Default is "true".
    default: "true"
  - name: KONFLUX_DEPLOY_SUBSCRIPTION
    documentation: |-
      If set to "true", the Subscription, Namespace and OperatorGroup will be deployed. Default is "true".
    default: "true"
  - name: KONFLUX_TARGET_OPERATORS
    documentation: |-
      Comma separated list of operators to install (i.e "sriov,metallb,nmstate"). Mutually exclusive with KONFLUX_TARGET_FBC_TAGS.
  - name: KONFLUX_TARGET_FBC_TAGS
    documentation: |-
      Comma separated list of FBC tags to use for the operators (i.e "ocp__4.21__metallb-rhel9-operator,ocp__4.21__ose-local-storage-rhel9-operator"). Mutually exclusive with KONFLUX_TARGET_OPERATORS.
    default: ""
  - name: DISCONNECTED
    documentation: |-
      Whether to run in disconnected mode.
    default: "false"
  - name: KONFLUX_USE_REGISTRY_PROXY
    documentation: |-
      Whether to use the registry proxy. If true, the registry proxy will be used to pull the images.
    default: "false"
  - name: KONFLUX_REGISTRY_PROXY_HOST
    documentation: |-
      The host of the registry proxy. If not set, the registry proxy will be derived from the mirror registry url.
    default: ""
  - name: KONFLUX_REGISTRY_PROXY_PORT
    documentation: |-
      The port of the registry proxy. Must be set if KONFLUX_REGISTRY_PROXY_HOST is set.
    default: ""
  credentials:
  - collection: deploy-konflux-operator
    group: art-image-share
    mount_path: /var/run/vault/deploy-konflux-operator-art-image-share
  - collection: openshift-qe
    group: mirror-registry
    mount_path: /var/run/vault/mirror-registry
  documentation: |-
     Deploy Konflux-built operators for connected environments.

     The deployment script is vendored into this step's command file; it is a copy of
     deploy-operator.sh at tag v8.1 of
     https://github.com/ajaggapa/deploy-konflux-operator (commit
     8b1833e2592825b007525219e28fd9fffaef4a89), which this step used to clone at run
     time. Nothing is cloned at run time any more.

     The copy is not byte-for-byte identical to upstream: trailing horizontal whitespace
     was removed, to satisfy this repository's clean-diff gate. That touches 21 lines and
     no string, here-document or line continuation, so the logic is unchanged. The
     command file records both the upstream hash and the hash of the normalised copy.

     Tooling comes from OpenShift builds: oc via ci-operator's cli injection, and opm
     from quay.io/openshift/origin-operator-registry, which is built from
     github.com/openshift/operator-framework-olm and is pinned by digest. Nothing is
     fetched from a personal repository or a third-party project any more.

     The step is not network-free. It reaches quay.io for the operator catalogs, the
     operator images and the opm image, the cluster API, and in disconnected mode the
     mirror registry or registry proxy. It adds no registry host beyond the ones the
     deployment already required.
