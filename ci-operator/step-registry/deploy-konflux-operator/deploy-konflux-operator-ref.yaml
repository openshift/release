ref:
  as: deploy-konflux-operator
  from: tests
  cli: latest
  timeout: 30m
  grace_period: 1m
  commands: deploy-konflux-operator-commands.sh
  resources:
    requests:
      cpu: 100m
      memory: 100Mi
  env:
  - name: ART_IMAGES_SOURCE
    default: registry.stage.redhat.io
    documentation: |-
      Registry root mirroring registry.redhat.io related images, preserving repository paths and digests.
      Authentication uses registry_stage.json from the existing mirror-registry credential mount.
  - name: KONFLUX_CATALOG_REGISTRY_PROXY
    default: ""
    documentation: |-
      Quay catalog proxy host:port for registry-proxy mode. Defaults to the ART proxy host on port 6001;
      the ART proxy (port 6003 by default) must proxy registry.stage.redhat.io.
  - name: KONFLUX_DEPLOY_OPERATORS
    documentation: |-
      If set to "false", the operators will not be deployed. Default is "true".
    default: "true"
  - name: KONFLUX_DEPLOY_CATALOG_SOURCE
    documentation: |-
      If set to "true", the CatalogSource will be deployed as part of operator installation process. Default is "true".
    default: "true"
  - name: KONFLUX_DEPLOY_SUBSCRIPTION
    documentation: |-
      If set to "true", the Subscription, Namespace and OperatorGroup will be deployed. Default is "true".
    default: "true"
  - name: KONFLUX_TARGET_OPERATORS
    documentation: |-
      Comma separated list of operators to install (i.e "sriov,metallb,nmstate"). Mutually exclusive with KONFLUX_TARGET_FBC_TAGS.
  - name: KONFLUX_TARGET_FBC_TAGS
    documentation: |-
      Comma separated list of FBC tags to use for the operators (i.e "ocp__4.21__metallb-rhel9-operator,ocp__4.21__ose-local-storage-rhel9-operator"). Mutually exclusive with KONFLUX_TARGET_OPERATORS.
    default: ""
  - name: DISCONNECTED
    documentation: |-
      Whether to run in disconnected mode.
    default: "false"
  - name: KONFLUX_USE_REGISTRY_PROXY
    documentation: |-
      Whether to use the registry proxy. If true, the registry proxy will be used to pull the images.
    default: "false"
  - name: KONFLUX_REGISTRY_PROXY_HOST
    documentation: |-
      The host of the registry proxy. If not set, the registry proxy will be derived from the mirror registry url.
    default: ""
  - name: KONFLUX_REGISTRY_PROXY_PORT
    documentation: |-
      The stage registry proxy port. Must be set if KONFLUX_REGISTRY_PROXY_HOST is set.
      The legacy Quay ART-share port 6004 is migrated to the existing stage proxy port 6003.
      Catalogs use the separate Quay proxy on port 6001 unless KONFLUX_CATALOG_REGISTRY_PROXY is set.
    default: ""
  credentials:
  - collection: openshift-qe
    group: mirror-registry
    mount_path: /var/run/vault/mirror-registry
  documentation: |-
     Deploy Konflux-built operators using deployment logic owned by this step.
     Uses CI-injected oc and opm extracted from a digest-pinned OpenShift
     operator-registry image. Catalogs remain on Quay;
     registry.redhat.io related images are pulled from the stage registry using the
     existing opt-in mirror-registry credentials. Disconnected copies and stage
     registry proxies preserve repository paths and image digests.
