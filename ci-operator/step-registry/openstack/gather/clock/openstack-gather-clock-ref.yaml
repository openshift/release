ref:
  as: openstack-gather-clock
  from: openstack-installer
  commands: openstack-gather-clock-commands.sh
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  timeout: 20m
  documentation: |-
    Gather node clock and NTP diagnostics for the cluster under test (chrony
    state, resolver, routes, node_exporter timex metrics) plus the bastion
    proxy's chrony state, forwarding/NAT rules and a one-shot NTP query.
    Output is written to ${ARTIFACT_DIR}/node-clock.txt.

    Temporary diagnostic step for OSASINFRA-4617 (NodeClockNotSynchronising
    on the proxy/externallb topology).
