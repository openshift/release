ref:
  as: openstack-provision-dnsrecords
  from: openstack-installer
  commands: openstack-provision-dnsrecords-commands.sh
  env:
    - name: BASE_DOMAIN
    - name: CONFIG_TYPE
      documentation: |-
        Install topology variant (for example proxy-externallb). When the value
        contains externallb, an api-int DNS record is created alongside api.
        For externallb, api uses LB_HOSTS FIPs (multi-value RR); api-int uses
        the machines-net API VIP so nodes can reach MCS/API on-L2.
  resources:
    requests:
      cpu: 10m
      memory: 100Mi
  credentials:
  - collection: shiftstack-secrets
    group: aws
    mount_path: /var/run/aws
  documentation: |-
    This steps creates the required dns records for the ingress
    and api FIPS. Expects the following to exist ${SHARED_DIR}/API_IP,
    ${SHARED_DIR}/INGRESS_IP, and ${SHARED_DIR}/CLUSTER_NAME. For externallb,
    api uses ${SHARED_DIR}/LB_HOSTS when present; api-int uses API_IP.
    Writes ${SHARED_DIR}/dns_up.json used later for deprovision.
