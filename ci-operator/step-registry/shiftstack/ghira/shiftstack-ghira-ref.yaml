ref:
  as: shiftstack-ghira
  from: shiftstack-ghira-image
  commands: shiftstack-ghira-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 100Mi
  credentials:
  - collection: shiftstack-secrets
    group: team
    mount_path: /var/run/team
  - collection: shiftstack-secrets
    group: ghira
    mount_path: /var/run/ghira
  documentation: |-
        Copies Github issues to Jira.
