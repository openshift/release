ref:
  as: openstack-k8s-operators-chainsaw
  from: openstack-operator-ci-build-deploy-chainsaw
  commands: openstack-k8s-operators-chainsaw-commands.sh
  resources:
    requests:
      cpu: 1000m
      memory: 100Mi
  timeout: 4h
  env:
    - name: REGISTRY
      default: "quay.rdoproject.org"
      documentation: Registry to push containers built by this step.
    - name: ORGANIZATION
      default: "openstack-k8s-operators"
      documentation: Registry organization to push containers built by this step.
    - name: CEPH_HOSTNETWORK
      default: "true"
      documentation: When enabled, allow to bind the pod to the hostnetwork of the worker node.
    - name: CEPH_DATASIZE
      default: "8Gi"
      documentation: Ceph volumes data size.
    - name: CEPH_TIMEOUT
      default: "90"
      documentation: Timeout in seconds to wait for Ceph cluster to be up.
    - name: SKIP_OLM_UPDATE
      default: "false"
      documentation: |-
        For openstack-operator PRs only: when "true", skip the OLM base->PR minor
        update dance and install the PR CSV directly, then run chainsaw against it.
        Override via the operator repo's .prow_ci.env.
    - name: OPENSTACK_CTLPLANE_BASE_RELEASE
      default: "config/samples/core_v1beta1_openstackcontrolplane_galera_fr1.yaml"
      documentation: |-
        For openstack-operator PRs only: install_yamls sample CR used to deploy the
        control plane on the OPENSTACK_IMG_BASE_RELEASE version before triggering the
        OLM upgrade (has no effect when SKIP_OLM_UPDATE is "true"). Override via the
        operator repo's .prow_ci.env if a different OPENSTACK_IMG_BASE_RELEASE needs
        a different sample CR.
  documentation: |-
    This is a test step that run chainsaw test against openstack service operator under test.
