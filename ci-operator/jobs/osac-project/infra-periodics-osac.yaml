periodics:
- agent: kubernetes
  cluster: app.ci
  cron: 0 3,11 * * *
  decorate: true
  labels:
    ci.openshift.io/role: infra
  name: periodic-osac-enhancements-issue-stale
  spec:
    containers:
    - args:
      - |-
        --query=repo:osac-project/enhancement-proposals
        is:issue
        comments:<2500
        -label:lifecycle/frozen
        -label:lifecycle/stale
        -label:lifecycle/rotten
        -label:tide/merge-blocker
      - --updated=720h
      - --github-app-id=$(GITHUB_APP_ID)
      - --github-app-private-key-path=/etc/github/cert
      - --github-endpoint=http://ghproxy
      - --github-graphql-endpoint=http://ghproxy/graphql
      - --github-org=osac-project
      - |-
        --comment=Inactive enhancement proposals go stale after 30d of inactivity.

        Mark the proposal as fresh by commenting `/remove-lifecycle stale`.
        Stale proposals rot after an additional 7d of inactivity and eventually close.
        Exclude this proposal from closing by commenting `/lifecycle frozen`.

        If this proposal is safe to close now please do so with `/close`.

        /lifecycle stale
      - --template
      - --ceiling=10
      - --confirm
      command:
      - /usr/bin/commenter
      env:
      - name: GITHUB_APP_ID
        valueFrom:
          secretKeyRef:
            key: appid
            name: openshift-prow-github-app
      image: quay.io/openshift/ci:ci_commenter_latest
      imagePullPolicy: Always
      name: ""
      resources:
        requests:
          cpu: 500m
      volumeMounts:
      - mountPath: /etc/github
        name: github-app-credentials
        readOnly: true
    volumes:
    - name: github-app-credentials
      secret:
        secretName: openshift-prow-github-app
