presubmits:
  medik8s/workload-availability-operator:
  - agent: kubernetes
    always_run: true
    branches:
    - ^makefile$
    - ^makefile-
    cluster: build01
    context: ci/prow/5.0-ci-index
    decorate: true
    decoration_config:
      sparse_checkout_files:
      - Dockerfile
    labels:
      ci-operator.openshift.io/variant: "5.0"
      ci.openshift.io/generator: prowgen
      job-release: "5.0"
      pj-rehearse.openshift.io/can-be-rehearsed: "true"
    name: pull-ci-medik8s-workload-availability-operator-makefile-5.0-ci-index
    rerun_command: /test 5.0-ci-index
    spec:
      containers:
      - args:
        - --gcs-upload-secret=/secrets/gcs/service-account.json
        - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
        - --report-credentials-file=/etc/report/credentials
        - --target=ci-index
        - --variant=5.0
        command:
        - ci-operator
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_ci-operator_latest
        imagePullPolicy: Always
        name: ""
        resources:
          requests:
            cpu: 10m
        volumeMounts:
        - mountPath: /secrets/gcs
          name: gcs-credentials
          readOnly: true
        - mountPath: /secrets/manifest-tool
          name: manifest-tool-local-pusher
          readOnly: true
        - mountPath: /etc/pull-secret
          name: pull-secret
          readOnly: true
        - mountPath: /etc/report
          name: result-aggregator
          readOnly: true
      serviceAccountName: ci-operator
      volumes:
      - name: manifest-tool-local-pusher
        secret:
          secretName: manifest-tool-local-pusher
      - name: pull-secret
        secret:
          secretName: registry-pull-credentials
      - name: result-aggregator
        secret:
          secretName: result-aggregator
    trigger: (?m)^/test( | .* )5.0-ci-index,?($|\s.*)
  - agent: kubernetes
    always_run: true
    branches:
    - ^makefile$
    - ^makefile-
    cluster: build01
    context: ci/prow/5.0-images
    decorate: true
    decoration_config:
      sparse_checkout_files:
      - Dockerfile
    labels:
      ci-operator.openshift.io/variant: "5.0"
      ci.openshift.io/generator: prowgen
      job-release: "5.0"
      pj-rehearse.openshift.io/can-be-rehearsed: "true"
    name: pull-ci-medik8s-workload-availability-operator-makefile-5.0-images
    rerun_command: /test 5.0-images
    spec:
      containers:
      - args:
        - --gcs-upload-secret=/secrets/gcs/service-account.json
        - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
        - --report-credentials-file=/etc/report/credentials
        - --target=[images]
        - --variant=5.0
        command:
        - ci-operator
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_ci-operator_latest
        imagePullPolicy: Always
        name: ""
        resources:
          requests:
            cpu: 10m
        volumeMounts:
        - mountPath: /secrets/gcs
          name: gcs-credentials
          readOnly: true
        - mountPath: /secrets/manifest-tool
          name: manifest-tool-local-pusher
          readOnly: true
        - mountPath: /etc/pull-secret
          name: pull-secret
          readOnly: true
        - mountPath: /etc/report
          name: result-aggregator
          readOnly: true
      serviceAccountName: ci-operator
      volumes:
      - name: manifest-tool-local-pusher
        secret:
          secretName: manifest-tool-local-pusher
      - name: pull-secret
        secret:
          secretName: registry-pull-credentials
      - name: result-aggregator
        secret:
          secretName: result-aggregator
    trigger: (?m)^/test( | .* )5.0-images,?($|\s.*)
