presubmits:
  openshift-priv/open-telemetry-opentelemetry-operator:
  - agent: kubernetes
    always_run: true
    branches:
    - ^rhosdt-3\.11$
    - ^rhosdt-3\.11-
    cluster: build01
    context: ci/prow/art-build-ocp-4.23-images
    decorate: true
    decoration_config:
      oauth_token_secret:
        key: oauth
        name: github-credentials-openshift-ci-robot-private-git-cloner
      sparse_checkout_files:
      - Dockerfile.art
      - cmd/otel-allocator/Dockerfile.art
    hidden: true
    labels:
      ci-operator.openshift.io/variant: art-build-ocp-4.23
      ci.openshift.io/generator: prowgen
      job-release: "4.23"
      pj-rehearse.openshift.io/can-be-rehearsed: "true"
    name: pull-ci-openshift-priv-open-telemetry-opentelemetry-operator-rhosdt-3.11-art-build-ocp-4.23-images
    path_alias: github.com/open-telemetry/opentelemetry-operator
    rerun_command: /test art-build-ocp-4.23-images
    spec:
      containers:
      - args:
        - --gcs-upload-secret=/secrets/gcs/service-account.json
        - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
        - --oauth-token-path=/usr/local/github-credentials/oauth
        - --report-credentials-file=/etc/report/credentials
        - --target=[images]
        - --variant=art-build-ocp-4.23
        command:
        - ci-operator
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_ci-operator_latest
        imagePullPolicy: Always
        name: ""
        resources:
          requests:
            cpu: 10m
        volumeMounts:
        - mountPath: /secrets/gcs
          name: gcs-credentials
          readOnly: true
        - mountPath: /usr/local/github-credentials
          name: github-credentials-openshift-ci-robot-private-git-cloner
          readOnly: true
        - mountPath: /secrets/manifest-tool
          name: manifest-tool-local-pusher
          readOnly: true
        - mountPath: /etc/pull-secret
          name: pull-secret
          readOnly: true
        - mountPath: /etc/report
          name: result-aggregator
          readOnly: true
      serviceAccountName: ci-operator
      volumes:
      - name: manifest-tool-local-pusher
        secret:
          secretName: manifest-tool-local-pusher
      - name: pull-secret
        secret:
          secretName: registry-pull-credentials
      - name: result-aggregator
        secret:
          secretName: result-aggregator
    trigger: (?m)^/test( | .* )art-build-ocp-4.23-images,?($|\s.*)
