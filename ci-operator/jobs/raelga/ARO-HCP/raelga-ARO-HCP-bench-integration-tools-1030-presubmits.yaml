presubmits:
  raelga/ARO-HCP:
  - agent: kubernetes
    always_run: false
    branches:
    - ^bench-integration-tools-1030$
    - ^bench-integration-tools-1030-
    cluster: build01
    context: ci/prow/helpers-validation-1030-images
    decorate: true
    decoration_config:
      sparse_checkout_files:
      - .ci-operator.yaml
      - dev-infrastructure/openshift-ci/Dockerfile.nested-podman
    labels:
      ci-operator.openshift.io/variant: helpers-validation-1030
      ci.openshift.io/generator: prowgen
      pj-rehearse.openshift.io/can-be-rehearsed: "true"
    name: pull-ci-raelga-ARO-HCP-bench-integration-tools-1030-helpers-validation-1030-images
    path_alias: github.com/Azure/ARO-HCP
    rerun_command: /test helpers-validation-1030-images
    run_if_changed: ^(dev-infrastructure/openshift-ci/(Dockerfile(\.nested-podman)?|Makefile|smoke-test\.sh|versions\.mk)$|\.bingo/|\.ci-operator\.yaml$|go\.work$)
    spec:
      containers:
      - args:
        - --gcs-upload-secret=/secrets/gcs/service-account.json
        - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
        - --report-credentials-file=/etc/report/credentials
        - --target=[images]
        - --variant=helpers-validation-1030
        command:
        - ci-operator
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_ci-operator_latest
        imagePullPolicy: Always
        name: ""
        resources:
          requests:
            cpu: 10m
        volumeMounts:
        - mountPath: /secrets/gcs
          name: gcs-credentials
          readOnly: true
        - mountPath: /secrets/manifest-tool
          name: manifest-tool-local-pusher
          readOnly: true
        - mountPath: /etc/pull-secret
          name: pull-secret
          readOnly: true
        - mountPath: /etc/report
          name: result-aggregator
          readOnly: true
      serviceAccountName: ci-operator
      volumes:
      - name: manifest-tool-local-pusher
        secret:
          secretName: manifest-tool-local-pusher
      - name: pull-secret
        secret:
          secretName: registry-pull-credentials
      - name: result-aggregator
        secret:
          secretName: result-aggregator
    trigger: (?m)^/test( | .* )helpers-validation-1030-images,?($|\s.*)
  - agent: kubernetes
    always_run: false
    branches:
    - ^bench-integration-tools-1030$
    - ^bench-integration-tools-1030-
    cluster: build11
    context: ci/prow/helpers-validation-1030-nested-podman-smoke-test
    decorate: true
    decoration_config:
      sparse_checkout_files:
      - .ci-operator.yaml
      - dev-infrastructure/openshift-ci/Dockerfile.nested-podman
    labels:
      capability/arm64: arm64
      capability/nested-podman: nested-podman
      ci-operator.openshift.io/cluster: build11
      ci-operator.openshift.io/variant: helpers-validation-1030
      ci.openshift.io/generator: prowgen
      pj-rehearse.openshift.io/can-be-rehearsed: "true"
    name: pull-ci-raelga-ARO-HCP-bench-integration-tools-1030-helpers-validation-1030-nested-podman-smoke-test
    optional: true
    path_alias: github.com/Azure/ARO-HCP
    rerun_command: /test helpers-validation-1030-nested-podman-smoke-test
    run_if_changed: ^$
    spec:
      containers:
      - args:
        - --enable-secrets-store-csi-driver=true
        - --gcs-upload-secret=/secrets/gcs/service-account.json
        - --gsm-config=/etc/gsm-config/gsm-config.yaml
        - --gsm-credentials-file=/etc/gsm-credentials/key.json
        - --gsm-project-config=/etc/gsm-config/gsm-project-config.yaml
        - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
        - --lease-server-credentials-file=/etc/boskos/credentials
        - --report-credentials-file=/etc/report/credentials
        - --target=nested-podman-smoke-test
        - --variant=helpers-validation-1030
        command:
        - ci-operator
        env:
        - name: HTTP_SERVER_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_ci-operator_latest
        imagePullPolicy: Always
        name: ""
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 10m
        volumeMounts:
        - mountPath: /etc/boskos
          name: boskos
          readOnly: true
        - mountPath: /secrets/gcs
          name: gcs-credentials
          readOnly: true
        - mountPath: /etc/gsm-config
          name: gsm-config
          readOnly: true
        - mountPath: /etc/gsm-credentials
          name: gsm-sa-key
          readOnly: true
        - mountPath: /secrets/manifest-tool
          name: manifest-tool-local-pusher
          readOnly: true
        - mountPath: /etc/pull-secret
          name: pull-secret
          readOnly: true
        - mountPath: /etc/report
          name: result-aggregator
          readOnly: true
      serviceAccountName: ci-operator
      volumes:
      - name: boskos
        secret:
          items:
          - key: credentials
            path: credentials
          secretName: boskos-credentials
      - configMap:
          name: gsm-config
        name: gsm-config
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: ci-operator-sa-key-spc
        name: gsm-sa-key
      - name: manifest-tool-local-pusher
        secret:
          secretName: manifest-tool-local-pusher
      - name: pull-secret
        secret:
          secretName: registry-pull-credentials
      - name: result-aggregator
        secret:
          secretName: result-aggregator
    trigger: (?m)^/test( | .* )helpers-validation-1030-nested-podman-smoke-test,?($|\s.*)
