periodics:
- agent: kubernetes
  cluster: build05
  cron: 35 3 2 1,3,5,7,9,11 *
  decorate: true
  decoration_config:
    skip_cloning: true
  extra_refs:
  - base_ref: master
    org: ComplianceAsCode
    repo: compliance-operator
  labels:
    ci-operator.openshift.io/cloud: aws
    ci-operator.openshift.io/cloud-cluster-profile: aws-stackrox
    ci-operator.openshift.io/variant: ocp-4.12
    ci.openshift.io/generator: prowgen
    job-release: "4.12"
    pj-rehearse.openshift.io/can-be-rehearsed: "true"
  name: periodic-ci-ComplianceAsCode-compliance-operator-master-ocp-4.12-e2e-aws-cel-f60
