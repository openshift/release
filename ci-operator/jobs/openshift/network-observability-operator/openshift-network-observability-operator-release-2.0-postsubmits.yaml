postsubmits:
  openshift/network-observability-operator:
  - agent: kubernetes
    always_run: true
    branches:
    - ^release-2\.0$
    cluster: build01
    decorate: true
    decoration_config:
      sparse_checkout_files:
      - .ci-operator.yaml
      - integration-tests/backend/Dockerfile
    labels:
      ci-operator.openshift.io/is-promotion: "true"
      ci.openshift.io/generator: prowgen
    max_concurrency: 1
    name: branch-ci-openshift-network-observability-operator-release-2.0-images
    spec:
      containers:
      - args:
        - --gcs-upload-secret=/secrets/gcs/service-account.json
        - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
        - --image-mirror-push-secret=/etc/push-secret/.dockerconfigjson
        - --promote
        - --report-credentials-file=/etc/report/credentials
        - --target=[images]
        command:
        - ci-operator
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_ci-operator_latest
        imagePullPolicy: Always
        name: ""
        resources:
          requests:
            cpu: 10m
        volumeMounts:
        - mountPath: /secrets/gcs
          name: gcs-credentials
          readOnly: true
        - mountPath: /secrets/manifest-tool
          name: manifest-tool-local-pusher
          readOnly: true
        - mountPath: /etc/pull-secret
          name: pull-secret
          readOnly: true
        - mountPath: /etc/push-secret
          name: push-secret
          readOnly: true
        - mountPath: /etc/report
          name: result-aggregator
          readOnly: true
      serviceAccountName: ci-operator
      volumes:
      - name: manifest-tool-local-pusher
        secret:
          secretName: manifest-tool-local-pusher
      - name: pull-secret
        secret:
          secretName: registry-pull-credentials
      - name: push-secret
        secret:
          secretName: registry-push-credentials-ci-central
      - name: result-aggregator
        secret:
          secretName: result-aggregator
  - agent: kubernetes
    always_run: false
    branches:
    - ^release-2\.0$
    cluster: build10
    decorate: true
    decoration_config:
      skip_cloning: true
      timeout: 10h0m0s
    labels:
      ci-operator.openshift.io/cloud: aws
      ci-operator.openshift.io/cloud-cluster-profile: aws-qe
      ci-operator.openshift.io/variant: nightly-4.14
      ci.openshift.io/generator: prowgen
      job-release: "4.14"
    max_concurrency: 1
    name: branch-ci-openshift-network-observability-operator-release-2.0-nightly-4.14-netobserv-aws-ipi-amd-f60
    reporter_config:
      slack:
        channel: '#team-qe-netobserv'
        job_states_to_report:
        - aborted
        - error
        - failure
        - success
        report_template: '{{ if eq .Status.State "success" }} :green_jenkins_circle:
          {{ else }} :red_jenkins_circle: {{ end }} Job *{{.Spec.Job}}* ended with
          *{{.Status.State}}*. <{{.Status.URL}}|View logs>'
    run_if_changed: ^__manual_zstream_trigger__$
    spec:
      containers:
      - args:
        - --enable-secrets-store-csi-driver=true
        - --gcs-upload-secret=/secrets/gcs/service-account.json
        - --gsm-config=/etc/gsm-config/gsm-config.yaml
        - --gsm-credentials-file=/etc/gsm-credentials/key.json
        - --gsm-project-config=/etc/gsm-config/gsm-project-config.yaml
        - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
        - --lease-server-credentials-file=/etc/boskos/credentials
        - --report-credentials-file=/etc/report/credentials
        - --secret-dir=/secrets/ci-pull-credentials
        - --target=netobserv-aws-ipi-amd-f60
        - --variant=nightly-4.14
        command:
        - ci-operator
        env:
        - name: HTTP_SERVER_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_ci-operator_latest
        imagePullPolicy: Always
        name: ""
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 10m
        volumeMounts:
        - mountPath: /etc/boskos
          name: boskos
          readOnly: true
        - mountPath: /secrets/ci-pull-credentials
          name: ci-pull-credentials
          readOnly: true
        - mountPath: /secrets/gcs
          name: gcs-credentials
          readOnly: true
        - mountPath: /etc/gsm-config
          name: gsm-config
          readOnly: true
        - mountPath: /etc/gsm-credentials
          name: gsm-sa-key
          readOnly: true
        - mountPath: /secrets/manifest-tool
          name: manifest-tool-local-pusher
          readOnly: true
        - mountPath: /etc/pull-secret
          name: pull-secret
          readOnly: true
        - mountPath: /etc/report
          name: result-aggregator
          readOnly: true
      serviceAccountName: ci-operator
      volumes:
      - name: boskos
        secret:
          items:
          - key: credentials
            path: credentials
          secretName: boskos-credentials
      - name: ci-pull-credentials
        secret:
          secretName: ci-pull-credentials
      - configMap:
          name: gsm-config
        name: gsm-config
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: ci-operator-sa-key-spc
        name: gsm-sa-key
      - name: manifest-tool-local-pusher
        secret:
          secretName: manifest-tool-local-pusher
      - name: pull-secret
        secret:
          secretName: registry-pull-credentials
      - name: result-aggregator
        secret:
          secretName: result-aggregator
