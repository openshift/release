presubmits:
  openshift/network-observability-operator:
  - agent: kubernetes
    always_run: true
    branches:
    - ^netobserv-2835$
    - ^netobserv-2835-
    cluster: build01
    context: ci/prow/nightly-4.14-images
    decorate: true
    decoration_config:
      sparse_checkout_files:
      - .ci-operator.yaml
      - integration-tests/backend/Dockerfile
    labels:
      ci-operator.openshift.io/variant: nightly-4.14
      ci.openshift.io/generator: prowgen
      job-release: "4.14"
      pj-rehearse.openshift.io/can-be-rehearsed: "true"
    name: pull-ci-openshift-network-observability-operator-netobserv-2835-nightly-4.14-images
    rerun_command: /test nightly-4.14-images
    spec:
      containers:
      - args:
        - --gcs-upload-secret=/secrets/gcs/service-account.json
        - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
        - --report-credentials-file=/etc/report/credentials
        - --target=[images]
        - --variant=nightly-4.14
        command:
        - ci-operator
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_ci-operator_latest
        imagePullPolicy: Always
        name: ""
        resources:
          requests:
            cpu: 10m
        volumeMounts:
        - mountPath: /secrets/gcs
          name: gcs-credentials
          readOnly: true
        - mountPath: /secrets/manifest-tool
          name: manifest-tool-local-pusher
          readOnly: true
        - mountPath: /etc/pull-secret
          name: pull-secret
          readOnly: true
        - mountPath: /etc/report
          name: result-aggregator
          readOnly: true
      serviceAccountName: ci-operator
      volumes:
      - name: manifest-tool-local-pusher
        secret:
          secretName: manifest-tool-local-pusher
      - name: pull-secret
        secret:
          secretName: registry-pull-credentials
      - name: result-aggregator
        secret:
          secretName: result-aggregator
    trigger: (?m)^/test( | .* )nightly-4.14-images,?($|\s.*)
