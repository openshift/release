periodics:
- agent: kubernetes
  cluster: build11
  cron: 23 9 * * 1
  decorate: true
  decoration_config:
    skip_cloning: true
  extra_refs:
  - base_ref: main
    org: openshift
    repo: sippy
    workdir: true
  - base_ref: main
    org: openshift
    path_alias: github.com/openshift/release
    repo: release
    sparse_checkout_files:
    - ci-operator/config/openshift/sippy/openshift-sippy-main__agentic.yaml
    - ci-operator/config/openshift/origin/openshift-origin-main__agentic.yaml
    - ci-operator/config/openshift-eng/ship-status-dash/openshift-eng-ship-status-dash-main__agentic.yaml
    - ci-operator/step-registry/openshift/agentic/trt/init-model/openshift-agentic-trt-init-model-commands.sh
    - ci-operator/step-registry/openshift/agentic/trt/jira-solver/openshift-agentic-trt-jira-solver-commands.sh
  labels:
    ci-operator.openshift.io/variant: agentic
    ci.openshift.io/generator: prowgen
    pj-rehearse.openshift.io/can-be-rehearsed: "true"
  name: periodic-ci-openshift-sippy-main-agentic-periodic-sippy-devcontainer-dependency-report
  spec:
    containers:
    - args:
      - --enable-secrets-store-csi-driver=true
      - --gcs-upload-secret=/secrets/gcs/service-account.json
      - --gsm-config=/etc/gsm-config/gsm-config.yaml
      - --gsm-credentials-file=/etc/gsm-credentials/key.json
      - --gsm-project-config=/etc/gsm-config/gsm-project-config.yaml
      - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
      - --lease-server-credentials-file=/etc/boskos/credentials
      - --report-credentials-file=/etc/report/credentials
      - --target=periodic-sippy-devcontainer-dependency-report
      - --variant=agentic
      command:
      - ci-operator
      env:
      - name: HTTP_SERVER_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      image: quay-proxy.ci.openshift.org/openshift/ci:ci_ci-operator_latest
      imagePullPolicy: Always
      name: ""
      ports:
      - containerPort: 8080
        name: http
      resources:
        requests:
          cpu: 10m
      volumeMounts:
      - mountPath: /etc/boskos
        name: boskos
        readOnly: true
      - mountPath: /secrets/gcs
        name: gcs-credentials
        readOnly: true
      - mountPath: /etc/gsm-config
        name: gsm-config
        readOnly: true
      - mountPath: /etc/gsm-credentials
        name: gsm-sa-key
        readOnly: true
      - mountPath: /secrets/manifest-tool
        name: manifest-tool-local-pusher
        readOnly: true
      - mountPath: /etc/pull-secret
        name: pull-secret
        readOnly: true
      - mountPath: /etc/report
        name: result-aggregator
        readOnly: true
    serviceAccountName: ci-operator
    volumes:
    - name: boskos
      secret:
        items:
        - key: credentials
          path: credentials
        secretName: boskos-credentials
    - configMap:
        name: gsm-config
      name: gsm-config
    - csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: ci-operator-sa-key-spc
      name: gsm-sa-key
    - name: manifest-tool-local-pusher
      secret:
        secretName: manifest-tool-local-pusher
    - name: pull-secret
      secret:
        secretName: registry-pull-credentials
    - name: result-aggregator
      secret:
        secretName: result-aggregator
