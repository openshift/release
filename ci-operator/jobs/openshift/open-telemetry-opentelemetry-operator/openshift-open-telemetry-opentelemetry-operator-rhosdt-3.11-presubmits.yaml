presubmits:
  openshift/open-telemetry-opentelemetry-operator:
  - agent: kubernetes
    always_run: true
    branches:
    - ^rhosdt-3\.11$
    - ^rhosdt-3\.11-
    cluster: build01
    context: ci/prow/art-build-ocp-4.23-ci-bundle-opentelemetry-bundle
    decorate: true
    decoration_config:
      sparse_checkout_files:
      - Dockerfile.art
      - Dockerfile.ta.art
      - tests/e2e-openshift/Dockerfile
    labels:
      ci-operator.openshift.io/variant: art-build-ocp-4.23
      ci.openshift.io/generator: prowgen
      job-release: "4.23"
      pj-rehearse.openshift.io/can-be-rehearsed: "true"
    name: pull-ci-openshift-open-telemetry-opentelemetry-operator-rhosdt-3.11-art-build-ocp-4.23-ci-bundle-opentelemetry-bundle
    path_alias: github.com/open-telemetry/opentelemetry-operator
    rerun_command: /test art-build-ocp-4.23-ci-bundle-opentelemetry-bundle
    spec:
      containers:
      - args:
        - --gcs-upload-secret=/secrets/gcs/service-account.json
        - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
        - --report-credentials-file=/etc/report/credentials
        - --target=opentelemetry-bundle
        - --variant=art-build-ocp-4.23
        command:
        - ci-operator
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_ci-operator_latest
        imagePullPolicy: Always
        name: ""
        resources:
          requests:
            cpu: 10m
        volumeMounts:
        - mountPath: /secrets/gcs
          name: gcs-credentials
          readOnly: true
        - mountPath: /secrets/manifest-tool
          name: manifest-tool-local-pusher
          readOnly: true
        - mountPath: /etc/pull-secret
          name: pull-secret
          readOnly: true
        - mountPath: /etc/report
          name: result-aggregator
          readOnly: true
      serviceAccountName: ci-operator
      volumes:
      - name: manifest-tool-local-pusher
        secret:
          secretName: manifest-tool-local-pusher
      - name: pull-secret
        secret:
          secretName: registry-pull-credentials
      - name: result-aggregator
        secret:
          secretName: result-aggregator
    trigger: (?m)^/test( | .* )art-build-ocp-4.23-ci-bundle-opentelemetry-bundle,?($|\s.*)
  - agent: kubernetes
    always_run: true
    branches:
    - ^rhosdt-3\.11$
    - ^rhosdt-3\.11-
    cluster: build01
    context: ci/prow/art-build-ocp-4.23-e2e-pre-merge
    decorate: true
    decoration_config:
      sparse_checkout_files:
      - Dockerfile.art
      - Dockerfile.ta.art
      - tests/e2e-openshift/Dockerfile
    labels:
      ci-operator.openshift.io/variant: art-build-ocp-4.23
      ci.openshift.io/generator: prowgen
      job-release: "4.23"
      pj-rehearse.openshift.io/can-be-rehearsed: "true"
    name: pull-ci-openshift-open-telemetry-opentelemetry-operator-rhosdt-3.11-art-build-ocp-4.23-e2e-pre-merge
    path_alias: github.com/open-telemetry/opentelemetry-operator
    rerun_command: /test art-build-ocp-4.23-e2e-pre-merge
    spec:
      containers:
      - args:
        - --enable-secrets-store-csi-driver=true
        - --gcs-upload-secret=/secrets/gcs/service-account.json
        - --gsm-config=/etc/gsm-config/gsm-config.yaml
        - --gsm-credentials-file=/etc/gsm-credentials/key.json
        - --gsm-project-config=/etc/gsm-config/gsm-project-config.yaml
        - --hive-kubeconfig=/secrets/hive-hive-credentials/kubeconfig
        - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
        - --lease-server-credentials-file=/etc/boskos/credentials
        - --report-credentials-file=/etc/report/credentials
        - --secret-dir=/secrets/ci-pull-credentials
        - --target=e2e-pre-merge
        - --variant=art-build-ocp-4.23
        command:
        - ci-operator
        env:
        - name: HTTP_SERVER_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_ci-operator_latest
        imagePullPolicy: Always
        name: ""
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: 10m
        volumeMounts:
        - mountPath: /etc/boskos
          name: boskos
          readOnly: true
        - mountPath: /secrets/ci-pull-credentials
          name: ci-pull-credentials
          readOnly: true
        - mountPath: /secrets/gcs
          name: gcs-credentials
          readOnly: true
        - mountPath: /etc/gsm-config
          name: gsm-config
          readOnly: true
        - mountPath: /etc/gsm-credentials
          name: gsm-sa-key
          readOnly: true
        - mountPath: /secrets/hive-hive-credentials
          name: hive-hive-credentials
          readOnly: true
        - mountPath: /secrets/manifest-tool
          name: manifest-tool-local-pusher
          readOnly: true
        - mountPath: /etc/pull-secret
          name: pull-secret
          readOnly: true
        - mountPath: /etc/report
          name: result-aggregator
          readOnly: true
      serviceAccountName: ci-operator
      volumes:
      - name: boskos
        secret:
          items:
          - key: credentials
            path: credentials
          secretName: boskos-credentials
      - name: ci-pull-credentials
        secret:
          secretName: ci-pull-credentials
      - configMap:
          name: gsm-config
        name: gsm-config
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: ci-operator-sa-key-spc
        name: gsm-sa-key
      - name: hive-hive-credentials
        secret:
          secretName: hive-hive-credentials
      - name: manifest-tool-local-pusher
        secret:
          secretName: manifest-tool-local-pusher
      - name: pull-secret
        secret:
          secretName: registry-pull-credentials
      - name: result-aggregator
        secret:
          secretName: result-aggregator
    trigger: (?m)^/test( | .* )art-build-ocp-4.23-e2e-pre-merge,?($|\s.*)
