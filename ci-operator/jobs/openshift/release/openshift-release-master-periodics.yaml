periodics:
- agent: kubernetes
  cluster: app.ci
  decorate: true
  interval: 6h
  labels:
    ci.openshift.io/role: infra
  name: periodic-ci-openshift-release-master-close-issues
  spec:
    containers:
    - args:
      - |-
        --query=repo:openshift/release
        -label:lifecycle/frozen
        label:lifecycle/rotten
        comments:<2500
      - --updated=360h
      - --token=/etc/oauth/oauth
      - |-
        --comment=Rotten issues in openshift/release close after 15d of inactivity.

        Reopen the issue by commenting `/reopen`.
        Mark the issue as fresh by commenting `/remove-lifecycle rotten`.
        Exclude this issue from closing again by commenting `/lifecycle frozen`.

        /close
      - --template
      - --ceiling=10
      - --confirm
      command:
      - /ko-app/commenter
      image: quay.io/openshift/ci:ci_commenter_latest
      imagePullPolicy: Always
      name: ""
      resources:
        requests:
          cpu: 500m
      volumeMounts:
      - mountPath: /etc/oauth
        name: token
    volumes:
    - name: token
      secret:
        secretName: github-credentials-openshift-bot
- agent: kubernetes
  cluster: build09
  cron: '@yearly'
  decorate: true
  decoration_config:
    timeout: 6h0m0s
  name: periodic-ci-openshift-release-master-nightly-4.11-install-analysis-all
  spec:
    containers:
    - args:
      - --gcs-upload-secret=/secrets/gcs/service-account.json
      - --give-pr-author-access-to-namespace=true
      - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
      - --input-hash=$(BUILD_ID)
      - --input-hash=$(JOB_NAME)
      - --lease-server-credentials-file=/etc/boskos/credentials
      - --report-credentials-file=/etc/report/credentials
      - --secret-dir=/usr/local/pull-secret
      - --target=release-payload-install-analysis
      command:
      - ci-operator
      env:
      - name: GOOGLE_SA_CREDENTIAL_FILE
        value: /var/run/secrets/google-serviceaccount-credentials.json
      - name: JOB_START_TIME
      - name: PAYLOAD_TAG
      - name: UNRESOLVED_CONFIG
        value: |
          resources:
            '*':
              limits:
                memory: 6Gi
              requests:
                cpu: 100m
                memory: 200Mi
          tests:
          - as: release-payload-install-analysis
            steps:
              env:
                GOOGLE_SA_CREDENTIAL_FILE: "$(GOOGLE_SA_CREDENTIAL_FILE)"
                JOB_START_TIME: "$(JOB_START_TIME)"
                PAYLOAD_TAG: "$(PAYLOAD_TAG)"
                WORKING_DIR: "$(ARTIFACT_DIR)/release-analysis-install-analysis"
                JOB_CONFIGURATION: |
                  aws-ovn-ipi,1,--platform=aws --network=ovn --infrastructure=ipi
                  aws-proxy,1,--include-job-names=ovn-proxy
                  aws-sdn-ipi,1,--platform=aws --network=sdn --infrastructure=ipi
                  aws-techpreview,1,--platform=aws --include-job-names=techpreview
                  azure-ovn-ipi,1,--platform=azure --network=ovn --infrastructure=ipi
                  azure-techpreview,1,--platform=azure --include-job-names=techpreview
                  gcp-sdn-ipi,1,--platform=gcp --network=sdn --infrastructure=ipi
                  gcp-techpreview,1,--platform=gcp --include-job-names=techpreview
                  metal-ovn-ipi,1,--platform=metal --network=ovn --infrastructure=ipi
                  metal-sdn-ipi,1,--platform=metal --network=sdn --infrastructure=ipi
                  vsphere-ovn-upi,1,--platform=vsphere --network=ovn --infrastructure=upi
                  vsphere-sdn-ipi,1,--platform=vsphere --network=sdn --infrastructure=ipi
              test:
              - ref: openshift-release-analysis-test-case-analysis
      image: quay-proxy.ci.openshift.org/openshift/ci:ci_ci-operator_latest
      imagePullPolicy: Always
      name: aggregator-check-install
      resources:
        requests:
          cpu: 10m
      volumeMounts:
      - mountPath: /etc/boskos
        name: boskos
        readOnly: true
      - mountPath: /usr/local/e2e-aws-upgrade-cluster-profile
        name: cluster-profile
      - mountPath: /secrets/gcs
        name: gcs-credentials
        readOnly: true
      - mountPath: /secrets/manifest-tool
        name: manifest-tool-local-pusher
        readOnly: true
      - mountPath: /etc/pull-secret
        name: pull-secret
        readOnly: true
      - mountPath: /usr/local/pull-secret
        name: release-pull-secret
      - mountPath: /etc/report
        name: result-aggregator
        readOnly: true
    serviceAccountName: ci-operator
    volumes:
    - name: boskos
      secret:
        items:
        - key: credentials
          path: credentials
        secretName: boskos-credentials
    - name: cluster-profile
      projected:
        sources:
        - secret:
            name: cluster-secrets-aws
    - name: manifest-tool-local-pusher
      secret:
        secretName: manifest-tool-local-pusher
    - name: pull-secret
      secret:
        secretName: registry-pull-credentials
    - name: release-pull-secret
      secret:
        secretName: ci-pull-credentials
    - name: result-aggregator
      secret:
        secretName: result-aggregator
