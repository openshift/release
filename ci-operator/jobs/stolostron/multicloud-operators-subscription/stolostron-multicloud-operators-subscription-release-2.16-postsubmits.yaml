      - name: boskos
        secret:
          items:
          - key: credentials
            path: credentials
          secretName: boskos-credentials
      - configMap:
          name: gsm-config
        name: gsm-config
      - csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: ci-operator-sa-key-spc
        name: gsm-sa-key
      - name: manifest-tool-local-pusher
