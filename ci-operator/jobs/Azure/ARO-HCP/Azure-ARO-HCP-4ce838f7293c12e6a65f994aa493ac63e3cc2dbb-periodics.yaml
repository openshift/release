  name: periodic-ci-Azure-ARO-HCP-4ce838f7293c12e6a65f994aa493ac63e3cc2dbb-mega-control-1029-baseline-shared-integration
  spec:
    containers:
    - args:
      - --enable-secrets-store-csi-driver=true
      - --gcs-upload-secret=/secrets/gcs/service-account.json
      - --gsm-config=/etc/gsm-config/gsm-config.yaml
      - --gsm-credentials-file=/etc/gsm-credentials/key.json
      - --gsm-project-config=/etc/gsm-config/gsm-project-config.yaml
      - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
      - --lease-server-credentials-file=/etc/boskos/credentials
      - --report-credentials-file=/etc/report/credentials
      - --target=integration
      - --variant=mega-control-1029-baseline-shared
      command:
      - /bin/bash
      - -c
      - |
        set -o errexit
        set -o nounset
        set -o pipefail
        artifact_root="${ARTIFACTS:?}"
        mkdir -p "${artifact_root}/seed" "${artifact_root}/warm"
        printf '%s\n' "${JOB_SPEC:?}" > "${artifact_root}/shared-job-spec.json"
        seed_args=("$@")
        warm_args=()
        target_count=0
        for arg in "$@"; do
            if [ "${arg}" = "--target=integration" ]; then
                warm_args+=("--target=mega-linter")
                target_count=$((target_count + 1))
            else
                warm_args+=("${arg}")
            fi
        done
        test "${target_count}" -eq 1
        printf '%s' "${JOB_SPEC}" | sha256sum > "${artifact_root}/seed/job-spec.sha256"
        printf '%q ' ci-operator "${seed_args[@]}" > "${artifact_root}/seed/operator-argv.txt"
        seed_start="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
        printf 'MEGA_BENCHMARK_NATIVE_START phase=seed utc=%s\n' "${seed_start}"
        printf '{"phase":"seed","event":"start","utc":"%s"}\n' "${seed_start}" >> "${artifact_root}/shared-native-events.jsonl"
        set +o errexit
        ARTIFACTS="${artifact_root}/seed" ci-operator "${seed_args[@]}"
        seed_status=$?
        seed_end="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
        set -o errexit
        printf 'MEGA_BENCHMARK_NATIVE_END phase=seed utc=%s exit=%s\n' "${seed_end}" "${seed_status}"
        printf '{"phase":"seed","event":"end","utc":"%s","exit":%s}\n' "${seed_end}" "${seed_status}" >> "${artifact_root}/shared-native-events.jsonl"
        printf '%s\n' "${seed_status}" > "${artifact_root}/seed/native-exit-status.txt"
        if [ "${seed_status}" -ne 0 ]; then
            printf '{"phase":"warm","event":"skipped","reason":"integration-failed"}\n' >> "${artifact_root}/shared-native-events.jsonl"
            exit "${seed_status}"
        fi
        printf '%s' "${JOB_SPEC}" | sha256sum > "${artifact_root}/warm/job-spec.sha256"
        printf '%q ' ci-operator "${warm_args[@]}" > "${artifact_root}/warm/operator-argv.txt"
        warm_start="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
        printf 'MEGA_BENCHMARK_NATIVE_START phase=warm utc=%s\n' "${warm_start}"
        printf '{"phase":"warm","event":"start","utc":"%s"}\n' "${warm_start}" >> "${artifact_root}/shared-native-events.jsonl"
        set +o errexit
        ARTIFACTS="${artifact_root}/warm" ci-operator "${warm_args[@]}"
        warm_status=$?
        warm_end="$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)"
        set -o errexit
        printf 'MEGA_BENCHMARK_NATIVE_END phase=warm utc=%s exit=%s\n' "${warm_end}" "${warm_status}"
        printf '{"phase":"warm","event":"end","utc":"%s","exit":%s}\n' "${warm_end}" "${warm_status}" >> "${artifact_root}/shared-native-events.jsonl"
        printf '%s\n' "${warm_status}" > "${artifact_root}/warm/native-exit-status.txt"
        exit "${warm_status}"
