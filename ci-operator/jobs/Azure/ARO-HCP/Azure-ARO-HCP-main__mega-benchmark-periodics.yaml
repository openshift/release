                  : args.interval, \"polls\": polls, \"stop_signals\": stop_signal,\n      \
                  \  \"scope\": \"actual shellcheck/yamllint process file operands under /tmp/lint;\
                  \ config option arguments excluded\",\n        \"coverage_complete\": all(row[\"\
                  all_argv_complete\"] and row[\"file_count\"] > 0 for row in linters.values()),\n\
                  \        \"linters\": linters, \"observations\": captured, \"read_errors\"\
                  : errors}\n    temporary = output.with_name(output.name + \".tmp.\" + str(os.getpid()))\n\
                  \    temporary.write_text(json.dumps(result, indent=2, ensure_ascii=True)\
                  \ + \"\\n\")\n    os.replace(temporary, output)\n    if args.ready_file:\n\
                  \        pathlib.Path(args.ready_file).unlink(missing_ok=True)\n    return\
                  \ 0\n\n\nif __name__ == \"__main__\":\n    raise SystemExit(main())\n\nMEGA_PROCESS_OBSERVER\n\
                  observer_ready=\"/tmp/mega-observer.${BASHPID}.ready\"\npython3 /tmp/mega-process-inventory.py\
                  \ --output \"${benchmark_artifacts}/process-inventory.json\" --ready-file\
