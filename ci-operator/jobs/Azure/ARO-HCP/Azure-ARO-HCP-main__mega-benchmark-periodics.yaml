                  \      if not cwd:\n            return None\n        value = posixpath.join(cwd,\
                  \ value)\n    value = posixpath.normpath(value)\n    if not value.startswith(\"\
                  /tmp/lint/\"):\n        return None\n    value = value[len(\"/tmp/lint/\"\
                  ):]\n    if any(part in NOISE for part in value.split(\"/\")):\n        return\
                  \ None\n    return value\n\n\ndef files_from_argv(key, argv, offset, cwd):\n\
                  \    # Exact option arities for the two observed CLI tools. Attached values\
                  \ and\n    # --option=value cannot become file operands. In particular, YAML\
                  \ -c config\n    # is excluded even though its value is itself a YAML path\
