                  , \"--config-data\", \"-f\", \"--format\"} if key == \"YAML_YAMLLINT\" else\
                  \ {\"-s\", \"--shell\", \"-e\", \"--exclude\", \"-i\", \"--include\", \"-P\"\
                  , \"--source-path\", \"-f\", \"--format\", \"-S\", \"--severity\", \"-o\"\
                  , \"--enable\", \"--rcfile\", \"-W\", \"--wiki-link-count\"}\n    result,\
                  \ rejected, operands, skip, options = [], [], [], False, True\n    for argument\
                  \ in argv[offset:]:\n        if skip:\n            skip = False\n        \
                  \    continue\n        if options and argument == \"--\":\n            options\
                  \ = False\n            continue\n        if options and argument in value_options:\n\
                  \            skip = True\n            continue\n        if options and argument.startswith(\"\
                  -\") and argument != \"-\":\n            continue\n        operands.append(argument)\n\
                  \        path = normalized_file(argument, cwd)\n        if path is None:\n\
                  \            rejected.append(argument)\n        else:\n            result.append(path)\n\
                  \    return sorted(set(result)), operands, rejected\n\n\ndef now():\n    return\
                  \ datetime.datetime.now(datetime.timezone.utc).isoformat().replace(\"+00:00\"\
                  , \"Z\")\n\n\ndef main():\n    parser = argparse.ArgumentParser(description=__doc__,\
                  \ formatter_class=argparse.RawDescriptionHelpFormatter)\n    parser.add_argument(\"\
                  --output\", required=True)\n    parser.add_argument(\"--ready-file\")\n  \
                  \  parser.add_argument(\"--interval\", type=float, default=0.25)\n    parser.add_argument(\"\
                  --duration\", type=float, help=\"Optional maximum observation duration in\
                  \ seconds\")\n    args = parser.parse_args()\n    if args.interval <= 0 or\
                  \ (args.duration is not None and args.duration <= 0):\n        parser.error(\"\
                  interval and duration must be positive\")\n    output = pathlib.Path(args.output).absolute()\n\
                  \    if str(output).startswith((\"/tmp/lint/\", \"/github/workspace/\")):\n\
                  \        parser.error(\"observer output must be outside the lint workspace\"\
                  )\n    output.parent.mkdir(parents=True, exist_ok=True)\n    stopped = threading.Event()\n\
                  \    stop_signal = []\n    def stop(number, _frame):\n        stop_signal.append(number)\n\
                  \        stopped.set()\n    signal.signal(signal.SIGTERM, stop)\n    signal.signal(signal.SIGINT,\
                  \ stop)\n    start, started = time.monotonic(), now()\n    observations, errors\
                  \ = {}, {}\n    polls = 0\n    # Ready is emitted only after handlers/output\
                  \ directory are initialized.\n    if args.ready_file:\n        ready = pathlib.Path(args.ready_file)\n\
                  \        ready.parent.mkdir(parents=True, exist_ok=True)\n        ready.write_text(str(os.getpid())\
                  \ + \"\\n\")\n    while not stopped.is_set():\n        tick = time.monotonic()\n\
                  \        polls += 1\n        try:\n            entries = os.scandir(\"/proc\"\
                  )\n            with entries:\n                for entry in entries:\n    \
                  \                if not entry.name.isdigit():\n                        continue\n\
                  \                    proc = pathlib.Path(\"/proc\") / entry.name\n       \
                  \             try:\n                        raw = (proc / \"cmdline\").read_bytes()\n\
                  \                        argv = [value.decode(\"utf-8\", \"surrogateescape\"\
                  ) for value in raw.rstrip(b\"\\0\").split(b\"\\0\")] if raw else []\n    \
                  \                    identity = identify(argv)\n                        if\
                  \ identity is None:\n                            continue\n              \
                  \          key, offset = identity\n                        stat = (proc /\
                  \ \"stat\").read_text()\n                        start_ticks = stat[stat.rfind(\"\
                  )\") + 2:].split()[19]\n                        token = (int(entry.name),\
                  \ start_ticks, hashlib.sha256(raw).hexdigest())\n                        timestamp\
                  \ = now()\n                        if token in observations:\n           \
                  \                 observations[token][\"last_seen\"] = timestamp\n       \
                  \                     observations[token][\"samples\"] += 1\n            \
                  \                continue\n                        cwd = os.readlink(proc\
                  \ / \"cwd\")\n                        files, operands, rejected = files_from_argv(key,\
                  \ argv, offset, cwd)\n                        observations[token] = {\"pid\"\
                  : int(entry.name), \"process_start_ticks\": start_ticks, \"linter\": key,\n\
                  \                            \"argv\": argv, \"argv_sha256\": token[2], \"\
                  cwd\": cwd, \"first_seen\": timestamp, \"last_seen\": timestamp, \"samples\"\
                  : 1,\n                            \"file_operands\": operands, \"files\":\
                  \ files, \"rejected_operands\": rejected,\n                            \"\
                  file_count\": len(files), \"argv_complete\": bool(files) and not rejected}\n\
                  \                    except (FileNotFoundError, ProcessLookupError):\n   \
                  \                     continue\n                    except (PermissionError,\
                  \ OSError, ValueError, IndexError) as error:\n                        label\
                  \ = type(error).__name__ + \": \" + str(error)\n                        errors[label]\
                  \ = errors.get(label, 0) + 1\n        except OSError as error:\n         \
                  \   errors[str(error)] = errors.get(str(error), 0) + 1\n        if args.duration\
                  \ is not None and time.monotonic() - start >= args.duration:\n           \
                  \ break\n        stopped.wait(max(0, args.interval - (time.monotonic() - tick)))\n\
                  \    captured = sorted(observations.values(), key=lambda row: (row[\"linter\"\
