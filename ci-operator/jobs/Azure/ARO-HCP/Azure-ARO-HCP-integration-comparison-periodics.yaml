periodics:
- agent: kubernetes
  cluster: build11
  decorate: true
  decoration_config:
    skip_cloning: true
    timeout: 2h0m0s
  extra_refs:
  - base_ref: main
    base_sha: fd1de5ff668be9ea62b422f8b6d94615c1d68481
    org: Azure
    repo: ARO-HCP
    workdir: true
  interval: 720h
  labels:
    capability/arm64: arm64
    capability/nested-podman: nested-podman
    pj-rehearse.openshift.io/can-be-rehearsed: "true"
  name: periodic-ci-Azure-ARO-HCP-main-integration-comparison-copy
  spec:
    containers:
    - args:
      - --enable-secrets-store-csi-driver=true
      - --gcs-upload-secret=/secrets/gcs/service-account.json
      - --gsm-config=/etc/gsm-config/gsm-config.yaml
      - --gsm-credentials-file=/etc/gsm-credentials/key.json
      - --gsm-project-config=/etc/gsm-config/gsm-project-config.yaml
      - --image-import-pull-secret=/etc/pull-secret/.dockerconfigjson
      - --lease-server-credentials-file=/etc/boskos/credentials
      - --report-credentials-file=/etc/report/credentials
      - --target=integration
      command:
      - ci-operator
      env:
      - name: HTTP_SERVER_IP
        valueFrom:
          fieldRef:
            fieldPath: status.podIP
      - name: UNRESOLVED_CONFIG
        value: |
          base_images:
            nested-podman:
              name: aro-hcp-ci-images
              namespace: aro-hcp
              tag: aro-hcp-nested-podman-ci
          build_root:
            image_stream_tag:
              name: aro-hcp-ci-images
              namespace: aro-hcp
              tag: aro-hcp-e2e-base-ci
          images:
            items:
            - dockerfile_literal: |
                FROM nested-podman
                COPY --chown=1000:0 /src /opt/app-root/src/github.com/Azure
                WORKDIR /opt/app-root/src/github.com/Azure/ARO-HCP
              from: nested-podman
              inputs:
                src-aro:
                  paths:
                  - destination_dir: src
                    source_path: /go/src/github.com/Azure/ARO-HCP
              ref: aro
              to: nested-podman-src
          raw_steps:
          - source_step:
              clonerefs_path: /ko-app/clonerefs
              from: root
              pull_spec: quay-proxy.ci.openshift.org/openshift/ci@sha256:c4ae6b5b100e76cea7a191ae195f3059c3b31214e428eb1618ce8110cf553df2
              ref: Azure.ARO-HCP
              to: src-aro
          resources:
            '*':
              limits:
                memory: 6Gi
              requests:
                cpu: '3'
                memory: 6Gi
          tests:
          - as: integration
            capabilities:
            - nested-podman
            - arm64
            disable_pod_scaler: true
            nested_podman: true
            steps:
              test:
              - as: aro-hcp-frontend-run-integration-tests
                commands: '#!/bin/bash

                  # Create an ARO HCP Cluster + Node pool using bicep.

                  set -o errexit

                  set -o nounset

                  set -o pipefail


                  set -x # Turn on command tracing


                  export GOPATH=/opt/app-root

                  go install gotest.tools/gotestsum@latest

                  export PATH=${PATH}:"${GOPATH}/bin"

                  export AZURE_TOKEN_CREDENTIALS=prod


                  test-integration/hack/start-cosmos-emulator.sh

                  test-integration/hack/test-integration.sh

                  test-integration/hack/stop-cosmos-emulator.sh

                  '
                from: nested-podman-src
                nested_podman: true
                resources:
                  requests:
                    cpu: '6'
                    memory: 4Gi
          zz_generated_metadata:
            branch: main
            org: Azure
            repo: ARO-HCP
      image: quay-proxy.ci.openshift.org/openshift/ci@sha256:c2abd31836b9f43a8232b167f03517943d00b0a2af8db71e7aa203d43f84d476
      imagePullPolicy: Always
      name: ""
      ports:
      - containerPort: 8080
        name: http
      resources:
        requests:
          cpu: 10m
      volumeMounts:
      - mountPath: /etc/boskos
        name: boskos
        readOnly: true
      - mountPath: /secrets/gcs
        name: gcs-credentials
        readOnly: true
      - mountPath: /etc/gsm-config
        name: gsm-config
        readOnly: true
      - mountPath: /etc/gsm-credentials
        name: gsm-sa-key
        readOnly: true
      - mountPath: /secrets/manifest-tool
        name: manifest-tool-local-pusher
        readOnly: true
      - mountPath: /etc/pull-secret
        name: pull-secret
        readOnly: true
      - mountPath: /etc/report
        name: result-aggregator
        readOnly: true
    serviceAccountName: ci-operator
    volumes:
    - name: boskos
      secret:
        items:
        - key: credentials
          path: credentials
        secretName: boskos-credentials
    - configMap:
        name: gsm-config
      name: gsm-config
    - csi:
        driver: secrets-store.csi.k8s.io
        readOnly: true
        volumeAttributes:
          secretProviderClass: ci-operator-sa-key-spc
      name: gsm-sa-key
    - name: manifest-tool-local-pusher
      secret:
        secretName: manifest-tool-local-pusher
    - name: pull-secret
      secret:
        secretName: registry-pull-credentials
    - name: result-aggregator
      secret:
        secretName: result-aggregator
