build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
releases:
  latest:
    integration:
      name: "4.18"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 256Mi
tests:
- as: pr-age-monitor
  cron: 0 9 * * 1-5
  reporter_config:
    channel: '#forum-ocp-splat-alerts'
    job_states_to_report:
    - failure
    - error
    report_template: PR Age Monitor detected threshold violations. <{{.Status.URL}}|View
      logs>
  steps:
    test:
    - as: monitor
      commands: |
        make build
        GITHUB_TOKEN=$(cat /tmp/secret/token) ./bin/pr-monitor --config config/repos.yaml
      credentials:
      - mount_path: /tmp/secret
        name: ci-cluster-monitor-github-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
- as: vm-orphan-monitor
  cluster: build01
  cron: 0 */4 * * *
  reporter_config:
    channel: '#forum-ocp-splat-alerts'
    job_states_to_report:
    - failure
    - error
    report_template: VM Orphan Monitor job failed. <{{.Status.URL}}|View logs>
  steps:
    cluster_profile: nutanix
    test:
    - as: monitor
      commands: |
        set +x
        source /tmp/nutanix-creds/secrets.sh
        echo "=== Testing API with credentials ==="
        HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 10 \
          -u "${prism_central_username}:${prism_central_password}" \
          "https://${prism_central_host}:${prism_central_port}/api/vmm/v4.0/ahv/config/vms?%24page=0&%24limit=1")
        echo "API response code: ${HTTP_CODE}"
        echo "=== Testing OPTIONS (what SDK does) ==="
        HTTP_CODE2=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 10 \
          -X OPTIONS \
          "https://${prism_central_host}:${prism_central_port}/api/vmm/unversioned/info")
        echo "OPTIONS response code: ${HTTP_CODE2}"
        echo "=== OPTIONS response body ==="
        curl -sk --connect-timeout 10 -X OPTIONS \
          "https://${prism_central_host}:${prism_central_port}/api/vmm/unversioned/info" 2>&1 | head -20
        echo "=== SSL_CERT_FILE test ==="
        export SSL_CERT_FILE="${CLUSTER_PROFILE_DIR}/prismcentral.pem"
        HTTP_CODE3=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 \
          -u "${prism_central_username}:${prism_central_password}" \
          --cacert "${SSL_CERT_FILE}" \
          "https://${prism_central_host}:${prism_central_port}/api/vmm/v4.0/ahv/config/vms?%24page=0&%24limit=1")
        echo "API with CA cert response code: ${HTTP_CODE3}"
        set -x
        echo "=== Done ==="
      credentials:
      - mount_path: /tmp/nutanix-creds
        name: nutanix-pc
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
zz_generated_metadata:
  branch: main
  org: openshift-splat-team
  repo: ci-cluster-monitor
  variant: periodics
