build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
releases:
  latest:
    integration:
      name: "4.18"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 256Mi
tests:
- as: pr-age-monitor
  cron: 0 9 * * 1-5
  reporter_config:
    channel: '#forum-ocp-splat-alerts'
    job_states_to_report:
    - failure
    - error
    report_template: PR Age Monitor detected threshold violations. <{{.Status.URL}}|View
      logs>
  steps:
    test:
    - as: monitor
      commands: |
        make build
        GITHUB_TOKEN=$(cat /tmp/secret/token) ./bin/pr-monitor --config config/repos.yaml
      credentials:
      - mount_path: /tmp/secret
        name: ci-cluster-monitor-github-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
- as: vm-orphan-monitor
  cluster: build01
  cron: 0 */4 * * *
  reporter_config:
    channel: '#forum-ocp-splat-alerts'
    job_states_to_report:
    - failure
    - error
    report_template: VM Orphan Monitor job failed. <{{.Status.URL}}|View logs>
  steps:
    cluster_profile: nutanix
    test:
    - as: monitor
      commands: |
        echo "=== Cluster profile contents ==="
        ls -la "${CLUSTER_PROFILE_DIR}/"
        echo "=== Checking vault path ==="
        ls -la /var/run/vault/nutanix/ 2>/dev/null || echo "No vault mount at /var/run/vault/nutanix/"
        echo "=== Done ==="
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
zz_generated_metadata:
  branch: main
  org: openshift-splat-team
  repo: ci-cluster-monitor
  variant: periodics
