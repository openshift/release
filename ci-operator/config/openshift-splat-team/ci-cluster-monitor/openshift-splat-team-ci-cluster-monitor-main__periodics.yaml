build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
releases:
  latest:
    integration:
      name: "4.18"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 256Mi
tests:
- as: pr-age-monitor
  cron: 0 9 * * 1-5
  reporter_config:
    channel: '#forum-ocp-splat-alerts'
    job_states_to_report:
    - failure
    - error
    report_template: PR Age Monitor detected threshold violations. <{{.Status.URL}}|View
      logs>
  steps:
    test:
    - as: monitor
      commands: |
        make build
        GITHUB_TOKEN=$(cat /tmp/secret/token) ./bin/pr-monitor --config config/repos.yaml
      credentials:
      - mount_path: /tmp/secret
        name: ci-cluster-monitor-github-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
- as: vm-orphan-monitor
  cluster: build01
  cron: 0 */4 * * *
  reporter_config:
    channel: '#forum-ocp-splat-alerts'
    job_states_to_report:
    - failure
    - error
    report_template: VM Orphan Monitor job failed. <{{.Status.URL}}|View logs>
  steps:
    cluster_profile: nutanix
    test:
    - as: monitor
      commands: |
        set +x
        PC_HOST="prismcentral.sts2-cluster.internal.nutanix-dev.devcluster.openshift.com"
        PC_PORT="9440"
        USERNAME=$(cat /tmp/nutanix-creds/nutanix-username)
        PASSWORD=$(cat /tmp/nutanix-creds/nutanix-password)
        set -x
        echo "=== Connectivity to sts2 ==="
        curl -sk --connect-timeout 10 "https://${PC_HOST}:${PC_PORT}" && echo "Base reachable" || echo "Base unreachable"
        echo "=== API test ==="
        set +x
        HTTP_CODE=$(curl -sk -o /dev/null -w "%{http_code}" --connect-timeout 10 \
          -u "${USERNAME}:${PASSWORD}" \
          "https://${PC_HOST}:${PC_PORT}/api/vmm/v4.0/ahv/config/vms?%24page=0&%24limit=1")
        set -x
        echo "API response code: ${HTTP_CODE}"
        echo "=== Done ==="
      credentials:
      - mount_path: /tmp/nutanix-creds
        name: ci-cluster-monitor-nutanix-creds
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
zz_generated_metadata:
  branch: main
  org: openshift-splat-team
  repo: ci-cluster-monitor
  variant: periodics
