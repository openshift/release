base_images:
  base:
    name: ubi-minimal
    namespace: ocp
    tag: "9"
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  system-tests-builder:
    name: builder
    namespace: konveyor
    tag: ubi9-v1.27
binary_build_commands: make build
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    from: base
    to: self-node-remediation
  - dockerfile_literal: |
      FROM system-tests-builder AS go-builder
      FROM quay.io/operator-framework/operator-sdk@sha256:1b37b208f424e5abec0dc2045b54d3942e2eb03e085f48baf19aff7e5a333d84 AS operator-sdk
      FROM nested-podman
      USER 0
      RUN dnf install -y git make skopeo jq findutils tar gzip gettext && dnf clean all
      COPY --from=go-builder /opt/app-root/src/go /opt/app-root/src/go
      COPY --from=operator-sdk /usr/local/bin/operator-sdk /usr/local/bin/operator-sdk
      ENV GOROOT=/opt/app-root/src/go
      ENV PATH=/opt/app-root/src/go/bin:$PATH
      COPY snr-src/ /opt/snr-ci-src/
    from: nested-podman
    inputs:
      src:
        paths:
        - destination_dir: snr-src/
          source_path: /go/src/github.com/medik8s/self-node-remediation/.
      system-tests-builder:
        as:
        - system-tests-builder
    to: snr-upgrade-test-runner
  - dockerfile_literal: |
      FROM system-tests-builder AS go-builder
      FROM nested-podman
      USER 0
      RUN dnf install -y git make skopeo jq findutils tar gzip && dnf clean all
      COPY --from=go-builder /opt/app-root/src/go /opt/app-root/src/go
      ENV GOROOT=/opt/app-root/src/go
      ENV PATH=/opt/app-root/src/go/bin:$PATH
    from: nested-podman
    inputs:
      system-tests-builder:
        as:
        - system-tests-builder
    to: fbc-upgrade-test-runner
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 500Mi
tests:
- always_run: false
  as: e2e-system-tests-snr-upgrade
  capabilities:
  - nested-podman
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      TEST_NAME: e2e-system-tests-snr-upgrade
      TEST_STEPS: run-snr-upgrade-tests
    post:
    - ref: medik8s-analyze-e2e-failure
    test:
    - as: run-snr-upgrade-tests
      cli: latest
      commands: |
        set -o errexit -o nounset -o pipefail

        : "${ARTIFACT_DIR:?ci-operator must provide ARTIFACT_DIR}"
        exec > >(tee "$ARTIFACT_DIR/snr-upgrade-tests.log") 2>&1

        prepare_runtime() {
          # Give skopeo the cluster's Red Hat registry credentials.
          echo '==> Read cluster pull secret for Red Hat registry access'
          local auth_dir=/tmp/snr-registry-auth
          mkdir -p "$auth_dir"
          oc get secret pull-secret -n openshift-config -o jsonpath='{.data.\.dockerconfigjson}' |
            base64 --decode > "$auth_dir/auth.json"
          chmod 0600 "$auth_dir/auth.json"
          export REGISTRY_AUTH_FILE="$auth_dir/auth.json"

          # The test container runs as an arbitrary UID.
          export GOPATH=/tmp/snr-go
          export GOMODCACHE="$GOPATH/pkg/mod"
          export GOCACHE=/tmp/snr-go-build-cache
          mkdir -p "$GOMODCACHE" "$GOCACHE"

          go version
          skopeo --version
          operator-sdk version
          podman version
          podman info

          echo '==> Configure rootless Podman for the catalog base image UID'
          local storage_config
          storage_config="$(podman info --format '{{.Store.ConfigFile}}')"
          test -r "$storage_config"
          export CONTAINERS_STORAGE_CONF=/tmp/snr-storage.conf
          awk '
            /^\[storage.options.overlay\]$/ {
              in_overlay=1; found=1; print; print "ignore_chown_errors = \"true\""; next
            }
            /^\[/ { in_overlay=0 }
            in_overlay && /^[[:space:]]*ignore_chown_errors[[:space:]]*=/ { next }
            { print }
            END { if (!found) { print "[storage.options.overlay]"; print "ignore_chown_errors = \"true\"" } }
          ' "$storage_config" > "$CONTAINERS_STORAGE_CONF"
          test "$(podman info --format '{{.Store.ConfigFile}}')" = "$CONTAINERS_STORAGE_CONF"
          echo '==> Pull catalog base image before building the candidate'
          podman pull quay.io/operator-framework/opm:latest
        }

        build_candidate() {
          # Build operator, bundle, then catalog.
          echo '==> Copy the CI-selected SNR checkout into a writable build directory'
          test -f /opt/snr-ci-src/Makefile
          cp -R /opt/snr-ci-src /tmp/snr-source

          local revision prefix operator_tag bundle_tag catalog_tag
          revision="$(git -C /tmp/snr-source rev-parse HEAD)"
          git -C /tmp/snr-source show --no-patch --format=fuller HEAD
          printf '%s\n' "$revision" > "$ARTIFACT_DIR/snr-source-commit.txt"

          cd /tmp/snr-source
          # Reuse the runner's SDK only when it matches this checkout's tool pin.
          local sdk_version required_sdk_version
          sdk_version="$(operator-sdk version | sed -n 's/^operator-sdk version: "\([^"]*\)".*/\1/p')"
          required_sdk_version="$(sed -n 's/^OPERATOR_SDK_VERSION[[:space:]]*[?]*=[[:space:]]*//p' Makefile)"
          printf 'Operator SDK: %s; required by source: %s\n' "$sdk_version" "$required_sdk_version"
          test -n "$required_sdk_version" && test "$sdk_version" = "$required_sdk_version"

          export SNR_VERSION
          SNR_VERSION="$(sed -n 's/^DEFAULT_VERSION := //p' Makefile)"
          test -n "$SNR_VERSION"
          export SNR_PREVIOUS_VERSION
          SNR_PREVIOUS_VERSION="$(skopeo list-tags docker://registry.redhat.io/workload-availability/self-node-remediation-operator-bundle |
            jq -r '.Tags[] | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' | sort -V | tail -n 1)"
          test -n "$SNR_PREVIOUS_VERSION"
          SNR_PREVIOUS_VERSION="${SNR_PREVIOUS_VERSION#v}"
          test "$SNR_VERSION" != "$SNR_PREVIOUS_VERSION"
          printf 'Candidate: %s; latest GA: %s\n' "$SNR_VERSION" "$SNR_PREVIOUS_VERSION"

          prefix="ttl.sh/snr-prow-$(date +%Y%m%d-%H%M%S)-${revision:0:7}"
          operator_tag="${prefix}:3h"
          bundle_tag="${prefix}-bundle:3h"
          catalog_tag="${prefix}-catalog:3h"

          echo '==> Build and push operator, bundle, and catalog with the shared target'
          make dev-olm-catalog-push \
            OPERATOR_SDK=/usr/local/bin/operator-sdk \
            DEV_OLM_OPERATOR_SDK=/usr/local/bin/operator-sdk \
            DEV_REGISTRY=ttl.sh \
            TTL_SH_TTL=3h \
            CONTAINER_TOOL=podman \
            DEV_IMG="$operator_tag" \
            DEV_OLM_BUNDLE_IMAGE="$bundle_tag" \
            DEV_OLM_CATALOG_IMAGE="$catalog_tag" \
            VERSION="$SNR_VERSION" \
            PREVIOUS_VERSION="$SNR_PREVIOUS_VERSION"

          echo '==> Resolve pushed candidate images to immutable digests'
          skopeo inspect --format '{{.Digest}}' "docker://$operator_tag" > "$ARTIFACT_DIR/operator.digest"
          skopeo inspect --format '{{.Digest}}' "docker://$bundle_tag" > "$ARTIFACT_DIR/bundle.digest"
          skopeo inspect --format '{{.Digest}}' "docker://$catalog_tag" > "$ARTIFACT_DIR/catalog.digest"
          CANDIDATE_IMAGE="${prefix}@$(cat "$ARTIFACT_DIR/operator.digest")"
          CANDIDATE_BUNDLE="${prefix}-bundle@$(cat "$ARTIFACT_DIR/bundle.digest")"
          CANDIDATE_CATALOG="${prefix}-catalog@$(cat "$ARTIFACT_DIR/catalog.digest")"

          printf 'CANDIDATE_IMAGE=%s\nCANDIDATE_BUNDLE=%s\nCANDIDATE_CATALOG=%s\n' \
            "$CANDIDATE_IMAGE" "$CANDIDATE_BUNDLE" "$CANDIDATE_CATALOG" |
            tee "$ARTIFACT_DIR/candidate-images.txt"
        }

        verify_candidate() {
          echo '==> Validate candidate bundle'
          operator-sdk bundle validate --image-builder=none "$CANDIDATE_BUNDLE"
          local bundle_dir candidate_csv candidate_version
          bundle_dir="$(mktemp -d)"
          oc image extract "$CANDIDATE_BUNDLE" --path="/manifests/:$bundle_dir" --confirm
          candidate_csv="$(find "$bundle_dir" -name '*clusterserviceversion.yaml' -print -quit)"
          : "${candidate_csv:?candidate bundle must contain a ClusterServiceVersion}"
          candidate_version="$(sed -n 's/^  version: *//p' "$candidate_csv" | tr -d '"')"
          : "${candidate_version:?SNR bundle CSV must specify spec.version}"
          test "$candidate_version" = "$SNR_VERSION"
          CANDIDATE_VERSION="$candidate_version"
          echo "==> Candidate bundle verified: version $candidate_version"
        }

        prepare_candidate() {
          build_candidate
          verify_candidate

          # Feed the source-built FBC into the same test as a downstream FBC.
          export SNR_FBC_CATALOG_IMAGE="$CANDIDATE_CATALOG"
          export SNR_FBC_CANDIDATE_VERSION="$CANDIDATE_VERSION"
          export SNR_FBC_CANDIDATE_IMAGE="$CANDIDATE_IMAGE"
          export SNR_FBC_CHANNEL=stable
          # The source-built images are directly pullable from ttl.sh.
          unset SNR_FBC_IDMS_PATH
        }

        checkout_system_tests() {
          echo '==> Check out openshift/rhwa-system-tests main'
          git clone --depth=1 --branch main \
            https://github.com/openshift/rhwa-system-tests.git /tmp/system-tests
          git -C /tmp/system-tests show --no-patch --format=fuller HEAD
          git -C /tmp/system-tests rev-parse HEAD > "$ARTIFACT_DIR/system-tests-commit.txt"
        }

        print_run_config() {
          echo "Candidate catalog: $SNR_FBC_CATALOG_IMAGE"
          echo "Candidate version: $SNR_FBC_CANDIDATE_VERSION"
          echo "Candidate controller and agents: $SNR_FBC_CANDIDATE_IMAGE"
          echo "Channel: $SNR_FBC_CHANNEL"
          echo "IDMS: ${SNR_FBC_IDMS_PATH:-none}"
          echo 'Mode: upgrade/configuration persistence and pre/post worker remediation'
        }

        run_upgrade_test() {
          export ECO_TEST_FEATURES=snr-operator
          export ECO_TEST_LABELS=tier:upgrade-operator
          export ECO_TEST_VERBOSE=true
          export WORKLOAD_IMAGE=unused-by-snr-upgrade-tests

          echo '==> Start system-tests tier: upgrade-operator'
          export ECO_REPORTS_DUMP_DIR="$ARTIFACT_DIR/upgrade-operator"
          mkdir -p "$ECO_REPORTS_DUMP_DIR"
          make -C /tmp/system-tests run-tests 2>&1 | tee "$ECO_REPORTS_DUMP_DIR/run.log"
        }

        main() {
          prepare_runtime
          prepare_candidate
          checkout_system_tests
          print_run_config
          run_upgrade_test
        }

        main
      from: snr-upgrade-test-runner
      nested_podman: true
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
    workflow: ipi-aws
- always_run: false
  as: e2e-system-tests-snr-fbc-upgrade
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      FBC_CANDIDATE_IMAGE: registry.redhat.io/workload-availability/self-node-remediation-rhel9-operator@sha256:8fdaaf6557a5d4509a0c1f63003e7e920b95f101af8cb18ea185e63220077b72
      FBC_CANDIDATE_MIRROR: quay.io/redhat-user-workloads/rhwa-tenant/self-node-remediation/snr-operator-5-8
      FBC_OPERATOR: snr
      TEST_NAME: e2e-system-tests-snr-fbc-upgrade
      TEST_STEPS: medik8s-fbc-upgrade
    post:
    - ref: medik8s-analyze-e2e-failure
    test:
    - ref: medik8s-fbc-upgrade
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: medik8s
  repo: self-node-remediation
  variant: "5.0"
