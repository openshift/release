base_images:
  base:
    name: centos
    namespace: openshift
    tag: stream9
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  system-tests-builder:
    name: builder
    namespace: konveyor
    tag: ubi9-v1.27
binary_build_commands: make manager
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    from: base
    to: fence-agents-remediation
  - dockerfile_literal: |
      FROM system-tests-builder AS go-builder
      FROM quay.io/operator-framework/operator-sdk@sha256:b7378eb179b97fbdf1ff1304e86f62e9ff9f9c2d0089464111ce8eddd39e2013 AS operator-sdk
      FROM nested-podman
      USER 0
      RUN dnf install -y git make skopeo jq findutils tar gzip gettext && dnf clean all
      COPY --from=go-builder /opt/app-root/src/go /opt/app-root/src/go
      COPY --from=operator-sdk /usr/local/bin/operator-sdk /usr/local/bin/operator-sdk
      ENV GOROOT=/opt/app-root/src/go
      ENV PATH=/opt/app-root/src/go/bin:$PATH
      COPY far-src/ /opt/far-ci-src/
    from: nested-podman
    inputs:
      src:
        paths:
        - destination_dir: far-src/
          source_path: /go/src/github.com/medik8s/fence-agents-remediation/.
      system-tests-builder:
        as:
        - system-tests-builder
    to: source-upgrade-test-runner
  - dockerfile_literal: |
      FROM system-tests-builder AS go-builder
      FROM nested-podman
      USER 0
      RUN dnf install -y git make skopeo jq findutils tar gzip && dnf clean all
      COPY --from=go-builder /opt/app-root/src/go /opt/app-root/src/go
      ENV GOROOT=/opt/app-root/src/go
      ENV PATH=/opt/app-root/src/go/bin:$PATH
    from: nested-podman
    inputs:
      system-tests-builder:
        as:
        - system-tests-builder
    to: fbc-upgrade-test-runner
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 500Mi
tests:
- always_run: false
  as: e2e-system-tests-far-upgrade
  capabilities:
  - nested-podman
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      SOURCE_OPERATOR: far
      TEST_NAME: e2e-system-tests-far-upgrade
      TEST_STEPS: medik8s-source-upgrade
    post:
    - ref: medik8s-analyze-e2e-failure
    test:
    - ref: medik8s-source-upgrade
    workflow: ipi-aws
- always_run: false
  as: e2e-system-tests-far-fbc-upgrade
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      FBC_CANDIDATE_IMAGE: registry.redhat.io/workload-availability/fence-agents-remediation-rhel9-operator@sha256:f707b866dbbef82352070f9fe5612ad718ee7c92dcaa3af2c108fd1044993ead
      FBC_CANDIDATE_MIRROR: quay.io/redhat-user-workloads/rhwa-tenant/fence-agents-remediation/far-operator-5-8
      FBC_OPERATOR: far
      TEST_NAME: e2e-system-tests-far-fbc-upgrade
      TEST_STEPS: medik8s-fbc-upgrade
    post:
    - ref: medik8s-analyze-e2e-failure
    test:
    - ref: medik8s-fbc-upgrade
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: medik8s
  repo: fence-agents-remediation
  variant: "5.0"
