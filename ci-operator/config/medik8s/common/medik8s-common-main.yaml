binary_build_commands: make build
build_root:
  from_repository: true
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: GOFLAGS=-mod=mod make lint
  container:
    from: src
- as: test
  commands: GOFLAGS=-mod=mod make test
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: medik8s
  repo: common
