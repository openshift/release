base_images:
  base:
    name: ubi
    namespace: ocp
    tag: "9"
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  system-tests-builder:
    name: builder
    namespace: konveyor
    tag: ubi9-v1.27
binary_build_commands: make manager
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    from: base
    to: machine-deletion-remediation
  - dockerfile_literal: |
      FROM system-tests-builder AS go-builder
      FROM quay.io/operator-framework/operator-sdk@sha256:1b37b208f424e5abec0dc2045b54d3942e2eb03e085f48baf19aff7e5a333d84 AS operator-sdk
      FROM nested-podman
      USER 0
      RUN dnf install -y git make skopeo jq findutils tar gzip gettext && dnf clean all
      COPY --from=go-builder /opt/app-root/src/go /opt/app-root/src/go
      COPY --from=operator-sdk /usr/local/bin/operator-sdk /usr/local/bin/operator-sdk
      ENV GOROOT=/opt/app-root/src/go
      ENV PATH=/opt/app-root/src/go/bin:$PATH
      COPY mdr-src/ /opt/mdr-ci-src/
    from: nested-podman
    inputs:
      src:
        paths:
        - destination_dir: mdr-src/
          source_path: /go/src/github.com/medik8s/machine-deletion-remediation/.
      system-tests-builder:
        as:
        - system-tests-builder
    to: mdr-upgrade-test-runner
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 500Mi
tests:
- always_run: false
  as: e2e-system-tests-mdr-upgrade
  capabilities:
  - nested-podman
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      TEST_NAME: e2e-system-tests-mdr-upgrade
      TEST_STEPS: run-mdr-upgrade-tests
    post:
    - ref: medik8s-analyze-e2e-failure
    test:
    - as: run-mdr-upgrade-tests
      cli: latest
      commands: |
        set -o errexit -o nounset -o pipefail

        : "${ARTIFACT_DIR:?ci-operator must provide ARTIFACT_DIR}"
        exec > >(tee "$ARTIFACT_DIR/mdr-upgrade-tests.log") 2>&1

        prepare_runtime() {
          # Give skopeo the cluster's Red Hat registry credentials.
          echo '==> Read cluster pull secret for Red Hat registry access'
          local auth_dir=/tmp/mdr-registry-auth
          mkdir -p "$auth_dir"
          oc get secret pull-secret -n openshift-config -o jsonpath='{.data.\.dockerconfigjson}' |
            base64 --decode > "$auth_dir/auth.json"
          chmod 0600 "$auth_dir/auth.json"
          export REGISTRY_AUTH_FILE="$auth_dir/auth.json"

          # The test container runs as an arbitrary UID.
          export GOPATH=/tmp/mdr-go
          export GOMODCACHE="$GOPATH/pkg/mod"
          export GOCACHE=/tmp/mdr-go-build-cache
          mkdir -p "$GOMODCACHE" "$GOCACHE"

          go version
          skopeo --version
          operator-sdk version
          podman version
          podman info

          echo '==> Configure rootless Podman for the catalog base image UID'
          local storage_config
          storage_config="$(podman info --format '{{.Store.ConfigFile}}')"
          test -r "$storage_config"
          export CONTAINERS_STORAGE_CONF=/tmp/mdr-storage.conf
          awk '
            /^\[storage.options.overlay\]$/ {
              in_overlay=1; found=1; print; print "ignore_chown_errors = \"true\""; next
            }
            /^\[/ { in_overlay=0 }
            in_overlay && /^[[:space:]]*ignore_chown_errors[[:space:]]*=/ { next }
            { print }
            END { if (!found) { print "[storage.options.overlay]"; print "ignore_chown_errors = \"true\"" } }
          ' "$storage_config" > "$CONTAINERS_STORAGE_CONF"
          test "$(podman info --format '{{.Store.ConfigFile}}')" = "$CONTAINERS_STORAGE_CONF"
          echo '==> Pull catalog base image before building the candidate'
          podman pull quay.io/operator-framework/opm:latest
        }

        build_candidate() {
          # Build operator, bundle, then catalog.
          echo '==> Copy the CI-selected MDR checkout into a writable build directory'
          test -f /opt/mdr-ci-src/Makefile
          cp -R /opt/mdr-ci-src /tmp/mdr-source

          # TODO: Revert this rehearsal-only checkout after machine-deletion-remediation#191 merges.
          echo '==> Check out machine-deletion-remediation PR 191'
          git -C /tmp/mdr-source fetch --depth=1 \
            https://github.com/medik8s/machine-deletion-remediation.git refs/pull/191/head
          git -C /tmp/mdr-source checkout --detach FETCH_HEAD

          local revision prefix operator_tag bundle_tag catalog_tag
          revision="$(git -C /tmp/mdr-source rev-parse HEAD)"
          git -C /tmp/mdr-source show --no-patch --format=fuller HEAD
          printf '%s\n' "$revision" > "$ARTIFACT_DIR/mdr-source-commit.txt"

          cd /tmp/mdr-source
          export MDR_VERSION
          MDR_VERSION="$(sed -n 's/^DEFAULT_VERSION := //p' Makefile)"
          test -n "$MDR_VERSION"
          export MDR_PREVIOUS_VERSION
          MDR_PREVIOUS_VERSION="$(skopeo list-tags docker://registry.redhat.io/workload-availability/machine-deletion-remediation-operator-bundle |
            jq -r '.Tags[] | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' | sort -V | tail -n 1)"
          test -n "$MDR_PREVIOUS_VERSION"
          MDR_PREVIOUS_VERSION="${MDR_PREVIOUS_VERSION#v}"
          test "$MDR_VERSION" != "$MDR_PREVIOUS_VERSION"
          printf 'Candidate: %s; latest GA: %s\n' "$MDR_VERSION" "$MDR_PREVIOUS_VERSION"

          prefix="ttl.sh/mdr-prow-$(date +%Y%m%d-%H%M%S)-${revision:0:7}"
          operator_tag="${prefix}:3h"
          bundle_tag="${prefix}-bundle:3h"
          catalog_tag="${prefix}-catalog:3h"

          echo '==> Build and push operator, bundle, and catalog with the shared target'
          make dev-olm-catalog-push \
            DEV_REGISTRY=ttl.sh \
            TTL_SH_TTL=3h \
            CONTAINER_TOOL=podman \
            DEV_IMG="$operator_tag" \
            DEV_OLM_BUNDLE_IMAGE="$bundle_tag" \
            DEV_OLM_CATALOG_IMAGE="$catalog_tag" \
            VERSION="$MDR_VERSION" \
            PREVIOUS_VERSION="$MDR_PREVIOUS_VERSION" \
            SKIP_RANGE_LOWER=0.0.1

          echo '==> Resolve pushed candidate images to immutable digests'
          skopeo inspect --format '{{.Digest}}' "docker://$operator_tag" > "$ARTIFACT_DIR/operator.digest"
          skopeo inspect --format '{{.Digest}}' "docker://$bundle_tag" > "$ARTIFACT_DIR/bundle.digest"
          skopeo inspect --format '{{.Digest}}' "docker://$catalog_tag" > "$ARTIFACT_DIR/catalog.digest"
          CANDIDATE_IMAGE="${prefix}@$(cat "$ARTIFACT_DIR/operator.digest")"
          CANDIDATE_BUNDLE="${prefix}-bundle@$(cat "$ARTIFACT_DIR/bundle.digest")"
          CANDIDATE_CATALOG="${prefix}-catalog@$(cat "$ARTIFACT_DIR/catalog.digest")"

          printf 'CANDIDATE_IMAGE=%s\nCANDIDATE_BUNDLE=%s\nCANDIDATE_CATALOG=%s\n' \
            "$CANDIDATE_IMAGE" "$CANDIDATE_BUNDLE" "$CANDIDATE_CATALOG" |
            tee "$ARTIFACT_DIR/candidate-images.txt"
        }

        verify_candidate() {
          echo '==> Validate candidate bundle'
          operator-sdk bundle validate --image-builder=none "$CANDIDATE_BUNDLE"
          local bundle_dir candidate_csv candidate_version
          bundle_dir="$(mktemp -d)"
          oc image extract "$CANDIDATE_BUNDLE" --path="/manifests/:$bundle_dir" --confirm
          candidate_csv="$(find "$bundle_dir" -name '*clusterserviceversion.yaml' -print -quit)"
          : "${candidate_csv:?candidate bundle must contain a ClusterServiceVersion}"
          candidate_version="$(sed -n 's/^  version: *//p' "$candidate_csv" | tr -d '"')"
          : "${candidate_version:?MDR bundle CSV must specify spec.version}"
          test "$candidate_version" = "$MDR_VERSION"
          CANDIDATE_VERSION="$candidate_version"
          echo "==> Candidate bundle verified: version $candidate_version"
        }

        prepare_candidate() {
          build_candidate
          verify_candidate

          # Feed the source-built FBC into the same test as a downstream FBC.
          export MDR_FBC_CATALOG_IMAGE="$CANDIDATE_CATALOG"
          export MDR_FBC_CANDIDATE_VERSION="$CANDIDATE_VERSION"
          export MDR_FBC_CANDIDATE_IMAGE="$CANDIDATE_IMAGE"
          export MDR_FBC_CHANNEL=stable
          # The source-built images are directly pullable from ttl.sh.
          unset MDR_FBC_IDMS_PATH
        }

        checkout_system_tests() {
          # TODO: Revert this rehearsal-only checkout after openshift/rhwa-system-tests#28 merges.
          echo '==> Check out openshift/rhwa-system-tests PR 28'
          git clone --depth=1 --branch main \
            https://github.com/openshift/rhwa-system-tests.git /tmp/system-tests
          git -C /tmp/system-tests fetch --depth=1 \
            https://github.com/openshift/rhwa-system-tests.git refs/pull/28/head
          git -C /tmp/system-tests checkout --detach FETCH_HEAD
          git -C /tmp/system-tests show --no-patch --format=fuller HEAD
          git -C /tmp/system-tests rev-parse HEAD > "$ARTIFACT_DIR/system-tests-commit.txt"
        }

        print_run_config() {
          echo "Candidate catalog: $MDR_FBC_CATALOG_IMAGE"
          echo "Candidate version: $MDR_FBC_CANDIDATE_VERSION"
          echo "Candidate controller: $MDR_FBC_CANDIDATE_IMAGE"
          echo "Channel: $MDR_FBC_CHANNEL"
          echo "IDMS: ${MDR_FBC_IDMS_PATH:-none}"
          echo 'Mode: upgrade/template persistence and safe reconciliation; Machine deletion NOT REQUESTED'
        }

        run_upgrade_test() {
          export ECO_TEST_FEATURES=mdr-operator
          export ECO_TEST_LABELS=tier:upgrade-operator
          export ECO_TEST_VERBOSE=true
          export WORKLOAD_IMAGE=registry.access.redhat.com/ubi9/ubi-minimal:latest

          echo '==> Start system-tests tier: upgrade-operator'
          export ECO_REPORTS_DUMP_DIR="$ARTIFACT_DIR/upgrade-operator"
          mkdir -p "$ECO_REPORTS_DUMP_DIR"
          make -C /tmp/system-tests run-tests 2>&1 | tee "$ECO_REPORTS_DUMP_DIR/run.log"
        }

        main() {
          prepare_runtime
          prepare_candidate
          checkout_system_tests
          print_run_config
          run_upgrade_test
        }

        main
      from: mdr-upgrade-test-runner
      nested_podman: true
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: medik8s
  repo: machine-deletion-remediation
  variant: "5.0"
