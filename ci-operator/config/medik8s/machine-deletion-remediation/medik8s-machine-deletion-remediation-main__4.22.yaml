base_images:
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  operator-base:
    name: ubi
    namespace: ocp
    tag: "9"
binary_build_commands: make manager
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    from: operator-base
    to: machine-deletion-remediation-operator
operator:
  bundles:
  - as: machine-deletion-remediation-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: quay.io/medik8s/machine-deletion-remediation-operator:latest
    with: pipeline:machine-deletion-remediation-operator
releases:
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: test
  commands: make test
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
- as: openshift-e2e
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: medik8s-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      INSTALL_NAMESPACE: mdr-install
      OPERATOR_PACKAGE_NAME: machine-deletion-remediation
      OPERATOR_RELEASED_VERSION: 0.7.0
      TEST_STEPS: e2e-test
    post:
    - ref: medik8s-analyze-e2e-failure
    test:
    - as: e2e-install
      cli: latest
      commands: |
        oc create namespace "$INSTALL_NAMESPACE"

        # workaround for OLM pod not running with restricted PSA
        oc label --overwrite ns "$INSTALL_NAMESPACE" security.openshift.io/scc.podSecurityLabelSync=false
        oc label --overwrite ns "$INSTALL_NAMESPACE" pod-security.kubernetes.io/enforce=privileged

        OPERATOR_NAMESPACE="$INSTALL_NAMESPACE" BUNDLE_IMG=quay.io/medik8s/machine-deletion-remediation-operator-bundle:v"$OPERATOR_RELEASED_VERSION" make bundle-run
        oc wait --for condition=Available -n "$INSTALL_NAMESPACE" deployment machine-deletion-remediation-controller-manager
      env:
      - name: INSTALL_NAMESPACE
      - name: OPERATOR_RELEASED_VERSION
      - name: OPERATOR_PACKAGE_NAME
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: e2e-upgrade
      cli: latest
      commands: |
        OPERATOR_NAMESPACE="$INSTALL_NAMESPACE" BUNDLE_IMG="$OO_BUNDLE" make bundle-run-update
        oc wait --for condition=Available -n "$INSTALL_NAMESPACE" deployment machine-deletion-remediation-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: machine-deletion-remediation-bundle
      env:
      - name: INSTALL_NAMESPACE
      - name: OPERATOR_PACKAGE_NAME
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: e2e-test
      commands: export OPERATOR_NS="$INSTALL_NAMESPACE" && make test-e2e
      env:
      - name: INSTALL_NAMESPACE
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: medik8s
  repo: machine-deletion-remediation
  variant: "4.22"
