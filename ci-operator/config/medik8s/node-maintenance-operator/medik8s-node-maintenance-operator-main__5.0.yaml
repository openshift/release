base_images:
  base:
    name: ubi
    namespace: ocp
    tag: "9"
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  system-tests-builder:
    name: builder
    namespace: konveyor
    tag: ubi9-v1.27
binary_build_commands: make build
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    from: base
    to: node-maintenance-operator
  - dockerfile_literal: |
      FROM system-tests-builder AS go-builder
      FROM quay.io/operator-framework/operator-sdk@sha256:1b37b208f424e5abec0dc2045b54d3942e2eb03e085f48baf19aff7e5a333d84 AS operator-sdk
      FROM nested-podman
      USER 0
      RUN dnf install -y git make skopeo jq findutils tar gzip gettext && dnf clean all
      COPY --from=go-builder /opt/app-root/src/go /opt/app-root/src/go
      COPY --from=operator-sdk /usr/local/bin/operator-sdk /usr/local/bin/operator-sdk
      ENV GOROOT=/opt/app-root/src/go
      ENV PATH=/opt/app-root/src/go/bin:$PATH
      COPY nmo-src/ /opt/nmo-ci-src/
    from: nested-podman
    inputs:
      src:
        paths:
        - destination_dir: nmo-src/
          source_path: /go/src/github.com/medik8s/node-maintenance-operator/.
      system-tests-builder:
        as:
        - system-tests-builder
    to: nmo-upgrade-test-runner
  - dockerfile_literal: |
      FROM system-tests-builder AS go-builder
      FROM quay.io/operator-framework/operator-sdk@sha256:1b37b208f424e5abec0dc2045b54d3942e2eb03e085f48baf19aff7e5a333d84 AS operator-sdk
      FROM nested-podman
      USER 0
      RUN dnf install -y git make skopeo jq findutils tar gzip gettext && dnf clean all
      COPY --from=go-builder /opt/app-root/src/go /opt/app-root/src/go
      COPY --from=operator-sdk /usr/local/bin/operator-sdk /usr/local/bin/operator-sdk
      ENV GOROOT=/opt/app-root/src/go
      ENV PATH=/opt/app-root/src/go/bin:$PATH
      COPY nmo-src/ /opt/nmo-ci-src/
    from: nested-podman
    inputs:
      src:
        paths:
        - destination_dir: nmo-src/
          source_path: /go/src/github.com/medik8s/node-maintenance-operator/.
      system-tests-builder:
        as:
        - system-tests-builder
    to: nmo-pr-test-runner
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 500Mi
tests:
- always_run: false
  as: e2e-system-tests-nmo-pr-aws
  capabilities:
  - nested-podman
  - intranet
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      ECO_IS_DOWNSTREAM: "false"
      ECO_TEST_FEATURES: nmo-operator
      ECO_TEST_LABELS: '!tier:upgrade && !tier:upgrade-operator && !tier:fresh-install
        && !tier:upgrade-cluster && !tier:interop'
      ECO_TEST_VERBOSE: "true"
      TEST_NAME: e2e-system-tests-nmo-pr-aws
      TEST_STEPS: e2e-test
    post:
    - ref: medik8s-analyze-e2e-failure
    test:
    - as: build-and-install-nmo
      cli: latest
      commands: |
        set -o errexit -o nounset -o pipefail

        : "${ARTIFACT_DIR:?ci-operator must provide ARTIFACT_DIR}"
        exec > >(tee "$ARTIFACT_DIR/build-and-install-nmo.log") 2>&1

        OO_INSTALL_NAMESPACE=openshift-workload-availability
        OO_INSTALL_TIMEOUT_MINUTES=10

        prepare_runtime() {
          echo '==> Read cluster pull secret for Red Hat registry access'
          local auth_dir=/tmp/nmo-registry-auth
          mkdir -p "$auth_dir"
          oc get secret pull-secret -n openshift-config -o jsonpath='{.data.\.dockerconfigjson}' |
            base64 --decode > "$auth_dir/auth.json"
          chmod 0600 "$auth_dir/auth.json"
          export REGISTRY_AUTH_FILE="$auth_dir/auth.json"

          export GOPATH=/tmp/nmo-go
          export GOMODCACHE="$GOPATH/pkg/mod"
          export GOCACHE=/tmp/nmo-go-build-cache
          mkdir -p "$GOMODCACHE" "$GOCACHE"

          go version
          skopeo --version
          operator-sdk version
          podman version
          podman info

          echo '==> Configure rootless Podman for the catalog base image UID'
          local storage_config
          storage_config="$(podman info --format '{{.Store.ConfigFile}}')"
          test -r "$storage_config"
          export CONTAINERS_STORAGE_CONF=/tmp/nmo-storage.conf
          awk '
            /^\[storage.options.overlay\]$/ {
              in_overlay=1; found=1; print; print "ignore_chown_errors = \"true\""; next
            }
            /^\[/ { in_overlay=0 }
            in_overlay && /^[[:space:]]*ignore_chown_errors[[:space:]]*=/ { next }
            { print }
            END { if (!found) { print "[storage.options.overlay]"; print "ignore_chown_errors = \"true\"" } }
          ' "$storage_config" > "$CONTAINERS_STORAGE_CONF"
          test "$(podman info --format '{{.Store.ConfigFile}}')" = "$CONTAINERS_STORAGE_CONF"
          echo '==> Pull catalog base image before building the candidate'
          podman pull quay.io/operator-framework/opm:latest
        }

        build_candidate() {
          echo '==> Copy the CI-selected NMO checkout into a writable build directory'
          test -f /opt/nmo-ci-src/Makefile
          cp -R /opt/nmo-ci-src /tmp/nmo-source

          local revision prefix operator_tag bundle_tag catalog_tag
          revision="$(git -C /tmp/nmo-source rev-parse HEAD)"
          git -C /tmp/nmo-source show --no-patch --format=fuller HEAD
          printf '%s\n' "$revision" > "$ARTIFACT_DIR/nmo-source-commit.txt"

          cd /tmp/nmo-source
          export NMO_VERSION
          NMO_VERSION="$(sed -n 's/^DEFAULT_VERSION := //p' Makefile)"
          test -n "$NMO_VERSION"
          export NMO_PREVIOUS_VERSION
          NMO_PREVIOUS_VERSION="$(skopeo list-tags docker://registry.redhat.io/workload-availability/node-maintenance-operator-bundle |
            jq -r '.Tags[] | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' | sort -V | tail -n 1)"
          test -n "$NMO_PREVIOUS_VERSION"
          NMO_PREVIOUS_VERSION="${NMO_PREVIOUS_VERSION#v}"
          test "$NMO_VERSION" != "$NMO_PREVIOUS_VERSION"
          printf 'Candidate: %s; latest GA: %s\n' "$NMO_VERSION" "$NMO_PREVIOUS_VERSION"

          prefix="ttl.sh/nmo-prow-$(date +%Y%m%d-%H%M%S)-${revision:0:7}"
          operator_tag="${prefix}:3h"
          bundle_tag="${prefix}-bundle:3h"
          catalog_tag="${prefix}-catalog:3h"

          echo '==> Build and push operator, bundle, and catalog with the shared target'
          make dev-olm-catalog-push \
            DEV_REGISTRY=ttl.sh \
            TTL_SH_TTL=3h \
            CONTAINER_TOOL=podman \
            DEV_IMG="$operator_tag" \
            VERSION="$NMO_VERSION" PREVIOUS_VERSION="$NMO_PREVIOUS_VERSION"

          echo '==> Resolve pushed candidate images to immutable digests'
          skopeo inspect --format '{{.Digest}}' "docker://$operator_tag" > "$ARTIFACT_DIR/operator.digest"
          skopeo inspect --format '{{.Digest}}' "docker://$bundle_tag" > "$ARTIFACT_DIR/bundle.digest"
          skopeo inspect --format '{{.Digest}}' "docker://$catalog_tag" > "$ARTIFACT_DIR/catalog.digest"
          export NMO_CANDIDATE_IMAGE="${prefix}@$(cat "$ARTIFACT_DIR/operator.digest")"
          export NMO_CANDIDATE_BUNDLE="${prefix}-bundle@$(cat "$ARTIFACT_DIR/bundle.digest")"
          NMO_CANDIDATE_CATALOG_IMAGE="${prefix}-catalog@$(cat "$ARTIFACT_DIR/catalog.digest")"

          printf 'NMO_CANDIDATE_IMAGE=%s\nNMO_CANDIDATE_BUNDLE=%s\nNMO_CANDIDATE_CATALOG_IMAGE=%s\n' \
            "$NMO_CANDIDATE_IMAGE" "$NMO_CANDIDATE_BUNDLE" \
            "$NMO_CANDIDATE_CATALOG_IMAGE" |
            tee "$ARTIFACT_DIR/candidate-images.txt"
        }

        verify_candidate() {
          echo '==> Validate candidate bundle'
          operator-sdk bundle validate --image-builder=none "$NMO_CANDIDATE_BUNDLE"
          local bundle_dir candidate_csv candidate_version
          bundle_dir="$(mktemp -d)"
          oc image extract "$NMO_CANDIDATE_BUNDLE" --path="/manifests/:$bundle_dir" --confirm
          candidate_csv="$(find "$bundle_dir" -name '*clusterserviceversion.yaml' -print -quit)"
          : "${candidate_csv:?candidate bundle must contain a ClusterServiceVersion}"
          candidate_version="$(sed -n 's/^  version: *//p' "$candidate_csv" | tr -d '"')"
          : "${candidate_version:?NMO bundle CSV must specify spec.version}"
          test "$candidate_version" = "$NMO_VERSION"
          echo "==> Candidate bundle verified: version $candidate_version"
        }

        install_candidate() {
          echo "==> Ensure namespace ${OO_INSTALL_NAMESPACE}"
          oc create namespace "${OO_INSTALL_NAMESPACE}" --dry-run=client -o yaml | oc apply -f -
          oc label --overwrite "ns/${OO_INSTALL_NAMESPACE}" \
            security.openshift.io/scc.podSecurityLabelSync=false \
            pod-security.kubernetes.io/enforce=privileged

          echo "==> Install NMO candidate bundle via operator-sdk run bundle"
          operator-sdk run bundle "$NMO_CANDIDATE_BUNDLE" \
            -n "${OO_INSTALL_NAMESPACE}" \
            --verbose \
            --timeout="${OO_INSTALL_TIMEOUT_MINUTES}m"

          echo "==> Wait for CSV Succeeded in ${OO_INSTALL_NAMESPACE}"
          local csv=""
          local attempts=$((OO_INSTALL_TIMEOUT_MINUTES * 6))
          local i sub
          for i in $(seq 1 "$attempts"); do
            while IFS= read -r sub; do
              [[ -z "$sub" ]] && continue
              if [[ "$(oc get subscription "$sub" -n "$OO_INSTALL_NAMESPACE" \
                -o jsonpath='{.spec.name}' 2>/dev/null)" == "node-maintenance-operator" ]]; then
                csv=$(oc get subscription "$sub" -n "$OO_INSTALL_NAMESPACE" \
                  -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
                if [[ -n "$csv" ]]; then
                  break 2
                fi
              fi
            done < <(oc get subscription -n "$OO_INSTALL_NAMESPACE" \
              -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
            echo "  attempt ${i}/${attempts} — installedCSV not set yet, waiting 10s..."
            sleep 10
          done
          : "${csv:?No CSV installed for node-maintenance-operator}"
          echo "==> Waiting for CSV ${csv} to reach Succeeded"
          oc wait --for=jsonpath='{.status.phase}'=Succeeded "csv/${csv}" \
            -n "${OO_INSTALL_NAMESPACE}" --timeout="${OO_INSTALL_TIMEOUT_MINUTES}m"
        }

        prepare_runtime
        build_candidate
        verify_candidate
        install_candidate
      from: nmo-pr-test-runner
      nested_podman: true
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
    - as: e2e-test
      cli: latest
      commands: |
        set -o errexit -o nounset -o pipefail

        : "${ARTIFACT_DIR:?ci-operator must provide ARTIFACT_DIR}"
        exec > >(tee "$ARTIFACT_DIR/e2e-test.log") 2>&1

        export GOPATH=/tmp/nmo-go
        export GOMODCACHE="$GOPATH/pkg/mod"
        export GOCACHE=/tmp/nmo-go-build-cache
        mkdir -p "$GOMODCACHE" "$GOCACHE"

        if [[ -f "${SHARED_DIR}/workload_image" ]]; then
          export WORKLOAD_IMAGE=$(cat "${SHARED_DIR}/workload_image")
        else
          # medik8s-lib (part of medik8s-setup) normally writes this; this job skips that chain.
          export WORKLOAD_IMAGE=registry.access.redhat.com/ubi9/ubi-minimal:latest
        fi

        echo '==> Clone openshift/rhwa-system-tests main'
        git clone --depth=1 --branch main \
          https://github.com/openshift/rhwa-system-tests.git /tmp/system-tests
        git -C /tmp/system-tests show --no-patch --format=fuller HEAD
        git -C /tmp/system-tests rev-parse HEAD > "$ARTIFACT_DIR/system-tests-commit.txt"

        export ECO_REPORTS_DUMP_DIR="${ARTIFACT_DIR}/reports"
        mkdir -p "$ECO_REPORTS_DUMP_DIR"

        echo '==> Run system-tests (nmo-operator)'
        make -C /tmp/system-tests run-tests
      env:
      - name: ECO_TEST_FEATURES
      - name: ECO_TEST_LABELS
      - name: ECO_TEST_VERBOSE
      - name: ECO_IS_DOWNSTREAM
      from: nmo-pr-test-runner
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
    workflow: ipi-aws
- always_run: false
  as: e2e-system-tests-nmo-upgrade
  capabilities:
  - nested-podman
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      TEST_NAME: e2e-system-tests-nmo-upgrade
      TEST_STEPS: run-nmo-upgrade-tests
    post:
    - ref: medik8s-analyze-e2e-failure
    test:
    - as: run-nmo-upgrade-tests
      cli: latest
      commands: |
        set -o errexit -o nounset -o pipefail

        : "${ARTIFACT_DIR:?ci-operator must provide ARTIFACT_DIR}"
        exec > >(tee "$ARTIFACT_DIR/nmo-upgrade-tests.log") 2>&1

        prepare_runtime() {
          # Give skopeo the cluster's Red Hat registry credentials.
          echo '==> Read cluster pull secret for Red Hat registry access'
          local auth_dir=/tmp/nmo-registry-auth
          mkdir -p "$auth_dir"
          oc get secret pull-secret -n openshift-config -o jsonpath='{.data.\.dockerconfigjson}' |
            base64 --decode > "$auth_dir/auth.json"
          chmod 0600 "$auth_dir/auth.json"
          export REGISTRY_AUTH_FILE="$auth_dir/auth.json"

          # The test container runs as an arbitrary UID.
          export GOPATH=/tmp/nmo-go
          export GOMODCACHE="$GOPATH/pkg/mod"
          export GOCACHE=/tmp/nmo-go-build-cache
          mkdir -p "$GOMODCACHE" "$GOCACHE"

          go version
          skopeo --version
          operator-sdk version
          podman version
          podman info

          echo '==> Configure rootless Podman for the catalog base image UID'
          local storage_config
          storage_config="$(podman info --format '{{.Store.ConfigFile}}')"
          test -r "$storage_config"
          export CONTAINERS_STORAGE_CONF=/tmp/nmo-storage.conf
          awk '
            /^\[storage.options.overlay\]$/ {
              in_overlay=1; found=1; print; print "ignore_chown_errors = \"true\""; next
            }
            /^\[/ { in_overlay=0 }
            in_overlay && /^[[:space:]]*ignore_chown_errors[[:space:]]*=/ { next }
            { print }
            END { if (!found) { print "[storage.options.overlay]"; print "ignore_chown_errors = \"true\"" } }
          ' "$storage_config" > "$CONTAINERS_STORAGE_CONF"
          test "$(podman info --format '{{.Store.ConfigFile}}')" = "$CONTAINERS_STORAGE_CONF"
          echo '==> Pull catalog base image before building the candidate'
          podman pull quay.io/operator-framework/opm:latest
        }

        build_candidate() {
          # Build operator, bundle, then catalog.
          echo '==> Copy the CI-selected NMO checkout into a writable build directory'
          test -f /opt/nmo-ci-src/Makefile
          cp -R /opt/nmo-ci-src /tmp/nmo-source

          # TODO: Revert this rehearsal-only checkout after node-maintenance-operator#183 merges.
          echo '==> Check out node-maintenance-operator PR 183'
          git -C /tmp/nmo-source fetch --depth=1 \
            https://github.com/medik8s/node-maintenance-operator.git refs/pull/183/head
          git -C /tmp/nmo-source checkout --detach FETCH_HEAD

          local revision prefix operator_tag bundle_tag catalog_tag
          revision="$(git -C /tmp/nmo-source rev-parse HEAD)"
          git -C /tmp/nmo-source show --no-patch --format=fuller HEAD
          printf '%s\n' "$revision" > "$ARTIFACT_DIR/nmo-source-commit.txt"

          cd /tmp/nmo-source
          export NMO_VERSION
          NMO_VERSION="$(sed -n 's/^DEFAULT_VERSION := //p' Makefile)"
          test -n "$NMO_VERSION"
          export NMO_PREVIOUS_VERSION
          NMO_PREVIOUS_VERSION="$(skopeo list-tags docker://registry.redhat.io/workload-availability/node-maintenance-operator-bundle |
            jq -r '.Tags[] | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' | sort -V | tail -n 1)"
          test -n "$NMO_PREVIOUS_VERSION"
          NMO_PREVIOUS_VERSION="${NMO_PREVIOUS_VERSION#v}"
          test "$NMO_VERSION" != "$NMO_PREVIOUS_VERSION"
          printf 'Candidate: %s; latest GA: %s\n' "$NMO_VERSION" "$NMO_PREVIOUS_VERSION"

          prefix="ttl.sh/nmo-prow-$(date +%Y%m%d-%H%M%S)-${revision:0:7}"
          operator_tag="${prefix}:3h"
          bundle_tag="${prefix}-bundle:3h"
          catalog_tag="${prefix}-catalog:3h"

          echo '==> Build and push operator, bundle, and catalog with the shared target'
          make dev-olm-catalog-push \
            DEV_REGISTRY=ttl.sh \
            TTL_SH_TTL=3h \
            CONTAINER_TOOL=podman \
            DEV_IMG="$operator_tag" \
            DEV_OLM_BUNDLE_IMAGE="$bundle_tag" \
            DEV_OLM_CATALOG_IMAGE="$catalog_tag" \
            VERSION="$NMO_VERSION" \
            PREVIOUS_VERSION="$NMO_PREVIOUS_VERSION" \
            SKIP_RANGE_LOWER=0.12.0

          echo '==> Resolve pushed candidate images to immutable digests'
          skopeo inspect --format '{{.Digest}}' "docker://$operator_tag" > "$ARTIFACT_DIR/operator.digest"
          skopeo inspect --format '{{.Digest}}' "docker://$bundle_tag" > "$ARTIFACT_DIR/bundle.digest"
          skopeo inspect --format '{{.Digest}}' "docker://$catalog_tag" > "$ARTIFACT_DIR/catalog.digest"
          CANDIDATE_IMAGE="${prefix}@$(cat "$ARTIFACT_DIR/operator.digest")"
          CANDIDATE_BUNDLE="${prefix}-bundle@$(cat "$ARTIFACT_DIR/bundle.digest")"
          CANDIDATE_CATALOG="${prefix}-catalog@$(cat "$ARTIFACT_DIR/catalog.digest")"

          printf 'CANDIDATE_IMAGE=%s\nCANDIDATE_BUNDLE=%s\nCANDIDATE_CATALOG=%s\n' \
            "$CANDIDATE_IMAGE" "$CANDIDATE_BUNDLE" "$CANDIDATE_CATALOG" |
            tee "$ARTIFACT_DIR/candidate-images.txt"
        }

        verify_candidate() {
          echo '==> Validate candidate bundle'
          operator-sdk bundle validate --image-builder=none "$CANDIDATE_BUNDLE"
          local bundle_dir candidate_csv candidate_version
          bundle_dir="$(mktemp -d)"
          oc image extract "$CANDIDATE_BUNDLE" --path="/manifests/:$bundle_dir" --confirm
          candidate_csv="$(find "$bundle_dir" -name '*clusterserviceversion.yaml' -print -quit)"
          : "${candidate_csv:?candidate bundle must contain a ClusterServiceVersion}"
          candidate_version="$(sed -n 's/^  version: *//p' "$candidate_csv" | tr -d '"')"
          : "${candidate_version:?NMO bundle CSV must specify spec.version}"
          test "$candidate_version" = "$NMO_VERSION"
          CANDIDATE_VERSION="$candidate_version"
          echo "==> Candidate bundle verified: version $candidate_version"
        }

        prepare_candidate() {
          build_candidate
          verify_candidate

          # Feed the source-built FBC into the same test as a downstream FBC.
          export NMO_FBC_CATALOG_IMAGE="$CANDIDATE_CATALOG"
          export NMO_FBC_CANDIDATE_VERSION="$CANDIDATE_VERSION"
          export NMO_FBC_CANDIDATE_IMAGE="$CANDIDATE_IMAGE"
          export NMO_FBC_CHANNEL=stable
          # The source-built images are directly pullable from ttl.sh.
          unset NMO_FBC_IDMS_PATH
        }

        checkout_system_tests() {
          # TODO: Revert this rehearsal-only checkout after the NMO FBC suite merges upstream.
          echo '==> Check out the shared FBC upgrade test branch'
          git clone --depth=1 --branch main \
            https://github.com/openshift/rhwa-system-tests.git /tmp/system-tests
          git -C /tmp/system-tests fetch --depth=1 \
            https://github.com/JonahSussman/medik8s-system-tests.git refs/heads/jsussman/sbr-upgrade-operator-fbc
          git -C /tmp/system-tests checkout --detach FETCH_HEAD
          git -C /tmp/system-tests show --no-patch --format=fuller HEAD
          git -C /tmp/system-tests rev-parse HEAD > "$ARTIFACT_DIR/system-tests-commit.txt"
        }

        print_run_config() {
          echo "Candidate catalog: $NMO_FBC_CATALOG_IMAGE"
          echo "Candidate version: $NMO_FBC_CANDIDATE_VERSION"
          echo "Candidate controller: $NMO_FBC_CANDIDATE_IMAGE"
          echo "Channel: $NMO_FBC_CHANNEL"
          echo "IDMS: ${NMO_FBC_IDMS_PATH:-none}"
          echo 'Mode: upgrade/config persistence with worker drain and recovery; at least two Ready workers; no reboot'
        }

        run_upgrade_test() {
          export ECO_TEST_FEATURES=nmo-operator
          export ECO_TEST_LABELS=tier:upgrade-operator
          export ECO_TEST_VERBOSE=true
          export WORKLOAD_IMAGE=registry.access.redhat.com/ubi9/ubi-minimal:latest

          echo '==> Start system-tests tier: upgrade-operator'
          export ECO_REPORTS_DUMP_DIR="$ARTIFACT_DIR/upgrade-operator"
          mkdir -p "$ECO_REPORTS_DUMP_DIR"
          make -C /tmp/system-tests run-tests 2>&1 | tee "$ECO_REPORTS_DUMP_DIR/run.log"
        }

        main() {
          prepare_runtime
          prepare_candidate
          checkout_system_tests
          print_run_config
          run_upgrade_test
        }

        main
      from: nmo-upgrade-test-runner
      nested_podman: true
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: medik8s
  repo: node-maintenance-operator
  variant: "5.0"
