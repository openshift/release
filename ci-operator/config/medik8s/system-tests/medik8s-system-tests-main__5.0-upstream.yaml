base_images:
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
  upi-installer:
    name: "5.0"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: builder
    namespace: medik8s
    tag: go1.27
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 500m
      memory: 1000Mi
tests:
- always_run: false
  as: e2e-sbr-aws-odf
  capabilities:
  - intranet
  optional: true
  steps:
    cluster_profile: medik8s-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      COMPUTE_NODE_TYPE: m5.4xlarge
      ECO_TEST_FEATURES: sbr-operator
      ECO_TEST_VERBOSE: "true"
      MEDIK8S_BUNDLE_IMAGES: storage-based-remediation=quay.io/medik8s/storage-based-remediation-operator-bundle:latest
      ODF_OPERATOR_CHANNEL: stable-4.23
      ODF_VERSION_MAJOR_MINOR: "4.23"
      OO_INSTALL_NAMESPACE: openshift-workload-availability
      TEST_NAME: e2e-sbr-aws-odf
      TEST_STEPS: e2e-test
    post:
    - ref: medik8s-analyze-e2e-failure
    test:
    - ref: medik8s-upstream-bundle-install
    - ref: medik8s-deploy-odf-dev-catalog
    - ref: medik8s-sbr-nfs-dynamic-provisioner
    - as: e2e-test
      cli: latest
      commands: |
        if [[ -f "${SHARED_DIR}/workload_image" ]]; then
          export WORKLOAD_IMAGE=$(cat "${SHARED_DIR}/workload_image")
        else
          # medik8s-lib (part of medik8s-setup) normally writes this; upstream jobs skip that chain.
          export WORKLOAD_IMAGE=registry.access.redhat.com/ubi9/ubi-minimal:latest
        fi
        make run-tests
      env:
      - name: ECO_TEST_FEATURES
      - name: ECO_TEST_VERBOSE
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-aws
