base_images:
  aws-efs-csi-operator-create-efs:
    name: "5.0"
    namespace: ocp
    tag: aws-efs-csi-operator-create-efs
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  hypershift-operator:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
  upi-installer:
    name: "5.0"
    namespace: ocp
    tag: upi-installer
build_root:
  from_repository: true
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    release:
      channel: stable
      version: "4.22"
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 500m
      memory: 1000Mi
tests:
- always_run: false
  as: e2e-far-aws-disconnected
  capabilities:
  - intranet
  optional: true
  steps:
    cluster_profile: medik8s-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      COMPUTE_NODE_TYPE: m6i.xlarge
      ECO_TEST_FEATURES: far-operator
      ECO_TEST_LABELS: '!tier:upgrade'
      ENABLE_IDMS: "yes"
      EXTRACT_MANIFEST_INCLUDED: "true"
      MEDIK8S_PACKAGES: fence-agents-remediation
      OCP_VERSION: "50"
      OO_CHANNEL: stable
      OPERATORS: fence-agents-remediation
    observers:
      enable:
      - observers-resource-watch
    test:
    - ref: medik8s-lib
    - ref: medik8s-disconnected-catalogsource
    - ref: medik8s-operator-subscribe
    - ref: medik8s-aws-credentials
    - as: e2e-test
      cli: latest
      commands: |
        [[ -f "${SHARED_DIR}/proxy-conf.sh" ]] && source "${SHARED_DIR}/proxy-conf.sh"
        [[ -f "${SHARED_DIR}/workload_image" ]] && export WORKLOAD_IMAGE=$(cat "${SHARED_DIR}/workload_image")
        make run-tests
      env:
      - name: ECO_TEST_FEATURES
      - name: ECO_TEST_LABELS
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 3h0m0s
    workflow: openshift-e2e-aws-disconnected
- always_run: false
  as: e2e-snr-aws-disconnected
  capabilities:
  - intranet
  optional: true
  steps:
    cluster_profile: medik8s-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      COMPUTE_NODE_TYPE: m6i.xlarge
