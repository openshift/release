    observers:
      enable:
      - observers-resource-watch
    test:
    - ref: medik8s-lib
    - ref: medik8s-disconnected-catalogsource
    - ref: medik8s-operator-subscribe
    - as: e2e-test
      cli: latest
      commands: |
        [[ -f "${SHARED_DIR}/proxy-conf.sh" ]] && source "${SHARED_DIR}/proxy-conf.sh"
        [[ -f "${SHARED_DIR}/workload_image" ]] && export WORKLOAD_IMAGE=$(cat "${SHARED_DIR}/workload_image")
        make run-tests
      env:
      - name: ECO_TEST_FEATURES
      - name: ECO_TEST_VERBOSE
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 3h0m0s
    workflow: openshift-e2e-aws-disconnected
