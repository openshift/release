base_images:
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
build_root:
  from_repository: true
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    release:
      channel: stable
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 500m
      memory: 1000Mi
tests:
# Future downstream qualification only. Keep this manual and optional until the
# Red Hat RHWA 5.0 catalog actually contains NHC 5.8; before then it cannot be
# reported as a candidate fresh-install result.
- always_run: false
  as: e2e-nhc-downstream-fresh-install-aws
  capabilities:
  - intranet
  optional: true
  steps:
    cluster_profile: medik8s-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      ECO_TEST_FEATURES: nhc-operator
      ECO_TEST_LABELS: tier:smoke
      INSTALL_NAMESPACE: openshift-workload-availability
      OCP_VERSION: "50"
      OO_CHANNEL: stable
      OPERATORS: self-node-remediation,node-healthcheck-operator
    test:
    - ref: medik8s-lib
    - ref: medik8s-catalogsource
    - ref: medik8s-operator-subscribe
    - as: run-nhc-fresh-install-tests
      cli: latest
      commands: |
        set -o errexit -o nounset -o pipefail
        export WORKLOAD_IMAGE="$(cat "${SHARED_DIR}/workload_image")"
        make run-tests
      env:
      - name: ECO_TEST_FEATURES
      - name: ECO_TEST_LABELS
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 500Mi
    workflow: ipi-aws
- as: tls13-adherence-all
  cron: 0 10 * * 1
  steps:
    cluster_profile: medik8s-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      INSTALL_NAMESPACE: openshift-workload-availability
      OCP_VERSION: "50"
      OO_CHANNEL: stable
      OPERATORS: fence-agents-remediation,self-node-remediation,node-healthcheck-operator,node-maintenance-operator,machine-deletion-remediation,storage-based-remediation
      PQC_CHECK: "false"
      SCAN_NAMESPACE: openshift-workload-availability
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - ref: medik8s-catalogsource
    - ref: medik8s-operator-subscribe
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-aws
- as: tls-pqc-readiness-all
  cron: 0 10 * * 3
  steps:
    cluster_profile: medik8s-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      INSTALL_NAMESPACE: openshift-workload-availability
      OCP_VERSION: "50"
      OO_CHANNEL: stable
      OPERATORS: fence-agents-remediation,self-node-remediation,node-healthcheck-operator,node-maintenance-operator,machine-deletion-remediation,storage-based-remediation
      PQC_CHECK: "true"
      SCAN_NAMESPACE: openshift-workload-availability
    test:
    - ref: medik8s-catalogsource
    - ref: medik8s-operator-subscribe
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: medik8s
  repo: system-tests
  variant: "5.0"
