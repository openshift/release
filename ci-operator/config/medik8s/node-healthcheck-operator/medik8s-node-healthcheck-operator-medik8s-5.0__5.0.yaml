base_images:
  base:
    name: ubi
    namespace: ocp
    tag: "9"
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
binary_build_commands: make manager
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    from: base
    to: node-healthcheck-operator
operator:
  bundles:
  - as: my-bundle
    dockerfile_path: bundle.ci.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: quay.io/medik8s/node-healthcheck-operator:.*
    with: pipeline:node-healthcheck-operator
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: test
  commands: make test
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
- as: openshift-e2e
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: medik8s-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      INSTALL_NAMESPACE: nhc-install
      OPERATOR_RELEASED_VERSION: 0.12.0
      TEST_STEPS: e2e-test
    post:
    - ref: medik8s-analyze-e2e-failure
    test:
    - as: e2e-install
      cli: latest
      commands: |
        oc create namespace "$INSTALL_NAMESPACE"

        # workaround for OLM pod not running with restricted PSA
        oc label --overwrite ns "$INSTALL_NAMESPACE" security.openshift.io/scc.podSecurityLabelSync=false
        oc label --overwrite ns "$INSTALL_NAMESPACE" pod-security.kubernetes.io/enforce=privileged

        OPERATOR_NAMESPACE="$INSTALL_NAMESPACE" BUNDLE_IMG=quay.io/medik8s/self-node-remediation-operator-bundle:latest make bundle-run
        OPERATOR_NAMESPACE="$INSTALL_NAMESPACE" BUNDLE_IMG=quay.io/medik8s/node-healthcheck-operator-bundle:v"$OPERATOR_RELEASED_VERSION" make bundle-run
        oc wait --for condition=Available -n "$INSTALL_NAMESPACE" deployment node-healthcheck-controller-manager
      env:
      - name: INSTALL_NAMESPACE
      - name: OPERATOR_RELEASED_VERSION
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: e2e-upgrade
      cli: latest
      commands: |
        OPERATOR_NAMESPACE="$INSTALL_NAMESPACE" BUNDLE_IMG="$OO_BUNDLE" make bundle-run-update
        oc wait --for condition=Available -n "$INSTALL_NAMESPACE" deployment node-healthcheck-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: my-bundle
      env:
      - name: INSTALL_NAMESPACE
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: e2e-test
      cli: latest
      commands: export OPERATOR_NS="$INSTALL_NAMESPACE" && make test-e2e
      env:
      - name: INSTALL_NAMESPACE
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-aws
- as: e2e-system-tests-nhc-operator-upgrade
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: medik8s-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      NHC_UPGRADE_NAMESPACE: openshift-workload-availability
      NHC_EXPECTED_SOURCE_COMMIT: 36c6c7cf31898acbc0be1beb927606af1de2a8f5
      NHC_UPGRADE_OLD_BUNDLE: quay.io/medik8s/node-healthcheck-operator-bundle:v0.12.0
      NHC_UPGRADE_OLD_IMAGE: quay.io/medik8s/node-healthcheck-operator:v0.12.0
      NHC_UPGRADE_OLD_VERSION: 0.12.0
      NHC_UPGRADE_PACKAGE: node-healthcheck-operator
      NHC_UPGRADE_SNR_BUNDLE: quay.io/medik8s/self-node-remediation-operator-bundle:v0.13.0
      NHC_UPGRADE_SNR_PACKAGE: self-node-remediation
      SYSTEM_TESTS_REVISION: 833d128bf4f8ca2286df57ad8e0ce4480706ef74
      TEST_NAME: e2e-system-tests-nhc-operator-upgrade
      TEST_STEPS: run-nhc-operator-upgrade
    post:
    - ref: medik8s-analyze-e2e-failure
    test:
    - as: run-nhc-operator-upgrade
      cli: latest
      commands: |
        set -o errexit -o nounset -o pipefail

        : "${ARTIFACT_DIR:?ci-operator must collect step artifacts}"
        mkdir -p "$ARTIFACT_DIR/provenance"
        exec > >(tee "$ARTIFACT_DIR/upgrade-step.log") 2>&1
        printf '%s\n' "${JOB_SPEC:-}" > "$ARTIFACT_DIR/provenance/job-spec.json"
        git show --no-patch --format=fuller HEAD > "$ARTIFACT_DIR/provenance/nhc-source.txt"
        # A target-branch-only rehearsal must not masquerade as the PR build.
        git cat-file -e "$NHC_EXPECTED_SOURCE_COMMIT^{commit}"
        git merge-base --is-ancestor "$NHC_EXPECTED_SOURCE_COMMIT" HEAD
        export NHC_UPGRADE_CANDIDATE_COMMIT="$(git rev-parse HEAD)"
        printf 'expected PR source: %s\nactual checkout: %s\n' \
          "$NHC_EXPECTED_SOURCE_COMMIT" "$NHC_UPGRADE_CANDIDATE_COMMIT"
        make operator-sdk yq
        export YQ="$PWD/bin/yq"
        export NHC_UPGRADE_OPERATOR_SDK="$PWD/bin/operator-sdk"
        "$NHC_UPGRADE_OPERATOR_SDK" version
        "$NHC_UPGRADE_OPERATOR_SDK" run --help | grep -q bundle-upgrade
        "$NHC_UPGRADE_OPERATOR_SDK" bundle validate "$OO_BUNDLE"

        git clone https://github.com/medik8s/system-tests.git /tmp/system-tests
        git -C /tmp/system-tests checkout --detach "$SYSTEM_TESTS_REVISION"
        test "$(git -C /tmp/system-tests rev-parse HEAD)" = "$SYSTEM_TESTS_REVISION"
        git -C /tmp/system-tests show --no-patch --format=fuller HEAD > "$ARTIFACT_DIR/provenance/system-tests-source.txt"
        # Both dependencies are concrete images from this same execution.
        # Independently compare their manager digests; extraction alone is
        # not proof that the bundle uses this PR's newly built operator.
        bash /tmp/system-tests/scripts/nhc-upgrade-inspect.sh \
          "$OO_BUNDLE" "$NHC_CANDIDATE_OPERATOR" 5.8.0 "$ARTIFACT_DIR/candidate"
        source "$ARTIFACT_DIR/candidate/verified-image.env"
        bash /tmp/system-tests/scripts/nhc-upgrade-baselines.sh "$ARTIFACT_DIR/baselines"
        source "$ARTIFACT_DIR/baselines/baseline-inputs.env"
        export ECO_TEST_FEATURES=nhc-operator
        export ECO_TEST_LABELS='tier:upgrade-operator'
        # This checkpoint does not create a workload; the existing test
        # framework still requires the variable during initialization.
        export WORKLOAD_IMAGE=unused-by-nhc-operator-upgrade
        export NHC_UPGRADE_TEST_REVISION="$SYSTEM_TESTS_REVISION"
        make -C /tmp/system-tests run-tests
      dependencies:
      - env: OO_BUNDLE
        name: my-bundle
      - env: NHC_CANDIDATE_OPERATOR
        name: node-healthcheck-operator
      env:
      - name: NHC_UPGRADE_OLD_BUNDLE
      - name: NHC_EXPECTED_SOURCE_COMMIT
      - name: NHC_UPGRADE_OLD_IMAGE
      - name: NHC_UPGRADE_OLD_VERSION
      - name: NHC_UPGRADE_PACKAGE
      - name: NHC_UPGRADE_SNR_BUNDLE
      - name: NHC_UPGRADE_SNR_PACKAGE
      - name: NHC_UPGRADE_NAMESPACE
      - name: SYSTEM_TESTS_REVISION
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 500Mi
    workflow: ipi-aws
- as: tls-pqc-readiness
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: medik8s-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      INSTALL_NAMESPACE: nhc-install
      PQC_CHECK: "true"
      SCAN_NAMESPACE: nhc-install
      SCANNER_CPU: "2"
    test:
    - as: install-operator
      cli: latest
      commands: |
        oc create namespace "$INSTALL_NAMESPACE"
        oc label --overwrite ns "$INSTALL_NAMESPACE" security.openshift.io/scc.podSecurityLabelSync=false
        oc label --overwrite ns "$INSTALL_NAMESPACE" pod-security.kubernetes.io/enforce=privileged
        OPERATOR_NAMESPACE="$INSTALL_NAMESPACE" BUNDLE_IMG=quay.io/medik8s/self-node-remediation-operator-bundle:latest make bundle-run
        OPERATOR_NAMESPACE="$INSTALL_NAMESPACE" BUNDLE_IMG="$OO_BUNDLE" make bundle-run
        oc wait --for condition=Available -n "$INSTALL_NAMESPACE" deployment node-healthcheck-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: my-bundle
      env:
      - name: INSTALL_NAMESPACE
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-aws
- as: tls13-adherence
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: medik8s-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      INSTALL_NAMESPACE: nhc-install
      PQC_CHECK: "false"
      SCAN_NAMESPACE: nhc-install
      SCANNER_CPU: "2"
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - as: install-operator
      cli: latest
      commands: |
        oc create namespace "$INSTALL_NAMESPACE"
        oc label --overwrite ns "$INSTALL_NAMESPACE" security.openshift.io/scc.podSecurityLabelSync=false
        oc label --overwrite ns "$INSTALL_NAMESPACE" pod-security.kubernetes.io/enforce=privileged
        OPERATOR_NAMESPACE="$INSTALL_NAMESPACE" BUNDLE_IMG=quay.io/medik8s/self-node-remediation-operator-bundle:latest make bundle-run
        OPERATOR_NAMESPACE="$INSTALL_NAMESPACE" BUNDLE_IMG="$OO_BUNDLE" make bundle-run
        oc wait --for condition=Available -n "$INSTALL_NAMESPACE" deployment node-healthcheck-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: my-bundle
      env:
      - name: INSTALL_NAMESPACE
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-aws
zz_generated_metadata:
  branch: medik8s-5.0
  org: medik8s
  repo: node-healthcheck-operator
  variant: "5.0"
