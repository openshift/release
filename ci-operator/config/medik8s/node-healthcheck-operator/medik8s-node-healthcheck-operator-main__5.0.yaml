base_images:
  base:
    name: ubi
    namespace: ocp
    tag: '9'
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  system-tests-builder:
    name: builder
    namespace: konveyor
    tag: ubi9-v1.27
binary_build_commands: make manager
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    from: base
    to: node-healthcheck-operator
  - dockerfile_literal: |
      FROM system-tests-builder AS go-builder
      FROM quay.io/operator-framework/operator-sdk:v1.42.2 AS operator-sdk
      FROM docker.io/mikefarah/yq:4.53.2 AS yq
      FROM nested-podman
      USER 0
      RUN dnf install -y git make skopeo jq findutils tar gzip gettext && dnf clean all
      COPY --from=go-builder /opt/app-root/src/go /opt/app-root/src/go
      COPY --from=operator-sdk /usr/local/bin/operator-sdk /usr/local/bin/operator-sdk
      COPY --from=yq /usr/bin/yq /usr/local/bin/yq
      ENV GOROOT=/opt/app-root/src/go
      ENV PATH=/opt/app-root/src/go/bin:$PATH
      COPY nhc-src/ /opt/nhc-ci-src/
    from: nested-podman
    inputs:
      src:
        paths:
        - destination_dir: nhc-src/
          source_path: /go/src/github.com/medik8s/node-healthcheck-operator/.
      system-tests-builder:
        as:
        - system-tests-builder
    to: source-upgrade-test-runner
  - dockerfile_literal: |
      FROM system-tests-builder AS go-builder
      FROM docker.io/mikefarah/yq:4.53.2 AS yq
      FROM nested-podman
      USER 0
      RUN dnf install -y git make skopeo jq findutils tar gzip && dnf clean all
      COPY --from=go-builder /opt/app-root/src/go /opt/app-root/src/go
      COPY --from=yq /usr/bin/yq /usr/local/bin/yq
      ENV GOROOT=/opt/app-root/src/go
      ENV PATH=/opt/app-root/src/go/bin:$PATH
    from: nested-podman
    inputs:
      system-tests-builder:
        as:
        - system-tests-builder
    to: fbc-upgrade-test-runner
  - dockerfile_literal: |
      FROM system-tests-builder AS go-builder
      FROM quay.io/operator-framework/operator-sdk@sha256:1b37b208f424e5abec0dc2045b54d3942e2eb03e085f48baf19aff7e5a333d84 AS operator-sdk
      FROM nested-podman
      USER 0
      RUN dnf install -y git make skopeo jq findutils tar gzip gettext && dnf clean all
      COPY --from=go-builder /opt/app-root/src/go /opt/app-root/src/go
      COPY --from=operator-sdk /usr/local/bin/operator-sdk /usr/local/bin/operator-sdk
      ENV GOROOT=/opt/app-root/src/go
      ENV PATH=/opt/app-root/src/go/bin:$PATH
      COPY nhc-src/ /opt/nhc-ci-src/
    from: nested-podman
    inputs:
      src:
        paths:
        - destination_dir: nhc-src/
          source_path: /go/src/github.com/medik8s/node-healthcheck-operator/.
      system-tests-builder:
        as:
        - system-tests-builder
    to: nhc-pr-test-runner
operator:
  bundles:
  - as: my-bundle
    dockerfile_path: bundle.ci.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: quay.io/medik8s/node-healthcheck-operator:.*
    with: pipeline:node-healthcheck-operator
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: '5.0'
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 500Mi
tests:
- always_run: false
  as: e2e-system-tests-nhc-upstream-pr-upgrade
  capabilities:
  - nested-podman
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      SOURCE_OPERATOR: nhc
      TEST_NAME: e2e-system-tests-nhc-upstream-pr-upgrade
      TEST_STEPS: medik8s-source-upgrade
    post:
    - ref: medik8s-analyze-e2e-failure
    - chain: ipi-aws-post
    - ref: send-results-to-reportportal
    test:
    - ref: medik8s-source-upgrade
    workflow: ipi-aws
- always_run: false
  as: e2e-system-tests-nhc-fbc-upgrade
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      FBC_CANDIDATE_IMAGE: registry.redhat.io/workload-availability/node-healthcheck-rhel9-operator@sha256:1467d202417527668cc1945acfcbc01f5bed2d6b67704d77b52df62e78036336
      FBC_CANDIDATE_MIRROR: quay.io/redhat-user-workloads/rhwa-tenant/node-healthcheck-operator/nhc-operator-5-8
      FBC_OPERATOR: nhc
      TEST_NAME: e2e-system-tests-nhc-fbc-upgrade
      TEST_STEPS: medik8s-fbc-upgrade
    post:
    - ref: medik8s-analyze-e2e-failure
    - chain: ipi-aws-post
    - ref: send-results-to-reportportal
    test:
    - ref: medik8s-fbc-upgrade
    workflow: ipi-aws
- always_run: false
  as: e2e-system-tests-nhc-pr-aws
  capabilities:
  - nested-podman
  - intranet
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      ECO_IS_DOWNSTREAM: 'false'
      ECO_TEST_FEATURES: nhc-operator
      ECO_TEST_LABELS: '!tier:upgrade && !tier:upgrade-operator && !tier:fresh-install && !tier:upgrade-cluster && !tier:interop'
      ECO_TEST_VERBOSE: 'true'
      TEST_NAME: e2e-system-tests-nhc-pr-aws
      TEST_STEPS: e2e-test
    post:
    - ref: medik8s-analyze-e2e-failure
    test:
    - as: build-and-install-nhc
      cli: latest
      commands: "set -o errexit -o nounset -o pipefail\n\n: \"${ARTIFACT_DIR:?ci-operator must provide ARTIFACT_DIR}\"\nexec > >(tee \"$ARTIFACT_DIR/build-and-install-nhc.log\") 2>&1\n\nOO_INSTALL_NAMESPACE=openshift-workload-availability\nOO_INSTALL_TIMEOUT_MINUTES=10\n\nprepare_runtime() {\n  echo '==> Read cluster pull secret for Red Hat registry access'\n  local auth_dir=/tmp/nhc-registry-auth\n  mkdir -p \"$auth_dir\"\n  oc get secret pull-secret -n openshift-config -o jsonpath='{.data.\\.dockerconfigjson}' |\n    base64 --decode > \"$auth_dir/auth.json\"\n  chmod 0600 \"$auth_dir/auth.json\"\n  export REGISTRY_AUTH_FILE=\"$auth_dir/auth.json\"\n\n  export GOPATH=/tmp/nhc-go\n  export GOMODCACHE=\"$GOPATH/pkg/mod\"\n  export GOCACHE=/tmp/nhc-go-build-cache\n  mkdir -p \"$GOMODCACHE\" \"$GOCACHE\"\n\n  go version\n  skopeo --version\n  operator-sdk version\n  podman version\n  podman info\n\n  echo '==> Configure rootless Podman for the catalog base image UID'\n  local storage_config\n\
        \  storage_config=\"$(podman info --format '{{.Store.ConfigFile}}')\"\n  test -r \"$storage_config\"\n  export CONTAINERS_STORAGE_CONF=/tmp/nhc-storage.conf\n  awk '\n    /^\\[storage.options.overlay\\]$/ {\n      in_overlay=1; found=1; print; print \"ignore_chown_errors = \\\"true\\\"\"; next\n    }\n    /^\\[/ { in_overlay=0 }\n    in_overlay && /^[[:space:]]*ignore_chown_errors[[:space:]]*=/ { next }\n    { print }\n    END { if (!found) { print \"[storage.options.overlay]\"; print \"ignore_chown_errors = \\\"true\\\"\" } }\n  ' \"$storage_config\" > \"$CONTAINERS_STORAGE_CONF\"\n  test \"$(podman info --format '{{.Store.ConfigFile}}')\" = \"$CONTAINERS_STORAGE_CONF\"\n  echo '==> Pull catalog base image before building the candidate'\n  podman pull quay.io/operator-framework/opm:latest\n}\n\nbuild_candidate() {\n  echo '==> Copy the CI-selected NHC checkout into a writable build directory'\n  test -f /opt/nhc-ci-src/Makefile\n  cp -R /opt/nhc-ci-src /tmp/nhc-source\n\n  local\
        \ revision prefix operator_tag bundle_tag catalog_tag\n  revision=\"$(git -C /tmp/nhc-source rev-parse HEAD)\"\n  git -C /tmp/nhc-source show --no-patch --format=fuller HEAD\n  printf '%s\\n' \"$revision\" > \"$ARTIFACT_DIR/nhc-source-commit.txt\"\n\n  cd /tmp/nhc-source\n  export NHC_VERSION\n  NHC_VERSION=\"$(sed -n 's/^DEFAULT_VERSION := //p' Makefile)\"\n  test -n \"$NHC_VERSION\"\n  export NHC_PREVIOUS_VERSION\n  NHC_PREVIOUS_VERSION=\"$(skopeo list-tags docker://registry.redhat.io/workload-availability/node-healthcheck-operator-bundle |\n    jq -r '.Tags[] | select(test(\"^v[0-9]+\\\\.[0-9]+\\\\.[0-9]+$\"))' | sort -V | tail -n 1)\"\n  test -n \"$NHC_PREVIOUS_VERSION\"\n  NHC_PREVIOUS_VERSION=\"${NHC_PREVIOUS_VERSION#v}\"\n  test \"$NHC_VERSION\" != \"$NHC_PREVIOUS_VERSION\"\n  printf 'Candidate: %s; latest GA: %s\\n' \"$NHC_VERSION\" \"$NHC_PREVIOUS_VERSION\"\n  echo '==> Resolve NHC related images to digest pullspecs'\n  local console_tag must_gather_tag console_digest mg_digest\n\
        \  console_tag=\"quay.io/medik8s/node-remediation-console:latest\"\n  must_gather_tag=\"quay.io/medik8s/must-gather:latest\"\n  console_digest=\"$(skopeo inspect --format '{{.Digest}}' \"docker://$console_tag\")\"\n  mg_digest=\"$(skopeo inspect --format '{{.Digest}}' \"docker://$must_gather_tag\")\"\n  test -n \"$console_digest\"\n  test -n \"$mg_digest\"\n  export CONSOLE_PLUGIN_IMAGE=\"quay.io/medik8s/node-remediation-console@$console_digest\"\n  export MUST_GATHER_IMAGE=\"quay.io/medik8s/must-gather@$mg_digest\"\n  printf 'CONSOLE_PLUGIN_IMAGE=%s\\nMUST_GATHER_IMAGE=%s\\n' \\\n    \"$CONSOLE_PLUGIN_IMAGE\" \"$MUST_GATHER_IMAGE\" |\n    tee \"$ARTIFACT_DIR/nhc-related-images.txt\"\n  prefix=\"ttl.sh/nhc-prow-$(date +%Y%m%d-%H%M%S)-${revision:0:7}\"\n  operator_tag=\"${prefix}:3h\"\n  bundle_tag=\"${prefix}-bundle:3h\"\n  catalog_tag=\"${prefix}-catalog:3h\"\n\n  echo '==> Build and push operator, bundle, and catalog with the shared target'\n  make dev-olm-catalog-push \\\n   \
        \ DEV_REGISTRY=ttl.sh \\\n    TTL_SH_TTL=3h \\\n    CONTAINER_TOOL=podman \\\n    DEV_IMG=\"$operator_tag\" \\\n    VERSION=\"$NHC_VERSION\" PREVIOUS_VERSION=\"$NHC_PREVIOUS_VERSION\" \\\n    CONSOLE_PLUGIN_IMAGE=\"$CONSOLE_PLUGIN_IMAGE\" \\\n    MUST_GATHER_IMAGE=\"$MUST_GATHER_IMAGE\"\n\n  echo '==> Resolve pushed candidate images to immutable digests'\n  skopeo inspect --format '{{.Digest}}' \"docker://$operator_tag\" > \"$ARTIFACT_DIR/operator.digest\"\n  skopeo inspect --format '{{.Digest}}' \"docker://$bundle_tag\" > \"$ARTIFACT_DIR/bundle.digest\"\n  skopeo inspect --format '{{.Digest}}' \"docker://$catalog_tag\" > \"$ARTIFACT_DIR/catalog.digest\"\n  export NHC_CANDIDATE_IMAGE=\"${prefix}@$(cat \"$ARTIFACT_DIR/operator.digest\")\"\n  export NHC_CANDIDATE_BUNDLE=\"${prefix}-bundle@$(cat \"$ARTIFACT_DIR/bundle.digest\")\"\n  NHC_CANDIDATE_CATALOG_IMAGE=\"${prefix}-catalog@$(cat \"$ARTIFACT_DIR/catalog.digest\")\"\n\n  printf 'NHC_CANDIDATE_IMAGE=%s\\nNHC_CANDIDATE_BUNDLE=%s\\\
        nNHC_CANDIDATE_CATALOG_IMAGE=%s\\n' \\\n    \"$NHC_CANDIDATE_IMAGE\" \"$NHC_CANDIDATE_BUNDLE\" \\\n    \"$NHC_CANDIDATE_CATALOG_IMAGE\" |\n    tee \"$ARTIFACT_DIR/candidate-images.txt\"\n}\n\nverify_candidate() {\n  echo '==> Validate candidate bundle'\n  operator-sdk bundle validate --image-builder=none \"$NHC_CANDIDATE_BUNDLE\"\n  local bundle_dir candidate_csv candidate_version\n  bundle_dir=\"$(mktemp -d)\"\n  oc image extract \"$NHC_CANDIDATE_BUNDLE\" --path=\"/manifests/:$bundle_dir\" --confirm\n  candidate_csv=\"$(find \"$bundle_dir\" -name '*clusterserviceversion.yaml' -print -quit)\"\n  : \"${candidate_csv:?candidate bundle must contain a ClusterServiceVersion}\"\n  candidate_version=\"$(sed -n 's/^  version: *//p' \"$candidate_csv\" | tr -d '\"')\"\n  : \"${candidate_version:?NHC bundle CSV must specify spec.version}\"\n  test \"$candidate_version\" = \"$NHC_VERSION\"\n  echo \"==> Candidate bundle verified: version $candidate_version\"\n}\n\ninstall_candidate() {\n  echo\
        \ \"==> Ensure namespace ${OO_INSTALL_NAMESPACE}\"\n  oc create namespace \"${OO_INSTALL_NAMESPACE}\" --dry-run=client -o yaml | oc apply -f -\n  oc label --overwrite \"ns/${OO_INSTALL_NAMESPACE}\" \\\n    security.openshift.io/scc.podSecurityLabelSync=false \\\n    pod-security.kubernetes.io/enforce=privileged\n\n  echo \"==> Install NHC candidate bundle via operator-sdk run bundle\"\n  operator-sdk run bundle \"$NHC_CANDIDATE_BUNDLE\" \\\n    -n \"${OO_INSTALL_NAMESPACE}\" \\\n    --verbose \\\n    --timeout=\"${OO_INSTALL_TIMEOUT_MINUTES}m\"\n\n  echo \"==> Wait for CSV Succeeded in ${OO_INSTALL_NAMESPACE}\"\n  local csv=\"\"\n  local attempts=$((OO_INSTALL_TIMEOUT_MINUTES * 6))\n  local i sub\n  for i in $(seq 1 \"$attempts\"); do\n    while IFS= read -r sub; do\n      [[ -z \"$sub\" ]] && continue\n      if [[ \"$(oc get subscription \"$sub\" -n \"$OO_INSTALL_NAMESPACE\" \\\n        -o jsonpath='{.spec.name}' 2>/dev/null)\" == \"node-healthcheck-operator\" ]]; then\n       \
        \ csv=$(oc get subscription \"$sub\" -n \"$OO_INSTALL_NAMESPACE\" \\\n          -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)\n        if [[ -n \"$csv\" ]]; then\n          break 2\n        fi\n      fi\n    done < <(oc get subscription -n \"$OO_INSTALL_NAMESPACE\" \\\n      -o jsonpath='{range .items[*]}{.metadata.name}{\"\\n\"}{end}' 2>/dev/null || true)\n    echo \"  attempt ${i}/${attempts} \u2014 installedCSV not set yet, waiting 10s...\"\n    sleep 10\n  done\n  : \"${csv:?No CSV installed for node-healthcheck-operator}\"\n  echo \"==> Waiting for CSV ${csv} to reach Succeeded\"\n  oc wait --for=jsonpath='{.status.phase}'=Succeeded \"csv/${csv}\" \\\n    -n \"${OO_INSTALL_NAMESPACE}\" --timeout=\"${OO_INSTALL_TIMEOUT_MINUTES}m\"\n}\ninstall_peer() {\n  local peer_bundle peer_package\n  peer_bundle=\"quay.io/medik8s/self-node-remediation-operator-bundle:latest\"\n  peer_package=\"self-node-remediation\"\n\n  echo \"==> Install peer $peer_package from $peer_bundle\"\
        \n  operator-sdk run bundle \"$peer_bundle\" \\\n    -n \"${OO_INSTALL_NAMESPACE}\" \\\n    --verbose \\\n    --timeout=\"${OO_INSTALL_TIMEOUT_MINUTES}m\"\n\n  echo \"==> Wait for peer CSV Succeeded ($peer_package)\"\n  local csv=\"\"\n  local attempts=$((OO_INSTALL_TIMEOUT_MINUTES * 6))\n  local i sub\n  for i in $(seq 1 \"$attempts\"); do\n    while IFS= read -r sub; do\n      [[ -z \"$sub\" ]] && continue\n      if [[ \"$(oc get subscription \"$sub\" -n \"$OO_INSTALL_NAMESPACE\" \\\n        -o jsonpath='{.spec.name}' 2>/dev/null)\" == \"$peer_package\" ]]; then\n        csv=$(oc get subscription \"$sub\" -n \"$OO_INSTALL_NAMESPACE\" \\\n          -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)\n        if [[ -n \"$csv\" ]]; then\n          break 2\n        fi\n      fi\n    done < <(oc get subscription -n \"$OO_INSTALL_NAMESPACE\" \\\n      -o jsonpath='{range .items[*]}{.metadata.name}{\"\\n\"}{end}' 2>/dev/null || true)\n    echo \"  attempt ${i}/${attempts} \u2014\
        \ peer installedCSV not set yet, waiting 10s...\"\n    sleep 10\n  done\n  : \"${csv:?No CSV installed for $peer_package}\"\n  echo \"==> Waiting for peer CSV ${csv} to reach Succeeded\"\n  oc wait --for=jsonpath='{.status.phase}'=Succeeded \"csv/${csv}\" \\\n    -n \"${OO_INSTALL_NAMESPACE}\" --timeout=\"${OO_INSTALL_TIMEOUT_MINUTES}m\"\n}\n\nprepare_runtime\nbuild_candidate\nverify_candidate\ninstall_candidate\ninstall_peer\n"
      from: nhc-pr-test-runner
      nested_podman: true
      resources:
        requests:
          cpu: '2'
          memory: 4Gi
    - ref: ssh-bastion
    - as: e2e-test
      cli: latest
      commands: |
        set -o errexit -o nounset -o pipefail

        : "${ARTIFACT_DIR:?ci-operator must provide ARTIFACT_DIR}"
        exec > >(tee "$ARTIFACT_DIR/e2e-test.log") 2>&1

        export GOPATH=/tmp/nhc-go
        export GOMODCACHE="$GOPATH/pkg/mod"
        export GOCACHE=/tmp/nhc-go-build-cache
        mkdir -p "$GOMODCACHE" "$GOCACHE"

        if [[ -f "${SHARED_DIR}/workload_image" ]]; then
          export WORKLOAD_IMAGE=$(cat "${SHARED_DIR}/workload_image")
        else
          # medik8s-lib (part of medik8s-setup) normally writes this; this job skips that chain.
          export WORKLOAD_IMAGE=registry.access.redhat.com/ubi9/ubi-minimal:latest
        fi

        echo '==> Clone openshift/rhwa-system-tests main'
        git clone --depth=1 --branch main \
          https://github.com/openshift/rhwa-system-tests.git /tmp/system-tests
        git -C /tmp/system-tests show --no-patch --format=fuller HEAD
        git -C /tmp/system-tests rev-parse HEAD > "$ARTIFACT_DIR/system-tests-commit.txt"

        export ECO_REPORTS_DUMP_DIR="${ARTIFACT_DIR}/reports"
        mkdir -p "$ECO_REPORTS_DUMP_DIR"

        echo '==> Run system-tests (nhc-operator)'
        make -C /tmp/system-tests run-tests
      env:
      - name: ECO_TEST_FEATURES
      - name: ECO_TEST_LABELS
      - name: ECO_TEST_VERBOSE
      - name: ECO_IS_DOWNSTREAM
      from: nhc-pr-test-runner
      resources:
        requests:
          cpu: '2'
          memory: 4Gi
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: medik8s
  repo: node-healthcheck-operator
  variant: '5.0'
