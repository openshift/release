base_images:
  base:
    name: ubi
    namespace: ocp
    tag: "9"
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  system-tests-builder:
    name: builder
    namespace: konveyor
    tag: ubi9-v1.27
  upi-installer:
    name: "5.0"
    namespace: ocp
    tag: upi-installer
binary_build_commands: make manager
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    from: base
    optional: true
    to: node-healthcheck-operator
  - dockerfile_literal: |
      FROM system-tests-builder AS go-builder
      FROM quay.io/operator-framework/operator-sdk:v1.42.2 AS operator-sdk
      FROM docker.io/mikefarah/yq:4.53.2 AS yq
      FROM nested-podman
      USER 0
      RUN dnf install -y git make skopeo jq findutils tar gzip gettext && dnf clean all
      COPY --from=go-builder /opt/app-root/src/go /opt/app-root/src/go
      COPY --from=operator-sdk /usr/local/bin/operator-sdk /usr/local/bin/operator-sdk
      COPY --from=yq /usr/bin/yq /usr/local/bin/yq
      ENV GOROOT=/opt/app-root/src/go
      ENV PATH=/opt/app-root/src/go/bin:$PATH
      COPY nhc-src/ /opt/nhc-ci-src/
    from: nested-podman
    inputs:
      src:
        paths:
        - destination_dir: nhc-src/
          source_path: /go/src/github.com/medik8s/node-healthcheck-operator/.
      system-tests-builder:
        as:
        - system-tests-builder
    to: source-upgrade-test-runner
  - dockerfile_literal: |
      FROM system-tests-builder AS go-builder
      FROM docker.io/mikefarah/yq:4.53.2 AS yq
      FROM nested-podman
      USER 0
      RUN dnf install -y git make skopeo jq findutils tar gzip && dnf clean all
      COPY --from=go-builder /opt/app-root/src/go /opt/app-root/src/go
      COPY --from=yq /usr/bin/yq /usr/local/bin/yq
      ENV GOROOT=/opt/app-root/src/go
      ENV PATH=/opt/app-root/src/go/bin:$PATH
    from: nested-podman
    inputs:
      system-tests-builder:
        as:
        - system-tests-builder
    to: fbc-upgrade-test-runner
  - dockerfile_literal: |
      FROM system-tests-builder AS go-builder
      FROM quay.io/operator-framework/operator-sdk@sha256:1b37b208f424e5abec0dc2045b54d3942e2eb03e085f48baf19aff7e5a333d84 AS operator-sdk
      FROM nested-podman
      USER 0
      RUN dnf install -y git make skopeo jq findutils tar gzip gettext && dnf clean all
      # OpenShift assigns an arbitrary UID; keep /etc/passwd group-writable so the
      # e2e step can register that UID (required by OpenSSH client).
      RUN chmod g=u /etc/passwd
      COPY --from=go-builder /opt/app-root/src/go /opt/app-root/src/go
      COPY --from=operator-sdk /usr/local/bin/operator-sdk /usr/local/bin/operator-sdk
      ENV GOROOT=/opt/app-root/src/go
      ENV PATH=/opt/app-root/src/go/bin:$PATH
      COPY nhc-src/ /opt/nhc-ci-src/
    from: nested-podman
    inputs:
      src:
        paths:
        - destination_dir: nhc-src/
          source_path: /go/src/github.com/medik8s/node-healthcheck-operator/.
      system-tests-builder:
        as:
        - system-tests-builder
    to: nhc-pr-test-runner
operator:
  bundles:
  - as: my-bundle
    dockerfile_path: bundle.ci.Dockerfile
    optional: true
    skip_building_index: true
  substitutions:
  - pullspec: quay.io/medik8s/node-healthcheck-operator:.*
    with: pipeline:node-healthcheck-operator
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 500Mi
tests:
- always_run: false
  as: e2e-system-tests-nhc-upstream-pr-upgrade
  capabilities:
  - nested-podman
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      SOURCE_OPERATOR: nhc
      TEST_NAME: e2e-system-tests-nhc-upstream-pr-upgrade
      TEST_STEPS: medik8s-source-upgrade
    post:
    - ref: medik8s-analyze-e2e-failure
    - chain: ipi-aws-post
    - ref: send-results-to-reportportal
    test:
    - ref: medik8s-source-upgrade
    workflow: ipi-aws
- always_run: false
  as: e2e-system-tests-nhc-fbc-upgrade
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      FBC_CANDIDATE_IMAGE: registry.redhat.io/workload-availability/node-healthcheck-rhel9-operator@sha256:1467d202417527668cc1945acfcbc01f5bed2d6b67704d77b52df62e78036336
      FBC_CANDIDATE_MIRROR: quay.io/redhat-user-workloads/rhwa-tenant/node-healthcheck-operator/nhc-operator-5-8
      FBC_OPERATOR: nhc
      TEST_NAME: e2e-system-tests-nhc-fbc-upgrade
      TEST_STEPS: medik8s-fbc-upgrade
    post:
    - ref: medik8s-analyze-e2e-failure
    - chain: ipi-aws-post
    - ref: send-results-to-reportportal
    test:
    - ref: medik8s-fbc-upgrade
    workflow: ipi-aws
- always_run: false
  as: e2e-system-tests-nhc-pr-aws
  capabilities:
  - nested-podman
  - intranet
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      ECO_IS_DOWNSTREAM: "false"
      ECO_TEST_FEATURES: nhc-operator
      ECO_TEST_LABELS: '!tier:upgrade && !tier:upgrade-operator && !tier:fresh-install
        && !tier:upgrade-cluster && !tier:interop'
      ECO_TEST_VERBOSE: "true"
      TEST_NAME: e2e-system-tests-nhc-pr-aws
      TEST_STEPS: e2e-test
    post:
    - ref: medik8s-analyze-e2e-failure
    - chain: ipi-aws-post
    test:
    - as: build-and-install-nhc
      cli: latest
      commands: |
        set -o errexit -o nounset -o pipefail

        : "${ARTIFACT_DIR:?ci-operator must provide ARTIFACT_DIR}"
        exec > >(tee "$ARTIFACT_DIR/build-and-install-nhc.log") 2>&1

        OO_INSTALL_NAMESPACE=openshift-workload-availability
        OO_INSTALL_TIMEOUT_MINUTES=10

        prepare_runtime() {
          echo '==> Read cluster pull secret for Red Hat registry access'
          local auth_dir=/tmp/nhc-registry-auth
          mkdir -p "$auth_dir"
          oc get secret pull-secret -n openshift-config -o jsonpath='{.data.\.dockerconfigjson}' |
            base64 --decode > "$auth_dir/auth.json"
          chmod 0600 "$auth_dir/auth.json"
          export REGISTRY_AUTH_FILE="$auth_dir/auth.json"

          export GOPATH=/tmp/nhc-go
          export GOMODCACHE="$GOPATH/pkg/mod"
          export GOCACHE=/tmp/nhc-go-build-cache
          mkdir -p "$GOMODCACHE" "$GOCACHE"

          go version
          skopeo --version
          operator-sdk version
          podman version
          podman info

          echo '==> Configure rootless Podman for the catalog base image UID'
          local storage_config
          storage_config="$(podman info --format '{{.Store.ConfigFile}}')"
          test -r "$storage_config"
          export CONTAINERS_STORAGE_CONF=/tmp/nhc-storage.conf
          awk '
            /^\[storage.options.overlay\]$/ {
              in_overlay=1; found=1; print; print "ignore_chown_errors = \"true\""; next
            }
            /^\[/ { in_overlay=0 }
            in_overlay && /^[[:space:]]*ignore_chown_errors[[:space:]]*=/ { next }
            { print }
            END { if (!found) { print "[storage.options.overlay]"; print "ignore_chown_errors = \"true\"" } }
          ' "$storage_config" > "$CONTAINERS_STORAGE_CONF"
          test "$(podman info --format '{{.Store.ConfigFile}}')" = "$CONTAINERS_STORAGE_CONF"
          echo '==> Pull catalog base image before building the candidate'
          podman pull quay.io/operator-framework/opm:latest
        }

        build_candidate() {
          echo '==> Copy the CI-selected NHC checkout into a writable build directory'
          test -f /opt/nhc-ci-src/Makefile
          cp -R /opt/nhc-ci-src /tmp/nhc-source

          local revision prefix operator_tag bundle_tag catalog_tag
          revision="$(git -C /tmp/nhc-source rev-parse HEAD)"
          git -C /tmp/nhc-source show --no-patch --format=fuller HEAD
          printf '%s\n' "$revision" > "$ARTIFACT_DIR/nhc-source-commit.txt"

          cd /tmp/nhc-source
          export NHC_VERSION
          NHC_VERSION="$(sed -n 's/^DEFAULT_VERSION := //p' Makefile)"
          test -n "$NHC_VERSION"
          export NHC_PREVIOUS_VERSION
          NHC_PREVIOUS_VERSION="$(skopeo list-tags docker://registry.redhat.io/workload-availability/node-healthcheck-operator-bundle |
            jq -r '.Tags[] | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' | sort -V | tail -n 1)"
          test -n "$NHC_PREVIOUS_VERSION"
          NHC_PREVIOUS_VERSION="${NHC_PREVIOUS_VERSION#v}"
          test "$NHC_VERSION" != "$NHC_PREVIOUS_VERSION"
          printf 'Candidate: %s; latest GA: %s\n' "$NHC_VERSION" "$NHC_PREVIOUS_VERSION"
          echo '==> Resolve NHC related images to digest pullspecs'
          local console_tag must_gather_tag console_digest mg_digest
          console_tag="quay.io/medik8s/node-remediation-console:latest"
          must_gather_tag="quay.io/medik8s/must-gather:latest"
          console_digest="$(skopeo inspect --format '{{.Digest}}' "docker://$console_tag")"
          mg_digest="$(skopeo inspect --format '{{.Digest}}' "docker://$must_gather_tag")"
          test -n "$console_digest"
          test -n "$mg_digest"
          export CONSOLE_PLUGIN_IMAGE="quay.io/medik8s/node-remediation-console@$console_digest"
          export MUST_GATHER_IMAGE="quay.io/medik8s/must-gather@$mg_digest"
          printf 'CONSOLE_PLUGIN_IMAGE=%s\nMUST_GATHER_IMAGE=%s\n' \
            "$CONSOLE_PLUGIN_IMAGE" "$MUST_GATHER_IMAGE" |
            tee "$ARTIFACT_DIR/nhc-related-images.txt"
          prefix="ttl.sh/nhc-prow-$(date +%Y%m%d-%H%M%S)-${revision:0:7}"
          operator_tag="${prefix}:3h"
          bundle_tag="${prefix}-bundle:3h"
          catalog_tag="${prefix}-catalog:3h"

          echo '==> Build and push operator, bundle, and catalog with the shared target'
          make dev-olm-catalog-push \
            DEV_REGISTRY=ttl.sh \
            TTL_SH_TTL=3h \
            CONTAINER_TOOL=podman \
            DEV_IMG="$operator_tag" \
            VERSION="$NHC_VERSION" PREVIOUS_VERSION="$NHC_PREVIOUS_VERSION" \
            CONSOLE_PLUGIN_IMAGE="$CONSOLE_PLUGIN_IMAGE" \
            MUST_GATHER_IMAGE="$MUST_GATHER_IMAGE"

          echo '==> Resolve pushed candidate images to immutable digests'
          skopeo inspect --format '{{.Digest}}' "docker://$operator_tag" > "$ARTIFACT_DIR/operator.digest"
          skopeo inspect --format '{{.Digest}}' "docker://$bundle_tag" > "$ARTIFACT_DIR/bundle.digest"
          skopeo inspect --format '{{.Digest}}' "docker://$catalog_tag" > "$ARTIFACT_DIR/catalog.digest"
          export NHC_CANDIDATE_IMAGE="${prefix}@$(cat "$ARTIFACT_DIR/operator.digest")"
          export NHC_CANDIDATE_BUNDLE="${prefix}-bundle@$(cat "$ARTIFACT_DIR/bundle.digest")"
          NHC_CANDIDATE_CATALOG_IMAGE="${prefix}-catalog@$(cat "$ARTIFACT_DIR/catalog.digest")"

          printf 'NHC_CANDIDATE_IMAGE=%s\nNHC_CANDIDATE_BUNDLE=%s\nNHC_CANDIDATE_CATALOG_IMAGE=%s\n' \
            "$NHC_CANDIDATE_IMAGE" "$NHC_CANDIDATE_BUNDLE" \
            "$NHC_CANDIDATE_CATALOG_IMAGE" |
            tee "$ARTIFACT_DIR/candidate-images.txt"
        }

        verify_candidate() {
          echo '==> Validate candidate bundle'
          operator-sdk bundle validate --image-builder=none "$NHC_CANDIDATE_BUNDLE"
          local bundle_dir candidate_csv candidate_version
          bundle_dir="$(mktemp -d)"
          oc image extract "$NHC_CANDIDATE_BUNDLE" --path="/manifests/:$bundle_dir" --confirm
          candidate_csv="$(find "$bundle_dir" -name '*clusterserviceversion.yaml' -print -quit)"
          : "${candidate_csv:?candidate bundle must contain a ClusterServiceVersion}"
          candidate_version="$(sed -n 's/^  version: *//p' "$candidate_csv" | tr -d '"')"
          : "${candidate_version:?NHC bundle CSV must specify spec.version}"
          test "$candidate_version" = "$NHC_VERSION"
          echo "==> Candidate bundle verified: version $candidate_version"
        }

        install_candidate() {
          echo "==> Ensure namespace ${OO_INSTALL_NAMESPACE}"
          oc create namespace "${OO_INSTALL_NAMESPACE}" --dry-run=client -o yaml | oc apply -f -
          oc label --overwrite "ns/${OO_INSTALL_NAMESPACE}" \
            security.openshift.io/scc.podSecurityLabelSync=false \
            pod-security.kubernetes.io/enforce=privileged

          echo "==> Install NHC candidate bundle via operator-sdk run bundle"
          operator-sdk run bundle "$NHC_CANDIDATE_BUNDLE" \
            -n "${OO_INSTALL_NAMESPACE}" \
            --verbose \
            --timeout="${OO_INSTALL_TIMEOUT_MINUTES}m"

          echo "==> Wait for CSV Succeeded in ${OO_INSTALL_NAMESPACE}"
          local csv=""
          local attempts=$((OO_INSTALL_TIMEOUT_MINUTES * 6))
          local i sub
          for i in $(seq 1 "$attempts"); do
            while IFS= read -r sub; do
              [[ -z "$sub" ]] && continue
              if [[ "$(oc get subscription "$sub" -n "$OO_INSTALL_NAMESPACE" \
                -o jsonpath='{.spec.name}' 2>/dev/null)" == "node-healthcheck-operator" ]]; then
                csv=$(oc get subscription "$sub" -n "$OO_INSTALL_NAMESPACE" \
                  -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
                if [[ -n "$csv" ]]; then
                  break 2
                fi
              fi
            done < <(oc get subscription -n "$OO_INSTALL_NAMESPACE" \
              -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
            echo "  attempt ${i}/${attempts} — installedCSV not set yet, waiting 10s..."
            sleep 10
          done
          : "${csv:?No CSV installed for node-healthcheck-operator}"
          echo "==> Waiting for CSV ${csv} to reach Succeeded"
          oc wait --for=jsonpath='{.status.phase}'=Succeeded "csv/${csv}" \
            -n "${OO_INSTALL_NAMESPACE}" --timeout="${OO_INSTALL_TIMEOUT_MINUTES}m"
        }
        install_peer() {
          local peer_bundle peer_package
          peer_bundle="quay.io/medik8s/self-node-remediation-operator-bundle:latest"
          peer_package="self-node-remediation"

          echo "==> Install peer $peer_package from $peer_bundle"
          operator-sdk run bundle "$peer_bundle" \
            -n "${OO_INSTALL_NAMESPACE}" \
            --verbose \
            --timeout="${OO_INSTALL_TIMEOUT_MINUTES}m"

          echo "==> Wait for peer CSV Succeeded ($peer_package)"
          local csv=""
          local attempts=$((OO_INSTALL_TIMEOUT_MINUTES * 6))
          local i sub
          for i in $(seq 1 "$attempts"); do
            while IFS= read -r sub; do
              [[ -z "$sub" ]] && continue
              if [[ "$(oc get subscription "$sub" -n "$OO_INSTALL_NAMESPACE" \
                -o jsonpath='{.spec.name}' 2>/dev/null)" == "$peer_package" ]]; then
                csv=$(oc get subscription "$sub" -n "$OO_INSTALL_NAMESPACE" \
                  -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
                if [[ -n "$csv" ]]; then
                  break 2
                fi
              fi
            done < <(oc get subscription -n "$OO_INSTALL_NAMESPACE" \
              -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true)
            echo "  attempt ${i}/${attempts} — peer installedCSV not set yet, waiting 10s..."
            sleep 10
          done
          : "${csv:?No CSV installed for $peer_package}"
          echo "==> Waiting for peer CSV ${csv} to reach Succeeded"
          oc wait --for=jsonpath='{.status.phase}'=Succeeded "csv/${csv}" \
            -n "${OO_INSTALL_NAMESPACE}" --timeout="${OO_INSTALL_TIMEOUT_MINUTES}m"
        }

        prepare_runtime
        build_candidate
        verify_candidate
        install_candidate
        install_peer
      from: nhc-pr-test-runner
      nested_podman: true
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
    - ref: ssh-bastion
    - as: e2e-test
      cli: latest
      commands: |
        set -o errexit -o nounset -o pipefail

        : "${ARTIFACT_DIR:?ci-operator must provide ARTIFACT_DIR}"
        exec > >(tee "$ARTIFACT_DIR/e2e-test.log") 2>&1

        # Same pattern as ssh-bastion: OpenSSH requires the random OpenShift UID in /etc/passwd.
        if ! whoami &> /dev/null; then
          if [[ -w /etc/passwd ]]; then
            echo "${USER_NAME:-default}:x:$(id -u):0:${USER_NAME:-default} user:${HOME}:/sbin/nologin" >> /etc/passwd
          else
            echo "/etc/passwd is not writeable, and user matching this uid is not found."
            exit 1
          fi
        fi

        export GOPATH=/tmp/nhc-go
        export GOMODCACHE="$GOPATH/pkg/mod"
        export GOCACHE=/tmp/nhc-go-build-cache
        mkdir -p "$GOMODCACHE" "$GOCACHE"

        if [[ -f "${SHARED_DIR}/workload_image" ]]; then
          export WORKLOAD_IMAGE=$(cat "${SHARED_DIR}/workload_image")
        else
          # medik8s-lib (part of medik8s-setup) normally writes this; this job skips that chain.
          export WORKLOAD_IMAGE=registry.access.redhat.com/ubi9/ubi-minimal:latest
        fi

        echo '==> Clone openshift/rhwa-system-tests main'
        git clone --depth=1 --branch main \
          https://github.com/openshift/rhwa-system-tests.git /tmp/system-tests
        git -C /tmp/system-tests show --no-patch --format=fuller HEAD
        git -C /tmp/system-tests rev-parse HEAD > "$ARTIFACT_DIR/system-tests-commit.txt"

        export ECO_REPORTS_DUMP_DIR="${ARTIFACT_DIR}/reports"
        mkdir -p "$ECO_REPORTS_DUMP_DIR"

        echo '==> Run system-tests (nhc-operator)'
        make -C /tmp/system-tests run-tests
      env:
      - name: ECO_TEST_FEATURES
      - name: ECO_TEST_LABELS
      - name: ECO_TEST_VERBOSE
      - name: ECO_IS_DOWNSTREAM
      from: nhc-pr-test-runner
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: medik8s
  repo: node-healthcheck-operator
  variant: "5.0"
