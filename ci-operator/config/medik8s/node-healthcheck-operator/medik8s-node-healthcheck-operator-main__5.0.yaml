              source: registry.redhat.io/workload-availability/storage-based-remediation-operator-bundle
        EOF
          export NHC_FBC_IDMS_PATH=/tmp/nhc-fbc-idms.yaml
        }

        prepare_candidate() {
          write_idms

          # Post-MR-617 artifacts that passed the local tier:upgrade-operator run.
          export NHC_FBC_CATALOG_IMAGE='quay.io/redhat-user-workloads/rhwa-tenant/rhwa-fbc/rhwa-fbc-500@sha256:5865bf9dda1a2b2a554a496ada5a9f4f6d0a0ad7efb74578cfc02d47300e1c3a'
          export NHC_FBC_CANDIDATE_VERSION=5.8.0
          export NHC_FBC_CANDIDATE_IMAGE='registry.redhat.io/workload-availability/node-healthcheck-rhel9-operator@sha256:6d18d257929d6f7cee3add33bbcd9342fb0c0f3ffd0e754b8b2db4473bd4b43d'
          export NHC_FBC_CHANNEL=stable
          export NHC_FBC_IDMS_PATH=/tmp/nhc-fbc-idms.yaml
        }

        checkout_system_tests() {
          # TODO: Revert this rehearsal-only checkout after openshift/rhwa-system-tests#18 merges.
          echo '==> Check out openshift/rhwa-system-tests PR 18'
          git clone --depth=1 --branch main \
            https://github.com/openshift/rhwa-system-tests.git /tmp/system-tests
          git -C /tmp/system-tests fetch --depth=1 \
            https://github.com/openshift/rhwa-system-tests.git refs/pull/18/head
