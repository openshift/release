base_images:
  cli:
    name: "4.22"
    namespace: ocp
    tag: cli
  ocp-4:
    name: automation-flavors
    namespace: stackrox
    tag: openshift-4-latest
build_root:
  image_stream_tag:
    name: apollo-ci
    namespace: stackrox
    tag: stackrox-ui-test-stable
resources:
  '*':
    requests:
      cpu: 2000m
      memory: 4000Mi
test_binary_build_commands: .openshift-ci/dispatch.sh test-binary-build-commands
tests:
- always_run: false
  as: qa-e2e-tests
  optional: true
  steps:
    env:
      COLLECTION_METHOD: core_bpf
      OCP_VERSION: ocp/candidate-4.22
      TEST_SUITE: ocp-qa-e2e-tests
    workflow: stackrox-automation-flavors-ocp-4-e2e
- always_run: false
  as: nongroovy-e2e-tests
  optional: true
  steps:
    env:
      COLLECTION_METHOD: core_bpf
      OCP_VERSION: ocp/candidate-4.22
      TEST_SUITE: ocp-nongroovy-e2e-tests
    workflow: stackrox-automation-flavors-ocp-4-e2e
zz_generated_metadata:
  branch: master
  org: stackrox
  repo: stackrox
  variant: ocp-4-22-bootstrap-retry
