- as: vault-secrets-health-check
  postsubmit: true
  steps:
    test:
    - as: check
      commands: |
        set +xve
        echo "=== Vault Secrets Health Check ==="
        echo ""
        # Use python3 for all checking — avoids shell subprocess overhead
        # and sha256sum/od availability issues. Writes report to temp file
        # (never prints secret values to stdout).
        REPORT=$(mktemp)
        DEBUG_LOG=$(mktemp)
        python3 -u - "$REPORT" "$DEBUG_LOG" << 'PYEOF'
        import hashlib, os, sys, base64, time
        report_path = sys.argv[1]
        debug_path = sys.argv[2]
        report = open(report_path, 'w')
        debug = open(debug_path, 'w')
        def log(msg):
            debug.write(f"{time.strftime('%H:%M:%S')} {msg}\n")
            debug.flush()
        log("Starting health check")
        # Load salt
        salt = ""
        salt_file = "/tmp/vault/stackrox-stackrox-e2e-tests/HEALTH_CHECK_FINGERPRINT_SALT"
        if os.path.isfile(salt_file):
            salt = open(salt_file).read()
            log(f"Salt loaded: {len(salt)} chars")
        # Collection summary
        report.write("=== Collections ===\n")
        vault_root = "/tmp/vault"
        for col in sorted(os.listdir(vault_root)):
            col_path = os.path.join(vault_root, col)
            if not os.path.isdir(col_path):
                continue
            count = 0
            for root, dirs, files in os.walk(col_path):
                count += sum(1 for f in files if f[0:1].isupper() and f != "HEALTH_CHECK_FINGERPRINT_SALT")
            report.write(f"  {col}: {count} secrets\n")
        report.write("\n=== Per-Secret Results ===\n")
        warn_count = 0
        ok_count = 0
        fps = []
        for col in sorted(os.listdir(vault_root)):
            col_path = os.path.join(vault_root, col)
            if not os.path.isdir(col_path):
                continue
            for root, dirs, files in os.walk(col_path):
                for fname in sorted(files):
                    if not fname[0:1].isupper() or fname == "HEALTH_CHECK_FINGERPRINT_SALT":
                        continue
                    fpath = os.path.join(root, fname)
                    try:
                        raw = open(fpath, 'rb').read()
                    except Exception as e:
                        log(f"ERROR reading {fpath}: {e}")
                        continue
                    size = len(raw)
                    lines = raw.count(b'\n')
                    issues = []
                    # Trailing whitespace
                    if size > 0 and raw[-1:] in (b'\n', b' ', b'\t'):
                        issues.append(f"TRAILING_WHITESPACE(0x{raw[-1]:02x})")
                    # Multi-line
                    if lines > 1:
                        issues.append(f"MULTILINE({lines}lines)")
                    # Empty/short
                    if size <= 1:
                        issues.append("EMPTY_OR_PLACEHOLDER")
                    elif size <= 5:
                        issues.append(f"SUSPICIOUSLY_SHORT({size}b)")
                    # Leading quotes
                    if size > 0 and raw[0:1] == b"'":
                        issues.append("STARTS_WITH_SINGLE_QUOTE")
                    if size > 1 and raw[0:1] == b'"' and raw[1:2] in (b'"', b'{', b'['):
                        issues.append("STARTS_WITH_DOUBLE_QUOTE")
                    # Base64 decode check
                    try:
                        decoded = base64.b64decode(raw.strip())
                        dec_lines = decoded.count(b'\n')
                        if dec_lines > 1:
                            issues.append(f"B64_DECODED_MULTILINE({dec_lines}lines)")
                        if len(decoded) > 0 and decoded[-1:] in (b'\n', b' ', b'\t'):
                            issues.append(f"B64_DECODED_TRAILING_WS(0x{decoded[-1]:02x})")
                        if 0 < len(decoded) <= 1:
                            issues.append(f"B64_DECODED_SUSPICIOUSLY_SHORT({len(decoded)}b)")
                    except Exception:
                        pass
                    # Fingerprint
                    fp = "none"
                    if salt:
                        h = hashlib.sha256(f"{salt}:{col}:{fname}:".encode() + raw).hexdigest()[:8]
                        fp = h
                    fps.append(fp)
                    status = "WARN" if issues else "OK  "
                    issue_str = " " + " ".join(issues) if issues else ""
                    report.write(f"{status} {col}/{fname}: size={size} fp={fp}{issue_str}\n")
                    if issues:
                        warn_count += 1
                    else:
                        ok_count += 1
                    log(f"  {status.strip()} {col}/{fname} size={size} fp={fp}")
        # Overall fingerprint
        overall_fp = hashlib.sha256("\n".join(sorted(fps)).encode()).hexdigest()[:12]
        report.write(f"\n=== Summary ===\n")
        report.write(f"OK: {ok_count}  WARN: {warn_count}  collection-fp: {overall_fp}\n")
        if warn_count > 0:
            report.write(f"\n=== Warnings ===\n")
            report.seek(0)
            for line in report:
                if line.startswith("WARN"):
                    pass  # already in report above
            report.seek(0, 2)  # seek to end
            # Re-read and grep warnings
        log(f"Done: {ok_count} OK, {warn_count} WARN, collection-fp={overall_fp}")
        report.close()
        debug.close()
        PYEOF
        echo "Python check completed"
        # Print report to stdout (safe — only names + metadata)
        cat "$REPORT"
        # Upload debug log to GCS (private)
        gcloud config set core/disable_prompts True 2>/dev/null
        gcloud auth activate-service-account \
          --key-file /tmp/vault/stackrox-stackrox-e2e-tests/GCP_SERVICE_ACCOUNT_STACKROX_CI \
          2>/dev/null
        gcloud config set project acs-san-stackroxci 2>/dev/null
        DEST="gs://stackrox-ci-artifacts/env-debug/vault-health-check/${JOB_NAME:-unknown}/${BUILD_ID:-$(date +%s)}"
        gsutil cp "$DEBUG_LOG" "$DEST/debug-log.txt" 2>/dev/null || true
        echo "Debug log uploaded to $DEST/"
        # Cleanup
        warn_count=$(grep -c "^WARN" "$REPORT" || true)
        rm -f "$REPORT" "$DEBUG_LOG"
        if [[ "$warn_count" -gt 0 ]]; then
          echo ""
          echo "WARNING: ${warn_count} vault secrets have potential formatting issues."
          exit 1
        fi
      credentials:
      - mount_path: /tmp/vault/stackrox-stackrox-e2e-tests
        group: credentials
        collection: stackrox-stackrox-e2e-tests
      - mount_path: /tmp/vault/stackrox-automation-flavors
        group: credentials
        collection: stackrox-automation-flavors
      from: root
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
zz_generated_metadata:
  branch: nightlies
  org: stackrox
  repo: stackrox
