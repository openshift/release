- as: vault-secrets-health-check
  postsubmit: true
  steps:
    test:
    - as: check
      commands: |
        set +xve
        echo "=== Vault Secrets Health Check ==="
        echo "Checks: trailing whitespace, embedded newlines, empty/placeholder,"
        echo "        suspiciously short, leading quotes, base64 content issues,"
        echo "        per-secret fingerprint (salted, non-reversible)"
        echo ""
        REPORT=$(mktemp)
        # Collection summary
        echo "=== Collections ===" >> "$REPORT"
        for col_dir in /tmp/vault/*/; do
          col_name="$(basename "$col_dir")"
          count=$(find "$col_dir" -type f -name '[A-Z]*' 2>/dev/null | wc -l)
          echo "  ${col_name}: ${count} secrets" >> "$REPORT"
        done
        echo "" >> "$REPORT"
        echo "=== Per-Secret Results ===" >> "$REPORT"
        # Secret-handling subshell: stdout+stderr blackholed so no tool
        # can accidentally leak a value. Results written to $REPORT only.
        (
          exec 1>/dev/null 2>/dev/null
          FPSALT=""
          SALT_FILE="/tmp/vault/stackrox-stackrox-e2e-tests/HEALTH_CHECK_FINGERPRINT_SALT"
          if [[ -f "$SALT_FILE" ]]; then
            FPSALT=$(cat "$SALT_FILE")
          fi
          while IFS= read -r -d '' cred; do
            varname="$(basename "$cred")"
            dir="$(dirname "$cred")"
            while [[ "$(basename "$dir")" == ..* ]]; do dir="$(dirname "$dir")"; done
            collection="$(basename "$dir")"
            size=$(wc -c < "$cred")
            lines=$(wc -l < "$cred")
            last_byte=$(tail -c 1 "$cred" | od -An -tx1 | tr -d ' \n')
            first_char=$(head -c 1 "$cred")
            issues=""
            [[ "$last_byte" == "0a" || "$last_byte" == "20" || "$last_byte" == "09" ]] && \
              issues="${issues} TRAILING_WHITESPACE(0x${last_byte})"
            [[ "$lines" -gt 1 ]] && issues="${issues} MULTILINE(${lines}lines)"
            [[ "$size" -le 1 ]] && issues="${issues} EMPTY_OR_PLACEHOLDER"
            [[ "$size" -le 5 ]] && [[ "$size" -gt 1 ]] && issues="${issues} SUSPICIOUSLY_SHORT(${size}b)"
            if [[ "$first_char" == "'" ]]; then
              issues="${issues} STARTS_WITH_SINGLE_QUOTE"
            fi
            if [[ "$first_char" == '"' ]]; then
              second_char=$(head -c 2 "$cred" | tail -c 1)
              if [[ "$second_char" == '"' || "$second_char" == '{' || "$second_char" == '[' ]]; then
                issues="${issues} STARTS_WITH_DOUBLE_QUOTE"
              fi
            fi
            raw=$(cat "$cred")
            if decoded=$(echo -n "$raw" | base64 -d 2>/dev/null); then
              dec_size=${#decoded}
              dec_lines=$(echo -n "$decoded" | grep -c '' || true)
              dec_last=$(printf '%s' "$decoded" | tail -c 1 | od -An -tx1 | tr -d ' \n')
              if [[ "$dec_lines" -gt 1 ]]; then
                issues="${issues} B64_DECODED_MULTILINE(${dec_lines}lines)"
              fi
              if [[ "$dec_last" == "0a" || "$dec_last" == "20" || "$dec_last" == "09" ]]; then
                issues="${issues} B64_DECODED_TRAILING_WS(0x${dec_last})"
              fi
              if [[ "$dec_size" -le 1 ]] && [[ "$dec_size" -gt 0 ]]; then
                issues="${issues} B64_DECODED_SUSPICIOUSLY_SHORT(${dec_size}b)"
              fi
            fi
            fp=""
            if [[ -n "$FPSALT" ]]; then
              fp=$(printf '%s' "${FPSALT}:${collection}:${varname}:${raw}" | sha256sum | cut -c1-8)
            fi
            if [[ -n "$issues" ]]; then
              echo "WARN ${collection}/${varname}: size=${size} fp=${fp:-none}${issues}" >> "$REPORT"
            else
              echo "OK   ${collection}/${varname}: size=${size} fp=${fp:-none}" >> "$REPORT"
            fi
          done < <(find /tmp/vault/ -type f -name '[A-Z]*' -not -name 'HEALTH_CHECK_FINGERPRINT_SALT' -print0 2>/dev/null)
        )
        warn_count=$(grep -c "^WARN" "$REPORT" || true)
        ok_count=$(grep -c "^OK" "$REPORT" || true)
        overall_fp=$(grep -o 'fp=[a-f0-9]*' "$REPORT" | sort | sha256sum | cut -c1-12)
        echo "" >> "$REPORT"
        echo "=== Summary ===" >> "$REPORT"
        echo "OK: ${ok_count}  WARN: ${warn_count}  collection-fp: ${overall_fp}" >> "$REPORT"
        if [[ "$warn_count" -gt 0 ]]; then
          echo "" >> "$REPORT"
          echo "=== Warnings ===" >> "$REPORT"
          grep "^WARN" "$REPORT" >> "$REPORT.warnings" 2>/dev/null
          cat "$REPORT.warnings" >> "$REPORT"
          rm -f "$REPORT.warnings"
        fi
        cat "$REPORT"
        rm -f "$REPORT"
        if [[ "$warn_count" -gt 0 ]]; then
          echo ""
          echo "WARNING: ${warn_count} vault secrets have potential formatting issues."
          echo "Review the Warnings section above for details."
          exit 1
        fi
      credentials:
      - mount_path: /tmp/vault/stackrox-stackrox-e2e-tests
        group: credentials
        collection: stackrox-stackrox-e2e-tests
      - mount_path: /tmp/vault/stackrox-automation-flavors
        group: credentials
        collection: stackrox-automation-flavors
      from: root
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
