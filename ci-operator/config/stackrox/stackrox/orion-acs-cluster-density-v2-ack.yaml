# Orion acknowledgments for the stackrox ACS cluster-density-v2 perf-scale job.
# Add entries here to suppress known or expected change points.
# Each entry requires: uuid (the run's kube-burner UUID), metric, and reason.
---
ack:
  - uuid: a5139f83-1400-4199-8c3f-8c2b3b9d7bea
    metric: central-cpu_avg
    reason: >
      Original roxie installer run (2026-08-12, build 2087419079416614912) that caused
      the regression. The installer deployed 1 replica of scanner-v4-indexer/matcher
      instead of the 2 replicas the helm baseline used, increasing load on sensor and
      central. Fixed in PR #83373 (replicas set to 2). This data point ages out of the
      15-day lookback on 2026-08-27.
  - uuid: a5139f83-1400-4199-8c3f-8c2b3b9d7bea
    metric: sensor-cpu_avg
    reason: Same run and root cause as central-cpu_avg above.
  - uuid: a5139f83-1400-4199-8c3f-8c2b3b9d7bea
    metric: sensor-mem_avg
    reason: Same run and root cause as central-cpu_avg above.
