build_root:
  image_stream_tag:
    name: apollo-ci
    namespace: stackrox
    tag: stackrox-ui-test-stable
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 2000m
      memory: 4000Mi
tests:
- always_run: true
  as: gke-qa-e2e-tests
  steps:
    pre:
    - as: stackrox-stackrox-begin
      commands: |
        tee -a run.log <<< "no-op begin step for startup timing test"
        date -u
        ls -latr
      from: root
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
    test:
    - as: stackrox-stackrox-e2e-test
      commands: |
        tee -a run.log <<< "no-op e2e step for startup timing test"
        date -u
        ls -latr
        make tag
      from: root
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
    post:
    - as: stackrox-stackrox-end
      commands: |
        tee -a run.log <<< "no-op end step for startup timing test"
        date -u
        ls -latr
      from: root
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
zz_generated_metadata:
  branch: skip-test-bin-build
  org: stackrox
  repo: stackrox
