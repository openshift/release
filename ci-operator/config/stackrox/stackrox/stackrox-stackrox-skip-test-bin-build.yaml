build_root:
  image_stream_tag:
    name: apollo-ci
    namespace: stackrox
    tag: stackrox-ui-test-stable
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 2000m
      memory: 4000Mi
tests:
- always_run: true
  as: gke-qa-e2e-tests
  steps:
    pre:
    - as: stackrox-stackrox-begin
      commands: |
        set +xve
        echo "begin step: capturing environment metadata"
        # Import vault credentials with per-collection prefix to avoid overlap
        while IFS= read -r -d '' cred; do
          varname="$(basename "$cred")"
          # Walk up to find the collection name (skip timestamp dirs starting with ..)
          dir="$(dirname "$cred")"
          while [[ "$(basename "$dir")" == ..* ]]; do dir="$(dirname "$dir")"; done
          collection="$(basename "$dir")"
          collection="${collection//-/_}"
          export "VAULT_${collection}__${varname}"="$(cat "$cred")"
        done < <(find /tmp/vault/ -type f -name '[A-Z]*' -print0 2>/dev/null)
        # Set up GCP auth
        gcloud config set core/disable_prompts True
        gcloud auth activate-service-account \
          --key-file /tmp/vault/stackrox-stackrox-e2e-tests/GCP_SERVICE_ACCOUNT_STACKROX_CI \
          2>/dev/null
        gcloud config set project acs-san-stackroxci
        # Destination prefix in private bucket
        DEST_PREFIX="gs://stackrox-ci-artifacts/env-debug/${JOB_NAME:-unknown}/${BUILD_ID:-$(date +%s)}"
        CAPTURE_DIR="$(mktemp -d)"
        # 1. Full environment dump (values included — private bucket only)
        set > "$CAPTURE_DIR/env-full.txt" 2>&1
        # 4. Vault secrets health check
        warn_count=0
        ok_count=0
        {
          echo "=== Vault Secrets Health Check ==="
          echo "Checks: trailing newline/whitespace, embedded newlines, empty/placeholder,"
          echo "        suspiciously short, base64-decoded multiline/trailing whitespace"
          echo ""
          # Show collection version/timestamp metadata
          echo "=== Collection Versions ==="
          for col_dir in /tmp/vault/*/; do
            col_name="$(basename "$col_dir")"
            version_dir=$(ls -1d "${col_dir}"..* 2>/dev/null | head -1)
            if [[ -n "$version_dir" ]]; then
              echo "  ${col_name}: version=$(basename "$version_dir")"
            else
              echo "  ${col_name}: version=unknown"
            fi
          done
          echo ""
          echo "=== Per-Secret Results ==="
          while IFS= read -r -d '' cred; do
            varname="$(basename "$cred")"
            dir="$(dirname "$cred")"
            while [[ "$(basename "$dir")" == ..* ]]; do dir="$(dirname "$dir")"; done
            collection="$(basename "$dir")"
            size=$(wc -c < "$cred")
            lines=$(wc -l < "$cred")
            # Get last byte using od (POSIX, always available; xxd is not)
            last_byte=$(tail -c 1 "$cred" | od -An -tx1 | tr -d ' \n')
            issues=""
            [[ "$last_byte" == "0a" || "$last_byte" == "20" || "$last_byte" == "09" ]] && \
              issues="${issues} TRAILING_WHITESPACE(0x${last_byte})"
            [[ "$lines" -gt 1 ]] && issues="${issues} MULTILINE(${lines}lines)"
            [[ "$size" -le 1 ]] && issues="${issues} EMPTY_OR_PLACEHOLDER"
            [[ "$size" -le 5 ]] && [[ "$size" -gt 1 ]] && issues="${issues} SUSPICIOUSLY_SHORT(${size}b)"
            # Check if value is base64 — if so, decode and check the decoded content
            raw=$(cat "$cred")
            if decoded=$(echo -n "$raw" | base64 -d 2>/dev/null); then
              dec_size=${#decoded}
              dec_lines=$(echo -n "$decoded" | grep -c '' || true)
              dec_last=$(printf '%s' "$decoded" | tail -c 1 | od -An -tx1 | tr -d ' \n')
              if [[ "$dec_lines" -gt 1 ]]; then
                issues="${issues} B64_DECODED_MULTILINE(${dec_lines}lines)"
              fi
              if [[ "$dec_last" == "0a" || "$dec_last" == "20" || "$dec_last" == "09" ]]; then
                issues="${issues} B64_DECODED_TRAILING_WS(0x${dec_last})"
              fi
              if [[ "$dec_size" -le 1 ]] && [[ "$dec_size" -gt 0 ]]; then
                issues="${issues} B64_DECODED_SUSPICIOUSLY_SHORT(${dec_size}b)"
              fi
            fi
            if [[ -n "$issues" ]]; then
              echo "WARN ${collection}/${varname}: size=${size} lines=${lines}${issues}"
              warn_count=$((warn_count + 1))
            else
              echo "OK   ${collection}/${varname}: size=${size} lines=${lines}"
              ok_count=$((ok_count + 1))
            fi
          done < <(find /tmp/vault/ -type f -name '[A-Z]*' -print0 2>/dev/null)
          echo ""
          echo "=== Summary ==="
          echo "OK: ${ok_count}  WARN: ${warn_count}"
        } > "$CAPTURE_DIR/vault-health-check.txt"
        # Print public-safe summary to stdout (no secret names or values)
        echo "Vault health check: ${ok_count} OK, ${warn_count} warnings (details in GCS)"
        if [[ "$warn_count" -gt 0 ]]; then
          echo "WARNING: ${warn_count} vault secrets have potential formatting issues."
          echo "Check vault-health-check.txt in $DEST_PREFIX/ for details."
        fi
        # 2. System metadata
        {
          echo "=== id ==="
          id || true
          echo "=== uname ==="
          uname -a || true
          echo "=== date ==="
          date -u || true
          echo "=== pwd ==="
          pwd || true
          echo "=== df -h ==="
          df -h 2>/dev/null || true
          echo "=== mount ==="
          mount 2>/dev/null || true
          echo "=== /etc/resolv.conf ==="
          cat /etc/resolv.conf 2>/dev/null || true
        } > "$CAPTURE_DIR/system-info.txt"
        # 3. File listings
        {
          echo "=== /tmp/vault/ ==="
          find /tmp/vault/ -type f 2>/dev/null || true
          echo "=== SHARED_DIR ==="
          ls -la "${SHARED_DIR:-/dev/null}" 2>/dev/null || true
          echo "=== ARTIFACT_DIR ==="
          ls -la "${ARTIFACT_DIR:-/dev/null}" 2>/dev/null || true
          echo "=== working directory ==="
          ls -la . 2>/dev/null || true
          echo "=== /go/src/ ==="
          find /go/src/ -maxdepth 3 -type d 2>/dev/null || true
          echo "=== /usr/local/bin/ ==="
          ls -la /usr/local/bin/ 2>/dev/null || true
          echo "=== /tmp/ ==="
          ls -la /tmp/ 2>/dev/null || true
        } > "$CAPTURE_DIR/file-listings.txt"
        # Upload all to private bucket, then securely delete local copies
        gsutil -m cp "$CAPTURE_DIR"/*.txt "$DEST_PREFIX/" 2>/dev/null
        rm -rf "$CAPTURE_DIR"
        echo "Metadata captured to $DEST_PREFIX/"
      credentials:
      - mount_path: /tmp/vault/stackrox-stackrox-e2e-tests
        group: credentials
        collection: stackrox-stackrox-e2e-tests
      - mount_path: /tmp/vault/stackrox-automation-flavors
        group: credentials
        collection: stackrox-automation-flavors
      from: root
      resources:
        requests:
          cpu: 2000m
          memory: 4000Mi
      dnsConfig:
        nameservers:
        - 8.8.8.8
      timeout: 10m0s
    test:
    - as: stackrox-stackrox-e2e-test
      commands: |
        echo "e2e step: done"
      from: root
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
    post:
    - as: stackrox-stackrox-end
      commands: |
        echo "end step: done"
      from: root
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
zz_generated_metadata:
  branch: skip-test-bin-build
  org: stackrox
  repo: stackrox
