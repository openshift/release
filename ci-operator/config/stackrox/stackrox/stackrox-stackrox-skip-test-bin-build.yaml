binary_build_commands: "true"
build_root:
  image_stream_tag:
    name: apollo-ci
    namespace: stackrox
    tag: stackrox-ui-test-stable
  use_build_cache: true
promotion:
  to:
  - name: stackrox-cache
    namespace: stackrox
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 2000m
      memory: 4000Mi
tests:
- as: gke-qa-e2e-tests
  optional: true
  skip_if_only_changed: ^ui/
  steps:
    workflow: stackrox-stackrox-e2e-job
zz_generated_metadata:
  branch: skip-test-bin-build
  org: stackrox
  repo: stackrox
