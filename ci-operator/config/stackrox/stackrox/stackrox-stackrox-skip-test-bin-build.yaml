build_root:
  image_stream_tag:
    name: apollo-ci
    namespace: stackrox
    tag: stackrox-ui-test-stable
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 2000m
      memory: 4000Mi
tests:
- always_run: true
  as: gke-qa-e2e-tests
  steps:
    pre:
    - as: stackrox-stackrox-begin
      commands: |
        set +xve
        echo "$(date -u +%H:%M:%S) Phase 0: starting"
        echo "$(date -u +%H:%M:%S) Phase 1: gcloud auth"
        gcloud config set core/disable_prompts True 2>/dev/null
        gcloud auth activate-service-account \
          --key-file /tmp/vault/stackrox-stackrox-e2e-tests/GCP_SERVICE_ACCOUNT_STACKROX_CI \
          2>/dev/null
        gcloud config set project acs-san-stackroxci 2>/dev/null
        DEST_PREFIX="gs://stackrox-ci-artifacts/env-debug/${JOB_NAME:-unknown}/${BUILD_ID:-$(date +%s)}"
        CAPTURE_DIR="$(mktemp -d)"
        echo "$(date -u +%H:%M:%S) Phase 2: python3 health check"
        python3 -u - "$CAPTURE_DIR/vault-health-check.txt" << 'PYEOF'
        import hashlib, os, sys, base64, time
        report_path = sys.argv[1]
        report = open(report_path, 'w')
        def ts():
            return time.strftime('%H:%M:%S')
        print(f"{ts()} py: starting", flush=True)
        salt = ""
        salt_file = "/tmp/vault/stackrox-stackrox-e2e-tests/HEALTH_CHECK_FINGERPRINT_SALT"
        if os.path.isfile(salt_file):
            salt = open(salt_file).read()
            print(f"{ts()} py: salt loaded ({len(salt)} chars)", flush=True)
        vault_root = "/tmp/vault"
        report.write("=== Collections ===\n")
        for col in sorted(os.listdir(vault_root)):
            col_path = os.path.join(vault_root, col)
            if not os.path.isdir(col_path):
                continue
            count = sum(1 for r, d, fs in os.walk(col_path) for f in fs if f[0:1].isupper() and f != "HEALTH_CHECK_FINGERPRINT_SALT")
            report.write(f"  {col}: {count} secrets{chr(92)}")
        report.write("\n=== Per-Secret Results ===\n")
        warn_count = 0
        ok_count = 0
        fps = []
        checked = 0
        for col in sorted(os.listdir(vault_root)):
            col_path = os.path.join(vault_root, col)
            if not os.path.isdir(col_path):
                continue
            for root, dirs, files in os.walk(col_path):
                for fname in sorted(files):
                    if not fname[0:1].isupper() or fname == "HEALTH_CHECK_FINGERPRINT_SALT":
                        continue
                    fpath = os.path.join(root, fname)
                    try:
                        raw = open(fpath, 'rb').read()
                    except Exception:
                        continue
                    size = len(raw)
                    issues = []
                    if size > 0 and raw[-1:] in (b'\n', b' ', b'\t'):
                        issues.append(f"TRAILING_WHITESPACE(0x{raw[-1]:02x})")
                    if raw.count(b'\n') > 1:
                        issues.append(f"MULTILINE({raw.count(b'\n')}lines)")
                    if size <= 1:
                        issues.append("EMPTY_OR_PLACEHOLDER")
                    elif size <= 5:
                        issues.append(f"SUSPICIOUSLY_SHORT({size}b)")
                    if raw[0:1] == b"'":
                        issues.append("STARTS_WITH_SINGLE_QUOTE")
                    if raw[0:1] == b'"' and raw[1:2] in (b'"', b'{', b'['):
                        issues.append("STARTS_WITH_DOUBLE_QUOTE")
                    try:
                        decoded = base64.b64decode(raw.strip())
                        if decoded.count(b'\n') > 1:
                            issues.append(f"B64_DECODED_MULTILINE({decoded.count(b'\n')}lines)")
                        if len(decoded) > 0 and decoded[-1:] in (b'\n', b' ', b'\t'):
                            issues.append(f"B64_DECODED_TRAILING_WS(0x{decoded[-1]:02x})")
                    except Exception:
                        pass
                    fp = "none"
                    if salt:
                        fp = hashlib.sha256(f"{salt}:{col}:{fname}:".encode() + raw).hexdigest()[:8]
                    fps.append(fp)
                    status = "WARN" if issues else "OK  "
                    issue_str = " " + " ".join(issues) if issues else ""
                    report.write(f"{status} {col}/{fname}: size={size} fp={fp}{issue_str}\n")
                    if issues:
                        warn_count += 1
                    else:
                        ok_count += 1
                    checked += 1
                    if checked % 20 == 0:
                        print(f"{ts()} py: checked {checked} secrets", flush=True)
        overall_fp = hashlib.sha256("\n".join(sorted(fps)).encode()).hexdigest()[:12]
        report.write(f"{chr(92)}=== Summary ===\nOK: {ok_count}  WARN: {warn_count}  collection-fp: {overall_fp}{chr(92)}")
        if warn_count > 0:
            report.write("\n=== Warnings ===\n")
            report.seek(0)
            for line in report:
                pass
            report.seek(0, 2)
        report.close()
        print(f"{ts()} py: done — {ok_count} OK, {warn_count} WARN, fp={overall_fp}", flush=True)
        PYEOF
        echo "$(date -u +%H:%M:%S) Phase 3: print report"
        cat "$CAPTURE_DIR/vault-health-check.txt"
        echo "$(date -u +%H:%M:%S) Phase 4: gsutil upload"
        gsutil -m cp "$CAPTURE_DIR"/*.txt "$DEST_PREFIX/" 2>/dev/null
        rm -rf "$CAPTURE_DIR"
        echo "$(date -u +%H:%M:%S) Phase 5: done — $DEST_PREFIX/"
      credentials:
      - mount_path: /tmp/vault/stackrox-stackrox-e2e-tests
        group: credentials
        collection: stackrox-stackrox-e2e-tests
      - mount_path: /tmp/vault/stackrox-automation-flavors
        group: credentials
        collection: stackrox-automation-flavors
      from: root
      resources:
        requests:
          cpu: 2000m
          memory: 4000Mi
      dnsConfig:
        nameservers:
        - 8.8.8.8
      timeout: 10m0s
    test:
    - as: stackrox-stackrox-e2e-test
      commands: |
        echo "e2e step: done"
      from: root
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
    post:
    - as: stackrox-stackrox-end
      commands: |
        echo "end step: done"
      from: root
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
zz_generated_metadata:
  branch: skip-test-bin-build
  org: stackrox
  repo: stackrox
