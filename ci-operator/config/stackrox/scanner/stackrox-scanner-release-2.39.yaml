base_images:
  ubi-minimal:
    name: ubi-minimal
    namespace: ocp
    tag: "8"
build_root:
  image_stream_tag:
    name: apollo-ci
    namespace: stackrox
    tag: scanner-test-0.4.9
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 2000m
      memory: 4000Mi
test_binary_build_commands: .openshift-ci/dispatch.sh noop
tests:
- as: e2e-tests
  optional: true
  steps:
    test:
    - as: e2e-tests
      commands: .openshift-ci/dispatch.sh e2e-tests
      credentials:
      - collection: stackrox-scanner-secrets
        group: credentials
        mount_path: /tmp/secret/stackrox-scanner-secrets
      from: src
      resources:
        requests:
          cpu: 2000m
          memory: 4000Mi
      timeout: 4h0m0s
- as: slim-e2e-tests
  optional: true
  steps:
    test:
    - as: e2e-tests
      commands: .openshift-ci/dispatch.sh slim-e2e-tests
      credentials:
      - collection: stackrox-scanner-secrets
        group: credentials
        mount_path: /tmp/secret/stackrox-scanner-secrets
      from: src
      resources:
        requests:
          cpu: 2000m
          memory: 4000Mi
- as: merge-e2e-tests
  postsubmit: true
  steps:
    test:
    - as: e2e-tests
      commands: .openshift-ci/dispatch.sh e2e-tests
      credentials:
      - collection: stackrox-scanner-secrets
        group: credentials
        mount_path: /tmp/secret/stackrox-scanner-secrets
      from: src
      resources:
        requests:
          cpu: 2000m
          memory: 4000Mi
      timeout: 4h0m0s
- as: merge-slim-e2e-tests
  postsubmit: true
  steps:
    test:
    - as: e2e-tests
      commands: .openshift-ci/dispatch.sh slim-e2e-tests
      credentials:
      - collection: stackrox-scanner-secrets
        group: credentials
        mount_path: /tmp/secret/stackrox-scanner-secrets
      from: src
      resources:
        requests:
          cpu: 2000m
          memory: 4000Mi
zz_generated_metadata:
  branch: release-2.39
  org: stackrox
  repo: scanner
