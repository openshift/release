base_images:
  operator-registry:
    name: "4.20"
    namespace: ocp
    tag: operator-registry
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-4.23
images:
  items:
  - dockerfile_path: Dockerfile
    to: koku-service-operator
  - dockerfile_literal: |-
      FROM src
      USER root
      RUN dnf install -y python3.11 python3.11-pip jq git && dnf clean all && \
          alternatives --install /usr/bin/python3 python3 /usr/bin/python3.11 20
      RUN python3 -m pip install --no-cache-dir \
          'pytest>=7' 'pytest-timeout>=2' 'pytest-html>=4' \
          'requests>=2.28' 'urllib3>=1.26' \
          'python-jose[cryptography]>=3.3' 'cryptography>=41' \
          'PyYAML>=6' 'kubernetes>=25' 'boto3>=1.28' 'koku-nise>=4'
      RUN mkdir -p /home/e2e /tmp/e2e-reports && \
          chown -R 65532:0 /home/e2e /tmp/e2e-reports && \
          chmod -R g=u /home/e2e /tmp/e2e-reports
      ENV HOME=/home/e2e
      USER 65532
    from: src
    to: koku-service-operator-e2e
  - dockerfile_literal: |-
      FROM bundle AS bundle
      FROM builder AS builder
      USER 0
      RUN mkdir -p /configs
      COPY --from=bundle / /bundle
      RUN opm render /bundle -o yaml > /tmp/bundle.yaml && \
          { echo '---'; echo 'schema: olm.package'; echo 'name: koku-service-operator'; echo 'defaultChannel: beta'; } > /configs/index.yaml && \
          cat /tmp/bundle.yaml >> /configs/index.yaml && \
          printf '%s\n' '---' 'schema: olm.channel' 'package: koku-service-operator' 'name: beta' 'entries:' '- name: koku-service-operator.v0.0.1' >> /configs/index.yaml && \
          opm validate /configs
      FROM registry
      USER 0
      COPY --from=builder /configs /configs
      RUN mkdir -p /tmp/cache && \
          opm serve /configs --cache-dir=/tmp/cache --cache-only && \
          chmod -R g=u /configs /tmp/cache
      LABEL operators.operatorframework.io.index.configs.v1=/configs
      USER 65532
      EXPOSE 50051
      ENTRYPOINT ["/bin/opm"]
      CMD ["serve", "/configs", "--cache-dir=/tmp/cache", "--cache-enforce-integrity=false"]
    from: operator-registry
    inputs:
      koku-service-operator-bundle:
        as:
        - bundle
      operator-registry:
        as:
        - builder
    to: koku-service-operator-catalog
operator:
  bundles:
  - as: koku-service-operator-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
    skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  substitutions:
  - pullspec: quay.io/project-koku/koku-service-operator:v0.0.1
    with: pipeline:koku-service-operator
releases:
  latest:
    release:
      architecture: amd64
      channel: fast
      version: "4.20"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: build
  commands: GOFLAGS=-mod=mod go build -o /dev/null ./cmd/main.go
  container:
    from: src
- always_run: false
  as: e2e-olm
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 1h0m0s
    version: "4.20"
  optional: true
  steps:
    test:
    - as: install
      cli: latest
      commands: |
        set -euo pipefail
        NS=koku-service-operator-system
        oc create namespace "${NS}" --dry-run=client -o yaml | oc apply -f -
        operator-sdk run bundle "${OO_BUNDLE}" \
          --namespace "${NS}" \
          --install-mode AllNamespaces \
          --timeout 10m \
          --security-context-config restricted
        oc wait csv/koku-service-operator.v0.0.1 -n "${NS}" \
          --for=jsonpath='{.status.phase}'=Succeeded --timeout=10m
        oc wait deployment/koku-service-operator-controller-manager -n "${NS}" \
          --for=condition=Available --timeout=5m
        cat > "${ARTIFACT_DIR}/junit_olm-install.xml" <<'EOF'
        <testsuite name="olm-install" tests="1" failures="0">
          <testcase classname="olm" name="csv-succeeded-controller-available"/>
        </testsuite>
        EOF
      dependencies:
      - env: OO_BUNDLE
        name: koku-service-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: generic-claim
- always_run: false
  as: e2e-pytest
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.20"
  optional: true
  steps:
    test:
    - as: install
      cli: latest
      commands: |
        set -euo pipefail
        mkdir -p "${SHARED_DIR}"
        cat > "${SHARED_DIR}/koso-sanitize.sh" << 'KOSOSANITIZE'
        _sanitize() {
          sed -E \
            -e 's#[a-zA-Z][a-zA-Z0-9+.-]*://[^[:space:]"<>]+#[URL redacted]#g' \
            -e 's#[A-Za-z0-9._-]+\.(svc|pod)(\.cluster\.local)?(:[0-9]{1,5})?#[internal-host redacted]#g' \
            -e 's#[A-Za-z0-9.-]+\.apps\.[A-Za-z0-9.-]+(:[0-9]{1,5})?#[internal-host redacted]#g' \
            -e 's#(^|[^0-9])(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[0-1])\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|127\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3})(:[0-9]{1,5})?#\1[internal-host redacted]#g' \
            -e 's#(Authorization|Proxy-Authorization|Cookie|Set-Cookie|X-Rh-Identity|X-API-Key)[[:space:]]*:[[:space:]]*.*#\1: [credential redacted]#gI' \
            -e 's#[Bb]earer[[:space:]]+[A-Za-z0-9._+/=-]+#Bearer [credential redacted]#g' \
            -e 's#eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}#[credential redacted]#g' \
            -e 's#"[[:space:]]*(password|passwd|pwd|token|secret|api[_-]?key|access[_-]?key|secret[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token|session[_-]?id|session|authorization)[[:space:]]*"[[:space:]]*:[[:space:]]*"[^"]*"#"\1": "[credential redacted]"#gI' \
            -e 's#((password|passwd|pwd|token|secret|api[_-]?key|access[_-]?key|secret[_-]?key|client[_-]?secret|access[_-]?token|refresh[_-]?token|session[_-]?id|session)[=:][[:space:]]*"?)[^[:space:]"<&,]+#\1[credential redacted]#gI'
        }
        _sanitize_tree() {
          local dir="${1:-${ARTIFACT_DIR:-}}" f tmp
          [[ -n "$dir" && -d "$dir" ]] || return 0
          while IFS= read -r -d '' f; do
            tmp="$(mktemp)"
            _sanitize < "$f" > "$tmp" && mv "$tmp" "$f"
          done < <(find "$dir" -type f -print0)
        }
        KOSOSANITIZE
        # shellcheck disable=SC1091
        source "${SHARED_DIR}/koso-sanitize.sh"
        NS=cost-onprem
        dump() {
          mkdir -p "${ARTIFACT_DIR}"
          oc -n "${NS}" get csv -o custom-columns=NAME:.metadata.name,PHASE:.status.phase,REASON:.status.reason --no-headers 2>/dev/null || true
          oc -n "${NS}" logs deploy/koku-service-operator-controller-manager 2>/dev/null | _sanitize > "${ARTIFACT_DIR}/operator.log" || true
          oc -n "${NS}" logs -l olm.catalogSource=koku-service-operator --tail=200 2>/dev/null | _sanitize > "${ARTIFACT_DIR}/catalog.log" || true
          oc -n "${NS}" get csv,og,catsrc,sub,ip,deploy,po,event -o yaml 2>/dev/null | _sanitize > "${ARTIFACT_DIR}/olm-resources.yaml" || true
          oc get csv -A -o yaml 2>/dev/null | _sanitize > "${ARTIFACT_DIR}/csv.yaml" || true
          oc -n "${NS}" get cmsc -o jsonpath='{range .items[*]}---{"\n"}name: {.metadata.name}{"\n"}namespace: {.metadata.namespace}{"\n"}created: {.metadata.creationTimestamp}{"\n"}conditions:{"\n"}{range .status.conditions[*]}  - type: {.type}{"\n"}    status: {.status}{"\n"}    reason: {.reason}{"\n"}    message: {.message}{"\n"}    lastTransitionTime: {.lastTransitionTime}{"\n"}{end}{"\n"}{end}' 2>/dev/null | _sanitize > "${ARTIFACT_DIR}/cmsc-status.txt" || true
          oc -n "${NS}" get events --sort-by=.lastTimestamp 2>/dev/null | _sanitize > "${ARTIFACT_DIR}/events.txt" || true
          _sanitize_tree
        }
        trap dump EXIT
        oc create namespace "${NS}" --dry-run=client -o yaml | oc apply -f -
        oc apply -f - <<EOF
        apiVersion: operators.coreos.com/v1
        kind: OperatorGroup
        metadata:
          name: cost-onprem
          namespace: ${NS}
        spec: {}
        ---
        apiVersion: operators.coreos.com/v1alpha1
        kind: CatalogSource
        metadata:
          name: koku-service-operator
          namespace: ${NS}
        spec:
          displayName: koku-service-operator (CI)
          publisher: prow
          sourceType: grpc
          image: ${CATALOG_IMG}
          grpcPodConfig:
            securityContextConfig: restricted
        ---
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: koku-service-operator
          namespace: ${NS}
        spec:
          channel: beta
          name: koku-service-operator
          source: koku-service-operator
          sourceNamespace: ${NS}
          installPlanApproval: Automatic
        EOF
        oc wait catalogsource/koku-service-operator -n "${NS}" \
          --for=jsonpath='{.status.connectionState.lastObservedState}'=READY --timeout=10m
        for _ in $(seq 1 60); do
          CSV="$(oc get subscription koku-service-operator -n "${NS}" -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)"
          [[ -n "${CSV}" ]] && break
          sleep 10
        done
        [[ -n "${CSV}" ]]
        succeeded=0
        for _ in $(seq 1 60); do
          phase="$(oc get csv/"${CSV}" -n "${NS}" -o jsonpath='{.status.phase}' 2>/dev/null || true)"
          reason="$(oc get csv/"${CSV}" -n "${NS}" -o jsonpath='{.status.reason}' 2>/dev/null || true)"
          echo "CSV ${CSV} phase=${phase} reason=${reason}"
          if [[ "${phase}" == "Succeeded" ]]; then
            succeeded=1
            break
          fi
          if [[ "${phase}" == "Failed" ]]; then
            oc get csv/"${CSV}" -n "${NS}" -o jsonpath='{.status.message}{"\n"}' | _sanitize || true
            exit 1
          fi
          sleep 10
        done
        [[ "${succeeded}" == 1 ]]
        oc wait deployment/koku-service-operator-controller-manager -n "${NS}" \
          --for=condition=Available --timeout=5m
      dependencies:
      - env: CATALOG_IMG
        name: koku-service-operator-catalog
      from: src
      grace_period: 15m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: stack
      cli: latest
      commands: |
        set -euo pipefail
        # shellcheck disable=SC1091
        source "${SHARED_DIR}/koso-sanitize.sh"
        export KUBE_CONTEXT="$(kubectl config current-context)"
        export NAMESPACE=cost-onprem
        export CR_NAME=cost-onprem
        export INFRA_NAMESPACE=cost-onprem-infra
        export OPERATOR_NAMESPACE=cost-onprem
        export SKIP_PYTEST=1
        set +e
        ./hack/ci/e2e.sh 2>&1 | _sanitize
        rc=${PIPESTATUS[0]}
        set -e
        mkdir -p "${ARTIFACT_DIR}"
        _sanitize_tree
        exit "${rc}"
      from: koku-service-operator-e2e
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
    - as: smoke
      cli: latest
      commands: |
        set -euo pipefail
        # shellcheck disable=SC1091
        source "${SHARED_DIR}/koso-sanitize.sh"
        export KUBE_CONTEXT="$(kubectl config current-context)"
        export NAMESPACE=cost-onprem
        export CR_NAME=cost-onprem
        export HELM_RELEASE_NAME=cost-onprem
        set +e
        ./scripts/run-pytest.sh --no-venv --smoke 2>&1 | _sanitize
        rc=${PIPESTATUS[0]}
        set -e
        mkdir -p "${ARTIFACT_DIR}"
        if [[ -f test/pytest/reports/junit.xml ]]; then
          _sanitize < test/pytest/reports/junit.xml > "${ARTIFACT_DIR}/junit_smoke.xml"
        fi
        _sanitize_tree
        exit "${rc}"
      from: koku-service-operator-e2e
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
    - as: pytest
      cli: latest
      commands: |
        set -euo pipefail
        # shellcheck disable=SC1091
        source "${SHARED_DIR}/koso-sanitize.sh"
        export KUBE_CONTEXT="$(kubectl config current-context)"
        export NAMESPACE=cost-onprem
        export CR_NAME=cost-onprem
        export HELM_RELEASE_NAME=cost-onprem
        set +e
        ./scripts/run-pytest.sh --no-venv --no-ui 2>&1 | _sanitize
        rc=${PIPESTATUS[0]}
        set -e
        mkdir -p "${ARTIFACT_DIR}"
        if [[ -f test/pytest/reports/junit.xml ]]; then
          _sanitize < test/pytest/reports/junit.xml > "${ARTIFACT_DIR}/junit_e2e.xml"
        fi
        _sanitize_tree
        exit "${rc}"
      from: koku-service-operator-e2e
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
    workflow: generic-claim
