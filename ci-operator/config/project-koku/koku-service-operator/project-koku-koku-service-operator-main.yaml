base_images:
  operator-sdk:
    name: "4.20"
    namespace: origin
    tag: operator-sdk
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-4.23
images:
  items:
  - dockerfile_path: Dockerfile
    to: koku-service-operator
operator:
  bundles:
  - as: koku-service-operator-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
    skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  substitutions:
  - pullspec: quay.io/project-koku/koku-service-operator:v0.0.1
    with: pipeline:koku-service-operator
releases:
  latest:
    release:
      architecture: amd64
      channel: fast
      version: "4.20"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: build
  commands: GOFLAGS=-mod=mod go build -o /dev/null ./cmd/main.go
  container:
    from: src
- always_run: false
  as: e2e-olm
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 1h0m0s
    version: "4.20"
  optional: true
  steps:
    test:
    - as: install
      cli: latest
      commands: |
        set -euo pipefail
        NS=koku-service-operator-system
        scrub() {
          sed -E \
            -e 's#(https?|postgres(ql)?|mysql|mariadb|kafka|amqp|amqps|redis|rediss|mongodb|mongo|s3|ftp|ftps|grpc)://[^[:space:]"'\''<>\\]+#<redacted-url>#g' \
            -e 's#[A-Za-z0-9._-]+\.(svc|cluster\.local|internal)[^[:space:]"'\'']*#<redacted-host>#g' \
            -e 's#(Bearer[[:space:]]+)[^[:space:]]+#\1<redacted>#g' \
            -e 's#eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}#<redacted-jwt>#g' \
            -e 's#AKIA[0-9A-Z]{16}#<redacted-aws-key>#g' \
            -e 's#((password|passwd|token|secret|api[_-]?key|access[_-]?key|private[_-]?key|credentials?|authorization)["'\'']?[[:space:]]*[=:][[:space:]]*)[^[:space:]"'\'',;}]+#\1<redacted>#Ig' \
            -e 's#^([[:space:]]*value:[[:space:]]*).+#\1<redacted>#'
        }
        write_artifact() {
          scrub > "$1" || true
        }
        dump() {
          mkdir -p "${ARTIFACT_DIR}"
          oc -n "${NS}" logs deploy/koku-service-operator-controller-manager 2>/dev/null | write_artifact "${ARTIFACT_DIR}/operator.log" || true
          oc -n "${NS}" get csv,deploy -o yaml 2>/dev/null | write_artifact "${ARTIFACT_DIR}/olm-resources.yaml" || true
          oc -n "${NS}" get po,event 2>/dev/null | write_artifact "${ARTIFACT_DIR}/olm-resources.txt" || true
          oc get csv -A -o yaml 2>/dev/null | write_artifact "${ARTIFACT_DIR}/csv.yaml" || true
          oc -n "${NS}" get events --sort-by=.lastTimestamp 2>/dev/null | write_artifact "${ARTIFACT_DIR}/events.txt" || true
        }
        trap dump EXIT
        oc create namespace "${NS}" --dry-run=client -o yaml | oc apply -f -
        operator-sdk run bundle "${OO_BUNDLE}" \
          --namespace "${NS}" \
          --install-mode AllNamespaces \
          --timeout 10m \
          --security-context-config restricted
        oc wait csv/koku-service-operator.v0.0.1 -n "${NS}" \
          --for=jsonpath='{.status.phase}'=Succeeded --timeout=10m
        oc wait deployment/koku-service-operator-controller-manager -n "${NS}" \
          --for=condition=Available --timeout=5m
        cat > "${ARTIFACT_DIR}/junit_olm-install.xml" <<'EOF'
        <testsuite name="olm-install" tests="1" failures="0">
          <testcase classname="olm" name="csv-succeeded-controller-available"/>
        </testsuite>
        EOF
      dependencies:
      - env: OO_BUNDLE
        name: koku-service-operator-bundle
      from: operator-sdk
      grace_period: 5m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: generic-claim
zz_generated_metadata:
  branch: main
  org: project-koku
  repo: koku-service-operator
