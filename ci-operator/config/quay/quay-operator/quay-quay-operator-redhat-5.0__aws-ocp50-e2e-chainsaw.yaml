base_images:
  cli:
    name: "5.0"
    namespace: ocp
    tag: cli
build_root:
  from_repository: true
images:
  items:
  - dockerfile_literal: |
      FROM src
      COPY oc /usr/bin/oc
    from: src
    inputs:
      cli:
        paths:
        - destination_dir: .
          source_path: /usr/bin/oc
    to: src-oc
  - dockerfile_literal: |
      FROM pipeline:src-oc
      RUN mkdir -p /tmp/quay-sts-bin && \
          GOFLAGS="" GOBIN=/tmp/quay-sts-bin go install github.com/google/go-containerregistry/cmd/crane@v0.20.3 && \
          GOFLAGS="" GOBIN=/tmp/quay-sts-bin go install github.com/itchyny/gojq/cmd/gojq@v0.12.17 && \
          ln -s /tmp/quay-sts-bin/gojq /tmp/quay-sts-bin/jq
    from: src-oc
    to: src-oc-sts
  - dockerfile_literal: |
      FROM registry.access.redhat.com/ubi9/python-311:1
      RUN pip install --no-cache-dir boto3==1.35.99
    to: quay-sts-tools
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: aws-odf-nightly
  cron: '@weekly'
  steps:
    cluster_profile: aws-quay-qe
    env:
      BASE_DOMAIN: quayqe.devcluster.openshift.com
      CHAINSAW_SUITE: all
      COMPUTE_NODE_TYPE: m5.4xlarge
      QUAY_INDEX_IMAGE_REPO: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc
      QUAY_INDEX_IMAGE_TAG: quay-5.0__v5.0__quay-rhel9-operator
      QUAY_OPERATOR_CHANNEL: stable-5.0
      QUAY_OPERATOR_SOURCE: fbc-operator-catalog
      QUAY_OPERATOR_STS: "true"
      QUAY_STORAGE_PROVIDER: odf
      SETUP_NOOBAA: "true"
    post:
    - ref: quay-gather-jaeger-traces
    - ref: quay-gather
    - ref: quay-deprovision
    - chain: ipi-aws-post-manual-oidc-sts
    - ref: quay-sts-cleanup
    pre:
    - chain: ipi-aws-pre-manual-oidc-sts
    - ref: quay-sts-provision
    test:
    - ref: merge-stage-registry-credentials
    - ref: quay-enable-catalogsource-art
    - ref: quay-install-odf-operator
    - ref: quay-install-quay-operator
    - ref: quay-sts-test
    - ref: quay-test-chainsaw
    workflow: ipi-aws
  timeout: 4h0m0s
zz_generated_metadata:
  branch: redhat-5.0
  org: quay
  repo: quay-operator
  variant: aws-ocp50-e2e-chainsaw
