base_images:
  cli:
    name: "4.20"
    namespace: ocp
    tag: cli
  upi-installer:
    name: "4.20"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-8-release-golang-1.23-openshift-4.20
prowgen:
  expose: true
  private: true
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "4.20"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: quay-e2e-tests-quayio-stage-performance-test
  cron: 5 20 * * *
  reporter_config:
    channel: '#oncall-quay'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :slack-green: *Quay stage
      FULL performance* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{else}} :failed: *Quay stage FULL performance* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs> {{end}}'
  steps:
    cluster_profile: aws-quay-qe
    env:
      BASE_DOMAIN: quayqe.devcluster.openshift.com
      COMPUTE_NODE_REPLICAS: "5"
      COMPUTE_NODE_TYPE: m6a.8xlarge
    test:
    - ref: quay-tests-test-stage-performance
    workflow: cucushift-installer-rehearse-aws-ipi
- as: quay-e2e-tests-quayio-stage-load-smoke
  cron: 5 0,8 * * 1-5
  reporter_config:
    channel: '#oncall-quay'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :slack-green: *Quay stage
      SETUP + PUSH/PULL smoke* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> {{else}} :failed: *Quay stage SETUP + PUSH/PULL smoke* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs> {{end}}'
  steps:
    cluster_profile: aws-quay-qe
    env:
      BASE_DOMAIN: quayqe.devcluster.openshift.com
      COMPUTE_NODE_REPLICAS: "5"
      COMPUTE_NODE_TYPE: m6a.8xlarge
      CONCURRENCY: "1"
      HITSIZE: "10"
      PUSH_PULL_NUMBERS: "1"
      TEST_PHASES: load
    test:
    - ref: quay-tests-test-stage-performance
    workflow: cucushift-installer-rehearse-aws-ipi
zz_generated_metadata:
  branch: master
  org: quay
  repo: quay-tests
  variant: quay-performance
