base_images:
  assisted-service-scripts:
    name: ocm-2.16
    namespace: edge-infrastructure
    tag: assisted-service-scripts
  cli:
    name: "4.21"
    namespace: ocp
    tag: cli
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
  upi-installer:
    name: "4.21"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.21
prowgen:
  expose: true
  private: true
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.21"
  multi-latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.21"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: quay-e2e-tests-hypershift-powervs-ppc64le
  capabilities:
  - intranet
  cron: '@yearly'
  reporter_config:
    channel: '#quay-qe'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :slack-green: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :failed:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  steps:
    cluster_profile: openshift-org-aws
    env:
      CSO_CHANNEL: stable-3.17
      CSO_SOURCE: fbc-operator-catalog
      MCE_VERSION: "2.11"
      MULTISTAGE_PARAM_OVERRIDE_QUAY_INDEX_IMAGE: quay.io/redhat-user-workloads/quay-eng-tenant/stable-3-17-v4-21@sha256:bc002f7dff4f1c3973c26f34b4b7cf869cef3965d49469b1f06bd6b5416c13b4
      QBO_CHANNEL: stable-3.17
      QBO_SOURCE: fbc-operator-catalog
      QUAY_OPERATOR_CHANNEL: stable-3.17
      QUAY_OPERATOR_SOURCE: fbc-operator-catalog
      QUAY_VERSION: "3.17"
    test:
    - ref: quay-tests-enable-quay-catalogsource
    - ref: quay-tests-deploy-quay-aws-s3
    - ref: quay-tests-test-quay-e2e
    - ref: quay-tests-qbo-qe-test
    - ref: quay-tests-cso-qe-test
    workflow: quay-tests-hypershift-powervs-deploy
zz_generated_metadata:
  branch: master
  org: quay
  repo: quay-tests
  variant: ocp-421-powervs-quay
