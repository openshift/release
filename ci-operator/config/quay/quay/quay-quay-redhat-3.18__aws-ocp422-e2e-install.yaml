build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.22
images:
  items:
  - dockerfile_literal: |
      FROM src
      RUN dnf module enable -y nodejs:22 && \
          dnf install -y nodejs npm skopeo \
          alsa-lib atk at-spi2-atk cups-libs libdrm libXcomposite \
          libXdamage libXrandr mesa-libgbm pango nss nss-util nspr \
          libxkbcommon libXfixes libXcursor libXext libXi libXtst \
          libwayland-client && \
          dnf clean all
      RUN curl -fsSL "https://github.com/google/go-containerregistry/releases/download/v0.20.2/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xzf - -C /usr/local/bin crane && \
          curl -fsSL -o /usr/local/bin/regctl "https://github.com/regclient/regclient/releases/download/v0.7.1/regctl-linux-amd64" && \
          chmod +x /usr/local/bin/crane /usr/local/bin/regctl
      WORKDIR /go/src/github.com/quay/quay/web
      RUN npm ci
      ENV PLAYWRIGHT_BROWSERS_PATH=/opt/playwright
      RUN npx playwright install chromium
    from: src
    to: quay-playwright-runner
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: aws-s3-3-18-nightly-4-22
  cron: '@weekly'
  steps:
    cluster_profile: aws-quay-qe
    env:
      BASE_DOMAIN: quayqe.devcluster.openshift.com
      COMPUTE_NODE_TYPE: m5.4xlarge
      ENABLE_BUILD_SUPPORT: "true"
      MULTISTAGE_PARAM_OVERRIDE_PLAYWRIGHT_GIT_BRANCH: 40542b53ca2ceb61740e95a5656240af5a0fd7ef
      MULTISTAGE_PARAM_OVERRIDE_QUAY_INDEX_IMAGE: quay.io/redhat-user-workloads/quay-eng-tenant/stable-3-18-v4-22@sha256:2a17e0af09b8d6242c8fb758da9a7a38829bdda5232a7b9f02f119c842dc2e9f
      QUAY_BUILDER_IMAGE: registry.redhat.io/quay/quay-builder-rhel9@sha256:9ced74943d3147fb6eac6df05c50a47553d550586be736068c47767c6f68c777
      QUAY_EXTRA_CONFIG: |
        FEATURE_PROGRAMMATIC_BOOTSTRAP: false
        FEATURE_USER_METADATA: true
        FEATURE_IMMUTABLE_TAGS: true
        FEATURE_SPARSE_INDEX: true
        FEATURE_QUOTA_NOTIFICATIONS: true
        FEATURE_EDIT_QUOTA: true
        FEATURE_CHANGE_TAG_EXPIRATION: true
        FEATURE_IMAGE_PULL_STATS: false
        # Build-log and action-log archival default to storage location "local_us"
        # (Quay's built-in config.py default). Our S3 storage is registered under
        # the single location name "default", so the archiver workers throw
        # KeyError: 'local_us' (seen ~9x/run in the build manager log) and never
        # archive logs. Point both archivers at our actual location.
        LOG_ARCHIVE_LOCATION: default
        ACTION_LOG_ARCHIVE_LOCATION: default
        FEATURE_MAILING: true
        MAIL_SERVER: mailpit.quay-enterprise.svc.cluster.local
        MAIL_PORT: 1025
        MAIL_USE_TLS: false
        MAIL_USE_AUTH: false
        MAIL_DEFAULT_SENDER: quay@quayqe.local
        DEFAULT_UI: react
        SUPER_USERS:
          - admin
        GLOBAL_READONLY_SUPER_USERS:
          - readonly
      QUAY_OPERATOR_CHANNEL: stable-3.18
      QUAY_OPERATOR_SOURCE: fbc-operator-catalog
    post:
    - ref: quay-operator-deprovision
    - chain: ipi-aws-post
    test:
    - ref: quay-operator-enable-catalogsource
    - ref: quay-operator-provisioning-tls
    - ref: quay-operator-provisioning-builder
    - ref: quay-operator-deploy-mailpit
    - ref: quay-operator-deploy-aws-s3
    - ref: quay-operator-test-e2e
    workflow: ipi-aws
zz_generated_metadata:
  branch: redhat-3.18
  org: quay
  repo: quay
  variant: aws-ocp422-e2e-install
