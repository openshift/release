base_images:
  cli:
    name: "4.21"
    namespace: ocp
    tag: cli
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.21
images:
  items:
  - dockerfile_path: Dockerfile
    to: quay-server
  - dockerfile_path: web/Containerfile.playwright
    to: quay-playwright-runner
  skip_if_only_changed: ^(\.agents/|\.claude/|ci-generator/|docs/|.*\.md$)
releases:
  latest:
    release:
      architecture: amd64
      channel: stable
      version: "4.21"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: from-316
  optional: true
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: aws-quay-qe
    env:
      BASE_DOMAIN: quayqe.devcluster.openshift.com
      COMPUTE_NODE_TYPE: m5.4xlarge
      ENABLE_BUILD_SUPPORT: "true"
      MULTISTAGE_PARAM_OVERRIDE_QUAY_INDEX_IMAGE: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc@sha256:e9a7f5414a727fbaf73721ddcb1d7b337c1fc95be681093da534f257c054010c
      PLAYWRIGHT_GREP_INVERT: '@auth:OIDC|@auth:LDAP|@feature:QUOTA_NOTIFICATIONS|@upgrade-seed|@upgrade-verify|@webhook|saves
        and loads architecture filter with mirror configuration|loads existing architecture
        filter from saved mirror configuration'
      PLAYWRIGHT_N_GIT_BRANCH: redhat-3.17
      PLAYWRIGHT_N_MINUS_ONE_GIT_BRANCH: redhat-3.16
      PLAYWRIGHT_USE_IMAGE_TESTS: "false"
      PLAYWRIGHT_WORKERS: "4"
      QUAY_EXTRA_CONFIG: |
        FEATURE_PROGRAMMATIC_BOOTSTRAP: false
        FEATURE_USER_METADATA: true
        FEATURE_IMMUTABLE_TAGS: true
        FEATURE_SPARSE_INDEX: true
        FEATURE_QUOTA_NOTIFICATIONS: true
        FEATURE_EDIT_QUOTA: true
        FEATURE_CHANGE_TAG_EXPIRATION: true
        FEATURE_IMAGE_PULL_STATS: false
        LOG_ARCHIVE_LOCATION: default
        ACTION_LOG_ARCHIVE_LOCATION: default
        SESSION_TIMEOUT: 2h
        DEFAULT_UI: react
        SUPER_USERS:
          - admin
        GLOBAL_READONLY_SUPER_USERS:
          - readonly
      QUAY_INDEX_IMAGE_REPO: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc
      QUAY_INDEX_IMAGE_TAG: quay-3.17__v4.21__quay-rhel9-operator
      QUAY_OPERATOR_SOURCE: fbc-operator-catalog
      QUAY_UPGRADE_SOURCE_CATALOG_IMAGE: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc@sha256:e9a7f5414a727fbaf73721ddcb1d7b337c1fc95be681093da534f257c054010c
      QUAY_UPGRADE_SOURCE_CHANNEL: stable-3.16
      QUAY_UPGRADE_TARGET_CATALOG_IMAGE: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc@sha256:e9a7f5414a727fbaf73721ddcb1d7b337c1fc95be681093da534f257c054010c
      QUAY_UPGRADE_TARGET_CHANNEL: stable-3.17
      QUAYNAMESPACE: quay
    post:
    - ref: quay-gather-jaeger-traces
    - ref: quay-gather
    - ref: quay-deprovision
    - chain: ipi-aws-post-manual-oidc-sts
    pre:
    - chain: ipi-aws-pre-manual-oidc-sts
    test:
    - ref: merge-stage-registry-credentials
    - ref: quay-enable-catalogsource-art
    - ref: quay-operator-upgrade-install-source
    - ref: quay-provisioning-tls
    - ref: quay-provisioning-builder
    - ref: quay-deploy-mailpit
    - ref: quay-deploy-jaeger
    - ref: quay-provisioning-storage-s3
    - ref: quay-install-external-storage
    - ref: quay-operator-upgrade-prepare-e2e
    - chain: quay-operator-upgrade-seed
    - ref: quay-operator-upgrade-channel
    - chain: quay-operator-upgrade-verify
    - chain: quay-operator-upgrade-functional
    - ref: quay-operator-upgrade-report
    workflow: ipi-aws
  timeout: 6h0m0s
zz_generated_metadata:
  branch: redhat-3.17
  org: quay
  repo: quay
  variant: aws-ocp421-s3-upgrade
