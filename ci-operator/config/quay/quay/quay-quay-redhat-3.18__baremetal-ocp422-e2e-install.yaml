base_images:
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.22
images:
  items:
  - dockerfile_path: web/Containerfile.playwright
    to: quay-playwright-runner
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: baremetal-s3-nightly
  capabilities:
  - intranet
  cron: '@weekly'
  restrict_network_access: false
  steps:
    cluster_profile: equinix-ocp-metal
    env:
      DEVSCRIPTS_CONFIG: |
        IP_STACK=v4v6
        NUM_WORKERS=3
        WORKER_VCPU=8
        WORKER_MEMORY=20480
        VM_EXTRADISKS=true
        VM_EXTRADISKS_LIST="vda vdb"
        VM_EXTRADISKS_SIZE=100G
      ENABLE_BUILD_SUPPORT: "true"
      LVM_CLUSTER_DEVICE_PATH: /dev/vdb
      LVM_CLUSTER_WIPE_DEVICE: "true"
      LVM_OPERATOR_SUB_INSTALL_NAMESPACE: openshift-lvm-storage
      LVM_OPERATOR_SUB_SOURCE: lvm-catalogsource
      PLAYWRIGHT_GIT_REPO: https://github.com/quay/quay.git
      PLAYWRIGHT_GREP_INVERT: '@auth:OIDC|@auth:LDAP|@feature:QUOTA_NOTIFICATIONS|@upgrade-seed|@upgrade-verify|@webhook|saves
        and loads architecture filter with mirror configuration|loads existing architecture
        filter from saved mirror configuration'
      PLAYWRIGHT_REF_MODE: strict
      QUAY_EXTRA_CONFIG: |
        FEATURE_PROGRAMMATIC_BOOTSTRAP: false
        FEATURE_USER_METADATA: true
        FEATURE_IMMUTABLE_TAGS: true
        FEATURE_SPARSE_INDEX: true
        FEATURE_QUOTA_NOTIFICATIONS: true
        FEATURE_EDIT_QUOTA: true
        FEATURE_CHANGE_TAG_EXPIRATION: true
        FEATURE_IMAGE_PULL_STATS: false
        LOG_ARCHIVE_LOCATION: default
        ACTION_LOG_ARCHIVE_LOCATION: default
        SESSION_TIMEOUT: 2h
        DEFAULT_UI: react
        SUPER_USERS:
          - admin
        GLOBAL_READONLY_SUPER_USERS:
          - readonly
      QUAY_INDEX_IMAGE_REPO: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc
      QUAY_INDEX_IMAGE_TAG: quay-3.18__v4.22__quay-rhel9-operator
      QUAY_OPERATOR_CHANNEL: stable-3.18
      QUAY_OPERATOR_SOURCE: fbc-operator-catalog
      REQUIRED_DEFAULT_STORAGECLASS: lvms-vg1
    post:
    - ref: quay-gather-jaeger-traces
    - ref: quay-gather
    - ref: quay-deprovision
    - chain: baremetalds-ofcir-post
    pre:
    - chain: baremetalds-ofcir-pre
    - ref: lvms-catalogsource
    - ref: operatorhub-subscribe-lvm-operator
    - ref: storage-create-lvm-cluster
    - ref: storage-conf-storageclass-set-default-storageclass
    test:
    - ref: merge-stage-registry-credentials
    - ref: quay-enable-catalogsource-art
    - ref: quay-provisioning-tls
    - ref: quay-provisioning-builder
    - ref: quay-deploy-mailpit
    - ref: quay-deploy-jaeger
    - ref: quay-deploy-aws-s3
    - ref: quay-test-e2e
    workflow: baremetalds-e2e-ovn-dualstack
  timeout: 8h0m0s
zz_generated_metadata:
  branch: redhat-3.18
  org: quay
  repo: quay
  variant: baremetal-ocp422-e2e-install
