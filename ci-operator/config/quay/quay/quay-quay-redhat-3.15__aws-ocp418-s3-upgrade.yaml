build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.22
releases:
  latest:
    release:
      architecture: amd64
      channel: stable
      version: "4.18"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: from-314
  cron: '@daily'
  reporter_config:
    channel: '#team-quay-downstream-interruptions'
    job_states_to_report:
    - failure
    - error
    report_template: ':red_circle: *{{.Spec.Job}}* run {{.Status.BuildID}} ended *{{.Status.State}}*:
      {{.Status.URL}} <@U0AKNPBBVT7>'
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: aws-quay-qe
    env:
      BASE_DOMAIN: quayqe.devcluster.openshift.com
      COMPUTE_NODE_TYPE: m5.4xlarge
      ENABLE_BUILD_SUPPORT: "true"
      QUAY_UPGRADE_CATALOG_SOURCE: redhat-operators
      QUAY_UPGRADE_SOURCE_CHANNEL: stable-3.14
      QUAY_UPGRADE_TARGET_CHANNEL: stable-3.15
      QUAYNAMESPACE: quay
    post:
    - ref: quay-gather-jaeger-traces
    - ref: quay-gather
    - ref: quay-deprovision
    - chain: ipi-aws-post-manual-oidc-sts
    pre:
    - chain: ipi-aws-pre-manual-oidc-sts
    test:
    - ref: merge-stage-registry-credentials
    - ref: quay-operator-upgrade-install-source
    - ref: quay-provisioning-tls
    - ref: quay-provisioning-builder
    - ref: quay-deploy-mailpit
    - ref: quay-deploy-jaeger
    - ref: quay-provisioning-storage-s3
    - ref: quay-install-external-storage
    - ref: quay-operator-upgrade-prepare-e2e
    - ref: quay-create-admin-user
    - ref: quay-operator-upgrade-seed-api
    - ref: quay-operator-upgrade-channel
    - ref: quay-operator-upgrade-verify-api
    workflow: ipi-aws
  timeout: 6h0m0s
zz_generated_metadata:
  branch: redhat-3.15
  org: quay
  repo: quay
  variant: aws-ocp418-s3-upgrade
