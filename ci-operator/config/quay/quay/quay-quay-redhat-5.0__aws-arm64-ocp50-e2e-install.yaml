build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-5.0
images:
  items:
  - dockerfile_path: web/Containerfile.playwright
    to: quay-playwright-runner
releases:
  arm64-latest:
    candidate:
      architecture: arm64
      product: ocp
      stream: nightly
      version: "5.0"
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: aws-s3-nightly
  cron: '@weekly'
  steps:
    cluster_profile: aws-quay-qe
    dependencies:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: release:arm64-latest
    env:
      BASE_DOMAIN: quayqe.devcluster.openshift.com
      COMPUTE_ARCH: arm64
      COMPUTE_NODE_TYPE: m6g.4xlarge
      CONTROL_ARCH: arm64
      ENABLE_BUILD_SUPPORT: "true"
      OCP_ARCH: arm64
      PLAYWRIGHT_GIT_REPO: https://github.com/quay/quay.git
      PLAYWRIGHT_GREP_INVERT: '@auth:OIDC|@auth:LDAP|@feature:QUOTA_NOTIFICATIONS|@upgrade-seed|@upgrade-verify|@webhook|saves
        and loads architecture filter with mirror configuration|loads existing architecture
        filter from saved mirror configuration'
      PLAYWRIGHT_REF_MODE: strict
      QUAY_EXTRA_CONFIG: |
        FEATURE_PROGRAMMATIC_BOOTSTRAP: false
        FEATURE_USER_METADATA: true
        FEATURE_IMMUTABLE_TAGS: true
        FEATURE_SPARSE_INDEX: true
        FEATURE_QUOTA_NOTIFICATIONS: true
        FEATURE_EDIT_QUOTA: true
        FEATURE_CHANGE_TAG_EXPIRATION: true
        FEATURE_IMAGE_PULL_STATS: false
        LOG_ARCHIVE_LOCATION: default
        ACTION_LOG_ARCHIVE_LOCATION: default
        SESSION_TIMEOUT: 2h
        DEFAULT_UI: react
        SUPER_USERS:
          - admin
        GLOBAL_READONLY_SUPER_USERS:
          - readonly
        FEATURE_ROBOT_API_TOKENS: true
      QUAY_INDEX_IMAGE_REPO: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc
      QUAY_INDEX_IMAGE_TAG: quay-5.0__v5.0__quay-rhel9-operator
      QUAY_OPERATOR_CHANNEL: stable-5.0
      QUAY_OPERATOR_SOURCE: fbc-operator-catalog
    post:
    - ref: quay-gather-jaeger-traces
    - ref: quay-gather
    - ref: quay-deprovision
    - chain: ipi-aws-post-manual-oidc-sts
    pre:
    - chain: ipi-aws-pre-manual-oidc-sts
    test:
    - ref: merge-stage-registry-credentials
    - ref: quay-enable-catalogsource-art
    - ref: quay-provisioning-tls
    - ref: quay-provisioning-builder
    - ref: quay-deploy-mailpit
    - ref: quay-deploy-jaeger
    - ref: quay-deploy-aws-s3
    - ref: quay-test-e2e
    workflow: ipi-aws
zz_generated_metadata:
  branch: redhat-5.0
  org: quay
  repo: quay
  variant: aws-arm64-ocp50-e2e-install
