base_images:
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
  libvirt-installer:
    name: "4.22"
    namespace: ocp
    tag: libvirt-installer
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.22
images:
  items:
  - dockerfile_path: web/Containerfile.playwright
    to: quay-playwright-runner
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "4.22"
  ppc64le-latest:
    candidate:
      architecture: ppc64le
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: libvirt-s3-nightly-ppc64le
  capabilities:
  - intranet
  cron: 0 8 * * 4
  steps:
    cluster_profile: libvirt-ppc64le-s2s
    dependencies:
      OPENSHIFT_INSTALL_TARGET: release:ppc64le-latest
    env:
      BRANCH: "4.22"
      ENABLE_BUILD_SUPPORT: "true"
      PLAYWRIGHT_GIT_REPO: https://github.com/quay/quay.git
      PLAYWRIGHT_GREP_INVERT: '@auth:OIDC|@auth:LDAP|@feature:QUOTA_NOTIFICATIONS|@webhook|saves
        and loads architecture filter with mirror configuration|loads existing architecture
        filter from saved mirror configuration'
      QUAY_BUILDER_IMAGE: registry.redhat.io/quay/quay-builder-rhel9@sha256:9ced74943d3147fb6eac6df05c50a47553d550586be736068c47767c6f68c777
      QUAY_DEPLOY_MAILPIT: "false"
      QUAY_EXTRA_CONFIG: |
        FEATURE_PROGRAMMATIC_BOOTSTRAP: false
        FEATURE_USER_METADATA: true
        FEATURE_IMMUTABLE_TAGS: true
        FEATURE_SPARSE_INDEX: true
        FEATURE_QUOTA_NOTIFICATIONS: true
        FEATURE_EDIT_QUOTA: true
        FEATURE_CHANGE_TAG_EXPIRATION: true
        FEATURE_IMAGE_PULL_STATS: false
        LOG_ARCHIVE_LOCATION: default
        ACTION_LOG_ARCHIVE_LOCATION: default
        SESSION_TIMEOUT: 2h
        DEFAULT_UI: react
        SUPER_USERS:
          - admin
        GLOBAL_READONLY_SUPER_USERS:
          - readonly
      QUAY_INDEX_IMAGE_REPO: quay.io/redhat-user-workloads/quay-eng-tenant/stable-3-18-v4-22
      QUAY_OPERATOR_CHANNEL: stable-3.18
      QUAY_OPERATOR_SOURCE: fbc-operator-catalog
    post:
    - ref: quay-gather-jaeger-traces
    - ref: quay-gather
    - ref: quay-deprovision
    - ref: ipi-conf-debug-kdump-gather-logs
    - chain: gather
    - ref: upi-libvirt-cleanup-post
    test:
    - ref: quay-enable-catalogsource
    - ref: quay-provisioning-tls
    - ref: quay-provisioning-builder
    - ref: quay-deploy-mailpit
    - ref: quay-deploy-jaeger
    - ref: quay-deploy-aws-s3
    - ref: quay-test-e2e
    workflow: quay-tests-libvirt-ppc64le
  timeout: 8h0m0s
zz_generated_metadata:
  branch: redhat-3.18
  org: quay
  repo: quay
  variant: libvirt-ppc64le-ocp422-e2e-install
