base_images:
  cli:
    name: "4.20"
    namespace: ocp
    tag: cli
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.20
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "4.20"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: aws-s3
  optional: true
  steps:
    cluster_profile: aws-quay-qe
    env:
      BASE_DOMAIN: quayqe.devcluster.openshift.com
      COMPUTE_NODE_TYPE: m5.4xlarge
      MULTISTAGE_PARAM_OVERRIDE_QUAY_INDEX_IMAGE: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc@sha256:03ea890c0e6ff0f6a67f4f5113672644fbc146ec15707a6cbf0b0b6c203b5ab6
      QUAY_EXTRA_CONFIG: |
        SUPER_USERS:
          - quayapici
          - quaye2eci
      QUAY_INDEX_IMAGE_REPO: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc
      QUAY_INDEX_IMAGE_TAG: quay-3.11__v4.20__quay-rhel9-operator
      QUAY_OPERATOR_SOURCE: fbc-operator-catalog
      QUAY_VERSION: "3.11"
    post:
    - ref: quay-gather-jaeger-traces
    - ref: quay-gather
    - ref: quay-deprovision
    - chain: ipi-aws-post-manual-oidc-sts
    pre:
    - chain: ipi-aws-pre-manual-oidc-sts
    test:
    - ref: merge-stage-registry-credentials
    - ref: quay-enable-catalogsource-art
    - ref: quay-deploy-aws-s3
    - ref: quay-test-e2e-legacy
    - ref: quay-test-api-legacy
    workflow: ipi-aws
  timeout: 4h0m0s
zz_generated_metadata:
  branch: redhat-3.11
  org: quay
  repo: quay
  variant: aws-ocp420-e2e-legacy
