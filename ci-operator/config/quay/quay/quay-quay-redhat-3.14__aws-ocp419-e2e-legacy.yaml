build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.22
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "4.19"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: aws-s3
  cron: '@daily'
  reporter_config:
    channel: '#team-quay-downstream-interruptions'
    job_states_to_report:
    - failure
    - error
    report_template: ':red_circle: *{{.Spec.Job}}* run {{.Status.BuildID}} ended *{{.Status.State}}*:
      {{.Status.URL}} <@U0AKNPBBVT7>'
  steps:
    cluster_profile: aws-quay-qe
    env:
      BASE_DOMAIN: quayqe.devcluster.openshift.com
      COMPUTE_NODE_TYPE: m5.4xlarge
      MULTISTAGE_PARAM_OVERRIDE_QUAY_INDEX_IMAGE: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc@sha256:f28ac68a8857eefe1e45a5f677a8f0ef9ad6f33739cba5dbbc0595f5bbc67d35
      QUAY_EXTRA_CONFIG: |
        SUPER_USERS:
          - quayapici
          - quaye2eci
      QUAY_OPERATOR_CHANNEL: stable-3.14
      QUAY_OPERATOR_SOURCE: fbc-operator-catalog
      QUAY_VERSION: "3.14"
    post:
    - ref: quay-gather-jaeger-traces
    - ref: quay-gather
    - ref: quay-deprovision
    - chain: ipi-aws-post-manual-oidc-sts
    pre:
    - chain: ipi-aws-pre-manual-oidc-sts
    test:
    - ref: merge-stage-registry-credentials
    - ref: quay-enable-catalogsource-art
    - ref: quay-deploy-aws-s3
    - ref: quay-test-e2e-legacy
    - ref: quay-test-api-legacy
    workflow: ipi-aws
zz_generated_metadata:
  branch: redhat-3.14
  org: quay
  repo: quay
  variant: aws-ocp419-e2e-legacy
