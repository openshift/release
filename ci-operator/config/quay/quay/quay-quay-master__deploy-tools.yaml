base_images:
  cli:
    name: "4.22"
    namespace: ocp
    tag: cli
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.22
images:
  items:
  - dockerfile_literal: |
      FROM cli
      RUN yum install --setopt=tsflags=nodocs -y jq git tar gzip which findutils diffutils util-linux && \
          yum install -y yum-utils && \
          yum-config-manager --add-repo https://rpm.releases.hashicorp.com/RHEL/hashicorp.repo && \
          { cp /etc/yum.repos.d/hashicorp.repo /etc/yum.repos.art/ci/ 2>/dev/null || true; } && \
          yum -y install terraform && \
          yum clean all && rm -rf /var/cache/yum/*
      RUN yq_version="v4.47.2" && \
          case "$(uname -m)" in \
            x86_64) yq_arch="amd64"; yq_sha256="1bb99e1019e23de33c7e6afc23e93dad72aad6cf2cb03c797f068ea79814ddb0" ;; \
            aarch64) yq_arch="arm64"; yq_sha256="05df1f6aed334f223bb3e6a967db259f7185e33650c3b6447625e16fea0ed31f" ;; \
            *) echo "Unsupported architecture for yq: $(uname -m)" >&2; exit 1 ;; \
          esac && \
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${yq_version}/yq_linux_${yq_arch}" -o /usr/local/bin/yq && \
          printf '%s  %s\n' "${yq_sha256}" /usr/local/bin/yq | sha256sum --check --status && \
          chmod +x /usr/local/bin/yq
      RUN oc version --client && \
          terraform version && \
          yq --version && \
          jq --version && \
          curl --version && \
          git --version && \
          sha256sum --version && \
          tar --version && \
          bash --version
    from: cli
    to: quay-deploy-tools
  skip_if_only_changed: ^(\.agents/|\.claude/|ci-generator/|docs/|.*\.md$)
promotion:
  to:
  - namespace: ci
    tag: latest
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: master
  org: quay
  repo: quay
  variant: deploy-tools
