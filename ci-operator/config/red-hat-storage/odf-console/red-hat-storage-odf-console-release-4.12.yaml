base_images:
  base:
    name: release
    namespace: openshift
    tag: tectonic-console-builder-v23
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: tectonic-console-builder-v23
images:
  items:
  - dockerfile_path: Dockerfile.ci
    inputs:
      base:
        as:
        - node:15
    to: odf-console
releases:
  initial:
    integration:
      name: "4.12"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.12"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  steps:
    test:
    - as: lint
      commands: yarn install && yarn run lint
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: odf-console-e2e-ibmcloud
  capabilities:
  - intranet
  steps:
    cluster_profile: odf-ibmcloud
    dependencies:
      ODF_CONSOLE_FULL_IMG_NAME: odf-console
    env:
      BASE_DOMAIN: ibmcloud.ocs.syseng.devcluster.openshift.com
      COMPUTE_NODE_TYPE: bx2-8x32
      RESOURCE_GROUP: odf-openshift-ci
      ZONES_COUNT: "3"
    test:
    - as: tests
      cli: latest
      commands: |
        export PULL_SECRET="$(cat /etc/odf-console-e2e/odf-e2e-credentials/config-pull-secret)"
        ./test-prow-e2e.sh ${ODF_CONSOLE_FULL_IMG_NAME}
      credentials:
      - collection: console-storage-plugin
        group: operator-secret
        mount_path: /var/run/operator-secret
      - collection: odf-console-e2e
        group: odf-e2e-credentials
        mount_path: /etc/odf-console-e2e/odf-e2e-credentials
      dependencies:
      - env: ODF_CONSOLE_FULL_IMG_NAME
        name: odf-console-img
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: red-hat-storage-ipi-ibmcloud
zz_generated_metadata:
  branch: release-4.12
  org: red-hat-storage
  repo: odf-console
