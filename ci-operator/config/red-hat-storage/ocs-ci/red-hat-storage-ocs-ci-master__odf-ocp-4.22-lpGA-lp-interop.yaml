base_images:
  cli:
    name: "4.22"
    namespace: ocp
    tag: cli
  ocs-ci-tests:
    name: ocs-ci-container
    namespace: ci
    tag: stable
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.23-openshift-4.21
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 200m
      memory: 200Mi
tests:
- as: cr--aws
  cron: 0 6,14,22 * * *
  reporter_config:
    channel: '#odf-ocp-ci-results'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :slack-green: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :failed:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  steps:
    cluster_profile: aws-cspi-qe
    env:
      BASE_DOMAIN: cspilp.interop.ccitredhat.com
      COMPUTE_NODE_TYPE: m5.4xlarge
      DR__RP__CR_COMP_NAME: lp-interop--ODF
      FIREWATCH_CONFIG: |
        {
        "failure_rules":
        [
          {"step": "odf-prepare-cluster", "failure_type": "all", "classification": "Infrastructure Provisioning - Operators", "group": {"name": "lp-tests", "priority": 1}, "jira_additional_labels": ["!default","test-initialization"]},
          {"step": "odf-apply-storage-cluster", "failure_type": "all", "classification": "Infrastructure Provisioning - Operators", "group": {"name": "lp-tests", "priority": 2}, "jira_additional_labels": ["!default","test-initialization"]},
          {"step": "interop-tests-ocs-tests", "failure_type": "all", "classification": "Test Failure", "group": {"name": "lp-tests", "priority": 3},"jira_additional_labels": ["!default","interop-tests"]}
        ]
        }
      FIREWATCH_CONFIG_FILE_PATH: https://raw.githubusercontent.com/CSPI-QE/cspi-utils/refs/heads/main/firewatch-base-configs/cr/lp-interop.json
      FIREWATCH_DEFAULT_JIRA_ADDITIONAL_LABELS: '["4.22-lp","self-managed-lp","odf-lp"]'
      FIREWATCH_DEFAULT_JIRA_ASSIGNEE: ebenahar@redhat.com
      FIREWATCH_DEFAULT_JIRA_PROJECT: OCSQE
      FIREWATCH_FAIL_WITH_TEST_FAILURES: "true"
      MAP_TESTS: "true"
      OCP_VERSION: "4.22"
      ODF_VERSION_MAJOR_MINOR: "4.21"
      OPERATORS: |
        [
            {"name": "odf-operator", "install_namespace": "openshift-storage", "target_namespaces": "!install", "operator_group": "openshift-storage-operator-group"}
        ]
      USER_TAGS: |
        scenario odf
      ZONES_COUNT: "3"
    test:
    - ref: odf-prepare-cluster
    - ref: install-operators
    - ref: odf-apply-storage-cluster
    - ref: interop-tests-ocs-tests
    workflow: firewatch-ipi-aws-cr
zz_generated_metadata:
  branch: master
  org: red-hat-storage
  repo: ocs-ci
  variant: odf-ocp-4.22-lpGA-lp-interop
