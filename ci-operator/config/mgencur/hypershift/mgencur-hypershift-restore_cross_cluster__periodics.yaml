base_images:
  hypershift-operator:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
  hypershift-tests:
    name: hypershift-tests
    namespace: hypershift
    tag: latest
  upi-installer:
    name: "5.1"
    namespace: ocp
    tag: upi-installer
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "5.1"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-v2-aws-backuprestore-cross-cluster
  cron: 0 6 * * 0
  steps:
    cluster_profile: hypershift-aws
    env:
      TECH_PREVIEW_NO_UPGRADE: "true"
      TEST_SUITE: openshift/conformance/parallel/minimal
    workflow: hypershift-aws-e2e-backuprestore-cross-cluster
zz_generated_metadata:
  branch: restore_cross_cluster
  org: mgencur
  repo: hypershift
  variant: periodics
