build_root:
  image_stream_tag:
    name: ci-tools-build-root
    namespace: ci
    tag: latest
images:
  items:
  - dockerfile_path: prow/Dockerfile
    to: benchmark-runner
promotion:
  to:
  - namespace: ci
    tag: latest
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: main
  org: redhat-performance
  repo: benchmark-runner
