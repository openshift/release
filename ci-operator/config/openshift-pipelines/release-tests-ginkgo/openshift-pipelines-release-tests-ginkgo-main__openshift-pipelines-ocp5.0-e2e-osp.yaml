base_images:
  cli:
    name: "5.0"
    namespace: ocp
    tag: cli
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-5.0
images:
  items:
  - context_dir: .
    dockerfile_path: Dockerfile
    to: openshift-pipelines-runner
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    release:
      architecture: amd64
      channel: candidate
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: e2e-ginkgo
  optional: true
  steps:
    cluster_profile: aws-osp-qe
    env:
      BASE_DOMAIN: psi.ospqa.com
    test:
    - ref: openshift-pipelines-ginkgo-install
    - ref: openshift-pipelines-ginkgo-tests
    workflow: ipi-aws
  timeout: 4h0m0s
zz_generated_metadata:
  branch: main
  org: openshift-pipelines
  repo: release-tests-ginkgo
  variant: openshift-pipelines-ocp5.0-e2e-osp
