base_images:
  cli:
    name: "4.22"
    namespace: ocp
    tag: cli
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.22
images:
  items:
  - context_dir: .
    dockerfile_path: Dockerfile.CI
    to: openshift-pipelines-ginkgo-runner
releases:
  latest:
    release:
      architecture: amd64
      channel: stable
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: openshift-pipelines-e2e-ginkgo
  steps:
    cluster_profile: aws-osp-qe
    env:
      BASE_DOMAIN: psi.ospqa.com
      CATALOG_INDEX_IMAGE: quay.io/openshift-pipeline/pipelines-index-4.22:next
      CATALOG_SOURCE_NAME: custom-operators
    test:
    - ref: openshift-pipelines-catalog-source
    - ref: openshift-pipelines-install
    - ref: openshift-pipelines-ginkgo-tests
    workflow: ipi-aws
  timeout: 3h0m0s
zz_generated_metadata:
  branch: main
  org: openshift-pipelines
  repo: release-tests-ginkgo
  variant: openshift-pipelines-ocp4.22-e2e-osp
