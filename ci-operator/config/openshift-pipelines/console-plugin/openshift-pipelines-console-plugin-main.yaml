build_root:
  from_repository: true
images:
  items:
  - dockerfile_literal: |
      FROM quay.io/openshift-pipeline/ui-ci:latest
      COPY test-prow-e2e.sh /usr/local/bin/test-prow-e2e.sh
    to: playwright-runner
  - dockerfile_path: Dockerfile
    to: console-pipelines-plugin
promotion:
  to:
  - name: "4.21"
    namespace: ocp
releases:
  latest:
    integration:
      include_built_images: true
      name: "4.21"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: build
  steps:
    test:
    - as: build
      commands: yarn install && yarn build
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: frontend
  steps:
    test:
    - as: frontend
      commands: ./test-frontend.sh
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: e2e
  steps:
    cluster_profile: aws-osp-qe
    test:
    - as: e2e
      cli: latest
      commands: bash /usr/local/bin/test-prow-e2e.sh
      from: playwright-runner
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
    workflow: generic-claim
zz_generated_metadata:
  branch: main
  org: openshift-pipelines
  repo: console-plugin
