build_root:
  image_stream_tag:
    name: aro-hcp-ci-images
    namespace: aro-hcp
    tag: aro-hcp-e2e-base-ci
images:
  items:
  - dockerfile_path: test/Containerfile.e2e
    from: src
    to: aro-hcp-e2e-tests
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
  aro-hcp-e2e-tests:
    limits:
      cpu: "8"
      memory: 10Gi
    requests:
      cpu: "8"
      memory: 10Gi
tests:
- as: test-priorities-refresh
  cron: 0 6 * * 1
  max_concurrency: 1
  reporter_config:
    channel: '#aro-hcp-failures-dev'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  steps:
    env:
      PRIORITIES_PUBLISH: "false"
    test:
    - ref: aro-hcp-github-app-auth
      env:
        GITHUB_APP_TOKEN_PERMISSIONS: '["contents","pull_requests"]'
    - ref: aro-hcp-automation-test-priorities
  timeout: 90m0s
zz_generated_metadata:
  branch: main
  org: Azure
  repo: ARO-HCP
  variant: test-priorities
