base_images:
  aro-hcp-e2e-tools:
    name: aro-hcp-e2e-tools
    namespace: aro-hcp
    tag: latest
resources:
  '*':
    requests:
      cpu: 500m
      memory: 1Gi
tests:
- as: image-updater-tooling
  cron: 0 6,14,22 * * 1-5
  reporter_config:
    channel: '#aro-hcp-failures-dev'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  steps:
    env:
      VERBOSITY: "0"
    test:
    - ref: aro-hcp-automation-image-update
zz_generated_metadata:
  branch: main
  org: Azure
  repo: ARO-HCP
  variant: image-updater
