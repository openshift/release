base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: dev-infrastructure/openshift-ci/Dockerfile
    from: src
    to: aro-hcp-e2e-base-ci
  - dockerfile_path: dev-infrastructure/openshift-ci/Dockerfile.nested-podman
    from: nested-podman
    to: aro-hcp-nested-podman-ci
  run_if_changed: ^(dev-infrastructure/openshift-ci/Dockerfile(\.nested-podman)?$|\.bingo/|\.ci-operator\.yaml$)
promotion:
  to:
  - name: aro-hcp-ci-images
    namespace: aro-hcp
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: "3"
      memory: 4Gi
  aro-hcp-e2e-tools:
    limits:
      memory: 10Gi
    requests:
      cpu: "8"
      memory: 8Gi
tests:
- as: go-smoke-test
  commands: |
    set -euo pipefail
    d=$(mktemp -d)
    cd "$d"
    go mod init smoke.example.com/nonroot
    printf '%s\n' 'package main' 'func main() {}' > main.go
    go build -o /dev/null .
    go test .
    echo "Go GOMODCACHE=$(go env GOMODCACHE) GOCACHE=$(go env GOCACHE) OK"
  container:
    from: aro-hcp-e2e-base-ci
  run_if_changed: ^(dev-infrastructure/openshift-ci/Dockerfile$|\.ci-operator\.yaml$)
- as: nested-podman-smoke-test
  capabilities:
  - nested-podman
  nested_podman: true
  run_if_changed: ^dev-infrastructure/openshift-ci/Dockerfile\.nested-podman$
  steps:
    test:
    - as: nested-podman-smoke-test
      commands: |
        set -euo pipefail
        test "$(id -u)" = 1000 || { echo "ERROR: image must run as UID 1000" >&2; exit 1; }
        git --version
        go version
        make --version
        pass --version
        qrencode --version
        netstat --version
        tree --version
        podman --version
        export GOPATH=/opt/app-root
        d=$(mktemp -d)
        cd "$d"
        go mod init smoke.example.com/nonroot
        printf '%s\n' 'package main' 'func main() {}' > main.go
        go test .
        go install .
        "$GOPATH/bin/nonroot"
        test "$(podman info --format '{{.Host.Security.Rootless}}')" = true || \
          { echo "ERROR: Podman must run rootless" >&2; exit 1; }
        output=$(podman run --rm --network=host registry.access.redhat.com/ubi9/ubi-minimal:9.5 /bin/echo nested-podman-ok)
        test "$output" = nested-podman-ok || \
          { echo "ERROR: nested container did not produce the expected output" >&2; exit 1; }
        echo "Nested Podman toolchain OK"
        echo nested-podman-ok > "${SHARED_DIR}/nested-podman-smoke-result"
      from: aro-hcp-nested-podman-ci
      nested_podman: true
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
    - as: verify-smoke-result
      commands: |
        set -euo pipefail
        # Detect an inherited entrypoint that exits successfully without running the smoke commands.
        grep -qx nested-podman-ok "${SHARED_DIR}/nested-podman-smoke-result"
      from: root
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
zz_generated_metadata:
  branch: main
  org: Azure
  repo: ARO-HCP
  variant: baseimage-generator
