base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: dev-infrastructure/openshift-ci/Dockerfile
    from: src
    to: aro-hcp-e2e-base-ci
  - dockerfile_path: dev-infrastructure/openshift-ci/Dockerfile.nested-podman
    from: nested-podman
    to: aro-hcp-nested-podman-ci
  - dockerfile_literal: |
      FROM aro-hcp-nested-podman-ci
      COPY --chown=1000:0 /src /opt/app-root/src/github.com/Azure
      WORKDIR /opt/app-root/src/github.com/Azure/ARO-HCP
    from: aro-hcp-nested-podman-ci
    inputs:
      src:
        paths:
        - destination_dir: src
          source_path: /go/src/github.com/Azure/ARO-HCP
    to: nested-podman-src
  run_if_changed: ^(dev-infrastructure/openshift-ci/Dockerfile(\.nested-podman)?$|\.bingo/|\.ci-operator\.yaml$)
promotion:
  to:
  - excluded_images:
    - nested-podman-src
    name: aro-hcp-ci-images
    namespace: aro-hcp
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: "3"
      memory: 4Gi
  aro-hcp-e2e-tools:
    limits:
      memory: 10Gi
    requests:
      cpu: "8"
      memory: 8Gi
tests:
- as: go-smoke-test
  commands: |
    set -euo pipefail
    d=$(mktemp -d)
    cd "$d"
    go mod init smoke.example.com/nonroot
    printf '%s\n' 'package main' 'func main() {}' > main.go
    go build -o /dev/null .
    go test .
    echo "Go GOMODCACHE=$(go env GOMODCACHE) GOCACHE=$(go env GOCACHE) OK"
  container:
    from: aro-hcp-e2e-base-ci
  run_if_changed: ^(dev-infrastructure/openshift-ci/Dockerfile$|\.ci-operator\.yaml$)
- as: nested-podman-smoke-test
  capabilities:
  - nested-podman
  - arm64
  nested_podman: true
  run_if_changed: ^dev-infrastructure/openshift-ci/Dockerfile\.nested-podman$
  steps:
    test:
    - as: nested-podman-smoke-test
      commands: |
        set -euxo pipefail
        export AZURE_TOKEN_CREDENTIALS=prod
        test-integration/hack/start-cosmos-emulator.sh
        test-integration/hack/stop-cosmos-emulator.sh
        unset GOFLAGS
        make mega-lint CONTAINER_RUNTIME=podman
      from: nested-podman-src
      grace_period: 30s
      nested_podman: true
      resources:
        requests:
          cpu: 4000m
          memory: 4Gi
zz_generated_metadata:
  branch: main
  org: Azure
  repo: ARO-HCP
  variant: baseimage-generator
