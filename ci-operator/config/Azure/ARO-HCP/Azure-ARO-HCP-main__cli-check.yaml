base_images:
  cli-check-base:
    name: aro-hcp-ci-images
    namespace: aro-hcp
    tag: aro-hcp-e2e-base-ci
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: test-priorities-cli-check
  cron: 0 3 31 2 *
  reporter_config:
    channel: '#aro-hcp-failures-dev'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  steps:
    test:
    - ref: aro-hcp-automation-test-priorities-cli-check
  timeout: 45m0s
zz_generated_metadata:
  branch: main
  org: Azure
  repo: ARO-HCP
  variant: cli-check
