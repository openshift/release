base_images:
  prcreator:
    name: prcreator
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: aro-hcp-ci-images
    namespace: aro-hcp
    tag: aro-hcp-e2e-base-ci
images:
  items:
  - dockerfile_literal: |
      FROM src
      # Prcreator
      ADD prcreator /usr/bin/prcreator
      # ARO-HCP
      COPY /src /opt/app-root/src/github.com/Azure
      WORKDIR /opt/app-root/src/github.com/Azure/ARO-HCP
      ENV GOFLAGS='-mod=vendor'
      ENV GOPATH=/opt/app-root
      ENV GOCACHE=/opt/app-root/.cache
      RUN mkdir -p $GOPATH/bin && \
          make install-tools && \
          make -C tooling/component-updater build && \
          make -C tooling/templatize templatize && \
          make -C tooling/yamlwrap
      # Ensure all tools are in PATH
      ENV PATH="/usr/local/bin:$GOPATH/bin:$PATH"
      # Ensure all files are writable
      RUN chmod -R a+w /opt/app-root
    from: src
    inputs:
      prcreator:
        paths:
        - destination_dir: .
          source_path: /usr/bin/prcreator
      src:
        paths:
        - destination_dir: src
        source_path: /go/src/github.com/Azure/ARO-HCP
    to: aro-hcp-automation-component-update
resources:
  '*':
    requests:
      cpu: 500m
      memory: 1Gi
tests:
- as: component-updater-tooling
  cron: 0 8 * * 1-5
  reporter_config:
    channel: '#aro-hcp-failures-dev'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  steps:
    env:
      COMPONENT: istio-mesh-revision
      VERBOSITY: "0"
    test:
    - ref: aro-hcp-automation-component-update
zz_generated_metadata:
  branch: main
  org: Azure
  repo: ARO-HCP
  variant: component-updater
