base_images:
  # Needed: ref kubevirt-libvirt-vpn uses `from: libvirt-installer` (#72780).
  libvirt-installer:
    name: "4.19"
    namespace: ocp
    tag: libvirt-installer
  metrics-linter:
    name: prom-metrics-linter
    namespace: ci
    tag: v0.0.11
build_root:
  project_image:
    dockerfile_path: ci-builder/Dockerfile
images:
  items:
  - dockerfile_literal: |
      FROM src
      COPY prom-metrics-linter /usr/bin/prom-metrics-linter
      RUN dnf install -y jq && dnf clean all
    from: src
    inputs:
      metrics-linter:
        paths:
        - destination_dir: .
          source_path: /prom-metrics-linter
    to: ssp-metrics-linter
  - dockerfile_path: Dockerfile
    to: ssp-operator-container
  - dockerfile_path: validator.Dockerfile
    to: template-validator-container
releases:
  initial:
    integration:
      name: "4.19"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.19"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unittests
  skip_if_only_changed: ^\.github/|^docs/|\.[mM][dD]$|^.gitignore$|^OWNERS$|^PROJECT$|^LICENSE$
  steps:
    cluster_profile: gcp-virtualization
    test:
    - as: unittests
      commands: export GOFLAGS= && make unittest
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: metrics-linter
      commands: export GOFLAGS= && make lint-metrics
      from: ssp-metrics-linter
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: e2e-functests
  skip_if_only_changed: ^\.github/|^docs/|\.[mM][dD]$|^.gitignore$|^OWNERS$|^PROJECT$|^LICENSE$
  steps:
    cluster_profile: gcp-virtualization
    env:
      COMPUTE_NODE_TYPE: n2-standard-4
    test:
    - as: e2e-functests
      cli: latest
      commands: |
        export GOFLAGS=
        ./automation/e2e-functests/run.sh
      dependencies:
      - env: CI_OPERATOR_IMG
        name: ssp-operator-container
      - env: CI_VALIDATOR_IMG
        name: template-validator-container
      env:
      - default: main
        name: CI_BRANCH
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-gcp
- as: e2e-upgrade-functests
  skip_if_only_changed: ^\.github/|^docs/|\.[mM][dD]$|^.gitignore$|^OWNERS$|^PROJECT$|^LICENSE$
  steps:
    cluster_profile: gcp-virtualization
    env:
      COMPUTE_NODE_TYPE: n2-standard-4
    test:
    - as: e2e-upgrade-functests
      cli: latest
      commands: |
        export GOFLAGS=
        ./automation/e2e-upgrade-functests/run.sh
      dependencies:
      - env: CI_OPERATOR_IMG
        name: ssp-operator-container
      - env: CI_VALIDATOR_IMG
        name: template-validator-container
      env:
      - default: main
        name: CI_BRANCH
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-gcp
- as: e2e-single-node-functests
  skip_if_only_changed: ^\.github/|^docs/|\.[mM][dD]$|^.gitignore$|^OWNERS$|^PROJECT$|^LICENSE$
  steps:
    cluster_profile: gcp-virtualization
    test:
    - as: e2e-single-node-functests
      cli: latest
      commands: |
        export TOPOLOGY_MODE=SingleReplica
        export GOFLAGS=
        ./automation/e2e-functests/run.sh
      dependencies:
      - env: CI_OPERATOR_IMG
        name: ssp-operator-container
      - env: CI_VALIDATOR_IMG
        name: template-validator-container
      env:
      - default: main
        name: CI_BRANCH
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-gcp-single-node
# Draft connectivity validation for SSP s390x orange-zone VPN (libvirt-s390x-vpn-virt).
# Depends on Boskos leases (#82263) and secret bootstrap (#82292) being merged + synced.
# Pattern: multiarch PR #72780.
- as: e2e-s390x-vpn-connectivity
  capabilities:
  - intranet # needed: schedule on intranet-capable build clusters for VPN
  # #NEED? cron for draft? Fine for draft PR; could be manual-only until infra lands.
  cron: 0 6 * * *
  steps:
    cluster_profile: libvirt-s390x-vpn-virt # needed: mounts secret + triggers VPN sidecar
    dependencies:
      # #NEED? Copied from #72780; unused by connectivity script.
      OPENSHIFT_INSTALL_TARGET: release:latest
    env:
      # #NEED? Required by ref env list; unused by script.
      ARCH: s390x
      BRANCH: "4.19"
    workflow: kubevirt-libvirt-vpn
zz_generated_metadata:
  branch: main
  org: kubevirt
  repo: ssp-operator
