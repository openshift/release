base_images:
  base:
    name: ubi
    namespace: ocp
    tag: "9"
  ocm-cli:
    name: ocm-cli
    namespace: ci
    tag: latest
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: release
  tls-scanner-tool:
    name: "4.22"
    namespace: ocp
    tag: tls-scanner-tool
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.25-openshift-4.21
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile.ci
    from: base
    to: compliance-operator
  - additional_architectures:
    - arm64
    dockerfile_path: images/testcontent/Dockerfile.ci
    to: testcontent
  - additional_architectures:
    - arm64
    dockerfile_path: images/openscap/Dockerfile
    to: testopenscap
promotion:
  to:
  - excluded_images:
    - testcontent
    - testopenscap
    name: "4.17"
    namespace: ComplianceAsCode
releases:
  arm64-latest:
    candidate:
      architecture: arm64
      product: ocp
      stream: nightly
      version: "4.17"
  initial:
    integration:
      name: "4.17"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.22"
      namespace: ocp
  latest-4-22:
    integration:
      name: "4.22"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 200m
      memory: 400Mi
tests:
- as: go-build
  commands: make
  container:
    from: src
  skip_if_only_changed: ^.*(md|adoc)$|^LICENSE$
- as: verify
  commands: make verify
  container:
    from: src
  skip_if_only_changed: ^.*(md|adoc)$|^LICENSE$
- as: unit
  commands: make test-unit
  container:
    from: src
  skip_if_only_changed: ^.*(md|adoc)$|^LICENSE$
- as: e2e-aws-parallel
  skip_if_only_changed: ^.*(md|adoc)$|^LICENSE$|^.github/workflows/*|^renovate\.json$
  steps:
    cluster_profile: aws-stackrox
    env:
      BASE_DOMAIN: perfscale.rox.systems
    test:
    - as: test
      cli: latest
      commands: make e2e-parallel
      dependencies:
      - env: IMAGE_FROM_CI
        name: compliance-operator
      - env: CONTENT_IMAGE_FROM_CI
        name: testcontent
      - env: OPENSCAP_IMAGE_FROM_CI
        name: testopenscap
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-aws
- as: e2e-aws-serial
  skip_if_only_changed: ^.*(md|adoc)$|^LICENSE$|^.github/workflows/*|^renovate\.json$
  steps:
    cluster_profile: aws-stackrox
    env:
      BASE_DOMAIN: perfscale.rox.systems
    test:
    - as: test
      cli: latest
      commands: make e2e-serial
      dependencies:
      - env: IMAGE_FROM_CI
        name: compliance-operator
      - env: CONTENT_IMAGE_FROM_CI
        name: testcontent
      - env: OPENSCAP_IMAGE_FROM_CI
        name: testopenscap
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-aws
- as: e2e-aws-deployment
  skip_if_only_changed: ^.*(md|adoc)$|^LICENSE$|^.github/workflows/*
  steps:
    cluster_profile: aws-stackrox
    env:
      BASE_DOMAIN: perfscale.rox.systems
      COMPUTE_NODE_TYPE: m5.2xlarge
    post:
    - chain: ipi-deprovision
    pre:
    - chain: ipi-conf-aws
    - chain: ipi-install
    test:
    - as: test
      cli: latest
      commands: |
        #!/bin/bash
        set -euo pipefail

        # Run deployment tests first (creates, tests, and cleans up openshift-compliance namespace)
        export TEST_OPERATOR_NAMESPACE="openshift-compliance"
        make e2e-deployment

        # Redeploy compliance-operator for TLS scanning (deployment test cleaned up everything)
        echo "Redeploying compliance-operator for TLS scanning..."
        export GOFLAGS=""
        export NAMESPACE=openshift-compliance
        make deploy

        # Wait for deployment to be ready
        echo "Waiting for compliance-operator deployment to be ready..."
        oc wait --for=condition=Available deployment/compliance-operator -n openshift-compliance --timeout=10m

        # Run TLS scanner after deployment completes
        echo "=== Running TLS Scanner ==="
        export NAMESPACE="openshift-compliance"
        export SCANNER_IMAGE="${PULL_SPEC_TLS_SCANNER_TOOL}"

        echo "TLS scanner target: openshift-compliance namespace"
        echo "PQC readiness mode: enabled"

        # Grant permissions for scanner
        oc adm policy add-cluster-role-to-user cluster-admin -z default -n "${NAMESPACE}"
        sleep 5

        # Create scanner pod
        cat <<EOF | oc create -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: tls-scanner
          namespace: ${NAMESPACE}
        spec:
          serviceAccountName: default
          restartPolicy: Never
          containers:
          - name: scanner
            image: ${SCANNER_IMAGE}
            command:
            - /bin/bash
            - -c
            - |
              mkdir -p /results
              /usr/local/bin/tls-scanner -j 4 \
                --all-pods \
                --namespace-filter openshift-compliance \
                --pqc-check \
                --json-file /results/results.json \
                --csv-file /results/results.csv \
                --junit-file /results/junit_tls_scan.xml \
                --log-file /results/scan.log 2>&1 | tee /results/output.log
              SCAN_EXIT_CODE=\${PIPESTATUS[0]}
              echo "Scan complete. Exit code: \${SCAN_EXIT_CODE}" | tee -a /results/output.log
              touch /results/scan.done
              sleep 60
              exit \${SCAN_EXIT_CODE}
            resources:
              requests:
                cpu: "4"
                memory: 4Gi
              limits:
                cpu: "4"
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 65532
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - name: results
              mountPath: /results
          volumes:
          - name: results
            emptyDir: {}
        EOF

        # Wait for scanner to start
        echo "Waiting for scanner pod to start..."
        oc wait --for=condition=Ready pod/tls-scanner -n "${NAMESPACE}" --timeout=5m

        # Stream logs
        oc logs -f pod/tls-scanner -n "${NAMESPACE}" &
        LOGS_PID=$!

        # Wait for completion
        echo "Waiting for scan to complete..."
        while true; do
          if oc exec pod/tls-scanner -n "${NAMESPACE}" -- test -f /results/scan.done 2>/dev/null; then
            break
          fi
          phase=$(oc get pod/tls-scanner -n "${NAMESPACE}" -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
          if [[ "$phase" == "Succeeded" || "$phase" == "Failed" ]]; then
            break
          fi
          sleep 10
        done

        # Copy results
        echo "Copying scan results..."
        mkdir -p "${ARTIFACT_DIR}/tls-scanner"
        oc cp "${NAMESPACE}/tls-scanner:/results/." "${ARTIFACT_DIR}/tls-scanner/" || echo "Warning: Failed to copy artifacts"

        if [[ -f "${ARTIFACT_DIR}/tls-scanner/junit_tls_scan.xml" ]]; then
          cp "${ARTIFACT_DIR}/tls-scanner/junit_tls_scan.xml" "${ARTIFACT_DIR}/junit_tls_scan.xml"
          echo "JUnit results copied for Spyglass"
        fi

        wait $LOGS_PID 2>/dev/null || true

        # Check exit status
        pod_exit_code=$(oc get pod/tls-scanner -n "${NAMESPACE}" -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}' 2>/dev/null || echo "1")
        echo "=== TLS Scanner Complete (namespace: openshift-compliance) ==="
        if [[ "$pod_exit_code" == "0" ]]; then
          echo "Result: PASSED"
        else
          echo "Result: FAILED"
          exit "${pod_exit_code}"
        fi
      dependencies:
      - env: IMAGE_FROM_CI
        name: compliance-operator
      - env: CONTENT_IMAGE_FROM_CI
        name: testcontent
      - env: OPENSCAP_IMAGE_FROM_CI
        name: testopenscap
      - env: PULL_SPEC_TLS_SCANNER_TOOL
        name: tls-scanner-tool
      from: src
      resources:
        requests:
          cpu: 100m
- always_run: false
  as: e2e-aws-scan-config
  optional: true
  steps:
