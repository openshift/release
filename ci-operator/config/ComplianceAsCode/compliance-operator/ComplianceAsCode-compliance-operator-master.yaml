- always_run: false
  as: e2e-aws-tls-scanner-5-0
  optional: true
  skip_if_only_changed: ^.*(md|adoc)$|^LICENSE$|^.github/workflows/*
  steps:
    cluster_profile: aws-stackrox
    dependencies:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: release:latest-5-0
    env:
      BASE_DOMAIN: perfscale.rox.systems
      COMPUTE_NODE_TYPE: m5.2xlarge
      CUSTOM_OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: registry.ci.openshift.org/ocp/release-5:5.0.0-0.nightly-2026-09-09-111616
    post:
    - chain: ipi-deprovision
    pre:
    - chain: ipi-conf-aws
    - chain: ipi-install
    test:
    - as: test
      cli: latest
      commands: |
        #!/bin/bash
        set -euo pipefail

        # cli:latest ships `oc`, not `kubectl` — shim it for make deploy/install.
        ln -sf "$(command -v oc)" /tmp/kubectl && export PATH="/tmp:${PATH}"

        IMG="${IMAGE_FROM_CI}" OPERATOR_IMAGE="${IMAGE_FROM_CI}" make deploy

        echo "Waiting for compliance-operator deployment to be ready..."
        oc wait --for=condition=Available deployment/compliance-operator -n openshift-compliance --timeout=10m

        echo "Compliance Operator image: ${IMAGE_FROM_CI}"
        oc logs deployment/compliance-operator -n openshift-compliance | grep "Compliance Operator Version" || echo "Compliance Operator Version: not found in logs"

        echo "=== Running TLS Scanner ==="
        export NAMESPACE="openshift-compliance"
        export SCANNER_IMAGE="${PULL_SPEC_TLS_SCANNER_TOOL}"

        # Least-privilege grants matching openshift/tls-scanner's own documented
        # deploy.sh, rather than cluster-admin: read-only cluster access, the
        # privileged SCC (the scanner probes ports as root-equivalent for
        # process/socket introspection), and a narrow ClusterRole for the few
        # cross-namespace calls (pods/exec, ingresscontrollers, kubeletconfigs)
        # that cluster-reader alone doesn't cover.
        oc adm policy add-cluster-role-to-user cluster-reader -z default -n "${NAMESPACE}"
        oc adm policy add-scc-to-user privileged -z default -n "${NAMESPACE}"

        cat <<TLSSCANNERROLE | oc apply -f -
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: tls-scanner-cross-namespace
        rules:
        - apiGroups:
          - ""
          resources:
          - pods/exec
          verbs:
          - create
        - apiGroups:
          - operator.openshift.io
          resources:
          - ingresscontrollers
          verbs:
          - get
          - list
        - apiGroups:
          - machineconfiguration.openshift.io
          resources:
          - kubeletconfigs
          verbs:
          - get
          - list
        TLSSCANNERROLE

        oc adm policy add-cluster-role-to-user tls-scanner-cross-namespace -z default -n "${NAMESPACE}"
        sleep 5

        cat <<SCANNERPOD | oc create -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: tls-scanner
          namespace: ${NAMESPACE}
        spec:
          serviceAccountName: default
          restartPolicy: Never
          activeDeadlineSeconds: 2100
          containers:
          - name: scanner
            image: ${SCANNER_IMAGE}
            env:
            # tls-scanner writes scratch files via os.CreateTemp("", ...) and
            # testssl.sh's own mktemp calls, both of which resolve to \$TMPDIR
            # (default /tmp) independent of --artifact-dir/--*-file, which are
            # absolute paths and unaffected. Point it at the writable /results
            # mount so readOnlyRootFilesystem below doesn't break the scan.
            - name: TMPDIR
              value: /results
            command:
            - /bin/bash
            - -c
            - |
              mkdir -p /results
              /usr/local/bin/tls-scanner -j 4 \
                --all-pods \
                --namespace-filter openshift-compliance \
                --pqc-check \
                --json-file /results/results.json \
                --csv-file /results/results.csv \
                --junit-file /results/junit_tls_scan.xml \
                --log-file /results/scan.log 2>&1 | tee /results/output.log
              SCAN_EXIT_CODE=\${PIPESTATUS[0]}
              echo "Scan complete. Exit code: \${SCAN_EXIT_CODE}" | tee -a /results/output.log
              touch /results/scan.done
              sleep 60
              exit \${SCAN_EXIT_CODE}
            resources:
              requests:
                cpu: "4"
                memory: 4Gi
              limits:
                cpu: "4"
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 65532
              capabilities:
                drop:
                - ALL
              seccompProfile:
                type: RuntimeDefault
            volumeMounts:
            - name: results
              mountPath: /results
          volumes:
          - name: results
            emptyDir: {}
        SCANNERPOD

        echo "Waiting for scanner pod to start..."
        oc wait --for=condition=Ready pod/tls-scanner -n "${NAMESPACE}" --timeout=5m

        oc logs -f pod/tls-scanner -n "${NAMESPACE}" &
        LOGS_PID=$!

        echo "Waiting for scan to complete..."
        SCAN_TIMEOUT_SECONDS=1800
        SCAN_ELAPSED_SECONDS=0
        SCAN_TIMED_OUT=false
        while true; do
          if oc exec pod/tls-scanner -n "${NAMESPACE}" -- test -f /results/scan.done 2>/dev/null; then
            break
          fi
          phase=$(oc get pod/tls-scanner -n "${NAMESPACE}" -o jsonpath='{.status.phase}' 2>/dev/null || echo "Unknown")
          if [[ "$phase" == "Succeeded" || "$phase" == "Failed" ]]; then
            break
          fi
          if (( SCAN_ELAPSED_SECONDS >= SCAN_TIMEOUT_SECONDS )); then
            echo "Timed out after ${SCAN_TIMEOUT_SECONDS}s waiting for the scan to complete"
            SCAN_TIMED_OUT=true
            break
          fi
          sleep 10
          SCAN_ELAPSED_SECONDS=$((SCAN_ELAPSED_SECONDS + 10))
        done

        echo "Copying scan results..."
        mkdir -p "${ARTIFACT_DIR}/tls-scanner"
        oc cp "${NAMESPACE}/tls-scanner:/results/." "${ARTIFACT_DIR}/tls-scanner/" || echo "Warning: Failed to copy artifacts"

        if [[ -f "${ARTIFACT_DIR}/tls-scanner/junit_tls_scan.xml" ]]; then
          cp "${ARTIFACT_DIR}/tls-scanner/junit_tls_scan.xml" "${ARTIFACT_DIR}/junit_tls_scan.xml"
          echo "JUnit results copied for Spyglass"
        fi

        wait $LOGS_PID 2>/dev/null || true

        # The container does `touch scan.done; sleep 60; exit $code` internally, so
        # scan.done can exist for up to 60s before containerStatuses[].state.terminated
        # is actually populated. Poll for it instead of reading it once.
        pod_exit_code=""
        for _ in $(seq 1 18); do
          pod_exit_code=$(oc get pod/tls-scanner -n "${NAMESPACE}" -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}' 2>/dev/null || true)
          if [[ -n "$pod_exit_code" ]]; then
            break
          fi
          sleep 5
        done
        pod_exit_code="${pod_exit_code:-1}"
        echo "=== TLS Scanner Complete (namespace: openshift-compliance) ==="
        if [[ "$SCAN_TIMED_OUT" == "true" ]]; then
          echo "Result: FAILED (scan did not complete within ${SCAN_TIMEOUT_SECONDS}s)"
          exit 1
        elif [[ "$pod_exit_code" == "0" ]]; then
          echo "Result: PASSED"
        else
          echo "Result: FAILED"
          exit "${pod_exit_code}"
        fi
      dependencies:
      - env: IMAGE_FROM_CI
        name: compliance-operator
      - env: PULL_SPEC_TLS_SCANNER_TOOL
        name: tls-scanner-tool-5-0
      from: src
      resources:
        requests:
          cpu: 100m
