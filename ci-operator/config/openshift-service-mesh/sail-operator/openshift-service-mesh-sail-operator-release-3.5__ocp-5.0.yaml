base_images:
  cli:
    name: "5.0"
    namespace: ocp
    tag: cli
build_root:
  image_stream_tag:
    name: maistra-builder
    namespace: ci
    tag: upstream-1.31
  use_build_cache: true
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: "2"
      memory: 2Gi
tests:
- as: e2e-ocp
  cron: 0 5 * * 1
  steps:
    cluster_profile: ossm-aws
    env:
      INSTALLATION_METHOD: helm
      MAISTRA_BUILDER_IMAGE: registry.istio.io/testing/build-tools:release-1.31-9dd215042ac24a150e432b1321a23be505f281a5
      MAISTRA_NAMESPACE: maistra-e2e-test
      MAISTRA_SC_POD: maistra-e2e-test-sc-pod
      REPORT_TO_REPORT_PORTAL: "true"
      TEST_FILE_NAME: report.xml
      TEST_SUITE_DESC: Sail Operator e2e
      XDG_CACHE_HOME: /tmp/cache
    test:
    - ref: servicemesh-sail-operator-copy-src
    - ref: servicemesh-sail-operator-e2e-ocp
    workflow: servicemesh-istio-e2e-profile
zz_generated_metadata:
  branch: release-3.5
  org: openshift-service-mesh
  repo: sail-operator
  variant: ocp-5.0
