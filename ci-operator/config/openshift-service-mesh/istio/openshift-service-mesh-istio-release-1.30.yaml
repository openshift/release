    env:
      BASE_DOMAIN: servicemesh.devcluster.openshift.com
      MAISTRA_BUILDER_IMAGE: gcr.io/istio-testing/build-tools:release-1.30-eb39224ee48cc78838959ec5de9c75d007973435
      MAISTRA_NAMESPACE: maistra-e2e-test
