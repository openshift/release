base_images:
  cli:
    name: "4.22"
    namespace: ocp
    tag: cli
build_root:
  image_stream_tag:
    name: maistra-builder
    namespace: ci
    tag: upstream-1.31
releases:
  latest:
    release:
      architecture: multi
      channel: stable
      version: "4.22"
resources:
  '*':
    limits:
      memory: 16Gi
    requests:
      cpu: "4"
      memory: 4Gi
tests:
- as: sync-upstream-istio-1.31
  commands: |
    git clone --single-branch --depth=1 --branch main https://github.com/maistra/test-infra.git
    cd test-infra
    export BUILD_WITH_CONTAINER="0"
    export XDG_CACHE_HOME="/tmp/cache"
    export GOCACHE="/tmp/cache"
    export GOMODCACHE="/tmp/cache"
    # istio.deps is merged semantically: take upstream's file but keep our own
    # proxy and ztunnel pins. Everything else, agentgateway included, follows
    # upstream. Scoped to istio.deps so every other file merges normally.
    cat > /tmp/merge-istio-deps.sh <<'EOF'
    #!/usr/bin/env bash
    set -euo pipefail
    merged=$(mktemp)
    trap 'rm -f "${merged}"' EXIT
    jq -e --slurpfile ours "$1" '
      ($ours[0] | map(select(.name == "PROXY_REPO_SHA" or .name == "ZTUNNEL_REPO_SHA"))
        | map({key: .name, value: .lastStableSHA}) | from_entries) as $pins
      | map(if $pins[.name] then .lastStableSHA = $pins[.name] else . end)
    ' "$2" > "${merged}"
    cat "${merged}" > "$1"
    EOF
    chmod +x /tmp/merge-istio-deps.sh
    echo 'istio.deps merge=istio-deps' > /tmp/gitattributes
    export GIT_CONFIG_GLOBAL=/tmp/gitconfig
    git config --global core.attributesFile /tmp/gitattributes
    git config --global merge.istio-deps.name 'keep downstream proxy and ztunnel pins'
    git config --global merge.istio-deps.driver '/tmp/merge-istio-deps.sh %A %B'
    ./tools/automator-main.sh \
    --org=openshift-service-mesh \
    --repo=istio \
    --branch=release-1.31 \
    --token-path=/creds-github/token \
    '--title=Automator: merge upstream changes to $AUTOMATOR_ORG/$AUTOMATOR_REPO@$AUTOMATOR_BRANCH' \
    "--labels=tide/merge-method-merge,auto-merge" \
    --modifier=merge_upstream_istio_1.31 \
    --merge-repository=https://github.com/istio/istio \
    --merge-branch=release-1.31 \
    --merge-strategy=merge \
    --merge-failure-pr
  container:
    from: src
  cron: 00 05 * * 1-5
  reporter_config:
    channel: '#istio-notifications'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  secrets:
  - collection: openshift-service-mesh
    group: github-ossm-bot-simple-job
    mount_path: /creds-github
- as: lint
  commands: |
    make lint \
    ARTIFACTS="${ARTIFACT_DIR:-}" \
    BUILD_WITH_CONTAINER="0" \
    GOBIN="/gobin" \
    GOCACHE="/tmp/cache" \
    GOMODCACHE="/tmp/cache" \
    XDG_CACHE_HOME="/tmp/cache"
  container:
    from: src
- always_run: false
  as: integ-helm
  pipeline_skip_if_only_changed: (^(docs|\.github|\.claude|\.cursor)/)|(\.md$)|((^|/)OWNERS$)|(^\.gitignore$)|(^LICENSE$)
  steps:
    cluster_profile: ossm-aws
    env:
      BASE_DOMAIN: servicemesh.devcluster.openshift.com
      INSTALLATION_METHOD: helm
      MAISTRA_BUILDER_IMAGE: registry.istio.io/testing/build-tools:release-1.31-b191766806f5d2982fab99ee081c7e519d436019
      MAISTRA_NAMESPACE: maistra-e2e-test
      MAISTRA_SC_POD: maistra-e2e-test-sc-pod
      REPORT_TO_REPORT_PORTAL: "true"
      TEST_FILE_NAME: junit.xml
      TEST_HUB: quay.io/sail-dev
      TEST_SUITE: helm
      TEST_SUITE_DESC: Istio Integration helm
    test:
    - ref: servicemesh-sail-operator-copy-src
    - ref: servicemesh-istio-images-build
    - ref: servicemesh-istio-int-tests
    workflow: servicemesh-istio-e2e-profile
- always_run: false
