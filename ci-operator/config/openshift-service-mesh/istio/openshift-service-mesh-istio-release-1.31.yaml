    - ref: servicemesh-istio-images-build
    - ref: servicemesh-istio-int-tests
    workflow: servicemesh-istio-e2e-profile
- as: update-istio-module
  commands: |
    export BUILD_WITH_CONTAINER="0"
    git clone https://github.com/maistra/test-infra.git
    cd test-infra
    ./tools/automator.sh \
      -o openshift-service-mesh \
      -r sail-operator \
      -f /creds-github/token \
      "-c go mod edit -replace="istio.io/istio=github.com/openshift-service-mesh/istio@release-1.31";go mod tidy;make gen" \
      '-t [release-3.5] Automator: Update Istio module' \
      -m bump-istio-mod-1.31 \
      -b release-3.5
  container:
    from: src
  postsubmit: true
  reporter_config:
    channel: '#team-ossm-release-maintenance'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  secrets:
  - collection: openshift-service-mesh
    group: github-ossm-bot-simple-job
    mount_path: /creds-github
zz_generated_metadata:
  branch: release-1.31
  org: openshift-service-mesh
  repo: istio
