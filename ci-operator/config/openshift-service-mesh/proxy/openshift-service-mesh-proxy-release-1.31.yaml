base_images:
  cli:
    name: "4.22"
    namespace: ocp
    tag: cli
build_root:
  image_stream_tag:
    name: maistra-builder
    namespace: ci
    tag: "3.5"
  use_build_cache: true
releases:
  latest:
    release:
      architecture: multi
      channel: stable
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 200m
      memory: 200Mi
tests:
- as: update-istio
  commands: |
    # load test-infra automator.sh script
    export ISTIO_ENVOY_BASE_URL="https://storage.googleapis.com/maistra-prow-testing/proxy"
    git clone https://github.com/maistra/test-infra.git
    cd test-infra
    ./tools/automator.sh \
      -o openshift-service-mesh \
      -r istio \
      -f /creds-github/token \
      "-c bin/update_proxy.sh ${PULL_BASE_SHA}" \
      '-t [release-1.31] Automator: Update proxy' \
      -m bump-proxy-1.31 \
      -b release-1.31
  container:
    from: src
  postsubmit: true
  reporter_config:
    channel: '#team-ossm-release-maintenance'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  secrets:
  - mount_path: /creds-github
    name: ossm-github-simple-job
zz_generated_metadata:
  branch: release-1.31
  org: openshift-service-mesh
  repo: proxy
