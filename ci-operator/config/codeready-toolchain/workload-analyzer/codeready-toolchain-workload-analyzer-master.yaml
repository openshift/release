base_images:
  base:
    name: "4.22"
    namespace: ocp
    tag: base
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
build_root:
  project_image:
    dockerfile_path: openshift-ci/Dockerfile.tools
images:
  items:
  - dockerfile_path: test/e2e/alertmanager-mock/build/Dockerfile
    from: base
    to: alertmanager-mock
  - dockerfile_path: openshift-ci/build/Dockerfile.openshift-ci-vm
    from: nested-podman
    to: e2e-vm-test
  - dockerfile_path: openshift-ci/build/Dockerfile.openshift-ci
    from: base
    to: workload-analyzer
prowgen:
  enable_secrets_store_csi_driver: true
  expose: true
  private: true
releases:
  initial:
    integration:
      name: "4.22"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.22"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: "3"
      memory: 250Mi
  e2e-vm:
    limits:
      memory: 8Gi
    requests:
      cpu: "2"
      memory: 8Gi
  e2e-vm-test:
    requests:
      cpu: "1"
      memory: 2Gi
tests:
- as: e2e
  skip_if_only_changed: .*pkg/rules/rulesets/.*|^\.github/|\.[mM][dD]$|^\.gitignore$|^\.govulncheck\.yaml$|^OWNERS$|^LICENSE$
  steps:
    cluster_profile: devsandboxci-aws
    env:
      BASE_DOMAIN: devsandboxci.devcluster.openshift.com
    test:
    - as: test
      cli: latest
      commands: |
        IMAGE_NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)
        KUBECONFIG="" oc registry login --to=/tmp/auth.json
        BUILD_REGISTRY=$(grep -Eo '([0-9A-Za-z]+\.)+\w+' /tmp/auth.json)
        oc create namespace ${IMAGE_NAMESPACE}
        oc create secret generic build-registry --from-file=/tmp/auth.json --type=kubernetes.io/podmanconfigjson -n openshift-config
        oc import-image pipeline:alertmanager-mock --from=${BUILD_REGISTRY}/${IMAGE_NAMESPACE}/pipeline:alertmanager-mock --confirm -n ${IMAGE_NAMESPACE}
        oc import-image pipeline:workload-analyzer --from=${BUILD_REGISTRY}/${IMAGE_NAMESPACE}/pipeline:workload-analyzer --confirm -n ${IMAGE_NAMESPACE}
        make test-e2e-in-ci IMAGE_NAMESPACE=${IMAGE_NAMESPACE}
      from: src
      resources:
        requests:
          cpu: "3"
          memory: 250Mi
    workflow: codeready-toolchain-aws
- as: e2e-vm
  capabilities:
  - nested-podman
  commands: |
    set -euo pipefail
    virtctl version --client
    secret_dir=/usr/local/vm-e2e-secrets
    for key in ssh-privatekey test-kubeconfig controller-kubeconfig; do
      test -f "${secret_dir}/${key}" || { echo "missing secret file ${secret_dir}/${key}"; exit 1; }
    done
    umask 077
    cp -L "${secret_dir}/ssh-privatekey" /tmp/vm-test-ssh-key
    cp -L "${secret_dir}/test-kubeconfig" /tmp/vm-test-kubeconfig
    cp -L "${secret_dir}/controller-kubeconfig" /tmp/vm-controller-kubeconfig
    chmod 600 /tmp/vm-test-ssh-key /tmp/vm-test-kubeconfig /tmp/vm-controller-kubeconfig
    export VM_TEST_VIRTCTL_PATH=/usr/local/bin/virtctl
    export VM_TEST_SSH_KEY_PATH=/tmp/vm-test-ssh-key
    export VM_TEST_KUBECONFIG_PATH=/tmp/vm-test-kubeconfig
    export VM_CONTROLLER_KUBECONFIG_PATH=/tmp/vm-controller-kubeconfig
    export VM_TEST_NAMESPACE=devsandbox-wa-test-u-dev
    make test-e2e-vm
  container:
    from: e2e-vm-test
  max_concurrency: 1
  nested_podman: true
  secrets:
  - collection: cluster-secrets-devsandboxci-aws
    group: devsandboxci-aws
    mount_path: /usr/local/vm-e2e-secrets
  skip_if_only_changed: .*pkg/rules/rulesets/.*|^\.github/|\.[mM][dD]$|^\.gitignore$|^\.govulncheck\.yaml$|^OWNERS$|^LICENSE$
  timeout: 1h0m0s
zz_generated_metadata:
  branch: master
  org: codeready-toolchain
  repo: workload-analyzer
