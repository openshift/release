base_images:
  cli:
    name: "4.14"
    namespace: ocp
    tag: cli
build_root:
  image_stream_tag:
    name: maistra-builder
    namespace: ci
    tag: "2.4"
releases:
  latest:
    release:
      channel: fast
      version: "4.14"
resources:
  '*':
    limits:
      memory: 16Gi
    requests:
      cpu: "2"
      memory: 4Gi
tests:
- as: lint
  commands: |
    make lint
  container:
    from: src
- as: sync-upstream-envoy-2.3
  commands: |
    ./tools/automator-main.sh \
    --org=maistra \
    --repo=envoy \
    --branch=maistra-2.3 \
    --token-path=/creds-github/token \
    '--title=Automator: merge upstream changes to $AUTOMATOR_ORG/$AUTOMATOR_REPO@$AUTOMATOR_BRANCH' \
    "--labels=tide/merge-method-merge" \
    --modifier=merge_upstream_envoy_2_3 \
    --merge-repository=https://github.com/envoyproxy/envoy \
    --merge-branch=release/v1.22 \
    --merge-failure-notify=@maistra/envoy \
    --merge-strategy=merge
  container:
    from: src
  cron: 00 05 * * 1-5
  reporter_config:
    channel: '#istio-notifications'
    job_states_to_report:
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :slack-green: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :failed:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  secrets:
  - collection: openshift-service-mesh
    group: github-ossm-bot-simple-job
    mount_path: /creds-github
- as: sync-upstream-envoy-2.4
  commands: |
    ./tools/automator-main.sh \
    --org=maistra \
    --repo=envoy \
    --branch=maistra-2.4 \
    --token-path=/creds-github/token \
    '--title=Automator: merge upstream changes to $AUTOMATOR_ORG/$AUTOMATOR_REPO@$AUTOMATOR_BRANCH' \
    "--labels=tide/merge-method-merge" \
    --modifier=merge_upstream_envoy_2_4 \
    --merge-repository=https://github.com/envoyproxy/envoy \
    --merge-branch=release/v1.24 \
    --merge-failure-notify=@maistra/envoy \
    --merge-strategy=merge
  container:
    from: src
  cron: 00 05 * * 1-5
  reporter_config:
    channel: '#istio-notifications'
    job_states_to_report:
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :slack-green: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :failed:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  secrets:
  - collection: openshift-service-mesh
    group: github-ossm-bot-simple-job
    mount_path: /creds-github
- as: sync-upstream-istio-2.4
  commands: |
    ./tools/automator-main.sh \
    --org=maistra \
    --repo=istio \
    --branch=maistra-2.4 \
    --token-path=/creds-github/token \
    '--title=Automator: merge upstream changes to $AUTOMATOR_ORG/$AUTOMATOR_REPO@$AUTOMATOR_BRANCH' \
    "--labels=tide/merge-method-merge" \
    --modifier=merge_upstream_istio_1_16 \
    --merge-repository=https://github.com/istio/istio \
    --merge-branch=release-1.16 \
    --merge-failure-notify=@maistra/release-managers-2-4 \
    --merge-strategy=merge \
    --fetch-tags
  container:
    from: src
  cron: 00 05 * * 1-5
  reporter_config:
    channel: '#istio-notifications'
    job_states_to_report:
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :slack-green: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :failed:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  secrets:
  - collection: openshift-service-mesh
    group: github-ossm-bot-simple-job
    mount_path: /creds-github
- as: update-istio-builder-image
  commands: |
    export NEW_IMAGE_MASTER=$(curl -sL https://raw.githubusercontent.com/istio/common-files/master/files/common/scripts/setup_env.sh | grep IMAGE_VERSION= | cut -d= -f2)
    export NEW_IMAGE_1_30=$(curl -sL https://raw.githubusercontent.com/istio/common-files/release-1.30/files/common/scripts/setup_env.sh | grep IMAGE_VERSION= | cut -d= -f2)
    export NEW_IMAGE_1_31=$(curl -sL https://raw.githubusercontent.com/istio/common-files/release-1.31/files/common/scripts/setup_env.sh | grep IMAGE_VERSION= | cut -d= -f2)
    ./tools/automator-main.sh \
    --org=openshift \
    --repo=release \
    --branch=main \
    --token-path=/creds-github/token \
    '--title=Update maistra/istio builder image' \
    --modifier=update_istio_builder_image_master \
    '--cmd=sed -i -e "s|\(registry.istio.io/testing/build-tools\):master.*|\1:$NEW_IMAGE_MASTER|" -e "s|\(gcr.io/istio-testing/build-tools\):release-1\.30.*|\1:$NEW_IMAGE_1_30|" -e "s|\(registry.istio.io/testing/build-tools\):release-1\.31.*|\1:$NEW_IMAGE_1_31|" core-services/image-mirroring/_config.yaml ci-operator/config/openshift-service-mesh/sail-operator/* ci-operator/config/openshift-service-mesh/istio/*' \
    '--body=cc @FilipB'
  container:
    from: src
  cron: 00 05 * * 1-5
  secrets:
  - collection: openshift-service-mesh
    group: github-ossm-bot-simple-job
    mount_path: /creds-github
zz_generated_metadata:
  branch: main
  org: maistra
  repo: test-infra
