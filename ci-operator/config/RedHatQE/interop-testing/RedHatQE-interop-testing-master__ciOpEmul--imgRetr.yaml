base_images:
  cli:
    name: "4.22"
    namespace: ocp
    tag: cli
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: img-retr
  steps:
    test:
    - as: ci-op-emul--step--0
      commands: |-
        shopt -op; shopt -p; printenv; set -x
        set +eu -o pipefail; shopt -s inherit_errexit
        true
      from: cli
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 24h0m0s
  timeout: 24h0m0s
zz_generated_metadata:
  branch: master
  org: RedHatQE
  repo: interop-testing
  variant: ciOpEmul--imgRetr
