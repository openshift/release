base_images:
  cli:
    name: "4.21"
    namespace: ocp
    tag: cli
  eco-gotests:
    name: eco-gotests
    namespace: rh-ecosystem-edge
    tag: eco-gotests
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.23-openshift-4.20
releases:
  latest:
    prerelease:
      product: ocp
      version_bounds:
        lower: 4.21.0-rc.0
        upper: 4.21.0-rc.20
resources:
  '*':
    requests:
      cpu: 200m
      memory: 400Mi
tests:
- as: telco-mount-ns
  cron: 0 23 31 2 *
  steps:
    cluster_profile: aws-cspi-qe
    env:
      BASE_DOMAIN: cspilp.interop.ccitredhat.com
      COMPUTE_NODE_REPLICAS: "3"
      COMPUTE_NODE_TYPE: m6a.4xlarge
      CONTROL_PLANE_INSTANCE_TYPE: m6a.2xlarge
      FIREWATCH_CONFIG: |
        {
          "failure_rules":
            [
              {"step": "cucushift-*", "failure_type": "all", "classification": "Cluster Health Check", "group": { "name" : "cluster" , "priority" : 2}, "jira_additional_labels": ["!default"]},
              {"step": "p2p-install-odf-hub", "failure_type": "all", "classification": "ODF StorageCluster Deployment", "group": { "name" : "cluster" , "priority" : 2}, "jira_additional_labels": ["!default"]},
              {"step": "p2p-telco-mount-ns", "failure_type": "all", "classification": "eco-gotests mount-ns", "group": { "name" : "lp-tests", "priority" : 3}, "jira_additional_labels": ["!default", "interop-tests"]}
            ]
        }
      FIREWATCH_CONFIG_FILE_PATH: https://raw.githubusercontent.com/CSPI-QE/cspi-utils/main/firewatch-base-configs/aws-ipi/lp-interop.json
      FIREWATCH_DEFAULT_JIRA_ADDITIONAL_LABELS: '["4.21-p2p","ipi-aws-p2p","telco-mount-ns"]'
      FIREWATCH_DEFAULT_JIRA_ASSIGNEE: vshakya@redhat.com
      FIREWATCH_DEFAULT_JIRA_COMPONENT: '["QA","mpiit_p2p"]'
      FIREWATCH_DEFAULT_JIRA_EPIC: INTEROP-8652
      FIREWATCH_DEFAULT_JIRA_PROJECT: LPINTEROP
      FIREWATCH_FAIL_WITH_TEST_FAILURES: "true"
      ODF_OPERATOR_CHANNEL: stable-4.21
      USER_TAGS: |
        scenario telco-mount-ns
    leases:
    - count: 1
      env: LEASED_RESOURCE
      resource_type: aws-cspi-qe-quota-slice
    post:
    - ref: gather-aws-console
    - chain: ipi-deprovision
    - ref: firewatch-report-issues
    pre:
    - ref: ipi-conf
    - ref: ipi-conf-telemetry
    - ref: ipi-conf-aws-custom-az
    - ref: ipi-conf-aws
    - chain: ipi-install
    test:
    - chain: cucushift-installer-check-cluster-health
    - ref: p2p-install-odf-hub
    - ref: p2p-telco-mount-ns
  timeout: 10h0m0s
zz_generated_metadata:
  branch: master
  org: RedHatQE
  repo: interop-testing
  variant: acm-cnv-ocp-4.21-p2p-telco-tests
