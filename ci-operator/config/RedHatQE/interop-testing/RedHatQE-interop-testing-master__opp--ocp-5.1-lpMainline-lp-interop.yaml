base_images:
  clc-ui-e2e:
    name: "2.17"
    namespace: acm-qe
    tag: clc-ui-e2e
  cli:
    name: "5.1"
    namespace: ocp
    tag: cli
  fetch-managed-clusters:
    name: autotest
    namespace: acm-qe
    tag: fetch-managed-clusters
  multicluster-observability-operator-opp:
    name: "2.17"
    namespace: acm-qe
    tag: multicluster-observability-operator-opp
  ocs-ci-tests:
    name: ocs-ci-container
    namespace: ci
    tag: stable
  upi-installer:
    name: "5.1"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-5.0
images:
  items:
  - dockerfile_literal: |
      FROM this-is-ignored
      RUN dnf install -y git python39 jq
    from: cli
    optional: true
    to: cli-with-git
  - dockerfile_literal: |
      FROM this-is-ignored
      RUN dnf install -y skopeo && dnf clean all
    from: cli
    optional: true
    to: cli-with-skopeo
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.1"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: cr--full-stack--aws
  capabilities:
  - intranet
  cron: 0 23 31 2 *
  reporter_config:
    channel: '#opp-discussion'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :slack-green: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :failed:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: aws-cspi-qe
    env:
      BASE_DOMAIN: cspilp.interop.ccitredhat.com
      COMPUTE_NODE_REPLICAS: "6"
      COMPUTE_NODE_TYPE: m6a.2xlarge
      CONTROL_PLANE_INSTANCE_TYPE: m6a.2xlarge
      DR__RP__CR_COMP_NAME: lp-interop--OPP
      FIREWATCH_CONFIG_FILE_PATH: https://raw.githubusercontent.com/CSPI-QE/cspi-utils/refs/heads/main/firewatch-base-configs/opp/lp-interop-aws.json
      FIREWATCH_DEFAULT_JIRA_ADDITIONAL_LABELS: '["5.1-lp","opp-aws-lp","opp-lp"]'
      FIREWATCH_DEFAULT_JIRA_ASSIGNEE: mpruitt@redhat.com
      FIREWATCH_DEFAULT_JIRA_EPIC: INTEROP-9181
      FIREWATCH_DEFAULT_JIRA_PROJECT: LPINTEROP
      FIREWATCH_FAIL_WITH_TEST_FAILURES: "true"
      MAP_TESTS: "true"
      ODF_VERSION_MAJOR_MINOR: "5.1"
      OPERATORS: |
        [
          {"name": "advanced-cluster-management", "source": "redhat-operators", "channel": "release-2.17", "install_namespace": "ocm", "target_namespaces": "ocm", "operator_group": "acm-operator-group"}
        ]
      SKIP_POLICIES: policy-acs,policy-acs-central-ca-bundle,policy-acs-central-status,policy-acs-monitor-certs,policy-acs-operator-central,policy-acs-sync-resources,policy-advanced-managed-cluster-security,policy-advanced-managed-cluster-status,policy-compliance-operator-install,policy-config-quay,policy-hub-quay-bridge,policy-install-quay,policy-observability-operator,policy-observability-storage,policy-observability-storage-status,policy-odf,policy-odf-cluster,policy-odf-noobaa,policy-odf-status,policy-quay-bridge,policy-quay-status
      ZONES_COUNT: "3"
    post:
    - ref: acm-fetch-operator-versions
    - ref: acm-must-gather
    - ref: acm-inspector
    - ref: acm-tests-clc-destroy
    - ref: gather-aws-console
    - chain: ipi-deprovision
    - ref: mpiit-data-router-reporter
    - ref: firewatch-report-issues
    pre:
    - ref: ipi-conf
    - ref: ipi-conf-telemetry
    - ref: ipi-conf-aws-custom-az
    - ref: ipi-conf-aws
    - ref: ipi-install-monitoringpvc
    - chain: ipi-install
    test:
    - ref: install-operators
    - ref: acm-mch
    - ref: acm-policies-openshift-plus-setup
    - ref: acm-policies-openshift-plus
    - chain: cucushift-installer-check-cluster-health
    - ref: interop-opp-wait-mcp
    - ref: stackrox-opp-readiness
      best_effort: true
    - ref: stackrox-opp-smoke
    - ref: acm-tests-clc-smoke
    - ref: acm-fetch-managed-clusters
    - ref: acm-opp-app
    - ref: interop-opp-odf-health
      best_effort: true
    - ref: interop-opp-observability-odf
    - ref: interop-tests-ocs-tests
    - ref: interop-tests-opp-quay-smoke
    - ref: acm-tests-observability
- as: cr--full-stack--vsphere
  capabilities:
  - intranet
  cron: 0 23 31 2 *
  reporter_config:
    channel: '#opp-discussion'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :slack-green: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :failed:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: vsphere-connected-2
    env:
      COMPUTE_NODE_REPLICAS: "6"
      DISABLE_ENVIRONMENT_CHECKER: "true"
      DR__RP__CR_COMP_NAME: lp-interop--OPP
      FIREWATCH_CONFIG_FILE_PATH: https://raw.githubusercontent.com/CSPI-QE/cspi-utils/refs/heads/main/firewatch-base-configs/opp/lp-interop-vsphere.json
      FIREWATCH_DEFAULT_JIRA_ADDITIONAL_LABELS: '["5.1-lp","opp-vsphere-lp","opp-lp"]'
      FIREWATCH_DEFAULT_JIRA_ASSIGNEE: mpruitt@redhat.com
      FIREWATCH_DEFAULT_JIRA_EPIC: INTEROP-9181
      FIREWATCH_DEFAULT_JIRA_PROJECT: LPINTEROP
      FIREWATCH_FAIL_WITH_TEST_FAILURES: "true"
      MAP_TESTS: "true"
      ODF_VERSION_MAJOR_MINOR: "5.1"
      OPENSHIFT_REQUIRED_CORES: "72"
      OPENSHIFT_REQUIRED_MEMORY: "288"
      OPERATORS: |
        [
          {"name": "advanced-cluster-management", "source": "redhat-operators", "channel": "release-2.17", "install_namespace": "ocm", "target_namespaces": "ocm", "operator_group": "acm-operator-group"}
        ]
      RESOURCE_BIND_TIMEOUT: "180"
      SIZE_VARIANT: large
      SKIP_POLICIES: policy-acs,policy-acs-central-ca-bundle,policy-acs-central-status,policy-acs-monitor-certs,policy-acs-operator-central,policy-acs-sync-resources,policy-advanced-managed-cluster-security,policy-advanced-managed-cluster-status,policy-compliance-operator-install,policy-config-quay,policy-hub-quay-bridge,policy-install-quay,policy-observability-operator,policy-observability-storage,policy-observability-storage-status,policy-odf,policy-odf-cluster,policy-odf-noobaa,policy-odf-status,policy-quay-bridge,policy-quay-status
    post:
    - ref: acm-fetch-operator-versions
    - ref: acm-must-gather
    - ref: mce-must-gather
    - chain: ipi-vsphere-post
    - ref: mpiit-data-router-reporter
    - ref: firewatch-report-issues
    pre:
    - chain: ipi-vsphere-pre
    - ref: interop-opp-disk-diag
    - ref: interop-opp-kubelet-config
    - ref: interop-opp-wait-for-api
    test:
    - ref: install-operators
    - ref: acm-mch
    - ref: acm-policies-openshift-plus-setup
    - ref: acm-policies-openshift-plus
    - chain: cucushift-installer-check-cluster-health
    - ref: interop-opp-wait-mcp
    - ref: interop-opp-odf-health
      best_effort: true
    - ref: interop-opp-observability-odf
    - ref: interop-tests-ocs-tests
    - ref: acm-tests-observability
    - ref: acm-opp-app
    workflow: acm-ipi-vsphere
zz_generated_metadata:
  branch: master
  org: RedHatQE
  repo: interop-testing
  variant: opp--ocp-5.1-lpMainline-lp-interop
