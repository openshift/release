base_images:
  ubi-minimal:
    name: ubi-minimal
    namespace: ocp
    tag: "9"
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: golang-1.22
images:
  items:
  - context_dir: bsod-detector
    dockerfile_path: Dockerfile
    to: bsod-detector
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.23"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: bsod-self-test
  steps:
    cluster_profile: aws-interop-qe
    env:
      BSOD_MODE: self-test
      BUGCHECK_CODE: "0x19"
      BUGCHECK_PARAMS: 0x3 0x0 0x0 0x0
    post:
    - ref: bsod-detector-post-mortem
    test:
    - ref: bsod-detector-self-test
zz_generated_metadata:
  branch: master
  org: RedHatQE
  repo: interop-testing
  variant: bsod
