build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.ci.openshift.org/ocp/ubi-python-311:9
      # ubi-python-311 defaults to a non-root user; clonerefs (which seeds
      # pipeline:src) must run as root to create /go. Same as sibling
      # lightspeed-core/lightspeed-stack.
      USER 0
images:
  items:
  - dockerfile_path: Dockerfile
    to: insights-on-prem
  - dockerfile_path: tests-image/Dockerfile
    to: insights-on-prem-tests
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: test-e2e
  optional: true
  skip_if_only_changed: ^docs/|^\.tekton/|^\.github/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
  steps:
    dependencies:
      COMPONENT_IMAGE_REF: src
    env:
      ACM_RELEASE_VERSION: release-2.17
      CLUSTERPOOL_GROUP_NAME: Core-Services
      CLUSTERPOOL_HOST_NAMESPACE: acm-observability-usa
      CLUSTERPOOL_HOST_PROW_KUBE_SECRET: ocm-obs-usa-clusterpool
      CLUSTERPOOL_HUB_FILTER: sno-4xlarge-422
      CLUSTERPOOL_LIFETIME: 2h
      CLUSTERPOOL_LIST_INCLUSION_FILTER: "422"
      CLUSTERPOOL_MANAGED_COUNT: "1"
      CLUSTERPOOL_MANAGED_FILTER: sno-422
      PIPELINE_STAGE: dev
      SKIP_COMPONENT_INSTALL: "true"
    test:
    - as: e2e
      commands: |
        set -eo pipefail

        # ACM is already deployed on the hub by the ocm-e2e-clusterpool
        # cluster-deploy step. hub-1.kc and managed-1.kc are the checked-out
        # cluster kubeconfigs.
        export KUBECONFIG="${SHARED_DIR}/hub-1.kc"

        # oc is baked into the insights-on-prem-tests image (see tests-image/Dockerfile).
        echo "IOP_IMAGE_REF=${IOP_IMAGE_REF}"

        # 1. Import the managed (spoke) cluster into ACM.
        oc create namespace managed --dry-run=client -o yaml | oc apply -f -
        cat <<EOF | oc apply -f -
        apiVersion: cluster.open-cluster-management.io/v1
        kind: ManagedCluster
        metadata:
          name: managed
          labels:
            cloud: auto-detect
            vendor: auto-detect
        spec:
          hubAcceptsClient: true
        EOF
        oc create secret generic auto-import-secret \
          -n managed \
          --from-file=kubeconfig="${SHARED_DIR}/managed-1.kc" \
          --dry-run=client -o yaml | oc apply -f -
        oc wait managedcluster managed \
          --for=condition=ManagedClusterConditionAvailable=True \
          --timeout=600s

        # 2. Deploy IoP to the hub, addon + policies to the spoke.
        #    TODO: wire the numbered deploy manifests in deploy/ here (01-namespace
        #    .. 14-hub-config), substituting the PR-built image (IOP_IMAGE_REF)
        #    into 08-insights.yml. e.g. a `make deploy` target or `oc apply -f`.
        #
        # 3. Run the e2e suite.
        #    TODO: tests/e2e/ does not exist yet. Once written:
        #      python -m pytest tests/e2e -v 2>&1 | tee "${ARTIFACT_DIR}/e2e.log"
        echo "TODO: deploy IoP + addon and run tests/e2e once implemented"
      dependencies:
      - env: IOP_IMAGE_REF
        name: insights-on-prem
      from: insights-on-prem-tests
      resources:
        requests:
          cpu: 100m
          memory: 500Mi
    workflow: ocm-e2e-clusterpool
zz_generated_metadata:
  branch: main
  org: RedHatInsights
  repo: lightspeed-advisor-on-premise-ocp
