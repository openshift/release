build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.access.redhat.com/ubi9/nodejs-24:latest
      USER root
      RUN mkdir -p /go/src && chmod -R 777 /go
      USER 1001
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: npm ci
tests:
- as: lint
  commands: npm run lint-prettier
  container:
    from: test-bin
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE|\.github/.*)$
- as: unit
  commands: npm run test -- --maxWorkers=2 --workerIdleMemoryLimit=512MB
  container:
    from: test-bin
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE|\.github/.*)$
- as: circular-dependencies
  commands: npm run find-circular-dependencies
  container:
    from: test-bin
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE|\.github/.*)$
zz_generated_metadata:
  branch: main
  org: RedHatInsights
  repo: uhc-portal
