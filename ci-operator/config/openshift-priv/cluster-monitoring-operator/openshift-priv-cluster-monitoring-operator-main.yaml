base_images:
  hypershift-operator:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/cluster-monitoring-operator
images:
  items:
  - dockerfile_path: Dockerfile
    to: cluster-monitoring-operator
  - dockerfile_literal: |
      FROM src
    from: src
    to: cluster-monitoring-operator-src
promotion:
  to:
  - name: "5.1"
    namespace: ocp-priv
prowgen:
  private: true
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp-priv
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp-priv
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: misspell
  commands: make misspell --always-make && git diff --exit-code
  container:
    from: src
- as: generate
  commands: make generate --always-make && git diff --exit-code
  container:
    from: src
- as: jsonnet-fmt
  commands: make jsonnet-fmt --always-make && git diff --exit-code
  container:
    from: src
- as: go-fmt
  commands: make go-fmt && git diff --exit-code
  container:
    from: src
- as: rules
  commands: make test-rules
  container:
    from: src
- as: vendor
  commands: make vendor && git diff --exit-code
  container:
    from: src
- as: verify
  commands: make verify
  container:
    from: src
- as: versions
  commands: make check-versions
  container:
    from: src
  optional: true
- as: shellcheck
  commands: make shellcheck
  container:
    from: src
- as: unit
  commands: make test-unit
  container:
    from: src
- as: golangci-lint
  commands: |
    export GOCACHE=/tmp/
    export GOLANGCI_LINT_CACHE=/tmp/.cache
    make golangci-lint
  container:
    from: src
- always_run: false
  as: e2e-aws-ovn
  pipeline_skip_if_only_changed: ^(Documentation/|\.github/|examples/|hack/|test/)|(\.md$)|((^|/)OWNERS(_ALIASES)?$)|(^\.gitignore$)|(^\.golangci\.yaml$)|(^\.yamllint$)|(^\.coderabbit\.yaml$)|(^\.dockerignore$)|(^LICENSE$)|(^DCO$)
  steps:
    cluster_profile: openshift-org-aws
    env:
      TELEMETRY_ENABLED: "true"
    workflow: openshift-e2e-aws
- always_run: false
  as: e2e-aws-ovn-techpreview
  pipeline_skip_if_only_changed: ^(Documentation/|\.github/|examples/|hack/|test/)|(\.md$)|((^|/)OWNERS(_ALIASES)?$)|(^\.gitignore$)|(^\.golangci\.yaml$)|(^\.yamllint$)|(^\.coderabbit\.yaml$)|(^\.dockerignore$)|(^LICENSE$)|(^DCO$)
  steps:
    cluster_profile: openshift-org-aws
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      TELEMETRY_ENABLED: "true"
    workflow: openshift-e2e-aws
- always_run: false
  as: e2e-aws-ovn-single-node
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    env:
      TELEMETRY_ENABLED: "true"
    workflow: openshift-e2e-aws-single-node
- always_run: false
  as: e2e-agnostic-operator
  pipeline_skip_if_only_changed: ^(Documentation/|\.github/|examples/|hack/|test/ext/|test/monitoring/|test/rules/)|(\.md$)|((^|/)OWNERS(_ALIASES)?$)|(^\.gitignore$)|(^\.golangci\.yaml$)|(^\.yamllint$)|(^\.coderabbit\.yaml$)|(^\.dockerignore$)|(^LICENSE$)|(^DCO$)
  steps:
    cluster_profile: openshift-org-aws
    env:
      TELEMETRY_ENABLED: "true"
    test:
    - as: test
      cli: latest
      commands: make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-aws
- always_run: false
  as: ginkgo-tests
  pipeline_skip_if_only_changed: ^(Documentation/|\.github/|examples/|hack/|test/e2e/|test/ext/|test/rules/)|(\.md$)|((^|/)OWNERS(_ALIASES)?$)|(^\.gitignore$)|(^\.golangci\.yaml$)|(^\.yamllint$)|(^\.coderabbit\.yaml$)|(^\.dockerignore$)|(^LICENSE$)|(^DCO$)
  steps:
    cluster_profile: openshift-org-aws
    env:
      TELEMETRY_ENABLED: "true"
    test:
    - as: test
      cli: latest
      commands: make test-ginkgo
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-aws
- always_run: false
  as: e2e-aws-ovn-upgrade
  pipeline_skip_if_only_changed: ^(Documentation/|\.github/|examples/|hack/|test/)|(\.md$)|((^|/)OWNERS(_ALIASES)?$)|(^\.gitignore$)|(^\.golangci\.yaml$)|(^\.yamllint$)|(^\.coderabbit\.yaml$)|(^\.dockerignore$)|(^LICENSE$)|(^DCO$)
  steps:
    cluster_profile: openshift-org-aws
    env:
      TELEMETRY_ENABLED: "true"
    workflow: openshift-upgrade-aws
- always_run: false
  as: e2e-hypershift-conformance
  pipeline_skip_if_only_changed: ^(Documentation/|\.github/|examples/|hack/|test/)|(\.md$)|((^|/)OWNERS(_ALIASES)?$)|(^\.gitignore$)|(^\.golangci\.yaml$)|(^\.yamllint$)|(^\.coderabbit\.yaml$)|(^\.dockerignore$)|(^LICENSE$)|(^DCO$)
  steps:
    cluster_profile: hypershift-aws
    workflow: hypershift-aws-conformance
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
zz_generated_metadata:
  branch: main
  org: openshift-priv
  repo: cluster-monitoring-operator
