build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/Azure-karpenter-provider-azure
images:
  items:
  - dockerfile_path: openshift/Containerfile.rhel
    to: azure-karpenter-provider-azure
promotion:
  to:
  - name: "5.1"
    namespace: ocp-priv
prowgen:
  private: true
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp-priv
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp-priv
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
zz_generated_metadata:
  branch: main
  org: openshift-priv
  repo: Azure-karpenter-provider-azure
