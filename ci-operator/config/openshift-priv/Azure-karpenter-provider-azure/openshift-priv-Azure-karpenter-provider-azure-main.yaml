base_images:
  hypershift-operator:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
  hypershift-tests:
    name: hypershift-tests
    namespace: hypershift
    tag: latest
binary_build_commands: make openshift-toolchain
build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/Azure-karpenter-provider-azure
images:
  items:
  - dockerfile_path: openshift/Containerfile.rhel
    to: azure-karpenter-provider-azure
promotion:
  to:
  - name: "5.1"
    namespace: ocp-priv
prowgen:
  private: true
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp-priv
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp-priv
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
- as: verify
  commands: GOLANGCI_LINT_CACHE=/tmp/.cache make openshift-verify KARPENTER_CORE_DIR=vendor/sigs.k8s.io/karpenter
  container:
    from: bin
- as: unit
  commands: make openshift-test
  container:
    from: bin
- always_run: false
  as: e2e-aks-hypershift
  optional: true
  pipeline_skip_if_only_changed: ^docs/|^\.github|\.md$|\.mdc$|^(?:.*/)?(?:\.gitignore|\.coderabbit\.yaml|OWNERS|OWNERS_ALIASES|PROJECT|LICENSE)$
  steps:
    cluster_profile: hypershift-aks
    env:
      AUTH_THROUGH_CERTS: "true"
      CI_TESTS_RUN: ^TestKarpenter
      ENABLE_HYPERSHIFT_CERT_ROTATION_SCALE: "true"
      ENABLE_STANDALONE_KARPENTER_OPERATOR: "true"
      HYPERSHIFT_AZURE_KARPENTER_IDENTITY: "true"
      HYPERSHIFT_AZURE_LOCATION: centralus
      HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_OFFER: ""
      HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_PUBLISHER: ""
      HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_SKU: ""
      HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_VERSION: ""
      TECH_PREVIEW_NO_UPGRADE: "true"
    workflow: hypershift-azure-aks-e2e
zz_generated_metadata:
  branch: main
  org: openshift-priv
  repo: Azure-karpenter-provider-azure
