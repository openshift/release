build_root:
  image_stream_tag:
    name: builder
    namespace: konveyor
    tag: ubi9-v1.26
canonical_go_repository: github.com/openshift/oadp-operator
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile
    to: oadp-operator-1.4
  - dockerfile_path: build/ci-Dockerfile
    to: test-oadp-operator
operator:
  bundles:
  - as: oadp-operator-bundle
    dockerfile_path: build/Dockerfile.bundle
    skip_building_index: true
promotion:
  to:
  - disabled: true
    excluded_images:
    - test-oadp-operator
    name: oadp-operator
    namespace: konveyor
  - additional_images:
      oadp-operator-bundle: oadp-operator-bundle
      oadp-operator-e2e-tests: test-oadp-operator
    disabled: true
    namespace: konveyor
    tag: oadp-1.4
prowgen:
  private: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 512Mi
tests:
- as: unit-test
  steps:
    test:
    - as: unit
      commands: make test
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
zz_generated_metadata:
  branch: oadp-1.4
  org: openshift-priv
  repo: oadp-operator
