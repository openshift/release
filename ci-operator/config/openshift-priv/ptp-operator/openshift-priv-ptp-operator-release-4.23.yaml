base_images:
  linuxptp-daemon:
    name: "4.23"
    namespace: ocp-priv
    tag: ptp
  must_gather:
    name: "4.23"
    namespace: ocp-priv
    tag: must-gather
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/ptp-operator
images:
  items:
  - dockerfile_path: Dockerfile.ocp
    to: ptp-operator
  - dockerfile_path: Dockerfile.ocp
    from: must_gather
    inputs:
      src:
        paths:
        - destination_dir: .
          source_path: /go/src/github.com/openshift/ptp-operator/must-gather/.
    to: ptp-operator-must-gather
operator:
  bundles:
  - as: ptp-operator-bundle
    dockerfile_path: bundleci.Dockerfile
  substitutions:
  - pullspec: quay.io/openshift/origin-ptp-operator:.*
    with: pipeline:ptp-operator
  - pullspec: quay.io/openshift/origin-ptp:.*
    with: pipeline:linuxptp-daemon
promotion:
  to:
  - disabled: true
    name: ptp-4.23
    namespace: origin
  - name: "4.23"
    namespace: ocp-priv
prowgen:
  private: true
releases:
  initial:
    integration:
      name: "4.23"
      namespace: ocp-priv
  latest:
    integration:
      include_built_images: true
      name: "4.23"
      namespace: ocp-priv
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: gofmt
  commands: make fmt
  container:
    from: src
- as: govet
  commands: make vet
  container:
    from: src
- as: bundle-check
  commands: |
    unset VERSION
    make bundle-check
  container:
    from: src
- as: e2e-aws-ovn
  steps:
    cluster_profile: openshift-org-aws
    workflow: openshift-e2e-aws
- as: operator-e2e
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_INDEX: ci-index-ptp-operator-bundle
    env:
      OO_CHANNEL: alpha
      OO_INSTALL_NAMESPACE: openshift-ptp
      OO_PACKAGE: ptp-operator
      OO_TARGET_NAMESPACES: '!install'
    test:
    - as: e2e
      commands: make test-validation-only
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: optional-operators-ci-aws
- always_run: false
  as: tls-scan
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_INDEX: ci-index-ptp-operator-bundle
    env:
      OO_CHANNEL: alpha
      OO_INSTALL_NAMESPACE: openshift-ptp
      OO_PACKAGE: ptp-operator
      OO_TARGET_NAMESPACES: '!install'
      PQC_CHECK: "true"
      SCAN_NAMESPACE: openshift-ptp
      SCANNER_CPU: "2"
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - ref: tls-13
    - as: wait-ptp-tls-restart
      cli: latest
      commands: |
        echo "Waiting for PTP operator to restart after TLS profile change..."
        oc rollout status deployment ptp-operator -n openshift-ptp --timeout=300s
        oc rollout status daemonset linuxptp-daemon -n openshift-ptp --timeout=400s
        echo "PTP operator and daemon restarted with new TLS profile"
        oc get pods -n openshift-ptp
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: tls-scanner-run
    workflow: optional-operators-ci-aws
- as: e2e-telco5g-ptp
  capabilities:
  - intranet
  restrict_network_access: false
  steps:
    dependencies:
      OO_INDEX: ci-index-ptp-operator-bundle
    env:
      OO_CHANNEL: alpha
      OO_INSTALL_NAMESPACE: openshift-ptp
      OO_PACKAGE: ptp-operator
      OO_TARGET_NAMESPACES: '!install'
      T5CI_JOB_TYPE: ptp
      T5CI_PTP_SKIP_DEPLOY: "true"
      T5CI_VERSION: "4.23"
    test:
    - ref: ipi-install-rbac
    - ref: optional-operators-subscribe
    - ref: telco5g-ptp-tests
    workflow: telco5g-ptp
- as: security
  optional: true
  skip_if_only_changed: ^test/|^hack/|^scripts/|^bin/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
  steps:
    env:
      PROJECT_NAME: ptp-operator
      SNYK_CODE_ADDITIONAL_ARGS: --severity-threshold=high --policy-path=.snyk
    workflow: openshift-ci-security
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
zz_generated_metadata:
  branch: release-4.23
  org: openshift-priv
  repo: ptp-operator
