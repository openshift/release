build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/monitoring-plugin
images:
  items:
  - dockerfile_path: Dockerfile
    to: monitoring-plugin
  - dockerfile_path: Dockerfile.mcp
    to: monitoring-console-plugin
  - dockerfile_path: Dockerfile.test
    to: monitoring-plugin-test
  - context_dir: .
    dockerfile_path: web/cypress/Dockerfile
    to: monitoring-ui-tests-runner
prowgen:
  enable_secrets_store_csi_driver: true
  private: true
releases:
  initial:
    integration:
      name: "4.21"
      namespace: ocp-priv
  latest:
    integration:
      include_built_images: true
      name: "4.21"
      namespace: ocp-priv
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 1000m
      memory: 8Gi
zz_generated_metadata:
  branch: release-4.21
  org: openshift-priv
  repo: monitoring-plugin
  variant: periodics
