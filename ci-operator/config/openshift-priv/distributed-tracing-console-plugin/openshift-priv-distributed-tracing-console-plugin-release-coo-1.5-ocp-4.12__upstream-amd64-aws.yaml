build_root:
  image_stream_tag:
    name: builder
    namespace: ocp-priv
    tag: rhel-9-golang-1.23-openshift-4.19
canonical_go_repository: github.com/openshift/distributed-tracing-console-plugin
images:
  items:
  - dockerfile_path: Dockerfile
    to: distributed-tracing-console-plugin
  - dockerfile_path: Dockerfile.test
    to: distributed-tracing-console-plugin-test
  - context_dir: .
    dockerfile_path: tests/Dockerfile
    to: obs-tests-runner
prowgen:
  private: true
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 1Gi
tests:
- as: lint
  commands: make lint-frontend
  container:
    from: distributed-tracing-console-plugin-test
- as: fips-image-scan
  steps:
    dependencies:
      SCAN_IMAGE: distributed-tracing-console-plugin
    test:
    - ref: fips-check-image-scan
- as: e2e
  commands: echo "test"
  container:
    from: distributed-tracing-console-plugin-test
zz_generated_metadata:
  branch: release-coo-1.5-ocp-4.12
  org: openshift-priv
  repo: distributed-tracing-console-plugin
  variant: upstream-amd64-aws
