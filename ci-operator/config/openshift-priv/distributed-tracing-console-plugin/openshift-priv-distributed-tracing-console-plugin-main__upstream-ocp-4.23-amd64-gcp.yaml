base_images:
  cli:
    name: "4.23"
    namespace: ocp-priv
    tag: cli
  operator-sdk:
    name: "4.23"
    namespace: origin
    tag: operator-sdk
  upi-installer:
    name: "4.23"
    namespace: ocp-priv
    tag: upi-installer
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp-priv
    tag: rhel-9-golang-1.24-openshift-4.22
canonical_go_repository: github.com/openshift/distributed-tracing-console-plugin
images:
  items:
  - dockerfile_path: Dockerfile
    to: distributed-tracing-console-plugin
  - dockerfile_path: Dockerfile.test
    to: distributed-tracing-console-plugin-test
  - context_dir: .
    dockerfile_path: tests/Dockerfile
    to: obs-tests-runner
prowgen:
  private: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.23"
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 1Gi
tests:
- as: lint
  commands: make lint-frontend
  container:
    from: distributed-tracing-console-plugin-test
- as: fips-image-scan
  steps:
    dependencies:
      SCAN_IMAGE: distributed-tracing-console-plugin
    test:
    - ref: fips-check-image-scan
- as: e2e
  steps:
    cluster_profile: gcp-observability
    test:
    - ref: distributed-tracing-tests-tracing-ui-upstream
    workflow: cucushift-installer-rehearse-gcp-ipi
zz_generated_metadata:
  branch: main
  org: openshift-priv
  repo: distributed-tracing-console-plugin
  variant: upstream-ocp-4.23-amd64-gcp
