build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.22
canonical_go_repository: github.com/quay/quay
images:
  items:
  - dockerfile_path: web/Containerfile.playwright
    to: quay-playwright-runner
prowgen:
  private: true
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: redhat-3.18
  org: openshift-priv
  repo: quay-quay
  variant: gcp-ocp422-e2e-install
