base_images:
  cli:
    name: "4.22"
    namespace: ocp-priv
    tag: cli
  operator-sdk:
    name: cli-operator-sdk
    namespace: ocp
    tag: v1.39.2
  playwright-base:
    name: playwright-base
    namespace: ci
    tag: latest
binary_build_commands: unset GOFLAGS && make manager
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp-priv
    tag: rhel-9-golang-1.26-openshift-5.0
canonical_go_repository: github.com/open-telemetry/opentelemetry-operator
images:
  items:
  - context_dir: .
    dockerfile_path: Dockerfile
    from: src
    inputs:
      bin:
        paths:
        - destination_dir: ./bin
          source_path: /go/src/github.com/open-telemetry/opentelemetry-operator/bin/manager_amd64
    to: opentelemetry-operator
  - dockerfile_literal: |
      FROM playwright-base
      COPY . /tmp/opentelemetry-operator
    from: playwright-base
    inputs:
      src:
        paths:
        - destination_dir: .
          source_path: /go/src/github.com/open-telemetry/opentelemetry-operator/.
    to: obs-tests-runner
operator:
  bundles:
  - as: opentelemetry-bundle
    context_dir: ./bundle/openshift
    dockerfile_path: bundle.Dockerfile
  substitutions:
  - pullspec: ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator:.*
    with: pipeline:opentelemetry-operator
prowgen:
  enable_secrets_store_csi_driver: true
  private: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: opentelemetry-ui-tests
  steps:
    cluster_profile: aws-observability
    env:
      AGENT_SKILL: otel-ui
      BASE_DOMAIN: devobscluster.devcluster.openshift.com
      JIRA_PROJECT: OOC
    post:
    - ref: openshift-observability-qe-agent
    - chain: cucushift-installer-rehearse-aws-ipi-deprovision
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace opentelemetry-operator-system
        oc label namespace opentelemetry-operator-system openshift.io/cluster-monitoring="true"
        cd /tmp && operator-sdk run bundle --timeout=5m --security-context-config restricted -n opentelemetry-operator-system "$OO_BUNDLE"
        oc wait --for condition=Available -n opentelemetry-operator-system deployment opentelemetry-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: opentelemetry-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 1000m
          memory: 400Mi
    - ref: distributed-tracing-tests-opentelemetry-ui-upstream
    workflow: cucushift-installer-rehearse-aws-ipi
zz_generated_metadata:
  branch: main
  org: openshift-priv
  repo: open-telemetry-opentelemetry-operator
  variant: upstream-ui-ocp-4.22-amd64
