base_images:
  cli:
    name: "4.22"
    namespace: ocp-priv
    tag: cli
  operator-sdk:
    name: cli-operator-sdk
    namespace: ocp
    tag: v1.39.2
binary_build_commands: unset GOFLAGS && make manager && make targetallocator && make
  operator-opamp-bridge
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp-priv
    tag: rhel-9-golang-1.26-openshift-5.0
canonical_go_repository: github.com/open-telemetry/opentelemetry-operator
images:
  items:
  - context_dir: .
    dockerfile_path: Dockerfile
    from: src
    inputs:
      bin:
        paths:
        - destination_dir: ./bin
          source_path: /go/src/github.com/open-telemetry/opentelemetry-operator/bin/manager_amd64
    to: opentelemetry-operator
  - context_dir: ./cmd/otel-allocator/
    dockerfile_path: Dockerfile
    from: src
    inputs:
      bin:
        paths:
        - destination_dir: ./bin
          source_path: /go/src/github.com/open-telemetry/opentelemetry-operator/cmd/otel-allocator/bin/targetallocator_amd64
    to: opentelemetry-target-allocator
  - context_dir: .
    dockerfile_path: ./tests/e2e-openshift/Dockerfile
    to: obs-tests-runner
  - context_dir: ./tests/test-e2e-apps/bridge-server
    dockerfile_path: Dockerfile
    to: opamp-bridge-server
  - context_dir: ./cmd/operator-opamp-bridge/
    dockerfile_path: Dockerfile
    from: src
    inputs:
      bin:
        paths:
        - destination_dir: ./bin
          source_path: /go/src/github.com/open-telemetry/opentelemetry-operator/cmd/operator-opamp-bridge/bin/opampbridge_amd64
    to: opentelemetry-opampbridge
  - build_args:
    - name: version
      value: 2.32.0
    context_dir: ./autoinstrumentation/java
    dockerfile_path: Dockerfile
    to: opentelemetry-instrumentation-java
  - context_dir: ./autoinstrumentation/nodejs
    dockerfile_path: Dockerfile
    to: opentelemetry-instrumentation-nodejs
  - context_dir: ./autoinstrumentation/python
    dockerfile_path: Dockerfile
    to: opentelemetry-instrumentation-python
  - build_args:
    - name: version
      value: 1.17.0
    context_dir: ./autoinstrumentation/dotnet
    dockerfile_path: Dockerfile
    to: opentelemetry-instrumentation-dotnet
  - build_args:
    - name: version
      value: 1.0.4
    context_dir: ./autoinstrumentation/apache-httpd
    dockerfile_path: Dockerfile
    to: opentelemetry-instrumentation-apache-httpd
operator:
  bundles:
  - as: opentelemetry-bundle
    context_dir: ./bundle/openshift
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: ghcr.io/open-telemetry/opentelemetry-operator/opentelemetry-operator:.*
    with: pipeline:opentelemetry-operator
prowgen:
  private: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-pre-merge
  cluster_claim:
    architecture: amd64
    cloud: aws
    labels:
      region: us-east-2
    owner: obs
    product: ocp
    timeout: 1h0m0s
    version: "4.22"
  steps:
    env:
      AGENT_SKILL: otel
      JIRA_PROJECT: TRACING
      RUN_TESTS: tests/e2e/smoke-collector/smoke-collector-deployment tests/e2e/smoke-collector/smoke-collector-daemonset
        tests/e2e/smoke-collector/smoke-collector-statefulset tests/e2e/smoke-collector/smoke-targetallocator
        tests/e2e/smoke-deletion tests/e2e/smoke-restarting-deployment tests/e2e/managed-reconcile
        tests/e2e/operator-restart tests/e2e/operator-metrics tests/e2e/conversion-webhook-invalid-config
        tests/e2e/prometheus-config-validation tests/e2e-crd-validations tests/e2e-pdb
        tests/e2e-autoscale tests/e2e-targetallocator/targetallocator-features tests/e2e-targetallocator/targetallocator-kubernetessd
        tests/e2e-instrumentation/instrumentation-python tests/e2e-instrumentation/instrumentation-java
        tests/e2e-openshift/route tests/e2e-openshift/networkpolicy tests/e2e-openshift/monitoring
        tests/e2e-openshift/scrape-in-cluster-monitoring tests/e2e-sidecar
    post:
    - ref: openshift-observability-qe-agent
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace opentelemetry-operator-system
        oc label namespace opentelemetry-operator-system openshift.io/cluster-monitoring="true"
        cd /tmp && operator-sdk run bundle --timeout=10m --security-context-config restricted -n opentelemetry-operator-system "$OO_BUNDLE"
        oc wait --for condition=Available --timeout=5m -n opentelemetry-operator-system deployment opentelemetry-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: opentelemetry-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 1000m
          memory: 400Mi
    - ref: distributed-tracing-tests-opentelemetry-upstream
    workflow: generic-claim
- always_run: false
