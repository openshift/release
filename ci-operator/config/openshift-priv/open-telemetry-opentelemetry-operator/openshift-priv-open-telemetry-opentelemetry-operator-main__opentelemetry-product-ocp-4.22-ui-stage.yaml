base_images:
  cli:
    name: "4.22"
    namespace: ocp-priv
    tag: cli
  playwright-base:
    name: playwright-base
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp-priv
    tag: rhel-9-golang-1.25-openshift-4.22
canonical_go_repository: github.com/open-telemetry/opentelemetry-operator
images:
  items:
  - dockerfile_literal: |
      FROM playwright-base
      COPY . /tmp/opentelemetry-operator
    from: playwright-base
    inputs:
      src:
        paths:
        - destination_dir: .
          source_path: /go/src/github.com/open-telemetry/opentelemetry-operator/.
    to: obs-tests-runner
prowgen:
  enable_secrets_store_csi_driver: true
  private: true
releases:
  latest:
    release:
      channel: stable
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: main
  org: openshift-priv
  repo: open-telemetry-opentelemetry-operator
  variant: opentelemetry-product-ocp-4.22-ui-stage
