base_images:
  cli:
    name: "4.14"
    namespace: ocp-priv
    tag: cli
  operator-sdk:
    name: cli-operator-sdk
    namespace: ocp
    tag: v1.39.2
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp-priv
    tag: rhel-9-golang-1.25-openshift-4.22
canonical_go_repository: github.com/open-telemetry/opentelemetry-operator
images:
  items:
  - context_dir: .
    dockerfile_path: ./tests/e2e-openshift/Dockerfile
    to: obs-tests-runner
prowgen:
  enable_secrets_store_csi_driver: true
  private: true
releases:
  arm64-latest:
    release:
      architecture: arm64
      channel: stable
      version: "4.14"
  latest:
    release:
      architecture: amd64
      channel: stable
      version: "4.14"
  target:
    release:
      architecture: multi
      channel: stable
      version: "4.14"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: main
  org: openshift-priv
  repo: open-telemetry-opentelemetry-operator
  variant: opentelemetry-product-ocp-4.14-arm-stage
