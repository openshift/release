build_root:
  image_stream_tag:
    name: builder
    namespace: ocp-priv
    tag: rhel-9-golang-1.26-openshift-5.0
canonical_go_repository: github.com/openshift/redhat-opentelemetry-collector
images:
  items:
  - additional_architectures:
    - arm64
    context_dir: .
    dockerfile_path: Dockerfile.art
    to: redhat-opentelemetry-collector
promotion:
  to:
  - disabled: true
    namespace: ci
    tag: redhat-otel-collector
prowgen:
  private: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
  build:
    requests:
      cpu: "2"
      memory: 6Gi
  fips-check:
    requests:
      cpu: "2"
      memory: 6Gi
  generate-schemas:
    requests:
      cpu: "2"
      memory: 6Gi
tests:
- as: build
  commands: |
    # The build_root image sets GOFLAGS=-mod=vendor, but the vendor directory of the .obi-src submodule is not consistent.
    # Dockerfile.art builds with -mod=mod as well.
    export GOFLAGS=-mod=mod
    make build
  container:
    from: src
- as: generate-schemas
  commands: |
    # The build_root image sets GOFLAGS=-mod=vendor, but the vendor directory of the .obi-src submodule is not consistent.
    # Dockerfile.art builds with -mod=mod as well.
    export GOFLAGS=-mod=mod
    make generate-schemas
  container:
    from: src
- as: fips-check
  commands: |
    export GOFLAGS=-mod=mod
    make generate-obi
    cd _build && CGO_ENABLED=0 GOFIPS140=certified go build -o opentelemetry-collector -trimpath -ldflags "-w" . && cd ..
    GOFLAGS= go install github.com/os-observability/konflux-opentelemetry/tools/fips-check@latest
    fips-check --binary ./_build/opentelemetry-collector --module ./_build --allowlist ./fips-allowlist.yaml
  container:
    from: src
zz_generated_metadata:
  branch: rhosdt-0.158
  org: openshift-priv
  repo: redhat-opentelemetry-collector
