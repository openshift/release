base_images:
  cli:
    name: "4.22"
    namespace: ocp-priv
    tag: cli
  libvirt-installer:
    name: "4.22"
    namespace: ocp-priv
    tag: libvirt-installer
  operator-sdk:
    name: "4.17"
    namespace: origin
    tag: operator-sdk
  upi-installer:
    name: "4.22"
    namespace: ocp-priv
    tag: upi-installer
build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/kueue-operator
images:
  items:
  - dockerfile_literal: |
      FROM src
      RUN wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && chmod +x /usr/local/bin/yq
      RUN dnf install -y jq skopeo git && dnf clean all
    from: src
    optional: true
    to: kueue-operator-src
  - dockerfile_literal: |
      FROM src
      COPY oc /usr/bin/oc
      RUN ln -s /usr/bin/oc /usr/bin/kubectl
      RUN wget -qO /usr/local/bin/jq https://github.com/jqlang/jq/releases/latest/download/jq-linux64 && chmod +x /usr/local/bin/jq
      RUN dnf install -y skopeo git podman && dnf clean all
    from: src
    inputs:
      cli:
        paths:
        - destination_dir: .
          source_path: /usr/bin/oc
    optional: true
    to: src-with-oc-and-kubectl
  run_if_changed: ^$
prowgen:
  disable_sparse_checkout: true
  enable_secrets_store_csi_driver: true
  private: true
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.22"
  s390x-4-22:
    candidate:
      architecture: s390x
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    requests:
      cpu: "4"
      memory: 4Gi
zz_generated_metadata:
  branch: main
  org: openshift-priv
  repo: kueue-operator
  variant: libvirt-s390x
