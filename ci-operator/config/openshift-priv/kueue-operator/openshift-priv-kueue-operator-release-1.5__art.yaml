base_images:
  cli:
    name: "5.0"
    namespace: ocp-priv
    tag: cli
  upi-installer:
    name: "5.0"
    namespace: ocp-priv
    tag: upi-installer
build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/kueue-operator
images:
  items:
  - dockerfile_literal: |
      FROM src
      RUN wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && chmod +x /usr/local/bin/yq
      RUN dnf install -y jq skopeo git && dnf clean all
    from: src
    to: kueue-operator-src
prowgen:
  private: true
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: release-1.5
  org: openshift-priv
  repo: kueue-operator
  variant: art
