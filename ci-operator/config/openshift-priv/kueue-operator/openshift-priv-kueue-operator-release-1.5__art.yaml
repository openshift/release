base_images:
  cli:
    name: "5.0"
    namespace: ocp-priv
    tag: cli
  upi-installer:
    name: "5.0"
    namespace: ocp-priv
    tag: upi-installer
build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/kueue-operator
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_literal: |
      FROM src
      RUN YQ_ARCH=$(uname -m | sed -e 's/^x86_64$/amd64/' -e 's/^aarch64$/arm64/') && \
          wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH}" && \
          chmod +x /usr/local/bin/yq
      RUN dnf install -y jq skopeo git && dnf clean all
    from: src
    to: kueue-operator-src
prowgen:
  disable_sparse_checkout: true
  private: true
releases:
  arm64-5-0-latest:
    candidate:
      architecture: arm64
      product: ocp
      stream: nightly
      version: "5.0"
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.22"
  ocp-5-0-latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: release-1.5
  org: openshift-priv
  repo: kueue-operator
  variant: art
