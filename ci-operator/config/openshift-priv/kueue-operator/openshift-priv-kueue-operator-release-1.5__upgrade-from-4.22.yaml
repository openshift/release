base_images:
  cli:
    name: "5.0"
    namespace: ocp-priv
    tag: cli
  upi-installer:
    name: "4.22"
    namespace: ocp-priv
    tag: upi-installer
build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/kueue-operator
images:
  items:
  - dockerfile_path: Dockerfile.ci
    to: kueue-operator
  - dockerfile_literal: |
      FROM src
      RUN dnf install -y jq skopeo git && dnf clean all
    from: src
    to: kueue-operator-src
  - dockerfile_literal: |
      FROM src
      COPY oc /usr/bin/oc
      RUN ln -s /usr/bin/oc /usr/bin/kubectl
      RUN wget -qO /usr/local/bin/jq https://github.com/jqlang/jq/releases/latest/download/jq-linux64 && chmod +x /usr/local/bin/jq
      RUN dnf install -y skopeo git podman && dnf clean all
    from: src
    inputs:
      cli:
        paths:
        - destination_dir: .
          source_path: /usr/bin/oc
    to: src-with-oc-and-kubectl
prowgen:
  disable_sparse_checkout: true
  private: true
releases:
  initial:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: "4"
      memory: 4Gi
zz_generated_metadata:
  branch: release-1.5
  org: openshift-priv
  repo: kueue-operator
  variant: upgrade-from-4.22
