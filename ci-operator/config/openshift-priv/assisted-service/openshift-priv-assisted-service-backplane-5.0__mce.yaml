build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-8-release-golang-1.18-openshift-4.12
canonical_go_repository: github.com/openshift/assisted-service
images:
  items:
  - dockerfile_path: Dockerfile.assisted-service
    to: assisted-service
  - build_args:
    - name: RHEL_VERSION
      value: "8"
    dockerfile_path: Dockerfile.assisted-service
    to: assisted-service-el8
promotion:
  to:
  - disabled: true
    name: "5.0"
    namespace: stolostron
prowgen:
  private: true
releases:
  latest:
    integration:
      name: "5.0"
      namespace: ocp-priv
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: backplane-5.0
  org: openshift-priv
  repo: assisted-service
  variant: mce
