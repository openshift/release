build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-8-release-golang-1.25-openshift-4.23
canonical_go_repository: github.com/openshift/troubleshooting-panel-console-plugin
images:
  items:
  - dockerfile_path: Dockerfile
    to: troubleshooting-panel-console-plugin
  - dockerfile_path: Dockerfile.test
    to: troubleshooting-panel-console-plugin-test
promotion:
  to:
  - disabled: true
    excluded_images:
    - troubleshooting-panel-console-plugin
    - troubleshooting-panel-console-plugin-test
    name: latest
    namespace: observability-ui
prowgen:
  private: true
resources:
  '*':
    limits:
      memory: 6Gi
    requests:
      cpu: 100m
      memory: 6Gi
tests:
- as: lint
  commands: make lint-frontend
  container:
    from: troubleshooting-panel-console-plugin-test
- as: fips-image-scan
  steps:
    dependencies:
      SCAN_IMAGE: troubleshooting-panel-console-plugin
    test:
    - ref: fips-check-image-scan
- as: unit
  commands: make test-frontend
  container:
    from: troubleshooting-panel-console-plugin-test
zz_generated_metadata:
  branch: main
  org: openshift-priv
  repo: troubleshooting-panel-console-plugin
