base_images:
  base_rhel10:
    name: "5.1"
    namespace: ocp-priv
    tag: base-rhel10
build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/openstack-ironic-python-agent
images:
  items:
  - dockerfile_path: openstack-ipa-tester.Dockerfile
    from: src
    optional: true
    to: ipa-tester
  - dockerfile_path: openstack-ipa-tester-rhel10-py314.Dockerfile
    from: base_rhel10
    optional: true
    to: ipa-tester-rhel10-py314
promotion:
  to:
  - name: "5.1"
    namespace: ocp-priv
prowgen:
  private: true
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp-priv
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp-priv
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit-rhel9-py312
  commands: HOME=`dirname .` tox -vv -e py3
  container:
    from: ipa-tester
- as: pep8-rhel9-py312
  commands: HOME=`dirname .` tox -vv -e pep8
  container:
    from: ipa-tester
- as: unit-rhel10-py314
  commands: HOME=`dirname .` tox -vv -e py3
  container:
    clone: true
    from: ipa-tester-rhel10-py314
- as: pep8-rhel10-py314
  commands: HOME=`dirname .` tox -vv -e pep8
  container:
    clone: true
    from: ipa-tester-rhel10-py314
zz_generated_metadata:
  branch: main
  org: openshift-priv
  repo: openstack-ironic-python-agent
