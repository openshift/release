base_images:
  commitchecker:
    name: commitchecker
    namespace: ci
    tag: latest
binary_build_commands: make build
build_root:
  from_repository: true
canonical_go_repository: github.com/csi-addons/csi-volume-device-exporter
images:
  items:
  - dockerfile_path: Dockerfile.openshift
    to: csi-volume-device-exporter
promotion:
  to:
  - name: "5.1"
    namespace: ocp-priv
prowgen:
  enable_secrets_store_csi_driver: true
  private: true
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp-priv
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp-priv
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: make test
  container:
    from: src
- as: verify-commits
  commands: commitchecker --start ${PULL_BASE_SHA:-main}
  container:
    from: commitchecker
zz_generated_metadata:
  branch: main
  org: openshift-priv
  repo: csi-volume-device-exporter
