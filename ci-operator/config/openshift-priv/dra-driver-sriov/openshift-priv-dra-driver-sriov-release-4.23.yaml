build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/dra-driver-sriov
images:
  items:
  - dockerfile_path: Dockerfile.ocp
    to: dra-driver-sriov
promotion:
  to:
  - disabled: true
    name: sriov-4.23
    namespace: origin
  - name: "4.23"
    namespace: ocp-priv
prowgen:
  private: true
releases:
  initial:
    integration:
      name: "4.23"
      namespace: ocp-priv
  latest:
    integration:
      include_built_images: true
      name: "4.23"
      namespace: ocp-priv
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: GOFLAGS="-mod=mod" make test
  container:
    from: src
zz_generated_metadata:
  branch: release-4.23
  org: openshift-priv
  repo: dra-driver-sriov
