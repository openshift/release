base_images:
  cli:
    name: "5.0"
    namespace: ocp-priv
    tag: cli
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/kubernetes-nmstate
images:
  items:
  - dockerfile_path: build/Dockerfile.openshift
    to: kubernetes-nmstate-handler
  - dockerfile_path: build/Dockerfile.operator.openshift
    to: kubernetes-nmstate-operator
  - dockerfile_literal: |
      FROM src
      COPY oc /usr/bin/oc
      RUN ln -s /usr/bin/oc /usr/bin/kubectl
    from: src
    inputs:
      cli:
        paths:
        - destination_dir: .
          source_path: /usr/bin/oc
    to: src-with-oc-and-kubectl
prowgen:
  private: true
releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp-priv
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp-priv
  nightly:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
  stable:
    release:
      channel: fast
      version: "4.11"
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: release-5.0
  org: openshift-priv
  repo: kubernetes-nmstate
  variant: periodics
