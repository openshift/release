base_images:
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
  hypershift-operator:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
binary_build_commands: make build
build_root:
  from_repository: true
canonical_go_repository: kubevirt.io/cloud-provider-kubevirt-cloud
images:
  items:
  - dockerfile_path: openshift-hack/images/Dockerfile.openshift
    to: kubevirt-cloud-controller-manager
promotion:
  to:
  - name: "5.1"
    namespace: ocp-priv
prowgen:
  private: true
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp-priv
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp-priv
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: make test
tests:
- as: security
  optional: true
  steps:
    env:
      ALL_PROJECTS: "true"
      PROJECT_NAME: cloud-provider-kubevirt
    workflow: openshift-ci-security
- as: unit-tests
  commands: GOFLAGS="-mod=readonly" make test
  container:
    from: src
- as: hypershift-kubevirt-conformance-azure
  optional: true
  steps:
    cluster_profile: openshift-org-azure
    env:
      TEST_ARGS: --run \[sig-kubevirt\].services|LoadBalancer|terminating.endpoints
    workflow: hypershift-kubevirt-azure-conformance
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
zz_generated_metadata:
  branch: main
  org: openshift-priv
  repo: cloud-provider-kubevirt
