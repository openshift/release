base_images:
  microshift-ci-brew:
    name: brew
    namespace: microshift
    tag: latest
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-5.0
canonical_go_repository: github.com/openshift/microshift
images:
  items:
  - dockerfile_literal: |
      FROM src
      RUN dnf install --setopt=tsflags=nodocs -y selinux-policy-devel
    inputs:
      src:
        as:
        - src
        paths:
        - destination_dir: .
          source_path: /go/src/github.com/openshift/microshift
    optional: true
    to: microshift-test-rpm
  - dockerfile_literal: |
      FROM src
      USER 0
      RUN dnf install -y podman shadow-utils jq file && dnf clean all && \
          setcap cap_setuid+ep /usr/bin/newuidmap && \
          setcap cap_setgid+ep /usr/bin/newgidmap && \
          touch /etc/subgid /etc/subuid && \
          chmod g=u /etc/subuid /etc/subgid && \
          chmod g=u /etc/passwd /etc/group
      ENV BUILDAH_ISOLATION=chroot
      USER 1000
    inputs:
      src:
        as:
        - src
    to: rebase-cryptoscan-src
promotion:
  to:
  - excluded_images:
    - microshift-test-rpm
    - rebase-cryptoscan-src
    name: "5.0"
    namespace: ocp-priv
prowgen:
  private: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
  nightly-amd64:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
  nightly-arm64:
    candidate:
      architecture: arm64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify
  steps:
    test:
    - as: verify
      commands: make verify-ci
      env:
      - default: /tmp/
        name: GOLANGCI_LINT_CACHE
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: test-unit
  commands: make test-unit
  container:
    from: src
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
- as: test-rpm
  commands: RPM_INFO=true make rpm srpm
  container:
    from: microshift-test-rpm
  run_if_changed: ^(rpm/.*|packaging/.*|Makefile)$
- as: security
  optional: true
  steps:
    workflow: openshift-ci-security
- as: test-rebase
  capabilities:
  - intranet
  - nested-podman
  nested_podman: true
  optional: true
  restrict_network_access: false
  run_if_changed: ^(assets/.*|scripts/auto-rebase/.*|go\.mod|vendor/.*|deps/.*)$
  steps:
    env:
      DRY_RUN: "y"
    workflow: openshift-microshift-rebase-cryptoscan
- always_run: false
  as: e2e-aws-tests
  pipeline_run_if_changed: ^(assets/.*|cmd/.*|etcd/.*|pkg/.*|packaging/.*|test/.*|vendor/.*|Makefile.*|scripts/.*)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      EC2_INSTANCE_TYPE: c5.metal
      MICROSHIFT_OS: rhel-9.8
      SCENARIO_TYPE: presubmits
    workflow: openshift-microshift-e2e-metal-tests
- always_run: false
  as: e2e-aws-tests-arm
  pipeline_run_if_changed: ^(assets/.*|cmd/.*|etcd/.*|pkg/.*|packaging/.*|test/.*|vendor/.*|Makefile.*|scripts/.*)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      EC2_INSTANCE_TYPE: m7g.metal
      MICROSHIFT_OS: rhel-9.8
      SCENARIO_TYPE: presubmits
    workflow: openshift-microshift-e2e-metal-tests
- always_run: false
  as: e2e-aws-tests-cache
  capabilities:
  - intranet
  pipeline_run_if_changed: ^test\/bin\/(ci_phase_iso_build|manage_build_cache)\.sh$
  restrict_network_access: false
  steps:
