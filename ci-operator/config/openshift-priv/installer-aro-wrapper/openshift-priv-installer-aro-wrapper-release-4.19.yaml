base_images:
  ubi9-minimal:
    name: ubi-minimal
    namespace: ocp
    tag: "9"
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.24-openshift-4.20
canonical_go_repository: github.com/openshift/installer-aro-wrapper
images:
  items:
  - dockerfile_path: ./Dockerfile.aro
    from: ubi9-minimal
    inputs:
      src:
        as:
        - ${BUILDER_REGISTRY}/${BUILDER_REPOSITORY}:${BUILDER_TAG}
        paths:
        - destination_dir: .
          source_path: /go/src/github.com/openshift/installer-aro-wrapper/.
    to: azure-installer-aro-wrapper
promotion:
  to:
  - name: "4.19"
    namespace: ocp-priv
prowgen:
  private: true
releases:
  latest:
    integration:
      include_built_images: true
      name: "4.19"
      namespace: ocp-priv
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 8Gi
tests:
- as: unit
  commands: make unit-test-go
  container:
    from: src
- as: validate
  commands: make validate-go
  container:
    from: src
- as: lint
  commands: |
    export GOCACHE=/tmp/
    export GOLANGCI_LINT_CACHE=/tmp/.cache
    export GOPROXY=https://proxy.golang.org
    make lint-go
  container:
    from: src
- as: vendor
  commands: go mod vendor && git diff --exit-code
  container:
    from: src
  run_if_changed: (go\.(mod|sum)$)|(^vendor/)
zz_generated_metadata:
  branch: release-4.19
  org: openshift-priv
  repo: installer-aro-wrapper
