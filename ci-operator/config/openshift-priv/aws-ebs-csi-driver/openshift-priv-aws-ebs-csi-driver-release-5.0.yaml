base_images:
  aws-ebs-csi-driver-operator-test:
    name: "5.0"
    namespace: ocp-priv
    tag: aws-ebs-csi-driver-operator-test
  commitchecker:
    name: commitchecker
    namespace: ci
    tag: latest
  hypershift-operator:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
  hypershift-tests:
    name: hypershift-tests
    namespace: hypershift
    tag: latest
  tests-private:
    name: tests-private
    namespace: ci
    tag: "5.0"
binary_build_commands: make
build_root:
  from_repository: true
canonical_go_repository: github.com/kubernetes-sigs/aws-ebs-csi-driver
images:
  items:
  - dockerfile_path: Dockerfile.openshift.rhel7
    to: aws-ebs-csi-driver
promotion:
  to:
  - name: "5.0"
    namespace: ocp-priv
prowgen:
  enable_secrets_store_csi_driver: true
  private: true
releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp-priv
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp-priv
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify
  commands: |
    # Set $HOME for golangci-lint cache
    GOFLAGS="-mod=readonly" HOME=/tmp make verify
  container:
    from: src
- as: verify-deps
  steps:
    test:
    - ref: go-verify-deps
- as: unit
  commands: |
    GOFLAGS="-mod=readonly" make test
  container:
    from: src
- always_run: false
  as: e2e-aws-ovn-upgrade
  steps:
    cluster_profile: openshift-org-aws
    workflow: openshift-upgrade-aws
- always_run: false
  as: e2e-aws-csi
  steps:
    cluster_profile: openshift-org-aws
    workflow: openshift-e2e-aws-csi
- always_run: false
  as: e2e-aws-csi-hypershift
  steps:
    cluster_profile: hypershift-aws
    env:
      EXTRA_ARGS: --use-rosa-managed-policies --shared-role
      PUBLIC_ONLY: "true"
      TEST_CSI_DRIVER_MANIFEST: manifest-aws-ebs.yaml
      TEST_OCP_CSI_DRIVER_MANIFEST: ocp-manifest-aws-ebs.yaml
      TEST_SUITE: openshift/csi
      VERIFY_PAYLOAD_COMPONENT_IMAGE: aws-ebs-csi-driver
      VERIFY_ROSA_MANAGED_POLICIES: "true"
    pre:
    - ref: ipi-install-rbac
    - chain: hypershift-setup-root-management-cluster
    - chain: hypershift-aws-create
    - ref: storage-conf-csi-aws-ebs
    workflow: hypershift-aws-conformance
- always_run: false
  as: e2e-aws-csi-extended
  optional: true
  steps:
    cluster_profile: aws-qe
    workflow: openshift-e2e-aws-csi-extended
- always_run: false
  as: e2e-hypershift
  steps:
    cluster_profile: hypershift-aws
    env:
      CI_TESTS_RUN: ^TestCreateCluster$
    workflow: hypershift-aws-e2e-external
- as: verify-commits
  commands: |
    commitchecker --start ${PULL_BASE_SHA:-master}
  container:
    from: commitchecker
- as: security
  optional: true
  steps:
    env:
      PROJECT_NAME: aws-ebs-csi-driver
    workflow: openshift-ci-security
zz_generated_metadata:
  branch: release-5.0
  org: openshift-priv
  repo: aws-ebs-csi-driver
