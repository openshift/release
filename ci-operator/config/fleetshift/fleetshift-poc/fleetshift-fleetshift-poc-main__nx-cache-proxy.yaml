build_root:
  image_stream_tag:
    name: builder
    namespace: stolostron
    tag: go1.25-linux
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile.nx-cache
    to: nx-cache-proxy
  run_if_changed: ^sdk/nx-cache-proxy/|^Dockerfile\.nx-cache$
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: pr-image-mirror
  capabilities:
  - arm64
  run_if_changed: ^sdk/nx-cache-proxy/|^Dockerfile\.nx-cache$
  steps:
    dependencies:
      SOURCE_IMAGE_REF: nx-cache-proxy
    env:
      IMAGE_REPO: nx-cache-proxy
      REGISTRY_ORG: stolostron
    workflow: fleetshift-ci-image-mirror
- as: pr-merge-image-mirror
  capabilities:
  - arm64
  postsubmit: true
  run_if_changed: ^sdk/nx-cache-proxy/|^Dockerfile\.nx-cache$
  steps:
    dependencies:
      SOURCE_IMAGE_REF: nx-cache-proxy
    env:
      ALSO_TAG_LATEST: "true"
      IMAGE_REPO: nx-cache-proxy
      REGISTRY_ORG: stolostron
    workflow: fleetshift-ci-image-mirror
- as: republish-latest
  capabilities:
  - arm64
  cron: 0 5,11,17,23 * * *
  retry:
    attempts: 3
    interval: 1h
  steps:
    dependencies:
      SOURCE_IMAGE_REF: nx-cache-proxy
    env:
      IMAGE_REPO: nx-cache-proxy
      IMAGE_TAG: latest
      REGISTRY_ORG: stolostron
    workflow: fleetshift-ci-image-mirror
zz_generated_metadata:
  branch: main
  org: fleetshift
  repo: fleetshift-poc
  variant: nx-cache-proxy
