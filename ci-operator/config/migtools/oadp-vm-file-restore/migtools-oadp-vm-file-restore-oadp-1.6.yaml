build_root:
  project_image:
    dockerfile_literal: FROM quay.io/konveyor/builder:ubi9-v1.26
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile
    to: oadp-vm-file-restore
  - additional_architectures:
    - arm64
    context_dir: containers/oadp-vmfr-access
    dockerfile_path: Dockerfile
    to: oadp-vmfr-access
  - additional_architectures:
    - arm64
    context_dir: containers/side-containers/sshd
    dockerfile_path: Containerfile
    to: oadp-vmfr-access-sshd
promotion:
  to:
  - namespace: konveyor
    tag: oadp-1.6
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: oadp-1.6
  org: migtools
  repo: oadp-vm-file-restore
