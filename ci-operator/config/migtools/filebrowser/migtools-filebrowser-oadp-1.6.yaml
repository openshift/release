build_root:
  project_image:
    dockerfile_literal: FROM quay.io/konveyor/builder:ubi9-v1.26
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Containerfile
    to: oadp-vmfr-access-filebrowser-oadp-1.6
promotion:
  to:
  - name: oadp-vmfr-access-filebrowser
    namespace: konveyor
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: oadp-1.6
  org: migtools
  repo: filebrowser
