base_images:
  oadp-operator-index:
    name: oadp-operator-index
    namespace: konveyor
    tag: latest
  test-oadp-operator:
    name: oadp-operator-e2e-tests
    namespace: konveyor
    tag: latest
build_root:
  image_stream_tag:
    name: builder
    namespace: konveyor
    tag: ubi9-v1.26
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile
    to: kubevirt-datamover-controller
promotion:
  to:
  - namespace: konveyor
    tag: oadp-dev
prowgen:
  disable_sparse_checkout: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: e2e-test-aws
  run_if_changed: .+\.go|go\.(\bmod\b|\bsum\b)|Makefile|Dockerfile|.dockerignore|.*\.ya{0,1}ml|.sh
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_INDEX: oadp-operator-index
    env:
      OO_CHANNEL: dev
      OO_INSTALL_NAMESPACE: openshift-adp
      OO_PACKAGE: oadp-operator
      OO_TARGET_NAMESPACES: '!install'
    test:
    - as: set-related-image
      cli: latest
      commands: |
        oc set env deployment/openshift-adp-controller-manager -n "${OO_INSTALL_NAMESPACE}" RELATED_IMAGE_KUBEVIRT_DATAMOVER_CONTROLLER="${KDM_CONTROLLER_IMAGE}"
        oc rollout status deployment/openshift-adp-controller-manager -n "${OO_INSTALL_NAMESPACE}" --timeout=180s
      dependencies:
      - env: KDM_CONTROLLER_IMAGE
        name: kubevirt-datamover-controller
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
    - as: e2e
      cli: latest
      commands: make TEST_VIRT=true test-e2e
      credentials:
      - mount_path: /var/run/oadp-credentials
        name: oadp-credentials
        namespace: test-credentials
      from: test-oadp-operator
      resources:
        requests:
          cpu: 1000m
          memory: 512Mi
    workflow: optional-operators-ci-aws
zz_generated_metadata:
  branch: oadp-dev
  org: migtools
  repo: kubevirt-datamover-controller
