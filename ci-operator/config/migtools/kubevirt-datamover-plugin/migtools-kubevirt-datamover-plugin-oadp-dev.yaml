build_root:
  project_image:
    dockerfile_literal: FROM quay.io/konveyor/builder:ubi9-v1.26
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile
    to: kubevirt-datamover-plugin
promotion:
  to:
  - namespace: konveyor
    tag: oadp-dev
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: oadp-dev
  org: migtools
  repo: kubevirt-datamover-plugin
