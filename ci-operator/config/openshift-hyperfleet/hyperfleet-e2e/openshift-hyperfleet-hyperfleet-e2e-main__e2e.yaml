base_images:
  hyperfleet-e2e:
    name: hyperfleet-e2e
    namespace: ci
    tag: latest
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: tier0-nightly
  cron: 30 9 * * *
  reporter_config:
    channel: '#hyperfleet-e2e-status'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: |-
      {{if eq .Status.State "success"}}:white_check_mark:{{else}}:x:{{end}} *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      Build: #{{.Status.BuildID}}
      Details: <{{.Status.URL}}|View logs> · <https://prow.ci.openshift.org/job-history/gs/test-platform-results-public/logs/{{.Spec.Job}}|View history>
  steps:
    env:
      ADAPTER_IMAGE_REPO: redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-adapter
      API_IMAGE_REPO: redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-api
      CLUSTER_NAME: hyperfleet-dev-prow
      IMAGE_REGISTRY: quay.io
      LABEL_FILTER: tier0
      MULTISTAGE_PARAM_OVERRIDE_ADAPTER_IMAGE_TAG: latest
      MULTISTAGE_PARAM_OVERRIDE_API_IMAGE_TAG: latest
      MULTISTAGE_PARAM_OVERRIDE_NAMESPACE_PREFIX: e2e
      MULTISTAGE_PARAM_OVERRIDE_SENTINEL_IMAGE_TAG: latest
      REGION: us-central1-a
      SENTINEL_IMAGE_REPO: redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-sentinel
    workflow: openshift-hyperfleet-e2e
- as: tier1-nightly
  cron: 30 11 * * *
  reporter_config:
    channel: '#hyperfleet-e2e-status'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: |-
      {{if eq .Status.State "success"}}:white_check_mark:{{else}}:x:{{end}} *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      Build: #{{.Status.BuildID}}
      Details: <{{.Status.URL}}|View logs> · <https://prow.ci.openshift.org/job-history/gs/test-platform-results-public/logs/{{.Spec.Job}}|View history>
  steps:
    env:
      ADAPTER_IMAGE_REPO: redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-adapter
      API_IMAGE_REPO: redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-api
      CLUSTER_NAME: hyperfleet-dev-prow
      IMAGE_REGISTRY: quay.io
      LABEL_FILTER: tier1 && !perf
      MULTISTAGE_PARAM_OVERRIDE_ADAPTER_IMAGE_TAG: latest
      MULTISTAGE_PARAM_OVERRIDE_API_IMAGE_TAG: latest
      MULTISTAGE_PARAM_OVERRIDE_NAMESPACE_PREFIX: e2e
      MULTISTAGE_PARAM_OVERRIDE_SENTINEL_IMAGE_TAG: latest
      REGION: us-central1-a
      SENTINEL_IMAGE_REPO: redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-sentinel
    workflow: openshift-hyperfleet-e2e
- as: tier2-nightly
  cron: 30 13 * * *
  reporter_config:
    channel: '#hyperfleet-e2e-status'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: |-
      {{if eq .Status.State "success"}}:white_check_mark:{{else}}:x:{{end}} *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      Build: #{{.Status.BuildID}}
      Details: <{{.Status.URL}}|View logs> · <https://prow.ci.openshift.org/job-history/gs/test-platform-results-public/logs/{{.Spec.Job}}|View history>
  steps:
    env:
      ADAPTER_IMAGE_REPO: redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-adapter
      API_IMAGE_REPO: redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-api
      CLUSTER_NAME: hyperfleet-dev-prow
      IMAGE_REGISTRY: quay.io
      LABEL_FILTER: tier2
      MULTISTAGE_PARAM_OVERRIDE_ADAPTER_IMAGE_TAG: latest
      MULTISTAGE_PARAM_OVERRIDE_API_IMAGE_TAG: latest
      MULTISTAGE_PARAM_OVERRIDE_NAMESPACE_PREFIX: e2e
      MULTISTAGE_PARAM_OVERRIDE_SENTINEL_IMAGE_TAG: latest
      REGION: us-central1-a
      SENTINEL_IMAGE_REPO: redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-sentinel
    workflow: openshift-hyperfleet-e2e
- as: perf-nightly
  cron: 30 7 * * *
  disable_pod_scaler: true
  reporter_config:
    channel: '#hyperfleet-e2e-status'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: |-
      {{if eq .Status.State "success"}}:white_check_mark:{{else}}:x:{{end}} *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      Build: #{{.Status.BuildID}}
      Details: <{{.Status.URL}}|View logs> · <https://prow.ci.openshift.org/job-history/gs/test-platform-results-public/logs/{{.Spec.Job}}|View history>
  steps:
    env:
      ADAPTER_IMAGE_REPO: redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-adapter
      API_IMAGE_REPO: redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-api
      CLUSTER_NAME: hyperfleet-dev-prow
      IMAGE_REGISTRY: quay.io
      LABEL_FILTER: perf
      MULTISTAGE_PARAM_OVERRIDE_ADAPTER_IMAGE_TAG: latest
      MULTISTAGE_PARAM_OVERRIDE_API_IMAGE_TAG: latest
      MULTISTAGE_PARAM_OVERRIDE_NAMESPACE_PREFIX: e2e
      MULTISTAGE_PARAM_OVERRIDE_SENTINEL_IMAGE_TAG: latest
      REGION: us-central1-a
      SENTINEL_IMAGE_REPO: redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-sentinel
    test:
    - ref: openshift-hyperfleet-e2e-test-perf
    workflow: openshift-hyperfleet-e2e
zz_generated_metadata:
  branch: main
  org: openshift-hyperfleet
  repo: hyperfleet-e2e
  variant: e2e
