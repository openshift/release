build_root:
  project_image:
    dockerfile_literal: |-
      FROM registry.ci.openshift.org/ocp/builder:rhel-9-golang-1.26-openshift-4.23
      RUN dnf install -y jq && dnf clean all
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: validate-commits
  steps:
    test:
    - ref: hyperfleet-commitlint
- as: lint
  commands: |
    export GOLANGCI_LINT_CACHE=/tmp/.cache
    unset GOFLAGS
    make lint
  container:
    from: src
- as: unit
  commands: |
    export HOME=/tmp
    export GOCACHE=/tmp/go-build
    export GOMODCACHE=/tmp/go-mod
    unset GOFLAGS
    make test
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-hyperfleet
  repo: hyperfleet-e2e
