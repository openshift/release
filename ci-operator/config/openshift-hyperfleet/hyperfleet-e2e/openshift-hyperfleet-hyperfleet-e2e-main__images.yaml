base_images:
  ci_hyperfleet-credential-provider_latest:
    name: hyperfleet-credential-provider
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
images:
  items:
  - dockerfile_path: Dockerfile
    inputs:
      ci_hyperfleet-credential-provider_latest:
        as:
        - registry.ci.openshift.org/ci/hyperfleet-credential-provider:latest
    to: hyperfleet-e2e
promotion:
  to:
  - namespace: ci
    tag: latest
    tag_by_commit: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: deployment-validation
  skip_if_only_changed: ^docs/|\.md$|^\.github/
  steps:
    env:
      CLUSTER_NAME: hyperfleet-dev-prow
      LABEL_FILTER: tier0
      MULTISTAGE_PARAM_OVERRIDE_ADAPTER_IMAGE_TAG: latest
      MULTISTAGE_PARAM_OVERRIDE_API_IMAGE_TAG: latest
      MULTISTAGE_PARAM_OVERRIDE_NAMESPACE_PREFIX: e2e
      MULTISTAGE_PARAM_OVERRIDE_SENTINEL_IMAGE_TAG: latest
      REGION: us-central1-a
    workflow: openshift-hyperfleet-e2e
zz_generated_metadata:
  branch: main
  org: openshift-hyperfleet
  repo: hyperfleet-e2e
  variant: images
