base_images:
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
images:
  items:
  - dockerfile_path: Dockerfile
    to: hyperfleet-operator
operator:
  bundles:
  - as: hyperfleet-operator-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: quay.io/redhat-services-prod/hyperfleet-tenant/hyperfleet/hyperfleet-operator.*
    with: pipeline:hyperfleet-operator
prowgen:
  expose: true
  private: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-in-cluster-install
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 1h0m0s
    version: "4.22"
  steps:
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace hyperfleet
        operator-sdk run bundle --timeout=10m -n hyperfleet "$OO_BUNDLE"
        oc wait --for=condition=Available -n hyperfleet deployment -l app.kubernetes.io/name=hyperfleet-operator --timeout=5m
      dependencies:
      - env: OO_BUNDLE
        name: hyperfleet-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
zz_generated_metadata:
  branch: main
  org: openshift-hyperfleet
  repo: hyperfleet-operator
  variant: presubmits
