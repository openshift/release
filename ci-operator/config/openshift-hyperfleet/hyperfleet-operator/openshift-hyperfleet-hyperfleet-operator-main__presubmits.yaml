base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
images:
  items:
  - dockerfile_literal: |
      FROM nested-podman
      COPY src/ /opt/app-root/src
      WORKDIR /opt/app-root/src/hyperfleet-operator
      USER root
      RUN dnf install -y make gettext && dnf clean all
    from: nested-podman
    inputs:
      src:
        paths:
        - destination_dir: src
          source_path: /go/src/github.com/openshift-hyperfleet/hyperfleet-operator
    optional: true
    to: podman-test
prowgen:
  expose: true
  private: true
resources:
  '*':
    requests:
      cpu: "1"
      memory: 1G
tests:
- as: bundle
  capabilities:
  - nested-podman
  commands: |
    set -euo pipefail
    # KUSTOMIZE_VARIANT and VALIDATE_RELATED_IMAGES match BUILD_ARGS in the
    # operator repo's .tekton/hyperfleet-operator-bundle-{push,tag}.yaml.
    # Keep them in sync.
    make bundle-build CONTAINER_TOOL=podman \
      KUSTOMIZE_VARIANT=config/manifests/prod \
      VALIDATE_RELATED_IMAGES=true \
      BUNDLE_IMG=localhost/hyperfleet-operator-bundle:ci
  container:
    from: podman-test
  nested_podman: true
  run_if_changed: ^(bundle\.Dockerfile$|Makefile$|config/|validators/)
- as: kind-podman-smoke
  optional: true
  capabilities:
  - nested-podman
  commands: |
    set -euo pipefail
    KIND_VERSION=v0.30.0
    curl -fsSL -o /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
    install -m 0755 /tmp/kind /usr/local/bin/kind
    kind version
    KUBECTL_VERSION=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
    curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
    export KIND_EXPERIMENTAL_PROVIDER=podman
    kind create cluster --wait 300s
    kubectl get nodes -o wide
  container:
    from: podman-test
  nested_podman: true
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
zz_generated_metadata:
  branch: main
  org: openshift-hyperfleet
  repo: hyperfleet-operator
  variant: presubmits
