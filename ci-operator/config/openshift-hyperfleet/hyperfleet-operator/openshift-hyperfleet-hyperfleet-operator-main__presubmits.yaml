base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
images:
  items:
  - dockerfile_literal: |
      FROM nested-podman
      COPY src/ /opt/app-root/src
      WORKDIR /opt/app-root/src/hyperfleet-operator
      USER root
      RUN dnf install -y make gettext && dnf clean all
    from: nested-podman
    inputs:
      src:
        paths:
        - destination_dir: src
          source_path: /go/src/github.com/openshift-hyperfleet/hyperfleet-operator
    optional: true
    to: podman-test
prowgen:
  expose: true
  private: true
resources:
  '*':
    requests:
      cpu: "1"
      memory: 1G
tests:
- as: bundle
  capabilities:
  - nested-podman
  commands: |
    set -euo pipefail
    # KUSTOMIZE_VARIANT and VALIDATE_RELATED_IMAGES match BUILD_ARGS in the
    # operator repo's .tekton/hyperfleet-operator-bundle-{push,tag}.yaml.
    # Keep them in sync.
    make bundle-build CONTAINER_TOOL=podman \
      KUSTOMIZE_VARIANT=config/manifests/prod \
      VALIDATE_RELATED_IMAGES=true \
      BUNDLE_IMG=localhost/hyperfleet-operator-bundle:ci
  container:
    from: podman-test
  nested_podman: true
  run_if_changed: ^(bundle\.Dockerfile$|Makefile$|config/|validators/)
- as: kind-podman-smoke
  optional: true
  capabilities:
  - nested-podman
  commands: |
    set -euo pipefail
    # Prow runs containers as a random UID: install to a writable dir, not /usr/local/bin
    BIN_DIR=/tmp/bin
    mkdir -p "${BIN_DIR}"
    KIND_VERSION=v0.30.0
    curl -fsSL -o "${BIN_DIR}/kind" "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
    chmod 0755 "${BIN_DIR}/kind"
    KUBECTL_VERSION=$(curl -fsSL https://dl.k8s.io/release/stable.txt)
    curl -fsSL -o "${BIN_DIR}/kubectl" "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    chmod 0755 "${BIN_DIR}/kubectl"
    export PATH="${BIN_DIR}:${PATH}"
    kind version
    # The kindest/node image contains files owned by unmappable UIDs/GIDs
    # (e.g. nfsnobody 65534), which the rootless podman user namespace cannot
    # chown during pull. ignore_chown_errors skips those instead of failing.
    # The storage library in the nested-podman image only accepts that key
    # under [storage.options.overlay]: left in [storage] it is silently dropped
    # with a "Failed to decode" warning and the pull still fails. Extend the
    # image's existing config instead of replacing it, keeping its runroot and
    # graphroot valid for the random Prow UID (same approach as the medik8s
    # step-registry jobs). Proper fix is wider subuid/subgid ranges in the
    # nested-podman image.
    storage_config="$(podman info --format '{{.Store.ConfigFile}}')"
    test -r "${storage_config}"
    export CONTAINERS_STORAGE_CONF=/tmp/hyperfleet-e2e-storage.conf
    awk '
      /^\[storage.options.overlay\]$/ { in_overlay = 1; found = 1; print; print "ignore_chown_errors = \"true\""; next }
      /^\[/ { in_overlay = 0 }
      in_overlay && /^[[:space:]]*ignore_chown_errors[[:space:]]*=/ { next }
      { print }
      END { if (!found) { print "[storage.options.overlay]"; print "ignore_chown_errors = \"true\"" } }
    ' "${storage_config}" > "${CONTAINERS_STORAGE_CONF}"
    export KIND_EXPERIMENTAL_PROVIDER=podman
    kind create cluster --wait 300s
    kubectl get nodes -o wide
  container:
    from: podman-test
  nested_podman: true
  resources:
    requests:
      cpu: "4"
      memory: 8Gi
zz_generated_metadata:
  branch: main
  org: openshift-hyperfleet
  repo: hyperfleet-operator
  variant: presubmits
