base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
images:
  items:
  - dockerfile_literal: |
      FROM nested-podman
      COPY src/ /opt/app-root/src
      WORKDIR /opt/app-root/src/hyperfleet-operator
      USER root
      RUN dnf install -y make gettext && dnf clean all
    from: nested-podman
    inputs:
      src:
        paths:
        - destination_dir: src
          source_path: /go/src/github.com/openshift-hyperfleet/hyperfleet-operator
    optional: true
    to: podman-test
prowgen:
  expose: true
  private: true
resources:
  '*':
    requests:
      cpu: "1"
      memory: 1G
tests:
- as: gcp-vm-smoke
  steps:
    post:
    - ref: openshift-hyperfleet-gcp-vm-destroy
    pre:
    - ref: openshift-hyperfleet-gcp-vm-create
    test:
    - as: smoke
      commands: |
        chmod 400 "${SHARED_DIR}/vm_ssh_key"
        VM_SSH_USER="$(cat "${SHARED_DIR}/gcp_vm_ssh_user")"
        VM_PUBLIC_IP="$(cat "${SHARED_DIR}/gcp_vm_public_ip)"
        ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          -i "${SHARED_DIR}/vm_ssh_key" \
          "${VM_SSH_USER}@${VM_PUBLIC_IP}" '
          set -euo pipefail
          echo "hello from $(hostname)"

          # Install Docker and KinD, then create a KinD cluster.
          sudo apt-get update -qq
          sudo apt-get install -y -qq docker.io
          sudo systemctl enable --now docker
          sudo docker version

          curl -sSLo /tmp/kind "https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64"
          sudo install -m 0755 /tmp/kind /usr/local/bin/kind
          kind version
          curl -sSLo /tmp/kubectl "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          kubectl version --client

          sudo kind create cluster --name hyperfleet --wait 300s
          sudo kubectl get nodes
        '
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: bundle
  capabilities:
  - nested-podman
  commands: |
    set -euo pipefail
    # KUSTOMIZE_VARIANT and VALIDATE_RELATED_IMAGES match BUILD_ARGS in the
    # operator repo's .tekton/hyperfleet-operator-bundle-{push,tag}.yaml.
    # Keep them in sync.
    make bundle-build CONTAINER_TOOL=podman \
      KUSTOMIZE_VARIANT=config/manifests/prod \
      VALIDATE_RELATED_IMAGES=true \
      BUNDLE_IMG=localhost/hyperfleet-operator-bundle:ci
  container:
    from: podman-test
  nested_podman: true
  run_if_changed: ^(bundle\.Dockerfile$|Makefile$|config/|validators/)
zz_generated_metadata:
  branch: main
  org: openshift-hyperfleet
  repo: hyperfleet-operator
  variant: presubmits
