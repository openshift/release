build_root:
  project_image:
    dockerfile_literal: |-
      FROM registry.ci.openshift.org/ocp/builder:rhel-9-golang-1.26-openshift-4.23 AS go-builder
      FROM registry.ci.openshift.org/ci/nested-podman@sha256:bb58be3e12f647268c1db834de02b8c23f2aa4164b0b7acdef31a6ddd170e728
      USER root
      COPY --from=go-builder /usr/lib/golang /usr/local/go
      ENV PATH="/usr/local/go/bin:${PATH}"
      RUN dnf install -y ca-certificates curl git jq make python3 python3-pyyaml && dnf clean all
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: rc-olm-upgrade
  capabilities:
  - nested-podman
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 1h0m0s
    version: "4.22"
  cron: 0 0 31 2 *
  reporter_config:
    channel: '#hyperfleet-e2e-status'
    job_states_to_report:
    - success
    - failure
    - error
  steps:
    post:
    - as: openshift-hyperfleet-operator-upgrade-cleanup
      cli: latest
      commands: |-
        #!/usr/bin/env bash
        set -euo pipefail
        set +x
        umask 077

        : "${SHARED_DIR:?SHARED_DIR is required}"
        : "${ARTIFACT_DIR:?ARTIFACT_DIR is required}"
        mkdir -p "${ARTIFACT_DIR}"
        prow_artifact_dir="${ARTIFACT_DIR}"

        state_file="${SHARED_DIR}/hyperfleet-operator-upgrade-state.json"
        invoked_file="${SHARED_DIR}/hyperfleet-operator-upgrade-suite-invoked"
        shared_receipt="${SHARED_DIR}/hyperfleet-operator-upgrade-cleanup.json"
        if [[ ! -e "${state_file}" && ! -e "${invoked_file}" ]]; then
            echo "Upgrade suite was not invoked; no suite resources were created."
            exit 0
        fi
        if [[ ! -f "${state_file}" || ! -f "${invoked_file}" ]]; then
            echo "ERROR: upgrade suite recovery state is missing" >&2
            exit 1
        fi
        if ! state_bytes="$(wc -c < "${state_file}")" || (( state_bytes > 4096 )) ||
            ! jq -e '(.operatorCommit | type == "string" and test("^[a-f0-9]{40}$")) and
                (.namespace | type == "string" and test("^hf-upgrade-[0-9]{1,12}$")) and
                (.buildID | type == "string" and test("^[0-9]+$"))' "${state_file}" >/dev/null; then
            echo "ERROR: upgrade suite recovery state is invalid or oversized" >&2
            exit 1
        fi
        if [[ ! -f "${shared_receipt}" ]]; then
            echo "ERROR: upgrade suite cleanup receipt is missing" >&2
            exit 1
        fi
        if ! receipt_bytes="$(wc -c < "${shared_receipt}")" || (( receipt_bytes > 131072 )); then
            echo "ERROR: upgrade suite cleanup receipt is unreadable or oversized" >&2
            exit 1
        fi
        operator_commit="$(jq -r '.operatorCommit' "${state_file}")"
        upgrade_namespace="$(jq -r '.namespace' "${state_file}")"
        namespace_suffix="$(jq -r '.buildID' "${state_file}")"
        if (( ${#namespace_suffix} > 12 )); then
            namespace_suffix="${namespace_suffix: -12}"
        fi
        if [[ "${upgrade_namespace}" != "hf-upgrade-${namespace_suffix}" ]]; then
            echo "ERROR: upgrade namespace does not match the recorded build" >&2
            exit 1
        fi
        if ! jq -e --arg namespace "${upgrade_namespace}" \
            '(.runID | type == "string" and length > 0) and
             (.namespace == $namespace) and
             (.cleaned | type == "boolean")' "${shared_receipt}" >/dev/null; then
            echo "ERROR: upgrade suite cleanup receipt is invalid" >&2
            exit 1
        fi

        run_dir="$(mktemp -d /tmp/hyperfleet-operator-upgrade-cleanup.XXXXXX)"
        evidence_dir="${run_dir}/evidence"
        mkdir -p "${evidence_dir}"
        cp "${shared_receipt}" "${evidence_dir}/cleanup.json"
        status=0
        if ! jq -e '.cleaned == true' "${evidence_dir}/cleanup.json" >/dev/null; then
            if [[ ! -f "${KUBECONFIG:-}" ]]; then
                echo "ERROR: cleanup needs the claimed cluster kubeconfig" >&2
                status=1
            else
                KUBECONFIG="$(realpath "${KUBECONFIG}")"
                export KUBECONFIG
                export ARTIFACT_DIR="${evidence_dir}"
                export GOTOOLCHAIN=go1.26.0
                export GOCACHE="${run_dir}/go-cache"
                export GOMODCACHE="${run_dir}/go-mod"
                mkdir -p "${GOCACHE}" "${GOMODCACHE}"
                operator_dir="${run_dir}/operator"
                if ! git init -q "${operator_dir}" ||
                    ! git -C "${operator_dir}" remote add origin https://github.com/openshift-hyperfleet/hyperfleet-operator.git ||
                    ! git -C "${operator_dir}" fetch -q --depth 1 origin "${operator_commit}" ||
                    ! git -C "${operator_dir}" checkout -q --detach FETCH_HEAD ||
                    [[ "$(git -C "${operator_dir}" rev-parse HEAD)" != "${operator_commit}" ]] ||
                    ! (cd "${operator_dir}" && make cleanup-e2e-upgrade); then
                    echo "ERROR: UID-bound cleanup failed; retain the receipt for investigation" >&2
                    status=1
                fi
            fi
        fi

        if ! cp -a "${evidence_dir}/." "${prow_artifact_dir}/"; then
            echo "ERROR: could not archive final upgrade cleanup receipt" >&2
            status=1
        fi
        exit "${status}"
      from: src
      grace_period: 5m0s
      resources:
        limits:
          memory: 4Gi
        requests:
          cpu: "1"
          memory: 2Gi
      timeout: 45m0s
    - chain: gather
    test:
    - as: openshift-hyperfleet-operator-upgrade-test
      cli: latest
      commands: |-
        #!/usr/bin/env bash
        # Gangway POST target: https://gangway-ci.apps.ci.l2s4.p1.openshiftapps.com/v1/executions/
        # periodic-ci-openshift-hyperfleet-hyperfleet-operator-main-rc-upgrade-rc-olm-upgrade
        # Use an app.ci bearer token and {"job_execution_type":"1","pod_spec_options":{"envs":{...}}}.
        # Supply the nine MULTISTAGE_PARAM_OVERRIDE_* inputs declared below. See the
        # hyperfleet-release trigger-rc-e2e.sh for the request pattern; that script
        # currently targets the Helm E2E job and does not trigger this upgrade job.
        set -euo pipefail
        set +x
        umask 077

        : "${SHARED_DIR:?SHARED_DIR is required}"
        : "${ARTIFACT_DIR:?ARTIFACT_DIR is required}"
        : "${BUILD_ID:?BUILD_ID is required}"
        [[ "${BUILD_ID}" =~ ^[0-9]+$ ]] || {
            echo "ERROR: BUILD_ID must be numeric" >&2
            exit 1
        }

        prow_artifact_dir="${ARTIFACT_DIR}"
        run_dir="$(mktemp -d /tmp/hyperfleet-operator-upgrade.XXXXXX)"
        evidence_dir="${run_dir}/evidence"
        mkdir -p "${evidence_dir}" "${prow_artifact_dir}"

        finish() {
            local status=$?
            trap - EXIT
            set +e
            if [[ -n "${qualified_dir:-}" && "${qualified_dir}" == /tmp/hyperfleet-upgrade-fixtures.* ]]; then
                rm -rf -- "${qualified_dir}"
            fi
            if (( status != 0 )) && [[ ! -s "${evidence_dir}/junit-upgrade.xml" ]]; then
                cat > "${evidence_dir}/junit-upgrade.xml" <<'XML'
        <?xml version="1.0" encoding="UTF-8"?>
        <testsuite name="hyperfleet-operator-upgrade-preflight" tests="1" failures="1">
          <testcase name="prepare-and-run">
            <failure message="Upgrade job failed before the suite wrote JUnit; inspect the step log."/>
          </testcase>
        </testsuite>
        XML
            fi
            # SHARED_DIR transfers only flat, bounded files between step pods.
            if [[ -f "${evidence_dir}/cleanup.json" ]]; then
                if ! receipt_bytes="$(wc -c < "${evidence_dir}/cleanup.json")" ||
                    (( receipt_bytes > 131072 )) ||
                    ! cp "${evidence_dir}/cleanup.json" "${SHARED_DIR}/hyperfleet-operator-upgrade-cleanup.json"; then
                    echo "ERROR: could not transfer the bounded cleanup receipt" >&2
                    (( status != 0 )) || status=1
                fi
            fi
            if ! cp -a "${evidence_dir}/." "${prow_artifact_dir}/"; then
                echo "ERROR: could not archive upgrade evidence from test step" >&2
                (( status != 0 )) || status=1
            fi
            exit "${status}"
        }
        trap finish EXIT

        require_input() {
            local name="$1"
            [[ -n "${!name:-}" ]] || {
                echo "ERROR: missing required Gangway input: ${name}" >&2
                exit 1
            }
        }

        for name in \
            MULTISTAGE_PARAM_OVERRIDE_OPERATOR_COMMIT \
            MULTISTAGE_PARAM_OVERRIDE_QUALIFICATION_COMMIT \
            MULTISTAGE_PARAM_OVERRIDE_QUALIFICATION_DIR \
            MULTISTAGE_PARAM_OVERRIDE_FROM_BUNDLE \
            MULTISTAGE_PARAM_OVERRIDE_TO_BUNDLE \
            MULTISTAGE_PARAM_OVERRIDE_CATALOG_IMAGE \
            MULTISTAGE_PARAM_OVERRIDE_OLM_CHANNEL \
            MULTISTAGE_PARAM_OVERRIDE_POSTGRES_IMAGE \
            MULTISTAGE_PARAM_OVERRIDE_RABBITMQ_IMAGE; do
            require_input "${name}"
        done

        for name in MULTISTAGE_PARAM_OVERRIDE_OPERATOR_COMMIT MULTISTAGE_PARAM_OVERRIDE_QUALIFICATION_COMMIT; do
            [[ "${!name}" =~ ^[a-f0-9]{40}$ ]] || {
                echo "ERROR: ${name} must be a full lowercase Git SHA" >&2
                exit 1
            }
        done
        for name in \
            MULTISTAGE_PARAM_OVERRIDE_FROM_BUNDLE \
            MULTISTAGE_PARAM_OVERRIDE_TO_BUNDLE \
            MULTISTAGE_PARAM_OVERRIDE_CATALOG_IMAGE \
            MULTISTAGE_PARAM_OVERRIDE_POSTGRES_IMAGE \
            MULTISTAGE_PARAM_OVERRIDE_RABBITMQ_IMAGE; do
            [[ "${!name}" =~ ^[a-z0-9][a-z0-9./:_-]*@sha256:[a-f0-9]{64}$ ]] || {
                echo "ERROR: ${name} must be a digest-pinned image reference" >&2
                exit 1
            }
        done
        [[ "${MULTISTAGE_PARAM_OVERRIDE_OLM_CHANNEL}" =~ ^[a-z0-9][a-z0-9._-]*$ ]] || {
            echo "ERROR: OLM channel contains invalid characters" >&2
            exit 1
        }
        [[ -f "${KUBECONFIG:-}" ]] || {
            echo "ERROR: the claimed cluster did not provide an explicit kubeconfig" >&2
            exit 1
        }
        KUBECONFIG="$(realpath "${KUBECONFIG}")"
        export KUBECONFIG
        oc get crd clusterserviceversions.operators.coreos.com >/dev/null
        oc get crd catalogsources.operators.coreos.com >/dev/null

        fetch_commit() {
            local repo="$1" commit="$2" destination="$3"
            git init -q "${destination}"
            git -C "${destination}" remote add origin "https://github.com/openshift-hyperfleet/${repo}.git"
            git -C "${destination}" fetch -q --depth 1 origin "${commit}"
            git -C "${destination}" checkout -q --detach FETCH_HEAD
            [[ "$(git -C "${destination}" rev-parse HEAD)" == "${commit}" ]] || {
                echo "ERROR: fetched ${repo} revision differs from requested commit" >&2
                exit 1
            }
        }

        operator_dir="${run_dir}/operator"
        release_dir="${run_dir}/release"
        fetch_commit hyperfleet-operator "${MULTISTAGE_PARAM_OVERRIDE_OPERATOR_COMMIT}" "${operator_dir}"
        fetch_commit hyperfleet-release "${MULTISTAGE_PARAM_OVERRIDE_QUALIFICATION_COMMIT}" "${release_dir}"

        qualification_dir="${MULTISTAGE_PARAM_OVERRIDE_QUALIFICATION_DIR}"
        [[ "${qualification_dir}" =~ ^[a-zA-Z0-9_./-]+$ && "${qualification_dir}" != /* ]] || {
            echo "ERROR: qualification directory must be a repository-relative path" >&2
            exit 1
        }
        qualification_path="$(realpath "${release_dir}/${qualification_dir}")"
        [[ "${qualification_path}" == "${release_dir}/"* && -d "${qualification_path}" ]] || {
            echo "ERROR: qualification directory is missing or outside hyperfleet-release" >&2
            exit 1
        }
        [[ -f "${qualification_path}/scenario.yaml" && -f "${qualification_path}/fixtures.template.yaml" ]] || {
            echo "ERROR: qualification must contain scenario.yaml and fixtures.template.yaml" >&2
            exit 1
        }

        qualified_dir="$(mktemp -d /tmp/hyperfleet-upgrade-fixtures.XXXXXX)"
        cp -a "${qualification_path}/." "${qualified_dir}/"
        export UPGRADE_SCENARIO="${qualified_dir}/scenario.yaml"
        export UPGRADE_POSTGRES_IMAGE="${MULTISTAGE_PARAM_OVERRIDE_POSTGRES_IMAGE}"
        export UPGRADE_RABBITMQ_IMAGE="${MULTISTAGE_PARAM_OVERRIDE_RABBITMQ_IMAGE}"
        python3 - "${UPGRADE_SCENARIO}" "${qualified_dir}/fixtures.template.yaml" "${qualified_dir}/fixtures.yaml" <<'PY'
        import os
        import pathlib
        import re
        import secrets
        import sys
        import yaml

        scenario = pathlib.Path(sys.argv[1]).read_text()
        try:
            decoded = yaml.safe_load(scenario)
        except yaml.YAMLError:
            raise SystemExit("ERROR: invalid scenario YAML") from None
        if not isinstance(decoded, dict) or decoded.get("fixtures") != "fixtures.yaml":
            raise SystemExit("ERROR: scenario must reference fixtures.yaml beside itself")
        if re.search(r"\${[^}]+\}", scenario):
            raise SystemExit("ERROR: release-qualified scenario still contains placeholders")

        template = pathlib.Path(sys.argv[2]).read_text()
        replacements = {
            "UPGRADE_POSTGRES_IMAGE": os.environ["UPGRADE_POSTGRES_IMAGE"],
            "UPGRADE_RABBITMQ_IMAGE": os.environ["UPGRADE_RABBITMQ_IMAGE"],
            "UPGRADE_DB_PASSWORD": secrets.token_hex(24),
            "UPGRADE_BROKER_PASSWORD": secrets.token_hex(24),
        }
        tokens = set(re.findall(r"\${([A-Z0-9_]+)\}", template))
        if tokens != set(replacements):
            raise SystemExit("ERROR: fixture template must use exactly the four documented placeholders")
        for name, value in replacements.items():
            template = template.replace("${" + name + "}", value)
        if re.search(r"\${[^}]+\}", template):
            raise SystemExit("ERROR: fixture template contains unresolved placeholders")
        output = pathlib.Path(sys.argv[3])
        fd = os.open(output, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
        with os.fdopen(fd, "w") as stream:
            stream.write(template)
        PY
        rm -f "${qualified_dir}/fixtures.template.yaml"

        export UPGRADE_FROM_BUNDLE="${MULTISTAGE_PARAM_OVERRIDE_FROM_BUNDLE}"
        export UPGRADE_TO_BUNDLE="${MULTISTAGE_PARAM_OVERRIDE_TO_BUNDLE}"
        export OLM_CATALOG_IMAGE="${MULTISTAGE_PARAM_OVERRIDE_CATALOG_IMAGE}"
        export OLM_CHANNEL="${MULTISTAGE_PARAM_OVERRIDE_OLM_CHANNEL}"
        namespace_suffix="${BUILD_ID}"
        if (( ${#namespace_suffix} > 12 )); then
            namespace_suffix="${namespace_suffix: -12}"
        fi
        export UPGRADE_NAMESPACE="hf-upgrade-${namespace_suffix}"
        export ARTIFACT_DIR="${evidence_dir}"
        export GOTOOLCHAIN=go1.26.0
        export GOCACHE="${run_dir}/go-cache"
        export GOMODCACHE="${run_dir}/go-mod"
        mkdir -p "${GOCACHE}" "${GOMODCACHE}"
        if [[ -z "${REGISTRY_AUTH_FILE:-}" && -f "${CLUSTER_PROFILE_DIR:-}/pull-secret" ]]; then
            export REGISTRY_AUTH_FILE="${CLUSTER_PROFILE_DIR}/pull-secret"
        fi

        cat > "${evidence_dir}/inputs.json" <<JSON
        {
          "operatorCommit": "${MULTISTAGE_PARAM_OVERRIDE_OPERATOR_COMMIT}",
          "qualificationCommit": "${MULTISTAGE_PARAM_OVERRIDE_QUALIFICATION_COMMIT}",
          "qualificationDirectory": "${qualification_dir}",
          "fromBundle": "${UPGRADE_FROM_BUNDLE}",
          "toBundle": "${UPGRADE_TO_BUNDLE}",
          "catalogImage": "${OLM_CATALOG_IMAGE}",
          "channel": "${OLM_CHANNEL}",
          "postgresImage": "${UPGRADE_POSTGRES_IMAGE}",
          "rabbitmqImage": "${UPGRADE_RABBITMQ_IMAGE}",
          "buildID": "${BUILD_ID}"
        }
        JSON
        sha256sum "${UPGRADE_SCENARIO}" "${qualification_path}/fixtures.template.yaml" \
            > "${evidence_dir}/qualification-sha256.txt"
        go version > "${evidence_dir}/go-version.txt"
        podman --version > "${evidence_dir}/podman-version.txt"
        podman info >/dev/null
        [[ -n "${NAMESPACE:-}" && -n "${HOSTNAME:-}" ]] || {
            echo "ERROR: CI pod identity is required to record the runner image digest" >&2
            exit 1
        }
        env -u KUBECONFIG oc get pod "${HOSTNAME}" -n "${NAMESPACE}" -o json \
            | jq -e '[.status.containerStatuses[]? | {name, imageID}] |
                select(any(.[]; (.imageID // "") | test("sha256:[a-f0-9]{64}")))' \
            > "${evidence_dir}/runner-images.json"

        jq -n --arg commit "${MULTISTAGE_PARAM_OVERRIDE_OPERATOR_COMMIT}" \
            --arg namespace "${UPGRADE_NAMESPACE}" --arg buildID "${BUILD_ID}" \
            '{operatorCommit: $commit, namespace: $namespace, buildID: $buildID}' \
            > "${SHARED_DIR}/hyperfleet-operator-upgrade-state.json"
        touch "${SHARED_DIR}/hyperfleet-operator-upgrade-suite-invoked"
        cd "${operator_dir}"
        make test-e2e-upgrade
      env:
      - default: ""
        documentation: Full Git commit that produced the target RC bundle and whose
          upgrade suite is run.
        name: MULTISTAGE_PARAM_OVERRIDE_OPERATOR_COMMIT
      - default: ""
        documentation: Full hyperfleet-release Git commit containing the qualified
          scenario and fixture template.
        name: MULTISTAGE_PARAM_OVERRIDE_QUALIFICATION_COMMIT
      - default: ""
        documentation: Directory inside that hyperfleet-release commit containing
          scenario.yaml and fixtures.template.yaml.
        name: MULTISTAGE_PARAM_OVERRIDE_QUALIFICATION_DIR
      - default: ""
        documentation: Digest-pinned official previous-final operator bundle.
        name: MULTISTAGE_PARAM_OVERRIDE_FROM_BUNDLE
      - default: ""
        documentation: Digest-pinned target RC operator bundle.
        name: MULTISTAGE_PARAM_OVERRIDE_TO_BUNDLE
      - default: ""
        documentation: Digest-pinned catalog containing both bundles and their direct
          replacement edge.
        name: MULTISTAGE_PARAM_OVERRIDE_CATALOG_IMAGE
      - default: ""
        documentation: Channel containing the selected direct replacement edge.
        name: MULTISTAGE_PARAM_OVERRIDE_OLM_CHANNEL
      - default: ""
        documentation: Digest-pinned PostgreSQL fixture image qualified on the claimed
          OpenShift cluster.
        name: MULTISTAGE_PARAM_OVERRIDE_POSTGRES_IMAGE
      - default: ""
        documentation: Digest-pinned RabbitMQ fixture image qualified on the claimed
          OpenShift cluster.
        name: MULTISTAGE_PARAM_OVERRIDE_RABBITMQ_IMAGE
      from: src
      grace_period: 5m0s
      nested_podman: true
      resources:
        limits:
          memory: 8Gi
        requests:
          cpu: "2"
          memory: 4Gi
      timeout: 2h45m0s
    workflow: generic-claim
  timeout: 6h0m0s
zz_generated_metadata:
  branch: main
  org: openshift-hyperfleet
  repo: hyperfleet-operator
  variant: rc-upgrade
