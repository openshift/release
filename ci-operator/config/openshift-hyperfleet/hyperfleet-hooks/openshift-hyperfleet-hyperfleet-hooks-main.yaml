build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-5.0
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: |
    export HOME=/tmp
    export GOFLAGS=-mod=readonly
    make lint
  container:
    from: src
- as: unit
  commands: |
    export HOME=/tmp
    export GOFLAGS=-mod=readonly
    make test
  container:
    from: src
- as: verify-hooks
  commands: |
    export HOME=/tmp
    make verify-hooks
  container:
    from: src
  run_if_changed: ^(\.pre-commit-config\.yaml|Makefile|scripts/)
- as: validate-commits
  steps:
    test:
    - ref: hyperfleet-commitlint
zz_generated_metadata:
  branch: main
  org: openshift-hyperfleet
  repo: hyperfleet-hooks
