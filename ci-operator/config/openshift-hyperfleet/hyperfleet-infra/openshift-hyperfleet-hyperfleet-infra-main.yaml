build_root:
  project_image:
    dockerfile_literal: |-
      FROM registry.access.redhat.com/ubi9/ubi
      ARG HELM_VERSION=v3.21.0
      ARG TERRAFORM_VERSION=1.9.8
      ARG KUBECTL_VERSION=v1.32.3
      ARG HELM_GIT_VERSION=v1.5.2
      ARG HELM_DIFF_VERSION=3.15.7
      ARG SHELLCHECK_VERSION=v0.10.0
      ARG HELMFILE_VERSION=1.5.2
      RUN yum -y install --setopt=skip_missing_names_on_install=False \
              git \
              make \
              jq \
              diffutils \
              unzip \
              xz \
          && yum clean all && rm -rf /var/cache/yum \
          && curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar -xJf - -C /tmp \
          && mv /tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck /usr/local/bin/ \
          && chmod 755 /usr/local/bin/shellcheck \
          && curl -fsSL "https://raw.githubusercontent.com/helm/helm/${HELM_VERSION}/scripts/get-helm-3" | DESIRED_VERSION=${HELM_VERSION} bash \
          && curl -fsSL -o /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip" \
          && unzip -o /tmp/terraform.zip -d /usr/local/bin/ \
          && curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" \
          && chmod 755 /usr/local/bin/kubectl \
          && curl -fsSL "https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}/helmfile_${HELMFILE_VERSION}_linux_amd64.tar.gz" | tar -xzf - -C /tmp \
          && mv /tmp/helmfile /usr/local/bin/helmfile \
          && chmod 755 /usr/local/bin/helmfile \
          && rm -rf /tmp/*
      RUN mkdir -p /tmp/helm-home && chmod 777 /tmp/helm-home
      ENV HOME=/tmp/helm-home \
          HELM_CACHE_HOME=/tmp/helm-home/.cache/helm \
          HELM_CONFIG_HOME=/tmp/helm-home/.config/helm \
          HELM_DATA_HOME=/tmp/helm-home/.local/share/helm \
          HELM_PLUGINS=/usr/local/share/helm/plugins
      RUN helm plugin install https://github.com/aslafy-z/helm-git --version ${HELM_GIT_VERSION}
      RUN helm plugin install https://github.com/databus23/helm-diff --version ${HELM_DIFF_VERSION}
      RUN curl -fsSL "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz" | tar -xzf - -C /opt \
          && /opt/google-cloud-sdk/install.sh \
              --quiet \
              --path-update=false \
              --usage-reporting=false \
          && /opt/google-cloud-sdk/bin/gcloud components install gke-gcloud-auth-plugin --quiet \
          && rm -rf /opt/google-cloud-sdk/.install/.backup
      RUN chmod -R 777 /tmp/helm-home
      ENV PATH="/opt/google-cloud-sdk/bin:${PATH}" \
          USE_GKE_GCLOUD_AUTH_PLUGIN=True
prowgen:
  enable_secrets_store_csi_driver: true
  expose: true
  private: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: validate
  steps:
    test:
    - as: run-validation
      commands: |
        make ci-dry-run
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 300Mi
- as: integration
  optional: true
  steps:
    post:
    - as: cleanup
      best_effort: true
      commands: |
        set -uo pipefail

        # --- GCP Auth ---
        GCP_CREDENTIALS_FILE="/var/run/hyperfleet-e2e/hcm-hyperfleet-e2e.json"
        export GOOGLE_APPLICATION_CREDENTIALS="$GCP_CREDENTIALS_FILE"
        PROJECT_ID=$(jq -r .project_id "$GCP_CREDENTIALS_FILE")
        gcloud auth activate-service-account --key-file="$GCP_CREDENTIALS_FILE"
        gcloud config set project "$PROJECT_ID"

        # --- Generate ephemeral cluster config ---
        CI_ID="${BUILD_ID:(-8)}"
        TF_DIR="terraform"

        # Render ci-<id>.tfvars and .tfbackend from the CI templates in hyperfleet-infra
        make ci-tf-env CI_ID="${CI_ID}"

        # Retrieve cluster credentials for uninstall
        (cd "$TF_DIR" && terraform init -backend-config="envs/gke/ci-${CI_ID}.tfbackend") || true
        eval $(cd "$TF_DIR" && terraform output -raw connect_command) || true

        # --- Cleanup ---
        # Uninstall maestro before destroying the cluster
        # Tolerate failure in case the cluster isn't reachable
        # (e.g. setup was aborted before provisioning finished).
        make uninstall-maestro || true

        # Only drop the GCS state once destroy succeeded, otherwise keep it
        # so the cluster can still be destroyed by hand.
        if make destroy-terraform TF_ENV="ci-${CI_ID}"; then
          gsutil rm -r "gs://hyperfleet-terraform-state/ci/infra/${CI_ID}" || true
        else
          echo "destroy-terraform failed, keeping gs://hyperfleet-terraform-state/ci/infra/${CI_ID} for a manual destroy"
        fi
      credentials:
      - collection: hyperfleet
        group: hyperfleet-e2e
        mount_path: /var/run/hyperfleet-e2e
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 300Mi
      timeout: 15m0s
    pre:
    - as: setup
      commands: |
        set -euo pipefail

        # --- GCP Auth ---
        GCP_CREDENTIALS_FILE="/var/run/hyperfleet-e2e/hcm-hyperfleet-e2e.json"
        export GOOGLE_APPLICATION_CREDENTIALS="$GCP_CREDENTIALS_FILE"
        PROJECT_ID=$(jq -r .project_id "$GCP_CREDENTIALS_FILE")
        gcloud auth activate-service-account --key-file="$GCP_CREDENTIALS_FILE"
        gcloud config set project "$PROJECT_ID"

        # --- Generate ephemeral cluster config ---
        CI_ID="${BUILD_ID:(-8)}"

        # Render ci-<id>.tfvars and .tfbackend from the CI templates in hyperfleet-infra
        make ci-tf-env CI_ID="${CI_ID}"

        # --- Run terraform apply ---
        cd terraform
        terraform init -backend-config="envs/gke/ci-${CI_ID}.tfbackend"
        terraform apply -var-file="envs/gke/ci-${CI_ID}.tfvars" -auto-approve -lock=false &

        # Forward SIGTERM to terraform so it can save state to GCS on job abort.
        # Without this, bash exits on SIGTERM without notifying terraform, and
        # terraform gets SIGKILLed with no state saved, preventing cleanup.
        TF_PID=$!
        trap 'echo "SIGTERM received, forwarding to terraform (PID $TF_PID)..."; kill -TERM "$TF_PID" 2>/dev/null || true' TERM INT
        set +e
        wait "$TF_PID"; rc=$?
        # wait returns early when the trap fires, keep waiting until terraform has saved state
        while kill -0 "$TF_PID" 2>/dev/null; do wait "$TF_PID"; rc=$?; done
        set -e
        exit "$rc"
      credentials:
      - collection: hyperfleet
        group: hyperfleet-e2e
        mount_path: /var/run/hyperfleet-e2e
      from: src
      grace_period: 5m0s
      resources:
        requests:
          cpu: 100m
          memory: 300Mi
      timeout: 15m0s
    test:
    - as: component-install
      commands: |
        set -euo pipefail

        # --- GCP Auth ---
        GCP_CREDENTIALS_FILE="/var/run/hyperfleet-e2e/hcm-hyperfleet-e2e.json"
        export GOOGLE_APPLICATION_CREDENTIALS="$GCP_CREDENTIALS_FILE"
        PROJECT_ID=$(jq -r .project_id "$GCP_CREDENTIALS_FILE")
        gcloud auth activate-service-account --key-file="$GCP_CREDENTIALS_FILE"
        gcloud config set project "$PROJECT_ID"

        # --- Generate ephemeral cluster config ---
        CI_ID="${BUILD_ID:(-8)}"
        TF_DIR="terraform"

        # Render ci-<id>.tfvars and .tfbackend from the CI templates in hyperfleet-infra
        make ci-tf-env CI_ID="${CI_ID}"

        # Connect to cluster
        (cd "$TF_DIR" && terraform init -backend-config="envs/gke/ci-${CI_ID}.tfbackend") || true
        eval $(cd "$TF_DIR" && terraform output -raw connect_command) || true

        # --- Run install tests ---
        make install-priority-classes install-maestro-all health-check-maestro
      credentials:
      - collection: hyperfleet
        group: hyperfleet-e2e
        mount_path: /var/run/hyperfleet-e2e
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 300Mi
      timeout: 15m0s
zz_generated_metadata:
  branch: main
  org: openshift-hyperfleet
  repo: hyperfleet-infra
