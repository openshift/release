base_images:
  upi-installer:
    name: "4.22"
    namespace: ocp
    tag: upi-installer
build_root:
  project_image:
    dockerfile_path: Containerfile.buildroot
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: scale-test
  optional: true
  steps:
    cluster_profile: openshift-org-azure
    post:
    - ref: confidential-clusters-ref-azure-cleanup
    - chain: ipi-azure-post
    test:
    - ref: confidential-clusters-ref-azure-provision
    - ref: confidential-clusters-ref-azure-scale-test
    workflow: ipi-azure
zz_generated_metadata:
  branch: main
  org: confidential-clusters
  repo: operator
  variant: azure
