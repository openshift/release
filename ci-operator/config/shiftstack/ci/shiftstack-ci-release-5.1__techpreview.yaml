base_images:
  manila-csi-driver-operator-test:
    name: "5.1"
    namespace: ocp
    tag: manila-csi-driver-operator-test
  openstack-cinder-csi-driver-operator-test:
    name: "5.1"
    namespace: ocp
    tag: openstack-cinder-csi-driver-operator-test
  openstack-installer:
    name: "5.1"
    namespace: ocp
    tag: openstack-installer
  openstack-tests:
    name: "5.1"
    namespace: ocp
    tag: openstack-tests
  stolostron:
    name: builder
    namespace: stolostron
    tag: go1.21-linux
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    candidate:
      product: ocp
      relative: 1
      stream: ci
      version: "5.1"
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "5.1"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-openstack-ovn-techpreview
  minimum_interval: 48h
  reporter_config:
    channel: '#shiftstack-bot'
    job_states_to_report:
    - failure
    - error
    report_template: ':volcano: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs> :volcano:'
  steps:
    cluster_profile: openstack-vexxhost
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      ROTATE_CLOUD_CREDENTIALS: "true"
      TEST_ARGS: --disable-monitor=termination-message-policy
      TEST_SUITE: openshift/conformance/parallel
    test:
    - ref: openshift-e2e-test
    - ref: openstack-test-openstack-ote
    workflow: openshift-e2e-openstack-ipi
- as: e2e-openstack-ovn-serial-techpreview
  minimum_interval: 48h
  reporter_config:
    channel: '#shiftstack-bot'
    job_states_to_report:
    - failure
    - error
    report_template: ':volcano: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs> :volcano:'
  steps:
    cluster_profile: openstack-vexxhost
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      ROTATE_CLOUD_CREDENTIALS: "true"
      TEST_ARGS: --disable-monitor=termination-message-policy
      TEST_SUITE: openshift/conformance/serial
    test:
    - ref: openshift-e2e-test
    - ref: openstack-test-openstack-ote
    workflow: openshift-e2e-openstack-ipi
# Temporary job to verify OCPBUGS-112483 on 5.1 (UserManaged + External DNS path).
# Not intended for long-term periodics.
- as: e2e-openstack-externallb-techpreview
  minimum_interval: 168h
  steps:
    cluster_profile: openstack-vh-bm-rhos
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      TEST_ARGS: --disable-monitor=termination-message-policy
      VERIFY_MCS_API_INT: "true"
    test:
    - ref: openstack-conf-externallb-verify
    workflow: openshift-e2e-openstack-external-lb
zz_generated_metadata:
  branch: release-5.1
  org: shiftstack
  repo: ci
  variant: techpreview
