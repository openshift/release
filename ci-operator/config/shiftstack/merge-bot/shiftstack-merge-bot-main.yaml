build_root:
  project_image:
    dockerfile_literal: |-
      FROM registry.access.redhat.com/ubi9/python-312:latest

      # Prow expects to be able to check out a repo under /go
      USER 0:0
      WORKDIR /go
      RUN chown 1001:1001 .

      USER 1001:1001
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: make install-all-deps
tests:
- as: lint
  commands: make lint
  container:
    from: test-bin
- as: unittests
  commands: make unittests
  container:
    from: test-bin
zz_generated_metadata:
  branch: main
  org: shiftstack
  repo: merge-bot
