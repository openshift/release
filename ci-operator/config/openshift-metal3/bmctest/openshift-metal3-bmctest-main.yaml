base_images:
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
  shellcheck:
    name: shellcheck
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.24-openshift-4.21
releases:
  initial:
    integration:
      name: "4.21"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.21"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: shellcheck
  commands: |
    set -x
    echo "Searching for shell scripts..."
    find . -type f -name "*.sh" -exec shellcheck -x -s bash {} \;
    echo "Shellcheck completed successfully"
  container:
    from: shellcheck
- always_run: false
  as: test-openshift-4-22
  capabilities:
  - intranet
  optional: true
  steps:
    cluster_profile: equinix-ocp-metal
    env:
      CLUSTERTYPE: lab-small
      RELEASEV: "4.22"
    post:
    - ref: ofcir-release
    pre:
    - ref: ofcir-acquire
    test:
    - ref: bmctest-openshift
zz_generated_metadata:
  branch: main
  org: openshift-metal3
  repo: bmctest
