build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-4.23
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: GOFLAGS='' make unit-test
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: red-hat-data-services
  repo: mcp-lifecycle-module-operator
