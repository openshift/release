base_images:
  base:
    name: ubi-minimal
    namespace: ocp
    tag: "8"
binary_build_commands: make build
build_root:
  image_stream_tag:
    name: builder
    namespace: stolostron
    tag: go1.18-linux
images:
  items:
  - dockerfile_path: Dockerfile
    from: base
    to: dex-operator
promotion:
  to:
  - disabled: true
    name: stable
    namespace: identitatem
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 6Gi
    requests:
      cpu: 80m
      memory: 200Mi
tests:
- as: check
  commands: make vet fmt
  container:
    from: src
- as: unit
  commands: HOME=/tmp make test
  container:
    from: src
- as: sonar-pre-submit
  commands: |
    export SELF="make -f /opt/build-harness/Makefile.prow"
    export SONAR_ORG=identitatem
    export HOME="/tmp"
    make -f /opt/build-harness/Makefile.prow sonar/go/prow
  container:
    from: src
  secrets:
  - collection: ocm-secrets
    group: acm-sonarcloud-token-ci
    mount_path: /etc/sonarcloud/
- as: sonar-post-submit
  commands: |
    export SELF="make -f /opt/build-harness/Makefile.prow"
    export SONAR_ORG=identitatem
    export HOME="/tmp"
    make -f /opt/build-harness/Makefile.prow sonar/go/prow
  container:
    from: src
  postsubmit: true
  secrets:
  - collection: ocm-secrets
    group: acm-sonarcloud-token-ci
    mount_path: /etc/sonarcloud/
- as: pr-image-mirror
  steps:
    dependencies:
      SOURCE_IMAGE_REF: dex-operator
    env:
      IMAGE_REPO: dex-operator
      REGISTRY_ORG: identitatem
    workflow: identitatem-ci-image-mirror
- as: pr-merge-image-mirror
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: dex-operator
    env:
      IMAGE_REPO: dex-operator
      REGISTRY_ORG: identitatem
    workflow: identitatem-ci-image-mirror
zz_generated_metadata:
  branch: stable
  org: identitatem
  repo: dex-operator
