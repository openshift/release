build_root:
  project_image:
    dockerfile_path: ci/build-root/Dockerfile
prowgen:
  disable_sparse_checkout: true
  enable_secrets_store_csi_driver: true
  expose: true
  private: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: make lint
  container:
    from: src
- as: validate
  run_if_changed: ^(terraform|hcp-terraform)/
  steps:
    test:
    - as: validate
      commands: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global credential.helper '!f() {
          if [ "$1" = "get" ]; then
            host="" proto=""
            while IFS= read -r line; do
              [ -z "$line" ] && break
              case "$line" in
                host=*) host="${line#host=}" ;;
                protocol=*) proto="${line#protocol=}" ;;
              esac
            done
            if [ "$proto" = "https" ] && [ "$host" = "github.com" ]; then
              echo "username=x-access-token"
              echo "password=$(cat /etc/github-private/oauth)"
            else
              exit 1
            fi
          fi
        }; f'
        umask 077
        cat > "$HOME/.terraformrc" <<TFRC
        credentials "app.terraform.io" {
          token = "$(cat /etc/terraform-cloud/token)"
        }
        TFRC
        export TF_PLUGIN_CACHE_DIR="${TMPDIR:-/tmp}/terraform-plugin-cache"
        mkdir -p "${TF_PLUGIN_CACHE_DIR}"
        if [ "${REPO_OWNER}/${REPO_NAME}" != "app-sre/infra" ]; then
          echo "Skipping validate: job context is not app-sre/infra"
          exit 0
        fi
        # Credentials are mounted here, so the tooling that drives Terraform is
        # restored from the trusted base revision. Without this a pull request
        # could simply edit hack/lint.sh or the Makefile to read the token. The
        # Terraform configuration under test stays as the PR wrote it.
        git checkout "${PULL_BASE_SHA}" -- Makefile hack/
        make validate
      credentials:
      - as: oauth
        collection: test-platform-infra
        field: private-git-cloner
        group: openshift-ci-robot
        mount_path: /etc/github-private
      - collection: app-sre-infra-terraform-cloud
        group: tfcloud-token
        mount_path: /etc/terraform-cloud
      from: src
      resources:
        requests:
          cpu: "4"
          memory: 4Gi
- as: terraform-plan
  run_if_changed: ^(terraform|hcp-terraform)/
  steps:
    test:
    - as: plan
      commands: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global credential.helper '!f() {
          if [ "$1" = "get" ]; then
            host="" proto=""
            while IFS= read -r line; do
              [ -z "$line" ] && break
              case "$line" in
                host=*) host="${line#host=}" ;;
                protocol=*) proto="${line#protocol=}" ;;
              esac
            done
            if [ "$proto" = "https" ] && [ "$host" = "github.com" ]; then
              echo "username=x-access-token"
              echo "password=$(cat /etc/github-private/oauth)"
            else
              exit 1
            fi
          fi
        }; f'
        umask 077
        cat > "$HOME/.terraformrc" <<TFRC
        credentials "app.terraform.io" {
          token = "$(cat /etc/terraform-cloud/token)"
        }
        TFRC
        export TF_PLUGIN_CACHE_DIR="${TMPDIR:-/tmp}/terraform-plugin-cache"
        mkdir -p "${TF_PLUGIN_CACHE_DIR}"
        # Never execute fork-controlled Makefile or planner code with
        # credentials: the base revision is trusted, and the planner itself
        # refuses pull requests whose author is not an organization member or
        # repository collaborator before Terraform is invoked.
        if [ "${REPO_OWNER}/${REPO_NAME}" != "app-sre/infra" ]; then
          echo "Skipping plan: job context is not app-sre/infra"
          exit 0
        fi
        set -o pipefail
        # -I (isolated) is required, not cosmetic: for `python3 -`, CPython sets
        # sys.path[0] to the working directory, which is the PR checkout. A
        # PR-added json.py (or any other stdlib name) at the repository root
        # would then be imported by the trusted planner and execute before any
        # of its checks ran.
        git show "${PULL_BASE_SHA}:hack/tfc-speculative-plan.py" | python3 -I -
      credentials:
      - as: oauth
        collection: test-platform-infra
        field: private-git-cloner
        group: openshift-ci-robot
        mount_path: /etc/github-private
      - collection: app-sre-infra-terraform-cloud
        group: tfcloud-token
        mount_path: /etc/terraform-cloud
      from: src
      resources:
        requests:
          cpu: "2"
          memory: 2Gi
zz_generated_metadata:
  branch: main
  org: app-sre
  repo: infra
