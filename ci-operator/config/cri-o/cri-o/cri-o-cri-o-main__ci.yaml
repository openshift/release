base_images:
  base:
    name: gcloud-base
    namespace: cri-o
    tag: latest
binary_build_commands: "echo \"no build commands\" \n"
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-5.0
images:
  items:
  - dockerfile_literal: |
      FROM base
      COPY . /workdir
    from: base
    to: crio-crio-base-src
  skip_if_only_changed: ^(?:docs|tutorials|logo|\.github)/|\.md$|^(?:\.gitignore|OWNERS|OWNERS_ALIASES|SECURITY_CONTACTS|PROJECT|LICENSE)$
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: "echo \"no test commands\" \n"
tests:
- always_run: false
  as: fedora-critest
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-fedora-critest
- as: fedora-integration
  skip_if_only_changed: ^(?:docs|tutorials|logo|\.github)/|\.md$|^(?:\.gitignore|OWNERS|OWNERS_ALIASES|SECURITY_CONTACTS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-fedora-integration
- as: fedora-integration-kata
  run_if_changed: ^(?:internal/oci/|internal/config/|internal/runtimehandlerhooks/|test/kata|contrib/test/ci/|scripts/versions$|go\.mod$|vendor/)
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-fedora-kata
- as: rhel-critest
  skip_if_only_changed: ^(?:docs|tutorials|logo|\.github)/|\.md$|^(?:\.gitignore|OWNERS|OWNERS_ALIASES|SECURITY_CONTACTS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-rhel-critest
- as: rhel-e2e
  skip_if_only_changed: ^(?:docs|tutorials|logo|\.github)/|\.md$|^(?:\.gitignore|OWNERS|OWNERS_ALIASES|SECURITY_CONTACTS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-e2e
zz_generated_metadata:
  branch: main
  org: cri-o
  repo: cri-o
  variant: ci
