base_images:
  base:
    name: gcloud-base
    namespace: cri-o
    tag: latest
binary_build_commands: "echo \"no build commands\" \n"
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-5.0
images:
  items:
  - dockerfile_literal: |
      FROM base
      COPY . /workdir
    from: base
    to: crio-crio-base-src
  skip_if_only_changed: ^(?:docs|tutorials|logo|\.github)/|\.md$|^(?:\.gitignore|OWNERS|OWNERS_ALIASES|SECURITY_CONTACTS|PROJECT|LICENSE)$
releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: "echo \"no test commands\" \n"
tests:
- as: fedora-critest
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-fedora-critest
- as: fedora-integration
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-fedora-integration
- as: fedora-integration-kata
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-fedora-kata
- as: rhel-critest
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-rhel-critest
- always_run: false
  as: gcp-pool-aws-sts-check
  cluster: build07
  optional: true
  restrict_network_access: true
  steps:
    cluster_profile: openshift-org-gcp
    test:
    - as: check-aws-sts-mounts
      from: base
      commands: |
        set -euo pipefail
        echo "Leased GCP profile: ${CLUSTER_PROFILE_NAME:?}"
        if [[ ! -s /var/run/secrets/aws/config/config || ! -s /var/run/secrets/aws/sts-token/token ]]; then
          echo "The leased GCP profile did not provide the AWS STS config and token needed by the AWS workflow." >&2
          exit 1
        fi
        echo "The leased GCP profile provided both AWS STS mounts."
        case "$CLUSTER_PROFILE_NAME" in
          gcp)
            project=openshift-gce-devel-ci
            provisioner=do-not-delete-ci-provisioner
            ;;
          gcp-openshift-gce-devel-ci-2)
            project=openshift-gce-devel-ci-2
            provisioner=ci-provisioner-2
            ;;
          gcp-3)
            project=openshift-gce-devel-ci-3
            provisioner=ci-provisioner
            ;;
          *)
            echo "Unexpected GCP profile: $CLUSTER_PROFILE_NAME" >&2
            exit 1
            ;;
        esac
        if [[ "$project" != "$(<"${CLUSTER_PROFILE_DIR:?}/openshift_gcp_project")" ]]; then
          echo "Leased GCP profile and project do not match." >&2
          exit 1
        fi

        scratch=$(mktemp -d)
        trap 'rm -rf -- "$scratch"' EXIT
        export AWS_CONFIG_FILE=/var/run/secrets/aws/config/config
        export AWS_SHARED_CREDENTIALS_FILE=/dev/null AWS_EC2_METADATA_DISABLED=true
        export AWS_REGION=us-east-1 AWS_DEFAULT_REGION=us-east-1 AWS_PAGER=""
        unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_SECURITY_TOKEN
        unset AWS_ROLE_ARN AWS_WEB_IDENTITY_TOKEN_FILE GOOGLE_APPLICATION_CREDENTIALS
        unset CLOUDSDK_AUTH_ACCESS_TOKEN CLOUDSDK_AUTH_ACCESS_TOKEN_FILE
        export CLOUDSDK_CONFIG="$scratch/gcloud"
        aws_cli=$(command -v aws || true)
        if [[ -z "$aws_cli" ]] || ! "$aws_cli" configure export-credentials help >/dev/null 2>&1; then
          curl -fsSL --retry 3 https://awscli.amazonaws.com/awscli-exe-linux-x86_64-2.32.0.zip -o "$scratch/aws.zip"
          echo "2e57ed5587de3789d39841c0f309134ccc13a215af597c7739f7102deca30dad  $scratch/aws.zip" | sha256sum -c -
          python3 -m zipfile -e "$scratch/aws.zip" "$scratch"
          aws_cli="$scratch/aws/dist/aws"
          chmod +x "$aws_cli"
        fi
        caller=$("$aws_cli" sts get-caller-identity --profile hub --query Arn --output text)
        if [[ "$caller" != arn:aws:sts::320297955214:assumed-role/ci-step-runner-hub/* ]]; then
          echo "The AWS hub profile resolved to an unexpected role." >&2
          exit 1
        fi

        gcloud iam workload-identity-pools create-cred-config \
          projects/263120870185/locations/global/workloadIdentityPools/ci-aws-pilot/providers/aws-ci-hub \
          --aws --service-account="$provisioner@$project.iam.gserviceaccount.com" \
          --output-file="$scratch/google-wif.json"
        export CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="$scratch/google-wif.json"
        # Pass the temporary AWS session directly to gcloud in this process.
        python3 - "$aws_cli" "$project" <<'PYTHON'
        import json
        import os
        import subprocess
        import sys

        aws_cli, project = sys.argv[1:]
        credentials = json.loads(subprocess.check_output([
            aws_cli, "configure", "export-credentials", "--profile", "hub",
        ]))
        env = os.environ.copy()
        env.update(
            AWS_ACCESS_KEY_ID=credentials["AccessKeyId"],
            AWS_SECRET_ACCESS_KEY=credentials["SecretAccessKey"],
            AWS_SESSION_TOKEN=credentials["SessionToken"],
        )
        zone = subprocess.check_output([
            "gcloud", "compute", "zones", "list", f"--project={project}",
            "--limit=1", "--format=value(name)",
        ], env=env, text=True).strip()
        if not zone:
            sys.exit("Google Cloud returned no zone.")
        print(f"Federated gcloud zone lookup passed in {project}.")
        PYTHON
      grace_period: 30s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: rhel-e2e
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-e2e
- as: rhel-e2e-conmonrs
  steps:
    cluster_profile: openshift-org-gcp
    env:
      USE_CONMONRS: "true"
    workflow: cri-o-e2e
- always_run: false
  as: rhel-e2e-evented-pleg
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      EVENTED_PLEG: "true"
    workflow: cri-o-e2e
- as: rhel-e2e-features
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-cgroupv2-e2e-features
zz_generated_metadata:
  branch: main
  org: cri-o
  repo: cri-o
  variant: ci
