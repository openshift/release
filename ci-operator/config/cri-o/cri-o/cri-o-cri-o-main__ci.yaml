base_images:
  base:
    name: gcloud-base
    namespace: cri-o
    tag: latest
binary_build_commands: "echo \"no build commands\" \n"
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-5.0
images:
  items:
  - dockerfile_literal: |
      FROM base
      COPY . /workdir
    from: base
    to: crio-crio-base-src
  skip_if_only_changed: ^(?:docs|tutorials|logo|\.github)/|\.md$|^(?:\.gitignore|OWNERS|OWNERS_ALIASES|SECURITY_CONTACTS|PROJECT|LICENSE)$
releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: "echo \"no test commands\" \n"
tests:
- as: fedora-critest
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-fedora-critest
- as: fedora-integration
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-fedora-integration
- as: fedora-integration-kata
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-fedora-kata
- as: rhel-critest
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-rhel-critest
- as: rhel-e2e
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-e2e
- as: rhel-e2e-conmonrs
  steps:
    cluster_profile: openshift-org-gcp
    env:
      USE_CONMONRS: "true"
    workflow: cri-o-e2e
- always_run: false
  as: rhel-e2e-evented-pleg
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      EVENTED_PLEG: "true"
    workflow: cri-o-e2e
- as: rhel-e2e-features
  steps:
    cluster_profile: openshift-org-gcp
    workflow: cri-o-cgroupv2-e2e-features
zz_generated_metadata:
  branch: main
  org: cri-o
  repo: cri-o
  variant: ci
