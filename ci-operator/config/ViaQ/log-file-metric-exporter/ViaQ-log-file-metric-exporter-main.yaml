build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.22
images:
  items:
  - build_args:
    - name: BUILD_VERSION
      value: v1.2.0
    dockerfile_path: Dockerfile
    to: log-file-metric-exporter
promotion:
  to:
  - name: 6.y
    namespace: logging
  - namespace: logging
    tag: v1.2.0
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    release:
      channel: stable
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: test
  commands: make test
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: ViaQ
  repo: log-file-metric-exporter
