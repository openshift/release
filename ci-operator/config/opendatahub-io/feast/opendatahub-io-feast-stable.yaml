base_images:
  tls-scanner-tool:
    name: "4.22"
    namespace: ocp
    tag: tls-scanner-tool
build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.access.redhat.com/ubi9/go-toolset:1.26
      USER 0
      RUN yum install -y --nodocs make git
      RUN ln -s /cli/oc /usr/bin/kubectl
images:
  items:
  - context_dir: .
    dockerfile_path: sdk/python/feast/infra/feature_servers/multicloud/Dockerfile.dev
    to: feast-feature-server
  - context_dir: infra/feast-operator
    dockerfile_path: Dockerfile
    to: feast-operator
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    release:
      architecture: multi
      channel: stable
      version: "4.18"
resources:
  '*':
    limits:
      memory: 6Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-in-cluster-presubmit
  steps:
    cluster_profile: aws-opendatahub
    env:
      BASE_DOMAIN: openshift-ci-aws.rhaiseng.com
      HYPERSHIFT_NODE_COUNT: "1"
      PQC_CHECK: "true"
      SCAN_NAMESPACE: feast-operator-system,test-ns-feast,test-ns-remote-registry
      SCANNER_CPU_LIMIT: "2"
      SCANNER_CPU_REQUEST: 500m
      SCANNER_MEM_LIMIT: 4Gi
      SCANNER_MEM_REQUEST: 1Gi
    test:
    - as: run-tests
      cli: latest
      commands: |
        export RUN_ON_OPENSHIFT_CI=true
        cd infra/feast-operator
        make install && make deploy IMG=${FEAST_OPERATOR_CONTROLLER_IMAGE} FS_IMG=${FEAST_FEATURE_SERVER_IMAGE}
        oc wait --for condition=Available -n feast-operator-system deployment feast-operator-controller-manager
        make test-e2e
        make undeploy IMG=${FEAST_OPERATOR_CONTROLLER_IMAGE} FS_IMG=${FEAST_FEATURE_SERVER_IMAGE}

        make test-previous-version
        oc delete deployment feast-operator-controller-manager -n feast-operator-system

        make test-upgrade
      dependencies:
      - env: FEAST_OPERATOR_CONTROLLER_IMAGE
        name: feast-operator
      - env: FEAST_FEATURE_SERVER_IMAGE
        name: feast-feature-server
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: tls-scanner-run
    workflow: hypershift-hostedcluster-workflow
- as: e2e-in-cluster-postsubmit
  postsubmit: true
  steps:
    cluster_profile: aws-opendatahub
    env:
      BASE_DOMAIN: openshift-ci-aws.rhaiseng.com
      HYPERSHIFT_NODE_COUNT: "1"
    test:
    - as: run-tests
      cli: latest
      commands: |
        export RUN_ON_OPENSHIFT_CI=true
        cd infra/feast-operator
        make install && make deploy IMG=${FEAST_OPERATOR_CONTROLLER_IMAGE} FS_IMG=${FEAST_FEATURE_SERVER_IMAGE}
        oc wait --for condition=Available -n feast-operator-system deployment feast-operator-controller-manager
        make test-e2e
        make undeploy IMG=${FEAST_OPERATOR_CONTROLLER_IMAGE} FS_IMG=${FEAST_FEATURE_SERVER_IMAGE}

        make test-previous-version
        oc delete deployment feast-operator-controller-manager -n feast-operator-system

        make test-upgrade
      dependencies:
      - env: FEAST_OPERATOR_CONTROLLER_IMAGE
        name: feast-operator
      - env: FEAST_FEATURE_SERVER_IMAGE
        name: feast-feature-server
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: hypershift-hostedcluster-workflow
zz_generated_metadata:
  branch: stable
  org: opendatahub-io
  repo: feast
