base_images:
  tls-scanner-tool:
    name: "4.22"
    namespace: ocp
    tag: tls-scanner-tool
build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.access.redhat.com/ubi9/go-toolset:1.26
      USER 0
      RUN yum install -y --nodocs make git
      RUN ln -s /cli/oc /usr/bin/kubectl
images:
  items:
  - context_dir: .
    dockerfile_path: sdk/python/feast/infra/feature_servers/multicloud/Dockerfile.dev
    to: feast-feature-server
  - context_dir: infra/feast-operator
    dockerfile_path: Dockerfile
    to: feast-operator
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    release:
      architecture: multi
      channel: stable
      version: "4.22"
resources:
  '*':
    limits:
      memory: 6Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-in-cluster-presubmit
  steps:
    cluster_profile: aws-opendatahub
    env:
      BASE_DOMAIN: openshift-ci-aws.rhaiseng.com
      COMPUTE_NODE_TYPE: m5.2xlarge
      HYPERSHIFT_AWS_REGION: us-west-2
      HYPERSHIFT_NODE_COUNT: "3"
      PQC_CHECK: "true"
      SCAN_NAMESPACE: feast-operator-system,test-ns-feast,test-ns-remote-registry
      SCANNER_CPU_LIMIT: "2"
      SCANNER_CPU_REQUEST: 500m
      SCANNER_MEM_LIMIT: 4Gi
      SCANNER_MEM_REQUEST: 1Gi
    test:
    - as: run-tests
      cli: latest
      commands: |
        # TEMPORARY DEBUG: time the registry's Kubernetes auth check for the remote pod's token
        cat > /tmp/auth_timing.py <<'PY'
        import os, time, asyncio
        from kubernetes import client, config
        from feast.permissions.auth.kubernetes_token_parser import KubernetesTokenParser
        config.load_incluster_config()
        rbac = client.RbacAuthorizationV1Api()
        t = time.time(); crbs = rbac.list_cluster_role_binding().items
        print(f"list ClusterRoleBindings: {len(crbs)} in {time.time()-t:.2f}s", flush=True)
        t = time.time()
        for c in crbs[:20]:
            rbac.read_cluster_role(name=c.role_ref.name)
        print(f"20 x read_cluster_role: {time.time()-t:.2f}s", flush=True)
        p = KubernetesTokenParser()
        for i in range(2):
            t = time.time(); u = asyncio.run(p.user_details_from_access_token(os.environ["T"]))
            print(f"full auth check #{i}: {time.time()-t:.2f}s user={u.username}", flush=True)
        PY

        # TEMPORARY DEBUG: record the remote-registry pod state while the tests run
        (
          set +e
          D="${ARTIFACT_DIR}/remote-registry-debug"
          mkdir -p "${D}"
          while true; do
            ts=$(date -u +%H%M%S)
            if oc get ns test-ns-remote-registry >/dev/null 2>&1; then
              { oc get pods,deploy -n test-ns-remote-registry -o wide; oc get events -n test-ns-remote-registry --sort-by=.lastTimestamp; } > "${D}/state-${ts}.txt" 2>&1
              oc describe pods -n test-ns-remote-registry > "${D}/describe-${ts}.txt" 2>&1
              oc logs -n test-ns-remote-registry deploy/feast-simple-feast-remote-setup --all-containers --prefix --timestamps --tail=300 > "${D}/logs-${ts}.txt" 2>&1
              oc logs -n test-ns-feast deploy/feast-simple-feast-setup -c registry --timestamps --tail=300 > "${D}/registry-server-${ts}.txt" 2>&1
              if [ -z "${timed:-}" ] && oc get sa feast-simple-feast-remote-setup -n test-ns-remote-registry >/dev/null 2>&1; then
                timed=1
                (
                  TOKEN=$(oc create token feast-simple-feast-remote-setup -n test-ns-remote-registry)
                  echo "### auth timing started at $(date -u +%H:%M:%S)"
                  oc exec -i -n test-ns-feast deploy/feast-simple-feast-setup -c registry -- env T="${TOKEN}" python - < /tmp/auth_timing.py
                  echo "### finished at $(date -u +%H:%M:%S)"
                ) > "${D}/auth-timing.txt" 2>&1 &
              fi
            fi
            sleep 30
          done
        ) &

        export RUN_ON_OPENSHIFT_CI=true
        # TEMPORARY: use the ODH feature server image built from Dockerfile (Feast 0.67.0 from PyPI), like Konflux
        PYPI_FEATURE_SERVER_IMAGE=quay.io/opendatahub/feature-server@sha256:e6de2d645ad6a2f1235f85793aea598926433479972e7b7c7387efe9c37903c5
        cd infra/feast-operator
        make install && make deploy IMG=${FEAST_OPERATOR_CONTROLLER_IMAGE} FS_IMG=${PYPI_FEATURE_SERVER_IMAGE}
        oc wait --for condition=Available -n feast-operator-system deployment feast-operator-controller-manager
        make test-e2e
        make undeploy IMG=${FEAST_OPERATOR_CONTROLLER_IMAGE} FS_IMG=${PYPI_FEATURE_SERVER_IMAGE}

        make test-previous-version
        oc delete deployment feast-operator-controller-manager -n feast-operator-system

        make test-upgrade
      dependencies:
      - env: FEAST_OPERATOR_CONTROLLER_IMAGE
        name: feast-operator
      - env: FEAST_FEATURE_SERVER_IMAGE
        name: feast-feature-server
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: tls-scanner-run
    workflow: hypershift-hostedcluster-workflow
- as: e2e-in-cluster-postsubmit
  postsubmit: true
  steps:
    cluster_profile: aws-opendatahub
    env:
      BASE_DOMAIN: openshift-ci-aws.rhaiseng.com
      HYPERSHIFT_AWS_REGION: us-west-2
      HYPERSHIFT_NODE_COUNT: "1"
    test:
    - as: run-tests
      cli: latest
      commands: |
        export RUN_ON_OPENSHIFT_CI=true
        cd infra/feast-operator
        make install && make deploy IMG=${FEAST_OPERATOR_CONTROLLER_IMAGE} FS_IMG=${FEAST_FEATURE_SERVER_IMAGE}
        oc wait --for condition=Available -n feast-operator-system deployment feast-operator-controller-manager
        make test-e2e
        make undeploy IMG=${FEAST_OPERATOR_CONTROLLER_IMAGE} FS_IMG=${FEAST_FEATURE_SERVER_IMAGE}

        make test-previous-version
        oc delete deployment feast-operator-controller-manager -n feast-operator-system

        make test-upgrade
      dependencies:
      - env: FEAST_OPERATOR_CONTROLLER_IMAGE
        name: feast-operator
      - env: FEAST_FEATURE_SERVER_IMAGE
        name: feast-feature-server
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: hypershift-hostedcluster-workflow
- as: tls-scan-pqc
  cron: 0 6 1,15 * *
  steps:
    cluster_profile: aws-opendatahub
    env:
      BASE_DOMAIN: openshift-ci-aws.rhaiseng.com
      HYPERSHIFT_AWS_REGION: us-west-2
      HYPERSHIFT_NODE_COUNT: "1"
      PQC_CHECK: "true"
      SCAN_NAMESPACE: opendatahub-feast-system,feast-tls-scan
      SCANNER_CPU_LIMIT: "2"
      SCANNER_CPU_REQUEST: 500m
      SCANNER_MEM_LIMIT: 4Gi
      SCANNER_MEM_REQUEST: 1Gi
    test:
    - as: deploy-feast-module
      cli: latest
      commands: |
        set -euo pipefail
        MODULE_NS=opendatahub-feast-system
        FS_NS=feast-tls-scan
        MODULE_OPERATOR_IMAGE=quay.io/opendatahub/odh-feast-module-operator:odh-stable

        # Deploy the Feast module operator with the same manifests its Helm chart is generated from.
        git clone --depth 1 https://github.com/opendatahub-io/feast-module-operator.git /tmp/feast-module-operator
        oc kustomize /tmp/feast-module-operator/config/default > /tmp/feast-module-operator.yaml
        grep -q 'image: ttl.sh/opendatahub-feast-operator:latest' /tmp/feast-module-operator.yaml
        sed -i "s#image: ttl.sh/opendatahub-feast-operator:latest#image: ${MODULE_OPERATOR_IMAGE}#" /tmp/feast-module-operator.yaml
        oc apply -f /tmp/feast-module-operator.yaml

        # Have the module operator deploy the Feast operator and feature server images built from this branch.
        oc -n "${MODULE_NS}" set env deployment/opendatahub-feast-operator -c manager \
          RELATED_IMAGE_ODH_FEAST_OPERATOR_IMAGE="${FEAST_OPERATOR_CONTROLLER_IMAGE}" \
          RELATED_IMAGE_ODH_FEATURE_SERVER_IMAGE="${FEAST_FEATURE_SERVER_IMAGE}"
        oc -n "${MODULE_NS}" rollout status deployment/opendatahub-feast-operator --timeout=5m

        oc apply -f - <<EOF
        apiVersion: components.platform.opendatahub.io/v1alpha1
        kind: FeastOperator
        metadata:
          name: default-feastoperator
        spec: {}
        EOF
        oc wait --for=condition=Ready feastoperators.components.platform.opendatahub.io/default-feastoperator --timeout=10m
        oc -n "${MODULE_NS}" wait --for=condition=Available deployment/feast-operator-controller-manager --timeout=10m

        # Leave a FeatureStore with all servers running (TLS on by default on OpenShift) for the scan.
        oc create namespace "${FS_NS}"
        oc apply -n "${FS_NS}" -f - <<EOF
        apiVersion: feast.dev/v1
        kind: FeatureStore
        metadata:
          name: tls-scan
        spec:
          feastProject: tls_scan
          services:
            offlineStore:
              server: {}
            onlineStore:
              server: {}
            registry:
              local:
                server: {}
            ui: {}
        EOF
        oc -n "${FS_NS}" wait --for=condition=FeatureStore featurestore/tls-scan --timeout=10m
        oc -n "${FS_NS}" wait --for=condition=Available deployment --all --timeout=10m
      dependencies:
      - env: FEAST_OPERATOR_CONTROLLER_IMAGE
        name: feast-operator
      - env: FEAST_FEATURE_SERVER_IMAGE
        name: feast-feature-server
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: tls-scanner-run
    workflow: hypershift-hostedcluster-workflow
zz_generated_metadata:
  branch: master
  org: opendatahub-io
  repo: feast
