base_images:
  tls-scanner-tool:
    name: "4.22"
    namespace: ocp
    tag: tls-scanner-tool
  ubi_minimal:
    name: ubi-minimal
    namespace: ocp
    tag: "9"
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-4.23
images:
  items:
  - context_dir: .
    dockerfile_path: Dockerfile
    from: ubi_minimal
    to: workbenches-operator
releases:
  latest:
    release:
      architecture: multi
      channel: stable
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 200Mi
tests:
- as: workbenches-operator-tls-scanner
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: opendatahub
    product: ocp
    timeout: 1h0m0s
    version: "4.20"
  run_if_changed: ^(api/.*|charts/.*|cmd/.*|config/.*|internal/.*|opt/manifests/.*|tests/e2e/.*|tests/kind/.*|Dockerfile|Makefile|go\.mod|go\.sum)
  steps:
    allow_best_effort_post_steps: true
    allow_skip_on_success: true
    env:
      PQC_CHECK: "true"
      SCAN_NAMESPACE: workbenches-operator-system
      SCANNER_CPU_REQUEST: 500m
      SCANNER_MEM_REQUEST: 1Gi
    pre:
    - ref: ipi-install-rbac
    test:
    - as: deploy
      cli: latest
      commands: |
        set -euo pipefail
        unset GOFLAGS

        # CI cli image only provides oc; shim as kubectl for Makefile targets.
        # /usr/local/bin is not writable as non-root, so use a writable PATH dir.
        mkdir -p /tmp/bin
        ln -sf "$(which oc)" /tmp/bin/kubectl
        export PATH="/tmp/bin:${PATH}"

        # Install external CRDs required by the operator
        oc apply -f opt/manifests/workbenches/kf-notebook-controller/crd/bases/kubeflow.org_notebooks.yaml
        oc apply -f tests/e2e/kind/infrastructure.opendatahub.io_hardwareprofiles.yaml

        # Install operator CRDs
        make install

        # Deploy operator with CI-built image (uses config/default — OpenShift service-ca overlay)
        make deploy IMG="${WORKBENCHES_OPERATOR_IMAGE}"

        # Wait for operator to be ready
        oc wait --for=condition=Available --timeout=180s \
          deployment/workbenches-operator -n workbenches-operator-system
      dependencies:
      - env: WORKBENCHES_OPERATOR_IMAGE
        name: workbenches-operator
      from: src
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
      timeout: 15m0s
    - ref: tls-scanner-run
    workflow: generic-claim
zz_generated_metadata:
  branch: main
  org: opendatahub-io
  repo: workbenches-operator
