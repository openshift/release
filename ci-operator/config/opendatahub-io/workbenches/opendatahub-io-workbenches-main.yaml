base_images:
  tls-scanner-tool:
    name: "4.22"
    namespace: ocp
    tag: tls-scanner-tool
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-4.23
images:
  items:
  - context_dir: workspaces/controller
    dockerfile_path: Dockerfile
    to: workspaces-controller
releases:
  latest:
    release:
      architecture: multi
      channel: stable
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 200Mi
tests:
- as: workspaces-controller-tls-scanner
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: opendatahub
    product: ocp
    timeout: 1h0m0s
    version: "4.20"
  run_if_changed: ^workspaces/controller/
  steps:
    allow_best_effort_post_steps: true
    allow_skip_on_success: true
    env:
      PQC_CHECK: "true"
      SCAN_NAMESPACE: redhat-ods-applications
      SCANNER_CPU_REQUEST: 500m
      SCANNER_MEM_REQUEST: 1Gi
    pre:
    - ref: ipi-install-rbac
    test:
    - as: deploy
      cli: latest
      commands: |
        set -euo pipefail
        unset GOFLAGS

        # CI cli image only provides oc; shim as kubectl for Makefile targets.
        # /usr/local/bin is not writable as non-root, so use a writable PATH dir.
        mkdir -p /tmp/bin
        ln -sf "$(which oc)" /tmp/bin/kubectl
        export PATH="/tmp/bin:${PATH}"

        pushd workspaces/controller

        # Deploy using the gateway overlay (what workbenches-operator deploys in
        # RHOAI): OpenShift service-ca webhook TLS and SCC-compatible security
        # context are wired in the overlay. The image is set via the gateway
        # config and the namespace defaults to redhat-ods-applications.
        oc new-project redhat-ods-applications || true
        make deploy-gateway NAMESPACE=redhat-ods-applications \
          IMG="${WORKSPACES_CONTROLLER_IMAGE}"

        # Wait for controller to be ready
        oc wait --for=condition=Available --timeout=180s \
          -n redhat-ods-applications deployment/workspaces-controller
      dependencies:
      - env: WORKSPACES_CONTROLLER_IMAGE
        name: workspaces-controller
      from: src
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
      timeout: 15m0s
    - ref: tls-scanner-run
    workflow: generic-claim
zz_generated_metadata:
  branch: main
  org: opendatahub-io
  repo: workbenches
