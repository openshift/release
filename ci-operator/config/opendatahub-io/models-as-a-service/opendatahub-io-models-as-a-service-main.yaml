base_images:
  tls-scanner-tool:
    name: "4.22"
    namespace: ocp
    tag: tls-scanner-tool
  upi-installer:
    name: "4.22"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-4.23
images:
  items:
  - context_dir: maas-api
    dockerfile_path: Dockerfile
    to: maas-api
  - dockerfile_path: maas-controller/Dockerfile
    to: maas-controller
  - context_dir: maas-discovery
    dockerfile_path: Dockerfile
    to: maas-discovery
releases:
  latest:
    release:
      channel: stable
      version: "4.22"
resources:
  '*':
    limits:
      memory: 6Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-tls-scan
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: opendatahub
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$|^\.github/|^\.tekton/
  steps:
    allow_best_effort_post_steps: true
    allow_skip_on_success: true
    env:
      COMPONENT_FILTER: maas-api,maas-controller,maas-discovery,ai-gateway-operator,ai-gateway-controller
      PQC_CHECK: "true"
      SCAN_NAMESPACE: opendatahub,odh-ai-gateway-infra
    post:
    - chain: gather
    test:
    - as: e2e
      cli: latest
      commands: |
        set -euo pipefail
        TOOL_BIN="${HOME}/bin"
        mkdir -p "${TOOL_BIN}"
        export PATH="${TOOL_BIN}:${PATH}"
        if ! command -v kubectl >/dev/null 2>&1 && command -v oc >/dev/null 2>&1; then
          ln -sf "$(command -v oc)" "${TOOL_BIN}/kubectl"
        fi
        if ! command -v jq >/dev/null 2>&1; then
          if [[ "$(id -u)" -eq 0 ]]; then
            yum install -y --nodocs jq
          else
            curl -fsSL -o "${TOOL_BIN}/jq" "https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64"
            chmod +x "${TOOL_BIN}/jq"
          fi
        fi
        if ! command -v kustomize >/dev/null 2>&1; then
          curl -fsSL -o /tmp/kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.0/kustomize_v5.7.0_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tgz -C "${TOOL_BIN}" kustomize
          chmod +x "${TOOL_BIN}/kustomize"
        fi
        export MAAS_API_IMAGE="${MAAS_API_IMAGE}"
        export MAAS_CONTROLLER_IMAGE="${MAAS_CONTROLLER_IMAGE}"
        export MAAS_DISCOVERY_IMAGE="${MAAS_DISCOVERY_IMAGE}"
        export MAAS_DISCOVERY_ENABLED="true"
        source ./test/e2e/scripts/ensure_e2e_python.sh
        cd test/e2e && "${E2E_PYTHON}" -m pip install -q -r requirements.txt && cd ../..
        ./test/e2e/scripts/prow_run_smoke_test.sh
      dependencies:
      - env: MAAS_API_IMAGE
        name: maas-api
      - env: MAAS_CONTROLLER_IMAGE
        name: maas-controller
      - env: MAAS_DISCOVERY_IMAGE
        name: maas-discovery
      from: upi-installer
      resources:
        requests:
          cpu: "2"
          memory: 3Gi
      timeout: 3h0m0s
    - ref: tls-scanner-run
    workflow: generic-claim
zz_generated_metadata:
  branch: main
  org: opendatahub-io
  repo: models-as-a-service
