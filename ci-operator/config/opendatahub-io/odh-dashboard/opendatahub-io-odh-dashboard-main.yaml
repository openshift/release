build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.22-openshift-4.18
images:
  items:
  - context_dir: .
    dockerfile_path: Dockerfile
    to: odh-dashboard-image
  - context_dir: .
    dockerfile_path: ./packages/model-registry/Dockerfile.workspace
    to: odh-mod-arch-model-registry-image
  - context_dir: .
    dockerfile_path: ./packages/gen-ai/Dockerfile.workspace
    to: odh-mod-arch-gen-ai-image
  - context_dir: .
    dockerfile_path: ./packages/maas/Dockerfile.workspace
    to: odh-mod-arch-maas-image
  - context_dir: .
    dockerfile_path: ./packages/mlflow/Dockerfile.workspace
    to: odh-mod-arch-mlflow-image
  - context_dir: .
    dockerfile_path: ./packages/eval-hub/Dockerfile.workspace
    to: odh-mod-arch-eval-hub-image
  - context_dir: .
    dockerfile_path: ./packages/automl/Dockerfile.workspace
    to: odh-mod-arch-automl-image
  - context_dir: .
    dockerfile_path: ./packages/autorag/Dockerfile.workspace
    to: odh-mod-arch-autorag-image
  - context_dir: .
    dockerfile_path: ./packages/agent-ops/Dockerfile.workspace
    to: odh-mod-arch-agent-ops-image
  - context_dir: .
    dockerfile_path: ./packages/notebooks/Dockerfile.workspace
    to: odh-mod-arch-notebooks-image
  - context_dir: .
    dockerfile_path: ./distributions/core-bff/Dockerfile.workspace
    to: odh-core-bff-image
  - context_dir: .
    dockerfile_path: ./dashboard-operator/Dockerfile
    to: odh-dashboard-operator-image
  - dockerfile_literal: |
      FROM registry.access.redhat.com/ubi9/nodejs-22:latest
      USER root
      RUN dnf install -y git && dnf clean all
      WORKDIR /opt/app-root/src
      COPY . .
      USER 1001
    to: nodejs-22-src
promotion:
  to:
  - excluded_images:
    - nodejs-22-src
    namespace: opendatahub-io
    tag: latest
  - excluded_images:
    - nodejs-22-src
    namespace: opendatahub-io
    tag: main
releases:
  latest:
    release:
      architecture: amd64
      channel: fast
      version: "4.18"
resources:
  '*':
    requests:
      cpu: 200m
      memory: 400Mi
  lint:
    requests:
      cpu: "2"
      memory: 8Gi
  nodejs-22-src:
    requests:
      cpu: "1"
      memory: 2Gi
  type-check:
    requests:
      cpu: "2"
      memory: 8Gi
  unit-tests:
    requests:
      cpu: "2"
      memory: 8Gi
tests:
- as: lint
  commands: |
    npm install -g npm@11.8.0
    npm ci
    npm run install:modules
    NODE_OPTIONS="--max-old-space-size=8192" npm run lint
  container:
    from: nodejs-22-src
- as: type-check
  commands: |
    npm install -g npm@11.8.0
    npm ci
    npm run install:modules
    npm run type-check
  container:
    from: nodejs-22-src
- as: unit-tests
  commands: |
    npm install -g npm@11.8.0
    npm ci
    npm run install:modules
    npm run test-unit
  container:
    from: nodejs-22-src
- as: odh-dashboard-image-mirror
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: odh-dashboard-image
    env:
      IMAGE_REPO: odh-dashboard
      RELEASE_VERSION: main
    workflow: opendatahub-io-ci-image-mirror
- as: odh-dashboard-pr-image-mirror
  steps:
    dependencies:
      SOURCE_IMAGE_REF: odh-dashboard-image
