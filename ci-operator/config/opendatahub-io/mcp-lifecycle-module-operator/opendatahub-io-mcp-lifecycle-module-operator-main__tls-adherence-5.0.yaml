base_images:
  mcp-lifecycle-operator:
    name: mcp-lifecycle-operator
    namespace: opendatahub-io
    tag: latest
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
  upi-installer:
    name: "5.0"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-4.23
images:
  items:
  - build_args:
    - name: TARGETOS
      value: linux
    - name: TARGETARCH
      value: amd64
    dockerfile_path: Dockerfile.konflux
    to: mcp-lifecycle-module-operator
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: tls-scan-intermediate-adherence
  cron: 0 6 1,15 * *
  reporter_config:
    channel: '#forum-mcp-lifecycle-operator-notifications'
    job_states_to_report:
    - failure
    - error
    report_template: Job {{.Spec.Job}} ended with {{.Status.State}}. <{{.Status.URL}}|View
      logs>
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: openshift-org-aws
    env:
      COMPUTE_NODE_TYPE: m5.2xlarge
      OPERATOR_NAMESPACE: mcp-lifecycle-module-operator-system
      SCAN_NAMESPACE: mcp-lifecycle-module-operator-system
      TLS_SCANNER_POD_SELECTOR: control-plane=controller-manager,app.kubernetes.io/name=mcp-lifecycle-operator
    post:
    - ref: mcp-lifecycle-module-operator-gather
    - chain: gather
    test:
    - ref: cert-manager-install-operator
    - ref: tls-adherence
    - ref: mcp-lifecycle-module-operator-deploy
    - ref: mcp-lifecycle-module-operator-operand
    - ref: tls-scanner-network-policy
    - ref: tls-scanner-run
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: opendatahub-io
  repo: mcp-lifecycle-module-operator
  variant: tls-adherence-5.0
