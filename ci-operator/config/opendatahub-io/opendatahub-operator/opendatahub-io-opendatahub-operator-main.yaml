base_images:
  cli-operator-sdk:
    name: cli-operator-sdk
    namespace: ocp
    tag: v1.39.2
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
  tls-scanner-tool:
    name: "4.22"
    namespace: ocp
    tag: tls-scanner-tool
  ubi:
    name: ubi-minimal
    namespace: ocp
    tag: "9"
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-5.0
images:
  items:
  - context_dir: .
    dockerfile_path: Dockerfiles/Dockerfile
    from: ubi
    optional: true
    to: opendatahub-operator
  - context_dir: .
    dockerfile_path: Dockerfiles/rhoai.Dockerfile
    from: ubi
    optional: true
    to: opendatahub-operator-rhoai
operator:
  bundles:
  - as: opendatahub-operator-bundle
    dockerfile_path: Dockerfiles/bundle.Dockerfile
    skip_building_index: true
  - as: opendatahub-operator-rhoai-bundle
    dockerfile_path: Dockerfiles/rhoai-bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: REPLACE_IMAGE:v0.0.0-rhoai-placeholder
    with: pipeline:opendatahub-operator-rhoai
  - pullspec: REPLACE_IMAGE:v0.0.0-placeholder
    with: pipeline:opendatahub-operator
prowgen:
  enable_secrets_store_csi_driver: true
  skip_operator_presubmits: true
releases:
  latest:
    release:
      architecture: multi
      channel: stable
      version: "4.20"
resources:
  '*':
    requests:
      cpu: 400m
      memory: 200Mi
tests:
- as: opendatahub-operator-e2e
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: opendatahub
    product: ocp
    timeout: 2h0m0s
    version: "4.20"
  skip_if_only_changed: ^\.github/|^build/|^docs/|\.[mM][dD]$|^.gitignore$|^golangci|^crd-ref-docs\.config|^OWNERS$|^PROJECT$|^LICENSE$|^OWNERS_ALIASES$|^cmd/[^/]+/|^\.[^/]+\.(yaml|yml)$|^(component-params-env|semgrep)\.(yaml|yml)$|^.gitleaksignore$|^.yamllint$|^api/cloudmanager/|^config/cloudmanager/|^internal/controller/cloudmanager/|^pkg/controller/cloudmanager/|^tests/e2e/cloudmanager/|^hack/update-cloudmanager-rbac\.sh$|^pkg/operatorconfig/cloudmanager\.go$|^pkg/utils/test/cloudmanager/
  steps:
    allow_best_effort_post_steps: true
    allow_skip_on_success: true
    dependencies:
      SOURCE_IMAGE_REF: opendatahub-operator
    env:
      IMAGE_REPO: opendatahub-operator
    pre:
    - ref: ipi-install-rbac
    - ref: opendatahub-operator-e2e-cluster-preflight-health-check
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace opendatahub-operator
        oc label ns opendatahub-operator security.openshift.io/scc.podSecurityLabelSync=true --overwrite
        operator-sdk run bundle --timeout=5m -n opendatahub-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available --timeout=3m -n opendatahub-operator deployment opendatahub-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: opendatahub-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 10m0s
    - ref: opendatahub-io-ci-image-mirror-generic-claim
    - as: e2e
      cli: latest
      commands: |
        unset GOFLAGS
        make e2e-test -e E2E_TEST_FLAGS="-timeout 120m" -e OPERATOR_NAMESPACE=opendatahub-operator -e E2E_AUTO_RESOLVE=true
      from: src
      resources:
        requests:
          cpu: 2000m
          memory: 3Gi
      timeout: 3h0m0s
    workflow: generic-claim
- as: opendatahub-operator-rhoai-e2e
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: opendatahub
    product: ocp
    timeout: 2h0m0s
    version: "4.20"
  skip_if_only_changed: ^\.github/|^build/|^docs/|\.[mM][dD]$|^.gitignore$|^golangci|^crd-ref-docs\.config|^OWNERS$|^PROJECT$|^LICENSE$|^OWNERS_ALIASES$|^cmd/[^/]+/|^\.[^/]+\.(yaml|yml)$|^(component-params-env|semgrep)\.(yaml|yml)$|^.gitleaksignore$|^.yamllint$|^api/cloudmanager/|^config/cloudmanager/|^internal/controller/cloudmanager/|^pkg/controller/cloudmanager/|^tests/e2e/cloudmanager/|^hack/update-cloudmanager-rbac\.sh$|^pkg/operatorconfig/cloudmanager\.go$|^pkg/utils/test/cloudmanager/
  steps:
    allow_best_effort_post_steps: true
    allow_skip_on_success: true
    dependencies:
      SOURCE_IMAGE_REF: opendatahub-operator-rhoai
    env:
      IMAGE_REPO: opendatahub-operator
      PQC_CHECK: "true"
      SCAN_NAMESPACE: redhat-ods-operator,redhat-ods-applications,redhat-ods-monitoring,rhoai-model-registries
    post:
    - as: gather-rhoai-failure-diagnostics
      best_effort: true
      cli: latest
      commands: |
        set -euo pipefail
        diagnostics="${ARTIFACT_DIR}/rhoai-failure-diagnostics"
        mkdir -p "${diagnostics}"

        # Bound each request so an unhealthy API cannot block the remaining diagnostics.
        capture() {
          local file="$1"
          shift
          if ! timeout 20s oc --request-timeout=15s "$@" > "${diagnostics}/${file}" 2>&1; then
            echo "Warning: could not collect ${file}; see the artifact for details."
          fi
        }

        capture clusteroperators.yaml get clusteroperators -o yaml
        capture nodes.yaml get nodes -o yaml
        capture namespaces.yaml get namespaces redhat-ods-operator redhat-ods-applications kuadrant-system openshift-kube-controller-manager -o yaml
        capture controller-manager-lease.yaml get lease kube-controller-manager -n kube-system -o yaml
        capture rhcl-olm.yaml get subscriptions,installplans,clusterserviceversions -n kuadrant-system -o yaml

        for namespace in redhat-ods-operator redhat-ods-applications kuadrant-system openshift-kube-controller-manager; do
          # Pod YAML preserves termination messages even when the kubelet log API fails.
          capture "${namespace}-workloads.yaml" get pods,deployments,replicasets -n "${namespace}" -o yaml
          capture "${namespace}-events.yaml" get events -n "${namespace}" -o yaml
        done

        for namespace in kuadrant-system openshift-kube-controller-manager; do
          containers=(--all-containers=true)
          if [[ "${namespace}" == openshift-kube-controller-manager ]]; then
            containers=(-c kube-controller-manager)
            capture "${namespace}-pods.txt" get pods -n "${namespace}" -l app=kube-controller-manager -o name
          else
            capture "${namespace}-pods.txt" get pods -n "${namespace}" -o name
          fi
          while IFS= read -r pod; do
            [[ "${pod}" == pod/* ]] || continue
            name="${pod#pod/}"
            capture "${namespace}-${name}-current.log" logs -n "${namespace}" "${pod}" "${containers[@]}" --timestamps --tail=2000
            capture "${namespace}-${name}-previous.log" logs -n "${namespace}" "${pod}" "${containers[@]}" --previous --timestamps --tail=2000
          done < "${diagnostics}/${namespace}-pods.txt"
        done
      from: cli
      optional_on_success: true
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 10m0s
    - chain: gather
    pre:
    - ref: ipi-install-rbac
    - ref: opendatahub-operator-e2e-cluster-preflight-health-check
    - ref: opendatahub-io-ci-rhoai-quay-pull-secret
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace redhat-ods-operator
        oc label ns redhat-ods-operator security.openshift.io/scc.podSecurityLabelSync=true --overwrite
        operator-sdk run bundle --timeout=5m -n redhat-ods-operator "$OO_BUNDLE" --verbose
      dependencies:
      - env: OO_BUNDLE
        name: opendatahub-operator-rhoai-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 10m0s
    - ref: opendatahub-io-ci-image-mirror-generic-claim
    - as: e2e
      cli: latest
      commands: |
        unset GOFLAGS
        E2E_TEST_BACKUP_AND_RESTORE_DSCI_AND_DSC=true \
          E2E_TEST_DSC_MONITORING_NAMESPACE=redhat-ods-monitoring \
          make e2e-test \
          -e ODH_PLATFORM_TYPE=rhoai \
          -e E2E_TEST_FLAGS="-timeout 120m" \
          -e OPERATOR_NAMESPACE=redhat-ods-operator \
          -e E2E_AUTO_RESOLVE=true
      from: src
      resources:
        requests:
          cpu: 2000m
          memory: 3Gi
      timeout: 3h0m0s
    - as: enable-aipipelines-for-tls-scan
      cli: latest
      commands: |
        oc apply -f - <<'EOF'
        apiVersion: datasciencecluster.opendatahub.io/v3
        kind: DataScienceCluster
        metadata:
          name: default-dsc
        spec:
          components:
            aipipelines:
              managementState: Managed
        EOF
        oc wait --for=jsonpath='{.status.phase}'=Ready \
          datasciencecluster.v3.datasciencecluster.opendatahub.io/default-dsc \
          --timeout=20m
        oc apply -f - <<'EOF'
        apiVersion: datasciencepipelinesapplications.opendatahub.io/v1
        kind: DataSciencePipelinesApplication
        metadata:
          name: aipipelines-tls-scan
          namespace: redhat-ods-applications
        spec:
          dspVersion: v2
          podToPodTLS: true
          objectStorage:
            minio:
              image: quay.io/opendatahub/minio:RELEASE.2019-08-14T20-37-41Z-license-compliance
        EOF
        oc wait --for=condition=Ready \
          datasciencepipelinesapplications.v1.datasciencepipelinesapplications.opendatahub.io/aipipelines-tls-scan \
          -n redhat-ods-applications \
          --timeout=20m
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 45m0s
    - ref: tls-scanner-run
    workflow: generic-claim
- as: opendatahub-operator-image-mirror
  postsubmit: true
  skip_if_only_changed: ^\.github/|^docs/|\.[mM][dD]$|^.gitignore$|^golangci|^crd-ref-docs\.config|^OWNERS$|^PROJECT$|^LICENSE$|^OWNERS_ALIASES$|^cmd/[^/]+/|^\.[^/]+\.(yaml|yml)$|^(component-params-env|semgrep)\.(yaml|yml)$|^.gitleaksignore$|^.yamllint$
  steps:
    dependencies:
      SOURCE_IMAGE_REF: opendatahub-operator
    env:
      IMAGE_REPO: opendatahub-operator
      RELEASE_VERSION: main
    workflow: opendatahub-io-ci-image-mirror
- as: opendatahub-operator-image-mirror-latest
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: opendatahub-operator
    env:
      IMAGE_REPO: opendatahub-operator
      IMAGE_TAG: latest
    workflow: opendatahub-io-ci-image-mirror
- as: opendatahub-operator-rhoai-image-mirror
  postsubmit: true
  skip_if_only_changed: ^\.github/|^docs/|\.[mM][dD]$|^.gitignore$|^golangci|^crd-ref-docs\.config|^OWNERS$|^PROJECT$|^LICENSE$|^OWNERS_ALIASES$|^cmd/[^/]+/|^\.[^/]+\.(yaml|yml)$|^(component-params-env|semgrep)\.(yaml|yml)$|^.gitleaksignore$|^.yamllint$
  steps:
    dependencies:
      SOURCE_IMAGE_REF: opendatahub-operator-rhoai
    env:
      IMAGE_REPO: opendatahub-operator
      RELEASE_VERSION: rhoai
    workflow: opendatahub-io-ci-image-mirror
zz_generated_metadata:
  branch: main
  org: opendatahub-io
  repo: opendatahub-operator
