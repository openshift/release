build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.22
images:
  items:
  - dockerfile_literal: |
      FROM quay.io/lightspeed-core/lightspeed-stack:dev-latest AS builder
      USER 0
      RUN pip install --no-cache-dir --target /opt/profiling-deps pyroscope-io memray

      FROM quay.io/lightspeed-core/lightspeed-stack:dev-latest
      USER 0
      COPY --from=builder /opt/profiling-deps/ /opt/profiling-deps/
      RUN cp -a /opt/profiling-deps/* "$(python3 -c 'import sysconfig; print(sysconfig.get_path("platlib"))')/" && rm -rf /opt/profiling-deps
      USER 1001
    to: lcs-perf
prowgen:
  disable_sparse_checkout: true
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lcs-load-test-10users
  cron: 0 0 * * *
  reporter_config:
    channel: '#lcs-perf-scale-ci-results'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :white_check_mark:
      {{else}} :warning:  Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :warning: {{end}}'
  steps:
    allow_best_effort_post_steps: true
    allow_skip_on_success: true
    cluster_profile: aws-perfscale-qe
    env:
      BASE_DOMAIN: qe.devcluster.openshift.com
      CHANGE_POINT_REPOS: lightspeed-core/lightspeed-stack,lightspeed-core/lcs-load-generator,cloud-bulldozer/orion,openshift/release
      COLLAPSE: "true"
      COMPUTE_NODE_REPLICAS: "3"
      COMPUTE_NODE_TYPE: m6i.xlarge
      ENABLE_MEMRAY: "false"
      ENABLE_PYROSCOPE: "true"
      ES_BENCHMARK_INDEX: lcs-perf-results
      ES_METADATA_INDEX: perf_scale_ci*
      ES_TYPE: qe
      LOOKBACK: "180"
      LOOKBACK_SIZE: "15"
      NUM_USERS: "10"
      OPENSHIFT_INFRA_NODE_INSTANCE_TYPE: r5.xlarge
      ORION_CONFIG: examples/lcs-load-generator.yaml
      ORION_ENVS: lcs_test_workers=10 duration=5m,10m,20m
      ORION_REPO: https://github.com/cloud-bulldozer/orion.git
      OUTPUT_FORMAT: JUNIT
      RUN_ORION: "true"
      TAG: v1.3.2
      TEST_DURATION: 5m,10m,20m
      VERSION: "4.22"
      ZONES_COUNT: "3"
    test:
    - ref: lcs-load-generator-tests
    - ref: openshift-qe-orion
    workflow: openshift-qe-installer-aws
