build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.22
images:
  items:
  - dockerfile_literal: |
      FROM quay.io/rh-ee-bbodapat/lcs-load-generator:latest
    to: lcs-load-generator-ci
promotion:
  to:
  - namespace: lcs-load-generator
    tag: latest
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
tests:
- as: lcs-load-test-10users
  cron: 0 0 * * 1
  steps:
    cluster_profile: aws-perfscale-qe
    env:
      COMPUTE_NODE_REPLICAS: "3"
      COMPUTE_NODE_TYPE: m6i.xlarge
      ZONES_COUNT: "3"
      NUM_USERS: "10"
      TEST_DURATION: "5m"
      ENABLE_PYROSCOPE: "true"
      ENABLE_MEMRAY: "false"
      RUN_ORION: "true"
      ORION_REPO: "https://github.com/Balatripura587/orion.git"
      TAG: "lcs-config"
      ORION_CONFIG: "examples/lcs-load-generator.yaml"
      ORION_ENVS: "lcs_test_workers=10"
      LOOKBACK: "180"
      LOOKBACK_SIZE: "15"
      ES_BENCHMARK_INDEX: "lcs-perf-results"
      OUTPUT_FORMAT: "JUNIT"
      CHANGE_POINT_REPOS: >-
        lightspeed-core/lightspeed-stack,lightspeed-core/lcs-load-generator,cloud-bulldozer/orion,openshift/release
    test:
    - ref: lcs-load-generator-tests
    - ref: openshift-qe-orion
    workflow: openshift-qe-installer-aws
  reporter_config:
    slack:
      channel: '#ols-perf-scale-ci-results'
      job_states_to_report:
      - success
      - failure
      - error
