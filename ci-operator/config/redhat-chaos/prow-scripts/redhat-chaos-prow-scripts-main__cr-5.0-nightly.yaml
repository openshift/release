base_images:
  cerberus.prow:
    name: cerberus
    namespace: chaos
    tag: cerberus-prow
  cli:
    name: "5.0"
    namespace: ocp
    tag: cli
  ocp-qe-perfscale-ci:
    name: ocp-qe-perfscale-ci
    namespace: ci
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: cerberus/Dockerfile_prow
    from: cerberus.prow
    to: cerberus-main-prow-450
  - dockerfile_literal: |-
      FROM ocp-qe-perfscale-ci
      RUN ls
      RUN cp oc /bin
    from: ocp-qe-perfscale-ci
    to: perfscale-observer
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: krkn-hub-aws
  cron: 0 0 * * *
  steps:
    cluster_profile: aws-chaos
    env:
      BASE_DOMAIN: aws.rhperfscale.org
      GC: "false"
      ITERATION_MULTIPLIER_ENV: "11"
      PROFILE_TYPE: reporting
      SPOT_INSTANCES: "true"
      TELEMETRY_GROUP: prow-ocp-5.0-component-readiness
      USER_TAGS: |
        TicketId 421
    observers:
      enable:
      - redhat-chaos-cerberus
    test:
    - chain: redhat-chaos-krkn-hub-tests
    workflow: redhat-chaos-installer-aws
- as: krkn-hub-node-orion
  cron: 0 6 * * *
  steps:
    cluster_profile: aws-chaos
    env:
      ORION_ENVS: CLOUD_INFRASTRUCTURE=AWS,CLOUD_TYPE=self-managed,NETWORK_PLUGINS=OVNKubernetes,NODE_INSTANCE_TYPE='*.xlarge*',TOTAL_NODE_COUNT="9",VERSION="4.22",RUN_TAG="cr",FIPS_ENABLED="false",ETCD_ENABLED="false",IPSEC_ENABLED="false"
    test:
    - chain: redhat-chaos-orion-node-tests
- as: krkn-hub-pod-orion
  cron: 0 6 * * *
  steps:
    cluster_profile: aws-chaos
    env:
      ORION_ENVS: CLOUD_INFRASTRUCTURE=AWS,CLOUD_TYPE=self-managed,NETWORK_PLUGINS=OVNKubernetes,NODE_INSTANCE_TYPE='*.xlarge*',TOTAL_NODE_COUNT="9",VERSION="4.22",RUN_TAG="cr",FIPS_ENABLED="false",ETCD_ENABLED="false",IPSEC_ENABLED="false"
    test:
    - chain: redhat-chaos-orion-pod-scenarios
zz_generated_metadata:
  branch: main
  org: redhat-chaos
  repo: prow-scripts
  variant: cr-5.0-nightly
