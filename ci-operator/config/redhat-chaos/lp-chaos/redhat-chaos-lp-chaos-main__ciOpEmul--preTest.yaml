base_images:
  cli:
    name: "5.1"
    namespace: ocp
    tag: cli
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-5.1
images:
  items:
  - dockerfile_literal: |
      FROM cli
      RUN set -exo pipefail && \
          # Install openssh-clients and jq
          declare pkgs='openssh-clients jq' && \
          if command -v dnf 1> /dev/null; then \
              dnf install --setopt tsflags=nodocs -y ${pkgs} && \
              dnf clean all; \
          else \
              microdnf install -y ${pkgs} && \
              microdnf clean all; \
          fi && \
          rm -rf /var/cache/dnf/* && \
          # Install yq
          wget -qO - 'https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64.tar.gz' | \
              tar zvx -C /usr/local/bin/ --transform 's|^\./yq_linux_amd64$|yq|' ./yq_linux_amd64
    from: cli
    to: cli-plus-tools
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.1"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: run-prior-steps
  reporter_config:
    channel: '#ocp-chaos--triage'
    job_states_to_report:
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :slack-green: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :failed:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: aws-lp-chaos
    env:
      BASE_DOMAIN: chaos.lp.devcluster.openshift.com
      CHAOS_TEAM_NAME: lp-chaos
      CONTAINER_ETCD_RECOVERY_TIME: "120"
      DR__RP__CR_COMP_NAME: lp-chaos--OCP
      TELEMETRY_GROUP: ocp5.1-nightly--aws
    post:
    - as: ci-op-emul--noop--0
      commands: "true"
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    pre:
    - chain: ipi-aws-pre
    - ref: cucushift-installer-reportportal-marker
    test:
    - ref: openshift-qe-cluster-density-v2
    - ref: redhat-chaos-observer-start
    - ref: redhat-chaos-pod-scenarios-etcd-disruption
    - ref: redhat-chaos-container-scenarios-etcd-hangup
    - ref: redhat-chaos-time-scenarios
    - as: ci-op-emul--step--0
      commands: |-
        shopt -op; shopt -p; printenv
        set -eux -o pipefail; shopt -s inherit_errexit
        typeset f=/tmp/test.wait
        typeset -i e=240
        echo "${e}" 1> "${f}"
        while true; do
            read -r e 0< "${f}" || e=0
            ((--e >= 0)) || { rm -f "${f}"; break; }
            echo "${e}" 1> "${f}"
            sleep 60
        done
        true
      credentials:
      - bundle: cluster-secrets-aws-chaos
        mount_path: /secret/telemetry
        namespace: test-credentials
      - bundle: chaos-es-creds
        mount_path: /secret/es
      env:
      - name: BASE_DOMAIN
      - name: CHAOS_TEAM_NAME
      - name: CONTAINER_ETCD_RECOVERY_TIME
      - name: DR__RP__CR_COMP_NAME
      - name: TELEMETRY_GROUP
      from_image:
        name: prow-scripts
        namespace: chaos
        tag: latest
      resources:
        limits:
          memory: 1Gi
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 12h0m0s
  timeout: 12h0m0s
zz_generated_metadata:
  branch: main
  org: redhat-chaos
  repo: lp-chaos
  variant: ciOpEmul--preTest
