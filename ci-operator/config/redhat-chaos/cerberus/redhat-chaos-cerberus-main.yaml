base_images:
  cerberus:
    name: cerberus
    namespace: chaos
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: cerberus/Dockerfile_prow
    from: cerberus
    to: cerberus_prow
promotion:
  to:
  - namespace: chaos
    tag: latest
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: main
  org: redhat-chaos
  repo: cerberus
