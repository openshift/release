base_images:
  centos:
    name: centos
    namespace: openshift
    tag: stream9
  rhel-coreos-base:
    name: "4.20"
    namespace: ocp
    tag: rhel-coreos
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.22-builder-multi-openshift-4.17
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_literal: |
      FROM quay.io/centos/centos:stream9 AS build
      RUN dnf download --destdir=/rpms tree
      FROM registry.ci.openshift.org/rhcos-devel/rhel-coreos
      COPY --from=build /rpms/*.rpm /tmp/rpms/
      RUN rpm-ostree install /tmp/rpms/*.rpm && rpm-ostree cleanup -m && rm -rf /tmp/rpms && ostree container commit
    inputs:
      centos:
        as:
        - quay.io/centos/centos:stream9
      rhel-coreos-base:
        as:
        - registry.ci.openshift.org/rhcos-devel/rhel-coreos
    to: rhel-coreos
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    integration:
      include_built_images: true
      name: "4.20"
      namespace: ocp
  standard:
    prerelease:
      architecture: arm64
      product: ocp
      version_bounds:
        lower: 4.20.0-0
        stream: 4-stable
        upper: 4.21.0-0
resources:
  '*':
    limits:
      memory: 2Gi
    requests:
      cpu: 2000m
      memory: 2Gi
tests:
- always_run: false
  as: e2e-aws-arm64-verify-no-tree
  steps:
    cluster_profile: aws-edge-infra
    dependencies:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: release:standard
    env:
      AWS_INSTALL_USE_MINIMAL_PERMISSIONS: "yes"
      AWS_REGION_OVERWRITE: us-east-1
      BASE_DOMAIN: edge-sro.rhecoeng.com
      COMPUTE_NODE_TYPE: m6g.xlarge
      CONTROL_PLANE_INSTANCE_TYPE: m6g.xlarge
      OCP_ARCH: arm64
    test:
    - as: verify-no-tree
      commands: |
        set -euo pipefail
        NODE=$(oc get nodes -o jsonpath='{.items[0].metadata.name}')
        OUTPUT=$(oc debug "node/$NODE" -- chroot /host rpm -q tree 2>&1) && {
          echo "FAIL: tree is installed on standard RHCOS, this is unexpected"
          exit 1
        }
        if [[ "$OUTPUT" == *"package tree is not installed"* ]]; then
          echo "PASS: tree is not installed on standard RHCOS, as expected"
        else
          echo "FAIL: unexpected error while checking standard RHCOS"
          exit 1
        fi
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
    workflow: ipi-aws
- always_run: false
  as: e2e-aws-arm64-verify-tree-layered
  steps:
    cluster_profile: aws-edge-infra
    dependencies:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: release:latest
    env:
      AWS_INSTALL_USE_MINIMAL_PERMISSIONS: "yes"
      AWS_REGION_OVERWRITE: us-east-1
      BASE_DOMAIN: edge-sro.rhecoeng.com
      COMPUTE_NODE_TYPE: m6g.xlarge
      CONTROL_PLANE_INSTANCE_TYPE: m6g.xlarge
      OCP_ARCH: arm64
    test:
    - as: verify-tree
      commands: |
        set -euo pipefail
        NODE=$(oc get nodes -o jsonpath='{.items[0].metadata.name}')
        OUTPUT=$(oc debug "node/$NODE" -- chroot /host rpm -q tree 2>&1)
        if [[ "$OUTPUT" == *"tree-"* ]]; then
          echo "PASS: tree is installed on layered RHCOS, as expected"
        else
          echo "FAIL: tree was not found on layered RHCOS"
          exit 1
        fi
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: rh-ecosystem-edge
  repo: nvidia-ci
  variant: 4.20-custom-rhcos-arm64
