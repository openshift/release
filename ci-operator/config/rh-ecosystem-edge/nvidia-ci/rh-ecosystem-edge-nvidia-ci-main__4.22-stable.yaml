build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-8-release-golang-1.18-openshift-4.12
images:
  items:
  - dockerfile_path: Containerfile
    to: nvidia-ci
  run_if_changed: x^
releases:
  arm64-latest:
    prerelease:
      architecture: arm64
      product: ocp
      version_bounds:
        lower: 4.22.0-0
        stream: 4-stable
        upper: 4.23.0-0
  latest:
    prerelease:
      product: ocp
      version_bounds:
        lower: 4.22.0-0
        stream: 4-stable
        upper: 4.23.0-0
resources:
  '*':
    limits:
      memory: 2Gi
    requests:
      cpu: 2000m
      memory: 2Gi
tests:
- always_run: false
  as: nvidia-gpu-operator-e2e-master
  reporter_config:
    channel: '#wg-nvidia-gpu-nno-operator-ci'
    job_states_to_report:
    - failure
    - error
    - aborted
    report_template: |-
      {{- $emoji := ":warning:" }}{{- if eq .Status.State "success" }}{{- $emoji = ":white_check_mark:" }}{{- end }}
      {{- $prInfo := "" }}{{- with .Spec.Refs }}{{- if .Pulls }}{{- $pull := index .Pulls 0 }}{{- $prInfo = printf " (<%s|PR #%d> by %s)" $pull.Link $pull.Number $pull.Author }}{{- end }}{{- end -}}
      {{$emoji}} Job *{{.Spec.Job}}*{{$prInfo}} ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{$emoji}}
      {{- if eq .Status.State "aborted" }}
        The job was aborted, check for orphaned cloud resources.
      {{- end }}
  steps:
    cluster_profile: aws-edge-infra
    env:
      BASE_DOMAIN: edge-sro.rhecoeng.com
      NVIDIAGPU_DEPLOY_FROM_BUNDLE: "true"
    workflow: nvidia-gpu-operator-e2e-aws
- always_run: false
  as: nvidia-gpu-operator-e2e-master-signed
  reporter_config:
    channel: '#wg-nvidia-gpu-nno-operator-ci'
    job_states_to_report:
    - failure
    - error
    - aborted
