build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-8-release-golang-1.18-openshift-4.12
releases:
  latest:
    prerelease:
      product: ocp
      version_bounds:
        lower: 4.22.0-0
        stream: 4-stable
        upper: 4.23.0-0
resources:
  '*':
    limits:
      memory: 2Gi
    requests:
      cpu: 2000m
      memory: 2Gi
tests:
- always_run: false
  as: e2e-aws-conformance-1m2w
  steps:
    cluster_profile: aws-edge-infra
    env:
      BASE_DOMAIN: edge-sro.rhecoeng.com
      COMPUTE_NODE_REPLICAS: "2"
      COMPUTE_NODE_TYPE: m5.xlarge
      CONTROL_PLANE_INSTANCE_TYPE: m5.xlarge
      CONTROL_PLANE_REPLICAS: "1"
    workflow: openshift-e2e-aws
zz_generated_metadata:
  branch: main
  org: rh-ecosystem-edge
  repo: nvidia-ci
  variant: 4.22-conformance
