base_images:
  dpf-ci:
    name: openshift-dpf
    namespace: ci
    tag: dpf-ci
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-8-release-golang-1.18-openshift-4.12
images:
  items:
  - dockerfile_path: Containerfile
    to: nvidia-ci
  run_if_changed: x^
releases:
  latest:
    prerelease:
      product: ocp
      version_bounds:
        lower: 5.0.0
        stream: 5-stable
        upper: 5.1.0-0
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 500m
      memory: 1Gi
tests:
- as: nno-e2e
  capabilities:
  - intranet
  cron: 30 4 * * 1,4
  restrict_network_access: false
  steps:
    cluster_profile: metal-nno-doca2
    env:
      DPF_OPENSHIFT_VERSION: "5.0"
      DPF_SKIP_CI_PAYLOAD: "false"
      NNO_SUBSCRIPTION_CHANNEL: v26.7
      NVIDIAGPU_GPU_FALLBACK_CATALOGSOURCE_INDEX_IMAGE: registry.redhat.io/redhat/certified-operator-index:v4.22
      NVIDIANETWORK_NNO_FALLBACK_CATALOGSOURCE_INDEX_IMAGE: registry.redhat.io/redhat/certified-operator-index:v4.22
    workflow: nno-e2e
  timeout: 8h0m0s
zz_generated_metadata:
  branch: main
  org: rh-ecosystem-edge
  repo: nvidia-ci
  variant: nno-5.0
