build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-8-release-golang-1.18-openshift-4.12
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      architecture: arm64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 2Gi
    requests:
      cpu: 2000m
      memory: 2Gi
tests:
- always_run: false
  as: e2e-aws-arm-doca-day0
  steps:
    cluster_profile: aws-edge-infra
    env:
      BASE_DOMAIN: edge-sro.rhecoeng.com
      COMPUTE_NODE_REPLICAS: "1"
      CONTROL_PLANE_REPLICAS: "1"
      CUSTOM_OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: quay.io/openshift-release-dev/ocp-release:5.0.0-aarch64
      OCP_ARCH: arm64
      OVS_DOCA_CLUSTER_HOLD_MINUTES: "720"
      OVS_DOCA_EXPECTED_BANNER: DOCA 3.5
      OVS_DOCA_EXPECTED_RPM_VERSION: 3.5.0052-1.el10
      OVS_DOCA_EXPECTED_SELINUX_POLICY: doca-openvswitch-selinux-policy-3.5.0052-1.el10.noarch
      OVS_DOCA_LAYERED_IMAGE: quay.io/rh-ee-skaufman/ovs-doca-el10-rhcos:5.0.0-doca3.5.0
      OVS_DOCA_VALIDATE_NODE_ROLES: worker
    post:
    - chain: ipi-aws-post
    pre:
    - ref: ovs-doca-conf-worker-os
    - chain: ipi-aws-pre
    test:
    - ref: ovs-doca-validate-node-package
    - as: publish-cluster-access
      cli: latest
      commands: |
        # Copy cluster credentials into the job artifacts so the cluster can
        # be reached manually during the hold-cluster step below. Controlled
        # by OVS_DOCA_CLUSTER_HOLD_MINUTES in this config's shared test env:
        # 0 skips the hold and this publication with it -- there is no point
        # publishing cluster-admin credentials for a cluster that is about to
        # be deprovisioned. Artifacts are synced to GCS continuously while
        # the job runs, so the files are downloadable from the job's artifact
        # browser (spyglass "Artifacts" tab) while the cluster is still up.
        # Nothing sensitive is printed into the build log itself
        # (No-Sensitive-Data-In-Logs).
        if [ "${OVS_DOCA_CLUSTER_HOLD_MINUTES}" -le 0 ]; then
          echo "OVS_DOCA_CLUSTER_HOLD_MINUTES=0: no hold requested, skipping credential publication."
          exit 0
        fi
        for f in kubeconfig kubeadmin-password; do
          if [ -s "${SHARED_DIR}/${f}" ]; then
            cp "${SHARED_DIR}/${f}" "${ARTIFACT_DIR}/${f}"
            echo "published ${f} to job artifacts"
          else
            echo "${f} not found in SHARED_DIR"
          fi
        done
      env:
      - default: "0"
        name: OVS_DOCA_CLUSTER_HOLD_MINUTES
      from: cli
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
    - as: hold-cluster
      cli: latest
      commands: |
        # Hold the cluster up for manual debugging after the validation steps
        # have run; the deprovision/post chain only starts after this step
        # finishes. Controlled by OVS_DOCA_CLUSTER_HOLD_MINUTES in this
        # config's shared test env: 0 (default) skips the hold entirely and
        # the cluster goes straight to teardown. The prow default job timeout
        # is 24h, so a 12h hold fits alongside the ~1.5h install+validate
        # runtime.
        if [ "${OVS_DOCA_CLUSTER_HOLD_MINUTES}" -le 0 ]; then
          echo "OVS_DOCA_CLUSTER_HOLD_MINUTES=0: no hold requested, releasing cluster to deprovision."
          exit 0
        fi
        echo "Validation finished; holding the cluster for ${OVS_DOCA_CLUSTER_HOLD_MINUTES} minutes."
        echo ""
        echo "To work on the cluster from your laptop:"
        echo "  1. Open this job in prow and download the artifacts 'kubeconfig' and 'kubeadmin-password' (Artifacts tab / spyglass)."
        echo "  2. export KUBECONFIG=\$PWD/kubeconfig"
        echo "  3. oc get nodes   (names are intentionally not printed into this log)"
        echo "  4. Root shell on any worker node:"
        echo "       oc debug node/<name> -- chroot /host"
        echo "     Direct SSH is not available: IPI nodes live in private subnets with no"
        echo "     public IPs and no bastion. 'oc debug node/' is the supported access path"
        echo "     and gives a root shell on the host."
        echo "  5. Alternatively, username/password login:"
        echo "       oc login --server <api-url-from-kubeconfig> -u kubeadmin -p \$(cat kubeadmin-password)"
        echo ""
        # Heartbeat every 5 minutes so the live log view (and the final
        # uploaded log) shows the hold is alive and how much time remains --
        # a bare `sleep` would be N minutes of silence. The sleep is clamped
        # to the remaining time so short holds do not overshoot their end.
        END=$(( $(date +%s) + OVS_DOCA_CLUSTER_HOLD_MINUTES * 60 ))
        while [ "$(date +%s)" -lt "$END" ]; do
          REMAIN=$(( ( END - $(date +%s) + 59 ) / 60 ))
          echo "[$(date -u +%H:%M:%S)] cluster still up, ~${REMAIN} min remaining"
          INTERVAL=$(( END - $(date +%s) ))
          if [ "$INTERVAL" -gt 300 ]; then INTERVAL=300; fi
          sleep "$INTERVAL"
        done
        echo "[$(date -u +%H:%M:%S)] hold complete, releasing cluster to deprovision"
      env:
      - default: "0"
        name: OVS_DOCA_CLUSTER_HOLD_MINUTES
      from: cli
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
zz_generated_metadata:
  branch: main
  org: rh-ecosystem-edge
  repo: nvidia-ci
  variant: 5.0-arm-ovs-doca
