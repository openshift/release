build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-8-release-golang-1.18-openshift-4.12
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      architecture: arm64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 2Gi
    requests:
      cpu: 2000m
      memory: 2Gi
tests:
- always_run: false
  as: e2e-aws-arm-doca-day0
  steps:
    cluster_profile: aws-edge-infra
    env:
      BASE_DOMAIN: edge-sro.rhecoeng.com
      COMPUTE_NODE_REPLICAS: "1"
      CONTROL_PLANE_REPLICAS: "1"
      CUSTOM_OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: quay.io/openshift-release-dev/ocp-release:5.0.0-aarch64
      OCP_ARCH: arm64
      OVS_DOCA_EXPECTED_BANNER: DOCA 3.5
      OVS_DOCA_EXPECTED_RPM_VERSION: 3.5.0052-1.el10
      OVS_DOCA_EXPECTED_SELINUX_POLICY: doca-openvswitch-selinux-policy-3.5.0052-1.el10.noarch
      OVS_DOCA_LAYERED_IMAGE: quay.io/rh-ee-skaufman/ovs-doca-el10-rhcos:5.0.0-doca3.5.0
      OVS_DOCA_VALIDATE_NODE_ROLES: worker
    post:
    - chain: ipi-aws-post
    pre:
    - ref: ovs-doca-conf-worker-os
    - chain: ipi-aws-pre
    test:
    - ref: ovs-doca-validate-node-package
zz_generated_metadata:
  branch: main
  org: rh-ecosystem-edge
  repo: nvidia-ci
  variant: 5.0-arm-ovs-doca
