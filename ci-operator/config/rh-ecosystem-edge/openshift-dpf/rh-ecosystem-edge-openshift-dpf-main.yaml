build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.21-openshift-4.18
images:
  items:
  - dockerfile_path: Containerfile
    to: dpf-ci
releases:
  latest:
    release:
      channel: stable
      version: "4.22"
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 500m
      memory: 1Gi
tests:
- as: daily-e2e-doca4
  capabilities:
  - intranet
  cron: 30 0 * * *
  reporter_config:
    channel: '#wg-nvidia-dpf-ci'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :white_check_mark:
      {{else}} :warning:  Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :warning: {{end}}'
  restrict_network_access: false
  steps:
    allow_skip_on_success: true
    cluster_profile: metal-dpf-doca4
    post:
    - ref: gather-extra
    - ref: gather-must-gather
    test:
    - ref: dpf-hypervisor-deploy-cluster
    - ref: dpf-hypervisor-load-kubeconfig
    - ref: dpf-hypervisor-sanity
    - ref: dpf-hypervisor-network-tests
    - ref: openshift-qe-node-density-cni
    - ref: dpf-hypervisor-e2e
  timeout: 6h0m0s
- always_run: false
  as: deploy-cluster-doca8
  capabilities:
  - intranet
  reporter_config:
    channel: '#wg-nvidia-dpf-ci'
    job_states_to_report:
    - success
    - failure
    - error
    - aborted
    report_template: |-
      {{- $emoji := ":warning:" }}{{- if eq .Status.State "success" }}{{- $emoji = ":white_check_mark:" }}{{- end }}
      {{- $prInfo := "" }}{{- if .Spec.Refs.Pulls }}{{- $pull := index .Spec.Refs.Pulls 0 }}{{- $prInfo = printf " (<%s|PR #%d> by %s)" $pull.Link $pull.Number $pull.Author }}{{- end -}}
      {{$emoji}} Job *{{.Spec.Job}}*{{$prInfo}} ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{$emoji}}
      {{- if eq .Status.State "aborted" }}
        The job was aborted, check for orphaned cloud resources.
