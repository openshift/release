base_images:
  go-builder:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.24-openshift-4.21
binary_build_commands: go build
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.24-openshift-4.21
images:
  items:
  - dockerfile_path: Dockerfile
    to: gitstream
promotion:
  to:
  - namespace: edge-infrastructure
    tag: latest
    tag_by_commit: true
releases:
  latest:
    release:
      channel: fast
      version: "4.15"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit-tests
  steps:
    test:
    - as: unit-tests
      commands: go test -mod=readonly ./... -coverprofile cover.out
      from: src
      resources:
        requests:
          memory: 1Gi
- as: unit-tests-postsubmit
  postsubmit: true
  steps:
    test:
    - as: unit-tests
      commands: go test -mod=readonly ./... -coverprofile cover.out
      from: src
      resources:
        requests:
          memory: 1Gi
- as: build
  commands: go build -mod=readonly
  container:
    clone: true
    from: go-builder
zz_generated_metadata:
  branch: main
  org: rh-ecosystem-edge
  repo: gitstream
