base_images:
  ubi-python:
    name: ubi-python-312
    namespace: ocp
    tag: "9"
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.23-openshift-4.18
images:
  items:
  - dockerfile_literal: |
      FROM src AS source
      FROM ubi-python
      USER 0
      RUN dnf install -y git jq && \
          ln -sf /usr/bin/python3.12 /usr/bin/python && \
          ln -sf /usr/bin/pip3.12 /usr/bin/pip && \
          pip install --no-cache-dir ruff pytest PyYAML requests paramiko fabric && \
          dnf clean all
      COPY --from=source /go/src/github.com/rh-ecosystem-edge/qe-rhel-jetson /workspace
      WORKDIR /workspace
      USER 1001
    from: ubi-python
    inputs:
      src:
        as:
        - src
    to: qe-rhel-jetson
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-full
  capabilities:
  - intranet
  cron: 0 8 * * 1
  restrict_network_access: false
  steps:
    env:
      BOOTC_IMAGE_BASE: quay.io/redhat-user-workloads/jetpack-for-rhel-tenant/rhel-98-bootc
      JUMPHOST: ""
      TEST_SUITE: tests_suites/sanity tests_suites/cuda tests_suites/kmod tests_suites/ethernet
        tests_suites/tools tests_suites/rtc tests_suites/pcis tests_suites/usbs tests_suites/spi_i2c
        tests_suites/can_bus tests_suites/csi_camera tests_suites/display tests_suites/dla
        tests_suites/multimedia tests_suites/pva tests_suites/vic
    pre:
    - ref: qe-rhel-jetson-get-latest-bootc-tag
    - ref: qe-rhel-jetson-bootc-switch
    workflow: qe-rhel-jetson-e2e
- as: e2e-bootc
  capabilities:
  - intranet
  cron: 0 12 * * 6
  restrict_network_access: false
  steps:
    env:
      BOOTC_IMAGE_BASE: quay.io/redhat-user-workloads/jetpack-for-rhel-tenant/rhel-9-bootc
      JUMPHOST: ""
      TEST_SUITE: tests_suites/bootc
    workflow: qe-rhel-jetson-bootc-e2e
zz_generated_metadata:
  branch: rhel-9.8
  org: rh-ecosystem-edge
  repo: qe-rhel-jetson
