base_images:
  aro-hcp-e2e-tests:
    name: aro-hcp-e2e-tests
    namespace: aro-hcp
    tag: latest
  aro-hcp-e2e-tools:
    name: aro-hcp-e2e-tools
    namespace: aro-hcp
    tag: latest
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  cli:
    name: "5.1"
    namespace: ocp
    tag: cli
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
  hypershift-operator-init:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
  manila-csi-driver-operator-test:
    name: "5.1"
    namespace: ocp
    tag: manila-csi-driver-operator-test
  openstack-cinder-csi-driver-operator-test:
    name: "5.1"
    namespace: ocp
    tag: openstack-cinder-csi-driver-operator-test
build_root:
  from_repository: true
canonical_go_repository: github.com/openshift/hypershift
images:
  items:
  - additional_architectures:
    - arm64
    to: hypershift-operator
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile.control-plane
    to: hypershift
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile.e2e
    to: hypershift-tests
  - dockerfile_literal: |
      FROM base
      RUN dnf install -y python3-pip
    from: src
    to: custom-verify-src
  - additional_architectures:
    - arm64
    dockerfile_literal: |
      FROM hypershift-operator
      RUN yum install -y jq && yum clean all
    from: hypershift-operator
    to: hypershift-cli
releases:
  initial:
    candidate:
      product: ocp
      relative: 1
      stream: ci
      version: "5.1"
  initial-50:
    candidate:
      product: ocp
      relative: 1
      stream: ci
      version: "5.0"
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
  latest-50:
    candidate:
      product: ocp
      stream: ci
      version: "5.0"
  latest-421:
    candidate:
      product: ocp
      stream: ci
      version: "4.21"
  latest-422:
    candidate:
      product: ocp
      stream: ci
      version: "4.22"
  multi-initial:
    candidate:
      architecture: multi
      product: ocp
      relative: 1
      stream: nightly
      version: "5.1"
  multi-latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "5.1"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
  unit:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 4000m
      memory: 8Gi
  verify:
    limits:
      cpu: 4000m
      memory: 8Gi
    requests:
      cpu: 4000m
      memory: 8Gi
tests:
- always_run: false
  as: e2e-aks
  capabilities:
  - arm64
  optional: true
  steps:
    cluster_profile: hypershift-aks
    env:
      AUTH_THROUGH_CERTS: "true"
      CI_TESTS_RUN: ^TestKarpenter$
      ENABLE_STANDALONE_KARPENTER_OPERATOR: "true"
      RUN_KARPENTER_TESTS: "true"
      TECH_PREVIEW_NO_UPGRADE: "true"
      HYPERSHIFT_AZURE_KARPENTER_IDENTITY: "true"
      ENABLE_HYPERSHIFT_CERT_ROTATION_SCALE: "true"
      HYPERSHIFT_AZURE_LOCATION: centralus
      HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_OFFER: ""
      HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_PUBLISHER: ""
      HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_SKU: ""
      HYPERSHIFT_AZURE_MARKETPLACE_IMAGE_VERSION: ""
      NODEPOOL_N1_VERSION: "5.0"
      NODEPOOL_N2_VERSION: "4.22"
      NODEPOOL_N3_VERSION: "4.21"
      NODEPOOL_N4_VERSION: "4.20"
    post:
    - ref: hypershift-analyze-e2e-failure
    - chain: cucushift-installer-rehearse-azure-aks-deprovision
    workflow: hypershift-azure-aks-e2e
zz_generated_metadata:
  branch: azure-managed-karpenter-identity
  org: maxcao13
  repo: hypershift
