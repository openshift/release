binary_build_commands: make controller
build_root:
  from_repository: true
canonical_go_repository: sigs.k8s.io/aws-load-balancer-controller
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile.openshift
    to: aws-load-balancer-controller
  skip_if_only_changed: ^renovate\.json$
promotion:
  to:
  - name: aws-load-balancer-controller
    namespace: aws-load-balancer-operator
releases:
  initial:
    integration:
      name: "4.15"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.15"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
  aws-load-balancer-controller:
    limits:
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 2Gi
tests:
- as: unit
  commands: go test -race ./pkg/... ./webhooks/...
  container:
    from: src
  skip_if_only_changed: ^renovate\.json$
zz_generated_metadata:
  branch: main
  org: openshift
  repo: aws-load-balancer-controller
