build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.openshift
    to: external-dns
promotion:
  to:
  - namespace: external-dns-operator
    tag: "1.2"
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    integration:
      name: "4.14"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.14"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: make test
  container:
    from: src
zz_generated_metadata:
  branch: release-1.2
  org: openshift
  repo: external-dns
