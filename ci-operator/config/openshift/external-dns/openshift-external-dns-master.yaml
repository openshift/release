build_root:
  from_repository: true
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile.openshift
    to: external-dns
  skip_if_only_changed: ^renovate\.json$
promotion:
  to:
  - name: external-dns
    namespace: external-dns-operator
releases:
  initial:
    integration:
      name: "4.15"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.15"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: make test
  container:
    from: src
  skip_if_only_changed: ^renovate\.json$
zz_generated_metadata:
  branch: master
  org: openshift
  repo: external-dns
