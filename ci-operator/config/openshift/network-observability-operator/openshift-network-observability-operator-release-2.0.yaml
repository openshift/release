base_images:
  ubi:
    name: ubi-minimal
    namespace: ocp
    tag: "9"
build_root:
  from_repository: true
images:
  items:
  - context_dir: integration-tests/backend
    dockerfile_path: Dockerfile
    from: ubi
    to: e2etests
promotion:
  to:
  - namespace: netobserv
    tag: release-2.0
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
  e2etests:
    limits:
      memory: 8Gi
    requests:
      cpu: "2"
      memory: 4Gi
zz_generated_metadata:
  branch: release-2.0
  org: openshift
  repo: network-observability-operator
