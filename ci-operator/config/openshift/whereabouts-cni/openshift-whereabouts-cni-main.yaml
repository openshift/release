build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.openshift
    to: multus-whereabouts-ipam-cni
promotion:
  to:
  - name: "5.1"
    namespace: ocp
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: e2e-aws
  steps:
    cluster_profile: openshift-org-aws
    workflow: openshift-e2e-aws
- always_run: false
  as: e2e-aws-whereabouts-reconciler
  optional: true
  run_if_changed: ^(Dockerfile\.openshift|entrypoint\.sh|hack/verify-whereabouts-reconciler\.sh)$
  steps:
    cluster_profile: openshift-org-aws
    test:
    - as: test
      cli: latest
      commands: bash hack/verify-whereabouts-reconciler.sh
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-aws
- as: security
  optional: true
  steps:
    env:
      ALL_PROJECTS: "true"
      PROJECT_NAME: whereabouts-cni
    workflow: openshift-ci-security
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
zz_generated_metadata:
  branch: main
  org: openshift
  repo: whereabouts-cni
