base_images:
  tests-private:
    name: tests-private
    namespace: ci
    tag: "4.22"
  upi-installer:
    name: "4.22"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
prowgen:
  disable_sparse_checkout: true
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: azure-ipi-kata
  capabilities:
  - intranet
  cron: 5 0 * * 1-5
  reporter_config:
    channel: '#kata-ocp-ci-reports'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}}SUCCESS{{else}}ERROR{{end}}
      {{trimPrefix "periodic-ci-openshift-sandboxed-containers-operator-" .Spec.Job}}
      <{{.Status.URL}}|View logs>'
  restrict_network_access: false
  steps:
    cluster_profile: azure-qe
    env:
      BASE_DOMAIN: qe.azure.devcluster.openshift.com
      CATALOG_SOURCE_IMAGE: quay.io/redhat-user-workloads/ose-osc-tenant/osc-test-fbc:latest
      CATALOG_SOURCE_NAME: brew-catalog
      CUSTOM_AZURE_REGION: eastus
      ENABLE_MUST_GATHER: "false"
      FEATURE_SET: TechPreviewNoUpgrade
      INITDATA: ""
      INSTALL_KATA_RPM: "true"
      KATA_RPM_VERSION: 4.2.0-1.rhaos4.22.el10
      MUST_GATHER_IMAGE: registry.redhat.io/openshift-sandboxed-containers/osc-must-gather-rhel10:latest
      MUST_GATHER_ON_FAILURE_ONLY: "false"
      OS_IMAGE_STREAM: rhel-10
      OSC_INSTALL: "true"
      RUNTIMECLASS: kata
      SLEEP_DURATION: 0h
      TEST_RELEASE_TYPE: Pre-GA
      TESTS_KATA_UPSTREAM_ENABLE: "true"
      TESTS_OSC_ENABLE: "true"
      TRUSTEE_URL: ""
      WORKLOAD_TO_TEST: kata
    workflow: sandboxed-containers-operator-e2e-azure
  timeout: 24h0m0s
zz_generated_metadata:
  branch: devel
  org: openshift
  repo: sandboxed-containers-operator
  variant: downstream-candidate422-rhel10
