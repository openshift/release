base_images:
  bm-https:
    name: "4.22"
    namespace: ocp
    tag: upi-installer
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: bm-osc-1-14-snp-ocp-4-20-default
  capabilities:
  - intranet
  cron: 17 1 * * 3
  restrict_network_access: false
  steps:
    env:
      OSC_BM_JOB: |
        {
          "kata": {
            "rpm_version": "4.2.0-2.rhaos4.20.el9",
            "source_ref": "bm-4-2-0-no-skips",
            "source_repo": "https://github.com/ldoktor/kata-containers.git"
          },
          "machine": {
            "match": {
              "gpu": false,
              "pool": "v14-physical",
              "tee": "snp"
            }
          },
          "ocp": {
            "build": "ga",
            "topology": "sno",
            "version": "latest-4.20"
          },
          "osc": {
            "catalog_image": "quay.io/redhat-user-workloads/ose-osc-tenant/osc-test-fbc-v1-14:latest",
            "catalog_name": "brew-catalog"
          },
          "reservation": {
            "reason": "prerelease-1.14",
            "release_on_error": true,
            "release_on_fail": true
          },
          "runner": "0.1.0",
          "schema_version": 1,
          "test_plan": [
            {
              "profile": "default",
              "suites": [
                {
                  "name": "simple"
                },
                {
                  "name": "kata-k8s",
                  "tests": [
                    "k8s-all"
                  ]
                }
              ]
            }
          ],
          "trustee": {
            "catalog_image": "quay.io/redhat-user-workloads/ose-osc-tenant/trustee-test-fbc:latest"
          }
        }
      OSC_BM_SECRET_DIR: /var/run/osc-bm-https
    post:
    - as: bm-post
      commands: |
        #!/usr/bin/env bash
        # shellcheck disable=SC2154
        set -euo pipefail
        # Reserve 30 seconds for extraction and reporting.
        collection_deadline=$((SECONDS + 870))
        : "${ARTIFACT_DIR:?}" "${SHARED_DIR:?}"
        test -s "${SHARED_DIR}/bm-job" || exit 0
        read -r job < "${SHARED_DIR}/bm-job"
        [[ "${job}" =~ ^[0-9a-f]{32}$ ]]
        # shellcheck disable=SC2034
        set +x
        umask 077
        work="$(mktemp -d)"
        : "${OSC_BM_SECRET_DIR:?}"
        read -r active < "${OSC_BM_SECRET_DIR}/active"
        [[ "${active}" == blue || "${active}" == green ]]
        client="${OSC_BM_SECRET_DIR}/${active}"
        read -r endpoint < "${client}-endpoint-ip"
        if [[ "${endpoint}" == *:* ]]; then
            endpoint="[${endpoint}]"
        fi
        url="https://${endpoint}:443/v1/jobs"
        curl_options=(--disable --silent --show-error --fail --proto '=https' --noproxy '*' --connect-timeout 30
            --cacert "${client}-ca-bundle" --cert "${client}-client-cert" --key "${client}-client-key")

        bm_curl() {
            local budget="$1" output="$2"
            shift 2
            local deadline=$((SECONDS + budget)) attempt remaining status code delay=1
            bm_retryable_failure=1
            for attempt in 1 2 3 4; do
                remaining=$((deadline - SECONDS))
                (( remaining > 0 )) || return 28
                code=0
                # Each attempt replaces partial output; all attempts share one deadline.
                status="$(curl "${curl_options[@]}" --max-time "${remaining}" \
                    --output "${output}" --write-out '%{http_code}' "$@")" || code=$?
                (( code == 0 )) && return 0
                case "${code}:${status}" in
                    7:*|18:*|28:*|52:*|55:*|56:*|22:408|22:429|22:500|22:502|22:503|22:504) ;;
                    *) bm_retryable_failure=0; return "${code}" ;;
                esac
                (( attempt < 4 && SECONDS + delay < deadline )) || return "${code}"
                sleep "${delay}"
                delay=$((delay * 2))
            done
        }

        abort_failed=0
        if [[ "${OSC_BM_ABORT_ON_FAILURE:-false}" == true && -e "${SHARED_DIR}/bm-failed" ]]; then
            remaining=$((collection_deadline - SECONDS))
            (( remaining > 30 )) && remaining=30
            bm_curl "${remaining}" "${work}/abort" --data '' "${url}/${job}/abort" || abort_failed=1
        fi
        remaining=$((collection_deadline - SECONDS))
        bm_curl "${remaining}" "${work}/results.tar" \
            --dump-header "${work}/headers" \
            "${url}/${job}/artifacts?summary=true"
        tar --no-same-owner --no-same-permissions -xf "${work}/results.tar" -C "${ARTIFACT_DIR}"
        failed=''
        while IFS= read -r header; do
            header="${header%$'\r'}"
            case "${header,,}" in
                x-osc-failed:*)
                    failed="${header#*:}"
                    failed="${failed#"${failed%%[!$' \t']*}"}"
                    failed="${failed%"${failed##*[!$' \t']}"}"
                    ;;
            esac
        done < "${work}/headers"
        [[ "${failed}" =~ ^[01]$ ]]
        exit "$((failed || abort_failed))"
      credentials:
      - collection: sandboxed-containers-operator
        group: osc-bm-https
        mount_path: /var/run/osc-bm-https
      env:
      - default: "false"
        documentation: Abort the saved native job after a failed pre/test step.
        name: OSC_BM_ABORT_ON_FAILURE
      - documentation: Directory containing mounted HTTPS credentials.
        name: OSC_BM_SECRET_DIR
      from: bm-https
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 15m0s
    pre:
    - as: bm-pre
      commands: |
        #!/usr/bin/env bash
        # shellcheck disable=SC2154
        set -euo pipefail
        if [[ "${OSC_BM_PRE_SLEEP:-0}" != 0 ]]; then
            sleep "${OSC_BM_PRE_SLEEP}" || true
        fi
        : "${OSC_BM_JOB:?}" "${PROW_JOB_ID:?}" "${SHARED_DIR:?}"
        trap 'code=$?; if (( code != 0 )); then touch "${SHARED_DIR}/bm-failed"; fi; exit "${code}"' EXIT
        [[ "${PROW_JOB_ID}" =~ ^[a-zA-Z0-9._-]{1,200}$ ]]
        # shellcheck disable=SC2034
        set +x
        umask 077
        work="$(mktemp -d)"
        : "${OSC_BM_SECRET_DIR:?}"
        read -r active < "${OSC_BM_SECRET_DIR}/active"
        [[ "${active}" == blue || "${active}" == green ]]
        client="${OSC_BM_SECRET_DIR}/${active}"
        read -r endpoint < "${client}-endpoint-ip"
        if [[ "${endpoint}" == *:* ]]; then
            endpoint="[${endpoint}]"
        fi
        url="https://${endpoint}:443/v1/jobs"
        curl_options=(--disable --silent --show-error --fail --proto '=https' --noproxy '*' --connect-timeout 30
            --cacert "${client}-ca-bundle" --cert "${client}-client-cert" --key "${client}-client-key")

        bm_curl() {
            local budget="$1" output="$2"
            shift 2
            local deadline=$((SECONDS + budget)) attempt remaining status code delay=1
            bm_retryable_failure=1
            for attempt in 1 2 3 4; do
                remaining=$((deadline - SECONDS))
                (( remaining > 0 )) || return 28
                code=0
                # Each attempt replaces partial output; all attempts share one deadline.
                status="$(curl "${curl_options[@]}" --max-time "${remaining}" \
                    --output "${output}" --write-out '%{http_code}' "$@")" || code=$?
                (( code == 0 )) && return 0
                case "${code}:${status}" in
                    7:*|18:*|28:*|52:*|55:*|56:*|22:408|22:429|22:500|22:502|22:503|22:504) ;;
                    *) bm_retryable_failure=0; return "${code}" ;;
                esac
                (( attempt < 4 && SECONDS + delay < deadline )) || return "${code}"
                sleep "${delay}"
                delay=$((delay * 2))
            done
        }

        bm_curl 120 "${work}/job" \
            --header 'Content-Type: application/json' \
            --header "X-Osc-External-Id: prow:${PROW_JOB_ID}" \
            --data-binary "${OSC_BM_JOB}" "${url}"
        job="$(< "${work}/job")"
        [[ "${job}" =~ ^[0-9a-f]{32}$ ]]
        printf '%s\n' "${job}" > "${SHARED_DIR}/bm-job"
        printf 'OSC BM job ID: %s (Prow job ID: %s)\n' "${job}" "${PROW_JOB_ID}"
      credentials:
      - collection: sandboxed-containers-operator
        group: osc-bm-https
        mount_path: /var/run/osc-bm-https
      env:
      - name: OSC_BM_JOB
      - default: "0"
        documentation: Temporary debugging delay before pre starts (seconds or h/m/s).
        name: OSC_BM_PRE_SLEEP
      - documentation: Directory containing mounted HTTPS credentials.
        name: OSC_BM_SECRET_DIR
      from: bm-https
      grace_period: 1m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 10m0s
    test:
    - as: bm-test
      commands: |
        #!/usr/bin/env bash
        # shellcheck disable=SC2154
        set -euo pipefail
        : "${SHARED_DIR:?}"
        trap 'code=$?; if (( code != 0 )); then touch "${SHARED_DIR}/bm-failed"; fi; exit "${code}"' EXIT
        read -r job < "${SHARED_DIR}/bm-job"
        [[ "${job}" =~ ^[0-9a-f]{32}$ ]]
        # shellcheck disable=SC2034
        set +x
        umask 077
        work="$(mktemp -d)"
        : "${OSC_BM_SECRET_DIR:?}"
        read -r active < "${OSC_BM_SECRET_DIR}/active"
        [[ "${active}" == blue || "${active}" == green ]]
        client="${OSC_BM_SECRET_DIR}/${active}"
        read -r endpoint < "${client}-endpoint-ip"
        if [[ "${endpoint}" == *:* ]]; then
            endpoint="[${endpoint}]"
        fi
        url="https://${endpoint}:443/v1/jobs"
        curl_options=(--disable --silent --show-error --fail --proto '=https' --noproxy '*' --connect-timeout 30
            --cacert "${client}-ca-bundle" --cert "${client}-client-cert" --key "${client}-client-key")

        bm_curl() {
            local budget="$1" output="$2"
            shift 2
            local deadline=$((SECONDS + budget)) attempt remaining status code delay=1
            bm_retryable_failure=1
            for attempt in 1 2 3 4; do
                remaining=$((deadline - SECONDS))
                (( remaining > 0 )) || return 28
                code=0
                # Each attempt replaces partial output; all attempts share one deadline.
                status="$(curl "${curl_options[@]}" --max-time "${remaining}" \
                    --output "${output}" --write-out '%{http_code}' "$@")" || code=$?
                (( code == 0 )) && return 0
                case "${code}:${status}" in
                    7:*|18:*|28:*|52:*|55:*|56:*|22:408|22:429|22:500|22:502|22:503|22:504) ;;
                    *) bm_retryable_failure=0; return "${code}" ;;
                esac
                (( attempt < 4 && SECONDS + delay < deadline )) || return "${code}"
                sleep "${delay}"
                delay=$((delay * 2))
            done
        }

        previous=''
        wait_timeout=86400
        deadline=$((SECONDS + wait_timeout))
        while (( SECONDS < deadline )); do
            remaining=$((deadline - SECONDS))
            (( remaining > 120 )) && remaining=120
            code=0
            bm_curl "${remaining}" "${work}/status" "${url}/${job}" || code=$?
            if (( code != 0 )); then
                (( bm_retryable_failure )) || exit "${code}"
            else
                current=$(jq -er '[.state, .phase] | if all(.[]; type == "string") then join(" ") else error("Invalid status") end' "${work}/status")
                if [[ "${current}" != "${previous}" ]]; then
                    printf '  %s\n' "${current}"
                    previous="${current}"
                fi
                if jq -e '.phase == "ended" and (.state | IN("completed", "failed", "aborted", "interrupted", "lost"))' "${work}/status" >/dev/null; then
                    jq -e '.state == "completed" and (.classes | type == "array" and length == 0)' "${work}/status" >/dev/null
                    exit "$?"
                fi
            fi
            remaining=$((deadline - SECONDS))
            (( remaining > 10 )) && remaining=10
            (( remaining <= 0 )) || sleep "${remaining}"
        done
        printf '%s\n' 'Job observation timed out; execution remains controller-managed.' >&2
        exit 1
      credentials:
      - collection: sandboxed-containers-operator
        group: osc-bm-https
        mount_path: /var/run/osc-bm-https
      env:
      - documentation: Directory containing mounted HTTPS credentials.
        name: OSC_BM_SECRET_DIR
      from: bm-https
      grace_period: 1m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 24h2m0s
  timeout: 24h30m0s
