base_images:
  tests-private:
    name: tests-private
    namespace: ci
    tag: "4.22"
  upi-installer:
    name: "4.22"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
prowgen:
  disable_sparse_checkout: true
releases:
  latest:
    release:
      architecture: amd64
      channel: fast
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: aro421-ipi-peerpods
  capabilities:
  - intranet
  cron: 0 0 31 2 1
  reporter_config:
    channel: '#kata-ocp-ci-reports'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}}SUCCESS{{else}}ERROR{{end}}
      {{trimPrefix "periodic-ci-openshift-sandboxed-containers-operator-" .Spec.Job}}
      <{{.Status.URL}}|View logs>'
  restrict_network_access: true
  steps:
    cluster_profile: azure-qe
    env:
      ARO_CLUSTER_VERSION: "4.21"
      CATALOG_SOURCE_IMAGE: quay.io/redhat-user-workloads/ose-osc-tenant/osc-test-fbc:latest
      CATALOG_SOURCE_NAME: brew-catalog
      ENABLE_MUST_GATHER: "false"
      ENABLEPEERPODS: "true"
      HYPERSHIFT_AZURE_LOCATION: eastus
      INITDATA: ""
      INSTALL_KATA_RPM: "true"
      KATA_RPM_VERSION: 4.2.0-1.rhaos4.20.el9
      LOCATION: eastus
      MUST_GATHER_IMAGE: registry.redhat.io/openshift-sandboxed-containers/osc-must-gather-rhel9:latest
      MUST_GATHER_ON_FAILURE_ONLY: "false"
      OSC_INSTALL: "true"
      RUNTIMECLASS: kata-remote
      SLEEP_DURATION: 0h
      TEST_RELEASE_TYPE: Pre-GA
      TESTS_CAA_ENABLE: "true"
      TESTS_OSC_ENABLE: "true"
      TRUSTEE_URL: ""
      WORKLOAD_TO_TEST: peer-pods
    workflow: sandboxed-containers-operator-e2e-aro
  timeout: 24h0m0s
- as: aro421-ipi-coco
  capabilities:
  - intranet
  cron: 0 0 31 2 1
  reporter_config:
    channel: '#kata-ocp-ci-reports'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}}SUCCESS{{else}}ERROR{{end}}
      {{trimPrefix "periodic-ci-openshift-sandboxed-containers-operator-" .Spec.Job}}
      <{{.Status.URL}}|View logs>'
  restrict_network_access: false
  steps:
    cluster_profile: azure-qe
    env:
      ARO_CLUSTER_VERSION: "4.21"
      CATALOG_SOURCE_IMAGE: quay.io/redhat-user-workloads/ose-osc-tenant/osc-test-fbc:latest
      CATALOG_SOURCE_NAME: brew-catalog
      ENABLE_MUST_GATHER: "false"
      ENABLEPEERPODS: "true"
      HYPERSHIFT_AZURE_LOCATION: eastus
      INSTALL_KATA_RPM: "true"
      KATA_RPM_VERSION: 4.2.0-1.rhaos4.20.el9
      LOCATION: eastus
      MUST_GATHER_IMAGE: registry.redhat.io/openshift-sandboxed-containers/osc-must-gather-rhel9:latest
      MUST_GATHER_ON_FAILURE_ONLY: "false"
      OSC_INSTALL: "true"
      RUNTIMECLASS: kata-remote
      SLEEP_DURATION: 0h
      TEST_RELEASE_TYPE: Pre-GA
      TESTS_CAA_ENABLE: "true"
      TESTS_CAA_PROFILE: coco
      TRUSTEE_CATALOG_SOURCE_IMAGE: quay.io/redhat-user-workloads/ose-osc-tenant/trustee-test-fbc:latest
      TRUSTEE_INSTALL: "true"
      WORKLOAD_TO_TEST: coco
    workflow: sandboxed-containers-operator-e2e-aro
  timeout: 24h0m0s
zz_generated_metadata:
  branch: devel
  org: openshift
  repo: sandboxed-containers-operator
  variant: downstream-aro
