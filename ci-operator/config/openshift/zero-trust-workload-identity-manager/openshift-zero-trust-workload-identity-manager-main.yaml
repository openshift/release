base_images:
  cli-operator-sdk:
    name: cli-operator-sdk
    namespace: ocp
    tag: v1.39.2
  hypershift-cli:
    name: hypershift-cli
    namespace: ci
    tag: latest
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
binary_build_commands: make build --warn-undefined-variables
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    to: zero-trust-workload-identity-manager
  - dockerfile_path: Dockerfile.coverage
    to: zero-trust-workload-identity-manager-coverage
operator:
  bundles:
  - as: zero-trust-workload-identity-manager-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: openshift.io/zero-trust-workload-identity-manager:latest
    with: pipeline:zero-trust-workload-identity-manager
releases:
  initial:
    integration:
      name: "4.22"
      namespace: ocp
  latest:
    integration:
      name: "4.22"
      namespace: ocp
  multi-latest:
    release:
      architecture: multi
      channel: stable
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify
  commands: |
    make verify --warn-undefined-variables
  container:
    from: src
- as: unit
  commands: |
    make test --warn-undefined-variables
  container:
    from: src
- as: e2e-operator
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.20"
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace zero-trust-workload-identity-manager
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n zero-trust-workload-identity-manager "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n zero-trust-workload-identity-manager deployment zero-trust-workload-identity-manager-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: zero-trust-workload-identity-manager-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- always_run: false
  as: e2e-operator-fips
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_BUNDLE: zero-trust-workload-identity-manager-bundle
    env:
      FIPS_ENABLED: "true"
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: zero-trust-workload-identity-manager
      OO_SECURITY_CONTEXT: restricted
    test:
    - as: test
      cli: latest
      commands: make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: optional-operators-ci-operator-sdk-aws
- always_run: false
  as: e2e-operator-rhcos10-fips
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_BUNDLE: zero-trust-workload-identity-manager-bundle
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      FIPS_ENABLED: "true"
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: zero-trust-workload-identity-manager
      OO_SECURITY_CONTEXT: restricted
      OSSTREAM: rhel-10
    test:
    - as: test
      cli: latest
      commands: make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: optional-operators-ci-operator-sdk-aws
- always_run: false
  as: e2e-operator-rhcos10
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_BUNDLE: zero-trust-workload-identity-manager-bundle
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: zero-trust-workload-identity-manager
      OO_SECURITY_CONTEXT: restricted
      OSSTREAM: rhel-10
    test:
    - as: test
      cli: latest
      commands: make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: optional-operators-ci-operator-sdk-aws
- always_run: false
  as: e2e-federation-sds
  optional: true
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: openshift-org-aws
    dependencies:
      OO_BUNDLE: zero-trust-workload-identity-manager-bundle
      RELEASE_IMAGE_LATEST: release:multi-latest
    env:
      HYPERSHIFT_NODE_COUNT: "2"
    post:
    - as: destroy-cluster-b
      best_effort: true
      cli: latest
      commands: |
        set -euo pipefail
        if [[ ! -f "${SHARED_DIR}/cluster_b_info.txt" ]]; then
          echo "No Cluster B info found, skipping"; exit 0
        fi
        source "${SHARED_DIR}/cluster_b_info.txt"
        if [[ -z "${CLUSTER_B_NAME:-}" ]]; then
          echo "No Cluster B to destroy"; exit 0
        fi
        export KUBECONFIG="${SHARED_DIR}/mgmt_kubeconfig"
        echo "Destroying Cluster B: ${CLUSTER_B_NAME}"
        /usr/bin/hypershift destroy cluster aws \
          --name "${CLUSTER_B_NAME}" \
          --aws-creds "${CLUSTER_PROFILE_DIR}/.awscred" \
          --destroy-cloud-resources || true
        echo "Cluster B destruction initiated"
      from: hypershift-cli
      resources:
        requests:
          cpu: 100m
      timeout: 30m0s
    test:
    - as: create-cluster-b
      cli: latest
      commands: |
        set -euo pipefail

        echo "=== Creating Cluster B (second HyperShift guest) ==="
        export KUBECONFIG="${SHARED_DIR}/mgmt_kubeconfig"

        HASH_B="$(echo -n "${PROW_JOB_ID}-cluster-b" | sha256sum)"
        CLUSTER_B_NAME="${HASH_B:0:20}"
        INFRA_B_ID="${HASH_B:20:5}"
        echo "Cluster B name: ${CLUSTER_B_NAME}, infra-id: ${INFRA_B_ID}"
        echo "CLUSTER_B_NAME=${CLUSTER_B_NAME}" > "${SHARED_DIR}/cluster_b_info.txt"
        echo "INFRA_B_ID=${INFRA_B_ID}" >> "${SHARED_DIR}/cluster_b_info.txt"

        RELEASE_IMAGE="${RELEASE_IMAGE_LATEST}"
        BASE_DOMAIN=""
        if [[ -r "${CLUSTER_PROFILE_DIR}/baseDomain" ]]; then
          BASE_DOMAIN=$(< "${CLUSTER_PROFILE_DIR}/baseDomain")
        fi
        if [[ -z "${BASE_DOMAIN}" ]]; then
          echo "ERROR: Cannot determine base domain"; exit 1
        fi

        if [[ -f "${SHARED_DIR}/pull-secret-build-farm.json" ]] && command -v jq &>/dev/null; then
          jq -s '.[0] * .[1]' "${SHARED_DIR}/pull-secret-build-farm.json" /etc/ci-pull-credentials/.dockerconfigjson > /tmp/pull-secret-b.json
        elif [[ -f "${SHARED_DIR}/pull-secret-build-farm.json" ]]; then
          cp "${SHARED_DIR}/pull-secret-build-farm.json" /tmp/pull-secret-b.json
        else
          cp /etc/ci-pull-credentials/.dockerconfigjson /tmp/pull-secret-b.json
        fi

        EXPIRATION_DATE=$(date -d '4 hours' --iso=minutes --utc)
        echo "Creating Cluster B..."
        /usr/bin/hypershift create cluster aws \
          --name "${CLUSTER_B_NAME}" \
          --infra-id "${INFRA_B_ID}" \
          --node-pool-replicas 2 \
          --base-domain "${BASE_DOMAIN}" \
          --release-image "${RELEASE_IMAGE}" \
          --control-plane-availability-policy "SingleReplica" \
          --infra-availability-policy "SingleReplica" \
          --instance-type "m5.xlarge" \
          --region "us-east-1" \
          --pull-secret /tmp/pull-secret-b.json \
          --aws-creds "${CLUSTER_PROFILE_DIR}/.awscred" \
          --node-selector "hypershift.openshift.io/control-plane=true" \
          --olm-catalog-placement "management" \
          --additional-tags "expirationDate=${EXPIRATION_DATE}" \
          --annotations "prow.k8s.io/job=${JOB_NAME}" \
          --annotations "prow.k8s.io/build-id=${BUILD_ID}" \
          --annotations hypershift.openshift.io/cleanup-cloud-resources="false"

        echo "Waiting for Cluster B to become available..."
        oc wait --timeout=30m --for=condition=Available --namespace=clusters hostedcluster/${CLUSTER_B_NAME}

        echo "Extracting Cluster B kubeconfig..."
        for i in $(seq 1 60); do
          KUBECONFIG_B_NAME=$(oc get hc/${CLUSTER_B_NAME} -n clusters -o jsonpath='{ .status.kubeconfig.name }') && [[ -n "${KUBECONFIG_B_NAME}" ]] && break
          sleep 10
        done
        /usr/bin/hypershift create kubeconfig --namespace=clusters --name=${CLUSTER_B_NAME} > "${SHARED_DIR}/nested_kubeconfig_b"

        echo "Waiting for Cluster B clusteroperators..."
        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig_b"
        timeout 20m bash -c 'until oc wait clusterversion/version --for="condition=Available=True" 2>/dev/null; do sleep 30; done'
        echo "=== Cluster B is ready ==="
        oc get clusterversion
      credentials:
      - mount_path: /etc/ci-pull-credentials
        name: ci-pull-credentials
        namespace: test-credentials
      dependencies:
      - env: RELEASE_IMAGE_LATEST
        name: release:multi-latest
      from: hypershift-cli
      resources:
        requests:
          cpu: 100m
      timeout: 45m0s
    - as: install-ztwim
      cli: latest
      commands: |
        set -euo pipefail

        mkdir -p "${HOME}/.docker"
        cp "${SHARED_DIR}/pull-secret-build-farm.json" "${HOME}/.docker/config.json"

        install_ztwim_on_cluster() {
          local cluster_name="$1"
          local kubeconfig_path="$2"
          echo "=== Installing ZTWIM on ${cluster_name} ==="
          export KUBECONFIG="${kubeconfig_path}"
          oc whoami || { echo "ERROR: Cannot reach ${cluster_name}"; return 1; }
          oc create namespace zero-trust-workload-identity-manager
          operator-sdk run bundle --timeout=10m \
            --security-context-config=restricted \
            --install-mode=AllNamespaces \
            -n zero-trust-workload-identity-manager \
            "${OO_BUNDLE}" --verbose
          oc wait --for=condition=Available -n zero-trust-workload-identity-manager \
            deployment/zero-trust-workload-identity-manager-controller-manager --timeout=180s
          echo "=== ZTWIM installed successfully on ${cluster_name} ==="
        }

        install_ztwim_on_cluster "cluster-a" "${SHARED_DIR}/nested_kubeconfig"
        install_ztwim_on_cluster "cluster-b" "${SHARED_DIR}/nested_kubeconfig_b"
      dependencies:
      - env: OO_BUNDLE
        name: zero-trust-workload-identity-manager-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
      timeout: 25m0s
    - as: test-federation
      cli: latest
      commands: |
        set -euo pipefail
        NS="zero-trust-workload-identity-manager"

        echo "=== Phase 1: Configure ZTWIM on Cluster A ==="
        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig"
        APPS_DOMAIN_A=$(oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}')
        TRUST_DOMAIN_A="cluster-a.${APPS_DOMAIN_A}"
        cat <<EOF | oc apply -f -
        apiVersion: operator.openshift.io/v1alpha1
        kind: ZeroTrustWorkloadIdentityManager
        metadata:
          name: cluster
        spec:
          trustDomain: "${TRUST_DOMAIN_A}"
          clusterName: "cluster-a"
          bundleConfigMap: "spire-bundle"
        EOF

        echo "=== Phase 2: Configure ZTWIM on Cluster B ==="
        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig_b"
        APPS_DOMAIN_B=$(oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}')
        TRUST_DOMAIN_B="cluster-b.${APPS_DOMAIN_B}"
        cat <<EOF | oc apply -f -
        apiVersion: operator.openshift.io/v1alpha1
        kind: ZeroTrustWorkloadIdentityManager
        metadata:
          name: cluster
        spec:
          trustDomain: "${TRUST_DOMAIN_B}"
          clusterName: "cluster-b"
          bundleConfigMap: "spire-bundle"
        EOF

        echo "=== Phase 3: Wait for SPIRE on both clusters ==="
        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig"
        echo "Waiting for SPIRE on Cluster A..."
        timeout 300 bash -c "until oc get spireserver cluster -n ${NS} -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}' 2>/dev/null | grep -q True; do sleep 10; done"
        timeout 300 bash -c "until oc get spireagent cluster -n ${NS} -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}' 2>/dev/null | grep -q True; do sleep 10; done"

        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig_b"
        echo "Waiting for SPIRE on Cluster B..."
        timeout 300 bash -c "until oc get spireserver cluster -n ${NS} -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}' 2>/dev/null | grep -q True; do sleep 10; done"
        timeout 300 bash -c "until oc get spireagent cluster -n ${NS} -o jsonpath='{.status.conditions[?(@.type==\"Ready\")].status}' 2>/dev/null | grep -q True; do sleep 10; done"

        echo "=== Phase 4: Expose SPIRE federation bundle endpoints via Routes ==="
        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig"
        SPIRE_SVC_A=$(oc get svc -n ${NS} -l app.kubernetes.io/name=spire-server -o jsonpath='{.items[0].metadata.name}')
        cat <<EOF | oc apply -f -
        apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
          name: spire-federation-bundle
          namespace: ${NS}
        spec:
          to:
            kind: Service
            name: ${SPIRE_SVC_A}
          port:
            targetPort: 8443
          tls:
            termination: passthrough
        EOF
        BUNDLE_ENDPOINT_A="https://$(oc get route spire-federation-bundle -n ${NS} -o jsonpath='{.spec.host}'):443"
        echo "Cluster A bundle endpoint: ${BUNDLE_ENDPOINT_A}"

        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig_b"
        SPIRE_SVC_B=$(oc get svc -n ${NS} -l app.kubernetes.io/name=spire-server -o jsonpath='{.items[0].metadata.name}')
        cat <<EOF | oc apply -f -
        apiVersion: route.openshift.io/v1
        kind: Route
        metadata:
          name: spire-federation-bundle
          namespace: ${NS}
        spec:
          to:
            kind: Service
            name: ${SPIRE_SVC_B}
          port:
            targetPort: 8443
          tls:
            termination: passthrough
        EOF
        BUNDLE_ENDPOINT_B="https://$(oc get route spire-federation-bundle -n ${NS} -o jsonpath='{.spec.host}'):443"
        echo "Cluster B bundle endpoint: ${BUNDLE_ENDPOINT_B}"

        echo "=== Phase 5: Configure bidirectional federation ==="
        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig"
        cat <<EOF | oc apply -f -
        apiVersion: spire.spiffe.io/v1alpha1
        kind: ClusterFederatedTrustDomain
        metadata:
          name: federation-cluster-b
        spec:
          trustDomain: "${TRUST_DOMAIN_B}"
          bundleEndpointURL: "${BUNDLE_ENDPOINT_B}"
          bundleEndpointProfile:
            type: "https_spiffe"
            endpointSPIFFEID: "spiffe://${TRUST_DOMAIN_B}/spire/server"
        EOF

        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig_b"
        cat <<EOF | oc apply -f -
        apiVersion: spire.spiffe.io/v1alpha1
        kind: ClusterFederatedTrustDomain
        metadata:
          name: federation-cluster-a
        spec:
          trustDomain: "${TRUST_DOMAIN_A}"
          bundleEndpointURL: "${BUNDLE_ENDPOINT_A}"
          bundleEndpointProfile:
            type: "https_spiffe"
            endpointSPIFFEID: "spiffe://${TRUST_DOMAIN_A}/spire/server"
        EOF

        echo "Waiting for federation bundles to propagate (120s)..."
        sleep 120

        echo "=== Phase 6: Verify SDS config on both clusters ==="
        verify_sds_config() {
          local name="$1"
          local agent_conf
          agent_conf=$(oc get configmap spire-agent -n ${NS} -o jsonpath='{.data.agent\.conf}' 2>/dev/null || echo "")
          if [[ -z "${agent_conf}" ]]; then
            echo "FAIL: ${name} spire-agent configmap not found or empty"; return 1
          fi
          echo "${name} agent config retrieved ($(echo "${agent_conf}" | wc -c) bytes)"
          if echo "${agent_conf}" | grep -q "default_all_bundles_name"; then
            if echo "${agent_conf}" | grep -q "ROOTCA"; then
              echo "[PASS] ${name}: default_all_bundles_name contains ROOTCA"
            else
              echo "FAIL: ${name}: default_all_bundles_name found but ROOTCA value missing"; return 1
            fi
          else
            echo "FAIL: ${name}: default_all_bundles_name key not found in agent config"; return 1
          fi
        }

        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig"
        verify_sds_config "Cluster A"
        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig_b"
        verify_sds_config "Cluster B"
        echo "SDS config PASSED on both clusters"

        echo "=== Phase 7: Verify federated bundles in SPIRE Agents ==="
        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig"
        AGENT_POD_A=$(oc get pods -n ${NS} -l app.kubernetes.io/name=spire-agent -o jsonpath='{.items[0].metadata.name}')
        BUNDLE_A=$(oc exec -n ${NS} ${AGENT_POD_A} -c spire-agent -- \
          /opt/spire/bin/spire-agent api fetch bundle \
          -socketPath /tmp/spire-agent/public/spire-agent.sock 2>&1) || true
        echo "Cluster A bundles:"; echo "${BUNDLE_A}"

        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig_b"
        AGENT_POD_B=$(oc get pods -n ${NS} -l app.kubernetes.io/name=spire-agent -o jsonpath='{.items[0].metadata.name}')
        BUNDLE_B=$(oc exec -n ${NS} ${AGENT_POD_B} -c spire-agent -- \
          /opt/spire/bin/spire-agent api fetch bundle \
          -socketPath /tmp/spire-agent/public/spire-agent.sock 2>&1) || true
        echo "Cluster B bundles:"; echo "${BUNDLE_B}"

        echo ""; echo "=== RESULTS ==="
        PASS=true
        if echo "${BUNDLE_A}" | grep -q "${TRUST_DOMAIN_B}"; then
          echo "[PASS] Cluster A has federated bundle from B (${TRUST_DOMAIN_B})"
        else
          echo "[FAIL] Cluster A missing federated bundle from B"; PASS=false
        fi
        if echo "${BUNDLE_B}" | grep -q "${TRUST_DOMAIN_A}"; then
          echo "[PASS] Cluster B has federated bundle from A (${TRUST_DOMAIN_A})"
        else
          echo "[FAIL] Cluster B missing federated bundle from A"; PASS=false
        fi
        echo "[PASS] SDS config correct on both (ROOTCA)"

        if [[ "${PASS}" == "true" ]]; then
          echo ""; echo "=== ALL CHECKS PASSED ==="
          echo "1. Two HyperShift clusters with ZTWIM deployed"
          echo "2. Different trust domains configured"
          echo "3. Bidirectional federation via ClusterFederatedTrustDomain"
          echo "4. SDS default_all_bundles_name=ROOTCA on both"
          echo "5. Federated bundles present in both agents"
          echo "6. buildAll() serves local + federated CAs via ROOTCA on both clusters"
        else
          echo ""; echo "=== PARTIAL SUCCESS ==="
          echo "SDS config correct. Federation bundle propagation incomplete."
          exit 1
        fi
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 20m0s
    workflow: hypershift-hostedcluster-workflow
- always_run: false
  as: operator-e2e-coverage
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.20"
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: hack/e2e-coverage.sh collect
      credentials:
      - mount_path: /var/run/secrets/codecov
        name: ztwim-codecov-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    - chain: gather
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace zero-trust-workload-identity-manager
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n zero-trust-workload-identity-manager "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n zero-trust-workload-identity-manager deployment zero-trust-workload-identity-manager-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: zero-trust-workload-identity-manager-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: setup-coverage
      cli: latest
      commands: hack/e2e-coverage.sh setup
      dependencies:
      - env: COVERAGE_IMAGE
        name: zero-trust-workload-identity-manager-coverage
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- as: publish-e2e-coverage
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.20"
  postsubmit: true
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: hack/e2e-coverage.sh collect
      credentials:
      - mount_path: /var/run/secrets/codecov
        name: ztwim-codecov-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    - chain: gather
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace zero-trust-workload-identity-manager
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n zero-trust-workload-identity-manager "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n zero-trust-workload-identity-manager deployment zero-trust-workload-identity-manager-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: zero-trust-workload-identity-manager-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: setup-coverage
      cli: latest
      commands: hack/e2e-coverage.sh setup
      dependencies:
      - env: COVERAGE_IMAGE
        name: zero-trust-workload-identity-manager-coverage
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
zz_generated_metadata:
  branch: main
  org: openshift
  repo: zero-trust-workload-identity-manager
