build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-8-release-golang-1.20-openshift-4.14
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: containerlint
  commands: scripts/containerfile-lint.sh
  container:
    from: src
zz_generated_metadata:
  branch: master
  org: openshift
  repo: rhcos-image-layering-examples
