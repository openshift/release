binary_build_commands: make build
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-8-release-golang-1.18-openshift-4.12
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: |
    make lint
  container:
    from: src
- as: test
  commands: |
    make test
  container:
    from: src
- as: build
  commands: |
    make build
  container:
    from: src
- as: coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  secret:
    collection: sd-sre-secrets
    group: pagerduty-short-circuiter-codecov-token
    mount_path: /tmp/secret
- as: publish-coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  postsubmit: true
  secret:
    collection: sd-sre-secrets
    group: pagerduty-short-circuiter-codecov-token
    mount_path: /tmp/secret
zz_generated_metadata:
  branch: main
  org: openshift
  repo: pagerduty-short-circuiter
