base_images:
  base:
    name: "4.22"
    namespace: ocp
    tag: base-rhel9
  cli-operator-sdk:
    name: cli-operator-sdk
    namespace: ocp
    tag: v1.39.2
  loki:
    name: loki
    namespace: logging
    tag: v3.6.5
  logging-e2e-tests-runtime:
    name: openshift-logging-e2e-tests
    namespace: logging
    tag: main
  lokistack-gateway:
    name: lokistack-gateway
    namespace: logging
    tag: main
  opa-openshift:
    name: opa-openshift
    namespace: logging
    tag: main
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
  use_build_cache: true
images:
  items:
  - context_dir: operator
    dockerfile_path: Dockerfile
    from: base
    to: loki-operator
  - dockerfile_literal: |
      FROM registry.redhat.io/ubi9/go-toolset:latest
      COPY . /go/src/github.com/openshift/loki
    inputs:
      base:
        as:
        - registry.redhat.io/ubi9/go-toolset:latest
    to: loki-operator-src
  - context_dir: operator
    dockerfile_path: passthrough-gateway.Dockerfile
    from: base
    to: passthrough-gateway
  - dockerfile_literal: |
      FROM logging-e2e-tests-runtime
      RUN install -d -m 0755 /etc/pki/rpm-gpg \
          && curl -fsSL https://downloads.claude.ai/keys/claude-code.asc \
               -o /etc/pki/rpm-gpg/RPM-GPG-KEY-claude-code \
          && rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-claude-code \
          && echo -e "[claude-code]\nname=Claude Code\nbaseurl=https://downloads.claude.ai/claude-code/rpm/stable/\$basearch\nenabled=1\ngpgcheck=1\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-claude-code" \
               > /etc/yum.repos.d/claude-code.repo \
          && dnf install -y claude-code \
          && dnf clean all
    from: logging-e2e-tests-runtime
    to: obs-tests-runner
operator:
  bundles:
  - as: loki-operator-bundle
    context_dir: operator/bundle/openshift
    dockerfile_path: bundle.Dockerfile
  substitutions:
  - pullspec: quay.io/openshift-logging/loki-operator:0.1.0
    with: pipeline:loki-operator
  - pullspec: quay.io/openshift-logging/loki:.+
    with: pipeline:loki
  - pullspec: quay.io/observatorium/api:latest
    with: pipeline:lokistack-gateway
  - pullspec: quay.io/observatorium/opa-openshift:latest
    with: pipeline:opa-openshift
  - pullspec: quay.io/openshift-logging/passthrough-gateway:.+
    with: pipeline:passthrough-gateway
promotion:
  to:
  - additional_images:
      loki-operator-bundle: loki-operator-bundle
    name: 5.y
    namespace: logging
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    release:
      channel: stable
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  steps:
    test:
    - as: lint
      commands: cd operator && GOFLAGS="" make lint
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: test
  steps:
    test:
    - as: unit
      commands: cd operator && GOFLAGS="" go test ./...
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: prometheus-rules
      commands: cd operator && make test-unit-prometheus
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: build
  steps:
    test:
    - as: manager
      commands: cd operator && GOFLAGS="" make manager
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: broker
      commands: cd operator && GOFLAGS="" make bin/loki-broker
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: storage-size-calculator
      commands: cd operator && GOFLAGS="" make size-calculator
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: test-operator
  cluster_claim:
    architecture: amd64
    cloud: aws
    labels:
      region: us-east-1
    owner: obs-logging
    product: ocp
    timeout: 1h30m0s
    version: "4.21"
  steps:
    dependencies:
      OO_INDEX: ci-index-loki-operator-bundle
    env:
      OO_CHANNEL: stable
      OO_INSTALL_NAMESPACE: openshift-operators-redhat
      OO_PACKAGE: loki-operator
      OO_TARGET_NAMESPACES: '!all'
    test:
    - as: install
      cli: latest
      commands: |
        oc -n openshift-operators-redhat rollout status deployment loki-operator-controller-manager
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: optional-operators-ci-generic-claim
- as: e2e-prgate
  cluster_claim:
    architecture: amd64
    cloud: aws
    labels:
      region: us-east-2
    owner: obs
    product: ocp
    timeout: 1h0m0s
    version: "4.22"
  optional: true
  skip_if_only_changed: ^(?:.*/)?docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    env:
      AGENT_SKILL: loki
      JIRA_PROJECT: LOG
      OPERATORS: |
        [
            {"name": "cluster-logging", "source": "redhat-operators", "install_namespace": "openshift-logging", "target_namespaces": "", "operator_group": "openshift-logging"}
        ]
      TEST_SUITE: openshift-logging-e2e-tests/loki-operator
    post:
    - ref: openshift-observability-qe-agent
    test:
    - as: install
      cli: latest
      commands: |
        for ns in openshift-logging openshift-operators-redhat; do
          oc create namespace "$ns"
          oc annotate namespace "$ns" openshift.io/node-selector=""
          oc label namespace "$ns" openshift.io/cluster-monitoring="true"
        done
        cd /tmp && operator-sdk run bundle --timeout=10m --install-mode AllNamespaces --security-context-config restricted -n openshift-operators-redhat "$OO_BUNDLE"
        oc wait --for condition=Available --timeout=5m -n openshift-operators-redhat deployment loki-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: loki-operator-bundle
      from: cli-operator-sdk
      resources:
        requests:
          cpu: 1000m
          memory: 400Mi
    - ref: install-operators
    - ref: openshift-observability-logging-e2e-tests
    workflow: generic-claim
zz_generated_metadata:
  branch: main
  org: openshift
  repo: loki
