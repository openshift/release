base_images:
  hypershift-operator:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
  ocp_builder_rhel-9-base-nodejs-openshift-5.1:
    name: builder
    namespace: ocp
    tag: rhel-9-base-nodejs-openshift-5.1
  ocp_builder_rhel-9-golang-1.26-openshift-5.1:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-5.1
build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.access.redhat.com/ubi9/nodejs-24:latest
      USER root
      RUN mkdir -p /go/src && chmod -R 777 /go
      ENV COREPACK_ENABLE_DOWNLOAD_PROMPT=0
      RUN npm install -g corepack@0.36.0 && corepack enable
      USER 1001
images:
  items:
  - dockerfile_path: Dockerfile
    to: console
  - dockerfile_path: Dockerfile.downloads
    to: console-downloads
  - dockerfile_path: Dockerfile.plugins.demo
    from: ocp_builder_rhel-9-base-nodejs-openshift-5.1
    to: console-plugin-demo
  - dockerfile_literal: |
      FROM ocp_builder_rhel-9-base-nodejs-openshift-5.1
      USER root
      RUN dnf install -y \
          alsa-lib atk at-spi2-atk cups-libs libdrm libXcomposite \
          libXdamage libXrandr mesa-libgbm pango nss nss-util nspr \
          libxkbcommon libXfixes libXcursor libXext libXi libXtst \
          libwayland-client && \
          dnf clean all
      COPY . /go/src/github.com/openshift/console/
      WORKDIR /go/src/github.com/openshift/console
      ENV PLAYWRIGHT_BROWSERS_PATH=/opt/playwright
      RUN YARN_PATH="frontend/$(awk '/yarnPath:/{print $2}' frontend/.yarnrc.yml)" && \
          printf '%s\n' '#!/bin/sh' "exec node /go/src/github.com/openshift/console/$YARN_PATH \"\$@\"" > /usr/local/bin/yarn && \
          chmod +x /usr/local/bin/yarn
      RUN cd frontend && \
          yarn install --immutable && \
          yarn playwright install chromium
      RUN dnf install -y python3 git jq && dnf clean all
      RUN npm install -g @anthropic-ai/claude-code@2.1.273 && claude --version
    from: ocp_builder_rhel-9-base-nodejs-openshift-5.1
    inputs:
      src:
        paths:
        - destination_dir: .
          source_path: /go/src/github.com/openshift/console/.
    to: console-tests
promotion:
  to:
  - name: "5.1"
    namespace: ocp
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
  analyze:
    requests:
      cpu: "1"
      memory: 14Gi
  console:
    requests:
      cpu: "2"
      memory: 10Gi
  console-tests:
    requests:
      cpu: "1"
      memory: 12Gi
  frontend:
    requests:
      cpu: "2"
      memory: 10Gi
  test-bin:
    requests:
      cpu: "1"
      memory: 10Gi
test_binary_build_commands: |
  ./build-frontend.sh
  ./build-demos.sh
tests:
- as: backend
  commands: |
    export XDG_CACHE_HOME=/tmp/.cache
    mkdir -p ${ARTIFACT_DIR} ${XDG_CACHE_HOME}
    go install -mod= github.com/jstemmer/go-junit-report@latest
    /home/prow/go/src/github.com/openshift/console/test-backend.sh
  container:
    from: ocp_builder_rhel-9-golang-1.26-openshift-5.1
  skip_if_only_changed: \.md$|(?:^|/)(?:\.gitignore|OWNERS|LICENSE)$
- as: frontend
  commands: |
    git config --global --add safe.directory /go/src/github.com/openshift/console
    ./test-frontend.sh
  container:
    from: test-bin
  skip_if_only_changed: \.md$|(?:^|/)(?:\.gitignore|OWNERS|LICENSE)$
- as: analyze
  commands: ./analyze.sh
  container:
    from: test-bin
  skip_if_only_changed: \.md$|(?:^|/)(?:\.gitignore|OWNERS|LICENSE)$
- always_run: false
  as: e2e-gcp-console
  pipeline_skip_if_only_changed: \.md$|(?:^|/)(?:\.gitignore|OWNERS|LICENSE)$
  steps:
    allow_skip_on_success: true
    cluster_profile: openshift-org-gcp
    env:
      CONSOLE_FLAKE_AGENT_ENABLED: "true"
      CONSOLE_FLAKE_DRIVER_SHA256: 1f894283dd29c7978cf2203cc8b702b7d34634a7ae1b76bd50d5780af42aeccf
      CONSOLE_FLAKE_SKILL_REVISION: main
      CONSOLE_FLAKE_SKILL_SHA256: 8dea3696de872902b10dd642a330dc6eb13aa4477fb2108db4cd5acbc85a8ef0
    post:
    - ref: openshift-console-qe-agent
    - chain: ipi-gcp-post
    - ref: send-results-to-reportportal
    test:
    - as: test
      cli: latest
      commands: |
        ./test-prow-e2e.sh
      dependencies:
      - env: PLUGIN_PULL_SPEC
        name: console-plugin-demo
      from: console-tests
      resources:
        requests:
          cpu: "4"
          memory: 10Gi
      timeout: 2h0m0s
    workflow: ipi-gcp
- always_run: false
  as: e2e-gcp-console-techpreview
  optional: true
  pipeline_skip_if_only_changed: \.md$|(?:^|/)(?:\.gitignore|OWNERS|LICENSE)$
  steps:
    cluster_profile: openshift-org-gcp
    env:
      FEATURE_SET: TechPreviewNoUpgrade
    test:
    - as: test
      cli: latest
      commands: |
        ./test-prow-e2e-techpreview.sh
      dependencies:
      - env: PLUGIN_PULL_SPEC
        name: console-plugin-demo
      from: console-tests
      resources:
        requests:
          cpu: "4"
          memory: 10Gi
      timeout: 2h0m0s
    workflow: ipi-gcp
- always_run: false
  as: e2e-hypershift-console
  disable_pod_scaler: true
  optional: true
  pipeline_skip_if_only_changed: \.md$|(?:^|/)(?:\.gitignore|OWNERS|LICENSE)$
  steps:
    allow_skip_on_success: true
    cluster_profile: hypershift-aws
    env:
      CONSOLE_FLAKE_AGENT_ENABLED: "true"
      CONSOLE_FLAKE_DRIVER_SHA256: 1f894283dd29c7978cf2203cc8b702b7d34634a7ae1b76bd50d5780af42aeccf
      CONSOLE_FLAKE_SKILL_REVISION: main
      CONSOLE_FLAKE_SKILL_SHA256: 8dea3696de872902b10dd642a330dc6eb13aa4477fb2108db4cd5acbc85a8ef0
    post:
    - ref: openshift-console-qe-agent
    - chain: hypershift-dump
    - chain: hypershift-aws-destroy
    - ref: send-results-to-reportportal
    pre:
    - ref: ipi-install-rbac
    - chain: hypershift-setup-root-management-cluster
    - chain: hypershift-aws-create
    test:
    - as: test
      cli: latest
      commands: |
        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig"
        # TODO: temporary HyperShift compatibility for the console e2e scripts,
        # kept here until they support hosted clusters. Run the suite this way
        # to identify which tests need disabling under HCP. oauths.config is
        # immutable on hosted clusters, so the htpasswd IDP is configured on
        # the HostedCluster in the management cluster instead. Configuring an
        # IDP disables the kubeadmin user on HyperShift, so the admin persona
        # logs in as an e2e-admin user in the same IDP with cluster-admin.
        MGMT_KUBECONFIG="${SHARED_DIR}/kubeconfig"
        CLUSTER_NAME="$(cat "${SHARED_DIR}/cluster-name")"
        htpasswd_file=/tmp/htpasswd
        printf '%s\ne2e-admin:%s\n' "$(grep 'htpasswd:' frontend/packages/console-shared/src/test-data/htpasswd-secret.yaml | awk '{print $2}' | base64 -d | tr -d '\n')" "$(openssl passwd -apr1 test)" > "${htpasswd_file}"
        oc --kubeconfig="${MGMT_KUBECONFIG}" -n clusters create secret generic htpass-secret --from-file=htpasswd="${htpasswd_file}" --dry-run=client -o yaml | oc --kubeconfig="${MGMT_KUBECONFIG}" apply -f -
        oc --kubeconfig="${MGMT_KUBECONFIG}" patch hostedcluster -n clusters "${CLUSTER_NAME}" --type=merge -p '{"spec":{"configuration":{"oauth":{"identityProviders":[{"name":"test","mappingMethod":"claim","type":"HTPasswd","htpasswd":{"fileData":{"name":"htpass-secret"}}}]}}}}'
        oc create clusterrolebinding e2e-admin --clusterrole=cluster-admin --user=e2e-admin --dry-run=client -o yaml | oc apply -f -
        idp_ready=false
        for i in $(seq 1 24); do
          cp "${KUBECONFIG}" /tmp/login-check.kubeconfig
          if oc --kubeconfig=/tmp/login-check.kubeconfig login --username=test --password=test >/dev/null 2>&1; then
            idp_ready=true
            echo "htpasswd IDP is ready"
            break
          fi
          sleep 15
        done
        if [ "${idp_ready}" != "true" ]; then
          echo "htpasswd IDP did not become ready in time"
          exit 1
        fi
        admin_verified=false
        for i in $(seq 1 12); do
          cp "${KUBECONFIG}" /tmp/admin-check.kubeconfig
          if oc --kubeconfig=/tmp/admin-check.kubeconfig login --username=e2e-admin --password=test >/dev/null 2>&1; then
            admin_verified=true
            echo "admin user verified"
            break
          fi
          echo "admin user not able to log in yet, retrying"
          sleep 15
        done
        if [ "${admin_verified}" != "true" ]; then
          echo "admin user could not be verified"
          exit 1
        fi
        echo test > /tmp/kubeadmin-password
        export KUBEADMIN_PASSWORD_FILE=/tmp/kubeadmin-password
        export OPENSHIFT_USERNAME=e2e-admin
        # IDP is configured above; stub out create-user.sh, which cannot patch
        # the immutable guest oauths.config on hosted clusters.
        cat > contrib/create-user.sh <<'EOS'
        #!/usr/bin/env bash
        # HyperShift: the htpasswd IDP is configured on the HostedCluster in
        # the management cluster by the job commands before the suite runs.
        set -euo pipefail
        EOS
        ./test-prow-e2e.sh
      dependencies:
      - env: PLUGIN_PULL_SPEC
        name: console-plugin-demo
      from: console-tests
      resources:
        requests:
          cpu: "4"
          memory: 10Gi
      timeout: 4h0m0s
zz_generated_metadata:
  branch: main
  org: openshift
  repo: console
