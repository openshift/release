base_images:
  base:
    name: "4.11"
    namespace: ocp
    tag: base
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.rhel7
    from: base
    to: ptp-operator
operator:
  bundles:
  - as: ptp-operator-bundle
    dockerfile_path: bundleci.Dockerfile
  substitutions:
  - pullspec: quay.io/openshift/origin-ptp-operator:4.11
    with: pipeline:ptp-operator
promotion:
  to:
  - name: "4.11"
    namespace: ocp
releases:
  initial:
    integration:
      name: "4.11"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.11"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: gofmt
  commands: make fmt
  container:
    from: src
- as: e2e-aws
  steps:
    cluster_profile: openshift-org-aws
    workflow: openshift-e2e-aws
- as: operator-e2e
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_INDEX: ci-index-ptp-operator-bundle
    env:
      OO_CHANNEL: alpha
      OO_INSTALL_NAMESPACE: openshift-ptp
      OO_PACKAGE: ptp-operator
      OO_TARGET_NAMESPACES: '!install'
    test:
    - as: e2e
      commands: make test-validation-only
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: optional-operators-ci-aws
- as: e2e-telco5g-ptp
  capabilities:
  - intranet
  cron: 0 0 * * 1,3,5
  restrict_network_access: false
  steps:
    dependencies:
      OO_INDEX: ci-index-ptp-operator-bundle
    env:
      OO_CHANNEL: alpha
      OO_INSTALL_NAMESPACE: openshift-ptp
      OO_PACKAGE: ptp-operator
      OO_TARGET_NAMESPACES: '!install'
      T5CI_JOB_TYPE: ptp
      T5CI_PTP_SKIP_DEPLOY: "true"
      T5CI_VERSION: "4.11"
    test:
    - ref: ipi-install-rbac
    - ref: optional-operators-subscribe
    - ref: telco5g-ptp-tests
    workflow: telco5g-ptp
zz_generated_metadata:
  branch: release-4.11
  org: openshift
  repo: ptp-operator
