build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: openshift/Containerfile.rhel
    to: azure-karpenter-provider-azure
promotion:
  to:
  - disabled: true
    name: "5.1"
    namespace: ocp
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
zz_generated_metadata:
  branch: release-5.1
  org: openshift
  repo: Azure-karpenter-provider-azure
