build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    to: faas-console-plugin
promotion:
  to:
  - name: "5.0"
    namespace: ocp
releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 6Gi
    requests:
      cpu: 1000m
      memory: 6Gi
tests:
- as: lint
  commands: yarn install --immutable && yarn run lint && yarn run build
  container:
    from: src
- as: unit
  commands: yarn install --immutable && yarn run test
  container:
    from: src
  skip_if_only_changed: \.md$|^docs/|^demo/|^\.claude/|^\.github/|^\.vscode/|^\.husky/|^hack/|^(LICENSE|OWNERS)$
- as: e2e-aws
  skip_if_only_changed: \.md$|^docs/|^demo/|^\.claude/|^\.github/|^\.vscode/|^\.husky/|^hack/|^(LICENSE|OWNERS)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      OPERATORS: '[{"name": "serverless-operator", "source": "redhat-operators", "channel":
        "stable", "install_namespace": "openshift-serverless", "operator_group": "openshift-serverless"},
        {"name": "openshift-pipelines-operator-rh", "source": "redhat-operators",
        "channel": "latest", "install_namespace": "openshift-operators"}]'
    test:
    - ref: install-operators
    - as: e2e
      cli: latest
      commands: ./test-prow-e2e.sh
      dependencies:
      - env: PLUGIN_PULL_SPEC
        name: faas-console-plugin
      from: src
      grace_period: 30m0s
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
      timeout: 3h0m0s
    workflow: openshift-e2e-aws
zz_generated_metadata:
  branch: master
  org: openshift
  repo: faas-console-plugin
