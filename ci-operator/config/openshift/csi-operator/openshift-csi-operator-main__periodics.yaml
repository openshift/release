base_images:
  aws-efs-csi-driver-operator:
    name: "5.1"
    namespace: ocp
    tag: aws-efs-csi-driver-operator
  aws-efs-driver-operand:
    name: "5.1"
    namespace: ocp
    tag: aws-efs-csi-driver
  livenessprobe-operand:
    name: "5.1"
    namespace: ocp
    tag: csi-livenessprobe
  operator-index:
    name: redhat-operator-index
    namespace: ci
    tag: v4.10
  provisioner-operand:
    name: "5.1"
    namespace: ocp
    tag: csi-external-provisioner
  proxy-operand:
    name: "5.1"
    namespace: ocp
    tag: kube-rbac-proxy
  registrar-operand:
    name: "5.1"
    namespace: ocp
    tag: csi-node-driver-registrar
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
build_root:
  from_repository: true
operator:
  bundles:
  - as: aws-efs-csi-driver-operator-bundle
    base_index: operator-index
    context_dir: config/aws-efs
    dockerfile_path: bundle.Dockerfile
    update_graph: replaces
  substitutions:
  - pullspec: quay.io/openshift/origin-aws-efs-csi-driver:latest
    with: pipeline:aws-efs-driver-operand
  - pullspec: quay.io/openshift/origin-aws-efs-csi-driver-operator:latest
    with: pipeline:aws-efs-csi-driver-operator
  - pullspec: quay.io/openshift/origin-csi-external-provisioner:latest
    with: pipeline:provisioner-operand
  - pullspec: quay.io/openshift/origin-csi-node-driver-registrar:latest
    with: pipeline:registrar-operand
  - pullspec: quay.io/openshift/origin-csi-livenessprobe:latest
    with: pipeline:livenessprobe-operand
  - pullspec: quay.io/openshift/origin-kube-rbac-proxy:latest
    with: pipeline:proxy-operand
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: periodic-tls-scanner-aws-efs
  cron: 0 6 1,15 * *
  reporter_config:
    channel: '#team-ocp-storage-triage'
    job_states_to_report:
    - failure
    - error
    report_template: |
      ':red_jenkins_circle: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>'
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_INDEX: ci-index-aws-efs-csi-driver-operator-bundle
    env:
      CLUSTERCSIDRIVER: efs.csi.aws.com
      OO_CHANNEL: stable
      OO_INSTALL_NAMESPACE: openshift-cluster-csi-drivers
      OO_PACKAGE: aws-efs-csi-driver-operator
      OO_TARGET_NAMESPACES: '!all'
      SCAN_NAMESPACE: openshift-cluster-csi-drivers
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
      TRUECONDITIONS: AWSEFSDriverControllerServiceControllerAvailable AWSEFSDriverNodeServiceControllerAvailable
    test:
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: openshift-e2e-aws-csi-efs
zz_generated_metadata:
  branch: main
  org: openshift
  repo: csi-operator
  variant: periodics
