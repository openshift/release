    tag: latest
  upi-installer:
    name: "5.0"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: builder
    namespace: konveyor
    tag: ubi9-v1.27
releases:
  latest:
    release:
      channel: stable
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 500m
      memory: 1000Mi
tests:
- as: e2e-sbr-ga-weekly-aws-odf
  capabilities:
  - intranet
  cron: 0 23 * * 0
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      CATALOG_IMAGE_REF: registry.redhat.io/redhat/redhat-operator-index:v5.0
      CATALOG_MODE: direct
      COMPUTE_NODE_TYPE: m5.4xlarge
      ECO_TEST_FEATURES: sbr-operator
      ECO_TEST_LABELS: '!tier:upgrade && !tier:upgrade-operator && !tier:fresh-install
        && !tier:upgrade-cluster && !tier:interop'
      ECO_TEST_VERBOSE: "true"
      OCP_VERSION: "500"
      ODF_OPERATOR_CHANNEL: stable-5.0
      ODF_VERSION_MAJOR_MINOR: "5.0"
      OO_CHANNEL: stable
      OPERATORS: storage-based-remediation,node-healthcheck-operator
      TEST_NAME: e2e-sbr-ga-weekly-aws-odf
      TEST_STEPS: e2e-test
    post:
    - ref: medik8s-analyze-e2e-failure
    - chain: ipi-aws-post
    test:
    - chain: medik8s-setup
    - ref: medik8s-deploy-odf-dev-catalog
    - ref: medik8s-sbr-nfs-dynamic-provisioner
    - as: e2e-test
      cli: latest
      commands: |
        [[ -f "${SHARED_DIR}/workload_image" ]] && export WORKLOAD_IMAGE=$(cat "${SHARED_DIR}/workload_image")
        make run-tests
      env:
      - name: ECO_TEST_FEATURES
      - name: ECO_TEST_VERBOSE
      - name: ECO_TEST_LABELS
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-aws
