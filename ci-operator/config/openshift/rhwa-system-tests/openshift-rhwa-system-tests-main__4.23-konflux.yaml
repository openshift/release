tests:
- as: e2e-sbr-daily-aws-odf
  capabilities:
  - intranet
  cron: 0 0 * * *
  steps:
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: ocp-ci.medik8s-ci.devcluster.openshift.com
      COMPUTE_NODE_TYPE: m5.4xlarge
      ECO_TEST_FEATURES: sbr-operator
      ECO_TEST_LABELS: '!tier:upgrade && !tier:upgrade-operator && !tier:fresh-install
        && !tier:upgrade-cluster && !tier:interop && !stability:candidate && !tier:preview'
      ECO_TEST_VERBOSE: "true"
      OCP_VERSION: "423"
      ODF_OPERATOR_SUB_CHANNEL: stable-4.22
      OO_CHANNEL: stable
      OPERATORS: storage-based-remediation,node-healthcheck-operator
      TEST_NAME: e2e-sbr-daily-aws-odf
      TEST_STEPS: e2e-test
    post:
    - ref: medik8s-analyze-e2e-failure
    - chain: ipi-aws-post
    test:
    - chain: medik8s-setup
    - ref: odf-prepare-cluster
    - ref: operatorhub-subscribe-odf-operator
    - ref: odf-apply-storage-cluster
    - ref: medik8s-sbr-nfs-dynamic-provisioner
    - ref: medik8s-sbr-apply-remediation-template
    - as: e2e-test
      cli: latest
      commands: |
        [[ -f "${SHARED_DIR}/workload_image" ]] && export WORKLOAD_IMAGE=$(cat "${SHARED_DIR}/workload_image")
        [[ -f "${SHARED_DIR}/injector_image" ]] && export SBR_INJECTOR_IMAGE=$(cat "${SHARED_DIR}/injector_image")
        make run-tests
      env:
      - name: ECO_TEST_FEATURES
      - name: ECO_TEST_VERBOSE
      - name: ECO_TEST_LABELS
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-aws
