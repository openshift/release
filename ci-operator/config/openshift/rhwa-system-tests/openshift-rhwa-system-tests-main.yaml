build_root:
  image_stream_tag:
    name: builder
    namespace: konveyor
    tag: ubi9-v1.27
images:
  items:
  - dockerfile_path: Dockerfile
    inputs:
      root:
        as:
        - quay.io/konveyor/builder:ubi9-v1.27
    to: rhwa-system-tests
promotion:
  to:
  - namespace: medik8s
    tag: main
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 500m
      memory: 1000Mi
zz_generated_metadata:
  branch: main
  org: openshift
  repo: rhwa-system-tests
