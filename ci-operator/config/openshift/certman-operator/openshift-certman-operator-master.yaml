base_images:
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: build/Dockerfile
    to: certman-operator
  - dockerfile_literal: |
      FROM src AS builder
      RUN CGO_ENABLED=0 go test ./test/e2e -v -c --tags=osde2e -o /usr/local/bin/e2e.test
      FROM rosa-aws-cli
      COPY --from=builder /usr/local/bin/e2e.test /usr/local/bin/e2e.test
    inputs:
      rosa-aws-cli:
        as:
        - rosa-aws-cli
      src:
        as:
        - src
        - builder
    to: operator-e2e
releases:
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "4.21"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-binary-build-success
  commands: |
    make e2e-binary-build
  container:
    from: src
- as: coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  secret:
    mount_path: /tmp/secret
    name: certman-operator-codecov-token
- as: publish-coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  postsubmit: true
  secret:
    mount_path: /tmp/secret
    name: certman-operator-codecov-token
- as: lint
  commands: make lint
  container:
    from: src
- as: test
  commands: make test
  container:
    from: src
- as: validate
  commands: make validate
  container:
    from: src
- as: hive-e2e
  capabilities:
  - intranet
  restrict_network_access: false
  run_if_changed: ^(test/e2e/|controllers/|pkg/|config/)
  steps:
    cluster_profile: rosa-e2e-01
    dependencies:
      OPERATOR_IMAGE: pipeline:certman-operator
    env:
      BACKPLANE_CLUSTER_ID: 1g268u7pp694gj152nj16me4sv615lpv
      BACKPLANE_ELEVATE_REASON: https://redhat.atlassian.net/browse/ROSAENG-61837
      GINKGO_FOCUS: Certman Operator Hive
      OPERATOR_NAME: certman-operator
    workflow: rosa-hive-e2e
- as: hive-e2e-promotion-int
  capabilities:
  - intranet
  cron: 0 0 31 2 *
  reporter_config:
    channel: '#rosa-prow-info'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}}:green_jenkins_circle:{{else}}:red_jenkins_circle:{{end}}
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>'
  restrict_network_access: false
  steps:
    cluster_profile: rosa-e2e-01
    env:
      BACKPLANE_CLUSTER_ID: 1g268u7pp694gj152nj16me4sv615lpv
      BACKPLANE_ELEVATE_REASON: https://redhat.atlassian.net/browse/ROSAENG-61837
      GINKGO_FOCUS: Certman Operator Hive
      OPERATOR_NAME: certman-operator
    workflow: rosa-hive-e2e
- as: hive-e2e-promotion-stage
  capabilities:
  - intranet
  cron: 0 0 31 2 *
  reporter_config:
    channel: '#rosa-prow-info'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}}:green_jenkins_circle:{{else}}:red_jenkins_circle:{{end}}
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>'
  restrict_network_access: false
  steps:
    cluster_profile: rosa-e2e-01
    env:
      BACKPLANE_CLUSTER_ID: 1farlonnersks14ohfp155uoonupr9id
      BACKPLANE_ELEVATE_REASON: https://redhat.atlassian.net/browse/ROSAENG-61837
      GINKGO_FOCUS: Certman Operator Hive
      OPERATOR_NAME: certman-operator
    workflow: rosa-hive-e2e
zz_generated_metadata:
  branch: master
  org: openshift
  repo: certman-operator
