        # What the cloud looks like around an ARO HCP shaped cluster.
        # Everything here is a read.
        #
        # errexit off explicitly, rather than merely left alone. These
        # commands are wrapped before they run, set -uo pipefail does not
        # clear -e if that wrapper set it, and a bare command that fails
        # would abandon the step where it stands. A step that stops at its
        # first unanswerable question gathers one fact where it could have
        # gathered twenty.
        set +e
        set -uo pipefail

        AZURE_CONFIG_DIR="$(mktemp -d)"
        export AZURE_CONFIG_DIR

        redact() {
          sed -E 's/[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}/<guid>/g'
        }
        section() { echo; echo "=== $* ==="; }

        # Azure names subscriptions, tenants and principals in its output
        # and in its errors, and prow logs and artifacts are both public,
        # so everything az says is redacted before it is printed or saved
        # and no credential value is ever held in a shell variable.
        creds="${CLUSTER_PROFILE_DIR}/osServicePrincipal.json"
        if [[ "${USE_HYPERSHIFT_AZURE_CREDS:-false}" == "true" ]]; then
          creds="/etc/hypershift-ci-jobs-azurecreds/credentials.json"
        fi
