        export KUBECONFIG="${SHARED_DIR}/nested_kubeconfig"

        section() { echo; echo "=== $* ==="; }

        section "version"
        oc get clusterversion version -o jsonpath='{.status.desired.version}{"\n"}' 2>&1 | sed 's/^/  /'

        section "cluster operators"
        oc get clusteroperators 2>&1 | sed 's/^/  /'
        oc get clusteroperators -o yaml >"${ARTIFACT_DIR}/clusteroperators.yaml" 2>/dev/null

        section "nodes"
        # providerID is printed in full because
        # internal/platform/azure/providerid.go parses the virtual machine
        # and its resource group out of it, and which group that is decides
        # whether the operator can write a node interface at all.
        for node in $(oc get nodes -o name 2>/dev/null); do
          echo "  ${node#node/}"
          oc get "${node}" -o jsonpath='    providerID: {.spec.providerID}{"\n"}' 2>/dev/null
          oc get "${node}" -o jsonpath='    zone:       {.metadata.labels.topology\.kubernetes\.io/zone}{"\n"}' 2>/dev/null
        done

        section "machine API"
        # A hosted cluster's node pools are managed from the control plane,
        # which lives elsewhere. Whether the guest has a machine API at all
        # is a fact the operator's node discovery depends on.
        oc get machines.machine.openshift.io -A 2>&1 | sed 's/^/  /'

