base_images:
  ocm-cli:
    name: ocm-cli
    namespace: ci
    tag: latest
  operator-sdk:
    name: "4.17"
    namespace: origin
    tag: operator-sdk
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    to: bgp-cloud-connector
  - dockerfile_literal: |
      FROM src
      # The build root carries no az and there is no standalone binary to
      # fetch, so it is installed from Microsoft's own repository, as
      # kata-containers and stolostron/capi-tests both do.
      #
      # The two awkward bits are measured rather than copied. The build
      # root wraps dnf with ART's wrapper, which ignores
      # /etc/yum.repos.d, so the repository has to be put where the
      # wrapper looks as well. And packages-microsoft-prod.rpm is what
      # configures the RHEL 9 repository: pointing at the older
      # yumrepos/azure-cli path instead yields azure-cli 2.38 from 2022,
      # where this yields 2.90.
      ENV ART_DNF_WRAPPER_POLICY=append
      RUN rpm --import https://packages.microsoft.com/keys/microsoft.asc && \
          dnf install -y https://packages.microsoft.com/config/rhel/9.0/packages-microsoft-prod.rpm && \
          if [ -d /etc/yum.repos.art/ci ]; then \
            cp /etc/yum.repos.d/microsoft-prod.repo /etc/yum.repos.art/ci/ || true; \
          fi && \
          dnf install -y azure-cli && \
          dnf clean all
    from: src
    to: azure-e2e-runner
operator:
  bundles:
  - as: bgp-cloud-connector-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: controller:latest
    with: pipeline:bgp-cloud-connector
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    integration:
      name: "4.23"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.23"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: |
    export GOLANGCI_LINT_CACHE=$(mktemp -d)
    make lint
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
- as: unit
  commands: make test test-aws
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
- as: verify
  commands: make verify
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
- as: azure-cli-image
  commands: |
    # Proves the image the e2e job runs in actually carries a usable az,
    # in seconds and without a cluster. The alternative is finding out
    # forty minutes into e2e-azure-operator, after an install has been
    # paid for.
    set -euo pipefail

    # az keeps its config under $HOME/.azure, and a prow test container
    # runs as a random uid whose home it does not own: without this it
    # fails with "PermissionError: [Errno 13] Permission denied:
    # '/.azure'" before doing anything at all. hack/azure/ci.sh points it
    # at the run's scratch directory for the same reason.
    AZURE_CONFIG_DIR="$(mktemp -d)"
    export AZURE_CONFIG_DIR

    az version

    # The flags the scripts actually pass, rather than just the command
    # groups. A release of az that renames one is the failure worth
    # catching here, and a group's help would still succeed.
    # The help is captured and then searched, rather than piped into
    # grep -q. Piped, grep exits on its first match, az dies of SIGPIPE,
    # and under pipefail the pipeline reports 120 -- so a flag that is
    # present reads as missing. Measured against az 2.90.
    check() {
      local flag="$1"; shift
      local help
      if ! help="$(az "$@" --help 2>/dev/null)"; then
        echo "MISSING: az $* (its help would not run)" >&2
        return 1
      fi
      if grep -q -- "${flag}" <<<"${help}"; then
        echo "ok: az $* ${flag}"
      else
        echo "MISSING: az $* ${flag}" >&2
        return 1
      fi
    }

    check --service-principal  login
    check --subscription       account set
    check --address-prefixes   network vnet update
    check --address-prefixes   network vnet subnet create
    check --sku                network public-ip create
    check --hosted-subnet      network routeserver create
    check --public-ip-address  network routeserver create
    check --peer-ip            network routeserver peering create
    check --peer-asn           network routeserver peering create
  container:
    from: azure-e2e-runner
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
- as: fips-image-scan
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    dependencies:
      SCAN_IMAGE: bgp-cloud-connector
    test:
    - ref: fips-check-image-scan
- always_run: false
  as: aro-preflight
  optional: true
  steps:
    cluster_profile: openshift-org-azure
    test:
    - as: preflight
      commands: |
        # Whether this subscription can build an ARO cluster at all, asked in
        # a minute and without building one. az aro create cannot tell a
        # resource provider nobody registered from a region that does not
        # offer ARO from a version string nobody publishes: it fails the same
        # way, ten minutes in, for all three. These reads separate them.
        #
        # It also proves the image carries a working az aro. The build root
        # takes azure-cli from Microsoft's repository, and a command group
        # that moved out of the box would otherwise surface as a provisioning
        # failure much later.
        set -uo pipefail

        # az keeps its token cache and profile under $HOME/.azure, and a prow
        # test container runs as a random uid whose home it does not own:
        # without this it fails with a permission error before doing anything.
        AZURE_CONFIG_DIR="$(mktemp -d)"
        export AZURE_CONFIG_DIR

        # Azure names subscriptions, tenants and principals in its output and
        # in its error text, and both prow logs and published artifacts are
        # public for openshift repositories. Everything az says goes through
        # here first.
        redact() {
          sed -E 's/[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}/<guid>/g'
        }
        section() { echo; echo "=== $* ==="; }

        sp="${CLUSTER_PROFILE_DIR}/osServicePrincipal.json"
        if [[ ! -f "${sp}" ]]; then
          echo "the cluster profile has no osServicePrincipal.json" >&2
          exit 1
        fi

        # Nothing here prints the secret, and --output none is for the same
        # reason: a successful login otherwise prints the subscription, the
        # tenant and the signed-in principal.
        if ! az login --service-principal \
              --username "$(jq -er .clientId "${sp}")" \
              --password "$(jq -er .clientSecret "${sp}")" \
              --tenant "$(jq -er .tenantId "${sp}")" \
              --output none; then
          echo "could not log in as the service principal in the cluster profile" >&2
          exit 1
        fi
        az account set --subscription "$(jq -er .subscriptionId "${sp}")" || exit 1

        region="${LEASED_RESOURCE}"
        echo "region: ${region}"
        echo "az:     $(az version --query '"azure-cli"' -o tsv)"

        # Every check runs and the verdict comes at the end. One answer does
        # not explain another: a region offering no versions and a provider
        # nobody registered are different problems with different owners, and
        # stopping at the first would hide the second.
        rc=0

        section "resource providers"
        # aro-provision-cluster registers these four before it creates
        # anything. Registration takes minutes the first time, so knowing
        # which are already done says how long a cold provision will take.
        for provider in Microsoft.RedHatOpenShift Microsoft.Network \
                        Microsoft.Compute Microsoft.Storage Microsoft.Authorization; do
          state="$(az provider show -n "${provider}" --query registrationState -o tsv 2>/dev/null)"
          printf '  %-30s %s\n' "${provider}" "${state:-unreadable}"
          if [[ "${provider}" == Microsoft.RedHatOpenShift && "${state}" != Registered ]]; then
            echo "MISSING: the ARO provider is not registered in this subscription" >&2
            rc=1
          fi
        done

        # Answers are captured before they are examined, never piped into a
        # grep that exits early. Under pipefail a grep -q closing the pipe
        # leaves the sed upstream of it dead of SIGPIPE, the pipeline reports
        # 141, and a region that does offer ARO reads as one that does not.
        # The azure-cli-image test above documents the same failure.
        offers() {
          local what="$1" provider="$2" resource="$3" listing
          # Selected in jq rather than in JMESPath because JMESPath compares
          # strings case sensitively and Azure's own capitalisation is not
          # something to depend on: this provider spells it OpenShiftClusters
          # while Microsoft.Network spells virtualHubs, and a filter that
          # guesses wrong returns an empty list rather than an error -- which
          # reads exactly like a region that does not offer the service.
          local raw
          # A read that failed is not an answer of "no locations". Without this
          # an expired login or an API error reads as a region that does not
          # offer the service, which is the same conflation the case sensitive
          # filter above already caused once.
          if ! raw="$(az provider show -n "${provider}" -o json 2>/dev/null)"; then
            echo "  could not read ${provider}: an access or API failure, not an answer"
            return 1
          fi
          listing="$(printf '%s' "${raw}" \
            | jq -r --arg want "$(printf '%s' "${resource}" | tr '[:upper:]' '[:lower:]')" \
                '.resourceTypes[]? | select(((.resourceType // "") | ascii_downcase) == $want) | .locations[]?' \
            | redact)"
          if [[ -z "${listing}" ]]; then
            echo "  nothing listed, which is itself worth knowing"
            return 1
          fi
          printf '%s\n' "${listing}" | sed 's/^/  /'
          # Azure writes these with spaces and in mixed case, so both sides are
          # folded before they are compared. The comparison is a case statement
          # rather than a grep so that nothing is left holding a pipe nobody is
          # reading.
          local folded
          folded="$(printf '%s\n' "${listing}" | tr -d ' ' | tr '[:upper:]' '[:lower:]')"
          case $'\n'"${folded}"$'\n' in
            *$'\n'"$(printf '%s' "${region}" | tr -d ' ' | tr '[:upper:]' '[:lower:]')"$'\n'*)
              echo "  ${region} offers ${what}" ;;
            *)
              echo "  ${region} does NOT appear to offer ${what}"
              return 1 ;;
          esac
        }

        section "does ${region} offer ARO"
        offers ARO Microsoft.RedHatOpenShift openShiftClusters || rc=1

        section "does ${region} offer Route Server"
        # The operator reads and writes Microsoft.Network/virtualHubs and its
        # bgpConnections. A region with ARO but no Route Server would host the
        # cluster and none of the estate the operator needs.
        offers "Route Server" Microsoft.Network virtualHubs || rc=1

        section "installable ARO versions in ${region}"
        # Asking az aro anything also proves the image carries it.
        #
        # The command's own status decides this, not whether it printed
        # something. A failed get-versions writes an error to stderr and exits
        # non-zero, so folding stderr into the value with 2>&1 would make the
        # variable non-empty, print "ERROR: (NoRegisteredProviderFound) ..." as
        # though it were a list of versions, and let the verdict below say this
        # subscription can build a cluster. Measured against a bogus region.
        versions_err="$(mktemp)"
        if versions="$(az aro get-versions -l "${region}" -o tsv 2>"${versions_err}")" \
             && [[ -n "${versions}" ]]; then
          printf '%s\n' "${versions}" | redact | sed 's/^/  /'
        else
          echo "MISSING: az aro get-versions gave no usable answer for ${region}" >&2
          redact <"${versions_err}" | sed 's/^/    /' >&2
          rc=1
        fi
        rm -f "${versions_err}"

        section "compute quota in ${region}"
        # Three masters and three workers is the ARO minimum, so a job that
        # cannot get those cores fails in provisioning rather than in test.
        az vm list-usage -l "${region}" \
          --query "[?contains(name.value, 'standardDSv3Family') || contains(name.value, 'standardDASv4Family') || name.value=='cores'].{name:localName, used:currentValue, limit:limit}" \
          -o table 2>&1 | redact | sed 's/^/  /'

        section "pull secret"
        if [[ -f "${CLUSTER_PROFILE_DIR}/pull-secret" ]]; then
          echo "  present"
        else
          echo "  absent: az aro create would install without Red Hat entitlements,"
          echo "  so the cluster would carry no redhat-operators catalogue"
        fi

        # There is deliberately no resource group check here, though it would
        # be the obvious next thing to ask. Creating one is the only write this
        # step would make, and a delete that fails, or a cancellation between
        # the two, leaves a resource group behind in a subscription shared with
        # every other job -- for an optional step whose whole point is to cost
        # nothing. It would also answer a question nothing really asks: a
        # principal that cannot create a resource group breaks every Azure job
        # on this profile, not just this one, and aro-probe's own
        # azure-provision-resourcegroup step says so in the one place it
        # matters. Leaving it out keeps this step purely read only, which means
        # anyone can run it against any subscription at any time.

        section "verdict"
        if (( rc == 0 )); then
          echo "  nothing here says this subscription cannot build an ARO cluster in ${region}"
        else
          echo "  see the MISSING lines above" >&2
        fi
        exit "${rc}"
      from: azure-e2e-runner
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- always_run: false
  as: e2e-aws
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    test:
    - as: test
      cli: latest
      commands: hack/ci-e2e-aws.sh
      from: src
      grace_period: 30m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-aws
- as: e2e-aws-operator
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      ZONES_COUNT: "2"
    test:
    - as: enable-frr
      cli: latest
      commands: |
        set -euo pipefail

        # Both controllers watch FRRConfiguration and RouteAdvertisements
        # from SetupWithManager, and CNO creates those two CRDs only in
        # response to this patch. Without them the caches never sync, the
        # manager exits after two minutes, and the CSV never installs.
        # The operator applies this same patch itself as the first phase
        # of reconcile, but it cannot stay alive long enough to do so;
        # when that is fixed, this step comes out and the job proves the
        # install a catalogue user actually performs.
        oc patch network.operator.openshift.io cluster --type=merge \
          -p '{"spec":{"additionalRoutingCapabilities":{"providers":["FRR"]},"defaultNetwork":{"ovnKubernetesConfig":{"routeAdvertisements":"Enabled"}}}}'

        deadline=$((SECONDS + 900))

        for crd in frrconfigurations.frrk8s.metallb.io routeadvertisements.k8s.ovn.org; do
          echo "waiting for crd/${crd}..."
          until oc wait --for=condition=Established "crd/${crd}" --timeout=10s >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              oc get network.operator.openshift.io cluster -o yaml >&2
              echo "timed out waiting for crd/${crd}" >&2
              exit 1
            fi
            sleep 5
          done
        done

        # The rollout is what says CNO finished rather than that it
        # started. Measured at about two minutes on 4.22.
        echo "waiting for the frr-k8s rollout..."
        until oc -n openshift-frr-k8s rollout status daemonset/frr-k8s --timeout=2m >/dev/null 2>&1; do
          if (( SECONDS >= deadline )); then
            oc -n openshift-frr-k8s get pods >&2
            echo "timed out waiting for the frr-k8s daemonset" >&2
            exit 1
          fi
          sleep 5
        done

        oc -n openshift-frr-k8s get daemonset frr-k8s
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: install
      cli: latest
      commands: |
        set -euo pipefail

        oc create namespace openshift-bgp-cloud-connector --dry-run=client -o yaml | oc apply -f -

        # The CSV supports OwnNamespace and SingleNamespace only. The
        # manager scopes no caches, so it watches cluster-wide either
        # way.
        operator-sdk run bundle -n openshift-bgp-cloud-connector --timeout=10m \
          --security-context-config restricted --install-mode OwnNamespace "${OO_BUNDLE}"

        oc -n openshift-bgp-cloud-connector wait --for=condition=Available \
          deployment/openshift-bgp-cloud-connector-controller-manager --timeout=5m
        oc -n openshift-bgp-cloud-connector get csv
      dependencies:
      - env: OO_BUNDLE
        name: bgp-cloud-connector-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: test
      cli: latest
      commands: hack/ci-e2e-aws.sh
      from: src
      grace_period: 30m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-aws
- always_run: false
  as: e2e-azure-operator
  optional: true
  steps:
    cluster_profile: openshift-org-azure
    test:
    - as: enable-frr
      cli: latest
      commands: hack/enable-frr.sh
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: install
      cli: latest
      commands: |
        set -euo pipefail

        oc create namespace openshift-bgp-cloud-connector --dry-run=client -o yaml | oc apply -f -

        # The CSV supports OwnNamespace and SingleNamespace only. The
        # manager scopes no caches, so it watches cluster-wide either
        # way.
        operator-sdk run bundle -n openshift-bgp-cloud-connector --timeout=10m \
          --security-context-config restricted --install-mode OwnNamespace "${OO_BUNDLE}"

        oc -n openshift-bgp-cloud-connector wait --for=condition=Available \
          deployment/openshift-bgp-cloud-connector-controller-manager --timeout=5m
        oc -n openshift-bgp-cloud-connector get csv
      dependencies:
      - env: OO_BUNDLE
        name: bgp-cloud-connector-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: test
      cli: latest
      commands: hack/ci-e2e-azure.sh
      from: azure-e2e-runner
      grace_period: 1h0m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-azure
- always_run: false
  as: e2e-gcp-operator
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      COMPUTE_NODE_TYPE: n2-standard-4
    test:
    - as: enable-frr
      cli: latest
      commands: hack/enable-frr.sh
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: install
      cli: latest
      commands: |
        set -euo pipefail

        oc create namespace openshift-bgp-cloud-connector --dry-run=client -o yaml | oc apply -f -

        # The CSV supports OwnNamespace and SingleNamespace only. The
        # manager scopes no caches, so it watches cluster-wide either
        # way.
        operator-sdk run bundle -n openshift-bgp-cloud-connector --timeout=10m \
          --security-context-config restricted --install-mode OwnNamespace "${OO_BUNDLE}"

        oc -n openshift-bgp-cloud-connector wait --for=condition=Available \
          deployment/openshift-bgp-cloud-connector-controller-manager --timeout=5m
        oc -n openshift-bgp-cloud-connector get csv
      dependencies:
      - env: OO_BUNDLE
        name: bgp-cloud-connector-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: test
      cli: latest
      commands: hack/ci-e2e-gcp.sh
      from: src
      grace_period: 30m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-gcp
- as: e2e-rosa-operator
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: rosa-e2e-01
    env:
      CHANNEL_GROUP: stable
      CLUSTER_SECTOR: rosa-e2e
      ENABLE_BILLING_ACCOUNT: "yes"
      OPENSHIFT_VERSION: "4.22"
      REGION: us-west-2
      REPLICAS: "3"
      ZONES_COUNT: "3"
    test:
    - ref: ipi-install-rbac
    - as: enable-frr
      cli: latest
      commands: hack/enable-frr.sh
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: install
      cli: latest
      commands: |
        set -euo pipefail

        oc create namespace openshift-bgp-cloud-connector --dry-run=client -o yaml | oc apply -f -

        # The CSV supports OwnNamespace and SingleNamespace only. The
        # manager scopes no caches, so it watches cluster-wide either way.
        operator-sdk run bundle -n openshift-bgp-cloud-connector --timeout=10m \
          --security-context-config restricted --install-mode OwnNamespace "${OO_BUNDLE}"

        # Available, not Ready: with no credentials yet the operator runs
        # and reports WaitingForCloudCredentials, which is the state the
        # next step resolves.
        oc -n openshift-bgp-cloud-connector wait --for=condition=Available \
          deployment/openshift-bgp-cloud-connector-controller-manager --timeout=5m
        oc -n openshift-bgp-cloud-connector get csv
      dependencies:
      - env: OO_BUNDLE
        name: bgp-cloud-connector-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: credentials
      cli: latest
      commands: |
        set -euo pipefail

        # The operator federates: it presents a bound ServiceAccount token
        # and AWS exchanges it for credentials. That needs an IAM role
        # whose trust policy names this cluster's issuer and this
        # ServiceAccount, and nothing in the cluster can create one --
        # creating a role needs the AWS permissions we are trying to
        # obtain. So it happens here, with the cluster profile's
        # credentials, which have IAM: rosa create oidc-provider used them.
        #
        # After the install, not before, because the ServiceAccount the
        # trust policy names does not exist until the CSV is applied.
        export AWS_SHARED_CREDENTIALS_FILE="${CLUSTER_PROFILE_DIR}/.awscred"
        PATH="$(hack/aws/ensure-cli.sh)":"${PATH}"
        export PATH

        region="$(oc get infrastructure cluster -o jsonpath='{.status.platformStatus.aws.region}')"
        export AWS_REGION="${region}" AWS_DEFAULT_REGION="${region}"

        account="$(aws sts get-caller-identity --query Account --output text)"
        issuer="$(oc get authentication cluster -o jsonpath='{.spec.serviceAccountIssuer}' | sed 's|^https://||')"
        infra="$(oc get infrastructure cluster -o jsonpath='{.status.infrastructureName}')"

        ns=openshift-bgp-cloud-connector
        sa=openshift-bgp-cloud-connector-controller-manager
        role="cudn-bgp-operator-${infra}"

        # aud as well as sub: without it a token minted for any other
        # audience would be spendable here.
        cat >/tmp/trust.json <<EOF
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Principal": {"Federated": "arn:aws:iam::${account}:oidc-provider/${issuer}"},
            "Action": "sts:AssumeRoleWithWebIdentity",
            "Condition": {"StringEquals": {
              "${issuer}:sub": "system:serviceaccount:${ns}:${sa}",
              "${issuer}:aud": "openshift"
            }}
          }]
        }
        EOF

        # policyActions in internal/platform/aws/credentials.go, which is
        # also what the operator asks for in its own CredentialsRequest.
        # sts:GetCallerIdentity is absent deliberately: it needs no
        # permission, so granting it would say nothing.
        cat >/tmp/policy.json <<'EOF'
        {
          "Version": "2012-10-17",
          "Statement": [{
            "Effect": "Allow",
            "Resource": "*",
            "Action": [
              "ec2:DescribeRouteServers",
              "ec2:DescribeRouteServerEndpoints",
              "ec2:DescribeRouteServerPeers",
              "ec2:DescribeSubnets",
              "ec2:DescribeInstances",
              "ec2:CreateRouteServerPeer",
              "ec2:DeleteRouteServerPeer",
              "ec2:CreateTags",
              "ec2:ModifyNetworkInterfaceAttribute"
            ]
          }]
        }
        EOF

        aws iam create-role --role-name "${role}" \
          --assume-role-policy-document file:///tmp/trust.json >/dev/null
        aws iam put-role-policy --role-name "${role}" \
          --policy-name "${role}" --policy-document file:///tmp/policy.json

        arn="arn:aws:iam::${account}:role/${role}"
        echo "${arn}" >"${SHARED_DIR}/cudn-bgp-operator-role-arn"

        # Prove the role before anything depends on it. The call is
        # unsigned -- the token is the proof -- so a trust policy that does
        # not match fails here, named, rather than as an opaque
        # CloudCredentialsInvalid two steps later.
        token="$(oc -n "${ns}" create token "${sa}" --audience=openshift --duration=1h)"

        # Retried because a role is not usable the instant it exists: IAM
        # is eventually consistent and the first assume after a create
        # comes back AccessDenied, which is indistinguishable from a
        # trust policy that is simply wrong. Six attempts over a minute
        # tells the two apart.
        assumed=""
        for attempt in $(seq 1 6); do
