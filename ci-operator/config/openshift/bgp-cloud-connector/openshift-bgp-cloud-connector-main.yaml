        oc -n openshift-bgp-cloud-connector wait --for=condition=Available \
          deployment/openshift-bgp-cloud-connector-controller-manager --timeout=5m
        oc -n openshift-bgp-cloud-connector get csv
      dependencies:
      - env: OO_BUNDLE
        name: bgp-cloud-connector-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: operator-identity
      cli: latest
      commands: |
        # The administrator's half on a cluster with managed identities,
        # as docs/azure-authentication.md in bgp-cloud-connector describes
        # it: an identity for the operator with Network Contributor over
        # the group holding the vnet and the Route Server, the operator's
        # ServiceAccount trusted on it and on machine-api, and the identity
        # handed to the operator through its Subscription, where the
        # console would put it.
        #
        # machine-api because the deny assignment on the managed group lets
        # only the platform identities write the router nodes' interfaces.
        # rh-mobb's aro-bgp borrows the same one for the same write.
