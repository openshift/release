        # ARO HCP is managed identity shaped where classic is service
        # principal shaped. Which identities exist, and what they may
        # reach, is what decides whether the operator can be given a
        # credential at all.
        for f in resourcegroup resourcegroup_vnet; do
          [[ -s "${SHARED_DIR}/${f}" ]] || continue
