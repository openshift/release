          --query "[0].platformWorkloadIdentityProfile.platformWorkloadIdentities.*.resourceId" \
          -o tsv 2>/dev/null)"

        if [[ -z "${platform_identity_name}" ]]; then
          echo "  this cluster has no platform workload identities"
        elif [[ -z "${issuer}" ]]; then
          echo "  no issuer, so federation is moot"
        else
          echo "  trying ${platform_identity_name} in ${platform_identity_rg}"
          record_federation "${platform_identity_rg}" "${platform_identity_name}" bgp-probe-federation
          plat_err="$(mktemp)"
          if az identity federated-credential create --name bgp-probe-federation \
               --identity-name "${platform_identity_name}" -g "${platform_identity_rg}" \
               --issuer "${issuer}" \
               --subject "system:serviceaccount:openshift-bgp-cloud-connector:openshift-bgp-cloud-connector-controller-manager" \
               --audiences openshift --output none 2>"${plat_err}"; then
