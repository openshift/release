base_images:
  ocm-cli:
    name: ocm-cli
    namespace: ci
    tag: latest
  operator-sdk:
    name: "4.17"
    namespace: origin
    tag: operator-sdk
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
  upi-installer:
    name: "4.23"
    namespace: ocp
    tag: upi-installer
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    to: bgp-cloud-connector
  - dockerfile_literal: |
      FROM upi-installer AS tools
      FROM src
      # Every e2e job talks to a cloud, and the suite is go test, so the
      # image has to be src with the cloud tools added rather than a tools
      # image with the source added: upi-installer carries no go, no make
      # and no repository.
      #
      # oc is deliberately absent. Every step gets one from cli: latest,
      # built from the release under test, and entrypoint-wrapper appends
      # that directory to PATH rather than prepending it -- so an oc in
      # the image would shadow it and each step would quietly run a
      # different oc from the cluster it is talking to.
      #
      # aws comes out of upi-installer, which is where the rest of CI gets
      # its cloud tooling. az and gcloud do not: upi-installer's az is a
      # venv with a baked interpreter path, and its gcloud is pinned to
      # 563 where the repository gives 585, so both are installed from the
      # vendors' own repositories instead.

      # aws v2 bundles its own python, so the tree is self-contained and a
      # symlink is all that is needed to put it on PATH. upi-installer
      # installs it with --bin-dir /bin and leaves the tree at the
      # installer's default --install-dir, which is why only the tree is
      # worth copying and the symlink is made again here.
      COPY --from=tools /usr/local/aws-cli /usr/local/aws-cli
      RUN ln -s /usr/local/aws-cli/v2/current/bin/aws /usr/bin/aws

      # The two awkward bits are measured rather than copied. The build
      # root wraps dnf with ART's wrapper, which ignores
      # /etc/yum.repos.d, so a repository has to be put where the wrapper
      # looks as well. And packages-microsoft-prod.rpm is what configures
      # the RHEL 9 repository: pointing at the older yumrepos/azure-cli
      # path instead yields azure-cli 2.38 from 2022, where this yields
      # 2.90.
      #
      # The gcloud repository is el9-x86_64, as it is in upi-installer and
      # in openshift-tests-private. These jobs are amd64.
      ENV ART_DNF_WRAPPER_POLICY=append
      RUN rpm --import https://packages.microsoft.com/keys/microsoft.asc && \
          rpm --import https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg && \
          dnf install -y https://packages.microsoft.com/config/rhel/9.0/packages-microsoft-prod.rpm && \
          printf '%s\n' \
            '[google-cloud-cli]' \
            'name=Google Cloud CLI' \
            'baseurl=https://packages.cloud.google.com/yum/repos/cloud-sdk-el9-x86_64' \
            'enabled=1' \
            'gpgcheck=1' \
            'repo_gpgcheck=0' \
            'gpgkey=https://packages.cloud.google.com/yum/doc/rpm-package-key.gpg' \
            > /etc/yum.repos.d/google-cloud-cli.repo && \
          if [ -d /etc/yum.repos.art/ci ]; then \
            cp /etc/yum.repos.d/microsoft-prod.repo \
               /etc/yum.repos.d/google-cloud-cli.repo /etc/yum.repos.art/ci/ || true; \
          fi && \
          dnf install -y azure-cli google-cloud-cli jq && \
          dnf clean all
    from: src
    inputs:
      upi-installer:
        as:
        - upi-installer
    to: e2e-runner
operator:
  bundles:
  - as: bgp-cloud-connector-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: controller:latest
    with: pipeline:bgp-cloud-connector
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    integration:
      name: "4.23"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.23"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: |
    export GOLANGCI_LINT_CACHE=$(mktemp -d)
    make lint
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
- as: unit
  commands: make test test-aws
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
- as: verify
  commands: make verify
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
- as: e2e-runner-image
  commands: |
    # Proves the image the e2e jobs run in actually carries the tools
    # they call, in seconds and without a cluster. The alternative is
    # finding out forty minutes in, after an install has been paid for.
    set -euo pipefail

    # az keeps its config under $HOME/.azure and gcloud keeps its under
    # $HOME/.config/gcloud, and a prow test container runs as a random uid
    # whose home it does not own: without these both fail with a
    # permission error before doing anything at all. hack/azure/ci.sh and
    # hack/gcp/ci.sh point them at the run's scratch directory for the
    # same reason.
    AZURE_CONFIG_DIR="$(mktemp -d)"
    CLOUDSDK_CONFIG="$(mktemp -d)"
    export AZURE_CONFIG_DIR CLOUDSDK_CONFIG

    # The roll call first, so a rehearsal log names every tool and the
    # path it resolved to before anything tries to run one. command -v
    # rather than which: which is a package, and depending on a tool
    # being installed to find out whether tools are installed is the
    # wrong way round. The whole list is walked before exiting, so one
    # missing tool does not hide the next.
    #
    # No oc. The image deliberately carries none, because cli: latest
    # gives each step one from the release under test and an oc here
    # would shadow it; a container test gets no injected oc either, so
    # there is nothing here to check.
    missing=()
    for tool in aws gcloud az jq; do
      if path="$(command -v "${tool}")"; then
        printf 'ok: %-6s %s\n' "${tool}" "${path}"
      else
        printf 'MISSING: %s\n' "${tool}" >&2
        missing+=("${tool}")
      fi
    done
    if (( ${#missing[@]} )); then
      echo "the e2e-runner image is missing: ${missing[*]}" >&2
      exit 1
    fi

    # Present is not the same as working: gcloud is an RPM that wants a
    # python beside it and az is a venv, and either can resolve on PATH
    # and then fail on its first invocation.
    aws --version
    gcloud version
    az version
    jq --version

    # hack/aws/ensure-cli.sh downloads an aws CLI when the one on PATH is
    # older than this, and that download is what carrying aws in the image
    # exists to prevent. aws comes from upi-installer, which is rebuilt on
    # its own schedule, so the floor is asserted rather than assumed.
    min_aws=2.34.7
    have_aws="$(aws --version 2>&1 | sed -n 's|^aws-cli/\([0-9.]*\).*|\1|p')"
    if [[ "$(printf '%s\n%s\n' "${min_aws}" "${have_aws}" | sort -V | head -1)" != "${min_aws}" ]]; then
      echo "MISSING: aws ${min_aws} or newer; the image carries ${have_aws:-nothing parseable}" >&2
      exit 1
    fi
    echo "ok: aws ${have_aws}"

    # The flags the scripts actually pass, rather than just the command
    # groups. A release of az that renames one is the failure worth
    # catching here, and a group's help would still succeed.
    # The help is captured and then searched, rather than piped into
    # grep -q. Piped, grep exits on its first match, az dies of SIGPIPE,
    # and under pipefail the pipeline reports 120 -- so a flag that is
    # present reads as missing. Measured against az 2.90.
    check() {
      local flag="$1"; shift
      local help
      if ! help="$(az "$@" --help 2>/dev/null)"; then
        echo "MISSING: az $* (its help would not run)" >&2
        return 1
      fi
      if grep -q -- "${flag}" <<<"${help}"; then
        echo "ok: az $* ${flag}"
      else
        echo "MISSING: az $* ${flag}" >&2
        return 1
      fi
    }

    check --service-principal  login
    check --subscription       account set
    check --address-prefixes   network vnet update
    check --address-prefixes   network vnet subnet create
    check --sku                network public-ip create
    check --hosted-subnet      network routeserver create
    check --public-ip-address  network routeserver create
    check --peer-ip            network routeserver peering create
    check --peer-asn           network routeserver peering create
  container:
    from: e2e-runner
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
- as: fips-image-scan
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    dependencies:
      SCAN_IMAGE: bgp-cloud-connector
    test:
    - ref: fips-check-image-scan
- always_run: false
  as: aro-preflight
  optional: true
  steps:
    cluster_profile: openshift-org-azure
    test:
    - as: preflight
      commands: |
        # Whether this subscription can build an ARO cluster at all, asked in
        # a minute and without building one. az aro create cannot tell a
        # resource provider nobody registered from a region that does not
        # offer ARO from a version string nobody publishes: it fails the same
        # way, ten minutes in, for all three. These reads separate them.
        #
        # It also proves the image carries a working az aro. The build root
        # takes azure-cli from Microsoft's repository, and a command group
        # that moved out of the box would otherwise surface as a provisioning
        # failure much later.
        # errexit off explicitly, rather than merely left alone. These commands
        # are wrapped before they run, set -uo pipefail does not clear -e if
        # that wrapper set it, and a bare command that fails would then abandon
        # the step where it stands. Measured in the first rehearsal: one
        # Forbidden ended a step after a single line, before the echo on the
        # next line or the step's own exit. A probe that stops at its first
        # unanswerable question is the thing this file exists to avoid.
        set +e
        set -uo pipefail

        # az keeps its token cache and profile under $HOME/.azure, and a prow
        # test container runs as a random uid whose home it does not own:
        # without this it fails with a permission error before doing anything.
        AZURE_CONFIG_DIR="$(mktemp -d)"
        export AZURE_CONFIG_DIR

        # Azure names subscriptions, tenants and principals in its output and
        # in its error text, and both prow logs and published artifacts are
        # public for openshift repositories. Everything az says goes through
        # here first.
        redact() {
          sed -E 's/[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}/<guid>/g'
        }
        section() { echo; echo "=== $* ==="; }

        sp="${CLUSTER_PROFILE_DIR}/osServicePrincipal.json"
        if [[ ! -f "${sp}" ]]; then
          echo "the cluster profile has no osServicePrincipal.json" >&2
          exit 1
        fi

        # Nothing here prints the secret, and --output none is for the same
        # reason: a successful login otherwise prints the subscription, the
        # tenant and the signed-in principal.
        if ! az login --service-principal \
              --username "$(jq -er .clientId "${sp}")" \
              --password "$(jq -er .clientSecret "${sp}")" \
              --tenant "$(jq -er .tenantId "${sp}")" \
              --output none; then
          echo "could not log in as the service principal in the cluster profile" >&2
          exit 1
        fi
        az account set --subscription "$(jq -er .subscriptionId "${sp}")" || exit 1

        region="${LEASED_RESOURCE}"
        echo "region: ${region}"
        echo "az:     $(az version --query '"azure-cli"' -o tsv)"

        # Every check runs and the verdict comes at the end. One answer does
        # not explain another: a region offering no versions and a provider
        # nobody registered are different problems with different owners, and
        # stopping at the first would hide the second.
        rc=0

        section "resource providers"
        # aro-provision-cluster registers these four before it creates
        # anything. Registration takes minutes the first time, so knowing
        # which are already done says how long a cold provision will take.
        for provider in Microsoft.RedHatOpenShift Microsoft.Network \
                        Microsoft.Compute Microsoft.Storage Microsoft.Authorization; do
          state="$(az provider show -n "${provider}" --query registrationState -o tsv 2>/dev/null)"
          printf '  %-30s %s\n' "${provider}" "${state:-unreadable}"
          if [[ "${provider}" == Microsoft.RedHatOpenShift && "${state}" != Registered ]]; then
            echo "MISSING: the ARO provider is not registered in this subscription" >&2
            rc=1
          fi
        done

        # Answers are captured before they are examined, never piped into a
        # grep that exits early. Under pipefail a grep -q closing the pipe
        # leaves the sed upstream of it dead of SIGPIPE, the pipeline reports
        # 141, and a region that does offer ARO reads as one that does not.
        # The azure-cli-image test above documents the same failure.
        offers() {
          local what="$1" provider="$2" resource="$3" listing
          # Selected in jq rather than in JMESPath because JMESPath compares
          # strings case sensitively and Azure's own capitalisation is not
          # something to depend on: this provider spells it OpenShiftClusters
          # while Microsoft.Network spells virtualHubs, and a filter that
          # guesses wrong returns an empty list rather than an error -- which
          # reads exactly like a region that does not offer the service.
          local raw
          # A read that failed is not an answer of "no locations". Without this
          # an expired login or an API error reads as a region that does not
          # offer the service, which is the same conflation the case sensitive
          # filter above already caused once.
          if ! raw="$(az provider show -n "${provider}" -o json 2>/dev/null)"; then
            echo "  could not read ${provider}: an access or API failure, not an answer"
            return 1
          fi
          listing="$(printf '%s' "${raw}" \
            | jq -r --arg want "$(printf '%s' "${resource}" | tr '[:upper:]' '[:lower:]')" \
                '.resourceTypes[]? | select(((.resourceType // "") | ascii_downcase) == $want) | .locations[]?' \
            | redact)"
          if [[ -z "${listing}" ]]; then
            echo "  nothing listed, which is itself worth knowing"
            return 1
          fi
          printf '%s\n' "${listing}" | sed 's/^/  /'
          # Azure writes these with spaces and in mixed case, so both sides are
          # folded before they are compared. The comparison is a case statement
          # rather than a grep so that nothing is left holding a pipe nobody is
          # reading.
          local folded
          folded="$(printf '%s\n' "${listing}" | tr -d ' ' | tr '[:upper:]' '[:lower:]')"
          case $'\n'"${folded}"$'\n' in
            *$'\n'"$(printf '%s' "${region}" | tr -d ' ' | tr '[:upper:]' '[:lower:]')"$'\n'*)
              echo "  ${region} offers ${what}" ;;
            *)
              echo "  ${region} does NOT appear to offer ${what}"
              return 1 ;;
          esac
        }

        section "does ${region} offer ARO"
        offers ARO Microsoft.RedHatOpenShift openShiftClusters || rc=1

        section "does ${region} offer Route Server"
        # The operator reads and writes Microsoft.Network/virtualHubs and its
        # bgpConnections. A region with ARO but no Route Server would host the
        # cluster and none of the estate the operator needs.
        offers "Route Server" Microsoft.Network virtualHubs || rc=1

        section "installable ARO versions in ${region}"
        # Asking az aro anything also proves the image carries it.
        #
        # The command's own status decides this, not whether it printed
        # something. A failed get-versions writes an error to stderr and exits
        # non-zero, so folding stderr into the value with 2>&1 would make the
        # variable non-empty, print "ERROR: (NoRegisteredProviderFound) ..." as
        # though it were a list of versions, and let the verdict below say this
        # subscription can build a cluster. Measured against a bogus region.
        versions_err="$(mktemp)"
        if versions="$(az aro get-versions -l "${region}" -o tsv 2>"${versions_err}")" \
             && [[ -n "${versions}" ]]; then
          printf '%s\n' "${versions}" | redact | sed 's/^/  /'
        else
          echo "MISSING: az aro get-versions gave no usable answer for ${region}" >&2
          redact <"${versions_err}" | sed 's/^/    /' >&2
          rc=1
        fi
        rm -f "${versions_err}"

        section "compute quota in ${region}"
        # Three masters and three workers is the ARO minimum, so a job that
        # cannot get those cores fails in provisioning rather than in test.
        az vm list-usage -l "${region}" \
          --query "[?contains(name.value, 'standardDSv3Family') || contains(name.value, 'standardDASv4Family') || name.value=='cores'].{name:localName, used:currentValue, limit:limit}" \
          -o table 2>&1 | redact | sed 's/^/  /'

        section "pull secret"
        if [[ -f "${CLUSTER_PROFILE_DIR}/pull-secret" ]]; then
          echo "  present"
        else
          echo "  absent: az aro create would install without Red Hat entitlements,"
          echo "  so the cluster would carry no redhat-operators catalogue"
        fi

        # There is deliberately no resource group check here, though it would
        # be the obvious next thing to ask. Creating one is the only write this
        # step would make, and a delete that fails, or a cancellation between
        # the two, leaves a resource group behind in a subscription shared with
        # every other job -- for an optional step whose whole point is to cost
        # nothing. It would also answer a question nothing really asks: a
        # principal that cannot create a resource group breaks every Azure job
        # on this profile, not just this one, and aro-probe's own
        # azure-provision-resourcegroup step says so in the one place it
        # matters. Leaving it out keeps this step purely read only, which means
        # anyone can run it against any subscription at any time.

        section "verdict"
        if (( rc == 0 )); then
          echo "  nothing here says this subscription cannot build an ARO cluster in ${region}"
        else
          echo "  see the MISSING lines above" >&2
        fi
        exit "${rc}"
      from: azure-e2e-runner
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- always_run: false
  as: aro-probe
  optional: true
  steps:
    cluster_profile: openshift-org-azure
    env:
      ARO_CLUSTER_VERSION: "4.21"
    post:
    - as: probe-operator
      best_effort: true
      cli: latest
      commands: |
        # What the operator does once it is running on ARO against a Route
        # Server that really exists. Everything before this measured the
        # cluster and built the estate; this is the only step that exercises
        # the operator's own path end to end, and it is as close to the
        # end-to-end job as this can get without the suite.
        # errexit off explicitly, rather than merely left alone. These commands
        # are wrapped before they run, set -uo pipefail does not clear -e if
        # that wrapper set it, and a bare command that fails would then abandon
        # the step where it stands. Measured in the first rehearsal: one
        # Forbidden ended a step after a single line, before the echo on the
        # next line or the step's own exit. A probe that stops at its first
        # unanswerable question is the thing this file exists to avoid.
        set +e
        set -uo pipefail

        AZURE_CONFIG_DIR="$(mktemp -d)"
        export AZURE_CONFIG_DIR

        redact() {
          sed -E 's/[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}/<guid>/g'
        }

        # Logging in is both the call most likely to fail and the one whose
        # failure text is most likely to name the tenant, the principal, the
        # subscription or the request, and prow logs are public for openshift
        # repositories. Captured and redacted like everything else.
        az_login() {
          local sp="${CLUSTER_PROFILE_DIR}/osServicePrincipal.json" err rc=0
          err="$(mktemp)"
          az login --service-principal \
            --username "$(jq -er .clientId "${sp}")" \
            --password "$(jq -er .clientSecret "${sp}")" \
            --tenant "$(jq -er .tenantId "${sp}")" \
            --output none 2>"${err}" || rc=$?
          if (( rc == 0 )); then
            az account set --subscription "$(jq -er .subscriptionId "${sp}")" 2>>"${err}" || rc=$?
          fi
          if (( rc != 0 )); then
            echo "  could not log in with the cluster profile's service principal:"
            redact <"${err}" | sed 's/^/    /'
          fi
          rm -f "${err}"
          return "${rc}"
        }

        # Key names, and the values never land in a shell variable on the way.
        # A variable holding a client secret can be printed by an error path or
        # a stray trace, and prow logs are public for openshift repositories;
        # jq reads the stream and emits nothing but the names. --ignore-not-found
        # so an absent secret is an answer rather than a failed read.
        secret_keys() {
          oc -n "$1" get secret "$2" -o json --ignore-not-found \
            | jq -r 'if .data then (.data | keys | @json) else empty end'
        }
        section() { echo; echo "=== $* ==="; }
        dump() {
          local name="$1" err; shift
          err="$(mktemp)"
          # Raw stderr is captured outside the artifact directory and only a
          # redacted copy is put into it. Artifacts are published exactly as
          # the logs are, and a failed Azure or Kubernetes call names the
          # subscription, the tenant, the principal or the request URL in its
          # error text -- which is the very thing redact exists to remove.
          if "$@" 2>"${err}" | redact >"${ARTIFACT_DIR}/${name}"; then
            echo "  saved ${name}"
          else
            redact <"${err}" >"${ARTIFACT_DIR}/${name}.err"
            echo "  FAILED ${name}: $(head -1 "${ARTIFACT_DIR}/${name}.err")"
          fi
          rm -f "${err}"
        }

        ns=openshift-bgp-cloud-connector

        # A post step runs whatever the test did, which is the point of putting
        # this one here: a failed enable-frr or a failed install should still
        # leave the operator measured. It also runs when provisioning never
        # happened at all, and then there is no cluster kubeconfig -- oc falls
        # through to the build cluster as the job's own service account, and
        # every read below is refused against entirely the wrong cluster.
        #
        # Measured in the first rehearsal, where aro-provision-cluster failed
        # and this step reported Forbidden on networks.operator.openshift.io
        # against the build farm. aro-provision-cluster writes this file last,
        # so its absence means no cluster was ever handed over.
        if [[ ! -s "${SHARED_DIR}/kubeconfig" ]]; then
          echo "no cluster was provisioned, so there is nothing here to measure"
          exit 0
        fi

        section "did the FRR patch survive the install"
        # ARO reverts configuration it manages, and it has had the length of
        # the install step to do so. If this does not stick, the first step of
        # every other cloud's job does not work here.
        oc get network.operator.openshift.io cluster \
          -o jsonpath='  additionalRoutingCapabilities: {.spec.additionalRoutingCapabilities}{"\n"}  routeAdvertisements: {.spec.defaultNetwork.ovnKubernetesConfig.routeAdvertisements}{"\n"}'
        oc get crd frrconfigurations.frrk8s.metallb.io routeadvertisements.k8s.ovn.org 2>&1 | sed 's/^/    /'
        oc -n openshift-frr-k8s get daemonset frr-k8s 2>&1 | sed 's/^/    /'
        dump network-operator-after.yaml oc get network.operator.openshift.io cluster -o yaml
        dump co-network.yaml oc get co network -o yaml

        section "the operator"
        oc -n "${ns}" get csv 2>&1 | sed 's/^/  /'
        oc -n "${ns}" get deployment 2>&1 | sed 's/^/  /'
        oc -n "${ns}" get pods 2>&1 | sed 's/^/  /'
        dump operator-csv.yaml oc -n "${ns}" get csv -o yaml
        dump operator-pods.yaml oc -n "${ns}" get pods -o yaml

        section "did it ask for credentials, and did it get any"
        oc -n openshift-cloud-credential-operator get credentialsrequest 2>&1 \
          | grep -i bgp | sed 's/^/  /' || echo "  it created no CredentialsRequest"
        keys="$(secret_keys "${ns}" bgp-cloud-connector-azure-credentials)"
        echo "  secret keys in ${ns}: ${keys:-<none: CCO wrote nothing for the operator>}"
        dump operator-credentialsrequests.yaml oc -n openshift-cloud-credential-operator get credentialsrequest -o yaml

        section "a router node"
        node="$(oc get nodes -l node-role.kubernetes.io/worker -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)"
        if [[ -z "${node}" ]]; then
          echo "  no worker node to label" >&2
        else
          oc label node "${node}" bgp_router=true --overwrite 2>&1 | sed 's/^/  /'
        fi

        section "reconcile against the Route Server that was built"
        if [[ ! -f "${SHARED_DIR}/bgp-probe-estate" ]]; then
          echo "  no estate step ran, so there is nothing to reconcile against"
          exit 0
        fi
        # Sourced rather than parsed, and then checked: a step killed partway
        # through writing this leaves a file that exists and says nothing, and
        # under nounset an unset name further down is a hard error in the
        # middle of the work rather than a message here.
        # shellcheck disable=SC1091
        source "${SHARED_DIR}/bgp-probe-estate"
        : "${NET_RG:=}" "${VNET:=}" "${ROUTE_SERVER:=}" "${ROUTE_SERVER_PIP:=}" "${ROUTE_SERVER_BUILT:=no}"
        if [[ "${ROUTE_SERVER_BUILT}" != yes || -z "${NET_RG}" || -z "${ROUTE_SERVER}" ]]; then
          echo "  no Route Server was built, so a reconcile would only repeat what that step already said"
          exit 0
        fi
        subscription="$(jq -er .subscriptionId "${CLUSTER_PROFILE_DIR}/osServicePrincipal.json")"

        # Applied without echoing it: the subscription is in the body, and
        # prow logs are public. The dump below is redacted.
        oc apply -f - >/dev/null <<EOF
        apiVersion: networking.openshift.io/v1beta1
        kind: BGPCloudConfiguration
        metadata:
          name: cluster
        spec:
          platform: Azure
          bgp:
            localASN: 65001
            livenessDetection: bgp-keepalive
          routerNodeSelector:
            bgp_router: "true"
          azure:
            subscriptionID: ${subscription}
            resourceGroup: ${NET_RG}
            routeServerName: ${ROUTE_SERVER}
        EOF

        echo "  waiting up to fifteen minutes for a verdict..."
        deadline=$((SECONDS + 900))
        reason=""
        while (( SECONDS < deadline )); do
          reason="$(oc get bgpcloudconfiguration cluster \
            -o jsonpath='{.status.conditions[?(@.type=="CloudEndpointsDiscovered")].reason}' 2>/dev/null)"
          case "${reason}" in
            ""|WaitingForCloudCredentials) ;;
            *) break ;;
          esac
          sleep 15
        done
        case "${reason}" in
          CloudCredentialsInvalid)
            echo "  CloudCredentialsInvalid: the operator could not use what it was given" ;;
          ""|WaitingForCloudCredentials)
            echo "  still ${reason:-unset} after fifteen minutes: no credentials ever reached it" ;;
          *)
            echo "  ${reason}" ;;
        esac
        oc get bgpcloudconfiguration cluster -o json | jq '.status' | redact | sed 's/^/  /'

        section "did the operator write a BGP connection to the Route Server"
        # The one thing only a working credential path can produce. Reading it
        # from Azure rather than from the cluster, because the cluster only
        # says what the operator believes.
        if az_login; then
          # The command's status decides, not whether it printed something:
          # 2>&1 here would turn a refusal into what looks like a peering list.
          peer_err="$(mktemp)"
          if peerings="$(az network routeserver peering list -g "${NET_RG}" \
               --routeserver "${ROUTE_SERVER}" \
               --query "[].{name:name, peerAsn:peerAsn, peerIp:peerIp, state:provisioningState}" \
               -o json 2>"${peer_err}")"; then
            printf '%s\n' "${peerings}" | redact | sed 's/^/  /'
          else
            echo "  could not list the peerings:"
            redact <"${peer_err}" | sed 's/^/    /'
          fi
          rm -f "${peer_err}"
        fi

        section "and did FRR hear about it"
        oc get frrconfigurations.frrk8s.metallb.io -A 2>&1 | sed 's/^/  /'
        oc get routeadvertisements.k8s.ovn.org -A 2>&1 | sed 's/^/  /'
        dump frrconfigurations.yaml oc get frrconfigurations.frrk8s.metallb.io -A -o yaml
        dump bgpcloudconfiguration.yaml oc get bgpcloudconfiguration cluster -o yaml
        dump operator-logs.txt oc -n "${ns}" logs deployment/openshift-bgp-cloud-connector-controller-manager --tail=500

        section "everything else worth keeping"
        dump events.txt oc get events -A --sort-by=.lastTimestamp
        dump clusteroperators-final.txt oc get clusteroperators

        section "done"
        exit 0
      from: azure-e2e-runner
      grace_period: 10m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 1h0m0s
    - as: estate-teardown
      best_effort: true
      cli: latest
      commands: |
        # Remove what the probe steps built, in the order Azure will accept,
        # and say honestly what could not be removed.
        #
        # A post step rather than a test step, because a test step that never
        # runs leaves a Route Server behind, and a Route Server holds the
        # subnet, which holds the virtual network, which the group delete then
        # cannot remove. It also runs after a cancellation, which is the case
        # that matters most: the federated credential this removes is attached
        # to an identity ARO manages, and the support policy is explicit about
        # not leaving those altered.
        #
        # aro-deprovision deletes the whole resource group afterwards and is
        # the backstop for anything missed here, but a delete that fails is
        # reported rather than glossed: "gone" printed over a failure is how a
        # leak becomes invisible.
        # errexit off explicitly, rather than merely left alone. These commands
        # are wrapped before they run, set -uo pipefail does not clear -e if
        # that wrapper set it, and a bare command that fails would then abandon
        # the step where it stands. Measured in the first rehearsal: one
        # Forbidden ended a step after a single line, before the echo on the
        # next line or the step's own exit. A probe that stops at its first
        # unanswerable question is the thing this file exists to avoid.
        set +e
        set -uo pipefail

        AZURE_CONFIG_DIR="$(mktemp -d)"
        export AZURE_CONFIG_DIR

        redact() {
          sed -E 's/[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}/<guid>/g'
        }

        # Logging in is both the call most likely to fail and the one whose
        # failure text is most likely to name the tenant, the principal or the
        # subscription, and prow logs are public for openshift repositories.
        az_login() {
          local sp="${CLUSTER_PROFILE_DIR}/osServicePrincipal.json" err rc=0
          if [[ ! -f "${sp}" ]]; then
            echo "the cluster profile has no osServicePrincipal.json"
            return 1
          fi
          err="$(mktemp)"
          az login --service-principal \
            --username "$(jq -er .clientId "${sp}")" \
            --password "$(jq -er .clientSecret "${sp}")" \
            --tenant "$(jq -er .tenantId "${sp}")" \
            --output none 2>"${err}" || rc=$?
          if (( rc == 0 )); then
            az account set --subscription "$(jq -er .subscriptionId "${sp}")" 2>>"${err}" || rc=$?
          fi
          if (( rc != 0 )); then
            echo "could not log in with the cluster profile's service principal:"
            redact <"${err}" | sed 's/^/  /'
          fi
          rm -f "${err}"
          return "${rc}"
        }

        failures=0
        # Every removal reports, and one that fails does not stop the next: a
        # subnet that cannot go is no reason to leave a federated credential
        # attached to somebody else's managed identity.
        removal_failed() {
          echo "    COULD NOT REMOVE: $1"
          redact <"$2" | sed 's/^/      /'
          failures=$((failures + 1))
        }

        az_login || exit 1

        echo "=== federated credentials ==="
        # probe-identity records these before it creates them, so a step killed
        # between the two is still cleaned up here. The one that matters is any
        # credential added to an ARO platform identity: that identity outlives
        # nothing this job owns, and ARO's support policy says not to leave its
        # federated credentials altered.
        if [[ -f "${SHARED_DIR}/bgp-probe-identity" ]]; then
          while IFS='|' read -r fc_rg fc_identity fc_name; do
            [[ -z "${fc_rg}" || -z "${fc_identity}" || -z "${fc_name}" ]] && continue
            if ! az identity federated-credential show --name "${fc_name}" \
                   --identity-name "${fc_identity}" -g "${fc_rg}" --output none 2>/dev/null; then
              echo "  ${fc_name} on ${fc_identity}: not there"
              continue
            fi
            err="$(mktemp)"
            if az identity federated-credential delete --name "${fc_name}" \
                 --identity-name "${fc_identity}" -g "${fc_rg}" --yes --output none 2>"${err}"; then
              # Verified rather than assumed: this is the one removal whose
              # failure would leave a managed identity trusting a service
              # account in a cluster that no longer exists.
              if az identity federated-credential show --name "${fc_name}" \
                   --identity-name "${fc_identity}" -g "${fc_rg}" --output none 2>/dev/null; then
                printf 'the delete reported success but %s is still there\n' "${fc_name}" >"${err}"
                removal_failed "${fc_name} on ${fc_identity}" "${err}"
              else
                echo "  ${fc_name} on ${fc_identity}: removed, and confirmed gone"
              fi
            else
              removal_failed "${fc_name} on ${fc_identity}" "${err}"
            fi
            rm -f "${err}"
          done <"${SHARED_DIR}/bgp-probe-identity"
        else
          echo "  none were recorded"
        fi

        if [[ ! -f "${SHARED_DIR}/bgp-probe-estate" ]]; then
          echo
          echo "=== estate ==="
          echo "  nothing was recorded, so there is nothing to remove"
          (( failures == 0 )) || exit 1
          exit 0
        fi
        # shellcheck disable=SC1091
        source "${SHARED_DIR}/bgp-probe-estate"
        : "${NET_RG:=}" "${VNET:=}" "${ROUTE_SERVER:=}" "${ROUTE_SERVER_PIP:=}"
        if [[ -z "${NET_RG}" || -z "${ROUTE_SERVER}" || -z "${VNET}" ]]; then
          echo "  the record of what was built is incomplete; leaving it to the group delete"
          exit 1
        fi

        echo
        echo "=== BGP connections ==="
        # The operator makes these, so they are removed here rather than there:
        # a Route Server with a peering still attached refuses to go.
        peerings="$(az network routeserver peering list -g "${NET_RG}" \
          --routeserver "${ROUTE_SERVER}" --query "[].name" -o tsv 2>/dev/null)"
        if [[ -z "${peerings}" ]]; then
          echo "  none"
        else
          while read -r peering; do
            [[ -z "${peering}" ]] && continue
            err="$(mktemp)"
            if az network routeserver peering delete -g "${NET_RG}" \
                 --routeserver "${ROUTE_SERVER}" -n "${peering}" --yes --output none 2>"${err}"; then
              echo "  ${peering}: removed"
            else
              removal_failed "peering ${peering}" "${err}"
            fi
            rm -f "${err}"
          done <<<"${peerings}"
        fi

        echo
        echo "=== the Route Server ==="
        started="${SECONDS}"
        if ! az network routeserver show -g "${NET_RG}" -n "${ROUTE_SERVER}" --output none 2>/dev/null; then
          echo "  not there"
        else
          err="$(mktemp)"
          if az network routeserver delete -g "${NET_RG}" -n "${ROUTE_SERVER}" --yes --output none 2>"${err}"; then
            echo "  gone after $(( (SECONDS - started) / 60 )) minutes"
          else
            removal_failed "Route Server ${ROUTE_SERVER}" "${err}"
          fi
          rm -f "${err}"
        fi

        echo
        echo "=== the public address ==="
        err="$(mktemp)"
        if az network public-ip delete -g "${NET_RG}" -n "${ROUTE_SERVER_PIP}" --output none 2>"${err}"; then
          echo "  removed, or was not there"
        else
          removal_failed "public address ${ROUTE_SERVER_PIP}" "${err}"
        fi
        rm -f "${err}"

        echo
        echo "=== the subnet ==="
        # Last, because the Route Server sat in it.
        err="$(mktemp)"
        if az network vnet subnet delete -g "${NET_RG}" --vnet-name "${VNET}" \
             -n RouteServerSubnet --output none 2>"${err}"; then
          echo "  removed, or was not there"
        else
          removal_failed "RouteServerSubnet in ${VNET}" "${err}"
        fi
        rm -f "${err}"

        echo
        echo "=== what is left in ${NET_RG} ==="
        az resource list -g "${NET_RG}" --query "[].{name:name,type:type}" -o table 2>&1 | redact | sed 's/^/  /'

        echo
        if (( failures > 0 )); then
          echo "${failures} thing(s) could not be removed. aro-deprovision deletes the"
          echo "whole group next and is the backstop, but a Route Server that will not"
          echo "go holds the subnet, which holds the vnet, and takes that delete with it."
          exit 1
        fi
        echo "everything this job built has been removed"
        exit 0
      from: azure-e2e-runner
      grace_period: 10m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 45m0s
    - ref: aro-deprovision
    pre:
    - ref: azure-provision-resourcegroup
    - ref: aro-provision-vnet
    - ref: aro-provision-cluster
    - ref: ipi-install-rbac
    test:
    - as: probe-cloud
      cli: latest
      commands: |
        # The Azure side of an ARO cluster: which resource groups exist, what
        # is in them, what this principal may write where, and whether the
        # estate the operator needs can be built. Measured once so the e2e job
        # is written against facts rather than against what the documentation
        # and the RP source imply.
        #
        # Deliberately no errexit, and it exits zero unless the cluster cannot
        # be read at all. A probe that stops at the first unanswerable question
        # reports one fact where it could have reported ten, and every question
        # here is independent of the others.
        # errexit off explicitly, rather than merely left alone. These commands
        # are wrapped before they run, set -uo pipefail does not clear -e if
        # that wrapper set it, and a bare command that fails would then abandon
        # the step where it stands. Measured in the first rehearsal: one
        # Forbidden ended a step after a single line, before the echo on the
        # next line or the step's own exit. A probe that stops at its first
        # unanswerable question is the thing this file exists to avoid.
        set +e
        set -uo pipefail

        AZURE_CONFIG_DIR="$(mktemp -d)"
        export AZURE_CONFIG_DIR

        # Both prow logs and published artifacts are public for openshift
        # repositories, and Azure names subscriptions, tenants and principals
        # in its output and its error text.
        redact() {
          sed -E 's/[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}/<guid>/g'
        }

        # Logging in is both the call most likely to fail and the one whose
        # failure text is most likely to name the tenant, the principal, the
        # subscription or the request. Letting az write that to stderr puts it
        # straight into a prow log, which for openshift repositories is public,
        # so it is captured and redacted like everything else.
        #
        # Reports and returns rather than exiting, so a step that cannot log in
        # still hands the run to the next step with a reason recorded.
        az_login() {
          local sp="${CLUSTER_PROFILE_DIR}/osServicePrincipal.json" err rc=0
          if [[ ! -f "${sp}" ]]; then
            echo "the cluster profile has no osServicePrincipal.json"
            return 1
          fi
          err="$(mktemp)"
          az login --service-principal \
            --username "$(jq -er .clientId "${sp}")" \
            --password "$(jq -er .clientSecret "${sp}")" \
            --tenant "$(jq -er .tenantId "${sp}")" \
            --output none 2>"${err}" || rc=$?
          if (( rc == 0 )); then
            az account set --subscription "$(jq -er .subscriptionId "${sp}")" 2>>"${err}" || rc=$?
          fi
          if (( rc != 0 )); then
            echo "could not log in with the cluster profile's service principal:"
            redact <"${err}" | sed 's/^/  /'
          fi
          rm -f "${err}"
          return "${rc}"
        }
        section() { echo; echo "=== $* ==="; }

        # Three outcomes, told apart: a value, nothing, or a refusal. Reporting
        # the last two the same way turns an access problem into a statement of
        # fact about the cloud, and they need different people to fix them.
        read_value() {
          local label="$1" when_empty="$2"; shift 2
          local out err rc=0
          err="$(mktemp)"
          out="$("$@" 2>"${err}")" || rc=$?
          if (( rc != 0 )); then
            printf '  %-26s <read FAILED: %s>\n' "${label}" "$(head -1 "${err}" | redact)"
          else
            printf '  %-26s %s\n' "${label}" "${out:-<${when_empty}>}"
          fi
          rm -f "${err}"
          (( rc == 0 ))
        }
        dump() {
          local name="$1" err; shift
          err="$(mktemp)"
          # Raw stderr is captured outside the artifact directory and only a
          # redacted copy is put into it. Artifacts are published exactly as
          # the logs are, and a failed Azure or Kubernetes call names the
          # subscription, the tenant, the principal or the request URL in its
          # error text -- which is the very thing redact exists to remove.
          if "$@" 2>"${err}" | redact >"${ARTIFACT_DIR}/${name}"; then
            echo "  saved ${name}"
          else
            redact <"${err}" >"${ARTIFACT_DIR}/${name}.err"
            echo "  FAILED ${name}: $(head -1 "${ARTIFACT_DIR}/${name}.err")"
          fi
          rm -f "${err}"
        }

        subscription="$(jq -er .subscriptionId "${CLUSTER_PROFILE_DIR}/osServicePrincipal.json")"
        az_login || exit 0

        section "resource groups, as the cluster reports them"
        # The estate scripts read these to decide where the Route Server goes
        # and where its subnet goes. On IPI they are the same group. The
        # prediction for ARO is that resourceGroupName is the RP-managed group,
        # which carries a deny assignment, and networkResourceGroupName is the
        # group this job created and owns.
        oc get infrastructure cluster -o json | jq '{
          infrastructureName: .status.infrastructureName,
          platform: .status.platformStatus.type,
          resourceGroupName: .status.platformStatus.azure.resourceGroupName,
          networkResourceGroupName: .status.platformStatus.azure.networkResourceGroupName,
          cloudName: .status.platformStatus.azure.cloudName
        }'
        infra="$(oc get infrastructure cluster -o jsonpath='{.status.infrastructureName}')"
        rg="$(oc get infrastructure cluster -o jsonpath='{.status.platformStatus.azure.resourceGroupName}')"
        net_rg="$(oc get infrastructure cluster -o jsonpath='{.status.platformStatus.azure.networkResourceGroupName}')"
        : "${net_rg:=${rg}}"
        if [[ -z "${infra}" || -z "${rg}" ]]; then
          # Reported and abandoned, not failed. Everything below needs the
          # resource group, but the steps after this one do not need this one,
          # and a run that stops here gathers a single fact where it could have
          # gathered the cluster, the identities and the estate as well.
          echo "the cluster reported no infrastructure name or resource group,"
          echo "so the rest of this step has nothing to ask about"
          exit 0
        fi
        # From the group, because Azure's infrastructure status carries no
        # region.
        read_value "region" "the group reports none" \
          az group show -n "${rg}" --query location -o tsv

        section "the ARO resource itself"
        # Says which flavour of cluster the provisioning step actually made:
        # a cluster service principal one or a managed identity one. That
        # decides which credential path the operator can use.
        #
        # Scoped to the group this job created. An unscoped az aro list is
        # subscription wide, and this subscription is shared: [0] could be
        # another job's cluster, which would put its details in a public log
        # and answer questions about the wrong machine.
        az aro list -g "${net_rg}" --query "[?name!=null].{
          name: name,
          version: clusterProfile.version,
          fipsMode: clusterProfile.fipsValidatedModules,
          apiVisibility: apiserverProfile.visibility,
          ingressVisibility: ingressProfiles[0].visibility,
          outboundType: networkProfile.outboundType,
          usesWorkloadIdentity: platformWorkloadIdentityProfile != null,
          usesServicePrincipal: servicePrincipalProfile != null
        }" -o json 2>&1 | redact
        dump aro-show.json az aro list -g "${net_rg}" --query "[].{
          version: clusterProfile.version,
          domain: clusterProfile.domain,
          fipsValidatedModules: clusterProfile.fipsValidatedModules,
          apiserverVisibility: apiserverProfile.visibility,
          ingressVisibility: ingressProfiles[0].visibility,
          outboundType: networkProfile.outboundType,
          podCidr: networkProfile.podCidr,
          serviceCidr: networkProfile.serviceCidr,
          masterVmSize: masterProfile.vmSize,
          workerVmSize: workerProfiles[0].vmSize,
          workerCount: workerProfiles[0].count,
          usesWorkloadIdentity: platformWorkloadIdentityProfile != null,
          usesServicePrincipal: servicePrincipalProfile != null,
          provisioningState: provisioningState
        }"

        section "the deny assignment on ${rg}"
        # ARO refuses */write in the cluster's own group to every principal but
        # the cluster's own. Read it rather than trust the RP source: the
        # NotActions list and the excluded principals are what decide whether
        # the operator, and this job, can write there.
        az rest --method get --output json \
          --url "https://management.azure.com/subscriptions/${subscription}/resourceGroups/${rg}/providers/Microsoft.Authorization/denyAssignments?api-version=2022-04-01" \
          --query "value[].{
            name: properties.denyAssignmentName,
            actions: properties.permissions[0].actions,
            notActions: properties.permissions[0].notActions,
            excludedPrincipalCount: length(properties.excludePrincipals)
          }" 2>&1 | redact
        dump denyassignments.json az rest --method get --output json \
          --url "https://management.azure.com/subscriptions/${subscription}/resourceGroups/${rg}/providers/Microsoft.Authorization/denyAssignments?api-version=2022-04-01"

        section "what the cluster's own principal may do"
        # Under passthrough the operator is handed this principal, so its role
        # assignments are the operator's permissions. Whether it reaches the
        # group holding the vnet matters as much as the cluster group: the
        # Route Server subnet lives in the former.
        # --ignore-not-found so a cluster with no service principal answers
        # cleanly, while a refusal still surfaces as an error.
        cluster_client_id="$(oc -n kube-system get secret azure-credentials \
          -o jsonpath='{.data.azure_client_id}' --ignore-not-found | base64 -d)"
        if [[ -n "${cluster_client_id}" ]]; then
          az role assignment list --all --assignee "${cluster_client_id}" \
            --query "[].{role: roleDefinitionName, scopeKind: scope}" -o json 2>&1 \
            | sed -E "s#/subscriptions/[^\"]*/resourceGroups/#resourceGroup: #" | redact
        else
          echo "  no kube-system/azure-credentials, so this cluster has no service principal"
        fi

        section "is the cluster's own principal one the deny assignment excludes"
        # The whole passthrough argument rests on this one fact: if CCO hands
        # the operator the cluster's own principal, and that principal is
        # excluded, the interface writes in the managed group succeed. Both
        # sides are object ids, so they are compared here and only the answer
        # is printed.
        if [[ -n "${cluster_client_id}" ]]; then
          # Its failure is reported rather than swallowed: reading a service
          # principal needs directory permission this principal may not have,
          # and that is a different answer from "the principal is not excluded".
          sp_err="$(mktemp)"
          cluster_object_id="$(az ad sp show --id "${cluster_client_id}" --query id -o tsv 2>"${sp_err}")" || {
            echo "  could not read the principal in the directory:"
            redact <"${sp_err}" | head -2 | sed 's/^/    /'
          }
          rm -f "${sp_err}"
          excluded="$(az rest --method get --output json \
            --url "https://management.azure.com/subscriptions/${subscription}/resourceGroups/${rg}/providers/Microsoft.Authorization/denyAssignments?api-version=2022-04-01" \
            --query "value[].properties.excludePrincipals[].id" -o tsv 2>/dev/null)"
          if [[ -z "${cluster_object_id}" ]]; then
            echo "  the principal could not be resolved, so this cannot be answered here"
          elif grep -qiF "${cluster_object_id}" <<<"${excluded}"; then
            echo "  YES: the cluster's principal is excluded, so credentials passed"
            echo "  through from it can write in ${rg}"
          else
            echo "  NO: the cluster's principal is not among the excluded ones"
          fi
          echo "  excluded principals in total: $(grep -c . <<<"${excluded}")"
        else
          echo "  this cluster has no service principal, so the question is moot"
        fi

        section "what is in each resource group"
        # Names and types only. A full listing carries resource ids, and those
        # carry the subscription.
        for group in "${rg}" "${net_rg}"; do
          echo "--- ${group} ---"
          az resource list -g "${group}" \
            --query "sort_by([].{name:name, type:type}, &type)" -o table 2>&1 | redact | sed 's/^/  /'
        done
        dump resources-cluster-group.json az resource list -g "${rg}" --query "[].{name:name,type:type}"
        dump resources-network-group.json az resource list -g "${net_rg}" --query "[].{name:name,type:type}"

        section "the virtual network, and the tag the scripts select on"
        # azure_cluster_vnet picks the vnet by the tag the installer puts on
        # what it owns, and falls back to <infra>-vnet. An ARO vnet is created
        # by this job rather than by an installer, so both are expected to
        # miss, and the fallback would name a vnet that does not exist.
        az network vnet list -g "${net_rg}" --query "[].{
          name: name,
          addressSpace: addressSpace.addressPrefixes,
          ownedTag: tags.\"sigs.k8s.io_cluster-api-provider-azure_cluster_${infra}\"
        }" -o json 2>&1 | redact
        vnet="$(az network vnet list -g "${net_rg}" --query "[0].name" -o tsv 2>/dev/null)"
        echo "subnets in ${vnet:-<none>}:"
        az network vnet subnet list -g "${net_rg}" --vnet-name "${vnet}" \
          --query "[].{name:name, prefix:addressPrefix}" -o table 2>&1 | redact | sed 's/^/  /'

        section "where this principal may write"
        # A public IP is the cheapest resource that answers it, and it is
        # removed either way. The asymmetry is the point: the group we created
        # should accept the write and the group ARO manages should refuse it.
        for group in "${rg}" "${net_rg}"; do
          echo "--- ${group} ---"
          err="$(mktemp)"
          if az network public-ip create -g "${group}" -n bgp-probe-ip \
               --sku Standard --output none 2>"${err}"; then
            echo "  write allowed"
            az network public-ip delete -g "${group}" -n bgp-probe-ip --output none 2>&1 | redact
          else
            echo "  write refused:"
            redact <"${err}" >"${ARTIFACT_DIR}/pip-${group}.err"
            sed 's/^/    /' <"${ARTIFACT_DIR}/pip-${group}.err"
          fi
          rm -f "${err}"
        done

        section "done"
        exit 0
      from: azure-e2e-runner
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: probe-cluster
      cli: latest
      commands: |
        # The OpenShift side of an ARO cluster: what the operator will find
        # when it starts, and whether the things every other cloud's job takes
        # for granted are there. Reports and never asserts, and exits zero
        # unless the cluster cannot be read, so one unanswerable question does
        # not hide the nine that follow it.
        # errexit off explicitly, rather than merely left alone. These commands
        # are wrapped before they run, set -uo pipefail does not clear -e if
        # that wrapper set it, and a bare command that fails would then abandon
        # the step where it stands. Measured in the first rehearsal: one
        # Forbidden ended a step after a single line, before the echo on the
        # next line or the step's own exit. A probe that stops at its first
        # unanswerable question is the thing this file exists to avoid.
        set +e
        set -uo pipefail

        redact() {
          sed -E 's/[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}/<guid>/g'
        }

        # Key names, and the values never land in a shell variable on the way.
        # A variable holding a client secret can be printed by an error path or
        # a stray trace, and prow logs are public for openshift repositories;
        # jq reads the stream and emits nothing but the names. --ignore-not-found
        # so an absent secret is an answer rather than a failed read.
        # Reached through root_secret_keys and read_value.
        # shellcheck disable=SC2329
        secret_keys() {
          oc -n "$1" get secret "$2" -o json --ignore-not-found \
            | jq -r 'if .data then (.data | keys | @json) else empty end'
        }
        section() { echo; echo "=== $* ==="; }

        # Three outcomes, told apart. A read can succeed with a value, succeed
        # with nothing, or fail -- and reporting the last two the same way is
        # how "you may not look at this" becomes "there is nothing there". They
        # need different people to fix them, so the status is kept and the
        # error is printed rather than discarded.
        #
        # The command is passed as arguments, not a string, so nothing is
        # re-parsed. Where a value needs post-processing, pass a function: it
        # is a command like any other and pipefail carries the failure out of
        # it.
        read_value() {
          local label="$1" when_empty="$2"; shift 2
          local out err rc=0
          err="$(mktemp)"
          out="$("$@" 2>"${err}")" || rc=$?
          if (( rc != 0 )); then
            printf '  %-30s <read FAILED: %s>\n' "${label}" "$(head -1 "${err}" | redact)"
          else
            printf '  %-30s %s\n' "${label}" "${out:-<${when_empty}>}"
          fi
          rm -f "${err}"
        }
        dump() {
          local name="$1" err; shift
          err="$(mktemp)"
          # Raw stderr is captured outside the artifact directory and only a
          # redacted copy is put into it. Artifacts are published exactly as
          # the logs are, and a failed Azure or Kubernetes call names the
          # subscription, the tenant, the principal or the request URL in its
          # error text -- which is the very thing redact exists to remove.
          if "$@" 2>"${err}" | redact >"${ARTIFACT_DIR}/${name}"; then
            echo "  saved ${name}"
          else
            redact <"${err}" >"${ARTIFACT_DIR}/${name}.err"
            echo "  FAILED ${name}: $(head -1 "${ARTIFACT_DIR}/${name}.err")"
          fi
          rm -f "${err}"
        }

        section "version"
        oc get clusterversion version -o jsonpath='desired:  {.status.desired.version}{"\n"}channel: {.spec.channel}{"\n"}'
        oc get clusterversion version -o json | jq -r '.status.history[] | "  \(.state) \(.version) \(.completionTime // "")"'
        dump clusterversion.yaml oc get clusterversion -o yaml

        section "cluster operators"
        oc get clusteroperators 2>&1 | sed 's/^/  /'
        echo "not Available, or Degraded:"
        unhealthy="$(oc get clusteroperators -o json | jq -r '
          .items[]
          | select(any(.status.conditions[];
              (.type == "Available" and .status != "True")
              or (.type == "Degraded" and .status == "True")))
          | .metadata.name')"
        if [[ -n "${unhealthy}" ]]; then
          printf '%s\n' "${unhealthy}" | sed 's/^/  /'
        else
          echo "  none"
        fi
        dump clusteroperators.yaml oc get clusteroperators -o yaml

        section "nodes"
        # providerID is not decoration here: internal/platform/azure/providerid.go
        # parses the virtual machine out of it and matches interfaces on their
        # VirtualMachine.ID. An ARO providerID that is shaped differently from
        # an IPI one breaks node reconciliation before anything else.
        oc get nodes -o json | jq -r '.items[] | "  \(.metadata.name)\n    roles:      \([.metadata.labels | keys[] | select(startswith("node-role"))] | join(","))\n    instance:   \(.metadata.labels["node.kubernetes.io/instance-type"] // "?")\n    zone:       \(.metadata.labels["topology.kubernetes.io/zone"] // "?")\n    providerID: \(.spec.providerID)"' | redact
        dump nodes.yaml oc get nodes -o yaml

        section "machine API"
        # Whether the cluster has one at all. ARO manages its own machines, and
        # a job that expects to label or scale through machinesets would find
        # nothing to talk to.
        oc -n openshift-machine-api get machinesets 2>&1 | sed 's/^/  /'
        oc -n openshift-machine-api get machines 2>&1 | sed 's/^/  /'
        oc get machineconfigpools 2>&1 | sed 's/^/  /'

        section "feature gates"
        read_value "featureSet" "empty, which means Default" \
          oc get featuregate cluster -o jsonpath='{.spec.featureSet}'
        # ARO does not support what OpenShift ships as Technology Preview, so
        # anything the operator needs had better be enabled by default here.
        oc get featuregate cluster -o json \
          | jq -r '[.status.featureGates[]?.enabled[]?.name] | map(select(test("Route|BGP|FRR"; "i"))) | "  enabled and relevant: \(.)"' || true

        section "network"
        oc get network.config.openshift.io cluster -o jsonpath='networkType: {.spec.networkType}{"\n"}clusterNetwork: {.spec.clusterNetwork}{"\n"}serviceNetwork: {.spec.serviceNetwork}{"\n"}'
        echo "routing capabilities and advertisements, before anything touches them:"
        read_value "additionalRoutingCapabilities" "unset, which is what enable-frr changes" \
          oc get network.operator.openshift.io cluster \
          -o jsonpath='{.spec.additionalRoutingCapabilities}'
        read_value "routeAdvertisements" "unset" \
          oc get network.operator.openshift.io cluster \
          -o jsonpath='{.spec.defaultNetwork.ovnKubernetesConfig.routeAdvertisements}'
        dump network-config.yaml oc get network.config.openshift.io cluster -o yaml
        dump network-operator.yaml oc get network.operator.openshift.io cluster -o yaml

        section "cloud credentials"
        # Which mode CCO settled in decides whether a CredentialsRequest yields
        # a client secret, a federated token file, or nothing at all.
        # The effective mode is the annotation CCO puts on the root secret,
        # not spec.credentialsMode. That field is the administrator's request
        # and is empty on almost every cluster, meaning "you decide"; the
        # annotation is what CCO decided, and mint, passthrough and manual
        # lead to three entirely different jobs.
        # The last segment of the issuer is elided: it names the cluster's
        # storage account, and artifacts are public.
        # Invoked indirectly, by read_value.
        # shellcheck disable=SC2329
        issuer_elided() {
          oc get authentication cluster -o jsonpath='{.spec.serviceAccountIssuer}' \
            | sed 's|/[^/]*$|/<id>|'
        }
        # Key names only. The values are credentials.
        # Invoked indirectly, by read_value.
        # shellcheck disable=SC2329
        root_secret_keys() { secret_keys kube-system azure-credentials; }
        read_value "effective mode" "no annotation: CCO has claimed no mode here" \
          oc -n kube-system get secret azure-credentials --ignore-not-found \
          -o jsonpath='{.metadata.annotations.cloudcredential\.openshift\.io/mode}'
        read_value "requested mode" "empty, which means default" \
          oc get cloudcredential cluster -o jsonpath='{.spec.credentialsMode}'
        read_value "serviceAccountIssuer" "none, so this cluster cannot federate" issuer_elided
        read_value "root secret keys" "no kube-system/azure-credentials" root_secret_keys
        read_value "pod identity webhook" "absent, so this cluster does not federate" \
          oc -n openshift-cloud-credential-operator get deployment pod-identity-webhook \
          -o name --ignore-not-found
        dump cloudcredential.yaml oc get cloudcredential cluster -o yaml
        dump co-cloud-credential.yaml oc get co cloud-credential -o yaml

        section "OLM"
        # operator-sdk run bundle brings its own catalogue, but it still needs
        # OLM itself and it still has to pull an image this job built.
        oc get catalogsources -A 2>&1 | sed 's/^/  /'
        oc -n openshift-operator-lifecycle-manager get deployments 2>&1 | sed 's/^/  /'

        section "can this cluster pull an image this job built"
        # ipi-install-rbac grants the test namespace's images to unauthenticated
        # pullers so the cluster can reach the build farm registry. An ARO
        # cluster sits in a subscription of its own and reaches it over the
        # internet; if that does not work, the install step fails opaquely
        # minutes later with ImagePullBackOff.
        oc create namespace bgp-probe --dry-run=client -o yaml | oc apply -f -
        oc -n bgp-probe run pullcheck --image="${OO_BUNDLE}" --restart=Never \
          --command -- /bin/true >/dev/null 2>&1

        # imageID is the signal, not the phase. A bundle image is metadata on
        # a near empty filesystem and very often has no /bin/true, so the
        # container can fail to start having pulled perfectly well: waiting for
        # Running or Succeeded would time out and report a pull problem that
        # did not happen. imageID is set once kubelet has the image, whatever
        # happens next.
        verdict="neither pulled nor failed within five minutes"
        deadline=$((SECONDS + 300))
        while (( SECONDS < deadline )); do
          reason="$(oc -n bgp-probe get pod pullcheck \
            -o jsonpath='{.status.containerStatuses[0].state.waiting.reason}' 2>/dev/null)"
          case "${reason}" in
            ImagePullBackOff|ErrImagePull|InvalidImageName)
              verdict="CANNOT PULL: ${reason}"
              verdict="${verdict}
            $(oc -n bgp-probe get pod pullcheck \
              -o jsonpath='{.status.containerStatuses[0].state.waiting.message}' 2>/dev/null)"
              break ;;
          esac
          if [[ -n "$(oc -n bgp-probe get pod pullcheck \
               -o jsonpath='{.status.containerStatuses[0].imageID}' 2>/dev/null)" ]]; then
            verdict="pulled (container state after that is ${reason:-running or finished}, and does not matter here)"
            break
          fi
          phase="$(oc -n bgp-probe get pod pullcheck -o jsonpath='{.status.phase}' 2>/dev/null)"
          if [[ "${phase}" == Succeeded || "${phase}" == Failed ]]; then
            verdict="pulled and ran to completion: phase ${phase}"
            break
          fi
          sleep 5
        done
        echo "  ${verdict}"

        section "pod security"
        # The install step asks operator-sdk for the restricted security
        # context config, which only works if the namespace admits it.
        oc get namespace bgp-probe -o jsonpath='  labels: {.metadata.labels}{"\n"}'
        oc get scc restricted-v2 -o name 2>&1 | sed 's/^/  /'

        section "does CCO answer a request shaped like the operator's"
        # The operator's own CredentialsRequest under another name. What comes
        # back says which mode is really in force: a client secret means mint
        # or passthrough, a federated token file means workload identity, and
        # nothing at all means manual.
        oc apply -f - <<'CR'
        apiVersion: cloudcredential.openshift.io/v1
        kind: CredentialsRequest
        metadata:
          name: bgp-probe
          namespace: openshift-cloud-credential-operator
        spec:
          providerSpec:
            apiVersion: cloudcredential.openshift.io/v1
            kind: AzureProviderSpec
            permissions:
            - Microsoft.Network/virtualHubs/read
            - Microsoft.Network/virtualHubs/bgpConnections/read
            - Microsoft.Network/virtualHubs/bgpConnections/write
            - Microsoft.Network/virtualHubs/bgpConnections/delete
            - Microsoft.Network/networkInterfaces/read
            - Microsoft.Network/networkInterfaces/write
          secretRef:
            name: bgp-probe-credentials
            namespace: bgp-probe
          serviceAccountNames:
          - default
        CR
        deadline=$((SECONDS + 300))
        until oc -n bgp-probe get secret bgp-probe-credentials >/dev/null 2>&1; do
          if (( SECONDS >= deadline )); then
            echo "  CCO wrote no secret within five minutes"
            break
          fi
          sleep 10
        done
        # Key names only. The values are credentials.
        read_value "secret keys" "CCO wrote no secret" secret_keys bgp-probe bgp-probe-credentials
        dump credentialsrequest.yaml oc -n openshift-cloud-credential-operator get credentialsrequest bgp-probe -o yaml

        section "can the credentials CCO issued write a node interface"
        # ensureNodesCanForward turns on IP forwarding on the router nodes'
        # interfaces, and those live in the cluster's own resource group behind
        # the deny assignment. Whether the principal CCO handed out is one of
        # the excluded ones is the single fact the whole design turns on, so it
        # is exercised rather than reasoned about. A node interface is left
        # exactly as the operator would leave it.
        rg="$(oc get infrastructure cluster -o jsonpath='{.status.platformStatus.azure.resourceGroupName}')"
        net_rg="$(oc get infrastructure cluster -o jsonpath='{.status.platformStatus.azure.networkResourceGroupName}')"
        : "${net_rg:=${rg}}"
        client_id="$(oc -n bgp-probe get secret bgp-probe-credentials -o jsonpath='{.data.azure_client_id}' 2>/dev/null | base64 -d)"
        client_secret="$(oc -n bgp-probe get secret bgp-probe-credentials -o jsonpath='{.data.azure_client_secret}' 2>/dev/null | base64 -d)"
        tenant_id="$(oc -n bgp-probe get secret bgp-probe-credentials -o jsonpath='{.data.azure_tenant_id}' 2>/dev/null | base64 -d)"
        if [[ -z "${client_id}" || -z "${client_secret}" ]]; then
          echo "  CCO issued no client secret, so there is nothing to try it with"
        else
          cfg="$(mktemp -d)"
          export AZURE_CONFIG_DIR="${cfg}"
          # Retried, because a principal CCO has only just minted is not usable
          # the instant it exists: Entra is eventually consistent and the first
          # login comes back as a bad credential, which is indistinguishable
          # from one that really is bad. Four attempts over a minute tell the
          # two apart.
          logged_in=false
          login_err="$(mktemp)"
          for attempt in 1 2 3 4; do
            if az login --service-principal --username "${client_id}" \
                 --password "${client_secret}" --tenant "${tenant_id}" \
                 --output none 2>"${login_err}"; then
              logged_in=true
              echo "  logged in on attempt ${attempt}"
              break
            fi
            sleep 20
          done
          if [[ "${logged_in}" != true ]]; then
            echo "  the last attempt said:"
            redact <"${login_err}" | sed 's/^/    /'
          fi
          rm -f "${login_err}"
          if [[ "${logged_in}" == true ]]; then
            # The interface of a router node, found the way the operator finds
            # it: the virtual machine is parsed out of the node's providerID and
            # interfaces are matched on their VirtualMachine.ID. Taking the
            # first interface in the group instead picks a control plane node,
            # which is not what the operator ever writes to and which on a
            # managed cluster may not be governed by the same rules.
            provider_id="$(oc get nodes -l node-role.kubernetes.io/worker \
              -o jsonpath='{.items[0].spec.providerID}' 2>/dev/null)"
            vm="${provider_id##*/}"
            nic=""
            if [[ -n "${vm}" ]]; then
              nic="$(az network nic list -g "${rg}" \
                --query "[?virtualMachine.id != null && contains(virtualMachine.id, '${vm}')].name | [0]" \
                -o tsv 2>/dev/null)"
            fi
            if [[ -z "${nic}" || "${nic}" == "None" ]]; then
              echo "  no interface found for worker ${vm:-<none>}; nothing to try"
            else
              echo "  trying ${nic}, the interface of worker ${vm}"
              nic_err="$(mktemp)"
              if az network nic update -g "${rg}" -n "${nic}" \
                   --set enableIPForwarding=true --output none 2>"${nic_err}"; then
                # Stated as what was observed. What it means depends on the
                # cluster: where a deny assignment governs this group, a write
                # that succeeds says the principal is one of the excluded ones,
                # and that is the whole basis of the passthrough design. Where
                # there is no deny assignment the write proves only that the
                # credentials carry the permission.
                echo "  interface write ALLOWED"
              else
                echo "  interface write REFUSED:"
                redact <"${nic_err}" >"${ARTIFACT_DIR}/nic.err"
                sed 's/^/    /' <"${ARTIFACT_DIR}/nic.err"
              fi
              rm -f "${nic_err}"
              # Against the group the Route Server will be built in, not the
              # group the interfaces are in. On ARO those differ, and a read of
              # the managed group says nothing about whether these credentials
              # can reach the estate the operator actually discovers.
              #
              # Nothing is there yet -- probe-estate runs after this step -- so
              # what is being asked is whether the read is permitted at all, and
              # the command's status is what answers that. Folding stderr into
              # the value would make a refusal look like a list of hubs.
              echo "  and may it read virtual hubs in ${net_rg}, which is what discovery does:"
              hub_err="$(mktemp)"
              if hubs="$(az network routeserver list -g "${net_rg}" --query "[].name" -o tsv 2>"${hub_err}")"; then
                if [[ -n "${hubs}" ]]; then
                  printf '%s\n' "${hubs}" | redact | sed 's/^/    /'
                else
                  echo "    permitted, and none exist yet, which is expected before probe-estate"
                fi
              else
                echo "    REFUSED:"
                redact <"${hub_err}" | sed 's/^/      /'
              fi
              rm -f "${hub_err}"
            fi
          else
            echo "  the issued credentials would not log in after four attempts"
          fi
          unset AZURE_CONFIG_DIR
          rm -rf "${cfg}"
        fi

        section "done"
        exit 0
      dependencies:
      - env: OO_BUNDLE
        name: bgp-cloud-connector-bundle
      from: azure-e2e-runner
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: probe-identity
      cli: latest
      commands: |
        # Which identity can do what, which is the question AzureConfig's
        # NetworkInterfaceClientID was added for: on ARO the router nodes'
        # interfaces sit in a resource group the cluster does not own, and the
        # identity with write access there is not one this operator can be
        # handed. Naming it works only if a federated credential trusting our
        # service account can be added to it, and whether that is permitted is
        # the fact this step exists to establish.
        # errexit off explicitly, rather than merely left alone. These commands
        # are wrapped before they run, set -uo pipefail does not clear -e if
        # that wrapper set it, and a bare command that fails would then abandon
        # the step where it stands. Measured in the first rehearsal: one
        # Forbidden ended a step after a single line, before the echo on the
        # next line or the step's own exit. A probe that stops at its first
        # unanswerable question is the thing this file exists to avoid.
        set +e
        set -uo pipefail

        AZURE_CONFIG_DIR="$(mktemp -d)"
        export AZURE_CONFIG_DIR

        redact() {
          sed -E 's/[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}/<guid>/g'
        }

        # Anything created here is recorded before it is created, not after, so
        # that a step killed between the two still leaves the post teardown
        # something to find. The teardown treats a name that was never built as
        # already gone, so recording something that failed costs it one read.
        record_federation() {
          printf '%s|%s|%s\n' "$1" "$2" "$3" >>"${SHARED_DIR}/bgp-probe-identity"
        }

        # Says whether it is really gone, rather than trusting the delete. This
        # is the one removal whose failure leaves a managed identity trusting a
        # service account in a cluster that will not exist an hour from now.
        confirm_federation_gone() {
          local rg="$1" identity="$2" name="$3"
          if az identity federated-credential show --name "${name}" \
               --identity-name "${identity}" -g "${rg}" --output none 2>/dev/null; then
            echo "    STILL THERE after the delete; the post teardown will try again"
            return 1
          fi
          echo "    removed, and confirmed gone"
        }

        # Logging in is both the call most likely to fail and the one whose
        # failure text is most likely to name the tenant, the principal, the
        # subscription or the request. Letting az write that to stderr puts it
        # straight into a prow log, which for openshift repositories is public,
        # so it is captured and redacted like everything else.
        #
        # Reports and returns rather than exiting, so a step that cannot log in
        # still hands the run to the next step with a reason recorded.
        az_login() {
          local sp="${CLUSTER_PROFILE_DIR}/osServicePrincipal.json" err rc=0
          if [[ ! -f "${sp}" ]]; then
            echo "the cluster profile has no osServicePrincipal.json"
            return 1
          fi
          err="$(mktemp)"
          az login --service-principal \
            --username "$(jq -er .clientId "${sp}")" \
            --password "$(jq -er .clientSecret "${sp}")" \
            --tenant "$(jq -er .tenantId "${sp}")" \
            --output none 2>"${err}" || rc=$?
          if (( rc == 0 )); then
            az account set --subscription "$(jq -er .subscriptionId "${sp}")" 2>>"${err}" || rc=$?
          fi
          if (( rc != 0 )); then
            echo "could not log in with the cluster profile's service principal:"
            redact <"${err}" | sed 's/^/  /'
          fi
          rm -f "${err}"
          return "${rc}"
        }
        section() { echo; echo "=== $* ==="; }
        dump() {
          local name="$1" err; shift
          err="$(mktemp)"
          # Raw stderr is captured outside the artifact directory and only a
          # redacted copy is put into it. Artifacts are published exactly as
          # the logs are, and a failed Azure or Kubernetes call names the
          # subscription, the tenant, the principal or the request URL in its
          # error text -- which is the very thing redact exists to remove.
          if "$@" 2>"${err}" | redact >"${ARTIFACT_DIR}/${name}"; then
            echo "  saved ${name}"
          else
            redact <"${err}" >"${ARTIFACT_DIR}/${name}.err"
            echo "  FAILED ${name}: $(head -1 "${ARTIFACT_DIR}/${name}.err")"
          fi
          rm -f "${err}"
        }

        subscription="$(jq -er .subscriptionId "${CLUSTER_PROFILE_DIR}/osServicePrincipal.json")"
        az_login || exit 0

        rg="$(oc get infrastructure cluster -o jsonpath='{.status.platformStatus.azure.resourceGroupName}')"
        net_rg="$(oc get infrastructure cluster -o jsonpath='{.status.platformStatus.azure.networkResourceGroupName}')"
        : "${net_rg:=${rg}}"
        region="$(az group show -n "${net_rg}" --query location -o tsv 2>/dev/null)"

        section "which flavour of cluster this is"
        # A managed identity cluster federates and a service principal cluster
        # does not, and the operator's credential path differs entirely
        # between them.
        az aro list -g "${net_rg}" --query "[0].{
          usesWorkloadIdentity: platformWorkloadIdentityProfile != null,
          usesServicePrincipal: servicePrincipalProfile != null
        }" -o json 2>&1 | redact | sed 's/^/  /'

        section "the platform identities, if this cluster has any"
        # Named here so the one that owns interface writes can be recognised.
        az aro list -g "${net_rg}" --query "[0].platformWorkloadIdentityProfile.platformWorkloadIdentities" \
          -o json 2>&1 | redact | sed -E 's#/subscriptions/[^"]*/userAssignedIdentities/#userAssignedIdentity: #' | sed 's/^/  /'
        dump platform-identities.json az aro list -g "${net_rg}" --query "[0].platformWorkloadIdentityProfile"

        section "user assigned identities in each group"
        for group in "${rg}" "${net_rg}"; do
          echo "--- ${group} ---"
          az identity list -g "${group}" --query "[].{name:name}" -o table 2>&1 | redact | sed 's/^/  /'
        done

        section "the OIDC issuer, without which nothing can federate"
        issuer="$(oc get authentication cluster -o jsonpath='{.spec.serviceAccountIssuer}')"
        if [[ -n "${issuer}" ]]; then
          echo "  present (host shown, path elided): ${issuer%%/*}//$(echo "${issuer}" | cut -d/ -f3)/<path>"
          echo "  is it reachable and does it serve a discovery document:"
          if curl -sfL --max-time 30 "${issuer}/.well-known/openid-configuration" \
               | jq -r '{issuer: "<elided>", jwks: (.jwks_uri != null), algs: .id_token_signing_alg_values_supported}' 2>/dev/null | sed 's/^/    /'; then
            :
          else
            echo "    the discovery document could not be fetched from this container"
          fi
        else
          echo "  the cluster declares no serviceAccountIssuer, so it cannot federate at all"
        fi

        section "can a new identity be created in the group we own"
        # The straightforward shape, if it is allowed: our own identity, with a
        # role over the group holding the vnet and the Route Server.
        probe_identity="bgp-probe-identity"
        if az identity create -g "${net_rg}" -n "${probe_identity}" -l "${region}" --output none 2>&1 | redact | sed 's/^/  /'; then
          echo "  created ${probe_identity} in ${net_rg}"
          probe_principal="$(az identity show -g "${net_rg}" -n "${probe_identity}" --query principalId -o tsv 2>/dev/null)"

          echo "  can it be given a role over ${net_rg}, which we own:"
          if az role assignment create --assignee-object-id "${probe_principal}" \
               --assignee-principal-type ServicePrincipal --role "Network Contributor" \
               --scope "/subscriptions/${subscription}/resourceGroups/${net_rg}" \
               --output none 2>&1 | redact | sed 's/^/    /'; then
            echo "    yes"
          else
            echo "    no, so even the vnet side would need another identity"
          fi

          echo "  can it be given a role over ${rg}, which ARO manages:"
          if az role assignment create --assignee-object-id "${probe_principal}" \
               --assignee-principal-type ServicePrincipal --role "Network Contributor" \
               --scope "/subscriptions/${subscription}/resourceGroups/${rg}" \
               --output none 2>&1 | redact | sed 's/^/    /'; then
            echo "    yes, which would make NetworkInterfaceClientID unnecessary"
          else
            echo "    no, which is why NetworkInterfaceClientID exists"
          fi

          if [[ -n "${issuer}" ]]; then
            echo "  can it be federated to the operator's service account:"
            record_federation "${net_rg}" "${probe_identity}" bgp-probe-federation
            fed_err="$(mktemp)"
            if az identity federated-credential create --name bgp-probe-federation \
                 --identity-name "${probe_identity}" -g "${net_rg}" \
                 --issuer "${issuer}" \
                 --subject "system:serviceaccount:openshift-bgp-cloud-connector:openshift-bgp-cloud-connector-controller-manager" \
                 --audiences openshift --output none 2>"${fed_err}"; then
              echo "    yes, so NetworkInterfaceClientID could name an identity of our own"
            else
              echo "    no:"
              redact <"${fed_err}" | sed 's/^/      /'
            fi
            rm -f "${fed_err}"
          fi

          az identity delete -g "${net_rg}" -n "${probe_identity}" --output none 2>&1 | redact | sed 's/^/  /'
          echo "  removed ${probe_identity}"
        else
          echo "  cannot create a user assigned identity in ${net_rg}"
        fi

        section "can a federated credential be added to a platform identity"
        # The shape NetworkInterfaceClientID assumes. ARO's support policy says
        # not to modify the federated identity credentials configured at
        # install time; adding one is a different act from modifying one, and
        # whether Azure permits it at all is what is asked here. It is removed
        # immediately either way.
        platform_identity_rg=""
        platform_identity_name=""
        while read -r resource_id; do
          [[ -z "${resource_id}" || "${resource_id}" == null ]] && continue
          case "${resource_id}" in
            */userAssignedIdentities/*)
              platform_identity_rg="$(echo "${resource_id}" | sed -E 's#.*/resourceGroups/([^/]+)/.*#\1#')"
              platform_identity_name="${resource_id##*/}"
              ;;
          esac
          # The one that touches interfaces is the machine api identity where
          # the naming makes it obvious; otherwise the first is enough to learn
          # whether the operation is permitted at all.
          [[ "${platform_identity_name}" == *machine* ]] && break
        done <<<"$(az aro list -g "${net_rg}" \
          --query "[0].platformWorkloadIdentityProfile.platformWorkloadIdentities.*.resourceId" \
          -o tsv 2>/dev/null)"

        if [[ -z "${platform_identity_name}" ]]; then
          echo "  this cluster has no platform workload identities"
        elif [[ -z "${issuer}" ]]; then
          echo "  no issuer, so federation is moot"
        else
          echo "  trying ${platform_identity_name} in ${platform_identity_rg}"
          record_federation "${platform_identity_rg}" "${platform_identity_name}" bgp-probe-federation
          plat_err="$(mktemp)"
          if az identity federated-credential create --name bgp-probe-federation \
               --identity-name "${platform_identity_name}" -g "${platform_identity_rg}" \
               --issuer "${issuer}" \
               --subject "system:serviceaccount:openshift-bgp-cloud-connector:openshift-bgp-cloud-connector-controller-manager" \
               --audiences openshift --output none 2>"${plat_err}"; then
            echo "    ALLOWED: NetworkInterfaceClientID is workable on ARO"
            if az identity federated-credential delete --name bgp-probe-federation \
                 --identity-name "${platform_identity_name}" -g "${platform_identity_rg}" \
                 --yes --output none 2>"${plat_err}"; then
              confirm_federation_gone "${platform_identity_rg}" "${platform_identity_name}" bgp-probe-federation
            else
              echo "    the delete FAILED; the post teardown will try again:"
              redact <"${plat_err}" | sed 's/^/      /'
            fi
          else
            echo "    REFUSED: the interface write would need another route entirely:"
            redact <"${plat_err}" | sed 's/^/      /'
          fi
          rm -f "${plat_err}"
        fi

        section "done"
        exit 0
      from: azure-e2e-runner
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: probe-estate
      cli: latest
      commands: |
        # Build the estate the operator discovers, from here rather than from
        # the operator's own hack scripts. That repository cannot take the
        # changes an ARO job would need, so if an end-to-end job is ever going
        # to exist it has to stand its estate up from the release repository,
        # and this is the step that shows whether that works.
        #
        # Only the Route Server is built. The BGP connections to the router
        # nodes are the operator's job, and whether it makes them is what the
        # step after the install is for.
        #
        # It reports rather than fails, like every other probe here, so that a
        # Route Server this subscription will not build still leaves the FRR
        # patch, the install and the operator's own behaviour measured. What
        # was built is recorded for the teardown before anything is built, so
        # a step that dies halfway still leaves something that can be cleaned
        # up.
        # errexit off explicitly, rather than merely left alone. These commands
        # are wrapped before they run, set -uo pipefail does not clear -e if
        # that wrapper set it, and a bare command that fails would then abandon
        # the step where it stands. Measured in the first rehearsal: one
        # Forbidden ended a step after a single line, before the echo on the
        # next line or the step's own exit. A probe that stops at its first
        # unanswerable question is the thing this file exists to avoid.
        set +e
        set -uo pipefail

        AZURE_CONFIG_DIR="$(mktemp -d)"
        export AZURE_CONFIG_DIR

        redact() {
          sed -E 's/[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}/<guid>/g'
        }

        # Logging in is both the call most likely to fail and the one whose
        # failure text is most likely to name the tenant, the principal, the
        # subscription or the request. Letting az write that to stderr puts it
        # straight into a prow log, which for openshift repositories is public,
        # so it is captured and redacted like everything else.
        #
        # Reports and returns rather than exiting, so a step that cannot log in
        # still hands the run to the next step with a reason recorded.
        az_login() {
          local sp="${CLUSTER_PROFILE_DIR}/osServicePrincipal.json" err rc=0
          if [[ ! -f "${sp}" ]]; then
            echo "the cluster profile has no osServicePrincipal.json"
            return 1
          fi
          err="$(mktemp)"
          az login --service-principal \
            --username "$(jq -er .clientId "${sp}")" \
            --password "$(jq -er .clientSecret "${sp}")" \
            --tenant "$(jq -er .tenantId "${sp}")" \
            --output none 2>"${err}" || rc=$?
          if (( rc == 0 )); then
            az account set --subscription "$(jq -er .subscriptionId "${sp}")" 2>>"${err}" || rc=$?
          fi
          if (( rc != 0 )); then
            echo "could not log in with the cluster profile's service principal:"
            redact <"${err}" | sed 's/^/  /'
          fi
          rm -f "${err}"
          return "${rc}"
        }
        section() { echo; echo "=== $* ==="; }

        az_login || exit 0

        rg="$(oc get infrastructure cluster -o jsonpath='{.status.platformStatus.azure.resourceGroupName}')"
        net_rg="$(oc get infrastructure cluster -o jsonpath='{.status.platformStatus.azure.networkResourceGroupName}')"
        : "${net_rg:=${rg}}"
        vnet="$(az network vnet list -g "${net_rg}" --query "[0].name" -o tsv 2>/dev/null)"
        if [[ -z "${net_rg}" || -z "${vnet}" ]]; then
          echo "no virtual network in ${net_rg:-<no group>}; nothing can be built here"
          exit 0
        fi

        rs="bgp-probe-rs"
        pip="bgp-probe-rs-pip"

        # Written before anything exists, so the teardown can remove a Route
        # Server this step was killed in the middle of creating. The teardown
        # treats every absence as success, so naming something that was never
        # built costs it a read.
        {
          echo "NET_RG=${net_rg}"
          echo "VNET=${vnet}"
          echo "ROUTE_SERVER=${rs}"
          echo "ROUTE_SERVER_PIP=${pip}"
        } >"${SHARED_DIR}/bgp-probe-estate"

        section "the subnet"
        # aro-provision-vnet gives the vnet 10.0.0.0/17 and puts the master and
        # worker subnets in the first two /23s, so a /27 at 10.0.4.0 is already
        # inside the address space and no prefix has to be added -- Azure
        # refuses an added prefix that overlaps one the vnet already has. The
        # name is fixed: Azure hosts a Route Server only in a subnet called
        # RouteServerSubnet.
        if az network vnet subnet show -g "${net_rg}" --vnet-name "${vnet}" \
             -n RouteServerSubnet --output none 2>/dev/null; then
          echo "  already there"
        elif az network vnet subnet create -g "${net_rg}" --vnet-name "${vnet}" \
               -n RouteServerSubnet --address-prefixes 10.0.4.0/27 --output none 2>&1 \
               | redact | sed 's/^/  /'; then
          echo "  created 10.0.4.0/27"
        else
          echo "  could not create RouteServerSubnet, so there is nowhere to put a Route Server"
          exit 0
        fi

        subnet_id="$(az network vnet subnet show -g "${net_rg}" --vnet-name "${vnet}" \
          -n RouteServerSubnet --query id -o tsv 2>/dev/null)"
        if [[ -z "${subnet_id}" ]]; then
          echo "  the subnet exists but has no readable id; stopping here"
          exit 0
        fi

        section "the public address"
        # Standard SKU and a static allocation, because a Route Server takes
        # nothing else.
        if az network public-ip show -g "${net_rg}" -n "${pip}" --output none 2>/dev/null; then
          echo "  already there"
        elif az network public-ip create -g "${net_rg}" -n "${pip}" \
               --sku Standard --allocation-method Static --version IPv4 --output none 2>&1 \
               | redact | sed 's/^/  /'; then
          echo "  created"
        else
          echo "  could not create the public address"
          exit 0
        fi

        section "the Route Server"
        # Twenty minutes is normal. It is worth the wall clock because this is
        # the one piece nothing else in this job has shown can be built from
        # the release repository.
        started="${SECONDS}"
        if az network routeserver show -g "${net_rg}" -n "${rs}" --output none 2>/dev/null; then
          echo "  already there"
        elif az network routeserver create -g "${net_rg}" -n "${rs}" \
               --hosted-subnet "${subnet_id}" --public-ip-address "${pip}" \
               --output none 2>&1 | redact | sed 's/^/  /'; then
          echo "  created in $(( (SECONDS - started) / 60 )) minutes"
        else
          echo "  could not create the Route Server after $(( (SECONDS - started) / 60 )) minutes"
          exit 0
        fi

        section "what it says about itself"
        # virtualRouterIps are the addresses the operator hands to FRR as
        # neighbours, and virtualRouterAsn is the far side's AS number, which
        # Azure fixes and offers no flag to change.
        az network routeserver show -g "${net_rg}" -n "${rs}" --query "{
          provisioningState: provisioningState,
          virtualRouterAsn: virtualRouterAsn,
          virtualRouterIps: virtualRouterIps,
          allowBranchToBranchTraffic: allowBranchToBranchTraffic
        }" -o json 2>&1 | redact | sed 's/^/  /'
        az network routeserver show -g "${net_rg}" -n "${rs}" -o json 2>/dev/null \
          | redact >"${ARTIFACT_DIR}/routeserver.json"

        # Only now, because the step after this one reconciles against it and
        # should not try if there is nothing there.
        echo "ROUTE_SERVER_BUILT=yes" >>"${SHARED_DIR}/bgp-probe-estate"

        section "done"
        exit 0
      from: azure-e2e-runner
      grace_period: 30m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: enable-frr
      cli: latest
      commands: |
        set -euo pipefail

        # Both controllers watch FRRConfiguration and RouteAdvertisements
        # from SetupWithManager, and CNO creates those two CRDs only in
        # response to this patch. Without them the caches never sync, the
        # manager exits after two minutes, and the CSV never installs.
        # The operator applies this same patch itself as the first phase
        # of reconcile, but it cannot stay alive long enough to do so;
        # when that is fixed, this step comes out and the job proves the
        # install a catalogue user actually performs.
        oc patch network.operator.openshift.io cluster --type=merge \
          -p '{"spec":{"additionalRoutingCapabilities":{"providers":["FRR"]},"defaultNetwork":{"ovnKubernetesConfig":{"routeAdvertisements":"Enabled"}}}}'

        deadline=$((SECONDS + 900))

        for crd in frrconfigurations.frrk8s.metallb.io routeadvertisements.k8s.ovn.org; do
          echo "waiting for crd/${crd}..."
          until oc wait --for=condition=Established "crd/${crd}" --timeout=10s >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              oc get network.operator.openshift.io cluster -o yaml >&2
              echo "timed out waiting for crd/${crd}" >&2
              exit 1
            fi
            sleep 5
          done
        done

        # The rollout is what says CNO finished rather than that it
        # started. Measured at about two minutes on 4.22.
        echo "waiting for the frr-k8s rollout..."
        until oc -n openshift-frr-k8s rollout status daemonset/frr-k8s --timeout=2m >/dev/null 2>&1; do
          if (( SECONDS >= deadline )); then
            oc -n openshift-frr-k8s get pods >&2
            echo "timed out waiting for the frr-k8s daemonset" >&2
            exit 1
          fi
          sleep 5
        done

        oc -n openshift-frr-k8s get daemonset frr-k8s
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: install
      cli: latest
      commands: |
        set -euo pipefail

        oc create namespace openshift-bgp-cloud-connector --dry-run=client -o yaml | oc apply -f -

        # The CSV supports OwnNamespace and SingleNamespace only. The
        # manager scopes no caches, so it watches cluster-wide either
        # way.
        operator-sdk run bundle -n openshift-bgp-cloud-connector --timeout=10m \
          --security-context-config restricted --install-mode OwnNamespace "${OO_BUNDLE}"

        oc -n openshift-bgp-cloud-connector wait --for=condition=Available \
          deployment/openshift-bgp-cloud-connector-controller-manager --timeout=5m
        oc -n openshift-bgp-cloud-connector get csv
      dependencies:
      - env: OO_BUNDLE
        name: bgp-cloud-connector-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
