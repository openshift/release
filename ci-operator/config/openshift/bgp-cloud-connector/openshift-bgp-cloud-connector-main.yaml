          az network vnet show --ids "${vnet_id}" --query "{
            addressSpace: addressSpace.addressPrefixes,
            subnets: subnets[].{name:name, prefix:addressPrefix},
            tags: tags
          }" -o json 2>&1 | redact | sed 's/^/  /'
        else
          echo "  none recorded"
        fi

