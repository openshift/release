          az identity delete -g "${net_rg}" -n "${probe_identity}" --output none 2>&1 | redact | sed 's/^/  /'
          echo "  removed ${probe_identity}"
        else
          echo "  cannot create a user assigned identity in ${net_rg}"
        fi

        section "can a federated credential be added to a platform identity"
        # The shape NetworkInterfaceClientID assumes. ARO's support policy says
        # not to modify the federated identity credentials configured at
        # install time; adding one is a different act from modifying one, and
        # whether Azure permits it at all is what is asked here. It is removed
        # immediately either way.
        platform_identity_rg=""
        platform_identity_name=""
        while read -r resource_id; do
          [[ -z "${resource_id}" || "${resource_id}" == null ]] && continue
          case "${resource_id}" in
            */userAssignedIdentities/*)
              platform_identity_rg="$(echo "${resource_id}" | sed -E 's#.*/resourceGroups/([^/]+)/.*#\1#')"
              platform_identity_name="${resource_id##*/}"
              ;;
