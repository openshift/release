          echo "  the cluster declares no serviceAccountIssuer, so it cannot federate at all"
        fi

        section "can a new identity be created in the group we own"
        # The straightforward shape, if it is allowed: our own identity, with a
        # role over the group holding the vnet and the Route Server.
        probe_identity="bgp-probe-identity"
        if az identity create -g "${net_rg}" -n "${probe_identity}" -l "${region}" --output none 2>&1 | redact | sed 's/^/  /'; then
          echo "  created ${probe_identity} in ${net_rg}"
          probe_principal="$(az identity show -g "${net_rg}" -n "${probe_identity}" --query principalId -o tsv 2>/dev/null)"

          echo "  can it be given a role over ${net_rg}, which we own:"
          if az role assignment create --assignee-object-id "${probe_principal}" \
               --assignee-principal-type ServicePrincipal --role "Network Contributor" \
               --scope "/subscriptions/${subscription}/resourceGroups/${net_rg}" \
               --output none 2>&1 | redact | sed 's/^/    /'; then
            echo "    yes"
          else
            echo "    no, so even the vnet side would need another identity"
          fi

          echo "  can it be given a role over ${rg}, which ARO manages:"
          if az role assignment create --assignee-object-id "${probe_principal}" \
               --assignee-principal-type ServicePrincipal --role "Network Contributor" \
               --scope "/subscriptions/${subscription}/resourceGroups/${rg}" \
               --output none 2>&1 | redact | sed 's/^/    /'; then
