              echo "    the delete FAILED; the post teardown will try again:"
              redact <"${plat_err}" | sed 's/^/      /'
            fi
          else
            echo "    REFUSED: the interface write would need another route entirely:"
            redact <"${plat_err}" | sed 's/^/      /'
          fi
          rm -f "${plat_err}"
        fi

