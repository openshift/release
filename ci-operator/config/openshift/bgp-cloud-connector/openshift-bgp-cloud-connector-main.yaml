          # classic ARO the managed group carries one; whether anything
          # here does is what decides if a job can write to its own
          # resources.
          sub="$(az account show --query id -o tsv 2>/dev/null)"
          az rest --method get --url \
            "https://management.azure.com/subscriptions/${sub}/resourceGroups/${rg}/providers/Microsoft.Authorization/denyAssignments?api-version=2022-04-01" \
            --query "value[].{name:denyAssignmentName, actions:permissions[].actions, notActions:permissions[].notActions}" \
            -o json 2>&1 | redact | sed 's/^/  /'

          section "can we write in ${rg}"
