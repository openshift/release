          echo "  present (host shown, path elided): ${issuer%%/*}//$(echo "${issuer}" | cut -d/ -f3)/<path>"
          echo "  is it reachable and does it serve a discovery document:"
          if curl -sfL --max-time 30 "${issuer}/.well-known/openid-configuration" \
               | jq -r '{issuer: "<elided>", jwks: (.jwks_uri != null), algs: .id_token_signing_alg_values_supported}' 2>/dev/null | sed 's/^/    /'; then
            :
