        if ! az login --service-principal \
             --username "$(jq -er .clientId "${creds}")" \
             --password="$(jq -er .clientSecret "${creds}")" \
             --tenant "$(jq -er .tenantId "${creds}")" --output none 2>"${err}"; then
          echo "could not log in:"; redact <"${err}" | sed 's/^/  /'; exit 0
        fi
        az account set --subscription "$(jq -er .subscriptionId "${creds}")" 2>/dev/null

        section "the groups this job was given"
        # Classic ARO hands over one group it manages and one we own. The
        # HCP shape is recorded in files instead, and whether the split is
        # the same is the question.
        for f in resourcegroup resourcegroup_vnet resourcegroup_nsg; do
          if [[ -s "${SHARED_DIR}/${f}" ]]; then
            echo "  ${f}: $(<"${SHARED_DIR}/${f}")"
          else
            echo "  ${f}: <not recorded>"
          fi
        done

        for f in resourcegroup resourcegroup_vnet; do
          [[ -s "${SHARED_DIR}/${f}" ]] || continue
          rg="$(<"${SHARED_DIR}/${f}")"
          section "what is in ${rg}"
          az resource list -g "${rg}" --query "[].{name:name,type:type}" -o table 2>&1 \
            | redact | sed 's/^/  /'

          section "deny assignments over ${rg}"
