    - ref: aro-deprovision
    pre:
    - ref: azure-provision-resourcegroup
    - ref: aro-provision-vnet
    - as: aro-provision-miwi-cluster
      cli: latest
      commands: |
        # Build an ARO classic cluster with managed identities. The shared
        # aro-provision-cluster step cannot: its image carries az 2.61, and
        # az aro create takes --enable-managed-identity only from 2.84.
        # e2e-runner carries 2.90. az aro create makes neither the
        # identities nor their role assignments for a managed-identity
        # cluster, so this does, as Microsoft's "Create an Azure Red Hat
        # OpenShift cluster with managed identities" lists them.
        set -euo pipefail

        CLUSTER="${NAMESPACE}-${UNIQUE_HASH}"
        RESOURCEGROUP="$(cat "${SHARED_DIR}/resourcegroup")"
        VNET="$(cat "${SHARED_DIR}/vnet")"
        LOCATION="${LEASED_RESOURCE}"
        echo "${CLUSTER}" > "${SHARED_DIR}/cluster-name"
        echo "${LOCATION}" > "${SHARED_DIR}/location"

        AZURE_CONFIG_DIR="$(mktemp -d)"
        export AZURE_CONFIG_DIR
        sp="${CLUSTER_PROFILE_DIR}/osServicePrincipal.json"
        # --password=VALUE, not --password VALUE: a secret beginning with a
        # hyphen is otherwise read as another flag.
        az login --service-principal \
          --username "$(jq -er .clientId "${sp}")" \
          --password="$(jq -er .clientSecret "${sp}")" \
          --tenant "$(jq -er .tenantId "${sp}")" --output none
        subscription="$(jq -er .subscriptionId "${sp}")"
        az account set --subscription "${subscription}"
        echo "az $(az version --query '"azure-cli"' -o tsv)"

        version="$(az aro get-versions -l "${LOCATION}" -o tsv | grep "^${ARO_CLUSTER_VERSION}\." | sort -V | tail -1 || true)"
        if [[ -z "${version}" ]]; then
          echo "no ARO ${ARO_CLUSTER_VERSION}.x in ${LOCATION}; it offers:" >&2
          az aro get-versions -l "${LOCATION}" -o tsv >&2
          exit 1
        fi
        echo "ARO ${version} in ${LOCATION}"

        operators=(aro-operator cloud-controller-manager cloud-network-config
                   disk-csi-driver file-csi-driver image-registry ingress machine-api)

        # The resource provider publishes the operators per minor version
        # but not the scopes their roles apply at, so the scopes are written
        # below and the list is checked against the provider's. A new
        # operator would otherwise surface as a create failing an hour in.
        want="$(printf '%s\n' "${operators[@]}" | sort)"
        got="$(az rest --method GET \
          --url "https://management.azure.com/subscriptions/${subscription}/providers/Microsoft.RedHatOpenShift/locations/${LOCATION}/platformWorkloadIdentityRoleSets/${version%.*}?api-version=2025-07-25" \
          --query 'properties.platformWorkloadIdentityRoles[].operatorName' -o tsv | sort)"
        if [[ "${want}" != "${got}" ]]; then
          echo "the provider's operators for ${version%.*} differ from this step's:" >&2
          diff <(echo "${want}") <(echo "${got}") >&2 || true
          exit 1
        fi

        declare -A id=() principal=()
        for key in cluster "${operators[@]}"; do
          out="$(az identity create -g "${RESOURCEGROUP}" -n "${CLUSTER}-${key}" -l "${LOCATION}" \
            --query '[id, principalId]' -o tsv)"
          id[${key}]="$(sed -n 1p <<<"${out}")"
          principal[${key}]="$(sed -n 2p <<<"${out}")"
        done
        echo "created ${#id[@]} identities"

        # A role assignment to a principal created seconds ago fails with
        # PrincipalNotFound until the principal has replicated.
        grant() {
          local attempt
          for attempt in $(seq 1 10); do
            if az role assignment create --assignee-object-id "$1" \
                 --assignee-principal-type ServicePrincipal \
                 --role "$2" --scope "$3" --output none; then
              return 0
            fi
            sleep 20
          done
          return 1
        }

        vnet_scope="/subscriptions/${subscription}/resourceGroups/${RESOURCEGROUP}/providers/Microsoft.Network/virtualNetworks/${VNET}"
        n=0

        # Azure Red Hat OpenShift Federated Credential, for the cluster
        # identity over each platform identity.
        for op in "${operators[@]}"; do
          grant "${principal[cluster]}" ef318e2a-8334-4a05-9e4a-295a196c6a6e "${id[${op}]}"
          n=$((n + 1))
        done

        # operator, role definition, scope; "subnets" means both subnets.
        # disk-csi-driver has a role in the set but no network grant.
        while read -r op role scope; do
          [[ -n "${op}" ]] || continue
          if [[ "${scope}" == subnets ]]; then
            grant "${principal[${op}]}" "${role}" "${vnet_scope}/subnets/master-subnet"
            grant "${principal[${op}]}" "${role}" "${vnet_scope}/subnets/worker-subnet"
            n=$((n + 2))
          else
            grant "${principal[${op}]}" "${role}" "${vnet_scope}"
            n=$((n + 1))
          fi
        done <<'EOF'
        cloud-controller-manager a1f96423-95ce-4224-ab27-4e3dc72facd4 subnets
        ingress                  0336e1d3-7a87-462b-b6db-342b63f7802c subnets
        machine-api              0358943c-7e01-48ba-8889-02cc51d78637 subnets
        aro-operator             4436bae4-7702-4c84-919b-c4069ff25ee2 subnets
        cloud-network-config     be7a6435-15ae-4171-8f30-4a343eff9e8f vnet
        file-csi-driver          0d7aedc0-15fd-4a67-a412-efad370c947e vnet
        image-registry           8b32b316-c2f5-4ddf-b05b-83dacd2d08b5 vnet
        EOF

        # Azure Red Hat OpenShift First Party Network, for the resource
        # provider's own principal, over the vnet.
        rp="$(az ad sp show --id f1dd0a37-89c6-4e07-bcd1-ffd3d43d8875 --query id -o tsv)"
        grant "${rp}" 42f3c60f-e7b1-46d7-ba56-6de681664342 "${vnet_scope}"
        n=$((n + 1))
        echo "${n} role assignments"

        args=(--enable-managed-identity --assign-cluster-identity "${id[cluster]}")
        for op in "${operators[@]}"; do
          args+=(--assign-platform-workload-identity "${op}" "${id[${op}]}")
        done
        pull_secret=()
        if [[ -f "${CLUSTER_PROFILE_DIR}/pull-secret" ]]; then
          pull_secret=(--pull-secret "@${CLUSTER_PROFILE_DIR}/pull-secret")
        fi

        echo "creating ${CLUSTER}; this takes about an hour"
        az aro create -g "${RESOURCEGROUP}" -n "${CLUSTER}" --location "${LOCATION}" \
          --version "${version}" --vnet "${VNET}" \
          --master-subnet master-subnet --worker-subnet worker-subnet \
          "${pull_secret[@]}" "${args[@]}" --output none

        az aro get-admin-kubeconfig -g "${RESOURCEGROUP}" -n "${CLUSTER}" \
          --file "${SHARED_DIR}/kubeconfig"

        # The admin kubeconfig carries no CA, so oc trusts the API only
        # through the system bundle. ARO installs the API's publicly
        # issued certificate as a named certificate after the install
        # completes, and az aro create can return before it has: until
        # then the API presents the cluster's own certificate and every
        # request fails with "x509: certificate signed by unknown
        # authority". Measured on one cluster: install complete at
        # 07:18:53, named certificate at 07:26:13. Wait for a
        # certificate oc can verify rather than skipping verification.
        deadline=$((SECONDS + 1800))
        until KUBECONFIG="${SHARED_DIR}/kubeconfig" oc get --raw /readyz >/dev/null 2>&1; do
          if (( SECONDS >= deadline )); then
            echo "the API certificate is still not verifiable after 30m" >&2
            KUBECONFIG="${SHARED_DIR}/kubeconfig" oc get --raw /readyz || true
            exit 1
          fi
          sleep 20
        done
        echo "API certificate verifies after $(( SECONDS - deadline + 1800 ))s"

        KUBECONFIG="${SHARED_DIR}/kubeconfig" oc wait clusteroperators --all \
          --for=condition=Available --timeout=30m
      env:
      - default: "4.21"
        documentation: OpenShift minor version; the latest patch ARO offers in the
          leased region is used.
        name: ARO_CLUSTER_VERSION
      from: e2e-runner
      grace_period: 10m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 2h0m0s
    - ref: ipi-install-rbac
    test:
    - as: enable-frr
      cli: latest
      commands: |
        set -euo pipefail

        # Both controllers watch FRRConfiguration and RouteAdvertisements
