- always_run: false
  as: e2e-aro-classic-operator
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: openshift-org-azure
    env:
      ARO_CLUSTER_VERSION: "4.21"
    post:
    - as: estate-sweep
      best_effort: true
      cli: latest
      commands: |
        # Remove any Route Server left in the network resource group, whoever
        # made it. The suite builds its own estate on every other cloud, and if
        # it does so here this job did not record it and cannot name it, but a
        # Route Server still holds the subnet, which holds the virtual network,
        # which takes the group delete with it. aro-deprovision runs next and
        # would fail on exactly that.
        set +e
        set -uo pipefail

        redact() {
          sed -E 's/[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}/<guid>/g'
        }

        net_rg="$(oc get infrastructure cluster -o jsonpath='{.status.platformStatus.azure.networkResourceGroupName}' 2>/dev/null)"
        if [[ -z "${net_rg}" ]]; then
          echo "no cluster to ask, so nothing can be swept"
          exit 0
        fi

        AZURE_CONFIG_DIR="$(mktemp -d)"
        export AZURE_CONFIG_DIR
        sp="${CLUSTER_PROFILE_DIR}/osServicePrincipal.json"
        err="$(mktemp)"
        if ! az login --service-principal \
             --username "$(jq -er .clientId "${sp}")" \
             --password="$(jq -er .clientSecret "${sp}")" \
             --tenant "$(jq -er .tenantId "${sp}")" --output none 2>"${err}"; then
          echo "could not log in:"; redact <"${err}" | sed 's/^/  /'; exit 0
        fi
        az account set --subscription "$(jq -er .subscriptionId "${sp}")" 2>/dev/null

        found="$(az network routeserver list -g "${net_rg}" --query "[].name" -o tsv 2>/dev/null)"
        if [[ -z "${found}" ]]; then
          echo "no Route Server in ${net_rg}"
          exit 0
        fi

        while read -r rs; do
          [[ -z "${rs}" ]] && continue
          echo "=== ${rs} ==="
          peerings="$(az network routeserver peering list -g "${net_rg}" --routeserver "${rs}" \
            --query "[].name" -o tsv 2>/dev/null)"
          while read -r peering; do
            [[ -z "${peering}" ]] && continue
            az network routeserver peering delete -g "${net_rg}" --routeserver "${rs}" \
              -n "${peering}" --yes --output none 2>/dev/null \
              && echo "  peering ${peering}: removed" \
              || echo "  peering ${peering}: would not go"
          done <<<"${peerings}"
          # AnotherOperationInProgress is a wait, not a refusal.
          for attempt in $(seq 1 8); do
            if az network routeserver delete -g "${net_rg}" -n "${rs}" --yes --output none 2>"${err}"; then
              echo "  removed on attempt ${attempt}"
              break
            fi
            grep -q 'AnotherOperationInProgress' "${err}" || { echo "  COULD NOT REMOVE:"; redact <"${err}" | head -3 | sed 's/^/    /'; break; }
            sleep 30
          done
        done <<<"${found}"
        rm -f "${err}"
