        exit 0
      from: e2e-runner
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: bgp-cloud-connector-estate-create
    - as: probe-estate-access
      cli: latest
      commands: |
        # Can the credentials CCO hands the operator actually reach the estate?
        #
        # This is the question the cluster's role assignments raise. The
        # principal passthrough passes through holds Network Contributor on the
        # virtual network resource and Contributor on the group ARO manages.
        # The Route Server is neither: it is a separate resource in the group
        # this job owns. If that means the operator cannot see or peer it, then
        # passthrough alone does not work on ARO however well the rest does,
        # and an end-to-end job would have to grant the principal a role first.
        #
        # The operator reads the Route Server and writes its BGP connections
        # and nothing else, so those are the two calls made here, as it would
        # make them. Then, if they are refused, the same calls are tried again
        # after granting a role, to show whether a step could repair this
        # itself or whether it needs someone with more rights than the job has.
        # errexit off explicitly, rather than merely left alone. These commands
        # are wrapped before they run, set -uo pipefail does not clear -e if
        # that wrapper set it, and a bare command that fails would then abandon
        # the step where it stands. Measured in the first rehearsal: one
        # Forbidden ended a step after a single line, before the echo on the
        # next line or the step's own exit. A probe that stops at its first
        # unanswerable question is the thing this file exists to avoid.
        set +e
        set -uo pipefail

        redact() {
          sed -E 's/[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}/<guid>/g'
        }
        section() { echo; echo "=== $* ==="; }

        if [[ ! -f "${SHARED_DIR}/bgp-cloud-connector-estate" ]]; then
          echo "no estate step ran, so there is nothing to reach"
          exit 0
        fi
        # shellcheck disable=SC1091
        source "${SHARED_DIR}/bgp-cloud-connector-estate"
        : "${NET_RG:=}" "${ROUTE_SERVER:=}" "${ROUTE_SERVER_BUILT:=no}"
        if [[ "${ROUTE_SERVER_BUILT}" != yes || -z "${NET_RG}" || -z "${ROUTE_SERVER}" ]]; then
          echo "no Route Server was built, so there is nothing to reach"
          exit 0
        fi

        # The credentials CCO issued, from the throwaway request probe-cluster
        # made. Read into variables because az login needs them as arguments;
        # nothing here prints them.
        client_id="$(oc -n bgp-probe get secret bgp-probe-credentials \
          -o jsonpath='{.data.azure_client_id}' --ignore-not-found | base64 -d)"
        client_secret="$(oc -n bgp-probe get secret bgp-probe-credentials \
          -o jsonpath='{.data.azure_client_secret}' --ignore-not-found | base64 -d)"
        tenant_id="$(oc -n bgp-probe get secret bgp-probe-credentials \
          -o jsonpath='{.data.azure_tenant_id}' --ignore-not-found | base64 -d)"
        if [[ -z "${client_id}" || -z "${client_secret}" ]]; then
          echo "CCO issued no client secret, so there is nothing to try with"
          exit 0
        fi

        # Separate config directories, so the two logins do not evict
        # each other and each call is made as the principal it names.
        issued_cfg="$(mktemp -d)"
        profile_cfg="$(mktemp -d)"

        # --password=VALUE, not --password VALUE: a secret beginning with a
        # hyphen is read by az as another flag.
        login_as_issued() {
          local err rc=0
          err="$(mktemp)"
          AZURE_CONFIG_DIR="${issued_cfg}" az login --service-principal \
            --username "${client_id}" --password="${client_secret}" \
            --tenant "${tenant_id}" --output none 2>"${err}" || rc=$?
          if (( rc != 0 )); then
            echo "  could not log in as the issued principal:"
            redact <"${err}" | sed 's/^/    /'
          fi
          rm -f "${err}"
          return "${rc}"
        }

        # Runs one call as the issued principal and says which of the three
        # things happened: it worked, it was refused, or it failed for some
        # other reason worth reading.
        as_issued() {
          local what="$1"; shift
          local err rc=0 out
          err="$(mktemp)"
          out="$(AZURE_CONFIG_DIR="${issued_cfg}" "$@" 2>"${err}")" || rc=$?
          if (( rc == 0 )); then
            echo "  ${what}: ALLOWED"
            [[ -n "${out}" ]] && printf '%s\n' "${out}" | redact | sed 's/^/    /'
          else
            echo "  ${what}: REFUSED or failed"
            redact <"${err}" | head -4 | sed 's/^/    /'
          fi
          rm -f "${err}"
          return "${rc}"
        }

        section "logging in as the credentials CCO issued"
        login_as_issued || exit 0
        echo "  ok"

        # A router node's address, because a BGP connection has to name a peer
        # and the operator names the router nodes.
        peer_ip="$(oc get nodes -l node-role.kubernetes.io/worker \
          -o jsonpath='{.items[0].status.addresses[?(@.type=="InternalIP")].address}' 2>/dev/null)"
        echo "  peer would be ${peer_ip:-<no worker address found>}"

        section "what the operator does: read the Route Server"
        # DiscoverEndpoints reads the virtual hub to learn the neighbour
        # addresses and the far side's ASN. Without this the operator cannot
        # begin.
        as_issued "read ${ROUTE_SERVER}" \
          az network routeserver show -g "${NET_RG}" -n "${ROUTE_SERVER}" \
          --query "{asn:virtualRouterAsn, ips:virtualRouterIps}" -o json
        read_rc=$?

        section "what the operator does: write a BGP connection"
        wrote=false
        if [[ -z "${peer_ip}" ]]; then
          echo "  no worker address, so there is nothing to peer with"
        else
          if as_issued "create a peering to ${peer_ip}" \
               az network routeserver peering create -g "${NET_RG}" \
               --routeserver "${ROUTE_SERVER}" -n bgp-probe-peering \
               --peer-ip "${peer_ip}" --peer-asn 65001 --output none; then
            wrote=true
          fi
        fi

        if (( read_rc == 0 )) && [[ "${wrote}" == true ]]; then
          section "verdict"
          echo "  passthrough is sufficient on this cluster: the principal CCO"
          echo "  hands the operator can both read the Route Server and write"
          echo "  its BGP connections"
          # The teardown removes peerings before the Route Server, so this is
          # left for it rather than removed here.
          exit 0
        fi

        section "could a step repair this itself"
        # Granting the cluster's own principal a role over the group holding
        # the Route Server is the obvious repair, and whether the cluster
        # profile's principal may grant it is the whole question: if it may,
        # an end-to-end job can do this for itself; if it may not, this needs
        # somebody with more rights than any job has.
        sp="${CLUSTER_PROFILE_DIR}/osServicePrincipal.json"
        err="$(mktemp)"
        if ! AZURE_CONFIG_DIR="${profile_cfg}" az login --service-principal \
             --username "$(jq -er .clientId "${sp}")" \
             --password="$(jq -er .clientSecret "${sp}")" \
             --tenant "$(jq -er .tenantId "${sp}")" --output none 2>"${err}"; then
          echo "  could not log in with the cluster profile's principal:"
          redact <"${err}" | sed 's/^/    /'
          rm -f "${err}"; exit 0
        fi
        subscription="$(jq -er .subscriptionId "${sp}")"
        AZURE_CONFIG_DIR="${profile_cfg}" az account set --subscription "${subscription}" 2>/dev/null

        object_id="$(AZURE_CONFIG_DIR="${profile_cfg}" az ad sp show --id "${client_id}" \
          --query id -o tsv 2>"${err}")"
        if [[ -z "${object_id}" ]]; then
          echo "  could not resolve the issued principal in the directory:"
          redact <"${err}" | head -2 | sed 's/^/    /'
          rm -f "${err}"; exit 0
        fi

        if AZURE_CONFIG_DIR="${profile_cfg}" az role assignment create \
             --assignee-object-id "${object_id}" --assignee-principal-type ServicePrincipal \
             --role "Network Contributor" \
             --scope "/subscriptions/${subscription}/resourceGroups/${NET_RG}" \
             --output none 2>"${err}"; then
          echo "  granted Network Contributor over ${NET_RG}"
        else
          echo "  could NOT grant a role, so no step could repair this:"
          redact <"${err}" | head -4 | sed 's/^/    /'
          rm -f "${err}"; exit 0
        fi
        rm -f "${err}"

        # Role assignments are not usable the instant they exist, so the retry
        # distinguishes propagation from a grant that does not help.
        echo "  waiting for the grant to take effect..."
        # Measured three times: usable after about twenty seconds on one
        # run, still refused after two minutes on another, and only on the
        # eighteenth attempt -- six minutes -- on a third. Six was the
        # limit then and the answer arrived on the last attempt, so this
        # allows twelve. Anything built on such a grant has to wait
        # minutes rather than seconds.
        for attempt in $(seq 1 36); do
          sleep 20
          if AZURE_CONFIG_DIR="${issued_cfg}" az network routeserver show \
               -g "${NET_RG}" -n "${ROUTE_SERVER}" --output none 2>/dev/null; then
            echo "  the read works after the grant, on attempt ${attempt}"
            break
          fi
        done

        section "after the grant"
        as_issued "read ${ROUTE_SERVER}" \
          az network routeserver show -g "${NET_RG}" -n "${ROUTE_SERVER}" \
          --query "{asn:virtualRouterAsn, ips:virtualRouterIps}" -o json
        if [[ -n "${peer_ip}" ]]; then
          as_issued "create a peering to ${peer_ip}" \
            az network routeserver peering create -g "${NET_RG}" \
            --routeserver "${ROUTE_SERVER}" -n bgp-probe-peering \
            --peer-ip "${peer_ip}" --peer-asn 65001 --output none
        fi

        section "removing the peering this step made"
        # Azure refuses a second BGP connection to a peer address that
        # already has one, and the operator peers the same router node.
        # Measured: the operator's own peering failed with
        # HubBgpConnectionPeerIpConflict against exactly this one, so
        # proving the write and then leaving it behind denies the thing
        # the run exists to observe.
        # As the cluster profile's principal, which owns this group: the
        # issued one may not be able to delete what it just created, and a
        # bare az here has no account at all -- every login in this step
        # goes into a config directory of its own.
        if AZURE_CONFIG_DIR="${profile_cfg}" az network routeserver peering delete \
             -g "${NET_RG}" --routeserver "${ROUTE_SERVER}" -n bgp-probe-peering \
             --yes --output none 2>"${err}"; then
          echo "  removed, so the operator may peer ${peer_ip} itself"
        else
          echo "  could NOT remove it, and the operator's own peering will"
          echo "  conflict with it:"
          redact <"${err}" | head -3 | sed 's/^/    /'
        fi

        section "verdict"
        echo "  passthrough alone was not sufficient here. Whether the grant"
        echo "  above fixed it is the answer immediately preceding this line,"
        echo "  and it decides whether an end-to-end job can set itself up or"
        echo "  needs a role assigned outside CI."
        exit 0
      from: e2e-runner
      grace_period: 15m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: enable-frr
      cli: latest
      commands: |
        set -euo pipefail

        # Both controllers watch FRRConfiguration and RouteAdvertisements
        # from SetupWithManager, and CNO creates those two CRDs only in
        # response to this patch. Without them the caches never sync, the
        # manager exits after two minutes, and the CSV never installs.
        # The operator applies this same patch itself as the first phase
        # of reconcile, but it cannot stay alive long enough to do so;
        # when that is fixed, this step comes out and the job proves the
        # install a catalogue user actually performs.
        oc patch network.operator.openshift.io cluster --type=merge \
          -p '{"spec":{"additionalRoutingCapabilities":{"providers":["FRR"]},"defaultNetwork":{"ovnKubernetesConfig":{"routeAdvertisements":"Enabled"}}}}'

        deadline=$((SECONDS + 900))

        for crd in frrconfigurations.frrk8s.metallb.io routeadvertisements.k8s.ovn.org; do
          echo "waiting for crd/${crd}..."
          until oc wait --for=condition=Established "crd/${crd}" --timeout=10s >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then
              oc get network.operator.openshift.io cluster -o yaml >&2
              echo "timed out waiting for crd/${crd}" >&2
              exit 1
            fi
            sleep 5
          done
        done

        # The rollout is what says CNO finished rather than that it
        # started. Measured at about two minutes on 4.22.
        echo "waiting for the frr-k8s rollout..."
        until oc -n openshift-frr-k8s rollout status daemonset/frr-k8s --timeout=2m >/dev/null 2>&1; do
          if (( SECONDS >= deadline )); then
            oc -n openshift-frr-k8s get pods >&2
            echo "timed out waiting for the frr-k8s daemonset" >&2
            exit 1
          fi
          sleep 5
        done

        oc -n openshift-frr-k8s get daemonset frr-k8s
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: install
      cli: latest
      commands: |
        set -euo pipefail

        oc create namespace openshift-bgp-cloud-connector --dry-run=client -o yaml | oc apply -f -

        # The CSV supports OwnNamespace and SingleNamespace only. The
        # manager scopes no caches, so it watches cluster-wide either
        # way.
        operator-sdk run bundle -n openshift-bgp-cloud-connector --timeout=10m \
          --security-context-config restricted --install-mode OwnNamespace "${OO_BUNDLE}"

        oc -n openshift-bgp-cloud-connector wait --for=condition=Available \
          deployment/openshift-bgp-cloud-connector-controller-manager --timeout=5m
        oc -n openshift-bgp-cloud-connector get csv
      dependencies:
      - env: OO_BUNDLE
        name: bgp-cloud-connector-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
