build_root:
  project_image:
    dockerfile_literal: FROM quay.io/konveyor/builder:ubi9-v1.26
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile.ubi
    to: velero-plugin-for-gcp-oadp-1.5
promotion:
  to:
  - name: velero-plugin-for-gcp
    namespace: konveyor
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: oadp-1.5
  org: openshift
  repo: velero-plugin-for-gcp
