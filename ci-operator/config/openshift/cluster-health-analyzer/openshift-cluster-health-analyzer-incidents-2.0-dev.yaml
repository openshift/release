base_images:
  monitoring-console-plugin:
    name: "4.22"
    namespace: ocp
    tag: monitoring-console-plugin
  monitoring-plugin:
    name: "4.22"
    namespace: ocp
    tag: monitoring-plugin
  monitoring-ui-tests-runner:
    name: "4.22"
    namespace: ocp
    tag: monitoring-ui-tests-runner
  observability-bundle:
    name: observability-bundle
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-4.23
images:
  items:
  - dockerfile_path: Dockerfile
    to: cluster-health-analyzer
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: |
    GOFLAGS="-mod=readonly" GOLANGCI_LINT_CACHE=/tmp/golangci-cache make lint
  container:
    from: src
- as: unit
  commands: |
    GOFLAGS="-mod=readonly" make test
  container:
    from: src
- always_run: true
  as: e2e-integration
  cluster_claim:
    architecture: amd64
    cloud: aws
    labels:
      region: us-east-1
    owner: obs
    product: ocp
    timeout: 1h0m0s
    version: "4.21"
  optional: true
  reporter_config:
    channel: '#cluster-health-analyzer-qe-ci'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :x: Job
      *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  steps:
    test:
    - ref: cluster-health-analyzer
    workflow: generic-claim
- as: e2e-integration-long
  cluster_claim:
    architecture: amd64
    cloud: aws
    labels:
      region: us-east-1
    owner: obs
    product: ocp
    timeout: 1h0m0s
    version: "4.21"
  cron: 0 2 * * 1
  disable_rehearsal: true
  reporter_config:
    channel: '#cluster-health-analyzer-qe-ci'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :x: Job
      *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  steps:
    test:
    - as: cluster-health-analyzer-long
      cli: latest
      commands: |
        make test-integration-long
      dependencies:
      - env: CHA_IMAGE
        name: cluster-health-analyzer
      from: src
      grace_period: 10m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 3h0m0s
    workflow: generic-claim
  timeout: 5h0m0s
- always_run: false
  as: e2e-incidents-ui
  cluster_claim:
    architecture: amd64
    cloud: aws
    labels:
      region: us-east-1
    owner: obs
    product: ocp
    timeout: 2h0m0s
    version: "4.21"
  optional: true
  steps:
    test:
    - ref: monitoring-plugin-tests-incidents-ui-custom-cha
    workflow: generic-claim
zz_generated_metadata:
  branch: incidents-2.0-dev
  org: openshift
  repo: cluster-health-analyzer
