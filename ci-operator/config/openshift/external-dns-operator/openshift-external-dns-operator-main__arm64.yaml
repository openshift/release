base_images:
  operator-sdk:
    name: "4.17"
    namespace: origin
    tag: operator-sdk
build_root:
  from_repository: true
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile
    to: external-dns-operator
  skip_if_only_changed: ^renovate\.json$
operator:
  bundles:
  - as: external-dns-operator-bundle
    capabilities:
    - arm64
    dockerfile_path: Dockerfile.bundle
    skip_building_index: true
    skip_if_only_changed: ^renovate\.json$
  substitutions:
  - pullspec: quay.io/openshift/origin-external-dns-operator:latest
    with: pipeline:external-dns-operator
releases:
  arm64-initial:
    candidate:
      architecture: arm64
      product: ocp
      stream: nightly
      version: "4.21"
  initial:
    integration:
      name: "4.21"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.21"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: e2e-aws-operator
  capabilities:
  - arm64
  pipeline_skip_if_only_changed: ^docs/|^\.tekton/|^catalog/|^bundle-hack/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$|^renovate\.json$
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: release:arm64-initial
    env:
      COMPUTE_NODE_TYPE: m6g.xlarge
      OCP_ARCH: arm64
    test:
    - as: install
      cli: latest
      commands: |
        oc create ns external-dns-operator
        operator-sdk run bundle --timeout=10m -n external-dns-operator --security-context-config restricted "$OO_BUNDLE"
        oc wait --for condition=Available -n external-dns-operator deployment/external-dns-operator
      dependencies:
      - env: OO_BUNDLE
        name: external-dns-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: openshift
  repo: external-dns-operator
  variant: arm64
