build_root:
  project_image:
    dockerfile_literal: FROM quay.io/konveyor/builder:ubi9-v1.26
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile.ubi
    to: velero-plugin-for-legacy-aws
promotion:
  to:
  - name: velero-plugin-for-legacy-aws
    namespace: konveyor
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit-test
  optional: true
  steps:
    test:
    - as: unit
      commands: go mod vendor && go test -v ./...
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
zz_generated_metadata:
  branch: oadp-dev
  org: openshift
  repo: velero-plugin-for-legacy-aws
