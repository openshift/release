prowgen:
  expose: true
  private: true
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "5.1"
  ppc64le-latest:
    candidate:
      architecture: ppc64le
      product: ocp
      stream: nightly
      version: "5.1"
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 1Gi
tests:
- as: compliance-e2e-tests-ipi-powervc-ppc64le
  capabilities:
  - intranet
  cron: '@yearly'
  steps:
    cluster_profile: cluster_profile_placeholder  
    env:
      ARCH: ppc64le
      BRANCH: "5.1"
      FORCE_SUCCESS_EXIT: "true"
      INSTALLER: powervc
      COMPLIANCE_TEST_VERSION: "0.10.0"
      CATALOG_SOURCE_NAME: compliance-operator
      FILTERS_ADDITIONAL: ""
      TEST_FILTERS: ~HyperShiftMGMT&;~DEPRECATED&;~Disruptive&
      TEST_PARALLEL: "3"
      TEST_SCENARIOS: Compliance_Operator
      TEST_TIMEOUT: "20"
    test:
    - ref: cucushift-installer-rehearse-deploy-nfs-provisioner
    - ref: file-integrity-konflux-catalogsource
    - ref: install-operators
    - ref: etcd-encryption
    - ref: openshift-extended-test
    - ref: openshift-e2e-test-qe-report
    workflow: ipi-powervc-compliance
zz_generated_metadata:
  branch: release-5.1
  org: openshift
  repo: openshift-tests-private
  variant: powervc-ipi-stable-compliance-0.10.0
