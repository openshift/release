base_images:
  upi-installer:
    name: "5.0"
    namespace: ocp
    tag: upi-installer
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    to: vcf-migration-operator
  - dockerfile_literal: |
      FROM quay.io/operator-framework/operator-sdk:v1.42.0 as osdk
      FROM src
      COPY --from=osdk /usr/local/bin/operator-sdk /usr/local/bin/
    from: src
    to: operator-sdk-vcf
  skip_if_only_changed: (^docs/)|((^|/)OWNERS(_ALIASES)?$)|\.md$|((^|/)\.github/)|((^|/)\.tekton/)|(^renovate\.json$)|(^bundle\.konflux\.Dockerfile$)
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      cpu: "2"
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-vsphere-vcf-migration
  cron: 0 0 1 9 *
  reporter_config:
    channel: '#forum-ocp-splat-alerts'
    job_states_to_report:
    - failure
    - error
    report_template: |
      :red_jenkins_circle: :vsphere: Periodical job *{{.Spec.Job}}* ended with *{{.Status.State}}*. (<{{.Status.URL}}|View logs>) (<https://prow.ci.openshift.org/job-history/gs/test-platform-results-public/logs/{{.Spec.Job}}|View history>)
  steps:
    cluster_profile: vsphere-elastic
    dependencies:
      VCF_MIGRATION_OPERATOR_IMAGE: pipeline:vcf-migration-operator
    env:
      CSI_MANAGEMENT_REMOVED: "true"
      FEATURE_GATES: '["VSphereMultiVCenterDay2=true"]'
      FEATURE_SET: CustomNoUpgrade
      PERSISTENT_MONITORING: "false"
      SETUP_IMAGE_REGISTRY_WITH_PVC: "false"
    workflow: vcf-migration-e2e
- as: e2e-vsphere-vcf-migration-compact
  cron: 0 0 5 9 *
  reporter_config:
    channel: '#forum-ocp-splat-alerts'
    job_states_to_report:
    - failure
    - error
    report_template: |
      :red_jenkins_circle: :vsphere: Periodical job *{{.Spec.Job}}* (compact cluster) ended with *{{.Status.State}}*. (<{{.Status.URL}}|View logs>) (<https://prow.ci.openshift.org/job-history/gs/test-platform-results-public/logs/{{.Spec.Job}}|View history>)
  steps:
    cluster_profile: vsphere-elastic
    dependencies:
      VCF_MIGRATION_OPERATOR_IMAGE: pipeline:vcf-migration-operator
    env:
      CSI_MANAGEMENT_REMOVED: "true"
      FEATURE_GATES: '["VSphereMultiVCenterDay2=true"]'
      FEATURE_SET: CustomNoUpgrade
      PERSISTENT_MONITORING: "false"
      POOLS: vcenter.ci.ibmc.devcluster.openshift.com-cidatacenter-cicluster vcenter-1.ci.ibmc.devcluster.openshift.com-cidatacenter-2-cicluster-3
      SETUP_IMAGE_REGISTRY_WITH_PVC: "false"
    post:
    - chain: gather-network
    - chain: gather-core-dump
    - chain: ipi-vsphere-post
    pre:
    - chain: vcf-migration-pre-compact
    test:
    - ref: vcf-migration-deploy
    - ref: vcf-migration-execute
    - ref: vcf-migration-verify
zz_generated_metadata:
  branch: main
  org: openshift
  repo: vcf-migration-operator
  variant: "5.0"
