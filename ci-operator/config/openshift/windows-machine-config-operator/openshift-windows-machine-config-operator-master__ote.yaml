binary_build_commands: make build
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: build/Dockerfile.ci
    to: windows-machine-config-operator-test
  skip_if_only_changed: ^(?:ote|docs|\.github|\.tekton)/|\.md$|^(?:\.gitignore|renovate\.json|OWNERS|PROJECT|LICENSE|Containerfile|Containerfile.bundle)$
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 400Mi
  src:
    limits:
      memory: 10Gi
    requests:
      cpu: 100m
      memory: 10Gi
  windows-machine-config-operator-test:
    limits:
      memory: 10Gi
    requests:
      cpu: 100m
      memory: 10Gi
tests:
- always_run: false
  as: aws-e2e-ote
  optional: true
  pipeline_run_if_changed: ^ote/
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      EXTENSION_IMAGE: windows-machine-config-operator-test
    env:
      COMPUTE_NODE_REPLICAS: "1"
      CONTROL_PLANE_REPLICAS: "1"
      EXTENSION_BINARY_PATH: /usr/bin/wmco-tests-ext.gz
      EXTENSION_COMPONENT_NAME: windows-machine-config-operator
      TEST_ARGS: --monitor=e2e-test-analyzer
      TEST_SKIPS: \[node-proxy\]|\[tls-adherence\]
      TEST_SUITE: windows-machine-config-operator/all
    test:
    - as: wmco-setup-and-test
      cli: latest
      commands: |
        export AWS_SHARED_CREDENTIALS_FILE=${CLUSTER_PROFILE_DIR}/.awscred
        export KUBE_SSH_KEY_PATH=${CLUSTER_PROFILE_DIR}/ssh-privatekey
        hack/run-ci-e2e-test.sh -t setup-only -s
      dependencies:
      - env: OPERATOR_IMAGE
        name: windows-machine-config-operator-test
      from: windows-machine-config-operator-test
      resources:
        requests:
          cpu: 1000m
          memory: 400Mi
      timeout: 2h15m0s
    - ref: openshift-tests-extension-setup-out-of-payload
    - ref: openshift-e2e-test
    workflow: ipi-aws-ovn-hybrid
- always_run: false
  as: aws-e2e-ote-tls
  optional: true
  pipeline_run_if_changed: ^ote/
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      EXTENSION_IMAGE: windows-machine-config-operator-test
    env:
      COMPUTE_NODE_REPLICAS: "1"
      CONTROL_PLANE_REPLICAS: "3"
      EXTENSION_BINARY_PATH: /usr/bin/wmco-tests-ext.gz
      EXTENSION_COMPONENT_NAME: windows-machine-config-operator
      TEST_ARGS: --monitor=e2e-test-analyzer
      TEST_SKIPS: \[node-proxy\]
      TEST_SUITE: windows-machine-config-operator/all
    test:
    - as: enable-tls-adherence
      cli: latest
      commands: |
        set -euo pipefail

        kas_resource=kubeapiserver.operator.openshift.io/cluster
        kas_namespace=openshift-kube-apiserver
        poll_seconds=15
        observe_attempts=60
        rollout_timeout_seconds=1800
        stable_seconds=300
        latest_revision=""

        revision_has_tls_adherence() {
          local revision=$1 config
          if ! config=$(oc --request-timeout=10s -n "${kas_namespace}" \
               get configmap "config-${revision}" -o jsonpath='{.data.config\.yaml}' 2>/dev/null); then
            return 1
          fi
          grep -Fq '"TLSAdherence=true"' <<< "${config}" \
            && ! grep -Fq '"TLSAdherence=false"' <<< "${config}"
        }

        operator_observed_tls_adherence() {
          local observed_feature_gates
          if ! observed_feature_gates=$(oc --request-timeout=10s get "${kas_resource}" \
               -o jsonpath='{range .spec.observedConfig.apiServerArguments.feature-gates[*]}{@}{"\n"}{end}' \
               2>/dev/null); then
            return 1
          fi
          grep -Fxq 'TLSAdherence=true' <<< "${observed_feature_gates}" \
            && ! grep -Fxq 'TLSAdherence=false' <<< "${observed_feature_gates}"
        }

        pod_revisions_are_current() {
          local pod_revisions revision current_revision target_revision index
          local pod_count=0
          local -a revision_lines

          if ! pod_revisions=$(oc --request-timeout=10s get "${kas_resource}" \
               -o jsonpath='{.status.latestAvailableRevision}{"\n"}{range .status.nodeStatuses[*]}{.currentRevision}{"|"}{.targetRevision}{"\n"}{end}' \
               2>/dev/null); then
            return 1
          fi
          mapfile -t revision_lines <<< "${pod_revisions}"
          revision=${revision_lines[0]:-}
          [[ "${revision}" =~ ^[1-9][0-9]*$ ]] || return 1

          for ((index = 1; index < ${#revision_lines[@]}; index++)); do
            IFS='|' read -r current_revision target_revision <<< "${revision_lines[$index]}"
            [[ "${current_revision}" == "${revision}" ]] || return 1
            [[ "${target_revision}" == 0 ]] || return 1
            ((pod_count += 1))
          done
          (( pod_count > 0 ))
        }

        kube_apiserver_operator_condition_status() {
          local condition_type=$1 conditions
          if ! conditions=$(oc --request-timeout=10s get "${kas_resource}" \
               -o jsonpath='{range .status.conditions[*]}{.type}{"="}{.status}{"\n"}{end}' \
               2>/dev/null); then
            echo Unknown
          elif grep -Fxq "${condition_type}=True" <<< "${conditions}"; then
            echo True
          elif grep -Fxq "${condition_type}=False" <<< "${conditions}"; then
            echo False
          else
            echo Unknown
          fi
        }

        clusteroperator_condition_status() {
          local condition_type=$1 conditions
          if ! conditions=$(oc --request-timeout=10s get clusteroperator kube-apiserver \
               -o jsonpath='{range .status.conditions[*]}{.type}{"="}{.status}{"\n"}{end}' \
               2>/dev/null); then
            echo Unknown
          elif grep -Fxq "${condition_type}=True" <<< "${conditions}"; then
            echo True
          elif grep -Fxq "${condition_type}=False" <<< "${conditions}"; then
            echo False
          else
            echo Unknown
          fi
        }

        dump_diagnostics() {
          local raw_value feature_set=Unknown adherence=Unknown diagnostic_revision=Unknown
          local tls_adherence_enabled=false observed_gate=false revision_gate=false
          local pod_revisions_current=false api_ready=false

          if raw_value=$(oc --request-timeout=10s get featuregate cluster \
               -o jsonpath='{.spec.featureSet}' 2>/dev/null); then
            case "${raw_value}" in
              ""|Default) feature_set=Default ;;
              CustomNoUpgrade|TechPreviewNoUpgrade|DevPreviewNoUpgrade) feature_set=${raw_value} ;;
            esac
          fi
          if raw_value=$(oc --request-timeout=10s get apiserver cluster \
               -o jsonpath='{.spec.tlsAdherence}' 2>/dev/null); then
            case "${raw_value}" in
              "") adherence=Unset ;;
              StrictAllComponents|LegacyAdheringComponentsOnly) adherence=${raw_value} ;;
            esac
          fi
          if raw_value=$(oc --request-timeout=10s get "${kas_resource}" \
               -o jsonpath='{.status.latestAvailableRevision}' 2>/dev/null) \
            && [[ "${raw_value}" =~ ^[1-9][0-9]*$ ]]; then
            diagnostic_revision=${raw_value}
          fi
          if operator_observed_tls_adherence; then
            tls_adherence_enabled=true
            observed_gate=true
          fi
          if [[ "${diagnostic_revision}" =~ ^[1-9][0-9]*$ ]] \
            && revision_has_tls_adherence "${diagnostic_revision}"; then
            revision_gate=true
          fi
          if pod_revisions_are_current; then
            pod_revisions_current=true
          fi
          if oc --request-timeout=10s get --raw=/readyz >/dev/null 2>&1; then
            api_ready=true
          fi

          echo "--- TLS adherence rollout diagnostics (allowlisted fields only) ---"
          echo "feature_set=${feature_set}"
          echo "tls_adherence_enabled=${tls_adherence_enabled}"
          echo "tls_adherence=${adherence}"
          echo "latest_revision=${diagnostic_revision}"
          echo "observed_gate=${observed_gate}"
          echo "revision_gate=${revision_gate}"
          echo "pod_revisions_current=${pod_revisions_current}"
          echo "kube_apiserver_operator.StaticPodsAvailable=$(kube_apiserver_operator_condition_status StaticPodsAvailable)"
          echo "kube_apiserver_operator.NodeInstallerProgressing=$(kube_apiserver_operator_condition_status NodeInstallerProgressing)"
          echo "kube_apiserver_operator.NodeControllerDegraded=$(kube_apiserver_operator_condition_status NodeControllerDegraded)"
          echo "clusteroperator_kube_apiserver.Available=$(clusteroperator_condition_status Available)"
          echo "clusteroperator_kube_apiserver.Progressing=$(clusteroperator_condition_status Progressing)"
          echo "clusteroperator_kube_apiserver.Degraded=$(clusteroperator_condition_status Degraded)"
          echo "api_ready=${api_ready}"
        }

        rollout_and_health_are_stable() {
          local operator_state kas_conditions co_conditions node_count=0
          local node_name current_revision target_revision index
          local -a state_lines

          if ! operator_state=$(oc --request-timeout=10s get "${kas_resource}" -o jsonpath='{.status.latestAvailableRevision}{"\n"}{range .status.nodeStatuses[*]}{.nodeName}{"|"}{.currentRevision}{"|"}{.targetRevision}{"\n"}{end}' 2>/dev/null); then
            return 1
          fi
          mapfile -t state_lines <<< "${operator_state}"
          latest_revision=${state_lines[0]:-}
          [[ "${latest_revision}" =~ ^[1-9][0-9]*$ ]] || return 1

          if [[ "${baseline_is_noop}" != true ]] && (( latest_revision <= baseline_revision )); then
            return 1
          fi
          revision_has_tls_adherence "${latest_revision}" || return 1

          for ((index = 1; index < ${#state_lines[@]}; index++)); do
            IFS='|' read -r node_name current_revision target_revision <<< "${state_lines[$index]}"
            [[ -n "${node_name}" && "${current_revision}" =~ ^[1-9][0-9]*$ ]] || return 1
            [[ "${current_revision}" == "${latest_revision}" ]] || return 1
            [[ "${target_revision}" == 0 ]] || return 1
            ((node_count += 1))
          done
          (( node_count > 0 )) || return 1

          if ! kas_conditions=$(oc --request-timeout=10s get "${kas_resource}" -o jsonpath='{range .status.conditions[*]}{.type}{"="}{.status}{"\n"}{end}' 2>/dev/null); then
            return 1
          fi
          grep -Fxq 'StaticPodsAvailable=True' <<< "${kas_conditions}" || return 1
          grep -Fxq 'NodeInstallerProgressing=False' <<< "${kas_conditions}" || return 1
          grep -Fxq 'NodeControllerDegraded=False' <<< "${kas_conditions}" || return 1

          if ! co_conditions=$(oc --request-timeout=10s get clusteroperator kube-apiserver -o jsonpath='{range .status.conditions[*]}{.type}{"="}{.status}{"\n"}{end}' 2>/dev/null); then
            return 1
          fi
          grep -Fxq 'Available=True' <<< "${co_conditions}" || return 1
          grep -Fxq 'Progressing=False' <<< "${co_conditions}" || return 1
          grep -Fxq 'Degraded=False' <<< "${co_conditions}" || return 1

          oc --request-timeout=10s get --raw=/readyz >/dev/null 2>&1
        }

        if ! baseline_revision=$(oc --request-timeout=10s get "${kas_resource}" \
             -o jsonpath='{.status.latestAvailableRevision}' 2>/dev/null); then
          echo "ERROR: cannot read the baseline kube-apiserver revision"
          dump_diagnostics
          exit 1
        fi
        if [[ ! "${baseline_revision}" =~ ^[1-9][0-9]*$ ]]; then
          echo "ERROR: invalid baseline kube-apiserver revision"
          dump_diagnostics
          exit 1
        fi

        if ! baseline_config=$(oc --request-timeout=10s -n "${kas_namespace}" \
             get configmap "config-${baseline_revision}" -o jsonpath='{.data.config\.yaml}' \
             2>/dev/null); then
          echo "ERROR: cannot read baseline kube-apiserver config revision ${baseline_revision}"
          dump_diagnostics
          exit 1
        fi
        if [[ -z "${baseline_config}" ]]; then
          echo "ERROR: baseline kube-apiserver config revision ${baseline_revision} has no config.yaml payload"
          dump_diagnostics
          exit 1
        fi
        if ! baseline_adherence=$(oc --request-timeout=10s get apiserver cluster \
            -o jsonpath='{.spec.tlsAdherence}' 2>/dev/null) \
          || ! baseline_observed_feature_gates=$(oc --request-timeout=10s get "${kas_resource}" \
            -o jsonpath='{range .spec.observedConfig.apiServerArguments.feature-gates[*]}{@}{"\n"}{end}' \
            2>/dev/null); then
          echo "ERROR: cannot read the pre-patch TLS adherence state"
          dump_diagnostics
          exit 1
        fi

        baseline_is_noop=false
        if [[ "${baseline_adherence}" == StrictAllComponents ]] \
          && grep -Fxq 'TLSAdherence=true' <<< "${baseline_observed_feature_gates}" \
          && ! grep -Fxq 'TLSAdherence=false' <<< "${baseline_observed_feature_gates}" \
          && grep -Fq '"TLSAdherence=true"' <<< "${baseline_config}" \
          && ! grep -Fq '"TLSAdherence=false"' <<< "${baseline_config}"; then
          baseline_is_noop=true
        fi
        echo "Baseline kube-apiserver revision: ${baseline_revision}; exact desired state already active: ${baseline_is_noop}"

        if ! grep -Fq '"TLSAdherence=true"' <<< "${baseline_config}" \
          || grep -Fq '"TLSAdherence=false"' <<< "${baseline_config}" \
          || ! grep -Fxq 'TLSAdherence=true' <<< "${baseline_observed_feature_gates}" \
          || grep -Fxq 'TLSAdherence=false' <<< "${baseline_observed_feature_gates}"; then
          echo "ERROR: the baseline kube-apiserver payload does not enable TLSAdherence"
          dump_diagnostics
          exit 1
        fi

        echo "Setting tlsAdherence=StrictAllComponents (retry until the API accepts the field)..."
        ok=false
        for i in $(seq 1 60); do
          if oc --request-timeout=10s patch apiserver cluster --type=merge \
               -p '{"spec":{"tlsAdherence":"StrictAllComponents"}}' >/dev/null 2>&1 \
             && [ "$(oc --request-timeout=10s get apiserver cluster -o jsonpath='{.spec.tlsAdherence}' 2>/dev/null)" = "StrictAllComponents" ]; then
            ok=true; echo "tlsAdherence=StrictAllComponents accepted (iteration $i)"; break
          fi
          echo "  waiting for apiserver schema/gate (i=$i)..."; sleep "${poll_seconds}"
        done
        if [[ "${ok}" != true ]]; then
          echo "ERROR: tlsAdherence never accepted StrictAllComponents"
          dump_diagnostics
          exit 1
        fi

        echo "Waiting for the kube-apiserver operator to observe TLSAdherence=true..."
        observed=false
        for i in $(seq 1 "${observe_attempts}"); do
          if operator_observed_tls_adherence; then
            observed=true
            echo "kube-apiserver operator observed TLSAdherence=true (iteration $i)"
            break
          fi
          echo "  waiting for kube-apiserver observed configuration (i=$i/${observe_attempts})..."
          sleep "${poll_seconds}"
        done
        if [[ "${observed}" != true ]]; then
          echo "ERROR: kube-apiserver operator did not observe TLSAdherence=true"
          dump_diagnostics
          exit 1
        fi

        echo "Waiting for the TLS-enabled revision to finish and remain healthy for ${stable_seconds}s..."
        deadline=$(( $(date +%s) + rollout_timeout_seconds ))
        stable_since=0
        stable_revision=""
        stable_complete=false
        while (( $(date +%s) < deadline )); do
          if rollout_and_health_are_stable; then
            now=$(date +%s)
            if (( stable_since == 0 )) || [[ "${stable_revision}" != "${latest_revision}" ]]; then
              stable_since=${now}
              stable_revision=${latest_revision}
              echo "  rollout is complete at revision ${latest_revision}; starting sustained health window"
            fi
            stable_for=$(( now - stable_since ))
            echo "  revision ${latest_revision} and API healthy for ${stable_for}/${stable_seconds}s"
            if (( stable_for >= stable_seconds )); then
              stable_complete=true
              break
            fi
          else
            if (( stable_since != 0 )); then
              echo "  rollout/API health changed; resetting sustained health window"
            fi
            stable_since=0
            stable_revision=""
          fi
          sleep "${poll_seconds}"
        done
        if [[ "${stable_complete}" != true ]]; then
          echo "ERROR: kube-apiserver rollout did not reach sustained health before timeout"
          dump_diagnostics
          exit 1
        fi

        if ! adherence=$(oc --request-timeout=10s get apiserver cluster \
            -o jsonpath='{.spec.tlsAdherence}' 2>/dev/null); then
          echo "ERROR: failed to read final TLS adherence settings"
          dump_diagnostics
          exit 1
        fi
        if [[ "${adherence}" != StrictAllComponents ]] \
          || ! operator_observed_tls_adherence; then
          echo "ERROR: final TLS adherence settings do not match the requested configuration"
          dump_diagnostics
          exit 1
        fi
        echo "Waiting for the cluster to stabilize..."
        if ! oc adm wait-for-stable-cluster --timeout=30m >/dev/null 2>&1; then
          echo "ERROR: cluster did not stabilize after TLS adherence configuration"
          dump_diagnostics
          exit 1
        fi
        echo "TLSAdherence enabled; kube-apiserver revision ${latest_revision} is rolled out and sustainably healthy."
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 100Mi
    - as: wmco-setup-and-test
      cli: latest
      commands: |
        export AWS_SHARED_CREDENTIALS_FILE=${CLUSTER_PROFILE_DIR}/.awscred
        export KUBE_SSH_KEY_PATH=${CLUSTER_PROFILE_DIR}/ssh-privatekey
        hack/run-ci-e2e-test.sh -t setup-only -s
      dependencies:
      - env: OPERATOR_IMAGE
        name: windows-machine-config-operator-test
      from: windows-machine-config-operator-test
      resources:
        requests:
          cpu: 1000m
          memory: 400Mi
      timeout: 2h15m0s
    - ref: openshift-tests-extension-setup-out-of-payload
    - ref: openshift-e2e-test
    workflow: ipi-aws-ovn-hybrid
- always_run: false
  as: vsphere-proxy-e2e-ote
  optional: true
  run_if_changed: ^ote/
  steps:
    cluster_profile: vsphere-elastic
    dependencies:
      EXTENSION_IMAGE: windows-machine-config-operator-test
    env:
      EXTENSION_BINARY_PATH: /usr/bin/wmco-tests-ext.gz
      EXTENSION_COMPONENT_NAME: windows-machine-config-operator
      TEST_ARGS: --monitor=e2e-test-analyzer
      TEST_SUITE: windows-machine-config-operator/proxy
    test:
    - as: wmco-setup
      cli: latest
      commands: |
        export KUBE_SSH_KEY_PATH=${CLUSTER_PROFILE_DIR}/ssh-privatekey
        hack/run-ci-e2e-test.sh -t setup-only -s
      dependencies:
      - env: OPERATOR_IMAGE
        name: windows-machine-config-operator-test
      from: windows-machine-config-operator-test
      resources:
        requests:
          cpu: 1000m
          memory: 400Mi
      timeout: 2h15m0s
    - ref: openshift-tests-extension-setup-out-of-payload
    - ref: openshift-e2e-test
    workflow: ipi-vsphere-ovn-hybrid-custom-vxlan-port-proxy
- always_run: false
  as: nutanix-e2e-ote
  cluster: build01
  optional: true
  run_if_changed: ^ote/
  steps:
    cluster_profile: nutanix
    dependencies:
      EXTENSION_IMAGE: windows-machine-config-operator-test
    env:
      EXTENSION_BINARY_PATH: /usr/bin/wmco-tests-ext.gz
      EXTENSION_COMPONENT_NAME: windows-machine-config-operator
      TEST_ARGS: --monitor=e2e-test-analyzer
      TEST_SKIPS: \[node-proxy\]|\[tls-adherence\]
      TEST_SUITE: windows-machine-config-operator/all
    test:
    - as: wmco-setup
      cli: latest
      commands: |
        export KUBE_SSH_KEY_PATH=${CLUSTER_PROFILE_DIR}/ssh-privatekey
        oc patch configs.imageregistry.operator.openshift.io cluster --type merge --patch '{"spec":{"managementState":"Managed","storage":{"emptyDir":{}}}}'
        hack/run-ci-e2e-test.sh -t setup-only -s
      dependencies:
      - env: OPERATOR_IMAGE
        name: windows-machine-config-operator-test
      from: windows-machine-config-operator-test
      resources:
        requests:
          cpu: 1000m
          memory: 400Mi
      timeout: 2h15m0s
    - ref: openshift-tests-extension-setup-out-of-payload
    - ref: openshift-e2e-test
    workflow: ipi-nutanix-ovn-hybrid
zz_generated_metadata:
  branch: master
  org: openshift
  repo: windows-machine-config-operator
  variant: ote
