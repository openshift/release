base_images:
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_literal: |
      FROM builder AS compile
      RUN CGO_ENABLED=0 GOFLAGS="-mod=mod" go test ./test/e2e -v -c --tags=osde2e -o /usr/local/bin/e2e.test
      FROM runtime
      COPY --from=compile /usr/local/bin/e2e.test /usr/local/bin/e2e.test
    inputs:
      rosa-aws-cli:
        as:
        - runtime
      src:
        as:
        - builder
    to: operator-e2e
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "4.22"
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  secret:
    collection: sd-sre-secrets
    group: configuration-anomaly-detection-codecov-token
    mount_path: /tmp/secret
  skip_if_only_changed: ^(?:\.tekton|\.github)|\.md$|^(?:\.gitignore|OWNERS|LICENSE)$
- as: publish-coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  postsubmit: true
  secret:
    collection: sd-sre-secrets
    group: configuration-anomaly-detection-codecov-token
    mount_path: /tmp/secret
- as: lint
  commands: make lint
  container:
    from: src
  skip_if_only_changed: ^(?:\.tekton|\.github)|\.md$|^(?:\.gitignore|OWNERS|LICENSE)$
- as: test
  commands: make test
  container:
    from: src
  skip_if_only_changed: ^(?:\.tekton|\.github)|\.md$|^(?:\.gitignore|OWNERS|LICENSE)$
- as: validate
  commands: make validate
  container:
    from: src
  skip_if_only_changed: ^(?:\.tekton|\.github)|\.md$|^(?:\.gitignore|OWNERS|LICENSE)$
- as: e2e-binary-build-success
  commands: |
    CGO_ENABLED=0 GOFLAGS="-mod=mod" go test ./test/e2e -v -c --tags=osde2e -o /dev/null
  container:
    from: src
  skip_if_only_changed: ^(?:\.tekton|\.github)|\.md$|^(?:\.gitignore|OWNERS|LICENSE)$
- as: rosa-stage-e2e
  cron: 0 0 31 2 *
  presubmit: true
  reporter_config:
    channel: '#rosa-prow-info'
    job_states_to_report:
    - success
    - failure
    - error
    report_presubmit: true
    report_template: '{{- if eq .Status.State "success" -}} :green_jenkins_circle:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{- else -}} :red_jenkins_circle: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs> {{- end}}'
  run_if_changed: ^(cmd|pkg|test/e2e)/
  steps:
    cluster_profile: rosa-e2e-01
    env:
      LEASE_ENV: staging
      OCM_LOGIN_ENV: staging
    post:
    - ref: rosa-cluster-lease-checkin
    test:
    - ref: rosa-cad-e2e
    workflow: rosa-cluster-lease-cli-e2e
zz_generated_metadata:
  branch: main
  org: openshift
  repo: configuration-anomaly-detection
