binary_build_commands: make build
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-5.0
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 2Gi
tests:
- as: generate
  commands: GOFLAGS="-mod=readonly" GOMODCACHE=/tmp/gomodcache make manifests && git
    diff --exit-code
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
- as: api-lint
  commands: GOFLAGS="-mod=mod" GOMODCACHE=/tmp/gomodcache GOLANGCI_LINT_CACHE=/tmp/.cache
    make api-lint
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
- as: unit
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    GOFLAGS="-mod=readonly" GOMODCACHE=/tmp/gomodcache make test
  container:
    from: src
  secret:
    collection: openshift-lightspeed-service-creds
    group: ols-codecov-token-lightspeed-agentic-operator
    mount_path: /tmp/secret
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
- as: unit-arm64
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    GOFLAGS="-mod=readonly" GOMODCACHE=/tmp/gomodcache make test
  container:
    from: src
  node_architecture: arm64
  optional: true
  secret:
    collection: openshift-lightspeed-service-creds
    group: ols-codecov-token-lightspeed-agentic-operator
    mount_path: /tmp/secret
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
zz_generated_metadata:
  branch: main
  org: openshift
  repo: lightspeed-agentic-operator
