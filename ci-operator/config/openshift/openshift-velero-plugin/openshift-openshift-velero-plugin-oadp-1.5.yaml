build_root:
  project_image:
    dockerfile_literal: FROM quay.io/konveyor/builder:ubi9-v1.26
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile
    to: openshift-velero-plugin-oadp-1.5
promotion:
  to:
  - name: openshift-velero-plugin
    namespace: konveyor
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit-test
  steps:
    test:
    - as: unit
      commands: GOFLAGS="-mod=mod" make test
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
zz_generated_metadata:
  branch: oadp-1.5
  org: openshift
  repo: openshift-velero-plugin
