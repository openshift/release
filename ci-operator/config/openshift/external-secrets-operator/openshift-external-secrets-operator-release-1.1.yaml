base_images:
  base-rhel9:
    name: "4.21"
    namespace: ocp
    tag: base-rhel9
  cli-jq:
    name: cli-jq
    namespace: ocp
    tag: latest
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
binary_build_commands: make build
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: images/ci/Dockerfile
    from: base-rhel9
    to: external-secrets-operator
  - dockerfile_path: images/ci/operand.Dockerfile
    from: base-rhel9
    to: external-secrets
operator:
  bundles:
  - as: external-secrets-operator-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: openshift.io/external-secrets-operator:latest
    with: pipeline:external-secrets-operator
  - pullspec: oci.external-secrets.io/external-secrets/external-secrets:.*
    with: pipeline:external-secrets
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.21"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify
  commands: |
    make verify -k
  container:
    from: src
- as: unit
  commands: |
    make test
  container:
    from: src
- as: fips-image-scan-operator
  steps:
    dependencies:
      SCAN_IMAGE: external-secrets-operator
    test:
    - ref: fips-check-image-scan
- as: fips-image-scan-external-secrets
  steps:
    dependencies:
      SCAN_IMAGE: external-secrets
    test:
    - ref: fips-check-image-scan
- as: e2e-operator
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.21"
  skip_if_only_changed: ^(docs/|bundle/|tools/)|\.md$|^(?:.*/)?(?:\.gitignore|.dockerignore|.golangci.yml|Makefile|OWNERS|PROJECT|LICENSE)$
  steps:
    test:
    - ref: merge-stage-registry-credentials
    - as: install
      cli: latest
      commands: |
        oc create namespace external-secrets-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n external-secrets-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n external-secrets-operator deployment external-secrets-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: external-secrets-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        E2E_GINKGO_LABEL_FILTER='"Platform: isSubsetOf {AWS} && !TechPreview"' make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- as: e2e-art-aws-operator-test
  cron: '@weekly'
  steps:
    cluster_profile: openshift-org-aws
    dependency_overrides:
      OO_INDEX: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc:external-secrets-1.1__v4.21__external-secrets-operator-rhel9 
    env:
      OO_CHANNEL: stable-v1
      OO_INSTALL_NAMESPACE: external-secrets-operator
      OO_PACKAGE: openshift-external-secrets-operator
      OO_TARGET_NAMESPACES: '!all'
    test:
    - as: setup-konflux-image-access
      cli: latest
      commands: |
        oc extract secret/pull-secret -n openshift-config --confirm --to /tmp
        jq -s '.[0].auths += .[1].auths | .[0]' /tmp/.dockerconfigjson /var/run/secrets/pull-secret/.dockerconfigjson > /tmp/merged-pullsecret.json
        oc set data secret/pull-secret -n openshift-config --from-file=.dockerconfigjson=/tmp/merged-pullsecret.json
        cat <<'EOF' | oc apply -f -
        apiVersion: config.openshift.io/v1
        kind: ImageDigestMirrorSet
        metadata:
          name: art-images-mirror-set
          namespace: openshift-marketplace
        spec:
          imageDigestMirrors:
          - mirrors:
            - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
            source: registry.redhat.io/external-secrets-operator/bitwarden-sdk-server-rhel9
          - mirrors:
            - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
            source: registry.redhat.io/external-secrets-operator/external-secrets-operator-bundle
          - mirrors:
            - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
            source: registry.redhat.io/external-secrets-operator/external-secrets-operator-rhel9
          - mirrors:
            - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
            source: registry.redhat.io/external-secrets-operator/external-secrets-rhel9
        EOF
        sleep 60
        oc wait mcp/master --for condition=Updated --timeout=30m
        oc wait mcp/worker --for condition=Updated --timeout=30m
      credentials:
      - mount_path: /var/run/secrets/pull-secret
        name: deploy-konflux-operator-art-image-share
        namespace: test-credentials
      from: cli-jq
      resources:
        requests:
          cpu: 100m
    - ref: optional-operators-subscribe
    - as: verify-install
      cli: latest
      commands: |
        oc wait --for condition=Available -n external-secrets-operator deployment external-secrets-operator-controller-manager
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-aws
zz_generated_metadata:
  branch: release-1.1
  org: openshift
  repo: external-secrets-operator
