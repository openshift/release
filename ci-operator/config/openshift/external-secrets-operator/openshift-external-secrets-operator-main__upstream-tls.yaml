base_images:
  cli-operator-sdk:
    name: cli-operator-sdk
    namespace: ocp
    tag: v1.39.2
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
build_root:
  from_repository: true
images:
  items:
  - dockerfile_literal: |
      FROM registry.ci.openshift.org/ocp/builder:rhel-9-golang-1.26-openshift-4.23 AS builder
      ARG SRC_DIR=/go/src/github.com/openshift/external-secrets-operator
      ENV GO_BUILD_TAGS=strictfipsruntime,openssl
      ENV GOEXPERIMENT=strictfipsruntime
      ENV CGO_ENABLED=1
      ENV GOFLAGS=""
      WORKDIR $SRC_DIR
      RUN git clone --depth 1 --branch tls-with-upstream https://github.com/siddhibhor-56/external-secrets-operator.git .
      RUN go build -tags $GO_BUILD_TAGS -o external-secrets-operator cmd/external-secrets-operator/main.go
      FROM registry.access.redhat.com/ubi9-minimal:9.4
      ARG SRC_DIR=/go/src/github.com/openshift/external-secrets-operator
      COPY --from=builder $SRC_DIR/external-secrets-operator /bin/external-secrets-operator
      USER 65534:65534
      ENTRYPOINT ["/bin/external-secrets-operator"]
    to: external-secrets-operator
  - dockerfile_literal: |
      FROM registry.ci.openshift.org/ocp/builder:rhel-9-golang-1.26-openshift-4.23 AS builder
      ARG GO_BUILD_TAGS=strictfipsruntime,openssl
      ARG SRC_DIR=/go/src/github.com/openshift/external-secrets
      ENV GOEXPERIMENT=strictfipsruntime
      ENV CGO_ENABLED=1
      WORKDIR $SRC_DIR
      RUN git clone --depth 1 --branch tls-configure-upstream https://github.com/siddhibhor-56/external-secrets-openshift.git .
      RUN find . -name go.mod -print0 | xargs -0 grep -l 'go 1.26.6' | while read -r f; do \
            sed -i 's/go 1\.26\.6/go 1.26.5/g' "$f"; \
          done
      RUN go mod vendor
      RUN go build -mod=vendor -tags $GO_BUILD_TAGS -o _output/external-secrets main.go
      FROM registry.access.redhat.com/ubi9-minimal:9.4
      ARG SRC_DIR=/go/src/github.com/openshift/external-secrets
      COPY --from=builder $SRC_DIR/_output/external-secrets /bin/external-secrets
      USER 65534:65534
      ENTRYPOINT ["/bin/external-secrets"]
    to: external-secrets
operator:
  bundles:
  - as: external-secrets-operator-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: openshift.io/external-secrets-operator:latest
    with: pipeline:external-secrets-operator
  - pullspec: oci.external-secrets.io/external-secrets/external-secrets:.*
    with: pipeline:external-secrets
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: tls-scanner
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_BUNDLE: external-secrets-operator-bundle
    env:
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: external-secrets-operator
      OO_SECURITY_CONTEXT: restricted
      SCAN_NAMESPACE: external-secrets
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    pre:
    - chain: ipi-aws-pre
    - as: install-operator
      commands: |-
        set -o errexit
        set -o nounset
        set -o pipefail

        oc create ns "${OO_INSTALL_NAMESPACE}" 2>/dev/null || true
        if [[ "${OO_INSTALL_NAMESPACE}" == openshift-* ]]; then
          oc label --overwrite ns "${OO_INSTALL_NAMESPACE}" security.openshift.io/scc.podSecurityLabelSync=true
        fi

        operator-sdk run bundle "${OO_BUNDLE}" \
          -n "${OO_INSTALL_NAMESPACE}" \
          --verbose \
          --install-mode "${OO_INSTALL_MODE}" \
          --timeout=15m \
          --security-context-config="${OO_SECURITY_CONTEXT}" &
        SDK_PID=$!

        echo "Waiting for CSV to be created..."
        CSV_NAME=""
        for i in $(seq 1 180); do
          CSV_NAME=$(oc get csv -n "${OO_INSTALL_NAMESPACE}" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [[ -n "$CSV_NAME" ]]; then
            echo "Found CSV: $CSV_NAME"
            break
          fi
          sleep 2
        done

        if [[ -z "$CSV_NAME" ]]; then
          echo "ERROR: CSV not created within timeout"
          kill $SDK_PID 2>/dev/null || true
          wait $SDK_PID 2>/dev/null || true
          exit 1
        fi

        echo "Patching CSV to add RBAC for apiservers.config.openshift.io..."
        PERMS=$(oc get csv "$CSV_NAME" -n "${OO_INSTALL_NAMESPACE}" \
          -o jsonpath='{.spec.install.spec.clusterPermissions[0].rules}')
        RULE='{"apiGroups":["config.openshift.io"],"resources":["apiservers"],"verbs":["get","list","watch"]}'
        RULES_LEN=$(oc get csv "$CSV_NAME" -n "${OO_INSTALL_NAMESPACE}" \
          -o jsonpath='{.spec.install.spec.clusterPermissions[0].rules}' | python3 -c "import sys,json; print(len(json.load(sys.stdin)))")
        oc patch csv "$CSV_NAME" -n "${OO_INSTALL_NAMESPACE}" --type=json \
          -p="[{\"op\":\"add\",\"path\":\"/spec/install/spec/clusterPermissions/0/rules/${RULES_LEN}\",\"value\":${RULE}}]"
        echo "RBAC rule added at index ${RULES_LEN}"

        echo "Waiting for operator-sdk run bundle to complete..."
        wait $SDK_PID
        echo "Operator installed successfully"
      from: cli-operator-sdk
      resources:
        requests:
          cpu: 100m
    test:
    - ref: tls-13
    - as: deploy-operand
      cli: latest
      commands: |-
        set -o errexit
        set -o nounset
        set -o pipefail

        echo "Waiting for external-secrets-operator controller-manager..."
        oc wait --for=condition=Available -n external-secrets-operator deployment/external-secrets-operator-controller-manager --timeout=5m

        echo "Creating ExternalSecretsConfig CR to trigger operand deployment..."
        oc apply -f - <<EOF
        apiVersion: operator.openshift.io/v1alpha1
        kind: ExternalSecretsConfig
        metadata:
          name: cluster
        spec: {}
        EOF

        echo "Waiting for external-secrets namespace to be created..."
        for i in $(seq 1 60); do
          if oc get namespace external-secrets 2>/dev/null; then
            echo "Namespace external-secrets found"
            break
          fi
          echo "Waiting for namespace (attempt ${i}/60)..."
          sleep 5
        done

        echo "Waiting for external-secrets operand deployments..."
        oc wait --for=create -n external-secrets deployment/external-secrets --timeout=5m
        oc wait --for=create -n external-secrets deployment/external-secrets-webhook --timeout=5m
        oc wait --for=create -n external-secrets deployment/external-secrets-cert-controller --timeout=5m
        oc wait --for=condition=Available -n external-secrets deployment/external-secrets --timeout=5m
        oc wait --for=condition=Available -n external-secrets deployment/external-secrets-webhook --timeout=5m
        oc wait --for=condition=Available -n external-secrets deployment/external-secrets-cert-controller --timeout=5m

        echo "Verifying webhook TLS endpoint is live..."
        WEBHOOK_SVC=$(oc get validatingwebhookconfigurations -l app=external-secrets -o jsonpath='{.items[0].webhooks[0].clientConfig.service.name}' 2>/dev/null || true)
        WEBHOOK_NS=$(oc get validatingwebhookconfigurations -l app=external-secrets -o jsonpath='{.items[0].webhooks[0].clientConfig.service.namespace}' 2>/dev/null || true)
        if [[ -n "${WEBHOOK_SVC}" && -n "${WEBHOOK_NS}" ]]; then
          WEBHOOK_PORT=$(oc get validatingwebhookconfigurations -l app=external-secrets -o jsonpath='{.items[0].webhooks[0].clientConfig.service.port}' 2>/dev/null || echo "443")
          echo "Found webhook service: ${WEBHOOK_NS}/${WEBHOOK_SVC}:${WEBHOOK_PORT}"
          oc get svc -n "${WEBHOOK_NS}" "${WEBHOOK_SVC}" || true
          oc get endpoints -n "${WEBHOOK_NS}" "${WEBHOOK_SVC}" || true
        else
          echo "Warning: could not discover ValidatingWebhookConfiguration with label app=external-secrets"
          oc get validatingwebhookconfigurations -o name || true
        fi
      from: src
      resources:
        requests:
          cpu: 100m
    - ref: tls-scanner-run
    workflow: optional-operators-ci-operator-sdk-aws
zz_generated_metadata:
  branch: main
  org: openshift
  repo: external-secrets-operator
  variant: upstream-tls
