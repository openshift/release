base_images:
  base-rhel9:
    name: "4.22"
    namespace: ocp
    tag: base-rhel9
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
binary_build_commands: make build
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: images/ci/Dockerfile
    from: base-rhel9
    to: external-secrets-operator
  - dockerfile_path: images/ci/operand.Dockerfile
    from: base-rhel9
    to: external-secrets
operator:
  bundles:
  - as: external-secrets-operator-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: openshift.io/external-secrets-operator:latest
    with: pipeline:external-secrets-operator
  - pullspec: oci.external-secrets.io/external-secrets/external-secrets:.*
    with: pipeline:external-secrets
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-operator-upgrade
  cron: 0 6 * * 1
  steps:
    cluster_profile: aws-qe
    dependency_overrides:
      OO_INDEX: registry.redhat.io/redhat/redhat-operator-index:v4.22
    env:
      OO_PACKAGE: openshift-external-secrets-operator
      OO_CHANNEL: stable-v1.2
      OO_INSTALL_NAMESPACE: external-secrets-operator
      OO_TARGET_NAMESPACES: "!all"
      INITIAL_CSV: openshift-external-secrets-operator.v1.2.0
      OO_LATEST_CSV: openshift-external-secrets-operator.v1.2.1
      STAGE_OO_INDEX: registry.stage.redhat.io/redhat/redhat-operator-index:v4.22
    workflow: external-secrets-operator-upgrade
zz_generated_metadata:
  branch: release-1.2
  org: openshift
  repo: external-secrets-operator
  variant: periodics
