base_images:
  base-rhel9:
    name: "4.22"
    namespace: ocp
    tag: base-rhel9
  cli-operator-sdk:
    name: cli-operator-sdk
    namespace: ocp
    tag: v1.39.2
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
binary_build_commands: make build
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: images/ci/Dockerfile
    from: base-rhel9
    to: external-secrets-operator
  - dockerfile_path: images/ci/Dockerfile.coverage
    to: external-secrets-operator-coverage
  - dockerfile_path: images/ci/operand.Dockerfile
    from: base-rhel9
    to: external-secrets
operator:
  bundles:
  - as: external-secrets-operator-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: openshift.io/external-secrets-operator:latest
    with: pipeline:external-secrets-operator
  - pullspec: oci.external-secrets.io/external-secrets/external-secrets:.*
    with: pipeline:external-secrets
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: ./hack/install-markdownlint.sh
tests:
- as: verify
  commands: |
    make verify -k
  container:
    from: test-bin
- as: unit
  commands: |
    make test
  container:
    from: src
- as: fips-image-scan-operator
  steps:
    dependencies:
      SCAN_IMAGE: external-secrets-operator
    test:
    - ref: fips-check-image-scan
- as: fips-image-scan-external-secrets
  steps:
    dependencies:
      SCAN_IMAGE: external-secrets
    test:
    - ref: fips-check-image-scan
- as: e2e-operator
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  skip_if_only_changed: ^(docs/|bundle/|tools/)|\.md$|^(?:.*/)?(?:\.gitignore|.dockerignore|.golangci.yml|Makefile|OWNERS|PROJECT|LICENSE)$
  steps:
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace external-secrets-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n external-secrets-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n external-secrets-operator deployment external-secrets-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: external-secrets-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- always_run: false
  as: e2e-operator-coverage
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: hack/e2e-coverage.sh collect
      credentials:
      - mount_path: /var/run/secrets/codecov
        name: external-secrets-operator-codecov-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    - chain: gather
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace external-secrets-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n external-secrets-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n external-secrets-operator deployment external-secrets-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: external-secrets-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: setup-coverage
      cli: latest
      commands: hack/e2e-coverage.sh setup
      dependencies:
      - env: COVERAGE_IMAGE
        name: external-secrets-operator-coverage
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- as: publish-e2e-coverage
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  postsubmit: true
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: hack/e2e-coverage.sh collect
      credentials:
      - mount_path: /var/run/secrets/codecov
        name: external-secrets-operator-codecov-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    - chain: gather
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace external-secrets-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n external-secrets-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n external-secrets-operator deployment external-secrets-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: external-secrets-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: setup-coverage
      cli: latest
      commands: hack/e2e-coverage.sh setup
      dependencies:
      - env: COVERAGE_IMAGE
        name: external-secrets-operator-coverage
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- always_run: false
  as: tls-scanner
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_BUNDLE: external-secrets-operator-bundle
    env:
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: external-secrets-operator
      OO_SECURITY_CONTEXT: restricted
      SCAN_NAMESPACE: external-secrets-operator
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: optional-operators-ci-operator-sdk-aws
- as: tls-scanner-periodic
  cron: 0 6 * * 1
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_BUNDLE: external-secrets-operator-bundle
    env:
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: external-secrets-operator
      OO_SECURITY_CONTEXT: restricted
      SCAN_NAMESPACE: external-secrets-operator
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: optional-operators-ci-operator-sdk-aws
- always_run: false
  as: tls-pqc-readiness
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_BUNDLE: external-secrets-operator-bundle
    env:
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: external-secrets-operator
      OO_SECURITY_CONTEXT: restricted
      PQC_CHECK: "true"
      SCAN_NAMESPACE: external-secrets-operator
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
    test:
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: optional-operators-ci-operator-sdk-aws
- as: tls-pqc-readiness-periodic
  cron: 0 6 * * 1
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_BUNDLE: external-secrets-operator-bundle
    env:
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: external-secrets-operator
      OO_SECURITY_CONTEXT: restricted
      PQC_CHECK: "true"
      SCAN_NAMESPACE: external-secrets-operator
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
    test:
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: optional-operators-ci-operator-sdk-aws
zz_generated_metadata:
  branch: main
  org: openshift
  repo: external-secrets-operator
