base_images:
  base-rhel9:
    name: "4.22"
    namespace: ocp
    tag: base-rhel9
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
binary_build_commands: make build
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: images/ci/Dockerfile
    from: base-rhel9
    to: external-secrets-operator
  - dockerfile_path: images/ci/Dockerfile.coverage
    to: external-secrets-operator-coverage
  - dockerfile_path: images/ci/operand.Dockerfile
    from: base-rhel9
    to: external-secrets
  - dockerfile_literal: |
      FROM nested-podman AS podman
      FROM src
      USER root
      RUN dnf install -y podman fuse-overlayfs shadow-utils && dnf clean all
      COPY --from=podman /entrypoint.sh /entrypoint.sh
      RUN setcap cap_setuid+ep /usr/bin/newuidmap && \
          setcap cap_setgid+ep /usr/bin/newgidmap && \
          touch /etc/subgid /etc/subuid && \
          chmod -R g=u /etc/subuid /etc/subgid /etc/passwd /etc/group && \
          chmod +rx /entrypoint.sh
      ENV BUILDAH_ISOLATION=chroot
      ENTRYPOINT ["/entrypoint.sh"]
    from: src
    inputs:
      nested-podman:
        as:
        - nested-podman
      src:
        as:
        - src
    to: src-nested-podman
operator:
  bundles:
  - as: external-secrets-operator-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: openshift.io/external-secrets-operator:latest
    with: pipeline:external-secrets-operator
  - pullspec: oci.external-secrets.io/external-secrets/external-secrets:.*
    with: pipeline:external-secrets
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
  verify:
    requests:
      cpu: "1"
      memory: 2Gi
tests:
- as: verify
  capabilities:
  - nested-podman
  commands: |
    make verify -k
  container:
    from: src-nested-podman
  nested_podman: true
- as: unit
  commands: |
    make test
  container:
    from: src
- as: fips-image-scan-operator
  steps:
    dependencies:
      SCAN_IMAGE: external-secrets-operator
    test:
    - ref: fips-check-image-scan
- as: fips-image-scan-external-secrets
  steps:
    dependencies:
      SCAN_IMAGE: external-secrets
    test:
    - ref: fips-check-image-scan
- as: e2e-operator
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  skip_if_only_changed: ^(docs/|bundle/|tools/)|\.md$|^(?:.*/)?(?:\.gitignore|.dockerignore|.golangci.yml|Makefile|OWNERS|PROJECT|LICENSE)$
  steps:
    test:
    - ref: merge-stage-registry-credentials
    - as: install
      cli: latest
      commands: |
        oc create namespace external-secrets-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n external-secrets-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n external-secrets-operator deployment external-secrets-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: external-secrets-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- always_run: false
  as: e2e-operator-coverage
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: hack/e2e-coverage.sh collect
      credentials:
      - mount_path: /var/run/secrets/codecov
        name: external-secrets-operator-codecov-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    - chain: gather
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace external-secrets-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n external-secrets-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n external-secrets-operator deployment external-secrets-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: external-secrets-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: setup-coverage
      cli: latest
      commands: hack/e2e-coverage.sh setup
      dependencies:
      - env: COVERAGE_IMAGE
        name: external-secrets-operator-coverage
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- as: publish-e2e-coverage
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  postsubmit: true
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: hack/e2e-coverage.sh collect
      credentials:
      - mount_path: /var/run/secrets/codecov
        name: external-secrets-operator-codecov-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    - chain: gather
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace external-secrets-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n external-secrets-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n external-secrets-operator deployment external-secrets-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: external-secrets-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: setup-coverage
      cli: latest
      commands: hack/e2e-coverage.sh setup
      dependencies:
      - env: COVERAGE_IMAGE
        name: external-secrets-operator-coverage
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
zz_generated_metadata:
  branch: main
  org: openshift
  repo: external-secrets-operator
