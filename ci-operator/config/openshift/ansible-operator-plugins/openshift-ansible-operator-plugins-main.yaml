base_images:
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: openshift/Dockerfile
    to: openshift-ansible-operator-plugins
  - dockerfile_path: openshift/ci/dockerfiles/ansible-e2e.Dockerfile
    from: openshift-ansible-operator-plugins
    to: ansible-operator-e2e
  - dockerfile_path: openshift/Dockerfile.requirements
    to: build-requirements
  - dockerfile_literal: |
      FROM build-requirements AS builder

      FROM src
      RUN rm openshift/requirements*.txt
      COPY --from=builder requirements*.txt openshift/
    from: src
    inputs:
      build-requirements:
        as:
        - build-requirements
    to: get-requirements
  - dockerfile_path: openshift/release/ansible/Dockerfile.collections
    to: build-collections
  - dockerfile_literal: |
      FROM build-collections AS builder

      FROM src
      RUN rm -r openshift/release/ansible/ansible_collections
      COPY --from=builder ansible_collections/ openshift/release/ansible/ansible_collections/
    from: src
    inputs:
      build-collections:
        as:
        - build-collections
    to: get-collections
promotion:
  to:
  - name: "5.0"
    namespace: ocp
releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: |
    # Set $HOME for sufficient permission
    HOME=/tmp make test-unit
  container:
    from: src
- as: sanity
  commands: |
    # Set $HOME for golangci-lint cache
    HOME=/tmp make test-sanity
  container:
    from: src
- as: e2e-ansible
  steps:
    cluster_profile: openshift-org-gcp
    test:
    - as: test
      cli: latest
      commands: make -f openshift/Makefile test-e2e-ansible
      dependencies:
      - env: IMAGE_FORMAT
        name: ansible-operator-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-gcp
- always_run: false
  as: e2e-ansible-fips
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      FIPS_ENABLED: "true"
    post:
    - chain: ipi-deprovision
    test:
    - as: test
      cli: latest
      commands: make -f openshift/Makefile test-e2e-ansible
      dependencies:
      - env: IMAGE_FORMAT
        name: ansible-operator-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-gcp
- always_run: false
  as: e2e-ansible-rhcos10-fips
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      FIPS_ENABLED: "true"
      OSSTREAM: rhel-10
    post:
    - chain: ipi-deprovision
    test:
    - as: test
      cli: latest
      commands: make -f openshift/Makefile test-e2e-ansible
      dependencies:
      - env: IMAGE_FORMAT
        name: ansible-operator-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-gcp
- always_run: false
  as: e2e-ansible-rhcos10
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      OSSTREAM: rhel-10
    test:
    - as: test
      cli: latest
      commands: make -f openshift/Makefile test-e2e-ansible
      dependencies:
      - env: IMAGE_FORMAT
        name: ansible-operator-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-gcp
- always_run: false
  as: tls13-adherence
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      PQC_CHECK: "false"
      SCAN_NAMESPACE: memcached-molecule-operator-system
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - as: deploy-operator
      cli: latest
      commands: |
        mkdir -p /tmp/bin
        ln -sf "$(command -v oc)" /tmp/bin/kubectl
        export PATH="/tmp/bin:${PATH}"
        cd testdata/memcached-molecule-operator
        make deploy IMG="${IMAGE_FORMAT}"
        oc wait --for=condition=Available --timeout=5m -n memcached-molecule-operator-system deployment/memcached-molecule-operator-controller-manager
      dependencies:
      - env: IMAGE_FORMAT
        name: ansible-operator-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-gcp
- as: tls13-adherence-periodic
  cron: 0 6 * * 1
  steps:
    cluster_profile: openshift-org-gcp
    env:
      PQC_CHECK: "false"
      SCAN_NAMESPACE: memcached-molecule-operator-system
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - as: deploy-operator
      cli: latest
      commands: |
        mkdir -p /tmp/bin
        ln -sf "$(command -v oc)" /tmp/bin/kubectl
        export PATH="/tmp/bin:${PATH}"
        cd testdata/memcached-molecule-operator
        make deploy IMG="${IMAGE_FORMAT}"
        oc wait --for=condition=Available --timeout=5m -n memcached-molecule-operator-system deployment/memcached-molecule-operator-controller-manager
      dependencies:
      - env: IMAGE_FORMAT
        name: ansible-operator-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-gcp
- always_run: false
  as: tls-pqc-readiness
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      PQC_CHECK: "true"
      SCAN_NAMESPACE: memcached-molecule-operator-system
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
    test:
    - as: deploy-operator
      cli: latest
      commands: |
        mkdir -p /tmp/bin
        ln -sf "$(command -v oc)" /tmp/bin/kubectl
        export PATH="/tmp/bin:${PATH}"
        cd testdata/memcached-molecule-operator
        make deploy IMG="${IMAGE_FORMAT}"
        oc wait --for=condition=Available --timeout=5m -n memcached-molecule-operator-system deployment/memcached-molecule-operator-controller-manager
      dependencies:
      - env: IMAGE_FORMAT
        name: ansible-operator-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-gcp
- as: tls-pqc-readiness-periodic
  cron: 0 6 * * 1
  steps:
    cluster_profile: openshift-org-gcp
    env:
      PQC_CHECK: "true"
      SCAN_NAMESPACE: memcached-molecule-operator-system
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
    test:
    - as: deploy-operator
      cli: latest
      commands: |
        mkdir -p /tmp/bin
        ln -sf "$(command -v oc)" /tmp/bin/kubectl
        export PATH="/tmp/bin:${PATH}"
        cd testdata/memcached-molecule-operator
        make deploy IMG="${IMAGE_FORMAT}"
        oc wait --for=condition=Available --timeout=5m -n memcached-molecule-operator-system deployment/memcached-molecule-operator-controller-manager
      dependencies:
      - env: IMAGE_FORMAT
        name: ansible-operator-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-gcp
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
- as: verify-requirements
  commands: |
    echo "Verify requirements: running git diff to detect changes..."
    git diff --exit-code
  container:
    from: get-requirements
  run_if_changed: ^(images/ansible-operator/Pipfile*|openshift/install-ansible.sh|openshift/requirements*.txt|openshift/Dockerfile.requirements)$
- as: verify-collections
  commands: |
    echo "Verify ansible-collections: running git diff to detect changes..."
    git diff --exit-code
  container:
    from: get-collections
zz_generated_metadata:
  branch: main
  org: openshift
  repo: ansible-operator-plugins
