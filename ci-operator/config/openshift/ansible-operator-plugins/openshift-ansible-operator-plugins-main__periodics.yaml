base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_literal: |
      FROM nested-podman AS podman
      FROM src
      USER 0
      RUN for attempt in 1 2 3; do \
            if dnf install -y podman shadow-utils libcap; then break; fi; \
            test "$attempt" -lt 3 || exit 1; \
            sleep 15; \
          done && dnf clean all && \
          setcap cap_setuid+ep /usr/bin/newuidmap && \
          setcap cap_setgid+ep /usr/bin/newgidmap && \
          touch /etc/subgid /etc/subuid && \
          chmod g=u /etc/subuid /etc/subgid && \
          chmod g=u /etc/passwd /etc/group
      COPY --from=podman /entrypoint.sh /entrypoint.sh
      RUN chmod +rx /entrypoint.sh
      ENV BUILDAH_ISOLATION=chroot
      ENV HOME=/tmp
      USER 1000
      ENTRYPOINT ["/entrypoint.sh"]
      CMD ["bash"]
    inputs:
      nested-podman:
        as:
        - nested-podman
      src:
        as:
        - src
    to: auto-rebase-runner
resources:
  '*':
    requests:
      cpu: 200m
      memory: 200Mi
tests:
- as: auto-rebase-verify
  capabilities:
  - nested-podman
  cluster: build08
  cron: 0 6 * * 1
  steps:
    test:
    - as: auto-rebase
      commands: |
        set -euo pipefail

        # An executable provider refreshes the one-hour installation token at publication.
        mkdir -p /tmp/bin
        cat > /tmp/bin/github-app-token <<'TOKEN_PROVIDER'
        #!/usr/bin/env bash
        set -euo pipefail
        APP_ID=$(cat /var/run/github-app/app-id)
        PEM_PATH="/var/run/github-app/private-key.pem"
        HEADER=$(printf '{"alg":"RS256","typ":"JWT"}' | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
        NOW=$(date +%s); IAT=$((NOW - 60)); EXP=$((NOW + 300))
        PAYLOAD=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$IAT" "$EXP" "$APP_ID" | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
        SIGNATURE=$(printf '%s' "${HEADER}.${PAYLOAD}" | openssl dgst -sha256 -sign "$PEM_PATH" -binary | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
        JWT="${HEADER}.${PAYLOAD}.${SIGNATURE}"

        REPO_OWNER="openshift"
        REPO_NAME="ansible-operator-plugins"

        INSTALL_RESPONSE=$(curl -s -w "\n%{http_code}" --connect-timeout 10 --max-time 30 \
          -H "Authorization: Bearer ${JWT}" -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/installation")
        HTTP_CODE=$(echo "$INSTALL_RESPONSE" | tail -1)
        INSTALL_BODY=$(echo "$INSTALL_RESPONSE" | sed '$d')
        if [[ "$HTTP_CODE" == 404 ]]; then
          echo "ERROR: GitHub App has no installation access to ${REPO_OWNER}/${REPO_NAME}; add this repository to the App installation" >&2
          exit 1
        elif [[ "$HTTP_CODE" != 200 ]]; then
          echo "ERROR: GitHub App installation lookup failed for ${REPO_OWNER}/${REPO_NAME} (HTTP ${HTTP_CODE})" >&2
          exit 1
        fi
        INST_ID=$(echo "$INSTALL_BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

        TOKEN_REQUEST=$(printf '{"repositories":["%s"],"permissions":{"contents":"write","pull_requests":"write"}}' "$REPO_NAME")
        TOKEN_RESPONSE=$(curl -s -w "\n%{http_code}" --connect-timeout 10 --max-time 30 -X POST \
          -H "Authorization: Bearer ${JWT}" -H "Accept: application/vnd.github+json" \
          -H "Content-Type: application/json" -d "$TOKEN_REQUEST" \
          "https://api.github.com/app/installations/${INST_ID}/access_tokens")
        T_CODE=$(echo "$TOKEN_RESPONSE" | tail -1)
        T_BODY=$(echo "$TOKEN_RESPONSE" | sed '$d')
        if [[ "$T_CODE" -ne 201 ]]; then
          echo "ERROR: Failed to mint installation token (HTTP ${T_CODE})" >&2
          exit 1
        fi
        echo "$T_BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])"

        TOKEN_PROVIDER
        chmod 700 /tmp/bin/github-app-token
        export GITHUB_TOKEN_COMMAND=/tmp/bin/github-app-token

        # Install gh + oc CLIs (not in the base src image).
        # oc is required by update_golang_builder / _resolve_builder_ocp.
        GH_VERSION=2.62.0
        curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz" \
          | tar -xz -C /tmp
        mkdir -p /tmp/bin
        curl -fsSL "https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz" \
          | tar -xz -C /tmp/bin oc
        export PATH="/tmp/bin:/tmp/gh_${GH_VERSION}_linux_amd64/bin:${PATH}"

        OSV_VERSION=2.7.1
        curl -fsSL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" \
          -o /tmp/bin/osv-scanner
        printf '%s  %s\n' fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8 /tmp/bin/osv-scanner \
          | sha256sum --check --strict
        chmod 755 /tmp/bin/osv-scanner

        git config --global --add safe.directory "$(pwd)"
        if ! git remote get-url origin >/dev/null 2>&1; then
          git remote add origin https://github.com/openshift/ansible-operator-plugins.git
        fi
        if [[ "${JOB_NAME:-}" == rehearse-* ]]; then
          export GITHUB_TOKEN=$("$GITHUB_TOKEN_COMMAND")
          export GH_TOKEN="$GITHUB_TOKEN"
          git config --local --replace-all credential.helper ''
          git config --local --add credential.helper '!gh auth git-credential'
          FIXTURE_SHA=4265bbee7aef259356657104fc2378fbdf7a1152
          REHEARSAL_BASE=oape-987-security-rehearsal-20261110130326-build08
          git fetch https://github.com/neha037/ansible-operator-plugins.git "refs/heads/${REHEARSAL_BASE}"
          [[ "$(git rev-parse FETCH_HEAD)" == "$FIXTURE_SHA" ]]
          git fetch https://github.com/operator-framework/ansible-operator-plugins.git \
            refs/tags/v1.42.1:refs/tags/v1.42.1 refs/tags/v1.42.3:refs/tags/v1.42.3
          [[ "$(git show "$FIXTURE_SHA:UPSTREAM-VERSION" | tr -d '[:space:]')" == v1.42.1 ]]
          git merge-base --is-ancestor refs/tags/v1.42.1 "$FIXTURE_SHA"
          if git merge-base --is-ancestor refs/tags/v1.42.3 "$FIXTURE_SHA"; then exit 1; fi
          existing=$(git ls-remote origin "refs/heads/$REHEARSAL_BASE")
          [[ -z "$existing" || "${existing%%[[:space:]]*}" == "$FIXTURE_SHA" ]]
          if [[ -z "$existing" ]]; then git push origin "$FIXTURE_SHA:refs/heads/$REHEARSAL_BASE"; fi
          git fetch origin "refs/heads/${REHEARSAL_BASE}:refs/remotes/origin/${REHEARSAL_BASE}"
          git checkout -B "$REHEARSAL_BASE" "origin/$REHEARSAL_BASE"
          export REBASE_BRANCH="$REHEARSAL_BASE"
          export OVERRIDE_TAG=v1.42.3
        fi
        export CONTAINER_ENGINE=podman
        export REGISTRY_AUTH_FILE=/var/run/secrets/ci-pull-credentials/.dockerconfigjson
        rebase_status=0
        ./hack/auto-rebase.sh || rebase_status=$?
        if [[ "${JOB_NAME:-}" == rehearse-* ]]; then
          export GH_TOKEN=$("$GITHUB_TOKEN_COMMAND")
          pr=$(gh pr list --repo openshift/ansible-operator-plugins --state all \
            --head "v1.42.3-rebase-${REBASE_BRANCH}" --base "$REBASE_BRANCH" --json number --jq '.[0].number // empty')
          if [[ -n "$pr" ]]; then
            gh api --method PATCH "repos/openshift/ansible-operator-plugins/pulls/$pr" \
              -f title='[Rehearsal] Rebase v1.42.1 to v1.42.3 with Go security gates' --silent
            printf 'Rehearsal PR: https://github.com/openshift/ansible-operator-plugins/pull/%s\n' "$pr"
          fi
        fi
        exit "$rebase_status"
      credentials:
      - mount_path: /var/run/github-app
        name: openshift-app-platform-shift-github-bot
        namespace: test-credentials
      - mount_path: /var/run/secrets/ci-pull-credentials
        name: ci-pull-credentials
        namespace: test-credentials
      from: auto-rebase-runner
      nested_podman: true
      resources:
        limits:
          memory: 12Gi
        requests:
          cpu: 800m
          memory: 2Gi
      timeout: 2h0m0s
zz_generated_metadata:
  branch: main
  org: openshift
  repo: ansible-operator-plugins
  variant: periodics
