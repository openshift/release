build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.ocp
    to: dra-driver-sriov
promotion:
  to:
  - name: sriov-5.0
    namespace: origin
  - name: "5.0"
    namespace: ocp
releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: GOFLAGS="-mod=mod" make test
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift
  repo: dra-driver-sriov
