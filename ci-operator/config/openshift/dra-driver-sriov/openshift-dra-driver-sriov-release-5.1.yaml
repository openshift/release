build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.ocp
    to: dra-driver-sriov
promotion:
  to:
  - disabled: true
    name: sriov-5.1
    namespace: origin
  - disabled: true
    name: "5.1"
    namespace: ocp
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: GOFLAGS="-mod=mod" make test
  container:
    from: src
zz_generated_metadata:
  branch: release-5.1
  org: openshift
  repo: dra-driver-sriov
