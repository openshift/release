base_images:
  ocp_builder_rhel-9-golang-1.26-openshift-5.0:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-5.0
  origin_scos-5.1_base-stream10:
    name: scos-5.1
    namespace: origin
    tag: base-stream10
  origin_scos-5.1_installer-etcd-artifacts:
    name: scos-5.1
    namespace: origin
    tag: installer-etcd-artifacts
  origin_scos-5.1_installer-kube-apiserver-artifacts:
    name: scos-5.1
    namespace: origin
    tag: installer-kube-apiserver-artifacts
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-5.0
images:
  items:
  - build_args:
    - name: TAGS
      value: scos
    capabilities:
    - intranet
    dockerfile_path: images/installer-artifacts/Dockerfile.rhel
    from: origin_scos-5.1_base-stream10
    inputs:
      ocp_builder_rhel-9-golang-1.26-openshift-5.0:
        as:
        - builder
        - registry.ci.openshift.org/ocp/builder:rhel-9-golang-1.25-openshift-4.22
      origin_scos-5.1_installer-etcd-artifacts:
        as:
        - etcd-artifacts
        - registry.ci.openshift.org/ocp/4.22:installer-etcd-artifacts
      origin_scos-5.1_installer-kube-apiserver-artifacts:
        as:
        - kas-artifacts
        - registry.ci.openshift.org/ocp/4.22:installer-kube-apiserver-artifacts
    to: installer-artifacts
  - build_args:
    - name: TAGS
      value: scos
    capabilities:
    - intranet
    dockerfile_path: images/installer/Dockerfile.ci
    from: origin_scos-5.1_base-stream10
    inputs:
      ocp_builder_rhel-9-golang-1.26-openshift-5.0:
        as:
        - builder
        - registry.ci.openshift.org/ocp/builder:rhel-9-golang-1.25-openshift-4.22
      origin_scos-5.1_installer-etcd-artifacts:
        as:
        - etcd-artifacts
        - registry.ci.openshift.org/ocp/4.22:installer-etcd-artifacts
      origin_scos-5.1_installer-kube-apiserver-artifacts:
        as:
        - kas-artifacts
        - registry.ci.openshift.org/ocp/4.22:installer-kube-apiserver-artifacts
    to: installer
promotion:
  to:
  - name: scos-5.1
    namespace: origin
releases:
  latest:
    integration:
      include_built_images: true
      name: scos-5.1
      namespace: origin
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
  installer:
    requests:
      cpu: "3"
      memory: 5Gi
  installer-altinfra:
    requests:
      cpu: "3"
      memory: 5Gi
  src:
    requests:
      cpu: "3"
      memory: 5Gi
tests:
- always_run: false
  as: e2e-aws-ovn
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    workflow: openshift-e2e-aws
zz_generated_metadata:
  branch: main
  org: openshift
  repo: installer
  variant: okd-scos
