base_images:
  cli:
    name: "5.1"
    namespace: ocp
    tag: cli
  tools:
    name: "5.1"
    namespace: ocp
    tag: tools
  upi-installer:
    name: "5.1"
    namespace: ocp
    tag: upi-installer
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.1"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: bastion-smoke
  optional: true
  steps:
    cluster_profile: azure-qe
    env:
      AZURE_IL6_RESOURCE_GROUP: CI-Azure-IL6-DoNotDelete
      AZURE_IL6_VNET_CIDR: 10.10.0.0/16
      AZURE_IL6_VNET_NAME: RHOCP-CI-AzureIL6-virtual-network
      AZURE_VNET_ADDRESS_PREFIXES: 10.10.0.0/16
      BASE_DOMAIN: qe.azure.devcluster.openshift.com
      BASTION_VM_SIZE: Standard_D4s_v3
      MIRROR_IN_BASTION: "yes"
      REGISTER_MIRROR_REGISTRY_DNS: "yes"
      RESOURCE_GROUP: CI-Azure-IL6-DoNotDelete
      VNET_NAME: RHOCP-CI-AzureIL6-virtual-network
    post:
    - ref: azure-il6-deprovision-resources
    pre:
    - ref: azure-il6-check-prereqs
    - ref: azure-il6-provision-subnets
    - chain: azure-provision-bastionhost
    - as: bastion-il6-setup
      commands: |
        #!/bin/bash
        set -o nounset
        set -o errexit
        set -o pipefail

        # Required before ssh: the pod's UID is random and has no /etc/passwd entry.
        if ! whoami &>/dev/null && [[ -w /etc/passwd ]]; then
            echo "${USER_NAME:-default}:x:$(id -u):0:${USER_NAME:-default} user:${HOME}:/sbin/nologin" >> /etc/passwd
        fi

        bastion_host="$(<"${SHARED_DIR}/bastion_public_address")"
        bastion_user="$(<"${SHARED_DIR}/bastion_ssh_user")"
        ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  -o ConnectTimeout=30 -i "${CLUSTER_PROFILE_DIR}/ssh-privatekey")

        on_bastion() { ssh "${ssh_opts[@]}" "${bastion_user}@${bastion_host}" "$@"; }
        to_bastion() { scp "${ssh_opts[@]}" "$1" "${bastion_user}@${bastion_host}:$2"; }

        ca_src="${CLUSTER_PROFILE_DIR}/${AZURE_IL6_CA_FILE}"
        if [[ ! -s "${ca_src}" ]]; then
            echo "ERROR: ${AZURE_IL6_CA_FILE} not found in the azure-qe cluster profile."
            echo "It is expected as a key/value entry in that profile, alongside osServicePrincipal.json."
            ls -1 "${CLUSTER_PROFILE_DIR}" | sed 's/^/  /'
            exit 1
        fi
        openssl crl2pkcs7 -nocrl -certfile "${ca_src}" >/dev/null
        echo "SHIFT CA chain holds $(grep -c 'BEGIN CERTIFICATE' "${ca_src}") certificate(s)."
        cp "${ca_src}" "${SHARED_DIR}/azure_il6_ca_bundle"

        echo
        echo "=== 1/4 split-horizon resolver on the bastion ==="
        # The VNet's custom DNS servers serve the IL6 namespace only, and setting dnsServers on a
        # VNet replaces Azure's resolver for every NIC in it. So the bastion resolves
        # *.microsoft.scloud and nothing else -- not quay.io, not registry.ci.openshift.org, not
        # even the image its own squid unit pulls at boot.
        #
        # A second 'nameserver' line does not fix this: glibc falls through on timeout, not on
        # NXDOMAIN, so whichever resolver is asked first decides the answer. It needs a real
        # forwarder that splits on domain, hence dnsmasq with no-resolv and explicit upstreams.
        mapfile -t vnet_dns < <(on_bastion 'grep "^nameserver" /etc/resolv.conf' | awk '{print $2}')
        if [[ "${#vnet_dns[@]}" -eq 0 ]]; then
            echo "ERROR: no nameserver found in the bastion's resolv.conf."
            exit 1
        fi
        echo "VNet DNS servers currently in use: ${vnet_dns[*]}"

        {
            echo "no-resolv"
            for s in "${vnet_dns[@]}"; do
                echo "server=/${AZURE_IL6_DNS_DOMAIN}/${s}"
            done
            echo "server=${AZURE_IL6_PUBLIC_DNS}"
            echo "listen-address=127.0.0.1"
            echo "bind-interfaces"
        } > /tmp/il6-split.conf
        echo "----- /etc/dnsmasq.d/il6-split.conf -----"
        cat /tmp/il6-split.conf

        to_bastion /tmp/il6-split.conf /tmp/il6-split.conf
        on_bastion "sudo install -m 0644 -o root -g root /tmp/il6-split.conf /etc/dnsmasq.d/il6-split.conf && sudo restorecon -v /etc/dnsmasq.d/il6-split.conf || true"
        on_bastion "sudo systemctl unmask dnsmasq && sudo systemctl enable --now dnsmasq"

        # Point the host's own resolver at dnsmasq. NetworkManager owns resolv.conf on RHCOS, so
        # this has to go through nmcli or it is reverted on the next DHCP renew.
        conn="$(on_bastion 'nmcli -t -g NAME connection show --active' | head -n 1)"
        echo "Active NetworkManager connection: ${conn}"
        on_bastion "sudo nmcli connection modify '${conn}' ipv4.ignore-auto-dns yes ipv4.dns 127.0.0.1"
        on_bastion "sudo nmcli connection up '${conn}'" >/dev/null
        on_bastion 'cat /etc/resolv.conf'

        echo
        echo "=== 2/4 verifying both halves of the split ==="
        failed=0
        if on_bastion "getent hosts ${AZURE_IL6_ARM_HOST}"; then
            echo "OK: the IL6 namespace still resolves."
        else
            echo "FAIL: ${AZURE_IL6_ARM_HOST} no longer resolves -- the split sends it to the wrong upstream."
            failed=1
        fi
        if on_bastion 'getent hosts quay.io'; then
            echo "OK: public names now resolve."
        else
            echo "FAIL: public names still do not resolve."
            on_bastion 'sudo systemctl status dnsmasq --no-pager -l' || true
            failed=1
        fi
        [[ "${failed}" -eq 0 ]] || exit 1

        # squid pulls its image from quay.io in a boot-time unit, so it will have failed before
        # DNS worked. Restart whatever is present; neither unit is fatal to this job.
        for unit in squid.service registry.service; do
            on_bastion "sudo systemctl is-enabled ${unit} >/dev/null 2>&1 && sudo systemctl restart ${unit} || true" || true
        done

        echo
        echo "=== 3/4 installing the emulator CA into the RHCOS trust store ==="
        # RHCOS, not Debian: the SHIFT article's /usr/local/share/ca-certificates +
        # update-ca-certificates does not exist here.
        remote_ca="/etc/pki/ca-trust/source/anchors/${AZURE_IL6_CA_FILE}"
        to_bastion "${ca_src}" /tmp/il6-ca.pem
        on_bastion "sudo install -m 0644 -o root -g root /tmp/il6-ca.pem ${remote_ca} && sudo restorecon -v ${remote_ca} || true"
        on_bastion "sudo update-ca-trust extract && rm -f /tmp/il6-ca.pem"
        echo "${remote_ca}" > "${SHARED_DIR}/azure_il6_remote_ca_path"

        if on_bastion "curl -sS --connect-timeout 30 -o /dev/null -w 'ARM HTTP %{http_code}, TLS verified\n' '${AZURE_IL6_ARM_ENDPOINT}/metadata/endpoints?api-version=2019-05-01'"; then
            echo "OK: the OS trust store now validates the emulator's certificate."
        else
            echo "ERROR: TLS to ${AZURE_IL6_ARM_ENDPOINT} still fails after installing the CA."
            exit 1
        fi

        echo
        echo "=== 4/4 azure-cli on the bastion, under podman ==="
        # RHCOS has no package manager, so the SHIFT article's 'curl InstallAzureCLIDeb | bash'
        # does not apply. podman is present; the CLI runs as a container with a persistent
        # ~/.azure so that 'az cloud register' and 'az login' survive between invocations.
        on_bastion "sudo podman pull -q ${AZURE_CLI_IMAGE}"

        # requests, and therefore az, ignores the OS trust store and uses its own bundle. It needs
        # the emulator CA *and* the public roots, because the same CLI also talks to commercial
        # endpoints. update-ca-trust has already produced exactly that file: the extracted bundle
        # is every public root plus whatever is in the anchors directory, which now includes the
        # emulator CA. Copying it beats locating certifi inside the container, whose path moves
        # between image builds.
        on_bastion "sudo mkdir -p /opt/azureil6 && sudo cp /etc/pki/ca-trust/extracted/pem/tls-ca-bundle.pem /opt/azureil6/ca-bundle.pem"
        on_bastion "sudo chmod 0644 /opt/azureil6/ca-bundle.pem && echo \"trust bundle: \$(grep -c 'BEGIN CERTIFICATE' /opt/azureil6/ca-bundle.pem) certificates\""
        if ! on_bastion "grep -qFf ${remote_ca} /opt/azureil6/ca-bundle.pem"; then
            echo "ERROR: the emulator CA is not present in the extracted trust bundle."
            exit 1
        fi
        on_bastion "mkdir -p /var/home/core/.azure"

        # The resolver lives on the host's loopback, which a bridged container cannot use: podman
        # rewrites the localhost nameserver to a public one, so the container resolves commercial
        # Azure fine and NXDOMAINs the IL6 namespace. az then falls back to AzureCloud and reports
        # success against the wrong plane. Prove the container sees the split before relying on it.
        if on_bastion "sudo podman run --rm --network host ${AZURE_CLI_IMAGE} getent hosts ${AZURE_IL6_ARM_HOST}"; then
            echo "OK: ${AZURE_IL6_ARM_HOST} resolves inside the az container."
        else
            echo "ERROR: ${AZURE_IL6_ARM_HOST} does not resolve inside the az container, even on"
            echo "the host network. The split resolver works for the host but not for podman."
            exit 1
        fi

        echo "Bastion is ready: split DNS, emulator CA in the trust store, az available under podman."
      env:
      - default: mcr.microsoft.com/azure-cli:latest
        documentation: |-
          Container image providing the az CLI on the bastion. RHCOS has no package manager, so
          the SHIFT article's apt-based install does not apply.
        name: AZURE_CLI_IMAGE
      - default: https://management.azure.microsoft.scloud
        documentation: The emulated IL6 Azure Resource Manager endpoint.
        name: AZURE_IL6_ARM_ENDPOINT
      - default: management.azure.microsoft.scloud
        documentation: Hostname of AZURE_IL6_ARM_ENDPOINT, used for resolver checks.
        name: AZURE_IL6_ARM_HOST
      - default: shift-rhocp-ci-azure-il6.pem
        documentation: |-
          The emulator's CA chain. Delivered as a key/value entry in the azure-qe cluster profile,
          so it needs no separate credential mount.
        name: AZURE_IL6_CA_FILE
      - default: microsoft.scloud
        documentation: |-
          Domain routed to the VNet's own DNS servers. Everything else goes to
          AZURE_IL6_PUBLIC_DNS.
        name: AZURE_IL6_DNS_DOMAIN
      - default: 168.63.129.16
        documentation: |-
          Azure's platform resolver. Reachable from any VNet over a platform route regardless of
          the VNet's custom dnsServers setting, which is what makes the split possible without an
          emulator-side change.
        name: AZURE_IL6_PUBLIC_DNS
      from_image:
        name: "4.19"
        namespace: ocp
        tag: upi-installer
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
    - ref: openshift-cluster-bot-rbac
    - chain: mirror-images-by-oc-adm
    test:
    - as: bastion-az-check
      commands: |
        #!/bin/bash
        set -o nounset
        set -o pipefail

        if ! whoami &>/dev/null && [[ -w /etc/passwd ]]; then
            echo "${USER_NAME:-default}:x:$(id -u):0:${USER_NAME:-default} user:${HOME}:/sbin/nologin" >> /etc/passwd
        fi

        bastion_host="$(<"${SHARED_DIR}/bastion_public_address")"
        bastion_user="$(<"${SHARED_DIR}/bastion_ssh_user")"
        ssh_opts=(-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                  -o ConnectTimeout=30 -i "${CLUSTER_PROFILE_DIR}/ssh-privatekey")

        on_bastion() { ssh "${ssh_opts[@]}" "${bastion_user}@${bastion_host}" "$@"; }

        failures=0
        fail() { echo "FAIL: $*"; failures=$((failures + 1)); }

        # az runs as a container with the emulator CA and a persistent config dir, so that the
        # cloud registration and the login survive across these invocations.
        # --network host is load-bearing. The split-horizon resolver listens on the bastion's
        # 127.0.0.1, so a container on podman's bridge network cannot reach it: inside the
        # container 127.0.0.1 is its own loopback. podman notices the localhost nameserver and
        # substitutes a public resolver, which answers for commercial Azure and NXDOMAINs for
        # *.microsoft.scloud -- so az silently falls back to AzureCloud instead of failing.
        # Sharing the host network namespace makes 127.0.0.1 mean the host's dnsmasq.
        az_run="sudo podman run --rm --network host -v /opt/azureil6:/ca:z -v /var/home/core/.azure:/root/.azure:z"
        az_run="${az_run} -e REQUESTS_CA_BUNDLE=/ca/ca-bundle.pem -e AZURE_CONFIG_DIR=/root/.azure"
        az_env="--env-file /tmp/azil6.env"

        echo "### bastion $(<"${SHARED_DIR}/bastion_public_address")"

        echo
        echo "=== 1/6 az CLI responds on the bastion ==="
        if on_bastion "${az_run} ${AZURE_CLI_IMAGE} az version"; then
            echo "OK"
        else
            fail "az is not runnable on the bastion; nothing below can be tested."
            exit 1
        fi

        echo
        echo "=== 2/6 register and select the emulated cloud ==="
        # Per the SHIFT article. The name is a local az label only -- it is not the SDK's
        # cloudName, so it carries no meaning beyond this CLI config.
        on_bastion "${az_run} ${AZURE_CLI_IMAGE} az cloud register --name ${AZURE_IL6_CLOUD_LABEL} --endpoint-resource-manager '${AZURE_IL6_ARM_ENDPOINT}'" \
            || echo "NOTE: cloud '${AZURE_IL6_CLOUD_LABEL}' already registered; continuing."
        if on_bastion "${az_run} ${AZURE_CLI_IMAGE} az cloud set --name ${AZURE_IL6_CLOUD_LABEL}"; then
            echo "OK: active cloud is ${AZURE_IL6_CLOUD_LABEL}."
        else
            fail "could not select cloud ${AZURE_IL6_CLOUD_LABEL}."
        fi
        on_bastion "${az_run} ${AZURE_CLI_IMAGE} az configure --defaults location=${AZURE_IL6_REGION}" || true

        echo
        echo "=== 3/6 ARM metadata from the emulated endpoint ==="
        if on_bastion "${az_run} ${AZURE_CLI_IMAGE} az cloud show --name ${AZURE_IL6_CLOUD_LABEL} --query 'endpoints.resourceManager' -o tsv"; then
            echo "OK"
        else
            fail "az cannot read back the registered endpoint."
        fi

        echo
        echo "=== 4/6 az login with the azure-qe service principal ==="
        # Deliberately the commercial-plane principal from the cluster profile. Whether the
        # emulator accepts it is exactly what this job is here to find out; if it does not, the
        # job needs a separate IL6 principal in Vault.
        #
        # The secret is written with a quoted heredoc and removed immediately afterwards, so it is
        # never expanded into the log and never lands in ${SHARED_DIR}.
        sp="${CLUSTER_PROFILE_DIR}/osServicePrincipal.json"
        client_id="$(jq -r .clientId "${sp}")"
        tenant_id="$(jq -r .tenantId "${sp}")"
        subscription_id="$(jq -r .subscriptionId "${sp}")"
        echo "clientId ${client_id}, tenant ${tenant_id}, subscription ${subscription_id}"

        {
            echo "AZURE_IL6_APP_ID=${client_id}"
            echo "AZURE_IL6_TENANT=${tenant_id}"
            printf 'AZURE_IL6_SECRET=%s\n' "$(jq -r .clientSecret "${sp}")"
        } > /tmp/azil6.env
        scp "${ssh_opts[@]}" /tmp/azil6.env "${bastion_user}@${bastion_host}:/tmp/azil6.env" >/dev/null
        rm -f /tmp/azil6.env
        on_bastion 'chmod 0600 /tmp/azil6.env'

        login_ok=0
        if on_bastion "${az_run} ${az_env} ${AZURE_CLI_IMAGE} sh -c 'az login --service-principal -u \"\$AZURE_IL6_APP_ID\" -p \"\$AZURE_IL6_SECRET\" --tenant \"\$AZURE_IL6_TENANT\" --output none && echo logged-in'"; then
            login_ok=1
        else
            fail "az login failed with the azure-qe principal."
            echo "  If the emulator runs its own directory, this job needs a dedicated IL6"
            echo "  service principal rather than the commercial-plane one."
        fi

        # A successful login proves nothing on its own. If the cloud registration failed, az is
        # still pointed at AzureCloud, and this principal authenticates there happily -- every
        # query below would then describe commercial Azure while claiming to describe IL6. So
        # confirm which plane we are actually on before reporting anything about it.
        active_cloud=""
        active_arm=""
        if [[ "${login_ok}" -eq 1 ]]; then
            active_cloud="$(on_bastion "${az_run} ${az_env} ${AZURE_CLI_IMAGE} az account show --query environmentName -o tsv" | tr -d '\r')"
            active_arm="$(on_bastion "${az_run} ${az_env} ${AZURE_CLI_IMAGE} az cloud show --query 'endpoints.resourceManager' -o tsv" | tr -d '\r')"
            echo "active cloud: ${active_cloud:-<unknown>}"
            echo "active ARM  : ${active_arm:-<unknown>}"
        fi

        on_emulated_plane=0
        if [[ "${active_arm}" == "${AZURE_IL6_ARM_ENDPOINT}"* ]]; then
            on_emulated_plane=1
            echo "OK: the azure-qe principal authenticates against the EMULATED plane."
        elif [[ "${login_ok}" -eq 1 ]]; then
            fail "az is logged in, but against '${active_cloud}' (${active_arm}), not the emulated plane."
            echo "  This is the commercial plane. Nothing below would say anything about IL6, so"
            echo "  the remaining checks are skipped rather than reported as passing."
        fi

        if [[ "${on_emulated_plane}" -eq 1 ]]; then
            echo
            echo "=== 5/6 list resource groups on the emulated plane ==="
            if on_bastion "${az_run} ${az_env} ${AZURE_CLI_IMAGE} az group list -o table"; then
                echo "OK: the emulated ARM answered a real authenticated query."
            else
                fail "az group list failed after a successful login."
            fi

            echo
            echo "=== 6/6 resources in ${AZURE_IL6_RESOURCE_GROUP} on the emulated plane ==="
            # Specifically this group, not whatever happens to sort first. The emulator fronts the
            # whole commercial subscription, so [0] lands on some unrelated team's group whose
            # resource types the emulated ARM may not even be able to render -- which is how a
            # previous run got 'Bad Request' from groupbshared0805-rg and failed on someone else's
            # resources. The only group this job has any claim on is its own.
            il6_rg_region="$(on_bastion "${az_run} ${az_env} ${AZURE_CLI_IMAGE} az group show -n ${AZURE_IL6_RESOURCE_GROUP} --query location -o tsv" | tr -d '\r')"
            if [[ -z "${il6_rg_region}" ]]; then
                fail "${AZURE_IL6_RESOURCE_GROUP} is not visible through the emulated ARM."
            else
                echo "The emulated plane reports ${AZURE_IL6_RESOURCE_GROUP} in region '${il6_rg_region}'."
                if [[ "${il6_rg_region}" != "${AZURE_IL6_REGION}" ]]; then
                    echo "NOTE: that is not AZURE_IL6_REGION (${AZURE_IL6_REGION}). The emulator"
                    echo "  relabels the commercial region rather than hosting a separate one, so"
                    echo "  '${il6_rg_region}' is what platform.azure.region has to be set to."
                fi
                if on_bastion "${az_run} ${az_env} ${AZURE_CLI_IMAGE} az resource list -g ${AZURE_IL6_RESOURCE_GROUP} -o table"; then
                    echo "OK: the emulated ARM can enumerate resources in the job's own group."
                else
                    fail "az resource list failed for ${AZURE_IL6_RESOURCE_GROUP}."
                fi
            fi
        else
            echo
            echo "=== 5/6, 6/6 skipped: not on the emulated plane ==="
        fi

        # Always remove the credential, including on the failure paths above.
        on_bastion 'rm -f /tmp/azil6.env' || true

        echo
        if [[ "${failures}" -gt 0 ]]; then
            echo "${failures} check(s) failed."
            exit 1
        fi
        echo "az works against the emulated IL6 environment from the bastion."
      env:
      - default: mcr.microsoft.com/azure-cli:latest
        name: AZURE_CLI_IMAGE
      - default: https://management.azure.microsoft.scloud
        name: AZURE_IL6_ARM_ENDPOINT
      - default: SHIFT
        documentation: |-
          Local az cloud label, per the SHIFT article. This is CLI-local configuration and is not
          the SDK cloudName an install-config would use.
        name: AZURE_IL6_CLOUD_LABEL
      - default: usseceast
        documentation: |-
          The emulated IL6 region, set as the az default location. Distinct from the
          commercial-plane region the resource group lives in.
        name: AZURE_IL6_REGION
      from_image:
        name: "4.19"
        namespace: ocp
        tag: upi-installer
      resources:
        requests:
          cpu: 10m
          memory: 100Mi
zz_generated_metadata:
  branch: release-5.1
  org: openshift
  repo: installer
  variant: azure-il6
