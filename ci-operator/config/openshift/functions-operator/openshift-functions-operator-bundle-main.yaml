base_images:
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-5.0
images:
  items:
  - dockerfile_path: bundle.Dockerfile
    to: functions-operator-bundle
releases:
  latest:
    integration:
      name: "4.22"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: validate-bundle
  commands: operator-sdk bundle validate ./bundle --select-optional suite=operatorframework
  container:
    from: operator-sdk
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
- as: e2e-install-aws
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: serverless-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
  steps:
    allow_best_effort_post_steps: true
    test:
    - as: apply-mirror-set
      cli: latest
      commands: |
        oc apply -f .tekton/images-mirror-set.yaml
        # Phase 1: Wait for MCP to START updating (proves MCO picked up the change)
        oc wait mcp master worker --for='condition=Updating=True' --timeout=1m
        # Phase 2: Wait for MCP to FINISH updating
        oc wait mcp master worker --for='condition=Updated=True' --timeout=15m
      from: src
      resources:
        requests:
          cpu: 100m
    - as: install
      cli: latest
      commands: |
        NS="serverless-functions-$(head -c 128 </dev/urandom | LC_CTYPE=C tr -dc 'a-z0-9' | head -c 6)"
        echo "$NS" > "${SHARED_DIR}/test-namespace"
        oc create namespace "$NS"
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n "$NS" "${BUNDLE_IMG}" --verbose
        oc wait --for condition=Available -n "$NS" deployment func-operator-controller-manager --timeout=5m
      dependencies:
      - env: BUNDLE_IMG
        name: functions-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: verify
      cli: latest
      commands: |
        NS=$(cat "${SHARED_DIR}/test-namespace")

        echo "Verifying CRDs..."
        oc get crd functions.functions.dev
        oc get crd objectbucketsources.sources.functions.dev

        echo "Verifying operator pod is running..."
        oc get pods -n "$NS" -l control-plane=controller-manager -o wide
        oc wait --for=condition=Ready pod -n "$NS" -l control-plane=controller-manager --timeout=2m

        echo "Verifying metrics endpoint..."
        oc get service -n "$NS" func-operator-controller-manager-metrics-service
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
zz_generated_metadata:
  branch: bundle-main
  org: openshift
  repo: functions-operator
