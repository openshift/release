build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-5.0
images:
  items:
  - dockerfile_path: Dockerfile
    to: functions-operator
releases:
  latest:
    integration:
      name: "4.22"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: GOFLAGS="" make test
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
- as: lint
  commands: GOFLAGS="" GOLANGCI_LINT_CACHE=/tmp/.cache make lint
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
- as: e2e-deploy-aws
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: serverless-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
  steps:
    allow_best_effort_post_steps: true
    test:
    - as: deploy
      cli: latest
      commands: |
        GOFLAGS="" IMG="${OPERATOR_IMG}" KUBECTL=oc make deploy
        oc wait --for=condition=Ready pod -n func-operator-system -l control-plane=controller-manager --timeout=5m
      dependencies:
      - env: OPERATOR_IMG
        name: functions-operator
      from: src
      resources:
        requests:
          cpu: 100m
    - as: verify
      cli: latest
      commands: |
        echo "Verifying CRDs..."
        oc get crd functions.functions.dev
        oc get crd objectbucketsources.sources.functions.dev

        echo "Verifying operator pod is running..."
        oc get pods -n func-operator-system -l control-plane=controller-manager -o wide

        echo "Verifying metrics endpoint..."
        oc get service -n func-operator-system func-operator-controller-manager-metrics-service
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- as: e2e-functional-aws
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: serverless-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
  steps:
    allow_best_effort_post_steps: true
    allow_skip_on_success: true
    post:
    - as: openshift-must-gather
      best_effort: true
      cli: latest
      commands: oc adm must-gather --dest-dir "${ARTIFACT_DIR}/gather-openshift"
      from: src
      optional_on_success: true
      resources:
        requests:
          cpu: 100m
      timeout: 20m0s
    - as: openshift-gather-extra
      best_effort: true
      cli: latest
      commands: curl -sSL https://raw.githubusercontent.com/openshift/release/main/ci-operator/step-registry/gather/extra/gather-extra-commands.sh
        | /bin/bash -s
      from: src
      grace_period: 1m0s
      optional_on_success: true
      resources:
        requests:
          cpu: 300m
          memory: 300Mi
      timeout: 20m0s
    test:
    - as: deploy
      cli: latest
      commands: |
        GOFLAGS="" IMG="${OPERATOR_IMG}" KUBECTL=oc make deploy
        oc wait --for=condition=Ready pod -n func-operator-system -l control-plane=controller-manager --timeout=5m
      dependencies:
      - env: OPERATOR_IMG
        name: functions-operator
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 30m0s
    - as: prepare
      cli: latest
      commands: GOFLAGS="" INSTALL_KEDA=false ./hack/openshift/prepare-ocp-cluster.sh
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 45m0s
    - as: functional
      cli: latest
      commands: |
        # Build the downstream func CLI from openshift/functions: func cannot
        # be built inside the operator module (the pinned func's pkg/operator
        # needs func-operator API fields this repo's api/v1alpha1 lacks), and
        # the downstream CLI carries the product patches (s2i templates).
        git clone --depth 1 --branch "${PULL_BASE_REF:-main}" https://github.com/openshift/functions.git /tmp/functions
        make -C /tmp/functions build
        # The suite runs kubectl; the step image has only oc, which acts as
        # kubectl when invoked under that name.
        ln -s "$(command -v oc)" "$(dirname "$(command -v oc)")/kubectl"
        GOFLAGS="" FUNC_BIN=/tmp/functions/func ./hack/openshift/run-e2e-tests.sh
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 2h0m0s
    workflow: generic-claim
zz_generated_metadata:
  branch: main
  org: openshift
  repo: functions-operator
