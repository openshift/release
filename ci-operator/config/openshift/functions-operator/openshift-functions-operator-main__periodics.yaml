base_images:
  rebasebot:
    name: rebasebot
    namespace: ci
    tag: latest
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: rebasebot
  cron: 10 12 * * 1-5
  steps:
    test:
    - as: rebasebot
      commands: |
        rebasebot --source https://github.com/functions-dev/func-operator:main \
                  --dest openshift/functions-operator:main \
                  --rebase openshift/functions-operator:rebase-bot-main \
                  --github-app-id 3938801 \
                  --github-app-key /secrets/rebasebot/openshift-rebasebot-key \
                  --github-cloner-id 3938801 \
                  --github-cloner-key /secrets/rebasebot/openshift-rebasebot-key \
                  --git-username "openshift-rebasebot[bot]" \
                  --git-email 289950310+openshift-rebasebot[bot]@users.noreply.github.com \
                  --tag-policy=none \
                  --post-rebase-hook git:dest/main:hack/post-rebase-hook.sh \
                  --title-prefix UPSTREAM-SYNC
      credentials:
      - collection: rebasebot-credentials
        group: secret
        mount_path: /secrets/rebasebot
      from_image:
        name: rebasebot
        namespace: ci
        tag: latest
      resources:
        limits:
          memory: 4Gi
        requests:
          cpu: 400m
          memory: 1Gi
zz_generated_metadata:
  branch: main
  org: openshift
  repo: functions-operator
  variant: periodics
