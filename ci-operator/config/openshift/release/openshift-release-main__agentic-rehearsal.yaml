base_images:
  agentic-validation:
    name: agentic-validation
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: "4.21"
    namespace: ocp
    tag: cli
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.1"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: aws-ipi
  capabilities:
  - intranet
  - nested-podman
  cluster: build03
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    env:
      VALIDATION_COMPONENT: haproxy-router
      VALIDATION_EXECUTE_MODEL: Qwen3.8-27B-FP8
      VALIDATION_EXECUTE_REASONING_EFFORT: low
      VALIDATION_INCLUDE_DIFF: "false"
      VALIDATION_SCOPE: 'NE-2126 / openshift/router#867: validate raw-gzip packaging
        and executable test discovery for the router extension in the installed release.
        Other deliverables of the automation epic are outside this run.'
    test:
    - ref: openshift-agentic-prepare-validation
    - ref: openshift-agentic-validate
    workflow: ipi-aws
- always_run: false
  as: prepare
  capabilities:
  - intranet
  cluster: build03
  optional: true
  steps:
    env:
      VALIDATION_INCLUDE_DIFF: "false"
      VALIDATION_SCOPE: 'NE-2126 / openshift/router#867: validate raw-gzip packaging
        and executable test discovery for the router extension in the installed release.
        Other deliverables of the automation epic are outside this run.'
    test:
    - ref: openshift-agentic-prepare-validation
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: agentic-rehearsal
