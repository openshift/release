base_images:
  agentic-validation:
    namespace: ci
    name: agentic-validation
    tag: latest
build_root:
  image_stream_tag:
    namespace: ocp
    name: '4.21'
    tag: cli
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: '5.1'
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: aws-ipi
  always_run: false
  optional: true
  capabilities:
  - intranet
  - nested-podman
  cluster: build03
  steps:
    cluster_profile: openshift-org-aws
    env:
      EXTENSION_BINARY_PATH: /usr/bin/router-tests-ext.gz
      EXTENSION_SOURCE: openshift:payload:router
      VALIDATION_COMPONENT: haproxy-router
      VALIDATION_SCOPE: 'NE-2126 / openshift/router#867: validate raw-gzip packaging and executable test discovery for the router extension in the installed release. Other deliverables of the automation epic are outside this run.'
    test:
    - ref: openshift-agentic-test-extension
    - ref: openshift-agentic-prepare-validation
    - ref: openshift-agentic-validate
    workflow: ipi-aws
- as: prepare
  always_run: false
  optional: true
  capabilities:
  - intranet
  cluster: build03
  steps:
    env:
      VALIDATION_SCOPE: 'NE-2126 / openshift/router#867: validate raw-gzip packaging and executable test discovery for the router extension in the installed release. Other deliverables of the automation epic are outside this run.'
    test:
    - ref: openshift-agentic-prepare-validation
zz_generated_metadata:
  org: openshift
  repo: release
  branch: main
  variant: agentic-rehearsal
