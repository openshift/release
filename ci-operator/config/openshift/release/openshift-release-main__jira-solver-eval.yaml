base_images:
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  sippy-devcontainer:
    name: sippy
    namespace: ci
    tag: sippy-devcontainer
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: golang-1.22
images:
  items:
  - dockerfile_literal: |
      FROM claude-ai-helpers AS ai-helpers
      FROM nested-podman AS podman
      FROM sippy-devcontainer
      USER root
      RUN dnf install -y podman fuse-overlayfs shadow-utils openssl && dnf clean all
      COPY --from=podman /entrypoint.sh /entrypoint.sh
      RUN setcap cap_setuid+ep /usr/bin/newuidmap && \
          setcap cap_setgid+ep /usr/bin/newgidmap && \
          touch /etc/subgid /etc/subuid && \
          chmod -R g=u /etc/subuid /etc/subgid /etc/passwd /etc/group && \
          chmod +rx /entrypoint.sh
      COPY --from=ai-helpers /opt/ai-helpers /opt/ai-helpers
      RUN mkdir -p /home/vscode/.claude/plugins
      COPY --from=ai-helpers /home/claude/.claude/plugins/known_marketplaces.json \
           /home/vscode/.claude/plugins/known_marketplaces.json
      RUN chgrp -R 0 /opt/ai-helpers /home/vscode/.claude && \
          chmod -R g=u /opt/ai-helpers /home/vscode/.claude
      RUN mkdir -p /workspace && chgrp 0 /workspace && chmod g=u /workspace
      ENV BUILDAH_ISOLATION=chroot
      USER vscode
      WORKDIR /workspace
      ENTRYPOINT ["/entrypoint.sh"]
      CMD ["bash"]
    from: sippy-devcontainer
    inputs:
      claude-ai-helpers:
        as:
        - claude-ai-helpers
      nested-podman:
        as:
        - nested-podman
    to: agentic-dev
  run_if_changed: ^ci-operator/step-registry/openshift/agentic/trt/
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: jira-solver-eval
  capabilities:
  - nested-podman
  run_if_changed: ^ci-operator/step-registry/openshift/agentic/trt/
  steps:
    env:
      ALLOWED_TOOLS: Bash Read Write Edit Grep Glob WebFetch WebSearch Agent LSP Skill
        TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite ToolSearch
      EVAL_CASE: case-001-trt-2698-mcp-tests
      FORK_REPO: openshift-trt/sippy-eval
      GITHUB_APP_TOKEN_OUTPUTS: installation-id:gh-fork-token,installation-id:gh-upstream-token
      SETUP_SCRIPT: hack/agentic_setup.sh
      UPSTREAM_REPO: openshift-trt/sippy-eval
    workflow: openshift-agentic-trt-eval
- as: jira-solver-eval-periodic
  capabilities:
  - nested-podman
  cron: '@yearly'
  steps:
    env:
      ALLOWED_TOOLS: Bash Read Write Edit Grep Glob WebFetch WebSearch Agent LSP Skill
        TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite ToolSearch
      EVAL_CASE: case-001-trt-2698-mcp-tests
      FORK_REPO: openshift-trt/sippy-eval
      GITHUB_APP_TOKEN_OUTPUTS: installation-id:gh-fork-token,installation-id:gh-upstream-token
      SETUP_SCRIPT: hack/agentic_setup.sh
      UPSTREAM_REPO: openshift-trt/sippy-eval
    workflow: openshift-agentic-trt-eval
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: jira-solver-eval
