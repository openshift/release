build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.access.redhat.com/ubi9/python-312@sha256:19e1e927138b40454858f297884c2c4e2f13f5ba95b3f55faea174d3cbb57067
      USER 0
      RUN install -d -o 1001 -g 0 -m 0775 /go
      USER 1001
releases:
  latest:
    release:
      channel: candidate
      version: "4.20"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 256Mi
test_binary_build_commands: python3 --version
tests:
- always_run: false
  as: jobs2-identity
  cluster: build07
  optional: true
  restrict_network_access: true
  steps:
    cluster_profile: gcp-openshift-gce-devel-ci-2
    test:
    - as: check-profile-identity
      commands: |
        #!/bin/bash
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path

        profile = Path(os.environ["CLUSTER_PROFILE_DIR"])
        credentials = json.loads((profile / "gce.json").read_text())
        expected = "ci-provisioner-2@openshift-gce-devel-ci-2.iam.gserviceaccount.com"
        matches = credentials.get("client_email") == expected
        print(json.dumps({"check": "jobs2-profile-identity", "matches_expected_account": matches}))
        if not matches:
            raise SystemExit("Profile identity differs; do not change the proposed account's trust policy")
        print("PASS: Jobs 2 profile uses the expected service account; no cloud authentication attempted")
        PY
      from: test-bin
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 5m0s
- always_run: false
  as: jobs2-gcloud
  cluster: build07
  optional: true
  restrict_network_access: true
  steps:
    cluster_profile: gcp-openshift-gce-devel-ci-2
    test:
    - as: check-gcloud-wif
      cli: latest
      commands: |
        #!/bin/bash
        set -euo pipefail
        python3 - <<'PY'
        import json
        import os
        from pathlib import Path
        profile = Path(os.environ["CLUSTER_PROFILE_DIR"])
        metadata = json.loads((profile / "gce.json").read_text())
        if metadata.get("client_email") != "ci-provisioner-2@openshift-gce-devel-ci-2.iam.gserviceaccount.com":
            raise SystemExit("Jobs 2 profile identity differs from the approved account")
        if (profile / "openshift_gcp_project").read_text().strip() != "openshift-gce-devel-ci-2":
            raise SystemExit("Jobs 2 profile project differs from the approved project")
        print("PASS: existing profile metadata matches; its private key will not be used")
        PY
        namespace=$(oc project -q)
        python3 ci-operator/config/openshift/release/_gcp-federation/gcloud_manifest.py \
          --namespace="${namespace}" --name=gcp-hub-gcloud | oc create -f -
        complete=false
        for attempt in $(seq 1 90); do
          status=$(oc get job gcp-hub-gcloud -o jsonpath='{.status.conditions}')
          if [[ "${status}" == *'"type":"Complete"'* ]]; then
            complete=true
            break
          fi
          if [[ "${status}" == *'"type":"Failed"'* ]]; then
            break
          fi
          sleep 10
        done
        oc logs job/gcp-hub-gcloud -c gcloud-check | tee "${ARTIFACT_DIR}/gcloud-wif.jsonl"
        oc logs job/gcp-hub-gcloud -c aws-bridge | tee "${ARTIFACT_DIR}/aws-bridge.jsonl"
        [[ "${complete}" == true ]]
      from: test-bin
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 20m0s
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: gcp-hub-profile-check
