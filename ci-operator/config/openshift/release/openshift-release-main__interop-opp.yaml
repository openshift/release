build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.access.redhat.com/ubi9/ubi-minimal
      USER 0
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: interop-opp-unique-basenames
  commands: bash hack/verify-interop-opp-unique-basenames.sh
  container:
    from: src
  run_if_changed: ^(ci-operator/step-registry/interop(-tests)?/opp|hack/verify-interop-opp-unique-basenames\.sh).*
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: interop-opp
