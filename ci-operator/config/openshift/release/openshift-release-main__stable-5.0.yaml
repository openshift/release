base_images:
  upi-installer:
    name: "5.0"
    namespace: ocp
    tag: upi-installer
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    release:
      channel: candidate
      version: "5.0"
  latest:
    release:
      channel: candidate
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: opct-platform-external-aws-ccm
  cron: '@weekly'
  reporter_config:
    channel: '#forum-opct-updates'
    job_states_to_report:
    - failure
    - error
    report_template: |
      :red_jenkins_circle: :external-link::aws: Periodical job *{{.Spec.Job}}* ended with *{{.Status.State}}*. (<{{.Status.URL}}|View logs>) (<https://prow.ci.openshift.org/job-history/gs/test-platform-results-public/logs/{{.Spec.Job}}|View history>)
  steps:
    cluster_profile: openshift-org-aws
    env:
      PLATFORM_EXTERNAL_CCM_ENABLED: "yes"
    workflow: opct-conformance-external-aws
  timeout: 8h0m0s
- as: opct-platform-external-aws
  cron: '@weekly'
  reporter_config:
    channel: '#forum-opct-updates'
    job_states_to_report:
    - failure
    - error
    report_template: |
      :red_jenkins_circle: :external-link::aws: Periodical job *{{.Spec.Job}}* ended with *{{.Status.State}}*. (<{{.Status.URL}}|View logs>) (<https://prow.ci.openshift.org/job-history/gs/test-platform-results-public/logs/{{.Spec.Job}}|View history>)
  steps:
    cluster_profile: openshift-org-aws
    workflow: opct-conformance-external-aws
  timeout: 8h0m0s
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: stable-5.0
