base_images:
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: analyze
  capabilities:
  - nested-podman
  cron: '@yearly'
  steps:
    env:
      PAYLOAD_TAG: ""
    workflow: openshift-claude-payload
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: payload-agent
