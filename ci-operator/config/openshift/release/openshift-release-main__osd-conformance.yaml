base_images:
  ocm-cli:
    name: ocm-cli
    namespace: ci
    tag: latest
releases:
  latest:
    release:
      architecture: amd64
      channel: candidate
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: aws-k8s-conformance
  cron: 0 8 1 * *
  reporter_config:
    channel: '#rosa-prow-info'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{- if eq .Status.State "success"}} :green_jenkins_circle: Job
      *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{- else}} :red_jenkins_circle: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs> <@U0AKNPBBVT7> {{- end}}'
  steps:
    cluster_profile: rosa-e2e-01
    env:
      CHANNEL_GROUP: stable
      COMPUTE_NODES: "6"
      OPENSHIFT_VERSION: ""
    workflow: osd-ccs-aws-k8s-conformance
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: osd-conformance
