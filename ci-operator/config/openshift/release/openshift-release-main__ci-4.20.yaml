    cluster_profile: openshift-org-aws
    observers:
      enable:
      - observers-resource-watch
    workflow: openshift-e2e-aws-proxy
- as: e2e-aws-ovn-serial
  interval: 168h
  steps:
    cluster_profile: openshift-org-aws
    observers:
      enable:
      - observers-resource-watch
    workflow: openshift-e2e-aws-ovn-serial
- as: e2e-aws-ovn-techpreview-serial
  interval: 168h
  shard_count: 3
  steps:
    cluster_profile: openshift-org-aws
    env:
      FEATURE_SET: TechPreviewNoUpgrade
    observers:
      enable:
      - observers-resource-watch
    workflow: openshift-e2e-aws-ovn-serial
- as: e2e-aws-ovn-upgrade
  interval: 168h
  steps:
    cluster_profile: openshift-org-aws
    env:
      FAIL_ON_CORE_DUMP: "true"
      TEST_TYPE: upgrade-conformance
    observers:
      enable:
      - observers-resource-watch
    workflow: openshift-upgrade-aws-ovn
- as: e2e-aws-ovn-upgrade-out-of-change
  interval: 168h
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: release:latest
      OPENSHIFT_UPGRADE_RELEASE_IMAGE_OVERRIDE: release:initial
    env:
      FAIL_ON_CORE_DUMP: "true"
      TEST_TYPE: upgrade-conformance
    observers:
      enable:
      - observers-resource-watch
    workflow: openshift-upgrade-aws-ovn
- as: e2e-aws-cilium
  interval: 168h
  steps:
    cluster_profile: openshift-org-aws
    observers:
