base_images:
  claude-runtime:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.22
images:
  items:
  - dockerfile_literal: |
      FROM claude-runtime
      USER root
      # Pin both sides of ai-helpers PR #765; never use the release diff base.
      ENV EVAL_SMOKE_BASE=b3ec8bbc4d7b947fd6f18dd13339d9acbb8c37ce \
          EVAL_SMOKE_HEAD=da76969fe72f0bd8b560383a93d48fa96dc15815
      RUN git config --system --add safe.directory /workspace && \
          git init /workspace && \
          git -C /workspace remote add origin https://github.com/openshift-eng/ai-helpers.git && \
          git -C /workspace fetch --depth=50 origin "$EVAL_SMOKE_BASE" "$EVAL_SMOKE_HEAD" && \
          git -C /workspace checkout --detach "$EVAL_SMOKE_HEAD" && \
          git -C /workspace merge-base --is-ancestor "$EVAL_SMOKE_BASE" HEAD && \
          chown -R 1000:0 /workspace && chmod -R g+rwX /workspace
      COPY hack/claude-agent-eval/workflow-smoke/consumer-env.sh /usr/local/share/manifest-smoke-env.sh
      WORKDIR /workspace
      USER 1000
      RUN test -d .git && test -f evals.yaml && git rev-parse HEAD
      ENV BASH_ENV=/usr/local/share/manifest-smoke-env.sh
    from: claude-runtime
    optional: true
    to: claude-ai-helpers
  skip_if_only_changed: .*
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: "1"
      memory: 4Gi
tests:
- always_run: false
  as: eval-manifest-smoke
  optional: true
  steps:
    env:
      EVAL_WORKDIR: /workspace
    workflow: openshift-claude-agent-eval-manifest
  timeout: 30m0s
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: manifest-smoke-workflow
