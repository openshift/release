build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.24-openshift-4.21
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: agent-model-policy
  commands: ci-operator/model-policy/validate.sh
  container:
    from: src
  run_if_changed: ^ci-operator/(jobs|model-policy|step-registry)/.*
- as: core-valid
  commands: make check-core
  container:
    from: src
- as: services-valid
  commands: make check-services
  container:
    from: src
  run_if_changed: ^services/.*
- as: hyperfleet-risk-scorer-test
  commands: bash hack/hyperfleet/validate-risk-scorer-step.sh
  container:
    from: src
  run_if_changed: ^(ci-operator/step-registry/hyperfleet/risk-scorer/|hack/hyperfleet/validate-risk-scorer-step\.sh).*
- as: rosa-marketplace-release-monitor-test
  commands: bash hack/rosa-marketplace-release-monitor-tests.sh
  container:
    from: src
  run_if_changed: ^(ci-operator/step-registry/rosa/marketplace/release/|hack/rosa-marketplace-release-monitor.*).*
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
