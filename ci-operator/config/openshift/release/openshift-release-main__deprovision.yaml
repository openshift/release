releases:
  latest:
    integration:
      name: "4.19"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: deprovision-aws
  capabilities:
  - aws
  cron: 7 0,4,8,12,16,20 * * *
  reporter_config:
    channel: '#ops-testplatform'
    job_states_to_report:
    - failure
    - error
    report_template: '@aws-ci-admin Job *{{.Spec.Job}}* failed. <{{.Status.URL}}|View
      logs>'
  steps:
    cluster_profile: aws
    test:
    - ref: aws-deprovision-collector
- as: deprovision-aws-2
  capabilities:
