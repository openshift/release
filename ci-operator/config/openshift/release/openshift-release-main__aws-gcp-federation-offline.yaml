build_root:
  project_image:
    dockerfile_path: ci-operator/config/openshift/release/_gcp-federation/Dockerfile
resources:
  '*':
    requests:
      cpu: 100m
      memory: 256Mi
tests:
- always_run: false
  as: unit
  cluster: build07
  optional: true
  restrict_network_access: true
  steps:
    node_architecture: amd64
    test:
    - as: check-offline
      commands: |
        #!/bin/bash
        set -euo pipefail
        export PYTHONDONTWRITEBYTECODE=1
        python3 ci-operator/config/openshift/release/_gcp-federation/test_diagnostic.py
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 10m0s
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: aws-gcp-federation-offline
