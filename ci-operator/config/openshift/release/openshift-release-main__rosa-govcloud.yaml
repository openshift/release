base_images:
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
releases:
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 300Mi
tests:
- as: rosa-govcloud-bridge-test
  cron: 0 */6 * * *
  steps:
    test:
    - ref: rosa-jenkins-ci-shim
- as: rosa-govcloud-s3-test
  cron: 0 0 * * *
  steps:
    test:
    - ref: rosa-jenkins-s3-test
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: rosa-govcloud
