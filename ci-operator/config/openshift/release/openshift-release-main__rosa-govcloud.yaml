base_images:
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
releases:
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 300Mi
tests:
- as: rosa-govcloud-ci-shim-nightly
  # never auto-runs (Feb 31): defined so --target resolves. The real nightly is the
  # labelled raw periodic in core-services/prow/02_config/rosa-govcloud, which the
  # GovCloud reconciler needs (executor label + jenkins-job annotation).
  cron: 0 0 31 2 *
  disable_rehearsal: true
  steps:
    test:
    - ref: rosa-jenkins-ci-shim
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: rosa-govcloud
