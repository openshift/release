base_images:
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
resources:
  '*':
    requests:
      cpu: 500m
      memory: 1Gi
tests:
- as: unit
  commands: bash hack/claude-agent-eval/run-tests.sh
  container:
    clone: true
    from: claude-ai-helpers
  run_if_changed: ^(hack/claude-agent-eval/|ci-operator/step-registry/openshift/claude/agent-eval/manifest/)
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: claude-agent-eval
