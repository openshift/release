prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: storage-checkup-aws
  cron: 0 3 * * 0
  steps:
    cluster_profile: openshift-org-aws
    env:
      CHECKUP_EXPECTED_PROVISIONER: ebs.csi.aws.com
      CHECKUP_EXPECTED_RESULTS: |-
        {
          "vmSnapshot": "(^|\\n)ReadyToUse=true(\\n|$)",
          "vmRestore": "(^|\\n)Complete=true(\\n|$)"
        }
      CHECKUP_JOB_TIMEOUT_SECONDS: "900"
      CHECKUP_NUM_VMS: "10"
      CHECKUP_STORAGE_CLASS: ""
      CHECKUP_TIMEOUT: 10m
      CHECKUP_VMI_TIMEOUT: 3m
      CNV_CATALOG_IMAGE: ""
      CNV_CATALOG_SOURCE: cnv-iib-catalog
      CNV_OPERATOR_CHANNEL: dev-preview
      CNV_VERSION: "4.99"
      COMPUTE_NODE_REPLICAS: "3"
      COMPUTE_NODE_TYPE: m8i.4xlarge
    pre:
    - ref: ipi-conf-cpu-manager
    - chain: ipi-aws-pre
    - ref: cnv-enable-nested-virtualization-aws
    - as: configure-cnv-pull-secret
      cli: latest
      commands: |
        set +x
        set -euo pipefail
        umask 077
        trap 'rm -f /tmp/authfile /tmp/authfile.new /tmp/cnv-update-pull-secret.sh' EXIT
        # Pin the credential-handling helper independently of the selected CNV payload.
        curl --fail --silent --show-error --location \
          https://raw.githubusercontent.com/openshift-cnv/cnv-ci/9c2b160a4e7fbbc93ee399fd49b56c5f8c3b476c/hack/update-pull-secret.sh \
          --output /tmp/cnv-update-pull-secret.sh
        bash /tmp/cnv-update-pull-secret.sh
      credentials:
      - collection: cnv-ci-secrets
        group: cnv-ci-brew-pull-secret
        mount_path: /var/run/cnv-ci-brew-pull-secret
      - collection: virtualization-secrets
        group: konflux-pull-secret
        mount_path: /var/run/cnv-ci-konflux-pull-secret
      env:
      - default: '|7820aea2-0d75-11e7-9259-28d244ea5a6d.hhav.f63e13'
        name: BREW_IMAGE_REGISTRY_USERNAME
      - default: /var/run/cnv-ci-brew-pull-secret/token
        name: BREW_IMAGE_REGISTRY_TOKEN_PATH
      - default: openshift-virtualization+konflux_ro_bot
        name: KONFLUX_REGISTRY_USERNAME
      - default: /var/run/cnv-ci-konflux-pull-secret/token
        name: KONFLUX_REGISTRY_TOKEN_PATH
      from_image:
        name: ocp-qe-perfscale-ci
        namespace: ci
        tag: latest
      grace_period: 1m0s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 5m0s
    - ref: cnv-deploy-cnv
    - ref: cnv-storage-checkup-prepare
    - as: configure-snapshot-boot-sources
      cli: latest
      commands: |
        set -euo pipefail
        storage_class=$(jq -er '.storage_class' "${SHARED_DIR}/cnv-storage-checkup-context.json")
        namespace=openshift-virtualization-os-images
        oc patch storageprofile "${storage_class}" --type=merge \
          -p '{"spec":{"dataImportCronSourceFormat":"snapshot"}}'
        for ((attempt=1; attempt<=40; attempt++)); do
          if oc --request-timeout=30s get storageprofile "${storage_class}" -o json > /tmp/checkup-storage-profile.json &&
             oc --request-timeout=30s -n "${namespace}" get dataimportcrons -o json > /tmp/checkup-data-import-crons.json &&
             oc --request-timeout=30s -n "${namespace}" get datasources -o json > /tmp/checkup-data-sources.json &&
             oc --request-timeout=30s -n "${namespace}" get volumesnapshots -o json > /tmp/checkup-volume-snapshots.json &&
             jq -e --slurpfile sources /tmp/checkup-data-sources.json \
               --slurpfile snapshots /tmp/checkup-volume-snapshots.json '
               (.items | length) > 0 and all(.items[];
                 . as $cron |
                 any($cron.status.conditions[]?;
                   .type == "UpToDate" and .status == "True") and
                 any($sources[0].items[];
                   .metadata.name == $cron.spec.managedDataSource and
                   any(.status.conditions[]?; .type == "Ready" and .status == "True") and
                   ((.spec.source.snapshot.name // "") as $snapshot |
                     $snapshot != "" and
                     any($snapshots[0].items[];
                       .metadata.name == $snapshot and .status.readyToUse == true))))
             ' /tmp/checkup-data-import-crons.json > /dev/null &&
             jq -e '.status.dataImportCronSourceFormat == "snapshot"' \
               /tmp/checkup-storage-profile.json > /dev/null; then
            echo "All managed golden images use ready snapshots on ${storage_class}"
            exit 0
          fi
          sleep 30
        done
        echo "Golden image DataSources did not switch to ready snapshots" >&2
        oc -n "${namespace}" get dataimportcrons,datasources,volumesnapshots >&2
        exit 1
      from_image:
        name: cli-jq
        namespace: ocp
        tag: latest
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
      timeout: 25m0s
    workflow: cnv-storage-checkup-aws
  timeout: 5h0m0s
