base_images:
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
resources:
  '*':
    requests:
      cpu: 10m
      memory: 100Mi
tests:
- as: monitor
  interval: 4h
  steps:
    env:
      MARKETPLACE_PUBLISH_ENABLED: "false"
      OCM_LOGIN_ENV: production
    test:
    - ref: rosa-marketplace-release-detect
    - ref: rosa-marketplace-release-publish
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: rosa-marketplace-release
