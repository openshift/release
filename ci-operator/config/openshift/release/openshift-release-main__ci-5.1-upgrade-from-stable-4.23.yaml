base_images:
  upi-installer:
    name: "5.1"
    namespace: ocp
    tag: upi-installer
  vsphere-ci-python:
    name: vsphere-python
    namespace: ci
    tag: latest
releases:
  initial:
    candidate:
      product: ocp
      stream: ci
      version: "4.23"
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "5.1"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-vsphere-ovn-upgrade
  cron: 23 19 * * 5
  steps:
    cluster_profile: vsphere-elastic
    workflow: openshift-upgrade-vsphere
- as: e2e-aws-ovn-upgrade
  interval: 168h
  steps:
    cluster_profile: openshift-org-aws
    env:
      FAIL_ON_CORE_DUMP: "true"
      TEST_TYPE: upgrade-conformance
    observers:
      enable:
      - observers-resource-watch
    test:
    - ref: openshift-e2e-test-6h
    workflow: openshift-upgrade-aws-ovn
- as: e2e-gcp-ovn-upgrade
  interval: 168h
  steps:
    cluster_profile: openshift-org-gcp
    env:
      FAIL_ON_CORE_DUMP: "true"
      TEST_TYPE: upgrade-conformance
    observers:
      enable:
      - observers-resource-watch
    test:
    - ref: openshift-e2e-test-6h
    workflow: openshift-upgrade-gcp-ovn
- as: e2e-gcp-ovn-rt-upgrade
  interval: 168h
  steps:
    cluster_profile: openshift-org-gcp
    env:
      TEST_TYPE: upgrade-conformance
    observers:
      enable:
      - observers-resource-watch
    workflow: openshift-upgrade-gcp-ovn-rt
- as: e2e-azure-ovn-upgrade
  interval: 168h
  steps:
    cluster_profile: openshift-org-azure
    env:
      CONTROL_PLANE_INSTANCE_TYPE: Standard_D8as_v5
      FAIL_ON_CORE_DUMP: "true"
      TEST_TYPE: upgrade-conformance
    observers:
      enable:
      - observers-resource-watch
    test:
    - ref: openshift-e2e-test-6h
    workflow: openshift-upgrade-azure-ovn
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: ci-5.1-upgrade-from-stable-4.23
