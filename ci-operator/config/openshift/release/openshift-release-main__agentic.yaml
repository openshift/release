base_images:
  builder:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.24-openshift-4.21
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.24-openshift-4.21
images:
  items:
  - dockerfile_literal: |
      FROM claude-ai-helpers AS ai-helpers
      FROM nested-podman AS podman
      FROM builder
      USER root
      RUN dnf install -y 'dnf-command(config-manager)' && \
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo && \
          dnf install -y podman fuse-overlayfs shadow-utils openssl python3-pip python3.12 python3.12-pip jq make git gh && \
          dnf clean all
      RUN useradd --create-home --uid 1000 --gid 0 vscode && \
          git config --system --add safe.directory /workspace && \
          chgrp -R 0 /home/vscode && chmod -R g=u /home/vscode
      COPY --from=podman /entrypoint.sh /entrypoint.sh
      RUN setcap cap_setuid+ep /usr/bin/newuidmap && \
          setcap cap_setgid+ep /usr/bin/newgidmap && \
          touch /etc/subgid /etc/subuid && \
          chmod -R g=u /etc/subuid /etc/subgid /etc/passwd /etc/group && \
          chmod +rx /entrypoint.sh
      RUN mkdir -p /workspace && chgrp 0 /workspace && chmod g=u /workspace
      COPY --from=ai-helpers /opt/ai-helpers /opt/ai-helpers
      RUN mkdir -p /home/vscode/.claude/plugins
      COPY --from=ai-helpers /home/claude/.claude/plugins/known_marketplaces.json /home/vscode/.claude/plugins/known_marketplaces.json
      RUN chgrp -R 0 /opt/ai-helpers /home/vscode/.claude && chmod -R g=u /opt/ai-helpers /home/vscode/.claude
      RUN python3.12 -m pip install --no-cache-dir agentic-ci==0.3.48 pyyaml && \
          ln -sf /usr/bin/python3.12 /usr/local/bin/python3 && \
          ln -sf /usr/bin/pip3.12 /usr/local/bin/pip3
      ENV BUILDAH_ISOLATION=chroot
      USER vscode
      WORKDIR /workspace
      ENTRYPOINT ["/entrypoint.sh"]
      CMD ["bash"]
    from: builder
    inputs:
      claude-ai-helpers:
        as:
        - claude-ai-helpers
      nested-podman:
        as:
        - nested-podman
    to: agentic-dev
  run_if_changed: ^(ci-operator/step-registry/openshift/agentic/dptp/|hack/agentic_setup\.sh|\.agentic/)
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: periodic-jira-agent
  capabilities:
  - nested-podman
  cron: '@yearly'
  steps:
    env:
      ALLOWED_TOOLS: Bash Read Write Edit Grep Glob WebFetch WebSearch Agent LSP Skill
        TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite ToolSearch
      FORK_REPO: openshift-dptp/release
      SETUP_SCRIPT: hack/agentic_setup.sh
      UPSTREAM_REPO: openshift/release
    workflow: openshift-agentic-dptp-jira-solver
- as: periodic-pr-followup-agent
  capabilities:
  - nested-podman
  cron: '@yearly'
  steps:
    env:
      ALLOWED_TOOLS: Bash Read Write Edit Grep Glob WebFetch WebSearch Agent LSP Skill
        TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite ToolSearch
      FORK_REPO: openshift-dptp/release
      SETUP_SCRIPT: hack/agentic_setup.sh
      UPSTREAM_REPO: openshift/release
    workflow: openshift-agentic-dptp-pr-followup
zz_generated_metadata:
  branch: main
  org: openshift
  repo: release
  variant: agentic
