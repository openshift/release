build_root:
  image_stream_tag:
    name: ci-tools-build-root
    namespace: ci
    tag: latest
images:
  items:
  - dockerfile_path: prow/Dockerfile
    to: openshift-svt-reliability-v2
  - dockerfile_path: prow/Dockerfile
    to: openshift-svt-regression
promotion:
  to:
  - namespace: ci
    tag: latest
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: master
  org: openshift
  repo: svt
