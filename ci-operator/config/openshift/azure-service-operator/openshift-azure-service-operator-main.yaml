base_images:
  commitchecker:
    name: commitchecker
    namespace: ci
    tag: latest
binary_build_commands: make binaries
build_root:
  from_repository: true
canonical_go_repository: github.com/Azure/azure-service-operator
images:
  items:
  - dockerfile_path: openshift/Dockerfile
    to: azure-service-operator
promotion:
  to:
  - name: "5.1"
    namespace: ocp
prowgen:
  disable_sparse_checkout: true
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: openshift/unit-tests.sh
tests:
- always_run: false
  as: e2e-azure-ovn-techpreview
  pipeline_skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-azure
    env:
      FEATURE_SET: TechPreviewNoUpgrade
    workflow: openshift-e2e-azure
- always_run: false
  as: e2e-azure-capi-techpreview
  pipeline_skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-azure
    env:
      FEATURE_SET: TechPreviewNoUpgrade
    test:
    - as: test
      commands: openshift/e2e-tests.sh
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: openshift-e2e-azure
- as: unit
  commands: openshift/unit-tests.sh
  container:
    from: src
- as: verify-commits
  commands: |
    set -euo pipefail
    start=$(jq -er '
      . as $job |
      [.refs, .extra_refs[]?] |
      map(select(.org == "openshift" and .repo == "azure-service-operator")) |
      if length != 1 then error("Expected exactly one azure-service-operator refs entry") else .[0] end |
      if (.pulls // [] | length) > 0 then
        .base_sha | select(type == "string" and test("^[0-9a-f]{40}$"))
      elif $job.type == "presubmit" and ($job.job | startswith("rehearse-")) and
           $job.refs.org == "openshift" and $job.refs.repo == "release" and
           .workdir == true and .base_ref == "main" then
        "refs/heads/main"
      else error("Expected ASO pull requests or a release rehearsal of ASO main") end
    ' <<< "${JOB_SPEC:?JOB_SPEC must identify the ASO checkout}")
    git rev-parse --verify "${start}^{commit}"
    if [[ "$start" == refs/heads/main ]]; then
      if [[ "$(git rev-parse "$start")" != "$(git rev-parse HEAD)" ]]; then
        echo "ASO rehearsal checkout differs from main; refusing an empty commit range" >&2
        exit 1
      fi
      echo "No ASO pull requests in this release rehearsal; checking the empty main..HEAD range"
    fi
    commitchecker --start "$start"
  container:
    from: commitchecker
  optional: true
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
zz_generated_metadata:
  branch: main
  org: openshift
  repo: azure-service-operator
