base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  ocm-cli:
    name: ocm-cli
    namespace: ci
    tag: latest
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
  rosa-e2e:
    name: rosa-e2e
    namespace: ci
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.control-plane
    to: hypershift
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: rosa-hcp-e2e-staging-stable-5-0-cpo
  cron: 0 0 31 2 *
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: rosa-e2e-01
    env:
      CHANNEL_GROUP: stable
      CLUSTER_SECTOR: hypershift-ci
      ENABLE_BILLING_ACCOUNT: "yes"
      ENABLE_BYOVPC: "true"
      HOSTED_CP: "true"
      LABEL_FILTER: Platform:HCP
      OCM_LOGIN_ENV: staging
      OPENSHIFT_VERSION: "5.0"
      REGION: us-west-2
      REPLICAS: "3"
    post:
    - chain: rosa-e2e-hcp-cleanup
    pre:
    - ref: rosa-operator-push-cpo-image
    - ref: aws-provision-vpc-shared
    - ref: aws-provision-tags-for-byo-vpc-ocm-pre
    - chain: rosa-sts-oidc-config-create
    - ref: rosa-cluster-provision
    - ref: rosa-operator-override-cpo-image
    - ref: rosa-cluster-wait-ready-cluster
    - ref: rosa-cluster-notify-error
    - ref: rosa-conf-idp-htpasswd
    - ref: rosa-cluster-wait-ready-operators
    - ref: aws-provision-tags-for-byo-vpc
    - ref: rosa-cluster-wait-ready-hosted-cp
    - ref: rosa-cluster-wait-ready-nodes
    - ref: rosa-cluster-credentials-hypershift-mgmt
    workflow: rosa-e2e-hcp
  timeout: 3h0m0s
zz_generated_metadata:
  branch: release-5.0
  org: openshift
  repo: hypershift
  variant: rosa-e2e
