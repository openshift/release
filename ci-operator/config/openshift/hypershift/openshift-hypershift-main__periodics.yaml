base_images:
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  cli:
    name: "5.1"
    namespace: ocp
    tag: cli
  hypershift-operator:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
  hypershift-operator-4-22:
    name: hypershift-operator
    namespace: hypershift
    tag: "4.22"
  hypershift-tests:
    name: hypershift-tests
    namespace: hypershift
    tag: latest
  upi-installer:
    name: "5.1"
    namespace: ocp
    tag: upi-installer
releases:
  initial:
    candidate:
      product: ocp
      relative: 1
      stream: ci
      version: "5.1"
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "5.1"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-aks-capi-storage-migration
  cron: 0 4 * * 1-5
  steps:
    cluster_profile: hypershift-aks
    dependencies:
      HYPERSHIFT_RELEASE_LATEST: hypershift-operator-4-22
    env:
      AUTH_THROUGH_CERTS: "true"
      ENABLE_HYPERSHIFT_CERT_ROTATION_SCALE: "true"
      HYPERSHIFT_AZURE_LOCATION: centralus
      INSTALL_FROM_LATEST: "true"
    post:
    - ref: hypershift-analyze-e2e-failure
    - chain: cucushift-installer-rehearse-azure-aks-deprovision
    workflow: hypershift-azure-aks-e2e-capi-migration
- as: e2e-aws-capi-storage-migration
  cron: 0 4 * * 1-5
  steps:
    cluster_profile: hypershift-aws
    dependencies:
      HYPERSHIFT_RELEASE_LATEST: hypershift-operator-4-22
    env:
      ENABLE_HYPERSHIFT_CERT_ROTATION_SCALE: "true"
      INSTALL_FROM_LATEST: "true"
    post:
    - ref: hypershift-analyze-e2e-failure
    - chain: hypershift-destroy-nested-management-cluster
    workflow: hypershift-aws-e2e-nested-capi-migration
- as: e2e-kubevirt-aws-capi-storage-migration
  cron: 0 4 * * 1-5
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      HYPERSHIFT_RELEASE_LATEST: hypershift-operator-4-22
    env:
      COMPUTE_NODE_REPLICAS: "1"
      COMPUTE_NODE_TYPE: c5n.metal
      ENABLE_HYPERSHIFT_CERT_ROTATION_SCALE: "true"
      ETCD_STORAGE_CLASS: gp3-csi
      INSTALL_FROM_LATEST: "true"
    post:
    - ref: hypershift-analyze-e2e-failure
    - chain: hypershift-dump
    - chain: gather-core-dump
    - chain: ipi-aws-post
    workflow: hypershift-kubevirt-e2e-aws-capi-migration
zz_generated_metadata:
  branch: main
  org: openshift
  repo: hypershift
  variant: periodics
