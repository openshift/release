base_images:
  cli:
    name: "5.1"
    namespace: ocp
    tag: cli
  hypershift-operator:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
  hypershift-operator-4-22:
    name: hypershift-operator
    namespace: hypershift
    tag: "4.22"
  hypershift-tests:
    name: hypershift-tests
    namespace: hypershift
    tag: latest
  upi-installer:
    name: "5.1"
    namespace: ocp
    tag: upi-installer
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    candidate:
      product: ocp
      relative: 1
      stream: ci
      version: "5.1"
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "5.1"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-aws-capi-storage-migration
  cron: 0 4 * * 1-5
  steps:
    cluster_profile: hypershift-aws
    dependencies:
      HYPERSHIFT_RELEASE_LATEST: hypershift-operator-4-22
    env:
      ENABLE_HYPERSHIFT_CERT_ROTATION_SCALE: "true"
      INSTALL_FROM_LATEST: "true"
    post:
    - chain: hypershift-destroy-nested-management-cluster
    workflow: hypershift-aws-e2e-nested-capi-migration
zz_generated_metadata:
  branch: main
  org: openshift
  repo: hypershift
  variant: periodics
