base_images:
  base:
    name: ubi
    namespace: ocp
    tag: "8"
  openshift_release_golang-1.23:
    name: release
    namespace: openshift
    tag: golang-1.23
build_root:
  from_repository: true
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: |
  go mod download
tests:
- as: lint
  commands: |
    GOMAXPROCS=2 make lint
  container:
    from: test-bin
- as: format
  commands: |
    make format
  container:
    from: test-bin
- as: test
  commands: |
    make test
  container:
    from: test-bin
- as: build
  commands: |
    SINGLE_TARGET=true make ci-build
  container:
    from: test-bin
- as: verify-docs
  commands: |
    make verify-docs
  container:
    from: test-bin
zz_generated_metadata:
  branch: master
  org: openshift
  repo: osdctl
