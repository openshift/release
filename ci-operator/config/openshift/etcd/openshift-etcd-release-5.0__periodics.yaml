releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: "4"
      memory: 3Gi
tests:
- as: perfscale-etcd-db-quota-8gb-control-plane-6nodes
  cron: 0 20 * * 5
  reporter_config:
    channel: '#ocp-qe-scale-ci-results'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :white_check_mark:
      {{else}} :warning:  Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :warning: {{end}}'
  steps:
    cluster_profile: openshift-org-aws
    env:
      ADDITIONAL_WORKER_NODES: "3"
      BASE_DOMAIN: qe.devcluster.openshift.com
      CD_V2_EXTRA_FLAGS: --churn-duration=20m --pod-ready-threshold=20s --service-latency
      CDV2_ITERATION_MULTIPLIER: "15"
      CONTROL_PLANE_INSTANCE_TYPE: r5.2xlarge
      DB_QUOTA_ITERATIONS: "8000"
      DB_QUOTA_ITERATIONS_PER_NAMESPACE: "1250"
      ENABLE_LAYER_3: "false"
      ES_TYPE: qe
      IGNORE_JOB_ITERATIONS: "true"
      KB_CHUNKS: "8"
      KB_FLAGS: --local-indexing
      KB_SIZE: "100"
      ND_CNI_EXTRA_FLAGS: --churn-mode=objects --churn-delay=1m --churn-percent=50
        --churn-cycles=2
      ND_EXTRA_FLAGS: --churn-mode=objects --churn-delay=1m --churn-percent=50 --churn-cycles=2
      OUTPUT_FORMAT: JUNIT
      RUN_ORION: deferred
      UDN_ITERATION_MULTIPLIER: "12"
      VERSION: "5.0"
      ZONES_COUNT: "3"
    test:
    - ref: openshift-qe-workers-scale
    - ref: openshift-qe-etcd-density-db-quota-pressure
    - chain: openshift-qe-control-plane
    - chain: openshift-qe-orion-consolidated
    workflow: openshift-qe-installer-aws
- as: perfscale-etcd-db-quota-16gb-control-plane-6nodes
  cron: 0 20 * * 0
  reporter_config:
    channel: '#ocp-qe-scale-ci-results'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :white_check_mark:
      {{else}} :warning:  Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :warning: {{end}}'
  steps:
    cluster_profile: openshift-org-aws
    env:
      ADDITIONAL_WORKER_NODES: "3"
      BASE_DOMAIN: qe.devcluster.openshift.com
      CD_V2_EXTRA_FLAGS: --churn-duration=20m --pod-ready-threshold=20s --service-latency
      CDV2_ITERATION_MULTIPLIER: "15"
      CONTROL_PLANE_INSTANCE_TYPE: m5.8xlarge
      DB_QUOTA_ITERATIONS: "16000"
      DB_QUOTA_ITERATIONS_PER_NAMESPACE: "1250"
      ENABLE_LAYER_3: "false"
      ES_TYPE: qe
      ETCD_BACKEND_QUOTA_GIB: "16"
      IGNORE_JOB_ITERATIONS: "true"
      KB_CHUNKS: "8"
      KB_FLAGS: --local-indexing
      KB_SIZE: "100"
      ND_CNI_EXTRA_FLAGS: --churn-mode=objects --churn-delay=1m --churn-percent=50
        --churn-cycles=2
      ND_EXTRA_FLAGS: --churn-mode=objects --churn-delay=1m --churn-percent=50 --churn-cycles=2
      OPENSHIFT_INFRA_NODE_INSTANCE_TYPE: r5.2xlarge
      OUTPUT_FORMAT: JUNIT
      RUN_ORION: deferred
      SET_ENV_BY_PLATFORM: custom
      UDN_ITERATION_MULTIPLIER: "12"
      VERSION: "5.0"
      ZONES_COUNT: "3"
    test:
    - ref: openshift-qe-workers-scale
    - ref: openshift-qe-etcd-set-backend-quota
    - ref: openshift-qe-etcd-density-db-quota-pressure
    - chain: openshift-qe-control-plane
    - chain: openshift-qe-orion-consolidated
    workflow: openshift-qe-installer-aws
zz_generated_metadata:
  branch: release-5.0
  org: openshift
  repo: etcd
  variant: periodics
