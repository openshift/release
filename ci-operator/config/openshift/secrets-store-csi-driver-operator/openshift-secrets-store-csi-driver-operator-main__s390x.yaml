base_images:
  cli:
    name: "5.1"
    namespace: ocp
    tag: cli
  libvirt-installer:
    name: "5.1"
    namespace: ocp
    tag: libvirt-installer
  secrets-store-csi-driver-test:
    name: "5.1"
    namespace: ocp
    tag: secrets-store-csi-driver-test
  upi-installer:
    name: "5.1"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-5.0
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "5.1"
  s390x-latest:
    candidate:
      architecture: s390x
      product: ocp
      stream: nightly
      version: "5.1"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: operator-e2e-vault-weekly
  capabilities:
  - intranet
  cron: '@weekly'
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: libvirt-s390x-vpn
    dependencies:
      OPENSHIFT_INSTALL_TARGET: release:s390x-latest
    env:
      ARCH: s390x
      BRANCH: "5.1"
      ETCD_DISK_SPEED: slow
      NODE_TUNING: "true"
      USE_EXTERNAL_DNS: "true"
    test:
    - ref: openshift-e2e-libvirt-s390x-csi-secrets-store-setup-fbc
    - ref: openshift-e2e-libvirt-s390x-csi-secrets-store-test-vault
    workflow: openshift-e2e-libvirt-vpn
zz_generated_metadata:
  branch: main
  org: openshift
  repo: secrets-store-csi-driver-operator
  variant: s390x
