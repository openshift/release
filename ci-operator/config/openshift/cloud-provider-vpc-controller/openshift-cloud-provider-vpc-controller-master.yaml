binary_build_commands: make build-linux
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-8-release-golang-1.17-openshift-4.11
canonical_go_repository: github.com/IBM-Cloud/cloud-provider-vpc-controller
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: vet
  commands: make vet
  container:
    from: src
zz_generated_metadata:
  branch: master
  org: openshift
  repo: cloud-provider-vpc-controller
