build_root:
  image_stream_tag:
    name: ols-python-build-root
    namespace: ocp
    tag: python-3.12
resources:
  '*':
    limits:
      memory: 2Gi
    requests:
      cpu: 100m
      memory: 2Gi
tests:
- as: unit-test-arm64
  capabilities:
  - arm64
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make install-uv && make install && make test
  container:
    from: src
  node_architecture: arm64
  optional: true
  secret:
    collection: openshift-lightspeed-service-creds
    group: ols-agentic-sandbox-codecov-token
    mount_path: /tmp/secret
  skip_if_only_changed: ^docs/|\.md$|^\.ols/|^evals/|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
zz_generated_metadata:
  branch: main
  org: openshift
  repo: lightspeed-agentic-sandbox
  variant: arm64
