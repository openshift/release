base_images:
  base:
    name: "5.0"
    namespace: ocp
    tag: base-rhel9
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
  ocp_builder_rhel-9-golang-1.25-openshift-4.22:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.25-openshift-4.22
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.25-openshift-4.22
images:
  items:
  - dockerfile_path: Dockerfile
    from: base
    inputs:
      ocp_builder_rhel-9-golang-1.25-openshift-4.22: {}
    to: tls-scanner-tool
promotion:
  to:
  - disabled: true
    name: "5.0"
    namespace: ocp
releases:
  initial:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
  tls-scanner-run:
    limits:
      cpu: "4"
      memory: 4Gi
    requests:
      cpu: "4"
      memory: 4Gi
tests:
- as: periodic-tls13-adherence-metal-ipv6
  interval: 24h
  reporter_config:
    channel: '#forum-case'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :warning:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  steps:
    cluster_profile: equinix-ocp-metal
    env:
      DEVSCRIPTS_CONFIG: |
        IP_STACK=v6
        NETWORK_TYPE=OVNKubernetes
      PQC_CHECK: "false"
      SCANNER_CPU_LIMIT: "4"
      SCANNER_CPU_REQUEST: 500m
      SCANNER_MEM_LIMIT: 4Gi
      SCANNER_MEM_REQUEST: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - ref: tls-13
    - ref: tls-scanner-mirror
    - ref: tls-scanner-run
    workflow: baremetalds-e2e
zz_generated_metadata:
  branch: main
  org: openshift
  repo: tls-scanner
  variant: 5.0-periodics
