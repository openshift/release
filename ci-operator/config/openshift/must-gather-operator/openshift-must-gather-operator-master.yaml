base_images:
  base-rhel9:
    name: "5.1"
    namespace: ocp
    tag: base-rhel9
  cli-operator-sdk:
    name: cli-operator-sdk
    namespace: ocp
    tag: v1.39.2
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
binary_build_commands: make go-build
build_root:
  from_repository: true
images:
  items:
  - dockerfile_literal: |-
      FROM registry.access.redhat.com/ubi9/go-toolset
      USER 0
      RUN dnf install -y git make jq openssl python3 && \
          dnf install -y 'dnf-command(config-manager)' && \
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo && \
          dnf install -y gh && \
          dnf clean all
      RUN dnf module reset -y nodejs && \
          dnf module enable -y nodejs:20 && \
          dnf install -y nodejs npm && \
          npm install -g @anthropic-ai/claude-code && \
          dnf clean all
      RUN go install golang.org/x/tools/cmd/goimports@v0.33.0 && \
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.1.6/install.sh | sh -s -- -b /usr/local/bin v2.1.6
      WORKDIR /app
      RUN git clone --depth 1 https://github.com/openshift-eng/oape-ai-e2e.git /tmp/oape && \
          cp -r /tmp/oape/scripts /app/scripts && \
          cp -r /tmp/oape/plugins /plugins && \
          mkdir -p /config && cp -r /tmp/oape/deploy/config/* /config/ && \
          rm -rf /tmp/oape
      RUN git config --global user.name "openshift-app-platform-shift-bot" && \
          git config --global user.email "267347085+openshift-app-platform-shift-bot@users.noreply.github.com"
      RUN chmod -R g=u /opt/app-root/src /config
      USER 1001
    to: review-handler-agent
  - dockerfile_path: Dockerfile.openshift
    from: base-rhel9
    to: must-gather-operator
  - dockerfile_path: images/ci/Dockerfile.coverage
    to: must-gather-operator-coverage
operator:
  bundles:
  - as: must-gather-operator-bundle
    context_dir: bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: quay.io/openshift/origin-support-log-gather-operator:latest
    with: pipeline:must-gather-operator
  - pullspec: quay.io/openshift/origin-must-gather:latest
    with: stable:must-gather
promotion:
  to:
  - excluded_images:
    - review-handler-agent
    name: "5.1"
    namespace: ocp
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
  multi-latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "5.1"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: make e2e-binary-build
tests:
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "true"
    test:
    - ref: go-verify-deps
- as: coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  secret:
    mount_path: /tmp/secret
    name: must-gather-operator-codecov-token
- as: publish-coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  postsubmit: true
  secret:
    mount_path: /tmp/secret
    name: must-gather-operator-codecov-token
- as: lint
  commands: make lint
  container:
    from: src
- as: test
  commands: make test
  container:
    from: src
- as: validate-boilerplate
  commands: make validate
  container:
    from: src
  optional: true
- as: e2e-gcp-operator
  steps:
    cluster_profile: openshift-org-gcp
    dependencies:
      OO_BUNDLE: must-gather-operator-bundle
    env:
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: must-gather-operator
    test:
    - as: install
      cli: latest
      commands: |
        oc -n must-gather-operator rollout status deployment must-gather-operator
      dependencies:
      - env: OO_BUNDLE
        name: must-gather-operator-bundle
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        export CASE_MANAGEMENT_CREDS_CONFIG_DIR=/var/run/secrets/must-gather-operator/case-management-creds
        make test-e2e
      credentials:
      - mount_path: /var/run/secrets/must-gather-operator/case-management-creds
        name: case-management-creds
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: optional-operators-ci-operator-sdk-gcp
- as: e2e-hypershift-operator
  cron: '@weekly'
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_BUNDLE: must-gather-operator-bundle
      RELEASE_IMAGE_LATEST: release:multi-latest
    env:
      HYPERSHIFT_SKIP_VERSION_VALIDATION: "true"
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: must-gather-operator
    test:
    - as: install
      cli: latest
      commands: |
        oc -n must-gather-operator rollout status deployment must-gather-operator
      dependencies:
      - env: OO_BUNDLE
        name: must-gather-operator-bundle
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        export CASE_MANAGEMENT_CREDS_CONFIG_DIR=/var/run/secrets/must-gather-operator/case-management-creds
        make test-e2e
      credentials:
      - mount_path: /var/run/secrets/must-gather-operator/case-management-creds
        name: case-management-creds
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: optional-operators-ci-operator-sdk-hypershift
- always_run: false
  as: e2e-operator-coverage
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: hack/e2e-coverage.sh collect
      credentials:
      - mount_path: /var/run/secrets/must-gather-operator/ci-secrets
        name: must-gather-operator-codecov-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    - chain: gather
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace must-gather-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n must-gather-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n must-gather-operator deployment must-gather-operator
      dependencies:
      - env: OO_BUNDLE
        name: must-gather-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: setup-coverage
      cli: latest
      commands: hack/e2e-coverage.sh setup
      dependencies:
      - env: COVERAGE_IMAGE
        name: must-gather-operator-coverage
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        export CASE_MANAGEMENT_CREDS_CONFIG_DIR=/var/run/secrets/must-gather-operator/case-management-creds
        make test-e2e
      credentials:
      - mount_path: /var/run/secrets/must-gather-operator/case-management-creds
        name: case-management-creds
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- as: publish-e2e-coverage
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  postsubmit: true
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: hack/e2e-coverage.sh collect
      credentials:
      - mount_path: /var/run/secrets/must-gather-operator/ci-secrets
        name: must-gather-operator-codecov-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    - chain: gather
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace must-gather-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n must-gather-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n must-gather-operator deployment must-gather-operator
      dependencies:
      - env: OO_BUNDLE
        name: must-gather-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: setup-coverage
      cli: latest
      commands: hack/e2e-coverage.sh setup
      dependencies:
      - env: COVERAGE_IMAGE
        name: must-gather-operator-coverage
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        export CASE_MANAGEMENT_CREDS_CONFIG_DIR=/var/run/secrets/must-gather-operator/case-management-creds
        make test-e2e
      credentials:
      - mount_path: /var/run/secrets/must-gather-operator/case-management-creds
        name: case-management-creds
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- always_run: false
  as: e2e-gcp-operator-rhcos10-fips
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    dependencies:
      OO_BUNDLE: must-gather-operator-bundle
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      FIPS_ENABLED: "true"
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: must-gather-operator
      OSSTREAM: rhel-10
    test:
    - as: install
      cli: latest
      commands: |
        oc -n must-gather-operator rollout status deployment must-gather-operator
      from: src
      resources:
        requests:
          cpu: 100m
    - ref: fips-check-fips-or-die
    - as: test
      cli: latest
      commands: |
        export CASE_MANAGEMENT_CREDS_CONFIG_DIR=/var/run/secrets/must-gather-operator/case-management-creds
        make test-e2e
      credentials:
      - mount_path: /var/run/secrets/must-gather-operator/case-management-creds
        name: case-management-creds
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: optional-operators-ci-operator-sdk-gcp
- always_run: false
  as: e2e-gcp-operator-rhcos10
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    dependencies:
      OO_BUNDLE: must-gather-operator-bundle
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: must-gather-operator
      OSSTREAM: rhel-10
    test:
    - as: install
      cli: latest
      commands: |
        oc -n must-gather-operator rollout status deployment must-gather-operator
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        export CASE_MANAGEMENT_CREDS_CONFIG_DIR=/var/run/secrets/must-gather-operator/case-management-creds
        make test-e2e
      credentials:
      - mount_path: /var/run/secrets/must-gather-operator/case-management-creds
        name: case-management-creds
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: optional-operators-ci-operator-sdk-gcp
- always_run: false
  as: oape-review-handler
  optional: true
  steps:
    test:
    - ref: oape-review-handler
zz_generated_metadata:
  branch: master
  org: openshift
  repo: must-gather-operator
