- always_run: false
  as: tls-pqc-readiness
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_BUNDLE: must-gather-operator-bundle
    env:
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: must-gather-operator
      OO_SECURITY_CONTEXT: restricted
      PQC_CHECK: "true"
      SCAN_NAMESPACE: must-gather-operator
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
    test:
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: optional-operators-ci-operator-sdk-aws
- as: tls-pqc-readiness-periodic
  cron: 0 6 * * 1
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_BUNDLE: must-gather-operator-bundle
    env:
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: must-gather-operator
      OO_SECURITY_CONTEXT: restricted
      PQC_CHECK: "true"
      SCAN_NAMESPACE: must-gather-operator
