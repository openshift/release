- always_run: false
  as: oape-review-handler
  optional: true
  steps:
    test:
    - ref: oape-review-handler
- as: periodic-jira-agent
  cron: 0 9 * * *
  steps:
    env:
      JIRA_AGENT_MAX_ISSUES: "1"
    workflow: must-gather-jira-agent
- as: periodic-review-agent
  cron: '@yearly'
  steps:
    workflow: must-gather-review-agent
- always_run: false
  as: address-review-comments
  optional: true
  skip_if_only_changed: .*
  steps:
