base_images:
  tests-private:
    name: tests-private
    namespace: ci
    tag: "5.0"
  virtctl:
    name: "5.0"
    namespace: ocp
    tag: virtctl
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.openshift
    to: vsphere-csi-driver-operator
  - dockerfile_path: Dockerfile.test
    from: src
    to: vsphere-csi-driver-operator-test
promotion:
  to:
  - name: "5.0"
    namespace: ocp
releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: make test-unit
  container:
    from: src
- as: verify
  commands: make verify
  container:
    from: src
- always_run: false
  as: e2e-vsphere
  steps:
    cluster_profile: vsphere-elastic
    workflow: openshift-e2e-vsphere
- always_run: false
  as: e2e-vsphere-operator-test
  steps:
    cluster_profile: vsphere-elastic
    test:
    - as: test
      cli: latest
      commands: |
        make operator-e2e-test
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-vsphere
- always_run: false
  as: e2e-vsphere-csi
  steps:
    cluster_profile: vsphere-elastic
    workflow: openshift-e2e-vsphere-csi
- always_run: false
  as: e2e-vsphere-ovn-hybrid-env
  optional: true
  steps:
    cluster_profile: vsphere-elastic
    env:
      FEATURE_GATES: '["VSphereMixedNodeEnv=true"]'
      FEATURE_SET: CustomNoUpgrade
      NETWORK_TYPE: multi-tenant
    workflow: openshift-e2e-vsphere-hybrid-env
- always_run: false
  as: e2e-vsphere-csi-hybrid-env
  optional: true
  steps:
    cluster_profile: vsphere-elastic
    env:
      FEATURE_GATES: '["VSphereMixedNodeEnv=true"]'
      FEATURE_SET: CustomNoUpgrade
      NETWORK_TYPE: multi-tenant
    workflow: openshift-e2e-vsphere-csi-hybrid
- always_run: false
  as: e2e-vsphere-ovn-upgrade
  steps:
    cluster_profile: vsphere-elastic
    workflow: openshift-upgrade-vsphere
- always_run: false
  as: e2e-vsphere-csi-extended
  optional: true
  steps:
    cluster_profile: vsphere-elastic
    env:
      TEST_SCENARIOS: \[CSI-Driver\]|\[vSphere CSI Driver\]|\[vSphere-CSI-Driver-Operator\]
    workflow: openshift-e2e-vsphere-csi-extended
- always_run: false
  as: e2e-vsphere-csi-vcf9
  steps:
    cluster_profile: vsphere-elastic
    env:
      ENABLE_LONG_CSI_CERTIFICATION_TESTS: "true"
      POOL_SELECTOR: vsphere-type=vcf9
    workflow: openshift-e2e-vsphere-csi
- as: verify-deps
  steps:
    test:
    - ref: go-verify-deps
- as: security
  optional: true
  steps:
    env:
      PROJECT_NAME: vmware-vsphere-csi-driver-operator
    workflow: openshift-ci-security
- always_run: false
  as: e2e-vsphere-zones
  optional: true
  steps:
    cluster_profile: vsphere-elastic
    workflow: openshift-e2e-vsphere-zones
- always_run: false
  as: tls-scanner-vsphere
  optional: true
  steps:
    cluster_profile: vsphere-elastic
    env:
      SCAN_NAMESPACE: openshift-cluster-storage-operator,openshift-cluster-csi-drivers
      SCANNER_CPU: "2"
      SCANNER_MEMORY: 2Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-vsphere
zz_generated_metadata:
  branch: release-5.0
  org: openshift
  repo: vmware-vsphere-csi-driver-operator
