base_images:
  base_rhel10:
    name: "5.1"
    namespace: ocp
    tag: base-rhel10
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: openstack-ngs-tester.Dockerfile
    from: src
    optional: true
    to: ngs-tester
  - dockerfile_path: openstack-ngs-tester-rhel10-py314.Dockerfile
    from: base_rhel10
    optional: true
    to: ngs-tester-rhel10-py314
promotion:
  to:
  - disabled: true
    name: "5.1"
    namespace: ocp
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit-rhel9-py312
  commands: HOME=`dirname .` tox -vv -e py3
  container:
    from: ngs-tester
- as: pep8-rhel9-py312
  commands: HOME=`dirname .` tox -vv -e pep8
  container:
    from: ngs-tester
- as: unit-rhel10-py314
  commands: HOME=`dirname .` tox -vv -e py3
  container:
    clone: true
    from: ngs-tester-rhel10-py314
- as: pep8-rhel10-py314
  commands: HOME=`dirname .` tox -vv -e pep8
  container:
    clone: true
    from: ngs-tester-rhel10-py314
zz_generated_metadata:
  branch: release-5.1
  org: openshift
  repo: openstack-networking-generic-switch
