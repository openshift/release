base_images:
  cli:
    name: "5.1"
    namespace: ocp
    tag: cli
  tests-private:
    name: tests-private
    namespace: ci
    tag: "5.1"
  upi-installer:
    name: "5.1"
    namespace: ocp
    tag: upi-installer
  wmco-tests:
    name: "5.1"
    namespace: ocp
    tag: windows-machine-config-operator-test
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-5.1
releases:
  latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: ci
      version: "5.1"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: ./lint.sh
  container:
    from: src
- as: aws-ipi-ovn-winc
  postsubmit: true
  skip_if_only_changed: ^(?:hack|\.tekton)/
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: openshift-org-aws
    env:
      BASE_DOMAIN: qe.devcluster.openshift.com
      FORCE_SUCCESS_EXIT: "no"
      TEST_FILTERS: ~ChkUpgrade&;~ConnectedOnly&;Smokerun&
      TEST_SCENARIOS: Windows_Containers
      TEST_TIMEOUT: "50"
    test:
    - ref: openshift-extended-test
    workflow: cucushift-installer-rehearse-aws-ipi-ovn-winc
- as: aws-upi-ovn-winc
  postsubmit: true
  skip_if_only_changed: ^(?:hack|\.tekton)/
