- as: aws-ipi-ovn-ote
  postsubmit: true
  skip_if_only_changed: ^(?:hack|\.tekton)/
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      EXTENSION_IMAGE: wmco-tests
    env:
      BASE_DOMAIN: qe.devcluster.openshift.com
      EXTENSION_BINARY_PATH: /usr/bin/wmco-tests-ext.gz
      EXTENSION_COMPONENT_NAME: windows-machine-config-operator
      SUB_CHANNEL: stable
      SUB_INSTALL_NAMESPACE: openshift-windows-machine-config-operator
      SUB_PACKAGE: windows-machine-config-operator
      SUB_SOURCE: wmco
      SUB_TARGET_NAMESPACES: '!install'
      TEST_ARGS: --monitor=e2e-test-analyzer
      TEST_SUITE: windows-machine-config-operator/smokerun
      WINDOWS_NODE_REPLICAS: "2"
    test:
    - ref: openshift-windows-setup-wmco-konflux
    - ref: operatorhub-subscribe
    - ref: windows-conf-operator
    - ref: ipi-conf-aws-windows-machineset
    - ref: windows-node-readiness
    - ref: openshift-tests-extension-setup-out-of-payload
    - ref: openshift-e2e-test
    workflow: ipi-aws-ovn-hybrid
