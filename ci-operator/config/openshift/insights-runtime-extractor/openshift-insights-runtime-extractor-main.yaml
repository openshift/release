base_images:
  ubi9:
    name: ubi
    namespace: ocp
    tag: "9"
build_root:
  from_repository: true
images:
  items:
  - dockerfile_literal: |-
      FROM registry.access.redhat.com/ubi9:latest AS rust-builder
      ARG TARGETARCH

      RUN echo Target architecture: ${TARGETARCH}

      COPY . /opt/app-root/src/
      WORKDIR /opt/app-root/src/insights-runtime-extractor

      USER 0
      ENV HOME="/root"
      ENV PATH="${HOME}/.cargo/bin:${HOME}/.local/bin:${PATH}"

      RUN chgrp root /opt/app-root/src/insights-runtime-extractor && \
          chmod g+w /opt/app-root/src/insights-runtime-extractor && \
          dnf install -y gcc make rust-toolset rustfmt openssl-devel

      RUN mkdir -p $HOME/.cargo/git/ && \
          find $HOME/. -type d -exec chmod 777 {} \; && \
          find $HOME/. -type f -exec chmod ugo+rw {} \;

      USER 1001
    inputs:
      src:
        paths:
        - destination_dir: .
          source_path: /go/src/github.com/openshift/insights-runtime-extractor
      ubi9:
        as:
        - registry.access.redhat.com/ubi9:latest
    to: src-rust
  - dockerfile_path: ./Containerfile-extractor
    to: insights-runtime-extractor
  - dockerfile_path: ./Containerfile-exporter
    to: insights-runtime-exporter
promotion:
  to:
  - name: "5.1"
    namespace: ocp
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
  src-rust:
    requests:
      cpu: 1000m
      memory: 1Gi
tests:
- as: rust-unit-tests
  commands: cd extractor && make unit-tests
  container:
    from: src-rust
- as: unit-tests
  commands: make unit-tests
  container:
    from: src
- always_run: false
  as: e2e-aws
  steps:
    cluster_profile: openshift-org-aws
    workflow: openshift-e2e-aws
- always_run: false
  as: e2e-tests
  steps:
    cluster_profile: openshift-org-aws
    test:
    - as: e2e-tests
      cli: latest
      commands: cd exporter && make e2e-test
      dependencies:
      - env: INSIGHTS_RUNTIME_EXPORTER
        name: insights-runtime-exporter
      - env: INSIGHTS_RUNTIME_EXTRACTOR
        name: insights-runtime-extractor
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-aws
- as: soak-test
  capabilities:
  - intranet
  cron: 30 4 * * 1
  reporter_config:
    channel: '#ccx-io-notifications'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :slack-green: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :failed:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  steps:
    cluster_profile: aws-observability
    env:
      BASE_DOMAIN: devobscluster.devcluster.openshift.com
    test:
    - as: soak-test
      cli: latest
      commands: |
        git clone https://github.com/openshift/distributed-tracing-qe.git /tmp/distributed-tracing-qe
        cd /tmp/distributed-tracing-qe/tests/e2e-insights-runtime-extractor-soak
        ./ci/run-soak-test.sh
      dependencies:
      - env: INSIGHTS_RUNTIME_EXPORTER
        name: insights-runtime-exporter
      - env: INSIGHTS_RUNTIME_EXTRACTOR
        name: insights-runtime-extractor
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 2h0m0s
    workflow: cucushift-installer-rehearse-aws-ipi
- always_run: false
  as: tls-scanner
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    env:
      COMPUTE_NODE_TYPE: m5.2xlarge
      SCAN_NAMESPACE: openshift-insights
    test:
    - ref: tls-scanner-run
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: openshift
  repo: insights-runtime-extractor
