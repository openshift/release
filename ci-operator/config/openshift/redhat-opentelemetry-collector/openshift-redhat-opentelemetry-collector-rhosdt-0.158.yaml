build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-5.0
images:
  items:
  - additional_architectures:
    - arm64
    context_dir: .
    dockerfile_path: Dockerfile.art
    to: redhat-opentelemetry-collector
promotion:
  to:
  - namespace: ci
    tag: redhat-otel-collector
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
  build:
    requests:
      cpu: "2"
      memory: 6Gi
  fips-check:
    requests:
      cpu: "2"
      memory: 6Gi
  generate-schemas:
    requests:
      cpu: "2"
      memory: 6Gi
tests:
- as: build
  commands: |
    # The build_root image sets GOFLAGS=-mod=vendor, but the vendor directory of the .obi-src submodule is not consistent.
    # Dockerfile.art builds with -mod=mod as well.
    export GOFLAGS=-mod=mod
    make build
  container:
    from: src
- as: generate-schemas
  commands: |
    # The build_root image sets GOFLAGS=-mod=vendor, but the vendor directory of the .obi-src submodule is not consistent.
    # Dockerfile.art builds with -mod=mod as well.
    export GOFLAGS=-mod=mod
    make generate-schemas
  container:
    from: src
- as: fips-check
  commands: |
    # The --binary check is disabled because the ocp/builder:rhel-9-golang-1.26-openshift-5.0
    # image wraps the go binary with a compliance shim (/usr/bin/go is a shell script that
    # delegates to go.real). When OPENSHIFT_CI is set, the shim enforces the OpenSSL FIPS
    # backend: it overrides GOFIPS140=certified to GOFIPS140=off and forces CGO_ENABLED=1,
    # because the built-in Go FIPS module is only auto-enabled for OCP 5.1+.
    export GOFLAGS=-mod=mod
    make generate-obi
    GOFLAGS= go install github.com/os-observability/konflux-opentelemetry/tools/fips-check@latest
    fips-check --module ./_build --allowlist ./fips-allowlist.yaml
  container:
    from: src
zz_generated_metadata:
  branch: rhosdt-0.158
  org: openshift
  repo: redhat-opentelemetry-collector
