binary_build_commands: make build-no-gen
build_root:
  from_repository: true
images:
  items:
  - to: cloud-credential-operator
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-aws-manual-oidc-upgrade
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    workflow: openshift-e2e-aws-manual-oidc-sts-upgrade
  timeout: 6h0m0s
- as: e2e-azure-manual-oidc-upgrade
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-azure
    workflow: openshift-e2e-azure-manual-oidc-workload-identity-upgrade
  timeout: 6h0m0s
- as: e2e-gcp-manual-oidc-upgrade
  optional: true
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-gcp
    workflow: openshift-e2e-gcp-manual-oidc-workload-identity-upgrade
  timeout: 6h0m0s
zz_generated_metadata:
  branch: master
  org: openshift
  repo: cloud-credential-operator
  variant: 5.1-upgrade-from-stable-5.0
