base_images:
  descheduler:
    name: "5.0"
    namespace: ocp
    tag: descheduler
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.rhel7
    to: cluster-kube-descheduler-operator
promotion:
  to:
  - name: "5.0"
    namespace: ocp
releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify
  commands: make verify-gofmt
  container:
    from: src
- as: unit
  commands: make test-unit
  container:
    from: src
- always_run: false
  as: e2e-aws-operator
  steps:
    cluster_profile: openshift-org-aws
    test:
    - as: test
      cli: latest
      commands: make test-e2e
      dependencies:
      - env: OPERATOR_IMAGE
        name: cluster-kube-descheduler-operator
      - env: OPERAND_IMAGE
        name: pipeline:descheduler
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-aws
- always_run: false
  as: e2e-aws-operator-serial-ote
  optional: true
  pipeline_skip_if_only_changed: ^\.tekton/|^bundle\.Dockerfile$|\.md$|^(?:.*/)?(?:\.gitignore|LICENSE|OWNERS)$
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      EXTENSION_IMAGE: cluster-kube-descheduler-operator
    env:
      EXTENSION_BINARY_PATH: /usr/bin/cluster-kube-descheduler-operator-tests-ext.gz
      EXTENSION_COMPONENT_NAME: cluster-kube-descheduler-operator
      FIPS_ENABLED: "true"
      TEST_SUITE: openshift/cluster-kube-descheduler-operator/operator/serial
    pre:
    - chain: ipi-aws-pre
    - ref: fips-check
    test:
    - ref: openshift-tests-extension-setup-out-of-payload
    - as: resolve-images
      commands: |
        echo "$OPERATOR_IMAGE" > "${SHARED_DIR}/operator-image"
        echo "$OPERAND_IMAGE" > "${SHARED_DIR}/operand-image"
      dependencies:
      - env: OPERATOR_IMAGE
        name: cluster-kube-descheduler-operator
      - env: OPERAND_IMAGE
        name: pipeline:descheduler
      from: src
      resources:
        requests:
          cpu: 100m
    - ref: openshift-e2e-test
    workflow: ipi-aws
- always_run: false
  as: e2e-aws-operator-serial-stage-ote
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    env:
      FIPS_ENABLED: "true"
      INDEX_IMAGE: ""
      INSTALL_NAMESPACE: openshift-kube-descheduler-operator
      INSTALL_OPERATOR: "true"
      OPERAND_CRD: kubedeschedulers.operator.openshift.io
      OPERAND_MANIFEST: |
        apiVersion: operator.openshift.io/v1
        kind: KubeDescheduler
        metadata:
          name: cluster
          namespace: openshift-kube-descheduler-operator
        spec:
          managementState: Managed
          deschedulingIntervalSeconds: 30
          mode: Predictive
          evictionLimits:
            total: 4
          profiles:
          - LifecycleAndUtilization
          profileCustomizations:
            podLifetime: 10s
      OPERAND_WORKLOAD: deployment/descheduler
      OPERATOR_GROUP_NAME: descheduler-og
      OPERATOR_WORKLOAD: deployment/descheduler-operator
      PACKAGE_NAME: cluster-kube-descheduler-operator
    test:
    - ref: fips-check
    - ref: optional-operators-enable-index-catalog
    - as: descheduler-serial-tests
      cli: latest
      commands: |
        set -euo pipefail
        cd /tmp
        gzip -dc /usr/bin/cluster-kube-descheduler-operator-tests-ext.gz > cluster-kube-descheduler-operator-tests-ext
        chmod +x cluster-kube-descheduler-operator-tests-ext
        ./cluster-kube-descheduler-operator-tests-ext run-suite openshift/cluster-kube-descheduler-operator/operator/serial --max-concurrency=1 -j "${ARTIFACT_DIR}/junit_descheduler_serial.xml"
      from: cluster-kube-descheduler-operator
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ipi-aws
zz_generated_metadata:
  branch: release-5.0
  org: openshift
  repo: cluster-kube-descheduler-operator
