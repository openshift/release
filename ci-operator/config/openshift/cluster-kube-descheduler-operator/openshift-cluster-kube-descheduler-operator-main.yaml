base_images:
  cli-operator-sdk:
    name: cli-operator-sdk
    namespace: ocp
    tag: v1.39.2
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.rhel7
    to: cluster-kube-descheduler-operator
operator:
  bundles:
  - as: cluster-kube-descheduler-operator-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: registry.ci.openshift.org/ocp/.*:cluster-kube-descheduler-operator
    with: pipeline:cluster-kube-descheduler-operator
promotion:
  to:
  - name: "5.1"
    namespace: ocp
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify
  commands: make verify-gofmt
  container:
    from: src
- as: unit
  commands: make test-unit
  container:
    from: src
- always_run: false
  as: e2e-aws-operator
  steps:
    cluster_profile: openshift-org-aws
    test:
    - as: test
      cli: latest
      commands: make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-aws
- always_run: false
  as: e2e-aws-operator-serial-ote
  optional: true
  pipeline_skip_if_only_changed: ^\.tekton/|^bundle\.Dockerfile$|\.md$|^(?:.*/)?(?:\.gitignore|LICENSE|OWNERS)$
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      EXTENSION_IMAGE: cluster-kube-descheduler-operator
      OO_BUNDLE: cluster-kube-descheduler-operator-bundle
    env:
      EXTENSION_BINARY_PATH: /usr/bin/cluster-kube-descheduler-operator-tests-ext.gz
      EXTENSION_COMPONENT_NAME: cluster-kube-descheduler-operator
      FIPS_ENABLED: "true"
      OO_INSTALL_MODE: AllNamespaces
      OO_INSTALL_NAMESPACE: openshift-kube-descheduler-operator
      OO_INSTALL_TIMEOUT_MINUTES: "15"
      OO_SECURITY_CONTEXT: restricted
      TEST_SUITE: openshift/cluster-kube-descheduler-operator/operator/serial
    test:
    - ref: fips-check
    - ref: optional-operators-operator-sdk
    - ref: openshift-tests-extension-setup-out-of-payload
    - ref: openshift-e2e-test
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: openshift
  repo: cluster-kube-descheduler-operator
