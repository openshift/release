base_images:
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
  ocp_4.21_base-rhel9:
    name: "5.0"
    namespace: ocp
    tag: base-rhel9
  ocp_builder_rhel-8-golang-1.24-openshift-4.20:
    name: builder
    namespace: ocp
    tag: rhel-8-golang-1.24-openshift-4.20
  ocp_builder_rhel-9-golang-1.24-openshift-4.20:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.24-openshift-4.20
  upi-installer:
    name: "5.0"
    namespace: ocp
    tag: upi-installer
build_root:
  from_repository: true
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    candidate:
      product: ocp
      relative: 1
      stream: ci
      version: "5.0"
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: e2e-aws-core-networking-serial-ote
  cron: 0 2 * * *
  steps:
    cluster_profile: openshift-org-aws
    env:
      EXTRA_MG_ARGS: --host-network
      TEST_SUITE: ovn-kubernetes/conformance/serial
    workflow: openshift-e2e-aws-core-networking-bastion
- always_run: false
  as: e2e-azure-core-networking-serial-ote
  cron: 0 5 * * *
  steps:
    cluster_profile: openshift-org-azure
    env:
      EXTRA_MG_ARGS: --host-network
      TEST_SUITE: ovn-kubernetes/conformance/serial
    workflow: openshift-e2e-azure-core-networking-bastion
- always_run: false
  as: e2e-gcp-core-networking-serial-ote
  cron: 0 6 * * *
  steps:
    cluster_profile: openshift-org-gcp
    env:
      EXTRA_MG_ARGS: --host-network
      TEST_SUITE: ovn-kubernetes/conformance/serial
    workflow: openshift-e2e-gcp-core-networking-bastion
- always_run: false
  as: e2e-metal-ipi-core-networking-dualstack-serial-ote
  capabilities:
  - intranet
  cron: 0 8 * * *
  steps:
    cluster_profile: equinix-ocp-metal
    env:
      EXTRA_MG_ARGS: --host-network
      TEST_SUITE: ovn-kubernetes/conformance/serial
    workflow: baremetalds-e2e-ovn-dualstack
- always_run: false
  as: e2e-metal-ipi-ovn-dualstack-bgp
  capabilities:
  - intranet
  cron: 0 4 * * *
  steps:
    cluster_profile: equinix-ocp-metal
    workflow: baremetalds-e2e-ovn-bgp-dualstack
- always_run: false
  as: e2e-metal-ipi-ovn-dualstack-bgp-local-gw
  capabilities:
  - intranet
  cron: 0 4 * * *
  steps:
    cluster_profile: equinix-ocp-metal
    workflow: baremetalds-e2e-ovn-bgp-dualstack-local-gw
- always_run: false
  as: e2e-metal-ipi-ovn-bgp-virt-dualstack
  capabilities:
  - intranet
  cron: 0 3 * * *
  steps:
    cluster_profile: equinix-ocp-metal
    env:
      CNV_PRERELEASE_LATEST_CHANNEL: "true"
    workflow: baremetalds-e2e-ovn-bgp-virt-dualstack
- always_run: false
  as: e2e-metal-ipi-ovn-bgp-virt-dualstack-techpreview
  capabilities:
  - intranet
  cron: 0 3 * * *
  steps:
    cluster_profile: equinix-ocp-metal
    env:
      CNV_PRERELEASE_LATEST_CHANNEL: "true"
      FEATURE_SET: TechPreviewNoUpgrade
    workflow: baremetalds-e2e-ovn-bgp-virt-dualstack
- always_run: false
  as: e2e-metal-ipi-ovn-bgp-virt-ipv4-techpreview
  capabilities:
  - intranet
  cron: 0 7 * * *
  steps:
    cluster_profile: equinix-ocp-metal
    env:
      CNV_PRERELEASE_LATEST_CHANNEL: "true"
      FEATURE_SET: TechPreviewNoUpgrade
    workflow: baremetalds-e2e-ovn-bgp-virt-ipv4
- always_run: false
  as: e2e-metal-ipi-ovn-bgp-virt-ipv4
  capabilities:
  - intranet
  cron: 0 7 * * *
  steps:
    cluster_profile: equinix-ocp-metal
    env:
      CNV_PRERELEASE_LATEST_CHANNEL: "true"
    workflow: baremetalds-e2e-ovn-bgp-virt-ipv4
zz_generated_metadata:
  branch: release-5.0
  org: openshift
  repo: ovn-kubernetes
  variant: periodics
