base_images:
  hypershift-operator:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
  hypershift-tests:
    name: hypershift-tests
    namespace: hypershift
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    to: karpenter-operator
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    integration:
      name: "4.22"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.22"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 200m
      memory: 400Mi
tests:
- as: e2e-aws-hypershift
  cron: 00 15 * * *
  steps:
    cluster_profile: hypershift-aws
    env:
      ENABLE_STANDALONE_KARPENTER_OPERATOR: "true"
      TECH_PREVIEW_NO_UPGRADE: "true"
      TEST_PLAN: |
        name: autonode-standalone-ko
        platform: aws
        testMatrix:
          parallel:
          - name: karpenter
            variant: karpenter
            labelFilter: karpenter
    workflow: hypershift-aws-e2e-v2
zz_generated_metadata:
  branch: main
  org: openshift
  repo: karpenter-operator
  variant: periodics-hypershift-4-22
