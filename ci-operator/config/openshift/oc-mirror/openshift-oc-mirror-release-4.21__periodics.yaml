base_images:
  upi-installer:
    name: "4.21"
    namespace: ocp
    tag: upi-installer
build_root:
  from_repository: true
promotion:
  to:
  - disabled: true
    name: "4.21"
    namespace: ocp
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    candidate:
      product: ocp
      stream: nightly
      version: "4.21"
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.21"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-aws-m2m-disconnected
  cron: 0 6 * * 4
  steps:
    cluster_profile: openshift-org-aws
    env:
      ADDITIONAL_TRUST_BUNDLE_POLICY: Always
      ENABLE_IDMS: "yes"
      MIRROR_BIN: oc-mirror
      QE_IMAGES: "false"
      TEST_SKIPS: \[Skipped:Disconnected\]\|with a privileged SCC\|--name longer than
        58 characters\|oc new-app should succeed with an imagestream\|custom build
        with buildah being created from new-build\|buildah search from our predefined
        list of image registries\|successful deployment with multiple triggers\|successful
        deployment with a trigger used by different containers\|oc builds new-build
        \[apigroup\|oc builds complex build webhooks CRUD\|oc builds complex build
        start-build\|resolve valueFrom in s2i build environment variables\|should
        contain source revision information\|S2i template without an output image
        reference defined\|test-docker-build.json\|test-s2i-build.json\|templateinstance
        readiness test should report ready soon\|imagechangetriggers should trigger
        builds of all types\|oc tag should preserve image reference for external images\|Image
        info should display information about images\|should not disrupt a cloud load-balancer's
        connectivity during rollout\|NLB internal should be reachable with hairpinning
        traffic\|CLB internal should be reachable with hairpinning traffic\|HAProxy
        router should pass the gRPC interoperability tests\|HAProxy router should
        pass the http2 tests\|HAProxy router should pass the h2spec conformance tests\|NLB
        \[OCPFeatureGate:AWSServiceLBNetworkSecurityGroup\] should cleanup security
        groups when service is deleted\|CLB should be reachable with default configurations\|NLB
        created with BYO Security Group should have BYO Security Group associated\|NLB
        should be reachable with target-node-labels\|NLB should be reachable with
        default configurations\|NLB \[OCPFeatureGate:AWSServiceLBNetworkSecurityGroup\]
        should update security group rules when service is updated\|NLB \[OCPFeatureGate:AWSServiceLBNetworkSecurityGroup\]
        should have correct security group rules for service ports\|NLB should transition
        from Managed SG to BYO Security Group\|NLB should transition from BYO SG to
        Managed Security Group\|NLB \[OCPFeatureGate:AWSServiceLBNetworkSecurityGroup\]
        should create NLB service with security group attached\|Load balancer healthcheck
        port and path should be 10256\|OCPFeatureGate:GatewayAPIController
      TEST_STEPS: openshift-e2e-test mirror-images-by-oc-mirror mirror-images-by-oc-mirror-conf-mirror
        mirror-images-community-e2e-images mirror-images-qe-test-images mirror-images-trust-registry-ca
    post:
    - chain: gather-core-dump
    - chain: ipi-aws-post-disconnected
    - ref: mirror-images-by-oc-mirror-analyze-e2e-failure
    pre:
    - chain: ipi-aws-pre-disconnected
    - ref: ipi-conf-additional-ca-trust-policy
    test:
    - ref: mirror-images-community-e2e-images
    - ref: mirror-images-qe-test-images
    - ref: mirror-images-trust-registry-ca
    - ref: openshift-e2e-test
    workflow: openshift-e2e-aws-disconnected
zz_generated_metadata:
  branch: release-4.21
  org: openshift
  repo: oc-mirror
  variant: periodics
