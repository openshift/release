base_images:
  base-rhel9:
    name: "4.21"
    namespace: ocp
    tag: base-rhel9
  golang:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.25-openshift-4.21
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
binary_build_commands: cd operator && make build
build_root:
  image_stream_tag:
    name: console-plugin-test-cypress
    namespace: ci
    tag: node22
images:
  items:
  - dockerfile_path: Dockerfile
    to: ocp-secrets-management
  - dockerfile_path: operator/images/ci/Dockerfile
    from: base-rhel9
    to: ocp-secrets-management-operator
  - dockerfile_path: images/ci/Dockerfile.coverage
    to: ocp-secrets-management-console-coverage
operator:
  bundles:
  - as: ocp-secrets-management-operator-bundle
    dockerfile_path: operator/bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: openshift.io/ocp-secrets-management-operator:.*
    with: pipeline:ocp-secrets-management-operator
  - pullspec: openshift.io/ocp-secrets-management:.*
    with: pipeline:ocp-secrets-management
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.21"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: |
    yarn install && LANG=en_US.UTF-8 yarn test
  container:
    from: src
- as: unit-with-coverage
  postsubmit: true
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: |
        curl -Os https://uploader.codecov.io/latest/linux/codecov
        chmod +x codecov
        ./codecov upload-process --token=$(cat /var/run/secrets/codecov/token)
      credentials:
      - mount_path: /var/run/secrets/codecov
        name: ocp-secrets-management-console-codecov-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    test:
    - as: test
      cli: latest
      commands: |
        yarn install && LANG=en_US.UTF-8 yarn coverage
      from: src
      resources:
        requests:
          cpu: 100m
- as: operator-unit
  commands: |
    unset GOFLAGS && cd operator && make test
  container:
    from: golang
- as: fips-image-scan-plugin
  steps:
    dependencies:
      SCAN_IMAGE: ocp-secrets-management
    test:
    - ref: fips-check-image-scan
- as: fips-image-scan-operator
  steps:
    dependencies:
      SCAN_IMAGE: ocp-secrets-management-operator
    test:
    - ref: fips-check-image-scan
zz_generated_metadata:
  branch: main
  org: openshift
  repo: ocp-secrets-management-console
