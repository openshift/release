base_images:
  base-rhel9:
    name: "4.21"
    namespace: ocp
    tag: base-rhel9
  golang:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.25-openshift-4.21
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
binary_build_commands: cd operator && make build
build_root:
  image_stream_tag:
    name: console-plugin-test-cypress
    namespace: ci
    tag: node22
images:
  items:
  - dockerfile_path: Dockerfile
    to: ocp-secrets-management
  - dockerfile_path: operator/images/ci/Dockerfile
    from: base-rhel9
    to: ocp-secrets-management-operator
  - dockerfile_path: images/ci/Dockerfile.coverage
    to: ocp-secrets-management-console-coverage
operator:
  bundles:
  - as: ocp-secrets-management-operator-bundle
    dockerfile_path: operator/bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: openshift.io/ocp-secrets-management-operator:.*
    with: pipeline:ocp-secrets-management-operator
  - pullspec: openshift.io/ocp-secrets-management:.*
    with: pipeline:ocp-secrets-management
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.21"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: yarn install --immutable && npx playwright install chromium
tests:
- as: unit
  commands: |
    yarn install && LANG=en_US.UTF-8 yarn test
  container:
    from: src
- as: unit-with-coverage
  postsubmit: true
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: |
        curl -Os https://uploader.codecov.io/latest/linux/codecov
        chmod +x codecov
        ./codecov upload-process --token=$(cat /var/run/secrets/codecov/token)
      credentials:
      - mount_path: /var/run/secrets/codecov
        name: ocp-secrets-management-console-codecov-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    test:
    - as: test
      cli: latest
      commands: |
        yarn install && LANG=en_US.UTF-8 yarn coverage
      from: src
      resources:
        requests:
          cpu: 100m
- as: operator-unit
  commands: |
    unset GOFLAGS && cd operator && make test
  container:
    from: golang
- as: fips-image-scan-plugin
  steps:
    dependencies:
      SCAN_IMAGE: ocp-secrets-management
    test:
    - ref: fips-check-image-scan
- as: fips-image-scan-operator
  steps:
    dependencies:
      SCAN_IMAGE: ocp-secrets-management-operator
    test:
    - ref: fips-check-image-scan
- as: e2e-operator
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.21"
  skip_if_only_changed: ^(docs/|operator/bundle/|operator/config/)|\.md$|^(?:.*/)?(?:\.gitignore|.dockerignore|.golangci.yml|Makefile|OWNERS|PROJECT|LICENSE)$
  steps:
    test:
    - ref: merge-stage-registry-credentials
    - as: install
      cli: latest
      commands: |
        oc create namespace ocp-secrets-management-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n ocp-secrets-management-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n ocp-secrets-management-operator deployment ocp-secrets-management-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: ocp-secrets-management-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        unset GOFLAGS
        cd operator && make test-e2e
      from: golang
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- always_run: false
  as: e2e-operator-coverage
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.21"
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: operator/hack/e2e-coverage.sh collect
      credentials:
      - mount_path: /var/run/secrets/codecov
        name: ocp-secrets-management-console-codecov-token
        namespace: test-credentials
      from: golang
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    - chain: gather
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace ocp-secrets-management-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n ocp-secrets-management-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n ocp-secrets-management-operator deployment ocp-secrets-management-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: ocp-secrets-management-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: setup-coverage
      cli: latest
      commands: operator/hack/e2e-coverage.sh setup
      dependencies:
      - env: COVERAGE_IMAGE
        name: ocp-secrets-management-console-coverage
      from: golang
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        unset GOFLAGS
        cd operator && make test-e2e
      from: golang
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- as: publish-e2e-coverage
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.21"
  postsubmit: true
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: operator/hack/e2e-coverage.sh collect
      credentials:
      - mount_path: /var/run/secrets/codecov
        name: ocp-secrets-management-console-codecov-token
        namespace: test-credentials
      from: golang
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    - chain: gather
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace ocp-secrets-management-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n ocp-secrets-management-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n ocp-secrets-management-operator deployment ocp-secrets-management-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: ocp-secrets-management-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: setup-coverage
      cli: latest
      commands: operator/hack/e2e-coverage.sh setup
      dependencies:
      - env: COVERAGE_IMAGE
        name: ocp-secrets-management-console-coverage
      from: golang
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        unset GOFLAGS
        cd operator && make test-e2e
      from: golang
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- always_run: false
  as: e2e-console
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace ocp-secrets-management-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n ocp-secrets-management-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n ocp-secrets-management-operator deployment ocp-secrets-management-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: ocp-secrets-management-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: ./test-prow-e2e.sh
      dependencies:
      - env: PLUGIN_PULL_SPEC
        name: ocp-secrets-management
      from: test-bin
      grace_period: 30m0s
      resources:
        requests:
          cpu: 500m
      timeout: 3h0m0s
    workflow: openshift-e2e-aws
zz_generated_metadata:
  branch: main
  org: openshift
  repo: ocp-secrets-management-console
