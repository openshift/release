base_images:
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: build/Dockerfile
    to: ocm-agent
  - dockerfile_literal: |
      FROM builder AS compile
      RUN CGO_ENABLED=0 go test ./test/e2e -v -c --tags=osde2e -o /usr/local/bin/e2e.test
      FROM runtime
      COPY --from=compile /usr/local/bin/e2e.test /usr/local/bin/e2e.test
    inputs:
      rosa-aws-cli:
        as:
        - runtime
      src:
        as:
        - builder
    to: operator-e2e
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "4.22"
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 500Mi
tests:
- as: coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  secret:
    collection: sd-sre-secrets
    group: ocm-agent-codecov-token
    mount_path: /tmp/secret
- as: publish-coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  postsubmit: true
  secret:
    collection: sd-sre-secrets
    group: ocm-agent-codecov-token
    mount_path: /tmp/secret
- as: lint
  commands: GOLANGCI_LINT_CACHE=/tmp make lint
  container:
    from: src
- as: test
  commands: make test
  container:
    from: src
- as: e2e-binary-build-success
  commands: |
    make e2e-binary-build
  container:
    from: src
- as: rosa-sts-e2e
  steps:
    cluster_profile: rosa-e2e-01
    env:
      OCM_AGENT_URL: http://localhost:8081
      OPERATOR_CRDS: managedfleetnotificationrecords.ocmagent.managed.openshift.io,managedfleetnotifications.ocmagent.managed.openshift.io,managednotifications.ocmagent.managed.openshift.io,ocmagents.ocmagent.managed.openshift.io
      OPERATOR_NAME: ocm-agent-operator
      OPERATOR_NAMESPACE: openshift-ocm-agent-operator
      PORT_FORWARD_SVC: openshift-ocm-agent-operator/ocm-agent:8081
    workflow: rosa-cluster-lease-cli-e2e
- as: rosa-sts-e2e-promotion-int
  cron: 0 0 31 2 *
  reporter_config:
    channel: '#rosa-prow-info'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{- if eq .Status.State "success"}} :green_jenkins_circle: Job
      *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{- else}} :red_jenkins_circle: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs> <!subteam^S0B7Q6G7XQR> <@U0AKNPBBVT7> {{- end}}'
  steps:
    cluster_profile: rosa-e2e-01
    env:
      LEASE_ENV: integration
      OCM_AGENT_URL: http://localhost:8081
      OPERATOR_CRDS: managedfleetnotificationrecords.ocmagent.managed.openshift.io,managedfleetnotifications.ocmagent.managed.openshift.io,managednotifications.ocmagent.managed.openshift.io,ocmagents.ocmagent.managed.openshift.io
      OPERATOR_NAME: ocm-agent-operator
      OPERATOR_NAMESPACE: openshift-ocm-agent-operator
      PORT_FORWARD_SVC: openshift-ocm-agent-operator/ocm-agent:8081
    workflow: rosa-cluster-lease-cli-e2e
- as: rosa-sts-e2e-promotion-stage
