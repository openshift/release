base_images:
  cli:
    name: "5.0"
    namespace: ocp
    tag: cli
  upi-installer:
    name: "5.0"
    namespace: ocp
    tag: upi-installer
build_root:
  from_repository: true
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_literal: |
      FROM src
      RUN YQ_ARCH=$(uname -m | sed -e 's/^x86_64$/amd64/' -e 's/^aarch64$/arm64/') && \
          wget -qO /usr/local/bin/yq "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${YQ_ARCH}" && \
          chmod +x /usr/local/bin/yq
      RUN dnf install -y jq skopeo git && dnf clean all
    from: src
    to: kueue-operator-src
prowgen:
  disable_sparse_checkout: true
releases:
  arm64-5-0-latest:
    candidate:
      architecture: arm64
      product: ocp
      stream: nightly
      version: "5.0"
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.22"
  ocp-5-0-latest:
    candidate:
      architecture: amd64
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: test-e2e-downstream-4-18
  capabilities:
  - arm64
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 1h0m0s
    version: "4.18"
  cron: '@daily'
  reporter_config:
    channel: '#forum-node-jira'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  steps:
    env:
      KUEUE_INDEX_IMAGE_REPO: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc
      KUEUE_INDEX_IMAGE_TAG: kueue-1.5__v4.18__kueue-rhel9-operator
      KUEUE_OPERATOR_CHANNEL: stable-v1.5
      KUEUE_OPERATOR_SOURCE: fbc-operator-catalog
    post:
    - chain: kueue-operator-post
    test:
