- as: test-e2e-disconnected
  cron: '@daily'
  reporter_config:
    channel: '#forum-node-jira'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: release:ocp-5-0-latest
    env:
      CATSRC_IMG: registry.redhat.io/redhat/redhat-operator-index:v4.20
      CATSRC_NAME: redhat-operators
      ENABLE_IDMS: "yes"
      KUEUE_INDEX_IMAGE_REPO: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc
      KUEUE_INDEX_IMAGE_TAG: kueue-1.5__v5.0__kueue-rhel9-operator
      KUEUE_OPERATOR_CHANNEL: stable-v1.5
      MIRROR_OPERATORS: "true"
    post:
    - as: kueue-must-gather-disconnected
      cli: latest
      commands: |
        if [[ -s "${SHARED_DIR}/env" ]]; then source "${SHARED_DIR}/env"; fi
        if [[ -z "${MUST_GATHER_IMAGE:-}" ]]; then
          echo "Kueue must-gather image was not prepared; skipping Kueue-specific must-gather"
          exit 0
        fi
        source "${SHARED_DIR}/proxy-conf.sh"
        export MUST_GATHER_IMAGE
        echo "Running must-gather to gather diagnostics..."
        mkdir -p ${ARTIFACT_DIR:-must-gather}/must-gather
        oc adm must-gather --image=${MUST_GATHER_IMAGE} --dest-dir=${ARTIFACT_DIR:-must-gather}/must-gather
      from: kueue-operator-src
      resources:
        requests:
          cpu: 300m
          memory: 500Mi
    - as: kueue-cleanup-disconnected
      cli: latest
      commands: |
        source "${SHARED_DIR}/proxy-conf.sh"
        make undeploy-ocp
      from: kueue-operator-src
      resources:
        requests:
          cpu: 300m
          memory: 500Mi
    - chain: ipi-aws-post-disconnected
    test:
    - ref: kueue-operator-disconnected-cert-manager-catalog
    - ref: cert-manager-install-operator
    - chain: jobset-install
    - chain: leader-worker-set-install
    - chain: kueue-operator-disconnected-art
    - as: e2e-kueue
      cli: latest
      commands: |
        source "${SHARED_DIR}/proxy-conf.sh"
        # Wait for API availability through the bastion proxy before starting.
        for i in $(seq 1 60); do oc whoami --request-timeout=15s >/dev/null 2>&1 && break; sleep 30; done
        oc whoami --request-timeout=15s >/dev/null 2>&1 || { echo "Cluster API unavailable at e2e start"; exit 1; }
        # Retry the CLI import after the mirror CA has propagated to importers.
        for i in $(seq 1 20); do oc import-image cli:latest -n openshift --confirm && break; sleep 15; done
        oc get imagestreamtag cli:latest -n openshift
        # The cluster must have installed the ART bundle the FBC selected, not a
        # different build that happened to resolve through the mirror.
        expected_csv=$(jq -r '.version' "${SHARED_DIR}/tested-images.json")
        installed_csv=$(oc get csv -n openshift-kueue-operator -o jsonpath='{.items[0].metadata.name}')
        if [[ "${installed_csv}" != "${expected_csv}" ]]; then
          echo "ERROR: installed CSV ${installed_csv} does not match the ART bundle ${expected_csv}"
          oc get csv -n openshift-kueue-operator
          exit 1
        fi
        expected_operator=$(jq -r '.images.operator' "${SHARED_DIR}/tested-images.json")
        installed_operator=$(oc get csv -n openshift-kueue-operator -o json \
          | jq -r '[.items[].spec.install.spec.deployments[].spec.template.spec.containers[].image | select(test("/kueue-rhel9-operator@"))][0] // ""')
        if [[ "${installed_operator##*@}" != "${expected_operator##*@}" ]]; then
          echo "ERROR: installed operator image ${installed_operator} does not match ${expected_operator}"
          exit 1
        fi
        echo "Installed ART bundle matches the FBC selection: ${installed_csv} (${installed_operator})"
        export CONTAINER_IMAGE=image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
        make e2e-ci-test
      from: kueue-operator-src
      resources:
        requests:
          cpu: 300m
          memory: 500Mi
      timeout: 3h0m0s
    workflow: openshift-e2e-aws-disconnected
