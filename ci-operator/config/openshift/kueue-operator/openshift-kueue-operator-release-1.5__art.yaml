base_images:
  cli:
    name: "5.0"
    namespace: ocp
    tag: cli
  upi-installer:
    name: "5.0"
    namespace: ocp
    tag: upi-installer
build_root:
  from_repository: true
images:
  items:
  - dockerfile_literal: |
      FROM src
      RUN wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 && chmod +x /usr/local/bin/yq
      RUN dnf install -y jq skopeo git && dnf clean all
    from: src
    to: kueue-operator-src
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: test-e2e-downstream-5-0
  capabilities:
  - arm64
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 1h0m0s
    version: "5.0"
  cron: '@daily'
  reporter_config:
    channel: '#forum-node-jira'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}} ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  steps:
    env:
      KUEUE_INDEX_IMAGE_REPO: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc
      KUEUE_INDEX_IMAGE_TAG: kueue-1.5__v5.0__kueue-rhel9-operator
      KUEUE_OPERATOR_CHANNEL: stable-v1.5
      KUEUE_OPERATOR_SOURCE: fbc-operator-catalog
    post:
    - chain: kueue-operator-post
    test:
    - chain: kueue-operator-test-e2e-art
- as: test-e2e-dra-gpu-4-22
  cron: '@daily'
  reporter_config:
    channel: '#forum-node-jira'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}} ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  steps:
    cluster_profile: openshift-org-aws
    env:
      AWS_INSTALL_USE_MINIMAL_PERMISSIONS: "yes"
      COMPUTE_NODE_REPLICAS: "1"
      COMPUTE_NODE_TYPE: g4dn.12xlarge
      KUEUE_INDEX_IMAGE_REPO: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc
      KUEUE_INDEX_IMAGE_TAG: kueue-1.5__v4.22__kueue-rhel9-operator
      KUEUE_OPERATOR_CHANNEL: stable-v1.5
      KUEUE_OPERATOR_SOURCE: fbc-operator-catalog
      NVIDIA_DRA_DRIVER_VERSION: 25.12.0
    post:
    - ref: nvidia-cleanup
    - chain: kueue-operator-post
    test:
    - chain: kueue-operator-test-e2e-dra-art
    workflow: ipi-aws
- as: test-e2e-upstream-5-0
  capabilities:
  - arm64
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 1h0m0s
    version: "5.0"
  cron: '@daily'
  reporter_config:
    channel: '#forum-node-jira'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}} ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  steps:
    env:
      KUEUE_INDEX_IMAGE_REPO: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc
      KUEUE_INDEX_IMAGE_TAG: kueue-1.5__v5.0__kueue-rhel9-operator
      KUEUE_OPERATOR_CHANNEL: stable-v1.5
      KUEUE_OPERATOR_SOURCE: fbc-operator-catalog
    post:
    - chain: kueue-operator-post
    test:
    - chain: kueue-operator-test-e2e-upstream-art
zz_generated_metadata:
  branch: release-1.5
  org: openshift
  repo: kueue-operator
  variant: art
