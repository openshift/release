base_images:
  cli:
    name: "4.22"
    namespace: ocp
    tag: cli
  upi-installer:
    name: "4.22"
    namespace: ocp
    tag: upi-installer
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.ci
    to: kueue-operator
  - dockerfile_literal: |
      FROM src
      RUN dnf install -y jq skopeo git && dnf clean all
    from: src
    to: kueue-operator-src
  - dockerfile_literal: |
      FROM src
      COPY oc /usr/bin/oc
      RUN ln -s /usr/bin/oc /usr/bin/kubectl
      RUN wget -qO /usr/local/bin/jq https://github.com/jqlang/jq/releases/latest/download/jq-linux64 && chmod +x /usr/local/bin/jq
      RUN dnf install -y skopeo git podman && dnf clean all
    from: src
    inputs:
      cli:
        paths:
        - destination_dir: .
          source_path: /usr/bin/oc
    to: src-with-oc-and-kubectl
prowgen:
  disable_sparse_checkout: true
releases:
  amd64-4-22-stable:
    release:
      channel: stable
      version: 4.22.18
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    requests:
      cpu: "4"
      memory: 4Gi
tests:
- always_run: false
  as: e2e-operator-upgrade-zstream-4-22-kueue-1-5
  cron: 0 20 * * 2,5
  optional: true
  presubmit: true
  reporter_config:
    channel: '#forum-node-jira'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: openshift-org-aws
    dependencies:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: release:amd64-4-22-stable
    env:
      KUEUE_INDEX_IMAGE_REPO: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc
      KUEUE_INDEX_IMAGE_TAG: kueue-1.5__v4.22__kueue-rhel9-operator
      KUEUE_OPERATOR_CHANNEL: stable-v1.5
      KUEUE_OPERATOR_SOURCE: fbc-operator-catalog
    post:
    - as: kueue-must-gather
      best_effort: true
      cli: latest
      commands: |
        source "${SHARED_DIR}/env"
        make run-must
      from: kueue-operator-src
      resources:
        requests:
          cpu: 300m
          memory: 500Mi
      timeout: 20m0s
    - chain: ipi-aws-post
    pre:
    - chain: ipi-aws-pre
    - ref: cert-manager-install-operator
    - ref: jobset-install-operator
    - ref: leader-worker-set-install-operator
    - ref: merge-stage-registry-credentials
    - ref: kueue-operator-enable-catalogsource-art
    - ref: kueue-operator-test-upgrade-operator-art-resolve
    - ref: wait
    - ref: kueue-operator-test-upgrade-operator-art-install-previous
    test:
    - chain: kueue-operator-test-operator-upgrade-art
zz_generated_metadata:
  branch: release-1.5
  org: openshift
  repo: kueue-operator
  variant: operator-upgrade-art
