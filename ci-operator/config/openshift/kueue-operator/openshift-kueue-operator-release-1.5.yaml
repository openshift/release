        oc label ns openshift-kueue-operator openshift.io/cluster-monitoring=true --overwrite
        operator-sdk run bundle --timeout=10m -n openshift-kueue-operator "$OO_BUNDLE" --security-context-config=restricted
      dependencies:
      - env: OO_BUNDLE
        name: kueue-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - ref: jobset-install-operator
    - ref: leader-worker-set-install-operator
    - as: e2e-kueue-upstream
      cli: latest
      commands: make e2e-upstream-test
      from: kueue-operator-src
      resources:
        requests:
          cpu: "4"
          memory: 4Gi
    workflow: ipi-aws
- always_run: false
  as: test-e2e-ci-build-upstream-dra-4-22
  cron: '@daily'
  optional: true
  presubmit: true
  steps:
    cluster_profile: openshift-org-aws
    env:
      AWS_INSTALL_USE_MINIMAL_PERMISSIONS: "yes"
      DRA_GPU_PARTITIONS: "4"
    post:
    - chain: kueue-operator-post
    test:
    - ref: cert-manager-install-operator
    - as: run-sdk
      cli: latest
      commands: |
        oc create namespace openshift-kueue-operator || true
        oc label ns openshift-kueue-operator openshift.io/cluster-monitoring=true --overwrite
        operator-sdk run bundle --timeout=10m -n openshift-kueue-operator "$OO_BUNDLE" --security-context-config=restricted
      dependencies:
      - env: OO_BUNDLE
        name: kueue-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - ref: jobset-install-operator
    - ref: leader-worker-set-install-operator
    - ref: kueue-operator-test-e2e-dra-enable-feature-gate
    - ref: dra-example-driver-install
    - as: e2e-kueue-upstream
      cli: latest
      commands: make e2e-upstream-test
      env:
      - default: dra/whole-device dra/counter
        name: E2E_TARGET_FOLDERS
      from: kueue-operator-src
      resources:
        requests:
          cpu: "4"
          memory: 4Gi
    workflow: ipi-aws
- always_run: false
  as: test-e2e-ci-build-upstream-dra-cc-5-0
  cron: '@daily'
  optional: true
  presubmit: true
  reporter_config:
    channel: '#forum-node-jira'
    job_states_to_report:
    - failure
    - error
    report_template: ':failed: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OPENSHIFT_INSTALL_RELEASE_IMAGE_OVERRIDE: release:ocp-5-0-latest
