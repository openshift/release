base_images:
  cli:
    name: "5.2"
    namespace: ocp
    tag: cli
binary_build_commands: make openshift-toolchain
build_root:
  from_repository: true
images:
  items:
  - dockerfile_literal: |
      FROM replaced-by-from
      COPY oc /usr/bin/oc
      RUN ln -s /usr/bin/oc /usr/bin/kubectl
      RUN curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | sh
    from: bin
    inputs:
      cli:
        paths:
        - destination_dir: .
          source_path: /usr/bin/oc
    to: bin-oc-kubectl-helm
promotion:
  to:
  - excluded_images:
    - '*'
    name: "5.2"
    namespace: ocp
releases:
  latest:
    integration:
      include_built_images: true
      name: "5.2"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: make test
  container:
    from: bin
- as: verify
  commands: |
    export GOCACHE=/tmp/
    export GOLANGCI_LINT_CACHE=/tmp/.cache
    make openshift-verify
  container:
    from: bin
zz_generated_metadata:
  branch: release-5.2
  org: openshift
  repo: kubernetes-sigs-karpenter
