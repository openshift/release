releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-aws-sno-z-stream-upgrade
  run_if_changed: releases/lvm-operator-.*
  steps:
    cluster_profile: openshift-org-aws
    env:
      LVM_OPERATOR_SUB_CHANNEL: stable-5.0
      LVM_OPERATOR_SUB_INSTALL_NAMESPACE: openshift-lvm-storage
      LVM_OPERATOR_SUB_PACKAGE: lvms-operator
      LVM_OPERATOR_SUB_SOURCE: redhat-operators
      LVMS_NAMESPACE: openshift-lvm-storage
      STORAGE_WORKLOAD_COUNT: "3"
      TARGET_LVMS_CHANNEL: stable-5.0
      TARGET_LVMS_SOURCE: lvm-catalogsource
      ZSTREAM_VERSION: "5.0"
    test:
    - ref: storage-data-create
    - ref: lvms-upgrade
    - as: verify-z-stream-upgrade
      cli: latest
      commands: |
        LVMS_NAMESPACE="${LVMS_NAMESPACE:-openshift-lvm-storage}"
        # Get the LVMS CSV name from the subscription's installedCSV field
        csv_name=$(oc get subscription lvms-operator -n "${LVMS_NAMESPACE}" -o jsonpath='{.status.installedCSV}' 2>/dev/null)
        if [[ -z "${csv_name}" ]]; then
          echo "ERROR: Could not find installedCSV from lvms-operator subscription"
          exit 1
        fi
        csv_version=$(oc get csv "${csv_name}" -n "${LVMS_NAMESPACE}" -o jsonpath='{.spec.version}')
        echo "LVMS CSV version after upgrade: ${csv_version}"
        # Verify it's a z-stream version (5.0.y where y > 0)
        if [[ "${csv_version}" =~ ^5\.0\.[1-9][0-9]*$ ]]; then
          echo "Z-stream upgrade verified: ${csv_version}"
        else
          echo "ERROR: Expected z-stream version (5.0.y where y > 0), got: ${csv_version}"
          exit 1
        fi
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: storage-data-check
    workflow: cucushift-installer-rehearse-aws-ipi-sno-lvms
- as: e2e-aws-mno-z-stream-upgrade
  run_if_changed: releases/lvm-operator-.*
  steps:
    cluster_profile: openshift-org-aws
    env:
      COMPUTE_NODE_TYPE: m5.2xlarge
      LVM_OPERATOR_SUB_CHANNEL: stable-5.0
      LVM_OPERATOR_SUB_INSTALL_NAMESPACE: openshift-lvm-storage
      LVM_OPERATOR_SUB_PACKAGE: lvms-operator
      LVM_OPERATOR_SUB_SOURCE: redhat-operators
      LVMS_NAMESPACE: openshift-lvm-storage
      STORAGE_WORKLOAD_COUNT: "3"
      TARGET_LVMS_CHANNEL: stable-5.0
      TARGET_LVMS_SOURCE: lvm-catalogsource
      ZSTREAM_VERSION: "5.0"
    test:
    - ref: storage-data-create
    - ref: lvms-upgrade
    - as: verify-z-stream-upgrade
      cli: latest
      commands: |
        LVMS_NAMESPACE="${LVMS_NAMESPACE:-openshift-lvm-storage}"
        # Get the LVMS CSV name from the subscription's installedCSV field
        csv_name=$(oc get subscription lvms-operator -n "${LVMS_NAMESPACE}" -o jsonpath='{.status.installedCSV}' 2>/dev/null)
        if [[ -z "${csv_name}" ]]; then
          echo "ERROR: Could not find installedCSV from lvms-operator subscription"
          exit 1
        fi
        csv_version=$(oc get csv "${csv_name}" -n "${LVMS_NAMESPACE}" -o jsonpath='{.spec.version}')
        echo "LVMS CSV version after upgrade: ${csv_version}"
        # Verify it's a z-stream version (5.0.y where y > 0)
        if [[ "${csv_version}" =~ ^5\.0\.[1-9][0-9]*$ ]]; then
          echo "Z-stream upgrade verified: ${csv_version}"
        else
          echo "ERROR: Expected z-stream version (5.0.y where y > 0), got: ${csv_version}"
          exit 1
        fi
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: storage-data-check
    workflow: cucushift-installer-rehearse-aws-ipi-mno-lvms
zz_generated_metadata:
  branch: release-management
  org: openshift
  repo: lvm-operator
  variant: z-upgrade-5.0
