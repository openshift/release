build_root:
  from_repository: true
images:
  items:
  - dockerfile_literal: |-
      FROM registry.ci.openshift.org/openshift/release:rhel-9-release-golang-1.26-openshift-5.0
      USER 0
      RUN curl -fsSL https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz -o /tmp/gh.tar.gz && \
          echo 'a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112  /tmp/gh.tar.gz' | sha256sum -c - && \
          tar -xzf /tmp/gh.tar.gz -C /tmp && \
          install -m 0755 /tmp/gh_2.97.0_linux_amd64/bin/gh /usr/local/bin/gh && \
          rm -rf /tmp/gh.tar.gz /tmp/gh_2.97.0_linux_amd64
      WORKDIR /app
      RUN git init /tmp/oape && \
          git -C /tmp/oape remote add origin https://github.com/neha037/oape-ai-e2e.git && \
          git -C /tmp/oape fetch --depth 1 origin b4de252c7688f27d243ae73b7fa987ebe2ae8c9c && \
          git -C /tmp/oape checkout --detach FETCH_HEAD && \
          test "$(git -C /tmp/oape rev-parse HEAD)" = b4de252c7688f27d243ae73b7fa987ebe2ae8c9c && \
          cp -a /tmp/oape/scripts /app/scripts && \
          cp -a /tmp/oape/plugins /plugins && \
          mkdir -p /config && cp -a /tmp/oape/deploy/config/. /config/ && \
          rm -rf /tmp/oape
      RUN curl -fsSL https://nodejs.org/dist/v22.18.0/node-v22.18.0-linux-x64.tar.gz -o /tmp/node.tar.gz && \
          echo 'a2e703725d8683be86bb5da967bf8272f4518bdaf10f21389e2b2c9eaeae8c8a  /tmp/node.tar.gz' | sha256sum -c - && \
          mkdir -p /opt/node && tar -xzf /tmp/node.tar.gz -C /opt/node --strip-components=1 && \
          ln -s /opt/node/bin/node /usr/local/bin/node && \
          ln -s /opt/node/bin/npm /usr/local/bin/npm && \
          npm install -g --prefix /usr/local @anthropic-ai/claude-code@1.0.16 && \
          rm -f /tmp/node.tar.gz
      RUN git config --global user.name "openshift-app-platform-shift-bot" && \
          git config --global user.email "267347085+openshift-app-platform-shift-bot@users.noreply.github.com" && \
          mkdir -p /opt/app-root/src /config && chmod -R g=u /opt/app-root/src /config && \
          chmod g=u /app
      USER 1001
    to: ci-monitor-agent
  - dockerfile_path: ci/dockerfiles/builder.Dockerfile
    from: root
    to: osdk-builder
  - dockerfile_path: release/helm/Dockerfile
    to: helm-operator
  - dockerfile_path: ci/dockerfiles/helm-e2e.Dockerfile
    from: helm-operator
    inputs:
      osdk-builder:
        as:
        - osdk-builder
    to: osdk-helm-e2e
promotion:
  to:
  - excluded_images:
    - ci-monitor-agent
    - osdk-builder
    - osdk-helm-e2e
    - memcached-operator
    - nginx-operator
    name: "5.1"
    namespace: ocp
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 200m
      memory: 200Mi
test_binary_build_commands: make build/operator-sdk-dev-x86_64-linux-gnu
tests:
- always_run: false
  as: oape-ci-monitor
  optional: true
  steps:
    test:
    - as: monitor
      commands: |
        set -euo pipefail

        : "${REPO_OWNER:?Prow repository owner is required}"
        : "${REPO_NAME:?Prow repository name is required}"
        rehearsal=false
        if [[ "${REPO_OWNER}/${REPO_NAME}" == "openshift/release" ]]; then
          rehearsal=true
          if [[ ! "${OAPE_TEST_PR_NUMBER:-}" =~ ^[1-9][0-9]*$ ]]; then
            echo "[setup] ERROR: release rehearsal requires an explicit SDK demo PR number" >&2
            exit 1
          fi
          export REPO_OWNER=openshift
          export REPO_NAME=ocp-release-operator-sdk
          export PULL_NUMBER="${OAPE_TEST_PR_NUMBER}"
        elif [[ "${REPO_OWNER}/${REPO_NAME}" == "openshift/ocp-release-operator-sdk" ]]; then
          : "${PULL_NUMBER:?SDK PR number is required}"
        else
          echo "[setup] ERROR: unexpected Prow repository ${REPO_OWNER}/${REPO_NAME}" >&2
          exit 1
        fi
        if [[ ! "${PULL_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
          echo "[setup] ERROR: invalid SDK PR number ${PULL_NUMBER}" >&2
          exit 1
        fi

        export PR_URL="https://github.com/openshift/ocp-release-operator-sdk/pull/${PULL_NUMBER}"
        export DRY_RUN=false
        export REVIEW_HANDLER_ENABLED=false
        export GOFLAGS=-tags=containers_image_openpgp
        export CGO_ENABLED=0
        export GOPATH=/tmp/ci-monitor-go
        export GOMODCACHE=/tmp/ci-monitor-go/pkg/mod
        export GOCACHE=/tmp/ci-monitor-go/cache
        export XDG_CACHE_HOME=/tmp/ci-monitor-cache
        export XDG_CONFIG_HOME=/tmp/ci-monitor-config
        export GIT_CONFIG_GLOBAL=/tmp/ci-monitor-gitconfig
        export GOOGLE_APPLICATION_CREDENTIALS=/var/run/gcloud-adc/application_default_credentials.json
        export CLAUDE_CODE_USE_VERTEX=1
        export CLOUD_ML_REGION=global
        export ANTHROPIC_VERTEX_PROJECT_ID=itpc-gcp-hcm-pe-eng-claude
        export SKIP_POLL="$rehearsal"
        export SELF_JOB_NAME=oape-ci-monitor
        export OAPE_RUN_URL="${BUILD_LOG_URL:-}"

        if [[ ! -s /var/run/github-app/app-id || ! -s /var/run/github-app/private-key.pem ]]; then
          echo "[auth] ERROR: GitHub App credentials are required for a live formatting push" >&2
          exit 1
        fi
        refresh_app_token() {
          local target_repo="$1"
          local repo_name="${target_repo#*/}"
          local app_id header now payload signature jwt installation installation_id token_response request_body
          app_id=$(cat /var/run/github-app/app-id)
          header=$(printf '{"alg":"RS256","typ":"JWT"}' | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
          now=$(date +%s)
          payload=$(printf '{"iat":%d,"exp":%d,"iss":"%s"}' "$((now - 60))" "$((now + 300))" "$app_id" | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
          signature=$(printf '%s' "${header}.${payload}" | openssl dgst -sha256 -sign /var/run/github-app/private-key.pem -binary | openssl base64 -e -A | tr '+/' '-_' | tr -d '=')
          jwt="${header}.${payload}.${signature}"
          installation=$(curl -fsS --retry 3 -H "Authorization: Bearer ${jwt}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${target_repo}/installation") || {
              echo "[auth] ERROR: App is not installed on ${target_repo}" >&2
              exit 1
            }
          installation_id=$(jq -er '.id' <<< "$installation")
          request_body=$(jq -nc --arg repo "$repo_name" '{repositories: [$repo]}')
          token_response=$(curl -fsS --retry 3 -X POST -H "Authorization: Bearer ${jwt}" -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$request_body" \
            "https://api.github.com/app/installations/${installation_id}/access_tokens") || {
              echo "[auth] ERROR: App cannot obtain a token for ${target_repo}" >&2
              exit 1
            }
          APP_CONTENTS_PERMISSION=$(jq -r '.permissions.contents // "none"' <<< "$token_response")
          APP_PR_PERMISSION=$(jq -r '.permissions.pull_requests // "none"' <<< "$token_response")
          APP_ISSUES_PERMISSION=$(jq -r '.permissions.issues // "none"' <<< "$token_response")
          export GH_TOKEN
          GH_TOKEN=$(jq -er '.token' <<< "$token_response")
        }
        refresh_app_token openshift/ocp-release-operator-sdk
        if [[ "$APP_PR_PERMISSION" != write && "$APP_ISSUES_PERMISSION" != write ]]; then
          echo "[auth] ERROR: upstream App token cannot comment on SDK PRs" >&2
          exit 1
        fi
        pr_json=$(gh api "repos/openshift/ocp-release-operator-sdk/pulls/${PULL_NUMBER}")
        if [[ "$(jq -r '.state' <<< "$pr_json")" != open ]]; then
          echo "[setup] ERROR: SDK PR must be open" >&2
          exit 1
        fi
        head_repo=$(jq -er '.head.repo.full_name' <<< "$pr_json")
        if [[ "$rehearsal" == true && "$head_repo" != neha037/ocp-release-operator-sdk ]]; then
          echo "[setup] ERROR: rehearsal PR must use the dedicated SDK demo fork" >&2
          exit 1
        fi
        if [[ "$rehearsal" == true && "$(jq -r '.draft' <<< "$pr_json")" != true ]]; then
          echo "[setup] ERROR: the rehearsal demo PR must remain draft" >&2
          exit 1
        fi
        checks_json=$(gh pr checks "$PULL_NUMBER" --repo openshift/ocp-release-operator-sdk --json name,state,link,bucket)
        if [[ "$rehearsal" == true ]] && ! jq -e '.[] | select(.name == "ci/prow/unit" and .bucket == "fail")' <<< "$checks_json" >/dev/null; then
          echo "[verify] ERROR: SDK unit must fail before the live rehearsal" >&2
          exit 1
        fi
        before_sha=$(jq -r '.head.sha' <<< "$pr_json")
        refresh_app_token "$head_repo"
        if [[ "$APP_CONTENTS_PERMISSION" != write || "$(gh api "repos/${head_repo}" --jq '.permissions.push')" != true ]]; then
          echo "[auth] ERROR: App token cannot push to ${head_repo}" >&2
          exit 1
        fi
        refresh_app_token openshift/ocp-release-operator-sdk
        gh auth setup-git
        echo "[setup] Monitoring ${PR_URL}; head ${before_sha}"
        /app/scripts/ci-monitor/monitor.sh
        refresh_app_token "$head_repo"
        gh auth setup-git
        /app/scripts/ci-monitor/dispatch.sh

        result_file=/tmp/ci-monitor-result.json
        if [[ "$rehearsal" == true ]]; then
          if ! jq -e '.trigger_actions[] | select(.action == "auto-fix-lint" and (.job | contains("unit")))' "$result_file" >/dev/null; then
            echo "[verify] ERROR: SDK unit failure was not classified as fixable formatting" >&2
            exit 1
          fi
        fi
        if [[ "$rehearsal" == true ]] || jq -e '.trigger_actions[] | select(.action == "auto-fix-lint" or .action == "auto-fix-generated")' "$result_file" >/dev/null; then
          refresh_app_token openshift/ocp-release-operator-sdk
          after_sha=$(gh api "repos/openshift/ocp-release-operator-sdk/pulls/${PULL_NUMBER}" --jq '.head.sha')
          if [[ "$after_sha" == "$before_sha" ]]; then
            echo "[verify] ERROR: CI-Monitor reported an auto-fix but did not push a commit" >&2
            exit 1
          fi
          echo "[verify] Bot pushed SDK head ${after_sha}"
          gh pr comment "$PULL_NUMBER" --repo openshift/ocp-release-operator-sdk \
            --body "CI-Monitor pushed formatting fix ${after_sha} to ${head_repo}."
        fi
      credentials:
      - mount_path: /var/run/gcloud-adc
        name: oap-lts-claude-gcp-vertex-sa
        namespace: test-credentials
      - mount_path: /var/run/github-app
        name: openshift-app-platform-shift-github-bot
        namespace: test-credentials
      env:
      - default: "474"
        name: OAPE_TEST_PR_NUMBER
      from: ci-monitor-agent
      resources:
        requests:
          cpu: "1"
          memory: 1Gi
      timeout: 3h0m0s
- as: unit
  commands: |
    echo "patch upstream"
    make -f ci/prow.Makefile patch
    echo "running unit tests"
    make test-unit
  container:
    from: src
- as: sanity
  commands: |
    echo "setting environment"
    export GOCACHE=/tmp
    export XDG_CACHE_HOME=/tmp
    unset VERSION
    echo "patch upstream"
    make -f ci/prow.Makefile patch
    echo "running make test-sanity"
    make test-sanity
  container:
    from: src
- always_run: false
  as: e2e-helm
  steps:
    cluster_profile: openshift-org-gcp
    test:
    - as: test
      cli: latest
      commands: make -f ci/prow.Makefile test-e2e-helm
      dependencies:
      - env: HELM_IMAGE
        name: osdk-helm-e2e
      - env: IMAGE_FORMAT
        name: osdk-helm-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-gcp
- always_run: false
  as: e2e-helm-fips
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      FIPS_ENABLED: "true"
    post:
    - chain: ipi-deprovision
    test:
    - as: test
      cli: latest
      commands: make -f ci/prow.Makefile test-e2e-helm
      dependencies:
      - env: HELM_IMAGE
        name: osdk-helm-e2e
      - env: IMAGE_FORMAT
        name: osdk-helm-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-gcp
- always_run: false
  as: e2e-helm-rhcos10-fips
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      FIPS_ENABLED: "true"
      OSSTREAM: rhel-10
    post:
    - chain: ipi-deprovision
    test:
    - as: test
      cli: latest
      commands: make -f ci/prow.Makefile test-e2e-helm
      dependencies:
      - env: HELM_IMAGE
        name: osdk-helm-e2e
      - env: IMAGE_FORMAT
        name: osdk-helm-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-gcp
- always_run: false
  as: e2e-helm-rhcos10
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      OSSTREAM: rhel-10
    test:
    - as: test
      cli: latest
      commands: make -f ci/prow.Makefile test-e2e-helm
      dependencies:
      - env: HELM_IMAGE
        name: osdk-helm-e2e
      - env: IMAGE_FORMAT
        name: osdk-helm-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-gcp
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
zz_generated_metadata:
  branch: main
  org: openshift
  repo: ocp-release-operator-sdk
