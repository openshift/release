base_images:
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: ci/dockerfiles/builder.Dockerfile
    from: root
    to: osdk-builder
  - dockerfile_path: release/helm/Dockerfile
    to: helm-operator
  - dockerfile_path: ci/dockerfiles/helm-e2e.Dockerfile
    from: helm-operator
    inputs:
      osdk-builder:
        as:
        - osdk-builder
    to: osdk-helm-e2e
promotion:
  to:
  - excluded_images:
    - osdk-builder
    - osdk-helm-e2e
    - memcached-operator
    - nginx-operator
    name: "5.0"
    namespace: ocp
releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 200m
      memory: 200Mi
test_binary_build_commands: make build/operator-sdk-dev-x86_64-linux-gnu
tests:
- as: unit
  commands: |
    echo "patch upstream"
    make -f ci/prow.Makefile patch
    echo "running unit tests"
    make test-unit
  container:
    from: src
- as: sanity
  commands: |
    echo "setting environment"
    export GOCACHE=/tmp
    export XDG_CACHE_HOME=/tmp
    unset VERSION
    echo "patch upstream"
    make -f ci/prow.Makefile patch
    echo "running make test-sanity"
    make test-sanity
  container:
    from: src
- as: e2e-helm
  steps:
    cluster_profile: openshift-org-gcp
    test:
    - as: test
      cli: latest
      commands: make -f ci/prow.Makefile test-e2e-helm
      dependencies:
      - env: HELM_IMAGE
        name: osdk-helm-e2e
      - env: IMAGE_FORMAT
        name: osdk-helm-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-gcp
- always_run: false
  as: e2e-helm-fips
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      FIPS_ENABLED: "true"
    post:
    - chain: ipi-deprovision
    test:
    - as: test
      cli: latest
      commands: make -f ci/prow.Makefile test-e2e-helm
      dependencies:
      - env: HELM_IMAGE
        name: osdk-helm-e2e
      - env: IMAGE_FORMAT
        name: osdk-helm-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-gcp
- always_run: false
  as: e2e-helm-rhcos10-fips
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      FIPS_ENABLED: "true"
      OSSTREAM: rhel-10
    post:
    - chain: ipi-deprovision
    test:
    - as: test
      cli: latest
      commands: make -f ci/prow.Makefile test-e2e-helm
      dependencies:
      - env: HELM_IMAGE
        name: osdk-helm-e2e
      - env: IMAGE_FORMAT
        name: osdk-helm-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-gcp
- always_run: false
  as: e2e-helm-rhcos10
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      OSSTREAM: rhel-10
    test:
    - as: test
      cli: latest
      commands: make -f ci/prow.Makefile test-e2e-helm
      dependencies:
      - env: HELM_IMAGE
        name: osdk-helm-e2e
      - env: IMAGE_FORMAT
        name: osdk-helm-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-gcp
- always_run: false
  as: tls13-adherence
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      PQC_CHECK: "false"
      SCAN_NAMESPACE: memcached-operator-system
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - as: deploy-operator
      cli: latest
      commands: |
        make -f ci/prow.Makefile patch
        cd testdata/helm/memcached-operator
        oc adm policy add-cluster-role-to-user cluster-admin -z default || true
        make deploy IMG="${IMAGE_FORMAT}"
        oc wait --for=condition=Available --timeout=5m -n memcached-operator-system deployment/memcached-operator-controller-manager
      dependencies:
      - env: IMAGE_FORMAT
        name: osdk-helm-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-gcp
- as: tls13-adherence-periodic
  cron: 0 6 * * 1
  steps:
    cluster_profile: openshift-org-gcp
    env:
      PQC_CHECK: "false"
      SCAN_NAMESPACE: memcached-operator-system
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - as: deploy-operator
      cli: latest
      commands: |
        make -f ci/prow.Makefile patch
        cd testdata/helm/memcached-operator
        oc adm policy add-cluster-role-to-user cluster-admin -z default || true
        make deploy IMG="${IMAGE_FORMAT}"
        oc wait --for=condition=Available --timeout=5m -n memcached-operator-system deployment/memcached-operator-controller-manager
      dependencies:
      - env: IMAGE_FORMAT
        name: osdk-helm-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-gcp
- always_run: false
  as: tls-pqc-readiness
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      PQC_CHECK: "true"
      SCAN_NAMESPACE: memcached-operator-system
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
    test:
    - as: deploy-operator
      cli: latest
      commands: |
        make -f ci/prow.Makefile patch
        cd testdata/helm/memcached-operator
        oc adm policy add-cluster-role-to-user cluster-admin -z default || true
        make deploy IMG="${IMAGE_FORMAT}"
        oc wait --for=condition=Available --timeout=5m -n memcached-operator-system deployment/memcached-operator-controller-manager
      dependencies:
      - env: IMAGE_FORMAT
        name: osdk-helm-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-gcp
- as: tls-pqc-readiness-periodic
  cron: 0 6 * * 1
  steps:
    cluster_profile: openshift-org-gcp
    env:
      PQC_CHECK: "true"
      SCAN_NAMESPACE: memcached-operator-system
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
    test:
    - as: deploy-operator
      cli: latest
      commands: |
        make -f ci/prow.Makefile patch
        cd testdata/helm/memcached-operator
        oc adm policy add-cluster-role-to-user cluster-admin -z default || true
        make deploy IMG="${IMAGE_FORMAT}"
        oc wait --for=condition=Available --timeout=5m -n memcached-operator-system deployment/memcached-operator-controller-manager
      dependencies:
      - env: IMAGE_FORMAT
        name: osdk-helm-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-gcp
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
zz_generated_metadata:
  branch: main
  org: openshift
  repo: ocp-release-operator-sdk
