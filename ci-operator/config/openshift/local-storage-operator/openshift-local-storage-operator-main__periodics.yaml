base_images:
  local-storage-diskmaker:
    name: "5.1"
    namespace: ocp
    tag: local-storage-diskmaker
  local-storage-operator:
    name: "5.1"
    namespace: ocp
    tag: local-storage-operator
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
build_root:
  from_repository: true
operator:
  bundles:
  - as: local-storage-operator-bundle
    context_dir: config
    dockerfile_path: bundle.Dockerfile
  substitutions:
  - pullspec: quay.io/openshift/origin-local-storage-operator:latest
    with: pipeline:local-storage-operator
  - pullspec: quay.io/openshift/origin-local-storage-diskmaker:latest
    with: pipeline:local-storage-diskmaker
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: periodic-tls-scanner-local-storage
  cron: 0 6 1,15 * *
  reporter_config:
    channel: '#team-ocp-storage-triage'
    job_states_to_report:
    - failure
    - error
    report_template: |
      ':red_jenkins_circle: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>'
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_INDEX: ci-index-local-storage-operator-bundle
    env:
      OO_CHANNEL: preview
      OO_INSTALL_NAMESPACE: openshift-local-storage
      OO_PACKAGE: local-storage-operator
      OO_TARGET_NAMESPACES: '!install'
      SCAN_NAMESPACE: openshift-local-storage
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: optional-operators-ci-aws
zz_generated_metadata:
  branch: main
  org: openshift
  repo: local-storage-operator
  variant: periodics
