base_images:
  origin_scos-4.22_base-stream9:
    name: scos-4.22
    namespace: origin
    tag: base-stream9
  origin_scos-4.22_cli:
    name: scos-4.22
    namespace: origin
    tag: cli
  origin_scos-4.22_installer:
    name: scos-4.22
    namespace: origin
    tag: installer
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-4.22
images:
  items:
  - build_args:
    - name: TAGS
      value: scos
    - name: DIRECT_DOWNLOAD
      value: "true"
    dockerfile_path: Dockerfile
    from: origin_scos-4.22_base-stream9
    inputs:
      origin_scos-4.22_cli:
        as:
        - cli
        - registry.ci.openshift.org/ocp/4.22:cli
      origin_scos-4.22_installer:
        as:
        - builder
        - registry.ci.openshift.org/ocp/4.22:installer
    to: machine-os-images
promotion:
  to:
  - name: scos-4.22
    namespace: origin
releases:
  latest:
    integration:
      include_built_images: true
      name: scos-4.22
      namespace: origin
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: e2e-aws-ovn
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    workflow: openshift-e2e-aws
zz_generated_metadata:
  branch: release-4.22
  org: openshift
  repo: machine-os-images
  variant: okd-scos
