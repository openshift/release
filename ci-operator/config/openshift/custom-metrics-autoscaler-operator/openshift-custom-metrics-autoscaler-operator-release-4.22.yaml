base_images:
  cli:
    name: "4.22"
    namespace: ocp
    tag: cli
  operand:
    name: "4.22"
    namespace: ocp
    tag: custom-metrics-autoscaler
  operand-adapter:
    name: "4.22"
    namespace: ocp
    tag: custom-metrics-autoscaler-adapter
  operand-webhook:
    name: "4.22"
    namespace: ocp
    tag: custom-metrics-autoscaler-webhooks
  libvirt-installer:
    name: "4.22"
    namespace: ocp
    tag: libvirt-installer
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
  upi-installer:
    name: "4.22"
    namespace: ocp
    tag: upi-installer
build_root:
  from_repository: true
canonical_go_repository: github.com/kedacore/keda-olm-operator
images:
  items:
  - dockerfile_path: Dockerfile.ci
    inputs:
      cli:
        as:
        - registry.redhat.io/openshift4/ose-cli:latest
    to: custom-metrics-autoscaler-operator
operator:
  bundles:
  - as: custom-metrics-autoscaler-operator-bundle
    context_dir: .
    dockerfile_path: bundle.Dockerfile.ci
    skip_building_index: true
  substitutions:
  - pullspec: ghcr.io/kedacore/keda-olm-operator:.*
    with: pipeline:custom-metrics-autoscaler-operator
  - pullspec: CMA_OPERAND_PLACEHOLDER_1
    with: pipeline:operand
  - pullspec: CMA_OPERAND_PLACEHOLDER_2
    with: pipeline:operand-adapter
  - pullspec: CMA_OPERAND_PLACEHOLDER_3
    with: pipeline:operand-webhook
promotion:
  to:
  - name: "4.22"
    namespace: ocp
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    integration:
      name: "4.22"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.22"
      namespace: ocp
  s390x-latest:
    candidate:
      architecture: s390x
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: gofmt
  commands: env && GOFLAGS="" make fmt
  container:
    from: src
  skip_if_only_changed: ^docs/|^\.github|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|OWNERS_ALIASES|PROJECT|LICENSE)$
- as: govet
  commands: env && GOFLAGS="" make vet
  container:
    from: src
  skip_if_only_changed: ^docs/|^\.github|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|OWNERS_ALIASES|PROJECT|LICENSE)$
- as: cma-check-all-csv
  commands: env && GOFLAGS="" make cma-check-all-csv
  container:
    from: src
  skip_if_only_changed: ^docs/|^\.github|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|OWNERS_ALIASES|PROJECT|LICENSE)$
- as: cma-verify-history
  commands: env && GOFLAGS="" hack/cma-verify-history.sh
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
- as: security
  optional: true
  skip_if_only_changed: ^docs/|^\.github|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|OWNERS_ALIASES|PROJECT|LICENSE)$
  steps:
    env:
      PROJECT_NAME: custom-metrics-autoscaler-operator
    workflow: openshift-ci-security
- always_run: false
  as: cma-e2e-aws-ovn
  pipeline_skip_if_only_changed: ^docs/|^\.github|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|OWNERS_ALIASES|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-aws
    post:
    - chain: ipi-aws-post
    pre:
    - chain: ipi-aws-pre
    test:
    - chain: keda-e2e-cma
- always_run: false
  as: cma-e2e-gcp-ovn
  pipeline_skip_if_only_changed: ^docs/|^\.github|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|OWNERS_ALIASES|PROJECT|LICENSE)$
  steps:
    cluster_profile: openshift-org-gcp
    post:
    - chain: ipi-gcp-post
    pre:
    - chain: ipi-gcp-pre
    test:
    - chain: keda-e2e-cma
- always_run: false
  as: cma-e2e-s390x-libvirt
  capabilities:
  - intranet
  cluster: build12
  optional: true
  steps:
    cluster_profile: libvirt-s390x-vpn-oz
    dependencies:
      OPENSHIFT_INSTALL_TARGET: release:s390x-latest
    env:
      ARCH: s390x
      BRANCH: "4.22"
      E2E_INSTALL_KEDA: "false"
      E2E_TEST_CONFIG: openshift-e2e.yaml
      ETCD_DISK_SPEED: slow
      USE_EXTERNAL_DNS: "true"
    test:
    - ref: custom-metrics-autoscaler-operator-libvirt-s390x-e2e-image-tag-mirror
    - chain: keda-e2e-cma
    workflow: custom-metrics-autoscaler-operator-libvirt-s390x
zz_generated_metadata:
  branch: release-4.22
  org: openshift
  repo: custom-metrics-autoscaler-operator
