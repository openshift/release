build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.image-service
    to: assisted-image-service
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    integration:
      include_built_images: true
      name: "4.20"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: main
  org: openshift
  repo: assisted-image-service
