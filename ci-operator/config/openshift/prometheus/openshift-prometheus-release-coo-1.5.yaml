build_root:
  from_repository: true
resources:
  '*':
    requests:
      cpu: 1000m
      memory: 4Gi
tests:
- as: common-test
  commands: GO_ONLY=1 GOOPTS="-tags=builtinassets -p=1" make test
  container:
    from: src
- as: frontend-test
  commands: |
    nodejs_version=v22.15.0
    nodejs="node-${nodejs_version}-linux-x64"
    cd /tmp
    curl -LO "https://nodejs.org/download/release/${nodejs_version}/${nodejs}.tar.gz"
    tar xf "${nodejs}.tar.gz"
    export PATH="/tmp/${nodejs}/bin:${PATH}"
    HOME=/tmp npm install pnpm@latest-11
    export PATH="/tmp/node_modules/.bin:${PATH}"
    cd -
    export npm_config_cache=/tmp/.npm
    make ui-install ui-build-module ui-test
  container:
    from: src
zz_generated_metadata:
  branch: release-coo-1.5
  org: openshift
  repo: prometheus
