base_images:
  hypershift-operator:
    name: hypershift-operator
    namespace: hypershift
    tag: latest
  hypershift-tests:
    name: hypershift-tests
    namespace: hypershift
    tag: latest
binary_build_commands: CGO_ENABLED=0 go build -o /go/bin/hypershift-oadp-plugin .
build_root:
  image_stream_tag:
    name: builder
    namespace: konveyor
    tag: ubi9-v1.25
images:
  items:
  - dockerfile_path: Dockerfile
    to: hypershift-oadp-plugin-oadp-1.5
promotion:
  to:
  - name: hypershift-oadp-plugin
    namespace: konveyor
releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp
  latest-421:
    candidate:
      product: ocp
      stream: ci
      version: "4.21"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: |
    export GOCACHE=/tmp/gocache
    export GOMODCACHE=/tmp/gomodcache
    make test
  container:
    from: src
- as: security
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    env:
      SNYK_CODE_ADDITIONAL_ARGS: --severity-threshold=high -d
      SNYK_ENABLE_DEPS_SCAN: "false"
    workflow: openshift-ci-security
- as: build
  commands: |
    export GOCACHE=/tmp/gocache
    export GOMODCACHE=/tmp/gomodcache
    make local
  container:
    from: src
- as: verify
  commands: |
    export GOCACHE=/tmp/gocache
    export GOMODCACHE=/tmp/gomodcache
    make verify
  container:
    from: src
- always_run: false
  as: e2e-aws-backuprestore
  capabilities:
  - arm64
  optional: true
  steps:
    cluster_profile: hypershift-aws
    dependency_overrides:
      OADP_HYPERSHIFT_PLUGIN_IMAGE: pipeline:hypershift-oadp-plugin-oadp-1.5
    env:
      TECH_PREVIEW_NO_UPGRADE: "true"
      TEST_SUITE: openshift/conformance/parallel/minimal
    workflow: hypershift-aws-e2e-backuprestore
- as: e2e-aks-standalone-velero
  capabilities:
  - arm64
  cron: 29 3 * * 2
  steps:
    cluster_profile: hypershift-aks
    dependency_overrides:
      OADP_HYPERSHIFT_PLUGIN_IMAGE: pipeline:hypershift-oadp-plugin-oadp-1.5
    workflow: hypershift-azure-aks-standalone-velero
- as: e2e-aro-oadp-backuprestore
  capabilities:
  - arm64
  cron: 53 4 * * 2
  steps:
    cluster_profile: azure-qe
    dependencies:
      RELEASE_IMAGE_LATEST: release:latest-421
    dependency_overrides:
      OADP_HYPERSHIFT_PLUGIN_IMAGE: pipeline:hypershift-oadp-plugin-oadp-1.5
    env:
      ARO_CLUSTER_VERSION: "4.21"
    workflow: hypershift-azure-aro-oadp-backuprestore
zz_generated_metadata:
  branch: oadp-1.5
  org: openshift
  repo: hypershift-oadp-plugin
