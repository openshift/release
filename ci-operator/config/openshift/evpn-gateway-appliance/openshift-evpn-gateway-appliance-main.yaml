base_images:
  ubi-python:
    name: ubi-python-312
    namespace: ocp
    tag: "9"
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.ci
    from: ubi-python
    to: ansible-test-runner
releases:
  latest:
    release:
      channel: stable
      version: "4.19"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify
  commands: make verify OFFLINE=1
  container:
    from: ansible-test-runner
- always_run: false
  as: aws-vm-rhel10
  steps:
    cluster_profile: openshift-org-aws
    env:
      EC2_AMI: ami-0da467f007dfebd6b
      EC2_INSTANCE_TYPE: c5n.metal
      EC2_REGION: us-west-2
    post:
    - ref: aws-deprovision-stacks
    pre:
    - chain: openshift-image-based-infra-aws-ec2
    test:
    - as: smoke
      commands: |
        set -euo pipefail
        ip=$(cat "${SHARED_DIR}/public_address")
        user=$(cat "${SHARED_DIR}/ssh_user")
        ssh -i "${CLUSTER_PROFILE_DIR}/ssh-privatekey" \
          -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
          "${user}@${ip}" 'cat /etc/os-release && sudo dnf install -y podman && podman version'
      from: ansible-test-runner
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
zz_generated_metadata:
  branch: main
  org: openshift
  repo: evpn-gateway-appliance
