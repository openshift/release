base_images:
  ubi-python:
    name: ubi-python-312
    namespace: ocp
    tag: "9"
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.ci
    from: ubi-python
    to: ansible-test-runner
releases:
  latest:
    integration:
      name: "5.1"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify
  commands: make verify OFFLINE=1
  container:
    from: ansible-test-runner
- always_run: false
  as: aws-vm-rhel10
  steps:
    cluster_profile: openshift-org-aws
    env:
      BOOTC_BASE: quay.io/centos-bootc/centos-bootc@sha256:9aedf2d189b85c498697f9b83112c893b084d359268da7dd6d5d848478d260de
      EC2_AMI: ami-0da467f007dfebd6b
      EC2_INSTANCE_TYPE: m6i.xlarge
      EC2_REGION: us-west-2
      REGION: us-west-2
    post:
    - ref: aws-deprovision-stacks
    pre:
    - chain: openshift-image-based-infra-aws-ec2
    test:
    - ref: openshift-evpn-gateway-appliance-runtime
zz_generated_metadata:
  branch: main
  org: openshift
  repo: evpn-gateway-appliance
