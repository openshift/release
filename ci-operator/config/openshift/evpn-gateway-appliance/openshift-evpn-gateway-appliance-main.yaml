base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  ubi-python:
    name: ubi-python-312
    namespace: ocp
    tag: "9"
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.ci
    from: ubi-python
    to: ansible-test-runner
  - dockerfile_literal: |
      FROM nested-podman
      USER root
      RUN dnf install -y git go make && dnf clean all
    from: nested-podman
    to: image-ci-podman
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: image-ci
  capabilities:
  - nested-podman
  nested_podman: true
  steps:
    test:
    - ref: openshift-evpn-gateway-appliance-image-ci
- as: verify
  commands: make verify OFFLINE=1
  container:
    from: ansible-test-runner
zz_generated_metadata:
  branch: main
  org: openshift
  repo: evpn-gateway-appliance
