base_images:
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: build/Dockerfile
    to: pagerduty-operator
  - dockerfile_literal: |
      FROM src AS builder
      RUN CGO_ENABLED=0 GOFLAGS="-mod=mod" go test ./test/e2e -v -c --tags=osde2e -o /usr/local/bin/e2e.test
      FROM rosa-aws-cli
      COPY --from=builder /usr/local/bin/e2e.test /usr/local/bin/e2e.test
    inputs:
      rosa-aws-cli:
        as:
        - rosa-aws-cli
      src:
        as:
        - src
        - builder
    to: operator-e2e
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "4.21"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
  lint:
    limits:
      memory: 6Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  secret:
    collection: sd-sre-secrets
    group: pagerduty-operator-codecov-token
    mount_path: /tmp/secret
- as: publish-coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  postsubmit: true
  secret:
    collection: sd-sre-secrets
    group: pagerduty-operator-codecov-token
    mount_path: /tmp/secret
- as: lint
  commands: make lint
  container:
    from: src
- as: test
  commands: make test
  container:
    from: src
- as: validate
  commands: make validate
  container:
    from: src
- as: hive-e2e
  capabilities:
  - intranet
  restrict_network_access: false
  steps:
    cluster_profile: rosa-e2e-01
    env:
      BACKPLANE_CLUSTER_ID: 1g268u7pp694gj152nj16me4sv615lpv
      BACKPLANE_ELEVATE_REASON: https://redhat.atlassian.net/browse/ROSAENG-65553
      GINKGO_FOCUS: Pagerduty Operator
      OPERATOR_NAME: pagerduty-operator
      OPERATOR_NAMESPACE: pagerduty-operator
    workflow: rosa-hive-e2e
- as: hive-e2e-promotion-int
  capabilities:
  - intranet
  cron: 0 0 31 2 *
  reporter_config:
    channel: '#rosa-prow-info'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{- if eq .Status.State "success"}} :green_jenkins_circle: Job
      *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{- else}} :red_jenkins_circle: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs> <@U0AKNPBBVT7> {{- end}}'
  restrict_network_access: false
  steps:
    cluster_profile: rosa-e2e-01
    env:
      BACKPLANE_CLUSTER_ID: 1g268u7pp694gj152nj16me4sv615lpv
      BACKPLANE_ELEVATE_REASON: https://redhat.atlassian.net/browse/ROSAENG-65553
      GINKGO_FOCUS: Pagerduty Operator
      OPERATOR_NAME: pagerduty-operator
      OPERATOR_NAMESPACE: pagerduty-operator
    workflow: rosa-hive-e2e
- as: hive-e2e-promotion-stage
  capabilities:
  - intranet
  cron: 0 0 31 2 *
  reporter_config:
    channel: '#rosa-prow-info'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{- if eq .Status.State "success"}} :green_jenkins_circle: Job
      *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{- else}} :red_jenkins_circle: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs> <@U0AKNPBBVT7> {{- end}}'
  restrict_network_access: false
  steps:
    cluster_profile: rosa-e2e-01
    env:
      BACKPLANE_CLUSTER_ID: 1farlonnersks14ohfp155uoonupr9id
      BACKPLANE_ELEVATE_REASON: https://redhat.atlassian.net/browse/ROSAENG-65553
      GINKGO_FOCUS: Pagerduty Operator
      OPERATOR_NAME: pagerduty-operator
      OPERATOR_NAMESPACE: pagerduty-operator
    workflow: rosa-hive-e2e
zz_generated_metadata:
  branch: master
  org: openshift
  repo: pagerduty-operator
