base_images:
  microshift-ci-brew:
    name: brew
    namespace: microshift
    tag: latest
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.21-openshift-4.16
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.16"
  nightly-amd64:
    candidate:
      product: ocp
      stream: nightly
      version: "4.16"
  nightly-arm64:
    candidate:
      architecture: arm64
      product: ocp
      stream: nightly
      version: "4.16"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: rebase-on-nightlies
  cron: 0 4 * * 1
  reporter_config:
    channel: '#microshift-alerts'
    job_states_to_report:
    - failure
    - error
    report_template: ':red_jenkins_circle: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs>'
  steps:
    workflow: openshift-microshift-rebase
zz_generated_metadata:
  branch: release-4.16
  org: openshift
  repo: microshift
  variant: periodics
