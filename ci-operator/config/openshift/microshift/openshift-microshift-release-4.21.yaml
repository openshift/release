      MICROSHIFT_OS: rhel-9.6
      SCENARIO_TYPE: bootc-presubmits
    workflow: openshift-microshift-e2e-metal-tests
- always_run: false
  as: e2e-aws-tests-bootc-periodic
  pipeline_run_if_changed: ^(test/bin/.*|test/scenarios-bootc/periodics/.*)$
