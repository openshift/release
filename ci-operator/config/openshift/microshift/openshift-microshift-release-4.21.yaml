base_images:
  microshift-ci-brew:
    name: brew
    namespace: microshift
    tag: latest
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.24-openshift-4.21
images:
  items:
  - dockerfile_literal: |
      FROM src
      RUN dnf install --setopt=tsflags=nodocs -y selinux-policy-devel
    inputs:
      src:
        as:
        - src
        paths:
        - destination_dir: .
          source_path: /go/src/github.com/openshift/microshift
    optional: true
    to: microshift-test-rpm
promotion:
  to:
  - excluded_images:
    - microshift-test-rpm
    name: "4.21"
    namespace: ocp
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.21"
  nightly-amd64:
    candidate:
      product: ocp
      stream: nightly
      version: "4.21"
  nightly-arm64:
    candidate:
      architecture: arm64
      product: ocp
      stream: nightly
      version: "4.21"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify
  steps:
    test:
    - as: verify
      commands: make verify-ci
      env:
      - default: /tmp/
        name: GOLANGCI_LINT_CACHE
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: test-unit
  commands: make test-unit
  container:
    from: src
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "false"
    test:
    - ref: go-verify-deps
- as: test-rpm
  commands: RPM_INFO=true make rpm srpm
  container:
    from: microshift-test-rpm
  run_if_changed: ^(rpm/.*|packaging/.*|Makefile)$
- as: security
  optional: true
  steps:
    workflow: openshift-ci-security
- as: test-rebase
  optional: true
  run_if_changed: ^(assets/.*|scripts/auto-rebase/.*|go\.mod|vendor/.*|deps/.*)$
  steps:
    env:
      DRY_RUN: "y"
    workflow: openshift-microshift-rebase
- always_run: false
  as: e2e-aws-tests
  pipeline_run_if_changed: ^(assets/.*|cmd/.*|etcd/.*|pkg/.*|packaging/.*|test/.*|vendor/.*|Makefile.*|scripts/.*)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      EC2_INSTANCE_TYPE: c5.metal
      MICROSHIFT_OS: rhel-9.6
      SCENARIO_TYPE: presubmits
    workflow: openshift-microshift-e2e-metal-tests
- always_run: false
  as: e2e-aws-tests-arm
  pipeline_run_if_changed: ^(assets/.*|cmd/.*|etcd/.*|pkg/.*|packaging/.*|test/.*|vendor/.*|Makefile.*|scripts/.*)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      EC2_INSTANCE_TYPE: m7g.metal
      MICROSHIFT_OS: rhel-9.6
      SCENARIO_TYPE: presubmits
    workflow: openshift-microshift-e2e-metal-tests
- always_run: false
  as: e2e-aws-tests-cache
  capabilities:
  - intranet
  pipeline_run_if_changed: ^test\/bin\/(ci_phase_iso_build|manage_build_cache)\.sh$
  restrict_network_access: false
  steps:
    cluster_profile: openshift-org-aws
    env:
      MICROSHIFT_OS: rhel-9.6
    workflow: openshift-microshift-e2e-metal-cache
- always_run: false
  as: e2e-aws-tests-cache-arm
  capabilities:
  - intranet
  pipeline_run_if_changed: ^test\/bin\/(ci_phase_iso_build|manage_build_cache)\.sh$
  restrict_network_access: false
  steps:
    cluster_profile: openshift-org-aws
    env:
      EC2_INSTANCE_TYPE: c7g.2xlarge
      MICROSHIFT_OS: rhel-9.6
    workflow: openshift-microshift-e2e-metal-cache
- always_run: false
  as: e2e-aws-tests-periodic
  pipeline_run_if_changed: ^(test/bin/.*|test/scenarios-periodics/.*|test/scenarios/periodics/.*)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      EC2_INSTANCE_TYPE: c5.metal
      MICROSHIFT_OS: rhel-9.6
      SCENARIO_TYPE: periodics
    workflow: openshift-microshift-e2e-metal-tests
- always_run: false
  as: e2e-aws-tests-periodic-arm
  pipeline_run_if_changed: ^(test/bin/.*|test/scenarios-periodics/.*|test/scenarios/periodics/.*)$
  steps:
    cluster_profile: openshift-org-aws
    env:
      EC2_INSTANCE_TYPE: m7g.metal
      MICROSHIFT_OS: rhel-9.6
      SCENARIO_TYPE: periodics
