base_images:
  cli:
    name: "5.0"
    namespace: ocp
    tag: cli
  operator-sdk:
    name: cli-operator-sdk
    namespace: ocp
    tag: v1.39.2
binary_build_commands: make build
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-8-golang-1.23-openshift-4.19
canonical_go_repository: github.com/grafana/tempo-operator
images:
  items:
  - context_dir: .
    dockerfile_path: Dockerfile
    to: tempo-operator
  - context_dir: .
    dockerfile_path: tests/Dockerfile
    to: obs-tests-runner
operator:
  bundles:
  - as: tempo-bundle
    context_dir: ./bundle/openshift
    dockerfile_path: bundle.Dockerfile
  substitutions:
  - pullspec: ghcr.io/grafana/tempo-operator/tempo-operator:.*
    with: pipeline:tempo-operator
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: tempo-upstream-tests
  steps:
    cluster_profile: aws-observability
    env:
      BASE_DOMAIN: devobscluster.devcluster.openshift.com
      TIMEOUT: +8 hours
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace openshift-tempo-operator
        cd /tmp && operator-sdk run bundle --timeout=10m --security-context-config restricted -n openshift-tempo-operator "$OO_BUNDLE"
        oc wait --for condition=Available -n openshift-tempo-operator deployment tempo-operator-controller
      dependencies:
      - env: OO_BUNDLE
        name: tempo-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 1000m
          memory: 400Mi
    - ref: wait
    workflow: cucushift-installer-rehearse-aws-ipi
zz_generated_metadata:
  branch: main
  org: openshift
  repo: grafana-tempo-operator
  variant: upstream-ocp-5.0-amd64
