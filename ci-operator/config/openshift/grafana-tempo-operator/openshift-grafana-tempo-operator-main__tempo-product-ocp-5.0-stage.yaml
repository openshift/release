base_images:
  cli:
    name: "5.0"
    namespace: ocp
    tag: cli
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-8-golang-1.23-openshift-4.19
canonical_go_repository: github.com/grafana/tempo-operator
images:
  items:
  - context_dir: .
    dockerfile_path: tests/Dockerfile
    to: obs-tests-runner
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: tempo-stage-tests
  cron: 0 0 30 2 *
  reporter_config:
    channel: '#distributed-tracing-qe'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :slack-green: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :failed:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  steps:
    cluster_profile: aws-observability
    env:
      AGENT_SKILL: tempo
      BASE_DOMAIN: devobscluster.devcluster.openshift.com
      MULTISTAGE_PARAM_OVERRIDE_TEMPO_INDEX_IMAGE: brew.registry.redhat.io/rh-osbs/iib:1205371
      MULTISTAGE_PARAM_OVERRIDE_TEMPO_TESTS_BRANCH: rhosdt-3.11
      OPERATORS: |
        [
            {"name": "tempo-product", "source": "tempo-catalogsource", "channel": "stable", "install_namespace": "openshift-tempo-operator","target_namespaces": "", "operator_group": "openshift-tempo-operator"},
            {"name": "opentelemetry-product", "source": "redhat-operators", "channel": "stable", "install_namespace": "openshift-opentelemetry-operator", "target_namespaces": "", "operator_group": "openshift-opentelemetry-operator"},
            {"name": "cluster-observability-operator", "source": "redhat-operators", "channel": "stable", "install_namespace": "openshift-cluster-observability-operator", "target_namespaces": "", "operator_group":"coo-og"},
            {"name": "serverless-operator", "source": "redhat-operators", "channel": "stable", "install_namespace": "openshift-serverless", "target_namespaces": "", "operator_group": "openshift-serverless"}
        ]
      SKIP_TESTS: tests/e2e-openshift-object-stores/* tests/e2e-openshift-ossm/*
    post:
    - ref: openshift-observability-qe-agent
    test:
    - ref: distributed-tracing-install-tempo-konflux-catalogsource
    - ref: install-operators
    - ref: distributed-tracing-tests-tempo-stage
    workflow: cucushift-installer-rehearse-aws-ipi
zz_generated_metadata:
  branch: main
  org: openshift
  repo: grafana-tempo-operator
  variant: tempo-product-ocp-5.0-stage
