build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile.ocp
    to: openshift-mcp-server
  run_if_changed: x^
releases:
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 500m
      memory: 200Mi
tests:
- as: no-prs
  commands: echo "No PRs are allowed against this branch."; exit 1
  container:
    from: src
- as: mcpchecker-eval-google
  cron: 0 1 * * 2
  steps:
    cluster_profile: openshift-org-aws
    env:
      ANTHROPIC_USE_VERTEX: ""
      ASSERTION_PASS_RATE: "0.8"
      AWS_INSTALL_USE_MINIMAL_PERMISSIONS: "yes"
      EVAL_CONFIG: evals/core-eval-testing/builtin-google/eval-core.yaml
      EVAL_LABEL_SELECTOR: suite=core
      GEMINI_USE_VERTEX: "1"
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_CLOUD_PROJECT: ocp-mcp-server-team
      TASK_PASS_RATE: "0.8"
    test:
    - chain: openshift-mcp-server-mcpchecker-eval-vertex
    workflow: ipi-aws
- as: mcpchecker-eval-anthropic
  cron: 0 1 * * 3
  steps:
    cluster_profile: openshift-org-aws
    env:
      ANTHROPIC_USE_VERTEX: "1"
      ASSERTION_PASS_RATE: "0.8"
      AWS_INSTALL_USE_MINIMAL_PERMISSIONS: "yes"
      EVAL_CONFIG: evals/core-eval-testing/builtin-anthropic/eval-core.yaml
      EVAL_LABEL_SELECTOR: suite=core
      GEMINI_USE_VERTEX: ""
      GOOGLE_CLOUD_LOCATION: us-east5
      GOOGLE_CLOUD_PROJECT: ocp-mcp-server-team
      TASK_PASS_RATE: "0.8"
    test:
    - chain: openshift-mcp-server-mcpchecker-eval-vertex
    workflow: ipi-aws
- as: mcpchecker-eval-openai
  cron: 0 1 * * 4
  steps:
    cluster_profile: openshift-org-aws
    env:
      ASSERTION_PASS_RATE: "0.8"
      AWS_INSTALL_USE_MINIMAL_PERMISSIONS: "yes"
      EVAL_CONFIG: evals/core-eval-testing/builtin-openai/eval-core.yaml
      EVAL_LABEL_SELECTOR: suite=core
      TASK_PASS_RATE: "0.8"
    test:
    - chain: openshift-mcp-server-mcpchecker-eval-model-api
    workflow: ipi-aws
zz_generated_metadata:
  branch: release-1.2
  org: openshift
  repo: openshift-mcp-server
