build_root:
  from_repository: true
releases:
  latest:
    integration:
      name: "5.0"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 500m
      memory: 200Mi
tests:
- as: mcpchecker-eval-gpt-latest-core
  cron: 0 9 * * 1
  steps:
    cluster_profile: openshift-org-aws
    env:
      ASSERTION_PASS_RATE: "0.8"
      AWS_INSTALL_USE_MINIMAL_PERMISSIONS: "yes"
      EVAL_CONFIG: evals/core-eval-testing/builtin-gpt-latest/eval-core.yaml
      EVAL_LABEL_SELECTOR: suite=core
      EVAL_SUITE: core
      TASK_PASS_RATE: "0.8"
      TOOLSETS: core
    test:
    - chain: openshift-mcp-server-mcpchecker-eval-model-api
    workflow: ipi-aws
- as: mcpchecker-eval-gpt-previous-core
  cron: 0 17 * * 1
  steps:
    cluster_profile: openshift-org-aws
    env:
      ASSERTION_PASS_RATE: "0.8"
      AWS_INSTALL_USE_MINIMAL_PERMISSIONS: "yes"
      EVAL_CONFIG: evals/core-eval-testing/builtin-gpt-previous/eval-core.yaml
      EVAL_LABEL_SELECTOR: suite=core
      EVAL_SUITE: core
      TASK_PASS_RATE: "0.8"
      TOOLSETS: core
    test:
    - chain: openshift-mcp-server-mcpchecker-eval-model-api
    workflow: ipi-aws
- as: mcpchecker-eval-claude-sonnet-latest-core
  cron: 0 9 * * 2
  steps:
    cluster_profile: openshift-org-aws
    env:
      ANTHROPIC_USE_VERTEX: "1"
      ASSERTION_PASS_RATE: "0.8"
      AWS_INSTALL_USE_MINIMAL_PERMISSIONS: "yes"
      EVAL_CONFIG: evals/core-eval-testing/builtin-claude-sonnet-latest/eval-core.yaml
      EVAL_LABEL_SELECTOR: suite=core
      EVAL_SUITE: core
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_CLOUD_PROJECT: ocp-mcp-server-team
      TASK_PASS_RATE: "0.8"
      TOOLSETS: core
    test:
    - chain: openshift-mcp-server-mcpchecker-eval-vertex
    workflow: ipi-aws
- as: mcpchecker-eval-gemini-flash-latest-core
  cron: 0 9 * * 3
  steps:
    cluster_profile: openshift-org-aws
    env:
      ASSERTION_PASS_RATE: "0.8"
      AWS_INSTALL_USE_MINIMAL_PERMISSIONS: "yes"
      EVAL_CONFIG: evals/core-eval-testing/builtin-gemini-flash-latest/eval-core.yaml
      EVAL_LABEL_SELECTOR: suite=core
      EVAL_SUITE: core
      GEMINI_USE_VERTEX: "1"
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_CLOUD_PROJECT: ocp-mcp-server-team
      TASK_PASS_RATE: "0.8"
      TOOLSETS: core
    test:
    - chain: openshift-mcp-server-mcpchecker-eval-vertex
    workflow: ipi-aws
- as: mcpchecker-eval-gemini-flash-previous-core
  cron: 0 17 * * 3
  steps:
    cluster_profile: openshift-org-aws
    env:
      ASSERTION_PASS_RATE: "0.8"
      AWS_INSTALL_USE_MINIMAL_PERMISSIONS: "yes"
      EVAL_CONFIG: evals/core-eval-testing/builtin-gemini-flash-previous/eval-core.yaml
      EVAL_LABEL_SELECTOR: suite=core
      EVAL_SUITE: core
      GEMINI_USE_VERTEX: "1"
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_CLOUD_PROJECT: ocp-mcp-server-team
      TASK_PASS_RATE: "0.8"
      TOOLSETS: core
    test:
    - chain: openshift-mcp-server-mcpchecker-eval-vertex
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: openshift
  repo: openshift-mcp-server
  variant: periodics
