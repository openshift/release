base_images:
  openshift-mcp-server:
    name: "5.1"
    namespace: ocp
    tag: openshift-mcp-server
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
resources:
  '*':
    requests:
      cpu: 500m
      memory: 200Mi
tag_specification:
  name: "5.1"
  namespace: ocp
tests:
- as: tls-scanner-odh-latest
  cron: 0 9 * * 1
  steps:
    cluster_profile: openshift-org-aws
    env:
      SCAN_NAMESPACE: ocp-mcp-server
    test:
    - as: install-odh-latest
      cli: latest
      commands: |
        set -euo pipefail

        cat <<'EOF' | oc apply -f -
        apiVersion: operators.coreos.com/v1alpha1
        kind: CatalogSource
        metadata:
          name: opendatahub-operator-latest
          namespace: openshift-marketplace
        spec:
          image: quay.io/opendatahub/opendatahub-operator-catalog:latest
          sourceType: grpc
        ---
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: opendatahub-operator
          namespace: openshift-operators
        spec:
          channel: fast
          installPlanApproval: Automatic
          name: opendatahub-operator
          source: opendatahub-operator-latest
          sourceNamespace: openshift-marketplace
        EOF

        oc wait catalogsource/opendatahub-operator-latest -n openshift-marketplace \
          --for=jsonpath='{.status.connectionState.lastObservedState}'=READY --timeout=10m

        csv=""
        for _ in $(seq 1 120); do
          csv=$(oc get subscription/opendatahub-operator -n openshift-operators \
            -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
          [[ -n "${csv}" ]] && break
          sleep 10
        done
        if [[ -z "${csv}" ]]; then
          oc get subscription,installplan,csv -n openshift-operators -o wide
          exit 1
        fi

        oc wait "csv/${csv}" -n openshift-operators \
          --for=jsonpath='{.status.phase}'=Succeeded --timeout=20m
        oc get catalogsource/opendatahub-operator-latest -n openshift-marketplace -o yaml
        oc get "csv/${csv}" -n openshift-operators -o yaml
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 35m0s
    - as: deploy-mcp-server
      cli: latest
      commands: |
        set -euo pipefail

        oc wait crd/dscinitializations.dscinitialization.opendatahub.io \
          --for=condition=Established --timeout=5m
        oc wait crd/datascienceclusters.datasciencecluster.opendatahub.io \
          --for=condition=Established --timeout=5m

        cat <<'EOF' | oc apply -f -
        apiVersion: dscinitialization.opendatahub.io/v2
        kind: DSCInitialization
        metadata:
          name: default-dsci
        spec:
          applicationsNamespace: opendatahub
          monitoring:
            managementState: Removed
            namespace: opendatahub
          trustedCABundle:
            managementState: Removed
        ---
        apiVersion: datasciencecluster.opendatahub.io/v2
        kind: DataScienceCluster
        metadata:
          name: default-dsc
        spec:
          components:
            mcplifecycleoperator:
              managementState: Managed
        EOF

        oc wait datasciencecluster/default-dsc \
          --for=jsonpath='{.status.components.mcplifecycleoperator.managementState}'=Managed \
          --timeout=15m
        oc wait deployment/mcp-lifecycle-module-operator-controller-manager -n opendatahub \
          --for=condition=Available --timeout=10m
        oc wait deployment/mcp-lifecycle-operator-controller-manager -n opendatahub \
          --for=condition=Available --timeout=10m

        oc create namespace ocp-mcp-server
        tls_dir=$(mktemp -d)
        openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
          -keyout "${tls_dir}/tls.key" -out "${tls_dir}/tls.crt" \
          -subj /CN=ocp-mcp-server.ocp-mcp-server.svc \
          -addext subjectAltName=DNS:ocp-mcp-server.ocp-mcp-server.svc,DNS:ocp-mcp-server.ocp-mcp-server.svc.cluster.local
        cp "${tls_dir}/tls.crt" "${tls_dir}/ca.crt"
        oc create secret generic ocp-mcp-server-tls -n ocp-mcp-server \
          --from-file="${tls_dir}/tls.crt" \
          --from-file="${tls_dir}/tls.key" \
          --from-file="${tls_dir}/ca.crt"

        cat <<EOF | oc apply -f -
        apiVersion: mcp.x-k8s.io/v1alpha1
        kind: MCPServer
        metadata:
          name: ocp-mcp-server
          namespace: ocp-mcp-server
        spec:
          source:
            type: ContainerImage
            containerImage:
              ref: ${IMAGE_OPENSHIFT_MCP_SERVER}
          config:
            port: 8080
            arguments:
            - --port
            - "8080"
            - --read-only
            - --tls-cert
            - /tls/tls.crt
            - --tls-key
            - /tls/tls.key
            storage:
            - path: /tls
              source:
                type: Secret
                secret:
                  secretName: ocp-mcp-server-tls
          transport:
            tls:
              enabled: true
              caBundleSecret:
                name: ocp-mcp-server-tls
        EOF

        oc wait mcpserver/ocp-mcp-server -n ocp-mcp-server \
          --for=condition=Ready --timeout=10m

        oc get datasciencecluster/default-dsc -o yaml
        oc get mcpserver/ocp-mcp-server -n ocp-mcp-server -o yaml
        oc get deployment/ocp-mcp-server -n ocp-mcp-server -o yaml
      dependencies:
      - env: IMAGE_OPENSHIFT_MCP_SERVER
        name: openshift-mcp-server
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
      timeout: 45m0s
    - ref: tls-scanner-run
    workflow: ipi-aws
zz_generated_metadata:
  branch: main
  org: openshift
  repo: openshift-mcp-server
  variant: periodics
