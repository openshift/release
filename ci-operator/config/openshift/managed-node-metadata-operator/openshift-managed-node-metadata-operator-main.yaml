base_images:
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: build/Dockerfile
    to: managed-node-metadata-operator
  - dockerfile_literal: |
      FROM scratch
      COPY deploy_pko/ /package/
    inputs:
      src:
        paths:
        - destination_dir: .
          source_path: /go/src/github.com/openshift/managed-node-metadata-operator/deploy_pko
    to: operator-pko
  - dockerfile_literal: |
      FROM src
      RUN CGO_ENABLED=0 go test ./test/e2e -v -c --tags=osde2e -o /usr/local/bin/e2e.test
    from: src
    to: operator-e2e
releases:
  latest:
    candidate:
      product: ocp
      stream: ci
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-binary-build-success
  commands: |
    make e2e-binary-build
  container:
    from: src
- as: coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  secret:
    mount_path: /tmp/secret
    name: managed-node-metadata-operator-codecov-token
- as: publish-coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  postsubmit: true
  secret:
    mount_path: /tmp/secret
    name: managed-node-metadata-operator-codecov-token
- as: lint
  commands: make lint
  container:
    from: src
- as: test
  commands: make test
  container:
    from: src
- as: validate
  commands: make validate
  container:
    from: src
- as: rosa-sts-e2e
  optional: true
  run_if_changed: ^(test/e2e/.*|pkg/.*|deploy.*/.*|go\.mod|go\.sum|build/.*)$
  steps:
    cluster_profile: rosa-e2e-01
    dependencies:
      OPERATOR_IMAGE: pipeline:managed-node-metadata-operator
      OPERATOR_PKO_IMAGE: pipeline:operator-pko
    env:
      GINKGO_FOCUS: managed-node-metadata-operator
      LEASE_ENV: staging
      OCM_ENV: stage
      OPERATOR_DEPLOYMENT_NAME: managed-node-metadata-operator
      OPERATOR_NAME: managed-node-metadata-operator
    workflow: rosa-cluster-lease-e2e-workflow
- as: rosa-sts-e2e-promotion-int
  cron: 0 0 31 2 *
  reporter_config:
    channel: '#rosa-prow-info'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{- if eq .Status.State "success"}} :green_jenkins_circle: Job
      *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{- else}} :red_jenkins_circle: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs> <!subteam^S0B7Q6G7XQR> <@U0AKNPBBVT7> {{- end}}'
  steps:
    cluster_profile: rosa-e2e-01
    dependencies:
      OPERATOR_IMAGE: pipeline:managed-node-metadata-operator
      OPERATOR_PKO_IMAGE: pipeline:operator-pko
    env:
      GINKGO_FOCUS: managed-node-metadata-operator
      LEASE_ENV: integration
      OCM_ENV: int
      OPERATOR_DEPLOYMENT_NAME: managed-node-metadata-operator
      OPERATOR_NAME: managed-node-metadata-operator
    workflow: rosa-cluster-lease-e2e-workflow
- as: rosa-sts-e2e-promotion-stage
  cron: 0 0 31 2 *
  reporter_config:
    channel: '#rosa-prow-info'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{- if eq .Status.State "success"}} :green_jenkins_circle: Job
      *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{- else}} :red_jenkins_circle: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*.
      <{{.Status.URL}}|View logs> <!subteam^S0B7Q6G7XQR> <@U0AKNPBBVT7> {{- end}}'
  steps:
    cluster_profile: rosa-e2e-01
    dependencies:
      OPERATOR_IMAGE: pipeline:managed-node-metadata-operator
      OPERATOR_PKO_IMAGE: pipeline:operator-pko
    env:
      GINKGO_FOCUS: managed-node-metadata-operator
      LEASE_ENV: staging
      OCM_ENV: stage
      OPERATOR_DEPLOYMENT_NAME: managed-node-metadata-operator
      OPERATOR_NAME: managed-node-metadata-operator
    workflow: rosa-cluster-lease-e2e-workflow
zz_generated_metadata:
  branch: main
  org: openshift
  repo: managed-node-metadata-operator
