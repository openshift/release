base_images:
  cli:
    name: "5.0"
    namespace: ocp
    tag: cli
  libvirt-installer:
    name: "5.0"
    namespace: ocp
    tag: libvirt-installer
  upi-installer:
    name: "5.0"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-5.0
releases:
  latest:
    release:
      architecture: s390x
      channel: candidate
      version: 5.0.0-ec.5
  s390x-latest:
    release:
      architecture: s390x
      channel: candidate
      version: 5.0.0-ec.5
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: "2"
      memory: 2Gi
tests:
- always_run: false
  as: e2e
  capabilities:
  - intranet
  optional: true
  steps:
    cluster_profile: libvirt-s390x-vpn-oz
    dependencies:
      OPENSHIFT_INSTALL_TARGET: release:s390x-latest
    env:
      ARCH: s390x
      BRANCH: "5.0"
      COMPUTE_COUNT: "2"
      CONTROL_COUNT: "3"
      CRO_OPERAND_IMAGE: quay.io/tdudhade/clusterresourceoverride:0.0.5
      CRO_OPERATOR_IMAGE: quay.io/tdudhade/cluster-resource-override-admission-operator:0.0.5
      ETCD_DISK_SPEED: slow
      NODE_TUNING: "true"
      USE_EXTERNAL_DNS: "true"
    workflow: cluster-resource-override-s390x
zz_generated_metadata:
  branch: main
  org: openshift
  repo: cluster-resource-override-admission-operator
  variant: s390x
