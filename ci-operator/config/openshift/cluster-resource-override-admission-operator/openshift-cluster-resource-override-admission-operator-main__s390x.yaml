base_images:
  libvirt-installer:
    name: "5.0"
    namespace: ocp
    tag: libvirt-installer
  upi-installer:
    name: "5.0"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-5.0
releases:
  latest:
    candidate:
      architecture: s390x
      product: ocp
      stream: nightly
      version: "5.0"
  s390x-latest:
    candidate:
      architecture: s390x
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: "2"
      memory: 2Gi
tests:
- as: e2e-s390x-operator
  capabilities:
  - intranet
  cron: 0 6 * * 1-5
  steps:
    allow_best_effort_post_steps: true
    cluster_profile: libvirt-s390x-vpn-oz
    dependencies:
      OPENSHIFT_INSTALL_TARGET: release:s390x-latest
    env:
      ARCH: s390x
      BRANCH: "5.0"
      COMPUTE_COUNT: "2"
      CONTROL_COUNT: "3"
      ETCD_DISK_SPEED: slow
      NODE_TUNING: "true"
      USE_EXTERNAL_DNS: "true"
    test:
    - as: install-operator
      cli: latest
      commands: |
        set -euo pipefail
        NS=openshift-cluster-resource-override
        oc create ns "${NS}"

        cat <<EOF | oc apply -f -
        apiVersion: operators.coreos.com/v1
        kind: OperatorGroup
        metadata:
          name: clusterresourceoverride-operator
          namespace: ${NS}
        spec:
          targetNamespaces:
          - ${NS}
        ---
        apiVersion: operators.coreos.com/v1alpha1
        kind: Subscription
        metadata:
          name: clusterresourceoverride
          namespace: ${NS}
        spec:
          channel: stable
          installPlanApproval: Automatic
          name: clusterresourceoverride
          source: redhat-operators
          sourceNamespace: openshift-marketplace
        EOF

        echo "Waiting for CSV to succeed..."
        for i in $(seq 1 60); do
          CSV=$(oc get subscription clusterresourceoverride -n "${NS}" \
            -o jsonpath='{.status.installedCSV}' 2>/dev/null || true)
          if [[ -n "${CSV}" ]]; then
            PHASE=$(oc get csv "${CSV}" -n "${NS}" \
              -o jsonpath='{.status.phase}' 2>/dev/null || true)
            if [[ "${PHASE}" == "Succeeded" ]]; then
              echo "CSV ${CSV} phase: Succeeded"
              break
            fi
            echo "CSV ${CSV} phase: ${PHASE:-pending} (${i}/60)"
          else
            echo "Waiting for installedCSV... (${i}/60)"
          fi
          sleep 10
        done

        oc wait --for=condition=Available \
          deployment/clusterresourceoverride-operator -n "${NS}" --timeout=600s

        cat <<EOF | oc apply -f -
        apiVersion: operator.autoscaling.openshift.io/v1
        kind: ClusterResourceOverride
        metadata:
          name: cluster
          namespace: ${NS}
        spec:
          podResourceOverride:
            spec:
              memoryRequestToLimitPercent: 50
              cpuRequestToLimitPercent: 25
              limitCPUToMemoryPercent: 200
        EOF
        oc wait --for=condition=Available clusterresourceoverride/cluster --timeout=300s

        oc get deployment,pods -n "${NS}" -o wide
      from_image:
        name: cli-jq
        namespace: ocp
        tag: latest
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: run-e2e
      cli: latest
      commands: |
        set -euo pipefail
        export OPERATOR_NAMESPACE=openshift-cluster-resource-override
        export KUBECTL=$(which oc)

        oc wait --for=condition=Available \
          deployment/clusterresourceoverride-operator \
          -n "${OPERATOR_NAMESPACE}" --timeout=600s

        make e2e E2E_SKIP="TestUpgrade"
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: openshift-e2e-libvirt-vpn
zz_generated_metadata:
  branch: main
  org: openshift
  repo: cluster-resource-override-admission-operator
  variant: s390x
