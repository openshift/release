base_images:
  ocp_builder_stream9:
    name: builder
    namespace: ocp
    tag: stream9
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-4.22
images:
  items:
  - build_args:
    - name: TAGS
      value: scos
    dockerfile_path: base/Dockerfile.rhel9
    from: pre-repo-base-stream9
    to: base-stream9
  - build_args:
    - name: TAGS
      value: scos
    context_dir: ipfailover/keepalived
    dockerfile_path: Dockerfile
    from: base-stream9
    to: keepalived-ipfailover
promotion:
  to:
  - name: scos-4.22
    namespace: origin
raw_steps:
- pipeline_image_cache_step:
    commands: |
      cat << EOF > /etc/yum.repos.d/art.repo
      [rhel-9-server-ose]
      id = rhel-9-server-ose
      name = rhel-9-server-ose
      baseurl = http://base-4-22-rhel9.ocp.svc/rhel-9-server-ose
      enabled = 1
      gpgcheck = 0
      sslverify = false
      skip_if_unavailable = true

      EOF
    from: ocp_builder_stream9
    to: pre-repo-base-stream9
releases:
  latest:
    integration:
      include_built_images: true
      name: scos-4.22
      namespace: origin
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: e2e-aws-ovn
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    workflow: openshift-e2e-aws
zz_generated_metadata:
  branch: release-4.22
  org: openshift
  repo: images
  variant: okd-scos
