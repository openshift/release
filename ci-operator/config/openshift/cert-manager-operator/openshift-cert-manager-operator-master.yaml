base_images:
  base-rhel9:
    name: "4.22"
    namespace: ocp
    tag: base-rhel9
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  cli-operator-sdk:
    name: cli-operator-sdk
    namespace: ocp
    tag: v1.39.2
  operator-sdk:
    name: "4.19"
    namespace: origin
    tag: operator-sdk
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
  upi-installer:
    name: "4.22"
    namespace: ocp
    tag: upi-installer
binary_build_commands: make build --warn-undefined-variables
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: images/ci/Dockerfile
    from: base-rhel9
    to: cert-manager-operator
  - dockerfile_path: images/ci/certmanager.Dockerfile
    from: base-rhel9
    to: cert-manager
  - dockerfile_path: images/ci/istiocsr.Dockerfile
    from: base-rhel9
    to: cert-manager-istio-csr
  - dockerfile_path: images/ci/trustmanager.Dockerfile
    from: base-rhel9
    to: cert-manager-trust-manager
  - dockerfile_path: images/ci/Dockerfile.coverage
    to: cert-manager-operator-coverage
operator:
  bundles:
  - as: cert-manager-operator-bundle
    dockerfile_path: bundle.Dockerfile
    skip_building_index: true
  substitutions:
  - pullspec: openshift.io/cert-manager-operator:.*
    with: pipeline:cert-manager-operator
  - pullspec: quay.io/jetstack/cert-manager-controller:.*
    with: pipeline:cert-manager
  - pullspec: quay.io/jetstack/cert-manager-webhook:.*
    with: pipeline:cert-manager
  - pullspec: quay.io/jetstack/cert-manager-cainjector:.*
    with: pipeline:cert-manager
  - pullspec: quay.io/jetstack/cert-manager-istio-csr:.*
    with: pipeline:cert-manager-istio-csr
  - pullspec: quay.io/jetstack/trust-manager:.*
    with: pipeline:cert-manager-trust-manager
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify
  commands: |
    make verify -k --warn-undefined-variables
  container:
    from: src
- as: unit
  commands: |
    make test --warn-undefined-variables
  container:
    from: src
- as: fips-image-scan-operator
  steps:
    dependencies:
      SCAN_IMAGE: cert-manager-operator
    test:
    - ref: fips-check-image-scan
- as: fips-image-scan-cert-manager
  steps:
    dependencies:
      SCAN_IMAGE: cert-manager
    test:
    - ref: fips-check-image-scan
- as: fips-image-scan-istio-csr
  steps:
    dependencies:
      SCAN_IMAGE: cert-manager-istio-csr
    test:
    - ref: fips-check-image-scan
- as: fips-image-scan-trust-manager
  steps:
    dependencies:
      SCAN_IMAGE: cert-manager-trust-manager
    test:
    - ref: fips-check-image-scan
- as: e2e-operator
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  skip_if_only_changed: ^(docs/|deploy/|jsonnet/)|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|PROJECT|LICENSE)$
  steps:
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace cert-manager-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n cert-manager-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n cert-manager-operator deployment cert-manager-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: cert-manager-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        E2E_GINKGO_LABEL_FILTER='Platform: isSubsetOf {AWS,Generic} && CredentialsMode: isSubsetOf {Mint} && !TechPreview' make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- always_run: false
  as: e2e-operator-coverage
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.22"
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: hack/e2e-coverage.sh collect
      credentials:
      - mount_path: /var/run/secrets/codecov
        name: cert-manager-operator-codecov-token
        namespace: test-credentials
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 15m0s
    - chain: gather
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace cert-manager-operator
        operator-sdk run bundle --timeout=10m --security-context-config=restricted --install-mode=AllNamespaces -n cert-manager-operator "$OO_BUNDLE" --verbose
        oc wait --for condition=Available -n cert-manager-operator deployment cert-manager-operator-controller-manager
      dependencies:
      - env: OO_BUNDLE
        name: cert-manager-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: setup-coverage
      cli: latest
      commands: hack/e2e-coverage.sh setup
      dependencies:
      - env: COVERAGE_IMAGE
        name: cert-manager-operator-coverage
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        E2E_GINKGO_LABEL_FILTER='Platform: isSubsetOf {AWS,Generic} && CredentialsMode: isSubsetOf {Mint} && !TechPreview' make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- as: publish-e2e-coverage
  cluster_claim:
    architecture: amd64
    cloud: aws
    owner: openshift-ci
    product: ocp
    timeout: 2h0m0s
    version: "4.20"
  postsubmit: true
  steps:
    post:
    - as: collect-coverage
      best_effort: true
      cli: latest
      commands: hack/e2e-coverage.sh collect
