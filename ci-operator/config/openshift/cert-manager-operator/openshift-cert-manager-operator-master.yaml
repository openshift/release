        oc wait --for condition=Available -n cert-manager-operator deployment cert-manager-operator-controller-manager --timeout=5m
      dependencies:
      - env: OO_BUNDLE
        name: cert-manager-operator-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
