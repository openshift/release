base_images:
  cli-jq:
    name: cli-jq
    namespace: ocp
    tag: latest
build_root:
  from_repository: true
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.20"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-art-aws-operator-test
  cron: '@weekly'
  steps:
    cluster_profile: openshift-org-aws
    dependency_overrides:
      OO_INDEX: quay.io/redhat-user-workloads/ocp-art-tenant/art-fbc:cert-manager-1.19__v4.20__cert-manager-operator-rhel9
    env:
      OO_CHANNEL: stable-v1
      OO_INSTALL_NAMESPACE: cert-manager-operator
      OO_PACKAGE: openshift-cert-manager-operator
      OO_TARGET_NAMESPACES: '!all'
    test:
    - as: setup-konflux-image-access
      cli: latest
      commands: |
        oc extract secret/pull-secret -n openshift-config --confirm --to /tmp
        jq -s '.[0].auths += .[1].auths | .[0]' /tmp/.dockerconfigjson /var/run/secrets/pull-secret/.dockerconfigjson > /tmp/merged-pullsecret.json
        oc set data secret/pull-secret -n openshift-config --from-file=.dockerconfigjson=/tmp/merged-pullsecret.json
        cat <<'EOF' | oc apply -f -
        apiVersion: config.openshift.io/v1
        kind: ImageDigestMirrorSet
        metadata:
          name: art-images-mirror-set
          namespace: openshift-marketplace
        spec:
          imageDigestMirrors:
          - mirrors:
            - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
            source: registry.redhat.io/cert-manager/cert-manager-operator-rhel9
          - mirrors:
            - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
            source: registry.redhat.io/cert-manager/cert-manager-operator-bundle
          - mirrors:
            - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
            source: registry.redhat.io/cert-manager/jetstack-cert-manager-rhel9
          - mirrors:
            - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
            source: registry.redhat.io/cert-manager/jetstack-cert-manager-acmesolver-rhel9
          - mirrors:
            - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
            source: registry.redhat.io/cert-manager/cert-manager-istio-csr-rhel9
          - mirrors:
            - quay.io/redhat-user-workloads/ocp-art-tenant/art-images
            source: registry.redhat.io/cert-manager/cert-manager-trust-manager-rhel9
        EOF
        sleep 60
        oc wait mcp/master --for condition=Updated --timeout=30m
        oc wait mcp/worker --for condition=Updated --timeout=30m
      credentials:
      - mount_path: /var/run/secrets/pull-secret
        name: deploy-konflux-operator-art-image-share
        namespace: test-credentials
      from: cli-jq
      resources:
        requests:
          cpu: 100m
    - ref: optional-operators-subscribe
    - as: verify-install
      cli: latest
      commands: |
        oc wait --for condition=Available -n cert-manager-operator deployment cert-manager-operator-controller-manager
      from: src
      resources:
        requests:
          cpu: 100m
    - as: test
      cli: latest
      commands: |
        E2E_GINKGO_LABEL_FILTER='"Platform: isSubsetOf {AWS,Generic} && CredentialsMode: isSubsetOf {Mint} && !TechPreview"' make test-e2e
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-aws
zz_generated_metadata:
  branch: cert-manager-1.19
  org: openshift
  repo: cert-manager-operator
  variant: art-4.20
