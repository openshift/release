base_images:
  upi-installer:
    name: "5.1"
    namespace: ocp
    tag: upi-installer
build_root:
  from_repository: true
releases:
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: periodic-e2e-aws-csi-fsx-ontap-alerts-ci
  cron: 17 3 * * *
  reporter_config:
    channel: '#team-ocp-storage-triage'
    job_states_to_report:
    - failure
    - error
    report_template: |
      ':red_jenkins_circle: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>'
  steps:
    cluster_profile: openshift-org-aws
    env:
      FEATURE_SET: TechPreviewNoUpgrade
      TEST_SUITE: cso/storage-path-alerting
    workflow: openshift-e2e-aws-csi-fsx-ontap-alerts
zz_generated_metadata:
  branch: release-5.1
  org: openshift
  repo: cluster-storage-operator
  variant: periodics-integration
