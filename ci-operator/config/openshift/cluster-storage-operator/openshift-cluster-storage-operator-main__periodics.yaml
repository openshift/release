base_images:
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
build_root:
  from_repository: true
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: periodic-tls-scanner-aws-ebs
  cron: 0 6 1,15 * *
  steps:
    cluster_profile: openshift-org-aws
    env:
      SCAN_NAMESPACE: openshift-cluster-storage-operator,openshift-cluster-csi-drivers
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-aws
- as: periodic-tls-scanner-azure-disk-azure-file
  cron: 0 6 1,15 * *
  steps:
    cluster_profile: openshift-org-azure
    env:
      SCAN_NAMESPACE: openshift-cluster-storage-operator,openshift-cluster-csi-drivers
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-azure
- as: periodic-tls-scanner-gcp-pd
  cron: 0 6 1,15 * *
  steps:
    cluster_profile: openshift-org-gcp
    env:
      SCAN_NAMESPACE: openshift-cluster-storage-operator,openshift-cluster-csi-drivers
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-gcp
- as: periodic-tls-scanner-ibm-vpc-block
  cron: 0 6 1,15 * *
  steps:
    cluster_profile: ibmcloud
    env:
      SCAN_NAMESPACE: openshift-cluster-storage-operator,openshift-cluster-csi-drivers
      SCANNER_CPU: "1"
      SCANNER_MEMORY: 1Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-ibmcloud
- as: periodic-tls-scanner-vsphere
  cron: 0 6 1,15 * *
  steps:
    cluster_profile: vsphere-elastic
    env:
      SCAN_NAMESPACE: openshift-cluster-storage-operator,openshift-cluster-csi-drivers
      SCANNER_CPU: "2"
      SCANNER_MEMORY: 2Gi
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    test:
    - ref: tls-13
    - ref: tls-scanner-run
    workflow: ipi-vsphere
zz_generated_metadata:
  branch: main
  org: openshift
  repo: cluster-storage-operator
  variant: periodics
