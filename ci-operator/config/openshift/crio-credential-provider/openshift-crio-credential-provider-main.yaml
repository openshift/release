build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-5.1
canonical_go_repository: github.com/cri-o/crio-credential-provider
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
rpm_build_commands: |-
  NAME=$(rpmspec -q --srpm --qf '%{name}' crio-credential-provider.spec)
  VERSION=$(rpmspec -q --srpm --qf '%{version}' crio-credential-provider.spec)
  RPMBUILD_DIR=_rpmbuild
  mkdir -p "${RPMBUILD_DIR}"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
  cp crio-credential-provider.spec "${RPMBUILD_DIR}/SPECS/"
  tar -czf "${RPMBUILD_DIR}/SOURCES/${NAME}.tar.gz" \
    --exclude=.git --exclude=build --exclude=${RPMBUILD_DIR} \
    --transform="s|^\.|${NAME}-${VERSION}|" .
  rpmbuild --nodeps --define "_topdir $(pwd)/${RPMBUILD_DIR}" -ba "${RPMBUILD_DIR}/SPECS/crio-credential-provider.spec"
rpm_build_location: _rpmbuild/RPMS/
tests:
- as: unit
  commands: make test
  container:
    from: src
- as: verify-deps
  steps:
    env:
      CHECK_MOD_LIST: "true"
    test:
    - ref: go-verify-deps
- as: verify-dependencies
  commands: make dependencies
  container:
    from: src
- as: lint
  commands: |
    make build/golangci-lint
    build/golangci-lint run --timeout=10m
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift
  repo: crio-credential-provider
