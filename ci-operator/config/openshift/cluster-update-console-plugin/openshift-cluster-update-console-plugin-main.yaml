base_images:
  lightspeed-agentic-operator:
    name: lightspeed-agentic-operator
    namespace: ci
    tag: latest
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    to: cluster-update-console-plugin
promotion:
  to:
  - name: "5.1"
    namespace: ocp
releases:
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: yarn install --immutable && yarn build
tests:
- as: e2e-playwright
  always_run: false
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    test:
    - as: test
      artifact_dir: /tmp/artifacts
      cli: latest
      commands: |
        export CI=true
        export KUBECONFIG="${SHARED_DIR}/kubeconfig"
        export KUBEADMIN_PASSWORD_FILE="${SHARED_DIR}/kubeadmin-password"
        ./test-prow-playwright-e2e.sh
      dependencies:
      - env: PLUGIN_IMAGE
        name: cluster-update-console-plugin
      - env: OPERATOR_IMAGE
        name: lightspeed-agentic-operator
      from: test-bin
      resources:
        requests:
          cpu: 2000m
          memory: 4Gi
      timeout: 1h0m0s
    workflow: ipi-aws
- as: frontend
  commands: ./test-frontend.sh
  container:
    from: test-bin
  skip_if_only_changed: ^(README\.md|OWNERS|LICENSE|AGENTS\.md|CLAUDE\.md|\.gitignore)$
zz_generated_metadata:
  branch: main
  org: openshift
  repo: cluster-update-console-plugin
