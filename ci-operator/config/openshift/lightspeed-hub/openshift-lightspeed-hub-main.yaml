binary_build_commands: make build
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    to: lightspeed-hub
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 2Gi
tests:
- as: generate
  commands: GOFLAGS="-mod=readonly" GOMODCACHE=/tmp/gomodcache make manifests && git
    diff --exit-code
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
- as: lint
  commands: GOFLAGS="-mod=readonly" GOMODCACHE=/tmp/gomodcache GOLANGCI_LINT_CACHE=/tmp/.cache
    make lint
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
- as: unit
  commands: GOFLAGS="-mod=readonly" GOMODCACHE=/tmp/gomodcache make test
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
zz_generated_metadata:
  branch: main
  org: openshift
  repo: lightspeed-hub
