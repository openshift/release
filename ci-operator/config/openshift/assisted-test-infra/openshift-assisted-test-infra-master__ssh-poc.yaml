base_images:
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: ssh-hostname
  capabilities:
  - intranet
  disable_rehearsal: true
  optional: true
  restrict_network_access: false
  steps:
    test:
    - as: ssh-hostname
      commands: |
        set -euo pipefail
        umask 077
        creds=/var/run/assisted-ssh-poc
        for field in ssh-privatekey ssh-hostname known-hosts; do
          test -s "${creds}/${field}" || { echo "Missing ${field}" >&2; exit 1; }
        done
        host=$(cat "${creds}/ssh-hostname")
        key=$(mktemp)
        trap 'rm -f "${key}"' EXIT
        cp "${creds}/ssh-privatekey" "${key}"
        chmod 600 "${key}"
        timeout 90s ssh -F /dev/null -T -i "${key}" \
          -o BatchMode=yes -o ConnectTimeout=20 \
          -o StrictHostKeyChecking=yes \
          -o "UserKnownHostsFile=${creds}/known-hosts" \
          "kni@${host}" hostname
      credentials:
      - collection: edge-group
        group: assisted-qe-ssh-poc
        mount_path: /var/run/assisted-ssh-poc
      from: dev-scripts
      grace_period: 30s
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
  timeout: 10m0s
zz_generated_metadata:
  branch: master
  org: openshift
  repo: assisted-test-infra
  variant: ssh-poc
