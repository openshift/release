base_images:
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: ssh-hostname
  capabilities:
  - intranet
  disable_rehearsal: true
  optional: true
  restrict_network_access: false
  steps:
    env:
      SSH_USER: kni
    test:
    - ref: assisted-ssh-hostname
  timeout: 10m0s
zz_generated_metadata:
  branch: master
  org: openshift
  repo: assisted-test-infra
  variant: ssh-poc
