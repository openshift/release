base_images:
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: saas-api-regression0
  capabilities:
  - intranet
  cron: 0 6 * * 3
  disable_rehearsal: true
  job_queue_name: assisted-qe-regression0
  max_concurrency: 1
  restrict_network_access: false
  steps:
    env:
      QE_OCP_VERSION: "5.0"
      QE_PUBLISH_RESULTS: "true"
    leases:
    - env: ASSISTED_QE_HOST
      resource_type: assisted-qe-host
    workflow: assisted-qe-regression0
  timeout: 18h0m0s
zz_generated_metadata:
  branch: master
  org: openshift
  repo: assisted-test-infra
  variant: qe-regression0
