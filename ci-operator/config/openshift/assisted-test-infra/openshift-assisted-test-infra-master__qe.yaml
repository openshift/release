base_images:
  dev-scripts:
    name: test
    namespace: ocp-kni
    tag: dev-scripts
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: saas-api-regression0
  capabilities:
  - intranet
  cron: 0 6 * * 3
  disable_rehearsal: true
  job_queue_name: assisted-qe
  max_concurrency: 1
  restrict_network_access: false
  steps:
    env:
      ASSISTED_FUNCTIONAL_API_TESTS_PARALLEL: "3"
      ASSISTED_TEST_INFRA_MARKER: regression0
      MASTER_DISK_SIZE: "120"
      PROFILE_NAME: saas-api-regression0
      QE_OCP_VERSION: "5.0"
      WORKER_DISK_SIZE: "120"
    leases:
    - env: ASSISTED_QE_HOST
      resource_type: assisted-qe-host
    workflow: assisted-qe-saas-api
  timeout: 18h0m0s
- as: saas-api-regression1
  capabilities:
  - intranet
  cron: 0 12 * * 3
  disable_rehearsal: true
  job_queue_name: assisted-qe
  max_concurrency: 1
  restrict_network_access: false
  steps:
    env:
      ASSISTED_FUNCTIONAL_API_TESTS_PARALLEL: "3"
      ASSISTED_TEST_INFRA_MARKER: regression1
      MASTER_DISK_SIZE: "120"
      PROFILE_NAME: saas-api-regression1
      QE_OCP_VERSION: "5.0"
      WORKER_DISK_SIZE: "120"
    leases:
    - env: ASSISTED_QE_HOST
      resource_type: assisted-qe-host
    workflow: assisted-qe-saas-api
  timeout: 18h0m0s
zz_generated_metadata:
  branch: master
  org: openshift
  repo: assisted-test-infra
  variant: qe
