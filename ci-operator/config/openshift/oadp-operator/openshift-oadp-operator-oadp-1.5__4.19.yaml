base_images:
  openshift-velero-plugin-oadp-1.5:
    name: openshift-velero-plugin
    namespace: konveyor
    tag: openshift-velero-plugin-oadp-1.5
  velero-oadp-1.5:
    name: velero
    namespace: konveyor
    tag: velero-oadp-1.5
  velero-plugin-for-aws-oadp-1.5:
    name: velero-plugin-for-aws
    namespace: konveyor
    tag: velero-plugin-for-aws-oadp-1.5
  velero-plugin-for-gcp-oadp-1.5:
    name: velero-plugin-for-gcp
    namespace: konveyor
    tag: velero-plugin-for-gcp-oadp-1.5
  velero-plugin-for-legacy-aws-oadp-1.5:
    name: velero-plugin-for-legacy-aws
    namespace: konveyor
    tag: velero-plugin-for-legacy-aws-oadp-1.5
  velero-plugin-for-microsoft-azure-oadp-1.5:
    name: velero-plugin-for-microsoft-azure
    namespace: konveyor
    tag: velero-plugin-for-microsoft-azure-oadp-1.5
build_root:
  project_image:
    dockerfile_literal: FROM quay.io/konveyor/builder:ubi9-v1.26
images:
  items:
  - dockerfile_path: Dockerfile
    to: oadp-operator-1.5
  - dockerfile_path: build/ci-Dockerfile
    to: test-oadp-operator-1.5
operator:
  bundles:
  - dockerfile_path: build/Dockerfile.bundle
  substitutions:
  - pullspec: quay.io/konveyor/oadp-operator:oadp-1.5
    with: oadp-operator-1.5
  - pullspec: quay.io/konveyor/openshift-velero-plugin:oadp-1.5
    with: openshift-velero-plugin-oadp-1.5
  - pullspec: quay.io/konveyor/velero-plugin-for-aws:oadp-1.5
    with: velero-plugin-for-aws-oadp-1.5
  - pullspec: quay.io/konveyor/velero-plugin-for-gcp:oadp-1.5
    with: velero-plugin-for-gcp-oadp-1.5
  - pullspec: quay.io/konveyor/velero-plugin-for-legacy-aws:oadp-1.5
    with: velero-plugin-for-legacy-aws-oadp-1.5
  - pullspec: quay.io/konveyor/velero-plugin-for-microsoft-azure:oadp-1.5
    with: velero-plugin-for-microsoft-azure-oadp-1.5
  - pullspec: quay.io/konveyor/velero:oadp-1.5
    with: velero-oadp-1.5
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.19"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 512Mi
tests:
- always_run: false
  as: e2e-test-cli-aws
  optional: true
  run_if_changed: .+\.go|go\.(\bmod\b|\bsum\b)|Makefile|Dockerfile|.dockerignore|.*\.ya{0,1}ml|build/.+|.sh
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_INDEX: ci-index
    env:
      OO_CHANNEL: stable
      OO_INSTALL_NAMESPACE: openshift-adp
      OO_PACKAGE: oadp-operator
      OO_TARGET_NAMESPACES: '!install'
    test:
    - as: e2e
      cli: latest
      commands: make TEST_CLI=true test-e2e
      credentials:
      - mount_path: /var/run/oadp-credentials
        name: oadp-credentials
        namespace: test-credentials
      from: test-oadp-operator-1.5
      resources:
        requests:
          cpu: 1000m
          memory: 512Mi
    workflow: optional-operators-ci-aws
- always_run: false
  as: e2e-test-aws
  run_if_changed: .+\.go|go\.(\bmod\b|\bsum\b)|Makefile|Dockerfile|.dockerignore|.*\.ya{0,1}ml|build/.+|.sh
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_INDEX: ci-index
