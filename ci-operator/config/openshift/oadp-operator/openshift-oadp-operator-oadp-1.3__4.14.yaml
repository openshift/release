base_images:
  openshift-velero-plugin-oadp-1.3:
    name: openshift-velero-plugin
    namespace: konveyor
    tag: openshift-velero-plugin-oadp-1.3
  velero-oadp-1.3:
    name: velero
    namespace: konveyor
    tag: velero-oadp-1.3
  velero-plugin-for-aws-oadp-1.3:
    name: velero-plugin-for-aws
    namespace: konveyor
    tag: velero-plugin-for-aws-oadp-1.3
  velero-plugin-for-csi-oadp-1.3:
    name: velero-plugin-for-csi
    namespace: konveyor
    tag: velero-plugin-for-csi-oadp-1.3
  velero-plugin-for-gcp-oadp-1.3:
    name: velero-plugin-for-gcp
    namespace: konveyor
    tag: velero-plugin-for-gcp-oadp-1.3
  velero-plugin-for-microsoft-azure-oadp-1.3:
    name: velero-plugin-for-microsoft-azure
    namespace: konveyor
    tag: velero-plugin-for-microsoft-azure-oadp-1.3
build_root:
  image_stream_tag:
    name: builder
    namespace: konveyor
    tag: ubi9-v1.26
images:
  items:
  - dockerfile_path: Dockerfile
    to: oadp-operator-1.3
  - dockerfile_path: build/ci-Dockerfile
    to: test-oadp-operator-1.3
operator:
  bundles:
  - dockerfile_path: build/Dockerfile.bundle
  substitutions:
  - pullspec: quay.io/konveyor/oadp-operator:oadp-1.3
    with: oadp-operator-1.3
  - pullspec: quay.io/konveyor/openshift-velero-plugin:oadp-1.3
    with: openshift-velero-plugin-oadp-1.3
  - pullspec: quay.io/konveyor/velero-plugin-for-aws:oadp-1.3
    with: velero-plugin-for-aws-oadp-1.3
  - pullspec: quay.io/konveyor/velero-plugin-for-csi:oadp-1.3
    with: velero-plugin-for-csi-oadp-1.3
  - pullspec: quay.io/konveyor/velero-plugin-for-gcp:oadp-1.3
    with: velero-plugin-for-gcp-oadp-1.3
  - pullspec: quay.io/konveyor/velero-plugin-for-microsoft-azure:oadp-1.3
    with: velero-plugin-for-microsoft-azure-oadp-1.3
  - pullspec: quay.io/konveyor/velero:oadp-1.3
    with: velero-oadp-1.3
releases:
  latest:
    release:
      channel: fast
      version: "4.14"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 512Mi
tests:
- always_run: false
  as: e2e-test-cli-aws
  optional: true
  run_if_changed: .+\.go|go\.(\bmod\b|\bsum\b)|Makefile|Dockerfile|.dockerignore|.*\.ya{0,1}ml|build/.+|.sh
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_INDEX: ci-index
    env:
      OO_CHANNEL: stable-1.3
      OO_INSTALL_NAMESPACE: openshift-adp
      OO_PACKAGE: oadp-operator
      OO_TARGET_NAMESPACES: '!install'
    test:
    - as: e2e
      cli: latest
      commands: make TEST_CLI=true test-e2e
      credentials:
      - mount_path: /var/run/oadp-credentials
        name: oadp-credentials
        namespace: test-credentials
      from: test-oadp-operator-1.3
      resources:
        requests:
          cpu: 1000m
          memory: 512Mi
    workflow: optional-operators-ci-aws
- always_run: false
  as: e2e-test-aws
  run_if_changed: .+\.go|go\.(\bmod\b|\bsum\b)|Makefile|Dockerfile|.dockerignore|.*\.ya{0,1}ml|build/.+|.sh
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_INDEX: ci-index
    env:
      OO_CHANNEL: stable-1.3
      OO_INSTALL_NAMESPACE: openshift-adp
      OO_PACKAGE: oadp-operator
      OO_TARGET_NAMESPACES: '!install'
    test:
    - as: e2e
      cli: latest
      commands: make test-e2e
      credentials:
      - mount_path: /var/run/oadp-credentials
        name: oadp-credentials
        namespace: test-credentials
      from: test-oadp-operator-1.3
      resources:
        requests:
          cpu: 1000m
          memory: 512Mi
    workflow: optional-operators-ci-aws
- as: e2e-test-cli-aws-periodic
  cron: 0 2 * * *
  reporter_config:
    channel: '#oadp-cicd'
    job_states_to_report:
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :rainbow: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :rainbow: {{else}}
      :alert-siren: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :alert-siren: {{end}}'
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_INDEX: ci-index
    env:
      OO_CHANNEL: stable-1.3
      OO_INSTALL_NAMESPACE: openshift-adp
      OO_PACKAGE: oadp-operator
      OO_TARGET_NAMESPACES: '!install'
    test:
    - as: e2e
      cli: latest
      commands: make TEST_CLI=true test-e2e
      credentials:
      - mount_path: /var/run/oadp-credentials
        name: oadp-credentials
        namespace: test-credentials
      from: test-oadp-operator-1.3
      resources:
        requests:
          cpu: 1000m
          memory: 512Mi
    workflow: optional-operators-ci-aws
- as: e2e-test-aws-periodic
  cron: 0 4 * * *
  reporter_config:
    channel: '#oadp-cicd'
    job_states_to_report:
