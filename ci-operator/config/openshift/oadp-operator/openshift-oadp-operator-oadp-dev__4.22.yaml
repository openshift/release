  bundles:
  - dockerfile_path: build/Dockerfile.bundle
  substitutions:
  - pullspec: quay.io/konveyor/oadp-operator:latest
    with: oadp-operator
  - pullspec: quay.io/konveyor/hypershift-oadp-plugin:latest
