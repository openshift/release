build_root:
  image_stream_tag:
    name: builder
    namespace: konveyor
    tag: ubi9-v1.26
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile
    to: oadp-operator
  - dockerfile_path: build/ci-Dockerfile
    to: test-oadp-operator
operator:
  bundles:
  - dockerfile_path: build/Dockerfile.bundle
promotion:
  to:
  - excluded_images:
    - test-oadp-operator
    name: oadp-operator
    namespace: konveyor
  - additional_images:
      oadp-operator-e2e-tests: test-oadp-operator
      oadp-operator-index: ci-index
    namespace: konveyor
    tag: latest
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 512Mi
tests:
- as: unit-test
  steps:
    test:
    - as: unit
      commands: make test
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: unit-test-post
  postsubmit: true
  steps:
    test:
    - as: unit
      commands: make test submit-coverage
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: unit-test-periodic
  cron: 0 4 * * *
  reporter_config:
    channel: '#oadp-cicd'
    job_states_to_report:
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :rainbow: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :rainbow: {{else}}
      :alert-siren: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :alert-siren: {{end}}'
  steps:
    test:
    - as: unit
      commands: make test submit-coverage
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
zz_generated_metadata:
  branch: oadp-dev
  org: openshift
  repo: oadp-operator
