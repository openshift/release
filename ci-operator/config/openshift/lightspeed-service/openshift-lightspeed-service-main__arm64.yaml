build_root:
  image_stream_tag:
    name: ols-python-build-root
    namespace: ci
    tag: python-3.12
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: 100m
      memory: 4Gi
tests:
- as: unit-arm64
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make install-deps && make install-deps-test && make test-unit
  container:
    from: src
  node_architecture: arm64
  optional: true
  secret:
    collection: openshift-lightspeed-service-creds
    group: ols-codecov-token
    mount_path: /tmp/secret
  skip_if_only_changed: ^docs/|\.md$|^\.tekton/|^\.github/|^hack/|^(?:.*/)?(?:\.gitignore|\.snyk|\.dockerignore|OWNERS|PROJECT|LICENSE)$
zz_generated_metadata:
  branch: main
  org: openshift
  repo: lightspeed-service
  variant: arm64
