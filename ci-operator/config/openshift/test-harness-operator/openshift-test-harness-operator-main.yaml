binary_build_commands: make build
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-5.0
images:
  items:
  - dockerfile_path: images/test-harness-operator/Dockerfile
    inputs:
      bin:
        paths:
        - destination_dir: .
          source_path: /go/src/github.com/openshift/test-harness-operator/test-harness-operator
    to: test-harness-operator
  - dockerfile_path: images/test-harness-ui/Dockerfile
    inputs:
      bin:
        paths:
        - destination_dir: .
          source_path: /go/src/github.com/openshift/test-harness-operator/test-harness-ui
    to: test-harness-ui
promotion:
  to:
  - name: test-harness-operator
    namespace: ci
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: make test
  container:
    from: src
  skip_if_only_changed: ^docs/|\.md$|^(?:.*/)?(?:\.gitignore|OWNERS|LICENSE)$
zz_generated_metadata:
  branch: main
  org: openshift
  repo: test-harness-operator
