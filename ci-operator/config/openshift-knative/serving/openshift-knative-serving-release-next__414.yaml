build_root:
  project_image:
    dockerfile_path: openshift/ci-operator/build-image/Dockerfile
images:
  items:
  - dockerfile_path: openshift/ci-operator/source-image/Dockerfile
    from: src
    to: knative-serving-source-image
  run_if_changed: ^non-existing$
promotion:
  to:
  - additional_images:
      knative-serving-src: src
    name: knative-nightly
    namespace: openshift
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    release:
      channel: fast
      version: "4.14"
resources:
  '*':
    requests:
      cpu: 500m
      memory: 4Gi
tests:
- always_run: false
  as: test-e2e
  steps:
    allow_best_effort_post_steps: true
    allow_skip_on_success: true
    cluster_profile: aws-serverless
    env:
      BASE_DOMAIN: serverless.devcluster.openshift.com
      SPOT_INSTANCES: "true"
      ZONES_COUNT: "1"
    post:
    - as: testlog-gather
      best_effort: true
      cli: latest
      commands: cp -v ${SHARED_DIR}/debuglog-*.log ${SHARED_DIR}/stdout-*.log ${SHARED_DIR}/stderr-*.log
        "${ARTIFACT_DIR}/" || true
      from: knative-serving-source-image
      optional_on_success: true
      resources:
        requests:
          cpu: 100m
      timeout: 1m0s
    - as: knative-must-gather
      best_effort: true
      cli: latest
      commands: oc adm must-gather --image=quay.io/openshift-knative/must-gather --dest-dir
        "${ARTIFACT_DIR}/gather-knative"
      from: knative-serving-source-image
      optional_on_success: true
      resources:
        requests:
          cpu: 100m
      timeout: 20m0s
    - as: openshift-must-gather
      best_effort: true
      cli: latest
      commands: oc adm must-gather --dest-dir "${ARTIFACT_DIR}/gather-openshift"
      from: knative-serving-source-image
      optional_on_success: true
      resources:
        requests:
          cpu: 100m
      timeout: 20m0s
    - as: openshift-gather-extra
      best_effort: true
      cli: latest
      commands: curl -skSL https://raw.githubusercontent.com/openshift/release/main/ci-operator/step-registry/gather/extra/gather-extra-commands.sh
        | /bin/bash -s
      from: knative-serving-source-image
      grace_period: 1m0s
      optional_on_success: true
      resources:
        requests:
          cpu: 300m
          memory: 300Mi
      timeout: 20m0s
    - ref: ipi-deprovision-deprovision
    test:
    - as: test
      cli: latest
      commands: GOPATH=/tmp/go PATH=$PATH:/tmp/go/bin SKIP_MESH_AUTH_POLICY_GENERATION=true
        make test-e2e
      dependencies:
      - env: KNATIVE_SERVING_SOURCE_IMAGE
        name: knative-serving-source-image
      from: knative-serving-source-image
      resources:
        requests:
          cpu: 100m
      timeout: 4h0m0s
    workflow: ipi-aws
zz_generated_metadata:
  branch: release-next
  org: openshift-knative
  repo: serving
  variant: "414"
