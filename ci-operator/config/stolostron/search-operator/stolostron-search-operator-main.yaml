base_images:
  base:
    name: ubi-minimal
    namespace: ocp
    tag: "8"
build_root:
  image_stream_tag:
    name: builder
    namespace: stolostron
    tag: go1.20-linux
images:
  items:
  - dockerfile_path: Dockerfile
    from: base
    to: search-operator
promotion:
  to:
  - name: "2.7"
    namespace: stolostron
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e
  steps:
    env:
      AWS_CREDENTIALS_SECRET: ocm-obs-usa-aws-kind
      AWS_INSTANCE_TYPE: t3.xlarge
    post:
    - ref: ocm-e2e-kind-destroy
    pre:
    - ref: ocm-ci-rbac
    - ref: ocm-e2e-kind-create
    test:
    - as: e2e
      commands: |
        echo $(ls -ltr /etc/secret)
        echo $(pwd)
        export QUAY_TOKEN=$(cat /etc/secret/credentials)
        echo "COMPONENT_IMAGE_REF=$COMPONENT_IMAGE_REF"
        export SELF="make -f Makefile.prow"
        set -o pipefail
        make -f Makefile.prow test-e2e
        set +o pipefail
      credentials:
      - collection: ocm-observability-usa-secrets
        group: ocm-obs-usa-quaytoken
        mount_path: /etc/secret
      dependencies:
      - env: COMPONENT_IMAGE_REF
        name: search-operator
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ocm-e2e-kind
- as: pr-image-mirror
  steps:
    dependencies:
      SOURCE_IMAGE_REF: search-operator
    env:
      IMAGE_REPO: search-operator
      REGISTRY_ORG: stolostron
    workflow: ocm-ci-image-mirror
- as: test-unit
  commands: |
    export SELF="make -f Makefile.prow"
    make -f Makefile.prow unit-test
  container:
    from: src
- as: sonar-pre-submit
  commands: |
    export SELF="make -f Makefile.prow"
    make -f Makefile.prow sonar/go/prow
  container:
    from: src
  secrets:
  - collection: ocm-secrets
    group: acm-sonarcloud-token-ci
    mount_path: /etc/sonarcloud/
- as: sonar-post-submit
  commands: |
    export SELF="make -f Makefile.prow"
    make -f Makefile.prow sonar/go/prow
  container:
    from: src
  postsubmit: true
  secrets:
  - collection: ocm-secrets
    group: acm-sonarcloud-token-ci
    mount_path: /etc/sonarcloud/
zz_generated_metadata:
  branch: main
  org: stolostron
  repo: search-operator
