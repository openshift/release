base_images:
  nodejs24-linux:
    name: builder
    namespace: stolostron
    tag: nodejs24-linux
binary_build_commands: make -f Makefile.prow install && make -f Makefile.prow build
build_root:
  image_stream_tag:
    name: builder
    namespace: stolostron
    tag: nodejs24-linux
images:
  items:
  - dockerfile_path: Containerfile.acm
    to: console
  - dockerfile_path: Containerfile.mce
    to: console-mce
  # Combined Node + Go image, scoped only to this repo's own CI. Does not touch
  # the shared stolostron/builder:nodejs24-linux tag other repos/branches depend
  # on (see ACM-42591). Layers the Go 1.26 toolchain on top of the existing
  # Node build root so check/unit-tests-sonarcloud can run both npm and go
  # commands in one job.
  - dockerfile_literal: |
      FROM nodejs24-linux
      USER 0
      RUN curl -fsSL -o /tmp/go.tar.gz https://go.dev/dl/go1.26.0.linux-amd64.tar.gz && \
          tar -C /usr/local -xzf /tmp/go.tar.gz && \
          rm -f /tmp/go.tar.gz
      ENV PATH="/usr/local/go/bin:${PATH}"
      COPY src/ /go/src/github.com/stolostron/console/
      WORKDIR /go/src/github.com/stolostron/console
      USER 1000
    from: nodejs24-linux
    inputs:
      src:
        paths:
        # NOTE: verify this matches ci-operator's actual source_path for this
        # repo's "src" pipeline image before merging; written from the pattern
        # used by ci-operator/config/stolostron/sippy but not yet run in CI.
        - destination_dir: src
          source_path: /go/src/github.com/stolostron/console/.
    to: console-ci-tools
promotion:
  to:
  - excluded_images:
    - console-mce
    name: "5.1"
    namespace: stolostron
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 400m
      memory: 2Gi
tests:
- as: check
  commands: |
    export SELF="make -f Makefile.prow"
    make -f Makefile.prow install
    make -f Makefile.prow check
  container:
    from: console-ci-tools
- as: unit-tests-sonarcloud
  commands: |
    export SELF="make -f Makefile.prow"
    make -f Makefile.prow install
    make -f Makefile.prow sonar/js/jest-init
    make -f Makefile.prow unit-tests
    make -f Makefile.prow sonar/js/prow
  container:
    from: console-ci-tools
  secrets:
  - collection: ocm-secrets
    group: acm-sonarcloud-token-ci
    mount_path: /etc/sonarcloud/
- as: sonar-post-submit
  commands: |
    export SELF="make -f Makefile.prow"
    make -f Makefile.prow install
    make -f Makefile.prow sonar/js/jest-init
    make -f Makefile.prow unit-tests
    make -f Makefile.prow sonar/js/prow
  container:
    from: console-ci-tools
  postsubmit: true
  secrets:
  - collection: ocm-secrets
    group: acm-sonarcloud-token-ci
    mount_path: /etc/sonarcloud/
- as: pr-image-mirror
  steps:
    dependencies:
      SOURCE_IMAGE_REF: console
    env:
      IMAGE_REPO: console
    workflow: ocm-ci-image-mirror
- as: pr-image-mirror-mce
  steps:
    dependencies:
      SOURCE_IMAGE_REF: console-mce
    env:
      IMAGE_REPO: console-mce
    workflow: ocm-ci-image-mirror
- as: latest-image-mirror
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: console
    env:
      IMAGE_REPO: console
      IMAGE_TAG: latest-5.1
    workflow: ocm-ci-image-mirror
- as: publish
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: console
    env:
      IMAGE_REPO: console
      REGISTRY_ORG: stolostron
    test:
    - as: publish
      commands: |-
        export OSCI_COMPONENT_NAME=console
        export OSCI_COMPONENT_VERSION=5.1.0
        export OSCI_PUBLISH_DELAY="0"
        export SELF="make -f Makefile.prow"
        make -f Makefile.prow osci/publish
      credentials:
      - collection: ocm-secrets
        group: acm-cicd-github
        mount_path: /etc/github
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ocm-ci-image-mirror
- as: fast-forward-mce
  postsubmit: true
  steps:
    env:
      DESTINATION_BRANCH: backplane-5.1
      SOURCE_BRANCH: release-5.1
    workflow: ocm-ci-fastforward
zz_generated_metadata:
  branch: release-5.1
  org: stolostron
  repo: console
