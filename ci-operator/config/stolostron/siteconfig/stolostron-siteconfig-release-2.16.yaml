base_images:
  base:
    name: ubi-minimal
    namespace: ocp
    tag: "9"
  stolostron_builder_go1.24-linux:
    name: builder
    namespace: stolostron
    tag: go1.24-linux
binary_build_commands: make build
build_root:
  image_stream_tag:
    name: builder
    namespace: stolostron
    tag: go1.23-linux
images:
  items:
  - dockerfile_path: Dockerfile
    from: base
    to: siteconfig-operator
promotion:
  to:
  - disabled: true
    name: "2.16"
    namespace: stolostron
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: pr-image-mirror
  steps:
    dependencies:
      SOURCE_IMAGE_REF: siteconfig-operator
    env:
      IMAGE_REPO: siteconfig-operator
      REGISTRY_ORG: stolostron
    workflow: ocm-ci-image-mirror
- as: sonar-pre-submit
  commands: |
    export SELF="make -f /opt/build-harness/Makefile.prow"
    make -f /opt/build-harness/Makefile.prow sonar/go/prow
  container:
    from: src
  secrets:
  - collection: ocm-secrets
    group: acm-sonarcloud-token-ci
    mount_path: /etc/sonarcloud/
- as: sonar-post-submit
  commands: |
    export SELF="make -f /opt/build-harness/Makefile.prow"
    make -f /opt/build-harness/Makefile.prow sonar/go/prow
  container:
    from: src
  postsubmit: true
  secrets:
  - collection: ocm-secrets
    group: acm-sonarcloud-token-ci
    mount_path: /etc/sonarcloud/
- as: publish
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: siteconfig-operator
    env:
      IMAGE_REPO: siteconfig-operator
      REGISTRY_ORG: stolostron
    test:
    - as: publish
      commands: |-
        export OSCI_COMPONENT_VERSION="5"
        export OSCI_COMPONENT_NAME="siteconfig-operator"
        export OSCI_PUBLISH_DELAY="0"
        export SELF="make -f /opt/build-harness/Makefile.prow"
        make -f /opt/build-harness/Makefile.prow osci/publish
      credentials:
      - collection: ocm-secrets
        group: acm-cicd-github
        mount_path: /etc/github
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ocm-ci-image-mirror
zz_generated_metadata:
  branch: release-2.16
  org: stolostron
  repo: siteconfig
