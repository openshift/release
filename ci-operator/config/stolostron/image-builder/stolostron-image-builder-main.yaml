build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-5.0
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile.go1.25-linux
    to: go1.25-linux
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile.go1.26-linux
    to: go1.26-linux
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile.go1.27-linux
    to: go1.27-linux
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile.nodejs22-linux
    to: nodejs22-linux
  - additional_architectures:
    - arm64
    dockerfile_path: Dockerfile.nodejs24-linux
    to: nodejs24-linux
promotion:
  to:
  - name: builder
    namespace: stolostron
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: publish-go1-25
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: go1.25-linux
    env:
      IMAGE_REPO: builder
      IMAGE_TAG: go1.25-linux-rhel9
      REGISTRY_ORG: stolostron
    workflow: ocm-ci-image-mirror
- as: publish-go1-26
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: go1.26-linux
    env:
      IMAGE_REPO: builder
      IMAGE_TAG: go1.26-linux
      REGISTRY_ORG: stolostron
    workflow: ocm-ci-image-mirror
- as: publish-go1-27
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: go1.27-linux
    env:
      IMAGE_REPO: builder
      IMAGE_TAG: go1.27-linux-rhel9
      REGISTRY_ORG: stolostron
    workflow: ocm-ci-image-mirror
- as: publish-nodejs22
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: nodejs22-linux
    env:
      IMAGE_REPO: builder
      IMAGE_TAG: nodejs22-linux-rhel9
      REGISTRY_ORG: stolostron
    workflow: ocm-ci-image-mirror
- as: publish-nodejs24
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: nodejs24-linux
    env:
      IMAGE_REPO: builder
      IMAGE_TAG: nodejs24-linux-rhel9
      REGISTRY_ORG: stolostron
    workflow: ocm-ci-image-mirror
zz_generated_metadata:
  branch: main
  org: stolostron
  repo: image-builder
