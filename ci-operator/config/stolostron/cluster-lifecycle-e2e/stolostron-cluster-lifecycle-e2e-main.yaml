base_images:
  base:
    name: ubi-minimal
    namespace: ocp
    tag: "8"
binary_build_commands: make build
build_root:
  image_stream_tag:
    name: builder
    namespace: stolostron
    tag: go1.23-linux
images:
  items:
  - dockerfile_path: build/Dockerfile
    from: base
    to: cluster-lifecycle-e2e
  - dockerfile_literal: |
      FROM src
      WORKDIR /go/src/github.com/stolostron/cluster-lifecycle-e2e
      RUN cd openshift-tests-ext && make build
      RUN cp openshift-tests-ext/acm-tests-ext /usr/bin/openshift-tests-extension
      RUN gzip -f -k /usr/bin/openshift-tests-extension
    from: src
    to: acm-lifecycle-ote
promotion:
  to:
  - name: main
    namespace: stolostron
releases:
  initial:
    integration:
      name: "4.22"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "4.22"
      namespace: ocp
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: make build GO_BUILD_FLAGS:='-race' --warn-undefined-variables
tests:
- as: pr-image-mirror
  steps:
    dependencies:
      SOURCE_IMAGE_REF: cluster-lifecycle-e2e
    env:
      IMAGE_REPO: cluster-lifecycle-e2e
      REGISTRY_ORG: stolostron
    workflow: ocm-ci-image-mirror
- as: pr-merge-image-mirror
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: cluster-lifecycle-e2e
    env:
      IMAGE_REPO: cluster-lifecycle-e2e
      IMAGE_TAG: latest
      REGISTRY_ORG: stolostron
    workflow: ocm-ci-image-mirror
zz_generated_metadata:
  branch: main
  org: stolostron
  repo: cluster-lifecycle-e2e
