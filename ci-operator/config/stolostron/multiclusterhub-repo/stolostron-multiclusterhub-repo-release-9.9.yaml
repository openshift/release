base_images:
  base:
    name: ubi-minimal
    namespace: ocp
    tag: "8"
binary_build_commands: make build
build_root:
  image_stream_tag:
    name: builder
    namespace: stolostron
    tag: go1.18-linux
images:
  items:
  - dockerfile_path: Dockerfile.prow
    from: base
    to: multiclusterhub-repo
promotion:
  to:
  - name: "9.9"
    namespace: stolostron
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: test-unit
  commands: |
    export SELF="make -f Makefile.prow"
    make -f Makefile.prow unit-tests
  container:
    from: src
- as: sonar-pre-submit
  commands: |
    export SELF="make -f Makefile.prow"
    make -f Makefile.prow sonar/go/prow
  container:
    from: src
  secrets:
  - collection: ocm-secrets
    group: acm-sonarcloud-token-ci
    mount_path: /etc/sonarcloud/
- as: sonar-post-submit
  commands: |
    export SELF="make -f Makefile.prow"
    make -f Makefile.prow sonar/go/prow
  container:
    from: src
  postsubmit: true
  secrets:
  - collection: ocm-secrets
    group: acm-sonarcloud-token-ci
    mount_path: /etc/sonarcloud/
- as: publish
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: multiclusterhub-repo
    env:
      IMAGE_REPO: multiclusterhub-repo
      REGISTRY_ORG: stolostron
    test:
    - as: publish
      commands: |-
        export OSCI_PUBLISH_DELAY="0"
        export SELF="make -f Makefile.prow"
        make -f Makefile.prow osci/publish
      credentials:
      - collection: ocm-secrets
        group: acm-cicd-github
        mount_path: /etc/github
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: ocm-ci-image-mirror
zz_generated_metadata:
  branch: release-9.9
  org: stolostron
  repo: multiclusterhub-repo
