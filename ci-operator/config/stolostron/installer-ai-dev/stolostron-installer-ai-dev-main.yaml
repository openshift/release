base_images:
  base:
    name: ubi-minimal
    namespace: ocp
    tag: "9"
build_root:
  image_stream_tag:
    name: builder
    namespace: stolostron
    tag: go1.26-linux
images:
  items:
  - dockerfile_path: dev-bot/Dockerfile.runner
    to: installer-ai-dev
prowgen:
  disable_sparse_checkout: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: publish
  postsubmit: true
  steps:
    dependencies:
      SOURCE_IMAGE_REF: installer-ai-dev
    env:
      IMAGE_REPO: installer-ai-dev
      REGISTRY_ORG: stolostron
    workflow: ocm-ci-image-mirror
zz_generated_metadata:
  branch: main
  org: stolostron
  repo: installer-ai-dev
