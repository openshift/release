releases:
  initial:
    integration:
      name: "5.0"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.0"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: tls13-probe-aws-ovn
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    env:
      COMPUTE_NODE_TYPE: m5.2xlarge
      PROBE_CAPTURE_DURATION: "300"
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
      TLS_ADHERENCE_ENFORCE: "false"
    test:
    - ref: tls-probe-run
    workflow: openshift-e2e-aws-ovn-tls-13
- as: tls13-probe-gcp-ovn
  optional: true
  steps:
    cluster_profile: openshift-org-gcp
    env:
      COMPUTE_NODE_TYPE: n2-standard-8
      PROBE_CAPTURE_DURATION: "300"
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
      TLS_ADHERENCE_ENFORCE: "false"
    test:
    - ref: tls-13
    - ref: tls-probe-run
    workflow: openshift-e2e-gcp-ovn
- as: tls13-probe-azure-ovn
  optional: true
  steps:
    cluster_profile: openshift-org-azure
    env:
      COMPUTE_NODE_TYPE: Standard_D8as_v5
      PROBE_CAPTURE_DURATION: "300"
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
      TLS_ADHERENCE_ENFORCE: "false"
    test:
    - ref: tls-13
    - ref: tls-probe-run
    workflow: openshift-e2e-azure-ovn
- as: tls13-probe-metal
  optional: true
  steps:
    cluster_profile: equinix-ocp-metal
    env:
      DEVSCRIPTS_CONFIG: |
        IP_STACK=v4
        NETWORK_TYPE=OVNKubernetes
      PROBE_CAPTURE_DURATION: "300"
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
      TLS_ADHERENCE_ENFORCE: "false"
    test:
    - ref: tls-13
    - ref: tls-probe-run
    workflow: baremetalds-e2e
zz_generated_metadata:
  branch: main
  org: stolostron
  repo: tls-probe
