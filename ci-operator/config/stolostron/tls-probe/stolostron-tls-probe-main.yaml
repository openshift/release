build_root:
  image_stream_tag:
    name: ci-tools-build-root
    namespace: ci
    tag: latest
images:
  items:
  - additional_architectures:
    - arm64
    dockerfile_path: Containerfile.ci
    to: tls-probe
promotion:
  to:
  - name: tls-probe
    namespace: stolostron
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: tls13-probe-aws-ovn
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    env:
      COMPUTE_NODE_TYPE: m5.2xlarge
      PROBE_CAPTURE_DURATION: "300"
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
      TLS_ADHERENCE_ENFORCE: "false"
    test:
    - ref: tls-probe-run
    workflow: openshift-e2e-aws-ovn-tls-13
zz_generated_metadata:
  branch: main
  org: stolostron
  repo: tls-probe
