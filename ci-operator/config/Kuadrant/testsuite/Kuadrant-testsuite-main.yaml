base_images:
  cli:
    name: "4.22"
    namespace: ocp
    tag: cli
  libvirt-installer:
    name: "4.22"
    namespace: ocp
    tag: libvirt-installer
  upi-installer:
    name: "4.22"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.24-openshift-4.22
images:
  items:
  - dockerfile_literal: |
      FROM quay.io/kuadrant/testsuite:latest
    to: kuadrant-testsuite
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.22"
  s390x-latest:
    candidate:
      architecture: s390x
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: "2"
      memory: 2Gi
tests:
- always_run: false
  as: e2e-s390x
  capabilities:
  - intranet
  optional: true
  steps:
    cluster_profile: libvirt-s390x-vpn-oz
    dependencies:
      OPENSHIFT_INSTALL_TARGET: release:s390x-latest
    env:
      ARCH: s390x
      BRANCH: "4.22"
      COMPUTE_COUNT: "2"
      CONTROL_COUNT: "3"
      # Larger guests than upi-install-libvirt defaults (24567 MiB / 10 vCPU).
      # Matches multiarch libvirt DOMAIN_MEMORY bumps; helps Kuadrant/Istio +
      # in-cluster testsuite Job on the 2 compute workers.
      DOMAIN_MEMORY: "34816"
      DOMAIN_VCPUS: "16"
      COREDNS_LB_HOST: "241"
      COREDNS_ZONE: k.example.com
      ETCD_DISK_SPEED: slow
      ISTIO_CONTROL_NAMESPACE: openshift-operators
      ISTIO_VERSION: v1.30-latest
      # RHCL 1.5.0-rc2 file-based catalog for this job's OCP 4.22.
      # Same build, other OCP indexes (not used by this 4.22 job):
      #   quay.io/kuadrant/qe-rhcl-prerelease-images:rhcl-1.5.0-v4.20-rc2
      #   quay.io/kuadrant/qe-rhcl-prerelease-images:rhcl-1.5.0-v4.21-rc2
      KUADRANT_CATALOG_SOURCE_IMAGE: quay.io/kuadrant/qe-rhcl-prerelease-images:rhcl-1.5.0-v4.22-rc2
      KUADRANT_CHANNEL: stable
      KUADRANT_SUBSCRIPTION_NAME: rhcl-operator
      NODE_TUNING: "true"
      OSSM_STARTING_CSV: servicemeshoperator3.v3.4.1
      # Empty: install catalog channel head (1.4.2 is not in this index).
      RHCL_STARTING_CSV: ""
      # Focused rerun of the 45 FAILs from overlay #2110620854378303488.
      # In-job dataplane waits are in kuadrant-s390x-run-testsuite-commands.sh.
      # Restore PYTEST_FLAGS: -n4 and RUN_SMOKE: "true" after this rehearsal.
      PYTEST_FLAGS: "-n4 -k \"oidc_policy or xfcc_forwarding or test_user_managed_access or hostname_case or test_no_caching or authpolicy_section_targeting_gateway_listener or test_invalid_api_key or test_missing_api_key or test_trlp_limit_and_reset or test_reservation_limit_and_reset or test_multiple_trlp or test_reservation_streaming or test_trlp_streaming or test_reservation_isolated_per_user or test_reservation_rejects_concurrent_overcommit or test_reservation_amount_is_clamped_to_max_fraction or (test_authorized_hits_metric_exists_and_increments and not streaming) or (test_metrics_reported_per_user_and_group and not streaming) or test_send_reply_span_on_request_rejection or test_ratelimit_limited_tag\""
      # Always overlay Kuadrant/testsuite main onto the s390x image at Job start
      # (stablev1 bake is 5682b36 / Jul 2026). Each rehearsal resolves current
      # origin/main; the Job logs the fetched SHA.
      TESTSUITE_GIT_REF: main
      RUN_SMOKE: "false"
      RUN_AUTHORINO: "false"
      RUN_LIMITADOR: "false"
      RUN_DNSTLS: "false"
      RUN_OBSERVABILITY: "false"
      RUN_KUADRANT: "true"
      USE_EXTERNAL_DNS: "true"
    workflow: kuadrant-s390x
zz_generated_metadata:
  branch: main
  org: Kuadrant
  repo: testsuite
