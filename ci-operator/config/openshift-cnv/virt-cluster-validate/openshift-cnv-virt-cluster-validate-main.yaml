base_images:
  cli:
    name: "5.0"
    namespace: ocp
    tag: cli
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.24-openshift-4.21
images:
  items:
  - dockerfile_path: Containerfile
    to: virt-cluster-validate
releases:
  initial:
    candidate:
      product: ocp
      relative: 1
      stream: nightly
      version: "5.0"
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 500m
      memory: 1Gi
tests:
- as: e2e-azure
  steps:
    cluster_profile: azure-virtualization
    env:
      BASE_DOMAIN: cnv-devel.azure.devcluster.openshift.com
      COMPUTE_NODE_TYPE: Standard_D4s_v5
      OPERATORS: |
        [
          {"name": "kubernetes-nmstate-operator", "source": "redhat-operators-v4-22", "channel": "!default", "install_namespace": "openshift-nmstate", "target_namespaces": "openshift-nmstate", "operator_group": "nmstate-og"},
          {"name": "redhat-oadp-operator", "source": "redhat-operators-v4-22", "channel": "!default", "install_namespace": "openshift-adp", "target_namespaces": "openshift-adp", "operator_group": "oadp-og"},
          {"name": "node-healthcheck-operator", "source": "redhat-operators-v4-22", "channel": "!default", "install_namespace": "openshift-operators"},
          {"name": "self-node-remediation", "source": "redhat-operators-v4-22", "channel": "!default", "install_namespace": "openshift-operators"}
        ]
    test:
    - as: install-cnv
      cli: latest
      commands: |
        set -euo pipefail
        curl -L https://github.com/openshift-cnv/cnv-ci/tarball/master -o /tmp/cnv-ci.tgz
        mkdir -p /tmp/cnv-ci
        tar -xvzf /tmp/cnv-ci.tgz -C /tmp/cnv-ci --strip-components=1
        cd /tmp/cnv-ci
        make update_pull_secret set_imagedigestmirrorset deploy_cnv
        oc patch hco kubevirt-hyperconverged -n openshift-cnv --type=merge -p '{"spec":{"virtualization":{"virtualMachineOptions":{"defaultCPUModel":"Broadwell"}}}}'
      credentials:
      - mount_path: /var/run/cnv-ci-brew-pull-secret
        name: cnv-ci-brew-pull-secret
        namespace: test-credentials
      - mount_path: /var/run/cnv-ci-konflux-pull-secret
        name: konflux-pull-secret
        namespace: test-credentials
      env:
      - default: '|7820aea2-0d75-11e7-9259-28d244ea5a6d.hhav.f63e13'
        name: BREW_IMAGE_REGISTRY_USERNAME
      - default: /var/run/cnv-ci-brew-pull-secret/token
        name: BREW_IMAGE_REGISTRY_TOKEN_PATH
      - default: openshift-virtualization+konflux_ro_bot
        name: KONFLUX_REGISTRY_USERNAME
      - default: /var/run/cnv-ci-konflux-pull-secret/token
        name: KONFLUX_REGISTRY_TOKEN_PATH
      - default: "5.0"
        name: OCP_VERSION
      - default: "5.0"
        name: CNV_VERSION
      - default: openshift-cnv
        name: TARGET_NAMESPACE
      - default: "false"
        name: PRODUCTION_RELEASE
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 600Mi
      timeout: 1h0m0s
    - as: setup-catalog
      cli: latest
      commands: |
        set -euo pipefail
        oc create -f - <<'EOF'
        apiVersion: operators.coreos.com/v1alpha1
        kind: CatalogSource
        metadata:
          name: redhat-operators-v4-22
          namespace: openshift-marketplace
        spec:
          sourceType: grpc
          image: registry.redhat.io/redhat/redhat-operator-index:v4.22
          displayName: Red Hat Operators v4.22
        EOF
        echo "Waiting for CatalogSource to become READY..."
        oc wait -n openshift-marketplace catalogsource/redhat-operators-v4-22 \
          --for=jsonpath='{.status.connectionState.lastObservedState}'=READY --timeout=5m
        echo "CatalogSource redhat-operators-v4-22 is ready"
      from: src
      resources:
        requests:
          cpu: 100m
    - ref: install-operators
    - as: setup-rwx-storage
      cli: latest
      commands: |
        set -euo pipefail
        oc get storageclass -o name | xargs -I{} oc patch {} -p '{"metadata":{"annotations":{"storageclass.kubevirt.io/is-default-virt-class":"false"}}}' --type=merge 2>/dev/null || true
        oc create -f - <<'EOF'
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: azurefile-csi-smb
          annotations:
            storageclass.kubevirt.io/is-default-virt-class: "true"
        provisioner: file.csi.azure.com
        parameters:
          skuName: Standard_LRS
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        mountOptions:
          - dir_mode=0777
          - file_mode=0660
          - uid=107
          - gid=107
          - noperm
          - mfsymlinks
          - cache=strict
          - nosharesock
          - actimeo=30
          - nobrl
        EOF
        echo "Created azurefile-csi-smb StorageClass as default virt class"
        echo "Waiting for StorageProfile to be created by CDI..."
        oc wait storageprofile azurefile-csi-smb --for=jsonpath='{.status.provisioner}'=file.csi.azure.com --timeout=2m
        oc patch storageprofile azurefile-csi-smb --type=merge -p '{"spec":{"claimPropertySets":[{"accessModes":["ReadWriteMany"],"volumeMode":"Filesystem"}]}}'
        echo "StorageProfile patched with ReadWriteMany access mode"
      from: src
      resources:
        requests:
          cpu: 100m
    - as: wait-for-golden-images
      cli: latest
      commands: |
        set -euo pipefail
        echo "Waiting for DataImportCron objects to appear..."
        for i in $(seq 1 30); do
          COUNT=$(oc get dataimportcron -n openshift-virtualization-os-images --no-headers 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "Found $COUNT DataImportCron objects"
            break
          fi
          echo "No DataImportCron objects yet, waiting... ($i/30)"
          sleep 10
        done
        echo "Waiting for all golden images to be up to date..."
        oc wait dataimportcron --all \
          -n openshift-virtualization-os-images \
          --for=condition=UpToDate=true \
          --timeout=15m
        echo "All golden images imported successfully"
        oc get pvc -n openshift-virtualization-os-images
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 20m0s
    - as: validate
      cli: latest
      commands: |
        set -e
        # CI-specific exclusions (these checks detect real issues on customer clusters):
        # 20-bare-metal: CI clusters are cloud-hosted, bare-metal detection always fails
        # 75-snapshots: CI StorageClass has no VolumeSnapshotClass configured
        # 80-high-performance: CI nodes lack dedicated CPU manager configuration
        SKIP_CHECKS="20-bare-metal,75-snapshots,80-high-performance"
        oc adm must-gather --image="${VCV_IMAGE}" --dest-dir=${ARTIFACT_DIR}/must-gather-output -- SKIP_CHECKS=${SKIP_CHECKS} /usr/bin/gather
        MG_SUBDIR=$(find ${ARTIFACT_DIR}/must-gather-output -path "*/virt-cluster-validate" -type d | head -1)
        if [[ -z "${MG_SUBDIR}" ]]; then
          echo "ERROR: virt-cluster-validate output directory not found in must-gather output"
          exit 1
        fi
        python3 -c "
        import json, sys
        r = json.load(open('${MG_SUBDIR}/ctrf-results.json'))['results']['summary']
        print(f'Passed: {r[\"passed\"]}, Failed: {r[\"failed\"]}, Total: {r[\"tests\"]}')
        sys.exit(1 if r['failed'] > 0 else 0)
        "
      dependencies:
      - env: VCV_IMAGE
        name: virt-cluster-validate
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-azure
- as: e2e-gcp
  steps:
    cluster_profile: gcp-virtualization
    env:
      COMPUTE_NODE_TYPE: n2-standard-4
      OPERATORS: |
        [
          {"name": "kubernetes-nmstate-operator", "source": "redhat-operators-v4-22", "channel": "!default", "install_namespace": "openshift-nmstate", "target_namespaces": "openshift-nmstate", "operator_group": "nmstate-og"},
          {"name": "redhat-oadp-operator", "source": "redhat-operators-v4-22", "channel": "!default", "install_namespace": "openshift-adp", "target_namespaces": "openshift-adp", "operator_group": "oadp-og"},
          {"name": "node-healthcheck-operator", "source": "redhat-operators-v4-22", "channel": "!default", "install_namespace": "openshift-operators"},
          {"name": "self-node-remediation", "source": "redhat-operators-v4-22", "channel": "!default", "install_namespace": "openshift-operators"}
        ]
    test:
    - as: setup-rwx-storage
      cli: latest
      commands: |
        set -euo pipefail

        NS=nfs-storage
        oc create namespace $NS

        # NFS server service account with privileged SCC
        oc create serviceaccount nfs-server -n $NS
        oc adm policy add-scc-to-user privileged -z nfs-server -n $NS

        # NFS provisioner service account with hostmount-anyuid SCC
        oc create serviceaccount nfs-provisioner -n $NS
        oc adm policy add-scc-to-user hostmount-anyuid -z nfs-provisioner -n $NS

        # RBAC for the provisioner
        oc create -f - <<'EOF'
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: nfs-provisioner-runner
        rules:
        - apiGroups: [""]
          resources: ["nodes"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["persistentvolumes"]
          verbs: ["get", "list", "watch", "create", "delete"]
        - apiGroups: [""]
          resources: ["persistentvolumeclaims"]
          verbs: ["get", "list", "watch", "update"]
        - apiGroups: ["storage.k8s.io"]
          resources: ["storageclasses"]
          verbs: ["get", "list", "watch"]
        - apiGroups: [""]
          resources: ["events"]
          verbs: ["create", "update", "patch"]
        EOF
        oc create clusterrolebinding nfs-provisioner-runner \
          --clusterrole=nfs-provisioner-runner \
          --serviceaccount=$NS:nfs-provisioner
        oc create role nfs-provisioner-leader-locking -n $NS \
          --verb=get,list,watch,create,update,patch --resource=endpoints
        oc create rolebinding nfs-provisioner-leader-locking -n $NS \
          --role=nfs-provisioner-leader-locking \
          --serviceaccount=$NS:nfs-provisioner

        # PVC for NFS server backing storage (uses default GCP PD StorageClass)
        oc create -f - <<'EOF'
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: nfs-data
          namespace: nfs-storage
        spec:
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 500Gi
        EOF

        # Deploy NFS server
        oc create -f - <<'EOF'
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: nfs-server
          namespace: nfs-storage
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: nfs-server
          template:
            metadata:
              labels:
                app: nfs-server
            spec:
              serviceAccountName: nfs-server
              automountServiceAccountToken: false
              containers:
              - name: nfs-server
                image: registry.k8s.io/volume-nfs:0.8
                ports:
                - name: nfs
                  containerPort: 2049
                - name: mountd
                  containerPort: 20048
                - name: rpcbind
                  containerPort: 111
                securityContext:
                  privileged: true  # kernel NFS server requires privileged mode
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                volumeMounts:
                - name: nfs-data
                  mountPath: /exports
              volumes:
              - name: nfs-data
                persistentVolumeClaim:
                  claimName: nfs-data
        ---
        apiVersion: v1
        kind: Service
        metadata:
          name: nfs-server
          namespace: nfs-storage
        spec:
          ports:
          - name: nfs
            port: 2049
          - name: mountd
            port: 20048
          - name: rpcbind
            port: 111
          selector:
            app: nfs-server
        EOF

        echo "Waiting for NFS server to become ready..."
        oc wait -n $NS deployment/nfs-server --for=condition=Available --timeout=5m
        NFS_SERVER=$(oc get svc nfs-server -n $NS -o jsonpath='{.spec.clusterIP}')
        echo "NFS server is ready"

        # Deploy nfs-subdir-external-provisioner
        oc create -f - <<EOF
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: nfs-provisioner
          namespace: nfs-storage
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: nfs-provisioner
          template:
            metadata:
              labels:
                app: nfs-provisioner
            spec:
              serviceAccountName: nfs-provisioner
              containers:
              - name: nfs-provisioner
                image: registry.k8s.io/sig-storage/nfs-subdir-external-provisioner:v4.0.2
                env:
                - name: NFS_SERVER
                  value: "${NFS_SERVER}"
                - name: NFS_PATH
                  value: /exports
                - name: PROVISIONER_NAME
                  value: nfs-storage/nfs-provisioner
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                volumeMounts:
                - name: nfs-root
                  mountPath: /persistentvolumes
              volumes:
              - name: nfs-root
                nfs:
                  server: "${NFS_SERVER}"
                  path: /exports
        EOF

        echo "Waiting for NFS provisioner to become ready..."
        oc wait -n $NS deployment/nfs-provisioner --for=condition=Available --timeout=5m

        # Create RWX StorageClass and set it as default virt class
        oc get storageclass -o name | xargs -I{} oc patch {} -p '{"metadata":{"annotations":{"storageclass.kubevirt.io/is-default-virt-class":"false"}}}' --type=merge 2>/dev/null || true
        oc create -f - <<'EOF'
        apiVersion: storage.k8s.io/v1
        kind: StorageClass
        metadata:
          name: nfs-rwx
          annotations:
            storageclass.kubevirt.io/is-default-virt-class: "true"
        provisioner: nfs-storage/nfs-provisioner
        parameters:
          archiveOnDelete: "false"
        mountOptions:
        - nolock
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        EOF
        echo "Created nfs-rwx StorageClass as default virt class"
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 12m0s
    - as: install-cnv
      cli: latest
      commands: |
        set -euo pipefail
        curl -L https://github.com/openshift-cnv/cnv-ci/tarball/master -o /tmp/cnv-ci.tgz
        mkdir -p /tmp/cnv-ci
        tar -xvzf /tmp/cnv-ci.tgz -C /tmp/cnv-ci --strip-components=1
        cd /tmp/cnv-ci
        make update_pull_secret set_imagedigestmirrorset deploy_cnv
        oc patch hco kubevirt-hyperconverged -n openshift-cnv --type=merge -p '{"spec":{"virtualization":{"virtualMachineOptions":{"defaultCPUModel":"Broadwell"}}}}'
      credentials:
      - mount_path: /var/run/cnv-ci-brew-pull-secret
        name: cnv-ci-brew-pull-secret
        namespace: test-credentials
      - mount_path: /var/run/cnv-ci-konflux-pull-secret
        name: konflux-pull-secret
        namespace: test-credentials
      env:
      - default: '|7820aea2-0d75-11e7-9259-28d244ea5a6d.hhav.f63e13'
        name: BREW_IMAGE_REGISTRY_USERNAME
      - default: /var/run/cnv-ci-brew-pull-secret/token
        name: BREW_IMAGE_REGISTRY_TOKEN_PATH
      - default: openshift-virtualization+konflux_ro_bot
        name: KONFLUX_REGISTRY_USERNAME
      - default: /var/run/cnv-ci-konflux-pull-secret/token
        name: KONFLUX_REGISTRY_TOKEN_PATH
      - default: "5.0"
        name: OCP_VERSION
      - default: "5.0"
        name: CNV_VERSION
      - default: openshift-cnv
        name: TARGET_NAMESPACE
      - default: "false"
        name: PRODUCTION_RELEASE
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 600Mi
      timeout: 1h0m0s
    - as: patch-storageprofile
      cli: latest
      commands: |
        set -euo pipefail
        echo "Waiting for StorageProfile to be created by CDI..."
        for i in $(seq 1 30); do
          if oc get storageprofile nfs-rwx &>/dev/null; then
            echo "StorageProfile nfs-rwx exists"
            break
          fi
          echo "StorageProfile not yet created, waiting... ($i/30)"
          sleep 5
        done
        oc wait storageprofile nfs-rwx --for=jsonpath='{.status.provisioner}'=nfs-storage/nfs-provisioner --timeout=2m
        oc patch storageprofile nfs-rwx --type=merge -p '{"spec":{"claimPropertySets":[{"accessModes":["ReadWriteMany"],"volumeMode":"Filesystem"}]}}'
        echo "StorageProfile patched with ReadWriteMany access mode"
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 7m0s
    - as: setup-catalog
      cli: latest
      commands: |
        set -euo pipefail
        oc create -f - <<'EOF'
        apiVersion: operators.coreos.com/v1alpha1
        kind: CatalogSource
        metadata:
          name: redhat-operators-v4-22
          namespace: openshift-marketplace
        spec:
          sourceType: grpc
          image: registry.redhat.io/redhat/redhat-operator-index:v4.22
          displayName: Red Hat Operators v4.22
        EOF
        echo "Waiting for CatalogSource to become READY..."
        oc wait -n openshift-marketplace catalogsource/redhat-operators-v4-22 \
          --for=jsonpath='{.status.connectionState.lastObservedState}'=READY --timeout=5m
        echo "CatalogSource redhat-operators-v4-22 is ready"
      from: src
      resources:
        requests:
          cpu: 100m
    - ref: install-operators
    - as: wait-for-golden-images
      cli: latest
      commands: |
        set -euo pipefail
        echo "Waiting for DataImportCron objects to appear..."
        for i in $(seq 1 30); do
          COUNT=$(oc get dataimportcron -n openshift-virtualization-os-images --no-headers 2>/dev/null | wc -l)
          if [ "$COUNT" -gt 0 ]; then
            echo "Found $COUNT DataImportCron objects"
            break
          fi
          echo "No DataImportCron objects yet, waiting... ($i/30)"
          sleep 10
        done
        echo "Waiting for all golden images to be up to date..."
        oc wait dataimportcron --all \
          -n openshift-virtualization-os-images \
          --for=condition=UpToDate=true \
          --timeout=25m
        echo "All golden images imported successfully"
        oc get pvc -n openshift-virtualization-os-images
      from: src
      resources:
        requests:
          cpu: 100m
      timeout: 30m0s
    - as: validate
      cli: latest
      commands: |
        set -e
        # CI-specific exclusions (these checks detect real issues on customer clusters):
        # 20-bare-metal: CI clusters are cloud-hosted, bare-metal detection always fails
        # 75-snapshots: CI StorageClass has no VolumeSnapshotClass configured
        # 80-high-performance: CI nodes lack dedicated CPU manager configuration
        SKIP_CHECKS="20-bare-metal,75-snapshots,80-high-performance"
        # NFS host-assisted copy clone can take 10m+; increase per-test and VM readiness timeouts
        oc adm must-gather --image="${VCV_IMAGE}" --dest-dir=${ARTIFACT_DIR}/must-gather-output -- SKIP_CHECKS=${SKIP_CHECKS} TIMEOUT=17m VM_READY_TIMEOUT=15m /usr/bin/gather
        MG_SUBDIR=$(find ${ARTIFACT_DIR}/must-gather-output -path "*/virt-cluster-validate" -type d | head -1)
        if [[ -z "${MG_SUBDIR}" ]]; then
          echo "ERROR: virt-cluster-validate output directory not found in must-gather output"
          exit 1
        fi
        python3 -c "
        import json, sys
        r = json.load(open('${MG_SUBDIR}/ctrf-results.json'))['results']['summary']
        print(f'Passed: {r[\"passed\"]}, Failed: {r[\"failed\"]}, Total: {r[\"tests\"]}')
        sys.exit(1 if r['failed'] > 0 else 0)
        "
      dependencies:
      - env: VCV_IMAGE
        name: virt-cluster-validate
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: ipi-gcp
zz_generated_metadata:
  branch: main
  org: openshift-cnv
  repo: virt-cluster-validate
