build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.access.redhat.com/ubi9/ubi:latest
      RUN dnf install -y git python3 python3-pip && \
          dnf clean all
prowgen:
  expose: true
  private: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: |
    export HOME=/tmp
    pip3 install --user flake8
    export PATH=$HOME/.local/bin:$PATH
    flake8 --ignore=E501,E402,W605 ./
  container:
    from: src
- as: unit
  commands: |
    export HOME=/tmp
    pip3 install --user -r requirements.txt
    export PATH=$HOME/.local/bin:$PATH
    python3 -m unittest discover ./tests
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-hcm-deployment
