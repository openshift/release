build_root:
  project_image:
    dockerfile_path: Dockerfile.buildroot
images:
  items:
  - dockerfile_path: Dockerfile
    to: rosa-hcm-deployment
prowgen:
  expose: true
  private: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: |
    export HOME=/tmp
    pip3 install flake8
    flake8 --ignore=E501,E402,W605 ./
  container:
    from: src
- as: unit
  commands: |
    export HOME=/tmp
    pip3 install -r requirements.txt
    python3 -m unittest discover ./tests
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-hcm-deployment
