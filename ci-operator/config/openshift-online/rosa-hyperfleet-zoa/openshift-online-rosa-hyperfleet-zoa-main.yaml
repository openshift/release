base_images:
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
build_root:
  project_image:
    dockerfile_path: ci/Containerfile
images:
  items:
  - dockerfile_path: Containerfile
    to: zoa-tools
releases:
  latest:
    release:
      channel: stable
      version: "4.21"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: ./ci/lint.sh
  container:
    from: src
- as: test
  commands: ./ci/unit-tests.sh
  container:
    from: src
- as: verify
  commands: ./ci/verify.sh
  container:
    from: src
- always_run: false
  as: adversary-scan
  optional: true
  steps:
    test:
    - ref: security-adversary-scan
- always_run: false
  as: adversary-scan-full
  optional: true
  steps:
    env:
      ADVERSARY_SCAN_MODE: full-scan
    test:
    - ref: security-adversary-scan
- as: weekly-adversary-scan
  cron: 0 6 * * 6
  steps:
    allow_best_effort_post_steps: true
    env:
      ADVERSARY_SCAN_MODE: groundwork
    post:
    - ref: security-adversary-scan-notify
    test:
    - ref: security-adversary-scan
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-hyperfleet-zoa
