base_images:
  ansible:
    name: "4.22"
    namespace: ocp
    tag: ansible
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: capa-e2e
  cron: 0 8 * * *
  steps:
    cluster_profile: openshift-org-aws
    env:
      CHANNEL_GROUP: stable
      OPENSHIFT_VERSION: "4.22"
      REGION: us-east-1
      TEST_SUITE: --tag smoke
    workflow: rosa-e2e-capa
  timeout: 5h0m0s
- as: capa-e2e-full
  cron: 0 8 * * 1
  steps:
    cluster_profile: openshift-org-aws
    env:
      CHANNEL_GROUP: stable
      OPENSHIFT_VERSION: "4.22"
      REGION: us-east-1
      RESERVE_UPGRADE_PATH: "true"
      TEST_SUITE: --tag full
    workflow: rosa-e2e-capa
  timeout: 8h0m0s
- as: capa-e2e-stable-4-21
  cron: 0 2 * * *
  steps:
    cluster_profile: openshift-org-aws
    env:
      CHANNEL_GROUP: stable
      CLUSTER_API_INSTALLER_REF: backplane-2.11
      OPENSHIFT_VERSION: "4.21"
      REGION: us-east-1
      TEST_SUITE: --tag smoke
    workflow: rosa-e2e-capa
  timeout: 5h0m0s
- as: capa-e2e-stable-4-21-full
  cron: 0 8 * * 2
  steps:
    cluster_profile: openshift-org-aws
    env:
      CHANNEL_GROUP: stable
      CLUSTER_API_INSTALLER_REF: backplane-2.11
      OPENSHIFT_VERSION: "4.21"
      REGION: us-east-1
      RESERVE_UPGRADE_PATH: "true"
      TEST_SUITE: --tag full
    workflow: rosa-e2e-capa
  timeout: 8h0m0s
- as: capa-e2e-stable-4-22
  cron: 0 4 * * *
  steps:
    cluster_profile: openshift-org-aws
    env:
      CHANNEL_GROUP: stable
      CLUSTER_API_INSTALLER_REF: backplane-2.17
      OPENSHIFT_VERSION: "4.22"
      REGION: us-east-1
      TEST_SUITE: --tag smoke
    workflow: rosa-e2e-capa
  timeout: 5h0m0s
- as: capa-e2e-stable-4-22-full
  cron: 0 8 * * 3
  steps:
    cluster_profile: openshift-org-aws
    env:
      CHANNEL_GROUP: stable
      CLUSTER_API_INSTALLER_REF: backplane-2.17
      OPENSHIFT_VERSION: "4.22"
      REGION: us-east-1
      RESERVE_UPGRADE_PATH: "true"
      TEST_SUITE: --tag full
    workflow: rosa-e2e-capa
  timeout: 8h0m0s
zz_generated_metadata:
  branch: main_capa-e2e
  org: openshift-online
  repo: rosa-e2e
