base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: ocm-fvt-periodic-cs-rosa-sts-ad-staging-main
  capabilities:
  - nested-podman
  cron: 0 3 * * *
  nested_podman: true
  steps:
    allow_best_effort_post_steps: true
    env:
      OCM_FVT_JOB_NAME: cs-rosa-sts-ad-staging-main
    post:
    - ref: rosa-e2e-collect-cs-telemetry
    pre:
    - ref: rosa-e2e-record-start-time
    test:
    - ref: rosa-e2e-ocm-fvt
  timeout: 5h0m0s
- as: ocm-fvt-periodic-cs-rosa-ad-staging-main
  capabilities:
  - nested-podman
  cron: 40 2 * * *
  nested_podman: true
  steps:
    allow_best_effort_post_steps: true
    env:
      OCM_FVT_JOB_NAME: cs-rosa-ad-staging-main
    post:
    - ref: rosa-e2e-collect-cs-telemetry
    pre:
    - ref: rosa-e2e-record-start-time
    test:
    - ref: rosa-e2e-ocm-fvt
  timeout: 5h0m0s
- as: ocm-fvt-periodic-cs-osd-rh-aws-staging-main
  capabilities:
  - nested-podman
  cron: 0 4 * * *
  nested_podman: true
  steps:
    allow_best_effort_post_steps: true
    env:
      OCM_FVT_JOB_NAME: cs-osd-rh-aws-staging-main
    post:
    - ref: rosa-e2e-collect-cs-telemetry
    pre:
    - ref: rosa-e2e-record-start-time
    test:
    - ref: rosa-e2e-ocm-fvt
  timeout: 5h0m0s
- as: ocm-fvt-periodic-cs-rosa-sts-upgrade-staging-main
  capabilities:
  - nested-podman
  cron: 20 2 * * *
  nested_podman: true
  steps:
    allow_best_effort_post_steps: true
    env:
      OCM_FVT_JOB_NAME: cs-rosa-sts-upgrade-staging-main
    post:
    - ref: rosa-e2e-collect-cs-telemetry
    pre:
    - ref: rosa-e2e-record-start-time
    test:
    - ref: rosa-e2e-ocm-fvt
  timeout: 5h0m0s
- as: ocm-fvt-periodic-cs-rosa-sts-nx-y-upgrade-staging-main
  capabilities:
  - nested-podman
  cron: 0 0 31 2 *
  nested_podman: true
  steps:
    allow_best_effort_post_steps: true
    env:
      OCM_FVT_EXTRA_ENVS: |-
        CLUSTER_PROFILE=rosa-sts-upgrade
        UPGRADE_DISTANCE=4
        UPGRADE_TARGET_CHANNEL=candidate
        UPGRADE_TARGET_VERSION=4.22.6
      OCM_FVT_JOB_NAME: cs-rosa-sts-nx-y-upgrade-staging-main
    post:
    - ref: rosa-e2e-collect-cs-telemetry
    pre:
    - ref: rosa-e2e-record-start-time
    test:
    - ref: rosa-e2e-ocm-fvt-longrunning
  timeout: 12h0m0s
- as: ocm-fvt-periodic-cs-rosa-sts-shared-vpc-staging-main
  capabilities:
  - nested-podman
  cron: 40 3 * * *
  nested_podman: true
  steps:
    allow_best_effort_post_steps: true
    env:
      OCM_FVT_JOB_NAME: cs-rosa-sts-shared-vpc-staging-main
    post:
    - ref: rosa-e2e-collect-cs-telemetry
    pre:
    - ref: rosa-e2e-record-start-time
    test:
    - ref: rosa-e2e-ocm-fvt
  timeout: 5h0m0s
- as: ocm-fvt-periodic-cs-rosa-sts-pl-staging-main
  capabilities:
  - nested-podman
  cron: 20 3 * * *
  nested_podman: true
  steps:
    allow_best_effort_post_steps: true
    env:
      OCM_FVT_JOB_NAME: cs-rosa-sts-pl-staging-main
    post:
    - ref: rosa-e2e-collect-cs-telemetry
    pre:
    - ref: rosa-e2e-record-start-time
    test:
    - ref: rosa-e2e-ocm-fvt
  timeout: 5h0m0s
- as: ocm-fvt-periodic-cs-ocm-resources-staging-main
  capabilities:
  - nested-podman
  cron: 20 4 * * *
  nested_podman: true
  steps:
    allow_best_effort_post_steps: true
    env:
      OCM_FVT_JOB_NAME: cs-ocm-resources-staging-main
    post:
    - ref: rosa-e2e-collect-cs-telemetry
    pre:
    - ref: rosa-e2e-record-start-time
    test:
    - ref: rosa-e2e-ocm-fvt
  timeout: 5h0m0s
- as: ocm-fvt-periodic-cs-rosa-classic-cust-chan-staging-main
  capabilities:
  - nested-podman
  commands: |
    podman_env_file="$(mktemp /tmp/podman.env.XXXXXX)"
    trap 'rm -f "${podman_env_file}"' EXIT
    umask 077
    env -i bash --norc --noprofile << 'EOF' > "${podman_env_file}"
    export AWS_SHARED_CREDENTIALS_FILE=/credentials/aws-cred
    export SHARED_VPC_AWS_SHARED_CREDENTIALS_FILE=/credentials/aws-shared-vpc-credentials
    export ENABLE_JIRA_REPORTING=true
    JOB_LINK="https://prow.ci.openshift.org/view/gs/test-platform-results/"
    if [ -n "${PULL_NUMBER:-}" ]; then
      JOB_LINK="${JOB_LINK}pr-logs/pull/openshift_release/${PULL_NUMBER}/${JOB_NAME}/${BUILD_ID}"
    else
      JOB_LINK="${JOB_LINK}logs/${JOB_NAME}/${BUILD_ID}"
    fi
    echo "JOB_LINK=${JOB_LINK}"
    export JOB_LINK=${JOB_LINK}
    source /usr/local/cs-qe-credentials/ocm-tokens
    source /usr/local/cs-qe-credentials/jira-cred
    env | grep -v '^_='
    EOF

    podman run \
    --authfile /usr/local/cs-qe-credentials/.dockerconfigjson \
    --env-file "${podman_env_file}" \
    -v /usr/local/cs-qe-credentials:/credentials:ro,z \
    --rm \
    quay.io/redhat-services-prod/ocmci/ocmci:latest \
    ocmtest test --service cms --job cs-rosa-classic-custom-channel-staging-main --reportJiraTicket
  container:
    from: nested-podman
    memory_backed_volume:
      size: 1Gi
  cron: 0 8 * * *
  nested_podman: true
  secrets:
  - mount_path: /usr/local/cs-qe-credentials
    name: cs-qe-credentials
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-e2e
  variant: ocm-fvt-rosa-classic-staging
