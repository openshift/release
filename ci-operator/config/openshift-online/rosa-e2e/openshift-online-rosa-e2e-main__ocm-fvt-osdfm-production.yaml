base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: ocm-fvt-gating-osdfm-prod-canary
  capabilities:
  - intranet
  - nested-podman
  cluster: build05
  cron: 0 0 31 2 *
  nested_podman: true
  reporter_config:
    channel: '#rosa-prow-info'
    job_states_to_report:
    - success
    - failure
    - error
  restrict_network_access: false
  steps:
    allow_best_effort_post_steps: true
    env:
      OCM_FVT_APPSRE_BACKPLANE_CLUSTER_ID: 1d9fi3c3piguq1frmf3fo0hekbmvfovn
      OCM_FVT_BACKPLANE_CLUSTER_ID: 1eeevg8pdl5km7grrlnc2gc3rqnrfgiq
      OCM_FVT_BACKPLANE_CREDENTIALS_DIR: /usr/local/rosa-clusters-service-sandbox
      OCM_FVT_BACKPLANE_ELEVATE_REASON: https://issues.redhat.com/browse/ROSAENG-62650
      OCM_FVT_EXTRA_ENVS: |-
        SECTOR=canary
        SOAK_TIME=15
      OCM_FVT_JOB_NAME: osdfm-basic-production
      OCM_FVT_OCM_ENV: production
      OCM_FVT_REPORT_JIRA: "false"
      OCM_FVT_SERVICE: osdfm
      OCM_FVT_USE_BACKPLANE: "true"
    test:
    - ref: rosa-e2e-ocm-fvt-longrunning
  timeout: 4h0m0s
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-e2e
  variant: ocm-fvt-osdfm-production
