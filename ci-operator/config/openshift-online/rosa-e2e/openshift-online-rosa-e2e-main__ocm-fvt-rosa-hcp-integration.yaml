base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: ocm-fvt-periodic-cs-rosa-hcp-autonode-integration-main
  capabilities:
  - nested-podman
  cron: 0 8 * * *
  nested_podman: true
  steps:
    allow_best_effort_post_steps: true
    env:
      OCM_FVT_EXTRA_ENVS: DR_AWS_CREDENTIALS_FILE=/credentials/aws_dr_shared_cred
      OCM_FVT_JOB_NAME: cs-rosa-hcp-autonode-integration-main
      OCM_FVT_OCM_ENV: integration
    post:
    - chain: rosa-gather-hcp-diagnostics
    test:
    - ref: rosa-e2e-ocm-fvt
  timeout: 5h0m0s
