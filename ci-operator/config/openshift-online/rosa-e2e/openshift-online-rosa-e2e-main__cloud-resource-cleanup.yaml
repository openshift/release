releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: profile01-us-east-1
  cron: 0 6 * * 0
  steps:
    cluster_profile: rosa-e2e-01
    env:
      CLEAN_IAM: "true"
      REGION: us-east-1
    workflow: rosa-aws-cleanup
- as: profile01-us-west-1
  cron: 0 7 * * 0
  steps:
    cluster_profile: rosa-e2e-01
    env:
      CLEAN_IAM: "false"
      REGION: us-west-1
    workflow: rosa-aws-cleanup
- as: profile01-us-east-2
  cron: 0 8 * * 0
  steps:
    cluster_profile: rosa-e2e-01
    env:
      CLEAN_IAM: "false"
      REGION: us-east-2
    workflow: rosa-aws-cleanup
- as: profile01-us-west-2
  cron: 0 9 * * 0
  steps:
    cluster_profile: rosa-e2e-01
    env:
      CLEAN_IAM: "false"
      REGION: us-west-2
    workflow: rosa-aws-cleanup
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-e2e
  variant: cloud-resource-cleanup
