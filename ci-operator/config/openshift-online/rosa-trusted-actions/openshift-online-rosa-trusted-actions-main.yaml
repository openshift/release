build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.ci.openshift.org/ocp/builder:rhel-9-golang-1.26-openshift-4.23 AS go-builder
      FROM registry.access.redhat.com/ubi9/nodejs-22:latest
      USER root
      COPY --from=go-builder /usr/lib/golang /usr/local/go
      ENV PATH=$PATH:/usr/local/go/bin
      ENV GOPATH=/tmp/go
      RUN mkdir -p /go/src ${GOPATH} && chmod -R 777 /go ${GOPATH}
      USER 1001
prowgen:
  expose: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: make-test
  commands: HOME=/tmp make test
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-trusted-actions
