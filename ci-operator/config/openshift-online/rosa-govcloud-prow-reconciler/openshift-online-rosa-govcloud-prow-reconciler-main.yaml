build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.access.redhat.com/ubi9/go-toolset:1.26
      ENV CGO_ENABLED=1 GOTOOLCHAIN=local
      RUN mkdir -p /opt/app-root/src/.ci-bin && cd /tmp && \
          GOBIN=/opt/app-root/src/.ci-bin GOFLAGS=-mod=mod GOPROXY=https://proxy.golang.org \
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
      ENV PATH=/opt/app-root/src/.ci-bin:${PATH}
images:
  items:
  - dockerfile_path: Containerfile
    to: rosa-govcloud-prow-reconciler
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: verify
  commands: HOME=/tmp GOCACHE=/tmp/go-cache make verify
  container:
    from: src
- as: unit
  commands: HOME=/tmp GOCACHE=/tmp/go-cache make test
  container:
    from: src
- as: lint
  commands: HOME=/tmp GOCACHE=/tmp/go-cache make lint
  container:
    from: src
- as: build
  commands: HOME=/tmp GOCACHE=/tmp/go-cache make build
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-govcloud-prow-reconciler
