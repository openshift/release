base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  ubi-python:
    name: ubi-python-311
    namespace: ocp
    tag: "9"
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.26-openshift-4.23
images:
  items:
  - dockerfile_literal: |
      FROM ubi-python
      USER 0
      RUN dnf install -y --nodocs make && dnf clean all
      COPY . /workspace/
      WORKDIR /workspace/rosa-boundary/lambda/create-investigation
      RUN pip install uv && uv sync
    from: ubi-python
    inputs:
      src:
        paths:
        - destination_dir: .
          source_path: /go/src/github.com/openshift-online/rosa-boundary
    to: lambda-test-runner
  - dockerfile_literal: |
      FROM nested-podman
      USER root
      # Install Python 3.11 and make it default via symlinks
      # (ci-run.sh on main branch still uses hardcoded python3 commands)
      # TODO: Remove symlinks after rosa-boundary PR merges with python3.11 detection
      RUN dnf install -y --nodocs make python3.11 python3.11-pip && \
          dnf clean all && \
          ln -sf /usr/bin/python3.11 /usr/bin/python3 && \
          ln -sf /usr/bin/pip3.11 /usr/bin/pip3
      # Create /home/user with correct permissions BEFORE copying files
      # (nested-podman runs as UID 1000, needs writable home directory)
      RUN mkdir -p /home/user/.config && chown -R 1000:1000 /home/user
      # Reuse the Go toolchain from the CI build root, as in sippy-integration.
      COPY golang /usr/lib/golang
      ENV GOROOT=/usr/lib/golang
      ENV PATH=/usr/lib/golang/bin:${PATH}
      ENV GOTOOLCHAIN=auto
      COPY --chown=1000:0 rosa-boundary /workspace/rosa-boundary
      # Install test dependencies using uv (matches lambda-test-runner pattern)
      WORKDIR /workspace/rosa-boundary/tests/localstack
      RUN pip3 install uv && uv pip install --python python3.11 --system .
      USER 1000
    from: nested-podman
    inputs:
      src:
        paths:
        - destination_dir: .
          source_path: /go/src/github.com/openshift-online/rosa-boundary
        - destination_dir: golang
          source_path: /usr/lib/golang/.
    to: localstack-test-runner
  - dockerfile_literal: |
      FROM src
      USER 0
      # components/trusted-actions is a separate Go module whose `make test`
      # regenerates the OpenAPI bindings before running the tests, so the unit
      # job needs Node alongside the Go toolchain that src already provides.
      RUN dnf install -y --nodocs nodejs npm && dnf clean all
      # Installed at image build time rather than at test time, matching
      # lambda-test-runner above, so the job does not depend on the npm
      # registry being reachable from the test pod.
      WORKDIR /go/src/github.com/openshift-online/rosa-boundary/components/trusted-actions
      RUN npm install
      # Same reasoning for the Go side: code generation runs oapi-codegen with
      # `go run`, so its module has to be in the cache before the test pod,
      # which has no reason to reach proxy.golang.org.
      RUN GOPATH=/tmp/go go mod download
      WORKDIR /go/src/github.com/openshift-online/rosa-boundary
      USER 1001
    from: src
    to: trusted-actions-test-runner
  skip_if_only_changed: ^(components/trusted-actions/|hcp-terraform/rosa-trusted-actions/|\.tekton/rosa-trusted-actions-)
prowgen:
  expose: true
  private: true
resources:
  '*':
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 200Mi
  localstack-integration-tests:
    limits:
      memory: 2Gi
tests:
- as: coverage
  commands: |
    unset GOFLAGS
    make codecov
  container:
    from: src
  optional: true
  secrets:
  - collection: rosa-boundary
    group: codecov-secret
    mount_path: /var/run/codecov-secret
  skip_if_only_changed: ^(components/trusted-actions/|hcp-terraform/rosa-trusted-actions/|\.tekton/rosa-trusted-actions-)
- as: lambda-unit-tests
  commands: |
    export UV_CACHE_DIR=/tmp/uv-cache
    export AWS_DEFAULT_REGION=us-east-1
    cd /workspace/rosa-boundary
    make test-lambda-create-investigation
  container:
    from: lambda-test-runner
  skip_if_only_changed: ^(components/trusted-actions/|hcp-terraform/rosa-trusted-actions/|\.tekton/rosa-trusted-actions-)
- as: localstack-integration-tests
  capabilities:
  - nested-podman
  commands: |
    set -euo pipefail
    export LOCALSTACK_AUTH_TOKEN=$(cat /etc/localstack-secret/localstack-token)
    # Keep build, module, and automatically downloaded toolchains writable by the test user.
    export GOCACHE=$(mktemp -d)
    export GOPATH=$(mktemp -d)
    export GOMODCACHE="${GOPATH}/pkg/mod"
    cd /workspace/rosa-boundary
    go version
    make test-localstack-ci
  container:
    from: localstack-test-runner
  nested_podman: true
  run_if_changed: ^(lambda/|deploy/regional/|tests/localstack/|cmd/|pkg/|internal/|go\.(mod|sum)$|Makefile$)
  secret:
    collection: rosa-boundary
    group: ci
    mount_path: /etc/localstack-secret
- as: trusted-actions-unit
  commands: HOME=/tmp make -C components/trusted-actions test
  container:
    from: trusted-actions-test-runner
  run_if_changed: ^components/trusted-actions/
- as: e2e-rosa-classic-sts
  cron: 0 2 * * *
  reporter_config:
    channel: '#rosa-zoa-alerts'
    job_states_to_report:
    - failure
    - error
    report_template: '{{.Spec.Job}} failed: <{{.Status.URL}}|logs>'
  steps:
    cluster_profile: rosa-e2e-01
    env:
      SOURCE_DIR: components/trusted-actions
    workflow: rosa-trusted-actions-e2e-workflow
- always_run: false
  as: e2e-rosa-classic-sts-ondemand
  optional: true
  steps:
    cluster_profile: rosa-e2e-01
    env:
      SOURCE_DIR: components/trusted-actions
    workflow: rosa-trusted-actions-e2e-workflow
- as: publish-coverage
  commands: |
    unset GOFLAGS
    make codecov
  container:
    from: src
  postsubmit: true
  secrets:
  - collection: rosa-boundary
    group: codecov-secret
    mount_path: /var/run/codecov-secret
  skip_if_only_changed: ^(components/trusted-actions/|hcp-terraform/rosa-trusted-actions/|\.tekton/rosa-trusted-actions-)
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-boundary
