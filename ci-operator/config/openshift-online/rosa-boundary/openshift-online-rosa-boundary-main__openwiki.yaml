base_images:
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
prowgen:
  enable_secrets_store_csi_driver: true
  private: true
resources:
  '*':
    requests:
      cpu: 500m
      memory: 4Gi
tests:
- as: openwiki-update
  cron: 0 16 * * 2,4
  steps:
    test:
    - ref: rosa-boundary-openwiki-update
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-boundary
  variant: openwiki
