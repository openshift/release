build_root:
  image_stream_tag:
    name: ams-ci-v6
    namespace: ci
    tag: latest
prowgen:
  expose: true
  private: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
test_binary_build_commands: |
  # Warm the Go module and build caches once per run so every test pod starts
  # from them instead of re-downloading and recompiling. Test pods run as a
  # random UID in group 0 with HOME=/home/user, so the build cache must live
  # under that HOME and be group-writable. Each `go test` below mirrors the
  # flags of a Makefile test target; a mismatch only costs a recompile.
  # `-exec /bin/true` builds and links every test binary without running it,
  # and `go clean -testcache` drops the resulting fake passes so test pods
  # never report a cached result for tests that did not actually run.
  set -e
  unset GOFLAGS
  export GOCACHE=/home/user/.cache/go-build
  make install
  go test -exec /bin/true ./pkg/... ./cmd/...
  go test -exec /bin/true -ldflags -s ./test/integration
  go test -exec /bin/true -tags=fedramp -ldflags -s ./test/fedramp
  go test -exec /bin/true -tags=xcm -ldflags -s ./test/xcm
  go clean -testcache
  # go writes its telemetry dir to $HOME/.config; rootless podman (make db/setup)
  # refuses to start when $HOME/.config exists and is owned by another user.
  rm -rf /home/user/.config
  chgrp -R 0 /home/user /go
  chmod -R g=u /home/user /go
tests:
- as: lint
  commands: |
    unset GOFLAGS
    echo "Go Version: $(go version)"
    make verify
    make lint
  container:
    from: test-bin
- as: unit-test
  capabilities:
  - nested-podman
  commands: |
    unset GOFLAGS
    echo "Go Version: $(go version)"
    cp /opt/app-root/ams-secrets/rhsm.crt secrets/rhsm.crt
    cp /opt/app-root/ams-secrets/rbac.crt secrets/rbac.crt
    cp /opt/app-root/ams-secrets/rhsm.key secrets/rhsm.key
    cp /opt/app-root/ams-secrets/rbac.key secrets/rbac.key
    cp /opt/app-root/ams-secrets/kafka.json secrets/kafka.json
    make db/setup
    sleep 5
    make test
  container:
    from: test-bin
  nested_podman: true
  secrets:
  - collection: rosa-account-manager-service
    group: placeholder
    mount_path: /opt/app-root/ams-secrets
- as: fedramp-test
  capabilities:
  - nested-podman
