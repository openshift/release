build_root:
  image_stream_tag:
    name: ams-ci-v6
    namespace: ci
    tag: latest
prowgen:
  expose: true
  private: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: |
    unset GOFLAGS
    echo "Go Version: $(go version)"
    make verify
    make lint
  container:
    from: src
- as: unit-test
  capabilities:
  - nested-podman
  commands: |
    unset GOFLAGS
    echo "Go Version: $(go version)"
    cp /opt/app-root/ams-secrets/rhsm.crt secrets/rhsm.crt
    cp /opt/app-root/ams-secrets/rbac.crt secrets/rbac.crt
    cp /opt/app-root/ams-secrets/rhsm.key secrets/rhsm.key
    cp /opt/app-root/ams-secrets/rbac.key secrets/rbac.key
    cp /opt/app-root/ams-secrets/kafka.json secrets/kafka.json
    make db/setup
    sleep 5
    # Upload only when tests pass; the test result alone decides the job outcome.
    make test && { scripts/codecov.sh unit-tests coverage.out unit-test \
      || echo "WARN: Codecov upload failed (non-fatal)"; }
  container:
    from: src
  nested_podman: true
  secrets:
  - collection: rosa-account-manager-service
    group: placeholder
    mount_path: /opt/app-root/ams-secrets
  - collection: rosa-account-manager-service
    group: codecov
    mount_path: /var/run/codecov-secret
- as: fedramp-test
  capabilities:
  - nested-podman
  commands: |
    unset GOFLAGS
    cp /opt/app-root/ams-secrets/rhsm.crt secrets/rhsm.crt
    cp /opt/app-root/ams-secrets/rbac.crt secrets/rbac.crt
    cp /opt/app-root/ams-secrets/rhsm.key secrets/rhsm.key
    cp /opt/app-root/ams-secrets/rbac.key secrets/rbac.key
    cp /opt/app-root/ams-secrets/kafka.json secrets/kafka.json
    make db/setup
    sleep 5
    # Upload only when tests pass; the test result alone decides the job outcome.
    make test-fedramp && { scripts/codecov.sh fedramp-tests coverage-fedramp.out fedramp-test \
      || echo "WARN: Codecov upload failed (non-fatal)"; }
  container:
    from: src
  nested_podman: true
  secrets:
  - collection: rosa-account-manager-service
    group: placeholder
    mount_path: /opt/app-root/ams-secrets
  - collection: rosa-account-manager-service
    group: codecov
    mount_path: /var/run/codecov-secret
