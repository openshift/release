build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.25-openshift-4.22
prowgen:
  expose: true
  private: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: |
    export GOFLAGS=-mod=mod
    make build
    make test
  container:
    from: src
- as: lint
  commands: |
    export GOFLAGS=-mod=mod
    make lint
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: osd-gcp-marketplace-config
