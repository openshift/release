build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.access.redhat.com/ubi9/ubi:latest
      RUN dnf module enable -y nodejs:20 && \
            dnf install -y git make python3 jq npm && \
            npm install -g markdownlint-cli2@0.17.2 && \
            dnf clean all
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: make lint
  container:
    from: src
- as: unit
  commands: make test
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-agent
