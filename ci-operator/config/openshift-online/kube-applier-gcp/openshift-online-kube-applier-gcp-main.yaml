base_images:
  firestore-tests:
    name: gcp-hcp-firestore-tests
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: test
  commands: |
    unset GOFLAGS
    gcloud beta emulators firestore start \
      --host-port=127.0.0.1:8681 >"${ARTIFACT_DIR}/firestore-emulator.log" 2>&1 &
    for i in $(seq 1 30); do
      if curl -s -o /dev/null http://127.0.0.1:8681 2>/dev/null; then break; fi
      sleep 1
    done
    export FIRESTORE_EMULATOR_HOST=127.0.0.1:8681
    make test
  container:
    clone: true
    from: firestore-tests
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: kube-applier-gcp
