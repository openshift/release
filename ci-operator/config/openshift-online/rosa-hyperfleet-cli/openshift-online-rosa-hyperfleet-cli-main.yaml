build_root:
  from_repository: true
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: ./ci/lint.sh
  container:
    from: src
- as: test
  commands: ./ci/unit-tests.sh
  container:
    from: src
- as: verify
  commands: ./ci/verify.sh
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-hyperfleet-cli
