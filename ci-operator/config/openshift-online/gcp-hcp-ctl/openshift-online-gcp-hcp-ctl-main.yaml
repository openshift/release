build_root:
  image_stream_tag:
    name: hi-go
    namespace: ci
    tag: 1.27-fips-builder
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: |
    GOCACHE=$(mktemp -d) || exit $?
    export GOCACHE
    unset GOFLAGS
    make test
  container:
    from: src
- as: lint
  commands: |
    GOCACHE=$(mktemp -d) || exit $?
    export GOCACHE
    unset GOFLAGS
    make lint
  container:
    from: src
- as: build
  commands: |
    GOCACHE=$(mktemp -d) || exit $?
    export GOCACHE
    unset GOFLAGS
    make build
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: gcp-hcp-ctl
