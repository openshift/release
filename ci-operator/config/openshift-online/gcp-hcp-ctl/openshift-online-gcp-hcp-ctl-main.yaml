build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.access.redhat.com/ubi9/go-toolset:1.26.10-1792671270
      USER 0
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: |
    unset GOFLAGS
    make test
  container:
    from: src
- as: lint
  commands: |
    unset GOFLAGS
    make lint
  container:
    from: src
- as: build
  commands: |
    unset GOFLAGS
    make build
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: gcp-hcp-ctl
