build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
prowgen:
  expose: true
  private: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: |
    unset GOFLAGS
    export GOLANGCI_LINT_CACHE=/tmp/golangci-lint
    make lint
  container:
    from: src
- as: test
  commands: |
    unset GOFLAGS
    make test
  container:
    from: src
- as: test-envtest
  commands: |
    unset GOFLAGS
    make test-envtest
  container:
    from: src
- as: verify
  commands: |
    unset GOFLAGS
    make verify
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: socketcd
