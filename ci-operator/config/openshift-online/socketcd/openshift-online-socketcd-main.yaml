build_root:
  image_stream_tag:
    name: hi-go
    namespace: ci
    tag: 1.27-fips-builder
prowgen:
  expose: true
  private: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: lint
  commands: |
    GOCACHE=$(mktemp -d /tmp/go-build.XXXXXXXXXX) || exit $?
    GOLANGCI_LINT_CACHE=$(mktemp -d /tmp/golangci-lint.XXXXXXXXXX) || exit $?
    export GOCACHE GOLANGCI_LINT_CACHE
    make lint
  container:
    from: src
- as: test
  commands: |
    GOCACHE=$(mktemp -d /tmp/go-build.XXXXXXXXXX) || exit $?
    GOLANGCI_LINT_CACHE=$(mktemp -d /tmp/golangci-lint.XXXXXXXXXX) || exit $?
    export GOCACHE GOLANGCI_LINT_CACHE
    make test
  container:
    from: src
- as: test-envtest
  commands: |
    GOCACHE=$(mktemp -d /tmp/go-build.XXXXXXXXXX) || exit $?
    GOLANGCI_LINT_CACHE=$(mktemp -d /tmp/golangci-lint.XXXXXXXXXX) || exit $?
    export GOCACHE GOLANGCI_LINT_CACHE
    make test-envtest
  container:
    from: src
- as: verify
  commands: |
    GOCACHE=$(mktemp -d /tmp/go-build.XXXXXXXXXX) || exit $?
    GOLANGCI_LINT_CACHE=$(mktemp -d /tmp/golangci-lint.XXXXXXXXXX) || exit $?
    export GOCACHE GOLANGCI_LINT_CACHE
    make verify
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: socketcd
