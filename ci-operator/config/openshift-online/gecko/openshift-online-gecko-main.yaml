build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: test
  commands: |
    unset GOFLAGS
    echo "=== DEBUG ==="
    echo "GOTOOLCHAIN env: ${GOTOOLCHAIN:-unset}"
    go env GOTOOLCHAIN
    cat "$(go env GOROOT)/go.env" || true
    echo "go version: $(go version)"
    echo "make version: $(make --version | head -1)"
    echo "=== Attempting GOTOOLCHAIN=auto ==="
    export GOTOOLCHAIN=auto
    echo "GOTOOLCHAIN env after export: ${GOTOOLCHAIN}"
    go env GOTOOLCHAIN
    make test
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: gecko
