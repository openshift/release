base_images:
  firestore-tests:
    name: gcp-hcp-firestore-tests
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: test
  commands: |
    unset GOFLAGS
    gcloud beta emulators firestore start \
      --host-port=127.0.0.1:8681 >"${ARTIFACT_DIR}/firestore-emulator.log" 2>&1 &
    EMULATOR_READY=false
    for i in $(seq 1 30); do
      if curl -s -o /dev/null --connect-timeout 1 --max-time 10 http://127.0.0.1:8681 2>/dev/null; then
        echo "Firestore emulator ready after ${i}s"
        EMULATOR_READY=true
        break
      fi
      sleep 1
    done
    if [ "$EMULATOR_READY" != "true" ]; then
      echo "Firestore emulator did not start within 30s"
      exit 1
    fi
    export FIRESTORE_EMULATOR_HOST=127.0.0.1:8681
    make test
  container:
    clone: true
    from: firestore-tests
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: gecko
