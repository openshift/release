build_root:
  project_image:
    dockerfile_path: ci/Containerfile
images:
  items:
  - dockerfile_path: ci/Containerfile
    to: rosa-regional-platform-ci
promotion:
  to:
  - namespace: ci
    tag: latest
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    release:
      channel: stable
      version: "4.21"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: terraform-validate
  commands: ./ci/terraform-validate.sh
  container:
    from: src
- as: helm-lint
  commands: ./ci/helm-lint.sh
  container:
    from: src
- as: check-docs
  commands: ./ci/check-docs.sh
  container:
    from: src
- as: check-rendered-files
  commands: ./ci/check-rendered-files.sh
  container:
    from: src
- as: unit-tests
  commands: ./ci/run-unit-tests.sh
  container:
    from: src
- as: nightly-ephemeral
  cron: 0 4 * * *
  steps:
    allow_best_effort_post_steps: true
    env:
      ROSA_REGIONAL_TEARDOWN_FIRE_AND_FORGET: "false"
    post:
    - ref: rosa-hyperfleet-teardown
    pre:
    - ref: rosa-hyperfleet-provision
    test:
    - ref: rosa-hyperfleet-e2e
- as: nightly-integration
  cron: 0 4 * * *
  steps:
    test:
    - as: e2e
      commands: |-
        export AWS_CONFIG_FILE=/var/run/rosa-credentials/aws_config
        ./ci/e2e-tests.sh
      credentials:
      - collection: cluster-secrets-rosa-regional-platform-int
        group: integration-creds
        mount_path: /var/run/rosa-credentials
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- as: nightly-stage
  cron: 0 4 * * *
  steps:
    test:
    - as: e2e
      commands: |-
        export AWS_CONFIG_FILE=/var/run/rosa-credentials/aws_config
        ./ci/e2e-tests.sh
      credentials:
      - collection: cluster-secrets-rosa-regional-platform-int
        group: stage-creds
        mount_path: /var/run/rosa-credentials
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
- always_run: false
  as: on-demand-e2e
  steps:
    workflow: rosa-hyperfleet-ephemeral-e2e
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-hyperfleet
