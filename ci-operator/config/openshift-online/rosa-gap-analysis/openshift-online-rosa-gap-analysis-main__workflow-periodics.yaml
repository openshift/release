base_images:
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: workflow-classic-stable-4-22
  cron: 0 9 * * *
  steps:
    cluster_profile: rosa-e2e-01
    env:
      CHANNEL_GROUP: stable
      OPENSHIFT_VERSION: "4.22"
      REGION: us-west-2
    workflow: rosa-gap-analysis-classic
- as: workflow-hcp-stable-4-22
  cron: 15 9 * * *
  steps:
    cluster_profile: rosa-e2e-01
    env:
      CHANNEL_GROUP: stable
      ENABLE_BILLING_ACCOUNT: "yes"
      OPENSHIFT_VERSION: "4.22"
      REGION: us-west-2
      REPLICAS: "3"
    workflow: rosa-gap-analysis-hcp
- as: workflow-classic-candidate-5-0
  cron: 30 9 * * *
  steps:
    cluster_profile: rosa-e2e-01
    env:
      CHANNEL_GROUP: candidate
      OPENSHIFT_VERSION: "5.0"
      REGION: us-west-2
    workflow: rosa-gap-analysis-classic
- as: workflow-hcp-candidate-5-0
  cron: 45 9 * * *
  steps:
    cluster_profile: rosa-e2e-01
    env:
      CHANNEL_GROUP: candidate
      ENABLE_BILLING_ACCOUNT: "yes"
      OPENSHIFT_VERSION: "5.0"
      REGION: us-west-2
      REPLICAS: "3"
    workflow: rosa-gap-analysis-hcp
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-gap-analysis
  variant: workflow-periodics
