build_root:
  project_image:
    dockerfile_path: ci/Containerfile
images:
  items:
  - dockerfile_path: ci/Containerfile
    to: rosa-gap-analysis
resources:
  '*':
    limits:
      memory: 1Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: nightly
  cron: 0 9 * * *
  steps:
    env:
      GAP_JOB_SYNC_DRY_RUN: "true"
    test:
    - ref: rosa-gap-analysis-job-sync
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: rosa-gap-analysis
  variant: job-sync
