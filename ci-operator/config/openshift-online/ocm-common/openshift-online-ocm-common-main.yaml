build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.25-openshift-4.22
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: commit-validation
  commands: |
    git remote add origin .
    echo "PULL_BASE_SHA=${PULL_BASE_SHA}"
    echo "PULL_PULL_SHA=${PULL_PULL_SHA}"
    if git cat-file -e ${PULL_BASE_SHA} 2>/dev/null; then
      git update-ref refs/remotes/origin/main ${PULL_BASE_SHA}
    else
      echo "PULL_BASE_SHA not found in repo, falling back to HEAD~1"
      git update-ref refs/remotes/origin/main HEAD~1
    fi
    set -x
    # Validate commit message format: JIRA-TICKET | TYPE: MESSAGE
    commit_messages=$(git log --pretty=format:"%s" origin/main..HEAD)
    echo "$commit_messages" | while IFS= read -r message; do
      echo "Validating: $message"
      if ! echo "$message" | grep -qE "^[A-Z]+-[0-9]+ \| (feat|fix|docs|style|refactor|test|chore|build|ci|perf): .*$"; then
        echo "Invalid commit message format. Expected: JIRA-TICKET | TYPE: MESSAGE"
        echo "Example: OCMCOMM-123 | feat: add new feature"
        exit 1
      fi
    done
  container:
    from: src
- as: build
  commands: |
    unset GOFLAGS
    make build
  container:
    from: src
- as: unit
  commands: |
    unset GOFLAGS
    make test
  container:
    from: src
- as: lint
  commands: |
    unset GOFLAGS
    go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
    HOME=${ARTIFACT_DIR} make lint
  container:
    from: src
- as: verify
  commands: |
    unset GOFLAGS
    make fmt
    git diff --exit-code || (echo "Code is not formatted. Run 'make fmt' locally." && exit 1)
  container:
    from: src
- as: coverage
  commands: |
    unset GOFLAGS
    make coverage
  container:
    from: src
  optional: true
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: ocm-common
