base_images:
  ocp_builder_rhel-9-golang-1.26-openshift-4.23:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.23
binary_build_commands: make terraform-init
build_root:
  image_stream_tag:
    name: gcp-hcp-infra-base
    namespace: ci
    tag: latest
  use_build_cache: true
images:
  items:
  - context_dir: test
    dockerfile_path: Dockerfile.e2e
    to: gcp-hcp-e2e-tests
  - context_dir: test
    dockerfile_path: Dockerfile.firestore
    to: gcp-hcp-firestore-tests
promotion:
  to:
  - additional_images:
      gcp-hcp-e2e-tests: gcp-hcp-e2e-tests
      gcp-hcp-firestore-tests: gcp-hcp-firestore-tests
    excluded_images:
    - '*'
    namespace: ci
    tag: latest
prowgen:
  disable_sparse_checkout: true
  enable_secrets_store_csi_driver: true
  expose: true
  private: true
releases:
  latest:
    release:
      channel: stable
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: "8"
      memory: 4Gi
tests:
- as: terraform-validate
  steps:
    test:
    - as: validate
      commands: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$(cat /etc/github-private/oauth)"; }; f'
        cat > "$HOME/.terraformrc" <<TFRC
        credentials "app.terraform.io" {
          token = "$(cat /etc/terraform-cloud/token)"
        }
        TFRC
        make terraform-validate
      credentials:
      - collection: gcp-hcp-infra-terraform-cloud
        group: tfcloud-token
        mount_path: /etc/terraform-cloud
      from: src
      resources:
        requests:
          cpu: "8"
          memory: 4Gi
- as: terraform-test
  steps:
    test:
    - as: test
      commands: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$(cat /etc/github-private/oauth)"; }; f'
        cat > "$HOME/.terraformrc" <<TFRC
        credentials "app.terraform.io" {
          token = "$(cat /etc/terraform-cloud/token)"
        }
        TFRC
        make terraform-test
      credentials:
      - collection: gcp-hcp-infra-terraform-cloud
        group: tfcloud-token
        mount_path: /etc/terraform-cloud
      from: src
      resources:
        requests:
          cpu: "8"
          memory: 4Gi
- always_run: false
  as: terraform-plan
  run_if_changed: ^(terraform/(config/(global|region|management-cluster|service)/|modules/|metadata/|workflows/|dashboards/)|hcp-terraform/gcp-hcp-.+/main\.tf\.json$)
  steps:
    test:
    - as: plan
      commands: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global credential.helper '!f() {
          if [ "$1" = "get" ]; then
            host="" proto=""
            while IFS= read -r line; do
              [ -z "$line" ] && break
              case "$line" in
                host=*) host="${line#host=}" ;;
                protocol=*) proto="${line#protocol=}" ;;
              esac
            done
            if [ "$proto" = "https" ] && [ "$host" = "github.com" ]; then
              echo "username=x-access-token"
              echo "password=$(cat /etc/github-private/oauth)"
            else
              exit 1
            fi
          fi
        }; f'
        umask 077
        cat > "$HOME/.terraformrc" <<TFRC
        credentials "app.terraform.io" {
          token = "$(cat /etc/terraform-cloud/token)"
        }
        TFRC
        # Do not execute fork-controlled Makefile or planner code with
        # credentials. The base revision is trusted, and the planner itself
        # rejects PRs whose author is not an organization member or repo
        # collaborator before Terraform is invoked.
        if [ "${REPO_OWNER}/${REPO_NAME}" != "openshift-online/gcp-hcp-infra" ]; then
          echo "Skipping Prow plan: job context is not openshift-online/gcp-hcp-infra"
          exit 0
        fi
        set -o pipefail
        git show "${PULL_BASE_SHA}:hack/tfc-speculative-plan.py" | python3 -
      credentials:
      - as: oauth
        collection: test-platform-infra
        field: private-git-cloner
        group: openshift-ci-robot
        mount_path: /etc/github-private
      - collection: gcp-hcp-infra-terraform-cloud
        group: tfcloud-token
        mount_path: /etc/terraform-cloud
      from: src
      resources:
        requests:
          cpu: "8"
          memory: 4Gi
- as: check-orphan-modules
  commands: make check-orphan-modules
  container:
    from: src
- as: check-generated-files
  commands: export UV_CACHE_DIR=/tmp/.uv-cache UV_PYTHON_INSTALL_DIR=/tmp/.uv-python
    UV_NO_PROGRESS=true && make check-generated-files
  container:
    from: src
- as: gitops-promoter-test
  commands: make gitops-promoter-test
  container:
    clone: true
    from: ocp_builder_rhel-9-golang-1.26-openshift-4.23
- always_run: false
  as: e2e-platform
  steps:
    cluster_profile: platform-gcp
    workflow: gcp-hcp-e2e
- as: generate-bin
  postsubmit: true
  steps:
    test:
    - as: generate
      commands: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$(cat /etc/github-private/oauth)"; }; f'
        cat > "$HOME/.terraformrc" <<TFRC
        credentials "app.terraform.io" {
          token = "$(cat /etc/terraform-cloud/token)"
        }
        TFRC
        make terraform-init
      credentials:
      - collection: gcp-hcp-infra-terraform-cloud
        group: tfcloud-token
        mount_path: /etc/terraform-cloud
      from: bin
      resources:
        requests:
          cpu: "8"
          memory: 4Gi
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: gcp-hcp-infra
