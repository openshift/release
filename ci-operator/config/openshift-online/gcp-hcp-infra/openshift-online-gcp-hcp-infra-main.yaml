binary_build_commands: make terraform-init
build_root:
  image_stream_tag:
    name: gcp-hcp-infra-base
    namespace: ci
    tag: latest
  use_build_cache: true
images:
  items:
  - context_dir: test
    dockerfile_path: Dockerfile.e2e
    to: gcp-hcp-e2e-tests
  - context_dir: test
    dockerfile_path: Dockerfile.firestore
    to: gcp-hcp-firestore-tests
promotion:
  to:
  - additional_images:
      gcp-hcp-e2e-tests: gcp-hcp-e2e-tests
      gcp-hcp-firestore-tests: gcp-hcp-firestore-tests
    excluded_images:
    - '*'
    namespace: ci
    tag: latest
prowgen:
  disable_sparse_checkout: true
  enable_secrets_store_csi_driver: true
  expose: true
  private: true
releases:
  latest:
    release:
      channel: stable
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: "8"
      memory: 4Gi
tests:
- as: terraform-validate
  steps:
    test:
    - as: validate
      commands: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$(cat /etc/github-private/oauth)"; }; f'
        cat > "$HOME/.terraformrc" <<TFRC
        credentials "app.terraform.io" {
          token = "$(cat /etc/terraform-cloud/token)"
        }
        TFRC
        make terraform-validate
      credentials:
      - collection: gcp-hcp-infra-terraform-cloud
        group: tfcloud-token
        mount_path: /etc/terraform-cloud
      from: src
      resources:
        requests:
          cpu: "8"
          memory: 4Gi
- as: terraform-test
  steps:
    test:
    - as: test
      commands: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$(cat /etc/github-private/oauth)"; }; f'
        cat > "$HOME/.terraformrc" <<TFRC
        credentials "app.terraform.io" {
          token = "$(cat /etc/terraform-cloud/token)"
        }
        TFRC
        make terraform-test
      credentials:
      - collection: gcp-hcp-infra-terraform-cloud
        group: tfcloud-token
        mount_path: /etc/terraform-cloud
      from: src
      resources:
        requests:
          cpu: "8"
          memory: 4Gi
- as: check-orphan-modules
  commands: make check-orphan-modules
  container:
    from: src
- as: check-generated-files
  commands: export UV_CACHE_DIR=/tmp/.uv-cache UV_PYTHON_INSTALL_DIR=/tmp/.uv-python
    UV_NO_PROGRESS=true && make check-generated-files
  container:
    from: src
- always_run: false
  as: e2e-platform
  steps:
    cluster_profile: platform-gcp
    workflow: gcp-hcp-e2e
- as: generate-bin
  postsubmit: true
  steps:
    test:
    - as: generate
      commands: |
        git config --global url."https://github.com/".insteadOf "git@github.com:"
        git config --global credential.helper '!f() { echo username=x-access-token; echo "password=$(cat /etc/github-private/oauth)"; }; f'
        cat > "$HOME/.terraformrc" <<TFRC
        credentials "app.terraform.io" {
          token = "$(cat /etc/terraform-cloud/token)"
        }
        TFRC
        make terraform-init
      credentials:
      - collection: gcp-hcp-infra-terraform-cloud
        group: tfcloud-token
        mount_path: /etc/terraform-cloud
      from: bin
      resources:
        requests:
          cpu: "8"
          memory: 4Gi
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: gcp-hcp-infra
