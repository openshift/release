base_images:
  hi-go-1-27:
    name: hi-go
    namespace: ci
    tag: "1.27"
binary_build_commands: make terraform-init
build_root:
  image_stream_tag:
    name: gcp-hcp-infra-base
    namespace: ci
    tag: latest
images:
  items:
  - dockerfile_literal: FROM src
    from: src
    to: gcp-hcp-infra-src
  - context_dir: test
    dockerfile_path: Dockerfile.e2e
    inputs:
      hi-go-1-27:
        as:
        - registry.access.redhat.com/hi/go:1.27
    to: gcp-hcp-e2e-tests
  - context_dir: test
    dockerfile_path: Dockerfile.firestore
    inputs:
      hi-go-1-27:
        as:
        - registry.access.redhat.com/hi/go:1.27
    to: gcp-hcp-firestore-tests
promotion:
  to:
  - additional_images:
      gcp-hcp-e2e-tests: gcp-hcp-e2e-tests
      gcp-hcp-firestore-tests: gcp-hcp-firestore-tests
      gcp-hcp-infra-src: gcp-hcp-infra-src
    excluded_images:
    - '*'
    namespace: ci
    tag: latest
prowgen:
  disable_sparse_checkout: true
  expose: true
  private: true
releases:
  latest:
    release:
      channel: stable
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: "8"
      memory: 4Gi
tests:
- as: terraform-validate
  steps:
    test:
    - as: validate
      commands: |
        export TF_CLI_CONFIG_FILE=/etc/terraform-cloud/credentials.tfrc.json
        make terraform-validate
      credentials:
      - as: credentials.tfrc.json
        collection: gcp-hcp-infra-terraform-cloud
        field: credentials
        group: tfcloud-token
        mount_path: /etc/terraform-cloud
      from: src
      resources:
        requests:
          cpu: "8"
          memory: 4Gi
- as: terraform-test
  steps:
    test:
    - as: test
      commands: |
        export TF_CLI_CONFIG_FILE=/etc/terraform-cloud/credentials.tfrc.json
        make terraform-test
      credentials:
      - as: credentials.tfrc.json
        collection: gcp-hcp-infra-terraform-cloud
        field: credentials
        group: tfcloud-token
        mount_path: /etc/terraform-cloud
      from: src
      resources:
        requests:
          cpu: "8"
          memory: 4Gi
- always_run: false
  as: terraform-plan
  run_if_changed: ^(terraform/(config/(global|region|management-cluster|service)/|modules/|metadata/|workflows/|dashboards/)|hcp-terraform/gcp-hcp-.+/main\.tf\.json$)
  steps:
    test:
    - as: plan
      commands: |
        # Do not execute fork-controlled Makefile or planner code with
        # credentials. The base revision is trusted, and the planner itself
        # rejects PRs whose author is not an organization member or repo
        # collaborator before Terraform is invoked.
        if [ "${REPO_OWNER}/${REPO_NAME}" != "openshift-online/gcp-hcp-infra" ]; then
          echo "Skipping Prow plan: job context is not openshift-online/gcp-hcp-infra"
          exit 0
        fi
        set -o pipefail
        export TF_CLI_CONFIG_FILE=/etc/terraform-cloud/credentials.tfrc.json
        git show "${PULL_BASE_SHA}:hack/tfc-speculative-plan.py" | python3 -I -
      credentials:
      - as: oauth
        collection: test-platform-infra
        field: private-git-cloner
        group: openshift-ci-robot
        mount_path: /etc/github-private
      - as: credentials.tfrc.json
        collection: gcp-hcp-infra-terraform-cloud
        field: credentials
        group: tfcloud-token
        mount_path: /etc/terraform-cloud
      from: src
      resources:
        requests:
          cpu: "8"
          memory: 4Gi
- as: check-orphan-modules
  commands: make check-orphan-modules
  container:
    from: src
- as: check-generated-files
  commands: export UV_CACHE_DIR=/tmp/.uv-cache UV_PYTHON_INSTALL_DIR=/tmp/.uv-python
    UV_NO_PROGRESS=true && make check-generated-files
  container:
    from: src
- as: gitops-promoter-test
  commands: GOFLAGS= GOCACHE=/tmp/go-cache GOPATH=/tmp/go go -C kustomize/gitops-promoter/tests
    test ./... -v
  container:
    clone: true
    from: hi-go-1-27
- as: argocd-controller-permissions
  commands: GOFLAGS= GOCACHE=/tmp/go-cache GOPATH=/tmp/go go -C tests/argocd-controller-permissions
    test ./... -v
  container:
    clone: true
    from: hi-go-1-27
  run_if_changed: ^tests/argocd-controller-permissions/
- always_run: false
  as: gar-iam-preflight
  optional: true
  steps:
    cluster_profile: platform-gcp
    pre:
    - ref: hypershift-gcp-wif-auth
    test:
    - as: check-quay-secret-iam
      from_image:
        namespace: ocp
        name: "4.22"
        tag: upi-installer
      commands: |
        # Temporary GCP-1395 probe: no Terraform, secret reads, or IAM writes.
        set +x
        set -euo pipefail
        export CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE="${SHARED_DIR}/wif-cred.json"
        if [[ ! -r "${CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE}" ]] ||
          ! token=$(gcloud auth print-access-token 2>/dev/null) || [[ -z "${token}" ]]; then
          echo "Inconclusive: could not authenticate with the Platform CI WIF identity" >&2
          exit 2
        fi

        requested='["secretmanager.secrets.getIamPolicy","secretmanager.secrets.setIamPolicy"]'
        endpoint='https://secretmanager.googleapis.com/v1/projects/gcp-hcp-int-global/secrets/default-openshift-gar-quay-secret:testIamPermissions'
        if ! response=$(printf 'Authorization: Bearer %s\n' "${token}" |
          curl -q --fail --silent --show-error --max-time 30 --header @- \
            --header 'Content-Type: application/json' --data-binary "{\"permissions\":${requested}}" "${endpoint}"); then
          echo "Inconclusive: Secret Manager permission probe failed" >&2
          exit 2
        fi
        unset token

        if ! jq -se 'length == 1 and (.[0] | type == "object" and
          (if has("permissions") then (.permissions | type == "array" and all(.[]; type == "string")) else true end))' \
          <<<"${response}" >/dev/null 2>&1; then
          echo "Inconclusive: invalid permissions response" >&2
          exit 2
        fi
        jq -r --argjson requested "${requested}" '
          (.permissions // []) as $reported | $requested[] as $permission |
          "\($permission): \(if $reported | index($permission) then "reported" else "not reported" end)"
        ' <<<"${response}"
        if ! jq -e --argjson requested "${requested}" '($requested - (.permissions // [])) | length == 0' \
          <<<"${response}" >/dev/null; then
          echo "One or more cleanup permissions were not reported" >&2
          exit 1
        fi
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
      timeout: 2m0s
- always_run: false
  as: e2e-platform
  cron: 0 2,14 * * 1-5
  presubmit: true
  steps:
    cluster_profile: platform-gcp
    env:
      HC_CHANNEL_GROUP: candidate
      HC_VERSION_MINOR: "5.0"
    workflow: gcp-hcp-e2e
- always_run: false
  as: e2e-hostedcluster-int
  cron: 0 3,15 * * 1-5
  presubmit: true
  steps:
    cluster_profile: platform-gcp
    env:
      E2E_STATUS_CONTEXT: e2e/hostedcluster-int
      E2E_STATUS_TARGETS: '[{"branch":"environment/sector-integration-main","contexts":["Terraform
        Cloud/hp-platform-engineering/repo-id-ZPRY7TkFRLq4VMVP","ArgoCD/root-app-int-reg-us-c1-nkcw-gke","ArgoCD/root-app-int-mgt-us-c1-yjiv-gke"]}]'
      E2E_TARGET_API_ENDPOINT: https://platform-api-us-central1-nkcw.int.gcp-hcp.devshift.net
      E2E_TARGET_CUSTOMER_PROJECT_ID: int-ci-cust-us-c1
      E2E_TARGET_ENV: integration
      E2E_TARGET_OIDC_ENDPOINT: https://oidc.int-reg-us-c1-nkcw.int.gcp-hcp.devshift.net
      E2E_TARGET_REGION: us-central1
      GCPHCPCTL_AUTHZ_BOOTSTRAP: "false"
      HC_CHANNEL_GROUP: candidate
      HC_CLEANUP_ON_FAILURE: "true"
      HC_VERSION_MINOR: "5.0"
    workflow: gcp-hcp-e2e-on-demand
- always_run: false
  as: e2e-hostedcluster-stg
  cron: 0 4,16 * * 1-5
  presubmit: true
  steps:
    cluster_profile: platform-gcp
    env:
      E2E_STATUS_CONTEXT: e2e/hostedcluster-stg
      E2E_STATUS_TARGETS: '[{"branch":"environment/sector-stage-main","check_runs":["terraform-apply/environment/sector-stage-main","argocd-health/environment/sector-stage-main"]}]'
      E2E_TARGET_API_ENDPOINT: https://platform-api-us-west1-cvxu.stg.gcp-hcp.devshift.net
      E2E_TARGET_CUSTOMER_PROJECT_ID: stg-ci-cust-us-w1
      E2E_TARGET_ENV: stage
      E2E_TARGET_OIDC_ENDPOINT: https://oidc.stg-reg-us-w1-cvxu.stg.gcp-hcp.devshift.net
      E2E_TARGET_REGION: us-west1
      GCPHCPCTL_AUTHZ_BOOTSTRAP: "false"
      HC_CHANNEL_GROUP: candidate
      HC_CLEANUP_ON_FAILURE: "true"
      HC_VERSION_MINOR: "5.0"
    workflow: gcp-hcp-e2e-on-demand
- as: generate-bin
  postsubmit: true
  steps:
    test:
    - as: generate
      commands: |
        export TF_CLI_CONFIG_FILE=/etc/terraform-cloud/credentials.tfrc.json
        make terraform-init
      credentials:
      - as: credentials.tfrc.json
        collection: gcp-hcp-infra-terraform-cloud
        field: credentials
        group: tfcloud-token
        mount_path: /etc/terraform-cloud
      from: bin
      resources:
        requests:
          cpu: "8"
          memory: 4Gi
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: gcp-hcp-infra
