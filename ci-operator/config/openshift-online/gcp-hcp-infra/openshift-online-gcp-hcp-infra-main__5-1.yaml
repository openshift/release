build_root:
  image_stream_tag:
    name: gcp-hcp-infra-base
    namespace: ci
    tag: latest
images:
  items:
  # The gcp-hcp-infra checkout (src) as a named image for the gcp-hcp e2e steps
  # (promoted only from the main configuration)
  - dockerfile_literal: FROM src
    from: src
    to: gcp-hcp-infra-src
  - context_dir: test
    dockerfile_path: Dockerfile.e2e
    to: gcp-hcp-e2e-tests
prowgen:
  disable_sparse_checkout: true
  expose: true
  private: true
releases:
  latest:
    release:
      channel: stable
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: "8"
      memory: 4Gi
tests:
- always_run: false
  as: e2e-platform
  cron: 0 2,14 * * 1-5
  presubmit: true
  steps:
    cluster_profile: platform-gcp
    env:
      E2E_STATUS_CONTEXT: e2e/platform-5-1
      HC_CHANNEL_GROUP: candidate
      HC_VERSION_MINOR: "5.1"
    workflow: gcp-hcp-e2e
zz_generated_metadata:
  branch: main
  org: openshift-online
  repo: gcp-hcp-infra
  variant: 5-1
