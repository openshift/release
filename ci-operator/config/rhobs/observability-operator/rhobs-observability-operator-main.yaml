base_images:
  cli:
    name: "4.21"
    namespace: ocp
    tag: cli
  operator-sdk:
    name: "4.18"
    namespace: origin
    tag: operator-sdk
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
build_root:
  from_repository: true
images:
  items:
  - context_dir: .
    dockerfile_path: build/Dockerfile
    to: observability-operator
  - context_dir: .
    dockerfile_path: test/Dockerfile
    to: observability-operator-test-harness
operator:
  bundles:
  - as: observability-bundle
    context_dir: .
    dockerfile_path: bundle.Dockerfile
  substitutions:
  - pullspec: observability-operator:.*
    with: pipeline:observability-operator
promotion:
  to:
  - additional_images:
      observability-bundle: observability-bundle
    excluded_images:
    - observability-operator
    namespace: ci
    tag: latest
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.21"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: observability-operator-e2e
  cluster_claim:
    architecture: amd64
    cloud: aws
    labels:
      region: us-east-2
    owner: obs
    product: ocp
    timeout: 3h0m0s
    version: "4.21"
  steps:
    env:
      PQC_CHECK: "true"
      SCAN_NAMESPACE: coo
      SCANNER_CPU_LIMIT: "4"
      SCANNER_CPU_REQUEST: 500m
      SCANNER_MEM_LIMIT: 4Gi
      SCANNER_MEM_REQUEST: 1Gi
    test:
    - as: install
      cli: latest
      commands: |
        oc create namespace coo
        oc label namespace coo openshift.io/cluster-monitoring=true
        operator-sdk run bundle -n coo --timeout=20m --install-mode=AllNamespaces --verbose "$OO_BUNDLE"
        if [ -e "${SHARED_DIR}/coo-csv.yml" ]; then
          rm -f "${SHARED_DIR}/coo-csv.yml"
        fi
        tries=30
        while [[ $tries -gt 0 ]] && ! oc -n coo rollout status deploy/obo-prometheus-operator; do
          sleep 10
          ((tries--))
        done
        oc wait -n coo --for=condition=Available deploy/obo-prometheus-operator --timeout=300s
        oc wait -n coo --for=condition=Available deploy/obo-prometheus-operator-admission-webhook --timeout=300s
        oc wait -n coo --for=condition=Available deploy/observability-operator --timeout=300s
        CSV_NAME=$(oc -n coo get csv | grep 'observability-operator' | awk '{print $1}')
        oc -n coo get csv "$CSV_NAME" -oyaml > "${SHARED_DIR}/coo-csv.yml"
      dependencies:
      - env: OO_BUNDLE
        name: observability-bundle
      from: operator-sdk
      resources:
        requests:
          cpu: 100m
          memory: 400Mi
    - ref: rhobs-enable-ocp
    - ref: rhobs-obo-test-harness
    - as: create-obo-resources
      cli: latest
      commands: |
        # Create observability resources to run the TLS scanner against all COO
        # workloads.
        set -euo pipefail

        printf 'Applying MonitoringStack monitoring-stack in namespace coo...\n'
        oc -n coo apply -f - <<'EOF'
        apiVersion: monitoring.rhobs/v1alpha1
        kind: MonitoringStack
        metadata:
          name: monitoring-stack
          labels:
            app.kubernetes.io/instance: monitoring-stack
        spec:
          resourceSelector: {}
          prometheusConfig:
            replicas: 1
          alertmanagerConfig:
            replicas: 1
        EOF

        printf 'Applying ThanosQuerier monitoring-stack in namespace coo...\n'
        oc -n coo apply -f - <<'EOF'
        apiVersion: monitoring.rhobs/v1alpha1
        kind: ThanosQuerier
        metadata:
          name: monitoring-stack
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/instance: monitoring-stack
        EOF

        printf '%s\n' 'Applying cluster-scoped UIPlugin logging...'
        oc apply -f - <<'EOF'
        apiVersion: observability.openshift.io/v1alpha1
        kind: UIPlugin
        metadata:
          name: logging
        spec:
          type: Logging
        EOF

        printf '%s\n' 'Applying cluster-scoped UIPlugin distributed-tracing...'
        oc apply -f - <<'EOF'
        apiVersion: observability.openshift.io/v1alpha1
        kind: UIPlugin
        metadata:
          name: distributed-tracing
        spec:
          type: DistributedTracing
        EOF

        printf '%s\n' 'Applying cluster-scoped UIPlugin troubleshooting-panel...'
        oc apply -f - <<'EOF'
        apiVersion: observability.openshift.io/v1alpha1
        kind: UIPlugin
        metadata:
          name: troubleshooting-panel
        spec:
          type: TroubleshootingPanel
        EOF

        printf '%s\n' 'Applying cluster-scoped UIPlugin monitoring...'
        oc apply -f - <<'EOF'
        apiVersion: observability.openshift.io/v1alpha1
        kind: UIPlugin
        metadata:
          name: monitoring
        spec:
          type: Monitoring
          monitoring:
            perses:
              enabled: true
            clusterHealthAnalyzer:
              enabled: true
        EOF

        printf 'Waiting for MonitoringStack monitoring-stack in namespace coo to become available...\n'
        oc -n coo wait --for=condition=Available --timeout=10m monitoringstack/monitoring-stack
        printf 'Waiting for ThanosQuerier Deployment thanos-querier-monitoring-stack in namespace coo to become available...\n'
        oc -n coo wait --for=condition=Available --timeout=10m deployment/thanos-querier-monitoring-stack
        printf '%s\n' 'Waiting for logging, distributed-tracing, troubleshooting-panel, and monitoring UIPlugins to become available...'
        oc wait --for=condition=Available --timeout=10m \
          uiplugin/logging \
          uiplugin/distributed-tracing \
          uiplugin/troubleshooting-panel \
          uiplugin/monitoring
    - ref: tls-scanner-run
    workflow: generic-claim
zz_generated_metadata:
  branch: main
  org: rhobs
  repo: observability-operator
