base_images:
  cli:
    name: "4.21"
    namespace: ocp
    tag: cli
  operator-sdk:
    name: "4.18"
    namespace: origin
    tag: operator-sdk
build_root:
  from_repository: true
images:
  items:
  - context_dir: .
    dockerfile_path: build/Dockerfile
    to: observability-operator
  - context_dir: .
    dockerfile_path: test/Dockerfile
    to: observability-operator-test-harness
operator:
  bundles:
  - as: observability-bundle
    context_dir: .
    dockerfile_path: bundle.Dockerfile
  substitutions:
  - pullspec: observability-operator:.*
    with: pipeline:observability-operator
promotion:
  to:
  - additional_images:
      observability-bundle: observability-bundle
    excluded_images:
    - observability-operator
    namespace: ci
    tag: latest
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.21"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: coo-e2e-4-16
  cluster_claim:
    architecture: amd64
    cloud: aws
    labels:
      region: us-east-2
    owner: obs
    product: ocp
    timeout: 3h0m0s
    version: "4.16"
  optional: true
  steps:
    test:
    - ref: rhobs-install-bundle
    - ref: rhobs-enable-ocp
    - ref: rhobs-obo-test-harness
