build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    to: rhobs-synthetics-agent
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: build
  commands: make build
  container:
    from: src
- as: test
  commands: make test
  container:
    from: src
- as: lint
  commands: make lint-ci
  container:
    from: src
- as: coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  secret:
    collection: sd-sre-secrets
    group: rhobs-synthetics-agent-codecov-token
    mount_path: /tmp/secret
- as: e2e
  commands: make test-e2e
  container:
    from: src
- as: e2e-cluster
  capabilities:
  - intranet
  restrict_network_access: false
  steps:
    env:
      COMPONENT: agent
    workflow: rosa-synthetics-e2e
- as: publish-coverage
  commands: |
    export CODECOV_TOKEN=$(cat /tmp/secret/CODECOV_TOKEN)
    make coverage
  container:
    from: src
  postsubmit: true
  secret:
    collection: sd-sre-secrets
    group: rhobs-synthetics-agent-codecov-token
    mount_path: /tmp/secret
zz_generated_metadata:
  branch: main
  org: rhobs
  repo: rhobs-synthetics-agent
