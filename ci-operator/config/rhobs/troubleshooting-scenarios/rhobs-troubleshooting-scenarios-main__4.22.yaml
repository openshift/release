build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.ci.openshift.org/ocp/ubi-python-312:9
      USER 0
      RUN dnf install -y git jq && dnf clean all
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: ols-agentic-eval-periodics
  cluster_claim:
    architecture: amd64
    cloud: aws
    labels:
      region: us-east-1
    owner: obs
    product: ocp
    timeout: 6h0m0s
    version: "4.22"
  cron: 30 14 * * 1
  steps:
    allow_skip_on_success: true
    post:
    - ref: gather-must-gather
    test:
    - as: e2e
      cli: latest
      commands: |
        EVAL_OPENAI_API_KEY=$(cat /var/run/openai/token)
        export EVAL_OPENAI_API_KEY
        export EVAL_VERTEX_CREDENTIALS=/var/run/vertex/token
        export EVAL_VERTEX_PROJECT_ID=rhobs-troubleshooting-evals
        scripts/ci-ols-agentic-evals.sh
      credentials:
      - collection: obsinta
        group: obsinta-openai-apitoken
        mount_path: /var/run/openai
      - collection: obsinta
        group: obsinta-vertex-apitoken
        mount_path: /var/run/vertex
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
- as: ols-classic-eval-periodics
  cluster_claim:
    architecture: amd64
    cloud: aws
    labels:
      region: us-east-1
    owner: obs
    product: ocp
    timeout: 4h0m0s
    version: "4.22"
  cron: 10 2 * * 2
  steps:
    allow_skip_on_success: true
    post:
    - ref: gather-must-gather
    test:
    - as: e2e
      cli: latest
      commands: |
        EVAL_OPENAI_API_KEY=$(cat /var/run/openai/token)
        export EVAL_OPENAI_API_KEY
        export EVAL_VERTEX_CREDENTIALS=/var/run/vertex/token
        export EVAL_VERTEX_PROJECT_ID=rhobs-troubleshooting-evals
        scripts/ci-ols-classic-evals.sh
      credentials:
      - collection: obsinta
        group: obsinta-openai-apitoken
        mount_path: /var/run/openai
      - collection: obsinta
        group: obsinta-vertex-apitoken
        mount_path: /var/run/vertex
      from: src
      resources:
        requests:
          cpu: 100m
    workflow: generic-claim
zz_generated_metadata:
  branch: main
  org: rhobs
  repo: troubleshooting-scenarios
  variant: "4.22"
