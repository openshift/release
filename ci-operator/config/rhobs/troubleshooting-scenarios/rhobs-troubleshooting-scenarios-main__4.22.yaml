    labels:
      region: us-east-1
    owner: obs
    product: ocp
    timeout: 4h0m0s
    version: "4.22"
  cron: 10 4 * * 2
  steps:
    allow_skip_on_success: true
    post:
    - ref: gather-must-gather
    test:
    - as: e2e
      cli: latest
      commands: |
        export OPENAI_API_KEY=$(cat /var/run/openai/token)
        export OLS_DEFAULT_PROVIDER=anthropic
        export GCP_SERVICE_ACCOUNT_JSON=/var/run/vertex/token

        scripts/ci-ols-user-evals.sh --artifact-dir "${ARTIFACT_DIR}"
      credentials:
      - mount_path: /var/run/openai
        name: openai-apitoken
        namespace: test-credentials
      - mount_path: /var/run/vertex
        name: vertex-apitoken
        namespace: test-credentials
      from: src
      resources:
