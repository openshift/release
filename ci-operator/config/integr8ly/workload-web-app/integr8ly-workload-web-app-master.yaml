build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-8-release-golang-1.25-openshift-4.23
images:
  items:
  - dockerfile_path: Dockerfile
    to: workload-web-app
  - dockerfile_path: Dockerfile.tools
    to: workload-web-app-tools
promotion:
  to:
  - name: workload-web-app
    namespace: integr8ly
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: master
  org: integr8ly
  repo: workload-web-app
