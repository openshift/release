build_root:
  project_image:
    dockerfile_path: .ci/openshift-ci/Dockerfile
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: chectl
  steps:
    cluster_profile: che-aws
    env:
      BASE_DOMAIN: crw-qe.com
      HYPERSHIFT_AWS_REGION: us-east-1
      HYPERSHIFT_NODE_COUNT: "1"
    test:
    - as: chectl
      cli: latest
      commands: .ci/oc-test-chectl.sh
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: hypershift-hostedcluster-workflow
- as: chectl-devworkspace-happy-path
  steps:
    cluster_profile: che-aws
    env:
      BASE_DOMAIN: crw-qe.com
      HYPERSHIFT_AWS_REGION: us-east-1
      HYPERSHIFT_NODE_COUNT: "2"
    test:
    - as: chectl-devworkspace-happy-path
      cli: latest
      commands: .ci/oc-test-happy-path.sh
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: hypershift-hostedcluster-workflow
zz_generated_metadata:
  branch: 7.130.x
  org: che-incubator
  repo: chectl
  variant: v22
