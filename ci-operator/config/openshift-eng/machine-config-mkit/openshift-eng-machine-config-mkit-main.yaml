base_images:
  golangci-lint:
    name: golangci-lint
    namespace: ci
    tag: v2.10.1
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-5.0
images:
  items:
  - dockerfile_path: Dockerfile
    to: machine-config-mkit
promotion:
  to:
  - namespace: ci
    tag: latest
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: unit
  commands: make test
  container:
    from: src
- as: lint
  commands: HOME=/tmp make lint
  container:
    clone: true
    from: golangci-lint
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: machine-config-mkit
