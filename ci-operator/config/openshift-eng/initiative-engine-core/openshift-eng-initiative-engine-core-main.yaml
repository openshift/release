base_images:
  golangci-lint:
    name: golangci-lint
    namespace: ci
    tag: v2.10.1
build_root:
  from_repository: true
images:
  items:
  - dockerfile_path: Dockerfile
    to: initiative-engine-core
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: gofmt
  commands: go fmt ./... && git diff --exit-code
  container:
    from: src
  run_if_changed: \.go$
- as: lint
  commands: |
    export GOCACHE=/tmp/
    export GOLANGCI_LINT_CACHE=/tmp/.cache
    export GOPROXY=https://proxy.golang.org
    golangci-lint run --verbose --timeout=5m1s
  container:
    clone: true
    from: golangci-lint
- as: unit
  commands: go test ./...
  container:
    from: src
  run_if_changed: \.go$
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: initiative-engine-core
