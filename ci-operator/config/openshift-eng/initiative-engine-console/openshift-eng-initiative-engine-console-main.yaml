build_root:
  project_image:
    dockerfile_path: .ci-operator.Dockerfile
images:
  items:
  - dockerfile_path: Dockerfile
    to: initiative-engine-console
prowgen:
  expose: true
  private: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: test
  commands: make test
  container:
    from: src
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: initiative-engine-console
