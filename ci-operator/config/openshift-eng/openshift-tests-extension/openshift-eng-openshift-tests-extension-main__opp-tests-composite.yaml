base_images:
  ocp_5-0_cli:
    name: "5.0"
    namespace: ocp
    tag: cli
  openshift-tests:
    name: "5.0"
    namespace: ocp
    tag: tests
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.23-openshift-5.0
images:
  items:
  - dockerfile_literal: |
      # Stage 1: Build opp-tests extension binary
      FROM src AS extension-builder
      WORKDIR /go/src/github.com/openshift-eng/openshift-tests-extension/opp-tests
      RUN GO_COMPLIANCE_POLICY="exempt_all" go build -o opp-tests ./cmd/opp-tests/... && \
          gzip -c opp-tests > opp-tests-ext.gz

      # Stage 2: Create composite container
      FROM registry.access.redhat.com/ubi9/ubi-minimal:latest

      # Copy openshift-tests from base image
      COPY --from=openshift-tests /usr/bin/openshift-tests /usr/bin/openshift-tests
      RUN chmod +x /usr/bin/openshift-tests

      # Copy opp-tests extension binary (compressed)
      COPY --from=extension-builder /go/src/github.com/openshift-eng/openshift-tests-extension/opp-tests/opp-tests-ext.gz /usr/bin/opp-tests-ext.gz

      # Copy test scripts
      COPY --from=extension-builder /go/src/github.com/openshift-eng/openshift-tests-extension/opp-tests/scripts /usr/share/opp-tests/scripts

      # Set working directory
      WORKDIR /usr/share/opp-tests

      # Default entrypoint
      ENTRYPOINT ["/usr/bin/openshift-tests"]
      CMD ["--help"]
    from: ocp_5-0_cli
    inputs:
      openshift-tests:
        as:
        - openshift-tests
      src:
        as:
        - src
    to: opp-tests-composite
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: openshift-tests-extension
  variant: opp-tests-composite
