build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.ci.openshift.org/openshift/release:rhel-9-release-golang-1.23-openshift-4.19

      RUN dnf install -y python3.12 python3.12-pip && dnf clean all
images:
  items:
  - dockerfile_literal: |
      FROM src
      RUN python3.12 -m pip install uv '.[dev]'
    from: src
    to: tests-image
  - dockerfile_literal: |
      FROM src
      # A py3.12 venv with the package + dev tools resolved to the LOWEST allowed
      # direct versions (e.g. pydantic==2.7), so the declared floors are tested.
      # A venv (not --system) avoids resolving against the base image's py3.9.
      RUN python3.12 -m pip install uv \
          && uv venv --python python3.12 /opt/min \
          && uv pip install --python /opt/min/bin/python --resolution lowest-direct '.[dev]'
    from: src
    to: tests-image-min
resources:
  '*':
    requests:
      cpu: 100m
      memory: 1Gi
tests:
- as: lint
  commands: python3.12 -m ruff check .
  container:
    from: tests-image
- as: format
  commands: python3.12 -m ruff format --check .
  container:
    from: tests-image
- as: typing
  commands: |
    export HOME=/tmp
    python3.12 -m mypy
  container:
    from: tests-image
- as: unit
  commands: |
    export HOME=/tmp
    python3.12 -m pytest
  container:
    from: tests-image
- as: schema-check
  commands: |
    export HOME=/tmp
    python3.12 -m orgindex_schema > /tmp/schema.generated.json
    diff -u index.schema.json /tmp/schema.generated.json
  container:
    from: tests-image
- as: compat-check
  commands: |
    export HOME=/tmp
    python3.12 scripts/schema_compat.py
  container:
    from: tests-image
- as: minimum-versions
  commands: |
    export HOME=/tmp
    # Floors are baked into the /opt/min venv at build time; just run the suite.
    /opt/min/bin/python -m pytest
  container:
    from: tests-image-min
- as: lock-check
  commands: |
    export HOME=/tmp
    uv lock --check
  container:
    from: tests-image
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: orgindex-schema
