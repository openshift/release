base_images:
  shellcheck:
    name: shellcheck
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.25-openshift-4.22
images:
  items:
  - dockerfile_path: images/Containerfile.markdownlint
    from: root
    to: markdownlint-cli2
  - dockerfile_path: images/Containerfile.ci
    to: edge-tooling-ai-helpers
  - dockerfile_literal: |-
      FROM root
      USER 0
      ENV EDGE_TOOLING_DIR=/opt/edge-tooling
      WORKDIR /opt/edge-tooling
      RUN dnf install -y python3.11 python3.11-pip jq /usr/bin/curl tar gzip && dnf clean all
      COPY images/install_tools.sh /tmp/install_tools.sh
      RUN bash -c 'source /tmp/install_tools.sh && install_google_cloud_cli' && rm -f /tmp/install_tools.sh
      COPY edge-ocp-ci-monitor/ edge-ocp-ci-monitor/
      COPY payload-monitor/ payload-monitor/
      RUN python3.11 -m venv /opt/edge-ci-venv && \
          /opt/edge-ci-venv/bin/python -m pip install --no-cache-dir -r edge-ocp-ci-monitor/requirements.txt
      ENV PATH="/opt/edge-ci-venv/bin:${PATH}"
      USER 1001
    from: root
    to: edge-ocp-ci-monitor
promotion:
  to:
  - additional_images:
      edge-tooling-ai-helpers: edge-tooling-ai-helpers
      markdownlint-cli2: markdownlint-cli2
    excluded_images:
    - '*'
    namespace: ci
    tag: latest
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: markdownlint
  commands: make lint-markdown
  container:
    clone: true
    from: markdownlint-cli2
  run_if_changed: (\.md|^Makefile|^hack/.*markdown.*|^\.markdown.*)$
- as: shellcheck
  commands: make lint-shellcheck
  container:
    clone: true
    from: shellcheck
  run_if_changed: .sh$
- always_run: false
  as: skills-lint
  commands: make lint-all-skills
  container:
    clone: true
    from: root
  run_if_changed: (SKILL\.md|^scripts/lint-skills\.py|^Makefile|^plugins/.*/skills/)
- always_run: false
  as: eval-all
  optional: true
  steps:
    env:
      EVAL_DISCOVER: "true"
      EVAL_MODEL: claude-opus-4-6
      EVAL_PARALLELISM: "3"
    workflow: openshift-edge-tooling-agent-eval
- as: eval-changed
  optional: true
  run_if_changed: ^plugins/.*/evals/|^plugins/.*/skills/
  steps:
    env:
      EVAL_CHANGED_ONLY: "true"
      EVAL_DISCOVER: "true"
      EVAL_MODEL: claude-opus-4-6
      EVAL_PARALLELISM: "3"
    workflow: openshift-edge-tooling-agent-eval
- as: ocp-ci-monitor
  capabilities:
  - intranet
  cron: 0 7 * * 1-5
  reporter_config:
    channel: '#team-ocp-edge-notifications'
    job_states_to_report:
    - failure
    - error
    report_template: |
      :warning: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
  steps:
    workflow: openshift-edge-tooling-ci-monitor
- as: microshift-ci-doctor
  cron: 0 7 * * 1-5
  reporter_config:
    channel: '#team-ocp-edge-notifications'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: |-
      :robot_face: *MicroShift CI Doctor* ended with *{{.Status.State}}*.{{"\n"}}
      {{- $ab := printf "https://gcs.ci.openshift.org/gcs/test-platform-results-public/logs/%s/%s/artifacts/microshift-ci-doctor/openshift-edge-tooling-microshift-ci-doctor/artifacts/" .Spec.Job .Status.BuildID -}}
      {{- $rp := printf "%s%s" $ab "report-microshift-ci-doctor.html" -}}
      {{- $st := printf "%s%s" $ab "report-bug-search.txt" -}}
      | <{{$rp}}|Report> | <{{$st}}|Bugs> | <{{.Status.URL}}|Logs> |
  steps:
    workflow: openshift-edge-tooling-microshift-ci-doctor
- as: lvms-ci-doctor
  cron: 30 6 * * 1,2,4
  reporter_config:
    channel: '#lvms-release-coordination'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: |-
      :robot_face: *LVMS CI Doctor* ended with *{{.Status.State}}*.{{"\n"}}
      {{- $ab := printf "https://gcs.ci.openshift.org/gcs/test-platform-results-public/logs/%s/%s/artifacts/lvms-ci-doctor/openshift-edge-tooling-lvms-ci-doctor/artifacts/" .Spec.Job .Status.BuildID -}}
      {{- $rp := printf "%s%s" $ab "report-lvm-operator-ci-doctor.html" -}}
      | <{{$rp}}|Report> | <{{.Status.URL}}|Logs> |
  steps:
    workflow: openshift-edge-tooling-lvms-ci-doctor
- as: pr-notifier
  cron: 0 7 * * 0-5
  reporter_config:
    channel: '#team-ocp-edge-notifications'
    job_states_to_report:
    - failure
    - error
    report_template: |
      :warning: Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
  restrict_network_access: false
  steps:
    env:
      FORBIDDEN_LABELS: jira/invalid-bug
      GITHUB_REPOS: openshift/origin,openshift-eng/two-node-toolbox,openshift/microshift,openshift-eng/edge-tooling,openshift/enhancements,openshift/lvm-operator
      REQUIRED_LABELS: lgtm,approved,verified
    workflow: openshift-edge-tooling-gh-notifier
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: edge-tooling
