build_root:
  image_stream_tag:
    name: ci-tools-build-root
    namespace: ci
    tag: latest
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: control-plane-120nodes
  cron: 0 6 * * 2,6
  reporter_config:
    channel: '#ocp-qe-scale-ci-results'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :white_check_mark:
      {{else}} :warning:  Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :warning: {{end}}'
  steps:
    allow_skip_on_success: true
    cluster_profile: ibmcloud-perfscale
    env:
      ADDITIONAL_WORKER_NODES: "117"
      BASE_DOMAIN: ibmcloud-perfscale.devcluster.openshift.com
      CD_V2_EXTRA_FLAGS: --churn-duration=20m --service-latency
      COMPUTE_NODE_TYPE: bx3d-24x120
      CONTROL_PLANE_INSTANCE_TYPE: bx3d-24x120
      DISK_NAME: vdb
      ENABLE_LAYER_3: "false"
      KB_FLAGS: --set=metricsEndpoints.0.step=2m --set=metricsEndpoints.1.step=2m
        --local-indexing
      NODE_DENSITY_GC: "false"
      OPENSHIFT_INFRA_NODE_INSTANCE_TYPE: bx3d-24x120
      SET_ENV_BY_PLATFORM: custom
      UDN_ITERATION_MULTIPLIER: "1"
      WORKER_POD_DISK_NAME: vdb
      ZONES_COUNT: "3"
    test:
    - ref: openshift-qe-workers-scale
    - chain: openshift-qe-control-plane
    workflow: openshift-qe-installer-ibmcloud-ipi-ovn
- as: cudn-churn-250-24nodes
  cron: 0 10 * * 2,4
  reporter_config:
    channel: '#ocp-qe-scale-ci-results'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :white_check_mark:
      {{else}} :warning:  Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :warning: {{end}}'
  steps:
    cluster_profile: ibmcloud-perfscale
    env:
      ADDITIONAL_WORKER_NODES: "21"
      BASE_DOMAIN: ibmcloud-perfscale.devcluster.openshift.com
      COMPUTE_NODE_TYPE: bx3d-24x120
      CONTROL_PLANE_INSTANCE_TYPE: bx3d-24x120
      DISK_NAME: vdb
      EXTRA_FLAGS: --churn-mode=namespaces --churn-percent=10 --churn-cycles=3 --churn-duration=10m
      NAMESPACES_PER_CUDN: "1"
      OPENSHIFT_INFRA_NODE_INSTANCE_TYPE: bx3d-24x120
      ORION_CONFIG: examples/small-scale-cudn-churn-250.yaml
      OVERRIDE_ITERATIONS: "250"
      RUN_ORION: "true"
      SET_ENV_BY_PLATFORM: custom
      WORKER_POD_DISK_NAME: vdb
    test:
    - ref: openshift-qe-workers-scale
    - chain: openshift-qe-cudn-density
    workflow: openshift-qe-installer-ibmcloud-ipi-ovn
- always_run: false
  as: payload-control-plane-6nodes-small
  reporter_config:
    channel: '#ocp-qe-scale-ci-results'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :white_check_mark:
      {{else}} :warning:  Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :warning: {{end}}'
  steps:
    cluster_profile: ibmcloud-perfscale
    env:
      ADDITIONAL_WORKER_NODES: "3"
      BASE_DOMAIN: ibmcloud-perfscale.devcluster.openshift.com
      CD_V2_EXTRA_FLAGS: --churn-duration=20m --pod-ready-threshold=30s --service-latency
      CDV2_ITERATION_MULTIPLIER: "15"
      COMPUTE_NODE_TYPE: bx3d-4x20
      CONTROL_PLANE_INSTANCE_TYPE: bx3d-4x20
      DISK_NAME: vdb
      ENABLE_LAYER_3: "false"
      ENABLE_LOCAL_INDEX: "true"
      ES_TYPE: qe
      IGNORE_JOB_ITERATIONS: "true"
      KB_FLAGS: --local-indexing
      ND_CNI_EXTRA_FLAGS: --churn-mode=objects --churn-delay=1m --churn-percent=50
        --churn-cycles=2
      ND_EXTRA_FLAGS: --churn-mode=objects --churn-delay=1m --churn-percent=50 --churn-cycles=2
      OPENSHIFT_INFRA_NODE_INSTANCE_TYPE: bx3d-4x20
      OUTPUT_FORMAT: JUNIT
      RESOURCE_GROUP: ocp-cpt
      RUN_ORION: deferred
      SET_ENV_BY_PLATFORM: custom
      UDN_ITERATION_MULTIPLIER: "12"
      VERSION: "5.0"
      WORKER_POD_DISK_NAME: vdb
      ZONES_COUNT: "3"
    test:
    - ref: openshift-qe-workers-scale
    - chain: openshift-qe-control-plane
    - chain: openshift-qe-orion-consolidated
    workflow: openshift-qe-installer-ibmcloud-ipi-ovn
- as: payload-control-plane-6nodes
  cron: '@yearly'
  reporter_config:
    channel: '#ocp-qe-scale-ci-results'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :white_check_mark:
      {{else}} :warning:  Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :warning: {{end}}'
  steps:
    cluster_profile: ibmcloud-perfscale
    env:
      ADDITIONAL_WORKER_NODES: "3"
      BASE_DOMAIN: ibmcloud-perfscale.devcluster.openshift.com
      CD_V2_EXTRA_FLAGS: --churn-duration=20m --pod-ready-threshold=30s --service-latency
      CDV2_ITERATION_MULTIPLIER: "15"
      COMPUTE_NODE_TYPE: bx3d-8x40
      CONTROL_PLANE_INSTANCE_TYPE: bx3d-8x40
      DISK_NAME: vdb
      ENABLE_LAYER_3: "false"
      ENABLE_LOCAL_INDEX: "true"
      ES_TYPE: qe
      IGNORE_JOB_ITERATIONS: "true"
      KB_FLAGS: --local-indexing
      ND_CNI_EXTRA_FLAGS: --churn-mode=objects --churn-delay=1m --churn-percent=50
        --churn-cycles=2
      ND_EXTRA_FLAGS: --churn-mode=objects --churn-delay=1m --churn-percent=50 --churn-cycles=2
      OPENSHIFT_INFRA_NODE_INSTANCE_TYPE: bx3d-4x20
      OUTPUT_FORMAT: JUNIT
      RESOURCE_GROUP: ocp-cpt
      RUN_ORION: deferred
      SET_ENV_BY_PLATFORM: custom
      UDN_ITERATION_MULTIPLIER: "12"
      VERSION: "5.0"
      WORKER_POD_DISK_NAME: vdb
      ZONES_COUNT: "3"
    test:
    - ref: openshift-qe-workers-scale
    - chain: openshift-qe-control-plane
    - chain: openshift-qe-orion-consolidated
    workflow: openshift-qe-installer-ibmcloud-ipi-ovn
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: ocp-perfscale
  variant: ibm-5.0-nightly-x86
