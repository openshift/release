- as: control-plane-24nodes-cdv2-promdump
  steps:
    cluster_profile: aws-perfscale-qe
    env:
      ADDITIONAL_WORKER_NODES: "21"
      BASE_DOMAIN: qe.devcluster.openshift.com
      CUSTOM_KB_BUILD: "true"
      KB_FLAGS: --local-indexing
      ZONES_COUNT: "3"
    test:
    - ref: openshift-qe-workers-scale
    - as: crio-residual-idle
      cli: latest
      commands: |
        echo "CRI-O residual memory capture..."
        OUT="${ARTIFACT_DIR}/crio-residual"
        mkdir -p "${OUT}"

        # FIX 1: the build-cluster namespace leaks into the target kubeconfig context;
        # oc debug would try to create its pod there and fail.
        oc config set-context --current --namespace=default 2>/dev/null || true

        # One Prometheus query returning every crio go_memstats series (cross-check only —
        # freshly-scaled workers may not be scraped yet; the node-local fetch is authoritative).
        oc exec -n openshift-monitoring prometheus-k8s-0 -c prometheus -- curl -sG \
          http://localhost:9090/api/v1/query \
          --data-urlencode 'query={__name__=~"go_memstats_(heap_inuse|heap_idle|heap_released|heap_sys|stack_inuse|mspan_inuse|buck_hash_sys|gc_sys|other_sys)_bytes",job="crio"}' \
          > "${OUT}/go-memstats-prometheus.json" || true

        # Per worker node: crio smaps (per-mapping), rollup, THP/mTHP state, GODEBUG,
        # and crio's own /metrics straight from the node (authoritative go_memstats).
        NODES=$(oc get nodes -l node-role.kubernetes.io/worker= -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
        while read -r node; do
          [[ -z "${node}" ]] && continue
          echo "  capturing ${node}..."
          oc debug node/"${node}" -- chroot /host bash -c \
            'pid=$(pgrep -x crio | head -1)
             echo "===META==="
             echo "crio_pid: ${pid}"
             crio version 2>/dev/null | grep -i version || true
             grep -E "^(VmRSS|VmHWM|VmData|VmSwap):" /proc/${pid}/status
             echo "===THP==="
             cat /sys/kernel/mm/transparent_hugepage/enabled
             for d in /sys/kernel/mm/transparent_hugepage/hugepages-*kB; do
               [ -d "$d" ] && echo "$(basename $d): $(cat $d/enabled 2>/dev/null)"
             done
             echo "===GODEBUG==="
             tr "\0" "\n" < /proc/${pid}/environ | grep -i "^GODEBUG" || echo "(none set)"
             echo "===KHUGEPAGED==="
             for f in max_ptes_none max_ptes_swap max_ptes_shared pages_to_scan scan_sleep_millisecs alloc_sleep_millisecs; do
               val=$(cat /sys/kernel/mm/transparent_hugepage/khugepaged/$f 2>/dev/null) && echo "$f=$val"
             done
             echo "===VMSTAT==="
             grep -E "^thp_(fault_alloc|collapse_alloc|collapse_alloc_failed|split_page|split_pmd|zero_page_alloc)" /proc/vmstat
             echo "===MEMINFO==="
             grep -E "^(AnonHugePages|AnonPages|MemFree|MemAvailable|Cached)" /proc/meminfo
             echo "===GOMETRICS==="
             (curl -s http://localhost:9637/metrics 2>/dev/null \
               || curl -sk https://localhost:9637/metrics 2>/dev/null) \
               | grep -E "^(go_memstats_(heap_inuse|heap_idle|heap_released|heap_sys|stack_inuse|mspan_inuse|buck_hash_sys|gc_sys|other_sys)_bytes|go_info)" || true
             echo "===ROLLUP==="
             grep -E "^(Rss|Pss|Private_Clean|Private_Dirty|Anonymous|AnonHugePages|Swap):" /proc/${pid}/smaps_rollup
             echo "===SMAPS==="
             cat /proc/${pid}/smaps' \
            > "${OUT}/raw-${node}.txt" || true

          # Per-node summary: file-backed vs anonymous RSS and THP totals, top mappings.
          MAPFILE="/tmp/mappings-${node}.txt"
          awk '
            function flushrec() {
              if (name != "") { printf "%s\t%d\t%d\t%d\t%d\n", name, size, rss, pd, ahp }
            }
            /^[0-9a-f]+-[0-9a-f]+/ {
              flushrec()
              name = ($6 == "" ? "[anon:" $1 "]" : $6)
              size = 0; rss = 0; pd = 0; ahp = 0
              next
            }
            /^Size:/           { size = $2 }
            /^Rss:/            { rss  = $2 }
            /^Private_Dirty:/  { pd   = $2 }
            /^AnonHugePages:/  { ahp  = $2 }
            END { flushrec() }
          ' <(sed -n '/===SMAPS===/,$p' "${OUT}/raw-${node}.txt" | tail -n +2) > "${MAPFILE}"

          {
            echo "=== ${node} ==="
            grep -E '^(VmRSS|crio_pid|crio:|Version)' "${OUT}/raw-${node}.txt" | head -3
            grep -A3 '^===THP===' "${OUT}/raw-${node}.txt" | head -6
            grep -A10 '^===KHUGEPAGED===' "${OUT}/raw-${node}.txt" | grep -v '^===' | head -6
            grep -A10 '^===VMSTAT===' "${OUT}/raw-${node}.txt" | grep -v '^===' | head -8
            awk -F'\t' '
              { if ($1 ~ /^\[anon/) { an += $3; ant += $5; n++ } else { fb += $3 } th += $5 }
              END { printf "file_backed_rss=%.1f MB\nanon_rss=%.1f MB (%d mappings)\nAnonHugePages=%.1f MB (in anon: %.1f MB)\n", fb/1024, an/1024, n, th/1024, ant/1024 }
            ' "${MAPFILE}"
            echo "-- go_memstats (node-local):"
            sed -n '/===GOMETRICS===/,/===ROLLUP===/p' "${OUT}/raw-${node}.txt" | grep -E '^go_memstats' | head -10
            echo "-- top-5 file-backed:"
            grep -v '^\[anon' "${MAPFILE}" | sort -t"$(printf '\t')" -k3,3rn | head -5 | \
              awk -F'\t' '{printf "  %8.1f MB rss  %s\n", $3/1024, $1}'
            echo "-- top-5 anonymous:"
            grep '^\[anon' "${MAPFILE}" | sort -t"$(printf '\t')" -k3,3rn | head -5 | \
              awk -F'\t' '{printf "  %8.1f MB rss  %8.1f MB thp  %s\n", $3/1024, $5/1024, $1}'
          } >> "${OUT}/summary.txt"

          rm -f "${MAPFILE}"
        done <<NODES
        ${NODES}
        NODES

        echo "=== SUMMARY ==="
        cat "${OUT}/summary.txt"
        echo "CRI-O residual capture complete: ${OUT}"
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - chain: openshift-qe-cluster-density-v2
    - as: crio-residual-post
