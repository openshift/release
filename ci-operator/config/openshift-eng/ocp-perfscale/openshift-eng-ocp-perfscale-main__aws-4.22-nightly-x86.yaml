    - as: capture-prometheus-dump
      cli: latest
      commands: |
        echo "Capturing Prometheus dump..."
        PROMDIR="${ARTIFACT_DIR}/metrics"
        mkdir -p "${PROMDIR}"
        prometheus="$(oc get pods -n openshift-monitoring -l app.kubernetes.io/name=prometheus --ignore-not-found -o name)" || true
        if [[ -n "${prometheus}" ]]; then
          echo "${prometheus}" | while read prompod; do
            prompod=${prompod#"pod/"}
            FILE_NAME="${prompod}"
            if [[ "$prompod" == *-0 ]]; then
              FILE_NAME="prometheus"
            fi
            echo "Snapshotting prometheus from ${prompod} as ${FILE_NAME} (may take 15s)..."
            oc exec -n openshift-monitoring "${prompod}" -- tar cvzf - -C /prometheus . > "${PROMDIR}/${FILE_NAME}.tar.gz" || true
            echo "Collecting prometheus metadata from ${prompod}..."
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/targets/metadata --data-urlencode 'match_target={instance!=\"\"}'" | gzip > "${PROMDIR}/${FILE_NAME}-target-metadata.json.gz" || true
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/status/config" | gzip > "${PROMDIR}/${FILE_NAME}-config.json.gz" || true
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/status/tsdb" > "${PROMDIR}/${FILE_NAME}-tsdb-status.json" || true
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/status/runtimeinfo" > "${PROMDIR}/${FILE_NAME}-runtimeinfo.json" || true
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/targets" > "${PROMDIR}/${FILE_NAME}-targets.json" || true
          done
          cat >> "${SHARED_DIR}/custom-links.txt" <<'PROM_LINK'
        <script>
        let prom = document.createElement('a');
        prom.href="https://promecieus.dptools.openshift.org/?search="+document.referrer;
        prom.title="Creates a new prometheus deployment with data from this job run.";
        prom.innerHTML="PromeCIeus";
        prom.target="_blank";
        document.getElementById("wrapper").append(prom);
