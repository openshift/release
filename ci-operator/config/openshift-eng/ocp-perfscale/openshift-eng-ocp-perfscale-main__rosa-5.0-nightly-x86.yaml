          MAPFILE="/tmp/mappings-${node}.txt"
          awk '
            function flushrec() {
              if (name != "") { printf "%s\t%d\t%d\t%d\t%d\n", name, size, rss, pd, ahp }
            }
            /^[0-9a-f]+-[0-9a-f]+/ {
