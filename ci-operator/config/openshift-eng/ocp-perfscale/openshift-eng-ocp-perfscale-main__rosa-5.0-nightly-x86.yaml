base_images:
  ocm-cli:
    name: ocm-cli
    namespace: ci
    tag: latest
  rosa-aws-cli:
    name: rosa-aws-cli
    namespace: ci
    tag: latest
build_root:
  image_stream_tag:
    name: ci-tools-build-root
    namespace: ci
    tag: latest
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: build-farm-114nodes
  cron: 0 8 8,22 * *
  reporter_config:
    channel: '#ocp-qe-scale-ci-results'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :white_check_mark:
      {{else}} :warning:  Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :warning: {{end}}'
  steps:
    cluster_profile: aws-perfscale
    env:
      BUILD_FARM_EXTRA_FLAGS: --alerting=false --job-iterations=80 --set=jobs.2.jobPause=10m
      CHANNEL_GROUP: nightly
      CLUSTER_TAGS: TicketId:731
      COMPUTE_MACHINE_TYPE: m6i.xlarge
      ENABLE_AUTOSCALING: "true"
      INDEX_ENABLED: "true"
      KUBE_BURNER_VERSION: 1.11.18
      MIN_REPLICAS: "18"
      MULTI_AZ: "true"
      OPENSHIFT_VERSION: "5.0"
      ORION_CONFIG: examples/build-farm.yaml
      REPLICAS: "114"
      RUN_ORION: "true"
    test:
    - chain: openshift-qe-build-farm
    - ref: openshift-qe-orion
    workflow: rosa-aws-sts
  timeout: 8h0m0s
- always_run: false
  as: data-path-9nodes-haproxy28
  steps:
    cluster_profile: aws-perfscale
    env:
      ADDITIONAL_WORKER_NODES: "6"
      CHANNEL_GROUP: nightly
      COMPUTE_MACHINE_TYPE: m6i.xlarge
      CONFIG: config/standard-classic-rosa.yml
      ENABLE_AUTOSCALING: "false"
      HAPROXY_VERSION: "2.8"
      INDEX_ENABLED: "true"
      MULTI_AZ: "true"
      OPENSHIFT_VERSION: "5.0"
    test:
    - as: rosa-configure-haproxy-version
      cli: latest
      commands: |
        echo "Step 1: Set spec.haproxyVersion on IngressController..."
        oc patch ingresscontroller/default -n openshift-ingress-operator \
          --type=merge -p "{\"spec\":{\"haproxyVersion\":\"${HAPROXY_VERSION}\"}}"

        echo "Step 2: Get haproxy28 image from ingress-operator deployment..."
        HAPROXY_IMAGE=$(oc get deployment/ingress-operator -n openshift-ingress-operator \
          -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="HAPROXY_28_IMAGE")].value}')
        if [[ -z "${HAPROXY_IMAGE}" ]]; then
          echo "ERROR: HAPROXY_28_IMAGE not found in ingress-operator deployment"
          oc get deployment/ingress-operator -n openshift-ingress-operator \
            -o jsonpath='{.spec.template.spec.containers[0].env[*].name}' || true
          exit 1
        fi
        echo "HAProxy 2.8 image: ${HAPROXY_IMAGE}"

        echo "Step 3: Scale down ingress-operator to prevent reconciliation..."
        oc scale deployment/ingress-operator -n openshift-ingress-operator --replicas=0
        oc rollout status deployment/ingress-operator -n openshift-ingress-operator --timeout=60s || true
        echo "Ingress operator scaled down"

        echo "Step 4: Directly swap the haproxy sidecar container image..."
        oc set image deployment/router-default -n openshift-ingress \
          haproxy="${HAPROXY_IMAGE}"

        echo "Step 5: Wait for router deployment rollout..."
        oc rollout status deployment/router-default -n openshift-ingress --timeout=600s

        echo "Step 6: Verify actual HAProxy binary version in pod..."
        MAX_RETRIES=12
        RETRY_INTERVAL=10
        for i in $(seq 1 $MAX_RETRIES); do
          ACTUAL_VERSION=$(oc exec deploy/router-default -n openshift-ingress -c haproxy -- rpm -qa 2>/dev/null | grep haproxy || true)
          if [[ "${ACTUAL_VERSION}" == *"haproxy28"* ]]; then
            echo "HAProxy 2.8 binary confirmed: ${ACTUAL_VERSION}"
            break
          fi
          echo "Attempt ${i}/${MAX_RETRIES}: got '${ACTUAL_VERSION}', waiting ${RETRY_INTERVAL}s..."
          sleep ${RETRY_INTERVAL}
        done

        if [[ "${ACTUAL_VERSION}" != *"haproxy28"* ]]; then
          echo "ERROR: HAProxy 2.8 binary not detected after ${MAX_RETRIES} retries"
          echo "Last version seen: ${ACTUAL_VERSION}"
          exit 1
        fi
        echo "HAProxy version configuration complete."
      env:
      - name: HAPROXY_VERSION
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: openshift-qe-workers-scale
    - ref: openshift-qe-perfscale-aws-data-path-sg
    - chain: openshift-qe-ingress-perf
    - as: capture-prometheus-dump
      cli: latest
      commands: |
        echo "Capturing Prometheus dump..."
        PROMDIR="${ARTIFACT_DIR}/metrics"
        mkdir -p "${PROMDIR}"
        prometheus="$(oc get pods -n openshift-monitoring -l app.kubernetes.io/name=prometheus --ignore-not-found -o name)" || true
        if [[ -n "${prometheus}" ]]; then
          echo "${prometheus}" | while read prompod; do
            prompod=${prompod#"pod/"}
            FILE_NAME="${prompod}"
            if [[ "$prompod" == *-0 ]]; then
              FILE_NAME="prometheus"
            fi
            echo "Snapshotting prometheus from ${prompod} as ${FILE_NAME} (may take 15s)..."
            oc exec -n openshift-monitoring "${prompod}" -- tar cvzf - -C /prometheus . > "${PROMDIR}/${FILE_NAME}.tar.gz" || true
            echo "Collecting prometheus metadata from ${prompod}..."
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/targets/metadata --data-urlencode 'match_target={instance!=\"\"}'" | gzip > "${PROMDIR}/${FILE_NAME}-target-metadata.json.gz" || true
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/status/config" | gzip > "${PROMDIR}/${FILE_NAME}-config.json.gz" || true
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/status/tsdb" > "${PROMDIR}/${FILE_NAME}-tsdb-status.json" || true
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/status/runtimeinfo" > "${PROMDIR}/${FILE_NAME}-runtimeinfo.json" || true
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/targets" > "${PROMDIR}/${FILE_NAME}-targets.json" || true
          done
          cat >> "${SHARED_DIR}/custom-links.txt" <<'PROM_LINK'
        <script>
        let prom = document.createElement('a');
        prom.href="https://promecieus.dptools.openshift.org/?search="+document.referrer;
        prom.title="Creates a new prometheus deployment with data from this job run.";
        prom.innerHTML="PromeCIeus";
        prom.target="_blank";
        document.getElementById("wrapper").append(prom);
        </script>
        PROM_LINK
        else
          echo "Unable to find a Prometheus pod to snapshot."
        fi
        echo "Adding Sippy intervals link..."
        if [[ "${JOB_TYPE:-}" == "presubmit" ]]; then
          extra_args="${JOB_NAME}/${REPO_OWNER}_${REPO_NAME}/${PULL_NUMBER}"
        else
          extra_args="${JOB_NAME:-}"
        fi
        cat >> "${SHARED_DIR}/custom-links.txt" << INTERVALS_LINK
        <a target="_blank" href="https://sippy.dptools.openshift.org/sippy-ng/job_runs/${BUILD_ID}/${extra_args}/intervals" title="Intervals charts give insight into what was happening on the cluster at various points in time, including when tests failed or when operators were in certain states.">Intervals</a>
        INTERVALS_LINK
        echo "Prometheus dump complete"
        ls -lh "${PROMDIR}" || true
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: rosa-aws-sts
