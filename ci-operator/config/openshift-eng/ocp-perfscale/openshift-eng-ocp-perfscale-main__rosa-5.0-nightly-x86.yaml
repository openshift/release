              END { printf "file_backed_rss=%.1f MB\nanon_rss=%.1f MB (%d mappings)\nAnonHugePages=%.1f MB (in anon: %.1f MB)\n", fb/1024, an/1024, n, th/1024, ant/1024 }
            ' "${MAPFILE}"
            echo "-- go_memstats (node-local):"
            sed -n '/===GOMETRICS===/,/===ROLLUP===/p' "${OUT}/raw-${node}.txt" | grep -E '^go_memstats' | head -10
            echo "-- top-5 file-backed:"
            grep -v '^\[anon' "${MAPFILE}" | sort -t"$(printf '\t')" -k3,3rn | head -5 | \
              awk -F'\t' '{printf "  %8.1f MB rss  %s\n", $3/1024, $1}'
            echo "-- top-5 anonymous:"
            grep '^\[anon' "${MAPFILE}" | sort -t"$(printf '\t')" -k3,3rn | head -5 | \
              awk -F'\t' '{printf "  %8.1f MB rss  %8.1f MB thp  %s\n", $3/1024, $5/1024, $1}'
          } >> "${OUT}/summary.txt"

          rm -f "${MAPFILE}"
        done <<NODES
        ${NODES}
        NODES

        echo "=== SUMMARY ==="
        cat "${OUT}/summary.txt"
        echo "kube-apiserver residual capture complete: ${OUT}"
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - chain: openshift-qe-build-farm
    - ref: openshift-qe-orion
    - as: kas-residual-post
      cli: latest
      commands: |
        echo "kube-apiserver residual memory capture..."
        OUT="${ARTIFACT_DIR}/kas-residual"
        mkdir -p "${OUT}"

        # FIX: the build-cluster namespace leaks into the target kubeconfig context;
        # oc debug would try to create its pod there and fail.
        oc config set-context --current --namespace=default 2>/dev/null || true

        # Prometheus query for apiserver go_memstats (cross-check — node-local fetch is authoritative).
        oc exec -n openshift-monitoring prometheus-k8s-0 -c prometheus -- curl -sG \
          http://localhost:9090/api/v1/query \
          --data-urlencode 'query={__name__=~"go_memstats_(heap_inuse|heap_idle|heap_released|heap_sys|stack_inuse|mspan_inuse|buck_hash_sys|gc_sys|other_sys)_bytes",job="apiserver"}' \
          > "${OUT}/go-memstats-prometheus.json" || true

        # Per master node: kube-apiserver smaps (per-mapping), rollup, THP/mTHP state,
        # thp_* vmstats, GODEBUG, and apiserver /metrics straight from the node.
        NODES=$(oc get nodes -l node-role.kubernetes.io/master= -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null)
        if [[ -z "${NODES}" ]]; then
          NODES=$(oc get nodes -l node-role.kubernetes.io/control-plane= -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
        fi
        while read -r node; do
          [[ -z "${node}" ]] && continue
          echo "  capturing ${node}..."
          oc debug node/"${node}" -- chroot /host bash -c \
            'pid=$(pgrep -x kube-apiserver | head -1)
             if [ -z "${pid}" ]; then
               pid=$(pgrep -f "kube-apiserver --" | head -1)
             fi
             echo "===META==="
             echo "kas_pid: ${pid}"
             echo "cmdline: $(tr "\0" " " < /proc/${pid}/cmdline | cut -c1-200)"
             grep -E "^(VmRSS|VmHWM|VmData|VmSwap):" /proc/${pid}/status
             echo "===THP==="
             cat /sys/kernel/mm/transparent_hugepage/enabled
             for d in /sys/kernel/mm/transparent_hugepage/hugepages-*kB; do
               [ -d "$d" ] && echo "$(basename $d): $(cat $d/enabled 2>/dev/null)"
             done
             echo "===GODEBUG==="
             tr "\0" "\n" < /proc/${pid}/environ | grep -i "^GODEBUG" || echo "(none set)"
             echo "===KHUGEPAGED==="
             for f in max_ptes_none max_ptes_swap max_ptes_shared pages_to_scan scan_sleep_millisecs alloc_sleep_millisecs; do
               val=$(cat /sys/kernel/mm/transparent_hugepage/khugepaged/$f 2>/dev/null) && echo "$f=$val"
             done
             echo "===VMSTAT==="
             grep "^thp_" /proc/vmstat
             echo "===MEMINFO==="
             grep -E "^(AnonHugePages|AnonPages|MemFree|MemAvailable|Cached)" /proc/meminfo
             echo "===GOMETRICS==="
             curl -sk --cert /var/lib/kubelet/pki/kubelet-client-current.pem \
               --key /var/lib/kubelet/pki/kubelet-client-current.pem \
               https://localhost:6443/metrics 2>/dev/null \
               | grep -E "^(go_memstats_(heap_inuse|heap_idle|heap_released|heap_sys|stack_inuse|mspan_inuse|buck_hash_sys|gc_sys|other_sys)_bytes|go_info)" || true
             echo "===ROLLUP==="
             grep -E "^(Rss|Pss|Private_Clean|Private_Dirty|Anonymous|AnonHugePages|Swap):" /proc/${pid}/smaps_rollup
             echo "===SMAPS==="
             cat /proc/${pid}/smaps' \
            > "${OUT}/raw-${node}.txt" || true

          # Per-node summary: file-backed vs anonymous RSS and THP totals, top mappings.
          MAPFILE="/tmp/mappings-${node}.txt"
          awk '
            function flushrec() {
              if (name != "") { printf "%s\t%d\t%d\t%d\t%d\n", name, size, rss, pd, ahp }
            }
            /^[0-9a-f]+-[0-9a-f]+/ {
              flushrec()
              name = ($6 == "" ? "[anon:" $1 "]" : $6)
              size = 0; rss = 0; pd = 0; ahp = 0
              next
            }
            /^Size:/           { size = $2 }
            /^Rss:/            { rss  = $2 }
            /^Private_Dirty:/  { pd   = $2 }
            /^AnonHugePages:/  { ahp  = $2 }
            END { flushrec() }
          ' <(sed -n '/===SMAPS===/,$p' "${OUT}/raw-${node}.txt" | tail -n +2) > "${MAPFILE}"

          {
            echo "=== ${node} ==="
            grep -E '^(VmRSS|kas_pid|cmdline)' "${OUT}/raw-${node}.txt" | head -3
            grep -A3 '^===THP===' "${OUT}/raw-${node}.txt" | head -6
            grep -A10 '^===KHUGEPAGED===' "${OUT}/raw-${node}.txt" | grep -v '^===' | head -6
            grep -A20 '^===VMSTAT===' "${OUT}/raw-${node}.txt" | grep -v '^===' | head -15
            awk -F'\t' '
              { if ($1 ~ /^\[anon/) { an += $3; ant += $5; n++ } else { fb += $3 } th += $5 }
              END { printf "file_backed_rss=%.1f MB\nanon_rss=%.1f MB (%d mappings)\nAnonHugePages=%.1f MB (in anon: %.1f MB)\n", fb/1024, an/1024, n, th/1024, ant/1024 }
            ' "${MAPFILE}"
            echo "-- go_memstats (node-local):"
            sed -n '/===GOMETRICS===/,/===ROLLUP===/p' "${OUT}/raw-${node}.txt" | grep -E '^go_memstats' | head -10
            echo "-- top-5 file-backed:"
            grep -v '^\[anon' "${MAPFILE}" | sort -t"$(printf '\t')" -k3,3rn | head -5 | \
              awk -F'\t' '{printf "  %8.1f MB rss  %s\n", $3/1024, $1}'
            echo "-- top-5 anonymous:"
            grep '^\[anon' "${MAPFILE}" | sort -t"$(printf '\t')" -k3,3rn | head -5 | \
              awk -F'\t' '{printf "  %8.1f MB rss  %8.1f MB thp  %s\n", $3/1024, $5/1024, $1}'
          } >> "${OUT}/summary.txt"

          rm -f "${MAPFILE}"
        done <<NODES
        ${NODES}
        NODES

        echo "=== SUMMARY ==="
        cat "${OUT}/summary.txt"
        echo "kube-apiserver residual capture complete: ${OUT}"
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - as: capture-prometheus-dump
      cli: latest
      commands: |
        echo "Capturing Prometheus dump..."
        PROMDIR="${ARTIFACT_DIR}/metrics"
        mkdir -p "${PROMDIR}"
        prometheus="$(oc get pods -n openshift-monitoring -l app.kubernetes.io/name=prometheus --ignore-not-found -o name)" || true
        if [[ -n "${prometheus}" ]]; then
          echo "${prometheus}" | while read prompod; do
            prompod=${prompod#"pod/"}
            FILE_NAME="${prompod}"
            if [[ "$prompod" == *-0 ]]; then
              FILE_NAME="prometheus"
            fi
            echo "Snapshotting prometheus from ${prompod} as ${FILE_NAME} (may take 15s)..."
            oc exec -n openshift-monitoring "${prompod}" -- tar cvzf - -C /prometheus . > "${PROMDIR}/${FILE_NAME}.tar.gz" || true
            echo "Collecting prometheus metadata from ${prompod}..."
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/targets/metadata --data-urlencode 'match_target={instance!=\"\"}'" | gzip > "${PROMDIR}/${FILE_NAME}-target-metadata.json.gz" || true
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/status/config" | gzip > "${PROMDIR}/${FILE_NAME}-config.json.gz" || true
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/status/tsdb" > "${PROMDIR}/${FILE_NAME}-tsdb-status.json" || true
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/status/runtimeinfo" > "${PROMDIR}/${FILE_NAME}-runtimeinfo.json" || true
            oc exec -n openshift-monitoring "${prompod}" -- /bin/bash -c "curl -G http://localhost:9090/api/v1/targets" > "${PROMDIR}/${FILE_NAME}-targets.json" || true
          done
          cat >> "${SHARED_DIR}/custom-links.txt" <<'PROM_LINK'
        <script>
        let prom = document.createElement('a');
        prom.href="https://promecieus.dptools.openshift.org/?search="+document.referrer;
        prom.title="Creates a new prometheus deployment with data from this job run.";
        prom.innerHTML="PromeCIeus";
        prom.target="_blank";
        document.getElementById("wrapper").append(prom);
        </script>
        PROM_LINK
        else
          echo "Unable to find a Prometheus pod to snapshot."
        fi
        echo "Adding Sippy intervals link..."
        if [[ "${JOB_TYPE:-}" == "presubmit" ]]; then
          extra_args="${JOB_NAME}/${REPO_OWNER}_${REPO_NAME}/${PULL_NUMBER}"
        else
          extra_args="${JOB_NAME:-}"
        fi
        cat >> "${SHARED_DIR}/custom-links.txt" << INTERVALS_LINK
        <a target="_blank" href="https://sippy.dptools.openshift.org/sippy-ng/job_runs/${BUILD_ID}/${extra_args}/intervals" title="Intervals charts give insight into what was happening on the cluster at various points in time, including when tests failed or when operators were in certain states.">Intervals</a>
        INTERVALS_LINK
        echo "Prometheus dump complete"
        ls -lh "${PROMDIR}" || true
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: rosa-aws-sts
  timeout: 8h0m0s
- always_run: false
  as: build-farm-114nodes-kas-residual
  cron: 0 8 10 * *
  reporter_config:
    channel: '#ocp-qe-scale-ci-results'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :white_check_mark:
      {{else}} :warning:  Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :warning: {{end}}'
  steps:
    cluster_profile: aws-perfscale
    env:
      BUILD_FARM_EXTRA_FLAGS: --alerting=false --job-iterations=80 --set=jobs.2.jobPause=10m
      CHANNEL_GROUP: nightly
      CLUSTER_TAGS: TicketId:731
      COMPUTE_MACHINE_TYPE: m6i.xlarge
      ENABLE_AUTOSCALING: "true"
      INDEX_ENABLED: "true"
      KUBE_BURNER_VERSION: 1.11.18
      MIN_REPLICAS: "18"
      MULTI_AZ: "true"
      OPENSHIFT_VERSION: "5.0"
      ORION_CONFIG: examples/build-farm.yaml
      REPLICAS: "114"
      RUN_ORION: "true"
    test:
    - as: kas-residual-idle
      cli: latest
      commands: |
        set -o errexit
        set -o pipefail

        echo "kube-apiserver residual memory capture (idle/pre-workload)"
        OUT="${ARTIFACT_DIR}/kas-residual"
        mkdir -p "${OUT}"

        # FIX (same as crio-residual): the build-cluster namespace leaks into the
        # target kubeconfig context; oc debug would create its pod there and fail.
        oc config set-context --current --namespace=default 2>/dev/null || true

        # Cluster identity for the record
        {
          oc get clusterversion -o jsonpath='{range .items[*]}{.spec.desired.version}{"\n"}{end}'
        } > "${OUT}/clusterversion.txt" || true
        oc get nodes -l node-role.kubernetes.io/master= \
          -o custom-columns=NAME:.metadata.name,KUBELET:.status.nodeInfo.kubeletVersion,KERNEL:.status.nodeInfo.kernelVersion,OS:.status.nodeInfo.osImage \
          --no-headers > "${OUT}/masters.txt" || true

        # ------------------------------------------------------------------
        # Node capture script. Two modes:
        #   MODE=snapshot  one-shot, prints to stdout. FULL=1 appends smaps.
        #   MODE=sampler   loop: cheap capture every INTERVAL s into
        #                  ${KAS_PREFIX}/tmp/kas-residual-samples/<ts>/, full
        #                  smaps every FULL_EVERY rounds. Runs for DURATION s.
        # KAS_PREFIX is the host root as seen from the execution context:
        # "" inside `chroot /host`, "/host" inside the sampler pod.
        # /proc is used directly in both contexts (hostPID).
        # ------------------------------------------------------------------
        cat > "${SHARED_DIR}/kas-capture-node.sh" << 'NODEOF'
        #!/bin/bash
        MODE="${MODE:-snapshot}"
        FULL="${FULL:-0}"
        KAS_PREFIX="${KAS_PREFIX:-}"
        INTERVAL="${INTERVAL:-60}"
        FULL_EVERY="${FULL_EVERY:-10}"
        DURATION="${DURATION:-14400}"

        kas_find_pid() {
          # main kube-apiserver process only; skips kube-apiserver-check-endpoints
          # sidecar and guard pods. Matches bare "kube-apiserver" entrypoint and
          # legacy "hyperkube kube-apiserver" invocation.
          local d p cl first second
          for d in /proc/[0-9]*; do
            p=${d#/proc/}
            cl=$(tr '\0' '\n' < "${d}/cmdline" 2>/dev/null) || continue
            first=$(printf '%s\n' "${cl}" | sed -n 1p); first=${first##*/}
            second=$(printf '%s\n' "${cl}" | sed -n 2p)
            if { [ "${first}" = "kube-apiserver" ] || [ "${second}" = "kube-apiserver" ]; } \
               && printf '%s\n' "${cl}" | grep -q -- '--etcd-servers'; then
              printf '%s' "${p}"; return 0
            fi
          done
          return 1
        }

        kas_capture_cheap() {
          # $1 = pid. Everything the residual/THP analysis needs, ~30 KB.
          local pid="$1" cg podcg c f s k v d
          echo "===META==="
          echo "time_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "kas_pid: ${pid}"
          echo "node: $(hostname)"
          grep -E '^(VmRSS|VmHWM|VmData|VmSwap|Threads):' "/proc/${pid}/status" 2>/dev/null
          echo "===CGROUPS==="
          cat "/proc/${pid}/cgroup" 2>/dev/null
          cg="${KAS_PREFIX}/sys/fs/cgroup$(sed -n 's/^0:://p' "/proc/${pid}/cgroup" 2>/dev/null)"
          podcg=$(dirname "${cg}")
          # container cgroup, parent pod cgroup, aggregate kubepods.slice (the ceiling)
          for c in "${cg}" "${podcg}" "${KAS_PREFIX}/sys/fs/cgroup/kubepods.slice"; do
            [ -d "${c}" ] || continue
            echo "--- cgroup ${c#${KAS_PREFIX}/sys/fs/cgroup/}"
            for f in memory.current memory.peak memory.max memory.events memory.stat memory.pressure; do
              [ -r "${c}/${f}" ] && { echo "[${f}]"; cat "${c}/${f}"; }
            done
          done
          echo "===THP==="
          for f in enabled defrag; do
            [ -r "${KAS_PREFIX}/sys/kernel/mm/transparent_hugepage/${f}" ] && \
              echo "${f}: $(cat ${KAS_PREFIX}/sys/kernel/mm/transparent_hugepage/${f})"
          done
          for d in "${KAS_PREFIX}"/sys/kernel/mm/transparent_hugepage/hugepages-*kB; do
            [ -d "${d}" ] || continue
            echo "[$(basename "${d}")]"
            for f in "${d}"/enabled "${d}"/defrag; do
              [ -r "${f}" ] && echo "  $(basename "${f}"): $(cat "${f}")"
            done
            # per-size THP stats (kernel 6.8+; includes split counters)
            for s in "${d}"/stats/*; do
              [ -r "${s}" ] && echo "  stats/$(basename "${s}"): $(cat "${s}")"
            done
            for k in "${d}"/khugepaged/*; do
              [ -r "${k}" ] && echo "  khugepaged/$(basename "${k}"): $(cat "${k}")"
            done
          done
          for f in max_ptes_none max_ptes_swap max_ptes_shared pages_to_scan scan_sleep_millisecs alloc_sleep_millisecs; do
            v=$(cat "${KAS_PREFIX}/sys/kernel/mm/transparent_hugepage/khugepaged/${f}" 2>/dev/null) && echo "khugepaged/${f}=${v}"
          done
          echo "===VMSTAT==="
          grep -E '^(thp_|nr_anon_pages|nr_active_anon|nr_inactive_anon|nr_file_pages|nr_slab_reclaimable|nr_free_pages|workingset_|pgmajfault|pswpin|pswpout)' /proc/vmstat
          echo "===MEMINFO==="
          grep -E '^(AnonHugePages|AnonPages|MemFree|MemAvailable|Cached|SwapTotal|SwapFree|Slab|PageTables):' /proc/meminfo
          echo "===ROLLUP==="
          grep -E '^(Rss|Pss|Private_Clean|Private_Dirty|Private_Hugetlb|Anonymous|AnonHugePages|Swap|Locked):' \
            "/proc/${pid}/smaps_rollup" 2>/dev/null
        }

        case "${MODE}" in
        snapshot)
          pid=$(kas_find_pid) || { echo "FATAL: kube-apiserver process not found"; exit 1; }
          kas_capture_cheap "${pid}"
          if [ "${FULL}" = "1" ]; then
            echo "===SMAPS==="
            cat "/proc/${pid}/smaps"
          fi
          ;;
        sampler)
          OUTDIR="${KAS_PREFIX}/tmp/kas-residual-samples"
          mkdir -p "${OUTDIR}"
          end=$(( $(date +%s) + DURATION ))
          i=0
          while :; do
            [ "$(date +%s)" -ge "${end}" ] && exit 0
            [ -f "${KAS_PREFIX}/tmp/kas-residual-stop" ] && exit 0
            pid=$(kas_find_pid) || { sleep "${INTERVAL}"; continue; }
            i=$((i+1))
            d="${OUTDIR}/$(date -u +%Y%m%dT%H%M%S)"
            mkdir -p "${d}"
            { echo "round: ${i}"; kas_capture_cheap "${pid}"; } > "${d}/capture.txt" 2>&1
            if [ $((i % FULL_EVERY)) -eq 1 ]; then
              cat "/proc/${pid}/smaps" > "${d}/smaps.txt" 2>/dev/null
            fi
            sleep "${INTERVAL}"
          done
          ;;
        esac
        NODEOF

        BASE64_CAP=$(base64 -w0 "${SHARED_DIR}/kas-capture-node.sh")

        # ------------------------------------------------------------------
        # 1. One-shot full snapshot per master (before the workload)
        # ------------------------------------------------------------------
        MASTERS=$(oc get nodes -l node-role.kubernetes.io/master= -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}')
        while read -r node; do
          [[ -z "${node}" ]] && continue
          echo "capturing ${node} (idle)..."
          oc debug node/"${node}" -- chroot /host bash -c \
            "echo ${BASE64_CAP} | base64 -d | MODE=snapshot FULL=1 bash" \
            | gzip > "${OUT}/idle-${node}.txt.gz" || true
        done <<NODES
        ${MASTERS}
        NODES

        # ------------------------------------------------------------------
        # 2. go_memstats cross-check (Prometheus, as in crio-residual)
        # ------------------------------------------------------------------
        oc exec -n openshift-monitoring prometheus-k8s-0 -c prometheus -- curl -sG \
          http://localhost:9090/api/v1/query \
          --data-urlencode 'query={__name__=~"go_memstats_(heap_inuse|heap_idle|heap_released|heap_sys|heap_alloc|stack_inuse)_bytes",job="apiserver"}' \
          > "${OUT}/go-memstats-prometheus-idle.json" || true

        # ------------------------------------------------------------------
        # 3. Per-master live go_memstats + heap pprof via the API server itself.
        #    (kube-apiserver has no node-local metrics port like crio's :9637)
        # ------------------------------------------------------------------
        oc config view --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' \
          | base64 -d > "${SHARED_DIR}/kapi-ca.crt" || true

        cat > "${SHARED_DIR}/kas-api-capture.sh" << 'APIEOF'
        #!/bin/bash
        # $1 = phase label (idle|during|post)
        phase="$1"
        OUT="$2"
        STAMP=$(date -u +%Y%m%dT%H%M%S)
        MASTER_IPS=$(oc get nodes -l node-role.kubernetes.io/master= -o jsonpath='{range .items[*]}{.status.addresses[?(@.type=="InternalIP")].address}{"\n"}{end}')
        while read -r ip; do
          [[ -z "${ip}" ]] && continue
          oc --server="https://${ip}:6443" --certificate-authority="${SHARED_DIR}/kapi-ca.crt" \
            --request-timeout=30s get --raw /metrics 2>/dev/null \
            | grep -E '^(go_memstats_(heap_inuse|heap_idle|heap_released|heap_sys|heap_alloc)_bytes|go_goroutines|go_info) ' \
            > "${OUT}/gostats-${phase}-${ip}-${STAMP}.txt" || true
          oc --server="https://${ip}:6443" --certificate-authority="${SHARED_DIR}/kapi-ca.crt" \
            --request-timeout=60s get --raw '/debug/pprof/heap?gc=1' \
            > "${OUT}/heap-${phase}-${ip}-${STAMP}.pb.gz" 2>/dev/null || true
        done <<IPS
        ${MASTER_IPS}
        IPS
        APIEOF
        bash "${SHARED_DIR}/kas-api-capture.sh" idle "${OUT}"

        # ------------------------------------------------------------------
        # 4. Deploy the during-workload sampler (autonomous, API-independent).
        #    A DaemonSet pod per master runs MODE=sampler with hostPID and the
        #    host root at /host. It writes to the host disk, so samples survive
        #    even if the pod dies, and needs no API access once scheduled.
        # ------------------------------------------------------------------
        echo "deploying kas-residual sampler DaemonSet..."
        BASE64_SAMES="${BASE64_CAP}"
        oc create -f - <<DSEOF
        apiVersion: v1
        kind: Namespace
        metadata:
          name: kas-residual
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: kas-residual-sampler
          namespace: kas-residual
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: kas-residual-sampler-privileged
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: system:openshift:scc:privileged
        subjects:
        - kind: ServiceAccount
          name: kas-residual-sampler
          namespace: kas-residual
        ---
        apiVersion: apps/v1
        kind: DaemonSet
        metadata:
          name: kas-residual-sampler
          namespace: kas-residual
        spec:
          selector:
            matchLabels:
              app: kas-residual-sampler
          template:
            metadata:
              labels:
                app: kas-residual-sampler
            spec:
              serviceAccountName: kas-residual-sampler
              nodeSelector:
                node-role.kubernetes.io/master: ""
              tolerations:
              - operator: Exists
              hostPID: true
              containers:
              - name: sampler
                image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
                command:
                - /bin/bash
                - -c
                - echo ${BASE64_SAMES} | base64 -d > /tmp/kas-capture.sh && MODE=sampler KAS_PREFIX=/host bash /tmp/kas-capture.sh
                securityContext:
                  privileged: true
                volumeMounts:
                - name: host
                  mountPath: /host
                resources:
                  requests:
                    cpu: 10m
                    memory: 64Mi
              volumes:
              - name: host
                hostPath:
                  path: /
        DSEOF

        oc rollout status daemonset/kas-residual-sampler -n kas-residual --timeout=180s || \
          echo "WARNING: sampler DaemonSet not fully rolled out (continuing)"

        # ------------------------------------------------------------------
