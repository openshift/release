- always_run: false
  as: data-path-9nodes-haproxy32-router100m
  steps:
    cluster_profile: aws-perfscale
    env:
      ADDITIONAL_WORKER_NODES: "6"
      CHANNEL_GROUP: nightly
      COMPUTE_MACHINE_TYPE: m6i.xlarge
      CONFIG: config/standard-classic-rosa.yml
      ENABLE_AUTOSCALING: "false"
      INDEX_ENABLED: "true"
      MULTI_AZ: "true"
      OPENSHIFT_VERSION: "5.0"
    test:
    - as: increase-router-resources
      cli: latest
      commands: |
        set -o errexit
        set -o pipefail

        echo "=== Step 1: Scale down ingress-operator and CVO ==="
        oc scale deployment/ingress-operator -n openshift-ingress-operator --replicas=0
        oc scale deployment/cluster-version-operator -n openshift-cluster-version --replicas=0 2>/dev/null || \
          echo "CVO scale-down not permitted, continuing..."
        oc annotate deployment/ingress-operator -n openshift-ingress-operator \
          cluster-version-operator.openshift.io/unmanaged=true --overwrite 2>/dev/null || true
        sleep 5
        echo "Ingress operator replicas: $(oc get deployment/ingress-operator -n openshift-ingress-operator -o jsonpath='{.spec.replicas}')"

        echo "=== Step 2: Show current router resources ==="
        echo "Containers:"
        oc get deployment/router-default -n openshift-ingress \
          -o jsonpath='{range .spec.template.spec.containers[*]}{.name}: cpu={.resources.requests.cpu}, mem={.resources.requests.memory}{"\n"}{end}'
        echo "Init containers (sidecar):"
        oc get deployment/router-default -n openshift-ingress \
          -o jsonpath='{range .spec.template.spec.initContainers[*]}{.name}: cpu={.resources.requests.cpu}, mem={.resources.requests.memory}{"\n"}{end}'

        echo "=== Step 3: Patch router container resources (25m->100m CPU, 64Mi->256Mi mem) ==="
        oc patch deployment/router-default -n openshift-ingress --type='json' \
          -p='[{"op":"replace","path":"/spec/template/spec/containers/0/resources","value":{"requests":{"cpu":"100m","memory":"256Mi"}}}]'

        echo "=== Step 4: Verify patch applied to deployment spec ==="
        ROUTER_CPU=$(oc get deployment/router-default -n openshift-ingress \
          -o jsonpath='{.spec.template.spec.containers[0].resources.requests.cpu}')
        echo "Router CPU request: ${ROUTER_CPU}"
        if [[ "${ROUTER_CPU}" != "100m" ]]; then
          echo "ERROR: Router CPU request is ${ROUTER_CPU}, expected 100m"
