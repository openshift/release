      RUN_ORION: "true"
    test:
    - as: apply-nogreenteagc-kas
      cli: latest
      commands: |
        set -o errexit
        set -o pipefail

        echo "=== Applying GOEXPERIMENT=nogreenteagc to kube-apiserver static pods ==="

        echo "Scaling down Cluster Version Operator to prevent reconciliation..."
        oc scale deployment cluster-version-operator -n openshift-cluster-version --replicas=0
        echo "Waiting for CVO pods to terminate..."
        oc wait pod -l k8s-app=cluster-version-operator -n openshift-cluster-version --for=delete --timeout=120s || true

        echo "Scaling down cluster-kube-apiserver-operator to prevent re-rendering static pods..."
        oc scale deployment kube-apiserver-operator -n openshift-kube-apiserver-operator --replicas=0
        echo "Waiting for KASO pod to terminate..."
        oc wait pod -l app=kube-apiserver-operator -n openshift-kube-apiserver-operator --for=delete --timeout=120s || true

        echo "Discovering master nodes..."
        MASTERS=$(oc get nodes -l node-role.kubernetes.io/master= -o jsonpath='{.items[*].metadata.name}')
        echo "Found master nodes: ${MASTERS}"

        for node in ${MASTERS}; do
          echo "Modifying kube-apiserver manifest on ${node}..."
          oc debug "node/${node}" -- chroot /host sed -i '/name: kube-apiserver/,/env:/{/env:/a\        - name: GOEXPERIMENT\n          value: nogreenteagc}' /etc/kubernetes/manifests/kube-apiserver-pod.yaml
          echo "Done modifying ${node}"
        done

        echo "Waiting 60 seconds for kubelet to detect manifest changes..."
        sleep 60

        echo "Waiting for kube-apiserver pods to become Ready..."
        oc wait pod -l apiserver=true -n openshift-kube-apiserver --for=condition=Ready --timeout=300s

        echo "Verifying GOEXPERIMENT is set on each master node..."
        for node in ${MASTERS}; do
          echo "Checking ${node}..."
          oc debug "node/${node}" -- chroot /host grep -A1 GOEXPERIMENT /etc/kubernetes/manifests/kube-apiserver-pod.yaml || echo "WARNING: GOEXPERIMENT not found on ${node}"
        done

        echo "=== GOEXPERIMENT=nogreenteagc injection complete ==="
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
