build_root:
  image_stream_tag:
    name: ci-tools-build-root
    namespace: ci
    tag: latest
releases:
  latest:
    release:
      channel: stable
      version: 4.22.2
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: payload-control-plane-6nodes-stable
  reporter_config:
    channel: '#ocp-qe-scale-ci-results'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :white_check_mark:
      {{else}} :warning:  Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :warning: {{end}}'
  steps:
    cluster_profile: aws-perfscale-qe
    env:
      ADDITIONAL_WORKER_NODES: "3"
      BASE_DOMAIN: qe.devcluster.openshift.com
      CD_V2_EXTRA_FLAGS: --churn-duration=20m --pod-ready-threshold=20s --service-latency --pprof-kubelet --pprof-crio --pprof-interval=5m
      CDV2_ITERATION_MULTIPLIER: "15"
      ENABLE_LAYER_3: "false"
      ES_TYPE: qe
      IGNORE_JOB_ITERATIONS: "true"
      KB_FLAGS: --local-indexing
      KUBE_BURNER_URL: https://github.com/sraviteja-maker/kube-burner-ocp/releases/download/v1.0.0/kube-burner-ocp-V1.0.0-linux-x86_64.tar.gz
      ND_CNI_EXTRA_FLAGS: --churn-mode=objects --churn-delay=1m --churn-percent=50
        --churn-cycles=2
      ND_EXTRA_FLAGS: --churn-mode=objects --churn-delay=1m --churn-percent=50 --churn-cycles=2
      OUTPUT_FORMAT: JUNIT
      RUN_ORION: deferred
      UDN_ITERATION_MULTIPLIER: "12"
      VERSION: "4.22"
      ZONES_COUNT: "3"
    test:
    - ref: openshift-qe-workers-scale
    - chain: openshift-qe-control-plane
    - chain: openshift-qe-orion-consolidated
    workflow: openshift-qe-installer-aws
- always_run: false
  as: control-plane-120nodes-stable
  reporter_config:
    channel: '#ocp-qe-scale-ci-results'
    job_states_to_report:
    - success
    - failure
    - error
    report_template: '{{if eq .Status.State "success"}} :white_check_mark: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> :white_check_mark:
      {{else}} :warning:  Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View
      logs> :warning: {{end}}'
  steps:
    allow_skip_on_success: true
    cluster_profile: aws-perfscale
    env:
      ADDITIONAL_WORKER_NODES: "117"
      BASE_DOMAIN: perfscale.devcluster.openshift.com
      CD_V2_EXTRA_FLAGS: --churn-duration=20m --service-latency --pprof-kubelet --pprof-crio --pprof-interval=5m
      COMPUTE_NODE_TYPE: m5.xlarge
      ENABLE_LAYER_3: "false"
      KB_FLAGS: --set=metricsEndpoints.0.step=2m --set=metricsEndpoints.1.step=2m
        --local-indexing
      KUBE_BURNER_URL: https://github.com/sraviteja-maker/kube-burner-ocp/releases/download/v1.0.0/kube-burner-ocp-V1.0.0-linux-x86_64.tar.gz
      NODE_DENSITY_GC: "false"
      OPENSHIFT_INFRA_NODE_INSTANCE_TYPE: r5.4xlarge
      SET_ENV_BY_PLATFORM: custom
      SIZE_VARIANT: large
      UDN_ITERATION_MULTIPLIER: "1"
      USER_TAGS: |
        TicketId 532
      ZONES_COUNT: "3"
    test:
    - ref: openshift-qe-workers-scale
    - chain: openshift-qe-control-plane
    workflow: openshift-qe-installer-aws
  timeout: 10h0m0s
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: ocp-perfscale
  variant: aws-4.22-stable-x86
