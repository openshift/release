base_images:
  claude-ai-helpers:
    name: claude-ai-helpers
    namespace: ci
    tag: latest
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest
  ship-status-dash-devcontainer:
    name: ship-status-dash
    namespace: ci
    tag: ship-status-dash-devcontainer
build_root:
  project_image:
    dockerfile_path: Dockerfile.buildroot
images:
  items:
  - dockerfile_literal: |
      FROM claude-ai-helpers AS ai-helpers
      FROM nested-podman AS podman
      FROM src AS source
      FROM ship-status-dash-devcontainer
      USER root
      RUN dnf install -y podman fuse-overlayfs shadow-utils openssl python3-pip && dnf clean all
      COPY --from=podman /entrypoint.sh /entrypoint.sh
      RUN setcap cap_setuid+ep /usr/bin/newuidmap && \
          setcap cap_setgid+ep /usr/bin/newgidmap && \
          touch /etc/subgid /etc/subuid && \
          chmod -R g=u /etc/subuid /etc/subgid /etc/passwd /etc/group && \
          chmod +rx /entrypoint.sh
      COPY --from=source /go/src/github.com/openshift-eng/ship-status-dash /workspace
      RUN chgrp -R 0 /workspace && chmod -R g=u /workspace
      COPY --from=ai-helpers /opt/ai-helpers /opt/ai-helpers
      RUN mkdir -p /home/vscode/.claude/plugins
      COPY --from=ai-helpers /home/claude/.claude/plugins/known_marketplaces.json /home/vscode/.claude/plugins/known_marketplaces.json
      RUN chgrp -R 0 /opt/ai-helpers /home/vscode/.claude && chmod -R g=u /opt/ai-helpers /home/vscode/.claude
      RUN python3 -m pip install --no-cache-dir agentic-ci
      ENV BUILDAH_ISOLATION=chroot
      USER vscode
      WORKDIR /workspace
      ENTRYPOINT ["/entrypoint.sh"]
      CMD ["bash"]
    from: ship-status-dash-devcontainer
    inputs:
      claude-ai-helpers:
        as:
        - claude-ai-helpers
      nested-podman:
        as:
        - nested-podman
      src:
        as:
        - src
    to: agentic-dev
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: periodic-ship-status-dash-jira-agent
  capabilities:
  - nested-podman
  cron: '@yearly'
  steps:
    env:
      ALLOWED_TOOLS: Bash Read Write Edit Grep Glob WebFetch WebSearch Agent LSP Skill
        TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite ToolSearch
        mcp__ship-status-dev__* mcp__ship-status__* mcp__playwright__*
      FORK_REPO: openshift-trt/ship-status-dash
      GITHUB_APP_TOKEN_OUTPUTS: installation-id:gh-fork-token,openshift-eng-installation-id:gh-upstream-token
      SETUP_SCRIPT: hack/agentic_setup.sh
      UPSTREAM_REPO: openshift-eng/ship-status-dash
    workflow: openshift-agentic-trt-jira-solver
- as: periodic-ship-status-dash-pr-followup-agent
  capabilities:
  - nested-podman
  cron: '@yearly'
  steps:
    env:
      ALLOWED_TOOLS: Bash Read Write Edit Grep Glob WebFetch WebSearch Agent LSP Skill
        TaskCreate TaskGet TaskList TaskOutput TaskStop TaskUpdate TodoWrite ToolSearch
        mcp__ship-status-dev__* mcp__ship-status__* mcp__playwright__*
      FORK_REPO: openshift-trt/ship-status-dash
      GITHUB_APP_TOKEN_OUTPUTS: installation-id:gh-fork-token,openshift-eng-installation-id:gh-upstream-token
      SETUP_SCRIPT: hack/agentic_setup.sh
      UPSTREAM_REPO: openshift-eng/ship-status-dash
    workflow: openshift-agentic-trt-pr-followup
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: ship-status-dash
  variant: agentic
