binary_build_commands: cd go-server && go install .
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: golang-1.23
images:
  items:
  - dockerfile_path: images/agent-worker.Dockerfile
    to: agent-worker
  - dockerfile_path: images/gh-token-minter.Dockerfile
    to: gh-token-minter
  - dockerfile_path: images/go-server.Dockerfile
    to: go-server
  - dockerfile_path: images/review-handler.Dockerfile
    to: review-handler-agent
  - dockerfile_literal: |-
      FROM registry.access.redhat.com/ubi9/go-toolset
      USER 0
      RUN dnf install -y git make jq openssl python3 && \
          dnf install -y 'dnf-command(config-manager)' && \
          dnf config-manager --add-repo https://cli.github.com/packages/rpm/gh-cli.repo && \
          dnf install -y gh && \
          dnf clean all
      WORKDIR /app
      RUN git clone https://github.com/neha037/oape-ai-e2e.git /tmp/oape && \
          cd /tmp/oape && git checkout b4de252c7688f27d243ae73b7fa987ebe2ae8c9c && \
          cp -r scripts /app/scripts && \
          cp -r plugins /plugins && \
          mkdir -p /config && cp -r deploy/config/* /config/ && \
          rm -rf /tmp/oape
      RUN go install golang.org/x/tools/cmd/goimports@v0.33.0 && \
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.1.6/install.sh | sh -s -- -b /usr/local/bin v2.1.6
      RUN dnf module reset -y nodejs && \
          dnf module enable -y nodejs:20 && \
          dnf install -y nodejs npm && \
          npm install -g @anthropic-ai/claude-code@1.0.16 && \
          dnf clean all
      RUN git config --global user.name "openshift-app-platform-shift-bot" && \
          git config --global user.email "267347085+openshift-app-platform-shift-bot@users.noreply.github.com"
      RUN chmod -R g=u /opt/app-root/src /config
      USER 1001
    to: ci-monitor-agent
  - dockerfile_path: prow-workflow/input.Dockerfile
    to: workflow-input
promotion:
  to:
  - excluded_images:
    - workflow-input
    name: ai-e2e-agent
    namespace: oape
    tag_by_commit: true
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: run-workflow
  run_if_changed: ^prow-workflow/
  steps:
    pre:
    - as: extract-params
      commands: |
        cp /params.env "${SHARED_DIR}/params.env"
        cat "${SHARED_DIR}/params.env"
      from: workflow-input
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
    - as: mint-gh-token
      commands: |
        set -euo pipefail
        export GH_APP_ID=$(cat /var/run/github-app/app-id)
        export GH_APP_PEM_FILE_PATH="/var/run/github-app/private-key.pem"
        set +x
        python /app/ghpat_server.py > "${SHARED_DIR}/gh-token"
      credentials:
      - collection: oape-ai-e2e
        group: openshift-app-platform-shift-github-bot
        mount_path: /var/run/github-app
      from: gh-token-minter
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
    test:
    - as: agent-workflow
      commands: |
        set -euo pipefail
        source "${SHARED_DIR}/params.env"
        export EP_URL REPO_URL BASE_BRANCH

        set +x
        export GH_TOKEN
        GH_TOKEN=$(cat "${SHARED_DIR}/gh-token")

        export GOOGLE_APPLICATION_CREDENTIALS="/var/run/gcloud-adc/application_default_credentials.json"
        export CLAUDE_CODE_USE_VERTEX="1"
        export CLOUD_ML_REGION="global"
        export ANTHROPIC_VERTEX_PROJECT_ID="itpc-gcp-hcm-pe-eng-claude"
        export ANTHROPIC_MODEL="claude-opus-4-6"
        export PYTHONUNBUFFERED=1

        gh auth setup-git && python3.11 main.py
      credentials:
      - collection: oape-ai-e2e
        group: oap-lts-claude-gcp-vertex-sa
        mount_path: /var/run/gcloud-adc
      from: agent-worker
      resources:
        requests:
          cpu: "1"
          memory: 500Mi
      timeout: 2h30m0s
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: oape-ai-e2e
