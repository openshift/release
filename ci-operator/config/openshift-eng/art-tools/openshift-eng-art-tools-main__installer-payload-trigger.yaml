build_root:
  project_image:
    dockerfile_literal: |
      FROM registry.ci.openshift.org/ocp/ubi-python-311:9
      USER 0
      RUN dnf install -y git gcc krb5-devel python3.11-devel && dnf clean all
      COPY --from=registry.ci.openshift.org/ocp/4.22:cli /usr/bin/oc /usr/local/bin/oc
      RUN python3.11 -m pip install --no-cache-dir uv==0.9.18
      RUN mkdir -p /go/src && chown -R 1001:0 /go && chmod -R g+rwX /go
      USER 1001
releases:
  latest:
    release:
      channel: stable
      version: "4.22"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: installer-build-trigger
  capabilities:
  - intranet
  release_controller: true
  restrict_network_access: false
  steps:
    test:
    - ref: ocp-art-trigger-installer-build
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: art-tools
  variant: installer-payload-trigger
