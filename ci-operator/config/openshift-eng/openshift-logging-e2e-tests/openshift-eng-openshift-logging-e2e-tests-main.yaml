build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.22
images:
  items:
  - dockerfile_literal: |
      FROM pipeline:src
      RUN GONOSUMDB="*" GOFLAGS="" go install github.com/go-bindata/go-bindata/v3/go-bindata@latest && \
          make build && \
          install -m 0755 bin/openshift-logging-e2e-tests-tests-ext /usr/local/bin/openshift-logging-e2e-tests-tests-ext
    from: src
    to: openshift-logging-e2e-tests
  - dockerfile_literal: |
      FROM openshift-logging-e2e-tests
      RUN install -d -m 0755 /etc/pki/rpm-gpg \
          && curl -fsSL https://downloads.claude.ai/keys/claude-code.asc \
               -o /etc/pki/rpm-gpg/RPM-GPG-KEY-claude-code \
          && rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-claude-code \
          && echo -e "[claude-code]\nname=Claude Code\nbaseurl=https://downloads.claude.ai/claude-code/rpm/stable/\$basearch\nenabled=1\ngpgcheck=1\ngpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-claude-code" \
               > /etc/yum.repos.d/claude-code.repo \
          && dnf install -y claude-code \
          && dnf clean all
    from: openshift-logging-e2e-tests
    to: obs-tests-runner
promotion:
  to:
  - namespace: logging
    tag: main
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: openshift-logging-e2e-tests
