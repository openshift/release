build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.22
images:
  items:
  - dockerfile_literal: |
      FROM pipeline:src
      RUN GONOSUMDB="*" GOFLAGS="" go install github.com/go-bindata/go-bindata/v3/go-bindata@latest && \
          make build && \
          install -m 0755 bin/openshift-logging-e2e-tests-tests-ext /usr/local/bin/openshift-logging-e2e-tests-tests-ext
      RUN curl -fsSL https://claude.ai/install.sh | bash \
          && install -m 0755 "$HOME/.local/bin/claude" /usr/local/bin/claude \
          && claude --version
      RUN OC_MIRROR=https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable \
          && curl -fsSL "${OC_MIRROR}/openshift-client-linux.tar.gz" -o /tmp/openshift-client-linux.tar.gz \
          && (cd /tmp && curl -fsSL "${OC_MIRROR}/sha256sum.txt" | grep ' openshift-client-linux.tar.gz$' | sha256sum -c -) \
          && tar -xzf /tmp/openshift-client-linux.tar.gz -C /usr/local/bin oc kubectl \
          && rm -f /tmp/openshift-client-linux.tar.gz \
          && oc version --client \
          && kubectl version --client
    from: src
    to: obs-tests-runner
promotion:
  to:
  - namespace: logging
    tag: main
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: openshift-logging-e2e-tests
