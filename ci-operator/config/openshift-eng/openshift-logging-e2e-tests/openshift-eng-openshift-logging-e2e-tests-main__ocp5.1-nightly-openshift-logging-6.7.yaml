base_images:
  cli:
    name: "5.1"
    namespace: ocp
    tag: cli
  obs-tests-runner:
    name: obs-tests-runner
    namespace: logging
    tag: main
  upi-installer:
    name: "5.1"
    namespace: ocp
    tag: upi-installer
releases:
  arm64-latest:
    candidate:
      architecture: arm64
      product: ocp
      stream: nightly
      version: "5.1"
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.1"
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 1Gi
tests:
- as: aws-ipi-proxy-sts-f999-logging-clo
  cron: 0 9 * * 1
  reporter_config:
    channel: '#aos-qe-logging'
    job_states_to_report:
    - aborted
    - error
    - failure
    - pending
    - success
    report_template: Job {{.Spec.Job}} state is *{{.Status.State}}* <{{.Status.URL}}|View
      logs>
  steps:
    cluster_profile: aws-observability
    env:
      AGENT_SKILL: cluster-logging
      BASE_DOMAIN: devobscluster.devcluster.openshift.com
      JIRA_PROJECT: LOG
      LOGGING_TEST_VERSION: "6.7"
      LOGGING_UPGRADE_FROM_VERSION: "6.6"
      OPERATORS: |
        [
            {"name": "cluster-logging", "source": "cluster-logging-operator-registry", "channel": "stable-6.7", "install_namespace": "openshift-logging","target_namespaces": "", "operator_group": "openshift-logging"},
            {"name": "loki-operator", "source": "loki-operator-registry", "channel": "stable-6.7", "install_namespace": "openshift-operators-redhat","target_namespaces": "", "operator_group": "openshift-operators-redhat"},
            {"name": "cluster-observability-operator", "source": "redhat-operators", "channel": "stable", "install_namespace": "openshift-cluster-observability-operator","target_namespaces": "", "operator_group": "openshift-cluster-observability-operator"},
            {"name": "amq-streams", "source": "redhat-operators", "channel": "amq-streams-2.x", "install_namespace": "openshift-operators","target_namespaces": "", "operator_group": ""}
        ]
      TEST_MAX_CONCURRENCY: "3"
      TEST_SUITE: openshift-logging-e2e-tests/cluster-logging-operator/all
    post:
    - ref: openshift-observability-qe-agent
    test:
    - ref: openshift-logging-catalogsources
    - ref: install-operators
    - ref: openshift-observability-logging-e2e-tests
    workflow: cucushift-installer-rehearse-aws-ipi-proxy-cco-manual-security-token-service
