base_images:
  cli:
    name: "4.22"
    namespace: ocp
    tag: cli
  upi-installer:
    name: "4.22"
    namespace: ocp
    tag: upi-installer
build_root:
  image_stream_tag:
    name: builder
    namespace: ocp
    tag: rhel-9-golang-1.26-openshift-4.22
images:
  items:
  - dockerfile_literal: |
      FROM pipeline:src
      RUN make build && \
          install -m 0755 bin/openshift-logging-e2e-tests-tests-ext /usr/local/bin/openshift-logging-e2e-tests-tests-ext
      RUN dnf install -y jq && dnf clean all && jq --version
      RUN curl -fsSL https://claude.ai/install.sh | bash \
          && install -m 0755 "$HOME/.local/bin/claude" /usr/local/bin/claude \
          && claude --version
    from: src
    to: obs-tests-runner
releases:
  latest:
    release:
      architecture: amd64
      channel: candidate
      version: "4.22"
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 1Gi
tests:
- always_run: false
  as: aws-ipi-f14-logging-clo
  cron: 0 9 * * 3
  optional: true
  presubmit: true
  steps:
    cluster_profile: aws-observability
    env:
      AGENT_SKILL: cluster-logging
      BASE_DOMAIN: devobscluster.devcluster.openshift.com
      JIRA_PROJECT: LOG
      TEST_MAX_CONCURRENCY: "1"
      TEST_SUITE: openshift-logging-e2e-tests/cluster-logging-operator/all
    post:
    - ref: openshift-observability-qe-agent
    - chain: cucushift-installer-rehearse-aws-ipi-deprovision
    test:
    - chain: openshift-observability-logging-e2e-suite
    workflow: cucushift-installer-rehearse-aws-ipi-ovn
- always_run: false
  as: aws-ipi-f14-logging-clo-premerge
  optional: true
  steps:
    cluster_profile: aws-observability
    env:
      AGENT_SKILL: cluster-logging
      BASE_DOMAIN: devobscluster.devcluster.openshift.com
      TEST_MAX_CONCURRENCY: "1"
      TEST_SUITE: openshift-logging-e2e-tests/cluster-logging-operator
    post:
    - ref: openshift-observability-qe-agent
    - chain: cucushift-installer-rehearse-aws-ipi-deprovision
    test:
    - chain: openshift-observability-logging-e2e-suite
    workflow: cucushift-installer-rehearse-aws-ipi-ovn
- always_run: false
  as: aws-ipi-f14-logging-loki
  cron: 0 9 * * 4
  optional: true
  presubmit: true
  steps:
    cluster_profile: aws-observability
    env:
      AGENT_SKILL: loki
      BASE_DOMAIN: devobscluster.devcluster.openshift.com
      JIRA_PROJECT: LOG
      TEST_MAX_CONCURRENCY: "1"
      TEST_SUITE: openshift-logging-e2e-tests/loki-operator/all
    post:
    - ref: openshift-observability-qe-agent
    - chain: cucushift-installer-rehearse-aws-ipi-deprovision
    test:
    - chain: openshift-observability-logging-e2e-suite
    workflow: cucushift-installer-rehearse-aws-ipi-ovn
- always_run: false
  as: aws-ipi-f14-logging-loki-premerge
  optional: true
  steps:
    cluster_profile: aws-observability
    env:
      AGENT_SKILL: loki
      BASE_DOMAIN: devobscluster.devcluster.openshift.com
      TEST_MAX_CONCURRENCY: "1"
      TEST_SUITE: openshift-logging-e2e-tests/loki-operator
    post:
    - ref: openshift-observability-qe-agent
    - chain: cucushift-installer-rehearse-aws-ipi-deprovision
    test:
    - chain: openshift-observability-logging-e2e-suite
    workflow: cucushift-installer-rehearse-aws-ipi-ovn
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: openshift-logging-e2e-tests
  variant: amd64-stable-openshift-logging-6.6
