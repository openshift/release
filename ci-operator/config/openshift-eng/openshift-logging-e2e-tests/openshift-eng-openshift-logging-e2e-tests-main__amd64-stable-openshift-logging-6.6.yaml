base_images:
  cli:
    name: "4.22"
    namespace: ocp
    tag: cli
  obs-tests-runner:
    name: obs-tests-runner
    namespace: logging
    tag: main
  upi-installer:
    name: "4.22"
    namespace: ocp
    tag: upi-installer
releases:
  latest:
    release:
      architecture: amd64
      channel: candidate
      version: "4.22"
resources:
  '*':
    limits:
      memory: 8Gi
    requests:
      cpu: "1"
      memory: 1Gi
tests:
- always_run: false
  as: aws-ipi-f14-logging-clo
  cron: 0 9 * * 3
  optional: true
  presubmit: true
  steps:
    cluster_profile: aws-observability
    env:
      AGENT_SKILL: cluster-logging
      BASE_DOMAIN: devobscluster.devcluster.openshift.com
      JIRA_PROJECT: LOG
      TEST_MAX_CONCURRENCY: "3"
      TEST_SUITE: openshift-logging-e2e-tests/cluster-logging-operator/all
    post:
    - ref: openshift-observability-qe-agent
    - chain: cucushift-installer-rehearse-aws-ipi-deprovision
    test:
    - chain: openshift-observability-logging-e2e-suite
    workflow: cucushift-installer-rehearse-aws-ipi-ovn
- always_run: false
  as: aws-ipi-f14-logging-clo-premerge
  optional: true
  steps:
    cluster_profile: aws-observability
    env:
      AGENT_SKILL: cluster-logging
      BASE_DOMAIN: devobscluster.devcluster.openshift.com
      TEST_MAX_CONCURRENCY: "3"
      TEST_SUITE: openshift-logging-e2e-tests/cluster-logging-operator
    post:
    - ref: openshift-observability-qe-agent
    - chain: cucushift-installer-rehearse-aws-ipi-deprovision
    test:
    - chain: openshift-observability-logging-e2e-suite
    workflow: cucushift-installer-rehearse-aws-ipi-ovn
- always_run: false
  as: aws-ipi-f14-logging-loki
  cron: 0 9 * * 4
  optional: true
  presubmit: true
  steps:
    cluster_profile: aws-observability
    env:
      AGENT_SKILL: loki
      BASE_DOMAIN: devobscluster.devcluster.openshift.com
      JIRA_PROJECT: LOG
      TEST_MAX_CONCURRENCY: "1"
      TEST_SUITE: openshift-logging-e2e-tests/loki-operator/all
    post:
    - ref: openshift-observability-qe-agent
    - chain: cucushift-installer-rehearse-aws-ipi-deprovision
    test:
    - chain: openshift-observability-logging-e2e-suite
    workflow: cucushift-installer-rehearse-aws-ipi-ovn
- always_run: false
  as: aws-ipi-f14-logging-loki-premerge
  optional: true
  steps:
    cluster_profile: aws-observability
    env:
      AGENT_SKILL: loki
      BASE_DOMAIN: devobscluster.devcluster.openshift.com
      TEST_MAX_CONCURRENCY: "1"
      TEST_SUITE: openshift-logging-e2e-tests/loki-operator
    post:
    - ref: openshift-observability-qe-agent
    - chain: cucushift-installer-rehearse-aws-ipi-deprovision
    test:
    - chain: openshift-observability-logging-e2e-suite
    workflow: cucushift-installer-rehearse-aws-ipi-ovn
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: openshift-logging-e2e-tests
  variant: amd64-stable-openshift-logging-6.6
