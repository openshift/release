build_root:
  image_stream_tag:
    name: ci-tools-build-root
    namespace: ci
    tag: latest
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "5.0"
resources:
  '*':
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: aws-3nodes-2000ppn
  steps:
    cluster_profile: aws-perfscale-qe
    env:
      BASE_DOMAIN: qe.devcluster.openshift.com
      BURST: "10"
      CLUSTER_NETWORK_CIDR: 10.128.0.0/14
      CLUSTER_NETWORK_HOST_PREFIX: "20"
      COMPUTE_NODE_TYPE: c6a.8xlarge
      CONTROL_PLANE_INSTANCE_TYPE: m6a.2xlarge
      ENABLE_LOCAL_INDEX: "true"
      ITERATIONS_PER_NAMESPACE: "100"
      GC_METRICS: "true"
      MAX_PODS: "2050"
      NDH_EXTRA_FLAGS: --pod-ready-threshold=500s --deletion-strategy=default
      OPENSHIFT_INFRA_NODE_INSTANCE_TYPE: r5.2xlarge
      PODS_PER_NODE: "2000"
      PPROF: "false"
      PROFILE_TYPE: both
      QPS: "5"
      SET_ENV_BY_PLATFORM: custom
      ZONES_COUNT: "3"
    post:
    - chain: ipi-aws-post
    pre:
    - chain: ipi-conf-aws
    - ref: ovn-conf-custom-cidr
    - chain: ipi-install
    - ref: openshift-qe-set-max-pods
    - chain: create-infra-move-ingress-monitoring-registry
    test:
    - chain: workers-scale
    - chain: openshift-qe-node-density-heavy
    workflow: openshift-qe-installer-aws
  timeout: 8h0m0s
zz_generated_metadata:
  branch: main
  org: openshift-eng
  repo: ocp-qe-perfscale-ci
  variant: 5.0-nightly-node-density-heavy
