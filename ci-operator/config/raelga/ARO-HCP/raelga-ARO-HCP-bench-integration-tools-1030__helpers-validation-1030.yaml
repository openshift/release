base_images:
  nested-podman:
    name: nested-podman
    namespace: ci
    tag: latest@sha256:14aaf29862191453666f7c6d720bdb51ccd16b10dca4c5239d3aa1a7869400b5
build_root:
  from_repository: true
canonical_go_repository: github.com/Azure/ARO-HCP
images:
  items:
  - dockerfile_path: dev-infrastructure/openshift-ci/Dockerfile.nested-podman
    from: nested-podman
    to: aro-hcp-nested-podman-ci
  - dockerfile_literal: |
      FROM aro-hcp-nested-podman-ci
      COPY --chown=1000:0 /src /opt/app-root/src/github.com/Azure
      WORKDIR /opt/app-root/src/github.com/Azure/ARO-HCP
    from: aro-hcp-nested-podman-ci
    inputs:
      src:
        paths:
        - destination_dir: src
          source_path: /go/src/github.com/Azure/ARO-HCP
    to: nested-podman-src
  run_if_changed: ^(dev-infrastructure/openshift-ci/(Dockerfile(\.nested-podman)?|Makefile|smoke-test\.sh|versions\.mk)$|\.bingo/|\.ci-operator\.yaml$|go\.work$)
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: '3'
      memory: 4Gi
tests:
- always_run: false
  as: nested-podman-smoke-test
  capabilities:
  - nested-podman
  - arm64
  cluster: build11
  nested_podman: true
  optional: true
  run_if_changed: ^$
  steps:
    test:
    - as: nested-podman-smoke-test
      commands: |
        set -euxo pipefail
        test "$(git rev-parse HEAD)" = cc993c6d908041e60144bcaeb3d603615b2e5af4
        export AZURE_TOKEN_CREDENTIALS=prod
        export GOPATH=/opt/app-root
        make -C dev-infrastructure/openshift-ci test-nested-podman IN_CONTAINER=true
        test-integration/hack/start-cosmos-emulator.sh
        test-integration/hack/test-integration.sh
        test-integration/hack/stop-cosmos-emulator.sh
        unset GOFLAGS
        make mega-lint CONTAINER_RUNTIME=podman
      from: nested-podman-src
      grace_period: 30s
      nested_podman: true
      resources:
        requests:
          cpu: 4000m
          memory: 4Gi
zz_generated_metadata:
  branch: bench-integration-tools-1030
  org: raelga
  repo: ARO-HCP
  variant: helpers-validation-1030
