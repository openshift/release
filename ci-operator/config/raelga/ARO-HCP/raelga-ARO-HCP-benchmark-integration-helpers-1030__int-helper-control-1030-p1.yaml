canonical_go_repository: github.com/Azure/ARO-HCP
raw_steps:
- input_image_tag_step:
    external_image:
      name: ci
      namespace: openshift
      registry: quay-proxy.ci.openshift.org
      tag: aro-hcp_aro-hcp-ci-images_aro-hcp-nested-podman-ci@sha256:ef6ce72c6223e9a86c8f5954bac2ab42df37b2380eb695fd5b1dc9f2ac3ca995
    to: benchmark-root
- source_step:
    clonerefs_path: /ko-app/clonerefs
    from: benchmark-root
    pull_spec: us-docker.pkg.dev/k8s-infra-prow/images/clonerefs:v20261023-0d9737ca2
    to: src
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: '3'
      memory: 4Gi
tests:
- always_run: false
  as: integration
  capabilities:
  - nested-podman
  - arm64
  cluster: build11
  nested_podman: true
  optional: true
  run_if_changed: ^$
  steps:
    test:
    - as: aro-hcp-frontend-run-integration-tests
      commands: |
        #!/bin/bash
        # Run race-enabled frontend integration tests with the local Cosmos emulator.
        set -o errexit
        set -o nounset
        set -o pipefail

        set -x # Turn on command tracing

        test "$(git rev-parse HEAD)" = "f946e3e90aa1806cbd6bb2426fab409c68d8cdbe"
        go version
        PHASE_TIMINGS="${ARTIFACT_DIR}/integration-phase-timings.log"
        TIMED_PHASE=""
        PHASE_START_SECONDS=0

        # Record setup and teardown separately from the runner's envtest and Go phases.
        start_phase() {
            TIMED_PHASE="$1"
            PHASE_START_SECONDS=${SECONDS}
            printf '%s phase=%s event=start\n' \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${TIMED_PHASE}" | tee -a "${PHASE_TIMINGS}"
        }

        finish_phase() {
            local status="$1"
            printf '%s phase=%s event=end duration_seconds=%s status=%s\n' \
                "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${TIMED_PHASE}" \
                "$((SECONDS - PHASE_START_SECONDS))" "${status}" | tee -a "${PHASE_TIMINGS}"
            TIMED_PHASE=""
        }

        # Preserve failed setup timing without changing the test command's exit status.
        finish_failed_phase() {
            local status=$?
            if [ -n "${TIMED_PHASE}" ]; then
                finish_phase "${status}"
            fi
        }
        trap finish_failed_phase EXIT

        start_phase helpers
        export GOPATH=/opt/app-root
        export PATH=${PATH}:"${GOPATH}/bin"
        export AZURE_TOKEN_CREDENTIALS=prod
        go install gotest.tools/gotestsum@v1.13.0
        finish_phase 0

        start_phase emulator-start
        test-integration/hack/start-cosmos-emulator.sh
        finish_phase 0

        podman image inspect mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-preview --format '{{json .RepoDigests}}' | tee "${ARTIFACT_DIR}/emulator-repo-digests.json"
        test-integration/hack/test-integration.sh

        go version -m "$(command -v gotestsum)" "$(command -v setup-envtest)" > "${ARTIFACT_DIR}/helper-module-versions.txt"
        start_phase emulator-stop
        test-integration/hack/stop-cosmos-emulator.sh
        finish_phase 0
      from: src
      grace_period: 30s
      nested_podman: true
      resources:
        requests:
          cpu: '6'
          memory: 4Gi
