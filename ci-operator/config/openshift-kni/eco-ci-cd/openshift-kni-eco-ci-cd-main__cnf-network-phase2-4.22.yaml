build_root:
  image_stream_tag:
    name: eco-ci-cd
    namespace: telcov10n-ci
    tag: eco-ci-cd
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: cnf-network-functional-tests
  capabilities:
  - intranet
  cron: 0 23 31 2 *
  restrict_network_access: false
  steps:
    env:
      ECO_CI_CD_FORK_BRANCH: cnf-network-reportportal
      ECO_CI_CD_FORK_URL: https://github.com/rdiazcam/eco-ci-cd
      ECO_GOTEST_BMC_ACCESS: "true"
      ECO_GOTESTS_ENV_VARS: -e ECO_CNF_CORE_NET_TEST_CONTAINER=quay.io/ocp-edge-qe/eco-gotests-network-client:v4.20
        -e ECO_CNF_CORE_NET_DPDK_TEST_CONTAINER=quay.io/ocp-edge-qe/eco-gotests-rootless-dpdk:v4.16.0
        -e ECO_CNF_CORE_NET_FRR_IMAGE=quay.io/ocp-edge-qe/frr:8.5.3
      ECO_GOTESTS_JUNIT_BASTION_DIR: /tmp/test_reports/junit
      FEATURES: core
      LABELS: net&&(accelerator||nmstate)
      METRICS_LIST: general_ocp,sriov,ptp,fec
      REPORTER_LAUNCH_NAME: telco-ft-net-core
      REPORTER_TEMPLATE_NAME: 'Telco Network 4_22 Regression - Telco Network 4.22
        Regression Testing - Version: <version>; Build: <build>'
      REPORTPORTAL_FILES: .reportportal_url_Net_core
      UPLOAD_TO_REPORT_PORTAL: "true"
      VERSION: "4.22"
    workflow: telcov10n-functional-cnf-network-phase2
zz_generated_metadata:
  branch: main
  org: openshift-kni
  repo: eco-ci-cd
  variant: cnf-network-phase2-4.22
