build_root:
  image_stream_tag:
    name: eco-ci-cd
    namespace: telcov10n-ci
    tag: eco-ci-cd
prowgen:
  enable_secrets_store_csi_driver: false
resources:
  '*':
    limits:
      cpu: 500m
      memory: 4Gi
    requests:
      cpu: 500m
      memory: 200Mi
tests:
- as: e2e-telcov10n-nrop-upgrades-zstream-4-20
  capabilities:
  - intranet
  cron: 0 0 31 2 *
  steps:
    env:
      CLUSTER_NAME: helix17
      FROM_OCP_VERSION: "4.20"
      NROP_CHANNEL: versioned
      UPGRADE_ENV: prod-stage
      UPGRADE_TYPE: zstream
      WORKLOAD_PARTITIONING: "false"
    workflow: telcov10n-functional-cnf-compute-nrop-upgrades
- as: e2e-telcov10n-nrop-upgrades-minor-long-4-19-to-4-20
  capabilities:
  - intranet
  cron: 0 0 31 2 *
  steps:
    env:
      CLUSTER_NAME: helix17
      FROM_OCP_VERSION: "4.19"
      NROP_CHANNEL: versioned
      TO_OCP_VERSION: "4.20"
      UPGRADE_ENV: prod-stage
      UPGRADE_TYPE: minor-long
      WORKLOAD_PARTITIONING: "false"
    workflow: telcov10n-functional-cnf-compute-nrop-upgrades
- as: e2e-telcov10n-nrop-upgrades-range-4-20-to-4-22
  capabilities:
  - intranet
  cron: 0 0 31 2 *
  steps:
    env:
      CLUSTER_NAME: helix17
      FROM_OCP_VERSION: "4.20"
      NROP_CHANNEL: versioned
      TO_OCP_VERSION: "4.22"
      UPGRADE_ENV: stage-stage
      UPGRADE_TYPE: range
      WORKLOAD_PARTITIONING: "false"
    workflow: telcov10n-functional-cnf-compute-nrop-upgrades
- as: e2e-telcov10n-nrop-upgrades-canary-4-20-to-4-22
  capabilities:
  - intranet
  cron: 0 0 31 2 *
  steps:
    env:
      CLUSTER_NAME: helix17
      FROM_OCP_VERSION: "4.20"
      NROP_CHANNEL: versioned
      TO_OCP_VERSION: "4.22"
      UPGRADE_ENV: prod-stage
      UPGRADE_TYPE: canary
      WORKLOAD_PARTITIONING: "false"
    workflow: telcov10n-functional-cnf-compute-nrop-upgrades
zz_generated_metadata:
  branch: main
  org: openshift-kni
  repo: eco-ci-cd
  variant: cnf-compute-nrop-upgrades
