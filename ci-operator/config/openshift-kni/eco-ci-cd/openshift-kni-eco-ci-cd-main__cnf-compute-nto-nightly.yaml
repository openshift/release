build_root:
  image_stream_tag:
    name: eco-ci-cd
    namespace: telcov10n-ci
    tag: eco-ci-cd
prowgen:
  enable_secrets_store_csi_driver: false
releases:
  latest:
    candidate:
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: e2e-telcov10n-nto-tests-v2-t0-bm-5-1-nightly
  capabilities:
  - intranet
  cron: 0 6 * * 1
  reporter_config:
    channel: '#compute-qe-ci-notifications'
    job_states_to_report:
    - failure
    - error
    - success
    - aborted
    report_template: '{{if eq .Status.State "success"}} :slack-green: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :failed:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  steps:
    env:
      CGROUP_VERSION: v2
      CLUSTER_NAME: hlxcl15
      CONTAINER_RUNTIME: crun
      FEATURES: compute
      HUGEPAGES_DEFAULT_SIZE: 1G
      HUGEPAGES_PAGES: '[{"count": 1, "size": "1G"}, {"count": 128, "size": "2M"}]'
      LABEL_FILTER: tier-0
      LABELS: nto
      OCP_VERSION_RELEASE_AGE_MAX_DAYS: "7"
      RT_KERNEL: "true"
      VERSION: "5.1"
    test:
    - ref: telcov10n-functional-cnf-compute-nto-eco-gotests
    workflow: telcov10n-functional-cnf-compute-nto-ocp-setup
- as: e2e-telcov10n-nto-tests-v2-t0-bm-4-23-nightly
  capabilities:
  - intranet
  cron: 0 12 * * 1
  reporter_config:
    channel: '#compute-qe-ci-notifications'
    job_states_to_report:
    - failure
    - error
    - success
    - aborted
    report_template: '{{if eq .Status.State "success"}} :slack-green: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :failed:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  steps:
    env:
      CGROUP_VERSION: v2
      CLUSTER_NAME: hlxcl15
      CONTAINER_RUNTIME: crun
      FEATURES: compute
      HUGEPAGES_DEFAULT_SIZE: 1G
      HUGEPAGES_PAGES: '[{"count": 1, "size": "1G"}, {"count": 128, "size": "2M"}]'
      LABEL_FILTER: tier-0
      LABELS: nto
      OCP_VERSION_RELEASE_AGE_MAX_DAYS: "7"
      RT_KERNEL: "true"
      VERSION: "4.23"
    test:
    - ref: telcov10n-functional-cnf-compute-nto-eco-gotests
    workflow: telcov10n-functional-cnf-compute-nto-ocp-setup
zz_generated_metadata:
  branch: main
  org: openshift-kni
  repo: eco-ci-cd
  variant: cnf-compute-nto-nightly
