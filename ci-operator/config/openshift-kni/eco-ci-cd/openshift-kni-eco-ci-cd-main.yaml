base_images:
  base:
    name: ubi
    namespace: ocp
    tag: "9"
build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-9-release-golang-1.23-openshift-4.19
images:
  items:
  - dockerfile_path: Containerfile
    from: base
    to: eco-ci-cd
promotion:
  to:
  - name: eco-ci-cd
    namespace: telcov10n-ci
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: collect-metrics-test
  run_if_changed: ^playbooks/roles/collect_metrics/
  steps:
    test:
    - ref: telcov10n-functional-eco-ci-cd-tests-collect-metrics
- as: container-image-mirror-test
  run_if_changed: ^playbooks/roles/container_image_mirror/
  steps:
    test:
    - ref: telcov10n-functional-eco-ci-cd-tests-container-image-mirror
- as: ocp-operator-deployment-test
  run_if_changed: ^playbooks/roles/ocp_operator_deployment/
  steps:
    test:
    - ref: telcov10n-functional-eco-ci-cd-tests-ocp-operator-deployment
- as: ocp-version-facts-unit-tests
  run_if_changed: ^playbooks/roles/ocp_version_facts/
  steps:
    test:
    - ref: telcov10n-functional-eco-ci-cd-tests-ocp-version-facts
zz_generated_metadata:
  branch: main
  org: openshift-kni
  repo: eco-ci-cd
