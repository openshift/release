build_root:
  image_stream_tag:
    name: eco-ci-cd
    namespace: telcov10n-ci
    tag: eco-ci-cd
prowgen:
  enable_secrets_store_csi_driver: false
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: cnf-mno-arm-tests
  capabilities:
  - intranet
  cron: 0 0 31 2 *
  steps:
    env:
      CLUSTER_NAME: kni-qe-130
      SPOKE_ARCH: multi
      SPOKE_CLUSTER_NAME: kni-qe-131
      VERSION: "4.22"
      ZTP_GIT_BRANCH: arm_mno
    workflow: telcov10n-functional-cnf-ran-mno-arm
zz_generated_metadata:
  branch: main
  org: openshift-kni
  repo: eco-ci-cd
  variant: arm-mno-4.22
