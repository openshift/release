  steps:
    env:
      HUB_CLUSTER: hub-name
      REPORTING_SETTINGS: |-
        {
          "generate_report": {
            "skip": false
          }
        }
      SPOKE_CLUSTER: spoke-name
      TEST_SETTINGS: |-
        {
          "oslat": {
            "skip": false
          }
        }
    post:
    - ref: telcov10n-system-telco-kpis-reporting-generate-report
    pre:
    - ref: telcov10n-system-telco-kpis-common-functions-generator
    test:
    - ref: telcov10n-system-telco-kpis-tests-run-oslat-test
