            "report_headline": "SPR-EE {{ arch }} SNO {{ ocp_version }} - 1hr Baseline Stable lane"
          },
          "bios_validation": {
            "lockdown_uri": "https://gitlab.cee.redhat.com/ran/dev-kpi-pipeline/-/raw/prow-lockdowns/spoke/defaults/lockdown-spoke-4.21-x86_64-baseline.json",
            "bios_profile_path": "dell/bios-profile.yaml"
          },
          "cpu_util": {
            "skip": false,
            "baseline": true,
            "duration": "1h"
          }
        }
