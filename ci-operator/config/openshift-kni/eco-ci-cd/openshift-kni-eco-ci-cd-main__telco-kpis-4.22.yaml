build_root:
  project_image:
    dockerfile_literal: |
      FROM quay.io/ccardenosa/eco-ci-cd:latest
      RUN chmod -R g+w /eco-ci-cd/inventories
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 200m
      memory: 300Mi
tests:
- as: dev-kpi-01-ztp-infra
  capabilities:
  - intranet
  cron: 0 6 31 2 *
  reporter_config:
    channel: '#proj-dev-kpi-triage'
    job_states_to_report:
    - failure
    - error
    - success
    - aborted
    report_template: '{{if eq .Status.State "success"}} :slack-green: Job *{{.Spec.Job}}*
      ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs> {{else}} :failed:
      Job *{{.Spec.Job}}* ended with *{{.Status.State}}*. <{{.Status.URL}}|View logs>
      {{end}}'
  steps:
    env:
      HUB_CLUSTER: dev-kpi-01
      INFRA_SETTINGS: |-
        {
          "deploy_sno_hub": {
            "hub_lockdown_uri": "https://gitlab.cee.redhat.com/ran/dev-kpi-pipeline/-/raw/prow-lockdowns/hub/defaults/lockdown-hub-4.21-x86_64.json"
          },
          "install_hub_operators": {
            "hub_lockdown_uri": "https://gitlab.cee.redhat.com/ran/dev-kpi-pipeline/-/raw/prow-lockdowns/hub/defaults/lockdown-hub-4.21-x86_64.json"
          },
