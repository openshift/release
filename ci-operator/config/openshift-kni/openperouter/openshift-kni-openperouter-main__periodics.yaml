base_images:
  rebasebot:
    name: rebasebot
    namespace: ci
    tag: latest
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: rebasebot
  cron: 0 10,14 * * Mon-Fri
  steps:
    test:
    - as: rebasebot
      commands: |
        rebasebot --source https://github.com/openperouter/openperouter:main \
                  --dest openshift-kni/openperouter:main \
                  --rebase openshift-kni/openperouter:merge-bot-sync-main \
                  --sync-mode merge \
                  --github-app-id 173683198 \
                  --github-app-key /secrets/rebasebot/openshift-rebasebot-key \
                  --github-cloner-id 173683198 \
                  --github-cloner-key /secrets/rebasebot/openshift-rebasebot-key \
                  --git-username "openshift-rebasebot[bot]" \
                  --git-email 289950310+openshift-rebasebot[bot]@users.noreply.github.com
      credentials:
      - mount_path: /secrets/rebasebot
        name: rebasebot-credentials
        namespace: test-credentials
      from_image:
        name: rebasebot
        namespace: ci
        tag: latest
      resources:
        limits:
          memory: 12Gi
        requests:
          cpu: 800m
          memory: 2Gi
zz_generated_metadata:
  branch: main
  org: openshift-kni
  repo: openperouter
  variant: periodics
