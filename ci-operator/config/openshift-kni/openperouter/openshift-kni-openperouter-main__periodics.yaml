base_images:
  rebasebot:
    name: rebasebot
    namespace: ci
    tag: latest
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: rebasebot
  cron: 42 22 * * Mon-Fri
  steps:
    test:
    - as: rebasebot
      commands: |
        rebasebot --source https://github.com/openperouter/openperouter:main \
                  --dest openshift-kni/openperouter:main \
                  --post-rebase-hook git:https://github.com/zeeke/openperouter/ds/rebase-bot-hooks:openshift/rebasebot/update_go_modules.sh \
                  --rebase openshift-kni/openperouter:merge-bot-sync-main \
                  --github-app-id 5439243 \
                  --github-app-key /secrets/rebasebot/gh-rebasebot-app-key \
                  --github-cloner-id 5439243 \
                  --github-cloner-key /secrets/rebasebot/gh-rebasebot-app-key \
                  --git-username "openperouter-rebasebot-placeholder[bot]" \
                  --git-email "346813417+openperouter-rebasebot-placeholder[bot]@users.noreply.github.com" \
                  --sync-mode merge
      credentials:
      - collection: openperouter-rebasebot-credentials
        group: telco-5g-maintainers-konflux
        mount_path: /secrets/rebasebot
      from_image:
        name: rebasebot
        namespace: ci
        tag: latest
      resources:
        limits:
          memory: 4Gi
        requests:
          cpu: 100m
          memory: 200Mi
zz_generated_metadata:
  branch: main
  org: openshift-kni
  repo: openperouter
  variant: periodics
