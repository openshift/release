base_images:
  base:
    name: ubi-minimal
    namespace: ocp
    tag: "9"
  tls-scanner-tool:
    name: tls-scanner
    namespace: tls-scanner
    tag: tls-scanner-tool
build_root:
  from_repository: true
images:
  items:
  - build_args:
    - name: COVER
      value: "true"
    dockerfile_path: Dockerfile
    from: base
    to: cluster-group-upgrades-operator
  - dockerfile_path: Dockerfile.precache
    from: base
    to: cluster-group-upgrades-operator-precache
  - dockerfile_path: bundle.Dockerfile
    to: cluster-group-upgrades-operator-bundle
  skip_if_only_changed: ^(?:.*/)?(?:\.gitignore|\.tekton/.*|\.konflux/.*|.*\.md|OWNERS|OWNERS_ALIASES|LICENSE|renovate\.json)$
operator:
  bundles:
  - dockerfile_path: bundle.Dockerfile
  substitutions:
  - pullspec: quay.io/openshift-kni/cluster-group-upgrades-operator:.*
    with: pipeline:cluster-group-upgrades-operator
promotion:
  to:
  - name: "5.1"
    namespace: ocp-kni
releases:
  initial:
    integration:
      name: "5.1"
      namespace: ocp
      reference_policy: Local
  latest:
    integration:
      include_built_images: true
      name: "5.1"
      namespace: ocp
      reference_policy: Local
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: ci-job
  commands: |
    unset VERSION
    export XDG_CACHE_HOME=/tmp/.cache
    export XDG_CONFIG_HOME=/tmp/.config
    export XDG_DATA_HOME=/tmp/.local/share
    make ci-job
    make coveralls-download
    export COVERALLS_REPO_TOKEN=$(cat /etc/coveralls/TOKEN)
    ./bin/coveralls report --no-fail --job-flag "unit-tests" --build-number=$(git rev-parse HEAD) coverage.out
  container:
    from: src
  secrets:
  - collection: coverage-ran
    group: cluster-group-upgrades-operator-coverall-ci
    mount_path: /etc/coveralls
  skip_if_only_changed: ^(?:.*/)?(?:\.gitignore|\.tekton/.*|\.konflux/.*|.*\.md|OWNERS|OWNERS_ALIASES|LICENSE|renovate\.json)$
- as: integration
  skip_if_only_changed: ^(?:.*/)?(?:\.gitignore|\.tekton/.*|\.konflux/.*|.*\.md|OWNERS|OWNERS_ALIASES|LICENSE|renovate\.json)$
  steps:
    cluster_profile: aws-telco
    env:
      BASE_DOMAIN: telco5g-ci.devcluster.openshift.com
      OO_CHANNEL: alpha
      OO_INSTALL_NAMESPACE: openshift-cluster-group-upgrades
      OO_PACKAGE: cluster-group-upgrades-operator
      OO_TARGET_NAMESPACES: '!all'
      USER_TAGS: |
        ci-job-source prowci
        ci-job-branch main
        ci-job-fullname openshift-kni-cluster-group-upgrades-operator-main
        ci-job-type optional-operators-ci-aws
        ci-repo-name cluster-group-upgrades-operator
        ci-org-name openshift-kni
    pre:
    - chain: ipi-aws-pre
    - as: pre
      cli: latest
      commands: |
        KUBECONFIG="${SHARED_DIR}/kubeconfig"
        export KUBECONFIG
        cp $(echo "${KUBECONFIG}") /go/src/github.com/openshift-kni/cluster-group-upgrades-operator/kubeconfig
        make non-kind-deps-update
        make install-acm-crds
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: optional-operators-subscribe
    test:
    - as: integration
      cli: latest
      commands: |
        KUBECONFIG="${SHARED_DIR}/kubeconfig"
        export KUBECONFIG
        cp $(echo "${KUBECONFIG}") /go/src/github.com/openshift-kni/cluster-group-upgrades-operator/kubeconfig
        ./hack/add-sidecar-csv.sh
        sleep 60
        make complete-kuttl-test
        ./hack/extract-coverage.sh
        sed -i 's/\/workspace/\./g' ./runtime-coverage/coverage.out
        make coveralls-download
        export COVERALLS_REPO_TOKEN=$(cat /etc/coveralls/TOKEN)
        ./bin/coveralls report --job-flag "integration-tests" --build-number=$(git rev-parse HEAD) ./runtime-coverage/coverage.out
      credentials:
      - collection: coverage-ran
        group: cluster-group-upgrades-operator-coverall
        mount_path: /etc/coveralls
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: optional-operators-ci-aws
- as: security
  optional: true
  skip_if_only_changed: ^(?:.*/)?(?:\.gitignore|\.tekton/.*|\.konflux/.*|.*\.md|OWNERS|OWNERS_ALIASES|LICENSE|renovate\.json)$
  steps:
    env:
      PROJECT_NAME: cluster-group-upgrades-operator
      SNYK_CODE_ADDITIONAL_ARGS: --severity-threshold=high
    workflow: openshift-ci-security
- always_run: false
  as: tls-scan
  optional: true
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_INDEX: ci-index
    env:
      OO_CHANNEL: alpha
      OO_INSTALL_NAMESPACE: openshift-cluster-group-upgrades
      OO_PACKAGE: cluster-group-upgrades-operator
      OO_TARGET_NAMESPACES: '!all'
      PQC_CHECK: "true"
      SCAN_NAMESPACE: openshift-cluster-group-upgrades
      SCANNER_CPU: "2"
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    pre:
    - chain: ipi-aws-pre
    - as: install-acm-crds
      cli: latest
      commands: |
        KUBECONFIG="${SHARED_DIR}/kubeconfig"
        export KUBECONFIG
        cp $(echo "${KUBECONFIG}") /go/src/github.com/openshift-kni/cluster-group-upgrades-operator/kubeconfig
        make non-kind-deps-update
        make install-acm-crds
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: optional-operators-subscribe
    test:
    - ref: tls-13
    - as: wait-talm-tls-restart
      cli: latest
      commands: |
        echo "Waiting for TALM operator to restart after TLS profile change..."
        oc rollout status deployment cluster-group-upgrades-controller-manager-v2 -n openshift-cluster-group-upgrades --timeout=300s
        echo "TALM operator restarted with new TLS profile"
        oc get pods -n openshift-cluster-group-upgrades
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: tls-scanner-run
    workflow: optional-operators-ci-aws
- as: tls-scan-periodic
  cron: 0 3 * * 5
  reporter_config:
    channel: '#telco-platform-alerts'
    job_states_to_report:
    - failure
    - error
    report_template: '@channel Job *{{.Spec.Job}}* failed. <{{.Status.URL}}|View logs>'
  steps:
    cluster_profile: openshift-org-aws
    dependencies:
      OO_INDEX: ci-index
    env:
      OO_CHANNEL: alpha
      OO_INSTALL_NAMESPACE: openshift-cluster-group-upgrades
      OO_PACKAGE: cluster-group-upgrades-operator
      OO_TARGET_NAMESPACES: '!all'
      PQC_CHECK: "true"
      SCAN_NAMESPACE: openshift-cluster-group-upgrades
      SCANNER_CPU: "2"
      TLS_13_ENABLE_TLS_ADHERENCE: "true"
      TLS_13_TLS_ADHERENCE_POLICY: StrictAllComponents
    pre:
    - chain: ipi-aws-pre
    - as: install-acm-crds
      cli: latest
      commands: |
        KUBECONFIG="${SHARED_DIR}/kubeconfig"
        export KUBECONFIG
        cp $(echo "${KUBECONFIG}") /go/src/github.com/openshift-kni/cluster-group-upgrades-operator/kubeconfig
        make non-kind-deps-update
        make install-acm-crds
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: optional-operators-subscribe
    test:
    - ref: tls-13
    - as: wait-talm-tls-restart
      cli: latest
      commands: |
        echo "Waiting for TALM operator to restart after TLS profile change..."
        oc rollout status deployment cluster-group-upgrades-controller-manager-v2 -n openshift-cluster-group-upgrades --timeout=300s
        echo "TALM operator restarted with new TLS profile"
        oc get pods -n openshift-cluster-group-upgrades
      from: cli
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    - ref: tls-scanner-run
    workflow: optional-operators-ci-aws
zz_generated_metadata:
  branch: main
  org: openshift-kni
  repo: cluster-group-upgrades-operator
