build_root:
  project_image:
    dockerfile_path: .ci/openshift-ci/Dockerfile
images:
  items:
  - dockerfile_path: build/dockerfiles/Dockerfile
    to: che-dashboard-image
releases:
  latest:
    candidate:
      architecture: multi
      product: ocp
      stream: nightly
      version: "4.22"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- as: dashboard-happy-path
  steps:
    cluster_profile: che-aws
    env:
      BASE_DOMAIN: crw-qe.com
      HYPERSHIFT_AWS_REGION: us-east-1
      HYPERSHIFT_NODE_COUNT: "2"
    test:
    - as: test
      cli: latest
      commands: /bin/bash .ci/oci-dashboard-happy-path.sh
      dependencies:
      - env: CI_CHE_DASHBOARD_IMAGE
        name: che-dashboard-image
      from: src
      resources:
        requests:
          cpu: 100m
          memory: 200Mi
    workflow: hypershift-hostedcluster-workflow
zz_generated_metadata:
  branch: 7.115.x
  org: eclipse-che
  repo: che-dashboard
  variant: v22
