build_root:
  from_repository: true
prowgen:
  enable_secrets_store_csi_driver: true
resources:
  '*':
    requests:
      cpu: "2"
      memory: 4Gi
tests:
- as: unit
  steps:
    test:
    - as: unit-steps
      commands: scripts/openshiftci-presubmit-unittests.sh
      from: src
      resources:
        requests:
          cpu: "2"
          memory: 4Gi
zz_generated_metadata:
  branch: master
  org: redhat-developer
  repo: gitops-backend
