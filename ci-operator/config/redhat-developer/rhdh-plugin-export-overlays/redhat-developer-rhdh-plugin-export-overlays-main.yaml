build_root:
  image_stream_tag:
    name: release
    namespace: openshift
    tag: rhel-8-release-golang-1.22-openshift-4.18
prowgen:
  enable_secrets_store_csi_driver: true
releases:
  latest:
    release:
      architecture: amd64
      channel: stable
      version: "4.20"
resources:
  '*':
    limits:
      memory: 4Gi
    requests:
      cpu: 100m
      memory: 200Mi
tests:
- always_run: false
  as: e2e-ocp-helm-osl-rc
  cluster_claim:
    architecture: amd64
    cloud: aws
    labels:
      region: us-east-2
    owner: rhdh
    product: ocp
    timeout: 2h0m0s
    version: "4.20"
  max_concurrency: 1
  optional: true
  steps:
    allow_skip_on_success: true
    env:
      MUST_GATHER_KEEP_UNPACKED: "true"
    post:
    - ref: gather-must-gather
    test:
    - ref: redhat-developer-rhdh-plugin-export-overlays-ocp-helm-osl-rc
    workflow: generic-claim
- as: e2e-ocp-helm-osl-rc-gangway
