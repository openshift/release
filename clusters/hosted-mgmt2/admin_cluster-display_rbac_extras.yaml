---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: cluster-display
  namespace: hypershift
rules:
  - apiGroups:
    - ""
    resources:
    - configmaps
    resourceNames:
    - supported-versions
    verbs:
    - get
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: cluster-display
  namespace: hypershift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-display
subjects:
- kind: ServiceAccount
  name: cluster-display
  namespace: ci
