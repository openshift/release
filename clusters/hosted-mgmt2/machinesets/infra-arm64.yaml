apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  annotations:
    capacity.cluster-autoscaler.kubernetes.io/labels: kubernetes.io/arch=arm64
    machine.openshift.io/GPU: "0"
    machine.openshift.io/memoryMb: "16384"
    machine.openshift.io/vCPU: "4"
  labels:
    machine.openshift.io/cluster-api-cluster: hosted-mgmt2-c6fv6
  name: hosted-mgmt2-c6fv6-infra-us-east-2a
  namespace: openshift-machine-api
spec:
  replicas: 1
  selector:
    matchLabels:
      machine.openshift.io/cluster-api-cluster: hosted-mgmt2-c6fv6
      machine.openshift.io/cluster-api-machineset: hosted-mgmt2-c6fv6-infra-us-east-2a
  template:
    metadata:
      labels:
        machine.openshift.io/cluster-api-cluster: hosted-mgmt2-c6fv6
        machine.openshift.io/cluster-api-machine-role: infra
        machine.openshift.io/cluster-api-machine-type: infra
        machine.openshift.io/cluster-api-machineset: hosted-mgmt2-c6fv6-infra-us-east-2a
    spec:
      lifecycleHooks: {}
      metadata:
        labels:
          node-role.kubernetes.io: infra
          node-role.kubernetes.io/infra: ""
      providerSpec:
        value:
          ami:
            id: ami-017020cb8aeeda203
          apiVersion: machine.openshift.io/v1beta1
          blockDevices:
          - ebs:
              encrypted: true
              iops: 0
              kmsKey:
                arn: ""
              volumeSize: 120
              volumeType: gp3
          capacityReservationId: ""
          credentialsSecret:
            name: aws-cloud-credentials
          deviceIndex: 0
          iamInstanceProfile:
            id: hosted-mgmt2-c6fv6-worker-profile
          instanceType: m6g.xlarge
          kind: AWSMachineProviderConfig
          placement:
            availabilityZone: us-east-2a
            region: us-east-2
          publicIp: true
          securityGroups:
          - filters:
            - name: tag:Name
              values:
              - hosted-mgmt2-c6fv6-node
          - filters:
            - name: tag:Name
              values:
              - hosted-mgmt2-c6fv6-lb
          subnet:
            id: subnet-0797601fb57026294
          tags:
          - name: kubernetes.io/cluster/hosted-mgmt2-c6fv6
            value: owned
          userDataSecret:
            name: worker-user-data
      taints:
      - effect: NoSchedule
        key: node-role.kubernetes.io/infra
        value: reserved
