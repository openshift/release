apiVersion: machine.openshift.io/v1beta1
kind: MachineSet
metadata:
  name: hypershift-c6fv6-worker-us-east-2a
  namespace: openshift-machine-api
spec:
  selector:
    matchLabels:
      kubernetes.io/arch: arm64
      machineset-role: hypershift
  template:
    metadata:
      labels:
        kubernetes.io/arch: arm64
        machine.openshift.io/cluster-api-machine-role: worker
        machine.openshift.io/cluster-api-machine-type: worker
        machineset-role: hypershift
    spec:
      lifecycleHooks: {}
      metadata:
        labels:
          hypershift.openshift.io/control-plane: "true"
      providerSpec:
        value:
          ami:
            id: ami-0b24ccaf1c9bb50e5
          apiVersion: machine.openshift.io/v1beta1
          blockDevices:
          - ebs:
              encrypted: true
              iops: 0
              kmsKey:
                arn: ""
              volumeSize: 120
              volumeType: gp3
          capacityReservationId: ""
          credentialsSecret:
            name: aws-cloud-credentials
          deviceIndex: 0
          iamInstanceProfile:
            id: hosted-mgmt2-c6fv6-worker-profile
          instanceType: m6g.4xlarge
          kind: AWSMachineProviderConfig
          placement:
            availabilityZone: us-east-2a
            region: us-east-2
          publicIp: true
          securityGroups:
          - filters:
            - name: tag:Name
              values:
              - hosted-mgmt2-c6fv6-node
          - filters:
            - name: tag:Name
              values:
              - hosted-mgmt2-c6fv6-lb
          subnet:
            id: subnet-0797601fb57026294
          tags:
          - name: kubernetes.io/cluster/hosted-mgmt2-c6fv6
            value: owned
          userDataSecret:
            name: worker-user-data
      taints:
      - effect: NoSchedule
        key: hypershift.openshift.io/control-plane
        value: "true"
