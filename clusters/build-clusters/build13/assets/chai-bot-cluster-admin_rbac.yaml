---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chai-bot-cluster-admin
  namespace: ci
---
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: chai-bot-cluster-admin-token
  namespace: ci
  annotations:
    kubernetes.io/service-account.name: chai-bot-cluster-admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chai-bot-cluster-admin-no-secrets
  annotations:
    openshift.io/description: >-
      Near cluster-admin for chai-bot on build13. Secret and ServiceAccount access
      is denied by ValidatingAdmissionPolicy chai-bot-deny-secrets-and-serviceaccounts.
rules:
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - '*'
- nonResourceURLs:
  - '*'
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chai-bot-cluster-admin-no-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: chai-bot-cluster-admin-no-secrets
subjects:
- kind: ServiceAccount
  name: chai-bot-cluster-admin
  namespace: ci
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: chai-bot-deny-secrets-and-serviceaccounts
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ""
      apiVersions:
      - "*"
      operations:
      - "*"
      resources:
      - secrets
      - secrets/*
      - serviceaccounts
      - serviceaccounts/*
  validations:
  - expression: "request.userInfo.username != 'system:serviceaccount:ci:chai-bot-cluster-admin'"
    message: chai-bot-cluster-admin is not allowed to access Secrets or ServiceAccounts
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: chai-bot-deny-secrets-and-serviceaccounts
spec:
  policyName: chai-bot-deny-secrets-and-serviceaccounts
  validationActions:
    - Deny
  matchResources: {}
