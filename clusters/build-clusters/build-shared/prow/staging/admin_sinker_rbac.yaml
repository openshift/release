apiVersion: v1
kind: ServiceAccount
metadata:
  name: sinker
  namespace: ci-staging
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sinker
  namespace: ci-staging
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - delete
      - list
      - watch
      - get
      - patch
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: sinker
  namespace: ci-staging
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sinker
subjects:
- kind: ServiceAccount
  name: sinker
---
apiVersion: v1
kind: Secret
metadata:
  name: sinker-token
  namespace: ci-staging
  annotations:
    kubernetes.io/service-account.name: sinker
type: kubernetes.io/service-account-token
