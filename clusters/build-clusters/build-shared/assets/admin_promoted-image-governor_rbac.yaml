---
kind: ServiceAccount
apiVersion: v1
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  annotations:
    openshift.io/description: This SA is used to run promoted-image-governor
  name: promoted-image-governor
  namespace: ci
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: promoted-image-governor
rules:
- apiGroups:
  - image.openshift.io
  resources:
  - imagestreams
  verbs:
  - get
  - list
- apiGroups:
  - image.openshift.io
  resources:
  - imagestreamtags
  verbs:
  - delete
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: promoted-image-governor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promoted-image-governor
subjects:
- kind: ServiceAccount
  name: promoted-image-governor
  namespace: ci
