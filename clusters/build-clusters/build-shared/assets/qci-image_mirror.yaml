---
apiVersion: config.openshift.io/v1
kind: ImageDigestMirrorSet
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: quay-proxy
spec:
  imageDigestMirrors:
  - mirrors:
    - quay.io/openshift/ci
    source: quay-proxy.ci.openshift.org/openshift/ci
---
apiVersion: config.openshift.io/v1
kind: ImageTagMirrorSet
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: quay-proxy
spec:
  imageTagMirrors:
  - mirrors:
    - quay.io/openshift/ci
    source: quay-proxy.ci.openshift.org/openshift/ci
