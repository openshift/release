apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  # If CA scales these down, the test will get restarted, delaying signal
  name: prow-pods
  namespace: ci
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      created-by-prow: "true"
