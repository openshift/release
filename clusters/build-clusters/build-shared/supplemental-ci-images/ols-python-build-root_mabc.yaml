apiVersion: ci.openshift.io/v1
kind: MultiArchBuildConfig
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: ols-python-build-root
  namespace: ci
spec:
  external_registries:
  - quay.io/openshift/ci
  build_spec:
    successfulBuildsHistoryLimit: 1
    failedBuildsHistoryLimit: 2
    output:
      pushSecret:
        name: registry-push-credentials-ci-images-mirror
      to:
        kind: ImageStreamTag
        namespace: ocp
        name: ols-python-build-root:python-3.12
    source:
      dockerfile: |
        FROM registry.access.redhat.com/ubi9/python-312
        USER 0
        RUN dnf install -y --nodocs make git curl findutils && dnf clean all
        RUN pip install --no-cache-dir uv==0.9.24
      type: Dockerfile
    strategy:
      dockerStrategy:
        from:
          kind: DockerImage
          name: registry.access.redhat.com/ubi9/python-312
        imageOptimizationPolicy: SkipLayers
      type: Docker
