apiVersion: ci.openshift.io/v1
kind: MultiArchBuildConfig
metadata:
  name: cli-yq
  namespace: ci
spec:
  external_registries:
  - quay.io/openshift/ci
  build_spec:
    successfulBuildsHistoryLimit: 1
    failedBuildsHistoryLimit: 2
    output:
      pushSecret:
        name: registry-push-credentials-ci-images-mirror
      to:
        kind: ImageStreamTag
        namespace: ocp
        name: cli-yq:latest
    source:
      dockerfile: |
        FROM registry.ci.openshift.org/ocp-multi/4.22.0:cli
        RUN ARCH=$(uname -m) && \
            case "$ARCH" in \
                x86_64) ARCH='amd64' ;; \
                aarch64) ARCH='arm64' ;; \
                *) echo "Unsupported architecture: $ARCH" && exit 1 ;; \
            esac && \
            curl --fail --retry 3 -L https://github.com/mikefarah/yq/releases/latest/download/yq_linux_${ARCH} -o /usr/local/bin/yq && chmod +x /usr/local/bin/yq
        RUN yum install -y jq
      type: Dockerfile
    strategy:
      dockerStrategy:
        from:
          kind: DockerImage
          name: registry.ci.openshift.org/ocp-multi/4.22.0:cli
        imageOptimizationPolicy: SkipLayers
      type: Docker
