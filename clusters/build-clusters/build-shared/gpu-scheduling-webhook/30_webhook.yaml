apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  creationTimestamp: null
  name: gpu-scheduling
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
webhooks:
- admissionReviewVersions:
  - v1
  sideEffects: None
  clientConfig:
    service:
      name: gpu-scheduling-webhook
      namespace: gpu-scheduling-webhook
      path: /mutate--v1-pod
  name: gpu-scheduling.ci.openshift.io
  rules:
  - apiGroups:
    - ""
    apiVersions:
    - v1
    operations:
    - CREATE
    - UPDATE
    resources:
    - pods
  objectSelector:
    matchExpressions:
    - key: "ci.openshift.io/gpu-scheduling-webhook"
      operator: DoesNotExist
      values: []
  matchConditions:
  # Keep device-specific decisions in the webhook. Any qualified resource is
  # a safe superset of the GPU and KVM resources it currently handles.
  - name: uses-extended-resource
    expression: >-
      object.spec.containers.exists(c,
        has(c.resources) &&
        ((has(c.resources.requests) &&
          c.resources.requests.exists(r, r.contains('/'))) ||
         (has(c.resources.limits) &&
          c.resources.limits.exists(r, r.contains('/'))))) ||
      (has(object.spec.initContainers) &&
       object.spec.initContainers.exists(c,
         has(c.resources) &&
         ((has(c.resources.requests) &&
           c.resources.requests.exists(r, r.contains('/'))) ||
          (has(c.resources.limits) &&
           c.resources.limits.exists(r, r.contains('/'))))))
