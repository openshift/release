apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
    gcp-project: openshift-ci-infra
  name: console-tls
  namespace: openshift-config
spec:
  dnsNames:
  - console.core.ci.openshift.org
  issuerRef:
    name: cert-issuer
    kind: ClusterIssuer
  secretName: console-tls
