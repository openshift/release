apiVersion: v1
kind: ServiceAccount
metadata:
  name: chai-bot
  namespace: ship-status
  labels:
    ci.openshift.io/gitops-managed: 'true'
    app: dashboard
---
apiVersion: v1
kind: Secret
metadata:
  name: chai-bot-token-version-2
  namespace: ship-status
  annotations:
    kubernetes.io/service-account.name: chai-bot
  labels:
    ci.openshift.io/gitops-managed: 'true'
    ci.openshift.io/non-expiring-token: "true"
    ci.openshift.io/token-version: version-2
    app: dashboard
type: kubernetes.io/service-account-token
