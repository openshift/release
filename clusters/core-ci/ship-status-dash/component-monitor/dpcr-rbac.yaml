apiVersion: v1
kind: ServiceAccount
metadata:
  name: dpcr-component-monitor
  namespace: ship-status
---
apiVersion: v1
kind: Secret
metadata:
  annotations:
    kubernetes.io/service-account.name: dpcr-component-monitor
  labels:
    ci.openshift.io/non-expiring-token: "true"
    ci.openshift.io/token-version: version-0
  ### we have to use a different name for expiring the existing token
  name: dpcr-component-monitor-token-version-0
  namespace: ship-status
type: kubernetes.io/service-account-token
---
# oauth-proxy SAR requires get namespaces (same as mcp-server / chai-bot)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ship-status-dpcr-component-monitor
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ship-status-dpcr-component-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ship-status-dpcr-component-monitor
subjects:
- kind: ServiceAccount
  name: dpcr-component-monitor
  namespace: ship-status
