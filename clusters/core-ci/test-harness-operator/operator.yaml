---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    keel.sh/matchTag: "true"
    keel.sh/policy: force
    keel.sh/pollSchedule: "@every 5m"
    keel.sh/trigger: poll
  labels:
    app: test-harness-operator
  name: test-harness-operator
  namespace: test-harness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-harness-operator
  template:
    metadata:
      labels:
        app: test-harness-operator
    spec:
      containers:
      - args:
        - --namespace=test-harness
        - --gcs-bucket=test-harness-operator
        - --gcs-credentials-secret=/etc/test-harness-gcs-credentials/service-account.json
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_test-harness-operator_test-harness-operator
        imagePullPolicy: Always
        name: test-harness-operator
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        volumeMounts:
        - mountPath: /etc/test-harness-gcs-credentials
          name: test-harness-gcs-credentials
          readOnly: true
      nodeSelector:
        kubernetes.io/arch: amd64
      serviceAccountName: test-harness-operator
      volumes:
      - name: test-harness-gcs-credentials
        secret:
          secretName: test-harness-gcs-credentials
