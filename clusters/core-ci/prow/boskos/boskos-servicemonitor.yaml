apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: prow
    component: boskos
    prow-app: boskos
    app.kubernetes.io/managed-by: custom-prometheus-operator
  name: boskos
  namespace: ci
spec:
  endpoints:
  - interval: 30s
    port: metrics
    scheme: http
  selector:
    matchLabels:
      app: prow
      component: boskos
