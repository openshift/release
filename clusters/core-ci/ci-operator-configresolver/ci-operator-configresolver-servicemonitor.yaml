apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ci-operator-configresolver
  namespace: ci
  labels:
    ci.openshift.io/gitops-managed: 'true'
    app: prow
    component: ci-operator-configresolver
    prow-app: ci-operator-configresolver
    app.kubernetes.io/managed-by: custom-prometheus-operator
spec:
  endpoints:
  - interval: 30s
    port: metrics
    scheme: http
  selector:
    matchLabels:
      app: prow
      component: ci-operator-configresolver
