apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: slack-bot-group-reader
rules:
- apiGroups:
  - user.openshift.io
  resources:
  - groups
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: slack-bot-alpha-group-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: slack-bot-group-reader
subjects:
- kind: ServiceAccount
  name: slack-bot-alpha
  namespace: ci
