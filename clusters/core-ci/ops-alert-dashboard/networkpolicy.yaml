apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ops-alert-dashboard
  namespace: ci
spec:
  podSelector:
    matchLabels:
      app: ops-alert-dashboard
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          policy-group.network.openshift.io/ingress: ""
    ports:
    - protocol: TCP
      port: 8443
