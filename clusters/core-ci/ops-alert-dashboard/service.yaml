apiVersion: v1
kind: Service
metadata:
  name: ops-alert-dashboard
  namespace: ci
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: ops-alert-dashboard-tls
spec:
  selector:
    app: ops-alert-dashboard
  ports:
  - name: https
    port: 443
    targetPort: https
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ops-alert-dashboard
  namespace: ci
spec:
  host: ops-alerts.apps.core.ci.devcluster.openshift.com
  to:
    kind: Service
    name: ops-alert-dashboard
  port:
    targetPort: https
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
