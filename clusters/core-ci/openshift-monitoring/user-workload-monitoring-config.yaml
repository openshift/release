apiVersion: v1
data:
  config.yaml: |
    prometheus:
      externalLabels:
        clusterName: uwm-core-ci
      remoteWrite:
        - url: "https://thanos-receive.core.ci.devcluster.openshift.com:19291/api/v1/receive"
          queueConfig:
            sampleAgeLimit: 10m
          tlsConfig:
            ca:
              secret:
                name: thanos-remote-write-tls
                key: ca.crt
            cert:
              secret:
                name: thanos-remote-write-tls
                key: client.crt
            keySecret:
              name: thanos-remote-write-tls
              key: client.key
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/managed-by: cluster-monitoring-operator
    app.kubernetes.io/part-of: openshift-monitoring
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
