apiVersion: v1
kind: Service
metadata:
  name: alertmanager-operated
  namespace: ci-monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    service.beta.openshift.io/serving-cert-secret-name: alertmanager-tls
  labels:
    operated-alertmanager: "true"
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
  - name: web
    port: 9093
    protocol: TCP
    targetPort: web
  - name: tcp-mesh
    port: 9094
    protocol: TCP
    targetPort: mesh-tcp
  - name: udp-mesh
    port: 9094
    protocol: UDP
    targetPort: mesh-udp
---
apiVersion: monitoring.coreos.com/v1
kind: Alertmanager
metadata:
  labels:
    app.kubernetes.io/managed-by: custom-prometheus-operator
  name: alertmanager
  namespace: ci-monitoring
spec:
  configSecret: alertmanager-ci-monitoring
  alertmanagerConfigMatcherStrategy:
    type: OnNamespace
  alertmanagerConfigNamespaceSelector:
    matchExpressions:
    - key: openshift.io/cluster-monitoring
      operator: NotIn
      values:
      - "true"
    - key: openshift.io/user-monitoring
      operator: NotIn
      values:
      - "false"
  alertmanagerConfigSelector:
    matchExpressions:
    - key: openshift.io/user-monitoring
      operator: NotIn
      values:
      - "false"
  listenLocal: false
  nodeSelector:
    kubernetes.io/os: linux
  portName: web
  replicas: 2
  resources:
    requests:
      cpu: 4m
      memory: 40Mi
    limits:
      cpu: 500m
      memory: 512Mi
  retention: 120h
  secrets:
  - alert-proxy-alertmanager-webhook
  serviceAccountName: alertmanager
  serviceName: alertmanager-operated
  web:
    tlsConfig:
      cert:
        secret:
          name: alertmanager-tls
          key: tls.crt
      keySecret:
        name: alertmanager-tls
        key: tls.key
  storage:
    volumeClaimTemplate:
      metadata: {}
      spec:
        resources:
          requests:
            storage: 10Gi
      status: {}
