apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pod-scaler-alerts
  namespace: ci
spec:
  groups:
  - name: ci-absent
    rules:
    - alert: pod-scaler-ui-Down
      annotations:
        ops_color: orange
        ops_category: ci_platform
        message: The service pod-scaler-ui has been down for 5 minutes.
      expr: |
        absent(up{job="pod-scaler-ui"} == 1)
      for: 5m
      keep_firing_for: 3m
      labels:
        severity: critical
    - alert: pod-scaler-producer-Singleton-Down
      annotations:
        ops_color: orange
        ops_category: ci_platform
        message: The service pod-scaler-producer has been down for 10 minutes.
      expr: |
        absent(up{job="pod-scaler-producer"} == 1)
      for: 10m
      keep_firing_for: 3m
      labels:
        severity: critical
