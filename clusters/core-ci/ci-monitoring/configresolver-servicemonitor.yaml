apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ci-operator-configresolver
  namespace: ci-monitoring
  labels:
    app: prow
    component: ci-operator-configresolver
    prow-app: ci-operator-configresolver
spec:
  endpoints:
  - interval: 30s
    port: metrics
    scheme: http
  namespaceSelector:
    matchNames:
    - ci
  selector:
    matchLabels:
      app: prow
      component: ci-operator-configresolver
