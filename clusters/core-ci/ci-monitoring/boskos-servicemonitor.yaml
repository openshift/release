apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: prow
    component: boskos
    prow-app: boskos
  name: boskos
  namespace: ci-monitoring
spec:
  endpoints:
  - interval: 30s
    port: metrics
    scheme: http
  selector:
    matchLabels:
      app: prow
      component: boskos
  namespaceSelector:
    matchNames:
    - ci
