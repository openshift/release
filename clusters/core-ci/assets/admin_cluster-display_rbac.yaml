---
kind: ServiceAccount
apiVersion: v1
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: cluster-display
  namespace: ci
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: cluster-display
rules:
- apiGroups:
  - 'config.openshift.io'
  resourceNames:
  - version
  resources:
  - clusterversions
  verbs:
  - get
- apiGroups:
  - 'config.openshift.io'
  resourceNames:
  - cluster
  resources:
  - infrastructures
  verbs:
  - get
- apiGroups:
  - 'route.openshift.io'
  resources:
  - routes
  verbs:
  - get
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: cluster-display
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-display
subjects:
- kind: ServiceAccount
  name: cluster-display
  namespace: ci
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: cluster-display
  namespace: openshift-monitoring
rules:
  - apiGroups:
    - ""
    resources:
    - services
    resourceNames:
    - configure-alertmanager-operator
    verbs:
    - get
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: cluster-display
  namespace: openshift-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cluster-display
subjects:
- kind: ServiceAccount
  name: cluster-display
  namespace: ci
