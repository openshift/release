apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: trt-aggregator-waiter
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: trt-aggregator-waiter
  namespace: ci
rules:
- apiGroups:
  - prow.k8s.io
  resources:
  - prowjobs
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: trt-aggregator-waiter
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: trt-aggregator-waiter
subjects:
- kind: ServiceAccount
  name: trt-aggregator-waiter
