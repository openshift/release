apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sync-rover-groups
  namespace: sync-rover-groups
spec:
  parameters:
    auth: provider-adc
    secrets: |-
      - resourceName: "projects/openshift-ci-secrets/secrets/test-platform-infra__ldap__username/versions/latest"
        fileName: "ldap-username.txt"
      - resourceName: "projects/openshift-ci-secrets/secrets/test-platform-infra__ldap__password/versions/latest"
        fileName: "ldap-password.txt"
  provider: gcp
