apiVersion: batch/v1
kind: CronJob
metadata:
  name: sync-rover-groups-update
  namespace: sync-rover-groups
spec:
  schedule: "0 1 * * *" # 1 AM every day
  jobTemplate:
    spec:
      template:
        spec:
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
          - name: sync-rover-groups-updater
            image: quay-proxy.ci.openshift.org/openshift/ci:ci_sync-rover-groups_latest
            imagePullPolicy: Always
            args:
            - -c
            - |
              set -xeuo pipefail
              git -C /tmp clone --depth 1 https://github.com/openshift/release.git
              export LDAP_DN="uid=$(cat /etc/ldap/ldap-username.txt),ou=users,dc=redhat,dc=com"
              sync-rover-groups --manifest-dir=/tmp/release/clusters --groups-file=/tmp/groups.yaml --config-file=/tmp/release/core-services/sync-rover-groups/_config.yaml --github-users-file=/tmp/users.yaml --log-level=debug --ldap-bind-dn=$LDAP_DN --ldap-bind-password-file=/etc/ldap/ldap-password.txt
              export KUBECONFIG=/etc/kube/sa.sync-rover-groups-updater.app.ci.config
              tar -czvf /tmp/users.yaml.tar.gz -C /tmp users.yaml
              oc create configmap sync-rover-groups -n ci --from-file=groups.yaml=/tmp/groups.yaml --from-file=users.yaml.tar.gz=/tmp/users.yaml.tar.gz --dry-run=client -o yaml | oc -n ci apply -f -
            command:
            - /bin/bash
            volumeMounts:
            - name: kube
              mountPath: "/etc/kube"
              readOnly: true
            - name: ldap
              mountPath: "/etc/ldap"
          restartPolicy: OnFailure
          volumes:
          - name: kube
            secret:
              secretName: sync-rover-groups-updater-credentials
          - name: ldap
            csi:
              driver: secrets-store.csi.k8s.io
              readOnly: true
              volumeAttributes:
                secretProviderClass: sync-rover-groups
