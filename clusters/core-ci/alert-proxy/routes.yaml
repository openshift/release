apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: alert-proxy-interactions
  namespace: ci
  labels:
    app: alert-proxy
spec:
  host: alert-proxy-ci.apps.master.ci.devcluster.openshift.com
  path: /interactions
  port:
    targetPort: main
  tls:
    insecureEdgeTerminationPolicy: None
    termination: edge
  to:
    kind: Service
    name: alert-proxy
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: alert-proxy-mentions
  namespace: ci
  labels:
    app: alert-proxy
spec:
  host: alert-proxy-ci.apps.master.ci.devcluster.openshift.com
  path: /mentions
  port:
    targetPort: main
  tls:
    insecureEdgeTerminationPolicy: None
    termination: edge
  to:
    kind: Service
    name: alert-proxy
