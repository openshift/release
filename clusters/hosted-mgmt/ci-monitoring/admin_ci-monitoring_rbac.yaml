---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  annotations:
    openshift.io/description: the service account having access to the openshift-monitoring stack
  name: ci-monitoring
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: ci-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-monitoring-view
subjects:
- kind: ServiceAccount
  name: ci-monitoring
  namespace: ci
