apiVersion: hive.openshift.io/v1
kind: ClusterPool
metadata:
  labels:
    architecture: amd64
    ci.openshift.io/gitops-managed: "true"
    cloud: aws
    owner: rhdh
    product: ocp
    region: us-east-2
    version: "5.0"
    version_lower: 5.0.0-0
    version_stream: 5-stable
    version_upper: 5.1.0-0
  name: rhdh-5-0-us-east-2
  namespace: rhdh-cluster-pool
spec:
  baseDomain: rhdh-qe.devcluster.openshift.com
  hibernationConfig:
    resumeTimeout: 30m0s
  imageSetRef:
    name: ocp-release-5.0.1-multi-for-5.0.0-0-to-5.1.0-0
  installAttemptsLimit: 1
  installConfigSecretTemplateRef:
    name: rhdh-aws-us-east-2
  labels:
    tp.openshift.io/owner: rhdh
  maxSize: 3
  platform:
    aws:
      credentialsSecretRef:
        name: rhdh-aws-credentials
      region: us-east-2
  pullSecretRef:
    name: pull-secret
  size: 0
  skipMachinePools: true
status:
  ready: 0
  size: 0
  standby: 0
