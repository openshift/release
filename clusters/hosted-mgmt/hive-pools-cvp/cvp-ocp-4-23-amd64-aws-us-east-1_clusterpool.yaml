apiVersion: hive.openshift.io/v1
kind: ClusterPool
metadata:
  labels:
    architecture: amd64
    cloud: aws
    owner: cvp
    product: ocp
    region: us-east-1
    version: "4.23"
    version_lower: 4.23.0-0
    version_stream: 4-dev-preview
    version_upper: 4.24.0-0
  name: cvp-ocp-4-23-amd64-aws-us-east-1
  namespace: cvp-cluster-pool
spec:
  baseDomain: cpaas-ci.devcluster.openshift.com
  hibernationConfig:
    resumeTimeout: 15m0s
  imageSetRef:
    name: ocp-release-4.23.0-ec.1-multi-for-4.23.0-0-to-4.24.0-0
  installAttemptsLimit: 1
  installConfigSecretTemplateRef:
    name: install-config-aws-us-east-1
  installerEnv:
  - name: OPENSHIFT_INSTALL_EXPERIMENTAL_DISABLE_IMAGE_POLICY
    value: "true"
  labels:
    tp.openshift.io/owner: cvp
  maxConcurrent: 2
  maxSize: 3
  platform:
    aws:
      credentialsSecretRef:
        name: cvp-aws-credentials
      region: us-east-1
  pullSecretRef:
    name: pull-secret
  runningCount: 1
  size: 2
  skipMachinePools: true
status:
  ready: 0
  size: 0
  standby: 0
