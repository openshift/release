apiVersion: hive.openshift.io/v1
kind: ClusterPool
metadata:
  labels:
    architecture: amd64
    cloud: aws
    owner: rhwa
    product: ocp
    region: us-east-2
    version: "5.0"
    version_lower: "5.0.0-0"
    version_upper: "5.2.0-0"
  name: rhwa-ocp-5-amd64-aws-us-east-2
  namespace: rhwa-cluster-pool
spec:
  baseDomain: rhwa.devcluster.openshift.com
  hibernationConfig:
    resumeTimeout: 20m0s
  imageSetRef:
    name: ocp-release-5.0.0-ec.6-multi-for-5.0.0-0-to-5.1.0-0
  installAttemptsLimit: 1
  installConfigSecretTemplateRef:
    name: install-config-aws-us-east-2
  platform:
    aws:
      credentialsSecretRef:
        name: rhwa-aws-credentials  # must exist in your namespace
      region: us-east-2
  pullSecretRef:
    name: pull-secret
  size: 1       # clusters kept warm
  maxSize: 10   # max concurrent clusters
  skipMachinePools: true
