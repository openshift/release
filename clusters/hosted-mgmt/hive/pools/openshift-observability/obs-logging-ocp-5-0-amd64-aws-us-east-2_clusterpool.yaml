apiVersion: hive.openshift.io/v1
kind: ClusterPool
metadata:
  labels:
    architecture: amd64
    cloud: aws
    owner: obs-logging
    product: ocp
    region: us-east-2
    version: "5.0"
    version_lower: 5.0.0-0
    version_stream: 5-dev-preview
    version_upper: 5.1.0-0
  name: obs-logging-ocp-5-0-amd64-aws-us-east-2
  namespace: openshift-observability-cluster-pool
spec:
  baseDomain: devobscluster.devcluster.openshift.com
  hibernationConfig:
    resumeTimeout: 20m0s
  imageSetRef:
    name: ocp-release-5.0.0-ec.6-multi-for-5.0.0-0-to-5.1.0-0
  installAttemptsLimit: 1
  installConfigSecretTemplateRef:
    name: install-config-aws-2xlarge-us-east-2
  installerEnv:
  - name: OPENSHIFT_INSTALL_EXPERIMENTAL_DISABLE_IMAGE_POLICY
    value: "true"
  labels:
    tp.openshift.io/owner: obs-logging
  maxSize: 10
  platform:
    aws:
      credentialsSecretRef:
        name: aws-installer-credentials
      region: us-east-2
  pullSecretRef:
    name: pull-secret
  size: 2
  skipMachinePools: true
status:
  ready: 0
  size: 0
  standby: 0
