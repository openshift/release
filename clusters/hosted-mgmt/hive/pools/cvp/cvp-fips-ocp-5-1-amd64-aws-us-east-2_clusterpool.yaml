apiVersion: hive.openshift.io/v1
kind: ClusterPool
metadata:
  labels:
    architecture: amd64
    cloud: aws
    owner: cvp
    product: ocp
    region: us-east-2
    variant: fips
    version: "5.1"
    version_lower: 5.1.0-0
    version_stream: 5-dev-preview
    version_upper: 5.2.0-0
  name: cvp-fips-ocp-5-1-amd64-aws-us-east-2
  namespace: cvp-cluster-pool
spec:
  baseDomain: cpaas-ci.devcluster.openshift.com
  hibernationConfig:
    resumeTimeout: 15m0s
  imageSetRef:
    name: ocp-release-5.1.0-ec.1-multi-for-5.1.0-0-to-5.2.0-0
  installAttemptsLimit: 1
  installConfigSecretTemplateRef:
    name: fips-install-config-aws-us-east-2
  installerEnv:
  - name: OPENSHIFT_INSTALL_EXPERIMENTAL_DISABLE_IMAGE_POLICY
    value: "true"
  labels:
    tp.openshift.io/owner: cvp
  maxConcurrent: 3
  maxSize: 7
  platform:
    aws:
      credentialsSecretRef:
        name: cvp-aws-credentials
      region: us-east-2
  pullSecretRef:
    name: pull-secret
  runningCount: 2
  size: 4
  skipMachinePools: true
status:
  ready: 0
  size: 0
  standby: 0
