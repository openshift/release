apiVersion: hive.openshift.io/v1
kind: ClusterPool
metadata:
  labels:
    architecture: amd64
    cloud: aws
    owner: medik8s-aws
    product: ocp
    region: us-east-1
    version: "5.0"
    version_lower: 5.0.0-0
    version_stream: 5-dev-preview
    version_upper: 5.1.0-0
  name: medik8s-ocp-5-0-amd64-aws-us-east-1
  namespace: medik8s-cluster-pool
spec:
  baseDomain: ocp-ci.medik8s-ci.devcluster.openshift.com
  hibernationConfig:
    resumeTimeout: 20m0s
  imageSetRef:
    name: ocp-release-5.0.0-ec.6-multi-for-5.0.0-0-to-5.1.0-0
  installAttemptsLimit: 1
  installConfigSecretTemplateRef:
    name: install-config-aws-us-east-1
  installerEnv:
  - name: OPENSHIFT_INSTALL_EXPERIMENTAL_DISABLE_IMAGE_POLICY
    value: "true"
  labels:
    tp.openshift.io/owner: medik8s-aws
  maxSize: 2
  platform:
    aws:
      credentialsSecretRef:
        name: medik8s-aws-credentials
      region: us-east-1
  pullSecretRef:
    name: pull-secret
  size: 2
  skipMachinePools: true
