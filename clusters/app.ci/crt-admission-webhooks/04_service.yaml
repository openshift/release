apiVersion: v1
kind: Service
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: crt-admission-webhooks
  namespace: crt-admission-webhooks
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: crt-admission-webhook-server-serving-cert
spec:
  selector:
    server: "true"
  ports:
  - port: 443
    targetPort: 8443
