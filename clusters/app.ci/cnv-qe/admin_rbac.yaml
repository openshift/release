apiVersion: v1
kind: Namespace
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=confirm
    openshift.io/description: Automation ServiceAccounts for CNV-QE
    openshift.io/display-name: CNV-QE CI
  name: cnv-qe
---
kind: ServiceAccount
apiVersion: v1
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: periodic-job-bot
  namespace: cnv-qe
---
apiVersion: v1
kind: Secret
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: api-token-secret-16-11-2026
  namespace: cnv-qe
  annotations:
    kubernetes.io/service-account.name: periodic-job-bot
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: secret-owner
  namespace: cnv-qe
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["api-token-secret-16-11-2026"]
  verbs:
  - get
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: secret-owner-cnv-qe
  namespace: cnv-qe
subjects:
- kind: Group
  apiGroup: rbac.authorization.k8s.io
  name: cnv-ci-admin
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: secret-owner
