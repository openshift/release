apiVersion: v1
kind: Namespace
metadata:
  name: sustaining-engineering-ocp
  annotations:
    openshift.io/description: Service Accounts for sustaining-engineering-ocp
    openshift.io/display-name: sustaining-engineering-ocp CI
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: periodic-job-bot
  namespace: sustaining-engineering-ocp
---
apiVersion: v1
kind: Secret
metadata:
  name: api-token-secret
  namespace: sustaining-engineering-ocp
  annotations:
    kubernetes.io/service-account.name: periodic-job-bot
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-owner
  namespace: sustaining-engineering-ocp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["api-token-secret"]
    verbs:
      - get
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-owner-sustaining-engineering-ocp
  namespace: sustaining-engineering-ocp
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: sustaining-engineering-ocp
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: secret-owner
