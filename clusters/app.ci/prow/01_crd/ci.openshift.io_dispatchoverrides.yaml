            type: object
            x-kubernetes-validations:
            - message: capacity is required only for Capacity overrides
              rule: 'self.kind == ''Capacity'' ? has(self.capacity) : !has(self.capacity)'
            - message: immutable override identity and policy fields cannot change
              rule: self.id == oldSelf.id && self.planID == oldSelf.planID && self.sourceGeneration
                == oldSelf.sourceGeneration && self.policyInputDigest == oldSelf.policyInputDigest
                && self.kind == oldSelf.kind && self.cluster == oldSelf.cluster &&
                self.startsAt == oldSelf.startsAt && self.expiresAt == oldSelf.expiresAt
