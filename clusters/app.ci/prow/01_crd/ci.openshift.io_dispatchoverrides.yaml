              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DispatchOverrideSpec is the desired temporary scheduling
              policy.
            properties:
              approvals:
                items:
                  description: DispatchApproval records one Slack user approval.
                  properties:
                    at:
                      format: date-time
                      type: string
                    userID:
