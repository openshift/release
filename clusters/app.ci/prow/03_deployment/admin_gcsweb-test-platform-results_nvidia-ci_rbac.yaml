---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-ci-artifact-access
  namespace: ci
data:
  README: |
    Intentionally empty. Exists only so a SubjectAccessReview can express
    "is allowed to read nvidia-ci artifacts over gcsweb".
    See admin_gcsweb-test-platform-results_nvidia-ci_rbac.yaml.
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nvidia-ci-artifact-access
  namespace: ci
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - nvidia-ci-artifact-access
  verbs:
  - get
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: nvidia-ci-artifact-access
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nvidia-ci-artifact-access
subjects:
- kind: ServiceAccount
  name: periodic-job-bot
  namespace: rh-ecosystem-nvidia
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: rh-ecosystem-nvidia
