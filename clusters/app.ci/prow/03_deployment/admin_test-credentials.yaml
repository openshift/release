apiVersion: v1
kind: Namespace
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=confirm
  name: test-credentials
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: secret-reader-to-ci-operator
  namespace: test-credentials
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secret-reader
subjects:
- kind: ServiceAccount
  name: ci-operator
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: secret-reader
  namespace: test-credentials
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
  - list
