---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    # deck-internal's oauth-proxy authenticates as this service account
    # (-client-id=system:serviceaccount:ci:deck), so its callbacks must be
    # registered here. It is reachable on two routes: `deck-internal` and
    # `prow-internal-xwndp` (deck-internal.ci.openshift.org).
    serviceaccounts.openshift.io/oauth-redirectreference.deck-internal: '{"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"deck-internal"}}'
    serviceaccounts.openshift.io/oauth-redirecturi.prow-internal-ingress: https://deck-internal.ci.openshift.org
  name: deck
  namespace: ci
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: deck-app-ci
  namespace: ci
rules:
  - apiGroups:
      - prow.k8s.io
    resources:
      - prowjobs
    verbs:
      - create
      - get
      - list
      - patch
      - watch
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: deck-app-ci
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deck-app-ci
subjects:
- kind: ServiceAccount
  name: deck
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: deck-oauth
rules:
  - apiGroups:
    - authentication.k8s.io
    resources:
    - tokenreviews
    verbs:
    - create
  - apiGroups:
    - authorization.k8s.io
    resources:
    - subjectaccessreviews
    verbs:
    - create
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: deck-oauth
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deck-oauth
subjects:
- kind: ServiceAccount
  name: deck
  namespace: ci
