apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prowjob-dispatcher-observation-authenticator
rules:
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prowjob-dispatcher-observation-authenticator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prowjob-dispatcher-observation-authenticator
subjects:
- kind: ServiceAccount
  name: prowjob-dispatcher
  namespace: ci
