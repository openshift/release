apiVersion: v1
kind: ConfigMap
metadata:
  namespace: ci
  name: prow-config-sparse-checkout
data:
  # git-sync sparse-checkout pattern for the /var/repo checkout used by config
  # readers (hook, sinker, statusreconciler, pipeline-controller, ...) for their
  # --plugin-config / --config-path / --config-file. Limits that checkout to the
  # core-services config trees they read instead of the whole openshift/release
  # repo. This checkout is NOT under --job-config-path, so it is never parsed as
  # job config. Keep patterns shallow (non-cone sparse-checkout silently skips
  # deeply nested ones).
  sparse-checkout: |
    /core-services/prow/
    /core-services/pipeline-controller/
