apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ci
  name: statusreconciler
  labels:
    app: prow
    component: statusreconciler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prow
      component: statusreconciler
  template:
    metadata:
      labels:
        app: prow
        component: statusreconciler
    spec:
      serviceAccountName: statusreconciler
      terminationGracePeriodSeconds: 180
      initContainers:
      - name: git-sync-init
        resources:
          requests:
            memory: "256Mi"
        command:
        - /git-sync
        args:
        - --repo=https://github.com/openshift/release.git
        - --ref=main
        - --root=/tmp/git-sync
        - --sparse-checkout-file=/etc/git-sync-config/sparse-checkout
        - --one-time=true
        - --depth=1
        - --link=release
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: release
          mountPath: /tmp/git-sync
        - name: config-sparse-checkout
          mountPath: /etc/git-sync-config
          readOnly: true
      - name: git-sync-jobs-init
        resources:
          requests:
            memory: "256Mi"
        command:
        - /git-sync
        args:
        - --repo=https://github.com/openshift/release.git
        - --ref=main
        - --root=/tmp/git-sync-jobs
        - --sparse-checkout-file=/etc/git-sync-jobs/sparse-checkout
        - --one-time=true
        - --depth=1
        - --link=jobs
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: jobs-git
          mountPath: /tmp/git-sync-jobs
        - name: jobs-sparse-checkout
          mountPath: /etc/git-sync-jobs
          readOnly: true
      containers:
      - name: statusreconciler
        image: us-docker.pkg.dev/k8s-infra-prow/images/status-reconciler:v20260908-104d452f4
        imagePullPolicy: IfNotPresent
        args:
        - --dry-run=false
        - --continue-on-error=true
        - --plugin-config=/var/repo/release/core-services/prow/02_config/_plugins.yaml
        - --supplemental-plugin-config-dir=/var/repo/release/core-services/prow/02_config
        - --config-path=/etc/config/config.yaml
        - --supplemental-prow-config-dir=/etc/config
        - --github-app-id=$(GITHUB_APP_ID)
        - --github-app-private-key-path=/etc/github/cert
        - --github-endpoint=http://ghproxy
        - --github-endpoint=https://api.github.com
        - --github-graphql-endpoint=http://ghproxy/graphql
        - --job-config-path=/etc/jobs
        - --projected-token-file=/var/sa-token/token
        env:
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: openshift-prow-github-app
              key: appid
        ports:
          - name: http
            containerPort: 8888
        volumeMounts:
        - name: service-account-token
          mountPath: /var/sa-token
        - name: github-app-credentials
          mountPath: /etc/github
          readOnly: true
        - name: config
          mountPath: /etc/config
          readOnly: true
        - name: release
          mountPath: /var/repo
        - name: combined-jobs
          mountPath: /etc/jobs
        - name: job-configs
          mountPath: /etc/jobs/efs
          readOnly: true
        - name: jobs-git
          mountPath: /etc/jobs/git
          readOnly: true
        resources:
          requests:
            memory: "34Gi"
            cpu: "20m"
      - name: git-sync
        command:
        - /git-sync
        args:
        - --repo=https://github.com/openshift/release.git
        - --ref=main
        - --period=30s
        - --root=/tmp/git-sync
        - --sparse-checkout-file=/etc/git-sync-config/sparse-checkout
        - --max-failures=3
        - --link=release
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: release
          mountPath: /tmp/git-sync
        - name: config-sparse-checkout
          mountPath: /etc/git-sync-config
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
      - name: git-sync-jobs
        command:
        - /git-sync
        args:
        - --repo=https://github.com/openshift/release.git
        - --ref=main
        - --period=30s
        - --root=/tmp/git-sync-jobs
        - --sparse-checkout-file=/etc/git-sync-jobs/sparse-checkout
        - --max-failures=3
        - --depth=1
        - --link=jobs
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: jobs-git
          mountPath: /tmp/git-sync-jobs
        - name: jobs-sparse-checkout
          mountPath: /etc/git-sync-jobs
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
      volumes:
      - name: service-account-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
      - name: github-app-credentials
        secret:
          secretName: openshift-prow-github-app
      - name: config
        configMap:
          name: config
      - name: release
        emptyDir: {}
      - name: jobs-git
        emptyDir: {}
      - name: combined-jobs
        emptyDir: {}
      - name: job-configs
        persistentVolumeClaim:
          claimName: job-configs-nfs
      - name: jobs-sparse-checkout
        configMap:
          name: prow-jobs-sparse-checkout
      - name: config-sparse-checkout
        configMap:
          name: prow-config-sparse-checkout
