---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: statusreconciler
  namespace: ci
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: statusreconciler
  namespace: ci
rules:
  - apiGroups:
      - "prow.k8s.io"
    resources:
      - prowjobs
    verbs:
      - create
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: statusreconciler
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: statusreconciler
subjects:
- kind: ServiceAccount
  name: statusreconciler
