---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  labels:
    app: prow
    component: prowjob-dispatcher
  name: prowjob-dispatcher
  namespace: ci
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: prow
    component: prowjob-dispatcher
  name: prowjob-dispatcher
  namespace: ci
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    service.beta.openshift.io/serving-cert-secret-name: prowjob-dispatcher-observation-tls
spec:
  ports:
  - name: main
    port: 8080
    protocol: TCP
    targetPort: 8080
  - name: observation
    port: 8443
    protocol: TCP
    targetPort: observation
  selector:
    app: prow
    component: prowjob-dispatcher
  type: ClusterIP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prowjob-dispatcher
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prowjob-dispatcher-overrides
  namespace: ci
rules:
- apiGroups:
  - ci.openshift.io
  resources:
  - dispatchoverrides
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ci.openshift.io
  resources:
  - dispatchoverrides/status
  verbs:
  - get
  - patch
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prowjob-dispatcher-overrides
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prowjob-dispatcher-overrides
subjects:
- kind: ServiceAccount
  name: prowjob-dispatcher
  namespace: ci
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowjob-dispatcher
  labels:
    app: prow
    component: prowjob-dispatcher
  namespace: ci
  annotations:
    keel.sh/policy: force
    keel.sh/matchTag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 5m"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prow
      component: prowjob-dispatcher
  template:
    metadata:
      labels:
        app: prow
        component: prowjob-dispatcher
    spec:
      serviceAccountName: prowjob-dispatcher
      initContainers:
      - name: git-sync-init
        resources:
          requests:
            memory: "256Mi"
        command:
        - /git-sync
        args:
        - --repo=https://github.com/openshift/release.git
        - --ref=main
        - --root=/tmp/git-sync
        - --one-time=true
        - --depth=1
        - --link=release
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: release
          mountPath: /tmp/git-sync
      containers:
      - name: prowjob-dispatcher
        resources:
          requests:
            memory: "2Gi"
        image: quay.io/openshift/ci-public:ci_prow-job-dispatcher_latest
        imagePullPolicy: Always
        args:
        - --upstream-branch=main
        - --github-token-path=/etc/github/oauth
        - --github-endpoint=http://ghproxy
        - --github-endpoint=https://api.github.com
        - --github-graphql-endpoint=http://ghproxy/graphql
        - --github-login=openshift-bot
        - --git-name=openshift-bot
        - --git-email=openshift-bot@redhat.com
        - --target-dir=/tmp
        - --config-path=/var/repo/release/core-services/sanitize-prow-jobs/_config.yaml
        - --cluster-config-path=/var/repo/release/core-services/sanitize-prow-jobs/_clusters.yaml
        - --jobs-storage-path=/cache/job-cache.gob
        - --snapshot-storage-path=/cache/policy-snapshot.json
        - --prow-jobs-dir=/var/repo/release/ci-operator/jobs
        - --rebalance-hysteresis-percent=10
        - --movement-budget-percent=10
        - --minimum-job-demand=1
        - --dispatch-override-namespace=ci
        - --control-api-token-path=/etc/dispatcher-control/token
        - --observation-api-listen-address=:8443
        - --observation-api-service-account=ci/dispatcher-dashboard
        - --observation-api-tls-cert-file=/etc/dispatcher-observation-tls/tls.crt
        - --observation-api-tls-key-file=/etc/dispatcher-observation-tls/tls.key
        - --dispatch-command-channel-id=$(DISPATCH_COMMAND_CHANNEL_ID)
        - --enable-runtime-capacity=true
        - --enable-runtime-drain=true
        - --enable-runtime-capability-scope=true
        - --scheduler-propagation-bound=3m
        - --enable-legacy-event-endpoint=false
        - --slack-token-path=/etc/slack/oauth_token
        - --self-approve=true
        - --assign=openshift/test-platform
        - --prometheus-bearer-token-path=/etc/prometheus/token
        - --prometheus-days-before=14
        - --create-pr=true
        - --prow-scheduler-config-path=/var/repo/release/core-services/prow/02_config/_config.yaml
        env:
        - name: DISPATCH_COMMAND_CHANNEL_ID
          valueFrom:
            secretKeyRef:
              name: prowjob-dispatcher-control
              key: channel_id
        ports:
        - name: main
          containerPort: 8080
        - name: observation
          containerPort: 8443
        readinessProbe:
          httpGet:
            path: /readyz
            port: main
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: main
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 10
        volumeMounts:
        - mountPath: /etc/dispatcher-observation-tls
          name: dispatcher-observation-tls
          readOnly: true
        - mountPath: /etc/dispatcher-control
          name: dispatcher-control
          readOnly: true
        - mountPath: /etc/slack
          name: slack
          readOnly: true
        - name: cache
          mountPath: /cache
        - mountPath: /etc/prometheus
          name: prometheus
          readOnly: true
        - mountPath: /etc/github
          name: token
          readOnly: true
        - name: release
          mountPath: /var/repo
      - name: git-sync
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
        command:
        - /git-sync
        args:
        - --repo=https://github.com/openshift/release.git
        - --ref=main
        - --period=30s
        - --root=/tmp/git-sync
        - --max-failures=3
        - --link=release
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: release
          mountPath: /tmp/git-sync
      volumes:
      - name: dispatcher-observation-tls
        secret:
          secretName: prowjob-dispatcher-observation-tls
      - name: dispatcher-control
        secret:
          secretName: prowjob-dispatcher-control
      - name: slack
        secret:
          secretName: slack-credentials-dptp-bot
      - name: cache
        persistentVolumeClaim:
          claimName: prowjob-dispatcher
      - name: prometheus
        secret:
          items:
          - key: sa.ci-monitoring.app.ci.token.txt
            path: token
          secretName: app-ci-openshift-user-workload-monitoring-credentials
      - name: release
        emptyDir: {}
      - name: token
        secret:
          secretName: github-credentials-openshift-bot
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prowjob-dispatcher-observation
  namespace: ci
spec:
  podSelector:
    matchLabels:
      app: prow
      component: prowjob-dispatcher
  policyTypes:
  - Ingress
  ingress:
  # Preserve existing scheduling, control, and monitoring traffic.
  - ports:
    - port: 8080
      protocol: TCP
  - from:
    - podSelector:
        matchLabels:
          app: prow
          component: dispatcher-dashboard
    ports:
    - port: 8443
      protocol: TCP
