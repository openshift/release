apiVersion: v1
kind: ConfigMap
metadata:
  namespace: ci
  name: prow-jobs-sparse-checkout
data:
  # git-sync sparse-checkout patterns for the job-config-path readers. Limits the
  # git checkout mounted under /etc/jobs to the prow job configs (plus the few
  # core-services config trees some controllers read from the repo) instead of the
  # whole openshift/release repo, so Prow does not recursively parse the entire
  # repo as job configs. Prow ignores the non-job YAML among the checked-out files
  # (verified with checkconfig).
  #
  # NOTE: git-sync uses non-cone sparse-checkout, which does not reliably
  # materialize deeply nested directory patterns. Keep these to a shallow depth
  # (e.g. /core-services/prow/, not /core-services/prow/02_config/) or the pattern
  # is silently skipped and the files never appear.
  sparse-checkout: |
    /ci-operator/jobs/
    /core-services/prow/
    /core-services/pipeline-controller/
