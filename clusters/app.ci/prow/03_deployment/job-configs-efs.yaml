apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: job-configs-efs-ap
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-04ff518a9f9158510
  basePath: "/prod-job-configs"
  directoryPerms: "700"
  gidRangeStart: "1000"
  gidRangeEnd: "2000"
reclaimPolicy: Retain
volumeBindingMode: Immediate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: job-configs-nfs
  namespace: ci
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: job-configs-efs-ap
  resources:
    requests:
      storage: 100Gi
