apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ci-staging
  name: tide
  labels:
    app: prow
    component: tide
spec:
  replicas: 1 # Do not scale up.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prow
      component: tide
  template:
    metadata:
      labels:
        app: prow
        component: tide
    spec:
      serviceAccountName: "tide"
      initContainers:
      - name: git-sync-init
        command:
        - /git-sync
        args:
        - --repo=https://github.com/Prucek/release-staging.git
        - --ref=main
        - --root=/tmp/git-sync
        - --one-time=true
        - --depth=1
        - --link=release-staging
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: git-sync
          mountPath: /tmp/git-sync
      containers:
      - name: tide
        image: us-docker.pkg.dev/k8s-infra-prow/images/tide:v20260908-104d452f4
        args:
        - --dry-run=false
        - --config-path=/etc/config/config.yaml
        - --job-config-path=/etc/jobs
        - --github-endpoint=http://ghproxy
        - --github-endpoint=https://api.github.com
        - --github-graphql-endpoint=http://ghproxy/graphql
        - --gcs-credentials-file=/etc/gcs-credentials/service-account.json
        - --status-path=gs://ci-staging-deck/tide-status-checkpoint.yaml
        - --history-uri=gs://ci-staging-deck/tide-history.json
        - --github-app-id=$(GITHUB_APP_ID)
        - --github-app-private-key-path=/etc/github/cert
        env:
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: openshift-ci-staging-prow-app
              key: appid
        ports:
        - name: main
          containerPort: 8888
        volumeMounts:
        - name: github-app-credentials
          mountPath: /etc/github
          readOnly: true
        - name: config
          mountPath: /etc/config
          readOnly: true
        - name: gcs-credentials
          mountPath: /etc/gcs-credentials
          readOnly: true
        - name: combined-jobs
          mountPath: /etc/jobs
        - name: job-configs
          mountPath: /etc/jobs/efs
          readOnly: true
        - name: git-sync
          mountPath: /etc/jobs/release-staging
          readOnly: true
      - name: git-sync
        command:
        - /git-sync
        args:
        - --repo=https://github.com/Prucek/release-staging.git
        - --ref=main
        - --period=30s
        - --root=/tmp/git-sync
        - --max-failures=3
        - --link=release-staging
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: git-sync
          mountPath: /tmp/git-sync
        resources:
          requests:
            memory: "1Gi"
            cpu: "0.5"
      volumes:
      - name: github-app-credentials
        secret:
          secretName: openshift-ci-staging-prow-app
      - name: config
        configMap:
          name: config
      - name: gcs-credentials
        secret:
          secretName: gce-sa-credentials-gcs-private
      - name: combined-jobs
        emptyDir: {}
      - name: git-sync
        emptyDir: {}
      - name: job-configs
        persistentVolumeClaim:
          claimName: job-configs-nfs
---
apiVersion: v1
kind: Service
metadata:
  namespace: ci-staging
  name: tide
  labels:
    app: prow
    component: tide
spec:
  selector:
    app: prow
    component: tide
  ports:
  - port: 80
    name: main
    targetPort: 8888
  type: ClusterIP
