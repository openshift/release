apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ci-staging
  name: prow-controller-manager
  labels:
    app: prow-controller-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prow-controller-manager
  template:
    metadata:
      labels:
        app: prow-controller-manager
    spec:
      serviceAccountName: prow-controller-manager
      initContainers:
      - name: git-sync-init
        command:
        - /git-sync
        args:
        - --repo=https://github.com/Prucek/release-staging.git
        - --ref=main
        - --root=/tmp/git-sync
        - --one-time=true
        - --depth=1
        - --link=release-staging
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: release-staging
          mountPath: /tmp/git-sync
      containers:
      - name: prow-controller-manager
        args:
        - --dry-run=false
        - --config-path=/etc/config/config.yaml
        - --job-config-path=/etc/jobs
        - --job-config-path=/var/repo/release-staging/ci-operator/jobs
        - --github-endpoint=http://ghproxy
        - --github-endpoint=https://api.github.com
        - --enable-controller=plank
        - --github-app-id=$(GITHUB_APP_ID)
        - --github-app-private-key-path=/etc/github/cert
        - --projected-token-file=/var/sa-token/token
        - --kubeconfig-dir=/etc/build-farm-credentials
        - --kubeconfig-suffix=config
        env:
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: openshift-prow-github-app
              key: appid
        image: quay.io/prucek/prow:prow-controller-manager_db
        volumeMounts:
        - name: service-account-token
          mountPath: /var/sa-token
        - name: github-app-credentials
          mountPath: /etc/github
          readOnly: true
        - name: config
          mountPath: /etc/config
          readOnly: true
        - mountPath: /etc/build-farm-credentials
          name: build-farm-credentials
          readOnly: true
        - name: job-configs
          mountPath: /etc/jobs
          readOnly: true
        - name: release-staging
          mountPath: /var/repo
      - name: git-sync
        command:
        - /git-sync
        args:
        - --repo=https://github.com/Prucek/release-staging.git
        - --ref=main
        - --period=30s
        - --root=/tmp/git-sync
        - --max-failures=3
        - --link=release-staging
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: release-staging
          mountPath: /tmp/git-sync
        resources:
          requests:
            memory: "1Gi"
            cpu: "0.5"
      volumes:
      - name: service-account-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
      - name: github-app-credentials
        secret:
          secretName: openshift-prow-github-app
      - name: config
        configMap:
          name: config
      - name: build-farm-credentials
        secret:
          secretName: prow-controller-manager
      - name: job-configs
        persistentVolumeClaim:
          claimName: job-configs-nfs
      - name: release-staging
        emptyDir: {}
