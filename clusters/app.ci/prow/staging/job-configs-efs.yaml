apiVersion: v1
kind: PersistentVolume
metadata:
  name: job-configs-efs
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-04ff518a9f9158510
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: job-configs-nfs
  namespace: ci-staging
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ""
  volumeName: job-configs-efs
  resources:
    requests:
      storage: 10Gi
