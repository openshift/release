apiVersion: apps/v1
kind: Deployment
metadata:
  name: statusreconciler
  namespace: ci-staging
  labels:
    app: statusreconciler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: statusreconciler
  template:
    metadata:
      labels:
        app: statusreconciler
    spec:
      serviceAccountName: statusreconciler
      terminationGracePeriodSeconds: 180
      initContainers:
      - name: git-sync-init
        command:
        - /git-sync
        args:
        - --repo=https://github.com/Prucek/release-staging.git
        - --ref=main
        - --root=/tmp/git-sync
        - --one-time=true
        - --depth=1
        - --link=release-staging
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: release-staging
          mountPath: /tmp/git-sync
      containers:
      - name: statusreconciler
        image: quay.io/prucek/prow:status-reconciler_db
        args:
        - --dry-run=false
        - --continue-on-error=true
        - --plugin-config=/etc/plugins/plugins.yaml
        - --config-path=/etc/config/config.yaml
        - --job-config-path=/etc/jobs
        - --job-config-path=/var/repo/release-staging/ci-operator/jobs
        - --github-endpoint=http://ghproxy
        - --github-endpoint=https://api.github.com
        - --gcs-credentials-file=/etc/gcs-credentials/service-account.json
        - --status-path=gs://your-bucket-name/status-reconciler-status
        - --github-app-id=$(GITHUB_APP_ID)
        - --github-app-private-key-path=/etc/github/cert
        env:
        - name: GITHUB_APP_ID
          valueFrom:
            secretKeyRef:
              name: openshift-prow-github-app
              key: appid
        volumeMounts:
        - name: github-app-credentials
          mountPath: /etc/github
          readOnly: true
        - name: config
          mountPath: /etc/config
          readOnly: true
        - name: plugins
          mountPath: /etc/plugins
          readOnly: true
        - name: gcs-credentials
          mountPath: /etc/gcs-credentials
          readOnly: true
        - name: job-configs
          mountPath: /etc/jobs
          readOnly: true
        - name: release-staging
          mountPath: /var/repo
      - name: git-sync
        command:
        - /git-sync
        args:
        - --repo=https://github.com/Prucek/release-staging.git
        - --ref=main
        - --period=30s
        - --root=/tmp/git-sync
        - --max-failures=3
        - --link=release-staging
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: release-staging
          mountPath: /tmp/git-sync
        resources:
          requests:
            memory: "1Gi"
            cpu: "0.5"
      volumes:
      - name: github-app-credentials
        secret:
          secretName: openshift-prow-github-app
      - name: config
        configMap:
          name: config
      - name: plugins
        configMap:
          name: plugins
      - name: gcs-credentials
        secret:
          secretName: gce-sa-credentials-gcs-private
      - name: job-configs
        persistentVolumeClaim:
          claimName: job-configs-nfs
      - name: release-staging
        emptyDir: {}
