# ============================================================
# EFS CSI DRIVER SECRET (in openshift-cluster-csi-drivers namespace)
# ============================================================
#
# aws-efs-cloud-credentials
#   contents : aws_access_key_id / aws_secret_access_key / credentials
#   used by  : aws-efs-csi-driver-controller (init container)
#   created  : automatically by the cloud-credential-operator (app.ci runs CCO in
#              Mint mode) from the CredentialsRequest in
#              clusters/app.ci/aws-efs-csi-driver/credentialsrequest.yaml — same
#              mechanism that provisions ebs-cloud-credentials for the built-in
#              aws-ebs-csi-driver-operator. No manual secret creation needed.
#   related  : the EFS filesystem itself, its mount target(s), and the security
#              group allowing NFS (tcp/2049) from app.ci's worker node security
#              group are created out-of-band via the AWS CLI (not CCO-managed).
#              The filesystem ID is referenced as csi.volumeHandle in
#              clusters/app.ci/prow/staging/job-configs-efs.yaml.
