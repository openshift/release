apiVersion: v1
kind: ConfigMap
metadata:
  namespace: ci-staging
  name: prow-jobs-sparse-checkout
data:
  sparse-checkout: |
    /ci-operator/jobs/
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: ci-staging
  name: horologium
  labels:
    app: horologium
spec:
  replicas: 1 # Do not scale up.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: horologium
  template:
    metadata:
      labels:
        app: horologium
    spec:
      serviceAccountName: "horologium"
      terminationGracePeriodSeconds: 30
      initContainers:
      - name: git-sync-init
        command:
        - /git-sync
        args:
        - --repo=https://github.com/Prucek/release-staging.git
        - --ref=main
        - --root=/tmp/git-sync
        - --sparse-checkout-file=/etc/git-sync/sparse-checkout
        - --one-time=true
        - --depth=1
        - --link=release-staging
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: git-sync
          mountPath: /tmp/git-sync
        - name: sparse-checkout-config
          mountPath: /etc/git-sync
          readOnly: true
      containers:
      - name: horologium
        image: us-docker.pkg.dev/k8s-infra-prow/images/horologium:v20260902-ffc57790b
        args:
        - --dry-run=false
        - --config-path=/etc/config/config.yaml
        - --job-config-path=/etc/jobs
        volumeMounts:
        - name: config
          mountPath: /etc/config
          readOnly: true
        - name: combined-jobs
          mountPath: /etc/jobs
        - name: job-configs
          mountPath: /etc/jobs/efs
          readOnly: true
        - name: git-sync
          mountPath: /etc/jobs/release-staging
          readOnly: true
      - name: git-sync
        command:
        - /git-sync
        args:
        - --repo=https://github.com/Prucek/release-staging.git
        - --ref=main
        - --period=30s
        - --root=/tmp/git-sync
        - --sparse-checkout-file=/etc/git-sync/sparse-checkout
        - --max-failures=3
        - --link=release-staging
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        volumeMounts:
        - name: git-sync
          mountPath: /tmp/git-sync
        - name: sparse-checkout-config
          mountPath: /etc/git-sync
          readOnly: true
        resources:
          requests:
            memory: "1Gi"
            cpu: "0.5"
      volumes:
      - name: config
        configMap:
          name: config
      - name: combined-jobs
        emptyDir: {}
      - name: git-sync
        emptyDir: {}
      - name: job-configs
        persistentVolumeClaim:
          claimName: job-configs-nfs
      - name: sparse-checkout-config
        configMap:
          name: prow-jobs-sparse-checkout
