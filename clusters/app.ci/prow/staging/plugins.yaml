apiVersion: v1
kind: ConfigMap
metadata:
  namespace: ci-staging
  name: plugins
data:
  #TODO: the org will be openshift eventually
  plugins.yaml: |
    external_plugins:
      Prucek:
      - endpoint: http://in-repo-config-plugin
        events:
        - issue_comment
        - pull_request
        - push
        name: in-repo-config
    plugins:
      Prucek:
        plugins:
        - approve
        - assign
        - blunderbuss
        - cat
        - dog
        - help
        - heart
        - hold
        - label
        - lgtm
        - trigger
        - verify-owners
        - wip
        - yuks
      smg247:
        plugins:
        - approve
        - assign
        - blunderbuss
        - cat
        - dog
        - help
        - heart
        - hold
        - label
        - lgtm
        - trigger
        - verify-owners
        - wip
        - yuks
