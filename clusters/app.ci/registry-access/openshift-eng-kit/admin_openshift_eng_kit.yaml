apiVersion: v1
kind: Namespace
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=confirm
    openshift.io/description: Images for Kubernetes Integration Testing (KIT)
    openshift.io/display-name: openshift-eng-kit
  name: openshift-eng-kit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: image-puller
  namespace: openshift-eng-kit
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:unauthenticated
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: system:authenticated
