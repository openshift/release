# ServiceAccount for the pull-secret-rotator CronJob.
# This SA authenticates to GCP via Workload Identity Federation and
# mints tokens for the image-puller SA.
kind: ServiceAccount
apiVersion: v1
metadata:
  name: pull-secret-rotator
  namespace: gcp-hcp
---
# Role to mint tokens for the image-puller ServiceAccount
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: token-minter
  namespace: gcp-hcp
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["image-puller"]
    verbs: ["create"]
---
# Bind the token-minter role to the pull-secret-rotator SA
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: pull-secret-rotator-token-minter
  namespace: gcp-hcp
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: token-minter
subjects:
  - kind: ServiceAccount
    namespace: gcp-hcp
    name: pull-secret-rotator
---
# CronJob that rotates the CI pull secret every 6 hours.
# Mints a fresh app.ci SA token, merges it with the base Red Hat pull secret,
# and writes the result to default-openshift-pull-secret-ci in Secret Manager.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pull-secret-rotator
  namespace: gcp-hcp
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Replace
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 300
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: pull-secret-rotator
          restartPolicy: OnFailure
          containers:
            - name: rotator
              image: quay-proxy.ci.openshift.org/openshift/ci:ci_pull-secret-rotator_latest
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  # Mint a fresh app.ci SA token for QCI registry access
                  TOKEN="$(oc -n "$APP_CI_NAMESPACE" create token "$IMAGE_PULLER_SA" --duration="$TOKEN_DURATION")"
                  AUTH="$(printf '%s:%s' "$IMAGE_PULLER_SA" "$TOKEN" | base64 | tr -d '\n')"
                  printf '{"auths":{"quay-proxy.ci.openshift.org":{"auth":"%s"},"registry.ci.openshift.org":{"auth":"%s"}}}' "$AUTH" "$AUTH" > /tmp/ci-auth.json
                  # Authenticate to GCP via Workload Identity Federation
                  gcloud auth login --cred-file="$GOOGLE_APPLICATION_CREDENTIALS" --quiet
                  # Rotate in each target project
                  IFS=',' read -ra PROJECTS <<< "$GCP_PROJECTS"
                  for PROJECT in "${PROJECTS[@]}"; do
                    echo "Rotating in project: $PROJECT"
                    gcloud secrets versions access latest --project="$PROJECT" --secret="default-openshift-pull-secret" > /tmp/base-pull-secret.json
                    jq -s '{auths: ((.[0].auths // {}) + (.[1].auths // {}))}' /tmp/base-pull-secret.json /tmp/ci-auth.json > /tmp/merged-pull-secret.json
                    gcloud secrets versions add "$DERIVED_SECRET" --project="$PROJECT" --data-file=/tmp/merged-pull-secret.json
                    echo "Successfully rotated $DERIVED_SECRET in $PROJECT"
                    rm -f /tmp/base-pull-secret.json /tmp/merged-pull-secret.json
                  done
                  rm -f /tmp/ci-auth.json
              env:
                - name: GCP_PROJECTS
                  value: "gcp-hcp-int-global,gcp-hcp-commons-dev"
                - name: DERIVED_SECRET
                  value: "default-openshift-pull-secret-ci"
                - name: APP_CI_NAMESPACE
                  value: "gcp-hcp"
                - name: IMAGE_PULLER_SA
                  value: "image-puller"
                - name: TOKEN_DURATION
                  value: "24h"
