apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
    gcp-project: openshift-ci-infra
  name: console-app-ci
  namespace: openshift-config
spec:
  secretName: console-app-ci-tls
  issuerRef:
    name: cert-issuer
    kind: ClusterIssuer
  dnsNames:
  - console.app.ci.openshift.org
