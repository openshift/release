kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: helpdesk-faq
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: helpdesk-faq
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: helpdesk-faq
subjects:
- kind: ServiceAccount
  name: helpdesk-faq
  namespace: ci
