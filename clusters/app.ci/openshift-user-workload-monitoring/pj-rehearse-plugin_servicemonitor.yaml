apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
    app: prow
    component: pj-rehearse-plugin
    prow-app: pj-rehearse-plugin
  name: pj-rehearse-plugin
  namespace: ci
spec:
  endpoints:
  - interval: 30s
    port: metrics
    scheme: http
  selector:
    matchLabels:
      app: prow
      component: pj-rehearse-plugin
