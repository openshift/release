apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
    app: prow
    component: crier
    prow-app: crier
  name: crier
  namespace: ci
spec:
  endpoints:
  - interval: 30s
    port: metrics
    scheme: http
  selector:
    matchLabels:
      app: prow
      component: crier
