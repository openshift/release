apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
data:
  config.yaml: |
    prometheus:
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 100Gi
      retention: "30d"
      remoteWrite:
        - url: "https://thanos-receive.core.ci.devcluster.openshift.com:19291/api/v1/receive"
          queueConfig:
            sampleAgeLimit: 10m
          tlsConfig:
            ca:
              secret:
                name: thanos-remote-write-tls
                key: ca.crt
            cert:
              secret:
                name: thanos-remote-write-tls
                key: client.crt
            keySecret:
              name: thanos-remote-write-tls
              key: client.key
    alertmanager:
      enabled: true
      enableAlertmanagerConfig: true
      # Mounted at /etc/alertmanager/secrets/alert-proxy-alertmanager-webhook/;
      # the alert-proxy receiver reads the bearer token from the token key
      # rather than having it interpolated into the rendered config.
      secrets:
      - alert-proxy-alertmanager-webhook
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 10Gi

