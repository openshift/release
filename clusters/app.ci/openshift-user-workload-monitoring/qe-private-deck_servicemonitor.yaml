apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
    app: prow
    component: qe-private-deck
    prow-app: qe-private-deck
  name: qe-private-deck
  namespace: ci
spec:
  endpoints:
  - interval: 30s
    port: metrics
    scheme: http
  selector:
    matchLabels:
      app: prow
      component: qe-private-deck
