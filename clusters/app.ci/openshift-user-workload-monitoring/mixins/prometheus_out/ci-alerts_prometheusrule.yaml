apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: ci-alerts
  namespace: ci
spec:
  groups:
  - name: prow
    rules:
    - alert: prow-pod-crashlooping
      annotations:
        ops_color: orange
        ops_category: ci_platform
        message: Pod {{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container}}) is restarting {{ printf "%.2f" $value }} times over the last 1 hour.
      expr: increase(kube_pod_container_status_restarts_total{job="kube-state-metrics",namespace="ci"}[1h]) > 20
      for: 10m
      labels:
        severity: critical
    - alert: NonKubeContainerWaiting
      annotations:
        description: 'pod/{{ $labels.pod }} in namespace {{ $labels.namespace }} on container {{ $labels.container }} has been in waiting state for longer than 1 hour. (reason: {{ with printf `kube_pod_container_status_waiting_reason{namespace="%s",pod="%s",container="%s"}` $labels.namespace $labels.pod $labels.container | query }}{{ . | first | label "reason" }}{{ end }}).'
        summary: Pod container waiting longer than 1 hour
      expr: max by (namespace, pod, container) (kube_pod_container_status_waiting_reason{namespace!~"(openshift-.*|kube-.*|default)",job="kube-state-metrics"} > 0)
      for: 1h
      labels:
        severity: warning
    - expr: count(label_replace(count(github_token_usage{token_hash =~ "openshift.*"}) by (token_hash), "login", "$1", "token_hash", "(.*)") or github_user_info{login=~"openshift-.*"}) by (login)
      record: github:identity_names
  - name: ci-chat-bot-down
    rules:
    - alert: ciChatBotDown
      annotations:
        message: '{{ $labels.deployment }} has been down for 5 minutes.'
      expr: kube_deployment_status_replicas_unavailable{namespace="ci", deployment=~"ci-chat-bot"} >= 1
      for: 5m
      labels:
        severity: critical
        team: crt
  - name: release-controller-down
    rules:
    - alert: releaseControllerDown
      annotations:
        message: '{{ $labels.deployment }} has been down for 5 minutes.'
      expr: kube_deployment_status_replicas_unavailable{namespace="ci", deployment=~"release-controller.*"} >= 1
      for: 5m
      labels:
        severity: critical
        team: crt
