apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  labels:
    app: grafana
  name: tide
  namespace: ci-grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |
    {
       "__inputs": [ ],
       "__requires": [ ],
       "annotations": {
          "list": [ ]
       },
       "editable": false,
       "gnetId": null,
       "graphTooltip": 0,
       "hideControls": false,
       "id": null,
       "links": [ ],
       "panels": [
          {
             "collapse": false,
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 0
             },
             "id": 2,
             "panels": [ ],
             "repeat": null,
             "repeatIteration": null,
             "repeatRowId": null,
             "showTitle": true,
             "title": "Is Tide OK?",
             "titleSize": "h6",
             "type": "row"
          },
          {
             "datasource": "prometheus",
             "description": "Is the Tide process up and being scraped.",
             "fieldConfig": {
                "defaults": {
                   "links": [ ],
                   "mappings": [
                      {
                         "options": {
                            "0": {
                               "text": "DOWN"
                            },
                            "1": {
                               "text": "UP"
                            }
                         },
                         "type": "value"
                      }
                   ],
                   "thresholds": {
                      "mode": "absolute",
                      "steps": [
                         {
                            "color": "red",
                            "value": null
                         },
                         {
                            "color": "green",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "none"
                }
             },
             "gridPos": {
                "h": 6,
                "w": 3,
                "x": 0,
                "y": 1
             },
             "id": 3,
             "links": [ ],
             "options": {
                "colorMode": "background",
                "graphMode": "none",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": {
                   "calcs": [
                      "lastNotNull"
                   ],
                   "fields": "",
                   "values": false
                }
             },
             "pluginVersion": "7",
             "targets": [
                {
                   "expr": "up{job=\"tide\"}",
                   "format": "time_series",
                   "instant": true,
                   "intervalFactor": 2,
                   "legendFormat": "",
                   "refId": "A"
                }
             ],
             "title": "Tide Process",
             "transparent": false,
             "type": "stat"
          },
          {
             "datasource": "prometheus",
             "description": "Container restarts of the Tide pod in the last 24h. Any value above 0 means the process crashed and was restarted, not a routine rollout to a new pod.",
             "fieldConfig": {
                "defaults": {
                   "decimals": 0,
                   "links": [ ],
                   "mappings": [ ],
                   "thresholds": {
                      "mode": "absolute",
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "red",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 6,
                "w": 3,
                "x": 3,
                "y": 1
             },
             "id": 4,
             "links": [ ],
             "options": {
                "colorMode": "background",
                "graphMode": "none",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": {
                   "calcs": [
                      "lastNotNull"
                   ],
                   "fields": "",
                   "values": false
                }
             },
             "pluginVersion": "7",
             "targets": [
                {
                   "expr": "sum(increase(kube_pod_container_status_restarts_total{job=\"kube-state-metrics\", namespace=\"ci\", container=\"tide\"}[24h]))",
                   "format": "time_series",
                   "instant": true,
                   "intervalFactor": 2,
                   "legendFormat": "",
                   "refId": "A"
                }
             ],
             "title": "Restarts (24h)",
             "transparent": false,
             "type": "stat"
          },
          {
             "datasource": "prometheus",
             "description": "How long the current Tide pod has been running.",
             "fieldConfig": {
                "defaults": {
                   "links": [ ],
                   "mappings": [ ],
                   "thresholds": {
                      "mode": "absolute",
                      "steps": [ ]
                   },
                   "unit": "s"
                }
             },
             "gridPos": {
                "h": 6,
                "w": 3,
                "x": 6,
                "y": 1
             },
             "id": 5,
             "links": [ ],
             "options": {
                "colorMode": "value",
                "graphMode": "none",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": {
                   "calcs": [
                      "lastNotNull"
                   ],
                   "fields": "",
                   "values": false
                }
             },
             "pluginVersion": "7",
             "targets": [
                {
                   "expr": "time() - process_start_time_seconds{job=\"tide\"}",
                   "format": "time_series",
                   "instant": true,
                   "intervalFactor": 2,
                   "legendFormat": "",
                   "refId": "A"
                }
             ],
             "title": "Pod Age",
             "transparent": false,
             "type": "stat"
          },
          {
             "datasource": "prometheus",
             "description": "Time since Tide last merged a PR, in any org. Derived from merges_sum (no direct metric for this); goes blank if Tide hasn't merged anything in over 3 days.",
             "fieldConfig": {
                "defaults": {
                   "links": [ ],
                   "mappings": [ ],
                   "thresholds": {
                      "mode": "absolute",
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "yellow",
                            "value": 3600
                         },
                         {
                            "color": "red",
                            "value": 14400
                         }
                      ]
                   },
                   "unit": "s"
                }
             },
             "gridPos": {
                "h": 6,
                "w": 3,
                "x": 9,
                "y": 1
             },
             "id": 6,
             "links": [ ],
             "options": {
                "colorMode": "background",
                "graphMode": "none",
                "justifyMode": "auto",
                "orientation": "auto",
                "reduceOptions": {
                   "calcs": [
                      "lastNotNull"
                   ],
                   "fields": "",
                   "values": false
                }
             },
             "pluginVersion": "7",
             "targets": [
                {
                   "expr": "time() - max(last_over_time((timestamp(merges_sum) and ((changes(merges_sum[3m]) > 0) or (merges_sum unless merges_sum offset 3m)))[3d:1m]))",
                   "format": "time_series",
                   "instant": true,
                   "intervalFactor": 2,
                   "legendFormat": "",
                   "refId": "A"
                }
             ],
             "title": "Time Since Last Merge",
             "transparent": false,
             "type": "stat"
          },
          {
             "datasource": "prometheus",
             "description": "sync-controller query shard outcomes from the most recent cycle: errored/partial shards vs. total shards (same underlying data as the Queries: Current panel below). Background is green when clean, yellow if any shard came back partial, red if any errored.",
             "fieldConfig": {
                "defaults": {
                   "decimals": 0,
                   "links": [ ],
                   "mappings": [ ],
                   "thresholds": {
                      "mode": "absolute",
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         }
                      ]
                   },
                   "unit": "short"
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Errors"
                      },
                      "properties": [
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "green",
                                     "value": null
                                  },
                                  {
                                     "color": "red",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Partials"
                      },
                      "properties": [
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "green",
                                     "value": null
                                  },
                                  {
                                     "color": "yellow",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 6,
                "w": 4,
                "x": 12,
                "y": 1
             },
             "id": 7,
             "links": [ ],
             "options": {
                "colorMode": "background",
                "graphMode": "none",
                "justifyMode": "auto",
                "orientation": "horizontal",
                "reduceOptions": {
                   "calcs": [
                      "lastNotNull"
                   ],
                   "fields": "",
                   "values": false
                }
             },
             "pluginVersion": "7",
             "targets": [
                {
                   "expr": "sum(tide_sync_query_shards{controller=\"sync\", result=\"error\"})",
                   "format": "time_series",
                   "instant": true,
                   "intervalFactor": 2,
                   "legendFormat": "Errors",
                   "refId": "A"
                },
                {
                   "expr": "sum(tide_sync_query_shards{controller=\"sync\", result=\"partial\"})",
                   "format": "time_series",
                   "instant": true,
                   "intervalFactor": 2,
                   "legendFormat": "Partials",
                   "refId": "B"
                },
                {
                   "expr": "sum(tide_sync_query_shards{controller=\"sync\"})",
                   "format": "time_series",
                   "instant": true,
                   "intervalFactor": 2,
                   "legendFormat": "Total",
                   "refId": "C"
                }
             ],
             "title": "Sync Query Errors",
             "transparent": false,
             "type": "stat"
          },
          {
             "datasource": "prometheus",
             "description": "status-controller query shard outcomes from the most recent cycle: errored/partial shards vs. total shards (same underlying data as the Queries: Current panel below). Background is green when clean, yellow if any shard came back partial, red if any errored.",
             "fieldConfig": {
                "defaults": {
                   "decimals": 0,
                   "links": [ ],
                   "mappings": [ ],
                   "thresholds": {
                      "mode": "absolute",
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         }
                      ]
                   },
                   "unit": "short"
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Errors"
                      },
                      "properties": [
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "green",
                                     "value": null
                                  },
                                  {
                                     "color": "red",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Partials"
                      },
                      "properties": [
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "green",
                                     "value": null
                                  },
                                  {
                                     "color": "yellow",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 6,
                "w": 4,
                "x": 16,
                "y": 1
             },
             "id": 8,
             "links": [ ],
             "options": {
                "colorMode": "background",
                "graphMode": "none",
                "justifyMode": "auto",
                "orientation": "horizontal",
                "reduceOptions": {
                   "calcs": [
                      "lastNotNull"
                   ],
                   "fields": "",
                   "values": false
                }
             },
             "pluginVersion": "7",
             "targets": [
                {
                   "expr": "sum(tide_sync_query_shards{controller=\"status\", result=\"error\"})",
                   "format": "time_series",
                   "instant": true,
                   "intervalFactor": 2,
                   "legendFormat": "Errors",
                   "refId": "A"
                },
                {
                   "expr": "sum(tide_sync_query_shards{controller=\"status\", result=\"partial\"})",
                   "format": "time_series",
                   "instant": true,
                   "intervalFactor": 2,
                   "legendFormat": "Partials",
                   "refId": "B"
                },
                {
                   "expr": "sum(tide_sync_query_shards{controller=\"status\"})",
                   "format": "time_series",
                   "instant": true,
                   "intervalFactor": 2,
                   "legendFormat": "Total",
                   "refId": "C"
                }
             ],
             "title": "Status Query Errors",
             "transparent": false,
             "type": "stat"
          },
          {
             "datasource": "prometheus",
             "description": "Total PRs merged (any org) in the trailing 1h, compared to the same 1h-wide window 24h ago.",
             "fieldConfig": {
                "defaults": {
                   "decimals": 0,
                   "links": [ ],
                   "mappings": [ ],
                   "thresholds": {
                      "mode": "absolute",
                      "steps": [ ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 6,
                "w": 4,
                "x": 20,
                "y": 1
             },
             "id": 9,
             "links": [ ],
             "options": {
                "colorMode": "value",
                "graphMode": "none",
                "justifyMode": "auto",
                "orientation": "horizontal",
                "reduceOptions": {
                   "calcs": [
                      "lastNotNull"
                   ],
                   "fields": "",
                   "values": false
                }
             },
             "pluginVersion": "7",
             "targets": [
                {
                   "expr": "((sum(increase(merges_sum[1h])) by ()) + (sum(min_over_time(merges_sum[1h] @ end()) unless (merges_sum @ end() offset 1h)) by ())) or (sum(min_over_time(merges_sum[1h] @ end()) unless (merges_sum @ end() offset 1h)) by ()) or (sum(increase(merges_sum[1h])) by ())",
                   "format": "time_series",
                   "instant": true,
                   "intervalFactor": 2,
                   "legendFormat": "Last 1h",
                   "refId": "A"
                },
                {
                   "expr": "((sum(increase(merges_sum[1h] offset 24h))) + (sum(min_over_time(merges_sum[1h] @ end() offset 24h) unless (merges_sum @ end() offset 25h)))) or (sum(min_over_time(merges_sum[1h] @ end() offset 24h) unless (merges_sum @ end() offset 25h))) or (sum(increase(merges_sum[1h] offset 24h)))",
                   "format": "time_series",
                   "instant": true,
                   "intervalFactor": 2,
                   "legendFormat": "Same hour yesterday",
                   "refId": "B"
                }
             ],
             "title": "Merged: Last 1h vs. Same Hour Yesterday",
             "transparent": false,
             "type": "stat"
          },
          {
             "collapse": true,
             "collapsed": true,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 7
             },
             "id": 10,
             "panels": [
                {
                   "datasource": "prometheus",
                   "description": "PRs merged per org in the last 3 hours, sorted descending (batches count all their PRs). Orgs with zero merges in the window are omitted.",
                   "fieldConfig": {
                      "defaults": {
                         "decimals": 0,
                         "thresholds": {
                            "mode": "absolute",
                            "steps": [
                               {
                                  "color": "green",
                                  "value": null
                               }
                            ]
                         },
                         "unit": "short"
                      }
                   },
                   "gridPos": {
                      "h": 9,
                      "w": 8,
                      "x": 0,
                      "y": 8
                   },
                   "id": 11,
                   "options": {
                      "displayMode": "gradient",
                      "orientation": "horizontal",
                      "reduceOptions": {
                         "calcs": [
                            "lastNotNull"
                         ],
                         "fields": "",
                         "values": false
                      },
                      "valueMode": "color"
                   },
                   "targets": [
                      {
                         "expr": "sort_desc((((sum(increase(merges_sum[3h])) by (org)) + (sum(min_over_time(merges_sum[3h] @ end()) unless (merges_sum @ end() offset 3h)) by (org))) or (sum(min_over_time(merges_sum[3h] @ end()) unless (merges_sum @ end() offset 3h)) by (org)) or (sum(increase(merges_sum[3h])) by (org))) > 0)",
                         "format": "time_series",
                         "instant": true,
                         "intervalFactor": 2,
                         "legendFormat": "{{org}}",
                         "refId": "A"
                      }
                   ],
                   "title": "PRs Merged by Org (last 3h)",
                   "type": "bargauge"
                },
                {
                   "datasource": "prometheus",
                   "description": "Trend of the trailing-3h merged-PR count, restricted to orgs currently merging (same org set as the bar gauge to the left).",
                   "fieldConfig": {
                      "defaults": {
                         "custom": {
                            "axisPlacement": "auto",
                            "drawStyle": "line",
                            "fillOpacity": 15,
                            "gradientMode": "opacity",
                            "lineInterpolation": "smooth",
                            "lineWidth": 2,
                            "pointSize": 5,
                            "showPoints": "never",
                            "spanNulls": false,
                            "stacking": {
                               "group": "A",
                               "mode": "none"
                            }
                         },
                         "decimals": 0,
                         "min": 0,
                         "unit": "short"
                      },
                      "overrides": [ ]
                   },
                   "gridPos": {
                      "h": 9,
                      "w": 8,
                      "x": 8,
                      "y": 8
                   },
                   "id": 12,
                   "options": {
                      "legend": {
                         "calcs": [
                            "last",
                            "max"
                         ],
                         "displayMode": "table",
                         "placement": "right",
                         "sortBy": "Last",
                         "sortDesc": true
                      },
                      "tooltip": {
                         "mode": "multi",
                         "sort": "desc"
                      }
                   },
                   "targets": [
                      {
                         "expr": "(((sum(increase(merges_sum[3h])) by (org)) + (sum(min_over_time(merges_sum[3h]) unless (merges_sum offset 3h)) by (org))) or (sum(min_over_time(merges_sum[3h]) unless (merges_sum offset 3h)) by (org)) or (sum(increase(merges_sum[3h])) by (org))) and on(org) ((((sum(increase(merges_sum[3h])) by (org)) + (sum(min_over_time(merges_sum[3h] @ end()) unless (merges_sum @ end() offset 3h)) by (org))) or (sum(min_over_time(merges_sum[3h] @ end()) unless (merges_sum @ end() offset 3h)) by (org)) or (sum(increase(merges_sum[3h])) by (org))) > 0)",
                         "format": "time_series",
                         "intervalFactor": 2,
                         "legendFormat": "{{org}}",
                         "refId": "A"
                      }
                   ],
                   "title": "PRs Merged by Org (3h sliding window)",
                   "type": "timeseries"
                },
                {
                   "datasource": "prometheus",
                   "description": "Trend of the trailing-24h merged-PR count, restricted to orgs currently merging.",
                   "fieldConfig": {
                      "defaults": {
                         "custom": {
                            "axisPlacement": "auto",
                            "drawStyle": "line",
                            "fillOpacity": 15,
                            "gradientMode": "opacity",
                            "lineInterpolation": "smooth",
                            "lineWidth": 2,
                            "pointSize": 5,
                            "showPoints": "never",
                            "spanNulls": false,
                            "stacking": {
                               "group": "A",
                               "mode": "none"
                            }
                         },
                         "decimals": 0,
                         "min": 0,
                         "unit": "short"
                      },
                      "overrides": [ ]
                   },
                   "gridPos": {
                      "h": 9,
                      "w": 8,
                      "x": 16,
                      "y": 8
                   },
                   "id": 13,
                   "options": {
                      "legend": {
                         "calcs": [
                            "last",
                            "max"
                         ],
                         "displayMode": "table",
                         "placement": "right",
                         "sortBy": "Last",
                         "sortDesc": true
                      },
                      "tooltip": {
                         "mode": "multi",
                         "sort": "desc"
                      }
                   },
                   "targets": [
                      {
                         "expr": "(((sum(increase(merges_sum[24h])) by (org)) + (sum(min_over_time(merges_sum[24h]) unless (merges_sum offset 24h)) by (org))) or (sum(min_over_time(merges_sum[24h]) unless (merges_sum offset 24h)) by (org)) or (sum(increase(merges_sum[24h])) by (org))) and on(org) ((((sum(increase(merges_sum[24h])) by (org)) + (sum(min_over_time(merges_sum[24h] @ end()) unless (merges_sum @ end() offset 24h)) by (org))) or (sum(min_over_time(merges_sum[24h] @ end()) unless (merges_sum @ end() offset 24h)) by (org)) or (sum(increase(merges_sum[24h])) by (org))) > 0)",
                         "format": "time_series",
                         "intervalFactor": 2,
                         "legendFormat": "{{org}}",
                         "refId": "A"
                      }
                   ],
                   "title": "PRs Merged by Org (24h sliding window)",
                   "type": "timeseries"
                },
                {
                   "datasource": "prometheus",
                   "description": "Tide pools that currently have at least one PR eligible for merge, by repo, sorted descending. Color reflects pool size: green is small, red is large.",
                   "fieldConfig": {
                      "defaults": {
                         "color": {
                            "mode": "continuous-GrYlRd"
                         },
                         "thresholds": {
                            "mode": "absolute",
                            "steps": [
                               {
                                  "color": "green",
                                  "value": null
                               }
                            ]
                         },
                         "unit": "short"
                      }
                   },
                   "gridPos": {
                      "h": 9,
                      "w": 6,
                      "x": 0,
                      "y": 17
                   },
                   "id": 14,
                   "options": {
                      "displayMode": "basic",
                      "orientation": "horizontal",
                      "reduceOptions": {
                         "calcs": [
                            "lastNotNull"
                         ],
                         "fields": "",
                         "values": false
                      },
                      "valueMode": "color"
                   },
                   "targets": [
                      {
                         "expr": "sort_desc((avg(pooledprs and ((time() - updatetime) < 240)) by (org, repo, branch)) > 0)",
                         "format": "time_series",
                         "instant": true,
                         "intervalFactor": 2,
                         "legendFormat": "{{org}}/{{repo}}:{{branch}}",
                         "refId": "A"
                      }
                   ],
                   "title": "Nonzero Pool Sizes (current)",
                   "type": "bargauge"
                },
                {
                   "datasource": "prometheus",
                   "description": "Trend of pool size, restricted to repos currently in a nonzero pool (same repo set as the bar gauge to the left) whose pool size exceeded 1 at some point in the visible window. Gaps are real: either the pool emptied or the data went stale (Tide never emits an explicit 0).",
                   "fieldConfig": {
                      "defaults": {
                         "custom": {
                            "axisPlacement": "auto",
                            "drawStyle": "line",
                            "fillOpacity": 15,
                            "gradientMode": "opacity",
                            "lineInterpolation": "smooth",
                            "lineWidth": 2,
                            "pointSize": 5,
                            "showPoints": "never",
                            "spanNulls": false,
                            "stacking": {
                               "group": "A",
                               "mode": "none"
                            }
                         },
                         "min": 0,
                         "unit": "short"
                      },
                      "overrides": [ ]
                   },
                   "gridPos": {
                      "h": 9,
                      "w": 12,
                      "x": 6,
                      "y": 17
                   },
                   "id": 15,
                   "options": {
                      "legend": {
                         "calcs": [
                            "last",
                            "max"
                         ],
                         "displayMode": "table",
                         "placement": "right",
                         "sortBy": "Last",
                         "sortDesc": true
                      },
                      "tooltip": {
                         "mode": "multi",
                         "sort": "desc"
                      }
                   },
                   "targets": [
                      {
