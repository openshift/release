apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
    app: prow
    component: repo-init-apiserver
    prow-app: repo-init-apiserver
  name: repo-init-apiserver
  namespace: ci
spec:
  endpoints:
  - interval: 30s
    port: metrics
    scheme: http
  selector:
    matchLabels:
      app: prow
      component: repo-init-apiserver
