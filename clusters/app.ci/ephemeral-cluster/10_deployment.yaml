apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    app: ephemeral-cluster
  name: ephemeral-cluster
  namespace: ci
spec:
  jobLabel: app
  selector:
    matchLabels:
      app: ephemeral-cluster
  podMetricsEndpoints:
  - port: metrics
    scheme: http
    scrapeTimeout: 20s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    keel.sh/policy: force
    keel.sh/matchTag: "true"
    keel.sh/trigger: poll
    keel.sh/pollSchedule: "@every 5m"
  labels:
    app: ephemeral-cluster
  name: ephemeral-cluster
  namespace: ci
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ephemeral-cluster
  template:
    metadata:
      annotations:
        ci-workload-autoscaler.openshift.io/scale: "false"
      labels:
        app: ephemeral-cluster
    spec:
      tolerations:
      - key: manual-provision
        operator: Exists
      initContainers:
      - name: git-sync-init
        resources:
          requests:
            memory: "256Mi"
        command:
        - /git-sync
        args:
        - --repo=https://github.com/openshift/release.git
        - --ref=main
        - --root=/tmp/git-sync
        - --one-time=true
        - --depth=1
        - --link=release
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        imagePullPolicy: Always
        volumeMounts:
        - name: release
          mountPath: /tmp/git-sync
      containers:
      - name: git-sync
        command:
        - /git-sync
        args:
        - --repo=https://github.com/openshift/release.git
        - --ref=main
        - --period=30s
        - --root=/tmp/git-sync
        - --max-failures=3
        - --link=release
        image: quay-proxy.ci.openshift.org/openshift/ci:ci_git-sync_v4.3.0
        imagePullPolicy: Always
        volumeMounts:
        - name: release
          mountPath: /tmp/git-sync
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
      - image: quay-proxy.ci.openshift.org/openshift/ci:ci_dptp-controller-manager_latest
        name: ephemeral-cluster
        command:
        - /bin/bash
        - -c
        - |
          if ! empty_jobs_dir=$(mktemp --tmpdir=/tmp jobs.XXXXX); then
            echo "ERROR: Failed to create temporary jobs directory" >&2
            exit 1
          fi
          exec dptp-controller-manager \
            --leader-election-namespace=ci \
            --leader-election-suffix=ec \
            --release-repo-git-sync-path=/var/repo/release \
            --job-config-path="$empty_jobs_dir" \
            --enable-controller=ephemeral_cluster_provisioner \
            --dry-run=false \
            --kubeconfig-dir=/var/kubeconfigs \
            --kubeconfig-suffix=config \
            --ephemeralClusterProvisionerOptions.privilegedTenants=testplatform-ci-tenant
        imagePullPolicy: Always
        ports:
        - name: metrics
          containerPort: 8080
        volumeMounts:
        - name: kubeconfigs
          mountPath: /var/kubeconfigs
        - name: release
          mountPath: /var/repo
        resources:
          requests:
            memory: "2Gi"
          limits:
            memory: "6Gi"
      serviceAccountName: dptp-controller-manager
      volumes:
      - name: kubeconfigs
        secret:
          secretName: dptp-controller-manager
      - name: release
        emptyDir: {}