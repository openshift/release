# Set `--enable-secret-rotation=false` to prevent secret leaks.
# Prune=false: this app prunes, and the operator is Unmanaged, so dropping this
# file would delete the DaemonSet with nothing left to recreate it.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: secrets-store-csi-driver-node
  namespace: openshift-cluster-csi-drivers
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Validate=false,Prune=false
    argocd.argoproj.io/sync-wave: "1"
spec:
  template:
    spec:
      containers:
        - name: csi-driver
          args:
            - "--endpoint=$(CSI_ENDPOINT)"
            - "--logtostderr"
            - "--v=2"
            - "--nodeid=$(KUBE_NODE_NAME)"
            - "--provider-volume=/var/run/secrets-store-csi-providers"
            - "--additional-provider-volume-paths=/etc/kubernetes/secrets-store-csi-providers"
            - "--metrics-addr=:8095"
            - "--enable-secret-rotation=false"
            - "--rotation-poll-interval=2m"
            - "--provider-health-check=false"
            - "--provider-health-check-interval=2m"
