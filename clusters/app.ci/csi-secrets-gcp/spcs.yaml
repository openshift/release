apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  labels:
    ci.openshift.io/gitops-managed: 'true'
  name: gsm-secrets-reconciler
  namespace: ci
spec:
  provider: gcp
  parameters:
    auth: provider-adc
    secrets: |-
      - resourceName: "projects/openshift-ci-secrets/secrets/test-platform-infra__test-credentials__gsm-secrets-reconciler-sa-key/versions/latest"
        fileName: "key.json"
