kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  namespace: ci
  name: gcp-hcp-pull-secret-rotator
spec:
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 2
  output:
    pushSecret:
      name: registry-push-credentials-ci-images-mirror
    to:
      kind: DockerImage
      name: quay.io/openshift/ci:ci_gcp-hcp-pull-secret-rotator_latest
  source:
    dockerfile: |
      FROM quay-proxy.ci.openshift.org/openshift/ci:ocp_4.18_cli
      # Install gcloud CLI
      RUN curl -fsSL https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-489.0.0-linux-x86_64.tar.gz \
          | tar -xz -C /opt \
          && /opt/google-cloud-sdk/install.sh --quiet --usage-reporting=false \
          && ln -s /opt/google-cloud-sdk/bin/gcloud /usr/local/bin/gcloud
      # Install jq
      RUN curl -fsSL -o /usr/local/bin/jq \
          https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 \
          && chmod +x /usr/local/bin/jq
      USER 65532
      ENTRYPOINT ["/bin/bash"]
    type: Dockerfile
  strategy:
    dockerStrategy:
      imageOptimizationPolicy: SkipLayers
    type: Docker
  triggers:
  - type: ConfigChange
