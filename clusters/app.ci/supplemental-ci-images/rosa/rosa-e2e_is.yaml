kind: ImageStream
apiVersion: image.openshift.io/v1
metadata:
  name: rosa-e2e
  namespace: ci
spec:
  lookupPolicy:
    local: false
  tags:
    - annotations: null
      from:
        kind: DockerImage
        name: quay.io/redhat-user-workloads/rosa-tenant/rosa-e2e-main/rosa-e2e-main:latest
      importPolicy:
        scheduled: true
      name: latest
      referencePolicy:
        type: Source
