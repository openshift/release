apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: deck
  namespace: ci
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: deck-history-bucket
  namespace: ci
spec:
  completionDeadlineSeconds: 7200
  failedBuildsHistoryLimit: 3
  successfulBuildsHistoryLimit: 2
  runPolicy: Serial
  resources:
    requests:
      cpu: "2"
      memory: 6Gi
    limits:
      memory: 10Gi
  output:
    to:
      kind: ImageStreamTag
      name: deck:history-bucket
  source:
    type: Dockerfile
    dockerfile: |
      FROM docker.io/library/golang:1.26-bookworm AS golang
      FROM docker.io/library/node:20-bookworm-slim AS build
      COPY --from=golang /usr/local/go /usr/local/go
      ENV PATH=/usr/local/go/bin:${PATH} \
          CGO_ENABLED=0 \
          GOMAXPROCS=2 \
          GOFLAGS=-p=2 \
          GOTOOLCHAIN=auto \
          FORCE_HOST_GO=true \
          NO_DOCKER=true
      RUN apt-get update \
          && apt-get install -y --no-install-recommends ca-certificates git rsync \
          && rm -rf /var/lib/apt/lists/*
      WORKDIR /src/prow
      ARG PATCH_COMMIT=d1d5cbef5ed31a1b6ef80c9faf7bfbc1b7c155ef
      RUN git clone --branch main --single-branch https://github.com/kubernetes-sigs/prow.git . \
          && git fetch origin "${PATCH_COMMIT}" \
          && git rev-parse HEAD > /tmp/upstream-sha \
          && git show --format= --binary "${PATCH_COMMIT}" > /tmp/deck.patch \
          && if git merge-base --is-ancestor "${PATCH_COMMIT}" HEAD; then \
              echo "Patch commit is already in upstream main"; \
            elif git apply --reverse --check /tmp/deck.patch 2>/dev/null; then \
              echo "Patch is already applied in upstream main"; \
            else \
              git -c user.name='OpenShift CI' -c user.email=ci@openshift.org \
                  cherry-pick --no-gpg-sign "${PATCH_COMMIT}"; \
            fi
      RUN go test ./cmd/deck
      RUN cmd/deck/gather-static.sh
      RUN version="$(date -u +v%Y%m%d)-$(cat /tmp/upstream-sha)-history-${PATCH_COMMIT}" \
          && go build -trimpath \
              -ldflags="-s -w -X sigs.k8s.io/prow/pkg/version.Name=deck -X sigs.k8s.io/prow/pkg/version.Version=${version}" \
              -o /out/deck ./cmd/deck

      # Match the runtime base used for Deck in upstream .ko.yaml. It includes
      # git and the Kubernetes authentication helpers used by Deck.
      FROM gcr.io/k8s-staging-test-infra/git-custom-k8s-auth:v20260512-1f34ef0df3
      COPY --from=build /out/deck /ko-app/deck
      COPY --from=build /src/prow/cmd/deck/kodata /var/run/ko
      ENV KO_DATA_PATH=/var/run/ko
      ENTRYPOINT ["/ko-app/deck"]
      CMD []
  strategy:
    type: Docker
    dockerStrategy:
      forcePull: true
      noCache: true
  triggers:
  - type: ConfigChange
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trigger-deck-history-bucket-build
  namespace: ci
spec:
  schedule: "0 3 * * 1"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7500
      template:
        spec:
          serviceAccountName: deck-build-trigger
          restartPolicy: Never
          containers:
          - name: trigger
            image: registry.ci.openshift.org/ocp/4.22:cli
            command:
            - oc
            args:
            - --namespace=ci
            - start-build
            - deck-history-bucket
            - --follow
            - --wait
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
