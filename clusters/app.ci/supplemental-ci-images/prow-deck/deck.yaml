apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: deck-history-bucket
  namespace: ci
spec:
  completionDeadlineSeconds: 7200
  failedBuildsHistoryLimit: 3
  successfulBuildsHistoryLimit: 2
  runPolicy: Serial
  resources:
    requests:
      cpu: "2"
      memory: 6Gi
    limits:
      memory: 10Gi
  output:
    to:
      kind: ImageStreamTag
      name: deck:history-bucket
  source:
    type: Dockerfile
    dockerfile: |
      FROM registry.ci.openshift.org/ci/deck:upstream AS upstream
      FROM registry.ci.openshift.org/openshift/release:rhel-9-release-golang-1.26-openshift-4.22 AS build
      USER 0
      ENV CGO_ENABLED=0 \
          GOMAXPROCS=2 \
          GOFLAGS="-p=2 -trimpath" \
          GOTOOLCHAIN=auto
      COPY --from=upstream /ko-app/deck /tmp/upstream-deck
      WORKDIR /src/prow
      ARG PATCH_COMMIT=d1d5cbef5ed31a1b6ef80c9faf7bfbc1b7c155ef
      RUN upstream_commit="$(go version -m /tmp/upstream-deck | sed -n 's/^[[:space:]]*build[[:space:]]*vcs.revision=//p')" \
          && printf '%s\n' "${upstream_commit}" | grep -Eq '^[0-9a-f]{40}$' \
          && git clone --branch main --single-branch https://github.com/kubernetes-sigs/prow.git . \
          && git fetch origin "${upstream_commit}" "${PATCH_COMMIT}" \
          && git checkout --detach "${upstream_commit}" \
          && git rev-parse HEAD > /tmp/upstream-sha \
          && git show --format= --binary "${PATCH_COMMIT}" > /tmp/deck.patch \
          && if git merge-base --is-ancestor "${PATCH_COMMIT}" HEAD; then \
              echo "Patch commit is already in upstream main"; \
            elif git apply --reverse --check /tmp/deck.patch 2>/dev/null; then \
              echo "Patch is already applied in upstream main"; \
            else \
              git -c user.name='OpenShift CI' -c user.email=ci@openshift.org \
                  cherry-pick --no-gpg-sign "${PATCH_COMMIT}"; \
            fi
      RUN go test ./cmd/deck
      RUN version="$(date -u +v%Y%m%d)-$(cat /tmp/upstream-sha)-history-${PATCH_COMMIT}" \
          && go build \
              -ldflags="-s -w -X sigs.k8s.io/prow/pkg/version.Name=deck -X sigs.k8s.io/prow/pkg/version.Version=${version}" \
              -o /out/deck ./cmd/deck

      # Reuse this same upstream image's frontend assets, templates, lenses,
      # git and Kubernetes authentication helpers. The patch only changes Go.
      FROM upstream
      COPY --from=build /out/deck /ko-app/deck
      ENTRYPOINT ["/ko-app/deck"]
      CMD []
  strategy:
    type: Docker
    dockerStrategy:
      forcePull: true
      noCache: true
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trigger-deck-history-bucket-build
  namespace: ci
spec:
  schedule: "0 3 * * 1"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 7500
      template:
        spec:
          serviceAccountName: deck-build-trigger
          restartPolicy: Never
          containers:
          - name: trigger
            image: registry.ci.openshift.org/ocp/4.22:cli
            command:
            - oc
            args:
            - --namespace=ci
            - start-build
            - deck-history-bucket
            - --follow
            - --wait
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 256Mi
