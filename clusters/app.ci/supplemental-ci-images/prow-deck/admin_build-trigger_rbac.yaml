apiVersion: v1
kind: ServiceAccount
metadata:
  name: deck-build-trigger
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deck-build-trigger
  namespace: ci
rules:
- apiGroups:
  - build.openshift.io
  resources:
  - buildconfigs
  resourceNames:
  - deck-history-bucket
  verbs:
  - get
- apiGroups:
  - build.openshift.io
  resources:
  - buildconfigs/instantiate
  resourceNames:
  - deck-history-bucket
  verbs:
  - create
- apiGroups:
  - build.openshift.io
  resources:
  - builds
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - build.openshift.io
  resources:
  - builds/log
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deck-build-trigger
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deck-build-trigger
subjects:
- kind: ServiceAccount
  name: deck-build-trigger
  namespace: ci
