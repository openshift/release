apiVersion: image.openshift.io/v1
kind: ImageStreamTag
metadata:
  name: deck:upstream
  namespace: ci
tag:
  name: upstream
  from:
    kind: DockerImage
    name: us-docker.pkg.dev/k8s-infra-prow/images/deck:latest
  importPolicy:
    importMode: PreserveOriginal
    scheduled: true
  referencePolicy:
    type: Local
