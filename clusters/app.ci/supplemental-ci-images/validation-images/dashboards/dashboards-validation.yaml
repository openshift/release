kind: BuildConfig
apiVersion: build.openshift.io/v1
metadata:
  namespace: ci
  name: dashboards-validation
spec:
  successfulBuildsHistoryLimit: 1
  failedBuildsHistoryLimit: 2
  output:
    pushSecret:
      name: registry-push-credentials-ci-images-mirror
    to:
      kind: DockerImage
      name: quay.io/openshift/ci:ci_dashboards-validation_latest
  source:
    dockerfile: |
      FROM quay-proxy.ci.openshift.org/openshift/ci:openshift_release_rhel-9-release-golang-1.26-openshift-5.0 AS go-builder
      RUN GOFLAGS="" go install github.com/google/go-jsonnet/cmd/jsonnet@v0.22.0 && \
            GOFLAGS="" go install -a github.com/jsonnet-bundler/jsonnet-bundler/cmd/jb@v0.6.0 && \
            GOFLAGS="" go install github.com/brancz/gojsontoyaml@v0.1.0

      FROM quay.io/centos/centos:stream10
      RUN dnf install -y git make && dnf clean all && rm -rf /var/cache/dnf
      COPY --from=go-builder /go/bin/jsonnet /usr/bin/jsonnet
      COPY --from=go-builder /go/bin/jb /usr/bin/jb
      COPY --from=go-builder /go/bin/gojsontoyaml /usr/bin/gojsontoyaml
    type: Dockerfile
  strategy:
    dockerStrategy: {}
    type: Docker
  triggers:
  - type: ConfigChange
