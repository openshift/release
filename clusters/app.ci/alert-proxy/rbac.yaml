apiVersion: v1
kind: ServiceAccount
metadata:
  name: alert-proxy
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alert-proxy-state
  namespace: ci
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - alert-proxy-state
  verbs:
  - get
  - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alert-proxy-state
  namespace: ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alert-proxy-state
subjects:
- kind: ServiceAccount
  name: alert-proxy
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alert-proxy-group-reader
rules:
- apiGroups:
  - user.openshift.io
  resourceNames:
  - test-platform-ci-admins
  resources:
  - groups
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alert-proxy-group-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alert-proxy-group-reader
subjects:
- kind: ServiceAccount
  name: alert-proxy
  namespace: ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alert-proxy-alertmanager-edit
  namespace: openshift-user-workload-monitoring
rules:
- apiGroups:
  - monitoring.coreos.com
  resourceNames:
  - user-workload
  resources:
  - alertmanagers/api
  verbs:
  - get
  - list
  - create
  - update
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alert-proxy-alertmanager-edit
  namespace: openshift-user-workload-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alert-proxy-alertmanager-edit
subjects:
- kind: ServiceAccount
  name: alert-proxy
  namespace: ci
