apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-proxy-config
  namespace: ci
data:
  silence.yaml: |
    silence:
      default: 24h
      minDuration: 2h
      maxDuration: 168h
      presets:
      - label: 2 hours
        group: short
        duration: 2h
      - label: 4 hours
        group: short
        duration: 4h
      - label: 8 hours
        group: rest-of-day
        duration: 8h
      - label: 12 hours
        group: rest-of-day
        duration: 12h
      - label: 1 day
        group: multi-day
        duration: 24h
        default: true
      - label: 2 days
        group: multi-day
        duration: 48h
      - label: 7 days
        group: multi-day
        duration: 168h
      - label: Until Monday 08:00 UTC
        group: weekend
        untilWeekday: monday
        at: "08:00"
        offeredFrom: thursday
    safety:
      neverSilenceable:
      - alertname: "~.*-Down$"
      - alertname: "~^alert-proxy-.*$"
      silence:
        requiredExactLabels:
        - alertname
        requireOneExactLabelFrom:
        - job_name
        - namespace
        requireNonEmptyExactValues: true
        allowedUserOperators:
        - "="
        minCurrentlyMatchedAlerts: 1
        maxCurrentlyMatchedAlerts: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-proxy-slack-identities
  namespace: ci
data:
  slack-identities.yaml: |
    kerberosSlackIDOverrides: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-proxy-alertmanager-ca
  namespace: ci
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
