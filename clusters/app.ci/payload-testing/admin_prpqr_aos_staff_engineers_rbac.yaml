# Grants aos-staff-engineers permission to create PullRequestPayloadQualificationRuns
# for openshift-priv / embargoed payload testing (DPTP-5258).
# Join path: request membership in the aos-staff-engineers Rover group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: payload-testing-aos-staff-engineers
rules:
- apiGroups:
  - ci.openshift.io
  resources:
  - pullrequestpayloadqualificationruns
  verbs:
  - get
  - create
  - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: payload-testing-aos-staff-engineers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: payload-testing-aos-staff-engineers
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: Group
  name: aos-staff-engineers
