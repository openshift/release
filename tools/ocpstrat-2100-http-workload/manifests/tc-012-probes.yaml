apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-workload-probes
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ocpstrat-2100-http-workload
    verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ocpstrat-2100-http-workload
      app.kubernetes.io/component: probe
      verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocpstrat-2100-http-workload
        app.kubernetes.io/component: probe
        verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      nodeSelector:
        verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: ocpstrat-2100-http-workload
                app.kubernetes.io/component: probe
                verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
            topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: probe
        image: ${IMAGE}
        imagePullPolicy: IfNotPresent
        args:
        - probe
        - --url=http://http-workload:8080/identity
        - --interval=2s
        - --timeout=1s
        resources:
          requests:
            cpu: 10m
            memory: 24Mi
          limits:
            cpu: 100m
            memory: 48Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
