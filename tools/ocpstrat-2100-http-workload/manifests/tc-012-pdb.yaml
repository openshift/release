apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: http-workload
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ocpstrat-2100-http-workload
    verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
spec:
  minAvailable: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ocpstrat-2100-http-workload
      app.kubernetes.io/component: server
      verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
