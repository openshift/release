apiVersion: v1
kind: Service
metadata:
  name: http-workload
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ocpstrat-2100-http-workload
    verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ocpstrat-2100-http-workload
    app.kubernetes.io/component: server
    verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
