apiVersion: apps/v1
kind: Deployment
metadata:
  name: http-workload
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: ocpstrat-2100-http-workload
    verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
spec:
  replicas: ${REPLICAS}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ocpstrat-2100-http-workload
      app.kubernetes.io/component: server
      verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ocpstrat-2100-http-workload
        app.kubernetes.io/component: server
        verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      nodeSelector:
        verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeAffinityPolicy: Honor
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: ocpstrat-2100-http-workload
            app.kubernetes.io/component: server
            verification.hypershift.openshift.io/ocpstrat-2100-run: "${RUN_ID}"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: workload
        image: ${IMAGE}
        imagePullPolicy: IfNotPresent
        args: ["serve"]
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: RUN_ID
          value: "${RUN_ID}"
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 2
          failureThreshold: 1
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 10
          failureThreshold: 3
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
