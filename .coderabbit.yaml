inheritance: true
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary: true
  high_level_summary_instructions: |
    IMPORTANT: Always place the summary under a "## Summary by CodeRabbit" heading.
    Never blend the summary into the author's existing text. The summary must be
    clearly separated from any text the PR author wrote.

    This repository holds configuration for OpenShift CI infrastructure.
    Key areas:
    - CI configuration for component repositories
    - Generated Prow job definitions
    - Cluster manifests and Prow deployments
    - Downstream tooling

    When summarizing:
    - Explain what the PR changes in practical terms — which repo's CI or infrastructure is affected
    - Don't just list modified files or describe diffs mechanically
  path_filters:
    - "!ci-operator/jobs/**"
    - "!clusters/**/*_crd.yaml"
  path_instructions:
    # ── MPEX step-registry rules ──────────────────────────────────────
    - path: "ci-operator/step-registry/interop-tests/**"
      instructions: &mpex-step-registry-rules |
        This directory is owned by the MPEX (Multi-Product EXperience) team for layered
        product interop testing. Review changes against these MPEX best practices:

        ## OWNERS Files
        - OWNERS files are AUTO-GENERATED by the `autoowners` tool from upstream repos.
        - They must NOT be manually edited. Flag any PR that modifies OWNERS directly.
        - If ownership needs to change, it must be updated in the upstream source repository.

        ## Step Reference Files (*-ref.yaml)
        - MUST include a `documentation` field with a clear description of what the test does.
        - MUST include `resources.requests` with at least `cpu` and `memory`.
        - MUST include `timeout` and `grace_period` fields.
        - All `env` entries SHOULD include a `documentation` field explaining their purpose.
        - The `as` field must follow a clear naming convention matching the directory path.
        - The `commands` field must reference a shell script in the same directory.
        - For steps that should not block the overall job on failure, set `best_effort: true`
          on the step ref. Note: for post steps, the workflow or job must also set
          `allow_best_effort_post_steps: true` for this to take effect.

        ## Shell Scripts (*-commands.sh)
        - MUST start with `set -euo pipefail` for strict error handling.
        - MUST propagate JUnit XML results to `${ARTIFACT_DIR}` (the primary destination for
          test artifacts). Some existing scripts also copy results to `${SHARED_DIR}` for
          inter-step data passing (e.g., data router reporter), but `${ARTIFACT_DIR}` is
          where Prow collects and publishes them.
        - MUST scrub credentials/secrets from any logs or artifacts before copying to `${ARTIFACT_DIR}`.
        - SHOULD use proper cleanup traps (`trap '...' EXIT`).
        - SHOULD implement the trace-to-file pattern for debugging (xtrace to file, dump on failure only).
        - When `MAP_TESTS=true`, SHOULD use ExitTrap--PostProcessPrep for test name mapping
          to Component Readiness dashboards.
        - Do NOT hardcode OCP versions; derive them from the cluster (e.g., `oc get clusterversion`).

        ## Test Naming and Component Readiness
        - Test names MUST be stable across runs — renaming loses Sippy historical data.
        - Tests SHOULD include annotations like `[sig-XYZ]` for SIG ownership.
        - Tests SHOULD include `[Jira:Component]` tags for Component Readiness dashboard mapping.
        - Tests must be mapped to a Jira component in `openshift-eng/ci-test-mapping` for
          dashboard visibility.
        - Do NOT include dynamic content (pod UIDs, timestamps) in test names.

        ## Test Reliability and Lifecycle
        - Tests MUST produce deterministic Pass/Fail results with a target of ≥99% pass rate.
        - Tests should run against the stable, released version of the layered product to
          isolate OCP-caused regressions from product development changes.
        - New test suites SHOULD start as informing (non-blocking), then promote to blocking
          after demonstrating stability.
        - Prefer Prow CI for all new interop test setups.

    # ── MPEX ci-operator config rules ─────────────────────────────────
    - path: "ci-operator/config/RedHatQE/interop-testing/**"
      instructions: &mpex-ci-config-rules |
        This directory contains ci-operator configuration for an MPEX (Multi-Product
        EXperience) layered product test repository. Review against these conventions:

        ## OWNERS Files
        - OWNERS files are AUTO-GENERATED by `autoowners` from the upstream repository.
        - They must NOT be manually edited. Changes must be made upstream.

        ## ci-operator Config Files (*.yaml)
        - Config files define test images, test steps, and workflow references.
        - Each test entry should reference a well-defined workflow from the step registry.
        - Verify that referenced images and tags exist and are maintained.
        - Test names in the config should match the convention used by the step registry refs.
        - Ensure `zz_generated_metadata` is correct and consistent with the directory path.

        ## General MPEX Conventions
        - Tests should run against the stable, released version of the layered product
          to isolate OCP-caused regressions from product development changes.
        - New test configurations should start as informing (periodic), not blocking (presubmit).
        - Test names must be stable across runs for Sippy historical data preservation.
        - Tests must be mapped to a Jira component in `openshift-eng/ci-test-mapping` for
          Component Readiness dashboard visibility.

    - path: "ci-operator/config/RedHatQE/firewatch/**"
      instructions: *mpex-ci-config-rules

    # ── MPEX Prow config rules ────────────────────────────────────────
    - path: "core-services/prow/02_config/RedHatQE/interop-testing/**"
      instructions: &mpex-prow-config-rules |
        This directory contains Prow configuration for an MPEX (Multi-Product EXperience)
        test repository. Review against these conventions:

        ## OWNERS Files
        - OWNERS files are AUTO-GENERATED by `autoowners` from the upstream repository.
        - They must NOT be manually edited. Changes must be made upstream.

        ## Prow Config
        - Prow plugin and tide configuration should be consistent with the ci-operator
          config and step registry definitions for the same repository.
        - Verify branch protection and merge criteria are appropriate for interop test repos.

    - path: "core-services/prow/02_config/RedHatQE/firewatch/**"
      instructions: *mpex-prow-config-rules
