inheritance: true
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  high_level_summary: true
  high_level_summary_instructions: |
    IMPORTANT: Always place the summary under a "## Summary by CodeRabbit" heading.
    Never blend the summary into the author's existing text. The summary must be
    clearly separated from any text the PR author wrote.

    This repository holds configuration for OpenShift CI infrastructure.
    Key areas:
    - CI configuration for component repositories
    - Generated Prow job definitions
    - Cluster manifests and Prow deployments
    - Downstream tooling

    When summarizing:
    - Explain what the PR changes in practical terms — which repo's CI or infrastructure is affected
    - Don't just list modified files or describe diffs mechanically
  path_filters:
    - "!ci-operator/jobs/**"
    - "!clusters/**/*_crd.yaml"
  path_instructions:
    - path: "ci-operator/step-registry/interop-tests/**"
      instructions: |
        This directory contains MPEX (Multi-Product EXperience) interop test
        definitions for layered product testing on OpenShift. Apply the
        following best practices when reviewing changes here.

        ## OWNERS Files
        - OWNERS files in this directory are AUTO-GENERATED by the `autoowners`
          tool from upstream repositories (e.g., RedHatQE/interop-testing).
        - They must NOT be manually edited. Changes must be made in the
          upstream source repository and propagated by the automation.
        - Flag any PR that directly modifies an OWNERS file under this path.

        ## Step Reference Files (*-ref.yaml)
        - MUST include a `documentation` field with a clear, human-readable
          description of what the step does.
        - MUST include `resources.requests` with at least `cpu` and `memory`
          specified.
        - MUST include `timeout` and `grace_period` fields to prevent
          unbounded execution.
        - All `env` entries SHOULD include a `documentation` field explaining
          the variable's purpose and expected values.
        - The `as` field must follow the naming convention:
          `interop-tests-<component>[-<variant>]`.
        - The `commands` field must reference a shell script in the same
          directory following the pattern:
          `interop-tests-<component>[-<variant>]-commands.sh`.
        - Consider setting `best_effort: true` for tests that should not
          block payload acceptance.

        ## Shell Scripts (*-commands.sh)
        - MUST start with `set -euo pipefail` to fail fast on errors.
        - MUST propagate JUnit XML results to `${SHARED_DIR}/junit` or
          `${ARTIFACT_DIR}` so CI can ingest test outcomes.
        - MUST scrub credentials and secrets from logs and artifacts before
          copying files to `${ARTIFACT_DIR}`.
        - SHOULD use proper cleanup traps (`trap '...' EXIT`) to ensure
          resources are released on failure.
        - SHOULD implement a trace-to-file pattern
          (`exec > >(tee ...) 2>&1`) for debugging.
        - When `MAP_TESTS=true`, SHOULD use ExitTrap--PostProcessPrep for
          test name mapping so Sippy can track results consistently.
        - Do NOT hardcode OCP versions; derive the version from the running
          cluster (e.g., `oc get clusterversion`).

        ## General MPEX Interop Conventions
        - Tests should run against the stable, released version of the
          layered product, not a development build.
        - Test names must be stable across runs to enable Sippy historical
          data tracking and regression detection.
        - New test suites should start as informing (non-blocking) until
          they have proven stability.
        - Prefer Prow CI for all new interop test setups over external CI
          systems.
