            - cluster: build06
              name: build06
            - cluster: build07
              name: build07
            - cluster: build08
              name: build08
            - cluster: build09
              name: build09
            - cluster: build10
              name: build10
            - cluster: build11
              name: build11
            - cluster: build12
              name: build12
            - cluster: build13
              name: build13
        - git:
