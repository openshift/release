applicationsets:
- filename: appset-cluster-appci.yaml
  name: appset-cluster-app-ci
  spec:
    goTemplate: true
    goTemplateOptions:
    - missingkey=error
    generators:
    - git:
        directories:
        - path: clusters/app.ci/*
        repoURL: https://github.com/openshift/release.git
        revision: main
    template:
      metadata:
        name: app-cluster-app.ci-{{.path.basename}}
        namespace: openshift-gitops
      spec:
        destination:
          name: app.ci
          namespace: openshift-gitops
        project: app-ci
        source:
          directory:
            exclude: '{OWNERS,*.md}'
            include: '{*.yaml,*.yml}'
            recurse: true
          path: '{{.path.path}}'
          repoURL: https://github.com/openshift/release.git
          targetRevision: main
        syncPolicy:
          automated:
            enabled: true
            prune: true
            selfHeal: true
          syncOptions:
          - CreateNamespace=true
          - PruneLast=true
          - ServerSideApply=true
    templatePatch: |
      {{- if eq .path.basename "supplemental-ci-images" }}
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: ServerSideDiff=false
      spec:
        syncPolicy:
          syncOptions:
            - CreateNamespace=true
            - PruneLast=true
      {{- end }}
- filename: appset-cluster-build-coredns.yaml
  name: appset-cluster-build-coredns
  spec:
    goTemplate: true
    goTemplateOptions:
    - missingkey=error
    generators:
