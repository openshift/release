# promtool unit tests for TriggeredButPendingJobs.
# Regression guard for the subtract-before-aggregate bug: the expr now
# aggregates each state before subtracting, so a job with many triggered and
# few pending transitions actually produces a firing alert (the old expr's
# per-series `state` mismatch yielded no series and never fired).
rule_files:
  - .rendered-rules.yaml
tests:
  - interval: 1m
    input_series:
      - series: 'prowjob_state_transitions{state="triggered", job_name="periodic-x", job="prow-controller-manager"}'
        values: "0+5x40"
      - series: 'prowjob_state_transitions{state="pending", job_name="periodic-x", job="prow-controller-manager"}'
        values: "0x40"
    alert_rule_test:
      # triggered climbs ~5/min, pending flat -> diff well above both thresholds;
      # for:10m -> firing. (If this never fired, the subtraction bug regressed.)
      - eval_time: 30m
        alertname: TriggeredButPendingJobs
        exp_alerts:
          - exp_labels:
              severity: critical
              job_name: periodic-x
            exp_annotations:
              ops_category: ci_platform
              ops_color: orange
              message: 'There are 75 jobs that have been triggered but are still pending, indicating potential scheduling or resource constraints. Investigate pending Prow jobs. Check <https://console-openshift-console.apps.ci.l2s4.p1.openshiftapps.com/monitoring/alertrules?alerting-rule-name=TriggeredButPendingJobs|Prometheus>.'
